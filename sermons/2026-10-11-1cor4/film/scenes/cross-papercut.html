<!doctype html>
<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잘라 낸 건 다리였다 · ⑥ 붉은 전지 오림</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">

<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script><script src="kit-papercut.js"></script>
<script>
/* 잘라 낸 건 다리였다 — ⑥ 붉은 전지 오림 (red paper-cut, folk window-flower grammar).
   Every thing is a piece of red paper cut with scissors and laid on a dark indigo backing: no outlines, no gradients;
   detail is what was cut away (inset slits, sawtooth rows, crescents, diamond lace). The whole world is red — so MY cross
   is the one piece cut from a different paper (cream-gold). The others' crosses are red like the world.
   The medium carries the turn: sawing IS cutting — each cut snips a gold piece off the foot, with paper flecks, and the
   piece lies on the road as a cut-out. The chasm is a cut-away of the road sheet (the backing shows); the gate's light is
   the backing lit from behind, showing through a cut lattice. At the end the scraps come back ("scraps have a future"):
   they fly to the chasm and fill a dashed scissor-guide outline — together with what I kept, exactly a bridge.
   Figures are jointed cut-outs (head, torso, skirt, 2×arm, 2×leg pinned at rivets), posed on 12 fps steps; camera moves on ones.
   The medium (paper pieces, sprites, sheets, the jointed figure rig, light, flecks, captions, the curtain) is styles/papercut →
   kit-papercut.js; this file keeps the story: the road and chasm layout, the timelines, the saw, the camera. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const PC = Papercut, C = PC.C;
const { shade, t12, frac, pathOf, paper, capsule, holes, diamond, crescentPts, drawCross, drawSheet, drawFig, frame, shoulderOf, walkSpec, standSpec, hangHands, mixSpec, cpt, mixX, rotAbout, hangGrip, rIdx, lIdx, mixCam, layer } = PC;
const L = 520, PW = 34, CBX = L - 130, CBW = 32, CBH = 118, CBHL = 50;   // cross: post length, width; crossbar (from foot), thickness, half-length upright / lying
const FY = 1300, BY = 1252, RT = 1212;                                    // front lane (me), back lane (the others), road's far edge
const REST = 26, G = L - 2 * REST;                                        // a full cross rests 26 px on each lip: the chasm is G wide
const TX = {};
const carryCross = (F, left, a0) => PC.carry(F, PC.CROSS, left, a0), gripCarry = (F, X) => PC.gripCarry(F, X, L);   // PC.CROSS = this film's cross (L 520, PW 34, …)

// ---------------- background sheets (built once E — the chasm's near lip — is known) ----------------
let E = 1600, GX = 0, GAY = 0, ROADX0 = -1500, ROADX1 = 0;
function buildSheets() {
  ROADX1 = E + G + 1500;
  TX.cloud = PC.clouds(-900, 260, 1500, 760);                  // sky layer, parallax .15
  TX.mt = PC.mountains(-1000, 600, 1700, 1260);                // far mountains, parallax .35
  TX.hill = PC.hills(-1100, 900, 2500, 1290);                  // mid hills with bare trees, parallax .65
  TX.road = PC.road(ROADX0, ROADX1, RT, 2300, { gap: [E, E + G] });   // the road sheet with the chasm cut out of it
  TX.chasm = PC.chasm(E, E + G, RT, 2300);                     // inside the chasm (behind the road sheet)
  GX = E + G + 380; GAY = BY + 4 - 330;
  TX.gate = PC.gate(GX, BY, RT - 520);                         // the gate on the far side, lattice doors ajar
}

// ---------------- timeline: my path (integrated once), the cuts ----------------
const SME = 1.04, SPI = .95;                    // me (nearest) a touch larger than the others
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 44 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1));        // staggering
  if (t < 4.6) return 0;
  if (t < 5.0) return 370 * eio((t - 4.6) / .4);                            // lighter: big quick strides
  if (t < 8.3) return 370;
  if (t < 8.6) return lerp(370, 150, (t - 8.3) / .3);
  if (t < 9.0) return 150 * (1 - ss(8.6, 9.0, t));
  if (t < 10.0) return 0;
  if (t < 10.4) return 450 * Math.sin(Math.PI * (t - 10) / .4);
  if (t < 11.35) return 0;
  if (t < 12.0) return 640 * Math.sin(Math.PI * (t - 11.35) / .65);
  return 0;
}
const strideMe = t => t < 4.6 ? 116 : t < 8.8 ? 270 : 170;
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };
const meX = t => tab(MEX, t), meP = t => tab(MEP, t);
const CUTS = [{ s: 3.2, d: .3, saw0: 3.5, drop: 4.0, up1: 4.4 }, { s: 9.0, d: .2, saw0: 9.2, drop: 9.8, up1: 10.0 }, { s: 10.4, d: .15, saw0: 10.55, drop: 11.2, up1: 11.35 }];
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const FILL = [[22.2, 23.3], [22.65, 23.7], [23.1, 24.1]];   // each piece's flight into the gap (within beat.fill)
const FLECKS = [];
let SAWLIE = null;   // where I leave the saw after the last cut
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }
  E = meX(12) + 52;
  CUTS.forEach((c, k) => {
    c.k = k; c.mx = meX(c.s); c.cutX = c.mx - 205 * SME; c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.baseX = c.cutX - c.u1; c.y = FY + 26;
    const r = rng(100 + k);
    for (let n = 0; n < 18; n++) FLECKS.push({ t0: n < 12 ? lerp(c.saw0, c.drop, n / 12) : c.drop + r() * .05, x: c.cutX + (r() - .5) * 8, y: c.y - PW / 2,
      vx: (r() - .5) * (n < 12 ? 180 : 320), vy: -(80 + r() * (n < 12 ? 160 : 260)), land: FY + 18 + r() * 44, r0: r() * TAU, vr: (r() - .5) * 20, sz: 4 + r() * 5, col: C.gold });
  });
  const c3 = CUTS[2]; SAWLIE = { grip: [c3.cutX + 150, FY + 52], ang: Math.PI + .05 };
  const r = rng(200);   // flecks off the lip as my cross goes over
  for (let n = 0; n < 16; n++) FLECKS.push({ t0: B.fall + r() * .1, x: E + 6 + r() * 30, y: FY + 30, vx: (r() - .2) * 260, vy: -(60 + r() * 220), land: 2600, r0: r() * TAU, vr: (r() - .5) * 24, sz: 4 + r() * 6, col: n % 3 ? C.gold : C.gate });
}
function pieceAt(c, t) {   // a cut piece lying where it fell (shifted a little as it came off), or flying into the gap at the end
  const sh = 18 * eo((t - c.drop) / .25), y0 = c.y, cu = (c.u0 + c.u1) / 2;
  let cx = c.baseX + cu - sh, cy = y0, a = -.05 * eo((t - c.drop) / .25);
  const [f0, f1] = FILL[c.k];
  if (t > f0) { const u = clamp((t - f0) / (f1 - f0)), e = eio(u), tx = E - REST + cu, ty = FY + 34;
    cx = lerp(cx, tx, e); cy = lerp(cy, ty, e) - (c.k ? 190 : 280) * Math.sin(Math.PI * u); a = lerp(a, 0, e) + Math.sin(u * Math.PI * 3) * .55 * (1 - u); }
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a };
}

// ---------------- the saw (always in my right hand until I leave it on the road after the last cut) ----------------
const CUT_ANG = Math.PI - .72, hangAng = f => Math.atan2(.95, .3 * f);
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];
  return { d, up, heel: [grip[0] - up[0] * 14 + d[0] * 20, grip[1] - up[1] * 14 + d[1] * 20] }; }
function sawState(c, t) {   // the cutting stroke: the teeth pass through the kerf, the blade moves along its own length
  const kp = clamp((t - c.saw0) / (c.drop - .06 - c.saw0)), saw = t >= c.saw0 - .05 && t < c.drop + .02;
  const osc = saw ? 24 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, g0 = sawGeo([0, 0], CUT_ANG), d = g0.d, up = g0.up;
  const K = [c.cutX, c.y - PW / 2 + kp * PW * .92], heel = [K[0] - d[0] * (96 - osc), K[1] - d[1] * (96 - osc)];
  return { kp, grip: [heel[0] + up[0] * 14 - d[0] * 20, heel[1] + up[1] * 14 - d[1] * 20], K };
}
function drawSaw(ctx, grip, ang) {
  const { d, up, heel } = sawGeo(grip, ang);
  const P = (u, v) => [heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v];
  const blade = [P(0, 30), P(172, 18)]; for (let u = 172; u >= 0; u -= 9) blade.push(P(u, (u / 9 | 0) % 2 ? 3 : -3));
  paper(ctx, pathOf(blade), C.saw, { sh: .7 });
  holes(ctx, [crescentPts(...P(150, 13), 6, 0, Math.PI, 2.2, 8)]);
  paper(ctx, pathOf([P(-4, 36), P(-38, 46), P(-52, 20), P(-40, -4), P(-6, 2)]), C.wood, { sh: .7 });
  holes(ctx, [[P(-14, 30), P(-34, 36), P(-42, 20), P(-34, 8), P(-14, 12)]]);   // the grip hole the fingers go through
}
function sawSpec(c, t) {
  const f = -1, mx = c.mx, s = SME, st = sawState(c, t);
  return { s, f, gy: FY, hip: [mx, FY - 84 * s], ang: f * 1.1, feet: [[mx + 74 * s, FY], [mx - 60 * s, FY]], hands: [st.grip, [c.cutX + 44 * s, c.y - PW / 2 - 3]],
    hand: ['fist', 'flat'], tilt: .32, eye: 'calm', sway: 0, farFront: true };
}

function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), left = leftAt(t);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const F = walkSpec(x, FY, SME, 1, ph, 116, .3 + .1 * Math.sin(tt * TAU / 1.15), 16); F.eye = 'strain'; F.tilt = .12; F.hip[1] += 6 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, -.5 + .07 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt); const F = walkSpec(x, FY, SME, 1, ph, lerp(116, 270, k), lerp(.16, .3, k), lerp(20, 62, k)); return [F, -.62]; }
    const F = walkSpec(x, FY, SME, 1, ph, 170, .16, 34); return [F, -.6];
  };
  const sawHeld = t < CUTS[2].drop;
  // carried: the far (left) hand holds the post ahead of my face; the near (right) hand carries the saw — or, once the saw is gone, the post too
  const carried = (F, a0, lf, held) => { const X = carryCross(F, lf, a0); gripCarry(F, X);
    if (held) { F.hands[0] = cpt(X, Math.min(L - 14, X.contact + 80)); F.hands[1] = hangGrip(F, F.ph != null ? 18 * Math.sin(TAU * F.ph) : 0); }
    return [F, X]; };
  for (const c of CUTS) {
    if (t >= c.s && t < c.up1) {
      const lf0 = S.left[c.k], lf1 = S.left[c.k + 1], [W0, a0] = walk(c.s, c.mx), [W1, a1] = walk(c.up1, c.mx), last = c.k === 2;
      const [WA, XA] = carried(W0, a0, lf0, true), [WB, XB] = carried(W1, a1, lf1, !last);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      if (t < c.s + c.d) { const k = eio((tp - c.s) / c.d), F = mixSpec(WA, SP, k);
        F.hands[rIdx(F)] = [lerp(WA.hands[1][0], cg[0], k), lerp(WA.hands[1][1], cg[1], k)];
        F.hands[lIdx(F)] = [lerp(WA.hands[0][0], SP.hands[1][0], k), lerp(WA.hands[0][1], SP.hands[1][1], k)];
        F.hand = F.f > 0 ? ['fist', 'fist'] : ['fist', 'flat'];
        return { F, X: mixX(XA, XL, k), c, saw: { grip: F.hands[rIdx(F)], ang: lerp(hangAng(1), CUT_ANG, k) } }; }
      if (t < c.drop) { const st = sawState(c, t); return { F: sawSpec(c, t), X: XL, c, kerf: st, saw: { grip: st.grip, ang: CUT_ANG } }; }
      const k = eio((tp - c.drop) / (c.up1 - c.drop)), F = mixSpec(SP, WB, k);
      const rT = WB.hands[1], lT = WB.hands[0];
      F.hands[rIdx(F)] = [lerp(cg[0], rT[0], k), lerp(cg[1], rT[1], k)]; F.hands[lIdx(F)] = [lerp(SP.hands[1][0], lT[0], k), lerp(SP.hands[1][1], lT[1], k)];
      F.hand = F.f > 0 ? ['fist', 'fist'] : ['fist', 'flat'];
      const saw = last ? null : { grip: F.hands[rIdx(F)], ang: lerp(CUT_ANG, hangAng(1), k) };
      return { F, X: mixX(XL, XB, k), c, saw };
    }
  }
  if (t < 12) { const [F, a] = walk(tp); const [G2, X] = carried(F, a, left, sawHeld); return { F: G2, X, saw: sawHeld ? { grip: G2.hands[1], ang: hangAng(1) } : null }; }
  // at the edge: stop, step aside for the others, come back
  if (t < 18.4) { const [F0] = walk(12, E - 52), k = eio((tp - 12) / .3);
    const bx = -150 * eio((tp - 12.9) / .7) + 150 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.85, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.65, 17.55, .12, .12));
    const STx = mv > 0 ? mixSpec(standSpec(E - 52 + bx, FY, SME, 1, .08), walkSpec(E - 52 + bx, FY, SME, 1, (E + bx) / 150, 150, .1, 24), mv) : standSpec(E - 52 + bx, FY, SME, 1, .08);
    const F = mixSpec(F0, STx, k);
    F.ang += .16 * Math.sin(Math.PI * clamp((tp - 12) / .5)) * (tp < 12.5 ? -1 : 0); F.eye = tp < 13.2 ? 'shock' : 'calm';
    const [G2, X] = carried(F, -.6, left, false); return { F: G2, X }; }
  const XLay = { x: E - REST - L * (1 - left), y: FY + 34, a: 0, u0: L * (1 - left), lie: true };
  const LAY = { ...standSpec(E - 52, FY, SME, 1), hip: [E - 60, FY - 140 * SME], ang: .7, feet: [[E - 98, FY], [E - 30, FY]], tilt: .25 };
  LAY.hands = [cpt(XLay, L * (1 - left) + 70), cpt(XLay, L * (1 - left) + 26)]; LAY.hand = ['flat', 'flat'];   // pressing the foot end down on the lip
  const REACH = { ...LAY, hip: [E - 66, FY - 160 * SME], ang: .46, hands: [[E - 160, FY - 120], [E + 70, FY - 20]], hand: ['fist', 'open'], eye: 'shock', tilt: .45 };
  if (t < B.tip) { if (t < 18.9) { const ST = standSpec(E - 52, FY, SME, 1, .08), STc = carried(ST, -.6, left, false), k = eio((tp - 18.4) / .4);
      const F = mixSpec(STc[0], LAY, k); F.hand = k > .5 ? ['flat', 'flat'] : ['fist', 'fist']; return { F, X: mixX(STc[1], XLay, eio((t - 18.4) / .4)), lay: true }; }
    return { F: LAY, X: XLay, lay: true }; }
  if (t < B.back) { const k = eio((tp - B.tip) / .25), F = mixSpec(LAY, REACH, k); F.hand = REACH.hand; if (tp > 20.6) F.eye = 'down'; return { F, X: null }; }
  const BACK = { ...standSpec(E - 52, FY, SME, -1, .04), tilt: .05, eye: 'calm' }, FWD = { ...standSpec(E - 52, FY, SME, 1, .1), tilt: .38, eye: 'down' };
  if (t < 23.0) return { F: mixSpec(REACH, BACK, eio((tp - B.back) / .3)), X: null };
  return { F: mixSpec(BACK, FWD, eio((tp - 23.0) / .3)), X: null };
}
// my cross once my hands slip: it tips over the lip, then falls into the dark
function fallX(t) {
  if (t < B.tip) return null;
  const left = S.left[3], u0 = L * (1 - left), pv = [E, FY + 34 + PW / 2];
  const X0 = { x: E - REST - u0, y: FY + 34, a: 0, u0, lie: true };
  if (t < B.fall) return rotAbout(X0, pv, .5 * Math.pow((t - B.tip) / (B.fall - B.tip), 2));
  const X1 = rotAbout(X0, pv, .5), u = t - B.fall, cu = (u0 + L) / 2, c0 = cpt(X1, cu);   // tumble about its own middle
  const cx = c0[0] + 90 * u, cy = c0[1] + 160 * u + 1500 * u * u, a = X1.a + 2.6 * u + 1.2 * u * u;
  return { ...X1, x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, alpha: 1 - ss(B.fall + .55, B.fall + 1.05, t), clip: true };
}

// ---------------- the others: lay it across → walk over → pull it back from the far side → shoulder it → into the light ----------------
const PIL = [{ x0: -470, ph: .3 }, { x0: -230, ph: .75 }, { x0: 190, ph: .1 }, { x0: 430, ph: .55 }];
const BRIDGE_Y = [BY - 6, BY + 4, BY + 14], PULL = 210;
function pilState(i, t) {
  const tp = t12(t), P = PIL[i], j = 3 - i, T = j < 3 ? B.bridges[j] : 99, yb = BRIDGE_Y[j] ?? BY;
  const xAt = tt => { if (tt <= 9 || j > 2) return P.x0 + 52 * tt; const xa = P.x0 + 468, xb = E - 300 - 130 * j, xc = E - 46;
    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, clamp((tt - 12) / (T - .35 - 12))); };
  const carry = (tt, x, gy = BY, stride = 118, lean = .27) => { const F = walkSpec(x, gy, SPI, 1, P.ph + x / (stride * SPI), stride, lean, 18); F.col = C.pil; F.tilt = .05; const X = carryCross(F, 1, -.5); gripCarry(F, X); return [F, X]; };
  if (j > 2) { if (t >= 12) return null; const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  if (t < T - .35) { const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  const XB = { x: E - REST, y: yb, a: 0, u0: 0, lie: true };
  const LAY = { ...standSpec(E - 46, BY, SPI, 1), hip: [E - 52, BY - 150 * SPI], ang: .6, feet: [[E - 88, BY], [E - 22, BY]], tilt: .2, col: C.pil };
  LAY.hands = [cpt(XB, 70), cpt(XB, 26)];
  if (t < T) { const [F0, X0] = carry(T - .35, E - 46), k = eio((tp - T + .35) / .35); return { F: { ...mixSpec(F0, LAY, k), col: C.pil }, X: mixX(X0, XB, eio((t - T + .35) / .35)) }; }
  const xs0 = E - 24, xs1 = E + G + 70;
  if (t < T + .3) { const F = mixSpec(LAY, standSpec(xs0, yb - PW / 2, SPI, 1, .1), eio((tp - T) / .25)); F.col = C.pil; return { F, B: XB }; }
  if (t < T + .9) { const x = lerp(xs0, xs1, eio(clamp((tp - T - .3) / .6))), gy = x < E + G + 4 ? yb - PW / 2 : BY;
    const F = walkSpec(x, gy, SPI, 1, P.ph + x / (170 * SPI), 170, .12, 30); F.col = C.pil; F.tilt = -.05; F.hands = hangHands(F, 26 * Math.sin(TAU * (P.ph + x / (170 * SPI)))); return { F, B: XB }; }
  // from the far side: turn, crouch, take the top end and pull it back across (pressing it down over the far lip as a lever)
  const pv = [E + G, yb + PW / 2], pullX = k => rotAbout({ ...XB, x: XB.x + PULL * k }, [pv[0], pv[1]], -.1 * k);
  const xpAt = k => xs1 + 10 + PULL * k;
  const PULLS = k => { const X = pullX(k), x = xpAt(k); const F = { ...standSpec(x, BY, SPI, -1), hip: [x + 8, BY - 128 * SPI], ang: -.55, feet: [[x + 30, BY], [x - 26, BY]], tilt: .1, col: C.pil };
    F.hands = [cpt(X, L - 44), cpt(X, L - 92)]; return [F, X]; };
  if (t < T + 1.25) { const k = eio(clamp((tp - T - .9) / .35)), [F, X] = PULLS(k);
    const k0 = eio((tp - T - .9) / .1); return { F: k0 < 1 ? { ...mixSpec(walkSpec(xs1, BY, SPI, 1, 0, 170, .1), F, k0), col: C.pil } : F, X }; }
  const [Fp, Xp] = PULLS(1), xg = xpAt(1);
  if (t < T + 1.5) { const k = eio((tp - T - 1.25) / .25), [Fc, Xc] = carry(T + 1.5, xg, BY, 150, .2); return { F: { ...mixSpec(Fp, Fc, k), col: C.pil }, X: mixX(Xp, Xc, eio((t - T - 1.25) / .25)) }; }
  const x = lerp(xg, GX + 10, clamp((tp - T - 1.5) / .35)), [F, X] = carry(tp, x, BY, 150, .2);
  F.alpha = 1 - ss(T + 1.55, T + 1.85, t); F.inGate = x > GX - 110; if (F.alpha <= 0) return null;
  return { F, X };
}

// ---------------- camera ----------------
function camAt(t) {
  let c = { x: meX(t) + 60 + 90 * ss(4.3, 5.4, t), y: 1050, z: 1.03 };
  c = mixCam({ x: meX(t) + 34, y: 1000, z: 1.62 }, c, eio((t - 1.5) / 1.1));       // the hook: close on me (the saw in my hand), widening to the procession by ~2.6
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: (cc.mx + cc.cutX) / 2 - 10, y: 1120, z: 1.32 });
  c = mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = mixCam(c, mixCam(at(c2), at(c3), eio((t - 10.0) / .45)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));   // the chasm stays out of frame until I reach it
  if (t >= 12) c = mixCam(c, { x: E + 345, y: 990, z: .72 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = mixCam(c, { x: E + 190, y: 1090, z: .98 }, eio((t - 18.2) / .45));
  if (t >= B.fall) c = mixCam(c, { x: E + 160, y: 1200, z: 1.34 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .65) c = mixCam(c, { x: E + 150, y: 1060, z: 1.0 }, eio((t - B.fall - .65) / .7));
  if (t >= B.back) c = mixCam(c, { x: E - 290, y: 1050, z: .88 }, eio((t - B.back) / .55));    // looking back down the road: the pieces lie there, glowing
  if (t >= 22.75) c = mixCam(c, { x: E + 170, y: 1040, z: .84 }, eio((t - 22.75) / 1.1));   // follow them to the gap
  const k = 1 - ss(B.fall, B.fall + .55, t); c.sx = t >= B.fall ? 15 * k * Math.sin(t * 97) : 0; c.sy = t >= B.fall ? 11 * k * Math.sin(t * 131 + 1) : 0;
  return c;
}

// ---------------- the world ----------------
function guide(ctx, t, a0, k, al) {   // the dashed scissor guide: my whole cross across the chasm
  const x1 = E - REST - 4 + (L + 8) * k, glow = ss(24.15, 24.45, t) * (1 - .5 * ss(24.7, 25.5, t));
  PC.scissorGuide(ctx, t, PC.crossOutline(E - REST, FY + 34), [E - REST - 10, FY - 200, x1 - (E - REST - 10), 400], al, glow);
}
function world(ctx, t) {
  // road sheet with the chasm (rock layers behind it), and the dark below it
  drawSheet(ctx, TX.chasm); drawSheet(ctx, TX.road);
  ctx.fillStyle = C.road; ctx.fillRect(ROADX0, 2290, E + 30 - ROADX0, 3000); ctx.fillRect(E + G - 30, 2290, ROADX1 - E - G + 30, 3000);
  ctx.fillStyle = C.back; ctx.fillRect(E + 40, 2290, G - 80, 3000);
  // the gate: light behind its cut lattice (the backing, lit), light spilling out
  PC.gateLight(ctx, GX, BY);
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  for (const P of pils) if (P.F && P.F.inGate) drawFig(ctx, P.F, P.X && P.X.lie ? () => drawCross(ctx, TX.xLie, P.X.u0, L, P.X.x, P.X.y, P.X.a) : null, P.X && !P.X.lie ? () => drawCross(ctx, TX.xUp, P.X.u0, L, P.X.x, P.X.y, P.X.a, P.F.alpha) : null);
  drawSheet(ctx, TX.gate);
  PC.gateSpill(ctx, GX, BY);
  // back lane: a bridge (only ever one, its owner's), then the others
  for (const P of pils) if (P.B) drawCross(ctx, TX.xLie, 0, L, P.B.x, P.B.y, P.B.a);
  pils.slice().sort((a, b) => (a.F ? a.F.hip[0] : 0) - (b.F ? b.F.hip[0] : 0)).forEach(P => {
    if (!P.F || P.F.inGate) return; const X = P.X;
    const dc = X ? () => drawCross(ctx, X.lie ? TX.xLie : TX.xUp, X.u0, L, X.x, X.y, X.a) : null;
    drawFig(ctx, P.F, X && X.lie ? dc : null, X && !X.lie ? dc : null);
  });
  // the guide shows the missing span while my short cross hangs off the lip, and again when the pieces come back
  if (t >= 18.75 && t < 19.75) guide(ctx, t, 18.75, eio((t - 18.75) / .35), 1 - ss(19.4, 19.75, t));
  if (t >= B.fill[0] - .2) guide(ctx, t, B.fill[0] - .2, eio((t - B.fill[0] + .2) / .45), 1);
  // the saw I left on the road after the last cut
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip;
    drawSaw(ctx, [lerp(g0[0], SAWLIE.grip[0], k), lerp(g0[1], SAWLIE.grip[1], k)], lerp(CUT_ANG, SAWLIE.ang, k)); }
  // the pieces I cut, lying where they fell (front lane); they glow once I look back, and fly into the gap one by one
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), hl = ss(B.back + .2 + (2 - c.k) * .15, B.back + .6 + (2 - c.k) * .15, t) * (1 - ss(FILL[c.k][1] + .2, FILL[c.k][1] + .9, t));
    if (hl > 0) { const cu = (c.u0 + c.u1) / 2, pulse = .8 + .2 * Math.sin((t - B.back) * 5 + c.k); PC.glow(ctx, p.x + Math.cos(p.a) * cu, p.y + Math.sin(p.a) * cu, 140, .5 * hl * pulse); }
    drawCross(ctx, TX.gLie, c.u0, c.u1, p.x, p.y, p.a); }
  // me and my cross (and the saw in my right hand)
  const M = poseMe(t), F = M.F; F.col = C.me;
  const myCross = X => { if (!X) return; drawCross(ctx, X.lie ? TX.gLie : TX.gUp, X.u0, L, X.x, X.y, X.a); };
  drawFig(ctx, F, () => {
    if (M.X && M.X.lie) myCross(M.X);
    if (M.kerf) { ctx.fillStyle = C.back; ctx.fillRect(M.c.cutX - 1.6, M.c.y - PW / 2, 3.2, M.kerf.kp * PW * .92 + .5); }
    if (M.saw) drawSaw(ctx, M.saw.grip, M.saw.ang);
  }, M.X && !M.X.lie ? () => myCross(M.X) : null);
  if (M.c && t >= M.c.drop && t < M.c.drop + .09) { const c = M.c; ctx.strokeStyle = 'rgba(255,240,200,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(c.cutX - 18, c.y - PW / 2 - 8); ctx.lineTo(c.cutX - 18, c.y + PW / 2 + 8); ctx.stroke(); }
  // my cross over the edge: tips, falls (clipped to the chasm so it drops in between the lips)
  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { ctx.save(); if (FX.clip) { ctx.beginPath(); ctx.rect(E + 2, -4000, G - 4, 9000); ctx.clip(); } drawCross(ctx, TX.gLie, FX.u0, L, FX.x, FX.y, FX.a, FX.alpha ?? 1); ctx.restore(); }
  PC.drawFlecks(ctx, t, FLECKS);
}


// ---------------- frame ----------------
function draw(ctx, t) {
  const cm = camAt(t);
  ctx.fillStyle = C.back; ctx.fillRect(0, 0, W, H);
  layer(ctx, cm, .15, () => drawSheet(ctx, TX.cloud));
  layer(ctx, cm, .35, () => drawSheet(ctx, TX.mt));
  layer(ctx, cm, .65, () => drawSheet(ctx, TX.hill));
  layer(ctx, cm, 1, () => world(ctx, t));
  PC.curtain(ctx, t, B.end);                                   // the end: a dark sheet drops, red border strips
  PC.grain(ctx, cm);                                           // paper grain over everything, locked to the world
  PC.captions(ctx, t, S.lines, B.end);
  PC.endCard(ctx, t, S.endCard, B.end);
}

async function init() {
  PC.init();
  buildTimeline(); buildSheets();
  TX.gUp = PC.crossSprite(C.gold, false, 3); TX.gLie = PC.crossSprite(C.gold, true, 4);
  TX.xUp = PC.crossSprite(C.xred, false, 5); TX.xLie = PC.crossSprite(C.xred, true, 6);
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: PC.FONTS, init, draw });
</script>
</body>
