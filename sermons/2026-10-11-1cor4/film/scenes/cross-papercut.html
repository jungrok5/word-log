<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잘라 낸 건 다리였다 · ⑥ 붉은 전지 오림</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
</head>
<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* 잘라 낸 건 다리였다 — ⑥ 붉은 전지 오림 (red paper-cut, folk window-flower grammar).
   Every thing is a piece of red paper cut with scissors and laid on a dark indigo backing: no outlines, no gradients;
   detail is what was cut away (inset slits, sawtooth rows, crescents, diamond lace). The whole world is red — so MY cross
   is the one piece cut from a different paper (cream-gold). The others' crosses are red like the world.
   The medium carries the turn: sawing IS cutting — each cut snips a gold piece off the foot, with paper flecks, and the
   piece lies on the road as a cut-out. The chasm is a cut-away of the road sheet (the backing shows); the gate's light is
   the backing lit from behind, showing through a cut lattice. At the end the scraps come back ("scraps have a future"):
   they fly to the chasm and fill a dashed scissor-guide outline — together with what I kept, exactly a bridge.
   Figures are jointed cut-outs (head, torso, skirt, 2×arm, 2×leg pinned at rivets), posed on 12 fps steps; camera moves on ones. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const C = {
  back: '#10132a', back2: '#161b36', cloud: '#1b2142', mt: '#1c2550', mt2: '#222d5f', hill: '#29366c', hill2: '#212c5b',
  road: '#33427a', roadD: '#2a3768', cliff1: '#212a57', cliff2: '#171e40', gate: '#b8171f',
  me: '#de2a22', pil: '#c41b23', xred: '#9b1220', gold: '#ebc472', saw: '#8f95a6', wood: '#5a1916',
  light: '#fff1cc', light2: '#f6b866', ink: '#f7ecd8',
};
const L = 520, PW = 34, CBX = L - 130, CBW = 32, CBH = 118, CBHL = 50;   // cross: post length, width; crossbar (from foot), thickness, half-length upright / lying
const FY = 1300, BY = 1252, RT = 1212;                                    // front lane (me), back lane (the others), road's far edge
const REST = 26, G = L - 2 * REST;                                        // a full cross rests 26 px on each lip: the chasm is G wide
const shade = (hex, k) => { const c = Pilot.hex(hex); return `rgb(${c[0] * k | 0},${c[1] * k | 0},${c[2] * k | 0})`; };
const t12 = t => Math.floor(t * 12 + 1e-6) / 12;                          // jointed figures pose on 12 fps steps
const frac = x => x - Math.floor(x);

// ---------------- paper helpers (world coordinates, drawn every frame) ----------------
const pathOf = (pts, closed = true) => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); if (closed) p.closePath(); return p; };
// a hand-cut piece: tight paper shadow, fill, light cut-face upper-left, dark lower-right, optional inset slit (double outline)
function paper(ctx, p, col, o = {}) {
  const sh = o.sh ?? 1;
  if (sh > 0) { ctx.fillStyle = 'rgba(6,3,12,.42)'; ctx.save(); ctx.translate(2.4 * sh, 3.4 * sh); ctx.fill(p); ctx.restore();
    ctx.fillStyle = 'rgba(6,3,12,.22)'; ctx.save(); ctx.translate(4.2 * sh, 6 * sh); ctx.fill(p); ctx.restore(); }
  ctx.fillStyle = col; ctx.fill(p);
  ctx.save(); ctx.clip(p);
  if (o.inset) { ctx.lineJoin = 'round'; ctx.strokeStyle = o.slit || C.back; ctx.lineWidth = 2 * (o.inset + 1.6); ctx.stroke(p); ctx.strokeStyle = col; ctx.lineWidth = 2 * o.inset; ctx.stroke(p); }
  ctx.lineWidth = 2.6; ctx.translate(1.4, 1.4); ctx.strokeStyle = 'rgba(255,214,196,.30)'; ctx.stroke(p);
  ctx.translate(-2.8, -2.8); ctx.strokeStyle = 'rgba(30,0,8,.42)'; ctx.stroke(p);
  ctx.restore();
}
function capsule(a, b, wa, wb, n = 7) {   // a tapered limb with round ends
  const dx = b[0] - a[0], dy = b[1] - a[1], an = Math.atan2(dy, dx), pts = [];
  for (let i = 0; i <= n; i++) { const q = an + Math.PI / 2 + Math.PI * i / n; pts.push([a[0] + Math.cos(q) * wa / 2, a[1] + Math.sin(q) * wa / 2]); }
  for (let i = 0; i <= n; i++) { const q = an - Math.PI / 2 + Math.PI * i / n; pts.push([b[0] + Math.cos(q) * wb / 2, b[1] + Math.sin(q) * wb / 2]); }
  return pts;
}
function holes(ctx, list, col = C.back) { ctx.fillStyle = col; const p = new Path2D(); for (const h of list) { p.moveTo(h[0][0], h[0][1]); for (let i = 1; i < h.length; i++) p.lineTo(h[i][0], h[i][1]); p.closePath(); } ctx.fill(p); }
const diamond = (x, y, rx, ry) => [[x, y - ry], [x + rx, y], [x, y + ry], [x - rx, y]];
function crescentPts(cx, cy, r, a0, a1, t, n = 10) { const o = [], q = [];
  for (let i = 0; i <= n; i++) { const u = i / n, a = a0 + (a1 - a0) * u, k = Math.sin(Math.PI * u); o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); q.push([cx + Math.cos(a) * (r - t * k), cy + Math.sin(a) * (r - t * k)]); }
  return o.concat(q.reverse()); }
function sawEdge(x0, x1, y, h, sp, seed, dir = -1) {   // a sawtooth (grass / ridge) edge as a polyline
  const r = rng(seed), o = []; for (let x = x0, i = 0; x <= x1; x += sp / 2, i++) o.push([x, y + (i % 2 ? dir * h * (.6 + .8 * r()) : 0)]); return o; }

// ---------------- prebuilt paper: grain, crosses, background sheets ----------------
const TX = {};
function grainTile(N = 512) {
  const c = Pilot.canvas(N, N), g = c.getContext('2d'), d = g.createImageData(N, N), r = rng(7);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const f = (Pilot.noise(x / 64, y / 64) - .5) * 1.0 + (Pilot.noise(x / 16 + 9, y / 16) - .5) * .5 + (Pilot.noise(x / 4, y / 4 + 3) - .5) * .25;
    const v = 128 + f * 40 + (r() > .994 ? -30 : 0), i = (y * N + x) * 4; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
  g.lineCap = 'round';
  for (let k = 0; k < 520; k++) { const x = r() * N, y = r() * N, a = r() * TAU, l = 10 + r() * 28; g.globalAlpha = .1 + r() * .14; g.strokeStyle = k % 3 ? '#fff' : '#000'; g.lineWidth = .8 + r() * .5;
    for (const [ox, oy] of [[0, 0], [-N, 0], [N, 0], [0, -N], [0, N]]) { g.beginPath(); g.moveTo(x + ox, y + oy); g.quadraticCurveTo(x + ox + Math.cos(a + .4) * l / 2, y + oy + Math.sin(a + .4) * l / 2, x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l); g.stroke(); } }
  return c;
}
// texture a sprite as paper: soft-light grain, light/dark cut faces, then restore its alpha (holes stay holes)
function finish(c, seed = 0, edge = 2) {
  const g = c.getContext('2d'), w = c.width, h = c.height, m = Pilot.canvas(w, h); m.getContext('2d').drawImage(c, 0, 0);
  g.save(); const pat = g.createPattern(TX.grain, 'repeat'); pat.setTransform(new DOMMatrix([1, 0, 0, 1, (seed * 137) % 512, (seed * 71) % 512]));
  g.globalCompositeOperation = 'soft-light'; g.fillStyle = pat; g.fillRect(0, 0, w, h);
  const r = Pilot.canvas(w, h), rg = r.getContext('2d');
  rg.drawImage(m, 0, 0); rg.globalCompositeOperation = 'destination-out'; rg.drawImage(m, edge, edge); rg.globalCompositeOperation = 'source-in'; rg.fillStyle = 'rgba(255,214,190,.5)'; rg.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'source-atop'; g.drawImage(r, 0, 0);
  rg.globalCompositeOperation = 'source-over'; rg.clearRect(0, 0, w, h); rg.drawImage(m, 0, 0); rg.globalCompositeOperation = 'destination-out'; rg.drawImage(m, -edge, -edge);
  rg.globalCompositeOperation = 'source-in'; rg.fillStyle = 'rgba(40,0,8,.5)'; rg.fillRect(0, 0, w, h); g.drawImage(r, 0, 0);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(m, 0, 0); g.restore(); return c;
}
function shadowOf(c, blur = 5) { const s = Pilot.canvas(c.width + 24, c.height + 24), g = s.getContext('2d'); g.filter = `blur(${blur}px)`; g.drawImage(c, 12, 12); g.filter = 'none';
  g.globalCompositeOperation = 'source-in'; g.fillStyle = 'rgba(6,3,12,.62)'; g.fillRect(0, 0, s.width, s.height); return s; }
// a cross cut from one sheet: post along +x (foot at x=0, top at x=L), crossbar near the top; diamond lace down the middle,
// a four-petal rosette at the crossing, a slit a few px inside the outline. lying = crossbar foreshortened (lying flat).
const KX = 2, CPAD = 14;
function crossSprite(col, lying, seed) {
  const hb = lying ? CBHL : CBH, w = (L + 2 * CPAD) * KX, h = (2 * hb + 2 * CPAD) * KX, c = Pilot.canvas(w, h), g = c.getContext('2d');
  g.setTransform(KX, 0, 0, KX, CPAD * KX, (hb + CPAD) * KX);
  const out = [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],
    [CBX + CBW / 2, PW / 2], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, PW / 2], [0, PW / 2]];
  const p = pathOf(out); g.fillStyle = col; g.fill(p);
  // flared, notched ends (top and crossbar tips): small swallow-tail cuts
  g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000';
  const notch = (pts) => { g.beginPath(); g.moveTo(...pts[0]); for (const q of pts.slice(1)) g.lineTo(...q); g.closePath(); g.fill(); };
  notch([[L + 1, -6], [L - 9, 0], [L + 1, 6]]);
  notch([[CBX - 6, -hb - 1], [CBX, -hb + (lying ? 5 : 9)], [CBX + 6, -hb - 1]]); notch([[CBX - 6, hb + 1], [CBX, hb - (lying ? 5 : 9)], [CBX + 6, hb + 1]]);
  // inset slit
  g.save(); g.clip(p); g.globalCompositeOperation = 'destination-out'; g.lineJoin = 'miter'; g.strokeStyle = '#000'; g.lineWidth = 2 * (4.2 + 1.5); g.stroke(p);
  g.globalCompositeOperation = 'source-over'; g.strokeStyle = col; g.lineWidth = 2 * 4.2; g.stroke(p); g.restore();
  // lace: diamonds down the post, small ones on the crossbar, a rosette at the crossing
  g.globalCompositeOperation = 'destination-out';
  for (let x = 22; x < L - 14; x += 26) { if (Math.abs(x - CBX) < 30) continue; g.beginPath(); for (const [a, b] of diamond(x, 0, 6.5, 4.6)) g.lineTo(a, b); g.closePath(); g.fill(); }
  for (let y = 30; y < hb - 10; y += lying ? 18 : 24) for (const sgn of [-1, 1]) { g.beginPath(); for (const [a, b] of diamond(CBX, sgn * y, 4, lying ? 3.4 : 5.4)) g.lineTo(a, b); g.closePath(); g.fill(); }
  for (let k = 0; k < 4; k++) { const a = k * TAU / 4 + TAU / 8; g.beginPath(); g.ellipse(CBX + Math.cos(a) * 6.5, Math.sin(a) * 6.5 * (lying ? .6 : 1), 3.6, 2.2, a, 0, TAU); g.fill(); }
  g.beginPath(); g.arc(CBX, 0, 1.8, 0, TAU); g.fill();
  g.setTransform(1, 0, 0, 1, 0, 0); finish(c, seed, 2.4);
  return { c, sh: shadowOf(c, 4), hb };
}
// draw cross material [u0, u1] (local x along the post) with the foot origin at (x, y), angle a
function drawCross(ctx, X, u0, u1, x, y, a, alpha = 1, shadow = 1) {
  if (u1 - u0 < .5 || alpha <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.globalAlpha = alpha;
  const sx = (u0 + CPAD) * KX, sw = (u1 - u0) * KX, hb = X.hb, dh = 2 * hb + 2 * CPAD;
  const left = u0 <= .5 ? -CPAD : u0, right = u1 >= L - .5 ? L + CPAD : u1;
  if (shadow) { ctx.save(); ctx.rotate(-a); ctx.translate(3 * shadow, 4.5 * shadow); ctx.rotate(a);
    ctx.drawImage(X.sh, (left + CPAD) * KX + 12, 0, (right - left) * KX, X.sh.height, left - 6 / KX * 0, -hb - CPAD - 12 / KX, right - left, dh + 24 / KX); ctx.restore(); }
  ctx.drawImage(X.c, (left + CPAD) * KX, 0, (right - left) * KX, dh * KX, left, -hb - CPAD, right - left, dh);
  ctx.restore();
}

// ---------------- background sheets (built once E — the chasm's near lip — is known) ----------------
let E = 1600, GX = 0, GAY = 0, ROADX0 = -1500, ROADX1 = 0;
function sheet(x0, y0, x1, y1, draw, seed, K = 1) {
  const c = Pilot.canvas((x1 - x0) * K, (y1 - y0) * K), g = c.getContext('2d'); g.setTransform(K, 0, 0, K, -x0 * K, -y0 * K); g.lineJoin = 'round'; draw(g);
  g.setTransform(1, 0, 0, 1, 0, 0); finish(c, seed, 2); return { c, x0, y0, x1, y1, K, sh: null };
}
function fillPts(g, pts, col) { g.fillStyle = col; g.beginPath(); g.moveTo(...pts[0]); for (const p of pts.slice(1)) g.lineTo(...p); g.closePath(); g.fill(); }
function cutPts(g, list) { g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.beginPath(); for (const h of list) { g.moveTo(...h[0]); for (const p of h.slice(1)) g.lineTo(...p); g.closePath(); } g.fill(); g.restore(); }
function cutSlit(g, pts, w) { g.save(); g.globalCompositeOperation = 'destination-out'; g.strokeStyle = '#000'; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(...pts[0]); for (const p of pts.slice(1)) g.lineTo(...p); g.stroke(); g.restore(); }
function swirlPts(cx, cy, r, turns, rot, dir = 1) { const o = [], n = Math.ceil(turns * 30); for (let i = 0; i <= n; i++) { const u = i / n, a = rot + dir * u * turns * TAU, rr = r * (1 - u * .85); o.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); } return o; }

function buildSheets() {
  ROADX1 = E + G + 1500;
  // clouds (sky layer, parallax .15): dark scroll clouds, cut swirls
  TX.cloud = sheet(-900, 260, 1500, 760, g => {
    const r = rng(31);
    for (let k = 0; k < 6; k++) { const cx = -800 + k * 430 + r() * 120, cy = 420 + r() * 220, rx = 150 + r() * 90;
      const pts = []; for (let i = 0; i <= 40; i++) { const a = Math.PI + Math.PI * i / 40; pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * rx * .42 - Math.abs(Math.sin(a * 3)) * 26]); }
      fillPts(g, pts, C.cloud); cutSlit(g, swirlPts(cx - rx * .35, cy - 22, 26, 1.5, 0), 4); cutSlit(g, swirlPts(cx + rx * .3, cy - 30, 20, 1.4, Math.PI, -1), 3.5);
      cutSlit(g, [[cx - rx * .8, cy - 6], [cx + rx * .8, cy - 6]], 3); }
  }, 3);
  // far mountains (parallax .35): sawtooth ridges, two tones
  TX.mt = sheet(-1000, 600, 1700, 1260, g => {
    const r = rng(41);
    for (const [col, base, amp, seed] of [[C.mt, 880, 190, 1], [C.mt2, 980, 140, 2]]) {
      const top = []; for (let x = -1000; x <= 1700; x += 6) { const n = Pilot.fbm(x / 420 + seed * 7, seed, 3); top.push([x, base - amp * n * 1.4 + amp * .3]); }
      const saw = []; top.forEach((p, i) => saw.push([p[0], p[1] - (i % 2 ? 9 + 6 * r() : 0)]));
      fillPts(g, saw.concat([[1700, 1260], [-1000, 1260]]), col);
      // crescent rows (rock strata) and a slit along the ridge
      const hs = []; for (let x = -980; x < 1700; x += 34) for (let k = 1; k < 4; k++) { const yy = top[clamp(Math.round((x + 1000) / 6), 0, top.length - 1)][1] + 40 * k + (k % 2) * 10; if (yy < 1240) hs.push(crescentPts(x + (k % 2) * 17, yy, 11, .25, Math.PI - .25, 4)); }
      cutPts(g, hs);
      cutSlit(g, top.map(p => [p[0], p[1] + 16]), 2.2);
    }
  }, 5);
  // mid hills with bare paper trees (parallax .65)
  TX.hill = sheet(-1100, 900, 2500, 1290, g => {
    const r = rng(53), top = []; for (let x = -1100; x <= 2500; x += 5) top.push([x, 1100 - 70 * Pilot.fbm(x / 300 + 3, 2, 3) + 20]);
    const saw = top.map((p, i) => [p[0], p[1] - (i % 2 ? 7 + 4 * r() : 0)]);
    fillPts(g, saw.concat([[2500, 1290], [-1100, 1290]]), C.hill);
    const hs = []; for (let x = -1080; x < 2500; x += 26) hs.push(diamond(x, top[clamp(Math.round((x + 1100) / 5), 0, top.length - 1)][1] + 40, 5, 3.5));
    cutPts(g, hs);
    // trees: trunk + forked branches, each tip a small plum hole
    for (let x = -1000; x < 2450; x += 240 + r() * 200) {
      const y0 = top[clamp(Math.round((x + 1100) / 5), 0, top.length - 1)][1] + 8, h = 110 + r() * 70;
      g.fillStyle = C.hill2; g.strokeStyle = C.hill2; g.lineCap = 'round';
      const br = (x0, y0, a, l, w, d) => { const x1 = x0 + Math.cos(a) * l, y1 = y0 + Math.sin(a) * l; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
        if (d > 0) { br(x1, y1, a - .45 - r() * .2, l * .68, w * .62, d - 1); br(x1, y1, a + .4 + r() * .2, l * .62, w * .62, d - 1); } else { g.beginPath(); g.arc(x1, y1, 6, 0, TAU); g.fill(); } };
      br(x, y0, -Math.PI / 2 + (r() - .5) * .2, h * .45, 11, 3);
    }
  }, 7);
  // the road sheet: walking surface from RT down; sawtooth grass on its far edge; lace rows; the chasm cut out of it
  const y0 = RT - 30, y1 = 2300;
  TX.road = sheet(ROADX0, y0, ROADX1, y1, g => {
    const r = rng(61), top = sawEdge(ROADX0, ROADX1, RT, 16, 12, 9);
    fillPts(g, top.concat([[ROADX1, y1], [ROADX0, y1]]), C.road);
    // a slit just inside the grass line, two rows of crescents and a diamond band low on the sheet
    cutSlit(g, [[ROADX0, RT + 12], [ROADX1, RT + 12]], 2.4);
    const hs = [];
    for (let x = ROADX0; x < ROADX1; x += 30) { hs.push(crescentPts(x, 1392, 12, .3, Math.PI - .3, 4.4)); hs.push(crescentPts(x + 15, 1428, 12, .3, Math.PI - .3, 4.4)); }
    for (let x = ROADX0; x < ROADX1; x += 22) hs.push(diamond(x, 1480, 6, 4));
    for (let x = ROADX0; x < ROADX1; x += 60) for (let k = 0; k < 4; k++) hs.push(crescentPts(x + (k % 2) * 30, 1560 + k * 44, 18, .3, Math.PI - .3, 5));
    cutPts(g, hs);
    cutSlit(g, [[ROADX0, 1455], [ROADX1, 1455]], 2.2); cutSlit(g, [[ROADX0, 1505], [ROADX1, 1505]], 2.2);
    // the chasm: a ragged vertical cut-away (lips slightly overhang, walls step inward as they go down)
    const lip = (x, dir, seed) => { const q = rng(seed), o = []; for (let y = RT - 40; y <= y1 + 10; y += 14) o.push([x + dir * (y < RT + 30 ? 0 : (6 + q() * 16 + (y - RT) * .05)), y]); return o; };
    const L1 = lip(E, 1, 71), L2 = lip(E + G, -1, 73);
    cutPts(g, [L1.concat(L2.slice().reverse())]);
  }, 11);
  // inside the chasm: rock layers stepping down into the dark (behind the road sheet)
  TX.chasm = sheet(E - 40, RT - 10, E + G + 40, 2300, g => {
    const r = rng(81);
    for (const [col, inset, yTop] of [[C.cliff1, 20, RT + 60], [C.cliff2, 60, RT + 230]]) {
      const lw = [], rw = []; for (let y = yTop; y <= 2300; y += 18) { lw.push([E + inset + r() * 22 + (y - yTop) * .1, y]); rw.push([E + G - inset - r() * 22 - (y - yTop) * .1, y]); }
      fillPts(g, [[E - 40, yTop - 20], ...lw, [E - 40, 2300]], col); fillPts(g, [[E + G + 40, yTop - 20], ...rw, [E + G + 40, 2300]], col);
      const hs = []; for (let y = yTop + 40; y < 2280; y += 46) { hs.push(crescentPts(E + inset * .5 + 4, y, 10, -.9, .9, 4)); hs.push(crescentPts(E + G - inset * .5 - 4, y + 20, 10, Math.PI - .9, Math.PI + .9, 4)); }
      cutPts(g, hs);
    }
  }, 13);
  // the gate on the far side: a plain arch (two posts, a round arch with diamond lace); its doors are a lattice of cut holes
  GX = E + G + 380; GAY = BY + 4 - 330;
  TX.gate = sheet(GX - 160, RT - 520, GX + 160, BY + 8, g => {
    const gy = BY + 4, x = GX, ay = GAY, arc = (r, a0, a1, n = 36) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([x + Math.cos(a) * r, ay + Math.sin(a) * r]); } return o; };
    fillPts(g, [[x - 134, gy], ...arc(134, Math.PI, TAU), [x + 134, gy], [x + 98, gy], ...arc(98, 0, -Math.PI), [x - 98, gy]], C.gate);

  // me and my cross (and the saw in my right hand)
  const M = poseMe(t), F = M.F; F.col = C.me;
  const myCross = X => { if (!X) return; drawCross(ctx, X.lie ? TX.gLie : TX.gUp, X.u0, L, X.x, X.y, X.a); };
  drawFig(ctx, F, () => {
    if (M.X && M.X.lie) myCross(M.X);
    if (M.kerf) { ctx.fillStyle = C.back; ctx.fillRect(M.c.cutX - 1.6, M.c.y - PW / 2, 3.2, M.kerf.kp * PW * .92 + .5); }
    if (M.saw) drawSaw(ctx, M.saw.grip, M.saw.ang);
  }, M.X && !M.X.lie ? () => myCross(M.X) : null);
  if (M.c && t >= M.c.drop && t < M.c.drop + .09) { const c = M.c; ctx.strokeStyle = 'rgba(255,240,200,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(c.cutX - 18, c.y - PW / 2 - 8); ctx.lineTo(c.cutX - 18, c.y + PW / 2 + 8); ctx.stroke(); }
  // my cross over the edge: tips, falls (clipped to the chasm so it drops in between the lips)
  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { ctx.save(); if (FX.clip) { ctx.beginPath(); ctx.rect(E + 2, -4000, G - 4, 9000); ctx.clip(); } drawCross(ctx, TX.gLie, FX.u0, L, FX.x, FX.y, FX.a, FX.alpha ?? 1); ctx.restore(); }
  drawFlecks(ctx, t);
}

// ---------------- words ----------------
const SERIF = "'Noto Serif KR',serif", SANS = "'Noto Sans KR',sans-serif";
function captionPlates(ctx, t) {
  for (const [a, b, s, src] of S.lines) {
    const al = Pilot.win(t, a, b, .35, .45); if (al <= 0) continue;
    const lines = s.split('\n'), size = lines.length > 1 ? 54 : 62, y = 440, lh = size * 1.55;
    ctx.font = `700 ${size}px ${SERIF}`; let w = Math.max(...lines.map(l => ctx.measureText(Pilot.tr(l)).width));
    let top = y - size * 1.08 - 26, bot = y + (lines.length - 1) * lh + size * .38 + 26;
    if (src) { ctx.font = `400 28px ${SANS}`; w = Math.max(w, ctx.measureText(src).width); bot = y + (lines.length > 1 ? size * 1.55 : 0) + 76 + 22; }
    const hw = w / 2 + 64, drop = 14 * (1 - eo(clamp((t12(t) - a) / .17))), x0 = 540 - hw, x1 = 540 + hw, mY = (top + bot) / 2;
    const pts = [[x0, top + drop], [x1, top + drop], [x1 - 26, mY + drop], [x1, bot + drop], [x0, bot + drop], [x0 + 26, mY + drop]];
    ctx.save(); ctx.globalAlpha = al * .82; paper(ctx, pathOf(pts), '#0b0d1f', { sh: 1.2 }); ctx.restore();
  }
}
function endPlate(ctx, t) {
  const k = eo((t - (B.end - .15)) / .4); if (k <= 0) return;
  const yb = lerp(-60, H + 60, k), r = rng(5), edge = []; for (let x = -20, i = 0; x <= W + 20; x += 14, i++) edge.push([x, yb + (i % 2 ? 16 + 6 * r() : 0)]);
  paper(ctx, pathOf([[-20, -20], [W + 20, -20], ...edge.reverse()]), C.back2, { sh: 2 });
  // red paper border strips with sawtooth, above and below the card
  for (const [y, dir] of [[560, -1], [1210, 1]]) { const sy = y - (H - yb) * 1.0; if (sy > yb) continue;
    const st = [[120, sy - 9], [W - 120, sy - 9], ...sawEdge(W - 120, 120, sy + 9, 12, 16, 3, 1).reverse().map(p => [p[0], p[1]]).reverse()];
    const top = [[120, sy - 6], [W - 120, sy - 6], [W - 120, sy + 6], [120, sy + 6]];
    paper(ctx, pathOf(top), C.gate, { sh: 1 }); holes(ctx, [...Array(28)].map((_, i) => diamond(150 + i * 28.7, sy, 4.5, 3)));
    const teeth = []; for (let x = 128; x < W - 128; x += 16) teeth.push([[x, sy + dir * 6], [x + 8, sy + dir * 18], [x + 16, sy + dir * 6]]);
    ctx.fillStyle = C.gate; for (const q of teeth) { ctx.beginPath(); ctx.moveTo(...q[0]); ctx.lineTo(...q[1]); ctx.lineTo(...q[2]); ctx.fill(); } }
}

// ---------------- frame ----------------
let GRAIN = null;
function draw(ctx, t) {
  const cm = camAt(t);
  ctx.fillStyle = C.back; ctx.fillRect(0, 0, W, H);
  layer(ctx, cm, .15, () => drawSheet(ctx, TX.cloud));
  layer(ctx, cm, .35, () => drawSheet(ctx, TX.mt));
  layer(ctx, cm, .65, () => drawSheet(ctx, TX.hill));
  layer(ctx, cm, 1, () => world(ctx, t));
  endPlate(ctx, t);
  // paper grain over everything, locked to the world (it moves with the camera, never crawls)
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = .55;
  GRAIN.setTransform(new DOMMatrix([cm.z, 0, 0, cm.z, 540 - cm.x * cm.z, 960 - cm.y * cm.z])); ctx.fillStyle = GRAIN; ctx.fillRect(0, 0, W, H); ctx.restore();
  if (t < B.end) { captionPlates(ctx, t);
    Story.captions(ctx, t, S.lines, { font: SERIF, weight: 700, color: C.ink, srcColor: '#e3d3b8', y: 440, shadow: 'rgba(4,4,14,.85)', shadowBlur: 14 }); }
  Story.endCard(ctx, t, S.endCard, B.end, { font: SERIF, color: C.ink, srcColor: '#ddcdb3', y: 860, titleShadow: 'rgba(0,0,0,.5)' });
}

async function init() {
  TX.grain = grainTile();
  buildTimeline(); buildSheets();
  TX.gUp = crossSprite(C.gold, false, 3); TX.gLie = crossSprite(C.gold, true, 4);
  TX.xUp = crossSprite(C.xred, false, 5); TX.xLie = crossSprite(C.xred, true, 6);
  GRAIN = Pilot.canvas(1, 1).getContext('2d').createPattern(TX.grain, 'repeat');
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 60px 'Noto Serif KR'", "600 60px 'Noto Serif KR'", "400 28px 'Noto Sans KR'", "500 34px 'Noto Sans KR'"], init, draw });
</script>
