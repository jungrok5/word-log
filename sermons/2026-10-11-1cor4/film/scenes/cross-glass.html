<title>잘라 낸 건 다리였다 · ⑦ 스테인드글라스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;600;700&display=swap">

<script src="lib.js"></script>

<script>
/* 잘라 낸 건 다리였다 — ⑦ stained glass (lemo-opuscar styles/stained-glass: grammar only, own renderer).
   The whole frame is one tall lancet in a dark stone wall: a blue pearled border, a white fillet, cobalt lozenge quarries
   for sky (fixed in the window's lead), a white-glass inscription band for the words. The story is a living panel inside it:
   hills, a buff road and umber ground cut as glass pieces, the pilgrims as rigid leaded pieces that step at 12 fps.
   One accent: my cross is the only ruby glass; the others carry amber / clear crosses. The chasm is an unlit band
   (no light comes through it); on the far side the gate's door is the brightest white glass and its light leaks.
   The turn is the medium breaking: as my short cross slips into the dark the window CRACKS (light races through the
   cracks); looking back, the three ruby offcuts slide along the leads into the ghost of my cross over the gap — together
   exactly a bridge — and the cracks are mended into new leads. End: a cloud covers the sun, the panes go unlit and the
   card is painted on a white-glass plate. Everything is a pure function of t.
   (v2: the cracks were replaced by the shatter of my ruby cross — Glass.cracks/drawCracks keep the crack move.)
   The glass itself (pieces, lead, window, band, figures, crosses, world builders, light, shatter, bloom, captions, end card)
   comes from the glass kit (kit-glass.js = styles/glass/kit.js); this file keeps the story. */
const { clamp, lerp, ss, eo, eio, rng } = Pilot;
const S = window.SCRIPT, B = S.beat, W = Pilot.W, H = Pilot.H, TAU = Math.PI * 2;
const G = Glass, C = G.C, LEAD = G.LEAD, INK = G.INK, INK2 = G.INK2;
const { piece, smoothP, polyP, rectP, ellP, stroke, vary, h2 } = G;
// ---------------------------------------------------------------- geometry
const { PX0, PX1, PY0, PY1 } = G;                          // the picture field (screen; the window is the kit's)
const ROAD0 = 1296, ROAD1 = 1392;                           // road surface band (world y)
const LANES = [1312, 1327, 1342], MEY = 1368;              // the others' lanes (back → front) and mine (nearest)
const XN = 1300, XF = 1590, FOOT0 = 1268;                   // chasm lips; where a cross is planted
const L = 360, CB = 78, CBW = 140, BW = 24;                 // cross: length (= the bridge), crossbar from top, crossbar, beam width
const DOOR = { x: 1700, base: 1297, spring: 1170, apex: 1112, hw: 46 };
const WX0 = -240, WY0 = 260, WW = 2280, WH = 2080, WS = 1.5; // world canvas extent (built at 1.5× for the close framings)
const SEG_ME = [0, S.left[3], S.left[2], S.left[1], 1];    // my cross is leaded where it will be cut
const SEG_OT = [0, .42, .74, 1];
const CUTLEN = [0, 1, 2].map(k => (S.left[k] - S.left[k + 1]) * L);
const ME_S = 1.08, KX = 100 * ME_S;

const drawCross = G.cross, carry = G.carry, along = G.along, lerpCross = G.lerpCross;
const drawProfile = G.profile, kneelGeo = G.kneelGeo, drawKneelBody = G.kneelBody, drawArm = G.arm;

// ---------------------------------------------------------------- the world panel (hills, road, ground, chasm, gate)
const hillY = G.hillY;
const cliffN = y => XN + 5 * Math.sin(y / 37) + Math.max(0, y - ROAD1) * .04;
const cliffF = y => XF + 5 * Math.sin(y / 31 + 1) - Math.max(0, y - ROAD1) * .04;
let WORLD;
function buildWorld() {
  WORLD = G.world({ x0: WX0, y0: WY0, w: WW, h: WH, scale: WS, seed: 5, id: 100 }, wb => {
    const X1 = WX0 + WW, Y1 = WY0 + WH;
    G.mountains(wb, WX0, X1, { y: 1000, bottom: 1240 });                       // far mountains (slate glass)
    G.hills(wb, WX0, X1, { top: hillY, bottom: ROAD0 + 4 });                   // far hills
    for (const tx of [40, 300, 720, 960, 1210, 1960]) G.tree(wb, tx, hillY(tx));
    G.gatehouse(wb, DOOR, { top: 1046, base: ROAD0 });                         // the gatehouse and its white door
    const lit = x => x > DOOR.x - 100 && x < DOOR.x + 100;                     // pale light spilled in front of the door
    G.road(wb, WX0, XN, { y0: ROAD0, y1: ROAD1, lit }); G.road(wb, XF, X1, { y0: ROAD0, y1: ROAD1, lit });
    G.ground(wb, WX0, XN, 0, { y0: ROAD1, y1: Y1, right: cliffN }); G.ground(wb, XF, X1, 1, { y0: ROAD1, y1: Y1, left: cliffF });
    G.chasm(wb, cliffN, cliffF, { top: ROAD0, ys: [ROAD0 - 2, 1440, 1560, 1720, 1940, Y1], lipTo: 1700 });   // unlit: no light comes through it
  });
}

// ---------------------------------------------------------------- figures

const MECOL = { robe: '#9db0ae', robe2: '#7d908e', hood: '#53657a' };
const OTH = [
  { x0: 610, lane: 0, s: .93, col: { robe: '#2f6f3a', robe2: '#245a2f', hood: '#6b7a22' }, cross: C.amber, id: 300 },
  { x0: 370, lane: 1, s: .96, col: { robe: '#632a63', robe2: '#4c2a5e', hood: '#7a4e24' }, cross: C.clear, id: 400 },
  { x0: 250, lane: 2, s: .99, col: { robe: '#6b7a22', robe2: '#56621c', hood: '#2f6f86' }, cross: C.amber, id: 500 },
];
// the saw hangs from the near hand: handle in the fist, blade down and forward (Glass.profile's `holding` hook)
function sawHang(c, Wr, ha, id) {
  const G2 = [Wr[0] + Math.cos(ha) * 7, Wr[1] + Math.sin(ha) * 7], d = [Math.cos(1.15), Math.sin(1.15)], n = [-d[1], d[0]];
  const P = (u, v) => [G2[0] + d[0] * u + n[0] * v, G2[1] + d[1] * u + n[1] * v], tooth = [];
  for (let u = 12; u <= 112; u += 6) tooth.push(P(u, 8), P(u + 3, 13));
  piece(c, polyP([P(12, -10), P(112, -6), ...tooth.reverse()]), '#9fabae', id + 30, { lead: 3, mat: 6 });
  const hp = smoothP([[-14, -16], [16, -14], [18, 12], [-10, 16], [-20, 2]].map(([u, v]) => P(u, v)), true, .4);
  piece(c, hp, C.wood, id + 31, { lead: 3, mat: 0, tex: false });
}

// ---------------------------------------------------------------- the saw at work (world coords)
// the saw (world coords): teeth edge from the heel to the toe along d; G = the handle's grip point
const SAWD = (() => { const v = [-36, 76], l = Math.hypot(v[0], v[1]); return [v[0] / l, v[1] / l]; })(), SAWN = [-SAWD[1], SAWD[0]];
const sawPt = (G, u, v) => [G[0] + SAWD[0] * u + SAWN[0] * v, G[1] + SAWD[1] * u + SAWN[1] * v];
function drawSawBlade(c, G) {
  c.save(); c.beginPath(); c.rect(G[0] - 300, G[1] - 300, 600, MEY - BW + 2 - (G[1] - 300)); c.clip();      // the toe is inside the kerf, behind the beam
  const tooth = []; for (let u = 14; u <= 140; u += 6) tooth.push(sawPt(G, u, 0), sawPt(G, u + 3, -5));
  piece(c, polyP([...tooth, sawPt(G, 140, 0), sawPt(G, 140, 14), sawPt(G, 14, 24)]), '#9fabae', 801, { lead: 3, mat: 6 });
  c.restore();
}
function drawSawHandle(c, G) {
  const pts = [[16, -4], [16, 30], [-4, 40], [-24, 34], [-30, 10], [-18, -8], [0, -6]].map(([u, v]) => sawPt(G, u, v));
  const hole = [[-2, 8], [-4, 24], [-15, 25], [-18, 11], [-10, 5]].map(([u, v]) => sawPt(G, u, v));
  const p = smoothP(pts, true, .4); smoothP(hole, true, .5, p);
  c.save(); c.fillStyle = vary(C.wood, 811); c.fill(p, 'evenodd'); c.strokeStyle = LEAD; c.lineWidth = 3.5; c.lineJoin = 'round'; c.stroke(p); c.restore();
}

// ---------------------------------------------------------------- the timeline: me
let PLAN = null;
function plan() {
  const P = {}; P.x0 = 490; P.vS = 28; P.stop = P.x0 + P.vS * 3.0;
  const f1 = { x: P.stop, y: MEY, s: ME_S, dir: 1, lean: .12 };
  P.fx = [carry(f1, 1).fx]; P.xc = [P.fx[0] + CUTLEN[0]]; P.bx = [P.xc[0] + KX];
  P.runTo = 1060; P.stop2 = 1076;
  const f2 = { x: P.stop2, y: MEY, s: ME_S, dir: 1, lean: .1 };
  P.fx[1] = carry(f2, S.left[1]).fx; P.xc[1] = P.fx[1] + CUTLEN[1]; P.bx[1] = P.xc[1] + KX;
  P.fx[2] = P.xc[1]; P.xc[2] = P.xc[1] + CUTLEN[2]; P.bx[2] = P.xc[2] + KX;
  P.lip = 1252; P.watch = 1192; P.plant = 1222;
  // where each offcut comes to rest on the road, and its slot in my whole cross over the gap (head on the near lip, the
  // cut foot reaching out: the missing span is exactly the foot, piece by piece in the order it was cut off)
  P.piece = [0, 1, 2].map(k => ({ x0: P.fx[k] - 9, x1: P.xc[k] - 9, rot: [-.05, .06, -.035][k], u0: S.left[k + 1], u1: S.left[k] }));
  let x = FOOT0 + S.left[3] * L;
  for (const k of [2, 1, 0]) { const w = CUTLEN[k]; P.piece[k].slot = [x, x + w]; x += w; }
  PLAN = P;
}
const dropT = k => B.saw[k] + .8;
function meLen(t) { let len = S.left[0]; for (let k = 0; k < 3; k++) if (t >= dropT(k)) len = S.left[k + 1]; return len; }
const groundCross = (fx, len) => ({ fx, fy: MEY - BW / 2, ang: 0, len, fore: .32 });
// a cross given by its head point H and direction a (foot → head)
const byHead = (H, a, len, fore) => ({ fx: H[0] - Math.cos(a) * len * L, fy: H[1] - Math.sin(a) * len * L, ang: a, len, fore });
const MY_H = [FOOT0 + 4, MEY - BW / 2];                    // my head end resting on the near lip
function meState(t) {
  const P = PLAN, sw = B.saw, len = meLen(t), f = { x: P.x0, y: MEY, s: ME_S, dir: 1, lean: .1, phase: 0, stand: true, crouch: 0, col: MECOL, id: 900, amp: 18 };
  const st = { f, cross: null, kneel: null, len };
  const carryAt = () => { st.cross = carry(f, len); f.hand = st.cross.grip; };
  const lower = (x, k, q) => {                // put the cross down on the road (stepped)
    q = Math.floor(clamp(q) * 3) / 3; f.x = x; f.crouch = .55 * q; f.lean = .1 + .25 * q;
    const a = carry({ ...f, crouch: 0, lean: .1 }, len), b = groundCross(a.fx, len);
    st.cross = lerpCross(a, b, q); f.hand = along(st.cross, lerp(Math.max(6, len * L - CB - 75), x - a.fx + 30, q));
  };
  const rise = (k, q) => {                    // pick it up again (stepped)
    q = Math.floor(clamp(q) * 3) / 3; f.x = P.bx[k]; f.crouch = .55 * (1 - q); f.lean = .1 + .25 * (1 - q);
    const b = carry({ ...f, crouch: 0, lean: .1 }, len), a = groundCross(P.xc[k], len);
    st.cross = lerpCross(a, b, q); f.hand = along(st.cross, lerp(f.x - P.xc[k] + 30, Math.max(6, len * L - CB - 75), q));
  };
  const kneel = (k, bx, t0) => {             // kneel behind the cross and saw its foot off
    const foot = t >= dropT(k) ? P.xc[k] : P.fx[k];
    st.cross = groundCross(foot, len);
    const sa = clamp((t - t0 - .25) / .5), stroke = sa > 0 && sa < 1 ? 22 * Math.sin(Math.floor((t - t0 - .25) * 16) / 16 * TAU * 6) : 0;
    const cut = [P.xc[k], MEY - BW], G = [cut[0] - SAWD[0] * (86 + stroke), cut[1] - SAWD[1] * (86 + stroke)];
    st.kneel = { x: bx, y: MEY - 6, s: ME_S, col: MECOL, id: 900, G, kerf: t >= dropT(k) ? 0 : sa, cutX: P.xc[k], press: [bx - 6, MEY - BW + 3] };
  };
  const sawInHand = () => { st.cross = carry(f, len); f.farHand = st.cross.front; f.hand = null; f.holding = sawHang; };
  if (t < 3.0) { f.x = P.x0 + P.vS * t; f.stand = false; f.phase = t * TAU * .55; f.lean = .17 + .07 * Math.sin(t * TAU * 1.1); f.look = .6; sawInHand(); }
  else if (t < sw[0]) { f.x = P.stop; f.lean = .13; f.look = .8; sawInHand(); }
  else if (t < sw[0] + .2) lower(P.stop, 0, (t - sw[0]) / .2 + .34);
  else if (t < sw[0] + .9) kneel(0, P.bx[0], sw[0]);
  else if (t < sw[0] + 1.3) rise(0, (t - sw[0] - .9) / .4 + .34);
  else if (t < B.run[0]) { f.x = P.bx[0]; f.lean = .06; carryAt(); }
  else if (t < B.run[1]) { const k = (t - B.run[0]) / (B.run[1] - B.run[0]); f.x = lerp(P.bx[0], P.runTo, k * k * (3 - 2 * k) * .35 + k * .65);
    f.stand = false; f.phase = f.x / 50 * Math.PI; f.amp = 34; f.lean = .26; carryAt(); }        // big quick strides
  else if (t < sw[1]) { f.x = lerp(P.runTo, P.stop2, (t - B.run[1]) / (sw[1] - B.run[1])); f.stand = false; f.phase = f.x / 34 * Math.PI; f.lean = .1; carryAt(); }
  else if (t < sw[1] + .2) lower(P.stop2, 1, (t - sw[1]) / .2 + .34);
  else if (t < sw[2] - .3) kneel(1, P.bx[1], sw[1]);
  else if (t < sw[2]) { const q = Math.floor(clamp((t - sw[2] + .3) / .2) * 2) / 2; kneel(2, lerp(P.bx[1], P.bx[2], q), sw[2]); st.kneel.G = null; }
  else if (t < sw[2] + .9) kneel(2, P.bx[2], sw[2]);
  else if (t < sw[2] + 1.3) rise(2, (t - sw[2] - .9) / .4 + .34);
  else if (t < 12.5) { const k = (t - sw[2] - 1.3) / (12.5 - sw[2] - 1.3); f.x = lerp(P.bx[2], P.lip, eo(k)); f.stand = k >= 1; f.phase = f.x / 34 * Math.PI; f.lean = .08; carryAt(); }
  else if (t < 13.0) { f.x = P.lip; f.lean = -.12 + .07 * Math.sin((t - 12.5) * TAU * 2.2) * (1 - (t - 12.5) * 1.6); carryAt(); }
  else if (t < 13.5) { f.x = lerp(P.lip, P.watch, eio((t - 13) / .5)); f.stand = false; f.phase = -f.x / 30 * Math.PI; f.lean = -.04; carryAt(); }
  else if (t < 17.5) { f.x = P.watch; f.lean = .02; carryAt(); }
  else if (t < 17.9) { f.x = lerp(P.watch, P.plant, (t - 17.5) / .4); f.stand = false; f.phase = f.x / 30 * Math.PI; f.lean = .05; carryAt(); }
  else if (t < B.mine) {                     // lift it off the shoulder upright by its head, then swing the cut foot out over the gap
    st.front = true; f.x = P.plant;
    const c0 = carry(f, len), H0 = along(c0, len * L), Hup = [f.x + 34, MEY - 300];
    if (t < 18.26) { const q = Math.floor(clamp((t - 17.9) / .2) * 3) / 3; st.cross = byHead([lerp(H0[0], Hup[0], q), lerp(H0[1], Hup[1], q)], lerp(c0.ang, -Math.PI / 2, q), len, 1); }
    else { const q = t < 18.33 ? .5 : 1, a = q < 1 ? -Math.PI * .86 : -Math.PI;    // one quick swing: upright → almost flat → laid
      st.cross = byHead([lerp(Hup[0], MY_H[0], q), lerp(Hup[1], MY_H[1], q)], a, len, lerp(1, .32, q)); f.crouch = .4 * q; f.lean = .1 + .2 * q; }
    f.hand = along(st.cross, len * L - 8); f.elbowUp = t < 18.26;
  }
  else if (t < B.tip) {                      // it lies across the empty gap — short. I hold its head end down on the lip.
    st.front = true; f.x = P.plant; f.crouch = .4; f.lean = .3;
    const tr = .01 * Math.sin(Math.floor(t * 24) / 24 * TAU * 5) * ss(18.6, 18.9, t);
    st.cross = byHead(MY_H, -Math.PI + tr, len, .32); f.hand = along(st.cross, len * L - 10); st.outline = ss(18.6, 18.9, t);
  }
  else if (t < B.fall) {                     // it tips: the far end dips over the lip, it slides out of my hands
    st.front = true; f.x = P.plant; f.crouch = .5; f.lean = .36; st.outline = 1;
    const q = Math.floor(clamp((t - B.tip) / (B.fall - B.tip)) * 4) / 4; st.cross = tipCross(q); f.hand = [MY_H[0] + 4, MY_H[1] - 6 + 10 * q];
  }
  else if (t < B.back) { f.x = P.plant; f.crouch = .6; f.lean = .38; f.hand = [XN + 4, MEY + 6]; f.look = 1; st.fall = t - B.fall; st.outline = 1 - ss(B.fall + .3, B.fall + .8, t); }
  else { const q = Math.floor(clamp((t - B.back) / .2) * 2) / 2; f.x = P.plant; f.crouch = .6 * (1 - q); f.lean = .38 * (1 - q) + .02;
    f.dir = t < B.fill[1] + .1 ? -1 : 1; if (q < 1) f.dir = 1; f.hand = null; f.look = .3; }
  return st;
}
function tipCross(q) {                      // rotate about the lip edge: the far (foot) end goes down
  const len = S.left[3], piv = [XN, MEY - BW / 2], d = .6 * q * q, base = byHead([MY_H[0] + 22 * q, MY_H[1]], -Math.PI, len, .32);
  const rot = ([x, y]) => [piv[0] + (x - piv[0]) * Math.cos(d) - (y - piv[1]) * Math.sin(d), piv[1] + (x - piv[0]) * Math.sin(d) + (y - piv[1]) * Math.cos(d)];
  const F = rot([base.fx, base.fy]); return { fx: F[0], fy: F[1], ang: -Math.PI + d, len, fore: .32 };
}
// ---------------------------------------------------------------- the others: lay it → walk over → pull it back → carry it into the light
const arrT = k => B.bridges[k] - .85;
const othX = (o, t) => o.x0 + 30 * Math.min(t, B.run[0]) + 20 * Math.max(0, t - B.run[0]);   // they slow under the weight
const BANNER = G.upright;    // carried upright before them
function othState(k, t) {
  const o = OTH[k], bk = B.bridges[k], ly = LANES[o.lane], arr = arrT(k), x12 = othX(o, 12), xFar = XF + 22;
  const f = { x: 0, y: ly, s: o.s, dir: 1, lean: .06, phase: 0, stand: false, crouch: 0, col: o.col, id: o.id, amp: 17 };
  const st = { f, cross: null, alpha: 1, laid: t >= bk && t < bk + .9 };
  const base = { len: 1, segs: SEG_OT, col: o.cross, id: o.id + 50 };
  if (t < 12) { f.x = othX(o, t); f.phase = f.x / 26 * Math.PI; }
  else if (t < arr) { f.x = lerp(x12, 1236, (t - 12) / (arr - 12)); f.phase = f.x / 34 * Math.PI; f.amp = 22; f.lean = .1; }
  else if (t < bk + .3) { f.x = 1236; f.stand = true; }
  else if (t < bk + .9) { f.x = lerp(1236, xFar, (t - bk - .3) / .6); f.phase = f.x / 40 * Math.PI; f.amp = 26; f.lean = .1;
    if (f.x > XN - 30 && f.x < XF + 10) f.y = ly - BW * .75; }
  else if (t < bk + 1.4) { f.x = xFar; f.stand = true; }
  else { f.x = lerp(xFar, DOOR.x - 8, (t - bk - 1.4) / .4); f.phase = f.x / 34 * Math.PI; st.alpha = 1 - ss(bk + 1.45, bk + 1.8, t); st.glow = ss(bk + 1.3, bk + 1.7, t); }
  if (t < arr) { st.cross = { ...base, ...carry(f, 1) }; f.hand = st.cross.grip; }
  else if (t < bk - .18) { const q = Math.floor(clamp((t - arr) / .45) * 4) / 4, a = carry(f, 1), b = { fx: FOOT0, fy: ly, ang: -Math.PI / 2, len: 1, fore: 1 };
    st.cross = { ...base, ...lerpCross(a, b, q) }; f.hand = along(st.cross, lerp(L - CB - 75, 150, q)); f.elbowUp = q > .5; }
  else if (t < bk) { const q = Math.floor(clamp((t - bk + .18) / .18) * 4) / 4;
    st.cross = { ...base, fx: FOOT0, fy: lerp(ly, ly - BW / 2, q * q), ang: -Math.PI / 2 * (1 - q * q), fore: lerp(1, .32, q * q) }; f.hand = null; }
  else if (t < bk + .9) { /* lying across: the bridge (drawn with the light) */ }
  else if (t < bk + 1.2) {                  // from the far side: hauls it over the far lip (the near end drops off the near lip, he levers it)
    f.dir = -1; const q = Math.floor(clamp((t - bk - .9) / .3) * 5) / 5, d = 150 * q, piv = [XF, ly - BW / 2], sd = (XF - FOOT0) - d, a = -.32 * ss(32, 150, d);
    st.cross = { ...base, fx: piv[0] - Math.cos(a) * sd, fy: piv[1] - Math.sin(a) * sd, ang: a, fore: .32 }; f.hand = along(st.cross, sd + 12); f.crouch = .25; f.lean = .12;
  }
  else if (t < bk + 1.4) {                  // …and lifts it upright to carry it
    const q = Math.floor(clamp((t - bk - 1.2) / .2) * 3) / 3, d = 150, a0 = -.32, sd = (XF - FOOT0) - d;
    const p0 = { fx: XF - Math.cos(a0) * sd, fy: ly - BW / 2 - Math.sin(a0) * sd, ang: a0, len: 1, fore: .32 };
    f.dir = q < .5 ? -1 : 1; st.cross = { ...base, ...lerpCross(p0, BANNER(f), q) }; f.hand = along(st.cross, 150); f.elbowUp = true;
  }
  else { st.cross = { ...base, ...BANNER(f) }; f.hand = along(st.cross, 150); f.elbowUp = true; }
  return st;
}
const bridgeOf = k => ({ fx: FOOT0, fy: LANES[OTH[k].lane] - BW / 2, ang: 0, len: 1, fore: .32, segs: SEG_OT, col: OTH[k].cross, id: OTH[k].id + 50 });
// my cross shatters as it drops off the lip: its ruby pieces scatter and fall into the dark
let SHARDS = null;
function drawShatter(c, u) {
  G.shatter(c, SHARDS, tipCross(1), u, { clip: [XN - 20, WY0, XF - XN + 40, WH], fade: [1450, 1850] });
  G.breakFlash(c, XN + 40, MEY - 10, 1 - ss(0, .35, u));                       // the hit: a ruby flash where it broke
}
// the dashed outline of my whole cross lying across the gap (head on the near lip)
function outline(c, a) {
  if (a <= 0) return; const y0 = MEY - BW, x0 = FOOT0, bx = x0 + CB, h = CBW / 2 * .32;
  const p = new Path2D(); p.rect(x0, y0, L, BW); p.rect(bx - BW / 2, MEY - BW / 2 - h, BW, 2 * h);
  c.save(); c.globalAlpha = a; c.lineJoin = 'round'; c.setLineDash([12, 9]);
  c.strokeStyle = 'rgba(20,10,8,.8)'; c.lineWidth = 6; c.stroke(p); c.strokeStyle = '#ffe9be'; c.lineWidth = 3; c.stroke(p); c.restore();
}
// light pouring across a bridge from the far (gate) end, then a residual glow
const lightFlow = G.lightFlow;
// ---------------------------------------------------------------- camera
const CAMK = [ // t, x, y, zoom, easing into this key
  [0, 505, 1215, 2.4], [1.3, 505, 1215, 2.4], [2.7, 530, 1150, 1.6, eio], [4.5, 545, 1150, 1.6], [8.6, 1010, 1150, 1.6, eio], [11.4, 1075, 1150, 1.6],
  [12.8, 1475, 1110, 1.4, eio], [19.55, 1475, 1110, 1.4], [19.7, 1410, 1250, 1.75, eo], [21.1, 1414, 1254, 1.72], [21.8, 1110, 1150, 1.5, eio],
  [22.4, 1120, 1150, 1.5], [23.3, 1430, 1140, 1.5, eio], [26.0, 1430, 1150, 1.55], [99, 1430, 1150, 1.55]];
const cam = t => G.shake(G.camKeys(CAMK, t), t, B.fall);   // 2-frame shake on the hit

// ---------------------------------------------------------------- the panel: everything that lives in the world
const spark = G.spark;
const FS = [23.66, 22.93, 22.2], DONE = B.fill[1];               // fill start per piece (nearest first)
function pieceState(k, t) {
  const P = PLAN, pc = P.piece[k], td = dropT(k); if (t < td) return null;
  const hop = Math.floor(clamp((t - td) / .16) * 2) / 2, rest = { x: pc.x0 + 9 * hop - 9, y: MEY + 6 - BW / 2 - 8 * Math.sin(hop * Math.PI), rot: pc.rot * hop };
  const t0 = FS[k]; if (t < t0) return { ...rest, pc, glow: ss(B.back + .2, B.back + .8, t) * (.55 + .25 * Math.sin((t - B.back) * 5 + k)) };
  const lift = ss(t0, t0 + .15, t), q = eio(clamp((t - t0 - .15) / .45)), dq = Math.floor(clamp((t - t0 - .6) / .13) * 2) / 2, sy = MEY - BW / 2;
  return { x: lerp(rest.x, pc.slot[0], q), y: lerp(rest.y - 40 * lift, sy - 30, q) - 90 * Math.sin(q * Math.PI) + 30 * dq, rot: lerp(rest.rot, 0, q), pc,
    arrive: t0 + .73, moving: dq < 1, glow: dq < 1 ? .7 : .25 * (1 - ss(DONE, DONE + .4, t)), trail: q > 0 && q < 1 ? q : 0, from: rest };
}
function drawPiece(c, ps, col = C.ruby, glow = 0) {
  const w = (ps.pc.u1 - ps.pc.u0) * L;
  c.save(); c.translate(ps.x, ps.y); c.rotate(ps.rot);
  piece(c, rectP(0, -BW / 2, w, BW), col, 700 + Math.round(ps.pc.u0 * 100), { lead: 4.5, mat: 9, ts: .55 });
  if (glow > 0) { c.globalCompositeOperation = 'lighter'; c.fillStyle = `rgba(255,120,110,${glow})`; c.fillRect(0, -BW / 2, w, BW); }
  c.restore();
}
function drawPanel(c, t, tf, cm) {
  G.drawWorld(c, WORLD);
  // gate light (behind the figures, in front of the wall): it leaks, and grows with each one who goes in
  const nIn = [0, 1, 2].reduce((s, k) => s + ss(B.bridges[k] + 1.45, B.bridges[k] + 1.8, t), 0), gl = .55 + .22 * nIn;
  G.doorLight(c, DOOR, gl);
  const oth = OTH.map((_, k) => othState(k, tf));
  const pcs = [0, 1, 2].map(k => pieceState(k, t));
  const me = meState(tf);
  // the others (back lanes): a bridge while it is laid, else the cross they carry; then the figure
  for (let k = 0; k < 3; k++) { const s = oth[k];
    if (s.laid) { const br = bridgeOf(k); drawCross(c, br); lightFlow(c, br, B.bridges[k], t); }
    if (s.alpha <= 0) continue;
    c.save(); c.globalAlpha = s.alpha;
    if (s.cross) drawCross(c, { ...s.cross, segs: SEG_OT, col: OTH[k].cross, id: OTH[k].id + 50 });
    drawProfile(c, s.f); c.restore();
    if (s.glow > 0) G.haloAt(c, s.f.x, s.f.y - 130 * s.f.s, s.glow * (s.alpha + .2));   // walking into the light
  }
  // the outline of my whole cross; the ghost of what is left of it; the offcuts filling the missing span
  outline(c, Math.max(me.outline || 0, ss(B.back + .3, B.back + .8, t) * (1 - ss(DONE + .2, DONE + .6, t))));
  const ghostA = ss(B.back + .3, B.back + .8, t), lit = ss(DONE, DONE + .3, t);
  if (ghostA > 0) { c.save(); c.globalAlpha = ghostA;
    if (lit > .5) drawCross(c, { fx: FOOT0 + L, fy: MEY - BW / 2, ang: Math.PI, len: 1, fore: .32, segs: SEG_ME, id: 950, col: C.ruby });
    else drawCross(c, { ...byHead(MY_H, -Math.PI, S.left[3], .32), segs: SEG_ME, id: 950, col: C.rubyDim });
    c.restore(); }
  for (let k = 0; k < 3; k++) { const ps = pcs[k]; if (!ps || (lit > .5 && !ps.moving)) continue;
    if (ps.trail > 0) for (let j = 1; j <= 3; j++) { const qq = Math.max(0, ps.trail - j * .07); c.save(); c.globalAlpha = .22 / j;
      drawPiece(c, { ...ps, x: lerp(ps.from.x, ps.pc.slot[0], qq), y: lerp(ps.from.y, MEY - BW / 2 - 30, qq) - 90 * Math.sin(qq * Math.PI) }, C.ruby, .6); c.restore(); }
    drawPiece(c, ps, C.ruby, .5 * (ps.glow || 0));
    if (ps.glow > .05) G.rubyGlow(c, ps.x + 30, ps.y, ps.glow);
    spark(c, ps.pc.slot[0], MEY - BW / 2, (t - ps.arrive) / .35, 1.3);
  }
  if (t >= DONE) lightFlow(c, { fx: FOOT0 + L, fy: MEY - BW / 2, ang: Math.PI, len: 1, fore: .32 }, DONE + .05, t, '255,120,110');
  // me
  if (me.kneel) { const k = me.kneel;
    drawKneelBody(c, k);
    if (k.G) drawSawBlade(c, k.G);
    drawCross(c, { ...me.cross, segs: SEG_ME, col: C.ruby, id: 920 });
    if (k.kerf > 0) { c.fillStyle = 'rgba(20,4,6,.9)'; c.fillRect(k.cutX - 2, MEY - BW, 4, BW * k.kerf); }
    const g = kneelGeo(k);
    drawArm(c, g.Lh, k.press, k.s, MECOL.robe2, 930, 1);                                             // left hand holds the cross down
    if (k.G) { const grip = sawPt(k.G, -9, 16); drawSawHandle(c, k.G); drawArm(c, g.R, grip, k.s, MECOL.robe2, 940, -1);
      const th = sawPt(k.G, -3, 33); piece(c, ellP(th[0], th[1], 8, 4.5, Math.atan2(SAWD[1], SAWD[0])), C.flesh, 945, { lead: 3, mat: 0, tex: false }); } // thumb on top
    else drawArm(c, g.R, [k.x - 50, MEY - BW + 2], k.s, MECOL.robe2, 940, 1);
  } else {
    const mc = me.cross && !me.fall ? { ...me.cross, segs: SEG_ME, col: C.ruby, id: 920 } : null;
    if (me.front && mc) { drawProfile(c, { ...me.f, noArm: true }); drawCross(c, mc); drawProfile(c, { ...me.f, armOnly: true }); }
    else { if (mc) drawCross(c, mc); drawProfile(c, me.f); }
  }
  for (let k = 0; k < 3; k++) { const ps = pcs[k]; if (ps && ps.moving && t >= FS[k]) drawPiece(c, ps, C.ruby, .5); }
  if (me.fall != null) drawShatter(c, me.fall);      // the hit: my ruby cross breaks off the lip and falls into the dark
  return me;
}

// ---------------------------------------------------------------- init + draw
async function init() {
  G.init(); buildWorld(); plan(); SHARDS = G.shards(S.left[3], 44);
}
function draw(ctx, t) {
  const tf = G.step(t), cm = cam(t);
  G.begin(ctx);                                         // the sky quarries
  G.panel(ctx, cm, c => drawPanel(c, t, tf, cm));       // the living panel
  // light: brightest in the middle of the lancet, falling off to the lead border; dims a little after the fall
  const dim = 1 - .2 * ss(B.fall, B.fall + .3, t) * (1 - ss(21.0, 21.8, t));
  G.glaze(ctx, dim);                                    // light → stone frame → bloom → inscription band
  G.captions(ctx, t, S.lines);
  G.endCard(ctx, t, S.endCard, B.end);                  // a cloud covers the sun; the card on a white-glass plate
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: G.FONTS, init, draw });
</script>
