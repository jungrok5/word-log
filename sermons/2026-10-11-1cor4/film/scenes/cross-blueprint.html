<!doctype html>
<html lang="ko">

<title>잘라 낸 건 다리였다 · ① 청사진</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">

<body>

<script src="story.js"></script>
<script src="source.js"></script>
<script src="script.js"></script>

<script>
/* 잘라 낸 건 다리였다 — ① Blueprint (cyanotype engineering drawing; after OPUSCAR no. 30, The Bridge on the River Kwai).
   The whole film is one sheet of Prussian-blue paper: white line work, section hatching, centre lines, dimension lines.
   The road is drawn in cabinet-oblique (depth recedes up and a little right), so the lanes of the procession, the
   chasm and the crosses laid across it read as one technical drawing. My cross is the only thing in red correction
   pencil, and its dimension is corrected after every cut (3.0 → 2.4 → 1.86 → 1.44 m). The chasm carries the dimension
   "필요 길이 3.0 m"; at the decisive moment a red dimension shows the shortfall (−1.56 m); at the end the pieces I cut
   (0.6 + 0.54 + 0.42) slide, as phantom lines, into exactly that gap.
   World units are metres: x along the road (the chasm's near edge at x = 0), y up, d depth (0 = my lane).
   Style (sheet, line work, dimensions, figures, beams, road/chasm/gate, captions, end card) comes from the blueprint kit
   (kit-blueprint.js = styles/blueprint/kit.js); this file keeps only the story: the saw, the procession, the cuts, the numbers. */
const S = window.SCRIPT, B = S.beat, W = Pilot.W, H = Pilot.H;
const { clamp, lerp, ss, eo, eio } = Pilot;
const BP = Blueprint, KX = BP.KX, KY = BP.KY, SANS = BP.SANS, INK = BP.INK, RED = BP.RED, HAIR = BP.HAIR, THIN = BP.THIN;
const LEN = S.left.map(k => +(3 * k).toFixed(2));        // my cross: 3, 2.4, 1.86, 1.44 m
const PIECE = [0, 1, 2].map(k => +(LEN[k] - LEN[k + 1]).toFixed(2));   // .6 .54 .42
const SHORT = +(3 - LEN[3]).toFixed(2);                  // 1.56
const GAP = 2.6, FOOT = -.2, END = 2.8, GX = 3.5, ROAD0 = -1.6, ROAD1 = 3.9, DEEP = -8;
const { fmt, add, sub, mul, mix3, nrm, keys, P, P3, LW, PL, line, dim, label, beams, mixPose, walkPose, kneelPose, mixX } = BP;
const carryCross = BP.shoulder, carryHands = BP.carryHands, drawCross = BP.cross, drawFigure = BP.figure;

// ---------------------------------------------------------------- the saw (a hand saw seen side-on: blade, teeth, closed handle)
const SB = [.883, -.469], SN = [.469, .883];
function sawAt(xc, y0, s) { const u0 = .3 - s, O = [xc - SB[0] * u0, y0 - SB[1] * u0]; return (u, v) => [O[0] + SB[0] * u + SN[0] * v, O[1] + SB[1] * u + SN[1] * v]; }
function drawSaw(g, sw, d) {
  const L = (u, v) => { const q = sw(u, v); return P(q[0], q[1], d); }, z = BP.cam.z, lw = LW(2);
  g.save(); g.lineJoin = 'round';
  const blade = [L(0, 0), L(.56, 0), L(.58, .07), L(0, .125)];
  PL(g, blade, true); g.fillStyle = BP.paper(); g.fill(); g.strokeStyle = INK; g.lineWidth = lw; g.stroke();
  g.beginPath(); for (let i = 0; i < 18; i++) { const u = .02 + i * .03, a = L(u, 0), b = L(u + .015, -.02), c = L(u + .03, 0); if (!i) g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); }
  g.lineWidth = LW(1.1); g.stroke();
  line(g, [L(.04, .035), L(.5, .03)], HAIR, INK, { alpha: .55, nib: false });
  const hd = [L(0, -.01), L(-.05, -.035), L(-.16, -.025), L(-.2, .06), L(-.16, .17), L(-.03, .16), L(0, .13)];
  const hole = [L(-.045, .025), L(-.11, .025), L(-.13, .075), L(-.1, .13), L(-.045, .12)];
  PL(g, hd, true); g.fillStyle = BP.paper(); g.fill(); g.lineWidth = lw; g.stroke();
  PL(g, hole, true); g.lineWidth = LW(1.3); g.stroke();
  for (const [u, v] of [[-.015, .03], [-.015, .1]]) { const p = L(u, v); g.beginPath(); g.arc(p[0], p[1], .008 * z, 0, 7); g.stroke(); }   // rivets
  g.restore();
}

// ---------------------------------------------------------------- the story in space and time
const SAW = B.saw, TD = SAW.map(s => s + .8);            // piece drops .8 s after each saw beat
const ME0 = -5.5, K1 = -4.4, K2 = -1.6, MEE = -.6, DC = -.75, DK = -.55;   // kneel spots; the cut lies at depth DC
const XC = [K1 + .75, K2 + .75, K2 + .75], ROLL = [.16, .3, -.28];
const V0 = .1, XL = -.45, WALK2 = .9;
const OTH = [{ d: 2.6, x0: -4.9, T: B.bridges[0] }, { d: 1.8, x0: -4.6, T: B.bridges[1] }, { d: 1.0, x0: -7.6, T: B.bridges[2] }];
const T_UP = 17.9, T_LOW = 18.1;                          // my cross: upright, then lowered to lie short by B.mine

function meX(t) {
  if (t < SAW[0]) return ME0 + (K1 - ME0) * t / SAW[0] + .04 * Math.sin(t * Math.PI * 2 / 1.6);   // stagger
  if (t < B.run[0]) return K1;
  if (t < B.run[1]) { const u = (t - B.run[0]) / (B.run[1] - B.run[0]); return lerp(K1, K2 - .25, 1 - Math.pow(1 - u, 1.7)); }
  if (t < SAW[1]) return lerp(K2 - .25, K2, (t - B.run[1]) / (SAW[1] - B.run[1]));
  if (t < 11.65) return K2;
  return lerp(K2, MEE, ss(11.65, 12.75, t));
}
function mePhase(t) {
  const a = meX(Math.min(t, SAW[0])) - ME0, b = t > B.run[0] ? meX(Math.min(t, SAW[1])) - K1 : 0, c = t > 11.65 ? meX(Math.min(t, 12.75)) - K2 : 0;
  return Math.PI * 2 * (a / .9 + b / 1.05 + c / 1.2) + .5;
}
const AMP_ME = [[0, .24], [3.1, .24], [3.3, 0], [4.42, 0], [4.7, .6], [8.3, .6], [8.7, .3], [8.98, 0], [11.6, 0], [11.85, .4], [12.45, .4], [12.75, 0]];
const kwSaw = t => ss(SAW[0], SAW[0] + .25, t) - ss(4.4, 4.62, t) + ss(SAW[1], SAW[1] + .25, t) - ss(11.4, 11.65, t);
const kwMe = t => kwSaw(t) + ss(17.7, 17.95, t) - ss(B.back, B.back + .3, t);
const nCut = t => (t >= TD[0]) + (t >= TD[1]) + (t >= TD[2]);
const meFace = t => t < B.back + .05 ? 1 : t < B.fill[0] - .1 ? lerp(1, -1, ss(B.back + .05, B.back + .3, t)) : lerp(-1, 1, ss(B.fill[0] - .1, B.fill[0] + .15, t));

function groundCross(k, cut) {
  const L = cut ? LEN[k + 1] : LEN[k], foot = cut ? DC : DC - PIECE[k];
  return { foot: [XC[k], .065, foot], top: [XC[k], .065, foot + L], bar: [1, 0, 0], L };
}
// the saw as a frame: grip point G (3D), blade angle a; L(u, v) in blade coordinates (grip at u −.165, v .075)
const sawFrame = (G, a) => { const b = [Math.cos(a), Math.sin(a)], n = [-Math.sin(a), Math.cos(a)];
  return (u, v) => [G[0] + b[0] * (u + .165) + n[0] * (v - .075), G[1] + b[1] * (u + .165) + n[1] * (v - .075)]; };
const A_CUT = Math.atan2(SB[1], SB[0]), A_HANG = -1.2;
function cutSaw(t, k) {   // the saw at work on cut k
  const tb = SAW[k], act = ss(tb + .3, tb + .36, t) * (1 - ss(tb + .78, tb + .95, t));
  const stroke = .085 * Math.sin((t - tb - .3) * Math.PI * 2 * 4.6) * ss(tb + .3, tb + .36, t) * (1 - ss(tb + .76, tb + .8, t));
  const sink = .1 * ss(tb + .32, tb + .78, t) * (1 - ss(tb + .78, tb + .95, t)), y0 = .13 - sink + .1 * (1 - act);
  const g = sawAt(XC[k], y0, stroke)(-.165, .075);
  return { G: [g[0], g[1], DC], a: A_CUT, act, k, xc: XC[k], tb };
}
const hangHand = (F, sw) => add(F.sh, [(-.02 + .1 + .14 * Math.sin(F.ph) * sw) * F.f, -.6, -.14]);
function sawState(t, F) {     // where the saw is: hanging in my right hand, at work, or put down at the edge
  let k = -1; if (t >= SAW[0] && t < 4.62) k = 0; else if (t >= SAW[1] && t < 11.65) k = t < 10.2 ? 1 : 2;
  const swing = keys(AMP_ME, t) > .3 ? .9 : .3, hang = { G: hangHand(F, swing), a: A_HANG + .25 * Math.sin(F.ph) * swing, act: 0 };
  let s;
  if (k < 0) s = hang;
  else { const c = cutSaw(t, k), w = k === 0 ? ss(SAW[0], SAW[0] + .3, t) * (1 - ss(4.4, 4.62, t)) : ss(SAW[1], SAW[1] + .3, t) * (1 - ss(11.4, 11.65, t));
    s = w >= 1 ? c : { ...c, G: mix3(hang.G, c.G, w), a: lerp(hang.a, c.a, w), act: c.act * w }; }
  const put = ss(17.35, 17.7, t);                         // laid down beside me before I kneel at the edge
  if (put > 0) { const Gd = [MEE - .75, .03, -.5]; s = { G: mix3(s.G, Gd, put), a: lerp(s.a, -.05, put), act: 0, down: put >= 1 }; }
  s.sw = sawFrame(s.G, s.a); s.d = s.G[2];
  return s;
}
// me: pose, cross, hands
function meState(t) {
  const f = meFace(t), x = meX(t), kw = clamp(kwMe(t)), ksaw = clamp(kwSaw(t));
  const d = DK * ksaw, run = t > B.run[0] && t < B.run[1] + .2, heavy = t < 4.5 ? 1 : run ? .55 : .2;
  const Wp = walkPose(x, d, f, mePhase(t), keys(AMP_ME, t), heavy);
  if (run) { const b = .05 * Math.abs(Math.sin(mePhase(t))) * ss(4.6, 4.9, t); for (const q of [Wp.hip, Wp.sh, Wp.head]) q[1] += b; }   // bounding stride
  if (t < 3.6) { const s = 1 - ss(3.1, 3.3, t);            // stagger: the load sways me
    Wp.sh[0] += .05 * Math.sin(t * 3.9) * s; Wp.sh[1] -= .035 * Math.abs(Math.sin(t * 2.1)) * s; Wp.head[0] += .06 * Math.sin(t * 3.9 - .4) * s; Wp.head[1] -= .04 * Math.abs(Math.sin(t * 2.1)) * s; }
  const F = mixPose(Wp, kneelPose(x, d, f), kw);
  if (t > B.fall && t < B.back + .1) { const k = ss(B.fall, B.fall + .3, t) * (1 - ss(B.back - .2, B.back + .1, t)); F.head = add(F.head, [.05 * k, -.06 * k, 0]); }   // looks down
  const saw = t < B.back + 6 ? sawState(t, F) : null;
  let X = null, hands = [null, null], thumb = null, farOver = false;
  const cutHands = k => [saw.G, [XC[k], .13, DC + .24]];
  const carryH = C => [saw && !saw.down ? saw.G : null, add(C.C, mul(C.bar, -.36))];
  const blend = (A, Bh, k) => A.map((h, i) => h && Bh[i] ? mix3(h, Bh[i], k) : (k < .5 ? h : Bh[i]));
  if (t < SAW[0]) { X = carryCross(F, 3, true); hands = carryH(X); farOver = true; }
  else if (t < SAW[0] + .3) { const C = carryCross(F, 3, true), k = ss(SAW[0], SAW[0] + .3, t); X = mixX(C, groundCross(0, false), k); hands = blend(carryH(C), cutHands(0), k); farOver = k < .5; }
  else if (t < 4.4) { X = groundCross(0, t >= TD[0]); hands = cutHands(0); }
  else if (t < 4.62) { const C = carryCross(F, LEN[1], false), k = ss(4.4, 4.62, t); X = mixX(groundCross(0, true), C, k); hands = blend(cutHands(0), carryH(C), k); farOver = k > .5; }
  else if (t < SAW[1]) { X = carryCross(F, LEN[1], false); hands = carryH(X); farOver = true; }
  else if (t < SAW[1] + .3) { const C = carryCross(F, LEN[1], false), k = ss(SAW[1], SAW[1] + .3, t); X = mixX(C, groundCross(1, false), k); hands = blend(carryH(C), cutHands(1), k); farOver = k < .5; }
  else if (t < 10.0) { X = groundCross(1, t >= TD[1]); hands = cutHands(1); }
  else if (t < 10.35) { X = mixX(groundCross(1, true), groundCross(2, false), ss(10.0, 10.35, t)); hands = cutHands(2); }
  else if (t < 11.4) { X = groundCross(2, t >= TD[2]); hands = cutHands(2); }
  else if (t < 11.65) { const C = carryCross(F, LEN[3], false), k = ss(11.4, 11.65, t); X = mixX(groundCross(2, true), C, k); hands = blend(cutHands(2), carryH(C), k); farOver = k > .5; }
  else if (t < T_UP) { X = carryCross(F, LEN[3], false); hands = carryH(X); farOver = true; }
  else {
    const L = LEN[3], foot = [FOOT, .065, 0], up = { foot, top: [FOOT, .065 + L, 0], bar: [-1, 0, 0], L };
    const grip = Xx => { const u = nrm(sub(Xx.top, Xx.foot)); return [add(Xx.foot, mul(u, .08)), add(Xx.foot, mul(u, .24))]; };
    if (t < T_LOW) { const C = carryCross(F, L, false), k = ss(T_UP, T_LOW, t); X = mixX(C, up, k); hands = blend(carryH(C), grip(up), k); }
    else if (t < B.tip) { const a = Math.PI / 2 * (1 - eio(clamp((t - T_LOW) / (B.mine - T_LOW)))); X = { foot, top: [FOOT + L * Math.cos(a), .065 + L * Math.sin(a), 0], bar: [-Math.sin(a), Math.cos(a), 0], L }; hands = grip(X); }
    else {
      let phi, piv; const T1 = B.tip, T2 = B.fall;
      if (t < T2) { phi = -6 * (t - T1) ** 2; piv = [0, .065]; } else { const q = t - T2, p0 = -6 * (T2 - T1) ** 2; phi = p0 - 3.2 * q - 2 * q * q; piv = [.35 * q, .065 - .6 * q - 4.9 * q * q]; }
      const c = Math.cos(phi), s = Math.sin(phi);
      X = { foot: [piv[0] + FOOT * c, piv[1] + FOOT * s, 0], top: [piv[0] + (FOOT + L) * c, piv[1] + (FOOT + L) * s, 0], bar: [-s, c, 0], L, falling: true };
      if (X.top[1] < DEEP && X.foot[1] < DEEP) X = null;
      const h0 = [[FOOT + .08, .1, 0], [FOOT + .24, .1, 0]], k = ss(B.fall + .15, B.fall + .7, t);
      hands = k < 1 ? h0.map((h, i) => mix3(h, [F.sh[0] + .1 * f, .36, F.sh[2] + (i ? .14 : -.14)], k)) : [null, null];   // empty hands sink back to the knees
      if (t > B.back) hands = [null, null];
    }
  }
  if (saw && saw.k != null && saw.k >= 0 && saw.act > .05) { const q = saw.sw(-.06, .15); thumb = [q[0], q[1], saw.d]; }
  return { F, X, hands, saw, thumb, f, farOver };
}
// a cut piece: drops, rolls a quarter turn and lies across the road (so its whole length reads); then, at `fill`, flies into the gap
function pieceRest(k) { const c = [XC[k] + ROLL[k], .065, DC - PIECE[k] / 2 - .3]; return { a: add(c, [-PIECE[k] / 2, 0, 0]), b: add(c, [PIECE[k] / 2, 0, 0]) }; }
const SLOT = (() => { let s = FOOT; return PIECE.map(p => { const r = { a: [s, .065, 0], b: [s + p, .065, 0] }; s += p; return r; }); })();   // the foot end of the whole cross, piece 1 first
const flyT = k => [B.fill[0] + .62 * k, B.fill[0] + .62 * k + .9];
function pieceGeom(k, t) {
  if (t < TD[k]) return null;
  const u = eo(clamp((t - TD[k]) / .45)), hop = .1 * Math.sin(Math.PI * clamp((t - TD[k]) / .3)), xc = XC[k];
  const a0 = [xc, .065, DC - PIECE[k]], b0 = [xc, .065, DC], R = pieceRest(k);
  let a = add(mix3(a0, R.a, u), [0, hop, 0]), b = add(mix3(b0, R.b, u), [0, hop, 0]);
  const [f0, f1] = flyT(k), v = eio(clamp((t - f0) / (f1 - f0)));
  if (v > 0) { const lift = 1.3 * Math.sin(Math.PI * v); a = add(mix3(a, SLOT[k].a, v), [0, lift, 0]); b = add(mix3(b, SLOT[k].b, v), [0, lift, 0]); }
  return { a, b, flying: v > 0 && v < 1, landed: v >= 1 };
}
// the others: walk, lay the cross across, cross over, haul it back onto the shoulder on the far side, go into the light
function othState(o, t) {
  const T = o.T, tUp = T - .7, foot = [FOOT, .065, o.d], up = { foot, top: [FOOT, 3.065, o.d], bar: [-1, 0, 0], L: 3 };
  let x, mode;
  if (t < 12) x = o.x0 + V0 * t;
  else if (t < tUp) x = XL - WALK2 * (tUp - t);
  else if (t < T + .15) x = XL;
  else if (t < T + .9) x = lerp(XL, 3.05, (t - T - .15) / .75);
  else if (t < T + 1.4) x = lerp(3.05, 3.2, ss(T + .9, T + 1.4, t));
  else x = lerp(3.2, 3.9, (t - T - 1.4) / .4);
  const ph = Math.PI * 2 * (x - o.x0) / (t > T + .1 && t < T + .9 ? 1.6 : .85) + o.d * 1.7;
  let amp = t < tUp ? .26 * (1 - ss(tUp - .2, tUp, t)) : t < T + .1 ? 0 : t < T + .9 ? .55 * ss(T + .1, T + .25, t) * (1 - ss(T + .8, T + .9, t)) : t < T + 1.4 ? 0 : .3;
  const heavy = t < T ? 1 : t < T + .9 ? .2 : .5, yb = .13 * ss(-.3, -.05, x) * (1 - ss(GAP + .05, END + .1, x));
  let F = walkPose(x, o.d, 1, ph, amp, heavy, yb);
  const bend = t > T + .85 && t < T + 1.45 ? Math.sin(Math.PI * clamp((t - T - .85) / .6)) * .55 : 0;   // stoops to grab the end
  if (bend > 0) F = mixPose(F, kneelPose(x, o.d, 1), bend);
  const alpha = 1 - ss(GX - .1, GX + .35, x);
  let X, hands = [null, null];
  const grip = Xx => { const u = nrm(sub(Xx.top, Xx.foot)); return [add(Xx.foot, mul(u, 1.12)), add(Xx.foot, mul(u, 1.36))]; };
  const bridge = { foot: [FOOT, .065, o.d], top: [END, .065, o.d], bar: [0, 1, 0], L: 3 };
  if (t < tUp) { X = carryCross(F, 3, true); hands = carryHands(X); }
  else if (t < T - .35) { const C = carryCross(F, 3, true), k = ss(tUp, T - .35, t); X = mixX(C, up, k); hands = carryHands(C).map((h, i) => mix3(h, grip(up)[i], k)); }
  else if (t < T) { const u = clamp((t - T + .35) / .35), a = Math.PI / 2 * (1 - u * u); X = { foot, top: [FOOT + 3 * Math.cos(a), .065 + 3 * Math.sin(a), o.d], bar: [-Math.sin(a), Math.cos(a), 0], L: 3 };
    const k = ss(.15, .45, u); hands = grip(X).map((h, i) => mix3(h, add(F.sh, [.08, -.56, i ? .14 : -.14]), k)); }
  else if (t < T + .9) { const q = t - T, b = .03 * Math.exp(-q * 9) * Math.abs(Math.sin(q * 26)); X = { ...bridge, foot: [FOOT, .065 + b * .3, o.d], top: [END, .065 + b, o.d], laid: true }; }
  else {   // hauled back: the near end lifts off the lip as he raises the far end onto his shoulder
    const C = carryCross(F, 3, false), k = eio(clamp((t - T - 1.0) / .4));
    X = mixX(bridge, C, k); X.laid = k < .05;
    const endP = [END, .13, o.d]; hands = k <= 0 ? [endP, add(endP, [-.15, 0, 0])] : carryHands(C).map((h, i) => mix3(i ? add(endP, [-.15, 0, 0]) : endP, h, k));
  }
  return { F, X, hands, alpha, x, swing: amp > .2 ? 1 : 0 };
}


// ---------------------------------------------------------------- camera (hard cuts on the beats, like turning to the next figure)
function camGap(t) {
  if (t < 18.0) return { cx: 1.4, cy: 1.3, z: 165 + 8 * ss(B.gap, 18, t) };
  const k = eio(clamp((t - 18.0) / .5)), c = { cx: lerp(1.4, .95, k), cy: lerp(1.3, .55, k), z: lerp(173, 205, k) };
  return BP.hitCam(c, t, B.fall, { cx: 1.0, cy: -.3 });   // the hit: snap down into the chasm, shake, keep creeping in
}
function cam(t) {
  const close = k => { const xc = XC[k], t0 = SAW[k === 2 ? 1 : k]; return { cx: xc - .3 + KX * DC, cy: .42 + KY * DC, z: 265 + 9 * (t - t0) }; };
  if (t < SAW[0]) { const k = eio(clamp((t - 1.5) / 1.2)), x = meX(t);   // close on me, the saw in my hand → the procession
    return { cx: lerp(x + .2, x + .9, k), cy: lerp(.95, 1.3, k), z: lerp(330, 182, k) }; }
  if (t < B.run[0]) return close(0);
  if (t < SAW[1]) return { cx: meX(t) + .2 + .2 * ss(B.run[0], 5.6, t), cy: 1.15, z: 178 };
  if (t < B.gap) return close(1);
  if (t < B.back) return camGap(t);
  const c0 = camGap(B.back), c1 = { cx: -1.75, cy: .45, z: 215 }, c2 = { cx: .95, cy: .05, z: 215 };
  const k = eio(clamp((t - B.back) / .9)), k2 = eio(clamp((t - B.fill[0]) / 1.4));
  const a = { cx: lerp(c0.cx, c1.cx, k), cy: lerp(c0.cy, c1.cy, k), z: lerp(c0.z, c1.z, k) };
  return { cx: lerp(a.cx, c2.cx, k2), cy: lerp(a.cy, c2.cy, k2), z: lerp(a.z, c2.z, k2) };
}

// ---------------------------------------------------------------- the ground: road band, the chasm, the gate
function road(g, t) { BP.road(g, t >= B.gap ? [[-16, 0], [GAP, 12]] : [[-16, 12]], { d0: ROAD0, d1: ROAD1, lane: 1.15 }); }
function chasm(g, t) {
  BP.chasm(g, { x0: 0, x1: GAP, d0: ROAD0, d1: ROAD1, deep: DEEP, k: ss(B.gap, B.gap + .6, t), kf: ss(B.gap, B.gap + .3, t),
    label: '단면 B–B', labelA: ss(B.gap + .4, B.gap + .8, t) });
}
function doorGap(t) { let b = 0; for (const o of OTH) { const ta = o.T + 1.65; b = Math.max(b, ss(ta - .4, ta, t) * (1 - ss(ta + .4, ta + .9, t))); } return .1 + .5 * b; }
function gate(g, t) {
  BP.gate(g, { x: GX, d0: -1.0, d1: 3.4, h: 2.7, mid: 1.2, gap: doorGap(t), k: ss(B.gap + .15, B.gap + .9, t), light: ss(B.gap + .3, B.gap + 1.1, t), road0: ROAD0, road1: ROAD1 });
}
function gateGlow(g, t) { BP.glow(g, P(GX, 1.35, 1.2), 2.3 * BP.cam.z, ss(B.gap + .3, B.gap + 1.2, t)); }

// ---------------------------------------------------------------- everything that stands on the road
let ME = null;
const closeUp = t => (t >= SAW[0] && t < B.run[0]) || (t >= SAW[1] && t < B.gap);
function drawMe(g, m, t, o = {}) {
  const red = { col: RED, red: true, alpha: o.alpha }, kerf = m.saw && m.saw.k >= 0 && t < TD[m.saw.k] && m.saw.act > .2 ? PIECE[m.saw.k] : null;
  const crossNow = () => m.X && drawCross(g, m.X, { ...red, kerf });
  const sawNow = () => m.saw && !m.saw.down && (drawSaw(g, m.saw.sw, m.saw.d), m.saw.act > .3 && sawdust(g, t, m.saw));
  if (m.saw && m.saw.down) drawSaw(g, m.saw.sw, m.saw.d);
  if (m.X && !m.X.falling && m.X.bar[0] === 1) {       // lying on the ground for sawing: cross first, then me over it, the saw in my hand
    crossNow(); drawFigure(g, m.F, { hands: m.hands, thumb: m.thumb, mid: sawNow, alpha: o.alpha });
  } else drawFigure(g, m.F, { hands: m.hands, thumb: m.thumb, mid: () => { crossNow(); sawNow(); }, farOver: m.farOver, alpha: o.alpha, swing: .6 });
}
function entities(g, t) {
  for (const o of OTH) {   // far lanes first
    const s = othState(o, t); if (s.alpha <= 0) continue;
    const a = closeUp(t) ? .28 : t < 2.8 ? lerp(.28, 1, ss(1.7, 2.8, t)) : 1, crossFn = () => s.X && drawCross(g, s.X, { alpha: a });
    if (s.X && s.X.laid) { drawCross(g, s.X, { alpha: a }); drawFigure(g, s.F, { alpha: s.alpha * a, swing: s.swing, hands: s.hands }); }
    else drawFigure(g, s.F, { hands: s.hands, mid: crossFn, alpha: s.alpha * a, farOver: false });
  }
  for (let k = 0; k < 3; k++) { const p = pieceGeom(k, t); if (p && !p.flying && !p.landed) drawPiece(g, p.a, p.b, { glow: glowK(t) }); }
  const m = ME = meState(t);
  drawMe(g, m, t);
}
const glowK = t => ss(B.back + .2, B.back + .8, t);
const drawPiece = (g, a, b, o = {}) => BP.accentPlank(g, a, b, o);   // a cut piece: red pencil, glowing once I look back
function sawdust(g, t, s) {
  const r = Pilot.rng(Math.floor(t * 30) + 5);
  g.save(); g.fillStyle = INK;
  for (let i = 0; i < 9; i++) { const q = r(), p = P(s.xc + (r() - .5) * .16, .1 - q * .12, DC - .02 - r() * .1); g.globalAlpha = .7 * (1 - q); g.fillRect(p[0], p[1], 2.5, 2.5); }
  g.restore();
}

// ---------------------------------------------------------------- annotations: few numbers, big, in red pencil where they are mine
const crossDim = (g, X, off, lab, o = {}) => dim(g, P3(X.foot), P3(X.top), off * BP.cam.z, lab, o);
function annotations(g, t) {
  const m = ME, n = nCut(t), fade = 1 - ss(B.end - .3, B.end, t);
  // my length, corrected after every cut
  if (m.X && t < T_UP) {
    const lying = m.X.bar[0] === 1, settled = lying ? (t > SAW[0] + .32 && t < 4.4) || (t > SAW[1] + .32 && t < 11.4) : !(t > 4.4 && t < 4.64) && !(t > 11.4 && t < 11.67) && !(t > SAW[0] && t < SAW[0] + .32) && !(t > SAW[1] && t < SAW[1] + .32);
    if (settled && !(t < 1.6)) {
      const off = lying ? .8 : -.62, last = n ? TD[n - 1] : -9, fresh = t - last, sz = lying ? 64 : 56;
      const k = n && fresh < .5 ? ss(0, .4, fresh) : t < 2.2 ? ss(1.6, 2.2, t) : 1;
      if (n && fresh < 1.6 && lying) {   // the old figure struck through, the new one lettered beside it
        const a = P3(m.X.foot), b = P3(m.X.top), dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy), nx = -dy / l, ny = dx / l, mm = [(a[0] + b[0]) / 2 + nx * (off * BP.cam.z + 92), (a[1] + b[1]) / 2 + ny * (off * BP.cam.z + 92)];
        let ang = Math.atan2(dy, dx); if (ang < -Math.PI / 2) ang += Math.PI; if (ang > Math.PI / 2) ang -= Math.PI;
        BP.strikeOld(g, mm[0], mm[1], ang, fmt(LEN[n - 1]) + ' m', fresh);
      }
      crossDim(g, m.X, off, fmt(LEN[n]) + ' m', { col: RED, red: true, k, size: sz, weight: 800 });
    }
  }
  if (t < B.gap) return;
  const rowY = r => -.72 - .62 * r;
  const row = (x0, x1, r, lab, o) => dim(g, P(x0, rowY(r), 0), P(x1, rowY(r), 0), 0, lab, o);
  // the gap's requirement, hung from the bearings
  const kq = ss(B.gap + .5, B.gap + 1.1, t) * fade;
  if (kq > 0) { line(g, [P(FOOT, -.02, 0), P(FOOT, rowY(1) - .1, 0)], THIN, INK, { k: kq, nib: false }); line(g, [P(END, -.02, 0), P(END, rowY(1) - .1, 0)], THIN, INK, { k: kq, nib: false }); row(FOOT, END, 1, '필요 길이 3.0 m', { k: kq, size: 50, weight: 700 }); }
  // each bridge fits — while it lies there
  for (const o of OTH) { const a = ss(o.T + .05, o.T + .2, t) * (1 - ss(o.T + .8, o.T + 1.0, t)); if (a > 0) { const p = P(1.3, .62, o.d); label(g, '3.0 m ✓', p[0], p[1], { alpha: a, size: 46, weight: 800, patch: true }); } }
  // mine: short — and the red shortfall, over a dashed outline of the whole span
  const km = ss(B.mine, B.mine + .25, t) * (1 - ss(B.back + .3, B.back + .8, t));
  if (km > 0) {
    const ko = ss(B.mine + .15, B.mine + .5, t);
    drawCross(g, { foot: [FOOT, .065, 0], top: [END, .065, 0], bar: [0, 1, 0], L: 3 }, { col: INK, dash: [14, 8], hollow: true, alpha: .7 * ko * km });
    line(g, [P(FOOT + LEN[3], .0, 0), P(FOOT + LEN[3], rowY(0) - .1, 0)], THIN, RED, { k: km, nib: false });
    line(g, [P(END, .0, 0), P(END, rowY(0) - .1, 0)], THIN, RED, { k: km, nib: false });
    row(FOOT + LEN[3], END, 0, '−' + fmt(SHORT) + ' m', { col: RED, red: true, k: km * ss(B.mine + .1, B.mine + .4, t), weight: 800, size: 74 });
  }
  // the whole cross, dashed, waits for its missing foot: my 1.44 m as a ghost at the top end
  const kw = ss(B.back + .4, B.back + 1.0, t);
  if (kw > 0) {
    drawCross(g, { foot: [FOOT, .065, 0], top: [END, .065, 0], bar: [0, 1, 0], L: 3 }, { col: RED, dash: [14, 8], hollow: true, alpha: .9 * kw * fade });
    beams(g, [[P(END - LEN[3], .065, 0), P(END, .065, 0), .13 * BP.cam.z]], { col: RED, dash: [6, 6], hollow: true, tint: 'rgba(255,93,77,.16)', alpha: kw * fade });
  }
  // the pieces: their lengths while they glow on the road, then each one flies into its slot
  if (t >= B.back) for (let k = 0; k < 3; k++) {
    const p = pieceGeom(k, t), [f0] = flyT(k);
    if (p.flying || p.landed) drawPiece(g, p.a, p.b, { glow: p.landed ? glowK(t) * .7 : 1, t: t * 6 });
    const la = ss(B.back + .5 + .2 * k, B.back + .9 + .2 * k, t) * (1 - ss(f0 - .05, f0 + .2, t));
    if (la > 0) { const c = P3(mix3(p.a, p.b, .5)); g.save(); g.translate(c[0], c[1] + (k === 2 ? 78 : -66)); g.rotate(-.05); label(g, fmt(PIECE[k]) + ' m', 0, 0, { col: RED, size: 46, weight: 800, alpha: la, patch: true }); g.restore(); }
  }
  const ks = ss(B.fill[1] - .1, B.fill[1] + .5, t) * fade;
  if (ks > 0) { g.save(); const c = P((FOOT + END) / 2, rowY(0), 0); g.translate(c[0], c[1]); g.rotate(-.03);
    label(g, PIECE.map(fmt).join(' + ') + ' = ' + fmt(SHORT) + ' m', 0, 18, { col: RED, size: 46, weight: 800, alpha: ks, patch: true }); g.restore(); }
}

// ---------------------------------------------------------------- frame
function draw(ctx, t) {
  BP.setCam(cam(t));
  BP.sheet(ctx);
  road(ctx, t);
  if (t >= B.gap) { chasm(ctx, t); gate(ctx, t); }
  entities(ctx, t);
  if (t >= B.gap) gateGlow(ctx, t);
  annotations(ctx, t);
  BP.finish(ctx);
  BP.negative(ctx, t, B.fall);                       // two frames of negative on the hit
  BP.captions(ctx, t, S.lines);                      // title-block boxes + captions
  BP.endCard(ctx, t, S.endCard, B.end);
}
async function init() { BP.init(); }
Pilot.run({ W, H, dur: S.DUR, fonts: BP.FONTS, init, draw });
</script>
