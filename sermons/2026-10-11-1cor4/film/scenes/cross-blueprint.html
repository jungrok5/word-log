<!doctype html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">

<script>
/* 잘라 낸 건 다리였다 — ① Blueprint (cyanotype engineering drawing; after OPUSCAR no. 30, The Bridge on the River Kwai).
   The whole film is one sheet of Prussian-blue paper: white line work, section hatching, centre lines, dimension lines.
   The road is drawn in cabinet-oblique (depth recedes up and a little right), so the lanes of the procession, the
   chasm and the crosses laid across it read as one technical drawing. My cross is the only thing in red correction
   pencil, and its dimension is corrected after every cut (3.0 → 2.4 → 1.86 → 1.44 m). The chasm carries the dimension
   "필요 길이 3.0 m"; at the decisive moment a red dimension shows the shortfall (−1.56 m); at the end the pieces I cut
   (0.6 + 0.54 + 0.42) slide, as phantom lines, into exactly that gap.
   World units are metres: x along the road (the chasm's near edge at x = 0), y up, d depth (0 = my lane). */
const S = window.SCRIPT, B = S.beat, W = Pilot.W, H = Pilot.H;
const { clamp, lerp, ss, eo, eio } = Pilot;
const SANS = "'Noto Sans KR',sans-serif", SERIF = "'Noto Serif KR',serif";
const FONTS = ["600 54px 'Noto Sans KR'", "500 28px 'Noto Sans KR'", "700 30px 'Noto Sans KR'", "400 30px 'Noto Sans KR'", "700 72px 'Noto Serif KR'"];
const INK = '#e8f1fb', RED = '#ff5d4d';
const KX = .2, KY = .4, Z0 = 150;                       // oblique: 1 m of depth = .2 m right, .4 m up on the sheet
const OUT = 3.0, DET = 2.0, THIN = 1.3, HAIR = .9;      // line weights (px at zoom Z0; screen = w · (z/Z0)^.65)
const LEN = S.left.map(k => +(3 * k).toFixed(2));        // my cross: 3, 2.4, 1.86, 1.44 m
const PIECE = [0, 1, 2].map(k => +(LEN[k] - LEN[k + 1]).toFixed(2));   // .6 .54 .42
const SHORT = +(3 - LEN[3]).toFixed(2);                  // 1.56
const GAP = 2.6, FOOT = -.2, END = 2.8, GX = 3.5, ROAD0 = -1.6, ROAD1 = 3.9, DEEP = -8;
const fmt = v => (Math.round(v * 100) % 10 === 0 ? v.toFixed(1) : v.toFixed(2));

// ---------------------------------------------------------------- small math
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const mix3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const nrm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const keys = (K, t) => { if (t <= K[0][0]) return K[0][1]; for (let i = 1; i < K.length; i++) if (t <= K[i][0]) return lerp(K[i - 1][1], K[i][1], (t - K[i - 1][0]) / (K[i][0] - K[i - 1][0])); return K[K.length - 1][1]; };

// ---------------------------------------------------------------- camera / projection (sheet coords sx = x + KX·d, sy = y + KY·d)
let CAM = { cx: 0, cy: 0, z: Z0 };
const P = (x, y, d = 0) => [540 + (x + KX * d - CAM.cx) * CAM.z, 1050 - (y + KY * d - CAM.cy) * CAM.z];
const P3 = q => P(q[0], q[1], q[2]);
const LW = w => w * Math.pow(CAM.z / Z0, .65);

// ---------------------------------------------------------------- the sheet (built once, locked to the drawing)
const TX0 = -12, TY1 = 12, TPPM = 40, TN = 880;           // texture covers sheet x −12…10, y −10…12
let TEX, GRAIN, VIG, PAT, GPAT;
function buildSheet() {
  TEX = Pilot.canvas(TN, TN); const x = TEX.getContext('2d'), id = x.createImageData(TN, TN), D = id.data;
  const A = [20, 46, 100], Bc = [44, 92, 168];
  for (let j = 0; j < TN; j++) for (let i = 0; i < TN; i++) {
    const sx = TX0 + i / TPPM, sy = TY1 - j / TPPM;
    const n = Pilot.fbm(sx * .32 + 3, sy * .32 + 7, 4), st = Pilot.noise(sx * .09 + 11, sy * 2.6), fine = Pilot.fbm(sx * 1.7, sy * 1.7, 2);
    let v = clamp(.2 + .62 * n + .2 * (st - .5) + .14 * (fine - .5));
    const cr1 = Math.abs(sx + 2.6), cr2 = Math.abs(sy - 6.2);                        // two fold creases
    v += .07 * Math.exp(-cr1 * cr1 * 900) - .05 * Math.exp(-((cr1 - .05) ** 2) * 900) + .06 * Math.exp(-cr2 * cr2 * 900);
    const c = Pilot.mix(A, Bc, clamp(v)), k = (j * TN + i) * 4;
    D[k] = c[0]; D[k + 1] = c[1]; D[k + 2] = c[2]; D[k + 3] = 255;
  }
  x.putImageData(id, 0, 0);
  const r = Pilot.rng(7); x.strokeStyle = 'rgba(200,225,255,.07)'; x.lineWidth = 1;     // fibres
  for (let i = 0; i < 260; i++) { const a = r() * 6.28, px = r() * TN, py = r() * TN, l = 4 + r() * 10; x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a + 1) * l, py + Math.sin(a + 1) * l, px + Math.cos(a) * l * 2, py + Math.sin(a) * l * 2); x.stroke(); }
  GRAIN = Pilot.canvas(256, 256); const g = GRAIN.getContext('2d'), r2 = Pilot.rng(11);
  for (let i = 0; i < 2600; i++) { g.fillStyle = r2() < .5 ? `rgba(225,238,255,${.04 + r2() * .08})` : `rgba(6,16,40,${.05 + r2() * .1})`; g.fillRect(r2() * 256, r2() * 256, 1 + r2() * 1.4, 1 + r2() * 1.4); }
  for (let i = 0; i < 26; i++) { g.fillStyle = `rgba(230,242,255,${.1 + r2() * .15})`; g.beginPath(); g.arc(r2() * 256, r2() * 256, .6 + r2() * 1.3, 0, 7); g.fill(); }
  VIG = Pilot.canvas(W, H); const v = VIG.getContext('2d'), gr = v.createRadialGradient(W / 2, H * .5, H * .25, W / 2, H * .5, H * .78);
  gr.addColorStop(0, 'rgba(5,12,32,0)'); gr.addColorStop(1, 'rgba(5,12,32,.5)'); v.fillStyle = gr; v.fillRect(0, 0, W, H);
}
function texM() { const a = CAM.z / TPPM; return [a, 540 + (TX0 - CAM.cx) * CAM.z, 1050 - (TY1 - CAM.cy) * CAM.z]; }
function sheet(g) {
  if (!PAT) { PAT = g.createPattern(TEX, 'repeat'); GPAT = g.createPattern(GRAIN, 'repeat'); }
  const [a, e, f] = texM(); PAT.setTransform(new DOMMatrix([a, 0, 0, a, e, f]));
  g.fillStyle = '#1d4185'; g.fillRect(0, 0, W, H);
  g.imageSmoothingEnabled = true; g.drawImage(TEX, e, f, TN * a, TN * a);
  // the faint drafting grid (sheet coordinates, every .5 m; every 2.5 m a little stronger)
  const x0 = CAM.cx - 540 / CAM.z, x1 = CAM.cx + 540 / CAM.z, y0 = CAM.cy - 870 / CAM.z, y1 = CAM.cy + 1050 / CAM.z;
  for (const [st, al] of [[.5, .045], [2.5, .07]]) {
    g.beginPath();
    for (let x = Math.ceil(x0 / st) * st; x <= x1; x += st) { const X = 540 + (x - CAM.cx) * CAM.z; g.moveTo(X, 0); g.lineTo(X, H); }
    for (let y = Math.ceil(y0 / st) * st; y <= y1; y += st) { const Y = 1050 - (y - CAM.cy) * CAM.z; g.moveTo(0, Y); g.lineTo(W, Y); }
    g.strokeStyle = `rgba(215,232,255,${al})`; g.lineWidth = 1; g.stroke();
  }
}
function finish(g) {   // grain over the ink (it moves with the sheet), then a soft vignette
  const [, e, f] = texM(); GPAT.setTransform(new DOMMatrix([1, 0, 0, 1, Math.round(e), Math.round(f)]));
  g.fillStyle = GPAT; g.fillRect(0, 0, W, H); g.drawImage(VIG, 0, 0);
}

// ---------------------------------------------------------------- line work
const PL = (g, p, close) => { g.beginPath(); g.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) g.lineTo(p[i][0], p[i][1]); if (close) g.closePath(); };
function trunc(p, k) {
  let tot = 0; const L = [0]; for (let i = 1; i < p.length; i++) { tot += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); L.push(tot); }
  const want = tot * clamp(k), out = [p[0]];
  for (let i = 1; i < p.length; i++) { if (L[i] <= want) { out.push(p[i]); continue; } const f = (want - L[i - 1]) / ((L[i] - L[i - 1]) || 1); out.push([lerp(p[i - 1][0], p[i][0], f), lerp(p[i - 1][1], p[i][1], f)]); break; }
  return out;
}
function nib(g, p) { const r = 16, gr = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], r); gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(190,220,255,0)'); g.fillStyle = gr; g.fillRect(p[0] - r, p[1] - r, 2 * r, 2 * r); }
function line(g, pts, w, col = INK, o = {}) {
  const k = o.k == null ? 1 : o.k; if (k <= 0) return;
  g.save(); if (o.alpha != null) g.globalAlpha *= o.alpha;
  g.strokeStyle = col; g.lineWidth = LW(w); g.lineCap = o.cap || 'round'; g.lineJoin = 'round';
  if (o.dash) g.setLineDash(o.dash.map(v => v * Math.pow(CAM.z / Z0, .65)));
  const p = k < 1 ? trunc(pts, k) : pts; PL(g, p, o.close && k >= 1); g.stroke();
  if (k < 1 && o.nib !== false) nib(g, p[p.length - 1]);
  g.restore();
}
// 45° section hatching inside a screen polygon, locked to the sheet
function hatch(g, poly, sp = .12, alpha = .5, w = HAIR, col = INK) {
  g.save(); PL(g, poly, true); g.clip();
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; for (const [x, y] of poly) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  x0 = Math.max(x0, -50); x1 = Math.min(x1, W + 50); y0 = Math.max(y0, -50); y1 = Math.min(y1, H + 50);
  if (x0 < x1 && y0 < y1) {
    const o = P(0, 0), s = sp * CAM.z * Math.SQRT2, c0 = o[0] + o[1] + Math.ceil((x0 + y0 - o[0] - o[1]) / s) * s;
    g.beginPath(); for (let c = c0; c <= x1 + y1; c += s) { g.moveTo(c - y0, y0); g.lineTo(c - y1, y1); }
    g.strokeStyle = col; g.globalAlpha *= alpha; g.lineWidth = LW(w); g.stroke();
  }
  g.restore();
}
// a dimension: measured points a, b (screen), offset off px (+ = to the right of a→b), label, draw-on k
function dim(g, a, b, off, label, o = {}) {
  const k = o.k == null ? 1 : o.k; if (k <= 0) return;
  const col = o.col || INK, dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len, nx = -uy, ny = ux, sg = Math.sign(off) || 1;
  const a2 = [a[0] + nx * off, a[1] + ny * off], b2 = [b[0] + nx * off, b[1] + ny * off], m = [(a2[0] + b2[0]) / 2, (a2[1] + b2[1]) / 2];
  g.save(); g.globalAlpha *= o.alpha ?? 1;
  const ext = p => line(g, [[p[0] + nx * sg * 5, p[1] + ny * sg * 5], [p[0] + nx * (off + sg * 12), p[1] + ny * (off + sg * 12)]], HAIR, col, { k: ss(0, .4, k), nib: false });
  ext(a); ext(b);
  const kk = ss(.2, .8, k), p0 = [lerp(m[0], a2[0], kk), lerp(m[1], a2[1], kk)], p1 = [lerp(m[0], b2[0], kk), lerp(m[1], b2[1], kk)];
  line(g, [p0, p1], o.red ? 1.6 : THIN, col, { nib: false });
  if (kk > .98) for (const [p, s] of [[a2, 1], [b2, -1]]) {      // arrowheads pointing outward
    const L = LW(13), Wd = LW(4.2); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0] + ux * s * L + nx * Wd, p[1] + uy * s * L + ny * Wd); g.lineTo(p[0] + ux * s * L - nx * Wd, p[1] + uy * s * L - ny * Wd); g.closePath(); g.fillStyle = col; g.fill();
  }
  const la = ss(.55, 1, k); if (label && la > 0) {
    let ang = Math.atan2(uy, ux); if (ang > Math.PI / 2) ang -= Math.PI; if (ang < -Math.PI / 2) ang += Math.PI;
    const size = o.size || Math.round(26 * Math.pow(CAM.z / Z0, .4)), s = Pilot.tr(label);
    g.save(); g.translate(m[0], m[1]); g.rotate(ang); g.font = `${o.weight || 600} ${size}px ${SANS}`;
    const tw = g.measureText(s).width; g.globalAlpha *= la;
    g.fillStyle = PAT; g.fillRect(-tw / 2 - 10, -size * .72, tw + 20, size * 1.3);
    if (o.strike) { g.fillStyle = 'rgba(0,0,0,0)'; }
    Pilot.text(g, label, 0, size * .36, { size, font: SANS, weight: o.weight || 600, color: col });
    if (o.strike) { const sk = clamp(o.strike); g.strokeStyle = col; g.lineWidth = LW(2.4); g.beginPath(); g.moveTo(-tw / 2 - 6, size * .05); g.lineTo(-tw / 2 - 6 + (tw + 12) * sk, -size * .12); g.stroke(); }
    g.restore();
  }
  g.restore();
}
// a small free label (sheet text), optionally on a paper patch
function label(g, s, x, y, o = {}) {
  const size = o.size || Math.round(24 * Math.pow(CAM.z / Z0, .4));
  if (o.patch) { g.save(); g.font = `${o.weight || 600} ${size}px ${SANS}`; const tw = g.measureText(Pilot.tr(s)).width, al = o.align || 'center', x0 = al === 'left' ? x : x - tw / 2;
    g.globalAlpha *= o.alpha ?? 1; g.fillStyle = PAT; g.fillRect(x0 - 8, y - size * .95, tw + 16, size * 1.3); g.restore(); }
  Pilot.text(g, s, x, y, { size, font: SANS, weight: o.weight || 600, color: o.col || INK, alpha: o.alpha ?? 1, align: o.align, ls: o.ls });
}

// ---------------------------------------------------------------- figures (line-art pilgrims: tunic, hood, tube limbs)
const LT = .46, LS = .46;
function walkPose(x, d, f, ph, amp, heavy, yb = 0) {
  const legs = [0, 1].map(i => { const p = ph + i * Math.PI, th = amp * Math.sin(p), kb = amp * 1.4 * Math.max(0, Math.cos(p)) + .04;
    return { th, kb, h: LT * Math.cos(th) + LS * Math.cos(th - kb) }; });
  const hy = Math.max(legs[0].h, legs[1].h) + yb, lean = .05 + .13 * heavy;
  const hip = [x, hy, d], sh = [x + lean * f, hy + .5 - .06 * heavy, d], head = [sh[0] + (.05 + .06 * heavy) * f, sh[1] + .22 - .04 * heavy, d];
  const kn = [], ft = [];
  legs.forEach((L, i) => { const dd = d + (i ? .1 : -.1);
    kn[i] = [x + LT * Math.sin(L.th) * f, hy - LT * Math.cos(L.th), dd];
    ft[i] = [kn[i][0] + LS * Math.sin(L.th - L.kb) * f, kn[i][1] - LS * Math.cos(L.th - L.kb), dd]; });
  return { hip, sh, head, kn, ft, f, ph };
}
function kneelPose(x, d, f) {   // near knee down, far knee up; torso leaning well forward over the work
  return { hip: [x, .42, d], sh: [x + .42 * f, .66, d], head: [x + .6 * f, .8, d],
    kn: [[x + .1 * f, .05, d - .1], [x + .36 * f, .43, d + .1]], ft: [[x - .36 * f, .04, d - .1], [x + .38 * f, .0, d + .1]], f, ph: 0 };
}
function mixPose(A, Bp, k) {
  if (k <= 0) return A; if (k >= 1) return Bp;
  return { hip: mix3(A.hip, Bp.hip, k), sh: mix3(A.sh, Bp.sh, k), head: mix3(A.head, Bp.head, k),
    kn: [0, 1].map(i => mix3(A.kn[i], Bp.kn[i], k)), ft: [0, 1].map(i => mix3(A.ft[i], Bp.ft[i], k)), f: lerp(A.f, Bp.f, k), ph: A.ph };
}
// two-bone arm in screen space; the elbow takes the lower of the two solutions (elbows hang)
function ik(s, h, l1, l2) {
  const dx = h[0] - s[0], dy = h[1] - s[1], D = Math.hypot(dx, dy), Dc = clamp(D, Math.abs(l1 - l2) + 1, l1 + l2 - .5), a = Math.atan2(dy, dx);
  const A = Math.acos(clamp((l1 * l1 + Dc * Dc - l2 * l2) / (2 * l1 * Dc), -1, 1));
  const e1 = [s[0] + l1 * Math.cos(a + A), s[1] + l1 * Math.sin(a + A)], e2 = [s[0] + l1 * Math.cos(a - A), s[1] + l1 * Math.sin(a - A)];
  const e = e1[1] > e2[1] ? e1 : e2, w = [s[0] + Dc * Math.cos(a), s[1] + Dc * Math.sin(a)];
  return [e, w];
}
function drawFigure(g, F, o = {}) {
  const z = CAM.z, f = F.f, lw = LW(2.1), col = INK;
  g.save(); g.globalAlpha *= o.alpha ?? 1; g.lineCap = 'round'; g.lineJoin = 'round';
  const tube = (p, w) => { PL(g, p); g.strokeStyle = col; g.lineWidth = w * z + 2 * lw; g.stroke(); g.strokeStyle = PAT; g.lineWidth = w * z; g.stroke(); };
  const leg = i => { const toe = add(F.ft[i], [.12 * f, .01, 0]); tube([P3([F.hip[0], F.hip[1], F.kn[i][2]]), P3(F.kn[i]), P3(F.ft[i]), P3(toe)], .1); };
  const arm = i => {
    const S3 = add(F.sh, [-.02 * f, -.04, i ? .14 : -.14]), Sx = P3(S3);
    const tg = o.hands && o.hands[i] ? P3(o.hands[i]) : P3(add(S3, [(.06 + .16 * Math.sin(F.ph + (i ? Math.PI : 0)) * (o.swing ?? 0)) * f, -.56, 0]));
    const [e, w] = ik(Sx, tg, .31 * z, .3 * z); tube([Sx, e, w], .075);
    const dx = w[0] - e[0], dy = w[1] - e[1], l = Math.hypot(dx, dy) || 1, c = [w[0] + dx / l * .035 * z, w[1] + dy / l * .035 * z];
    g.beginPath(); g.ellipse(c[0], c[1], .06 * z, .043 * z, Math.atan2(dy, dx), 0, 7); g.fillStyle = PAT; g.fill(); g.strokeStyle = col; g.lineWidth = lw; g.stroke();
    if (o.thumb && i === 0) { const t2 = P3(o.thumb); g.beginPath(); g.moveTo(c[0], c[1] - .02 * z); g.lineTo(t2[0], t2[1]); g.lineWidth = lw * 1.2; g.stroke(); }
  };
  leg(1); arm(1);
  // tunic
  const Sx = P3(F.sh), Hx = P3(F.hip), ax = Hx[0] - Sx[0], ay = Hx[1] - Sx[1], al = Math.hypot(ax, ay) || 1, an = [ax / al, ay / al], pn = [-an[1], an[0]];
  const hem = [Hx[0] + an[0] * .24 * z, Hx[1] + an[1] * .24 * z], ws = .13 * z, wh = .2 * z;
  g.beginPath(); g.moveTo(Sx[0] + pn[0] * ws, Sx[1] + pn[1] * ws); g.lineTo(hem[0] + pn[0] * wh, hem[1] + pn[1] * wh);
  g.quadraticCurveTo(hem[0] + an[0] * .04 * z, hem[1] + an[1] * .04 * z, hem[0] - pn[0] * wh, hem[1] - pn[1] * wh);
  g.lineTo(Sx[0] - pn[0] * ws, Sx[1] - pn[1] * ws); g.quadraticCurveTo(Sx[0] - an[0] * .1 * z, Sx[1] - an[1] * .1 * z, Sx[0] + pn[0] * ws, Sx[1] + pn[1] * ws);
  g.fillStyle = PAT; g.fill(); g.strokeStyle = col; g.lineWidth = lw; g.stroke();
  g.beginPath(); g.moveTo(Hx[0] + pn[0] * .17 * z, Hx[1] + pn[1] * .17 * z); g.lineTo(Hx[0] - pn[0] * .17 * z, Hx[1] - pn[1] * .17 * z); g.lineWidth = LW(1.2); g.stroke();   // rope belt
  // neck, hood, face
  const Hc = P3(F.head); tube([Sx, [lerp(Sx[0], Hc[0], .7), lerp(Sx[1], Hc[1], .7)]], .07);
  g.beginPath(); g.arc(Hc[0] - .035 * f * z, Hc[1] - .005 * z, .128 * z, 0, 7); g.fillStyle = PAT; g.fill(); g.lineWidth = lw; g.strokeStyle = col; g.stroke();
  g.beginPath(); g.arc(Hc[0] + .02 * f * z, Hc[1] + .012 * z, .088 * z, 0, 7); g.fill(); g.lineWidth = LW(1.3); g.stroke();
  g.beginPath(); g.moveTo(Hc[0] + .1 * f * z, Hc[1] + .0 * z); g.lineTo(Hc[0] + .125 * f * z, Hc[1] + .03 * z); g.lineTo(Hc[0] + .1 * f * z, Hc[1] + .04 * z); g.stroke();
  leg(0);
  if (o.mid) o.mid();
  arm(0);
  g.restore();
}

// ---------------------------------------------------------------- crosses and cut pieces
// X = { foot, top, bar (unit), L }: shaft foot→top, the crossbar (1.2 m) centred .7 m below the top
function carryCross(F, L, heavy) {

  line(g, [P(0, 0, ROAD1), P(0, -3, ROAD1)], THIN, INK, { alpha: .45, k });
  label(g, '단면 B–B', P(GAP + .9, -1.1, ROAD0)[0], P(GAP + .9, -1.1, ROAD0)[1], { alpha: .75 * ss(B.gap + .4, B.gap + .8, t), size: Math.round(22 * Math.pow(CAM.z / Z0, .4)), patch: true });
}
function doorGap(t) { let b = 0; for (const o of OTH) { const ta = o.T + 1.0 + (GX - .4 - XL) / 2.2; b = Math.max(b, ss(ta - .4, ta, t) * (1 - ss(ta + .4, ta + .9, t))); } return .1 + .5 * b; }
function gate(g, t) {
  const k = ss(B.gap + .15, B.gap + .9, t); if (k <= 0) return;
  const d0 = -1.0, d1 = 3.4, hh = 2.7, mid = 1.2, gp = doorGap(t);
  // light from the gap between the door leaves, spilling back across the far bank
  g.save(); g.globalAlpha = ss(B.gap + .3, B.gap + 1.1, t);
  const sp = [P(GX, 0, mid - gp), P(GX, 0, mid + gp), P(GX - 1.6, 0, mid + gp + 1.3), P(GX - 1.6, 0, mid - gp - 1.3)];
  const sc = P(GX, 0, mid), gs = g.createRadialGradient(sc[0], sc[1], 0, sc[0], sc[1], 1.9 * CAM.z);
  gs.addColorStop(0, 'rgba(235,246,255,.42)'); gs.addColorStop(1, 'rgba(235,246,255,0)'); g.fillStyle = gs; PL(g, sp, true); g.fill();
  PL(g, [P(GX, 0, mid - gp), P(GX, 0, mid + gp), P(GX, hh - .05, mid + gp), P(GX, hh - .05, mid - gp)], true); g.fillStyle = 'rgba(244,250,255,.95)'; g.fill();
  g.restore();
  // leaves (panelled) and the frame
  for (const [a, b] of [[d0, mid - gp], [mid + gp, d1]]) {
    const q = [P(GX, 0, a), P(GX, 0, b), P(GX, hh, b), P(GX, hh, a)];
    g.save(); g.globalAlpha = k; PL(g, q, true); g.fillStyle = PAT; g.fill(); g.restore();
    line(g, [...q, q[0]], DET, INK, { k });
    const m = (a + b) / 2, w = Math.abs(b - a);
    if (w > .5) for (const [y0, y1] of [[.25, 1.2], [1.45, 2.45]]) { const ia = a + Math.sign(b - a) * .2, ib = b - Math.sign(b - a) * .2; line(g, [P(GX, y0, ia), P(GX, y0, ib), P(GX, y1, ib), P(GX, y1, ia), P(GX, y0, ia)], HAIR, INK, { k, alpha: .7 }); }
    void m;
  }
  line(g, [P(GX, 0, d0 - .15), P(GX, hh + .2, d0 - .15), P(GX, hh + .2, d1 + .15), P(GX, 0, d1 + .15)], OUT, INK, { k });
  line(g, [P(GX, hh + .38, d0 - .3), P(GX, hh + .38, d1 + .3)], DET, INK, { k });
  line(g, [P(GX - .3, 0, ROAD0), P(GX - .3, 0, ROAD1)], HAIR, INK, { alpha: .4, k, dash: [10, 6] });   // threshold
}
function gateGlow(g, t) {
  const a = ss(B.gap + .3, B.gap + 1.2, t); if (a <= 0) return;
  const c = P(GX, 1.35, 1.2), r = 2.3 * CAM.z, gr = g.createRadialGradient(c[0], c[1], 0, c[0], c[1], r);
  gr.addColorStop(0, `rgba(225,240,255,${.32 * a})`); gr.addColorStop(.4, `rgba(200,225,255,${.12 * a})`); gr.addColorStop(1, 'rgba(200,225,255,0)');
  g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.fillRect(c[0] - r, c[1] - r, 2 * r, 2 * r); g.restore();
}

// ---------------------------------------------------------------- everything that stands on the road
let ME = null;
function entities(g, t) {
  for (const o of OTH) {   // far lanes first
    const s = othState(o, t); if (s.alpha <= 0 && !s.X) continue;
    const crossFn = () => s.X && drawCross(g, s.X);
    if (s.X && s.X.laid) { drawCross(g, s.X); if (s.alpha > 0) drawFigure(g, s.F, { alpha: s.alpha, swing: s.swing }); }
    else if (s.alpha > 0) drawFigure(g, s.F, { hands: s.hands, mid: crossFn, alpha: s.alpha });
  }
  for (let k = 0; k < 3; k++) { const p = pieceGeom(k, t); if (p) drawPiece(g, p.a, p.b); }
  const m = ME = meState(t);
  const red = { col: RED, red: true }, kerf = m.saw && t < TD[m.saw.k] && m.saw.act > .2 ? PIECE[m.saw.k] : null;
  const crossNow = () => m.X && drawCross(g, m.X, { ...red, kerf });
  if (m.X && !m.X.falling && m.X.bar[0] === 1) {       // lying on the ground for sawing: cross first, then me over it, the saw in my hand
    crossNow();
    drawFigure(g, m.F, { hands: m.hands, thumb: m.thumb, mid: () => m.saw && m.saw.alpha > 0 && (g.save(), g.globalAlpha *= m.saw.alpha, drawSaw(g, m.saw.sw, DC), g.restore(), sawdust(g, t, m.saw)) });
  } else drawFigure(g, m.F, { hands: m.hands, mid: crossNow, swing: t > 21.2 ? 0 : 0 });
  if (m.saw && m.saw.alpha > 0 && m.X && m.X.bar[0] !== 1) { g.save(); g.globalAlpha *= m.saw.alpha; drawSaw(g, m.saw.sw, DC); g.restore(); }
}
function drawPiece(g, a, b, o = {}) { beams(g, [[P3(a), P3(b), .13 * CAM.z]], { col: RED, red: true, ...o }); }
function sawdust(g, t, s) {
  if (s.act < .3) return; const r = Pilot.rng(Math.floor(t * 30) + 5);
  g.save(); g.fillStyle = INK;
  for (let i = 0; i < 9; i++) { const q = r(), p = P(s.xc + (r() - .5) * .16, .1 - q * .12, DC - .02 - r() * .1); g.globalAlpha = .7 * (1 - q); g.fillRect(p[0], p[1], 2.2, 2.2); }
  g.restore();
}

// ---------------------------------------------------------------- annotations: the dimensions that tell the story
const crossDim = (g, X, off, lab, o = {}) => dim(g, P3(X.foot), P3(X.top), off * CAM.z, lab, o);
function annotations(g, t) {
  const closeUp = (t >= SAW[0] && t < B.run[0]) || (t >= SAW[1] && t < B.gap);
  // the others' crosses: 3.0 m each (while carried)
  if (t < B.gap && !closeUp) for (const o of OTH) { const s = othState(o, t); dim(g, P3(s.X.foot), P3(s.X.top), -.74 * CAM.z, '3.0 m', { alpha: .8, size: Math.round(22 * Math.pow(CAM.z / Z0, .4)) }); }
  // mine, in red pencil, corrected after every cut
  const m = ME, n = nCut(t);
  if (m.X && t < 18.22) {
    const lying = m.X.bar[0] === 1, settled = lying ? (t > SAW[0] + .32 && t < 4.4) || (t > SAW[1] + .32 && t < 11.4) : !(t > 4.4 && t < 4.64) && !(t > 11.4 && t < 11.67) && !(t > SAW[0] && t < SAW[0] + .32) && !(t > SAW[1] && t < SAW[1] + .32);
    if (settled) {
      const off = lying ? .78 : -.74, last = n ? TD[n - 1] : -9, fresh = t - last;
      const lab = fmt(LEN[n]) + ' m', k = n && fresh < .5 ? ss(0, .4, fresh) : 1;
      if (n && fresh < 1.6 && lying) {   // the old figure struck through, the new one lettered beside it
        const a = P3(m.X.foot), b = P3(m.X.top), dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy), nx = -dy / l, ny = dx / l, mm = [(a[0] + b[0]) / 2 + nx * (off * CAM.z + 46), (a[1] + b[1]) / 2 + ny * (off * CAM.z + 46)];
        let ang = Math.atan2(dy, dx); if (ang < -Math.PI / 2) ang += Math.PI; if (ang > Math.PI / 2) ang -= Math.PI;
        g.save(); g.translate(mm[0], mm[1]); g.rotate(ang); g.globalAlpha = 1 - ss(1.1, 1.6, fresh);
        const sz = Math.round(24 * Math.pow(CAM.z / Z0, .4)); Pilot.text(g, fmt(LEN[n - 1]) + ' m', 0, sz * .36, { size: sz, font: SANS, weight: 600, color: RED });
        g.strokeStyle = RED; g.lineWidth = LW(2.6); g.beginPath(); g.moveTo(-sz * 1.6, sz * .1); g.lineTo(-sz * 1.6 + sz * 3.2 * ss(0, .3, fresh), -sz * .2); g.stroke(); g.restore();
      }
      crossDim(g, m.X, off, lab, { col: RED, red: true, k, size: Math.round((lying ? 30 : 26) * Math.pow(CAM.z / Z0, .4)), weight: 700 });
    }
  }
  if (t >= B.gap) {
    const rowY = r => -.5 - .48 * r, sz = Math.round(25 * Math.pow(CAM.z / Z0, .4));
    const row = (x0, x1, r, lab, o) => dim(g, P(x0, rowY(r), 0), P(x1, rowY(r), 0), 0, lab, { size: sz, ...o });
    // the gap's requirement (its extension lines come down from the bearings)
    const kq = ss(B.gap + .5, B.gap + 1.1, t);
    if (kq > 0) { line(g, [P(FOOT, -.02, 0), P(FOOT, rowY(1) - .1, 0)], HAIR, INK, { k: kq, nib: false }); line(g, [P(END, -.02, 0), P(END, rowY(1) - .1, 0)], HAIR, INK, { k: kq, nib: false }); row(FOOT, END, 1, '필요 길이 3.0 m', { k: kq }); }
    // the others' bridges fit
    for (const o of OTH) { const a = ss(o.T + .82, o.T + 1.0, t) * (1 - ss(o.T + 2.3, o.T + 2.7, t)); if (a > 0) { const p = P(1.3, .42, o.d); label(g, '3.0 m ✓', p[0], p[1], { alpha: a, size: Math.round(22 * Math.pow(CAM.z / Z0, .4)), patch: true }); } }
    // mine: 1.44 m — and the red shortfall
    const km = ss(18.68, 18.9, t);
    if (km > 0) {
      line(g, [P(LEN[3] + FOOT, .0, 0), P(LEN[3] + FOOT, rowY(0) - .1, 0)], HAIR, RED, { k: km, nib: false });
      line(g, [P(FOOT, -.02, 0), P(FOOT, rowY(0) - .1, 0)], HAIR, RED, { k: km, nib: false });
      row(FOOT, FOOT + LEN[3], 0, fmt(LEN[3]) + ' m', { col: RED, red: true, k: km, weight: 700 });
      row(FOOT + LEN[3], END, 0, '−' + fmt(SHORT) + ' m', { col: RED, red: true, k: ss(18.8, 19.05, t), weight: 700, size: Math.round(sz * 1.25) });
    }
    // after the fall: where mine was, as a phantom line
    const kp = ss(19.6, 20.1, t);
    if (kp > 0) drawCross(g, { foot: [FOOT, .065, 0], top: [FOOT + LEN[3], .065, 0], bar: [0, 0, 1], L: LEN[3] }, { col: RED, dash: [12, 6, 3, 6], hollow: true, alpha: .85 * kp });
    // the pieces on the road behind me: their own small dimensions, then they slide into the gap
    if (t >= B.back + .3) {
      let s0 = FOOT + LEN[3];
      for (let k = 0; k < 3; k++) {
        const p = pieceGeom(k, t), kd = ss(B.back + .5 + .25 * k, B.back + 1.0 + .25 * k, t);
        dim(g, P3(p.a), P3(p.b), .32 * CAM.z, fmt(PIECE[k]) + ' m', { col: RED, red: true, k: kd, size: Math.round(24 * Math.pow(CAM.z / Z0, .4)), weight: 700, alpha: 1 - .5 * ss(23.6, 24.2, t) });
        const u = eio(clamp((t - 22.4 - .3 * k) / 1.1)), slot = [[s0, .065, 0], [s0 + PIECE[k], .065, 0]]; s0 += PIECE[k];
        if (u > 0) { const lift = .9 * Math.sin(Math.PI * u), a = add(mix3(p.a, slot[0], u), [0, lift, 0]), b = add(mix3(p.b, slot[1], u), [0, lift, 0]);
          drawPiece(g, a, b, { dash: [10, 5], hollow: true, tint: 'rgba(255,93,77,.22)', alpha: .95 }); }
      }
      const ks = ss(23.7, 24.3, t);
      if (ks > 0) row(FOOT + LEN[3], END, 2, PIECE.map(fmt).join(' + ') + ' = ' + fmt(SHORT) + ' m', { col: RED, red: true, k: ks, weight: 700, size: Math.round(sz * 1.05) });
    }
  }
}

// ---------------------------------------------------------------- figure numbers (the drawing's own captions), notes, end card
const FIGS = [[0, 'FIG. 1  순례 행렬 — 측면도'], [SAW[0], 'FIG. 2  절단 상세 ①'], [B.run[0], 'FIG. 3  경량화 후'], [SAW[1], 'FIG. 4  절단 상세 ②·③'],
  [B.gap, 'FIG. 5  단면 B–B · 낭떠러지'], [B.mine, 'FIG. 6  하중 시험'], [B.back, 'FIG. 7  잘라 낸 부재']];
function figLabel(g, t) {
  let i = 0; while (i < FIGS.length - 1 && t >= FIGS[i + 1][0]) i++;
  const [t0, s] = FIGS[i], k = i === 0 ? 1 : ss(t0, t0 + .45, t), a = 1 - ss(B.end - .3, B.end, t); if (a <= 0) return;
  g.save(); g.beginPath(); g.rect(60, 1440, 40 + 700 * k, 90); g.clip();
  Pilot.text(g, s, 76, 1492, { size: 26, font: SANS, weight: 600, color: INK, alpha: .85 * a, align: 'left', ls: 1 });
  g.restore();
  g.save(); g.globalAlpha = .7 * a; g.strokeStyle = INK; g.lineWidth = 1.5; g.beginPath(); g.moveTo(76, 1508); g.lineTo(76 + 560 * k, 1508); g.stroke(); g.restore();
}
function noteBoxes(g, t) {
  S.lines.forEach(([a, b, s, src], i) => {
    const al = Pilot.win(t, a, b, .35, .45); if (al <= 0) return;
    const two = s.includes('\n'), size = two ? 54 : 62, y = 430, lines = Pilot.tr(s).split('\n');
    g.save(); g.font = `600 ${size}px ${SANS}`; let w = Math.max(...lines.map(l => g.measureText(l).width));
    let bot = y + (two ? size * 1.55 : 0) + size * .3 + 30;
    if (src) { g.font = `400 28px ${SANS}`; w = Math.max(w, g.measureText(Pilot.tr(src)).width); bot = y + (two ? size * 1.55 : 0) + 76 + 30; }
    const top = y - size - 32, bw = Math.min(W - 60, w + 110), x0 = (W - bw) / 2;
    g.globalAlpha = al; g.fillStyle = 'rgba(12,30,74,.72)'; g.fillRect(x0, top, bw, bot - top);
    g.strokeStyle = 'rgba(232,241,251,.9)'; g.lineWidth = 2; g.strokeRect(x0, top, bw, bot - top);
    g.lineWidth = 1; g.strokeRect(x0 + 7, top + 7, bw - 14, bot - top - 14);
    g.fillStyle = 'rgba(12,30,74,.9)'; g.fillRect(x0 + 18, top - 15, 104, 28); g.strokeRect(x0 + 18, top - 15, 104, 28);
    g.restore();
    Pilot.text(g, 'NOTE ' + (i + 1), x0 + 70, top + 6, { size: 18, font: SANS, weight: 700, color: INK, alpha: al * .9, ls: 2 });
  });
}
function endCard(g, t) {
  const a = ss(B.end, B.end + .5, t); if (a <= 0) return;
  g.save(); g.globalAlpha = a; g.fillStyle = 'rgba(16,38,88,.84)'; g.fillRect(0, 0, W, H);
  const x0 = 110, x1 = 970, y0 = 600, y1 = 1150;
  g.strokeStyle = 'rgba(232,241,251,.9)'; g.lineWidth = 2.5; g.strokeRect(x0, y0, x1 - x0, y1 - y0); g.lineWidth = 1; g.strokeRect(x0 + 9, y0 + 9, x1 - x0 - 18, y1 - y0 - 18);
  g.beginPath(); g.moveTo(x0 + 9, 930); g.lineTo(x1 - 9, 930); g.stroke();
  g.restore();
  Story.endCard(g, t, S.endCard, B.end, { font: SERIF, color: '#f4f8fd', srcColor: '#d2e2f6', titleShadow: '', y: 800 });
}

// ---------------------------------------------------------------- frame
function draw(ctx, t) {
  CAM = cam(t);
  sheet(ctx);
  road(ctx, t);
  if (t >= B.gap) { chasm(ctx, t); gate(ctx, t); }
  entities(ctx, t);
  if (t >= B.gap) gateGlow(ctx, t);
  annotations(ctx, t);
  finish(ctx);
  if (t >= B.mine + .8 && t < B.mine + .8 + 2 / 30) { ctx.save(); ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore(); }   // two frames of negative on the hit
  figLabel(ctx, t);
  noteBoxes(ctx, t);
  Story.captions(ctx, t, S.lines, { font: SANS, weight: 600, color: '#f4f8fd', srcColor: '#d2e2f6', shadow: 'rgba(4,14,40,.85)', shadowBlur: 14, y: 430 });
  endCard(ctx, t);
}
async function init() { buildSheet(); }
Pilot.run({ W, H, dur: S.DUR, fonts: FONTS, init, draw });
</script>
