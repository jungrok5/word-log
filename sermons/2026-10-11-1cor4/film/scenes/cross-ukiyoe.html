<script>
/* 잘라 낸 건 다리였다 — ④ Ukiyo-e (lemo-opuscar styles/ukiyoe/STYLE.md). One long woodblock handscroll seen through a
   portrait window: a coastal cliff road (Tōkaidō road-station grammar) with a procession of pilgrims dragging wooden
   crosses; mine is the one block printed in beni red. Flat colour blocks out of register with the sumi key block, bokashi
   sky, woodgrain / baren / goma-zuri on the ink, washi fibres over everything. Depth is oblique (fukinuki): one unit of
   depth = (+.5, −.42) px, so a cross lying flat shows its crossbar as a slanted parallelogram.
   Story: I stagger (my cross drags), squat and saw its foot off, stride past the others, saw twice more; the road ends at
   a cleft over the sea; the others raise their crosses on the edge and let them fall forward — each lands exactly across;
   mine falls short, tips and drops (hard cut to a tight print, the sea throws up claws). Pull back over the whole scroll:
   my three red offcuts lie on the road behind me; they fly up the scroll and fill the gap beside the key-line ghost of my
   cross — exactly a bridge. End card on a cartouche over the print washed back to paper. Figures pose on 8 fps, water
   on 12, the camera on ones. */
const { clamp, lerp, ss, eo, eio, rng } = Pilot;
const S = window.SCRIPT, B = S.beat, W = Pilot.W, H = Pilot.H, LEFT = S.left, SAW = B.saw;
const TAU = Math.PI * 2;

// ================================================================ world
const L0 = 420, G = 360, E = 900, XN = E, XF = E - G, GY = 1270, SEA = 1700;
const DX = .5, DY = -.42, ROAD_D = 240;                   // oblique depth: 1 unit of depth → (+.5, −.42)
const LN = (d, x, y) => [x + DX * d, y + DY * d];         // lane-local → world
const SX0 = 0, SY0 = -520, SX1 = 2900, SY1 = 2250;        // the print (one long sheet)
const PAL = {
  paper: '#eee2c6', mount: '#bba679', prus: '#1d3a66', prusD: '#13284a', prusL: '#4d6f98', sky: '#8db0c6', skyL: '#bcd0d6',
  sumi: '#231f1c', grey: '#8b8a80', greyL: '#b3b0a2', greyD: '#5f5e58', ochre: '#cf9f4a', ochreL: '#e2c27e', straw: '#c9a45c',
  green: '#8aa152', greenD: '#50703c', greenL: '#b5c07a', pine: '#3e5a3a', skin: '#ecd6b2', road: '#dcc28c', roadD: '#c4a46a',
  rock: '#8e9b8a', rockD: '#66735f', rockF: '#56604f', gorge: '#33465c', wood: '#a27b4b', woodT: '#bf9a66', woodD: '#6e5233',
  beni: '#b8412f', beniT: '#cf6a50', beniC: '#e3a08a', mtn: '#a6bccd', mtn2: '#7f9cb6', steel: '#9aa3a6',
};
// 1 = the full length the gap needs.  Crossbar 105 below the head, arms 105 each (in plane); lying flat they slant.
const CB = 90, ARM = 75, DFL = [DX * 70, DY * 70];
const CUTL = [L0 * (LEFT[0] - LEFT[1]), L0 * (LEFT[1] - LEFT[2]), L0 * (LEFT[2] - LEFT[3])];   // the three offcuts

// ---- my path ----
const ME_D = 95, MY_CROSS_D = 20, LY_D = 50;
const X0 = 2150, V0 = 45, X1 = X0 - V0 * SAW[0];          // heavy walk until the first cut
const FOOT1 = X1 + 215, XC1 = FOOT1 - CUTL[0], K1 = XC1 - 62;
const X2 = 1050, RUN0 = 4.6, RUN1 = 8.9;
const FOOT2 = X2 + 194, XC2 = FOOT2 - CUTL[1], K2 = XC2 - 62, XC3 = XC2 - CUTL[2], K3 = XC3 - 62;
const EDGE_ME = XN + 45;
// pieces at rest (lane-local x range on the road, lane 0)
const PIECES = [
  { a: XC1 + 16, b: FOOT1 + 16, rot: .05, at: SAW[0] + .8 },
  { a: XC2 + 16, b: FOOT2 + 16, rot: -.04, at: SAW[1] + .8 },
  { a: XC3 + 10, b: XC2 + 10, rot: .03, at: SAW[2] + .8 },
];
// where they go: the foot part of the ghost cross across the gap (foot on the near edge)
const BR_FOOT = XN + 15, BR_HEAD = BR_FOOT - L0;
PIECES[0].ta = BR_FOOT - CUTL[0]; PIECES[0].tb = BR_FOOT;
PIECES[1].ta = PIECES[0].ta - CUTL[1]; PIECES[1].tb = PIECES[0].ta;
PIECES[2].ta = PIECES[1].ta - CUTL[2]; PIECES[2].tb = PIECES[1].ta;
const GLIDE = [[23.25, 24.75], [23.5, 24.85], [23.65, 24.95]];

// ---- the others ----
const STOPX = XN + 42;
const OTH = [
  { id: 'A', d: 235, x0: 1720, fo: 0, beat: B.bridges[0], robe: '#a5784a', robeD: '#7b5432', legs: '#4a3a2c', s: .94 },
  { id: 'B', d: 180, x0: 1900, fo: 22, beat: B.bridges[1], robe: '#8b8a80', robeD: '#5f5e58', legs: '#3d3c38', s: .95 },
  { id: 'C', d: 130, x0: 2060, fo: -12, beat: B.bridges[2], robe: '#7f9fb8', robeD: '#4d6f98', legs: '#2a3448', s: .93 },
  { id: 'D', d: 210, x0: 2600, v: 58, robe: '#6f7f58', robeD: '#4a5a3a', legs: '#33402a', s: .92 },
];
for (const o of OTH) if (o.beat) { o.tStop = o.beat - .55; o.v = (o.x0 - STOPX) / o.tStop; o.cd = o.d - 20; }
const ME_C = { robe: '#3f5878', robeD: '#2c4a70', legs: '#25304a', s: 1 };
const GATE_X = 360, GATE_D = 120;
const WALK_V = 150;                      // crossing speed

// ================================================================ helpers
const seg = (t, a, b) => clamp((t - a) / (b - a));
const st8 = t => Math.floor(t * 8 + 1e-4) / 8, st12 = t => Math.floor(t * 12 + 1e-4) / 12;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (h, a) => { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const len = v => Math.hypot(v[0], v[1]);
const nrm = v => { const l = len(v) || 1; return [v[0] / l, v[1] / l]; };
const lp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
function trap(u, a = .1) { u = clamp(u); const vm = 1 / (1 - a); if (u < a) return vm * u * u / (2 * a); if (u > 1 - a) { const r = 1 - u; return 1 - vm * r * r / (2 * a); } return vm * (a / 2 + u - a); }
function poly(pts, close = true) { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); if (close) p.closePath(); return p; }
function smooth(pts, closed = false, p = new Path2D()) {
  const n = pts.length;
  if (!closed) { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n - 1; i++) p.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2); p.lineTo(pts[n - 1][0], pts[n - 1][1]); return p; }
  const m = i => [(pts[i % n][0] + pts[(i + 1) % n][0]) / 2, (pts[i % n][1] + pts[(i + 1) % n][1]) / 2];
  const s0 = m(n - 1); p.moveTo(s0[0], s0[1]); for (let i = 0; i < n; i++) { const e = m(i); p.quadraticCurveTo(pts[i][0], pts[i][1], e[0], e[1]); } p.closePath(); return p;
}
function capsule(a, b, ra, rb) {
  const d = sub(b, a), l = len(d) || 1, ang = Math.atan2(d[1], d[0]), n = [-d[1] / l, d[0] / l];
  const p = new Path2D(); p.moveTo(a[0] + n[0] * ra, a[1] + n[1] * ra); p.lineTo(b[0] + n[0] * rb, b[1] + n[1] * rb);
  p.arc(b[0], b[1], rb, ang + Math.PI / 2, ang - Math.PI / 2, true); p.lineTo(a[0] - n[0] * ra, a[1] - n[1] * ra);
  p.arc(a[0], a[1], ra, ang - Math.PI / 2, ang + Math.PI / 2, true); p.closePath(); return p;
}
function circ(c, r) { const p = new Path2D(); p.arc(c[0], c[1], r, 0, TAU); return p; }
// two-bone IK; the middle joint goes to the side of `pref`
function ik(a, b, l1, l2, pref) {
  let d = sub(b, a), D = len(d); const mx = l1 + l2 - .5; if (D > mx) { b = add(a, d, mx / D); d = sub(b, a); D = mx; }
  D = Math.max(D, Math.abs(l1 - l2) + .5);
  const ang = Math.atan2(d[1], d[0]), c = clamp((l1 * l1 + D * D - l2 * l2) / (2 * l1 * D), -1, 1), off = Math.acos(c);
  const m1 = [a[0] + Math.cos(ang + off) * l1, a[1] + Math.sin(ang + off) * l1], m2 = [a[0] + Math.cos(ang - off) * l1, a[1] + Math.sin(ang - off) * l1];
  const mid = lp2(a, b, .5), s1 = (m1[0] - mid[0]) * pref[0] + (m1[1] - mid[1]) * pref[1], s2 = (m2[0] - mid[0]) * pref[0] + (m2[1] - mid[1]) * pref[1];
  return [s1 >= s2 ? m1 : m2, b];
}

// ---- periodic noise for seamless tiles ----
function hI(x, y, s) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function pn(x, y, P, s) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), m = k => ((k % P) + P) % P;
  const a = hI(m(xi), m(yi), s), b = hI(m(xi + 1), m(yi), s), c = hI(m(xi), m(yi + 1), s), d = hI(m(xi + 1), m(yi + 1), s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function pf(x, y, P, s, o = 4) { let t = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { t += a * pn(x * f, y * f, P * f, s + i * 7); n += a; a *= .5; f *= 2; } return t / n; }

// ================================================================ textures (built once)
let INK, ix, TX = {}, SKY, STATIC = [];
function tile(w, h, fn) { const c = Pilot.canvas(w, h), x = c.getContext('2d'), id = x.createImageData(w, h), d = id.data;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const k = (j * w + i) * 4, v = fn(i, j); d[k] = v[0]; d[k + 1] = v[1]; d[k + 2] = v[2]; d[k + 3] = v[3]; }
  x.putImageData(id, 0, 0); return c; }
function wrapStrokes(x, T, n, seed, fn) { const R = rng(seed); for (let i = 0; i < n; i++) { const st = fn(R); for (const ox of [-T, 0, T]) for (const oy of [-T, 0, T]) { x.save(); x.translate(ox, oy); st(x); x.restore(); } } }
function buildTextures() {
  const T = 512;
  const P = hex(PAL.paper);
  TX.paper = tile(T, T, (i, j) => { const m = pf(i / T * 6, j / T * 6, 6, 3) - .5, f = pf(i / T * 40, j / T * 40, 40, 9, 2) - .5, v = m * 20 + f * 7; return [P[0] + v, P[1] + v * .95, P[2] + v * .8, 255]; });
  { const x = TX.paper.getContext('2d'); x.lineCap = 'round';
    for (const [n, col, a, lw, L, sd] of [[700, '#fbf6e9', .35, 1, 40, 7], [260, '#c7b893', .2, .8, 34, 8], [40, '#f9f3e3', .4, 1.5, 90, 9]])
      wrapStrokes(x, T, n, sd, R => { let px = R() * T, py = R() * T, ang = R() * TAU; const l = L * (.3 + R()), al = a * (.4 + R() * .6), w = lw * (.5 + R()), pts = [[px, py]];
        for (let s = 0; s < 5; s++) { ang += (R() - .5) * .9; px += Math.cos(ang) * l / 5; py += Math.sin(ang) * l / 5; pts.push([px, py]); }
        return c => { c.globalAlpha = al; c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (const q of pts) c.lineTo(q[0], q[1]); c.stroke(); }; }); }
  // woodgrain: iso-lines of a warped field (horizontal rings), for source-atop on the ink
  const GT = 1024;
  TX.grain = tile(GT, GT, (i, j) => { const w = pf(i / GT * 3, j / GT * 3, 3, 21, 3); let u = j / GT * 40 + w * 7 + Math.sin(i / GT * TAU * 2) * .8;
    const k1 = Math.hypot((i - 300) * .4, j - 420), k2 = Math.hypot((i - 800) * .4, j - 820); u += 2.2 * Math.exp(-k1 * k1 / 3000) + 1.6 * Math.exp(-k2 * k2 / 2400);
    const f = u - Math.floor(u), d = Math.abs(f - .5) * 2, line = d > .82 ? Math.pow((d - .82) / .18, 1.6) : 0, band = .5 + .5 * Math.sin(u * .9);
    return [24, 20, 30, (line * .8 + band * .25) * 255]; });
  // goma-zuri specks (destination-out)
  TX.speck = tile(T, T, (i, j) => { const m = pf(i / T * 8, j / T * 8, 8, 31, 2), r = hI(i, j, 77), p = .015 + .3 * Math.pow(m, 3.5); return [0, 0, 0, r < p ? 90 + hI(i, j, 78) * 150 : 0]; });
  // baren rubbing (destination-out): blurred arcs + zigzags
  { const c = Pilot.canvas(T, T), x = c.getContext('2d'); x.filter = 'blur(5px)'; x.lineCap = 'round';
    wrapStrokes(x, T, 70, 61, R => { const cx = R() * T, cy = R() * T, r = 30 + R() * 110, a0 = R() * TAU, a1 = a0 + 1 + R() * 3.2, al = .05 + R() * .12, w = 10 + R() * 26;
      return c => { c.strokeStyle = `rgba(0,0,0,${al})`; c.lineWidth = w; c.beginPath(); c.arc(cx, cy, r, a0, a1); c.stroke(); }; });
    wrapStrokes(x, T, 18, 62, R => { const pts = [[R() * T, R() * T]], al = .04 + R() * .07, w = 14 + R() * 20; for (let k = 0; k < 5; k++) pts.push([pts[k][0] + 40 + R() * 50, pts[k][1] + (k % 2 ? 1 : -1) * (20 + R() * 30)]);
      return c => { c.strokeStyle = `rgba(0,0,0,${al})`; c.lineWidth = w; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (const q of pts) c.lineTo(q[0], q[1]); c.stroke(); }; });
    x.filter = 'none'; TX.baren = c; }
  // light fibres over the finished sheet
  { const c = Pilot.canvas(T, T), x = c.getContext('2d'); x.lineCap = 'round';
    wrapStrokes(x, T, 420, 21, R => { let px = R() * T, py = R() * T, ang = R() * TAU; const l = 30 * (.3 + R()), w = .6 + R() * .7, pts = [[px, py]];
      for (let s = 0; s < 5; s++) { ang += (R() - .5) * .9; px += Math.cos(ang) * l / 5; py += Math.sin(ang) * l / 5; pts.push([px, py]); }
      return c => { c.strokeStyle = '#f6eedb'; c.lineWidth = w; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (const q of pts) c.lineTo(q[0], q[1]); c.stroke(); }; });
    TX.fiber = c; }
  // one erosion tile for the ink (destination-out): baren rubbing + goma-zuri specks + paper fibres showing through
  { const c = Pilot.canvas(T, T), x = c.getContext('2d'); x.globalAlpha = .22; x.drawImage(TX.baren, 0, 0); x.globalAlpha = .3; x.drawImage(TX.speck, 0, 0); x.globalAlpha = .1; x.drawImage(TX.fiber, 0, 0); TX.erode = c; }
  // the mount: darker tan paper
  { const c = Pilot.canvas(T, T), x = c.getContext('2d'); x.drawImage(TX.paper, 0, 0); x.globalCompositeOperation = 'multiply'; x.fillStyle = '#c9b38a'; x.fillRect(0, 0, T, T); TX.mount = c; }
}
// the sky: hand-wiped bokashi, per pixel (top indigo band, pale blue toward the horizon)
function buildSky() {
  const sc = .5, w = Math.ceil((SX1 - SX0) * sc), h = Math.ceil(1770 * sc), c = Pilot.canvas(w, h), x = c.getContext('2d'), id = x.createImageData(w, h), d = id.data;
  const A = hex(PAL.prusD), A2 = hex(PAL.prus), Bc = hex(PAL.skyL);
  for (let i = 0; i < w; i++) {
    const X = i / sc, off = (Pilot.noise(X * .004, 3.1) - .5) * 56 + (Pilot.noise(X * .021, 7.7) - .5) * 16;
    for (let j = 0; j < h; j++) {
      const Y = j / sc - 520;
      let a1 = 1 - clamp((Y - (-140 + off)) / 470); a1 = a1 * a1 * (3 - 2 * a1);
      let a2 = clamp((Y - (650 + off * .5)) / 330); a2 = a2 * a2 * .62;
      const k = clamp((Y + 520) / 500), cr = lerp(A[0], A2[0], k), cg = lerp(A[1], A2[1], k), cb = lerp(A[2], A2[2], k);
      const al = a1 + a2 * (1 - a1), q = (j * w + i) * 4;
      if (al < .002) { d[q + 3] = 0; continue; }
      d[q] = (cr * a1 + Bc[0] * a2 * (1 - a1)) / al; d[q + 1] = (cg * a1 + Bc[1] * a2 * (1 - a1)) / al; d[q + 2] = (cb * a1 + Bc[2] * a2 * (1 - a1)) / al; d[q + 3] = al * 255;
    }
  }
  x.putImageData(id, 0, 0); SKY = c;
}

// ================================================================ drawing with blocks
let MK, MF, CAMZ = 1;
const KW = 2.4;                                         // key line width (world px)
function fill(p, col, a = 1) { ix.setTransform(MF); ix.globalAlpha = a; ix.fillStyle = col; ix.fill(p); ix.globalAlpha = 1; }
function key(p, w = KW, col = PAL.sumi, a = 1) { ix.setTransform(MK); ix.globalAlpha = a; ix.lineWidth = w; ix.strokeStyle = col; ix.lineJoin = 'round'; ix.lineCap = 'round'; ix.stroke(p); ix.globalAlpha = 1; }
function both(p, col, w = KW) { fill(p, col); if (w) key(p, w); }
function erase(p, a = 1, style) { ix.setTransform(MF); ix.globalCompositeOperation = 'destination-out'; ix.globalAlpha = a; ix.fillStyle = style || '#000'; ix.fill(p); ix.globalCompositeOperation = 'source-over'; ix.globalAlpha = 1; }
function eraseStroke(p, w, a = 1) { ix.setTransform(MF); ix.globalCompositeOperation = 'destination-out'; ix.globalAlpha = a; ix.lineWidth = w; ix.lineCap = 'round'; ix.strokeStyle = '#000'; ix.stroke(p); ix.globalCompositeOperation = 'source-over'; ix.globalAlpha = 1; }
function pat(img, M, k = 1) { const p = ix.createPattern(img, 'repeat'); p.setTransform(M.scale(k, k)); return p; }

// ================================================================ static landscape (Path2D in world coords, built once)
function ridge(x0, x1, base, amp, seed, step = 30, f = .004) { const pts = []; for (let x = x0; x <= x1; x += step) pts.push([x, base - amp * Pilot.fbm(x * f + seed, seed * 1.7, 3)]); return pts; }
function pinePaths(x, y, h, lean, seed, sc = 1) {   // trunk + flat-topped needle pads
  const R = rng(seed), top = [x + lean * h, y - h], trunk = [], pads = [], needles = new Path2D(), branches = new Path2D();
  for (let k = 0; k <= 6; k++) { const u = k / 6; trunk.push([lerp(x, top[0], u) + Math.sin(u * 5 + seed) * 6 * sc, lerp(y, top[1], u)]); }
  const tp = new Path2D(); const tl = trunk.map((q, i) => [q[0] - (7 - i * .8) * sc, q[1]]), tr = trunk.map((q, i) => [q[0] + (7 - i * .8) * sc, q[1]]).reverse();
  const tpath = poly(tl.concat(tr));
  const n = 4 + (R() * 3 | 0);
  for (let k = 0; k < n; k++) {
    const u = .35 + .65 * k / (n - 1), b = lp2([x, y], top, u), side = k % 2 ? 1 : -1, reach = (40 + R() * 50) * sc * (1.2 - u * .5);
    const c = [b[0] + side * reach, b[1] - 10 * sc], w = (46 + R() * 34) * sc * (1.25 - u * .5), hh = (12 + R() * 6) * sc;
    branches.moveTo(b[0], b[1]); branches.quadraticCurveTo(lerp(b[0], c[0], .5), b[1] + 8 * sc, c[0], c[1] + hh * .3);
    const pad = new Path2D(); pad.moveTo(c[0] - w, c[1] + hh * .45); pad.bezierCurveTo(c[0] - w * .7, c[1] - hh * 1.1, c[0] + w * .7, c[1] - hh * 1.1, c[0] + w, c[1] + hh * .45);
    pad.quadraticCurveTo(c[0], c[1] + hh * .9, c[0] - w, c[1] + hh * .45); pads.push(pad);
    for (let q = 0; q < 9; q++) { const qx = c[0] - w * .8 + q * w * 1.6 / 8, qy = c[1] - hh * .1 - Math.sin(q / 8 * Math.PI) * hh * .55; for (const s2 of [-1, 0, 1]) { needles.moveTo(qx, qy + hh * .5); needles.lineTo(qx + s2 * 5 * sc, qy - 2 * sc); } }
  }
  return { tpath, pads, needles, branches };
}
function buildStatic() {
  const L = STATIC;

  const m1 = ridge(SX0 - 20, SX1 + 20, 930, 150, 2.3, 24, .0016).map(([x, y]) => [x, y - 220 * Math.exp(-Math.pow((x - 1500) / 260, 2)) - 90 * Math.exp(-Math.pow((x - 1700) / 120, 2))]);

// ================================================================ timeline: me
function walkPhase(dist, stride) { return ((dist / (4 * stride)) % 1 + 1) % 1; }

function meState(t) {

      if (ta < b + .25 && k !== 2) {                            // setting it down, turning round
        return { ...m, x: lerp(k === 0 ? X1 : X2, kx, .6), f: 1, mode: 'stand', lean: .35, hipH: 120, lying, kneelIn: true, bow: .3 };
      }

  }

    if (t >= 12.0 && t < 12.4) { x = lerp(EDGE_ME, EDGE_ME + 50, eo(seg(t, 12.0, 12.35))); lean = -.12; }      // recoil

    else if (t >= 13.2 && t < 18.0) { x = lerp(EDGE_ME + 50, EDGE_ME + 120, ss(13.2, 13.7, ta)); }            // step aside for them
    else if (t >= 18.0) { x = lerp(EDGE_ME + 120, EDGE_ME, ss(18.0, 18.38, t)); mode = t < 18.38 ? 'walk' : 'stand'; ph = walkPhase(EDGE_ME + 120 - x, 30); }

  if (t < 21.0) return { ...m, x: EDGE_ME - 4, f: -1, mode: 'stand', lean: .22, hipH: 130, bow: .55, hands: 'limp' };

// my laid cross (18.4 → fall): returns cross pose {F, ang, L, fl} (lane 0, world coords) or null
const PIV = LN(MY_CROSS_D, XN, GY);

// ================================================================ the cross
function crossGeo(c) {
  const u = [Math.cos(c.ang), Math.sin(c.ang)], Hd = add(c.F, u, c.L), J = add(Hd, u, -CB);
  let pv = [-u[1], u[0]]; if (pv[0] * DFL[0] + pv[1] * DFL[1] < 0) pv = [-pv[0], -pv[1]];
  const v = lp2([pv[0] * ARM, pv[1] * ARM], DFL, c.fl);
  return { u, Hd, J, v, pv };
}
function drawCross(c, mine, o = {}) {

  let n = [-u[1], u[0]]; if (n[1] > 0) n = [-n[0], -n[1]];        // n points up (top edge)

  const ghost = o.ghost;

  const top = poly([fT, hT, add(hT, Dt), add(fT, Dt)]);

  if (ghost) { const ga = o.alpha ?? 1; fill(top, PAL.beniC, ga * .3); fill(beam, PAL.beniC, ga * .3); fill(bar, PAL.beniC, ga * .3); key(top, w * .8, PAL.sumi, ga * .9); key(beam, w, PAL.sumi, ga); key(bar, w, PAL.sumi, ga); return g; }
  if (fl > .3) both(top, colT, w * .8);
  both(beam, col, w);
  // grain lines on the beam
  const gp = new Path2D(); for (const [a, b2, off] of [[.06, .4, .35], [.5, .92, -.3], [.3, .7, .05]]) { const p0 = add(add(F, u, c.L * a), n, hw * off), p1 = add(add(F, u, c.L * b2), n, hw * off); gp.moveTo(p0[0], p0[1]); gp.lineTo(p1[0], p1[1]); }
  key(gp, w * .45, mine ? '#5a1d14' : PAL.woodD, .7);
  if (!o.piece) both(bar, fl > .5 ? colT : col, w);

  if (mine && c.L < L0 - 1) { const e = poly([add(F, n, hw), add(add(F, n, hw), Dt), add(add(F, n, -hw), Dt), add(F, n, -hw)]); fill(e, PAL.beniC); key(e, w * .6); }
  return g;
}
// a lying piece (lane 0): x range a..b, slight in-plane tilt
function drawPiece(a, b, yb, rot, lift = 0, d = LY_D) {
  const F = LN(d, b, yb - 7 - lift), Lp = b - a, ang = Math.PI + rot;

// the kerf + sawdust while I saw
function drawKerf(xc, prog, ta) {

  const [xw, top] = LN(LY_D, xc, GY - 14); xc = xw; const p = new Path2D(); p.moveTo(xc, top + 1); p.lineTo(xc, top + 14 * prog); p.moveTo(xc, top + 1); p.lineTo(xc + DX * 15, top + DY * 15);

// ================================================================ figures
// world-space rig. f = −1 faces left. Returns joints; drawFigure draws in layers with hooks.
function rig(o, t) {
  const s = o.s, f = o.f, [gx, gy0] = LN(o.d, o.x, GY), gy = gy0 + (o.dy || 0);
  const TH = 68 * s, SH = 64 * s, TO = 76 * s, UA = 52 * s, FA = 48 * s;
  let hip, footN, footF, kneeN, kneeF;
  const lean = o.lean || 0;

    footN = [gx + f * 16 * s, gy]; footF = [gx - f * 2 * s, gy];

    const [a1, l1] = legT(ph), [a2, l2] = legT(ph + .5);

  }
  const sh = [hip[0] + f * Math.sin(lean) * TO, hip[1] - Math.cos(lean) * TO];
  const hb = lean + (o.bow || 0);
  const head = [sh[0] + f * Math.sin(hb) * 24 * s, sh[1] - Math.cos(hb) * 24 * s];

  const roof = smooth([[bx - w - 82, by - hpost - 6], [bx - w - 40, by - hpost - 14], [bx, by - hpost - 64], [bx + w + 40, by - hpost - 14], [bx + w + 82, by - hpost - 6], [bx + w + 50, by - hpost + 10], [bx - w - 50, by - hpost + 10]], true);
  both(roof, PAL.greyD, KW);
  const tl = new Path2D(); for (let i = -6; i <= 6; i++) { tl.moveTo(bx + i * 18, by - hpost - 52 + Math.abs(i) * 6); tl.lineTo(bx + i * 24, by - hpost + 4); } key(tl, 1.4, PAL.sumi, .8);

// ================================================================ camera (moves on ones)
function camFollow(z, x, gyScreen) { return { z, x, y: GY - (gyScreen - 960) / z }; }

function camera(t) {

  const s0 = camFollow(1.08, meX(X0 - V0 * Math.min(t, SAW[0])) - 90, 1250);
  const s1 = camFollow(1.7, K1 + DX * ME_D + 10, 1100);
  const s2 = camFollow(1.0, Math.max(XN + 600, meX(meRunX(clamp(t, RUN0, RUN1))) - 170), 1240);   // the gap stays out of frame until 12 s
  const s3 = camFollow(1.6, XC2 + DX * LY_D + 60, 1100);
  const s4 = camFollow(lerp(.98, 1.04, ss(12.2, 18.4, t)), lerp(700, 690, ss(12, 18.4, t)), 1180);
  if (t < 3.05) return s0;
  if (t < 4.35) return mix(s0, s1, eio(seg(t, 3.05, 3.45)));
  if (t < 8.7) return mix(s1, s2, eio(seg(t, 4.35, 4.9)));
  if (t < 11.3) return mix(s2, s3, eio(seg(t, 8.7, 9.1)));
  if (t < 19.2) return mix(mix(s3, s4, eio(seg(t, 11.3, 12.05))), camFollow(1.42, 790, 1120), eio(seg(t, 18.05, 18.55)));
  if (t < 20.3) {                                                 // the hit: hard cut to a tight print following the drop
    const u = seg(t, 19.2, 20.3), shake = t > 19.2 + FALL.tHit && t < 19.55 + FALL.tHit ? Math.sin(t * 90) * 6 * (1 - seg(t, 19.2 + FALL.tHit, 19.55 + FALL.tHit)) : 0;
    return { z: 1.9, x: FALL.hitX + 40 + shake, y: lerp(1400, 1470, eo(u)) };
  }
  const s6 = camFollow(1.0, 700, 1180);
  if (t < 21.0) return s6;
  const s7 = camFollow(.59, 1400, 1100);
  const s8 = camFollow(1.15, 690, 1120);
  if (t < 23.4) return mix(s6, s7, eio(seg(t, 21.0, 22.4)));
  return mix(s7, s8, eio(seg(t, 23.45, 25.1)));
}

// ================================================================ frame
function lanesDraw(t) {
  const items = [];
  const me = meState(t);
  const lay = myLay(t);
  // others (+ their crosses as separate items when off the shoulder)
  for (const o of OTH) {
    const st = othState(o, t), cr = othCross(o, t);
    if (cr) items.push({ d: o.cd, z: 0, fn: () => drawCross(cr, false) });
    if (st) items.push({ d: st.d, z: 1, fn: () => drawFigure(st, t, { cross: cr }) });
  }
  // pieces on the road / flying to the gap
  for (let k = 0; k < 3; k++) {
    const P = PIECES[k]; if (t < P.at) continue;
    const [g0, g1] = GLIDE[k], u = seg(t, g0, g1), e = eio(u), lift = Math.sin(u * Math.PI) * 70;
    const a = lerp(P.a, P.ta, e), b = lerp(P.b, P.tb, e), rot = lerp(P.rot, 0, e);
    const drop = t < P.at + .25 ? (1 - eo(seg(t, P.at, P.at + .25))) * 10 : 0;
    const pd = lerp(LY_D, MY_CROSS_D, e), gl = Pilot.win(t, 21.7, 23.6, .5, .5);
    if (gl > 0) items.push({ d: pd + .1, z: 1.9, fn: () => { const [cx, cy] = LN(pd, (a + b) / 2, GY - 10); ix.setTransform(MF); const rg = ix.createRadialGradient(cx, cy, 4, cx, cy, 90); rg.addColorStop(0, `rgba(0,0,0,${.75 * gl})`); rg.addColorStop(1, 'rgba(0,0,0,0)'); erase(circ([cx, cy], 90), 1, rg); } });
    items.push({ d: pd, z: 2, fn: () => drawPiece(a, b, GY - drop, rot, lift, pd) });
  }
  // my cross: carried (drawn by the figure), lying while I saw, laid / falling
  let mid = null;
  if (me.lying) { const L = me.lying.L, F = LN(LY_D, me.lying.foot, GY - 7); mid = () => { drawCross({ F, ang: Math.PI, L, fl: 1 }, true); if (me.saw) drawKerf(me.saw.xc, me.saw.prog, me.saw.ta); }; }
  if (lay && !lay.falling) items.push({ d: MY_CROSS_D, z: 3, fn: () => drawCross(lay, true) });
  // the ghost of my whole cross across the gap (key block only), from 23.0
  const ga = ss(23.0, 23.6, t);
  if (ga > 0) items.push({ d: MY_CROSS_D, z: 1.5, fn: () => drawCross({ F: LN(MY_CROSS_D, BR_FOOT, GY - 7), ang: Math.PI, L: L0, fl: 1 }, true, { ghost: true, alpha: ga, kw: 2.2 }) });
  const meSt = { ...me, mineCross: true };
  items.push({ d: me.d, z: 1, fn: () => drawFigure(meSt, t, { mid, cross: lay }) });
  items.sort((a, b) => (b.d - a.d) || (a.z - b.z));

}
function world(t) { const OFF = window.__off || {};
  if (!OFF.sky) ix.setTransform(MF), ix.drawImage(SKY, SX0, -520, SX1 - SX0, 1770);
  // the gate's light warming the sky (ochre bokashi, deepening as each one goes in)
  const [gx, gy] = LN(GATE_D, GATE_X, GY - 160), glow = .32 + .1 * ss(14, 16, t);
  ix.setTransform(MF); const rg = ix.createRadialGradient(gx, gy, 20, gx, gy, 700); rg.addColorStop(0, rgba(PAL.ochreL, glow)); rg.addColorStop(1, rgba(PAL.ochreL, 0));
  ix.fillStyle = rg; ix.fillRect(gx - 700, gy - 700, 1400, 1100);
  for (const l of STATIC) {
    if (l.mist && OFF.mist) continue; if (l.pine && OFF.pine) continue; if (l.fill && OFF.fill) continue;
    if (l.mist) { for (const [x, y, w, h] of l.mist) mistBand(x, y, w, h * 1.4, .95); continue; }
    if (l.gorge) { if (!OFF.gorge) drawGorge(t); continue; }
    if (l.pine) { const P = l.pine; both(P.tpath, PAL.woodD, KW); key(P.branches, 5, PAL.woodD); key(P.branches, 1.2); for (const pd of P.pads) both(pd, PAL.pine, KW * .9); key(P.needles, 1, '#22331f', .8); continue; }
    if (l.fill) fill(l.p, l.fill);
    if (l.rock) { const r = l.rock[0] < E ? ROCKS[0] : ROCKS[1]; for (const b of r.blocks) both(b.p, b.c, 2); key(r.p, 2, PAL.rockD, .9); const mp = new Path2D(); for (const [x, y, rr] of r.moss) { mp.moveTo(x + rr, y); mp.arc(x, y, rr, 0, TAU); } fill(mp, PAL.greenD); }
    if (l.road) key(l.road[0] < E ? ROADM[0] : ROADM[1], 1.6, PAL.roadD);
    if (l.key) key(l.p, l.key, l.keyCol || PAL.sumi);
  }
  // mist bands across the cliffs and the cleft (suyari-gasumi)
  for (const [my, mx0, mw, mh] of [[1430, 60, 1250, 40], [1560, 760, 1500, 34], [1500, 2000, 900, 30]]) mistBand(mx0 + Math.sin(t * .35 + my) * 16, my, mw, mh, .7);
  if (!OFF.gate) drawGate(t);
  const lay = myLay(t);
  if (lay && lay.falling) { ix.save(); ix.setTransform(MK); const c = new Path2D(); c.rect(-1e4, -1e4, 2e4, 1e4 + SEA + 4); ix.clip(c); drawCross(lay, true); ix.restore(); }
  if (!OFF.sea) drawSea(t);
  drawSplash(t);
  if (!OFF.lanes) lanesDraw(t);
  // the sheet's border (thick + thin key)
  key(poly([[SX0 + 26, SY0 + 26], [SX1 - 26, SY0 + 26], [SX1 - 26, SY1 - 26], [SX0 + 26, SY1 - 26]]), 5);
  key(poly([[SX0 + 12, SY0 + 12], [SX1 - 12, SY0 + 12], [SX1 - 12, SY1 - 12], [SX0 + 12, SY1 - 12]]), 1.6);
}
function plate(ctx, x0, y0, x1, y1, a) {   // cream cartouche, thick + thin ink border
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(243,231,198,.97)'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  ctx.globalAlpha = a * .5; ctx.drawImage(TX.fiber, 0, 0, 512, 512, x0, y0, x1 - x0, y1 - y0); ctx.globalAlpha = a;
  ctx.strokeStyle = PAL.sumi; ctx.lineWidth = 3.4; ctx.strokeRect(x0 + 6, y0 + 6, x1 - x0 - 12, y1 - y0 - 12); ctx.lineWidth = 1.2; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
  ctx.restore();
}
const CAP = { font: "'Noto Serif KR',serif", weight: 700, color: '#231f1c', srcColor: '#3a3430', srcFont: "'Noto Sans KR',sans-serif", shadow: 'rgba(243,231,198,.6)', shadowBlur: 4 };
function captions(ctx, t) {
  for (const [a, b, s, src] of S.lines) {
    const al = Pilot.win(t, a, b, .35, .45); if (al <= 0) continue;
    const str = Pilot.tr(s), two = str.includes('\n'), size = two ? 54 : 62, y = 430;
    ctx.font = `700 ${size}px ${CAP.font}`; let w = Math.max(...str.split('\n').map(l => ctx.measureText(l).width));
    let bottom = y + (two ? size * 1.55 : 0) + size * .32 + 30;
    if (src) { ctx.font = `400 28px ${CAP.srcFont}`; w = Math.max(w, ctx.measureText(Pilot.tr(src)).width); bottom = y + (two ? size * 1.55 : 0) + 76 + 40; }
    const half = Math.min(500, w / 2 + 52);
    const drop = (1 - eo(seg(t, a, a + .35))) * 14;
    plate(ctx, 540 - half, y - size - 34 - drop, 540 + half, bottom - drop, al);
  }
  Story.captions(ctx, t, S.lines, CAP);
}
function draw(ctx, t) {
  const c = camera(t); CAMZ = c.z;
  MK = new DOMMatrix([c.z, 0, 0, c.z, 540 - c.x * c.z, 960 - c.y * c.z]);
  MF = new DOMMatrix([1, 0, 0, 1, 2.2, -1.6]).multiply(MK);
  // mount + paper
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const OFF = window.__off || {}, sheet = poly([[SX0, SY0], [SX1, SY0], [SX1, SY1], [SX0, SY1]]);
  const tl = MK.transformPoint(new DOMPoint(SX0, SY0)), br = MK.transformPoint(new DOMPoint(SX1, SY1)), covers = tl.x <= 0 && tl.y <= 0 && br.x >= W && br.y >= H;
  ctx.imageSmoothingEnabled = false;
  if (!OFF.pp) { if (!covers) { const mp = ctx.createPattern(TX.mount, 'repeat'); mp.setTransform(MK); ctx.fillStyle = mp; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.setTransform(MK); ctx.translate(10, 12); ctx.fillStyle = 'rgba(80,60,30,.25)'; ctx.fill(sheet); ctx.restore(); }
  const pp = ctx.createPattern(TX.paper, 'repeat'); pp.setTransform(MK); ctx.save(); ctx.setTransform(MK); ctx.clip(sheet); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = pp; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  ctx.imageSmoothingEnabled = true;
  // ink
  ix.setTransform(1, 0, 0, 1, 0, 0); ix.globalCompositeOperation = 'source-over'; ix.globalAlpha = 1; ix.clearRect(0, 0, W, H);
  world(t);
  ix.setTransform(1, 0, 0, 1, 0, 0);
  ix.imageSmoothingEnabled = false;
  if (!OFF.tex) { ix.globalCompositeOperation = 'source-atop'; ix.globalAlpha = .13; ix.fillStyle = pat(TX.grain, MK, 1.3); ix.fillRect(0, 0, W, H);
  ix.globalCompositeOperation = 'destination-out'; ix.globalAlpha = 1; ix.fillStyle = pat(TX.erode, MK, 1.25); ix.fillRect(0, 0, W, H); }
  ix.globalCompositeOperation = 'source-over'; ix.globalAlpha = 1; ix.imageSmoothingEnabled = true;
  // end: the print washes back to paper under the cartouche
  const wash = ss(B.end, B.end + .6, t);
  ctx.save(); ctx.setTransform(MK); ctx.clip(sheet); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1 - .8 * wash; ctx.drawImage(INK, 0, 0); ctx.restore();
  if (OFF.fibOn) { ctx.globalAlpha = .09; const fp = ctx.createPattern(TX.fiber, 'repeat'); fp.setTransform(MK); ctx.fillStyle = fp; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  // the gate's light (paper-warm, screen)
  const [gx, gy] = LN(GATE_D, GATE_X, GY - 140), pulse = [B.bridges[0], B.bridges[1], B.bridges[2]].reduce((s, b) => s + Math.exp(-Math.pow((t - (b + 6.0)) / .5, 2)), 0);
  const scr = MK.transformPoint(new DOMPoint(gx, gy)), R0 = 260 * c.z;
  ctx.save(); ctx.globalCompositeOperation = 'screen'; const lg = ctx.createRadialGradient(scr.x, scr.y, 0, scr.x, scr.y, R0 * 1.6);
  lg.addColorStop(0, `rgba(255,236,190,${(.32 + .2 * pulse) * (1 - wash)})`); lg.addColorStop(1, 'rgba(255,236,190,0)'); ctx.fillStyle = lg; ctx.fillRect(scr.x - R0 * 1.6, scr.y - R0 * 1.6, R0 * 3.2, R0 * 3.2); ctx.restore();
  captions(ctx, t);
  if (wash > 0) { plate(ctx, 110, 600, 970, 1150, wash); Story.endCard(ctx, t, S.endCard, B.end, { font: "'Noto Serif KR',serif", color: '#231f1c', srcColor: '#3a3430', titleShadow: '' }); }
}
async function init() {
  INK = Pilot.canvas(W, H); ix = INK.getContext('2d');
  buildTextures(); buildSky(); buildStatic();
  ROCKS = [rockStrokes(SX0 + 20, XF - 210, 31), rockStrokes(XN + 20, SX1 - 20, 32)];
  ROADM = [roadMarks(SX0, XF, 41), roadMarks(XN + 40, SX1, 42)];
}
Pilot.run({ W, H, dur: S.DUR, fonts: ["700 54px 'Noto Serif KR'", "400 28px 'Noto Sans KR'", "500 34px 'Noto Sans KR'"], init, draw });
