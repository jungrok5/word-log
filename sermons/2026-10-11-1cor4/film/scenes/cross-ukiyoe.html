<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잘라 낸 건 다리였다 · ④ 우키요에</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script src="story.js"></script>
<script src="source.js"></script>
<script src="script.js"></script>
<script src="kit-ukiyoe.js"></script>
<script>
/* 잘라 낸 건 다리였다 — ④ Ukiyo-e (lemo-opuscar styles/ukiyoe/STYLE.md). One long woodblock handscroll seen through a
   portrait window: a coastal cliff road (Tōkaidō road-station grammar) with a procession of pilgrims dragging wooden
   crosses; mine is the one block printed in beni red. Flat colour blocks out of register with the sumi key block, bokashi
   sky, woodgrain / baren / goma-zuri on the ink, washi fibres over everything. Depth is oblique (fukinuki): one unit of
   depth = (+.5, −.42) px, so a cross lying flat shows its crossbar as a slanted parallelogram.
   Story: I stagger (my cross drags), squat and saw its foot off, stride past the others, saw twice more; the road ends at
   a cleft over the sea; the others raise their crosses on the edge and let them fall forward — each lands exactly across;
   mine falls short, tips and drops (hard cut to a tight print, the sea throws up claws). Pull back over the whole scroll:
   my three red offcuts lie on the road behind me; they fly up the scroll and fill the gap beside the key-line ghost of my
   cross — exactly a bridge. End card on a cartouche over the print washed back to paper. Figures pose on 8 fps, water
   on 12, the camera on ones.
   The style (blocks, paper, sky, sea, pines, mist, the arch, the pilgrim rig, the frame) is styles/ukiyoe → kit-ukiyoe.js;
   this file keeps the story: the layout of the road and the cleft, the timelines, the saw, the camera. */
const { clamp, lerp, ss, eo, eio, rng } = Pilot;
const U = Ukiyoe, PAL = U.PAL, KW = U.KW;
const { LN, DX, DY, add, sub, len, nrm, lp2, seg, st8, st12, trap, poly, circ, capsule, fill, key, both, walkPhase } = U;
const S = window.SCRIPT, B = S.beat, W = Pilot.W, H = Pilot.H, LEFT = S.left, SAW = B.saw;
const TAU = Math.PI * 2;

// ================================================================ world
const L0 = 420, G = 360, E = 900, XN = E, XF = E - G, GY = 1270, SEA = 1700;
const ROAD_D = 240;                                      // road depth (oblique units; the kit's LN: 1 unit → (+.5, −.42))
const SX0 = 0, SY0 = -520, SX1 = 2900, SY1 = 2250;        // the print (one long sheet)
// 1 = the full length the gap needs.  Crossbar 105 below the head, arms 105 each (in plane); lying flat they slant.
const CB = 90, ARM = 75;                                  // = Ukiyoe.timber defaults (cb, arm)
const CUTL = [L0 * (LEFT[0] - LEFT[1]), L0 * (LEFT[1] - LEFT[2]), L0 * (LEFT[2] - LEFT[3])];   // the three offcuts

// ---- my path ----
const ME_D = 95, MY_CROSS_D = 20, LY_D = 50;
const X0 = 2150, V0 = 45, X1 = X0 - V0 * SAW[0];          // heavy walk until the first cut
const FOOT1 = X1 + 215, XC1 = FOOT1 - CUTL[0], K1 = XC1 - 62;
const X2 = 1050, RUN0 = 4.6, RUN1 = 8.9;
const FOOT2 = X2 + 194, XC2 = FOOT2 - CUTL[1], K2 = XC2 - 62, XC3 = XC2 - CUTL[2], K3 = XC3 - 62;
const EDGE_ME = XN + 45;
// pieces at rest (lane-local x range on the road, lane 0)
const PIECES = [
  { a: XC1 + 16, b: FOOT1 + 16, rot: .05, at: SAW[0] + .8 },
  { a: XC2 + 16, b: FOOT2 + 16, rot: -.04, at: SAW[1] + .8 },
  { a: XC3 + 10, b: XC2 + 10, rot: .03, at: SAW[2] + .8 },
];
// where they go: the foot part of the ghost cross across the gap (foot on the near edge)
const BR_FOOT = XN + 15, BR_HEAD = BR_FOOT - L0;
PIECES[0].ta = BR_FOOT - CUTL[0]; PIECES[0].tb = BR_FOOT;
PIECES[1].ta = PIECES[0].ta - CUTL[1]; PIECES[1].tb = PIECES[0].ta;
PIECES[2].ta = PIECES[1].ta - CUTL[2]; PIECES[2].tb = PIECES[1].ta;
const GLIDE = [[B.fill[0], 23.4], [22.75, 23.9], [23.25, B.fill[1]]];   // one by one into the outline

// ---- the others ----
const STOPX = XN + 42;
const OTH = [
  { id: 'A', d: 235, x0: 1700, fo: 0, beat: B.bridges[0], robe: '#a5784a', robeD: '#7b5432', legs: '#4a3a2c', s: .94 },
  { id: 'B', d: 180, x0: 1850, fo: 22, beat: B.bridges[1], robe: '#8b8a80', robeD: '#5f5e58', legs: '#3d3c38', s: .95 },
  { id: 'C', d: 130, x0: 1990, fo: -12, beat: B.bridges[2], robe: '#7f9fb8', robeD: '#4d6f98', legs: '#2a3448', s: .93 },
];
for (const o of OTH) if (o.beat) { o.tStop = o.beat - .6; o.v = (o.x0 - STOPX) / o.tStop; o.cd = o.d - 20; }
const ME_C = { robe: '#3f5878', robeD: '#2c4a70', legs: '#25304a', s: 1 };
const GATE_X = 400, GATE_D = 120;
const WALK_V = 150;                      // crossing speed

// ================================================================ static landscape (Path2D in world coords, built once)
let SKY, STATIC = [], ROCKS, ROADM;
function buildStatic() {
  const L = STATIC;
  // far mountains (no key line: far = pale, low contrast)
  const m1 = U.ridge(SX0 - 20, SX1 + 20, 930, 150, 2.3, 24, .0016).map(([x, y]) => [x, y - 220 * Math.exp(-Math.pow((x - 1500) / 260, 2)) - 90 * Math.exp(-Math.pow((x - 1700) / 120, 2))]);
  L.push({ p: poly([[SX0 - 20, 1200], ...m1, [SX1 + 20, 1200]]), fill: PAL.mtn });
  const m2 = U.ridge(SX0 - 20, SX1 + 20, 1030, 110, 5.1, 24, .0026);
  L.push({ p: poly([[SX0 - 20, 1250], ...m2, [SX1 + 20, 1250]]), fill: PAL.mtn2, key: 1.4, keyCol: PAL.prusL });
  L.push({ mist: [[180, 1018, 1500, 38], [1350, 1062, 1700, 34], [300, 1105, 900, 26]] });
  // mid hills (green) with pines, down to the road's back edge
  const h1 = U.ridge(SX0 - 20, SX1 + 20, 1150, 70, 8.4, 20, .003);
  L.push({ p: poly([[SX0 - 20, 1300], ...h1, [SX1 + 20, 1300]]), fill: PAL.greenL, key: 2 });
  const h2 = U.ridge(SX0 - 20, SX1 + 20, 1200, 34, 11.2, 20, .006);
  L.push({ p: poly([[SX0 - 20, 1300], ...h2, [SX1 + 20, 1300]]), fill: PAL.green, key: 2.2 });
  for (const [x, hh, ln, sd, sc] of [[1420, 120, .1, 3, .7], [1980, 140, -.08, 5, .75], [2550, 110, .12, 6, .7], [760, 100, .06, 8, .62], [60, 300, .1, 9, 1.1]]) {
    const yb = (x < 200 ? GY - 60 : h1[Math.round((x + 20) / 20)][1] + 26);
    L.push({ pine: U.pine(x, yb, hh, ln, sd, sc) });
  }
  // the road (top surfaces, oblique), near and far side of the gap
  const nearTop = U.roadTop(XN, SX1 + 30, GY, ROAD_D), farTop = U.roadTop(SX0 - 60, XF, GY, ROAD_D), BD = LN(ROAD_D, 0, 0);
  L.push({ gorge: true });                                   // gorge interior (behind the cliffs, below the road's back edge)
  // far cliff: its right face (looking into the gap) + front face
  const fr = U.jagged(XF, GY, SY1, 60, 18, .02, 4);
  const farRight = poly([[XF, GY], [XF + BD[0], GY + BD[1]], [XF + BD[0] + 20, SY1], [XF + 12, SY1]]);
  L.push({ p: farRight, fill: PAL.rockF, key: 2.4 });
  const farFront = poly([[SX0 - 60, GY], ...fr, [fr[fr.length - 1][0], SY1 + 10], [SX0 - 60, SY1 + 10]]);
  L.push({ p: farFront, fill: PAL.rock, key: 2.6, rock: [SX0, XF] });
  // near cliff front face (its left edge jagged down into the gorge)
  const nl = U.jagged(XN, GY, SY1, 55, 20, -.03, 7);
  const nearFront = poly([[SX1 + 60, GY], ...nl, [nl[nl.length - 1][0], SY1 + 10], [SX1 + 60, SY1 + 10]]);
  L.push({ p: nearFront, fill: PAL.rock, key: 2.6, rock: [XN, SX1] });
  L.push({ p: farTop, fill: PAL.road, key: 2.4, road: [SX0, XF] });
  L.push({ p: nearTop, fill: PAL.road, key: 2.4, road: [XN, SX1] });
  // cliff pines (hanging over the sea)
  for (const [x, y, hh, ln, sd, sc] of [[1640, 1500, 150, -.35, 12, .8], [2380, 1440, 120, .4, 13, .7], [150, 1460, 140, .38, 14, .75]]) L.push({ pine: U.pine(x, y, hh, ln, sd, sc) });
}

// ================================================================ timeline: me
function meRunX(t) { return K1 - (K1 - X2) * trap(seg(t, RUN0, RUN1), .09); }
// state: { x, d, f, mode, ph, stride, lean, hipH, cross: {...}|null, saw, holdBeam, look }
function meState(t) {
  const ta = st8(t), m = { d: ME_D, s: 1, ...ME_C };
  // carried cross (L = current length)
  const Lc = t < SAW[0] + .8 ? L0 * LEFT[0] : t < SAW[1] + .8 ? L0 * LEFT[1] : t < SAW[2] + .8 ? L0 * LEFT[2] : L0 * LEFT[3];
  m.L = Lc;
  if (t < SAW[0]) {                                             // heavy: staggering under the whole cross
    const x = X0 - V0 * t, wob = Math.sin(ta * 2.3) * .05 + .12 * Math.exp(-Math.pow((ta - 1.7) / .35, 2));
    return { ...m, sawHold: true, x, f: -1, mode: 'walk', ph: walkPhase(X0 - x, 20), stride: 20, lean: .5 + wob, hipH: 112 - 10 * Math.exp(-Math.pow((ta - 1.7) / .3, 2)), carry: { drag: true }, bow: .15 };
  }
  for (let k = 0; k < 3; k++) {                                 // the three cuts
    const b = SAW[k], xc = [XC1, XC2, XC3][k], foot = [FOOT1, FOOT2, XC2][k], kx = [K1, K2, K3][k];
    const end = k === 0 ? RUN0 : k === 1 ? SAW[2] : 12.0;
    if (t >= b && t < end) {
      const dropped = t >= b + .8, head = k === 0 ? FOOT1 - L0 : FOOT2 - L0 * LEFT[1];
      const lf = dropped ? xc : foot, lying = { foot: lf, L: lf - head };
      const sawOn = ta >= b + .25 && ta < b + .75, prog = seg(t, b + .3, b + .78);
      // cut 2 → 3: shuffle left on the knees between 9.85 and 10.35
      let x = kx;
      if (k === 1 && t >= b + .85) x = lerp(K2, K3, ss(b + .9, b + 1.3, ta));
      if (k === 2) x = K3;
      const rise = k === 0 ? seg(ta, b + .85, b + 1.3) : k === 2 ? seg(ta, b + .85, b + 1.15) : 0;
      if (ta < b + .25 && k !== 2) {                            // setting it down, turning round
        return { ...m, x: lerp(k === 0 ? X1 : X2, kx, .6), f: 1, mode: 'stand', lean: .35, hipH: 120, lying, kneelIn: true, bow: .3 };
      }
      if (rise > 0) {
        if (rise < .5) return { ...m, x, f: 1, mode: 'stand', lean: .25, hipH: 128, lying, bow: .2, hands: 'lift' };
        // shouldered again, walking off (k = 2: to the edge)
        if (k === 2) {
          const u = seg(t, b + 1.15, 12.0), xw = lerp(K3 + 20, EDGE_ME, eo(u));
          return { ...m, sawHold: true, x: xw, f: -1, mode: u < 1 ? 'walk' : 'stand', ph: walkPhase(K3 - xw, 36), stride: 36, lean: .1, hipH: 134, carry: {} };
        }
        return { ...m, sawHold: true, x: x - 20, f: -1, mode: 'stand', lean: .14, hipH: 134, carry: {} };
      }
      return { ...m, x, f: 1, mode: 'squat', lean: .6, lying, saw: { on: sawOn, xc, prog: k === 1 && t >= b + .85 ? 0 : prog, ta }, bow: .35 };
    }
  }
  if (t < RUN1 + .1 && t >= RUN0) {                            // light: striding ahead
    const x = meRunX(t);
    return { ...m, sawHold: true, x, f: -1, mode: 'walk', ph: walkPhase(K1 - x, 64), stride: 64, lean: .24, hipH: 136, carry: {}, run: true };
  }
  if (t < SAW[1]) return { ...m, x: X2, f: -1, mode: 'stand', lean: .1, hipH: 134, carry: {} };
  // at the edge
  if (t < B.mine) {
    let x = EDGE_ME, mode = 'stand', ph = 0, lean = 0;
    if (t >= 12.0 && t < 12.4) { x = lerp(EDGE_ME, EDGE_ME + 50, eo(seg(t, 12.0, 12.35))); lean = -.12; }      // recoil
    else if (t >= 12.4 && t < 13.2) { x = EDGE_ME + 50; lean = -.05; }
    else if (t >= 13.2 && t < 18.0) { x = lerp(EDGE_ME + 50, EDGE_ME + 120, ss(13.2, 13.7, ta)); }            // step aside for them
    else if (t >= 18.0) { x = lerp(EDGE_ME + 120, EDGE_ME, ss(18.0, 18.38, t)); mode = t < 18.38 ? 'walk' : 'stand'; ph = walkPhase(EDGE_ME + 120 - x, 30); }
    if (t >= 13.2 && t < 13.7) { mode = 'walk'; ph = walkPhase(x - EDGE_ME, 22); }
    return { ...m, sawHold: true, x, f: -1, mode, ph, stride: 30, lean, hipH: 134, carry: {}, bow: t > 14 && t < 18 ? .05 : -.08 };
  }
  // mine: raise, let it fall forward, hang short (held down at the foot), tip, drop
  if (t < B.fall) return { ...m, x: EDGE_ME - 4, f: -1, mode: 'squat', lean: t > B.tip ? .7 : .55, hipH: 120, lay: true, bow: .2 };
  if (t < B.back) return { ...m, x: EDGE_ME - 4, f: -1, mode: 'stand', lean: .22, hipH: 130, bow: .55, hands: 'limp' };
  if (t < 24.3) return { ...m, x: EDGE_ME, f: ta < B.back + .1 ? -1 : 1, mode: 'stand', lean: .04, hipH: 134, bow: .1, hands: 'limp' };
  return { ...m, x: EDGE_ME, f: ta < 24.45 ? 1 : -1, mode: 'stand', lean: .06, hipH: 134, bow: .25, hands: 'limp' };
}

// my laid cross (18.4 → fall): returns cross pose {F, ang, L, fl} (lane 0, world coords) or null
const PIV = LN(MY_CROSS_D, XN, GY);
function myLay(t) {
  const L = L0 * LEFT[3], ta = st8(t);
  const F0 = LN(MY_CROSS_D, BR_FOOT, GY - 7);
  if (t < B.mine) return null;
  if (ta < 18.5) { const u = seg(ta, 18.4, 18.5); return { F: lp2(LN(MY_CROSS_D, EDGE_ME + 10, GY - 120), F0, u), ang: lerp(Math.PI * 1.25, Math.PI * 1.5, u), L, fl: 0 }; }
  if (ta < 18.7) { const u = seg(ta, 18.5, 18.7); return { F: F0, ang: Math.PI * 1.5 - Math.PI * .5 * u * u, L, fl: ss(.5, 1, u) }; }
  if (ta < B.tip) return { F: F0, ang: Math.PI + .012 * Math.sin(ta * 23), L, fl: 1 };          // hangs short — held down at the foot
  if (t < B.fall) {                                              // tips about the edge: the head drops, the foot lifts out of my hands
    const u = seg(ta, B.tip, B.fall), b = .62 * u * u, ang = Math.PI - b, c = Math.cos(-b), s = Math.sin(-b);
    const r = sub(F0, PIV), F = [PIV[0] + r[0] * c - r[1] * s - 14 * u, PIV[1] + r[0] * s + r[1] * c];
    return { F, ang, L, fl: 1 };
  }
  return fallState(t);
}
// free fall after the fall beat (deterministic ballistic + spin)
const FALL = (() => {
  const L = L0 * LEFT[3], b = .62, ang = Math.PI - b, c = Math.cos(-b), s = Math.sin(-b), F0 = LN(MY_CROSS_D, BR_FOOT, GY - 7), r = sub(F0, PIV);
  const F = [PIV[0] + r[0] * c - r[1] * s - 14, PIV[1] + r[0] * s + r[1] * c], u = [Math.cos(ang), Math.sin(ang)], C = add(F, u, L / 2);
  const g = 5200, v0 = [-70, 160], w = -2.6;
  const tHit = (-v0[1] + Math.sqrt(v0[1] * v0[1] + 2 * g * (SEA - 30 - C[1]))) / g;
  return { L, ang, C, g, v0, w, tHit, hitX: C[0] + v0[0] * tHit, t0: B.fall };
})();
function fallState(t) {
  const tau = Math.max(0, t - FALL.t0), sink = Math.max(0, tau - FALL.tHit);
  const tf = Math.min(tau, FALL.tHit), C = [FALL.C[0] + FALL.v0[0] * tf + -20 * sink, FALL.C[1] + FALL.v0[1] * tf + .5 * FALL.g * tf * tf + 120 * sink];
  const ang = FALL.ang + FALL.w * tf + .4 * sink, u = [Math.cos(ang), Math.sin(ang)];
  return { F: add(C, u, -FALL.L / 2), ang, L: FALL.L, fl: 1, falling: true, sink };
}

// ================================================================ timeline: the others
// each one: lays the cross across (b) → runs over (b+.3…b+.9) → from the far side hauls it back by the head end and
// shoulders it (b+.9…b+1.4) → carries it into the light (gone by b+1.8). Only one bridge at a time.
const FAR_X = XF - 45;
function othState(o, t) {
  const ta = st8(t), base = { d: o.d, s: o.s, robe: o.robe, robeD: o.robeD, legs: o.legs, L: L0 }, b = o.beat;
  if (t < o.tStop) { const x = o.x0 - o.v * t; return { ...base, x, f: -1, mode: 'walk', ph: walkPhase(o.x0 - x, 26), stride: 26, lean: .17, hipH: 130, carry: { drag: true }, bow: .12 }; }
  if (t < b - .35) return { ...base, x: STOPX, f: -1, mode: 'stand', lean: .2, hipH: 130, carry: { drag: true }, bow: -.1 };
  if (t < b + .3) return { ...base, x: STOPX, f: -1, mode: 'stand', lean: t < b - .1 ? -.05 : .18, hipH: 132, raise: true, bow: -.15 };
  if (t < b + .9) {                                              // over the bridge, quick strides
    const u = seg(t, b + .3, b + .9), x = lerp(STOPX, FAR_X, u), on = x < BR_FOOT + o.fo + 5 && x > BR_FOOT + o.fo - L0 - 5;
    return { ...base, x, d: lerp(o.d, o.cd + 4, clamp((STOPX - x) / 30)), dy: on ? -14 : 0, f: -1, mode: 'walk', ph: walkPhase(STOPX - x, 46), stride: 46, lean: .16, hipH: 134, bow: -.05, arms: 'balance' };
  }
  if (t < b + 1.15) return { ...base, x: FAR_X, d: o.cd + 10, f: 1, mode: 'stand', lean: -.28, hipH: 128, pull: true, bow: -.1 };
  if (t < b + 1.8) {                                             // shouldered, into the light
    const u = seg(t, b + 1.15, b + 1.75), x = lerp(FAR_X, GATE_X + 8, u), fade = 1 - seg(t, b + 1.5, b + 1.78);
    if (fade <= 0) return null;
    return { ...base, x, d: lerp(o.cd + 10, GATE_D, u), f: -1, mode: 'walk', ph: walkPhase(FAR_X - x, 30), stride: 30, lean: .1, hipH: 134, carry: {}, bow: 0, alpha: fade };
  }
  return null;
}
function othCross(o, t) {    // their cross when not on the shoulder: raised / falling forward / lying across / hauled back
  const b = o.beat, ta = st8(t), F0 = LN(o.cd, BR_FOOT + o.fo, GY - 7);
  if (t < b - .35 || t >= b + 1.15) return null;
  if (ta < b - .1) { const u = seg(ta, b - .35, b - .1); return { F: lp2(LN(o.cd, STOPX + 200, GY - 7), F0, eo(u)), ang: lerp(Math.PI * 1.24, Math.PI * 1.5, eo(u)), L: L0, fl: 0 }; }
  if (ta < b + .15) { const u = seg(ta, b - .1, b + .15); return { F: F0, ang: Math.PI * 1.5 - Math.PI * .5 * u * u, L: L0, fl: ss(.55, 1, u) }; }
  if (ta < b + .9) { const bounce = ta < b + .3 ? -6 * Math.sin(seg(ta, b + .15, b + .3) * Math.PI) : 0; return { F: F0, ang: Math.PI + bounce * .004, L: L0, fl: 1 }; }
  // hauled back by the head end: the head rises to his hands, the foot slips off the near lip and swings below it
  const u = eo(seg(ta, b + .9, b + 1.15)), head0 = add(F0, [-1, 0], L0), head1 = LN(o.cd + 10, FAR_X + 24, GY - 118);
  const ang = Math.PI + .45 * u, hd = lp2(head0, head1, u), uv = [Math.cos(ang), Math.sin(ang)];
  return { F: add(hd, uv, -L0), ang, L: L0, fl: 1 - u };
}

// ================================================================ the cross (Ukiyoe.timber: mine is the beni block)
const crossGeo = c => U.timberGeo(c);
function drawCross(c, mine, o = {}) {
  return U.timber(c, { accent: mine, bar: !o.piece, cut: mine && c.L < L0 - 1, ghost: o.ghost, alpha: o.alpha, fillA: o.fillA, kw: o.kw });
}
// a lying piece (lane 0): x range a..b, slight in-plane tilt
function drawPiece(a, b, yb, rot, lift = 0, d = LY_D) {
  const F = LN(d, b, yb - 7 - lift), Lp = b - a, ang = Math.PI + rot;
  drawCross({ F, ang, L: Lp, fl: 1 }, true, { piece: true });
}
// the kerf + sawdust while I saw
function drawKerf(xc, prog, ta) {
  if (prog <= 0) return;
  const [xw, top] = LN(LY_D, xc, GY - 14); xc = xw; const p = new Path2D(); p.moveTo(xc, top + 1); p.lineTo(xc, top + 14 * prog); p.moveTo(xc, top + 1); p.lineTo(xc + DX * 15, top + DY * 15);
  key(p, 2.2);
  const R = rng((ta * 8) | 0), dust = new Path2D();
  for (let i = 0; i < 6; i++) { const dx = (R() - .5) * 18, dy = R() * 12; dust.moveTo(xc + dx + 1.6, top + 14 + dy - 2); dust.arc(xc + dx, top + 14 + dy - 2, 1.6, 0, TAU); }
  fill(dust, PAL.ochreL);
}

// ================================================================ figures (the kit's pilgrim rig; the cross and the saw are this story's)
function drawFigure(st, t, hooks = {}) {
  const R = U.pose(st), C = { robe: st.robe, robeD: st.robeD, legs: st.legs }, f = R.f, s = R.s;
  let hN, hF;
  let cross = null, cg = null;
  if (st.carry) { cross = U.shoulder(R, st.L, { drag: st.carry.drag }); cg = crossGeo(cross); let vd = cg.pv[1] > 0 ? cg.pv : [-cg.pv[0], -cg.pv[1]];
    hF = add(cg.J, vd, ARM * .42); hN = add(cg.J, vd, ARM * .8); }
  if (st.sawHold) {   // the saw already in my (near) hand, hanging at my side — pumping when I run
    const sw = st.mode === 'walk' ? Math.sin((st.ph || 0) * TAU) * (st.run ? .75 : .25) : 0;
    hN = U.hangArm(R, -sw + .12)[1];
  }
  if (st.hands === 'limp' || (!hN && !st.saw && !st.raise && !st.lay && !st.pull && st.hands !== 'lift')) { const hh = U.hangHands(R, st); hN = hh.near; hF = hh.far; }
  if (st.hands === 'lift') { hN = add(R.sh, [f * 40 * s, 60 * s]); hF = add(R.sh, [f * 26 * s, 74 * s]); }
  let sawP = null;
  if (st.saw) {   // squatting over the beam: left (far) hand presses the beam, right (near) hand pulls the saw
    const [xc, top] = LN(LY_D, st.saw.xc, GY - 14), dir = nrm([-.48, .88]);
    const k = st.saw.on ? Math.sin(((st.saw.ta * 8) | 0) * Math.PI / 2) * 16 : -6;
    const grip = add([xc, top], dir, -(64 + k));
    hN = grip; hF = [xc - 30, top + 2];
    sawP = { dir, grip, xc, top };
  }
  let ext = null;
  if (st.raise || st.lay || st.pull) ext = hooks.cross;
  if (ext) {
    const g = crossGeo(ext), u = g.u;
    const pts = st.pull ? [add(g.Hd, u, -14), add(g.Hd, u, -44)] : st.lay ? [add(ext.F, u, 22), add(ext.F, u, 48)] : [add(ext.F, u, 170 * s), add(ext.F, u, 128 * s)];
    hF = U.reach(R, pts[0]); hN = U.reach(R, pts[1]);
  }
  U.figure(R, C, { near: hN, far: hF, farFist: !st.saw, nearFist: !sawP,
    back: () => { if (cross) drawCross(cross, !!st.mineCross); },
    front: () => {
      if (sawP) {                                                // blade (into the kerf: hidden below the beam top)
        const ix = U.ix; ix.save(); ix.setTransform(U.MK); const clip = new Path2D(); clip.rect(sawP.xc - 300, sawP.top - 400, 600, 400 + .5); ix.clip(clip);
        const d = sawP.dir, g = sawP.grip, b0 = add(g, d, 9 * s), b1 = add(g, d, 120 * s), nb = [-d[1], d[0]];
        const blade = poly([add(b0, nb, -4.5 * s), add(b1, nb, -8 * s), add(b1, nb, 8 * s), add(b0, nb, 4.5 * s)]);
        both(blade, PAL.steel, KW * s * .7);
        const teeth = new Path2D(); for (let q = 0; q < 14; q++) { const p0 = add(add(b0, d, q * 8 * s), nb, (4.5 + q * .25) * s); teeth.moveTo(p0[0], p0[1]); const p1 = add(add(p0, d, 3 * s), nb, 2.5 * s); teeth.lineTo(p1[0], p1[1]); const p2 = add(p0, d, 6 * s); teeth.lineTo(p2[0], p2[1]); }
        key(teeth, KW * s * .4);
        ix.restore();
      }
      if (hooks.mid) hooks.mid();                                // the lying cross, in front of my knees
      if (st.saw) U.pressHand(hF, s);                            // far hand pressing on the beam
      if (sawP) {   // handle (rattan-wrapped) in the right fist, thumb on top
        const d = sawP.dir, g = sawP.grip, h0 = add(g, d, 10 * s), h1 = add(g, d, -50 * s);
        both(capsule(h0, h1, 4.5 * s, 4 * s), PAL.woodT, KW * s * .7);
        const wr = new Path2D(); for (let q = 1; q < 6; q++) { const p = add(g, d, -q * 9 * s + 6 * s), nb = [-d[1], d[0]]; const p0 = add(p, nb, -4.5 * s), p1 = add(add(p, nb, 4.5 * s), d, 3 * s); wr.moveTo(p0[0], p0[1]); wr.lineTo(p1[0], p1[1]); }
        key(wr, KW * s * .4, PAL.woodD);
      } else if (st.sawHold) {
        const bd = nrm([f * .72, .7]), h0 = add(hN, bd, -46 * s), b0 = add(hN, bd, 9 * s), b1 = add(hN, bd, 128 * s), nb = [-bd[1], bd[0]];
        const blade = poly([add(b0, nb, -4.5 * s), add(b1, nb, -9 * s), add(b1, nb, 7 * s), add(b0, nb, 4.5 * s)]);
        both(blade, PAL.steel, KW * s * .7);
        const teeth = new Path2D(); for (let q = 0; q < 14; q++) { const p0 = add(add(b0, bd, q * 8.4 * s), nb, (4.5 + q * .2) * s); teeth.moveTo(p0[0], p0[1]); const p1 = add(add(p0, bd, 3 * s), nb, 2.6 * s); teeth.lineTo(p1[0], p1[1]); const p2 = add(p0, bd, 6 * s); teeth.lineTo(p2[0], p2[1]); }
        key(teeth, KW * s * .4);
        both(capsule(hN, h0, 4.5 * s, 4 * s), PAL.woodT, KW * s * .7);
        const wr = new Path2D(); for (let q = 1; q < 5; q++) { const p0 = add(add(hN, bd, -q * 9 * s), nb, -4.5 * s), p1 = add(add(p0, nb, 9 * s), bd, 3 * s); wr.moveTo(p0[0], p0[1]); wr.lineTo(p1[0], p1[1]); }
        key(wr, KW * s * .4, PAL.woodD);
      }
    },
    top: () => { if (sawP) U.fistOn(sawP.grip, sawP.dir, s); },   // fist wrapped round the handle: knuckles + thumb
  });
  return R;
}

// ================================================================ the cleft, the gate, the splash (kit pieces placed for this story)
const drawGorge = () => U.chasm({ xf: XF, xn: XN, gy: GY, depth: ROAD_D, bottom: SY1, sea: SEA });
const drawSea = t => U.sea(t, { x0: SX0, x1: SX1, y: SEA, bottom: SY1, gap: [XF, XN] });
const drawSplash = t => U.splash(t, { x: FALL.hitX, y: SEA - 6, t0: 19.2 + FALL.tHit, sea: SEA });
const drawGate = () => { const [bx, by] = LN(GATE_D, GATE_X, GY); U.arch(bx, by); };

// ================================================================ camera (moves on ones)
const camFollow = (z, x, gyScreen) => U.follow(z, x, gyScreen, GY), mix = U.camMix;
function camera(t) {
  const meX = x => x + DX * ME_D;
  const mx0 = meX(X0 - V0 * Math.min(t, SAW[0]));
  const c0 = camFollow(2.4, mx0 - 10, 1500);                     // frame 0: close on me, the saw already in my hand
  const s0 = camFollow(1.08, mx0 - 90, 1250);                    // …widening to the procession by ~2.6 s
  const s1 = camFollow(1.7, K1 + DX * ME_D + 10, 1100);
  const s2 = camFollow(1.0, Math.max(XN + 600, meX(meRunX(clamp(t, RUN0, RUN1))) - 150), 1240);   // the gap stays out of frame until 12 s
  const s3 = camFollow(1.6, XC2 + DX * LY_D + 60, 1100);
  const s4 = camFollow(lerp(.98, 1.04, ss(12.2, 18.4, t)), lerp(700, 690, ss(12, 18.4, t)), 1180);
  if (t < 3.1) return mix(c0, s0, eio(seg(t, 1.5, 2.6)));
  if (t < 4.35) return mix(s0, s1, eio(seg(t, 3.1, 3.45)));
  if (t < 8.7) return mix(s1, s2, eio(seg(t, 4.35, 4.9)));
  if (t < 11.3) return mix(s2, s3, eio(seg(t, 8.7, 9.1)));
  if (t < B.fall) return mix(mix(s3, s4, eio(seg(t, 11.3, 12.05))), camFollow(1.42, 790, 1120), eio(seg(t, 18.05, 18.55)));
  const T1 = B.fall + 1.1;
  if (t < T1) {                                                  // the hit: hard cut to a tight print following the drop
    const u = seg(t, B.fall, T1), th = B.fall + FALL.tHit, shake = t > th && t < th + .35 ? Math.sin(t * 90) * 6 * (1 - seg(t, th, th + .35)) : 0;
    return { z: 1.9, x: FALL.hitX + 40 + shake, y: lerp(1400, 1470, eo(u)) };
  }
  const s6 = camFollow(1.1, 760, 1150);                          // back at the edge: me, empty-handed
  const sP = camFollow(1.25, 1230, 1150);                         // the road behind me: the three pieces, glowing
  const s8 = camFollow(1.15, 690, 1120);                         // the gap: they fill the outline
  if (t < 21.6) return s6;
  if (t < B.fill[0] + .1) return mix(s6, sP, eio(seg(t, 21.6, 22.25)));
  return mix(sP, s8, eio(seg(t, B.fill[0] + .1, B.fill[1] - .1)));
}

// ================================================================ frame
let GLOWS = [];
function lanesDraw(t) {
  const items = []; GLOWS = [];
  const me = meState(t);
  const lay = myLay(t);
  // others (+ their crosses as separate items when off the shoulder)
  for (const o of OTH) {
    const st = othState(o, t), cr = othCross(o, t);
    if (cr) items.push({ d: o.cd, z: 0, fn: () => drawCross(cr, false) });
    if (st) items.push({ d: st.d, z: 1, fn: () => drawFigure(st, t, { cross: cr }) });
  }
  // pieces on the road / flying to the gap
  for (let k = 0; k < 3; k++) {
    const P = PIECES[k]; if (t < P.at) continue;
    const [g0, g1] = GLIDE[k], u = seg(t, g0, g1), e = eio(u), lift = Math.sin(u * Math.PI) * 110;
    const a = lerp(P.a, P.ta, e), b = lerp(P.b, P.tb, e), rot = lerp(P.rot, 0, e);
    const drop = t < P.at + .25 ? (1 - eo(seg(t, P.at, P.at + .25))) * 10 : 0;
    const pd = lerp(LY_D, MY_CROSS_D, e), gl = Pilot.win(t, B.back + .2, g1 + .5, .4, .5);
    if (gl > 0) GLOWS.push([LN(pd, (a + b) / 2, GY - 12 - lift), gl]);
    if (gl > 0) items.push({ d: pd + .1, z: 1.9, fn: () => U.paperGlow(LN(pd, (a + b) / 2, GY - 10), 90, .75 * gl) });
    items.push({ d: pd, z: 2, fn: () => drawPiece(a, b, GY - drop, rot, lift, pd) });
  }
  // my cross: carried (drawn by the figure), lying while I saw, laid / falling
  let mid = null;
  if (me.lying) { const L = me.lying.L, F = LN(LY_D, me.lying.foot, GY - 7); mid = () => { drawCross({ F, ang: Math.PI, L, fl: 1 }, true); if (me.saw) drawKerf(me.saw.xc, me.saw.prog, me.saw.ta); }; }
  if (lay && !lay.falling) items.push({ d: MY_CROSS_D, z: 3, fn: () => drawCross(lay, true) });
  // the ghost of my whole cross across the gap (key block only), from 23.0
  // the dashed outline of my whole cross: while mine hangs short, and again when the pieces come
  const ga = Math.max(.85 * Pilot.win(t, 18.75, B.fall - .05, .3, .2), ss(B.fill[0] - .3, B.fill[0] + .2, t));
  if (ga > 0) items.push({ d: MY_CROSS_D, z: 1.5, fn: () => drawCross({ F: LN(MY_CROSS_D, BR_FOOT, GY - 7), ang: Math.PI, L: L0, fl: 1 }, true, { ghost: true, alpha: ga, kw: 2.4, fillA: t > B.fill[0] - .3 ? 1 : 0 }) });
  const meSt = { ...me, mineCross: true };
  items.push({ d: me.d, z: 1, fn: () => drawFigure(meSt, t, { mid, cross: lay }) });
  items.sort((a, b) => (b.d - a.d) || (a.z - b.z));
  for (const it of items) it.fn();
}

function world(t) {
  U.drawSky(SKY);
  // the gate's light warming the sky (ochre bokashi, deepening as each one goes in)
  const [gx, gy] = LN(GATE_D, GATE_X, GY - 160), glow = .32 + .1 * ss(14, 16, t);
  U.pool([gx, gy], 700, PAL.ochreL, glow, { h: 1100 });
  for (const l of STATIC) {
    if (l.mist) { for (const [x, y, w, h] of l.mist) U.mistBand(x, y, w, h * 1.4, .95); continue; }
    if (l.gorge) { drawGorge(t); continue; }
    if (l.pine) { U.drawPine(l.pine); continue; }
    if (l.fill) fill(l.p, l.fill);
    if (l.rock) U.drawRock(l.rock[0] < E ? ROCKS[0] : ROCKS[1]);
    if (l.road) key(l.road[0] < E ? ROADM[0] : ROADM[1], 1.6, PAL.roadD);
    if (l.key) key(l.p, l.key, l.keyCol || PAL.sumi);
  }
  // mist bands across the cliffs and the cleft (suyari-gasumi)
  for (const [my, mx0, mw, mh] of [[1430, 60, 1250, 40], [1560, 760, 1500, 34], [1500, 2000, 900, 30]]) U.mistBand(mx0 + Math.sin(t * .35 + my) * 16, my, mw, mh, .7);
  drawGate(t);
  const lay = myLay(t);
  if (lay && lay.falling) { const ix = U.ix; ix.save(); ix.setTransform(U.MK); const c = new Path2D(); c.rect(-1e4, -1e4, 2e4, 1e4 + SEA + 4); ix.clip(c); drawCross(lay, true); ix.restore(); }
  drawSea(t);
  drawSplash(t);
  lanesDraw(t);
  U.border();                                                    // the sheet's border (thick + thin key)
}
function draw(ctx, t) {
  const c = camera(t);
  U.begin(ctx, c);                                               // mount + paper, ink cleared
  world(t);
  const wash = ss(B.end, B.end + .6, t);                         // end: the print washes back to paper under the cartouche
  U.print(ctx, { wash });
  // the gate's light (paper-warm, screen)
  const pulse = [B.bridges[0], B.bridges[1], B.bridges[2]].reduce((s, b) => s + Math.exp(-Math.pow((t - (b + 6.0)) / .5, 2)), 0);
  U.glow(ctx, LN(GATE_D, GATE_X, GY - 140), 260 * c.z * 1.6, (.32 + .2 * pulse) * (1 - wash));
  // the cut pieces glow (warm light, screen) from the turn until they land
  for (const [p, g] of GLOWS) U.glow(ctx, p, 120 * c.z, .55 * g, '255,226,170');
  U.captions(ctx, t, S.lines);
  U.endCard(ctx, t, S.endCard, B.end, wash);
}
async function init() {
  U.init({ sheet: [SX0, SY0, SX1, SY1], ground: GY });
  SKY = U.sky(); buildStatic();
  ROCKS = [U.rockFace(SX0 + 20, XF - 210, 31, GY, SEA), U.rockFace(XN + 20, SX1 - 20, 32, GY, SEA)];
  ROADM = [U.roadMarks(SX0, XF, 41, GY, ROAD_D), U.roadMarks(XN + 40, SX1, 42, GY, ROAD_D)];
}
Pilot.run({ W, H, dur: S.DUR, fonts: U.FONTS, init, draw });
</script>
