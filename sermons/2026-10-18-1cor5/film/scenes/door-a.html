<script>
/* 문틈 — version A: Gothic charcoal drawing (after OPUSCAR look no. 13, "Rebecca": vine charcoal, eraser lifts, finger
   smudges, William Kentridge's animated drawings).
   How it is drawn:
   - Everything is painted into a grey VALUE canvas (white = clean paper, black = full charcoal): a static hallway plate
     (built once, at 1.36× so the slow push stays crisp), then per-frame layers — door leaf (perspective strips), the room
     light, the eraser-lifted wedge on the floor, the horned shadow (smudged, clipped to the light), fingers, fog bands
     lifted out of the tone, the foreground arch (parallax: it parts as we push in), the flood of darkness.
   - A TOOTH pass turns value into charcoal on paper: each pixel's darkness is compared with the paper tooth height
     (fine grain ≈ 1/600 frame width), so light pressure catches only the peaks, heavy pressure fills the valleys,
     velvet blacks stay solid and lifts are clean paper — grain only in the midtones. Charcoal #121111, paper #EEECE7.
   - After the pass: the only colour — red pastel strokes on lintel and posts (solid, tooth peeking through, outlined in
     charcoal) — the warm thread of light at the end, the captions and the end card.
   Pure function of t; seeded randomness only; heavy textures in init. */
const { clamp, lerp, ss, eo, eio, win, rng, noise, fbm, canvas } = Pilot;
const W = Pilot.W, H = Pilot.H, B = DOOR.beat, V = Pilot.ori === 'v';
const SC = H / 1920;
const F = 1150 * SC, CX = W / 2, CY = 902 * SC, EYE = 1.55, D = 5.0;   // camera: focal px, centre, eye height, door distance
const ZC = [CX, 1180 * SC];                                               // the push zooms about the middle of the door
const KP = 1.36;                                                          // plate resolution (crisp up to zoom 1.36)
const XL = 0.8, ZL = D + 3.0;                                             // the light in the room behind the door
const P = (x, y, z) => [CX + F * x / z, CY - F * (y - EYE) / z];         // world (m) → base screen (zoom 1)
const PAPER = [238, 236, 231], CHAR = [18, 17, 17];
const DOORW = 1.0, DOORH = 2.25;

let vcv, vctx, low1, l1, low2, l2, redL, rctx, plate, fgA, leafTex, fogTex, stick, stickW, smudge, smudgeW, eraserPat, holes;
let tooth, LUT, COL, GM, outImg, out32, RED = [];

/* ------------------------------------------------------------------ sprites */
function makeStick(col, seed) {   // side-of-the-stick mark: parallel streaks along x, ragged edges, breaks
  const w = 256, h = 36, c = canvas(w, h), x = c.getContext('2d'), im = x.createImageData(w, h), r = rng(seed);
  const rowD = []; for (let j = 0; j < h; j++) { const e = Math.sin(Math.PI * (j + .5) / h); rowD[j] = Math.pow(e, .45) * (.25 + .75 * noise(j * .9, seed)); }
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const edge = noise(i * .05, j < h / 2 ? 1.3 + seed : 7.7 + seed), e2 = Math.min(j, h - 1 - j) / (h / 2);
    if (e2 < edge * .5) continue;
    let a = rowD[j] * (.4 + .8 * noise(i * .025 + j * 5.1, j * .9)) * (.85 + .3 * r()); a = Math.min(1, a);
    const k = (j * w + i) * 4; im.data[k] = im.data[k + 1] = im.data[k + 2] = col; im.data[k + 3] = a * 255;
  }
  x.putImageData(im, 0, 0); return c;
}
function makeSmudge(col, seed) {  // a finger smudge: soft, uneven, with a noisy rim
  const s = 128, c = canvas(s, s), x = c.getContext('2d'), im = x.createImageData(s, s);
  for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) {
    const dx = (i - 63.5) / 64, dy = (j - 63.5) / 64, rr = Math.sqrt(dx * dx + dy * dy);
    const R = .7 + .3 * fbm(i * .045 + seed, j * .045, 3); let a = clamp(1 - rr / R); a = a * a * (3 - 2 * a);
    a *= .7 + .3 * fbm(i * .11 + 9 + seed, j * .11, 2);
    const k = (j * s + i) * 4; im.data[k] = im.data[k + 1] = col; im.data[k + 2] = col ? col : 255; im.data[k + 3] = a * 255;
  }
  x.putImageData(im, 0, 0); return c;
}
function makeEraser() {           // eraser lift: white streaks with grey residue rows
  const s = 256, c = canvas(s, s), x = c.getContext('2d'), im = x.createImageData(s, s);
  for (let j = 0; j < s; j++) { let ra = .78 + .22 * noise(j * .37, 2); if (noise(j * .13, 8) < .28) ra *= .55;
    for (let i = 0; i < s; i++) { const a = ra * (.86 + .14 * noise(i * .03 + j * 3.3, j * .5)); const k = (j * s + i) * 4;
      im.data[k] = im.data[k + 1] = im.data[k + 2] = 255; im.data[k + 3] = a * 255; } }
  x.putImageData(im, 0, 0); return c;
}
function makeFog(seed) {          // a horizontally tileable band of fog streaks (white)
  const w = 2 * W, h = Math.round(220 * SC), c = canvas(w, h), x = c.getContext('2d'), r = rng(seed);
  for (let k = 0; k < 170; k++) {
    const yy = h / 2 + (r() + r() + r() - 1.5) * h * .42, len = (180 + r() * 900) * SC, th = (4 + r() * 22) * SC, xx = r() * w;
    x.globalAlpha = .05 + r() * .12;
    for (const o of [-w, 0, w]) x.drawImage(smudgeW, xx + o, yy - th / 2, len, th);
  }
  x.globalAlpha = 1; x.globalCompositeOperation = 'destination-in';
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.35, '#000'); g.addColorStop(.65, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, h); return c;
}
function makeTooth() {            // paper tooth: fine grain (~2 px) + light mottling + faint fibre, equalised to 0..255
  const N = W * H, a = new Float32Array(N), r = rng(77), b = new Float32Array(N);
  for (let i = 0; i < N; i++) a[i] = r();
  for (let y = 0; y < H; y++) { const o = y * W; for (let x = 0; x < W; x++) { const xl = x ? x - 1 : x, xr = x < W - 1 ? x + 1 : x; b[o + x] = (a[o + xl] + 2 * a[o + x] + a[o + xr]) * .25; } }
  for (let y = 0; y < H; y++) { const yu = y ? y - 1 : y, yd = y < H - 1 ? y + 1 : y; for (let x = 0; x < W; x++) a[y * W + x] = (b[yu * W + x] + 2 * b[y * W + x] + b[yd * W + x]) * .25; }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; a[i] = a[i] * .5 + noise(x * .42, y * .42) * .3 + noise(x * .012, y * .012) * .12 + noise(x * .004, y * .3) * .08;
  }
  const hist = new Uint32Array(1024); let mn = 1e9, mx = -1e9; for (let i = 0; i < N; i++) { if (a[i] < mn) mn = a[i]; if (a[i] > mx) mx = a[i]; }
  for (let i = 0; i < N; i++) hist[Math.min(1023, ((a[i] - mn) / (mx - mn) * 1024) | 0)]++;
  const cdf = new Uint8Array(1024); let acc = 0; for (let k = 0; k < 1024; k++) { acc += hist[k]; cdf[k] = Math.min(255, (acc / N * 256) | 0); }
  const t = new Uint8Array(N); for (let i = 0; i < N; i++) t[i] = cdf[Math.min(1023, ((a[i] - mn) / (mx - mn) * 1024) | 0)];
  return t;
}
/* The value canvas carries two things: R = total darkness, B = the part laid with the stick (grainy). Rubbed tone and
   smudges are painted in rgb(0,0,255) — they darken R/G but not B — so the tooth only shows in stick marks, as on paper. */
function makeLUT() {
  const L = new Int16Array(65536), G = new Uint8Array(65536);
  for (let d = 0; d < 256; d++) for (let T = 0; T < 256; T++) {
    const dd = d / 255, TT = (T + .5) / 256, p = dd * 1.22 - .11;
    let c = clamp((p - (TT - .17)) / .34); c = c * c * (3 - 2 * c);
    const mid = Math.pow(4 * dd * (1 - dd), .8);         // grain strength peaks in the midtones
    L[d * 256 + T] = Math.round((c - dd) * 255 * .85 * mid);
    G[d * 256 + T] = d ? Math.min(255, Math.round(40 + 215 * Math.min(1, T / d))) : 0;   // here T plays dB (grainy darkness)
  }
  const C = new Uint32Array(256);
  for (let o0 = 0; o0 < 256; o0++) { let k = o0 / 255; if (k > .88) k = lerp(k, 1, (k - .88) / .12); if (k < .05) k *= k / .05; const o = Math.round(k * 255);
    const kk = o / 255, rr = PAPER[0] + (CHAR[0] - PAPER[0]) * kk, gg = PAPER[1] + (CHAR[1] - PAPER[1]) * kk, bb = PAPER[2] + (CHAR[2] - PAPER[2]) * kk;
    C[o0] = (255 << 24) | (Math.round(bb) << 16) | (Math.round(gg) << 8) | Math.round(rr); }
  return [L, C, G];
}

/* ------------------------------------------------------------------ mark-making */
function sweep(x, pts, w, a, seed, spr = stick) {     // side of the stick along a path (follows form)
  const r = rng(seed); const n = pts.length - 1;
  for (let i = 0; i < n; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < .3) continue;
    const taper = Math.min(1, (i + .6) / 1.6, (n - i) / 1.6);
    x.save(); x.translate(x0, y0); x.rotate(Math.atan2(dy, dx)); x.globalAlpha = clamp(a * (.75 + .5 * r()) * taper);
    x.drawImage(spr, (r() * 190) | 0, 0, 60, 36, -1, -w / 2, L + 2, w); x.restore();
  }
  x.globalAlpha = 1;
}
function vine(x, pts, w, a, seed, col = '#000', brk = .07) {   // broken vine-charcoal line
  const r = rng(seed); x.strokeStyle = col; x.lineCap = 'round';
  for (let i = 0; i < pts.length - 1; i++) {
    if (r() < brk) continue;
    const j = () => (r() - .5) * w * .5;
    x.globalAlpha = clamp(a * (.5 + .5 * r())); x.lineWidth = w * (.55 + .75 * r());
    x.beginPath(); x.moveTo(pts[i][0] + j(), pts[i][1] + j()); x.lineTo(pts[i + 1][0] + j(), pts[i + 1][1] + j()); x.stroke();
  }
  x.globalAlpha = 1;
}
function blob(x, cx, cy, rx, ry, a, rot = 0, spr = smudge) {   // finger smudge
  x.save(); x.translate(cx, cy); x.rotate(rot); x.globalAlpha = clamp(a); x.drawImage(spr, -rx, -ry, 2 * rx, 2 * ry); x.restore(); x.globalAlpha = 1;
}
function segW(a, b, n) {   // world segment → screen points (perspective-correct by stepping in world)
  const out = []; for (let i = 0; i <= n; i++) { const k = i / n; out.push(P(lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k))); } return out;
}
function seg2(a, b, n, jit = 0, r) { const out = []; for (let i = 0; i <= n; i++) { const k = i / n; out.push([lerp(a[0], b[0], k) + (r ? (r() - .5) * jit : 0), lerp(a[1], b[1], k) + (r ? (r() - .5) * jit : 0)]); } return out; }
function polyS(x, pts) { x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); }
function polyWorld(x, pts3) { polyS(x, pts3.map(p => P(p[0], p[1], p[2]))); }
function fillA(x, a, col = '0,0,255') { x.fillStyle = `rgba(${col},${a})`; x.fill(); }
// a pointed (two-centred) arch: [x,y] pairs from the left springing over the apex to the right springing
function arch(a, ys, rise, n = 24) {
  const R = (a * a + rise * rise) / (2 * a), c = R - a, phiA = Math.acos(clamp(c / R, -1, 1)), L = [], Rr = [];
  for (let i = 0; i <= n; i++) { const ph = phiA * i / n; L.push([c - R * Math.cos(ph), ys + R * Math.sin(ph)]); }
  for (let i = n; i >= 0; i--) { const ph = phiA * i / n; Rr.push([-(c - R * Math.cos(ph)), ys + R * Math.sin(ph)]); }
  return L.concat(Rr.slice(1));
}

/* ------------------------------------------------------------------ the static hallway plate */
function buildPlate() {
  const c = canvas(Math.ceil(W * KP), Math.ceil(H * KP)), x = c.getContext('2d'); let sd = 100;
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.setTransform(KP, 0, 0, KP, 0, 0);
  const A = 1.15, WT = 3.4, VR = 1.3, ZN = 1.0, R0 = rng(4242);
  // --- vault (everything above the walls), very dark, sweeps following the curve of the bays
  x.fillStyle = 'rgba(0,0,255,.6)'; x.fillRect(-50, -50, W + 100, H + 100);
  const vaultPts = arch(A, WT, VR, 20);
  for (let k = 0; k < 46; k++) {
    const z = lerp(1.6, D, R0()), pts = vaultPts.map(p => P(p[0] * (.98 - R0() * .02), p[1] - R0() * .05, z));
    sweep(x, pts, F * .14 / z, .3 + R0() * .22, sd++);
  }
  // --- floor
  polyWorld(x, [[-A, 0, D], [A, 0, D], [A, 0, ZN], [-A, 0, ZN]]); fillA(x, .2);   // (lighten the vault base first)
  x.save(); polyWorld(x, [[-A, 0, D], [A, 0, D], [A, 0, ZN], [-A, 0, ZN]]); x.clip();
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.fillStyle = 'rgba(0,0,255,.42)'; x.fillRect(0, 0, W, H);
  const fy0 = P(0, 0, D)[1], fg = x.createLinearGradient(0, fy0, 0, H); fg.addColorStop(0, 'rgba(0,0,255,0)'); fg.addColorStop(1, 'rgba(0,0,255,.6)');
  x.fillStyle = fg; x.fillRect(0, fy0, W, H - fy0);
  for (let k = 0; k < 170; k++) {   // sweeps across the floor (horizontal in the floor plane)
    const z = lerp(1.4, D, Math.pow(R0(), .8)), x0 = lerp(-A, A, R0()), len = .3 + R0() * .9;
    sweep(x, segW([x0, 0, z], [x0 + len, 0, z + (R0() - .5) * .15], 6), F * .07 / z, .2 + R0() * .22, sd++);
  }
  for (let k = 0; k < 40; k++) { const xx = lerp(-A, A, R0()); sweep(x, segW([xx, 0, D], [xx, 0, 1.4], 10), F * .05 / 3, .08, sd++); }
  for (const xx of [-.92, -.46, 0, .46, .92]) vine(x, segW([xx, 0, D], [xx, 0, ZN], 40), 2.2, .55, sd++);
  const rows = [4.55, 4.1, 3.62, 3.15, 2.7, 2.27, 1.86, 1.5];
  rows.forEach((z, i) => { const p = segW([-A, 0, z], [A, 0, z], 30); vine(x, p, 2.8 * 3 / z, .6, sd++, '#000', .1);
    vine(x, p.map(q => [q[0], q[1] + 3 * 3 / z]), 1.4 * 3 / z, .16, sd++, '#fff', .3); });
  x.restore();
  // --- back wall (pointed top)
  const bw = [[-A, 0], [A, 0]].concat(arch(A, WT, VR, 20).reverse()).map(p => [p[0], p[1], D]);
  x.save(); polyWorld(x, bw); x.clip(); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.fillStyle = 'rgba(0,0,255,.34)'; x.fillRect(0, 0, W, H);
  for (let y = 0, row = 0; y < WT + 1.3; y += .3, row++) {    // stone courses
    vine(x, segW([-A, y, D], [A, y, D], 16), 1.5, .38, sd++, '#000', .12);
    for (let xx = -A + (row % 2) * .21; xx < A; xx += .42) vine(x, segW([xx, y, D], [xx, y + .3, D], 2), 1.3, .3, sd++, '#000', .2);
    sweep(x, segW([-A, y + .1, D], [A, y + .1, D], 10), F * .17 / D, .26 + R0() * .16, sd++); sweep(x, segW([-A, y + .21, D], [A, y + .2, D], 10), F * .12 / D, .2 + R0() * .14, sd++);
  }
  for (let k = 0; k < 14; k++) blob(x, lerp(P(-A, 0, D)[0], P(A, 0, D)[0], R0()), lerp(P(0, 4, D)[1], P(0, 0, D)[1], R0()), 60 + R0() * 80, 30 + R0() * 50, .12);
  x.restore();
  // --- side walls
  for (const sgn of [-1, 1]) {
    const wall = [[sgn * A, 0, D], [sgn * A, 0, ZN], [sgn * A, WT, ZN], [sgn * A, WT, D]];
    x.save(); polyWorld(x, wall); x.clip(); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.fillStyle = `rgba(0,0,255,${sgn < 0 ? .5 : .34})`; x.fillRect(0, 0, W, H);
    for (let y = 0; y < WT; y += .3) { vine(x, segW([sgn * A, y, D], [sgn * A, y, ZN], 30), 1.6, .32, sd++, '#000', .15);
      sweep(x, segW([sgn * A, y + .15, D], [sgn * A, y + .15, ZN + .6], 12), F * .2 / 3.4, .28 + R0() * .18, sd++); }
    for (const z of [3.85, 2.7]) {   // engaged shafts (the bay divisions)
      const p0 = P(sgn * A, 0, z), p1 = P(sgn * A, WT, z), p2 = P(sgn * A, 0, z + .16), p3 = P(sgn * A, WT, z + .16);
      polyS(x, [p0, p1, p3, p2]); fillA(x, .45);
      vine(x, [p0, p1], 2.2, .9, sd++); vine(x, seg2(p2, p3, 30), 1.8, .45, sd++, '#fff', .2);
    }
    for (let k = 0; k < 10; k++) { const z = lerp(2.2, D, R0()); blob(x, P(sgn * A, 0, z)[0], P(0, lerp(0, 3, R0()), z)[1], 50, 120, .14); }
    x.restore();
    // wall/floor and wall/vault junctions: dark accents
    sweep(x, segW([sgn * A, .02, D], [sgn * A, .02, ZN + .3], 16), 18, .5, sd++);
    sweep(x, segW([sgn * A, WT, D], [sgn * A, WT, ZN + .3], 16), 22, .55, sd++);
    vine(x, segW([sgn * A, 0, D], [sgn * A, WT, D], 12), 2.4, .8, sd++);
  }
  // --- vault ribs (transverse arch at 3.85, diagonal ribs, ridge), lifted on the moonlit side
  const ribs = [];
  ribs.push(arch(A, WT, VR, 20).map(p => P(p[0], p[1], 3.85)));
  ribs.push(arch(A, WT, VR, 20).map(p => P(p[0], p[1], D)));
  const vh = xx => { const pts = arch(A, WT, VR, 60); let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - xx) < Math.abs(best[0] - xx)) best = p; return best[1]; };
  for (const [z1, z2] of [[2.7, 3.85], [3.85, D]]) for (const s of [1, -1]) {
    const pts = []; for (let i = 0; i <= 24; i++) { const k = i / 24, xx = s * (-A + 2 * A * k); pts.push(P(xx, vh(xx), lerp(z1, z2, k))); } ribs.push(pts);
  }
  { const pts = []; for (let i = 0; i <= 20; i++) pts.push(P(0, WT + VR, lerp(1.6, D, i / 20))); ribs.push(pts); }
  for (const r of ribs) { sweep(x, r, 16, .55, sd++); vine(x, r, 2.4, .85, sd++); vine(x, r.map(p => [p[0] + 4, p[1] + 5]), 1.6, .3, sd++, '#fff', .25); }
  // --- moonlit lancet window on the left wall + its patch on the right wall + a faint beam
  const winPts = (xw, zc, hw, sill, spring, apex, n = 12) => {
    const L = []; for (let i = 0; i <= n; i++) { const k = i / n; L.push([xw, lerp(spring, apex, Math.sin(k * Math.PI / 2)), zc - hw + hw * (1 - Math.cos(k * Math.PI / 2))]); }
    const Rr = L.slice(0, -1).reverse().map(p => [xw, p[1], 2 * zc - p[2]]);
    return [[xw, sill, zc + hw], [xw, sill, zc - hw]].concat(L).concat(Rr);
  };
  const wl = winPts(-A, 4.35, .37, 1.45, 2.85, 3.3);
  x.save(); polyWorld(x, wl); x.fillStyle = 'rgba(255,255,255,.82)'; x.fill(); x.clip();
  vine(x, segW([-A, 1.45, 4.35], [-A, 3.3, 4.35], 10), 2.2, .7, sd++);
  for (let y = 1.75; y < 3; y += .35) vine(x, segW([-A, y, 3.95], [-A, y + .25, 4.75], 6), 1.2, .4, sd++);
  for (let y = 1.75; y < 3; y += .35) vine(x, segW([-A, y + .25, 3.95], [-A, y, 4.75], 6), 1.2, .4, sd++);
  x.restore(); vine(x, wl.map(p => P(p[0], p[1], p[2])).concat([P(...wl[0])]), 3, .9, sd++);
  const beam = wl.map(p => [A, p[1] - 1.15, p[2] - .8]);
  x.save(); polyWorld(x, beam); x.fillStyle = 'rgba(255,255,255,.34)'; x.fill(); x.clip();
  vine(x, segW([A, .3, 3.55], [A, 2.15, 3.55], 10), 2, .35, sd++);
  for (let y = .6; y < 1.9; y += .35) vine(x, segW([A, y, 3.15], [A, y + .25, 3.95], 6), 1.2, .22, sd++);
