<script>
/* 문틈 D — Shadow puppetry.
   A backlit cotton screen and an oil lamp behind it. Everything we see is lamp light × the transmission of the
   leather pieces pressed on the cloth (see "rendering model" below):
   - the room is one big dark-dyed hide set piece (wall + floor) with punched patterns; the doorway is cut out of it,
     so the bare cloth there is "the light beyond the door";
   - the door leaf is a separate, hinged, perforated hide puppet on a rod; it swings inward (foreshortened strips);
   - the light wedge on the floor is the floor piece slid away along the light's rays (perspective from the lamp);
   - the demon is a horned puppet held OFF the cloth, so it only ever reads as a soft shadow that grows bigger and
     softer as it nears the lamp; its hand puppet is pressed ON the cloth (crisp, jointed, nails) to hook the door;
   - the blood is red translucent dye brushed onto the lintel and posts — the only saturated colour;
   - the lamp flickers, flares at the slam, gutters to black, relights faint, and comes back warm at the end.
   Rendering model (per frame): T = white; every piece multiplies into T (holes stay white, overlaps darken);
   screen = tonemapped lamp field × cloth × T, then warm bloom, warm vignette, light grain. */
const { clamp, lerp, ss, eo, eio, rng, noise, canvas } = Pilot;
const W = Pilot.W, H = Pilot.H;
const WW = 1080, WH = 1920;                                   // the cloth (world units)
const S0 = Math.min(W / WW, H / WH), BX = (W - WW * S0) / 2, BY = (H - WH * S0) / 2;
const B = DOOR.beat;
// door geometry (world)
const X0 = 360, X1 = 720, Y0 = 700, Y1 = 1400, DW = X1 - X0, DH = Y1 - Y0;
const VPX = 540, VPY = 860, DEPTH = 1500;                    // eye level / vanishing point, camera distance (px)
const PX = 600, PY = 1130;                                    // floor point under the lamp beyond the door: wedge rays start here
const LAMP = [585, 1010];
const INK = '#160c06';

let HIDE, CLOTH, WALL, FRAME, LEAF, HAND, ARM, SEG = [], NAIL, DEMON, DEMONB, STROKES = [], VIGN, GRAIN, AUD;
let CB, CBG; const CBO = [260, 260];
let Tc, T, SOFT, SG, SOFT2, SG2, SOFT4, SG4, BL, BG, LB, LBG, FB, FBG;
const LBK = 1.4, LBX = X0 - 20, LBY = Y0 - 20, LBW = DW + 40, LBH = DH + 40;      // leaf buffer (world box)
const FBK = .6, FBX = -300, FBY = Y1 - 10, FBW = 1700, FBH = 720;                  // floor-shadow buffer

// ---------------------------------------------------------------- carving toolkit
function smooth(g, pts, closed = true) {
  const n = pts.length, m = i => [(pts[i % n][0] + pts[(i + 1) % n][0]) / 2, (pts[i % n][1] + pts[(i + 1) % n][1]) / 2];
  if (!closed) { g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n - 1; i++) { const q = m(i); g.quadraticCurveTo(pts[i][0], pts[i][1], q[0], q[1]); } g.lineTo(pts[n - 1][0], pts[n - 1][1]); return; }
  const s = m(0); g.moveTo(s[0], s[1]); for (let i = 1; i <= n; i++) { const p = pts[i % n], q = m(i); g.quadraticCurveTo(p[0], p[1], q[0], q[1]); } g.closePath();
}
function poly(g, pts) { g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }
let CUTA = 1;
const cut = (g, fn, rule = 'evenodd') => { g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = `rgba(0,0,0,${CUTA})`; g.beginPath(); fn(g); g.fill(rule); g.restore(); };
const cutLine = (g, w, fn) => { g.save(); g.globalCompositeOperation = 'destination-out'; g.strokeStyle = `rgba(0,0,0,${CUTA})`; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); fn(g); g.stroke(); g.restore(); };
const ink = (g, w, fn, col = INK) => { g.beginPath(); fn(g); g.strokeStyle = col; g.lineWidth = w; g.stroke(); };
const dots = (g, pts, r) => cut(g, q => { for (const [x, y] of pts) { q.moveTo(x + r, y); q.arc(x, y, r, 0, 7); } }, 'nonzero');
const coin = (g, x, y, r) => cut(g, q => { q.arc(x, y, r, 0, 7); q.rect(x - r * .4, y - r * .4, r * .8, r * .8); });
function scroll(g, x, y, r, rot = 0, flip = 1, w = 1.8) {        // cloud-scroll slit + teardrop hole
  cutLine(g, w, q => { for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2.1, rr = r * (1 - i / 40 * .78);
    const px = x + Math.cos(rot + a * flip) * rr, py = y + Math.sin(rot + a * flip) * rr; i ? q.lineTo(px, py) : q.moveTo(px, py); } });
  cut(g, q => q.arc(x, y, r * .17, 0, 7));
}
function crescents(g, x0, y0, x1, y1, r, w) {                   // fish-scale crescent slits
  let row = 0; for (let y = y0; y < y1; y += r * 1.1, row++) for (let x = x0 + (row % 2) * r; x < x1; x += r * 2)
    cutLine(g, w, q => q.arc(x, y, r * .85, .18 * Math.PI, .82 * Math.PI));
}
// a hide piece: box in world/local units, drawn at ssc px per unit, hide texture multiplied in, holes kept
function piece(box, ssc, draw, seed = 0) {
  const [x0, y0, x1, y1] = box, w = x1 - x0, h = y1 - y0, c = canvas(Math.ceil(w * ssc), Math.ceil(h * ssc)), g = c.getContext('2d');
  g.setTransform(ssc, 0, 0, ssc, -x0 * ssc, -y0 * ssc); g.lineJoin = 'round'; g.lineCap = 'round';
  draw(g);
  const m = canvas(c.width, c.height); m.getContext('2d').drawImage(c, 0, 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  const pat = g.createPattern(HIDE, 'repeat'); pat.setTransform(new DOMMatrix([1, 0, 0, 1, (seed * 137) % 256, (seed * 71) % 256]));
  g.globalCompositeOperation = 'multiply'; g.fillStyle = pat; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(m, 0, 0); g.globalCompositeOperation = 'source-over';
  return { c, x0, y0, w, h };
}
const drawP = (g, p) => g.drawImage(p.c, p.x0, p.y0, p.w, p.h);

// ---------------------------------------------------------------- textures
function hideTile() {
  const N = 256, c = canvas(N, N), g = c.getContext('2d'), id = g.createImageData(N, N), d = id.data;
  const hs = (x, y) => { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
  const vn = (x, y, P) => { const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = (a, b) => hs(((a % P) + P) % P, ((b % P) + P) % P);
    return (w(i, j) * (1 - u) + w(i + 1, j) * u) * (1 - v) + (w(i, j + 1) * (1 - u) + w(i + 1, j + 1) * u) * v; };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const f = vn(x / 32, y / 32, 8) * .5 + vn(x / 16, y / 16, 16) * .3 + vn(x / 4, y / 4, 64) * .2, sp = hs(x + 999, y) > .985 ? .8 : 1, v = (.8 + .24 * f) * sp, i = (y * N + x) * 4;
    d[i] = Math.min(255, v * 255); d[i + 1] = Math.min(255, v * 246); d[i + 2] = Math.min(255, v * 228); d[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  const r = rng(41); g.strokeStyle = 'rgba(90,58,30,.12)'; g.lineWidth = .8;
  for (let k = 0; k < 500; k++) { const x = r() * N, y = r() * N, a = r() * 6.28, l = 6 + r() * 16; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + 3, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  return c;
}
function clothTex() {   // cotton screen: weave + fibre speckle + density blotches + darker edges (world 1080×1920)
  const lw = 135, lh = 240, lo = canvas(lw, lh), lg = lo.getContext('2d'), ld = lg.createImageData(lw, lh);
  for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) { const i = (y * lw + x) * 4; ld.data[i] = Pilot.fbm(x * .06, y * .06, 4) * 255; ld.data[i + 1] = Pilot.noise(x * .5 + 40, y * .5) * 255; ld.data[i + 2] = 0; ld.data[i + 3] = 255; }
  lg.putImageData(ld, 0, 0);
  const up = canvas(WW, WH), ug = up.getContext('2d'); ug.imageSmoothingQuality = 'high'; ug.drawImage(lo, 0, 0, WW, WH);
  const u = ug.getImageData(0, 0, WW, WH).data;
  const c = canvas(WW, WH), g = c.getContext('2d'), id = g.createImageData(WW, WH), d = id.data, r = rng(9);
  for (let y = 0; y < WH; y++) {
    const ey = Math.min(1, y / 90, (WH - y) / 90);
    for (let x = 0; x < WW; x++) {
      const i = (y * WW + x) * 4, bl = u[i] / 255, wb = u[i + 1] / 255;
      const th = .5 + .5 * Math.sin(x * 2.6 + wb * 2) * Math.sin(y * 2.6 + wb * 2.3);
      const ex = Math.min(1, x / 90, (WW - x) / 90), ed = Math.max(0, Math.min(ex, ey)), e = ed * ed * (3 - 2 * ed);
      const v = (1 - (.05 * th + .035 * (r() - .5) + .11 * (bl - .5))) * (.74 + .26 * e);
      d[i] = 255 * v; d[i + 1] = 247 * v; d[i + 2] = 232 * v; d[i + 3] = 255;
    }
  }
  g.putImageData(id, 0, 0); return c;
}

// ---------------------------------------------------------------- set pieces & puppets
function buildWall() {
  CUTA = .5;
  const p = piece([0, 0, WW, WH], 1, g => {
    g.fillStyle = '#3e2412'; g.fillRect(0, 0, WW, Y1);
    g.fillStyle = '#35200f'; g.fillRect(0, 1180, WW, Y1 - 1180);              // wainscot, a darker dye
    g.fillStyle = '#301c0d'; g.fillRect(0, Y1, WW, WH - Y1);                  // floor
    // floor planks (ink), converging on the eye point
    g.save(); g.beginPath(); g.rect(0, Y1, WW, WH - Y1); g.clip();
    for (let k = -14; k <= 14; k++) { const xs = VPX + k * 64; ink(g, 2, q => { q.moveTo(xs, Y1); q.lineTo(VPX + (xs - VPX) * (2100 - VPY) / (Y1 - VPY), 2100); }, 'rgba(18,10,5,.55)'); }
    g.restore();
    // baseboard: a carved meander band
    g.fillStyle = '#2e1a0c'; g.fillRect(0, 1366, WW, 34);
    cutLine(g, 1.6, q => { const y = 1388, s = 7; q.moveTo(0, y); for (let x = 0; x < WW; x += s * 2) { q.lineTo(x, y - s); q.lineTo(x + s * 1.4, y - s); q.lineTo(x + s * 1.4, y - s * .3); q.lineTo(x + s * .7, y - s * .3); q.lineTo(x + s * .7, y); q.lineTo(x + s * 2, y); } });
    // chair rail + a row of punched holes
    ink(g, 3, q => { q.moveTo(0, 1180); q.lineTo(WW, 1180); });
    cutLine(g, 1.6, q => { q.moveTo(0, 1188); q.lineTo(WW, 1188); });
    const rail = []; for (let x = 14; x < WW; x += 26) if (x < 280 || x > 800) rail.push([x, 1202]); dots(g, rail, 2.6);
    // wainscot panels: slit outline, a coin in the middle, crescents
    for (const [a, b] of [[24, 240], [840, 1056]]) {
      cutLine(g, 1.6, q => q.rect(a, 1222, b - a, 128));
      ink(g, 2, q => q.rect(a - 5, 1217, b - a + 10, 138));
      for (let x = a + 30; x < b - 20; x += 36) scroll(g, x, 1286, 11, (x / 36 | 0) % 2 ? 0 : Math.PI, 1, 1.4);
    }
    // two columns of punched dots framing the door, coins at their ends
    for (const x of [252, 828]) { const p = []; for (let y = 690; y < 1170; y += 22) p.push([x, y]); dots(g, p, 2.2); }
    // a faint crack of plaster lines in the upper wall (ink)
    const r = rng(77);
    for (let k = 0; k < 7; k++) { const x = 60 + r() * 960; if (x > 200 && x < 880) continue; const y = 220 + r() * 800; ink(g, 1.4, q => { q.moveTo(x, y); q.lineTo(x + (r() - .5) * 60, y + 40 + r() * 60); q.lineTo(x + (r() - .5) * 90, y + 110 + r() * 60); }, 'rgba(20,10,4,.35)'); }
    ink(g, 3, q => { q.moveTo(0, Y1); q.lineTo(WW, Y1); });
    g.clearRect(X0, Y0, DW, DH);                                                // the doorway: bare cloth
  }, 3);
  CUTA = 1; return p;
}
function buildFrame() {
  return piece([272, 600, 808, 1406], 1.5, g => {
    const wood = '#2b170a';
    g.fillStyle = wood;
    g.fillRect(300, 690, 60, 712); g.fillRect(720, 690, 60, 712);              // posts
    g.fillRect(292, 1360, 76, 42); g.fillRect(712, 1360, 76, 42);              // plinths
    g.beginPath(); poly(g, [[276, 614], [804, 614], [796, 630], [284, 630]]); g.fill();   // cornice
    g.fillRect(288, 628, 504, 72);                                               // lintel
    // carving: slit borders, beads, scrolls, coins
    for (const x of [300, 720]) {
      cutLine(g, 1.7, q => { q.moveTo(x + 8, 712); q.lineTo(x + 8, 1350); q.moveTo(x + 52, 712); q.lineTo(x + 52, 1350); });
      coin(g, x + 30, 1381, 9);
      const p = []; for (let y = 718; y < 1352; y += 18) p.push([x + 4.5, y]); dots(g, p, 1.6);
    }
    cutLine(g, 1.7, q => { q.moveTo(300, 638); q.lineTo(780, 638); q.moveTo(300, 692); q.lineTo(780, 692); });
    const bd = []; for (let x = 300; x <= 780; x += 16) bd.push([x, 622]); dots(g, bd, 2);
    ink(g, 2.4, q => { q.rect(300, 690, 60, 712); q.rect(720, 690, 60, 712); q.rect(288, 628, 504, 72); poly(q, [[276, 614], [804, 614], [796, 630], [284, 630]]); q.rect(292, 1360, 76, 42); q.rect(712, 1360, 76, 42); });
  }, 5);
}
function buildLeaf() {   // local: x 0 (hinge) → 360 (free edge), y 0 → 700
  return piece([0, 0, DW, DH], 1.5, g => {
    g.fillStyle = '#734420'; g.fillRect(0, 0, DW, DH);
    for (let k = 1; k < 5; k++) ink(g, 2.4, q => { q.moveTo(k * 72, 0); q.lineTo(k * 72, DH); }, '#2a1508');
    // grain slits (thin, sparse) so a little light leaks along the boards
    // battens + Z brace, darker dye
    g.fillStyle = '#4f2a11';
    g.fillRect(0, 92, DW, 48); g.fillRect(0, 560, DW, 48);
    g.beginPath(); poly(g, [[22, 560], [70, 560], [338, 140], [290, 140]]); g.fill();
    ink(g, 2, q => { q.rect(0, 92, DW, 48); q.rect(0, 560, DW, 48); poly(q, [[22, 560], [70, 560], [338, 140], [290, 140]]); });
    // nail studs with pinholes of light
    for (const yb of [116, 584]) for (let x = 18; x < DW; x += 36) { g.beginPath(); g.arc(x, yb, 6, 0, 7); g.fillStyle = '#22120a'; g.fill(); cut(g, q => q.arc(x, yb, 1.7, 0, 7)); }
    // ring handle + keyhole (a pinpoint of the light beyond)
    g.beginPath(); g.ellipse(318, 372, 13, 22, 0, 0, 7); g.fillStyle = '#1c0f08'; g.fill();
    ink(g, 5, q => q.arc(318, 402, 19, 0, 7), '#1c0f08');
    cut(g, q => { q.arc(318, 446, 5, 0, 7); q.moveTo(315, 448); q.lineTo(321, 448); q.lineTo(323, 462); q.lineTo(313, 462); q.closePath(); }, 'nonzero');
    ink(g, 3.2, q => q.rect(1.5, 1.5, DW - 3, DH - 3));
  }, 8);
}
// claw: hand back (origin at the knuckle line, pointing −x), forearm, finger segments (pointing +x, palm = −y), nail
function buildClaw() {
  const OUT = '#090402';
  const handPts = [[-2, -64], [30, -52], [62, -30], [78, -4], [74, 30], [40, 54], [-2, 66], [-9, 34], [-11, 0], [-9, -34]];
  HAND = piece([-16, -80, 92, 82], 2.5, g => {
    g.fillStyle = '#22120a';
    g.beginPath(); smooth(g, handPts); g.fill();
    for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(-3 + Math.abs(i - 1.5) * 3, -51 + 34 * i, 9.5, 0, 7); g.fill(); }
    // tendons: tapered slits from the wrist to each knuckle (reads as the bones of a hand)
    for (let i = 0; i < 4; i++) { const ky = -51 + 34 * i, wy = -12 + 9 * i;
      cut(g, q => { q.moveTo(66, wy - 1); q.quadraticCurveTo(34, (wy + ky) / 2 - 3, 9, ky - 1.2); q.lineTo(9, ky + 1.2); q.quadraticCurveTo(34, (wy + ky) / 2 + 3, 66, wy + 1); q.closePath(); }, 'nonzero'); }
    for (let i = 0; i < 4; i++) ink(g, 1.3, q => q.arc(-3 + Math.abs(i - 1.5) * 3, -51 + 34 * i, 9.5, 0, 7), OUT);
    ink(g, 1.8, q => smooth(q, handPts), OUT);
  }, 11);
  const armPts = [[-4, -26], [140, -24], [330, -14], [330, 50], [140, 40], [-4, 28]];
  ARM = piece([-10, -40, 340, 60], 2, g => {
    g.fillStyle = '#20110a';
    g.beginPath(); smooth(g, armPts); g.fill();
    crescents(g, 40, -12, 320, 40, 9, 1.6);
    ink(g, 1.8, q => smooth(q, armPts), OUT);
  }, 12);
  const segs = [[50, 13], [40, 11.5], [32, 10]];
  SEG = segs.map(([L, w], k) => piece([-w * .8, -w, L + w * .5, w], 3, g => {
    g.fillStyle = '#1f1009';
    g.beginPath(); g.moveTo(0, -w / 2); g.lineTo(L, -w * .38); g.arc(L, 0, w * .38, -Math.PI / 2, Math.PI / 2); g.lineTo(0, w / 2); g.arc(0, 0, w / 2, Math.PI / 2, Math.PI * 1.5); g.fill();
    g.beginPath(); g.arc(0, 0, w * .62, 0, 7); g.fill();
    cut(g, q => { q.ellipse(L * .55, 0, L * .16, w * .1, 0, 0, 7); }, 'nonzero');
    ink(g, 1.2, q => { q.moveTo(0, -w / 2); q.lineTo(L, -w * .38); q.arc(L, 0, w * .38, -Math.PI / 2, Math.PI / 2); q.lineTo(0, w / 2); }, OUT);
    ink(g, 1.2, q => q.arc(0, 0, w * .62, 0, 7), OUT);
  }, 20 + k));
  NAIL = piece([-4, -40, 56, 10], 3, g => {
    g.fillStyle = '#0b0603';
    g.beginPath(); g.moveTo(0, -5); g.bezierCurveTo(20, -7, 42, -12, 54, -36); g.bezierCurveTo(46, -14, 30, 1, 0, 5); g.closePath(); g.fill();
  }, 30);
}
// the horned figure (local: feet at 0,0, head centre at 0,−545, horn tips ±56,−700)
function demonPath(g, as = 1) {
  for (const s of [-1, 1]) {
    g.moveTo(s * 8, -576); g.bezierCurveTo(s * 40, -584, s * 66, -598, s * 74, -630); g.bezierCurveTo(s * 80, -656, s * 78, -684, s * 70, -712);
    g.bezierCurveTo(s * 64, -688, s * 60, -664, s * 52, -648); g.bezierCurveTo(s * 42, -626, s * 24, -610, s * 2, -600); g.closePath();
    // arm + three long fingers
    const A = (x, y) => [s * (76 + (x - 76) * as), y];
    poly(g, [[76, -486], [104, -470], [132, -340], [124, -214], [98, -214], [104, -340], [80, -430]].map(p => A(...p)));
    poly(g, [[126, -216], [136, -172], [132, -132], [122, -170], [116, -122], [108, -170], [98, -136], [98, -180], [96, -216]].map(p => A(...p)));
  }
  g.moveTo(33, -545); g.ellipse(0, -545, 33, 42, 0, 0, 7);
  poly(g, [[-22, -522], [0, -490], [22, -522]]);
  g.rect(-16, -512, 32, 34);
  poly(g, [[-22, -500], [-72, -490], [-98, -468], [-90, -420], [-70, -360], [-50, -300], [-56, -250], [56, -250], [50, -300], [70, -360], [90, -420], [98, -468], [72, -490], [22, -500]]);
  poly(g, [[-56, -252], [-66, -130], [-56, -6], [-26, 0], [-18, -150], [0, -206], [18, -150], [26, 0], [56, -6], [66, -130], [56, -252]]);
}
function buildDemon() {
  const k = .5, c = canvas(400 * k, 740 * k), g = c.getContext('2d');
  g.setTransform(k, 0, 0, k, 200 * k, 730 * k); g.fillStyle = '#000'; g.beginPath(); demonPath(g); g.fill('nonzero');
  DEMON = c;
  const c2 = canvas(c.width, c.height), g2 = c2.getContext('2d'); g2.setTransform(k, 0, 0, k, 200 * k, 730 * k); g2.fillStyle = '#000'; g2.beginPath(); demonPath(g2, .45); g2.fill('nonzero');
  const b = canvas(c.width, c.height), bg = b.getContext('2d'); bg.filter = 'blur(2px)'; bg.drawImage(c2, 0, 0); DEMONB = b;
}
// the red: a brush stroke of translucent red dye, built horizontally (local x 0 → len), drawn rotated
function buildStroke(len, wid, seed) {
  const pad = 26, c = canvas(len + pad * 2, wid * 2 + pad), g = c.getContext('2d'), r = rng(seed), cy = c.height / 2;

  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over';
  // the dark room, a little warm spill from the stage
  c.fillStyle = '#080503'; c.beginPath(); c.rect(0, 0, W, H); c.rect(p0.x - bw, p0.y - bw * 2.2, p1.x - p0.x + bw * 2, p1.y - p0.y + bw * 3.2); c.fill('evenodd');
  const sp = c.createRadialGradient((p0.x + p1.x) / 2, (p0.y + p1.y) / 2, 50, (p0.x + p1.x) / 2, (p0.y + p1.y) / 2, (p1.y - p0.y) * .95);
  const I = Math.min(1, lampI(t)); sp.addColorStop(0, `rgba(150,92,40,${.32 * I})`); sp.addColorStop(1, 'rgba(150,92,40,0)');
  c.globalCompositeOperation = 'screen'; c.fillStyle = sp; c.fillRect(0, 0, W, H); c.globalCompositeOperation = 'source-over';
  // lacquered frame: posts, a carved lintel board, a sill
  const lg = c.createLinearGradient(p0.x - bw, 0, p0.x, 0); lg.addColorStop(0, '#1c0a05'); lg.addColorStop(1, '#3d170b');
  const rg = c.createLinearGradient(p1.x, 0, p1.x + bw, 0); rg.addColorStop(0, '#3d170b'); rg.addColorStop(1, '#1c0a05');
  c.fillStyle = lg; c.fillRect(p0.x - bw, p0.y - bw * 2.2, bw, p1.y - p0.y + bw * 3.2);
  c.fillStyle = rg; c.fillRect(p1.x, p0.y - bw * 2.2, bw, p1.y - p0.y + bw * 3.2);
  const tg = c.createLinearGradient(0, p0.y - bw * 2.2, 0, p0.y); tg.addColorStop(0, '#220c06'); tg.addColorStop(1, '#4a1d0d');
  c.fillStyle = tg; c.fillRect(p0.x - bw, p0.y - bw * 2.2, p1.x - p0.x + bw * 2, bw * 2.2);
  c.fillStyle = '#2a0f07'; c.fillRect(p0.x - bw, p1.y, p1.x - p0.x + bw * 2, bw);
  c.strokeStyle = 'rgba(196,146,74,.55)'; c.lineWidth = Math.max(1, 1.6 * k);
  c.strokeRect(p0.x - bw * .55, p0.y - bw * 1.75, p1.x - p0.x + bw * 1.1, p1.y - p0.y + bw * 2.3);
  c.fillStyle = 'rgba(196,146,74,.5)';
  for (let i = 0; i < 9; i++) { const x = p0.x + (p1.x - p0.x) * (i + .5) / 9; c.beginPath(); c.arc(x, p0.y - bw * 1.1, 3.2 * k * 2, 0, 7); c.fill(); }
  c.strokeStyle = `rgba(255,178,96,${.4 * I})`; c.lineWidth = 3; c.strokeRect(p0.x + 1, p0.y + 1, p1.x - p0.x - 2, p1.y - p0.y - 2);
}

function draw(ctx, t) {
  const M = camM(t);
  buildT(t, M);
  const lit = drawLight(ctx, t, M);
  if (lit) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(Tc, 0, 0);
    // warm bloom from what's bright
    BG.setTransform(1, 0, 0, 1, 0, 0); BG.globalCompositeOperation = 'source-over'; BG.filter = 'brightness(.72) contrast(3.2) blur(3px)';
    BG.drawImage(ctx.canvas, 0, 0, BL.width, BL.height); BG.filter = 'none';
    BG.globalCompositeOperation = 'destination-over'; BG.fillStyle = '#000'; BG.fillRect(0, 0, BL.width, BL.height);
    BG.globalCompositeOperation = 'multiply'; BG.fillStyle = '#ffcf96'; BG.fillRect(0, 0, BL.width, BL.height);
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .62; ctx.drawImage(BL, 0, 0, W, H); ctx.globalAlpha = 1;
    // the red needs no bloom, but the dye glows a little when the lamp is up
    ctx.globalCompositeOperation = 'source-over';
  }
  stageFrame(ctx, t, M);
  // audience heads in the dark room (end only)
  const au = ss(25.2, 26.6, t);
  if (au > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = au; ctx.drawImage(AUD, BX, BY + (WH - 360) * S0, WW * S0, 360 * S0); ctx.globalAlpha = 1; }
  // warm vignette, grain
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(VIGN, 0, 0, W, H);
  const fr = Math.floor(t * 30), r = rng(fr * 7 + 3), ox = -r() * 60, oy = -r() * 60;
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .07; ctx.drawImage(GRAIN, ox, oy, W + 60, H + 60); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  // words
  DOOR.captions(ctx, t, { font: "'Gowun Batang','Noto Serif KR',serif", color: '#f8ead0', srcColor: '#e6d2ae', y: 400, shadow: 'rgba(10,4,0,.95)' });
  DOOR.endCardDraw(ctx, t, { y: 262, font: "'Gowun Batang','Noto Serif KR',serif", color: '#f8ead0', srcColor: '#dcc59f', ctaColor: '#f1c27a' });
  // fade in from / out to black
  const fade = 1 - ss(0, .8, t) * (1 - ss(DOOR.DUR - .6, DOOR.DUR, t));
  if (fade > .001) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

async function init() {
  HIDE = hideTile();
  CLOTH = clothTex();
  WALL = buildWall(); FRAME = buildFrame(); LEAF = buildLeaf(); buildClaw(); buildDemon();
  LB = canvas(Math.ceil(LBW * LBK), Math.ceil(LBH * LBK)); LBG = LB.getContext('2d'); FB = canvas(Math.ceil(FBW * FBK), Math.ceil(FBH * FBK)); FBG = FB.getContext('2d');
  CB = canvas(720, 620); CBG = CB.getContext('2d');
  STROKES = [buildStroke(482, 40, 3), buildStroke(640, 42, 7), buildStroke(640, 42, 11)];
  Tc = canvas(W, H); T = Tc.getContext('2d');
  SOFT2 = canvas(Math.round(W / 2), Math.round(H / 2)); SG2 = SOFT2.getContext('2d'); SOFT4 = canvas(Math.round(W / 4), Math.round(H / 4)); SG4 = SOFT4.getContext('2d');
  BL = canvas(Math.round(W / 8), Math.round(H / 8)); BG = BL.getContext('2d');
  VIGN = canvas(W, H); { const g = VIGN.getContext('2d'), vg = g.createRadialGradient(W / 2, H * .52, Math.min(W, H) * .3, W / 2, H * .52, Math.hypot(W, H) * .55);
    vg.addColorStop(0, '#fff'); vg.addColorStop(.6, '#e9d2b6'); vg.addColorStop(1, '#8a5a30'); g.fillStyle = vg; g.fillRect(0, 0, W, H); }
  GRAIN = Pilot.speckle(Math.round(W / 2), Math.round(H / 2), 40, 5);
  AUD = canvas(WW, 360); { const g = AUD.getContext('2d'); g.filter = 'blur(5px)'; g.fillStyle = '#040201';
    for (const [x, y, r] of [[120, 250, 74], [330, 210, 66], [560, 260, 80], [790, 205, 62], [985, 250, 76]]) { g.beginPath(); g.ellipse(x, y, r * .8, r, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(x, y + r * 1.9, r * 1.8, r * 1.2, 0, 0, 7); g.fill(); } }
}

Pilot.run({ W, H, dur: DOOR.DUR, fonts: ["700 60px 'Gowun Batang'", "400 30px 'Gowun Batang'", "500 30px 'Noto Sans KR'", "600 30px 'Noto Sans KR'"], init, draw });
</script>
