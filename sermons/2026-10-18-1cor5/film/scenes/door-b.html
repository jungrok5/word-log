<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문틈 · B 호퍼풍 사실주의</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script src="door-common.js"></script>
<script>
/* 문틈 · B — Hopper-style quiet realism (Lemo-Opuscar no. 48 "Hopper-Style American Realism").
   One still, almost empty room at night, painted in flat matte planes. The whole picture is a real little 3D room
   (metres, one-point camera, low and still) so every light shape is a true perspective projection:
   - a door in the back wall, hinged on the left, swinging INTO the room; beyond it a lit corridor with one unseen lamp;
   - the light that passes the gap (corridor lamp → doorway → past the door's free edge) is projected onto the floor:
     a hard-edged parallelogram that widens with each opening;
   - the horned shadow is a silhouette in the doorway plane, projected from the lamp onto the floor (cast by a figure we
     never see); the hand's shadow is projected the same way;
   - a cool moon parallelogram (window off-screen right) lies on the back wall, the only other light.
   The blood red #9c1a1a is the one saturated colour. */
const { clamp, lerp, ss, eo, eio, win, rng, noise, fbm, canvas, hex, mix, rgb } = Pilot;
const W = Pilot.W, H = Pilot.H, V = Pilot.ori === 'v';
const B = DOOR.beat, DUR = DOOR.DUR, D2R = Math.PI / 180;

// ---------------- the room (metres; x right, y up, z away from the camera) ----------------
const ZB = 5, T = 0.14;                       // back wall plane (room face) and wall thickness
const X0 = -0.75, X1 = 0.15, DW = X1 - X0, DH = 2.05;   // doorway (hinge on the left, X0)
const XL = -1.05, XR = 1.45, HC = 3.2, ZN = 0.7;         // side walls, ceiling, near clip
const CAS = 0.1, CASH = 0.12;                 // door casing width / head height
const LP = { x: -0.45, y: 2.5, z: 6.6 };      // the corridor lamp (never seen)
const DL = LP.z - ZB;
const ZF = 6.75, HCC = 2.7;                   // corridor far wall, corridor ceiling
const CAM = V ? { x: 0.2, y: 1.0, f: 1650, px: 540, py: 997 } : { x: 0.2, y: 1.0, f: 880, px: 960, py: 560 };
const P = (x, y, z) => [CAM.px + CAM.f * (x - CAM.x) / z, CAM.py - CAM.f * (y - CAM.y) / z];

// clip a 3D polygon against z >= ZN, then project
function clipNear(poly) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], ina = a[2] >= ZN, inb = b[2] >= ZN;
    if (ina) out.push(a);
    if (ina !== inb) { const k = (ZN - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, ZN]); }
  }
  return out;
}
function path3(ctx, poly, fresh = true) {
  const q = clipNear(poly); if (fresh) ctx.beginPath();
  q.forEach((p, i) => { const s = P(p[0], p[1], p[2]); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); });
  if (q.length) ctx.closePath();
}
function fill3(ctx, poly, style) { path3(ctx, poly); ctx.fillStyle = style; ctx.fill(); }
// clip a 2D polygon to an axis-aligned rect (Sutherland–Hodgman)
function clipRect(poly, x0, x1, y0, y1) {
  const edges = [[p => p[0] >= x0, (a, b) => (x0 - a[0]) / (b[0] - a[0])], [p => p[0] <= x1, (a, b) => (x1 - a[0]) / (b[0] - a[0])],
                 [p => p[1] >= y0, (a, b) => (y0 - a[1]) / (b[1] - a[1])], [p => p[1] <= y1, (a, b) => (y1 - a[1]) / (b[1] - a[1])]];
  let out = poly;
  for (const [inside, kf] of edges) {
    const src = out; out = [];
    for (let i = 0; i < src.length; i++) {
      const a = src[i], b = src[(i + 1) % src.length], ia = inside(a), ib = inside(b);
      if (ia) out.push(a);
      if (ia !== ib) { const k = kf(a, b); out.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]); }
    }
    if (!out.length) break;
  }
  return out;
}
// lamp → doorway plane point (xa, ya, ZB) → onto the floor
const apFloor = (xa, ya) => { const s = LP.y / (LP.y - ya); return [LP.x + s * (xa - LP.x), 0, LP.z + s * (ZB - LP.z)]; };
// lamp → any 3D point → onto the floor
const ptFloor = q => { const s = LP.y / (LP.y - q[1]); return [LP.x + s * (q[0] - LP.x), 0, LP.z + s * (q[2] - LP.z)]; };

// ---------------- the door leaf ----------------
const leafPt = (th, a, b, y) => { const c = Math.cos(th * D2R), s = Math.sin(th * D2R); return [X0 + a * c - b * s, y, ZB - a * s - b * c]; };
// the part of the doorway the lamp still shines through, as a rect in the doorway plane: [ax0, ax1] × [0, ah]
const X0T = LP.x + (X0 - LP.x) * DL / (DL - T);          // left jamb (tunnel) limit
const AH = Math.min(DH, LP.y + (DH - LP.y) * DL / (DL - T));
function aperture(th) {
  const c = Math.cos(th * D2R), s = Math.sin(th * D2R), ex = X0 + DW * c, ez = ZB - DW * s;
  const xc = LP.x + (ex - LP.x) * DL / (LP.z - ez);
  return { x0: Math.max(xc, X0T), x1: X1, h: AH };
}

// ---------------- timing ----------------
const creak = (dt, d = .85) => dt <= 0 ? 0 : eo(dt / d) + .05 * Math.sin(dt * 15) * Math.exp(-dt * 5);
function breath(t) { if (t < B.breath) return 0; return ss(B.breath, B.breath + 3, t) * (.5 - .5 * Math.cos(2 * Math.PI * (t - B.breath) / 2.4)); }
function theta(t) {
  let th = 7;
  th += 8 * creak(t - B.open[0]); th += 11 * creak(t - B.open[1]); th += 14 * creak(t - B.open[2]);   // 15 → 26 → 40
  th += 6 * eio(clamp((t - (B.claw + 1.0)) / 1.4));                                                   // the hand pulls → 46
  if (t < B.burst) th += .7 * breath(t);
  else {
    const u = t - B.burst;
    if (u < .2) th = lerp(th, 70, (u / .2) * (u / .2));
    else th = 67 + 3 * Math.exp(-(u - .2) * 5) * Math.cos((u - .2) * 22);
  }
  if (t >= B.close) {
    const k = eio(clamp((t - B.close) / 1.2)), u = t - (B.close + 1.2);
    th = lerp(67, 7, k) + (u > 0 ? .9 * Math.exp(-u * 7) * Math.sin(u * 30) : 0);
  }
  return th;
}
const BLACK0 = 16.5, BACK = 19.3;              // cut to black, light returns
function lampI(t) {
  let I = 1;
  if (t < B.burst) I *= 1 - .12 * breath(t) - .06 * ss(B.shadowIn, B.shadowIn + 1, t) * (noise(t * 7, 2) > .78 ? 1 : 0);
  else if (t < BLACK0) { const u = t - B.burst; I = 1 + 1.3 * Math.exp(-u * 4) * ss(0, .04, u); I *= 1 - ss(16.05, 16.45, t); }
  else if (t < BACK) I = 0;
  else {
    const fl = 1 - .35 * (noise(t * 11, 5) > .72 ? 1 : 0) * (1 - ss(B.recoil, B.recoil + .5, t));
    I = (.5 * ss(BACK, 20.5, t) + .14 * ss(B.recoil, B.recoil + .9, t) + .3 * ss(B.close, B.close + 1.4, t)) * fl;
  }
  return I;
}
const warmK = t => ss(B.close, B.close + 1.4, t);
function ambK(t) {
  if (t < BLACK0) return .8 * ss(0, 1.4, t) * (1 - .6 * ss(15.8, 16.2, t) - .4 * ss(16.25, BLACK0, t));
  if (t < BACK) return 0;
  return .62 * ss(BACK, 20.6, t) + .14 * ss(B.close, B.close + 1.4, t);
}

// ---------------- the horned shadow (a silhouette in the doorway plane) ----------------
// unit silhouette, front view, crouched and hunched: horns, head, high shoulders, one arm reaching left (toward the
// door's edge). v above the shoulders is stretched because the floor foreshortens it again.
function bez(out, p0, p1, p2, p3, n = 8) { for (let i = 1; i <= n; i++) { const t = i / n, m = 1 - t;
  out.push([m * m * m * p0[0] + 3 * m * m * t * p1[0] + 3 * m * t * t * p2[0] + t * t * t * p3[0], m * m * m * p0[1] + 3 * m * m * t * p1[1] + 3 * m * t * t * p2[1] + t * t * t * p3[1]]); } }
function silhouette(arm, VS) {
  // standing, slightly hunched; shoulders ~1.06, head 1.1–1.33, horns to ~1.62 (doorway-plane metres at k = 1).
  // The floor squeezes everything below ~0.9 into a thin band at the threshold, so the readable part is head + horns.
  const s = [], sv = v => v < 1 ? v : 1 + (v - 1) * VS, A = (u, v) => [u, sv(v)];
  const go = (p1, p2, p3) => { const p0 = s[s.length - 1]; bez(s, p0, p1, p2, p3); };
  s.push(A(-.2, -.3));
  go(A(-.2, .2), A(-.19, .6), A(-.18, .88));
  // left arm: hangs (arm=0) or reaches out to the left toward the door's edge (arm=1)
  const ex = lerp(-.21, -.36, arm), ey = lerp(.7, 1.08, arm), hx = lerp(-.21, -.56, arm), hy = lerp(.45, 1.14, arm);
  go(A(-.2, .95), A(ex + .02, ey - .05), A(ex, ey - .025));
  go(A((ex + hx) / 2, (ey + hy) / 2 - .025), A(hx + .04, hy - .025), A(hx, hy - .015));
  const fx = hx, fy = hy, fl = .3 + .7 * arm;
  s.push(A(fx - .08 * fl, fy - .035)); s.push(A(fx - .005, fy - .004));
  s.push(A(fx - .1 * fl, fy + .012)); s.push(A(fx, fy + .014));
  s.push(A(fx - .08 * fl, fy + .055)); s.push(A(fx + .02, fy + .028));
  go(A((ex + hx) / 2 + .01, (ey + hy) / 2 + .04), A(ex + .02, ey + .04), A(lerp(-.17, -.2, arm), lerp(1.06, 1.08, arm)));
  // hunched shoulder, neck, head (a long skull)
  go(A(-.15, 1.09), A(-.085, 1.08), A(-.05, 1.1));
  go(A(-.06, 1.15), A(-.068, 1.22), A(-.055, 1.28));
  // left horn: out, up, curling in at the tip
  go(A(-.09, 1.31), A(-.15, 1.36), A(-.16, 1.45));
  go(A(-.165, 1.52), A(-.14, 1.59), A(-.11, 1.625));
  go(A(-.125, 1.57), A(-.13, 1.5), A(-.11, 1.44));
  go(A(-.09, 1.39), A(-.05, 1.35), A(-.025, 1.335));
  go(A(-.01, 1.345), A(.01, 1.345), A(.025, 1.335));
  go(A(.05, 1.35), A(.09, 1.39), A(.11, 1.44));
  go(A(.13, 1.5), A(.125, 1.57), A(.11, 1.625));
  go(A(.14, 1.59), A(.165, 1.52), A(.16, 1.45));
  go(A(.15, 1.36), A(.09, 1.31), A(.055, 1.28));
  go(A(.068, 1.22), A(.06, 1.15), A(.05, 1.1));
  go(A(.085, 1.08), A(.15, 1.09), A(.18, 1.03));
  go(A(.2, .9), A(.2, .5), A(.2, .1));
  s.push(A(.2, -.3));
  return s;
}
// where the shadow is: { x, k, sink, arm } or null
function figure(t) {
  if (t >= B.shadowIn && t < BLACK0) {
    const k0 = .94 * (1 + .015 * Math.sin((t - B.shadowIn) * 2.6));
    let x = lerp(.5, -.02, eio((t - B.shadowIn) / 1.5)), k = k0, arm = eio(clamp((t - B.claw + .2) / 1.0));
    if (t > B.burst + .32) { const u = clamp((t - B.burst - .32) / .72); k = lerp(k0, 5.5, u * u * (3 - 2 * u) * u); x = lerp(x, -.15, u); }
    return { x, k, sink: 0, arm };
  }
  if (t >= BACK && t < B.close) {
    let x = -.13, k = 1.06 * (1 + .015 * Math.sin(t * 2.2)), sink = 0;
    const fl = t - B.recoil;
    if (fl > 0) {
      k *= 1 - .12 * Math.min(1, fl / .08) * Math.exp(-Math.max(0, fl - .1) * 3);
      x += .04 * Math.sin(fl * 46) * Math.exp(-fl * 7);
      const w = eio(clamp((fl - .15) / .8)); x = lerp(x, -1.25, w); k *= 1 - .35 * w; sink = .35 * w;
    }
    return { x, k, sink, arm: 0 };
  }
  return null;
}

// ---------------- static paint layers (built once) ----------------
let base, lit, litW, corr, corrW, grain, vign, bristles;
function plane(ctx, poly, col) { fill3(ctx, poly, col); }
// long dragged strokes across a plane: fn(u, v) → 3D point, strokes run along v
function strokes(ctx, n, seed, fn, o) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const u = r(), v = r(), len = o.len[0] + r() * (o.len[1] - o.len[0]), du = (r() - .5) * o.slant;
    const a = fn(u, v), b = fn(clamp(u + du), clamp(v + len)), zc = (a[2] + b[2]) / 2;
    const pa = P(...a), pb = P(...b);
    ctx.strokeStyle = r() < .5 ? `rgba(255,248,230,${o.a * (.4 + .6 * r())})` : `rgba(0,0,0,${o.a * 1.3 * (.4 + .6 * r())})`;
    ctx.lineWidth = Math.max(1, o.w * CAM.f / zc * (.6 + .8 * r())); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(pa[0], pa[1]);
    const pm = P(...fn(clamp(u + du * .5 + (r() - .5) * .004), clamp(v + len * .5)));
    ctx.quadraticCurveTo(pm[0], pm[1], pb[0], pb[1]); ctx.stroke();
  }
}
function floorBoards(ctx, light, seed) {
  const r = rng(seed), bw = .135;
  for (let x = XL; x < XR; x += bw) {
    const tone = (r() - .5) * .12, c = light ? mix([180, 166, 136], [150, 136, 108], .5 + tone * 3) : mix([44, 34, 27], [34, 26, 21], .5 + tone * 3);
    fill3(ctx, [[x, 0, ZN], [x + bw, 0, ZN], [x + bw, 0, ZB + T], [x, 0, ZB + T]], rgb(c));
    // board joints across
    let z = ZN + r() * 1.5;
    while (z < ZB) { const zz = z; fill3(ctx, [[x, 0, zz], [x + bw, 0, zz], [x + bw, 0, zz + .012], [x, 0, zz + .012]], light ? 'rgba(70,58,42,.45)' : 'rgba(10,7,5,.5)'); z += .9 + r() * 1.8; }
    fill3(ctx, [[x - .004, 0, ZN], [x + .004, 0, ZN], [x + .004, 0, ZB + T], [x - .004, 0, ZB + T]], light ? 'rgba(80,66,48,.55)' : 'rgba(12,9,7,.7)');
  }
  ctx.save(); path3(ctx, floorPoly()); ctx.clip();
  strokes(ctx, 520, seed + 1, (u, v) => [lerp(XL, XR, u), 0, lerp(ZN + .6, ZB, v)], { len: [.06, .2], slant: .01, w: .022, a: light ? .07 : .05 });
  ctx.restore();
}
const floorPoly = () => [[XL, 0, ZN], [XR, 0, ZN], [XR, 0, ZB], [X1, 0, ZB], [X1, 0, ZB + T], [X0, 0, ZB + T], [X0, 0, ZB], [XL, 0, ZB]];
const innerOpening = () => [[X0, 0, ZB + T], [X1, 0, ZB + T], [X1, DH, ZB + T], [X0, DH, ZB + T]];

function buildBase() {
  const c = canvas(W, H), x = c.getContext('2d');
  x.fillStyle = '#0d0f0f'; x.fillRect(0, 0, W, H);
  // ceiling, side walls, back wall
  plane(x, [[XL, HC, ZN], [XR, HC, ZN], [XR, HC, ZB], [XL, HC, ZB]], '#1e2426');
  plane(x, [[XL, 0, ZN], [XL, 0, ZB], [XL, HC, ZB], [XL, HC, ZN]], '#2a2f2c');
  plane(x, [[XR, 0, ZN], [XR, 0, ZB], [XR, HC, ZB], [XR, HC, ZN]], '#36362e');
  const top = P(0, HC, ZB)[1], bot = P(0, 0, ZB)[1], g = x.createLinearGradient(0, top, 0, bot);
  g.addColorStop(0, '#332f27'); g.addColorStop(.45, '#423b2f'); g.addColorStop(1, '#4a4234');
  plane(x, [[XL, 0, ZB], [XR, 0, ZB], [XR, HC, ZB], [XL, HC, ZB]], g);
  // matte oil: long dragged strokes on each wall
  x.save(); path3(x, [[XL, 0, ZB], [XR, 0, ZB], [XR, HC, ZB], [XL, HC, ZB]]); x.clip();
  strokes(x, 260, 11, (u, v) => [lerp(XL, XR, u), lerp(0, HC, v), ZB], { len: [.12, .35], slant: .12, w: .035, a: .028 }); x.restore();
  x.save(); path3(x, [[XL, 0, ZN], [XL, 0, ZB], [XL, HC, ZB], [XL, HC, ZN]]); x.clip();
  strokes(x, 120, 12, (u, v) => [XL, lerp(0, HC, v), lerp(3, ZB, u)], { len: [.12, .3], slant: .12, w: .04, a: .025 }); x.restore();
  x.save(); path3(x, [[XR, 0, ZN], [XR, 0, ZB], [XR, HC, ZB], [XR, HC, ZN]]); x.clip();
  strokes(x, 120, 13, (u, v) => [XR, lerp(0, HC, v), lerp(3, ZB, u)], { len: [.12, .3], slant: .12, w: .04, a: .025 }); x.restore();
  // corner shading where planes meet (soft, painterly)
  x.save(); path3(x, [[XL, 0, ZB], [XR, 0, ZB], [XR, HC, ZB], [XL, HC, ZB]]); x.clip();
  const ct = P(0, HC, ZB)[1], cg = x.createLinearGradient(0, ct, 0, ct + 140); cg.addColorStop(0, 'rgba(0,0,0,.35)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = cg; x.fillRect(0, ct, W, 140); x.restore();
  // floor
  floorBoards(x, false, 21);
  // the moon: a window off-screen on the right wall throws four hard panes onto the back wall
  const d = [-1, -.5, 1.4], pane = (y0, y1, z0, z1) => [[y0, z0], [y0, z1], [y1, z1], [y1, z0]].map(([y, z]) => { const s = (ZB - z) / d[2]; return [XR + d[0] * s, y + d[1] * s, ZB]; });
  x.save(); path3(x, [[XL, .15, ZB], [XR, .15, ZB], [XR, HC, ZB], [XL, HC, ZB]]); x.clip();
  x.globalCompositeOperation = 'screen';
  for (const [y0, y1] of [[.95, 1.68], [1.73, 2.45]]) for (const [z0, z1] of [[3.6, 4.08], [4.13, 4.6]]) fill3(x, pane(y0, y1, z0, z1), 'rgba(84,100,104,.34)');
  x.restore(); x.globalCompositeOperation = 'source-over';
  // baseboards
  const bb = .15;
  plane(x, [[XL, 0, ZB - .01], [X0 - CAS, 0, ZB - .01], [X0 - CAS, bb, ZB - .01], [XL, bb, ZB - .01]], '#1c1d1a');
  plane(x, [[X1 + CAS, 0, ZB - .01], [XR, 0, ZB - .01], [XR, bb, ZB - .01], [X1 + CAS, bb, ZB - .01]], '#1c1d1a');
  plane(x, [[XL + .01, 0, ZN], [XL + .01, 0, ZB], [XL + .01, bb, ZB], [XL + .01, bb, ZN]], '#161715');
  plane(x, [[XR - .01, 0, ZN], [XR - .01, 0, ZB], [XR - .01, bb, ZB], [XR - .01, bb, ZN]], '#1a1a17');
  plane(x, [[X1 + CAS, bb, ZB - .011], [XR, bb, ZB - .011], [XR, bb + .012, ZB - .011], [X1 + CAS, bb + .012, ZB - .011]], 'rgba(120,112,92,.35)');
  plane(x, [[XL, bb, ZB - .011], [X0 - CAS, bb, ZB - .011], [X0 - CAS, bb + .012, ZB - .011], [XL, bb + .012, ZB - .011]], 'rgba(120,112,92,.3)');
  // doorway: black hole (the corridor is painted in each frame), reveal faces, threshold
  plane(x, [[X0, 0, ZB], [X1, 0, ZB], [X1, DH, ZB], [X0, DH, ZB]], '#050606');
  plane(x, [[X0, 0, ZB], [X0, 0, ZB + T], [X0, DH, ZB + T], [X0, DH, ZB]], '#34312a');
  plane(x, [[X0, DH, ZB], [X1, DH, ZB], [X1, DH, ZB + T], [X0, DH, ZB + T]], '#24221d');
  plane(x, [[X0, 0, ZB], [X1, 0, ZB], [X1, 0, ZB + T], [X0, 0, ZB + T]], '#3a3127');
  // casing (painted trim, a little lighter than the wall), with its soft shadow on the wall
  const zc = ZB - .02;
  x.save(); x.filter = 'blur(6px)';
  fill3(x, [[X0 - CAS - .02, 0, ZB], [X1 + CAS + .03, 0, ZB], [X1 + CAS + .03, DH + CASH + .03, ZB], [X0 - CAS - .02, DH + CASH + .03, ZB]], 'rgba(0,0,0,.35)');
  x.restore();
  const casL = [[X0 - CAS, 0, zc], [X0, 0, zc], [X0, DH, zc], [X0 - CAS, DH, zc]], casR = [[X1, 0, zc], [X1 + CAS, 0, zc], [X1 + CAS, DH, zc], [X1, DH, zc]];
  const casH = [[X0 - CAS - .015, DH, zc], [X1 + CAS + .015, DH, zc], [X1 + CAS + .015, DH + CASH, zc], [X0 - CAS - .015, DH + CASH, zc]];
  for (const q of [casL, casR, casH]) plane(x, q, '#4f4b40');
  // moon on the right casing too (the pane nearest the door just reaches it)
  // trim details: inner bead lighter, outer edge darker, head cap
  plane(x, [[X0 - .016, 0, zc], [X0, 0, zc], [X0, DH, zc], [X0 - .016, DH, zc]], '#5d584b');
  plane(x, [[X1, 0, zc], [X1 + .016, 0, zc], [X1 + .016, DH, zc], [X1, DH, zc]], '#3f3c33');

    ctx.lineWidth = r * 2; ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke(); }
  // knuckle mass
  for (const f of FING) { const c = curlAt(hs, f); if (c <= 0) continue; const q = fingerPts(th, YH, f, c);
    const a = P(...kn), b = P(...q[0]); ctx.lineWidth = .03 * CAM.f / q[0][2] * 2; ctx.beginPath(); ctx.moveTo(a[0], a[1] + (b[1] - a[1]) * .3); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
}
function drawFingers(ctx, th, hs, amb, I) {
  for (const f of FING) {
    const c = curlAt(hs, f); if (c <= 0) continue;
    const q = fingerPts(th, YH, f, c), sp = q.map(p => P(...p));
    // reveal along the path: the finger slides round the edge
    const segs = sp.length - 1, show = c * segs;
    const tap = hs.k > 1.2 ? .006 * Math.max(0, Math.sin((hs.k - 1.2) * 9 + f.d * 7)) : 0;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    let tip = null, dir = null;
    for (let i = 0; i < segs; i++) {
      if (i >= show) break;
      const k = Math.min(1, show - i), a = sp[i], b0 = sp[i + 1], b = [a[0] + (b0[0] - a[0]) * k, a[1] + (b0[1] - a[1]) * k + (i === segs - 1 ? tap * CAM.f / q[i][2] : 0)];
      const r = lerp(.019, .012, i / segs) * CAM.f / q[i][2];
      ctx.strokeStyle = '#0b0c0c'; ctx.lineWidth = r * 2; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      // knuckle bulge at each joint
      if (i > 1 && k === 1) { ctx.beginPath(); ctx.arc(b[0], b[1], r * 1.12, 0, Math.PI * 2); ctx.fillStyle = '#0b0c0c'; ctx.fill(); }
      // underside catches the lit floor
      if (i >= 3) { ctx.strokeStyle = `rgba(120,118,104,${.12 * Math.min(1, I) + .04 * amb})`; ctx.lineWidth = Math.max(1, r * .3);
        ctx.beginPath(); ctx.moveTo(a[0], a[1] + r * .75); ctx.lineTo(b[0], b[1] + r * .75); ctx.stroke(); }
      tip = b; dir = [b0[0] - a[0], b0[1] - a[1]];
    }
    // the nail: long, pointed, hooked toward the wood
    if (tip && c > .8) {
      const nl = (c - .8) / .2, L = Math.hypot(dir[0], dir[1]), ux = dir[0] / L, uy = dir[1] / L, z = q[q.length - 1][2];
      const len = .085 * CAM.f / z * nl * f.len, wd = .012 * CAM.f / z;
      const tx = tip[0] + ux * len + uy * len * .1, ty = tip[1] + uy * len + len * .22;
      ctx.beginPath(); ctx.moveTo(tip[0] - uy * wd, tip[1] + ux * wd);
      ctx.quadraticCurveTo(tip[0] + ux * len * .6 - uy * wd * .6, tip[1] + uy * len * .6 + ux * wd * .6, tx, ty);
      ctx.quadraticCurveTo(tip[0] + ux * len * .5 + uy * wd * .5, tip[1] + uy * len * .5 - ux * wd * .5, tip[0] + uy * wd, tip[1] - ux * wd);
      ctx.closePath(); const nv = .45 + .4 * Math.min(1, I) + .15 * amb;
      ctx.fillStyle = rgb([118 * nv, 110 * nv, 96 * nv]); ctx.fill();
    }
  }
}
Pilot.run({ W, H, dur: DUR,
  fonts: ["600 60px 'Noto Serif KR'", "700 72px 'Noto Serif KR'", "400 28px 'Noto Sans KR'", "500 34px 'Noto Sans KR'", "600 30px 'Noto Sans KR'"],
  init: async () => { base = buildBase(); lit = buildLit(false); litW = buildLit(true); corr = buildCorridor(false); corrW = buildCorridor(true);
    grain = buildGrain(); vign = buildVignette(); bristles = buildBristles(); },
  draw });
