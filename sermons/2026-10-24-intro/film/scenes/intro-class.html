<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>word-log 교실 · 채널 소개</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@500;700;900&display=swap">
</head>
<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script src="art/dance/meta.js"></script><script src="kit-mograph.js"></script>
<script>
/* word-log 교실 — channel intro, 7 scenes in 30 s (storyboard.md). One dancer (keyed video-model frames, art/dance/) stays
   at the centre while the world changes on bar lines: ① a grid of windows, hers gold-framed → ② red stage with orbiting 3D words
   → ③ a blue drafting sheet where she is drawn in line and then coloured (a code filter on the same frames) → ④ yellow + a 3D
   keyboard: her footfalls light keys and pop ㅁ ㅏ ㄹ ㅆ ㅡ ㅁ into 「말씀!」 → ⑤ pink bubbles, '묵상 중…', neon '한 장면' →
   ⑥ black-and-white manga panels (threshold + screentone filter) → ⑦ a kaleidoscope of the scenes + word-log, then the camera
   pulls back into the first window: the last frame is frame 0.
   The style lives in kit-mograph.js (styles/mograph/); this file keeps only this film's worlds, words and timing. */
const S = window.SCRIPT, B = S.beat, MG = Mograph, { clamp, lerp, ss, eo, eio } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const { pulse, popScale, glyph, chunky, sparkBurst, pill, flash, panel } = MG;
MG.tempo(S.BPM);
const INK = MG.INK, SC = MG.sceneTable(S.scenes, S.DUR), scAt = id => SC.find(s => s.id === id);
let D;   // the dancer (sprite actor)

// ① a grid of windows (the reference's terminal grid → open pages)
const WIN = MG.WIN, KFULL = MG.kfull(WIN), GRID = { hero: 'word-log – 말씀' };
function shelfInner(ctx, t, u) {   // her page inside the gold window
  const { y0, h } = MG.heroPage(ctx, WIN);
  const fx = 540, fy = y0 + h - 60, fh = 800;
  D.shadow(ctx, t, fx, fy, fh, 'rgba(110,70,20,.35)');
  const p = D.draw(ctx, t, fx, fy, fh);
  if (!p) return;
  // fingertip sparkles: the hand that is highest
  const hh = D.highHand(t, p); if (hh) { MG.sparkleTrail(ctx, hh.x, hh.y, t);
    const tu = (t - B.tok);
    if (u >= 0 && tu > 0 && tu < 1.5) { const [sx, sy] = popScale(tu); const tx = hh.x + (hh.sx < D.ax ? -70 : 70), ty = hh.y - 60 - 30 * eo(clamp(tu, 0, 1));
      glyph(ctx, chunky('톡', 120, { face: '#fff7d6', face2: '#ffd35a' }), tx, ty, sx, sy, -.12, 1 - ss(1.1, 1.5, tu)); sparkBurst(ctx, tx, ty, tu / .4, 10, 120, 7, ['#fff', '#ffd35a']); }
  }
}
function sceneShelf(ctx, t, u) {
  // push in slowly, then dive into the gold window on the last beat of the scene
  const L = scAt('shelf').end, k = lerp(1, 1.06, eio(ss(0, L - .7, u))) * Math.pow(KFULL / 1.06, eio(ss(L - .75, L, t)));
  ctx.save(); MG.gridView(ctx, k, WIN); MG.windowGrid(ctx, t, u, c => shelfInner(c, t, u), GRID); ctx.restore();
}

// ② red stage, orbiting 3D words
const ORB = ['말씀', '쇼츠', '30초'];
function sceneStage(ctx, t, u) {
  MG.stageBack(ctx, t, u);
  const fx = 540, fy = 1488, fh = 960;
  const orb = MG.orbit(ctx, ORB, u, { scatter: B.hanjang - scAt('stage').at });   // behind her when sin < 0
  orb.back();
  D.shadow(ctx, t, fx, fy, fh, 'rgba(90,0,0,.45)');
  D.draw(ctx, t, fx, fy, fh);
  orb.front();
  const hu = t - B.hanjang; if (hu > 0) { const [sx, sy] = popScale(hu, .55); glyph(ctx, chunky('한 장면!', 190, { face: '#fff36b', face2: '#ffc21a', depth: .12 }), 540, 330, sx, sy, -.05);
    sparkBurst(ctx, 540, 330, hu / .5, 28, 420, 21, ['#fff', '#ffe14d']); }
}

// keyboard (③ wireframe, ④ solid)
const ANCHOR = MG.KB.anchor;
const keyCam = t => { const u = t - scAt('keys').at; return MG.keyCam(13.4 - .7 * eio(ss(0, 5.6, u)), .2 * Math.sin(u * .9)); };
const kScale = cam => MG.KB.figu * cam.ppu;   // her on-screen height on the keyboard
const WORD = MG.jamoLayout('말씀');           // ㅁ ㅏ ㄹ ㅆ ㅡ ㅁ (= S.jamo), parked over 말 · 씀 at y 360
let HITS = [], FLY = [];
function sceneKeys(ctx, t, u) {
  const cam = keyCam(t);
  ctx.drawImage(MG.keyboardBG(), 0, 0);
  MG.drawKeyboard(ctx, cam, MG.keyState(t, HITS, FLY, S.jamo));
  MG.hitSparks(ctx, t, HITS);
  const fh = kScale(cam);
  D.shadow(ctx, t, ANCHOR[0], ANCHOR[1] + 4, fh, 'rgba(0,0,0,.55)', .13);
  D.draw(ctx, t, ANCHOR[0], ANCHOR[1], fh);
  MG.flyingCaps(ctx, t, cam, FLY, S.jamo);
  MG.jamoLayer(ctx, t, HITS, WORD, B.assemble);
}

// ③ drafting sheet
function sceneDraft(ctx, t, u) {
  ctx.drawImage(MG.paperSheet(), 0, 0);
  const cam = keyCam(scAt('keys').at), fh = kScale(cam), p = D.place(ANCHOR[0], ANCHOR[1], fh);
  // construction: compass circle around her, perspective guides, the keyboard in wireframe
  MG.compass(ctx, [540, ANCHOR[1] - fh * .56], fh * .44, u);
  const vp = cam.P(0, 0, 60), gp = []; for (let k = -6; k <= 6; k++) gp.push(cam.P(k * 1.3, 0, -2.9));
  MG.guides(ctx, vp, gp, .55 * ss(.4, 1, u));
  MG.wireKeyboard(ctx, cam, u - .3);
  // dimension line to her height + label
  const top = p.Y(D.ay - D.figH);
  MG.dimension(ctx, 540 + fh * .42, top, ANCHOR[1], '1 장면', ss(1.1, 1.6, u));
  // her: line work wipes in top→bottom, then colour fills bottom→top
  MG.drawIn(ctx, t, D, ANCHOR[0], ANCHOR[1], fh, eio(ss(.15, 1.5, u)), eio(ss(1.9, 2.9, u)));
  // title block: '콘티'
  MG.titleBlock(ctx, ss(.6, 1.0, u), '콘티', 'word-log', 'No. 1', [p.X(D.ax) - 60, p.Y(D.ay - D.figH * .8)]);
}

// ⑤ pink bubbles
function sceneBubble(ctx, t, u) {
  MG.bubbleSky(ctx, u);
  const fx = 540, fy = 1500, fh = 960;
  MG.lightCross(ctx, t, fx, fy);   // a soft cross of light under her feet
  MG.bubblesBack(ctx, u);
  D.draw(ctx, t, fx, fy, fh);
  const wv = 1 - ss(0, .7, u); if (wv > 0) { ctx.save(); ctx.globalAlpha = wv; D.draw(ctx, t, fx, fy, fh, { mode: 'white' }); ctx.restore(); }
  MG.bubblesFront(ctx, u);
  MG.statusPill(ctx, '묵상 중', u);                       // '묵상 중…' capsule
  MG.neonType(ctx, t, u, ['한', ' 장', '면'], B.neon);    // neon '한 장면' typed on the beat (a caret blinks after the last letter)
}

// ⑥ manga panels
function sceneManga(ctx, t, u) {
  MG.mangaPaper(ctx);
  const tA = 0, tB = B.dugeun - scAt('manga').at + MG.BEAT * 2, tC = B.kung - scAt('manga').at;
  panel(ctx, 40, 110, 1000, 980, u - tA, 'l', () => {
    MG.focusLines(ctx, 540, 640, 40, 110, 1000, 980, 31);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(540, 760, 360, 520, 0, 0, TAU); ctx.fill();
    D.draw(ctx, t, 540, 1560, 1180, { mode: 'manga' });
    const du = t - B.dugeun; if (du > 0) { const [sx, sy] = popScale(du, .45);
      glyph(ctx, chunky('두근!', 150, MG.MANGA_WORD), 830, 250, sx, sy, .16); }
  });
  panel(ctx, 40, 1120, 470, 400, u - tB, 'd', () => {   // her shoes, close: the stomp
    const i = D.fidx(t), f = D.feet(i), z = 2.6; const mx = (f[0] + f[2]) / 2, my = Math.max(f[1], f[3]);
    MG.focusLines(ctx, 275, 1360, 40, 1120, 470, 400, 44, .8);
    ctx.save(); ctx.translate(275, 1460); ctx.scale(z, z); ctx.translate(-mx, -my); ctx.drawImage(D.manga(i), 0, 0); ctx.restore();
  });
  panel(ctx, 540, 1120, 500, 400, u - tC + .05, 'r', () => {
    ctx.fillStyle = '#111'; ctx.fillRect(540, 1120, 500, 400);
    MG.inkBurst(ctx, 790, 1320, 170, 9, t - B.kung);
    if (t > B.kung) { const [sx, sy] = popScale(t - B.kung, .4); glyph(ctx, chunky('쿵!', 140, MG.MANGA_WORD_NEG), 790, 1320, sx, sy, -.1); }
  });
}

// ⑦ kaleidoscope + title, then back into the first window
let SNAP = [];
function sceneKaleido(ctx, t, u) {
  MG.kaleido(ctx, SNAP, u);
  MG.bigStar(ctx, u, 540, 1000);   // the big star behind her
  D.shadow(ctx, t, 540, 1500, 960, 'rgba(0,0,0,.4)');
  D.draw(ctx, t, 540, 1500, 960);
  const tu = t - B.title; if (tu > 0) { const [sx, sy] = popScale(tu, .55); glyph(ctx, chunky('word-log', 168, { depth: .08 }), 540, 330, sx, sy, -.03);
    sparkBurst(ctx, 540, 330, tu / .5, 24, 420, 5, ['#fff', '#ffd84a']); }
  const lv = ss(B.title + .45, B.title + .8, t); pill(ctx, '말씀 한 장면', 540, 500, 48, INK, '#fff3c4', lv);
}

// transitions & frame
const SCENES = { shelf: sceneShelf, stage: sceneStage, draft: sceneDraft, keys: sceneKeys, bubble: sceneBubble, manga: sceneManga, kaleido: sceneKaleido };
function sceneAt(ctx, id, t) { const s = scAt(id); SCENES[id](ctx, t, t - s.at); }
function draw(ctx, t) {
  const sc = MG.sceneOf(SC, t), u = t - sc.at;
  if (sc.id === 'kaleido' && t >= B.out)   // pull back: ⑦ shrinks into the gold window of ①, whose own page fades back in → the last frame is frame 0
    MG.pullBack(ctx, t, eio(ss(B.out, S.DUR - .35, t)), o => sceneKaleido(o, t, u), c => shelfInner(c, t, -1), GRID);
  else sceneAt(ctx, sc.id, t);
  // ③ → ④: the wireframe keyboard turns solid while yellow floods up
  if (sc.id === 'draft' && t > sc.end - .3) MG.wipeUp(ctx, ss(sc.end - .3, sc.end, t), c => sceneKeys(c, scAt('keys').at, 0));
  // ④ → ⑤: a bubble grows from her chest and pops into pink
  if (sc.id === 'keys' && t > sc.end - .3) MG.bubblePop(ctx, eo(ss(sc.end - .3, sc.end, t)), o => sceneBubble(o, sc.end, 0));
  // hard cuts on the bar line, with a flash
  flash(ctx, .85 * pulse(t, scAt('stage').at, .18));
  flash(ctx, .9 * pulse(t, scAt('draft').at, .22));
  flash(ctx, .6 * pulse(t, scAt('manga').at, .2));
  flash(ctx, .7 * pulse(t, scAt('kaleido').at, .2));
  if (sc.id === 'manga' && t > sc.end - .3) MG.inkWipe(ctx, eio(ss(sc.end - .3, sc.end, t)));
}

async function init() {
  MG.init({ bpm: S.BPM });
  D = await MG.loadSprite(window.DANCE, 'art/dance', { dur: S.DUR });
  const K = scAt('keys');
  HITS = MG.footHits(D, { t0: K.at + .15, t1: K.end - .1, need: 6, before: B.assemble - .45, camAt: keyCam });
  FLY = MG.flyCaps(HITS, [[1, 2, 1], [4, -2, -1]]);
  // kaleidoscope pieces: a frozen frame of each earlier scene (small)
  for (const [id, dt] of [['shelf', 1.2], ['stage', 2.9], ['draft', 3.2], ['keys', 4.6], ['bubble', 2.4], ['manga', 3.4]])
    SNAP.push(MG.snap(x => sceneAt(x, id, scAt(id).at + dt)));
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: MG.FONTS, init, draw });
</script>
</body>
</html>
