<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* 잘라 낸 건 다리였다 — 08 one-hue print (from the style lab's lab-monoroom), moved OUTDOORS.
   Everything is violet in four values (pale sky, mid, deep, near-black ink) plus the cream of the people; heavy mottled grain
   over all of it; a firm black line that only breathes (a faint boil on twos). Texture does the work colour can't:
   cross-hatching on the dark things, pinstriped trousers, the lab's wet tufty hair. The lab's storm — bent trees, torn
   leaves, slanting rain — is no longer outside a window: it is the world. The procession walks a wet road under it.
   The one colour is yellow (the lab's lamp): here it is MY CROSS, and later the pieces I sawed off, which flicker on like
   that lamp when I look back. The door across the gap is lit by a lighter VALUE of the same violet (no second colour).
   The hit is the storm's own: a lightning flash that bleaches the frame for two frames, a crash zoom and a shake.
   Figures and camera pose on twos, like the lab; rain too. World units ≈ screen px at zoom 1. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const C = { sky: '#b3b7da', wall: '#8b8fc4', mid: '#6b71aa', deep: '#454a86', deep2: '#363a6e', ink: '#15172b', cream: '#f2eee4', cream2: '#e2ddd2',
  yel: '#f1e27c', yelL: '#f8efaa', leaf: '#c7cae8', pale: '#dcdef2' };
const t12 = t => Math.floor(t * 12 + 1e-6) / 12;
const L = 480, PW = 34, CBX = L - 118, CBW = 32, CBH = 98, CBHL = 40;   // cross: post length/width, crossbar (from foot), thickness, half-length upright / lying
const FY = 1300, BY = 1236, RT = 1180;                                  // my lane, the others' lane, the road's far edge
const REST = 26, G = L - 2 * REST;                                      // a whole cross rests 26 on each lip: the gap is G wide
const SME = .9, SPI = .8;
const frac = x => x - Math.floor(x);
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];

// ---------------- hand line (lab: breathes, does not boil hard) ----------------
let K = 0, LWK = 1, AMPK = 1, TS = 1;
function wob(p, amp, k = K) {
  const x = p[0], y = p[1], f = .02;
  return [x + (noise(x * f + k * 7.31, y * f + .37) - .5) * 2 * amp + (noise(x * .06 + 40, y * .06) - .5) * 1.4 * AMPK,
          y + (noise(x * f + 11.3, y * f + k * 5.17) - .5) * 2 * amp + (noise(x * .06, y * .06 + 90) - .5) * 1.4 * AMPK];
}
function chaikin(pts, closed, it = 2) {
  for (let r = 0; r < it; r++) { const o = [], n = pts.length, m = closed ? n : n - 1; if (!closed) o.push(pts[0]);
    for (let i = 0; i < m; i++) { const a = pts[i], b = pts[(i + 1) % n]; o.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); }
    if (!closed) o.push(pts[n - 1]); pts = o; }
  return pts;
}
function resample(pts, closed, step) {
  const o = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) { const a = pts[i], b = pts[(i + 1) % n], d = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.max(1, Math.ceil(d / step));
    for (let j = 0; j < k; j++) o.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]); }
  if (!closed) o.push(pts[n - 1]); return o;
}
function pathOf(pts, closed = true, smooth = true) {
  const p = new Path2D(), n = pts.length;
  if (!smooth || n < 3) { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n; i++) p.lineTo(pts[i][0], pts[i][1]); if (closed) p.closePath(); return p; }
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  if (closed) { const s = mid(pts[n - 1], pts[0]); p.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) { const m = mid(pts[i], pts[(i + 1) % n]); p.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); } p.closePath(); }
  else { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n - 1; i++) { const m = mid(pts[i], pts[i + 1]); p.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); } p.lineTo(pts[n - 1][0], pts[n - 1][1]); }
  return p;
}
// an inked shape: fill printed slightly off-register, optional dot tone, then the boiling black line
const ell = (cx, cy, rx, ry, n = 20, rot = 0) => { const o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry;
  o.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); } return o; };
const rot2 = (p, a) => [p[0] * Math.cos(a) - p[1] * Math.sin(a), p[0] * Math.sin(a) + p[1] * Math.cos(a)];
function tube(line, wd) {
  const Lf = [], R = [];
  for (let i = 0; i < line.length; i++) { const a = line[Math.max(0, i - 1)], b = line[Math.min(line.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    Lf.push([line[i][0] - dy * wd[i], line[i][1] + dx * wd[i]]); R.push([line[i][0] + dy * wd[i], line[i][1] - dx * wd[i]]); }
  return Lf.concat(R.reverse());
}
let MR = 1;
// an inked shape (no misregistration in this style: the line sits on the fill), optional hatch, the breathing black line
function ink(ctx, pts, o = {}) {
  const closed = o.closed !== false, sm = o.smooth !== false && !o.raw && pts.length > 2;
  const step = (o.step || 11) * clamp(LWK, .6, 1.6);
  const base = o.raw ? pts : resample(sm ? chaikin(pts, closed, 2) : pts, closed, step);
  const amp = (o.amp ?? 1.0) * AMPK;
  const P = base.map(p => wob(p, amp)), path = pathOf(P, closed, sm);
  if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(path); }
  if (o.tone) { ctx.fillStyle = o.tone; ctx.fill(path); }
  if (o.lw !== 0) { const lw = (o.lw || 5.5) * LWK; ctx.strokeStyle = o.col || C.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.lineWidth = lw * .88; ctx.stroke(path);
    if ((o.lw || 5.5) > 3.5 && !o.single) { ctx.lineWidth = lw * .7; ctx.stroke(pathOf(base.map(p => wob(p, amp * .9, K + 50.5)), closed, sm)); } }
  return path;
}

// ---------------- prebuilt: textures ----------------
let GRAIN, GLOW, PALE, PAT = {};
function hash2(x, y) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function pnoise(x, y, p) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), m = q => ((q % p) + p) % p;
  const a = hash2(m(xi), m(yi)), b = hash2(m(xi + 1), m(yi)), c = hash2(m(xi), m(yi + 1)), d = hash2(m(xi + 1), m(yi + 1));
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function mkHatch(cell, col, lw, a) { const c = Pilot.canvas(cell, cell), x = c.getContext('2d'); x.strokeStyle = col; x.globalAlpha = a; x.lineWidth = lw;
  x.beginPath(); x.moveTo(0, 0); x.lineTo(cell, cell); x.moveTo(cell, 0); x.lineTo(0, cell); x.moveTo(-cell / 2, cell / 2); x.lineTo(cell / 2, cell * 1.5); x.moveTo(cell / 2, -cell / 2); x.lineTo(cell * 1.5, cell / 2); x.stroke(); return c; }
function mkDiag(cell, col, lw, a) { const c = Pilot.canvas(cell, cell), x = c.getContext('2d'); x.strokeStyle = col; x.globalAlpha = a; x.lineWidth = lw;
  x.beginPath(); x.moveTo(-1, cell + 1); x.lineTo(cell + 1, -1); x.moveTo(-cell / 2, cell / 2); x.lineTo(cell / 2, -cell / 2); x.moveTo(cell / 2, cell * 1.5); x.lineTo(cell * 1.5, cell / 2); x.stroke(); return c; }
function init() {
  const c0 = Pilot.canvas(2, 2).getContext('2d');
  const STRIPE = Pilot.canvas(13, 4); { const x = STRIPE.getContext('2d'); x.fillStyle = C.ink; x.fillRect(5, 0, 3.4, 4); }
  PAT.hatch = c0.createPattern(mkHatch(14, C.ink, 2, .55), 'repeat'); PAT.hatch2 = c0.createPattern(mkHatch(12, C.ink, 1.8, .5), 'repeat');
  PAT.diag = c0.createPattern(mkDiag(12, C.ink, 1.6, .45), 'repeat'); PAT.stripe = c0.createPattern(STRIPE, 'repeat');
  GLOW = Pilot.canvas(256, 256); { const x = GLOW.getContext('2d'), g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, 'rgba(246,236,140,1)'); g.addColorStop(.3, 'rgba(240,226,120,.75)'); g.addColorStop(.62, 'rgba(232,218,120,.2)'); g.addColorStop(1, 'rgba(230,215,120,0)'); x.fillStyle = g; x.fillRect(0, 0, 256, 256); }
  PALE = Pilot.canvas(256, 256); { const x = PALE.getContext('2d'), g = x.createRadialGradient(128, 128, 0, 128, 128, 128);   // a lighter VALUE, same hue
    g.addColorStop(0, 'rgba(226,228,248,.85)'); g.addColorStop(.4, 'rgba(196,200,236,.4)'); g.addColorStop(1, 'rgba(170,176,222,0)'); x.fillStyle = g; x.fillRect(0, 0, 256, 256); }
  // heavy grain (clumpy + fine, violet-tinted), a seamless tile
  const N = 512; GRAIN = Pilot.canvas(N, N); const g = GRAIN.getContext('2d'), gd = g.createImageData(N, N), r = rng(808);
  const hn = N >> 1, hr = new Float32Array(hn * hn); for (let i = 0; i < hr.length; i++) hr[i] = r();
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const i = (y * N + x) * 4, v = .62 * hr[(y >> 1) * hn + (x >> 1)] + .38 * r() - .5;
    if (v > 0) { gd.data[i] = 236; gd.data[i + 1] = 236; gd.data[i + 2] = 255; gd.data[i + 3] = Math.min(255, v * v * 4 * 150); }
    else { gd.data[i] = 12; gd.data[i + 1] = 12; gd.data[i + 2] = 40; gd.data[i + 3] = Math.min(255, v * v * 4 * 170); } }
  g.putImageData(gd, 0, 0); PAT.grain = c0.createPattern(GRAIN, 'repeat');
  const mw = 128, M = Pilot.canvas(mw, mw), mx = M.getContext('2d'), md = mx.createImageData(mw, mw);
  for (let y = 0; y < mw; y++) for (let x = 0; x < mw; x++) { const v = pnoise(x / 16, y / 16, 8) * .55 + pnoise(x / 8 + 3, y / 8, 16) * .3 + pnoise(x / 4, y / 4 + 5, 32) * .15, i = (y * mw + x) * 4, k = (v - .5) * 2.2;
    md.data[i] = md.data[i + 1] = md.data[i + 2] = k > 0 ? 255 : 10; md.data[i + 3] = Math.min(255, Math.abs(k) * 44); }
  mx.putImageData(md, 0, 0); { const big = Pilot.canvas(1024, 1024), bx = big.getContext('2d'); bx.imageSmoothingEnabled = true; for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) bx.drawImage(M, i * 1024, j * 1024, 1024, 1024); PAT.mottle = c0.createPattern(big, 'repeat'); }   // pre-scaled: an unscaled pattern fill is ~3x cheaper
  buildTimeline();
  CACHE = [0, 1].map(() => ({ c: Pilot.canvas(W, H), t: -1 }));
}
const pat = (name, ox, oy) => { const p = PAT[name]; p.setTransform(new DOMMatrix().translate(Math.round(ox), Math.round(oy)).scale(TS)); return p; };
const tone = (dense, ox, oy) => pat(dense ? 'hatch' : 'hatch2', ox, oy);
const glow = (ctx, x, y, r, a, spr = GLOW) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.drawImage(spr, x - r, y - r, r * 2, r * 2); ctx.restore(); };
const line = (ctx, a, b, lw = 4) => ink(ctx, [a, b], { closed: false, lw, single: true });

// ---------------- the kid (the lab's wet-haired kid in a hoodie and pinstriped trousers; facing either way; IK arms/legs) ----------------
const FACE = [[-50, -18], [-54, 20], [-40, 50], [-8, 60], [28, 56], [48, 38], [56, 8], [62, -4], [56, -14], [50, -30], [30, -48], [0, -54], [-32, -46]];
const HAIR = [[-56, 0], [-58, 30], [-44, 58], [-20, 72], [6, 70], [30, 64], [50, 48], [60, 22], [52, 18], [44, 30], [34, 18], [22, 30], [10, 16], [-6, 28], [-14, 12], [-30, 20], [-40, -6]];
function drawHead(ctx, F, HF, s, me) {
  ink(ctx, FACE.map(q => HF(q[0], q[1])), { fill: C.cream });
  ink(ctx, HAIR.map(q => HF(q[0], q[1])), { fill: me ? C.cream : C.cream2 });
  for (const [u0, v0, u1, v1] of [[-30, 52, -24, 34], [-8, 62, -6, 42], [14, 60, 12, 42], [34, 52, 30, 36]]) line(ctx, HF(u0, v0), HF(u1, v1), 3.6);
  ctx.fillStyle = C.ink; for (const [u, v] of [[18, -18], [26, -22], [12, -24]]) { const q = HF(u, v); ctx.beginPath(); ctx.arc(q[0], q[1], 1.9 * s, 0, TAU); ctx.fill(); }
  ink(ctx, [HF(-28, -2), HF(-38, -10), HF(-34, -26), HF(-24, -22)], { closed: false, lw: 4, single: true });
  const e = HF(32, -6), eye = F.eye || 'dot';
  if (eye === 'tired') ink(ctx, [HF(22, -4), HF(32, -10), HF(42, -6)], { closed: false, lw: 4, single: true });
  else if (eye === 'happy') ink(ctx, [HF(22, -10), HF(32, -1), HF(42, -9)], { closed: false, lw: 4, single: true });
  else if (eye === 'down') ink(ctx, [HF(24, -12), HF(32, -14), HF(41, -12)], { closed: false, lw: 4, single: true });
  else { const r = (eye === 'shock' ? 8 : 5.6) * s * 1.18; ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(e[0], e[1], r, r * 1.15, 0, 0, TAU); ctx.fill();
    if (eye === 'glint' || eye === 'shock') { ctx.fillStyle = eye === 'glint' ? C.yel : C.cream; ctx.beginPath(); ctx.arc(e[0] + F.f * r * .3, e[1] - r * .4, r * .34, 0, TAU); ctx.fill(); } }
  if (eye === 'shock' || eye === 'worry') ink(ctx, [HF(20, 10), HF(32, 14), HF(42, 8)], { closed: false, lw: 3.6, single: true });
  const mo = F.mouth || 'flat';
  if (mo === 'smile') ink(ctx, [HF(38, -32), HF(45, -37), HF(51, -30)], { closed: false, lw: 3.6, single: true });
  else if (mo === 'o') ink(ctx, ell(...HF(44, -33), 4.5 * s * 1.18, 5.5 * s * 1.18, 10), { fill: C.ink, lw: 3, single: true });
  else if (mo === 'wavy') ink(ctx, [HF(36, -34), HF(41, -31), HF(46, -35), HF(51, -31)], { closed: false, lw: 3.4, single: true, smooth: false });
  else if (mo === 'sad') ink(ctx, [HF(38, -35), HF(45, -31), HF(51, -35)], { closed: false, lw: 3.6, single: true });
  else ink(ctx, [HF(38, -34), HF(50, -32)], { closed: false, lw: 3.6, single: true });
}
function drawLeg(ctx, F, i, P) {
  const s = F.s, f = F.f, hp = P(i ? 8 : -6, -2), foot = F.feet[i], ank = [foot[0], foot[1] - 14 * s];
  const kneePick = (a, b) => f * a[0] > f * b[0] ? a : b;
  const kn = ik(hp, ank, LEG1 * s, LEG2 * s, kneePick)[0];
  const top = P(i ? 8 : -6, 16), m1 = lerp2(hp, kn, .5), m2 = lerp2(kn, ank, .5);
  ink(ctx, tube([top, m1, kn, m2, ank], [36, 36, 33, 31, 30].map(w => w * s)), { fill: i ? C.cream : C.cream2, tone: pat('stripe', hp[0], 0) });
  const lift = Math.max(0, F.gy - foot[1]), toe = lift > 4 * s ? .25 : 0;
  const sh = [[-24, -12], [8, -14], [30, -8], [40, 2], [30, 8], [-24, 8]].map(p => { const q = rot2(p, -toe); return [foot[0] + f * (q[0] + 6) * s, foot[1] + (q[1] - 6) * s]; });
  ink(ctx, sh, { fill: i ? C.cream : C.cream2, lw: 5 });
  const a = rot2([-18, -2], -toe), b = rot2([40, -2], -toe);
  line(ctx, [foot[0] + f * a[0] * s, foot[1] + a[1] * s], [foot[0] + f * b[0] * s, foot[1] + b[1] * s], 3.2);
}
function drawKid(ctx, F, back, mid) {
  const al = F.alpha ?? 1; if (al <= 0) return;
  ctx.save(); ctx.globalAlpha *= al;
  const s = F.s, f = F.f, me = !!F.me, { P } = frame(F);
  const body = me ? C.cream : C.mid, bodyT = me ? null : tone(false, F.hip[0], F.hip[1]);
  ctx.save(); ctx.globalAlpha *= .45; ink(ctx, ell(F.hip[0], F.gy + 6 * s, 96 * s, 11 * s, 16), { fill: C.ink, lw: 0 }); ctx.restore();
  const AF = armGeo(F, P(SHF[0], SHF[1]), F.hands[0], true), AN = armGeo(F, P(SHN[0], SHN[1]), F.hands[1], false);
  const hand = F.hand || ['grip', 'grip'];
  sleeve(ctx, AF, s, me ? C.cream2 : C.deep, me ? null : bodyT); if (!F.farOver) mitten(ctx, AF, s, hand[0], f);
  if (back) back();
  drawLeg(ctx, F, 0, P); drawLeg(ctx, F, 1, P);
  // hoodie with a ribbed hem and a kangaroo pocket
  ink(ctx, [[-50, -20], [-58, 36], [-56, 92], [-44, 126], [-14, 142], [22, 140], [46, 122], [58, 90], [64, 46], [64, 6], [54, -24], [0, -28]].map(q => P(q[0], q[1])), { fill: body, tone: bodyT });
  line(ctx, P(-40, -12), P(52, -14), 4);
  ink(ctx, [P(-4, 8), P(44, 6), P(50, 40), P(2, 44)], { closed: false, lw: 3.6, single: true });
  const { HF } = headFrame(F);
  ink(ctx, [P(2, 124), P(26, 124), P(28, 150), P(2, 152)], { fill: C.cream, lw: 4.5 });
  // the hood lying flat on the back (round, never pointed)
  ink(ctx, [P(-46, 118), P(-58, 150), P(-30, 162), P(-4, 150), P(-8, 128)], { fill: body, tone: bodyT, lw: 4.5 });
  drawHead(ctx, F, HF, s, me);
  if (mid) mid();
  if (F.farOver) mitten(ctx, AF, s, hand[0], f);
  if (F.saw) drawSaw(ctx, F.saw.grip, F.saw.ang);
  sleeve(ctx, AN, s, me ? C.cream : C.mid, me ? null : bodyT); mitten(ctx, AN, s, hand[1], f);
  ctx.restore();
}

// ---------------- crosses ----------------
function drawCross(ctx, X, u0, u1, mine, alpha = 1) {
  if (!X || u1 - u0 < .5 || alpha <= 0) return;
  const hb = X.lie ? CBHL : CBH, pts = crossPoly(u0, u1, hb).map(([u, v]) => cpt(X, u, v));
  ctx.save(); ctx.globalAlpha *= alpha;
  ink(ctx, pts, { fill: mine ? C.yel : C.cream2, tone: mine ? null : pat('diag', X.x, X.y), smooth: false, lw: 5.2, step: 12 });
  const g0 = Math.max(u0 + 18, 30), g1 = Math.min(u1 - 18, CBX - 30);
  if (g1 - g0 > 30) ink(ctx, [cpt(X, g0, -4), cpt(X, lerp(g0, g1, .55), -2)], { closed: false, lw: 3.2, single: true });
  if (u1 > CBX + 40 && u0 < CBX + 30) ink(ctx, [cpt(X, CBX + 34, 5), cpt(X, Math.min(u1 - 14, CBX + 92), 6)], { closed: false, lw: 3.2, single: true });
  if (mine) { ctx.save(); ctx.globalAlpha *= .85; ctx.strokeStyle = C.yelL; ctx.lineWidth = 4 * LWK; ctx.lineCap = 'round'; const a = cpt(X, u0 + 10, -PW / 2 + 7), b = cpt(X, u1 - 10, -PW / 2 + 7);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.restore(); }
  ctx.restore();
}
function drawSaw(ctx, grip, ang) {
  const { d, up, heel } = sawGeo(grip, ang), P = (u, v) => [heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v];
  ink(ctx, [P(0, 28), P(140, 16), P(146, 9), P(142, 0), P(0, 0)], { fill: C.pale, smooth: false, lw: 4.8, step: 10 });
  const tz = []; for (let u = 4; u <= 138; u += 8) tz.push(P(u, (u / 8 | 0) % 2 ? 3.5 : -3.5));
  ink(ctx, tz, { closed: false, lw: 3, smooth: false, single: true, step: 6 });
  ink(ctx, ell(...P(124, 13), 4.5, 4.5, 8), { fill: C.wall, lw: 3, single: true });
  ink(ctx, [P(2, 34), P(-34, 48), P(-52, 22), P(-40, -6), P(2, -2)], { fill: C.deep2, tone: pat('hatch', heel[0], heel[1]), lw: 5, step: 8 });
  ink(ctx, [P(-12, 29), P(-32, 36), P(-41, 21), P(-32, 8), P(-12, 11)], { fill: C.wall, lw: 3, single: true });

    const k = frac(t * 1.4 + px * .013); ctx.save(); ctx.globalAlpha *= 1 - k; ink(ctx, ell(px + (px % 37) - 18, py, 8 + k * 30, (8 + k * 30) * .22, 14), { closed: true, lw: 2.6, single: true, col: C.pale }); ctx.restore(); }
}
function door(ctx, t) {   // the far side: a plain arched door, open, lit by a lighter value of the same violet
  const gy = BY + 4, x = GX, R = 104, ay = gy - 300, r0 = 74, ay0 = gy - 270;
  glow(ctx, x, gy - 170, 420, .9, PALE); glow(ctx, x, gy - 150, 220, 1, PALE);
  ctx.save(); ctx.globalAlpha *= .45; ink(ctx, [[x - r0, gy], [x + r0, gy], [x + 200, gy + 80], [x - 220, gy + 80]], { fill: C.pale, lw: 0, smooth: false }); ctx.restore();
  const op = [[x - r0, gy]]; for (let i = 0; i <= 16; i++) { const a = Math.PI + Math.PI * i / 16; op.push([x + Math.cos(a) * r0, ay0 + Math.sin(a) * r0]); } op.push([x + r0, gy]);
  ink(ctx, op, { fill: C.cream, lw: 0, smooth: false });
  return { op, draw: () => {
    const fr = [[x - R, gy]]; for (let i = 0; i <= 18; i++) { const a = Math.PI + Math.PI * i / 18; fr.push([x + Math.cos(a) * R, ay + Math.sin(a) * R + 30]); } fr.push([x + R, gy]);
    ink(ctx, fr.concat(op.slice().reverse()), { fill: C.deep2, tone: pat('hatch', x, gy), smooth: false, lw: 5.5 });
    ink(ctx, [[x - R, gy], [x - R - 46, gy + 22], [x - R - 46, ay0 - 30], [x - R, ay0 - 10]], { fill: C.deep, tone: pat('hatch2', x, gy), lw: 5, smooth: false });
    ink(ctx, [[x + R, gy], [x + R + 46, gy + 22], [x + R + 46, ay0 - 30], [x + R, ay0 - 10]], { fill: C.deep, tone: pat('hatch2', x, gy), lw: 5, smooth: false });
  } };
}
function lampLevel(k) { if (k < 0) return 0; if (k < .09) return .8; if (k < .17) return .1; if (k < .25) return 1; if (k < .3) return .35; return .94 + .06 * Math.sin(k * 3.1); }   // the lab lamp's flicker
function world(ctx, t, x0, x1) {
  ground(ctx, x0, x1, t);
  const D = x1 > E - 200 ? door(ctx, t) : null;
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  if (D) { ctx.save(); ctx.clip(pathOf(D.op, true, false));
    for (const P of pils) if (P.F && P.F.inGate) drawKid(ctx, P.F, P.X ? () => drawCross(ctx, P.X, P.X.u0, L, false) : null, null);
    ctx.restore(); D.draw(); }
  for (const P of pils) if (P.B) drawCross(ctx, P.B, 0, L, false);
  for (const P of pils) if (!P.F.inGate && P.X && !P.X.lie) drawCross(ctx, P.X, P.X.u0, L, false);
  pils.slice().sort((a, b) => a.F.hip[0] - b.F.hip[0]).forEach(P => {
    if (P.F.inGate) return; const X = P.X;
    drawKid(ctx, P.F, null, X && X.lie ? () => drawCross(ctx, X, X.u0, L, false) : null);
  });
  if (t >= 18.75 && t < 19.75) guide(ctx, t, eio((t - 18.75) / .35), 1 - ss(19.4, 19.75, t));
  endGuide(ctx, t);
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip; drawSaw(ctx, lerp2(g0, SAWLIE.grip, k), lerp(CUT_ANG, SAWLIE.ang, k)); }
  // the pieces I cut: lying where they fell; when I look back they flicker on like the lab's lamp, then fly into the gap
  for (const c of CUTS) if (t >= c.drop) {   // the pieces I cut: lying where they fell; as the camera reaches each one it flickers on like the lab's lamp
    const p = pieceAt(c, t), on = lampLevel(t - GLOWAT[c.k]);
    const far = c.k ? 1 : 1.5; if (on > 0) { glow(ctx, p.cx, p.cy + 10, 230 * far, on * .8, PALE); glow(ctx, p.cx, p.cy, 170 * far, on * .9); glow(ctx, p.cx, p.cy, 80 * far, on * .85); }
    drawCross(ctx, p, c.u0, c.u1, true);
  }
  const M = poseMe(t), F = M.F; F.me = true;
  if (M.saw) F.saw = M.saw;
  drawKid(ctx, F, M.X && !M.X.lie ? () => drawCross(ctx, M.X, M.X.u0, L, true) : null, () => {
    if (M.X && M.X.lie) drawCross(ctx, M.X, M.X.u0, L, true);
    if (M.kerf) { ctx.fillStyle = C.ink; ctx.fillRect(M.c.cutX - 2 * LWK, M.c.y - PW / 2, 4 * LWK, M.kerf.kp * PW * .92 + .5); }
  });
  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { ctx.save(); if (FX.clip) { ctx.beginPath(); ctx.rect(E + 2, -4000, G - 4, 9000); ctx.clip(); } drawCross(ctx, FX, FX.u0, L, true, FX.alpha ?? 1); ctx.restore(); }
  drawFlecks(ctx, t);
  return M;
}
// ---------------- small marks in the lab's manner: water, not comic symbols ----------------
function marks(ctx, t, M) {
  const F = M.F, { hc } = headFrame(F), s = F.s;
  if (t < 3.2) for (let j = 0; j < 4; j++) { const t0 = Math.floor(t / .7) * .7 + j * .175, k = t - t0; if (k < 0 || k > .45) continue;   // drips off my wet hair
    const bx = hc[0] + (-50 + j * 22) * s, by = hc[1] + 30 * s + 1800 * k * k; ink(ctx, [[bx, by - 11], [bx + 5, by], [bx, by + 5], [bx - 5, by]], { fill: C.cream2, lw: 3, single: true }); }
  const run = Pilot.win(t, 4.7, 8.7, .25, .3);
  if (run > 0) { ctx.save(); ctx.globalAlpha *= run;   // splashes kicked up behind my feet
    for (const i of [0, 1]) { const ph = frac((F.ph ?? 0) + i * .5); if (ph < .25) { const k = ph / .25, fx = F.feet[i][0];
      for (let d = 0; d < 4; d++) { const a = -2.2 - d * .28, r = 30 + k * (50 + d * 12); ink(ctx, ell(fx - 20 + Math.cos(a) * r, FY - 6 + Math.sin(a) * r * .8 + k * k * 30, 5 - d * .6, 6 - d * .6, 8), { fill: C.pale, lw: 2.6, single: true }); } } }
    ctx.restore(); }
  const land = B.fall, im = t >= land ? 1 - ss(land + .4, land + .8, t) : 0;   // grit off the lip as it goes over
  if (im > 0) for (let i = 0; i < 6; i++) { const k = t - land, x = E + 8 + i * 9, y = FY + 40 + 900 * k * k + i * 6; ink(ctx, ell(x + i * k * 30, y, 4, 3.4, 7), { fill: C.cream2, lw: 2.4, single: true }); }
}
function rain(ctx, t) {   // slanting rain over everything, on twos
  ctx.save(); ctx.strokeStyle = 'rgba(232,232,250,.5)'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.beginPath();
  const r = rng(4);
  for (let i = 0; i < 150; i++) { const sx = r() * (W + 500) - 300, sp = 1700 + r() * 600, ph = r(), k = frac(t * sp / (H + 300) + ph), px = sx + k * 330, py = -150 + k * (H + 300);
    ctx.moveTo(px, py); ctx.lineTo(px + 13, py + 42); }
  ctx.stroke(); ctx.restore();
}
function flashAt(t) { const k = t - B.fall; if (k < 0) return 0; if (k < .085) return 1; if (k < .17) return .25; if (k < .25) return .75; if (k < .5) return .15 * (1 - (k - .25) / .25); return 0; }
function lightning(ctx, t, sx) {   // the hit: a bolt over the gap and the frame bleached to the palest value
  const f = flashAt(t); if (f <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .62 * f; ctx.fillStyle = C.pale; ctx.fillRect(0, 0, W, H); ctx.restore();
  if (t - B.fall < .3) { const r = rng(9), pts = [[sx + 160, -20]]; let x = sx + 160, y = -20; while (y < 760) { y += 60 + r() * 50; x += (r() - .55) * 90; pts.push([x, y]); }
    ctx.save(); ctx.globalAlpha = Math.min(1, f * 1.4); ctx.lineJoin = 'miter';
    ctx.strokeStyle = C.ink; ctx.lineWidth = 30; ctx.stroke(pathOf(pts, false, false)); const br = pts.slice(3, 6).map((p, i) => [p[0] + i * 70 + 10, p[1] + i * 60]); ctx.lineWidth = 18; ctx.stroke(pathOf([pts[3], ...br], false, false)); ctx.strokeStyle = C.cream; ctx.lineWidth = 8; ctx.stroke(pathOf([pts[3], ...br], false, false)); ctx.lineWidth = 15; ctx.stroke(pathOf(pts, false, false)); ctx.restore(); }
}
// ---------------- the end card: a deep violet plate ----------------
function endPlate(ctx, t) {
  const k = ss(B.end - .2, B.end + .15, t); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = .5 * k; ctx.fillStyle = C.deep2; ctx.fillRect(0, 0, W, H); ctx.restore();
  const dy = (1 - k) * 40, x0 = 96, x1 = 984, y0 = 618 + dy, y1 = 1262 + dy;
  ctx.save(); ctx.globalAlpha = k;
  ink(ctx, resample([[x0, y0], [x1, y0], [x1, y1], [x0, y1]], true, 18), { fill: C.deep2, tone: pat('diag', 0, 0), raw: true, lw: 6.5 });
  ink(ctx, resample([[x0 + 22, y0 + 22], [x1 - 22, y0 + 22], [x1 - 22, y1 - 22], [x0 + 22, y1 - 22]], true, 18), { fill: C.deep2, raw: true, lw: 3, col: C.mid });
  ctx.save(); ctx.translate(540, y0 + 72); ctx.rotate(-Math.PI / 2); ctx.scale(.3, .3); ctx.translate(-L * .5, 0); glow(ctx, L * .62, 0, 260, .6);
  const lw0 = LWK; LWK = 1 / .3 * .75; ink(ctx, crossPoly(0, L, CBH), { fill: C.yel, smooth: false, lw: 5.5 }); LWK = lw0; ctx.restore();
  ctx.restore();
}

// ---------------- frame ----------------
function scene(ctx, t) {
  K = Math.round(t * 12);
  const cm = camAt(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sk = ctx.createLinearGradient(0, 0, 0, H); sk.addColorStop(0, C.mid); sk.addColorStop(.55, C.wall); sk.addColorStop(1, C.sky);
  ctx.fillStyle = sk; ctx.fillRect(0, 0, W, H);
  ctx.save(); PAT.mottle.setTransform(new DOMMatrix().translate(Math.round(-cm.x * .12), Math.round(-cm.y * .12))); ctx.fillStyle = PAT.mottle; ctx.fillRect(0, 0, W, H); ctx.restore();
  const vis = (p, z) => { const cx = cm.x * p; return [cx - 540 / z - 80, cx + 540 / z + 80]; };
  let z = setCam(ctx, cm, .2); camScale(z); stormBand(ctx, ...vis(.2, z), t);
  z = setCam(ctx, cm, .45); camScale(z); ridge(ctx, ...vis(.45, z).map(v => v / 1));
  z = setCam(ctx, cm, .8); camScale(z); { const [a, b] = vis(.8, z); for (const [x, sc, ph] of TREES) if (x > a - 500 && x < b + 100) tree(ctx, x, RT + 40, sc, ph, t); }
  z = setCam(ctx, cm, 1); camScale(z);
  const x0 = cm.x - 540 / z - 60, x1 = cm.x + 540 / z + 60;
  const M = world(ctx, t, x0, x1);
  marks(ctx, t, M);
  ctx.setTransform(1, 0, 0, 1, 0, 0); camScale(1);
  rain(ctx, t);
  lightning(ctx, t, 540 + (E + G / 2 - cm.x) * cm.z);
  endPlate(ctx, t);
  ctx.save(); PAT.grain.setTransform(new DOMMatrix().translate(-(cm.x * cm.z) % 512, -(cm.y * cm.z) % 512)); ctx.fillStyle = PAT.grain; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function draw(ctx, t) {
  const tp = t12(t);
  let slot = CACHE.find(c => c.t === tp);   // the picture changes 12×/s: draw it once per pose, reuse it for the frames in between
  if (!slot) { slot = CACHE[CACHE.next = 1 - (CACHE.next || 0)]; const c = slot.c.getContext('2d'); c.save(); scene(c, tp); c.restore(); slot.t = tp; }
  ctx.drawImage(slot.c, 0, 0);
  if (t < B.end) Story.captions(ctx, t, S.lines, { font: "'Gamja Flower',cursive", weight: 400, size: 76, y: 400, color: C.cream, shadow: 'rgba(21,23,43,.6)', shadowBlur: 10, srcColor: C.pale });
  Story.endCard(ctx, t, S.endCard, B.end, { font: "'Gamja Flower',cursive", srcFont: "'Gamja Flower',cursive", color: C.cream, srcColor: C.sky, y: 870, titleShadow: '' });
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 76px 'Gamja Flower'"], init, draw });
