/* 잘라 낸 건 다리였다 — 13 graphite & charcoal picture book at night (from lab-graphite, ref 13).
   The lab's night street becomes a road at the edge of a little town: houses with scalloped shingles and clapboard
   behind a picket fence, a moon in white pencil, a black garden bed with white-headed flowers, a big charcoal trunk and
   black bushes sweeping past in the foreground. Everyone is a little sheet-ghost (the lab's: dark oval eyes with a glint,
   pink cheeks, small shoes peeping under the hem — gentle, a child in a sheet, never spooky). I am the brightest white
   sheet in front; the others are greyer sheets with charcoal crosses. My cross is the one warm thing on the page, the
   colour of the lab's flashlight. Across the gap, by a plain arched door with warm light, a small friend-ghost clicks on
   a flashlight: the beam (a clean cone — apex at the lens, edges tangent to its pool, the torch on its axis) lights the
   lip where the others lay their crosses, lights my short one, and after the fall sweeps back down the road to FIND the
   pieces I cut ("이것을 잃어버렸다고요?") — they glow in its pool and fly into the white-pencil outline of my whole cross.
   Choreography after cross-papercut (1cor4) with the v2 viewer fixes; figure code shares cs-inkwash's rig. */
const TAU = Math.PI * 2;

// ---------------- hand-drawn toolkit (from lab-inkwash) ----------------
const HD = {};

// ---------------- the world's numbers (the choreography of cross-papercut) ----------------
const L = 520, PW = 34, CBX = L - 130, CBW = 32, CBH = 118, CBHL = 50;
const FY = 1300, BY = 1252, RT = 1212, RN = 1440;              // my lane, the others' lane, road far edge, road near edge
const REST = 26, G = L - 2 * REST;
const t12 = HD.t12, frac = x => x - Math.floor(x);
const ROWY = [RT, 1236, 1264, 1298, 1340, 1388, RN], SW = 104, OB = .5;   // road slabs: rows (foreshortened), slab width, oblique joints

const RA = 98, RO = 134;
const CYB = 1080, CYE = 1080;   // v2 camera heights for the look back and the last hold

// ---------------- timeline: my path (integrated once), the cuts ----------------
const SME = 1.04, SPI = .95;
const DT = 1 / 240, NTL = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NTL), MEP = new Float32Array(NTL);
function vMe(t) {

  if (t < 5.0) return 370 * eio((t - 4.6) / .4);
  if (t < 8.3) return 370;
  if (t < 8.6) return lerp(370, 150, (t - 8.3) / .3);

}
const strideMe = t => t < 4.6 ? 116 : t < 8.8 ? 270 : 170;
const tab = (T, t) => { const i = clamp(t / DT, 0, NTL - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };
const meX = t => tab(MEX, t), meP = t => tab(MEP, t);
const CUTS = [{ s: 3.2, d: .3, saw0: 3.5, drop: 4.0, up1: 4.4 }, { s: 9.0, d: .2, saw0: 9.2, drop: 9.8, up1: 10.0 }, { s: 10.4, d: .15, saw0: 10.55, drop: 11.2, up1: 11.35 }];
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const FILL = [[99, 100], [99, 100], [99, 100]];   // v2: the pieces never move (they stay where they fell)
const SLOTS = [22.9, 23.6, 24.3];                  // v2: the outline's missing span lights slot by slot (one piece's length each)
const pieceX = c => c.baseX + (c.u0 + c.u1) / 2 - 18;
const FLECKS = [], SPAT = [];
let E = 1600, GX = 0, GAY = 0, SAWLIE = null;
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NTL; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }

    const r = rng(100 + k);   // sawdust: amber crumbs off the kerf

      vx: (r() - .5) * (n < 12 ? 180 : 320), vy: -(80 + r() * (n < 12 ? 160 : 260)), land: FY + 18 + r() * 44, sz: 2.2 + r() * 3, col: r() > .4 ? 'rgba(214,132,56,.85)' : 'rgba(60,50,44,.8)', stay: 1 });
  });

  const r = rng(200);   // when my cross goes over: amber and ink drops flung off the lip (they stay — it is paint)
  for (let n = 0; n < 46; n++) { const a = -Math.PI * (.08 + .84 * r()), v = 120 + Math.pow(r(), .7) * 520;
    SPAT.push({ x: E + 4 + r() * 26, y: FY + 30, vx: Math.cos(a) * v, vy: Math.sin(a) * v * .8, sz: 1.6 + Math.pow(r(), 2) * 7, col: n % 3 ? INK : 'rgba(214,128,50,.9)', land: FY + 10 + r() * 90 }); }
}
function pieceAt(c, t) {

  let cx = c.baseX + cu - sh, cy = y0, a = -.05 * eo((t - c.drop) / .25);

    cx = lerp(cx, tx, e); cy = lerp(cy, ty, e) - (c.k ? 190 : 280) * Math.sin(Math.PI * u); a = lerp(a, 0, e) + Math.sin(u * Math.PI * 3) * .55 * (1 - u); }

// ---------------- poses (cross-papercut) ----------------
function walkSpec(x, gy, s, f, ph, stride, lean, lift = 22) {
  const feet = [0, 1].map(i => { const p = frac(ph + i * .5); let off, up = 0;
    if (p < .58) off = stride * (.29 - p); else { const u = (p - .58) / .42; off = -.29 * stride + .58 * stride * eio(u); up = lift * Math.sin(Math.PI * u); }
    return [x + f * off * s, gy - up * s]; });
  const hipH = (176 - 5 * Math.abs(Math.sin(TAU * ph))) * s;

}
function standSpec(x, gy, s, f, lean = .05) { return { s, f, gy, hip: [x, gy - 178 * s], ang: f * lean, feet: [[x - f * 18 * s, gy], [x + f * 22 * s, gy]], hands: [null, null], hand: ['fist', 'fist'], tilt: 0, eye: 'calm', sway: 0 }; }

    hands: [0, 1].map(i => l2(A.hands[i] || hA[i], Bs.hands[i] || hB[i])), hand: pick.hand.slice(), tilt: lerp(A.tilt || 0, Bs.tilt || 0, k), sway: lerp(A.sway || 0, Bs.sway || 0, k) };

const cpt = (X, u, v = 0) => [X.x + Math.cos(X.a) * u - Math.sin(X.a) * v, X.y + Math.sin(X.a) * u + Math.cos(X.a) * v];

// ---------------- the saw ----------------
const CUT_ANG = Math.PI - .72, hangAng = f => Math.atan2(.95, .3 * f);

function poseMe(t) {
