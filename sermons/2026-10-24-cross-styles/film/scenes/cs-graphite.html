/* 잘라 낸 건 다리였다 — 13 graphite & charcoal picture book at night (from lab-graphite, ref 13).

   only the story.
   The lab's night street becomes a road at the edge of a little town: houses with scalloped shingles and clapboard
   behind a picket fence, a moon in white pencil, a black garden bed with white-headed flowers, a big charcoal trunk and
   black bushes sweeping past in the foreground. Everyone is a little sheet-ghost (the lab's: dark oval eyes with a glint,
   pink cheeks, small shoes peeping under the hem — gentle, a child in a sheet, never spooky). I am the brightest white
   sheet in front; the others are greyer sheets with charcoal crosses. My cross is the one warm thing on the page, the
   colour of the lab's flashlight. Across the gap, by a plain arched door with warm light, a small friend-ghost clicks on
   a flashlight: the beam (a clean cone — apex at the lens, edges tangent to its pool, the torch on its axis) lights the
   lip where the others lay their crosses, lights my short one, and after the fall sweeps back down the road to FIND the
   pieces I cut ("이것을 잃어버렸다고요?").
   Choreography after cross-papercut (1cor4) with the v2 viewer fixes. */
const TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
// the kit, and the kit names this story uses

const TX = {};   // this story's built layers and sprites

// ---------------- the world's numbers (the choreography of cross-papercut) ----------------
const L = 520, PW = 34, CBX = L - 130, CBW = 32, CBH = 118, CBHL = 50;
const FY = 1300, BY = 1252, RT = 1212, RN = 1440;              // my lane, the others' lane, road far edge, road near edge
const REST = 26, G = L - 2 * REST;
const t12 = HD.t12, frac = x => x - Math.floor(x);
const ROWY = [RT, 1236, 1264, 1298, 1340, 1388, RN], SW = 104, OB = .5;   // road slabs: rows (foreshortened), slab width, oblique joints

const RA = 98, RO = 134;
const CYB = 1080, CYE = 1080;   // v2 camera heights for the look back and the last hold
// ---------------- timeline: my path (integrated once), the cuts ----------------
const SME = 1.04, SPI = .95;
const DT = 1 / 240, NTL = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NTL), MEP = new Float32Array(NTL);
function vMe(t) {

  if (t < 5.0) return 370 * eio((t - 4.6) / .4);
  if (t < 8.3) return 370;
  if (t < 8.6) return lerp(370, 150, (t - 8.3) / .3);
  if (t < 9.0) return 150 * (1 - ss(8.6, 9.0, t));

  if (t < 10.4) return 450 * Math.sin(Math.PI * (t - 10) / .4);

const strideMe = t => t < 4.6 ? 116 : t < 8.8 ? 270 : 170;

const FILL = [[99, 100], [99, 100], [99, 100]];   // v2: the pieces never move (they stay where they fell)
const SLOTS = [22.9, 23.6, 24.3];                  // v2: the outline's missing span lights slot by slot (one piece's length each)
const pieceX = c => c.baseX + (c.u0 + c.u1) / 2 - 18;
const FLECKS = [], SPAT = [];
let E = 1600, GX = 0, GAY = 0, SAWLIE = null;
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NTL; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }

  CUTS.forEach((c, k) => {

      vx: (r() - .5) * (n < 12 ? 180 : 320), vy: -(80 + r() * (n < 12 ? 160 : 260)), land: FY + 18 + r() * 44, sz: 2.2 + r() * 3, col: r() > .4 ? 'rgba(214,132,56,.85)' : 'rgba(60,50,44,.8)', stay: 1 });
  });
  const c3 = CUTS[2]; SAWLIE = { grip: [c3.cutX + 150, FY + 52], ang: Math.PI + .05 };
  const r = rng(200);   // when my cross goes over: amber and ink drops flung off the lip (they stay — it is paint)
  for (let n = 0; n < 46; n++) { const a = -Math.PI * (.08 + .84 * r()), v = 120 + Math.pow(r(), .7) * 520;
    SPAT.push({ x: E + 4 + r() * 26, y: FY + 30, vx: Math.cos(a) * v, vy: Math.sin(a) * v * .8, sz: 1.6 + Math.pow(r(), 2) * 7, col: n % 3 ? INK : 'rgba(214,128,50,.9)', land: FY + 10 + r() * 90 }); }
}
function pieceAt(c, t) {

  let cx = c.baseX + cu - sh, cy = y0, a = -.05 * eo((t - c.drop) / .25);
  const [f0, f1] = FILL[c.k];

    cx = lerp(cx, tx, e); cy = lerp(cy, ty, e) - (c.k ? 190 : 280) * Math.sin(Math.PI * u); a = lerp(a, 0, e) + Math.sin(u * Math.PI * 3) * .55 * (1 - u); }

}

// ---------------- poses (cross-papercut; the rig is the kit's) ----------------
function carryCross(F, left, a0) {   // the cross on the near shoulder (K.onShoulder), touching it `contact` px from its foot
  const contact = L - Math.min(282, left * L - 36);
  return { ...K.onShoulder(F, PW, a0, contact), u0: L * (1 - left), lie: false };
}
const CA = -1.0, GHI = 140, GLO = 150;   // rig: crosses ride steeper; one fist holds the beam above the head (arm behind the head), the other low behind the back
const gHi = X => Math.min(L - 16, X.contact + GHI), gLo = X => X.contact - GLO >= (X.u0 || 0) + 12 ? X.contact - GLO : null;

const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const mixX = (A, Bx, k) => k <= 0 ? A : k >= 1 ? Bx : { ...Bx, x: lerp(A.x, Bx.x, k), y: lerp(A.y, Bx.y, k), a: lerp(A.a, Bx.a, k), u0: Bx.u0, lie: k > .62 ? Bx.lie : A.lie };

// ---------------- the saw ----------------
const CUT_ANG = Math.PI - .72, hangAng = f => Math.atan2(.95, .3 * f);
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];

  const osc = saw ? 24 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, g0 = sawGeo([0, 0], CUT_ANG), d = g0.d, up = g0.up;
  const K = [c.cutX, c.y - PW / 2 + kp * PW * .92], heel = [K[0] - d[0] * (96 - osc), K[1] - d[1] * (96 - osc)];

}
function sawSpec(c, t) {

    hand: ['fist', 'flat'], tilt: .32, eye: 'calm', sway: 0, farFront: true };
}
const hangGrip = (F, sw = 0) => { const sh = shoulderOf(F); return [sh[0] + F.f * (64 + sw) * F.s, sh[1] + 118 * F.s]; };   // v2: the hanging hand sits at the sheet's front edge, not mid-body
const rIdx = F => F.f > 0 ? 1 : 0, lIdx = F => F.f > 0 ? 0 : 1;

function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), left = leftAt(t);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const F = walkSpec(x, FY, SME, 1, ph, 116, .3 + .1 * Math.sin(tt * TAU / 1.15), 16); F.eye = 'strain'; F.tilt = .12; F.hip[1] += 6 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, CA + .07 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt); const F = walkSpec(x, FY, SME, 1, ph, lerp(116, 270, k), lerp(.16, .3, k), lerp(20, 62, k)); return [F, CA - .04]; }
    const F = walkSpec(x, FY, SME, 1, ph, 170, .16, 34); return [F, CA];
  };
  const sawHeld = t < CUTS[2].drop;
  const carried = (F, a0, lf, held) => { const X = carryCross(F, lf, a0); gripCarry(F, X);
    if (held) { F.hands[0] = cpt(X, gHi(X)); F.hands[1] = hangGrip(F, F.ph != null ? 18 * Math.sin(TAU * F.ph) : 0); }
    return [F, X]; };
  for (const c of CUTS) {
    if (t >= c.s && t < c.up1) {
      const lf0 = S.left[c.k], lf1 = S.left[c.k + 1], [W0, a0] = walk(c.s, c.mx), [W1, a1] = walk(c.up1, c.mx), last = c.k === 2;
      const [WA, XA] = carried(W0, a0, lf0, true), [WB, XB] = carried(W1, a1, lf1, !last);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      const uPin = c.cutX + 112 * SME - c.baseX;   // rig: the pinning hand well clear of the saw handle
      if (t < c.s + c.d) { const k = eio((tp - c.s) / c.d), F = mixSpec(WA, SP, k), Xm = mixX(XA, XL, k);
        F.hands[rIdx(F)] = lerp2(WA.hands[1], cg, k);
        F.hands[lIdx(F)] = cpt(Xm, lerp(gHi(XA), uPin, k), lerp(0, -PW / 2 - 4, k));   // rig: pinned to the beam while it comes down
        F.hand = F.f > 0 ? ['fist', 'fist'] : ['fist', k > .7 ? 'flat' : 'fist']; F.farFront = k > .3;   // rig: the beam comes down in front (layers switch once it is below the chin)
        return { F, X: k > .3 ? { ...Xm, front: true } : Xm, c, saw: { grip: F.hands[rIdx(F)], ang: lerp(hangAng(1), CUT_ANG, k) } }; }
      if (t < c.drop) { const st = sawState(c, t); return { F: sawSpec(c, t), X: XL, c, kerf: st, saw: { grip: st.grip, ang: CUT_ANG } }; }
      const k = eio((tp - c.drop) / (c.up1 - c.drop)), F = mixSpec(SP, WB, k), Xm = mixX(XL, XB, k);
      F.hands[rIdx(F)] = lerp2(cg, WB.hands[1] || hangHands(WB)[1], k);   // the saw hand (it lets the saw go after the last cut)
      F.hands[lIdx(F)] = cpt(Xm, lerp(uPin, gHi(XB), k), lerp(-PW / 2 - 4, 0, k));   // rig: the other hand stays on the beam and lifts it
      F.hand = F.f > 0 ? ['fist', 'fist'] : ['fist', k < .3 ? 'flat' : 'fist']; F.farFront = k < .7;
      const saw = last ? null : { grip: F.hands[rIdx(F)], ang: lerp(CUT_ANG, hangAng(1), k) };
      return { F, X: k < .7 ? { ...Xm, front: true } : Xm, c, saw };
    }
  }

  if (t < 18.4) { const [F0] = walk(12, E - 52), k = eio((tp - 12) / .3);
    const bx = -150 * eio((tp - 12.9) / .7) + 150 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.85, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.65, 17.55, .12, .12));
    const STx = mv > 0 ? mixSpec(standSpec(E - 52 + bx, FY, SME, 1, .08), walkSpec(E - 52 + bx, FY, SME, 1, (E + bx) / 150, 150, .1, 24), mv) : standSpec(E - 52 + bx, FY, SME, 1, .08);
    const F = mixSpec(F0, STx, k);
    F.ang += .16 * Math.sin(Math.PI * clamp((tp - 12) / .5)) * (tp < 12.5 ? -1 : 0); F.eye = tp < 13.2 ? 'shock' : 'calm';
    const [G2, X] = carried(F, CA, left, false); return { F: G2, X }; }
  const XLay = { x: E - REST - L * (1 - left), y: FY + 34, a: 0, u0: L * (1 - left), lie: true };
  const u0L = L * (1 - left), PV = -PW / 2 - 4;
  const LAY = { ...standSpec(E - 52, FY, SME, 1), hip: [E - 34, FY - 82 * SME], ang: 1.12, feet: [[E - 96, FY], [E - 8, FY]], tilt: .3 };
  LAY.hands = [cpt(XLay, u0L + 104, PV), cpt(XLay, u0L + 62, PV)]; LAY.hand = ['flat', 'flat'];
  const REACH = { ...LAY, hip: [E - 66, FY - 160 * SME], ang: .46, hands: [null, [E + 70, FY - 20]], hand: ['fist', 'open'], eye: 'shock', tilt: .45 };
  if (t < B.tip) { if (t < 18.9) { const ST = standSpec(E - 52, FY, SME, 1, .08), STc = carried(ST, CA, left, false), k = eio((tp - 18.4) / .5), Xm = mixX(STc[1], XLay, k);
      const F = mixSpec(STc[0], LAY, k), lo = gLo(STc[1]);

    return { F: LAY, X: XLay, lay: true }; }

  const BACK = { ...standSpec(E - 52, FY, SME, -1, .04), tilt: .05, eye: 'calm' }, FWD = { ...standSpec(E - 52, FY, SME, 1, .1), tilt: .38, eye: 'down' };

}
function fallX(t) {

}

// ---------------- the others ----------------
const PIL = [{ x0: -470, ph: .3 }, { x0: -230, ph: .75 }, { x0: 190, ph: .1 }, { x0: 430, ph: .55 }];
const BRIDGE_Y = [BY - 6, BY + 4, BY + 14], PULL = 210;
function pilState(i, t) {
  const tp = t12(t), P = PIL[i], j = 3 - i, T = j < 3 ? B.bridges[j] : 99, yb = BRIDGE_Y[j] ?? BY;

    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, clamp((tt - 12) / (T - .35 - 12))); };

  const tag = F => { F.seed = 40 + i * 7; return F; };

  if (t < T) { const [F0, X0] = carry(T - .35, E - 46), k = eio((tp - T + .35) / .35), Xm = mixX(X0, XB, k), F = mixSpec(F0, LAY, k), lo = gLo(X0);

    const F = walkSpec(x, gy, SPI, 1, P.ph + x / (170 * SPI), 170, .12, 30); F.tilt = -.05; F.hands = hangHands(F, 26 * Math.sin(TAU * (P.ph + x / (170 * SPI)))); return { F: tag(F), B: XB }; }

  if (t < T + 1.25) { const k = eio(clamp((tp - T - .9) / .35)), [F, X] = PULLS(k);
    const k0 = eio((tp - T - .9) / .1); return { F: k0 < 1 ? tag(mixSpec(walkSpec(xs1, BY, SPI, 1, 0, 170, .1), F, k0)) : F, X }; }
  const [Fp, Xp] = PULLS(1), xg = xpAt(1);
  if (t < T + 1.6) { const k = eio((tp - T - 1.25) / .35), [Fc, Xc] = carry(T + 1.6, xg, BY, 150, .2), Xm = mixX(Xp, Xc, k), F = mixSpec(Fp, Fc, k), lo = gLo(Xc);
    F.hands = [cpt(Xm, lerp(Fp.gu[0], gHi(Xc), k), lerp(-PW / 2 + 2, 0, k)), cpt(Xm, lerp(Fp.gu[1], lo ?? Fp.gu[1], k), lerp(-PW / 2 + 2, 0, k))]; F.hand = ['fist', 'fist']; F.farFront = k < .85;   // rig: shouldering it, hands stay on
    return { F: tag(F), X: k < .85 ? { ...Xm, front: true } : Xm }; }
  const x = lerp(xg, GX + 10, clamp((tp - T - 1.6) / .3)), [F, X] = carry(tp, x, BY, 150, .2);
  F.alpha = 1 - ss(T + 1.62, T + 1.9, t); if (F.alpha <= 0) return null;
  return { F, X };
}

// ---------------- camera ----------------
const mixCam = K.mixCam;
function camAt(t) {
  let c = { x: meX(t) + 60 + 90 * ss(4.3, 5.4, t), y: 1050, z: 1.03 };
  c = mixCam({ x: meX(t) + 34, y: 1000, z: 1.62 }, c, eio((t - 1.5) / 1.1));
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: (cc.mx + cc.cutX) / 2 - 10, y: 1120, z: 1.32 });
  c = mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = mixCam(c, mixCam(at(c2), at(c3), eio((t - 10.0) / .45)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));
  if (t >= 12) c = mixCam(c, { x: E + 345, y: 990, z: .72 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = mixCam(c, { x: E + 190, y: 1090, z: .98 }, eio((t - 18.2) / .45));
  if (t >= B.fall) c = mixCam(c, { x: E + 160, y: 1200, z: 1.34 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .65) c = mixCam(c, { x: E + 150, y: 1060, z: 1.0 }, eio((t - B.fall - .65) / .7));
  if (t >= B.back) { const zb = .95, px = (pieceX(CUTS[1]) + pieceX(CUTS[2])) / 2, xb = Math.max(px, E - 52 - 330 / zb);   // one move back down the road (me still in frame, right)
    c = mixCam(c, { x: xb, y: CYB, z: zb }, eio((t - 21.3) / .7)); }
  if (t >= 22.15) c = mixCam(c, { x: E + 170, y: CYE, z: .98 }, eio((t - 22.15) / .65));   // …and back: me at the lip, the gap, the outline
  [c.sx, c.sy] = K.hitShake(t, B.fall);   // the hit: my cross goes over
  return c;
}

// ---------------- crosses (grainy sprites, K.prop): mine is the warm one, the others' are charcoal wood ----------------
const KX = 2, CPAD = 14;
function crossOutline(hb, x = 0, y = 0) { return [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],
  [CBX + CBW / 2, PW / 2], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, PW / 2], [0, PW / 2]].map(([a, b]) => [x + a, y + b]); }
function crossSprite(mine, lying) {
  const hb = lying ? CBHL : CBH, out = crossOutline(hb), sd = (mine ? 10 : 20) + (lying ? 1 : 0);
  const c = K.prop({ w: (L + 2 * CPAD) * KX, h: (2 * hb + 2 * CPAD) * KX, ox: -CPAD, oy: -(hb + CPAD), k: KX, draw: g => {
    const r = rng(sd * 7);
    if (mine) { fillG(g, out, [234, 204, 146], 1.15, 2, 'warm'); fillG(g, out, [234, 204, 146], .5, 1, 'chalk'); }
    else { fillG(g, out, [98, 93, 88], 1.2, 1, 'black'); }
  g.save(); g.clip(HD.pathOf(out));   // shade along the lower edge and the crossbar's far side, grain strokes along the wood
  g.fillStyle = mine ? 'rgba(150,96,40,.45)' : 'rgba(20,18,17,.45)'; g.fillRect(-2, PW / 2 - 10, L + 4, 12); g.fillRect(CBX + 4, -hb, CBW / 2, 2 * hb);
  for (let k = 0; k < 5; k++) { const y = -PW / 2 + 5 + k * 6 + r() * 2; strokeG(g, HD.seg([4 + r() * 30, y], [L - 8 - r() * 40, y + (r() - .5) * 3], 6), sd * 10 + k, mine ? PAT.brown : PAT.light, { w: 1.8, wob: .6, ts: 30, te: 40 }); }
  for (let k = 0; k < 3; k++) { const x = CBX - CBW / 2 + 7 + k * 9; strokeG(g, HD.seg([x, -hb + 6], [x + (r() - .5) * 2, hb - 6], 5), sd * 20 + k, mine ? PAT.brown : PAT.light, { w: 1.6, wob: .5 }); }
  if (mine) for (let k = 0; k < 4; k++) { const x = 30 + k * 110 + r() * 40; strokeG(g, HD.seg([x, -PW / 2 + 4], [x + 50, -PW / 2 + 5], 4), sd * 30 + k, PAT.chalk[2], { w: 2.4, wob: .4 }); }   // the light catching its top edge
  g.restore();
  for (let i = 0; i < out.length; i++) { const a = out[i], b = out[(i + 1) % out.length], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, e = 1.5;
    strokeG(g, HD.seg([a[0] - dx / l * e, a[1] - dy / l * e], [b[0] + dx / l * e, b[1] + dy / l * e], 4), sd * 50 + i, mine ? PAT.brown : PAT.dark, { w: 3, wob: .5, ts: 4, te: 6 }); }
  } });
  return { hb, c };
}
function drawCross(ctx, SP, u0, u1, x, y, a, alpha = 1) {
  if (u1 - u0 < .5 || alpha <= 0) return;
  const hb = SP.hb, left = u0 <= .5 ? -CPAD : u0, right = u1 >= L - .5 ? L + CPAD : u1;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.globalAlpha = alpha;
  ctx.drawImage(SP.c, (left + CPAD) * KX, 0, (right - left) * KX, SP.c.height, left, -hb - CPAD, right - left, 2 * hb + 2 * CPAD);
  for (const u of [u0, u1]) if (u > .5 && u < L - .5) { ctx.fillStyle = 'rgba(246,232,200,.9)'; ctx.fillRect(u - 2, -PW / 2, 4, PW); strokeG(ctx, HD.seg([u + (u === u0 ? 3 : -3), -PW / 2], [u + (u === u0 ? 3 : -3), PW / 2], 3), 900 + (u | 0), PAT.brown, { w: 2.2, wob: .3, ts: 2, te: 2 }); }
  ctx.restore();
}

// ---------------- the saw (graphite: a grey blade with white-pencil light, a dark wooden handle) ----------------
function drawSaw(ctx, grip, ang) {
  const { d, up, heel } = sawGeo(grip, ang), P = (u, v) => [heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v];
  const blade = [P(0, 30), P(172, 18)]; for (let u = 172; u >= 0; u -= 9) blade.push(P(u, (u / 9 | 0) % 2 ? 3 : -3));
  const handle = HD.spline([P(-4, 36), P(-38, 46), P(-52, 20), P(-40, -4), P(-6, 2)], 3, true), hole = HD.spline([P(-14, 30), P(-34, 36), P(-42, 20), P(-34, 8), P(-14, 12)], 3, true);
  ctx.save(); ctx.fillStyle = 'rgba(92,94,100,1)'; ctx.fill(HD.pathOf(blade)); ctx.globalAlpha = .5; ctx.fillStyle = PAT.chalk[1]; ctx.fill(HD.pathOf(blade)); ctx.globalAlpha = 1;
  strokeG(ctx, [P(6, 26), P(166, 15)], 950, PAT.chalk[2], { w: 3, ts: 10, te: 20 });
  ctx.fillStyle = 'rgba(70,52,40,1)'; ctx.fill(HD.pathOf(handle)); ctx.fillStyle = PAT.black[1]; ctx.fill(HD.pathOf(handle));
  ctx.fillStyle = 'rgba(52,49,47,1)'; ctx.fill(HD.pathOf(hole)); ctx.restore();
  HD.ink(ctx, blade.concat([blade[0]]), { w: 3, ts: 2, te: 2, mn: 1, press: .3, seed: 951, col: PAT.dark });
  HD.ink(ctx, handle, { w: 2.6, ts: 2, te: 2, mn: 1, press: .3, seed: 952, col: PAT.dark });
}

// ---------------- the world (built once from kit pieces): far layer (sky, moon, hills, street, fence), the road plate, a foreground of bushes + one trunk ----------------
let PX0 = -600, PX1 = 3600, PY0 = 660, PY1 = 2470, FX0 = -800, FX1 = 2400, GX0 = 0, GX1 = 0, TRUNKX = 0;
const FY0 = -340, FY1 = 1330, GY0 = 1560, GY1 = 2900;
let ARCH = null, GAP = null;
function buildFar(g) {
  K.nightSky(g, FX0, FY0, FX1, FY1);
  K.moon(g, 900, 300);
  K.hills(g, FX0, FX1, 980, 120, FY1);             // a far line of low hills, then the houses across the street, a picket fence
  K.street(g, FX0, FX1, { bottom: FY1 });
  K.picketFence(g, FX0, FX1);
}
function buildPlate(g) {
  const r = rng(17);
  for (const [a, b] of [[PX0 - 40, E], [E + G, PX1 + 40]]) K.groundStrip(g, a, b, { top: RT, near: RN, bottom: PY1 }, r);   // the garden bed, the road, the ground — cut by the gap
  K.gap(g, GAP);                                   // the gap: a charcoal-black cut, rims lit in white pencil
  K.archDoor(g, ARCH);                             // the far side: a stone wall with an arched door ajar, warm light inside
}
function buildFG(g) { K.bushes(g, GX0, GX1, { bottom: GY1 }); K.trunk(g, TRUNKX, { bottom: GY1 }); }

// ---------------- the flashlight: a friend by the door lights the way (a clean cone — apex at the lens, edges tangent to the pool) ----------------
const FRS = .74;
function friendX() { return GX + 196; }
function beamAim(t) {   // → { c: pool centre, rx, ry, on }
  const q = t12(t), on = q < 12.7 ? 0 : q < 12.8 ? .5 : 1;
  const P0 = [GX - 40, BY + 36], P1 = [E - 30, BY + 30], P2 = [E + 130, FY + 30];
  const pc = [(pieceX(CUTS[1]) + pieceX(CUTS[2])) / 2, FY + 30], P4 = [E - 30, FY + 30];   // v2: the beam comes back to rest on me at the lip, so the outline's slots light on their own in the dark
  let c = P0;
  c = mixP(c, P1, eio((q - 12.8) / .9));
  c = mixP(c, P2, eio((q - 18.2) / .45));
  c = mixP(c, pc, eio((q - 21.3) / .7));
  c = mixP(c, P4, eio((q - 22.15) / .65));
  const wav = q > 13.7 ? 6 * Math.sin(q * 1.9) + 3 * Math.sin(q * 4.7) : 0;
  const rx = 150 + 90 * eio((q - 21.3) / .7) * (1 - eio((q - 22.15) / .65)) + 20 * eio((q - 22.15) / .65);
  return { c: [c[0] + wav, c[1]], rx, ry: 36, on };
}
const mixP = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
function torchGeo(t, F) { const A = beamAim(t); return { A, ...K.torchGeo(F, A.c) }; }   // hand, beam axis, lens — the torch is rigid along the axis
function friendSpec(t) { const x = friendX(), F = standSpec(x, BY + 2, FRS, -1, .02); F.seed = 90; F.sheet = [214, 209, 201]; F.eye = 'calm'; F.tilt = -.06;
  F.hands = [null, null]; F.hand = ['fist', 'fist']; return F; }
function drawBeam(ctx, t) { const F = friendSpec(t), T = torchGeo(t, F); K.drawBeam(ctx, T.lens, T.A.c, T.A.rx, T.A.ry, T.A.on); }
function drawFriend(ctx, t) {
  const F = friendSpec(t), T = torchGeo(t, F); F.hands = [null, T.hand]; F.hand = ['fist', 'fist']; F.lit = 0;
  F.after = () => { K.drawTorch(ctx, T.hand, T.d, T.A.on); };
  drawFig(ctx, F, null, null); K.lensGlow(ctx, T.lens, T.A.on);
}
function warmHaze(ctx, t) { const A = beamAim(t); K.warmHaze(ctx, A.c, A.on); }   // the beam's light falls on whatever stands in the pool

// ---------------- the live world ----------------
function guide(ctx, t, k, al, glow = 0) {   // my whole cross across the gap, in white pencil (dashed): what should have been there
  if (al <= 0) return;
  const ol = crossOutline(CBHL, E - REST, FY + 34), x1 = E - REST - 4 + (L + 8) * k;
  K.ghostOutline(ctx, ol, t, al, glow, [E - REST - 10, FY - 200, x1 - (E - REST - 10), 400]);
}
function outlineSlots(ctx, t) {   // v2: the dashed white-pencil outline of my whole cross over the open gap; its missing span lights slot by slot
  const al = ss(22.15, 22.6, t); if (al <= 0) return;
  guide(ctx, t, 1, al);
  const ol = HD.pathOf(HD.poly(crossOutline(CBHL, E - REST, FY + 34), true, 6));
  let x = E - REST + S.left[3] * L;
  CUTS.forEach((c, j) => { const len = c.u1 - c.u0, x0 = x; x += len; const k = ss(SLOTS[j], SLOTS[j] + .3, t); if (k <= 0) return;
    const fl = 1 - ss(SLOTS[j] + .05, SLOTS[j] + .6, t);
    ctx.save(); ctx.beginPath(); ctx.rect(x0, FY - 200, len, 400); ctx.clip(); ctx.globalAlpha = k;
    ctx.fillStyle = rgba(C.warm, .42 + .25 * fl); ctx.fill(ol);
    ctx.setLineDash([16, 10]); ctx.lineDashOffset = -t * 16; ctx.strokeStyle = rgba(C.warm, 1); ctx.lineWidth = 5; ctx.stroke(ol); ctx.setLineDash([]);
    ctx.globalCompositeOperation = 'screen'; ctx.strokeStyle = rgba([150, 120, 64], .5 + .4 * fl); ctx.lineWidth = 16; ctx.stroke(ol);
    ctx.restore();
    strokeG(ctx, HD.seg([x, FY + 34 - PW / 2 - 6], [x, FY + 34 + PW / 2 + 6], 3), 960 + j, PAT.chalk[2], { w: 3, ts: 2, te: 2, wob: .3 }); });
}
function glowAt(ctx, t, cx, cy, hl, seed) {   // a found piece: a warm halo
  if (hl <= 0) return; K.glow(ctx, cx, cy, hl, .85 + .15 * Math.sin((t - B.back) * 5 + seed));
}
function drawCrumbs(ctx, t) {
  for (const q of FLECKS) { const u = t - q.t0; if (u < 0 || t > B.back + 2.5) continue;
    const tl = (-q.vy + Math.sqrt(q.vy * q.vy + 4 * 700 * (q.land - q.y))) / 1400, uu = Math.min(u, Math.max(0, tl));
    const x = q.x + q.vx * uu, y = q.y + q.vy * uu + 700 * uu * uu; ctx.fillStyle = q.col.startsWith('rgba(214') ? 'rgba(236,206,150,.95)' : 'rgba(40,37,35,.9)'; ctx.beginPath(); ctx.ellipse(x, y, q.sz, q.sz * .7, 0, 0, TAU); ctx.fill(); }
  if (t >= B.fall && t < B.fall + 1.2) { const u = t - B.fall;   // crumbs and dust off the lip, falling into the dark
    for (const q of SPAT) { const x = q.x + q.vx * u * .6, y = q.y + q.vy * u * .6 + 1100 * u * u; ctx.fillStyle = q.col === INK ? 'rgba(200,194,186,.8)' : 'rgba(236,206,150,.9)'; ctx.beginPath(); ctx.arc(x, y, q.sz * .7, 0, TAU); ctx.fill(); }
    K.puff(ctx, E + 10, FY + 24, u / 1.2); }   // the hit: a dust puff off the lip
}
function world(ctx, t) {
  drawBeam(ctx, t);
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  for (const P of pils) if (P.B) drawCross(ctx, TX.xLie, 0, L, P.B.x, P.B.y, P.B.a);
  drawFriend(ctx, t);
  pils.slice().sort((a, b) => a.F.hip[0] - b.F.hip[0]).forEach((P, i) => {
    const X = P.X, dc = X ? () => drawCross(ctx, X.lie ? TX.xLie : TX.xUp, X.u0, L, X.x, X.y, X.a, P.F.alpha ?? 1) : null;
    P.F.sheet = [[172, 167, 160], [160, 155, 148], [182, 177, 170], [166, 161, 154]][P.F.seed % 4];
    drawFig(ctx, P.F, X && (X.lie || X.front) ? dc : null, X && !X.lie && !X.front ? dc : null);
  });
  if (t >= 18.5 && t < 19.75) guide(ctx, t, eio((t - 18.5) / .55), 1 - ss(19.4, 19.75, t));
  outlineSlots(ctx, t);
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip;
    drawSaw(ctx, [lerp(g0[0], SAWLIE.grip[0], k), lerp(g0[1], SAWLIE.grip[1], k)], lerp(CUT_ANG, SAWLIE.ang, k)); }
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), cu = (c.u0 + c.u1) / 2, hl = ss(21.45 + (2 - c.k) * .16, 21.85 + (2 - c.k) * .16, t);
    if (t < FILL[c.k][0]) { ctx.save(); ctx.globalAlpha = .5; ctx.drawImage(K.TX.shad, p.x + c.u0 - 10, p.y + 8, c.u1 - c.u0 + 20, 22); ctx.restore(); }
    drawCross(ctx, TX.gLie, c.u0, c.u1, p.x, p.y, p.a);
    glowAt(ctx, t, p.x + Math.cos(p.a) * cu, p.y + Math.sin(p.a) * cu, hl, 11 + c.k * 5); }
  const M = poseMe(t), F = M.F; F.me = true;
  const A = beamAim(t); F.lit = A.on * clamp(1 - Math.abs(A.c[0] - F.hip[0]) / 260);
  const myCross = X => { if (X) drawCross(ctx, X.lie ? TX.gLie : TX.gUp, X.u0, L, X.x, X.y, X.a); };
  drawFig(ctx, F, () => {
    if (M.X && (M.X.lie || M.X.front)) myCross(M.X);
    if (M.kerf) { ctx.fillStyle = 'rgba(30,28,27,1)'; ctx.fillRect(M.c.cutX - 1.6, M.c.y - PW / 2, 3.2, M.kerf.kp * PW * .92 + .5); }
    if (M.saw) drawSaw(ctx, M.saw.grip, M.saw.ang);
  }, M.X && !M.X.lie && !M.X.front ? () => myCross(M.X) : null);
  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { ctx.save(); if (FX.clip) { ctx.beginPath(); ctx.rect(E + 2, -4000, G - 4, 9000); ctx.clip(); } drawCross(ctx, TX.gLie, FX.u0, L, FX.x, FX.y, FX.a, FX.alpha ?? 1); ctx.restore(); }
  drawCrumbs(ctx, t);
  warmHaze(ctx, t);
}

// ---------------- frame ----------------
function draw(ctx, t) {
  const cm = camAt(t);
  K.ground(ctx);
  K.layer(ctx, cm, .5, () => K.drawSheet(ctx, TX.far));
  K.layer(ctx, cm, 1, () => { K.drawSheet(ctx, TX.plate); world(ctx, t); });
  K.layer(ctx, cm, 1.3, () => K.drawSheet(ctx, TX.fg));
  K.post(ctx, t);                                  // vignette + grain flicker
  K.endPlate(ctx, t, B.end);                       // v2: a calm, opaque plate
  if (t < B.end) K.captions(ctx, t, S.lines);
  K.endCard(ctx, t, S.endCard, B.end);
}
async function init() {
  K.init(); buildTimeline();
  ARCH = { x: GX, base: BY + 4, cy: GAY, ra: RA, ro: RO };
  const [x0, x1] = K.camExtent(camAt, S.DUR, 1), [fx0, fx1] = K.camExtent(camAt, S.DUR, .5), [gx0, gx1] = K.camExtent(camAt, S.DUR, 1.3);
  PX0 = Math.floor(Math.min(x0, -560)); PX1 = Math.ceil(Math.max(x1, GX + 700)); FX0 = Math.floor(fx0); FX1 = Math.ceil(fx1); GX0 = Math.floor(gx0); GX1 = Math.ceil(gx1);
  GAP = { e: E, w: G, top: RT, bottom: PY1, seed: 81 };
  TRUNKX = -300;   // v2: the trunk frames the opening close-up on the left and leaves as the camera moves on — it never crosses me
  TX.far = K.layerCanvas(FX0, FY0, FX1, FY1); buildFar(TX.far.g);
  TX.plate = K.layerCanvas(PX0, PY0, PX1, PY1); buildPlate(TX.plate.g);
  TX.fg = K.layerCanvas(GX0, GY0 - 1700, GX1, GY1); buildFG(TX.fg.g);
  TX.gUp = crossSprite(true, false); TX.gLie = crossSprite(true, true); TX.xUp = crossSprite(false, false); TX.xLie = crossSprite(false, true);
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: K.FONTS, init, draw });
</script>
