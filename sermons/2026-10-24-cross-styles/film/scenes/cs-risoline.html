/* 잘라 낸 건 다리였다 — 07 risograph comic line (from the style lab's lab-risoline).

  if (t < B.end) Story.captions(ctx, t, S.lines, { font: "'Gaegu',cursive", weight: 700, size: 70, y: 405, color: C.ink, shadow: 'rgba(0,0,0,0)', shadowBlur: 0, srcColor: '#22343a' });
  Story.endCard(ctx, t, S.endCard, B.end, { font: "'Gaegu',cursive", srcFont: "'Gaegu',cursive", color: C.ink, srcColor: '#2c3a3e', y: 860, titleShadow: '' });
}

Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 70px 'Gaegu'"], init, draw });
</script>
