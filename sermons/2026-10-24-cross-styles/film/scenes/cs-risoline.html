/* 잘라 낸 건 다리였다 — 07 risograph comic line (from the style lab's lab-risoline). The worked example of the `risoline`
   house style: the medium, the beanie-kid rig, the road, the door, the comic marks and the end plate come from
   kit-risoline.js (styles/risoline/STYLE.md); this file draws only the story.
   Two-ink print look: flat mottled teal-blue field, a thick boiling black line, cream shapes off-register, dot-screen tone.
   The one extra ink is yellow — and in this film the yellow ink is MY CROSS (and, later, the light in the door across the
   gap). The others are the same beanie kids printed in cream + dot tone, carrying cream, dot-toned crosses.
   Comic grammar carries the turn: sweat drops and gloom lines under the weight; squiggle motion lines and heel puffs as I
   run ahead; a pop-in inset panel of my face while my short cross hangs over the gap; manga focus lines for the hit; the
   yellow pieces I sawed off glow where they lie, and a dashed outline of my whole cross lights slot by slot.
   Everything (figures, camera) poses on twos, like the lab; only caption fades run on ones.
   World units ≈ screen px at zoom 1. My lane FY (front), the others' lane BY (behind), the road's far edge RT. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const Rk = Riso, Rig = Riso.Rig, C = Riso.C, { ink, ell, tone, glow, wob, pathOf, resample } = Riso;
const { frame, headFrame, walkSpec, standSpec, hangHands, mixSpec, hangGrip, cpt, mirrorX, mixX, rotAbout, SHN, SHF, ARM1, ARM2 } = Rig;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const t12 = Riso.t12;
const CR = Rig.CROSS, L = CR.L, PW = CR.PW, CBH = CR.bar.h, CBHL = CR.bar.hLie;   // the cross: post length/width, crossbar half-length upright / lying
const crossPoly = CR.poly;
const FY = 1300, BY = 1236, RT = 1180;                                  // my lane, the others' lane, the road's far edge
const REST = 26, G = L - 2 * REST;                                      // a whole cross rests 26 on each lip: the gap is G wide
const SME = .9, SPI = .8;                                               // me (front lane) a touch larger than the others
const frac = x => x - Math.floor(x);
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const shoulderOf = Rig.shoulderOf;
const drawCross = (ctx, X, u0, u1, mine, alpha = 1) => Riso.beam(ctx, CR, X, u0, u1, mine, alpha);
const drawKid = Riso.kid;
let ROAD = null;
function init() {
  Riso.init();
  buildTimeline();
  ROAD = Riso.makeRoad({ top: RT, front: FY + 66, bottom: FY + 150, gaps: [[E, E + G]] });   // the road breaks off at the gap
}

// ---------------- the saw ----------------
const CUT_ANG = Math.PI - .6, hangAng = f => Math.atan2(.95, .3 * f);
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];
  return { d, up, heel: [grip[0] - up[0] * 14 + d[0] * 20, grip[1] - up[1] * 14 + d[1] * 20] }; }

  const { d, up, heel } = sawGeo(grip, ang), P = (u, v) => [heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v];
  ink(ctx, [P(0, 28), P(140, 16), P(146, 9), P(142, 0), P(0, 0)], { fill: C.cream, tone: tone(false, heel[0], heel[1]), smooth: false, lw: 5, step: 10 });
  const tz = []; for (let u = 4; u <= 138; u += 8) tz.push(P(u, (u / 8 | 0) % 2 ? 3.5 : -3.5));
  ink(ctx, tz, { closed: false, lw: 3, smooth: false, single: true, step: 6 });
  ink(ctx, ell(...P(124, 13), 4.5, 4.5, 8), { fill: C.field, lw: 3, single: true });
  ink(ctx, [P(2, 34), P(-34, 48), P(-52, 22), P(-40, -6), P(2, -2)], { fill: C.ink, lw: 5, step: 8 });
  ink(ctx, [P(-12, 29), P(-32, 36), P(-41, 21), P(-32, 8), P(-12, 11)], { fill: C.field, lw: 0, mx: 0, my: 0 });
}
function sawState(c, t) {   // the stroke: the teeth pass through the kerf, the blade moves along its own length
  const kp = clamp((t - c.saw0) / (c.drop - .06 - c.saw0)), saw = t >= c.saw0 - .05 && t < c.drop + .02;
  const osc = saw ? 15 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, d = [Math.cos(CUT_ANG), Math.sin(CUT_ANG)];
  let up = [-d[1], d[0]]; if (up[1] > 0) up = [-up[0], -up[1]];
  const Kp = [c.cutX, c.y - PW / 2 + kp * PW * .92], heel = [Kp[0] - d[0] * (54 - osc), Kp[1] - d[1] * (54 - osc)];
  return { kp, grip: [heel[0] + up[0] * 14 - d[0] * 20, heel[1] + up[1] * 14 - d[1] * 20], K: Kp };
}

// ---------------- timeline: my path (integrated once), the cuts ----------------
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 44 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1));        // staggering
  if (t < 4.6) return 0;
  if (t < 5.0) return 380 * eio((t - 4.6) / .4);                            // lighter: big quick strides
  if (t < 8.3) return 380;
  if (t < 8.6) return lerp(380, 150, (t - 8.3) / .3);
  if (t < 9.0) return 150 * (1 - ss(8.6, 9.0, t));
  if (t < 10.12) return 0;
  if (t < 10.4) return 643 * Math.sin(Math.PI * (t - 10.12) / .28);
  if (t < 11.47) return 0;
  if (t < 12.0) return 785 * Math.sin(Math.PI * (t - 11.47) / .53);

}
const strideMe = t => t < 4.6 ? 104 : t < 8.8 ? 250 : 160;
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };
const meX = t => tab(MEX, t), meP = t => tab(MEP, t);
const CUTS = [{ s: 3.2, d: .3, saw0: 3.5, drop: 4.0, up1: 4.4 }, { s: 9.0, d: .36, saw0: 9.38, drop: 9.8, up1: 10.12 }, { s: 10.4, d: .32, saw0: 10.73, drop: 11.2, up1: 11.47 }];
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const FLECKS = [];
let E = 2000, GX = 0, SAWLIE = null;
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }
  E = meX(12) + 52; GX = E + G + 250;
  CUTS.forEach((c, k) => {
    c.k = k; c.mx = meX(c.s); c.cutX = c.mx - 150; c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.baseX = c.cutX - c.u1; c.y = FY + 30;
    const r = rng(100 + k);
    for (let n = 0; n < 16; n++) FLECKS.push({ t0: n < 11 ? lerp(c.saw0, c.drop, n / 11) : c.drop + r() * .05, x: c.cutX + (r() - .5) * 8, y: c.y - PW / 2,
      vx: (r() - .5) * (n < 11 ? 180 : 320), vy: -(80 + r() * (n < 11 ? 160 : 260)), land: FY + 24 + r() * 40, r0: r() * TAU, vr: (r() - .5) * 20, sz: 4 + r() * 4, col: C.yel });
  });
  const c3 = CUTS[2]; SAWLIE = { grip: [c3.cutX + 190, FY + 58], ang: Math.PI + .05 };
  const r = rng(200);
  for (let n = 0; n < 14; n++) FLECKS.push({ t0: B.fall + r() * .1, x: E + 6 + r() * 30, y: FY + 30, vx: (r() - .2) * 260, vy: -(60 + r() * 220), land: 2700, r0: r() * TAU, vr: (r() - .5) * 24, sz: 4 + r() * 6, col: n % 3 ? C.yel : C.cream });
}
function pieceAt(c, t) {   // a cut piece lying where it fell — it stays there (v2: nothing flies, nothing is repaired)
  const sh = 22 * eo((t - c.drop) / .25), cu = (c.u0 + c.u1) / 2;
  const cx = c.baseX + cu - sh, cy = c.y + 4 * eo((t - c.drop) / .2), a = -.05 * eo((t - c.drop) / .25);
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, lie: true, cx, cy };
}
// v2 ending: each piece starts to glow as the camera reaches it; then the outline's missing span lights slot by slot
const GLOWAT = [22.0, 21.68, 21.42], SLOTAT = [24.3, 23.6, 22.9];   // index = cut k (piece 3 is nearest the gap)
// ---------------- poses (the rig is the kit's; these are the story's) ----------------
const carryCross = (F, left, a0) => Rig.onShoulder(F, CR, left, a0);
const heldX = (F, left) => Rig.inFront(F, CR, left);
const holdLow = (F, left) => Rig.holdLow(F, CR, left);
const holdShort = (F, left) => Rig.holdFront(F, CR, left);
const reachOnBeam = (F, X) => Rig.steadyBehind(F, CR, X);
const gripCarry = (F, X) => Rig.gripShoulder(F, CR, X);

// sawing: I face back (−x) toward the foot, squat over the lying cross; far mitten pins it beside the cut, near hand saws
function sawSpec(c, t) {
  const f = -1, s = SME, st = sawState(c, t), lean = 1.12, ang = f * lean;
  const F0 = { s, f, ang, hip: [0, 0] }, fr = frame(F0), so = fr.P(SHN[0], SHN[1]);   // shoulder offset from the hip
  const shT = [c.cutX + 112, FY - 102], hip = [shT[0] - so[0], shT[1] - so[1]];
  return { s, f, gy: FY, hip, ang, feet: [[hip[0] - 28 * s, FY], [hip[0] + 42 * s, FY]], hands: [[c.cutX + 104, c.y - PW / 2 - 4], st.grip],
    hand: ['flat', 'grip'], tilt: .12, eye: 'dot', mouth: 'flat', farOver: true, me: true };
}

function poseMe(t) {
  const tp = Math.max(0, t12(t)), left = leftAt(tp);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt), ph = meP(tt);
    if (tt < 3.2) { const F = walkSpec(x, FY, SME, 1, ph, 104, .34 + .08 * Math.sin(tt * TAU / 1.15), 14); F.eye = 'tired'; F.mouth = 'wavy'; F.tilt = .26;
      F.hip[1] += 6 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); F.wind = .15; return [F, -.36 + .05 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt), F = walkSpec(x, FY, SME, 1, ph, lerp(104, 250, k), lerp(.34, .2, k), lerp(14, 60, k));
      F.eye = k > .5 ? 'happy' : 'tired'; F.mouth = k > .5 ? 'smile' : 'flat'; F.tilt = lerp(.26, -.05, k); F.wind = lerp(.15, 1, k); return [F, -.4]; }
    const F = walkSpec(x, FY, SME, 1, ph, 160, .14, 30); F.eye = 'dot'; F.mouth = 'smile'; F.wind = .6; return [F, -.4];
  };
  const sawHeld = tp < CUTS[2].drop;
  const carried = (F, a0, lf, held) => { const X = carryCross(F, lf, a0); gripCarry(F, X);
    if (held) { F.hands[0] = reachOnBeam(F, X); F.farMid = true; F.hands[1] = hangGrip(F, F.ph != null ? 14 * Math.sin(TAU * F.ph) : 0); F.hand = ['grip', 'grip']; }
    F.me = true; return [F, X]; };
  for (const c of CUTS) {
    if (tp >= c.s && tp < c.up1) {
      const lf0 = S.left[c.k], lf1 = S.left[c.k + 1], [W0, a0] = walk(c.s, c.mx), [W1, a1] = walk(c.up1, c.mx), last = c.k === 2;
      const [WA, XA] = c.k === 2 ? holdLow(W0, lf0) : carried(W0, a0, lf0, true), [WB, XB] = c.k === 1 ? holdLow(W1, lf1) : carried(W1, a1, lf1, !last);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      const onBeam = (X, F, k, avoid) => {   // the free hand on the beam: the point nearest the far shoulder, sliding to where it will pin the cut
        const sh = frame(F).P(SHF[0], SHF[1]), R = (ARM1 + ARM2) * F.s * .92; let best = c.u1 + 104, bd = 1e9;
        for (let u = X.u0 + 24; u < L - 20; u += 8) { const q = cpt(X, u), d = Math.hypot(q[0] - sh[0], q[1] - sh[1]), clear = Math.abs(q[0] - F.hip[0]) > 66 * F.s;
          const sc = d + (clear ? 0 : 400) + (d > R ? 800 : 0) + (avoid && Math.hypot(q[0] - avoid[0], q[1] - avoid[1]) < 70 * F.s ? 600 : 0); if (sc < bd) { bd = sc; best = u; } }
        return cpt(X, lerp(best, c.u1 + 104, ss(.55, 1, k)), -PW / 2 - 4); };
      if (tp < c.s + c.d) { const k = ss(0, 1, (tp - c.s) / c.d), F = mixSpec(WA, SP, k), Xm = mixX(XA, XL, k); F.me = true; F.farOver = true;
        const nh = lerp2(WA.hands[1], cg, ss(.35, 1, k)); F.hands = [onBeam(Xm, F, k, nh), nh]; F.hand = k > .6 ? ['flat', 'grip'] : ['grip', 'grip'];
        F.eye = 'dot'; return { F, X: Xm, c, saw: { grip: F.hands[1], ang: lerp(hangAng(1), CUT_ANG, ss(.35, 1, k)) } }; }
      if (tp < c.drop) { const st = sawState(c, tp); return { F: SP, X: XL, c, kerf: st, saw: { grip: st.grip, ang: CUT_ANG } }; }
      const k = eio((tp - c.drop) / (c.up1 - c.drop)), F = mixSpec(SP, WB, k), Xm = mixX(XL, XB, k); F.me = true; F.farOver = true;
      const nh = lerp2(cg, WB.hands[1], ss(0, .55, k)); F.hands = [lerp2(onBeam(Xm, F, 1 - k, nh), WB.hands[0], ss(.75, 1, k)), nh]; F.hand = k < .4 ? ['flat', 'grip'] : ['grip', 'grip'];   // the saw comes away first, clear of the beam
      if (last) {   // the saw is left on the road: both hands lift the short cross to the waist, then I turn round with it
        const FL = { ...WB, f: -1, ang: -WB.ang, hip: WB.hip.slice() }, [, XLh] = holdShort(FL, lf1), y = clamp((k - .62) / .38);
        if (y <= 0) { const Xh = mixX(XL, XLh, eio(k / .62)); F.f = -1; F.headF = -1; F.hands = [cpt(Xh, Xh.u0 + 150, PW / 2 - 2), lerp2(cg, cpt(Xh, Xh.u0 + 30, -PW / 2 - 2), ss(0, .5, k))]; F.farMid = true; F.farOver = false;
          return { F, X: Xh, c, saw: null }; }
        const fr = y < .5 ? -1 : 1, Fh = { ...F, f: fr, headF: fr, ang: fr * Math.abs(F.ang) }, [F2, Xh] = holdShort(Fh, lf1), sx = y < .5 ? 1 - 2 * y : 2 * y - 1, px = F.hip[0];
        F2.hands = F2.hands.map(h => [px + (h[0] - px) * Math.max(.08, sx), h[1]]); F2.me = true; F2.farOver = false;
        return { F: F2, X: mirrorX(Xh, px, sx), c, saw: null }; }

    }
  }

  // at the edge: stop (shock), step back to make room for the others, come back
  if (tp < 18.4) { const [F0] = walk(12, E - 52), k = eio((tp - 12) / .3);
    const bx = -170 * eio((tp - 12.9) / .7) + 170 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.85, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.65, 17.55, .12, .12));
    const st = standSpec(E - 52 + bx, FY, SME, 1, .08), STx = mv > 0 ? mixSpec(st, walkSpec(E - 52 + bx, FY, SME, 1, (E + bx) / 140, 140, .1, 24), mv) : st;
    const F = mixSpec(F0, STx, k); F.ang += -.12 * Math.sin(Math.PI * clamp((tp - 12) / .5));
    F.eye = tp < 13.4 ? 'shock' : 'dot'; F.mouth = tp < 13.4 ? 'o' : 'flat'; F.tilt = tp < 13.4 ? -.1 : .05; F.wind = .3;
    const [G2, X] = holdShort(F, left); G2.me = true; return { F: G2, X, shock: tp < 13.4 }; }
  // my turn: lay it across — it hangs short off the near lip; I press the near end down
  const XLay = { x: E + G + REST, y: FY + 34, a: Math.PI, u0: L * (1 - left), lie: true };
  // squatting at the lip, both mittens pressing the near end down (the body placed from where the hands must be)
  const layHip = (() => { const F0 = { s: SME, f: 1, ang: 1.0, hip: [0, 0] }, so = frame(F0).P(SHN[0], SHN[1]); return [E - 34 - so[0], FY - 84 - so[1]]; })();
  const LAY = { ...standSpec(E - 70, FY, SME, 1), hip: layHip, ang: 1.0, feet: [[layHip[0] + 34, FY], [layHip[0] - 30, FY]], tilt: .25, me: true, eye: 'worry', mouth: 'wavy' };
  LAY.hands = [[E - REST + 10, FY + 34 - PW / 2 - 6], [E - REST + 46, FY + 34 - PW / 2 - 6]]; LAY.hand = ['flat', 'flat'];   // both mittens press the crossbar end down on the lip
  const REACH = { ...LAY, hip: [layHip[0] - 8, FY - 122 * SME], ang: .42, feet: [[layHip[0] + 40, FY], [layHip[0] - 34, FY]], hands: [[E - 130, FY - 70], [E + 50, FY - 40]], hand: ['grip', 'open'], eye: 'shock', mouth: 'o', tilt: .4 };
  if (tp < B.tip) { if (tp < 18.9) { const ST = { ...standSpec(E - 52, FY, SME, 1, .08), me: true }, STc = holdShort(ST, left), k = eio((tp - 18.4) / .45);
      const F = mixSpec(STc[0], LAY, k), X = mixX(STc[1], XLay, k); F.me = true; F.eye = 'dot'; F.farMid = k < .62;
      if (k < .8) { const u = q => lerp(q[0], q[1], ss(0, .8, k)); F.hands = [cpt(X, u([X.u0 + 150, L - 10]), -PW / 2 - 4), cpt(X, u([X.u0 + 30, L - 46]), -PW / 2 - 4)]; F.hand = ['grip', 'grip']; }

  const BACK = { ...standSpec(E - 96, FY, SME, -1, .04), tilt: .02, eye: 'glint', mouth: 'o', me: true }, FWD = { ...standSpec(E - 96, FY, SME, 1, .1), tilt: .3, eye: 'glint', mouth: 'sad', me: true };

}
function fallX(t) {

// ---------------- the others: lay it across → walk over → pull it back from the far side → shoulder it → into the light ----------------
const PIL = [{ x0: -470, ph: .3 }, { x0: -230, ph: .75 }, { x0: 190, ph: .1 }, { x0: 430, ph: .55 }];
const BRIDGE_Y = [BY + 2, BY + 10, BY + 18], PULL = 220;
function pilState(i, t) {
  const tp = t12(t), P = PIL[i], j = 3 - i, T = j < 3 ? B.bridges[j] : 99, yb = BRIDGE_Y[j] ?? BY;
  const xAt = tt => { if (tt <= 9 || j > 2) return P.x0 + 52 * tt; const xa = P.x0 + 468, xb = E - 320 - 140 * j, xc = E - 46;
    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, clamp((tt - 12) / (T - .55 - 12))); };
  const tired = tt => tt > 5 && tt < 9.5;
  const carry = (tt, x, gy = BY, stride = 110, lean = .3) => { const F = walkSpec(x, gy, SPI, 1, P.ph + x / (stride * SPI), stride, lean, 16); F.tilt = .12;
    F.eye = tired(tt) ? 'tired' : 'down'; F.mouth = tired(tt) ? 'wavy' : 'flat'; const X = carryCross(F, 1, -.42); gripCarry(F, X); return [F, X]; };
  if (j > 2) { if (t >= 12) return null; const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  if (tp < T - .55) { const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  const XB = { x: E - REST, y: yb, a: 0, u0: 0, lie: true };
  const LAY = { ...standSpec(E - 60, BY, SPI, 1), hip: [E - 74, BY - 120 * SPI], ang: .6, feet: [[E - 108, BY], [E - 30, BY]], tilt: .2 };
  LAY.hands = [cpt(XB, 26, -PW / 2 - 4), cpt(XB, 60, -PW / 2 - 4)]; LAY.hand = ['flat', 'flat'];
  if (tp < T) { const [F0, X0] = carry(T - .55, E - 46), k = clamp((tp - T + .55) / .55);
    const XH = { x: E - 46 - 150, y: BY - 96, a: -.03, u0: 0, lie: true }, HOLD = { ...standSpec(E - 50, BY, SPI, 1, .16), tilt: .2 };
    const hold = X => [cpt(X, 118, -PW / 2 - 3), cpt(X, 176, -PW / 2 - 3)];
    if (k < .5) { const q = eio(k / .5), X = mixX(X0, XH, q), F = mixSpec(F0, HOLD, q); F.hands = q < .3 ? [lerp2(F0.hands[0], hold(X)[0], q / .3), lerp2(F0.hands[1], hold(X)[1], q / .3)] : hold(X); F.hand = ['grip', 'grip']; F.farOver = q > .25;
      return { F, X: q > .25 ? { ...X, lie: true } : X }; }
    const q = eio((k - .5) / .5), X = mixX(XH, XB, q), F = mixSpec(HOLD, LAY, q); F.hands = q < .7 ? hold(X) : LAY.hands; F.hand = q < .7 ? ['grip', 'grip'] : ['flat', 'flat']; F.farOver = true; return { F, X }; }
  const xs0 = E - 20, xs1 = E + G + 70;
  if (tp < T + .3) { const F = mixSpec(LAY, standSpec(xs0, yb - PW / 2, SPI, 1, .1), eio((tp - T) / .25)); return { F, B: XB }; }
  if (tp < T + .9) { const x = lerp(xs0, xs1, eio(clamp((tp - T - .3) / .6))), gy = x < E + G + 4 ? yb - PW / 2 : BY, ph = P.ph + x / (160 * SPI);
    const F = walkSpec(x, gy, SPI, 1, ph, 160, .12, 30); F.tilt = -.05; F.hands = hangHands(F, 22 * Math.sin(TAU * ph)); F.hand = ['hang', 'hang']; return { F, B: XB }; }
  // from the far side: turn, crouch, take the top end and pull it back across
  const pv = [E + G, yb + PW / 2], pullX = k => rotAbout({ ...XB, x: XB.x + PULL * k }, pv, -.08 * k);
  const PULLS = k => { const X = pullX(k), h = [cpt(X, L - 26, -PW / 2 - 3), cpt(X, L - 66, -PW / 2 - 3)], so = frame({ s: SPI, f: -1, ang: -.7, hip: [0, 0] }).P(SHN[0], SHN[1]);
    const shT = [h[0][0] + 26, h[0][1] - 84], hip = [shT[0] - so[0], shT[1] - so[1]];
    const F = { ...standSpec(hip[0], BY, SPI, -1), hip, ang: -.7, feet: [[hip[0] + 30, BY], [hip[0] - 34, BY]], tilt: .15, eye: 'dot' };
    F.hands = h; F.hand = ['grip', 'grip']; return [F, X]; };
  if (tp < T + 1.25) { const k = eio(clamp((tp - T - 1.0) / .25)), [F, X] = PULLS(k), k0 = eio((tp - T - .9) / .1);
    return { F: k0 < 1 ? mixSpec(walkSpec(xs1, BY, SPI, 1, 0, 160, .1), F, k0) : F, X }; }
  const [Fp, Xp] = PULLS(1), xg = Fp.hip[0];
  if (tp < T + 1.5) { const k = eio((tp - T - 1.25) / .25), [Fc, Xc] = carry(T + 1.5, xg, BY, 140, .22); const F = mixSpec(Fp, Fc, k); F.eye = 'dot'; return { F, X: mixX(Xp, Xc, k) }; }
  const x = lerp(xg, GX + 10, clamp((tp - T - 1.5) / .35)), [F, X] = carry(tp, x, BY, 140, .22);
  F.alpha = 1 - ss(T + 1.55, T + 1.85, tp); F.inGate = x > GX - 120; F.eye = 'dot'; F.mouth = 'smile'; if (F.alpha <= 0) return null;
  return { F, X };
}

// ---------------- camera (on twos, like everything else) ----------------
const mixCam = Riso.mixCam;
function camAt(t) {
  let c = { x: meX(t) + 60 + 110 * ss(4.3, 5.4, t), y: 940, z: 1.0 };
  c = mixCam({ x: meX(t) + 40, y: 1010, z: 1.6 }, c, eio((t - 1.5) / 1.1));       // the hook: close on me (the saw in my hand), widening by ~2.6
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: cc.cutX + 120, y: 1060, z: 1.3 });
  c = mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = mixCam(c, mixCam(at(c2), at(c3), eio((t - 10.0) / .45)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));   // the gap stays out of frame until I reach it
  if (t >= 12) c = mixCam(c, { x: E + 290, y: 840, z: .88 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = mixCam(c, { x: E + 160, y: 980, z: 1.2 }, eio((t - 18.2) / .45));
  if (t >= B.fall) c = mixCam(c, { x: E + 130, y: 1090, z: 1.5 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .65) c = mixCam(c, { x: E + 140, y: 980, z: 1.2 }, eio((t - B.fall - .65) / .7));
  if (t >= B.back) c = mixCam(c, { x: E - 560, y: 1050, z: 1.22 }, eio((t - B.back) / .75));          // back along the road: pieces 3 and 2, big
  if (t >= 21.9) c = mixCam(c, { x: E - 1250, y: 930, z: .58 }, eio((t - 21.9) / .45));                 // on, pulling out: piece 1 far down the road
  if (t >= 22.42) c = mixCam(c, { x: E + 140, y: 990, z: 1.08 }, eio((t - 22.42) / .46));                // back to the gap, me at the lip, the outline
  if (t >= 22.9) c = mixCam(c, { x: E + 160, y: 1020, z: 1.3 }, eio((t - 22.9) / 3.2));
  [c.sx, c.sy] = Riso.shake(t, B.fall);                                                                  // the hit
  return c;
}

// ---------------- the world ----------------
const XFULL = () => ({ x: E + G + REST, y: FY + 34, a: -Math.PI, lie: true });   // my whole cross laid top-first: top on the near lip, foot on the far lip
const crossOutline = () => crossPoly(0, L, CBHL).map(([u, v]) => cpt(XFULL(), u, v));
function guide(ctx, t, k, al) {   // the hold: the dashed outline of my whole cross, drawn out from the near lip
  const x1 = E - REST - 4 + (L + 8) * k;
  ctx.save(); ctx.globalAlpha *= al; ctx.beginPath(); ctx.rect(E - REST - 10, FY - 200, x1 - (E - REST - 10), 400); ctx.clip();
  const ol = crossOutline(); ctx.fillStyle = 'rgba(247,232,170,.22)'; ctx.fill(pathOf(ol, true, false)); Riso.dashed(ctx, ol, t);
  ctx.restore();
}
function endGuide(ctx, t) {   // v2 ending: the outline over the still-open gap; its missing span lights one piece-length at a time
  const al = ss(22.45, 22.85, t); if (al <= 0) return;
  ctx.save(); ctx.globalAlpha *= al;
  const X = XFULL(), u0 = L * (1 - S.left[3]);
  ctx.fillStyle = 'rgba(247,232,170,.12)'; ctx.fill(pathOf(crossPoly(u0, L, CBHL).map(([u, v]) => cpt(X, u, v)), true, false));   // where mine lay: a faint ghost
  for (const c of CUTS) {
    const at = SLOTAT[c.k], on = ss(at, at + .14, t);
    if (on <= 0) continue;
    const sl = crossPoly(c.u0 + 2, c.u1 - 2, CBHL).map(([u, v]) => cpt(X, u, v)), mid = cpt(X, (c.u0 + c.u1) / 2);
    glow(ctx, mid[0], mid[1], 120, .55 * on); ctx.fillStyle = 'rgba(241,199,94,' + (.62 * on) + ')'; ctx.fill(pathOf(sl, true, false));
  }
  Riso.dashed(ctx, crossOutline(), t);
  for (const c of CUTS) { if (t < SLOTAT[c.k]) continue; const a = cpt(X, c.u1, -PW / 2 - 8), b = cpt(X, c.u1, PW / 2 + 8);   // the joins between slots
    if (c.k) ink(ctx, [a, b], { closed: false, lw: 3.4, single: true, col: C.cream }); }
  ctx.restore();
}
function world(ctx, t, x0, x1) {
  ROAD.draw(ctx, x0, x1);
  const near = x1 > E - 200;
  const D = near ? Riso.arch(ctx, GX, BY + 4, t) : null;   // the far side: a plain arched door, open, yellow light inside
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  if (D) { ctx.save(); ctx.clip(pathOf(D.op, true, false));
    for (const P of pils) if (P.F && P.F.inGate) drawKid(ctx, P.F, P.X ? () => drawCross(ctx, P.X, P.X.u0, L, false) : null, null);
    ctx.restore(); D.draw(); }
  for (const P of pils) if (P.B) drawCross(ctx, P.B, 0, L, false);
  for (const P of pils) if (!P.F.inGate && P.X && !P.X.lie) drawCross(ctx, P.X, P.X.u0, L, false);
  pils.slice().sort((a, b) => a.F.hip[0] - b.F.hip[0]).forEach(P => {
    if (P.F.inGate) return; const X = P.X;
    drawKid(ctx, P.F, null, X && X.lie ? () => drawCross(ctx, X, X.u0, L, false) : null);
  });
  // the outline shows the missing span while my short cross hangs off the lip, and again at the end
  if (t >= 18.75 && t < 19.75) guide(ctx, t, eio((t - 18.75) / .35), 1 - ss(19.4, 19.75, t));
  endGuide(ctx, t);
  // the saw I left on the road after the last cut
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip; drawSaw(ctx, lerp2(g0, SAWLIE.grip, k), lerp(CUT_ANG, SAWLIE.ang, k)); }
  for (const c of CUTS) if (t >= c.drop) {   // the pieces I cut: lying where they fell; each starts to glow softly as the camera reaches it
    const p = pieceAt(c, t), hl = ss(GLOWAT[c.k], GLOWAT[c.k] + .35, t), pu = 1 + .06 * Math.sin((t - GLOWAT[c.k]) * 4 + c.k);
    const far = c.k ? 1 : 1.5; if (hl > 0) { glow(ctx, p.cx, p.cy, 200 * pu * far, hl * .9); glow(ctx, p.cx, p.cy, 90 * far, hl * .85); }
    drawCross(ctx, p, c.u0, c.u1, true);
  }
  // me, my cross, the saw in my hand
  const M = poseMe(t), F = M.F; F.me = true;
  if (M.saw) F.held = () => drawSaw(ctx, M.saw.grip, M.saw.ang);
  drawKid(ctx, F, M.X && !M.X.lie ? () => drawCross(ctx, M.X, M.X.u0, L, true) : null, () => {
    if (M.X && M.X.lie) drawCross(ctx, M.X, M.X.u0, L, true);
    if (M.kerf) { const lwk = Riso.lwk(); ctx.fillStyle = C.ink; ctx.fillRect(M.c.cutX - 2 * lwk, M.c.y - PW / 2, 4 * lwk, M.kerf.kp * PW * .92 + .5); }
  });
  // my cross over the edge: tips, falls (clipped to the gap so it drops in between the lips)
  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { ctx.save(); if (FX.clip) { ctx.beginPath(); ctx.rect(E + 2, -4000, G - 4, 9000); ctx.clip(); } drawCross(ctx, FX, FX.u0, L, true, FX.alpha ?? 1); ctx.restore(); }
  Riso.chips(ctx, t, FLECKS);
  return M;
}

// ---------------- comic marks (world space, around me) ----------------
function marks(ctx, t, M) {
  const F = M.F, { hc } = headFrame(F), s = F.s;
  const heavy = 1 - ss(3.05, 3.25, t);   // sweat + gloom while heavy (0–3.2)
  if (heavy > 0) { ctx.save(); ctx.globalAlpha *= heavy; Riso.sweat(ctx, hc, s, t); Riso.gloom(ctx, hc, s); ctx.restore(); }
  if (M.shock) Riso.ticks(ctx, hc, s, ss(12.05, 12.2, t) * (1 - ss(13.2, 13.4, t)), 1);   // surprise ticks at the gap
  if (M.look) Riso.ticks(ctx, hc, s, ss(21.5, 21.65, t) * (1 - ss(22.4, 22.6, t)), -1);
  const run = Pilot.win(t, 4.7, 8.7, .25, .3);   // running: squiggle lines behind, heel puffs
  if (run > 0) { Riso.runLines(ctx, F, run); Riso.puffs(ctx, F, FY, run); }
  if (M.kerf) { const c = M.c; for (let i = 0; i < 2; i++) { const an = -2.4 + i * .5, x = c.cutX, y = c.y - 40; ink(ctx, [[x + Math.cos(an) * 46, y + Math.sin(an) * 46], [x + Math.cos(an) * 74, y + Math.sin(an) * 74]], { closed: false, lw: 4.5, single: true }); } }   // effort ticks while sawing
}

// ---------------- inset panel: my face while it hangs short / falls (screen space) ----------------
function panelFace(ctx, x0, y0, w, h, t) {
  const a0 = 18.75, shock = ss(B.fall - .05, B.fall + .05, t), sad = ss(20.4, 20.6, t);
  const ang = lerp(.22, -.1, shock) + sad * .3, hc = [x0 + 196, y0 + 166 - shock * 10];
  const hu = [Math.sin(ang), -Math.cos(ang)], hf = [Math.cos(ang), Math.sin(ang)], HF = (u, v) => [hc[0] + 1.5 * (u * hf[0] + v * hu[0]), hc[1] + 1.5 * (u * hf[1] + v * hu[1])];
  ink(ctx, [[x0 + 20, y0 + h + 30], [x0 + 46, y0 + 226], [x0 + 130, y0 + 200], [x0 + 230, y0 + 200], [x0 + 300, y0 + 226], [x0 + 330, y0 + h + 30]], { fill: C.cream, lw: 7 });
  ink(ctx, [[x0 + 90, y0 + 214], [x0 + 140, y0 + 232], [x0 + 220, y0 + 228], [x0 + 260, y0 + 210], [x0 + 250, y0 + 250], [x0 + 100, y0 + 252]], { fill: C.cream, lw: 6 });   // the scarf at the neck
  for (const u of [130, 175, 220]) ink(ctx, [[x0 + u, y0 + 226], [x0 + u + 16, y0 + 226], [x0 + u + 16, y0 + 252], [x0 + u, y0 + 252]], { fill: C.ink, lw: 0, smooth: false, mx: 0, my: 0 });
  ink(ctx, Riso.FACE.map(q => HF(q[0], q[1])), { fill: C.cream, lw: 7 });
  const tD = tone(true, x0, y0);
  ink(ctx, Riso.BEANIE.map(q => HF(q[0], q[1])), { fill: C.cream, lw: 7 });
  ink(ctx, Riso.FOLD.map(q => HF(q[0], q[1])), { fill: C.cream, tone: tD, smooth: false, step: 10, lw: 7 });
  ink(ctx, ell(0, 0, 15, 14, 14).map(q => HF(q[0] - 6, q[1] + 102)), { fill: C.cream, lw: 6 });
  ink(ctx, [HF(-30, -2), HF(-40, -12), HF(-34, -28), HF(-24, -22)], { closed: false, lw: 6, single: true });
  if (shock < .5) { const e = HF(32, -10); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(e[0], e[1], 9, 11, 0, 0, TAU); ctx.fill();
    ink(ctx, [HF(20, 6), HF(32, 11), HF(43, 4)], { closed: false, lw: 5, single: true });
    ink(ctx, [HF(36, -36), HF(41, -33), HF(46, -37), HF(51, -33)], { closed: false, lw: 5, single: true, smooth: false });
    const sd = HF(-34, 62), ph = ((t - a0) * 1.5) % 1; ink(ctx, [[sd[0] - 30, sd[1] - 6 + ph * 20], [sd[0] - 22, sd[1] - 28 + ph * 20], [sd[0] - 14, sd[1] - 6 + ph * 20], [sd[0] - 22, sd[1] + 2 + ph * 20]], { fill: C.cream, lw: 5, step: 6, single: true }); }
  else if (sad < .5) { const e = HF(32, -9); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(e[0], e[1], 15, 17, 0, 0, TAU); ctx.fill(); ctx.fillStyle = C.cream; ctx.beginPath(); ctx.arc(e[0] + 5, e[1] - 6, 4.5, 0, TAU); ctx.fill();
    ink(ctx, ell(...HF(45, -36), 8, 10, 12), { fill: C.ink, lw: 4, single: true });
    for (let i = 0; i < 3; i++) { const an = -1.2 + i * .45, c = HF(72, 40); ink(ctx, [[c[0] + Math.cos(an) * 24, c[1] + Math.sin(an) * 24], [c[0] + Math.cos(an) * 60, c[1] + Math.sin(an) * 60]], { closed: false, lw: 6, single: true }); }
    for (let i = 0; i < 4; i++) { const q = HF(-52 + i * 20, 118); ink(ctx, [[q[0], q[1] - 6], [q[0] + 3, q[1] + 18]], { closed: false, lw: 5, single: true }); } }
  else { ink(ctx, [HF(23, -17), HF(32, -20), HF(42, -17)], { closed: false, lw: 6, single: true });
    ink(ctx, [HF(38, -38), HF(46, -33), HF(53, -38)], { closed: false, lw: 5, single: true });
    for (let i = 0; i < 3; i++) { const q = HF(-30 + i * 26, 120); ink(ctx, [[q[0], q[1]], [q[0] + 4, q[1] + 13], [q[0] - 2, q[1] + 26], [q[0] + 3, q[1] + 38]], { closed: false, lw: 5, single: true }); } }
}

// ---------------- frame ----------------
const crossStamp = (ctx, y0) => Riso.stamp(ctx, 540, y0 + 70, .16 * 1.9, -Math.PI / 2, c => {   // a small yellow cross stamped above the title
  c.translate(-L * .5, 0); ink(c, crossPoly(0, L, CBH), { fill: C.yel, smooth: false, lw: 5.5 }); });
function scene(ctx, t) {
  Riso.boil(t);
  const cm = camAt(t);
  Riso.field(ctx, cm);
  Riso.sky(ctx, cm, t);
  const z = Riso.cam(ctx, cm, 1);
  const x0 = cm.x - 540 / z - 60, x1 = cm.x + 540 / z + 60;
  const M = world(ctx, t, x0, x1);
  marks(ctx, t, M);
  Riso.screen(ctx);
  if (t >= B.fall) { const sx = 540 + (E + 60 - cm.x) * cm.z, sy = 960 + (FY + 40 - cm.y) * cm.z; Riso.focus(ctx, sx, sy, 1 - ss(B.fall + .3, B.fall + .55, t)); }   // the hit
  Riso.inset(ctx, t, 18.75, 21.05, [520, 572, 420, 290], (c, x0, y0, w, h) => panelFace(c, x0, y0, w, h, t));
  Riso.endPlate(ctx, t, B.end, { stamp: crossStamp });
  Riso.grain(ctx, cm);
}
function draw(ctx, t) {
  Riso.onTwos(ctx, t, scene);
  if (t < B.end) Riso.captions(ctx, t, S.lines);
  Riso.endCard(ctx, t, S.endCard, B.end);
}

Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: Riso.FONTS, init, draw });
</script>
