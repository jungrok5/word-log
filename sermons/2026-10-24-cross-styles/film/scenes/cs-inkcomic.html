<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* ---- hand-drawn toolkit (shared by the lab-* hand-drawn scenes; inlined at build time) ----
   Lines are variable-width ribbons built from densely sampled polylines: a static hand wobble per stroke (seeded),
   a boil displacement per drawing (3 drawings cycled on 8–12 fps), pressure along the length, tapered ends, ragged
   edges. Ink is laid on a white layer that is multiplied onto a paper whose tooth is a real height field, so ink drops
   out in the valleys and pencil only catches the peaks. */
const TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
const HD = {};
HD.hash = (i, s = 0) => { let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
HD.t12 = t => Math.floor(t * 12 + 1e-6) / 12;
HD.spline = (P, step = 3, closed = false) => {
  const n = P.length; if (n < 2) return P.map(p => p.slice());
  const get = i => closed ? P[((i % n) + n) % n] : P[clamp(i, 0, n - 1)];
  const out = [], segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), m = Math.max(1, Math.ceil(L / step));
    for (let j = 0; j < m; j++) { const t = j / m, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3))); }
  }
  out.push(closed ? out[0].slice() : P[n - 1].slice()); return out;
};
HD.seg = (a, b, step = 4) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]), m = Math.max(1, Math.ceil(L / step)), o = [];
  for (let i = 0; i <= m; i++) o.push([lerp(a[0], b[0], i / m), lerp(a[1], b[1], i / m)]); return o; };
HD.poly = (P, closed = false, step = 4) => { const o = []; const n = P.length, m = closed ? n : n - 1; for (let i = 0; i < m; i++) { const sg = HD.seg(P[i], P[(i + 1) % n], step); if (i) sg.shift(); o.push(...sg); } return o; };
HD.arc = (cx, cy, rx, ry, a0, a1, step = 4, rot = 0) => { const L = Math.abs(a1 - a0) * Math.max(rx, ry), m = Math.max(2, Math.ceil(L / step)), o = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i <= m; i++) { const a = lerp(a0, a1, i / m), x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push([cx + x * c - y * s, cy + x * s + y * c]); } return o; };
HD.normals = pts => pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
HD.lengths = pts => { const s = [0]; for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return s; };
// hand wobble: perpendicular low-frequency displacement
HD.wob = (pts, seed, amp, wl = 120) => { if (!amp || pts.length < 2) return pts; const N = HD.normals(pts), Sx = HD.lengths(pts), oy = (seed * 17.37) % 997;
  return pts.map((p, i) => { const d = (noise(Sx[i] / wl, oy) - .5) * 2 * amp; return [p[0] + N[i][0] * d, p[1] + N[i][1] * d]; }); };
// one boiled drawing: a new wobble + a tiny drift, per drawing index f
HD.boil = (pts, seed, f, amp, wl = 90) => { if (!amp) return pts; const s = (seed * 31 + f * 977) | 0, dx = (HD.hash(s, 1) - .5) * amp, dy = (HD.hash(s, 2) - .5) * amp;
  return HD.wob(pts, s, amp, wl).map(p => [p[0] + dx, p[1] + dy]); };
HD.xf = (pts, m) => pts.map(p => [m.a * p[0] + m.c * p[1] + m.e, m.b * p[0] + m.d * p[1] + m.f]);   // apply a DOMMatrix-like
HD.mat = (x, y, rot = 0, sx = 1, sy = sx) => { const c = Math.cos(rot), s = Math.sin(rot); return { a: c * sx, b: s * sx, c: -s * sy, d: c * sy, e: x, f: y }; };
HD.mul = (A, Bm) => ({ a: A.a * Bm.a + A.c * Bm.b, b: A.b * Bm.a + A.d * Bm.b, c: A.a * Bm.c + A.c * Bm.d, d: A.b * Bm.c + A.d * Bm.d, e: A.a * Bm.e + A.c * Bm.f + A.e, f: A.b * Bm.e + A.d * Bm.f + A.f });
HD.pt = (m, x, y) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
// variable-width ribbon (round caps where the end is wide)
HD.ribbon = (pts, wf) => {
  const n = pts.length, N = HD.normals(pts), Sx = HD.lengths(pts), L = Sx[n - 1] || 1, Lf = [], Rt = [], ws = [];
  for (let i = 0; i < n; i++) { const w = Math.max(0, wf(Sx[i] / L, Sx[i], i, L)) / 2; ws.push(w); Lf.push([pts[i][0] + N[i][0] * w, pts[i][1] + N[i][1] * w]); Rt.push([pts[i][0] - N[i][0] * w, pts[i][1] - N[i][1] * w]); }
  const p = new Path2D(); p.moveTo(Lf[0][0], Lf[0][1]); for (let i = 1; i < n; i++) p.lineTo(Lf[i][0], Lf[i][1]);
  const ae = Math.atan2(N[n - 1][1], N[n - 1][0]); if (ws[n - 1] > .4) p.arc(pts[n - 1][0], pts[n - 1][1], ws[n - 1], ae, ae + Math.PI, true); else p.lineTo(Rt[n - 1][0], Rt[n - 1][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(Rt[i][0], Rt[i][1]);
  const a0 = Math.atan2(N[0][1], N[0][0]); if (ws[0] > .4) p.arc(pts[0][0], pts[0][1], ws[0], a0 + Math.PI, a0, true);
  p.closePath(); return p;
};
// an ink line: o = { w, ts, te (taper lengths px), mn (tip width fraction), press, pw (pressure wavelength), rough, seed, col, dry }
HD.ink = (ctx, pts, o = {}) => {
  if (!pts || pts.length < 2) return;
  const w = o.w ?? 8, ts = o.ts ?? w * 2.5, te = o.te ?? w * 3.5, mn = o.mn ?? .2, press = o.press ?? .3, pw = o.pw ?? 70, rough = o.rough ?? .08, seed = o.seed ?? 1, mnE = o.mnE ?? mn;
  const wf = (u, s, i, L) => { const k = Math.min(1, mn + (1 - mn) * ss(0, ts, s)) * Math.min(1, mnE + (1 - mnE) * ss(0, te, L - s));
    return w * k * (1 + press * (noise(s / pw, seed * 3.7 % 500) - .5) * 2) * (1 + rough * (HD.hash(i, seed) - .5) * 2); };
  ctx.fillStyle = o.col || '#151312'; ctx.fill(HD.ribbon(pts, wf));
  if (o.blob) { ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], w * o.blob, 0, TAU); ctx.fill(); }   // a marker resting a moment at the start
  if (o.dry) {   // dry-brush streaks in the tail: thin paper-white lines along the stroke
    const N = HD.normals(pts), Sx = HD.lengths(pts), L = Sx[Sx.length - 1], r = rng(seed * 7 + 3);
    ctx.save(); ctx.strokeStyle = o.paper || '#fff'; ctx.lineCap = 'round';
    for (let k = 0; k < (o.dryN || 4); k++) { const f = (r() - .5) * .7, u0 = 1 - o.dry * (.3 + .7 * r()); ctx.lineWidth = (o.dryW || 1) * (.5 + r() * .7); ctx.globalAlpha = .55 + r() * .45; ctx.beginPath(); let st = false;
      for (let i = 0; i < pts.length; i++) { const u = Sx[i] / L; if (u < u0) continue; const ww = wf(u, Sx[i], i, L) * f; const x = pts[i][0] + N[i][0] * ww, y = pts[i][1] + N[i][1] * ww; if (!st) { ctx.moveTo(x, y); st = true; } else ctx.lineTo(x, y); }
      ctx.stroke(); }
    ctx.restore();
  }
};
// a closed hand shape: fill (paper white or colour) — the outline is drawn separately with HD.ink
HD.fillPts = (ctx, pts, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); };
HD.pathOf = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (const q of pts) p.lineTo(q[0], q[1]); p.closePath(); return p; };

// ---- paper: a tooth height field (full frame) → paper colour, ink dropout (white specks), pencil deposit masks ----
HD.tooth = (seed = 1, s1 = 6, s2 = 2.2, fib = 0) => {
  const T = new Float32Array(W * H), r = rng(seed), ox = r() * 500, oy = r() * 500;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = .62 * noise(x / s1 + ox, y / s1 + oy) + .38 * noise(x / s2 + oy, y / s2 + ox);
    T[y * W + x] = v; }
  if (fib) { // fibres: thin streaks raised a little
    for (let k = 0; k < fib; k++) { let x = r() * W, y = r() * H, a = r() * TAU; const l = 8 + r() * 30;
      for (let i = 0; i < l; i++) { a += (r() - .5) * .3; x += Math.cos(a); y += Math.sin(a); const xi = x | 0, yi = y | 0; if (xi >= 0 && yi >= 0 && xi < W && yi < H) T[yi * W + xi] = Math.min(1, T[yi * W + xi] + .18); } } }
  return T;
};
// paper canvas: base colour, low-frequency mottling, embossed tooth (light from top-left), fine grain, edge falloff
HD.paper = (T, o = {}) => {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), d = g.createImageData(W, H), D = d.data, base = o.base || [250, 249, 245];
  const mot = o.mott ?? 6, emb = o.emb ?? 26, gr = o.grain ?? 4, vig = o.vig ?? 0, r = rng(o.seed || 9), mscale = o.mscale || 260;
  const tint = o.tint || [0, 0, 0];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, x0 = Math.max(0, x - 1), y0 = Math.max(0, y - 1), x1 = Math.min(W - 1, x + 1), y1 = Math.min(H - 1, y + 1);
    const sh = (T[y0 * W + x0] - T[y1 * W + x1]) * emb, m = (noise(x / mscale + 40, y / mscale + 7) - .5) * 2 * mot;
    const dx = (x / W - .5), dy = (y / H - .5), v = -vig * (dx * dx * 1.4 + dy * dy) * 4;
    const n = (r() - .5) * gr, k = sh + m + n + v;
    D[i * 4] = base[0] + k + tint[0] * m / (mot || 1); D[i * 4 + 1] = base[1] + k + tint[1] * m / (mot || 1); D[i * 4 + 2] = base[2] + k + tint[2] * m / (mot || 1); D[i * 4 + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
};
// a full-frame canvas of colour `col` whose alpha follows the tooth: mode 'peak' (pencil catches the peaks) or 'valley' (ink misses the valleys)
HD.toothMask = (T, col, mode = 'valley', thr = .35, soft = .18, amax = 1) => {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), d = g.createImageData(W, H), D = d.data, rgb = Pilot.hex(col);
  for (let i = 0; i < W * H; i++) { const v = mode === 'peak' ? (T[i] - thr) / soft : (thr - T[i]) / soft, a = clamp(v) * amax;
    D[i * 4] = rgb[0]; D[i * 4 + 1] = rgb[1]; D[i * 4 + 2] = rgb[2]; D[i * 4 + 3] = a * 255; }
  g.putImageData(d, 0, 0); return c;
};
// layers: a white canvas you draw ink on, then multiply onto the frame
HD.layer = () => { const c = Pilot.canvas(W, H), g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round'; return { c, g }; };
HD.clearWhite = (g, x = 0, y = 0, w = W, h = H) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.fillStyle = '#fff'; g.fillRect(x, y, w, h); g.restore(); };
HD.dropout = (g, mask, a = 1, x = 0, y = 0, w = W, h = H) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = a; g.drawImage(mask, x, y, w, h, x, y, w, h); g.restore(); };
HD.multiply = (ctx, c, x = 0, y = 0, w = W, h = H, a = 1) => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = a; ctx.drawImage(c, x, y, w, h, x, y, w, h); ctx.restore(); };

// walk: distance along x with a slowing stop (speed 1 → 0 over the last `dec` fraction), from a lookup table
HD.walker = (x0, x1, T, dec = .3) => { const n = 400, tab = [0]; let s = 0; for (let i = 1; i <= n; i++) { const u = i / n; s += 1 - ss(1 - dec, 1, u); tab.push(s); }
  return t => { if (t <= 0) return x0 + (t / T) * n * (x1 - x0) / tab[n]; if (t >= T) return x1; const f = t / T * n, i = Math.floor(f), k = f - i; return x0 + (x1 - x0) * lerp(tab[i], tab[Math.min(n, i + 1)], k) / tab[n]; }; };

/* cs-inkcomic — 잘라 낸 건 다리였다 in the style lab's minimal ink comic (lab-inkcomic.html, ref 16): a wobbly, slightly
   blobby black marker line on white paper, lots of white, deadpan. Bears plod along a road, each with a wooden cross
   strapped upright on its back like a mast. I am the bear in black line; the others are drawn in a grey line (quieter).
   My cross is the one colour on the page — the lab's pale-warm beam yellow; the only other colour is the door's light
   across the gap. I hold a saw in my teeth from frame 0. Sawing is done the deadpan bear way: the cross tipped off onto
   the road, a forepaw pinning it, the saw in my teeth, the whole bear rocking along the blade. A shorter cross stands
   visibly lower on my back. The road ends at a gap drawn as the road simply stopping and two cliff lines going down;
   the others tip their crosses forward across it like drawbridges, walk over, bite the end, haul it back, flip it up
   and walk into the door. Mine tips forward — short. At the end the pieces on the road light up (beam yellow, pulse
   ticks) and fly into a dashed outline of my cross. Poses on 12 fps, drawings boil on 8 fps, camera on ones. */
const INK = '#141414', GREYI = '#9a9a9a', PAPER = '#ffffff', WARM = '#f7d27a', WARMF = '#e9b955', LIGHT = 'rgba(253,226,140,';
const bf = t => Math.floor(t * 8 + 1e-6) % 3;
const t12 = t => Math.floor(t * 12 + 1e-6) / 12;
const frac = x => x - Math.floor(x);
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const TX = {};
let MW = 9, ZK = 1, CAM = HD.mat(0, 0), GREY = false, F8 = 0;   // marker width (screen px), camera matrix, current line colour
const cam = pts => HD.xf(pts, CAM);
function mk(g, pts, seed, o = {}) { if (pts.length < 2) return; HD.ink(g, HD.boil(HD.wob(pts, seed, o.wob ?? 3, 150), seed, F8, o.boil ?? 1.6, 90),
  { w: MW, ts: 6, te: 8, mn: .78, press: .16, pw: 110, rough: .07, seed, col: GREY ? GREYI : INK, blob: .58, ...o, w: (o.w ?? 9) * MW / 9 }); }
function fillC(g, pts, seed, col = PAPER) { HD.fillPts(g, HD.boil(pts, seed, F8, 1.2, 80), col); }
function tube(g, pts, w, seed) { const q = HD.boil(HD.spline(pts, 3), seed, F8, 1.2, 70);
  HD.ink(g, q, { w: w + 2 * MW, ts: 26, te: 2, mn: .3, mnE: 1, press: .05, rough: .05, seed, col: GREY ? GREYI : INK });
  HD.ink(g, q, { w, ts: 34, te: 2, mn: .05, mnE: 1, press: .02, rough: 0, seed: seed + 1, col: PAPER }); }
function tubeNear(g, pts, w, seed, clipOut) { const q = HD.boil(HD.spline(pts, 3), seed, F8, 1.2, 70);
  g.save(); g.clip(clipOut, 'evenodd'); HD.ink(g, q, { w: w + 2 * MW, ts: 2, te: 2, mn: 1, press: .05, rough: .05, seed, col: GREY ? GREYI : INK }); g.restore();
  HD.ink(g, q, { w, ts: 2, te: 2, mn: 1, press: .02, rough: 0, seed: seed + 1, col: PAPER }); }

// ---------------- the world's measures ----------------
const SC = .95;                                        // the lab's bear, a touch smaller
const L = 420, PW = 26, CBX = 300, CBH = 80, CBW = 26;  // a cross: post length/width, crossbar at CBX from the foot
const PWL = 12, PFACE = 8, CBHL = 26;                  // lying flat on the road (seen a little from above)
const REST = 30, GAP = L - 2 * REST;                   // a whole cross rests 30 on each lip
const FY = 1388, BY = 1322, G1 = 1404, GB = 1286;      // my feet, the others' feet; the road's front and back edges
let E = 1500, GX = 0;

// ---------------- crosses ----------------
// X = { x, y, a, k, u0, u1 } — (x, y) the foot end, a the post's angle (foot → top), k 0 upright … 1 lying flat
function crossLocal(u0, u1, k) {
  const hb = lerp(CBH, CBHL, k), pw = lerp(PW, PWL, k) / 2, bar = u0 < CBX - CBW / 2 && u1 > CBX + CBW / 2, o = [[u0, -pw]];
  if (bar) o.push([CBX - CBW / 2, -pw], [CBX - CBW / 2 - k * 10, -hb], [CBX + CBW / 2 - k * 10, -hb], [CBX + CBW / 2, -pw]);
  o.push([u1, -pw], [u1, pw]);
  if (bar) o.push([CBX + CBW / 2, pw], [CBX + CBW / 2 + k * 10, hb], [CBX - CBW / 2 + k * 10, hb], [CBX - CBW / 2, pw]);
  o.push([u0, pw]); return o;
}
const xpt = (X, u, v = 0) => { const c = Math.cos(X.a), s = Math.sin(X.a); return [X.x + u * c - v * s, X.y + u * s + v * c]; };
function drawCross(g, X, mine, o = {}) {
  const u0 = X.u0 || 0, u1 = X.u1 ?? L; if (u1 - u0 < 1) return;
  const k = X.k || 0, pts = crossLocal(u0, u1, k).map(([u, v]) => xpt(X, u, v)), sd = (o.seed || 500) + (mine ? 0 : 40);
  if (k > .05) { const fr = pts.map(p => [p[0], p[1] + PFACE * k]); fillC(g, cam(fr), sd + 1, mine ? WARMF : PAPER); mk(g, HD.poly(cam(fr), true, 5), sd + 2, { w: 7, mn: .9 }); }
  fillC(g, cam(pts), sd + 3, mine ? WARM : PAPER);
  mk(g, HD.poly(cam(pts), true, 5), sd + 4, { w: 8, mn: .9 });
  // a knot and a grain line on the post
  for (const [ua, ub] of [[50, 120], [190, 250]]) if (ua > u0 + 8 && ub < u1 - 8) mk(g, cam([xpt(X, ua, -PW * .12 * (1 - k * .5)), xpt(X, ub, PW * .1 * (1 - k * .5))]), sd + ua, { w: 4, mn: .4, blob: 0 });
}
function rotAbout(X, pv, th) { const ox = X.x - pv[0], oy = X.y - pv[1]; return { ...X, x: pv[0] + ox * Math.cos(th) - oy * Math.sin(th), y: pv[1] + ox * Math.sin(th) + oy * Math.cos(th), a: X.a + th }; }
const mixX = (A, Bx, k) => { if (k <= 0) return A; if (k >= 1) return Bx; let b = Bx.a; while (b - A.a > Math.PI) b -= TAU; while (b - A.a < -Math.PI) b += TAU;   // the short way round
  return { ...Bx, x: lerp(A.x, Bx.x, k), y: lerp(A.y, Bx.y, k), a: lerp(A.a, b, k), k: lerp(A.k || 0, Bx.k || 0, k) }; };
const lying = (x, y, u0 = 0, u1 = L, a = 0) => ({ x, y, a, k: 1, u0, u1 });

// ---------------- the bear (the lab's bear, any pose) ----------------
// F = { x, gy, f, rot, sag, head (nose-down rotation), ph (walk phase), stride, lift, legs: [4 world feet] | null, pin (world point for the near
//       forepaw), face: 'calm'|'strain'|'shock'|'look'|'happy'|'down', grey, alpha, saw: { ang } (in the mouth), back: { u0 } (cross on the back) }
const BODY = HD.spline([[156, 6], [96, 48], [0, 56], [-100, 50], [-162, 10], [-176, -44], [-140, -104], [-40, -128], [60, -126], [118, -94]], 4);
const HEAD = HD.spline([[112, -96], [150, -122], [204, -112], [244, -80], [272, -62], [268, -36], [238, -24], [200, -6], [156, 6]], 3);
const LEGX = [92, 112, -100, -78];                    // near fore, far fore, near hind, far hind (body-local x of the hip)
function bodyM(F) { return HD.mul(HD.mat(F.x, F.gy - 150 * SC + (F.sag || 0) - (F.lift || 0), (F.rot || 0) * F.f), HD.mat(0, 0, 0, F.f * SC, SC)); }
function headM(Mb, F) { return HD.mul(Mb, HD.mul(HD.mat(126, -48, F.head || 0), HD.mat(-126, 48))); }
const MOUTH = [244, -22], BACKPT = [-24, -124];

  const LAY = tag({ ...standSpec(EX, BY, 1, { head: .45, rot: .1, sag: 12 }) }); LAY.legs = legsOf(LAY); LAY.legs[0] = [E - REST + 8, yb - PWL / 2 - 2];
  if (t < T) { const F0 = carry(EX), k = eio((tp - T + .35) / .35), F = tag(mixSpec({ ...F0, back: null }, LAY, k)); F.behind = () => drawCross(INKG, mixX(backCross(F0, 0), XB, eio((t - T + .35) / .35)), false); return { F }; }
  const xs0 = EX + 40, xs1 = E + GAP + 230, top = yb - PWL / 2 - 4;
  if (t < T + .8) { const x = lerp(xs0, xs1, eio(clamp((tp - T - .1) / .7))), on = x - 180 < E + GAP && x + 160 > E;
    const F = tag(walkSpec(x, on ? top : BY, 1, P.ph + x / 120, { stride: 26, head: .2, sag: 0 })); return { F, bridge: XB, onBridge: on }; }
  // from the far side: turn round, bite the top end, back away hauling it across, flip it up onto the back
  const pullX = k => ({ ...XB, x: XB.x + PULL * k, a: -.06 * k });
  const PULLS = k => { const X = pullX(k), F = tag(standSpec(0, BY, -1, { head: .5, rot: .08, sag: 6 })); F.x = 0; const m = mouthAt(F), tip = xpt(X, L - 8);
    F.x = tip[0] - m[0]; F.sag += tip[1] - m[1] - 4; F.legs = legsOf({ ...F, moving: true, ph: k * 1.5, stride: 14 }); F.legs = F.legs.map(p => [p[0], BY]); return [F, X]; };
  if (t < T + 1.15) { const k = eio(clamp((tp - T - .8) / .35)), [F, X] = PULLS(k), k0 = eio((tp - T - .8) / .12);
    return { F: k0 < 1 ? tag(mixSpec(standSpec(xs1, BY, 1), F, k0)) : F, bridge: X }; }
  const [Fp, Xp] = PULLS(1);
  if (t < T + 1.35) { const k = eio((tp - T - 1.15) / .2), Fc = carry(Fp.x - 40), F = tag(mixSpec(Fp, { ...Fc, back: null }, k)); F.f = k < .5 ? -1 : 1;
    F.behind = () => drawCross(INKG, mixX(Xp, backCross(Fc, 0), k), false); return { F }; }
  const x = lerp(Fp.x - 40, GX, clamp((tp - T - 1.35) / .45)), F = carry(x, { stride: 26, head: .05 });
  F.alpha = 1 - ss(T + 1.55, T + 1.85, t); if (F.alpha <= 0) return null; F.inGate = x > GX - 120;
  return { F };
}

// ---------------- camera ----------------
const mixCam = (a, b, k) => k <= 0 ? a : k >= 1 ? b : { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), z: lerp(a.z, b.z, k) };
function camAt(t) {
  let c = { x: meX(t) + 160 + 160 * ss(4.3, 5.4, t), y: 1060, z: .82 };
  c = mixCam({ x: meX(t) + 120, y: 975, z: 1.18 }, c, eio((t - 1.2) / 1.4));          // the hook: close on me, the saw in my teeth; widening by ~2.6
  const at = cc => ({ x: cc.cutX + 120, y: 1010, z: 1.05 });
  c = mixCam(c, at(CUTS[0]), Pilot.win(t, CUTS[0].s - .05, CUTS[0].up1 + .25, .32, .35));
  c = mixCam(c, mixCam(at(CUTS[1]), at(CUTS[2]), eio((t - 9.9) / .55)), Pilot.win(t, CUTS[1].s - .1, CUTS[2].up1 + .2, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 30 + 1600 * ss(11.5, 12.4, t) * ss(11.5, 12.4, t));
  if (t >= 12) c = mixCam(c, { x: E + 260, y: 1080, z: .74 }, eio((t - 12.05) / .95));
  if (t >= 18.1) c = mixCam(c, { x: E + 120, y: 1140, z: .95 }, eio((t - 18.1) / .5));
  if (t >= B.fall) c = mixCam(c, { x: E + 110, y: 1260, z: 1.3 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .6) c = mixCam(c, { x: E + 100, y: 1140, z: .95 }, eio((t - B.fall - .6) / .7));
  if (t >= B.back) c = mixCam(c, BACKCAM, eio((t - B.back) / .6));
  if (t >= 22.5) c = mixCam(c, { x: E + 120, y: 1150, z: .95 }, eio((t - 22.5) / 1.5));
  const k = 1 - ss(B.fall, B.fall + .55, t); c.sx = t >= B.fall ? 18 * k * Math.sin(t * 97) : 0; c.sy = t >= B.fall ? 13 * k * Math.sin(t * 131 + 1) : 0;
  return c;
}

// ---------------- the world ----------------
let INKL, INKG;
function road(g, cm, t) {   // the road: its front and back edges (stopping at the gap), a few dashes; the cliff lines going down
  const x0 = cm.x - 540 / cm.z - 60, x1 = cm.x + 540 / cm.z + 60, segs = [];
  const add = (a, b) => { a = Math.max(a, x0); b = Math.min(b, x1); if (b > a + 4) segs.push([a, b]); };
  add(-4000, E); add(E + GAP, 9000);
  let s = 700;
  for (const [a, b] of segs) {
    mk(g, cam(HD.seg([a, G1], [b, G1 - 2], 8)), s++, { w: 7, mn: .5, ts: 30, te: 30, wob: 3 });
    mk(g, cam(HD.seg([a, GB], [b, GB + 2], 8)), s++, { w: 5.5, mn: .4, ts: 40, te: 40, wob: 3 });
  }
  // dashes under the road (the lab's), placed on a fixed grid so they don't crawl
  for (let x = Math.floor(x0 / 260) * 260; x < x1; x += 260) { if (x > E - 140 && x < E + GAP + 40) continue; const r = HD.hash(x | 0, 5);
    mk(g, cam(HD.seg([x + r * 80, G1 + 34 + r * 20], [x + r * 80 + 50 + r * 40, G1 + 34 + r * 20], 4)), 800 + (x / 260 | 0), { w: 5, mn: .3, ts: 20, te: 20 }); }
  // the gap: two cliff lines down from both lips, strata ticks on the walls
  if (E + GAP > x0 && E < x1) {
    for (const [xx, dir, sd] of [[E, 1, 850], [E + GAP, -1, 860]]) {
      mk(g, cam(HD.spline([[xx, GB - 2], [xx + dir * 4, G1], [xx + dir * 10, G1 + 300], [xx + dir * 2, G1 + 700], [xx + dir * 14, G1 + 1100]], 6)), sd, { w: 8, mn: .6, ts: 10, te: 200 });
      for (let i = 0; i < 7; i++) { const y = G1 + 60 + i * 110 + HD.hash(i, sd) * 40; mk(g, cam(HD.seg([xx + dir * 10, y], [xx + dir * (40 + HD.hash(i, sd + 1) * 40), y + 30], 3)), sd + 10 + i, { w: 4.5, mn: .3, blob: 0 }); }
    }
    // the near lip's edge across the road band (the gap's top, seen a little from above)
    for (const [xx, sd] of [[E, 870], [E + GAP, 871]]) mk(g, cam(HD.seg([xx, GB], [xx + 2, G1], 4)), sd, { w: 6, mn: .6 });
  }
}
function drawDoor(g, t, fillPass) {
  const x = GX, gy = GB + 6, w = 86, h = 300, arch = (rw, hh) => { const o = [[x - rw, gy]]; for (let i = 0; i <= 18; i++) { const a = Math.PI + Math.PI * i / 18; o.push([x + Math.cos(a) * rw, gy - hh + rw + Math.sin(a) * rw]); } o.push([x + rw, gy]); return o; };
  if (fillPass) {   // the warm light inside (drawn before the figures who walk into it), with the lab's pulse ticks
    const pulse = .5 + .5 * Math.sin(t * TAU * 1.4);
    INKG.save(); INKG.globalCompositeOperation = 'multiply'; fillC(INKG, cam(arch(w, h)), 1300, LIGHT + (.75 + .15 * pulse) + ')');
    const spill = [[x - w, gy], [x + w, gy], [x + w + 120, G1 - 4], [x - w - 160, G1 - 4]]; fillC(INKG, cam(spill), 1301, LIGHT + (.35 + .1 * pulse) + ')'); INKG.restore();
    return;
  }
  mk(g, cam(HD.poly(arch(w + 22, h + 22), false, 5)), 1310, { w: 9 });
  mk(g, cam(HD.poly(arch(w, h), false, 5)), 1311, { w: 7.5 });
  const leaf = [[x + w, gy], [x + w + 70, gy + 26], [x + w + 70, gy - h + w + 30], [x + w, gy - h + w * .55]];   // the door leaf, standing open
  fillC(g, cam(leaf), 1312, PAPER); mk(g, HD.poly(cam(leaf), true, 5), 1313, { w: 7 });
  const kn = cam([[x + w + 54, gy - h * .42]])[0]; HD.fillPts(g, HD.arc(kn[0], kn[1], 6 * ZK, 6 * ZK, 0, TAU, 2), INK);
  const pulse = .5 + .5 * Math.sin(t * TAU * 1.4);
  if (pulse > .45) for (let i = 0; i < 7; i++) { const a = Math.PI + Math.PI * (i + .5) / 7, r0 = w + 42, r1 = w + 66, cy = gy - h + w;
    mk(g, cam(HD.seg([x + Math.cos(a) * r0, cy + Math.sin(a) * r0], [x + Math.cos(a) * r1, cy + Math.sin(a) * r1], 3)), 1320 + i, { w: 4.5, blob: 0, mn: .5 }); }
}
function guide(g, t, k, al, full) {   // the dashed outline of my whole cross across the gap
  const X = lying(E - REST, LIEY, 0, L, 0), sh = L * S.left[3];
  const pts = (full ? crossLocal(0, L, 1) : [[sh, -PWL / 2], [L, -PWL / 2], [L, PWL / 2], [sh, PWL / 2]]).map(([u, v]) => xpt(X, u, v)), sp = cam(pts);
  const x1 = cam([[E - REST - 6 + (L + 12) * k, 0]])[0][0];
  g.save(); g.beginPath(); g.rect(-100, -100, x1 + 100, 4000); g.clip(); g.globalAlpha = al;
  g.globalCompositeOperation = 'multiply'; fillC(g, sp, 1400, LIGHT + (full ? .35 : .25) + ')'); g.globalCompositeOperation = 'source-over';
  g.setLineDash([16, 12]); g.lineDashOffset = -t * 20; g.lineWidth = 4.5; g.strokeStyle = INK; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(sp[0][0], sp[0][1]); for (const p of sp) g.lineTo(p[0], p[1]); g.closePath(); g.stroke(); g.setLineDash([]); g.restore();
}
function ticks(g, c, t, R, seed, al) {   // the lab's pulse ticks around a glowing thing, on twos
  if (al <= .05) return; const pulse = .5 + .5 * Math.sin(t * TAU * 1.6 + seed);
  g.save(); g.globalAlpha = al; g.globalCompositeOperation = 'multiply';
  HD.fillPts(g, HD.arc(c[0], c[1], R * (.9 + .1 * pulse), R * .55 * (.9 + .1 * pulse), 0, TAU, 8), LIGHT + (.35 + .2 * pulse) + ')'); g.restore();
  g.save(); g.globalAlpha = al; for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + .2, r0 = R * .62, r1 = R * (.62 + .2 * pulse + .1);
    mk(g, [[c[0] + Math.cos(a) * r0, c[1] + Math.sin(a) * r0 * .7], [c[0] + Math.cos(a) * r1, c[1] + Math.sin(a) * r1 * .7]], seed + i, { w: 4.5, blob: 0, mn: .5 }); } g.restore();
}

function world(g, t, cm) {
  road(g, cm, t);
  drawDoor(g, t, true);
  const pils = [0, 1, 2].map(j => pilState(j, t)).filter(Boolean), M = poseMe(t);
  for (const P of pils) if (P.bridge) drawCross(g, P.bridge, false, { seed: 3000 + 50 });
  for (const P of pils) if (P.F.inGate) drawBear(g, P.F);
  drawDoor(g, t, false);
  pils.filter(P => !P.F.inGate).sort((a, b) => a.F.x - b.F.x).forEach(P => drawBear(g, P.F));
  if (t >= 18.65 && t < 19.75) guide(g, t, eio((t - 18.65) / .35), 1 - ss(19.4, 19.75, t), false);
  if (t >= B.fill[0] - .3) guide(g, t, eio((t - B.fill[0] + .3) / .5), 1, true);
  // the saw I spit out after the last cut
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .25), g0 = sawState(c3, c3.drop - .01).grip; drawSaw(g, lerp2(g0, [SAWLIE.x, SAWLIE.y - 14], k), lerp(CUT_ANG, Math.PI + .04, k), 950); }
  // the cut pieces where they fell; they light up when I look back, and fly into the outline
  for (const P of PIECES) if (t >= P.c.drop) {
    const X = pieceAt(P, t), cu = (P.u0 + P.u1) / 2, c = cam([xpt(X, cu)])[0];
    const hl = ss(B.back + .25 + (2 - P.c.k) * .15, B.back + .6 + (2 - P.c.k) * .15, t) * (1 - .6 * ss(FILL[P.c.k][1] + .2, FILL[P.c.k][1] + .9, t));
    if (hl > 0) ticks(g, c, t, 120 * cm.z + 30, 1500 + P.c.k * 20, hl);
    drawCross(g, X, true, { seed: 1600 + P.c.k * 30 });
    if (X.fly != null && X.fly < 1) for (let i = 1; i < 5; i++) { const b = cam([xpt(pieceAt(P, t - i * .05), cu)])[0], c2 = cam([xpt(pieceAt(P, t - i * .05 + .03), cu)])[0];   // speed lines
      mk(g, [b, c2], 1700 + i + P.c.k * 9, { w: 5 - i * .7, blob: 0, mn: .4 }); }
  }
  // my cross lying for a cut (with the kerf), and me
  if (M.lie) { drawCross(g, M.lie, true, { seed: 520 }); if (M.kerf != null && M.c) { const k0 = cam([[M.c.cutX, LIEY - PWL / 2]])[0], k1 = cam([[M.c.cutX, LIEY - PWL / 2 + M.kerf * (PWL + PFACE)]])[0]; mk(g, [k0, k1], 530, { w: 5, blob: 0, mn: 1 }); } }
  if (M.X) drawCross(g, M.X, true, { seed: 540 });
  drawBear(g, M.F);
  if (M.c && t >= M.c.drop && t < M.c.drop + .3) { const c = cam([[M.c.cutX - 10, LIEY]])[0];   // the clunk
    for (const [ax, ay, bx, by] of [[-30, -16, -64, -40], [-34, 10, -76, 12], [20, -22, 44, -54]]) mk(g, [[c[0] + ax * ZK, c[1] + ay * ZK], [c[0] + bx * ZK, c[1] + by * ZK]], 560 + ax, { w: 5, blob: 0, mn: .4 }); }
  // my short cross over the edge: tips, falls into the gap (clipped between the cliff lines), the crash lines
  const FX = fallX(t);
  if (FX && FX.al > 0) { g.save(); if (t >= B.fall) { const a = cam([[E + 6, 0]])[0][0], b = cam([[E + GAP - 6, 0]])[0][0]; g.beginPath(); g.rect(a, -100, b - a, 4000); g.clip(); }
    g.globalAlpha = FX.al; const sv = CAM; if (FX.s < 1) CAM = HD.mul(CAM, HD.mul(HD.mat(FX.c[0], FX.c[1], 0, FX.s), HD.mat(-FX.c[0], -FX.c[1])));
    drawCross(g, FX.X, true, { seed: 580 }); CAM = sv; g.restore(); }
  if (t >= B.fall - .02 && t < B.fall + .55) { const u = t - B.fall, c = cam([[E + 60, LIEY]])[0], k = 1 - ss(.25, .55, u);
    g.save(); g.globalAlpha = k; for (let i = 0; i < 9; i++) { const a = -Math.PI * (.08 + .84 * i / 8), r0 = (70 + 40 * eo(u / .3)) * ZK, r1 = r0 + (60 + 30 * HD.hash(i, 3)) * ZK;
      mk(g, [[c[0] + Math.cos(a) * r0, c[1] + Math.sin(a) * r0], [c[0] + Math.cos(a) * r1, c[1] + Math.sin(a) * r1]], 590 + i, { w: 7, blob: 0, mn: .4 }); } g.restore(); }
  // speed lines behind me while I gallop
  const run = Pilot.win(t, 4.8, 8.7, .2, .25) + Pilot.win(t, 11.4, 12.05, .1, .1);
  if (run > 0 && M.F) { g.save(); g.globalAlpha = Math.min(1, run); for (let i = 0; i < 4; i++) { const y = M.F.gy - (50 + i * 60) * SC, x = M.F.x - 220 * SC, l = 70 + HD.hash(i, Math.round(t * 8)) * 60;
    mk(g, cam([[x - l, y], [x, y]]), 600 + i, { w: 5, blob: 0, mn: .4 }); } g.restore(); }
}

// ---------------- frame ----------------
const HANDF = "'Gaegu',cursive";
function draw(ctx, t) {
  F8 = bf(t); const cm = camAt(t), g = INKL.g; INKG = g;
  ZK = cm.z; MW = 9 * Math.sqrt(clamp(cm.z, .6, 1.4));
  CAM = HD.mat(540 - cm.x * cm.z + cm.sx, 960 - cm.y * cm.z + cm.sy, 0, cm.z);
  ctx.drawImage(TX.paper, 0, 0);
  HD.clearWhite(g);
  world(g, t, cm);
  // the end: a clean sheet of the same paper, the card in the hand font
  const pe = ss(B.end - .2, B.end + .35, t);
  if (pe > 0) { g.save(); g.globalAlpha = pe; HD.clearWhite(g); g.restore(); if (pe > .5) { const sv = CAM; CAM = HD.mat(0, 0); mk(g, HD.seg([180, 1330], [900, 1326], 6), 1900, { w: 6, mn: .4, ts: 60, te: 60 }); CAM = sv; } }
  HD.dropout(g, TX.drop, .35);
  HD.multiply(ctx, INKL.c);
  ctx.save(); ctx.translate([0, 1, -1][F8], [0, -1, 1][F8]);
  if (t < B.end) Story.captions(ctx, t, S.lines, { font: HANDF, weight: 700, size: 78, y: 400, color: '#151515', srcFont: "'Noto Sans KR',sans-serif", srcColor: '#2a2a2a', shadow: 'rgba(255,255,255,.9)', shadowBlur: 10 });
  ctx.translate(540, 860); ctx.scale(1.2, 1.2); ctx.translate(-540, -860);
  Story.endCard(ctx, t, S.endCard, B.end, { font: HANDF, color: '#151515', srcFont: HANDF, srcColor: '#2a2a2a', y: 860, titleShadow: '' });
  ctx.restore();
}
async function init() {
  buildTimeline();
  const T = HD.tooth(8, 4, 1.5, 900);
  TX.paper = HD.paper(T, { base: [253, 253, 251], mott: 2, emb: 5, grain: 2, vig: .015 });
  TX.drop = HD.toothMask(T, '#ffffff', 'valley', .22, .07, .7);
  INKL = HD.layer();
  BACKCAM = (() => { const x0 = Math.min(...PIECES.map(P => P.x - P.u1)) - 80, x1 = E - 100, z = clamp(1080 / (x1 - x0), .55, 1); return { x: (x0 + x1) / 2, y: 1150, z }; })();
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 80px 'Gaegu'", "400 34px 'Gaegu'", "400 28px 'Noto Sans KR'"], init, draw });
</script>
