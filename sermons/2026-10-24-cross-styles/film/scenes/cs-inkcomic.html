<script>
/* cs-inkcomic v2 — 잘라 낸 건 다리였다 in the style lab's minimal ink comic (lab-inkcomic.html, ref 16): a wobbly, slightly
   blobby black marker line on white paper, lots of white, deadpan. Bears plod along a road on all fours, each with a long
   wooden cross lying along its back — the crossbar over the shoulders, the top end over the neck, the long post trailing
   far behind the rump — tied on with a strap round the belly; the load presses each bear down. I am the bear in black line;
   the others are drawn in a grey line (quieter). My cross is the one colour on the page — the lab's pale-warm beam yellow;
   the only other colour is the door's light across the gap. My saw is tucked in my strap. To saw, I sit up like a bear does,
   the cross across my lap, one forepaw pinning it and the other working the saw; the piece drops to the road and stays.
   The road ends at a gap drawn as the road simply stopping and two cliff lines going down. The others sit at the lip and
   push their crosses out across it, walk over, sit and haul them back, and walk into the door. Mine reaches only part way.
   At the end I stay at the lip and look back; the camera travels back down the road where the pieces glow, then returns:
   the dashed outline of my whole cross over the gap lights slot by slot — the gap stays open.
   Poses on 12 fps, drawings boil on 8 fps, camera on ones.
   The style (marker line + boil + paper, the bear rig, road, door, glow, hit, words) is the house-style kit styles/inkcomic
   (kit-inkcomic.js, window.InkComic); this file keeps only the story. */
const TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
const IC = InkComic, HD = IC.HD;   // the house-style kit styles/inkcomic (hand-drawn toolkit, the bear rig, road, door, effects, words)

const { INK, GREYI, PAPER, WARM, WARMF, LIGHT, t12, frac, lerp2, cam, mk, fillC, SC, PV, footOf, walkSpec, standSpec, legsOf, sitSpec, mixSpec } = IC;

// ---------------- the world's measures ----------------
const L = 560, PW = 30, CBX = 440, CBH = 84, CBW = 30;   // a cross: post length/width, crossbar at CBX from the foot
const PWL = 18, PFACE = 9, CBHL = 30;                   // lying flat on the road (seen a little from above)
const REST = 30, GAP = L - 2 * REST;                    // a whole cross rests 30 on each lip
const FY = 1388, BY = 1322, G1 = 1404, GB = 1286;       // my feet, the others' feet; the road's front and back edges
const LIEY = FY + 2;                                     // a cross laid on the road / across the gap in my lane
let E = 1500, GX = 0;

// ---------------- crosses ----------------
function crossLocal(u0, u1, k) {
  const hb = lerp(CBH, CBHL, k), pw = lerp(PW, PWL, k) / 2, bar = u0 < CBX - CBW / 2 && u1 > CBX + CBW / 2, o = [[u0, -pw]];
  if (bar) o.push([CBX - CBW / 2, -pw], [CBX - CBW / 2 - k * 10, -hb], [CBX + CBW / 2 - k * 10, -hb], [CBX + CBW / 2, -pw]);
  o.push([u1, -pw], [u1, pw]);

  o.push([u0, pw]); return o;
}
const xpt = (X, u, v = 0) => { const c = Math.cos(X.a), s = Math.sin(X.a); return [X.x + u * c - v * s, X.y + u * s + v * c]; };
function drawCross(g, X, mine, o = {}) {
  const u0 = X.u0 || 0, u1 = X.u1 ?? L; if (u1 - u0 < 1) return;
  const k = X.k || 0, pts = crossLocal(u0, u1, k).map(([u, v]) => xpt(X, u, v)), sd = (o.seed || 500) + (mine ? 0 : 40);
  const was = IC.setGrey(!mine);
  if (k > .05) { const fr = pts.map(p => [p[0], p[1] + PFACE * k]); fillC(g, cam(fr), sd + 1, mine ? WARMF : PAPER); mk(g, HD.poly(cam(fr), true, 5), sd + 2, { w: 7, mn: .9 }); }
  fillC(g, cam(pts), sd + 3, mine ? WARM : PAPER);
  mk(g, HD.poly(cam(pts), true, 5), sd + 4, { w: 8, mn: .9 });
  for (const [ua, ub] of [[60, 140], [230, 310]]) if (ua > u0 + 8 && ub < u1 - 8) mk(g, cam([xpt(X, ua, -PW * .12 * (1 - k * .5)), xpt(X, ub, PW * .1 * (1 - k * .5))]), sd + ua, { w: 4, mn: .4, blob: 0 });
  IC.setGrey(was);
}
const rotAbout = IC.rotAbout;
const mixX = (A, Bx, k, dir = 0) => IC.mixObj(A, Bx, k, dir, L);
const lying = (x, y, u0 = 0, u1 = L, a = 0) => ({ x, y, a, k: 1, u0, u1 });

// ---------------- the bear: the kit's rig (InkComic.drawBear); my cross on the near side, theirs on the far side, the saw in my strap ----------------
const backCross = (F, u0) => ({ ...IC.backLoad(F, CBX), u0, u1: L });   // the cross along the back: crossbar over the shoulders, top over the neck
const strapSaw = IC.strapPoint;   // the saw tucked in my strap: handle up behind the shoulders, the blade along my flank
function drawSaw(g, grip, ang, seed = 900) {   // the handle at `grip` (where the paw closes on it), the blade along `ang`
  const d = [Math.cos(ang), Math.sin(ang)], n = [-d[1], d[0]], P = (u, v) => [grip[0] + d[0] * u + n[0] * v, grip[1] + d[1] * u + n[1] * v];
  const handle = [P(-26, -16), P(14, -18), P(20, 16), P(-22, 18)];
  fillC(g, cam(handle), seed, PAPER); mk(g, HD.poly(cam(handle), true, 4), seed + 1, { w: 7 });
  const blade = [P(18, -12), P(190, -6), P(190, 10)]; for (let u = 190; u >= 18; u -= 12) blade.push(P(u, (u / 12 | 0) % 2 ? 12 : 18));
  fillC(g, cam(blade), seed + 2, PAPER); mk(g, HD.poly(cam(blade), true, 4), seed + 3, { w: 6.5, mn: .9 });
}
function drawBear(g, F) {
  if (F.back) F.drawLoad = s => drawCross(g, backCross(F, F.back.u0), !F.grey, { seed: s + 600 });
  F.strapItem = F.saw === 'strap' ? (s => { const sv = strapSaw(F); drawSaw(g, sv.grip, sv.ang, s + 950); }) : null;
  IC.drawBear(g, F);
}

// ---------------- my path (integrated once), the cuts ----------------
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 42 * (1 + .55 * Math.sin(t * TAU / 1.3 - 1));
  if (t < 4.75) return 0;
  if (t < 5.15) return 200 * eio((t - 4.75) / .4);
  if (t < 8.3) return 200;
  if (t < 8.6) return lerp(200, 90, (t - 8.3) / .3);
  if (t < 9.0) return 90 * (1 - ss(8.6, 9.0, t));
  if (t < 9.95) return 0;
  if (t < 10.35) return -(L * (S.left[2] - S.left[3])) * Math.PI / (2 * .4) * Math.sin(Math.PI * (t - 9.95) / .4);   // shuffle (sitting) along the cross: one more piece
  if (t < 11.85) return 0;
  if (t < 12.2) return 215 * Math.PI / (2 * .35) * Math.sin(Math.PI * (t - 11.85) / .35);

}
const strideMe = t => t < 4.6 ? 110 : t < 9 ? 230 : t < 11 ? 70 : 230;
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };

const CUTS = [{ s: 3.2, saw0: 3.75, drop: 4.0, up1: 4.75 }, { s: 9.0, saw0: 9.55, drop: 9.8, up1: 10.4 }, { s: 10.4, saw0: 10.55, drop: 11.2, up1: 11.85 }];
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const SLOTS = [22.9, 23.6, 24.3];
const CUT_ANG = Math.PI - .55;   // the blade, pointing down-left from my paw across the post on my lap
let PIECES = [], BACKCAM = null, TRAVEL = null, SAWLIE = null;
// sitting to saw (facing left): my rump at mx; the cross across my lap, its foot end out in front of me; the cut just past my lap
const LAPX = 150, LAPH = 84;
function lapCross(mx, u0, u1cut) {   // the cut point sits LAPX left of my rump, LAPH above the road; the post runs back down behind me
  const cut = [mx - LAPX, FY - LAPH], a = Math.atan2(LAPH + 10, L - u1cut - 40);
  return { x: cut[0] - Math.cos(a) * u1cut, y: cut[1] - Math.sin(a) * u1cut, a, k: .15, u0, u1: L, cut };
}
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }
  E = meX(12) + 175;
  CUTS.forEach((c, k) => { c.k = k; c.mx = meX(c.s); c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); });
  CUTS[2].mx = meX(10.4);
  CUTS.forEach(c => { c.X = lapCross(c.mx, c.u0, c.u1); c.cutX = c.X.cut[0]; });
  // each piece drops off my lap to the road just below and stays there
  PIECES = CUTS.map((c, k) => { const X = c.X, p0 = xpt(X, c.u0), p1 = xpt(X, c.u1), cx = (p0[0] + p1[0]) / 2 - 20 - k * 6;
    return { c, x: cx - (c.u0 + c.u1) / 2 * Math.cos(Math.PI), y: LIEY + [0, 6, -4][k], a: Math.PI + [.04, -.05, .06][k], u0: c.u0, u1: c.u1, from: X }; });
  SAWLIE = { x: CUTS[2].cutX - 40, y: LIEY + 12 };
  GX = E + GAP + 330;
}
function pieceAt(P, t) {   // from my lap to the road (a short drop with a bounce), then it stays
  const c = P.c, u = clamp((t - c.drop) / .3), lieA = { x: P.x, y: P.y, a: P.a, k: 1, u0: P.u0, u1: P.u1 };
  if (u >= 1) return lieA;
  const from = { ...c.X, u0: P.u0, u1: P.u1 }, cu = (P.u0 + P.u1) / 2, s = xpt(from, cu), e = xpt(lieA, cu), k = u * u;
  const a = lerp(from.a, P.a - (P.a - from.a > Math.PI ? TAU : 0), u), cx = lerp(s[0], e[0], u), cy = lerp(s[1], e[1], k) - Math.sin(Math.PI * u) * 10;
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, k: lerp(from.k, 1, u), u0: P.u0, u1: P.u1 };
}

// ---------------- poses (the kit's walkSpec / standSpec / sitSpec / mixSpec) ----------------
function sawState(c, t, mx) {   // the stroke: the near paw works the saw along its own length across the kerf
  const kp = clamp((t - c.saw0) / (c.drop - .06 - c.saw0)), on = t >= c.saw0 - .05 && t < c.drop + .02, osc = on ? 24 * Math.sin(TAU * 3.2 * (t - c.saw0)) : 0;
  const X = mx == null ? c.X : lapCross(mx, c.u0, c.u1), K0 = X.cut, n = [-Math.sin(X.a), Math.cos(X.a)], K = [K0[0] + n[0] * (-PW / 2 + kp * PW * .9), K0[1] + n[1] * (-PW / 2 + kp * PW * .9)];
  const d = [Math.cos(CUT_ANG), Math.sin(CUT_ANG)], uc = 110 + osc;
  return { kp, K, X, grip: [K[0] - d[0] * uc, K[1] - d[1] * uc] };
}
function sawSit(c, t, mx = c.mx) {   // sitting, facing left: far paw pins the post past the cut, near paw on the saw
  const st = sawState(c, t, mx), pin = xpt(st.X, c.u1 + 46, -PW / 2 - 2);
  const F = sitSpec(mx, FY, -1, [st.grip, pin], { head: .32, rot: -.06 }); F.face = 'calm';
  F.preNear = () => drawSaw(INKG, st.grip, CUT_ANG); return { F, st };
}

function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), u0 = L * (1 - leftAt(t));
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) return walkSpec(x, FY, 1, ph, { sag: 14 + 4 * Math.sin(tt * TAU / 1.3), head: .3, face: 'strain', sweat: Math.floor(tt * 3) % 2 === 0, stride: 18 });
    const k = ss(4.75, 5.2, tt);
    return walkSpec(x, FY, 1, ph, { stride: lerp(18, 40, k), lift: lerp(12, 34, k), bob: lerp(5, 22, k), sag: lerp(12, -4, k), head: lerp(.25, -.1, k), rot: -.05 * k, face: k > .5 ? 'happy' : 'calm' });
  };
  const carry = (F, lu0, saw) => { F.back = { u0: lu0 }; F.saw = saw ? 'strap' : null; return F; };
  for (const c of CUTS) {
    if (t < c.s || t >= c.up1) continue;
    // putting it down and picking it up, in beats with four feet planted (never airborne):
    //   down: the cross slides off my near flank onto the road beside me → I turn round (body squashed through a front view)
    //         → I sit back and lift its foot end onto my lap with one forepaw, the other takes the saw from my strap
    //   up:   I stand, lowering it back onto the road (the saw goes back in the strap, or after the last cut down onto the road)
    //         → I turn round → one forepaw heaves it back up onto my back
    const STR = (u) => ({ ...standSpec(c.mx, FY, 1, { sag: 10, head: .22 }), strapOn: true }), STL = () => ({ ...standSpec(c.mx, FY, -1, { sag: 10, head: .22 }), strapOn: true });
    const lapTop = xpt(c.X, L), groundX = u => ({ x: lapTop[0] - L, y: LIEY + 2, a: 0, k: 1, u0: u, u1: L });
    const onLap = (u, k) => { const a = lerp(0, c.X.a, k), d = [Math.cos(a), Math.sin(a)], top = lerp2([lapTop[0], LIEY + 2], lapTop, k);   // the foot end lifts, the top end stays on the road
      return { x: top[0] - d[0] * L, y: top[1] - d[1] * L, a, k: lerp(1, c.X.k, k), u0: u, u1: L }; };
    const cross = X => () => drawCross(INKG, X, true);
    const sawIn = (F, grip, ang, near) => { if (near) F.preNear = () => drawSaw(INKG, grip, ang); else F.behind = () => drawSaw(INKG, grip, ang); };
    const putDown = (u, k0) => {   // k0: 0 → 1 over [s, saw0]
      if (k0 < .3) { const k = eio(k0 / .3), F = STR(u); F.saw = 'strap'; F.sag += 6 * Math.sin(Math.PI * k); F.rot = .04 * Math.sin(Math.PI * k);
        const Xm = mixX(backCross(F, u), groundX(u), k); F.mid = cross(Xm); return F; }
      if (k0 < .65) { const k = eio((k0 - .3) / .35), F = mixSpec(STR(u), STL(), k); F.strapOn = true; F.saw = 'strap'; F.front = cross(groundX(u)); return F; }
      const k = eio((k0 - .65) / .35), { F: SP } = sawSit(c, c.saw0), F = mixSpec(STL(), SP, k), Xm = onLap(u, k), lw = legsOf(STL());
      const sv = strapSaw(STL()), sg = sawState(c, c.saw0).grip, sw = lerp2(sv.grip, sg, k), cp = xpt(Xm, c.u1 + 46);
      F.legs[1] = k < .3 ? lerp2(lw[1], cp, k / .3) : cp; F.legs[0] = k < .3 ? lerp2(lw[0], sw, k / .3) : sw; F.strapOn = true;
      F.behind = cross(Xm); sawIn(F, sw, lerp(sv.ang, CUT_ANG, k), true); return F; };
    const pickUp = (u, k0, keepSaw) => {   // k0: 0 → 1 over [drop, up1]
      if (k0 < .3) { const k = eio(k0 / .3), { F: A } = sawSit(c, c.drop - .01), F = mixSpec(A, STL(), k), Xm = onLap(u, 1 - k), lw = legsOf(STL());
        const sg = sawState(c, c.drop - .01).grip, sv = strapSaw(STL()), dst = keepSaw ? sv.grip : [SAWLIE.x, SAWLIE.y - 14], sw = lerp2(sg, dst, k);
        const cp = xpt(Xm, c.u1 + 46); F.legs[1] = k > .7 ? lerp2(cp, lw[1], (k - .7) / .3) : cp; F.legs[0] = k > .7 && keepSaw ? lerp2(sw, lw[0], (k - .7) / .3) : (keepSaw ? sw : (k > .8 ? lerp2(sw, lw[0], (k - .8) / .2) : sw));
        F.strapOn = true; F.behind = cross(Xm); sawIn(F, sw, lerp(CUT_ANG, keepSaw ? sv.ang : Math.PI + .04, k), true); return F; }
      if (k0 < .62) { const k = eio((k0 - .3) / .32), F = mixSpec(STL(), STR(u), k); F.strapOn = true; F.saw = keepSaw ? 'strap' : null; F.front = cross(groundX(u)); return F; }
      const k = eio((k0 - .62) / .38), F = STR(u); F.saw = keepSaw ? 'strap' : null; F.legs = legsOf(F); const Xm = mixX(groundX(u), backCross(F, u), k), lw = legsOf(STR(u));
      F.legs[0] = k < .85 ? lerp2(lw[0], xpt(Xm, CBX - 70), Math.min(1, k / .2)) : lerp2(xpt(Xm, CBX - 70), lw[0], (k - .85) / .15);   // the near forepaw heaves it up

    if (t < c.drop) { const { F, st } = sawSit(c, tp); return { F, lie: { ...st.X, u0: c.u0 }, c, kerf: t >= c.saw0 ? st.kp : 0 }; }
    if (c.k === 1) {   // after cut 2: stay sitting and shuffle forward along the post for one more
      const mx = meX(t), { F } = sawSit(CUTS[2], CUTS[2].saw0 - .2, mx); const ph = meP(tp);
      F.legs[2] = [F.legs[2][0], FY - Math.max(0, Math.sin(ph * TAU * 2)) * 10];
      return { F, lie: { ...lapCross(mx, c.u1, CUTS[2].u1), u0: c.u1 } };
    }
    return { F: pickUp(c.u1, (tp - c.drop) / (c.up1 - c.drop), true), c };
  }
  if (t < 12) return { F: carry(walk(tp), u0, t < CUTS[2].drop) };
  // at the edge: a sudden stop (my nose over the gap), back off for the others, come forward again to lay mine
  const EX = E - 175;
  if (t < 18.4) {
    const bx = -190 * eio((tp - 12.9) / .7) + 190 * eio((tp - 17.6) / .7), x = EX + bx;
    const moving = (tp > 12.9 && tp < 13.6) || (tp > 17.6 && tp < 18.3);
    const F = moving ? walkSpec(x, FY, 1, x / 110, { stride: 14, head: .1, sag: 6 }) : standSpec(x, FY, 1, { head: tp < 12.9 ? -.12 : .05 + .05 * Math.sin(tp * 1.4), sag: 6 });
    if (tp < 12.9) { F.rot = .05 * Math.sin(Math.PI * clamp((tp - 12) / .4)); F.face = tp < 12.75 ? 'shock' : 'look'; F.sweat = tp < 12.75; } else if (!moving) F.face = 'look';
    return { F: carry(F, u0, false) };

  const XLay = lying(E - 70 - u0, LIEY, u0, L, 0);
  const LAY = standSpec(EX, FY, 1, { head: .42, sag: 12 }); LAY.legs = legsOf(LAY); LAY.legs[0] = xpt(XLay, u0 + 14, -2);
  if (t < B.tip) {
    if (t < 18.8) { const ST = carry(standSpec(EX, FY, 1, { sag: 6 }), u0, false), k = eio((tp - 18.4) / .4), F = mixSpec({ ...ST, back: null }, LAY, k), Xm = mixX(backCross(ST, u0), XLay, k);
      const lw = legsOf(ST); F.legs[0] = k < .45 ? lw[0] : lerp2(lw[0], xpt(Xm, u0 + 14, -2), Math.min(1, (k - .45) / .3));
      F.mid = () => drawCross(INKG, Xm, true); return { F }; }
    return { F: { ...LAY, face: t > 19.0 ? 'strain' : 'calm', sweat: t > 19.05 }, X: XLay };
  }
  const REACH = { ...standSpec(EX, FY, 1, { head: .55, sag: 16, rot: .05 }), face: 'shock', sweat: true }; REACH.legs = legsOf(REACH); REACH.legs[0] = [E - 8, FY - 6];   // a forepaw at the very lip, head down over it

    if (tp > 20.4) { const k2 = eio((tp - 20.4) / .45), DN = standSpec(EX + 40, FY, 1, { head: .45, sag: 8 }); return { F: { ...mixSpec(REACH, DN, k2), face: 'down' } }; }
    return { F }; }

  const x0 = EX + 40, DN = standSpec(x0, FY, 1, { head: .45, sag: 8 }), BACK = { ...standSpec(x0, FY, -1, { head: -.05, sag: 6 }), face: 'look' }, FWD = { ...standSpec(x0, FY, 1, { head: .12, sag: 6 }), face: 'look' };

}
function fallX(t) {
  if (t < B.tip) return null;
  const u0 = L * (1 - S.left[3]), pv = [E, LIEY], X0 = lying(E - 70 - u0, LIEY, u0, L, 0);
  if (t < B.fall) return { X: rotAbout(X0, pv, .5 * Math.pow((t - B.tip) / (B.fall - B.tip), 2)), s: 1, al: 1 };
  const u = t - B.fall, X1 = rotAbout(X0, pv, .5), cu = (u0 + L) / 2, c0 = xpt(X1, cu);
  const cx = c0[0] + 60 * u, cy = c0[1] + 260 * u + 1300 * u * u, a = X1.a + 2.4 * u + 1.2 * u * u, s = 1 / (1 + 2.2 * u);
  return { X: { ...X1, x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a }, s, c: [cx, cy], al: 1 - ss(B.fall + .6, B.fall + 1.0, t) };
}

// ---------------- the others: sit and push it across → walk over → sit and haul it back → onto the back → into the light ----------------
const PIL = [{ x0: 300, ph: .1 }, { x0: 170, ph: .55 }, { x0: -330, ph: .8 }], PULL = 300;
function pilX(j, t) {
  const P = PIL[j], T = B.bridges[j], x46 = P.x0 + 36 * 4.6, xb = x46 + 15 * (11.4 - 4.6);
  if (t <= 4.6) return P.x0 + 36 * t;
  if (t <= 11.4) return x46 + 15 * (t - 4.6);
  const k = clamp((t - 11.4) / (T - .45 - 11.4)); return lerp(xb, E - 175, k * k * (1.6 - .6 * k));
}
function pilState(j, t) {
  const tp = t12(t), P = PIL[j], T = B.bridges[j], yb = BY + 4, EX = E - 175;
  const tag = F => { F.grey = true; F.id = j; return F; };
  const carry = (x, o = {}) => { const F = tag(walkSpec(x, BY, 1, P.ph + x / 110, { stride: 20, sag: 12, head: .26, ...o })); F.back = { u0: 0 }; return F; };
  if (t < T - .45) { const x = pilX(j, tp); return { F: carry(x, tp > 11.4 ? { stride: 30, head: .12, sag: 8 } : { sweat: Math.floor(tp * 3 + j) % 2 === 0 }) }; }
  const XB = lying(E - REST, yb, 0, L, 0);
  const LAY = tag(standSpec(EX, BY, 1, { head: .42, sag: 12 })); LAY.legs = legsOf(LAY); LAY.legs[0] = xpt(XB, 10, -2);
  if (t < T) { const F0 = carry(EX), k = eio((tp - T + .45) / .45), F = tag(mixSpec({ ...F0, back: null }, LAY, k)), Xm = mixX(backCross(F0, 0), XB, k), lw = legsOf(F0);
    F.legs[0] = k < .45 ? lw[0] : lerp2(lw[0], xpt(Xm, 10, -2), Math.min(1, (k - .45) / .3));   // the cross slides forward off the back; the forepaw pushes its foot end out
    F.mid = () => drawCross(INKG, Xm, false); return { F }; }
  const xs0 = EX + 40, xs1 = E + GAP + 230, top = yb - PWL / 2 - 4;
  if (t < T + .5) { const k0 = eio(clamp((tp - T) / .12)), x = lerp(xs0, xs1, eio(clamp((tp - T - .05) / .45))), on = x - 180 < E + GAP && x + 160 > E;
    const W = tag(walkSpec(x, on ? top : BY, 1, P.ph + x / 120, { stride: 26, head: .2, sag: 0 })); return { F: k0 < 1 ? tag(mixSpec(LAY, W, k0)) : W, bridge: XB, onBridge: on }; }
  // from the far side: turn round and sit, forepaws on the top end, haul it back across
  const pullX = k => ({ ...XB, x: XB.x + PULL * k });
  const PULLS = k => { const X = pullX(k), tip = xpt(X, L - 20), rx = tip[0] + 170; return [tag(sitSpec(rx, BY, -1, [xpt(X, L - 10), xpt(X, L - 60)], { head: .35, rot: .05, sit: .45 })), X]; };
  if (t < T + .75) { const k = eio(clamp((tp - T - .55) / .2)), [F, X] = PULLS(k), k0 = eio(clamp((tp - T - .5) / .1));
    return { F: k0 < 1 ? tag(mixSpec(tag(standSpec(xs1, BY, 1)), F, k0)) : F, bridge: X }; }
  const [Fp, Xp] = PULLS(1), xg = Fp.x + 60;
  if (t < T + 1.1) { const k = eio((tp - T - .75) / .35), Fc = carry(xg), F = tag(mixSpec(Fp, { ...Fc, back: null }, k)), Xm = mixX(Xp, backCross(Fc, 0), k);
    const cp = xpt(Xm, lerp(L - 10, CBX - 40, k)); if (F.f < 0) F.legs[0] = cp; else F.legs[1] = cp;
    if (k > .75) { const lw = legsOf(Fc); F.legs = F.legs.map((p, i) => lerp2(p, lw[i], (k - .75) / .25)); }
    F.mid = () => drawCross(INKG, Xm, false); return { F }; }
  const x = lerp(xg, GX, clamp((tp - T - 1.1) / .4)), F = carry(x, { stride: 26, head: .05 });
  F.alpha = 1 - ss(T + 1.4, T + 1.6, t); if (F.alpha <= 0) return null; F.inGate = x > GX - 120;
  return { F };
}

const mixCam = IC.mixCam;
const GAPCAM = () => ({ x: E + 170, y: 1150, z: .92 });
function camAt(t) {
  let c = { x: meX(t) + 140 + 160 * ss(4.3, 5.4, t), y: 1110, z: .98 };
  c = mixCam({ x: meX(t) + 40, y: 1150, z: 1.45 }, c, eio((t - 1.2) / 1.4));          // the hook: close on me, the saw in my strap; widening by ~2.6
  const at = cc => ({ x: cc.cutX + 160, y: 1130, z: 1.15 });
  c = mixCam(c, at(CUTS[0]), Pilot.win(t, CUTS[0].s - .05, CUTS[0].up1 + .25, .32, .35));
  c = mixCam(c, mixCam(at(CUTS[1]), at(CUTS[2]), eio((t - 9.9) / .55)), Pilot.win(t, CUTS[1].s - .1, CUTS[2].up1 + .2, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 30 + 1600 * ss(11.5, 12.4, t) * ss(11.5, 12.4, t));
  if (t >= 12) c = mixCam(c, { x: E + 260, y: 1100, z: .76 }, eio((t - 12.05) / .95));
  if (t >= 18.1) c = mixCam(c, { x: E + 150, y: 1160, z: .95 }, eio((t - 18.1) / .5));
  if (t >= B.fall) c = mixCam(c, { x: E + 120, y: 1260, z: 1.3 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .6) c = mixCam(c, { x: E + 140, y: 1160, z: .95 }, eio((t - B.fall - .6) / .7));
  if (t >= B.back + .15) c = mixCam(c, TRAVEL, eio((t - B.back - .15) / .7));
  if (t >= 22.25) c = mixCam(c, GAPCAM(), eio((t - 22.25) / .6));
  const k = 1 - ss(B.fall, B.fall + .55, t); c.sx = t >= B.fall ? 18 * k * Math.sin(t * 97) : 0; c.sy = t >= B.fall ? 13 * k * Math.sin(t * 131 + 1) : 0;
  return c;
}

// ---------------- the world ----------------
let INKG;
const DOOR = () => ({ x: GX, gy: GB + 6, w: 86, h: 300, floor: G1 });
// the dashed outline of my whole cross over the gap; its missing span (three piece-lengths) lights slot by slot
function outline(g, t, al, full) {
  const X = lying(E - REST, LIEY, 0, L, 0), sh = L * S.left[3];
  const sp = full ? cam(crossLocal(0, L, 1).map(([u, v]) => xpt(X, u, v))) : cam([[E - 70 + sh, LIEY - PWL / 2], [E + GAP + REST, LIEY - PWL / 2], [E + GAP + REST, LIEY + PWL / 2], [E - 70 + sh, LIEY + PWL / 2]]);
  g.save(); g.globalAlpha = al;
  if (full) for (let k = 0; k < 3; k++) { const on = ss(SLOTS[k], SLOTS[k] + .25, t); if (on <= 0) continue;
    const u0 = L * (1 - S.left[k]), u1 = L * (1 - S.left[k + 1]), q = cam([[u0 + 3, -PWL / 2 - 2], [u1 - 3, -PWL / 2 - 2], [u1 - 3, PWL / 2 + 2], [u0 + 3, PWL / 2 + 2]].map(([u, v]) => xpt(X, u, v)));
    const c = cam([xpt(X, (u0 + u1) / 2)])[0], pulse = 1 + .4 * Math.exp(-(t - SLOTS[k]) * 4);
    g.save(); g.globalAlpha = al * on; g.globalCompositeOperation = 'multiply';
    HD.fillPts(g, HD.arc(c[0], c[1], (u1 - u0) * .75 * IC.ZK * pulse, 46 * IC.ZK * pulse, 0, TAU, 8), LIGHT + '.45)'); HD.fillPts(g, q, LIGHT + '1)'); g.restore();
    g.save(); g.globalAlpha = al * on; for (let i = 0; i < 6; i++) { const a = -Math.PI * (.12 + .76 * i / 5), r0 = 40 * IC.ZK, r1 = (58 + 12 * pulse) * IC.ZK;
      mk(g, [[c[0] + Math.cos(a) * r0, c[1] + Math.sin(a) * r0 * .8], [c[0] + Math.cos(a) * r1, c[1] + Math.sin(a) * r1 * .8]], 1450 + k * 10 + i, { w: 4.5, blob: 0, mn: .5 }); } g.restore(); }
  g.setLineDash([16, 12]); g.lineDashOffset = -t * 20; g.lineWidth = 4.5; g.strokeStyle = INK; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(sp[0][0], sp[0][1]); for (const p of sp) g.lineTo(p[0], p[1]); g.closePath(); g.stroke(); g.setLineDash([]); g.restore();
}

function world(g, t, cm) {
  IC.road(g, cm, { front: G1, back: GB, gaps: [[E, E + GAP]] });
  IC.door(g, t, DOOR(), true);
  const pils = [0, 1, 2].map(j => pilState(j, t)).filter(Boolean), M = poseMe(t);
  for (const P of pils) if (P.bridge) drawCross(g, P.bridge, false, { seed: 3050 });
  for (const P of pils) if (P.F.inGate) drawBear(g, P.F);
  IC.door(g, t, DOOR(), false);
  pils.filter(P => !P.F.inGate).sort((a, b) => a.F.x - b.F.x).forEach(P => drawBear(g, P.F));
  if (t >= 18.65 && t < 19.75) outline(g, t, eio((t - 18.65) / .3) * (1 - ss(19.4, 19.75, t)), false);
  if (t >= 22.3) outline(g, t, eio((t - 22.3) / .45), true);
  const c3 = CUTS[2];
  if (t >= c3.drop + (c3.up1 - c3.drop) * .25) drawSaw(g, [SAWLIE.x, SAWLIE.y - 14], Math.PI + .04, 950);
  // the cut pieces where they fell: when I look back they glow where they lie (and once more as their slot lights)
  for (const P of PIECES) if (t >= P.c.drop) {
    const X = pieceAt(P, t), cu = (P.u0 + P.u1) / 2, c = cam([xpt(X, cu)])[0];
    const hl = ss(B.back + .3 + P.c.k * .12, B.back + .9 + P.c.k * .12, t) + .5 * Math.exp(-Math.max(0, t - SLOTS[P.c.k]) * 3) * (t > SLOTS[P.c.k] ? 1 : 0);
    IC.glowAt(g, c, t, ((P.u1 - P.u0) * .9 + 60) * cm.z, 1500 + P.c.k * 20, Math.min(1, hl));
    drawCross(g, X, true, { seed: 1600 + P.c.k * 30 });
  }
  if (M.lie) { drawCross(g, M.lie, true, { seed: 520 }); }
  if (M.X) drawCross(g, M.X, true, { seed: 540 });
  const FXb = fallX(t); if (FXb && t < B.fall) drawCross(g, FXb.X, true, { seed: 580 });
  drawBear(g, M.F);
  if (M.lie && M.kerf && M.c) { const st = sawState(M.c, t), n = [-Math.sin(st.X.a), Math.cos(st.X.a)], K0 = st.X.cut, k0 = cam([[K0[0] - n[0] * PW / 2, K0[1] - n[1] * PW / 2]])[0], k1 = cam([[K0[0] + n[0] * (-PW / 2 + M.kerf * PW), K0[1] + n[1] * (-PW / 2 + M.kerf * PW)]])[0];
    mk(g, [k0, k1], 530, { w: 5, blob: 0, mn: 1 }); }
  if (M.c && t >= M.c.drop && t < M.c.drop + .3) { const p = PIECES[M.c.k], c = cam([[p.x - (p.u0 + p.u1) / 2, LIEY]])[0];   // the clunk as it lands
    IC.clunk(g, c); }
  const FX = fallX(t);
  if (FX && FX.al > 0 && t >= B.fall) { g.save(); if (t >= B.fall) { const a = cam([[E + 6, 0]])[0][0], b = cam([[E + GAP - 6, 0]])[0][0]; g.beginPath(); g.rect(a, -100, b - a, 4000); g.clip(); }
    g.globalAlpha = FX.al; const sv = IC.CAM; if (FX.s < 1) IC.setCAM(HD.mul(sv, HD.mul(HD.mat(FX.c[0], FX.c[1], 0, FX.s), HD.mat(-FX.c[0], -FX.c[1]))));
    drawCross(g, FX.X, true, { seed: 580 }); IC.setCAM(sv); g.restore(); }
  if (t >= B.fall - .02 && t < B.fall + .55) IC.burst(g, cam([[E + 60, LIEY]])[0], t - B.fall);
  IC.speedLines(g, t, M.F, Pilot.win(t, 4.8, 8.7, .2, .25) + Pilot.win(t, 11.4, 12.05, .1, .1));
}

// ---------------- frame ----------------
function draw(ctx, t) {
  const cm = camAt(t), g = IC.begin(ctx, t, cm); INKG = g;   // paper, a clean ink layer, this frame's boil / zoom / camera
  world(g, t, cm);
  IC.endWhite(g, t, B.end);
  IC.finish(ctx);
  if (t < B.end) IC.captions(ctx, t, S.lines);
  IC.endCard(ctx, t, S.endCard, B.end);
}
async function init() {
  buildTimeline();
  IC.init();
  TRAVEL = (() => { const xs = PIECES.map(P => P.x - (P.u0 + P.u1) / 2), x0 = Math.min(...xs) - 140, x1 = Math.max(...xs) + 160, z = clamp(1080 / (x1 - x0), .6, 1.1); return { x: (x0 + x1) / 2, y: 1150, z }; })();
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: IC.FONTS, init, draw });
</script>
