<title>잘라 낸 건 다리였다 · 펜 낙서</title>

<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* ---- hand-drawn toolkit (shared by the lab-* hand-drawn scenes; inlined at build time) ----
   Lines are variable-width ribbons built from densely sampled polylines: a static hand wobble per stroke (seeded),
   a boil displacement per drawing (3 drawings cycled on 8–12 fps), pressure along the length, tapered ends, ragged
   edges. Ink is laid on a white layer that is multiplied onto a paper whose tooth is a real height field, so ink drops
   out in the valleys and pencil only catches the peaks. */
const TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
const HD = {};
HD.hash = (i, s = 0) => { let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
HD.t12 = t => Math.floor(t * 12 + 1e-6) / 12;
HD.spline = (P, step = 3, closed = false) => {
  const n = P.length; if (n < 2) return P.map(p => p.slice());
  const get = i => closed ? P[((i % n) + n) % n] : P[clamp(i, 0, n - 1)];
  const out = [], segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), m = Math.max(1, Math.ceil(L / step));
    for (let j = 0; j < m; j++) { const t = j / m, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3))); }
  }
  out.push(closed ? out[0].slice() : P[n - 1].slice()); return out;
};
HD.seg = (a, b, step = 4) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]), m = Math.max(1, Math.ceil(L / step)), o = [];
  for (let i = 0; i <= m; i++) o.push([lerp(a[0], b[0], i / m), lerp(a[1], b[1], i / m)]); return o; };
HD.poly = (P, closed = false, step = 4) => { const o = []; const n = P.length, m = closed ? n : n - 1; for (let i = 0; i < m; i++) { const sg = HD.seg(P[i], P[(i + 1) % n], step); if (i) sg.shift(); o.push(...sg); } return o; };
HD.arc = (cx, cy, rx, ry, a0, a1, step = 4, rot = 0) => { const L = Math.abs(a1 - a0) * Math.max(rx, ry), m = Math.max(2, Math.ceil(L / step)), o = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i <= m; i++) { const a = lerp(a0, a1, i / m), x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push([cx + x * c - y * s, cy + x * s + y * c]); } return o; };
HD.normals = pts => pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
HD.lengths = pts => { const s = [0]; for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return s; };
// hand wobble: perpendicular low-frequency displacement
HD.wob = (pts, seed, amp, wl = 120) => { if (!amp || pts.length < 2) return pts; const N = HD.normals(pts), Sx = HD.lengths(pts), oy = (seed * 17.37) % 997;
  return pts.map((p, i) => { const d = (noise(Sx[i] / wl, oy) - .5) * 2 * amp; return [p[0] + N[i][0] * d, p[1] + N[i][1] * d]; }); };
// one boiled drawing: a new wobble + a tiny drift, per drawing index f
HD.boil = (pts, seed, f, amp, wl = 90) => { if (!amp) return pts; const s = (seed * 31 + f * 977) | 0, dx = (HD.hash(s, 1) - .5) * amp, dy = (HD.hash(s, 2) - .5) * amp;
  return HD.wob(pts, s, amp, wl).map(p => [p[0] + dx, p[1] + dy]); };
HD.xf = (pts, m) => pts.map(p => [m.a * p[0] + m.c * p[1] + m.e, m.b * p[0] + m.d * p[1] + m.f]);   // apply a DOMMatrix-like
HD.mat = (x, y, rot = 0, sx = 1, sy = sx) => { const c = Math.cos(rot), s = Math.sin(rot); return { a: c * sx, b: s * sx, c: -s * sy, d: c * sy, e: x, f: y }; };
HD.mul = (A, Bm) => ({ a: A.a * Bm.a + A.c * Bm.b, b: A.b * Bm.a + A.d * Bm.b, c: A.a * Bm.c + A.c * Bm.d, d: A.b * Bm.c + A.d * Bm.d, e: A.a * Bm.e + A.c * Bm.f + A.e, f: A.b * Bm.e + A.d * Bm.f + A.f });
HD.pt = (m, x, y) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
// variable-width ribbon (round caps where the end is wide)
HD.ribbon = (pts, wf) => {
  const n = pts.length, N = HD.normals(pts), Sx = HD.lengths(pts), L = Sx[n - 1] || 1, Lf = [], Rt = [], ws = [];
  for (let i = 0; i < n; i++) { const w = Math.max(0, wf(Sx[i] / L, Sx[i], i, L)) / 2; ws.push(w); Lf.push([pts[i][0] + N[i][0] * w, pts[i][1] + N[i][1] * w]); Rt.push([pts[i][0] - N[i][0] * w, pts[i][1] - N[i][1] * w]); }
  const p = new Path2D(); p.moveTo(Lf[0][0], Lf[0][1]); for (let i = 1; i < n; i++) p.lineTo(Lf[i][0], Lf[i][1]);
  const ae = Math.atan2(N[n - 1][1], N[n - 1][0]); if (ws[n - 1] > .4) p.arc(pts[n - 1][0], pts[n - 1][1], ws[n - 1], ae, ae + Math.PI, true); else p.lineTo(Rt[n - 1][0], Rt[n - 1][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(Rt[i][0], Rt[i][1]);
  const a0 = Math.atan2(N[0][1], N[0][0]); if (ws[0] > .4) p.arc(pts[0][0], pts[0][1], ws[0], a0 + Math.PI, a0, true);
  p.closePath(); return p;
};
// an ink line: o = { w, ts, te (taper lengths px), mn (tip width fraction), press, pw (pressure wavelength), rough, seed, col, dry }
HD.ink = (ctx, pts, o = {}) => {
  if (!pts || pts.length < 2) return;
  const w = o.w ?? 8, ts = o.ts ?? w * 2.5, te = o.te ?? w * 3.5, mn = o.mn ?? .2, press = o.press ?? .3, pw = o.pw ?? 70, rough = o.rough ?? .08, seed = o.seed ?? 1, mnE = o.mnE ?? mn;
  const wf = (u, s, i, L) => { const k = Math.min(1, mn + (1 - mn) * ss(0, ts, s)) * Math.min(1, mnE + (1 - mnE) * ss(0, te, L - s));
    return w * k * (1 + press * (noise(s / pw, seed * 3.7 % 500) - .5) * 2) * (1 + rough * (HD.hash(i, seed) - .5) * 2); };
  ctx.fillStyle = o.col || '#151312'; ctx.fill(HD.ribbon(pts, wf));
  if (o.blob) { ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], w * o.blob, 0, TAU); ctx.fill(); }   // a marker resting a moment at the start
  if (o.dry) {   // dry-brush streaks in the tail: thin paper-white lines along the stroke
    const N = HD.normals(pts), Sx = HD.lengths(pts), L = Sx[Sx.length - 1], r = rng(seed * 7 + 3);
    ctx.save(); ctx.strokeStyle = o.paper || '#fff'; ctx.lineCap = 'round';
    for (let k = 0; k < (o.dryN || 4); k++) { const f = (r() - .5) * .7, u0 = 1 - o.dry * (.3 + .7 * r()); ctx.lineWidth = (o.dryW || 1) * (.5 + r() * .7); ctx.globalAlpha = .55 + r() * .45; ctx.beginPath(); let st = false;
      for (let i = 0; i < pts.length; i++) { const u = Sx[i] / L; if (u < u0) continue; const ww = wf(u, Sx[i], i, L) * f; const x = pts[i][0] + N[i][0] * ww, y = pts[i][1] + N[i][1] * ww; if (!st) { ctx.moveTo(x, y); st = true; } else ctx.lineTo(x, y); }
      ctx.stroke(); }
    ctx.restore();
  }
};
// a closed hand shape: fill (paper white or colour) — the outline is drawn separately with HD.ink
HD.fillPts = (ctx, pts, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); };
HD.pathOf = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (const q of pts) p.lineTo(q[0], q[1]); p.closePath(); return p; };

// ---- paper: a tooth height field (full frame) → paper colour, ink dropout (white specks), pencil deposit masks ----
HD.tooth = (seed = 1, s1 = 6, s2 = 2.2, fib = 0) => {
  const T = new Float32Array(W * H), r = rng(seed), ox = r() * 500, oy = r() * 500;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = .62 * noise(x / s1 + ox, y / s1 + oy) + .38 * noise(x / s2 + oy, y / s2 + ox);
    T[y * W + x] = v; }
  if (fib) { // fibres: thin streaks raised a little
    for (let k = 0; k < fib; k++) { let x = r() * W, y = r() * H, a = r() * TAU; const l = 8 + r() * 30;
      for (let i = 0; i < l; i++) { a += (r() - .5) * .3; x += Math.cos(a); y += Math.sin(a); const xi = x | 0, yi = y | 0; if (xi >= 0 && yi >= 0 && xi < W && yi < H) T[yi * W + xi] = Math.min(1, T[yi * W + xi] + .18); } } }
  return T;
};
// paper canvas: base colour, low-frequency mottling, embossed tooth (light from top-left), fine grain, edge falloff
HD.paper = (T, o = {}) => {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), d = g.createImageData(W, H), D = d.data, base = o.base || [250, 249, 245];
  const mot = o.mott ?? 6, emb = o.emb ?? 26, gr = o.grain ?? 4, vig = o.vig ?? 0, r = rng(o.seed || 9), mscale = o.mscale || 260;
  const tint = o.tint || [0, 0, 0];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, x0 = Math.max(0, x - 1), y0 = Math.max(0, y - 1), x1 = Math.min(W - 1, x + 1), y1 = Math.min(H - 1, y + 1);
    const sh = (T[y0 * W + x0] - T[y1 * W + x1]) * emb, m = (noise(x / mscale + 40, y / mscale + 7) - .5) * 2 * mot;
    const dx = (x / W - .5), dy = (y / H - .5), v = -vig * (dx * dx * 1.4 + dy * dy) * 4;
    const n = (r() - .5) * gr, k = sh + m + n + v;
    D[i * 4] = base[0] + k + tint[0] * m / (mot || 1); D[i * 4 + 1] = base[1] + k + tint[1] * m / (mot || 1); D[i * 4 + 2] = base[2] + k + tint[2] * m / (mot || 1); D[i * 4 + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
};
// a full-frame canvas of colour `col` whose alpha follows the tooth: mode 'peak' (pencil catches the peaks) or 'valley' (ink misses the valleys)
HD.toothMask = (T, col, mode = 'valley', thr = .35, soft = .18, amax = 1) => {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), d = g.createImageData(W, H), D = d.data, rgb = Pilot.hex(col);
  for (let i = 0; i < W * H; i++) { const v = mode === 'peak' ? (T[i] - thr) / soft : (thr - T[i]) / soft, a = clamp(v) * amax;
    D[i * 4] = rgb[0]; D[i * 4 + 1] = rgb[1]; D[i * 4 + 2] = rgb[2]; D[i * 4 + 3] = a * 255; }
  g.putImageData(d, 0, 0); return c;
};
// layers: a white canvas you draw ink on, then multiply onto the frame
HD.layer = () => { const c = Pilot.canvas(W, H), g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round'; return { c, g }; };
HD.clearWhite = (g, x = 0, y = 0, w = W, h = H) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.fillStyle = '#fff'; g.fillRect(x, y, w, h); g.restore(); };
HD.dropout = (g, mask, a = 1, x = 0, y = 0, w = W, h = H) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = a; g.drawImage(mask, x, y, w, h, x, y, w, h); g.restore(); };
HD.multiply = (ctx, c, x = 0, y = 0, w = W, h = H, a = 1) => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = a; ctx.drawImage(c, x, y, w, h, x, y, w, h); ctx.restore(); };

// walk: distance along x with a slowing stop (speed 1 → 0 over the last `dec` fraction), from a lookup table
HD.walker = (x0, x1, T, dec = .3) => { const n = 400, tab = [0]; let s = 0; for (let i = 1; i <= n; i++) { const u = i / n; s += 1 - ss(1 - dec, 1, u); tab.push(s); }
  return t => { if (t <= 0) return x0 + (t / T) * n * (x1 - x0) / tab[n]; if (t >= T) return x1; const f = t / T * n, i = Math.floor(f), k = f - i; return x0 + (x1 - x0) * lerp(tab[i], tab[Math.min(n, i + 1)], k) / tab[n]; }; };

/* cs-pendoodle — 잘라 낸 건 다리였다, drawn as a black ballpoint doodle on off-white paper (from lab-pendoodle, ref 14).
   Same look as the approved lab: thin semi-opaque pen lines that boil (3 drawings on 8 fps), scribble-filled round birds,
   rain falling on twos, puddle scribbles that ripple, broken hatched reflections, hand-lettered words (Nanum Pen).
   "Me" is the dense black scribble bird; the others are the same birds hatched lightly in grey (quieter). The one colour
   is a yellow highlighter: it marks MY cross (and later the cut pieces), and the light in the far doorway.
   The medium carries the turn: the gap is a slot of dense cross-hatching through the puddled road; at the hit the doodle
   shakes and bursts into emphasis ticks; the cut pieces get highlighted again, fly back with pen speed lines and fill the
   dashed pen outline of my whole cross. Everything is redrawn in screen space each frame (the camera never scales the pen). */
const INK = 'rgba(34,31,40,.9)', INKS = '#221f28', INKP = 'rgba(58,54,64,.72)';
const L = 460, PW = 28, CBX = L - 118, CBW = 26, CBH = 96, CBHL = 38;   // cross: post length/width, crossbar position (from foot), thickness, half-length upright / lying
const FY = 1300, BY = 1222, RT = 1170, LYY = FY + 24;                   // front lane (me), back lane (others), road's far edge, where a lying cross sits
const REST = 22, G = L - 2 * REST;                                        // a full cross rests 22 on each lip: the gap is G wide
const SME = 1.6, SPI = 1.28;                                               // me a little bigger than the others
const t12 = HD.t12, frac = x => x - Math.floor(x), bf = t => Math.floor(t * 8 + 1e-6) % 3;
const TX = {};

// ---------------- camera + pen in screen space ----------------
let CAM = { x: 0, y: 1000, z: 1, sx: 0, sy: 0 }, CMX = null, PZ = 1, FD = 0, G_ = null, HLg = null, HLc = null, INKL = null;
function setCam(c) { CAM = c; CMX = { a: c.z, b: 0, c: 0, d: c.z, e: 540 - c.x * c.z + c.sx, f: 960 - c.y * c.z + c.sy }; PZ = Math.pow(c.z, .45); }
const toS = p => [CMX.a * p[0] + CMX.e, CMX.d * p[1] + CMX.f];
function penS(pts, seed, o = {}) {
  if (!pts || pts.length < 2) return;
  const q = o.raw ? pts : HD.boil(HD.wob(pts, seed, o.wob ?? 1.5, 90), seed, FD, o.boil ?? 1.3, 60);
  HD.ink(G_, q, { ts: 5, te: 9, mn: .45, press: .22, pw: 50, rough: .1, seed, col: INK, ...o, w: (o.w ?? 3.8) * (o.fix ? 1 : PZ) });
}
const penW = (pts, seed, o) => penS(pts.map(toS), seed, o);
function pathS(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts) g.lineTo(p[0], p[1]); g.closePath(); }
function whiteS(pts) { G_.fillStyle = '#fff'; pathS(G_, pts); G_.fill();   // paper-white fill: hides what is behind, also the highlighter
  HLg.save(); HLg.globalCompositeOperation = 'destination-out'; HLg.globalAlpha = 1; HLg.fillStyle = '#000'; pathS(HLg, pts); HLg.fill(); HLg.restore(); }
function hatchS(pts, tile, ax, ay) { G_.save(); pathS(G_, pts); G_.clip(); G_.drawImage(tile, Math.round(ax - tile.width / 2), Math.round(ay - tile.height / 2)); G_.restore(); }
function hiS(pts, a = .5, rgb = '255,222,70') { HLg.fillStyle = `rgba(${rgb},${a})`; pathS(HLg, pts); HLg.fill(); }
function hiLine(pts, w, a = .3, rgb = '255,222,70') { HLg.save(); HLg.strokeStyle = `rgba(${rgb},${a})`; HLg.lineWidth = w; HLg.lineCap = 'round'; HLg.lineJoin = 'round';
  HLg.beginPath(); HLg.moveTo(pts[0][0], pts[0][1]); for (const p of pts) HLg.lineTo(p[0], p[1]); HLg.stroke(); HLg.restore(); }
const mulM = HD.mul, xf = HD.xf;
const rotAboutM = (cx, cy, a) => mulM(HD.mat(cx, cy, a), HD.mat(-cx, -cy));

// scribble hatching tiles (pen lines back and forth until nearly solid), clipped into shapes in screen space
function hatchTile(w, h, passes, alpha, seed, lw = 3.2) {
  const c = Pilot.canvas(w, h), g = c.getContext('2d'), r = rng(seed), cx = w / 2, cy = h / 2, R = Math.hypot(w, h) / 2 + 10;
  for (let p = 0; p < passes.length; p++) { const [a, sp] = passes[p], ca = Math.cos(a), sa = Math.sin(a);
    for (let s = -R; s < R; s += sp * (.8 + .5 * r())) { const p0 = [cx - ca * R - sa * s, cy - sa * R + ca * s], p1 = [cx + ca * R - sa * s, cy + sa * R + ca * s];
      HD.ink(g, HD.wob(HD.seg(p0, p1, 6), seed + p * 97 + (s * 3 | 0), 1.2, 30), { w: lw, ts: 3, te: 3, mn: .6, press: .25, seed: seed + 31 + (s | 0), col: `rgba(34,31,40,${alpha})` }); } }
  return c;
}

// ---------------- the cross (local: foot at u=0, top at u=L, v across) ----------------
function crossOutline(lying) { const hb = lying ? CBHL : CBH;
  return [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],
    [CBX + CBW / 2, PW / 2], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, PW / 2], [0, PW / 2]]; }
function clipU(P, u0, u1) {
  const cl = (P, keep, X) => { const o = []; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length], ka = keep(a), kb = keep(b);
    if (ka) o.push(a); if (ka !== kb) o.push([X, a[1] + (b[1] - a[1]) * (X - a[0]) / (b[0] - a[0])]); } return o; };
  return cl(cl(P, p => p[0] >= u0 - 1e-6, u0), p => p[0] <= u1 + 1e-6, u1);
}
const GRAIN = [[24, 96, -.22], [70, 150, .2], [150, 236, -.12], [214, 300, .25], [260, 330, -.2], [372, 440, .1], [406, 452, -.25]];
// X = { x, y, a } foot origin + angle. o = { lying, mine, alpha, seed }
function drawCross(X, u0, u1, o = {}) {
  if (u1 - u0 < 1) return;
  const S = mulM(CMX, HD.mat(X.x, X.y, X.a)), lying = !!o.lying, sd = o.seed || 300;
  const P = clipU(crossOutline(lying), u0, u1), dense = HD.poly(P, true, 3);
  const scr = HD.boil(HD.wob(xf(dense, S), sd, 1.2, 80), sd, FD, 1.1, 60);
  const al = o.alpha ?? 1; G_.save(); G_.globalAlpha = al;
  if (lying) {   // a plank lying flat: show its thickness as a second line under the near edge
    const th = 9, side = xf([[u0, PW / 2], [u1, PW / 2], [u1, PW / 2 + th], [u0, PW / 2 + th]], S);
    whiteS(side); penS(HD.poly([xf([[u0 + 2, PW / 2 + th]], S)[0], xf([[u1 - 2, PW / 2 + th]], S)[0]], false, 3), sd + 7, { w: 3.2 });
    for (const u of [u0, u1]) penS(HD.seg(xf([[u, PW / 2]], S)[0], xf([[u, PW / 2 + th]], S)[0], 2), sd + 8 + (u | 0), { w: 3 });
  }
  whiteS(scr);
  if (o.mine) { hiS(scr.map(p => [p[0] + 3, p[1] - 2]), .58 * al);
    const a = xf([[Math.max(u0, 6), 0], [Math.min(u1, L - 6), 0]], S); if (u1 - u0 > 20) hiLine(a, PW * CAM.z * .55, .22 * al); }
  HD.ink(G_, scr, { w: 3.9 * PZ, ts: 4, te: 4, mn: .7, press: .2, seed: sd + 1, col: INK });
  // wood grain: a few short pen lines along the post (fixed in u, so cut pieces line up again)

  penS(HD.seg(P([x - 7, base]), P([x - 5, top]), 5), sd, o); penS(HD.seg(P([x + 7, base]), P([x + 6, top]), 5), sd + 1, o);
  penS(HD.poly([P([x - 15, base]), P([x - 13, base - 30]), P([x + 14, base - 30]), P([x + 15, base])]), sd + 2, o);
  penS(HD.seg(P([x - 26, top]), P([x + 26, top]), 3), sd + 3, o);
  const Lp = [[x - 20, top - 4], [x - 28, top - 60], [x + 28, top - 60], [x + 20, top - 4]].map(P); whiteS(Lp); penS(HD.poly(Lp, true), sd + 4, o);
  penS(HD.seg(P([x, top - 6]), P([x, top - 58]), 3), sd + 5, { w: 2.6 }); penS(HD.seg(P([x - 25, top - 33]), P([x + 25, top - 33]), 3), sd + 6, { w: 2.6 });
  penS(HD.poly([P([x - 37, top - 60]), P([x, top - 90]), P([x + 37, top - 60])]), sd + 7, o);
  for (let y = top + 30; y < base - 40; y += 16) penS(HD.seg(P([x + 1, y]), P([x + 6, y - 5]), 2), sd + 10 + y, { w: 2.2 });
}
function guide(t, k, al) {   // the dashed pen outline of my whole cross across the gap
  const S0 = mulM(CMX, HD.mat(E - REST, LYY, 0)), ol = HD.poly(crossOutline(true), true, 3), x1 = (L + 8) * k - 4;
  const pts = xf(ol.filter(p => p[0] <= x1 + .5), S0); if (pts.length < 2) return;
  const Ls = HD.lengths(pts); let seg = [], on = true, nxt = 15;
  G_.save(); G_.globalAlpha = al;
  const fillP = xf(clipU(crossOutline(true), 0, x1), S0); G_.save(); G_.globalAlpha = al * .5; G_.fillStyle = '#fff'; pathS(G_, fillP); G_.fill(); G_.restore();
  hiS(fillP, .16 * al);
  for (let i = 0; i < pts.length; i++) { const s = Ls[i] + (t * 18 % 24); if (s > nxt) { if (on && seg.length > 1) penS(seg, 4200 + i, { w: 5.2, ts: 2, te: 2, mn: .7, wob: .5, boil: .5, col: '#fff' }); on = !on; nxt += on ? 15 : 9; seg = []; } if (on) seg.push(pts[i]); }
  if (on && seg.length > 1) penS(seg, 4199, { w: 5.2, ts: 2, te: 2, mn: .7, wob: .5, boil: .5, col: '#fff' });
  G_.restore();
}
function world(t) {

  // puddle scribbles on the road (rippling), then the gap
  const vx0 = CAM.x - 600 / CAM.z, vx1 = CAM.x + 600 / CAM.z;
  for (const m of MARKS) { if (m.x < vx0) continue; if (m.x > vx1) break; drawMark(m, (Math.floor(q * 4) + m.ph) % 3, q); }
  if (toS([E + G, 0])[0] > -40 && toS([E, 0])[0] < W + 40) drawSlot();

  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  // back lane: a bridge (only ever one, its owner's), then the others
  for (const P of pils) if (P.B) drawCross(P.B, 0, L, { lying: true, seed: 330 + P.F.id * 9 });
  pils.slice().sort((a, b) => a.F.hip[0] - b.F.hip[0]).forEach(P => {
    const X = P.X, dc = X ? () => drawCross(X, X.u0, L, { lying: X.lie, seed: 340 + P.F.id * 9, alpha: P.F.alpha ?? 1 }) : null;
    drawBird(P.F, X && !X.lie ? dc : null, X && X.lie ? dc : null);
  });
  // the guide shows the missing span while my short cross hangs off the lip, and again when the pieces come back
  if (t >= 18.75 && t < 19.75) guide(t, eio((t - 18.75) / .35), 1 - ss(19.4, 19.75, t));
  if (t >= B.fill[0] - .2) guide(t, eio((t - B.fill[0] + .2) / .45), 1);
  // the saw I left on the road after the last cut
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip; drawSaw([lerp(g0[0], SAWLIE.grip[0], k), lerp(g0[1], SAWLIE.grip[1], k)], lerp(CUT_ANG, SAWLIE.ang, k)); }
  // the pieces I cut, lying where they fell; highlighted again once I look back; they fly into the gap one by one
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), hl = ss(B.back + .2 + (2 - c.k) * .15, B.back + .6 + (2 - c.k) * .15, t);
    const scr = drawCross(p, c.u0, c.u1, { lying: true, mine: true, seed: 360 + c.k * 7 });
    if (hl > 0 && scr) { const cc = toS([p.cx, p.cy]), pulse = (1 - ss(FILL[c.k][1] + .2, FILL[c.k][1] + .9, t)) * hl;
      if (pulse > 0) { HLg.save(); HLg.globalAlpha = pulse; hiLine(scr.concat([scr[0]]), 22 * CAM.z, .32); HLg.restore();
        for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + .3, rx = ((c.u1 - c.u0) / 2 + 30) * CAM.z, ry = 46 * CAM.z, r1 = 1.28 + .1 * (i % 2);
          G_.save(); G_.globalAlpha = pulse; penS(HD.seg([cc[0] + Math.cos(a) * rx, cc[1] + Math.sin(a) * ry], [cc[0] + Math.cos(a) * rx * r1, cc[1] + Math.sin(a) * ry * r1 * 1.15], 2), 4300 + c.k * 10 + i, { w: 3.2 }); G_.restore(); } }
      if (p.u > 0 && p.u < .95) { const dv = [Math.cos(.5), 0]; const fv = pieceAt(c, t - .06), vx = p.cx - fv.cx, vy = p.cy - fv.cy, vl = Math.hypot(vx, vy) || 1;   // speed lines
        for (let i = -1; i <= 1; i++) { const nx = -vy / vl, ny = vx / vl, b = [p.cx - vx / vl * 70 + nx * i * 22, p.cy - vy / vl * 70 + ny * i * 22];
          penS([toS(b), toS([b[0] - vx / vl * 90, b[1] - vy / vl * 90])], 4400 + c.k * 5 + i, { w: 3, ts: 3, te: 14, mn: .3 }); } } } }
  // me and my cross (and the saw in my near wing)
  const M = poseMe(t), F = M.F;
  const myCross = X => { if (X) drawCross(X, X.u0, L, { lying: X.lie, mine: true, seed: 300 }); };
  drawBird(F, M.X && !M.X.lie ? () => myCross(M.X) : null, () => {
    if (M.X && M.X.lie) myCross(M.X);
    if (M.kerf) { const a = toS([M.c.cutX, M.c.y - PW / 2]), b = toS([M.c.cutX, M.c.y - PW / 2 + M.kerf.kp * PW * .92 + .5]); penS([a, b], 4500, { w: 3.6, raw: true, ts: 1, te: 1, mn: 1 }); }
    if (M.saw) drawSaw(M.saw.grip, M.saw.ang);
  });
  // my reflection in the puddle: broken short verticals under me
  { const r = rng(990), fx = F.hip[0]; for (let y = FY + 16; y < FY + 150; y += 9 + r() * 6) { const w2 = 52 * (1 - (y - FY) / 200);
      for (let k = 0; k < 4; k++) if (r() > .3) penW(HD.seg([fx - w2 + k * w2 * .66 + (r() - .5) * 4, y], [fx - w2 + k * w2 * .66, y + 6 + r() * 7], 2), 1000 + (y | 0) * 4 + k, { w: 3, mn: .3 }); } }
  // a snap line at each cut
  if (M.c && t >= M.c.drop && t < M.c.drop + .12) { const c = M.c; for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * .45;
    penW(HD.seg([c.cutX + Math.cos(a) * 30, c.y - 20 + Math.sin(a) * 30], [c.cutX + Math.cos(a) * 58, c.y - 20 + Math.sin(a) * 58], 2), 4600 + i, { w: 3.4 }); } }
  // my cross over the edge: tips, falls (clipped to the slot)
  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { G_.save(); if (FX.clip) { const a = toS([E + 3, -4000]), b = toS([E + G - 3, 9000]); G_.beginPath(); G_.rect(a[0], a[1], b[0] - a[0], b[1] - a[1]); G_.clip();
      HLg.save(); HLg.beginPath(); HLg.rect(a[0], a[1], b[0] - a[0], b[1] - a[1]); HLg.clip(); }
    drawCross(FX, FX.u0, L, { lying: true, mine: true, seed: 300, alpha: FX.alpha ?? 1 });
    if (FX.clip) HLg.restore(); G_.restore();
    if (FX.clip) { const u = t - B.fall, cc = cpt(FX, (FX.u0 + L) / 2); for (let i = -1; i <= 1; i++) penW([[cc[0] + i * 40, cc[1] - 120], [cc[0] + i * 40, cc[1] - 260]], 4700 + i, { w: 4.4, ts: 3, te: 14, mn: .3, col: '#fff' }); } }
  // the hit: a scribbled burst at the lip
  if (t >= B.fall && t < B.fall + .45) { const k = (t - B.fall) / .45, c = [E + 30, LYY];
    for (let i = 0; i < 11; i++) { const a = -Math.PI * (.05 + i * .09), r0 = 50 + 120 * eo(k), r1 = r0 + 40 * (1 - k) + 14;
      const sg = HD.seg([c[0] + Math.cos(a) * r0, c[1] + Math.sin(a) * r0 * .8], [c[0] + Math.cos(a) * r1, c[1] + Math.sin(a) * r1 * .8], 2);
      penW(sg, 4800 + i, { w: 11, ts: 3, te: 10, col: '#fff' }); penW(sg, 4800 + i, { w: 4.2, ts: 3, te: 10 }); } }   // white-haloed, so it reads on the dark slot too
  // sawdust: little pen specks
  for (const q2 of FLECKS) { const u = t - q2.t0; if (u < 0) continue; const al = 1 - ss(q2.t0 + 1.0, q2.t0 + 1.6, t); if (al <= 0) continue;
    const tl = (-q2.vy + Math.sqrt(q2.vy * q2.vy + 4 * 700 * (q2.land - q2.y))) / 1400, uu = Math.min(u, Math.max(0, tl));
    const x = q2.x + q2.vx * uu, y = q2.y + q2.vy * uu + 700 * uu * uu, r = q2.r0 + q2.vr * uu;
    G_.save(); G_.globalAlpha = al; penW([[x - Math.cos(r) * q2.sz, y - Math.sin(r) * q2.sz], [x + Math.cos(r) * q2.sz, y + Math.sin(r) * q2.sz]], q2.seed, { w: 3, ts: 1, te: 2, mn: .5 }); G_.restore(); }
}

// ---------------- words ----------------
const PEN = "'Nanum Pen Script','Nanum Pen',cursive";
function capRect(t) {   // the hand leaves a gap in the rain round the words
  for (const [a, b, s, src] of S.lines) { if (t < a - .05 || t > b + .05) continue; const n = s.split('\n').length; return [100, 300, 880, (n - 1) * 143 + 150 + (src ? 110 : 0)]; }
  return null;
}
function words(ctx, t) {
  if (t >= B.end) return;
  const f = FD; ctx.save(); ctx.translate([0, 1, -1][f], [0, -1, 1][f]); ctx.rotate([0, .004, -.003][f]);
  Story.captions(ctx, t, S.lines.map(l => [l[0], l[1], l[2]]), { font: PEN, weight: 400, size: 92, y: 410, color: '#25222b', shadow: 'rgba(0,0,0,0)', shadowBlur: 0 });
  for (const [a, b, s, src] of S.lines) { if (!src) continue; const al = Pilot.win(t, a, b, .35, .45); if (al <= 0) continue;
    const n = s.split('\n').length; Pilot.text(ctx, src, W / 2, 410 + (n - 1) * 92 * 1.55 + 92, { size: 46, font: PEN, color: '#3a3540', alpha: al }); }
  ctx.restore();
}
function endCard(ctx, t) {
  if (t < B.end - .2) return;
  const k = 1.32, cy = 900; ctx.save(); ctx.translate([0, 1, -1][FD], [0, -1, 1][FD]); ctx.setTransform(k, 0, 0, k, 540 - 540 * k, cy - cy * k);
  Story.endCard(ctx, t, S.endCard, B.end, { font: PEN, srcFont: PEN, color: '#25222b', srcColor: '#3e3944', y: 840, titleShadow: '' });
  ctx.restore();
}

// ---------------- frame ----------------
function draw(ctx, t) {
  FD = bf(t); setCam(camAt(t));
  const g = INKL.g; G_ = g;
  ctx.drawImage(TX.paper, 0, 0);
  HD.clearWhite(g); HLg.clearRect(0, 0, W, H);
  const cr = capRect(t);
  { g.save(); if (cr) { const cl = new Path2D(); cl.rect(0, 0, W, H); cl.rect(cr[0], cr[1], cr[2], cr[3]); g.clip(cl, 'evenodd'); } rain(t); g.restore(); }
  world(t);
  HD.dropout(g, TX.drop, .5);
  const fade = 1 - .96 * ss(B.end - .15, B.end + .35, t);
  HD.multiply(ctx, HLc, 0, 0, W, H, fade); HD.multiply(ctx, INKL.c, 0, 0, W, H, fade);

}
async function init() {

window.__dbg = () => ({ E, G, GX, cuts: CUTS.map(c => [c.mx, c.cutX, c.baseX, c.u0, c.u1]) });
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 92px 'Nanum Pen Script'", "400 92px 'Nanum Pen'"], init, draw });
