<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script><script src="kit-pendoodle.js"></script>
<script>
/* cs-pendoodle — 잘라 낸 건 다리였다, drawn as a black ballpoint doodle on off-white paper (from lab-pendoodle, ref 14).
   Same look as the approved lab: thin semi-opaque pen lines that boil (3 drawings on 8 fps), scribble-filled round birds,
   rain falling on twos, puddle scribbles that ripple, broken hatched reflections, hand-lettered words (Nanum Pen).
   "Me" is the dense black scribble bird; the others are the same birds hatched lightly in grey (quieter). The one colour
   is a yellow highlighter: it marks MY cross (and later the cut pieces), and the light in the far doorway.
   The medium carries the turn: the gap is a slot of dense cross-hatching through the puddled road; at the hit the doodle
   shakes and bursts into emphasis ticks; the cut pieces get highlighted again, fly back with pen speed lines and fill the
   dashed pen outline of my whole cross. Everything is redrawn in screen space each frame (the camera never scales the pen). */
/* The STYLE (paper, pen, boil, highlighter, the bird rig, rain, puddles, the gap, the doorway, lamps, words) is the
   house-style kit styles/pendoodle (vendored as kit-pendoodle.js); this file keeps only the story: the cross, the saw,
   the timeline, the poses, the camera and the order things are drawn in. */
const K = PenDoodle, HD = K.HD, TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
const { penS, penW, pathS, whiteS, hiS, hiLine, toS, cpt, rotAbout, mixX, farU, nearU, attach, gripCarry, walkSpec, standSpec, mixSpec, drawBird } = K;
const L = 460, PW = 28, CBX = L - 118, CBW = 26, CBH = 96, CBHL = 38;   // cross: post length/width, crossbar position (from foot), thickness, half-length upright / lying
const FY = 1300, BY = 1222, RT = 1100, LYY = FY + 24;   // RT: the road's far edge (the road goes on behind the hole)                   // front lane (me), back lane (others), road's far edge, where a lying cross sits
const REST = 22, G = L - 2 * REST;                                        // a full cross rests 22 on each lip: the gap is G wide
const SME = 1.6, SPI = 1.28;                                               // me a little bigger than the others
const t12 = K.t12, frac = K.frac, bf = K.bf;
const PINU = 96;   // where the free hand pins the beam while I saw (from the cut)
const mulM = HD.mul, xf = HD.xf;

// ---------------- the cross (local: foot at u=0, top at u=L, v across) ----------------
function crossOutline(lying) { const hb = lying ? CBHL : CBH;
  return [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],
    [CBX + CBW / 2, PW / 2], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, PW / 2], [0, PW / 2]]; }
function clipU(P, u0, u1) {
  const cl = (P, keep, X) => { const o = []; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length], ka = keep(a), kb = keep(b);
    if (ka) o.push(a); if (ka !== kb) o.push([X, a[1] + (b[1] - a[1]) * (X - a[0]) / (b[0] - a[0])]); } return o; };
  return cl(cl(P, p => p[0] >= u0 - 1e-6, u0), p => p[0] <= u1 + 1e-6, u1);
}
const GRAIN = [[24, 96, -.22], [70, 150, .2], [150, 236, -.12], [214, 300, .25], [260, 330, -.2], [372, 440, .1], [406, 452, -.25]];
// X = { x, y, a } foot origin + angle. o = { lying, mine, alpha, seed }
function drawCross(X, u0, u1, o = {}) {
  if (u1 - u0 < 1) return;
  const S = mulM(K.M, HD.mat(X.x, X.y, X.a)), lying = !!o.lying, sd = o.seed || 300;
  const P = clipU(crossOutline(lying), u0, u1), dense = HD.poly(P, true, 3);
  const scr = HD.boil(HD.wob(xf(dense, S), sd, 1.2, 80), sd, K.fd, 1.1, 60);
  const al = o.alpha ?? 1; K.g.save(); K.g.globalAlpha = al;
  if (lying) {   // a plank lying flat: show its thickness as a second line under the near edge
    const th = 9, side = xf([[u0, PW / 2], [u1, PW / 2], [u1, PW / 2 + th], [u0, PW / 2 + th]], S);
    whiteS(side); penS(HD.poly([xf([[u0 + 2, PW / 2 + th]], S)[0], xf([[u1 - 2, PW / 2 + th]], S)[0]], false, 3), sd + 7, { w: 3.2 });
    for (const u of [u0, u1]) penS(HD.seg(xf([[u, PW / 2]], S)[0], xf([[u, PW / 2 + th]], S)[0], 2), sd + 8 + (u | 0), { w: 3 });
  }
  whiteS(scr);
  if (o.mine) { hiS(scr.map(p => [p[0] + 3, p[1] - 2]), .58 * al);
    const a = xf([[Math.max(u0, 6), 0], [Math.min(u1, L - 6), 0]], S); if (u1 - u0 > 20) hiLine(a, PW * K.cam.z * .55, .22 * al); }
  HD.ink(K.g, scr, { w: 3.9 * K.pz, ts: 4, te: 4, mn: .7, press: .2, seed: sd + 1, col: K.INK });
  // wood grain: a few short pen lines along the post (fixed in u, so cut pieces line up again)
  for (const [a, b, v] of GRAIN) { const ua = Math.max(a, u0 + 6), ub = Math.min(b, u1 - 6); if (ub - ua < 10) continue;
    if (ua < CBX + CBW / 2 + 4 && ub > CBX - CBW / 2 - 4) continue;
    penS(xf(HD.seg([ua, v * PW], [ub, v * PW], 3), S), sd + 20 + a, { w: 2.3, mn: .3 }); }
  if (!o.mine) {   // the others' crosses: quiet hatching on the lower half
    for (let u = Math.ceil((u0 + 8) / 22) * 22; u < u1 - 8; u += 22) { if (Math.abs(u - CBX) < CBW / 2 + 6) continue;
      penS(xf(HD.seg([u, PW * .1], [u + 8, PW * .42], 2), S), sd + 40 + u, { w: 2.2, mn: .35 }); }
  }
  K.g.restore();
  return scr;
}

// ---------------- the saw (doodled: toothed blade, D handle) ----------------
const CUT_ANG = Math.PI - .72, BLADE = 128;
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];
  return { d, up, heel: [grip[0] - up[0] * 13 + d[0] * 18, grip[1] - up[1] * 13 + d[1] * 18] }; }
function drawSaw(grip, ang, seed = 1400) {
  const { d, up, heel } = sawGeo(grip, ang), P = (u, v) => toS([heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v]);
  const blade = [P(0, 26), P(BLADE, 15)]; for (let u = BLADE; u >= 0; u -= 8) blade.push(P(u, (u / 8 | 0) % 2 ? 3.5 : -3.5));
  whiteS(blade); penS(blade.concat([blade[0]]), seed, { w: 3.4, boil: .8, wob: .6 });
  penS(HD.arc(...P(BLADE - 16, 12), 4.5 * K.cam.z, 4.5 * K.cam.z, 0, TAU, 2), seed + 1, { w: 2.6, boil: .5, wob: .3 });
  const h = [P(-2, 32), P(-30, 40), P(-44, 18), P(-34, -4), P(-4, 2)], hs = HD.spline(h, 3, true);
  whiteS(hs); penS(hs, seed + 2, { w: 3.6, ts: 3, te: 3, mn: .7 });
  penS(HD.spline([P(-11, 26), P(-27, 31), P(-34, 18), P(-27, 8), P(-11, 11)], 2, true), seed + 3, { w: 3, ts: 3, te: 3, mn: .7 });
  for (let i = 0; i < 4; i++) penS(HD.seg(P(-6 - i * 9, 36 - i * 2), P(-12 - i * 9, 33 - i * 2), 2), seed + 4 + i, { w: 2.2 });
  penS(HD.arc(...P(4, 22), 2.4 * K.cam.z, 2.4 * K.cam.z, 0, TAU, 1), seed + 9, { w: 2.6 }); penS(HD.arc(...P(4, 6), 2.4 * K.cam.z, 2.4 * K.cam.z, 0, TAU, 1), seed + 10, { w: 2.6 });
}

// ---------------- timeline: my path (integrated once), the cuts ----------------
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 40 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1));        // staggering
  if (t < 4.6) return 0;
  if (t < 5.0) return 380 * eio((t - 4.6) / .4);                            // lighter: big quick hops
  if (t < 8.3) return 380;
  if (t < 8.6) return lerp(380, 150, (t - 8.3) / .3);
  if (t < 9.0) return 150 * (1 - ss(8.6, 9.0, t));
  if (t < 10.15) return 0;
  if (t < 10.4) return 672 * Math.sin(Math.PI * (t - 10.15) / .25);
  if (t < 11.5) return 0;
  if (t < 12.0) return 780 * Math.sin(Math.PI * (t - 11.5) / .5);
  return 0;
}
const strideMe = t => t < 4.6 ? 96 : t < 8.8 ? 250 : 150;
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };
const meX = t => tab(MEX, t), meP = t => tab(MEP, t);
const CUTS = [{ s: 3.2, d: .3, saw0: 3.5, drop: 4.0, up1: 4.4 }, { s: 9.0, d: .3, saw0: 9.3, drop: 9.8, up1: 10.15 }, { s: 10.4, d: .3, saw0: 10.7, drop: 11.2, up1: 11.5 }];   // set-down / pick-up take 3–4 drawings
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const FILL = [[22.2, 23.3], [22.65, 23.7], [23.1, 24.1]];
const FLECKS = [];
let E = 1600, GX = 0, GAY = 0, SAWLIE = null, EDGE = 0;
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }
  E = meX(12) + 70; EDGE = E - 46; GX = E + G + 360; GAY = BY + 4 - 250;
  CUTS.forEach((c, k) => {
    c.k = k; c.mx = meX(c.s); c.cutX = c.mx - 104; c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.baseX = c.cutX - c.u1; c.y = LYY;
    const r = rng(100 + k);
    for (let n = 0; n < 16; n++) FLECKS.push({ t0: n < 11 ? lerp(c.saw0, c.drop, n / 11) : c.drop + r() * .05, x: c.cutX + (r() - .5) * 8, y: c.y - PW / 2,
      vx: (r() - .5) * (n < 11 ? 170 : 300), vy: -(80 + r() * (n < 11 ? 150 : 240)), land: FY + 20 + r() * 50, r0: r() * TAU, vr: (r() - .5) * 20, sz: 4 + r() * 4, seed: 2000 + k * 40 + n });
  });
  const c3 = CUTS[2]; SAWLIE = { grip: [c3.cutX + 120, FY + 40], ang: Math.PI + .06 };
  const r = rng(200);
  for (let n = 0; n < 14; n++) FLECKS.push({ t0: B.fall + r() * .1, x: E + 6 + r() * 30, y: LYY, vx: (r() - .2) * 240, vy: -(60 + r() * 200), land: 2800, r0: r() * TAU, vr: (r() - .5) * 24, sz: 4 + r() * 5, seed: 2300 + n });
}
function pieceAt(c, t) {   // a cut piece lying on the road where it fell — it never moves again
  const sh = 16 * eo((t - c.drop) / .25), cu = (c.u0 + c.u1) / 2, cx = c.baseX + cu - sh, cy = c.y, a = -.06 * eo((t - c.drop) / .25);
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, cx, cy };
}
const SLOTS = [[22.9, 0], [23.6, 1], [24.3, 2]];   // the outline's missing span lights one piece-length at a time (soft knocks in the soundtrack)

// ---------------- poses ----------------
// the cross on a bird's back: it rests on the back behind the head, foot trailing down behind, top up in front
const TOPX = 250;
function carryCross(F, left, a0) {   // my cross on the back (K.shoulder); the last, short cross rides lower: crossbar behind the back, not by the eyes
  const contact = left < .55 ? L - 40 : L - Math.min(TOPX, left * L - 44);
  return { ...K.shoulder(F, a0, PW, contact), u0: L * (1 - left) };
}
const hangAng = f => f > 0 ? .42 : Math.PI - .42;
const hangGrip = K.hangGrip;
function sawState(c, t) {   // the cutting stroke: the teeth pass through the kerf, the blade moves along its own length
  const kp = clamp((t - c.saw0) / (c.drop - .06 - c.saw0)), saw = t >= c.saw0 - .05 && t < c.drop + .02;
  const osc = saw ? 22 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, g0 = sawGeo([0, 0], CUT_ANG), d = g0.d, up = g0.up;
  const K = [c.cutX, c.y - PW / 2 + kp * PW * .92], heel = [K[0] - d[0] * (70 - osc), K[1] - d[1] * (70 - osc)];
  return { kp, grip: [heel[0] + up[0] * 13 - d[0] * 18, heel[1] + up[1] * 13 - d[1] * 18], K };
}
function sawSpec(c, t) {   // turned back to the cross: one foot pins it beside the cut, the near wing saws
  const f = -1, mx = c.mx, s = SME, st = sawState(c, t);
  return { kind: 'me', s, f, gy: FY, hip: [mx, FY - 60 * s], ang: f * .42, feet: [[mx + 30, FY], [c.cutX + 36, c.y - 6]], hands: [[c.baseX + c.u1 + PINU, c.y - PW / 2], st.grip],
    hand: ['flat', 'grip'], tilt: .32, eye: 'calm', look: [2, 7] };
}

function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), left = leftAt(t);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const w = Math.sin(tt * TAU / 1.15); const F = walkSpec(x, FY, SME, 1, ph, 96, .3 + .08 * w, 14); F.eye = 'strain'; F.tilt = .18; F.sweat = 1;
      F.hip[1] += 6 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, -1.12 + .05 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt); const F = walkSpec(x, FY, SME, 1, ph, lerp(96, 250, k), lerp(.22, .02, k), lerp(16, 70, k)); F.run = tt < 8.4 ? k : 0;
      F.eye = k > .5 ? 'happy' : 'calm'; F.tilt = lerp(.1, -.12, k); return [F, -1.02]; }
    const F = walkSpec(x, FY, SME, 1, ph, 150, .1, 34); F.eye = 'happy'; return [F, -1.0];
  };
  const sawHeld = t < CUTS[2].drop;
  const carried = (F, a0, lf, held) => { const X = carryCross(F, lf, a0); gripCarry(F, X, held); F.strap = 1;
    if (held) { F.hands[1] = hangGrip(F, F.ph != null ? 10 * Math.sin(TAU * F.ph) : 0); } return [F, X]; };
  const me = F => { F.kind = 'me'; return F; };
  for (const c of CUTS) {
    if (t >= c.s && t < c.up1) {
      const lf0 = S.left[c.k], lf1 = S.left[c.k + 1], [W0, a0] = walk(c.s, c.mx), [W1, a1] = walk(c.up1, c.mx), last = c.k === 2;
      const [WA, XA] = carried(W0, a0, lf0, true), [WB, XB] = carried(W1, a1, lf1, !last);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      const PIN = c.u1 + PINU;
      if (t < c.s + c.d) { const k = eio((tp - c.s) / c.d), F = mixSpec(WA, SP, k), X = mixX(XA, XL, eio(clamp(k * 1.5)), .7);   // the beam gets down quickly (no long diagonal 'X' frames)
        const XX = attach(F, X, 0, lerp(farU(XA), PIN, k), -PW / 2 * k);   // the far wingtip, drawn in front, stays on the beam all the way down
        F.farFront = true; F.strap = 0;
        F.hands[1] = [lerp(WA.hands[1][0], cg[0], k), lerp(WA.hands[1][1], cg[1], k)]; F.hand = ['grip', 'grip'];
        return { F: me(F), X: XX, c, saw: { grip: F.hands[1], ang: lerp(hangAng(1), CUT_ANG, k) } }; }
      if (t < c.drop) { const st = sawState(c, t); return { F: me(sawSpec(c, t)), X: XL, c, kerf: st, saw: { grip: st.grip, ang: CUT_ANG } }; }
      const k = eio((tp - c.drop) / (c.up1 - c.drop)), k2 = eio((tp - c.drop) / ((c.up1 - c.drop) * .55)), F = mixSpec(SP, WB, k), X = mixX(XL, XB, eio(clamp(k * 1.6)), .3);   // ...and up onto the shoulder before the saw hand moves
      const XX = attach(F, X, 0, lerp(PIN, farU(XB), k), -PW / 2 * (1 - k));   // ...and lifts it back onto the back
      F.farFront = k < .85; F.strap = k > .85 ? 1 : 0;
      const rT = last ? cpt(XX, nearU(XB)) : WB.hands[1], kk = last ? k : k2;   // the saw hand stays low at the cut while the beam lifts away, then comes up
      F.hands[1] = [lerp(cg[0], rT[0], kk), lerp(cg[1], rT[1], kk)]; F.hand = ['grip', 'grip'];
      const saw = last ? null : { grip: F.hands[1], ang: lerp(CUT_ANG, hangAng(1), k2) };
      return { F: me(F), X: XX, c, saw };
    }
  }
  if (t < 12) { const [F, a] = walk(tp); const [G2, X] = carried(F, a, left, sawHeld); return { F: me(G2), X, saw: sawHeld ? { grip: G2.hands[1], ang: hangAng(1) } : null }; }
  // at the edge: stop short (shock), step back to let the others through, come back
  if (t < 18.4) { const [F0] = walk(12, EDGE), k = eio((tp - 12) / .3);
    const bx = -170 * eio((tp - 12.9) / .7) + 170 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.85, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.65, 17.55, .12, .12));
    const ST0 = standSpec(EDGE + bx, FY, SME, 1, .06), STx = mv > 0 ? mixSpec(ST0, walkSpec(EDGE + bx, FY, SME, 1, (EDGE + bx) / 120, 120, .08, 20), mv) : ST0;
    const F = mixSpec(F0, STx, k);
    F.ang += -.22 * Math.sin(Math.PI * clamp((tp - 12) / .5)) * (tp < 12.5 ? 1 : 0); F.eye = tp < 13.2 ? 'shock' : 'calm'; F.ticks = tp > 12.05 && tp < 13.2;
    if (tp > 13.4) F.look = tp < 17.6 ? [7, -2] : [6, 4];
    const [G2, X] = carried(F, -1.05, left, false); return { F: me(G2), X }; }
  const u0 = L * (1 - left), XLay = { x: E - REST - u0, y: LYY, a: 0, u0, lie: true };
  const LAY = me({ ...standSpec(EDGE, FY, SME, 1), hip: [EDGE - 4, FY - 58 * SME], ang: .62, feet: [[EDGE - 26, FY], [EDGE + 16, FY]], tilt: .3, look: [6, 6] });
  LAY.hands = [cpt(XLay, u0 + 50, -PW / 2), cpt(XLay, u0 + 16, -PW / 2)]; LAY.hand = ['flat', 'flat'];   // pressing the near end down on the lip
  const REACH = me({ ...LAY, hip: [EDGE - 10, FY - 66 * SME], ang: .42, hands: [[EDGE - 60, FY - 150], [EDGE + 150, FY - 40]], hand: ['open', 'open'], eye: 'shock', tilt: .5, look: [4, 9], ticks: true });
  if (t < B.tip) { if (t < 18.9) { const ST = me(standSpec(EDGE, FY, SME, 1, .06)), STc = carried(ST, -1.05, left, false), k = eio((tp - 18.4) / .4);
      const X = mixX(STc[1], XLay, eio(clamp(k * 1.4)), .55), F = mixSpec(STc[0], LAY, k);   // both wings stay on the beam while I lower it
      F.hands = [cpt(X, lerp(farU(STc[1]), u0 + 50, k), -PW / 2 * k), cpt(X, lerp(nearU(STc[1]), u0 + 16, k), -PW / 2 * k)];
      F.hand = k > .5 ? ['flat', 'flat'] : ['grip', 'grip']; F.strap = k < .4 ? 1 : 0; return { F: me(F), X }; }
    return { F: LAY, X: XLay }; }
  if (t < B.back) { const k = eio((tp - B.tip) / .22), F = mixSpec(LAY, REACH, k); F.hand = REACH.hand; F.bang = tp >= B.tip && tp < B.fall + .7; F.ticks = tp < 20.6;
    if (tp > 20.4) { F.eye = 'down'; F.ticks = false; } return { F: me(F), X: null }; }
  // I stay at the lip: turn and look back down the road at the pieces, then turn back to the gap and look down at the outline
  const BACK = me({ ...standSpec(EDGE, FY, SME, -1, .04), tilt: .08, eye: 'calm', look: [7, 3] }), FWD = me({ ...standSpec(EDGE, FY, SME, 1, .12), tilt: .34, eye: 'down', look: [6, 8] });
  if (t < 22.45) { const F = mixSpec(REACH, BACK, eio((tp - B.back) / .45)); F.eye = tp > B.back + .15 ? 'calm' : 'down'; F.ticks = tp > 21.75 && tp < 22.3; return { F, X: null }; }
  const F = mixSpec(BACK, FWD, eio((tp - 22.45) / .45)); if (tp < 22.6) F.eye = 'calm'; return { F, X: null };
}
// my cross once my wings slip: it tips over the lip, then falls into the slot
function fallX(t) {
  if (t < B.tip) return null;
  const left = S.left[3], u0 = L * (1 - left), pv = [E, LYY + PW / 2];
  const X0 = { x: E - REST - u0, y: LYY, a: 0, u0, lie: true };
  if (t < B.fall) return rotAbout(X0, pv, .5 * Math.pow((t - B.tip) / (B.fall - B.tip), 2));
  const X1 = rotAbout(X0, pv, .5), u = t - B.fall, cu = (u0 + L) / 2, c0 = cpt(X1, cu);
  const cx = c0[0] + 80 * u, cy = c0[1] + 160 * u + 1500 * u * u, a = X1.a + 2.4 * u + 1.2 * u * u;
  return { ...X1, x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, alpha: 1 - ss(B.fall + .55, B.fall + 1.0, t), clip: true };
}

// ---------------- the others: lay it across → walk over → pull it back from the far side → shoulder it → into the light ----------------
const PIL = [{ x0: -620, ph: .3 }, { x0: -340, ph: .75 }, { x0: 310, ph: .1 }, { x0: 580, ph: .55 }];
const BRIDGE_Y = [BY - 4, BY + 4, BY + 12], PULL = 190, PEDGE = () => E - 40;
function pilState(i, t) {
  const tp = t12(t), P = PIL[i], j = 3 - i, T = j < 3 ? B.bridges[j] : 99, yb = BRIDGE_Y[j] ?? BY, pe = PEDGE();
  const tag = F => { F.kind = 'pil'; F.id = i; return F; };
  const xAt = tt => { if (tt <= 9 || j > 2) return P.x0 + 50 * tt; const xa = P.x0 + 450, xb = E - 300 - 130 * j, xc = pe;
    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, clamp((tt - 12) / (T - .35 - 12))); };
  const carry = (tt, x, gy = BY, stride = 100, lean = .26) => { const F = tag(walkSpec(x, gy, SPI, 1, P.ph + x / stride, stride, lean, 14)); F.tilt = .08; const X = carryCross(F, 1, -1.08); gripCarry(F, X, false); F.strap = 1; return [F, X]; };
  if (j > 2) { if (t >= 12) return null; const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  if (t < T - .35) { const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  const XB = { x: E - REST, y: yb, a: 0, u0: 0, lie: true };
  const LAY = tag({ ...standSpec(pe, BY, SPI, 1), hip: [pe - 4, BY - 58 * SPI], ang: .6, feet: [[pe - 22, BY], [pe + 14, BY]], tilt: .25 });
  LAY.hands = [cpt(XB, 48, -PW / 2), cpt(XB, 16, -PW / 2)]; LAY.hand = ['flat', 'flat'];
  if (t < T) { const [F0, X0] = carry(T - .35, pe), k = eio((tp - T + .35) / .35), X = mixX(X0, XB, eio(clamp(k * 1.4)), .55), F = tag(mixSpec(F0, LAY, k));
    F.hands = [cpt(X, lerp(farU(X0), 48, k), -PW / 2 * k), cpt(X, lerp(nearU(X0), 16, k), -PW / 2 * k)]; F.hand = ['grip', 'grip']; return { F, X }; }
  const xs0 = E - 10, xs1 = E + G + 60;
  if (t < T + .3) { const F = tag(mixSpec(LAY, standSpec(xs0, yb - PW / 2, SPI, 1, .1), eio((tp - T) / .25))); return { F, B: XB }; }
  if (t < T + .9) { const x = lerp(xs0, xs1, eio(clamp((tp - T - .3) / .6))), gy = x < E + G + 4 ? yb - PW / 2 : BY;
    const F = tag(walkSpec(x, gy, SPI, 1, P.ph + x / 130, 130, .1, 24)); return { F, B: XB }; }
  // from the far side: turn, crouch, take the top end and pull it back across (pressing it down over the far lip as a lever)
  const pv = [E + G, yb + PW / 2], pullX = k => rotAbout({ ...XB, x: XB.x + PULL * k }, pv, -.1 * k), xpAt = k => xs1 + 30 + PULL * k;
  const PULLS = k => { const X = pullX(k), x = xpAt(k); const F = tag({ ...standSpec(x, BY, SPI, -1), hip: [x + 6, BY - 56 * SPI], ang: -.5, feet: [[x + 24, BY], [x - 14, BY]], tilt: .2 });
    F.hands = [cpt(X, L - 30, -PW / 2), cpt(X, L - 62, -PW / 2)]; F.hand = ['grip', 'grip']; return [F, X]; };
  if (t < T + 1.25) { const k = eio(clamp((tp - T - .9) / .35)), [F, X] = PULLS(k);
    const k0 = eio((tp - T - .9) / .1); return { F: k0 < 1 ? tag(mixSpec(walkSpec(xs1, BY, SPI, 1, 0, 130, .1), F, k0)) : F, X }; }
  const [Fp, Xp] = PULLS(1), xg = xpAt(1);
  if (t < T + 1.5) { const k = eio((tp - T - 1.25) / .25), [Fc, Xc] = carry(T + 1.5, xg, BY, 120, .2), X = mixX(Xp, Xc, k, .3), F = tag(mixSpec(Fp, Fc, k));
    F.hands = [cpt(X, lerp(L - 30, farU(Xc), k), -PW / 2 * (1 - k)), cpt(X, lerp(L - 62, nearU(Xc), k), -PW / 2 * (1 - k))]; F.hand = ['grip', 'grip']; return { F, X }; }
  const x = lerp(xg, GX + 10, clamp((tp - T - 1.5) / .35)), [F, X] = carry(tp, x, BY, 120, .2);
  F.alpha = 1 - ss(T + 1.55, T + 1.85, t); if (F.alpha <= 0) return null;
  return { F, X };
}

// ---------------- camera ----------------
const mixCam = K.mixCam;
function camAt(t) {
  let c = { x: meX(t) + 70 + 80 * ss(4.3, 5.4, t), y: 1060, z: 1.12 };
  c = mixCam({ x: meX(t) + 40, y: 1080, z: 1.78 }, c, eio((t - 1.5) / 1.1));       // the hook: close on me (the saw in my wing), widening to the procession by ~2.6
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: (cc.mx + cc.cutX) / 2 + 10, y: 1150, z: 1.5 });
  c = mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = mixCam(c, mixCam(at(c2), at(c3), eio((t - 10.0) / .45)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));   // the gap stays out of frame until I reach it
  if (t >= 12) c = mixCam(c, { x: E + 330, y: 1040, z: .84 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = mixCam(c, { x: E + 120, y: 1120, z: 1.18 }, eio((t - 18.2) / .45));
  if (t >= B.fall) c = mixCam(c, { x: E + 110, y: 1230, z: 1.5 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .65) c = mixCam(c, { x: E + 100, y: 1110, z: 1.15 }, eio((t - B.fall - .65) / .7));
  if (t >= B.back) c = mixCam(c, { x: E - 255, y: 1110, z: 1.3 }, eio((t - B.back - .05) / .72));    // one move back along the road: the pieces glow where they lie
  if (t >= 22.2) c = mixCam(c, { x: E + 115, y: 1020, z: 1.2 }, eio((t - 22.2) / .65));          // and back: the gap, me at the lip, the outline
  [c.sx, c.sy] = K.shake(t, B.fall);
  return c;
}

// ---------------- the world (kit pieces placed for this story) ----------------
let MARKS = [], HOLE = null;
const NR = FY + 128, HF = BY - 46;   // the hole's near lip and far lip
function guide(t, k, al) {   // the dashed pen outline of my whole cross across the gap
  const S0 = mulM(K.M, HD.mat(E - REST, LYY, 0)), ol = HD.poly(crossOutline(true), true, 3), x1 = (L + 8) * k - 4;
  const pts = xf(ol.filter(p => p[0] <= x1 + .5), S0); if (pts.length < 2) return;
  K.g.save(); K.g.globalAlpha = al;
  const fillP = xf(clipU(crossOutline(true), 0, x1), S0); K.g.save(); K.g.globalAlpha = al * .5; K.g.fillStyle = '#fff'; pathS(K.g, fillP); K.g.fill(); K.g.restore();
  hiS(fillP, .16 * al);
  K.dashed(pts, t, 4200);
  K.g.restore();
}
function litSlots(t) {   // each slot of the missing span lights up — exactly one piece long; the outline stays a ghost, the gap stays open
  const S0 = mulM(K.M, HD.mat(E - REST, LYY, 0));
  for (const [t0, k] of SLOTS) { const a = eo((t - t0) / .3); if (a <= 0) continue; const c = CUTS[k];
    const P = xf(HD.poly(clipU(crossOutline(true), c.u0 + 2, c.u1 - 2), true, 3), S0);
    K.g.save(); K.g.globalAlpha = .82 * a; K.g.fillStyle = '#fff'; pathS(K.g, P); K.g.fill(); K.g.restore();
    hiS(P.map(q => [q[0] + 3, q[1] - 2]), .62 * a);
    const fl = 1 - ss(t0 + .15, t0 + .7, t); if (fl > 0) { const cc = xf([[(c.u0 + c.u1) / 2, 0]], S0)[0], rx = ((c.u1 - c.u0) / 2 + 26) * K.cam.z, ry = 44 * K.cam.z;
      for (let i = 0; i < 7; i++) { const an = -Math.PI * (.08 + i * .14), sg = HD.seg([cc[0] + Math.cos(an) * rx, cc[1] + Math.sin(an) * ry], [cc[0] + Math.cos(an) * rx * 1.35, cc[1] + Math.sin(an) * ry * 1.5], 2);
        K.g.save(); K.g.globalAlpha = fl; penS(sg, 4900 + k * 10 + i, { w: 10, ts: 3, te: 8, col: '#fff' }); penS(sg, 4900 + k * 10 + i, { w: 3.6, ts: 3, te: 8 }); K.g.restore(); } } }
}
function world(t) {
  // two unlit lamps from the lab, along the back of the road (gone once the verse takes the upper third)
  if (t < B.back) for (const [x, sd] of [[620, 5000], [1780, 5100]]) { const sx = toS([x, 0])[0]; if (sx > -200 && sx < W + 200) K.lamp(x, RT + 2, sd); }
  // puddle scribbles on the road (rippling), then the gap
  K.drawPuddles(MARKS, t);
  if (toS([E + G, 0])[0] > -40 && toS([E, 0])[0] < W + 40) K.drawGap(HOLE, [E, RT]);
  if (toS([GX - 300, 0])[0] < W + 40) K.doorway(t, { x: GX, gy: BY + 4, ay: GAY });
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  // back lane: a bridge (only ever one, its owner's), then the others
  for (const P of pils) if (P.B) drawCross(P.B, 0, L, { lying: true, seed: 330 + P.F.id * 9 });
  pils.slice().sort((a, b) => a.F.hip[0] - b.F.hip[0]).forEach(P => {
    const X = P.X, dc = X ? () => drawCross(X, X.u0, L, { lying: X.lie, seed: 340 + P.F.id * 9, alpha: P.F.alpha ?? 1 }) : null;
    drawBird(P.F, X && !X.lie ? dc : null, X && X.lie ? dc : null);
  });
  // the guide shows the missing span while my short cross hangs off the lip, and again when the pieces come back
  if (t >= 18.75 && t < 19.75) guide(t, eio((t - 18.75) / .35), 1 - ss(19.4, 19.75, t));
  if (t >= 22.35) { guide(t, eio((t - 22.35) / .45), 1); litSlots(t); }
  // the saw I left on the road after the last cut
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip; drawSaw([lerp(g0[0], SAWLIE.grip[0], k), lerp(g0[1], SAWLIE.grip[1], k)], lerp(CUT_ANG, SAWLIE.ang, k)); }
  // the pieces I cut, lying where they fell; once I look back each one glows where it lies (they never move)
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), hl = ss(B.back + .3 + (2 - c.k) * .18, B.back + .75 + (2 - c.k) * .18, t);
    const scr = drawCross(p, c.u0, c.u1, { lying: true, mine: true, seed: 360 + c.k * 7 });
    if (hl > 0 && scr) { const cc = toS([p.cx, p.cy]), pulse = hl * (.85 + .15 * Math.sin((t - B.back) * 4 + c.k));
      K.hl.save(); K.hl.globalAlpha = pulse; hiLine(scr.concat([scr[0]]), 26 * K.cam.z, .3); K.hl.restore();
      for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + .3, rx = ((c.u1 - c.u0) / 2 + 30) * K.cam.z, ry = 46 * K.cam.z, r1 = 1.25 + .1 * (i % 2);
        K.g.save(); K.g.globalAlpha = hl; penS(HD.seg([cc[0] + Math.cos(a) * rx, cc[1] + Math.sin(a) * ry], [cc[0] + Math.cos(a) * rx * r1, cc[1] + Math.sin(a) * ry * r1 * 1.15], 2), 4300 + c.k * 10 + i, { w: 3 }); K.g.restore(); } } }
  // me and my cross (and the saw in my near wing)
  const M = poseMe(t), F = M.F;
  const myCross = X => { if (X) drawCross(X, X.u0, L, { lying: X.lie, mine: true, seed: 300 }); };
  drawBird(F, M.X && !M.X.lie ? () => myCross(M.X) : null, () => {
    if (M.X && M.X.lie) myCross(M.X);
    if (M.kerf) { const a = toS([M.c.cutX, M.c.y - PW / 2]), b = toS([M.c.cutX, M.c.y - PW / 2 + M.kerf.kp * PW * .92 + .5]); penS([a, b], 4500, { w: 3.6, raw: true, ts: 1, te: 1, mn: 1 }); }
    if (M.saw) drawSaw(M.saw.grip, M.saw.ang);
  });
  // a snap line at each cut
  if (M.c && t >= M.c.drop && t < M.c.drop + .12) { const c = M.c; for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * .45;
    penW(HD.seg([c.cutX + Math.cos(a) * 30, c.y - 20 + Math.sin(a) * 30], [c.cutX + Math.cos(a) * 58, c.y - 20 + Math.sin(a) * 58], 2), 4600 + i, { w: 3.4 }); } }
  // my cross over the edge: tips, falls (clipped to the slot)
  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { K.g.save(); if (FX.clip) { const hp = HOLE.poly.map(toS); pathS(K.g, hp); K.g.clip(); K.hl.save(); pathS(K.hl, hp); K.hl.clip(); }
    drawCross(FX, FX.u0, L, { lying: true, mine: true, seed: 300, alpha: FX.alpha ?? 1 });
    if (FX.clip) K.hl.restore(); K.g.restore();
    if (FX.clip) { const u = t - B.fall, cc = cpt(FX, (FX.u0 + L) / 2); for (let i = -1; i <= 1; i++) penW([[cc[0] + i * 40, cc[1] - 120], [cc[0] + i * 40, cc[1] - 260]], 4700 + i, { w: 4.4, ts: 3, te: 14, mn: .3, col: '#fff' }); } }
  // the hit: a scribbled burst at the lip
  K.hit(t, B.fall, [E + 30, LYY]);
  // sawdust: little pen specks
  K.specks(FLECKS, t);
}

// ---------------- frame ----------------
function draw(ctx, t) {
  K.begin(ctx, t, camAt(t));
  const keep = [poseMe(t).F, ...[0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean).map(P => P.F)].map(K.keepBox);
  K.rain(t, { keep, hole: K.capRect(t, S.lines) });
  world(t);
  K.end(ctx, 1 - ss(B.end - .15, B.end + .35, t));   // the end card sits on plain paper
  K.captions(ctx, t, S.lines, { until: B.end }); K.endCard(ctx, t, S.endCard, B.end);
}
async function init() {
  K.init();
  buildTimeline();
  MARKS = K.puddles({ x0: -1700, x1: E + G + 1600, top: RT, skip: (x, y) => x > E - 40 && x < E + G + 40 && y > HF - 14 && y < NR + 30 });
  HOLE = K.gap({ cx: E + G / 2, top: HF, bottom: NR, half: G / 2 + 8 });
}
window.__dbg = () => ({ E, G, GX, cuts: CUTS.map(c => [c.mx, c.cutX, c.baseX, c.u0, c.u1]) });
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 92px 'Nanum Pen Script'", "400 92px 'Nanum Pen'"], init, draw });
</script>
