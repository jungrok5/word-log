/* 잘라 낸 건 다리였다 — 17 mobile-game-ad cartoon (code only; from style-lab lab-gamecartoon.html).
   The lab's look: every near shape has a thick dark ink outline (stroked under the fill), a flat base colour, one hard cel
   shadow and a glossy highlight; a banded storm sky with puffy cel clouds; the genre's motion — squash on footfalls,
   anticipation and overshoot, smears, speed lines, dust puffs, a crash-zoom with shake on the hit.
   The world is a side-on platformer: a dirt road on a grass bank, scrolling past; it ends at a gap no one can jump
   (a ravine cut through the land), and on the far side a plain stone arch whose door leaks the golden light (the lab's
   golden beam is the accent light). "Me" is the lab's cat — orange, blue goggles, red scarf — and MY CROSS is the one
   golden thing; the other pilgrims are quieter cats (grey, cream, brown, slate) with grey-brown wooden crosses.
   Choreography: the paper-cut version (cross-papercut.html), v2 beats in script.js.
   The style (ink + cel, the cat rig, carrying, sky, ground, ravine, gate, effects, captions, end card) is the house-style kit
   styles/gamecartoon (kit-gamecartoon.js, window.GameCartoon); this file keeps only the story. */
const GC = GameCartoon, S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;

const { FONT, INK, C, PME, PPI, P2, inked, cel, catMatrix, toWorld, drawCat, SH_NEAR, SH_FAR, walkSpec, standSpec, mixSpec, lerpP, frac, t12, layer, view, dustPuff, speedRing, speedLines } = GC;
const XME = GC.WOOD.gold, XPI = GC.WOOD.grey;   // my cross: golden honey wood (the accent); theirs: weathered grey-brown wood

// ---------------- geometry (world units) ----------------
const SME = .64, SPI = .58;                       // cat-local → world (me nearest, the others a little smaller)
const L = 560, PW = 30, CBX = 403, CBW = 30, CBH = 92, CBHL = 40;   // cross: length, post width, crossbar position/width/half-length (upright / lying)
const FY = 1340, BY = 1286;                       // front lane (me), back lane (the others)
const RT = 1250, RN = 1372;                       // road top surface: far edge, near edge (then its front face, then the meadow)
const REST = 24, G = L - 2 * REST;                // a full cross rests 24 px on each lip
const JL = [250, -372], CA = -.52;                // carried cross: where the crossbar crosses (cat-local, facing right), post angle

// ---------------- the cross (inked wood) ----------------
// X = { x, y, a, hb? } : foot origin (u = 0) and angle; draws material [u0, u1] along the post
function drawCross(ctx, X, u0, u1, pal, alpha = 1, glow = 0) {

  const hb = X.hb ?? CBH, hasBar = u1 >= CBX + CBW / 2 && u0 <= CBX - CBW / 2;
  ctx.save(); ctx.translate(X.x, X.y); ctx.rotate(X.a); ctx.globalAlpha = alpha;
  const rFoot = u0 < 1 ? 5 : 1, post = P2(p => p.roundRect(u0, -PW / 2, u1 - u0, PW, [rFoot, u1 > L - 1 ? 6 : 1, u1 > L - 1 ? 6 : 1, rFoot]));
  const bar = hasBar ? P2(p => p.roundRect(CBX - CBW / 2, -hb, CBW, 2 * hb, 6)) : null;
  if (glow > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(255,214,110,${.55 * glow})`; ctx.lineWidth = 34; ctx.lineJoin = 'round';
    ctx.stroke(post); if (bar) ctx.stroke(bar); ctx.lineWidth = 16; ctx.strokeStyle = `rgba(255,240,180,${.6 * glow})`; ctx.stroke(post); if (bar) ctx.stroke(bar); ctx.restore(); }
  ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 11; ctx.stroke(post); if (bar) ctx.stroke(bar);
  ctx.fillStyle = pal.wood; ctx.fill(post); if (bar) ctx.fill(bar);

  if (bar) { ctx.save(); ctx.clip(bar); ctx.fillStyle = pal.wood; ctx.fillRect(CBX - CBW / 2 + 1, -PW / 2 + 1, CBW - 2, PW - 9); ctx.restore(); }   // the post runs over the crossing

  ctx.save(); ctx.clip(post); ctx.strokeStyle = pal.grain; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  for (const [v, a, b] of [[-4, 30, 150], [3, 190, 330], [-2, 360, 520], [5, 60, 110], [6, 420, 480]]) { if (b < u0 || a > u1) continue; ctx.beginPath(); ctx.moveTo(Math.max(a, u0 + 4), v); ctx.lineTo(Math.min(b, u1 - 4), v + .8); ctx.stroke(); }

  ctx.fillStyle = pal.woodH; ctx.fillRect(u0 + 3, -PW / 2 + 4, u1 - u0 - 6, 4.5); ctx.restore();
  if (bar) { ctx.save(); ctx.clip(bar); ctx.fillStyle = pal.woodH; ctx.fillRect(CBX - CBW / 2 + 4, -hb + 4, 4.5, 2 * hb - 8); ctx.restore(); }

const cpt = (X, u, v = 0) => [X.x + Math.cos(X.a) * u - Math.sin(X.a) * v, X.y + Math.sin(X.a) * u + Math.cos(X.a) * v];

// ---------------- the saw ----------------
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]]; return { d, up }; }
function drawSaw(ctx, grip, ang) {
  const { d, up } = sawGeo(grip, ang), P = (u, v) => [grip[0] + d[0] * u + up[0] * v, grip[1] + d[1] * u + up[1] * v];
  const bl = P2(p => { p.moveTo(...P(16, 12)); p.lineTo(...P(186, 5)); p.lineTo(...P(190, -6));
    for (let u = 186; u >= 18; u -= 8) { const q = P(u, (u / 8 | 0) % 2 ? -14 : -9); p.lineTo(...q); } p.lineTo(...P(16, -16)); p.closePath(); });

  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(...P(30, 6)); ctx.lineTo(...P(160, 2)); ctx.stroke();
  const hd = P2(p => { p.moveTo(...P(20, 18)); p.lineTo(...P(-26, 26)); p.quadraticCurveTo(...P(-44, 6), ...P(-30, -18)); p.lineTo(...P(20, -20)); p.closePath(); });
  inked(ctx, hd, '#e0533c', 5); cel(ctx, hd, '#a8302a', -4 * up[0], -4 * up[1]);

// ---------------- the cats: the kit's rig (GameCartoon.drawCat) ----------------
// the carried cross: fixed to the cat (the crossbar ahead of its face), material [u0, L]
// The carried cross. Long (full, after the 1st cut): on the shoulder — the post rests across the back of the neck (the far paw
// holds it there), the crossbar rides ahead of the face, the foot trails behind. Short (after the 2nd cut): held up in front, nearly upright
// (a † ahead of the face, never an X), both paws on the post: near paw at the chest on the stump end, far paw higher up, ahead of the muzzle.
function carryX(F, left = 1) { return { ...GC.carryX(F, left > .7 ? 'shoulder' : 'front', CBX, L * (1 - left)), hb: CBH }; }

// ---------------- timeline: my path (integrated once), the cuts ----------------
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 2.95) return 44 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1)) * (1 - ss(2.75, 2.95, t));   // staggering
  if (t < 4.6) return 0;
  if (t < 5.0) return 420 * eio((t - 4.6) / .4);                            // lighter: big quick strides
  if (t < 8.3) return 420;
  if (t < 8.55) return lerp(420, 150, (t - 8.3) / .25);
  if (t < 8.75) return 150 * (1 - ss(8.55, 8.75, t));
  if (t < 10.2) return 0;
  if (t < 10.45) return 490 * Math.sin(Math.PI * (t - 10.2) / .25);     // crouched, I shuffle along the lying cross to the next cut (78 px)
  if (t < 11.7) return 0;
  if (t < 12.0) return 1571 * Math.sin(Math.PI * (t - 11.7) / .3);     // pick it up and dash for the gap
  return 0;
}
const strideMe = t => t < 4.6 ? 70 : t < 8.8 ? 210 : 130;   // world px per step cycle
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };

// each cut: put it down (s → s+pd, facing right, both paws on it) · turn to the foot · saw (saw0 → drop) · turn back · pick it up (→ up1)
// cuts 2 and 3 run on: after the 2nd cut I stay crouched, shuffle along the lying cross and cut "one more" (no pick-up in between)
const CUTS = [{ s: 2.95, pd: .45, saw0: 3.55, drop: 4.0, up1: 4.6 }, { s: 8.75, pd: .45, saw0: 9.32, drop: 9.8, stay: true }, { s: 9.8, pd: 0, saw0: 10.72, drop: 11.2, up1: 11.72, cont: true }];
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const FILL = [[22.2, 23.3], [22.65, 23.7], [23.1, 24.1]];
let E = 2000, GX = 0, SAWLIE = null;
const CHIPS = [];
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }
  E = Math.round(meX(12) + 70); GX = E + G + 235;
  CUTS.forEach((c, k) => {
    c.k = k; c.mx = meX(c.saw0); c.cutX = c.mx - 150; c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.baseX = c.cutX - c.u1; c.y = FY + 22;
    const r = rng(100 + k);
    for (let n = 0; n < 16; n++) CHIPS.push({ t0: n < 11 ? lerp(c.saw0, c.drop, n / 11) : c.drop + r() * .05, x: c.cutX + (r() - .5) * 8, y: c.y - PW / 2,
      vx: (r() - .5) * (n < 11 ? 200 : 340), vy: -(100 + r() * (n < 11 ? 180 : 280)), land: FY + 16 + r() * 40, r0: r() * TAU, vr: (r() - .5) * 20, sz: 5 + r() * 5, col: XME.wood });
  });
  const c3 = CUTS[2]; SAWLIE = { grip: [c3.cutX + 330, FY + 34], ang: Math.PI - .04 };
  const r = rng(200);
  for (let n = 0; n < 14; n++) CHIPS.push({ t0: B.fall + r() * .1, x: E + 4 + r() * 30, y: FY + 18, vx: (r() - .2) * 240, vy: -(60 + r() * 200), land: 2700, r0: r() * TAU, vr: (r() - .5) * 24, sz: 5 + r() * 6, col: n % 3 ? XME.wood : C.dirt });
}
function pieceAt(c, t) {   // a cut piece lying where it fell, or flying into the gap at the end
  const sh = 18 * eo((t - c.drop) / .25), cu = (c.u0 + c.u1) / 2;
  let cx = c.baseX + cu - sh, cy = c.y, a = -.04 * eo((t - c.drop) / .25);
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, hb: CBHL };
}

// ---------------- my poses ----------------
const CUT_ANG = Math.PI - .62, hangAng = f => f > 0 ? Math.PI - .35 : .35;
function sawState(c, t) {   // the stroke: the teeth pass through the kerf, the blade moves along its own length
  const kp = clamp((t - c.saw0) / (c.drop - .06 - c.saw0)), saw = t >= c.saw0 - .05 && t < c.drop + .02;
  const osc = saw ? 26 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, { d, up } = sawGeo([0, 0], CUT_ANG);
  const K = [c.cutX, c.y - PW / 2 + kp * PW * .9], sk = 110 + osc;

}
function sawSpec(c, t) {   // crouched behind the cross on the road, facing left toward its foot, the far paw pins it, the near paw saws
  const st = sawState(c, t), F = standSpec(c.mx, FY, SME, -1, { lean: .5, crouch: .55, tilt: .22, eye: 'focus', mouth: 'frown' });
  F.far = [c.cutX + 52, c.y - PW / 2 - 4]; F.farKind = 'flat'; F.farFront = true; F.near = st.grip; F.nearKind = 'fist'; return F;
}
function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), left = leftAt(t);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const F = walkSpec(x, FY, SME, 1, ph, { amp: .8, stride: .8, lift: .6, lean: .2 + .06 * Math.sin(tt * TAU / 1.15), tilt: .14, eye: 'tired', mouth: 'frown' });
      F.sweat = true; F.bob += 8 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return F; }
    if (tt < 8.8) { const k = ss(4.6, 5.1, tt), F = walkSpec(x, FY, SME, 1, ph, { amp: 1, stride: lerp(.8, 1.7, k), lift: lerp(.6, 1.9, k), lean: lerp(.1, .26, k), tilt: lerp(.1, -.08, k), eye: k > .5 ? 'happy' : 'calm', mouth: k > .5 ? 'grin' : 'w' }); return F; }
    return walkSpec(x, FY, SME, 1, ph, { amp: 1, stride: 1.2, lift: 1.1, lean: .12, tilt: -.02, eye: 'happy', mouth: 'grin' });
  };

  const nearHang = F => toWorld(catMatrix(F), [SH_NEAR[0] + 42, SH_NEAR[1] + 70 + (F.bob || 0)]);
  const sawAng = (F, onBeam) => onBeam ? (F.f > 0 ? Math.PI - .3 : .3) : hangAng(F.f) + .25 * Math.sin(F.ph || 0) * (F.amp || 0);

      if (c.cont && t < c.saw0) {   // still crouched facing the foot: shuffle along the cross to the next cut, saw raised, the pin paw moves with me
        const p = CUTS[c.k - 1], SPa = sawSpec(p, p.drop - .01), SPb = sawSpec(c, c.saw0), k = eio((tp - 10.2) / .25), F = mixSpec(SPa, SPb, k);
        F.x = meX(t); F.bob = -14 * Math.sin(Math.PI * clamp((tp - 10.2) / .25)); F.near = lerpP(SPa.near, SPb.near, k); F.far = lerpP(SPa.far, SPb.far, eio((tp - 10.1) / .2));
        F.farFront = true; F.farKind = 'flat'; F.eye = 'focus'; F.mouth = 'frown';
        return { F, X: { x: c.baseX, y: c.y, a: 0, hb: CBHL }, lieX: true, c, held: lf0, saw: { grip: F.near, ang: CUT_ANG } }; }

      const CR = standSpec(c.mx, FY, SME, 1, { lean: .42, crouch: .55, tilt: .18, eye: 'focus', mouth: 'frown' });   // crouched over it, facing right, both paws on the beam

        F.near = lerpP(CR.near, SP.near, k); F.far = lerpP(CR.far, SP.far, k); F.sx *= 1 - .1 * Math.sin(Math.PI * k);
        return { F, X: XL, lieX: true, c, held: lf0, saw: { grip: F.near, ang: k < .5 ? Math.PI - .12 : CUT_ANG } }; }

  const XU = xm => ({ x: xm + 100, y: FY - 4 + L * (1 - left), a: -Math.PI / 2, hb: CBH });
  const upGrip = (F, X) => { F.near = cpt(X, CBX - 34, 0); F.nearKind = 'fist'; F.far = null; F.farFront = false; return F; };

    const bx = -170 * eio((tp - 12.95) / .7) + 170 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.9, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.7, 17.55, .12, .12));
    const ST0 = standSpec(E - 70 + bx, FY, SME, 1, { lean: .06, eye: tp < 13.4 ? 'shock' : 'sad', mouth: tp < 13.4 ? 'oh' : 'frown', tilt: tp < 13.4 ? -.1 : .04 });
    const STx = mv > 0 ? mixSpec(ST0, { ...walkSpec(E - 70 + bx, FY, SME, 1, (E + bx) / 110, { stride: .9, eye: ST0.eye }), mouth: ST0.mouth }, mv) : ST0;

  const XLay = LAYX();

  LAY.far = cpt(XLay, L - 58, -PW / 2 - 4); LAY.near = cpt(XLay, L - 14, -PW / 2 - 4); LAY.farKind = LAY.nearKind = 'flat'; LAY.farFront = true; LAY.farReach = 270;
  const REACH = { ...standSpec(E - 92, FY, SME, 1, { lean: .42, crouch: .25, tilt: .1, eye: 'shock', mouth: 'oh' }), far: [E - 175, FY - 75], near: [E + 50, FY - 10], farKind: 'fist', nearKind: 'flat', farFront: false };
  if (t < B.tip) {

      const ST = upGrip(standSpec(E - 70, FY, SME, 1, { lean: .06, eye: 'focus', mouth: 'frown' }), XU(E - 70)), X0 = XU(E - 70), k = eio((tp - 18.4) / .5), kx = eio((t - 18.4) / .5), F = mixSpec(ST, LAY, k);

const LAYX = () => ({ x: E - REST + L, y: FY + 18, a: -Math.PI, hb: CBHL });   // my cross laid stump-first: top end on the near lip, foot (or stump) toward the far side

function fallX(t) {

// ---------------- the others: lay it across → walk over → pull it back from the far side → shoulder it → into the light ----------------
const PIL = [{ x0: -560, ph: .3 }, { x0: -330, ph: .75 }, { x0: 330, ph: .1 }, { x0: 620, ph: .55 }];
const BRIDGE_Y = [BY - 2, BY + 8, BY + 18], PULL = 360;

  const xAt = tt => { if (tt <= 9 || j > 2) return P.x0 + 52 * tt; const xa = P.x0 + 468, xb = E - 300 - 130 * j, xc = E - 70;
    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, clamp((tt - 12) / (T - .45 - 12))); };

  LAY.far = cpt(XB, 62, -PW / 2 - 6); LAY.near = cpt(XB, 20, -PW / 2 - 6); LAY.farKind = LAY.nearKind = 'flat'; LAY.farFront = true;
  if (t < T) { const D = .45, [F0, X0] = carry(T - D, E - 70), k = eio((tp - T + D) / D), kx = eio((t - T + D) / D), F = dress(mixSpec(F0, LAY, k)), X = mixX(X0, XB, kx);

// ---------------- camera ----------------
const mixCam = GC.mixCam;
function camAt(t) {

  c = mixCam({ x: meX(t) + 80, y: 1150, z: 2.0 }, c, eio((t - 1.4) / 1.2));       // the hook: close on me (the saw in my paw), widening to the procession by ~2.6
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: (cc.mx + cc.cutX) / 2 + 30, y: 1180, z: 1.4 });
  c = mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = mixCam(c, mixCam(at(c2), at(c3), eio((t - 10.15) / .4)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));   // the gap stays out of frame until I reach it
  if (t >= 12) c = mixCam(c, { x: E + 262, y: 1030, z: .86 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = mixCam(c, { x: E + 150, y: 1130, z: 1.12 }, eio((t - 18.2) / .45));

  if (t >= 22.25) c = mixCam(c, { x: E + 205, y: 1150, z: 1.2 }, eio((t - 22.25) / .65));                // return: the gap, me at the lip, the outline

function crossOutline(x, y) { const hb = CBHL; return [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],

// ---------------- the world ----------------
function world(ctx, t, cm) {

  const glow = ss(24.2, 24.8, t);
  const gateOn = v.x1 > GX - 500;
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);

  if (M.lieX && M.X) { const Xl = M.X; F.mid = null; drawCross(ctx, Xl, L * (1 - M.held), L, XME); if (M.kerf) { ctx.fillStyle = INK; ctx.fillRect(M.c.cutX - 2.2, M.c.y - PW / 2 - 1, 4.4, M.kerf.kp * PW * .9 + 1); } }

}

// ---------------- frame ----------------
let GATE = null;
function draw(ctx, t) {
  const cm = camAt(t), warm = 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  GC.sky(ctx, t, cm, warm, [1.05, 13.1]);   // storm sky, cel clouds, lightning at 1.05 and 13.1
  GC.farLayers(ctx, cm, warm);
  let M; layer(ctx, cm, 1, () => { M = world(ctx, t, cm); });
  // emphasis: the run, the stop at the edge, the hit

  speedRing(ctx, 540, 1000, (t >= 12 ? 1 - ss(12.08, 12.5, t) : 0) * .7, 13, 520);

}

}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: GC.FONTS, init, draw });
