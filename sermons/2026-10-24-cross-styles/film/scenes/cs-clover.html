<script>
/* 잘라 낸 건 다리였다 — 11 pastel clover picnic (watercolour + coloured pencil), from lab-clover (code version).
   Every shape is a transparent wash on cold-press paper: flat colour with soft blooms, pigment pooled darker at the edges,
   a thin broken coloured-pencil contour in a darker shade of itself. Depth by softness and value: pale blurred clover far,
   crisp saturated leaves near. Big three-leaf clovers with pale chevrons, white clover flower balls, grass blades.
   The pilgrims are round little hamsters (the lab's hamster). Me: the orange one, carrying a cross of warm honey-gold wood
   (the one accent; the others are pale grey/cream hamsters with weathered grey crosses). The road is a sandy footpath
   through the clover; the gap is a brook gully a hamster cannot step over; on the far side a plain round arch of bent
   willow twig with warm sunlight pouring through (the lab's sunbeam). The hit: my short cross drops into the brook — a
   watercolour splash, crash zoom and shake. The cut pieces glow honey-gold, lift and fly into a dashed pencil outline
   of my whole cross over the gully. Native motion: leaves and flower heads sway, dappled light drifts over the path,
   the brook ripples, motes drift in the sunbeam, a ladybug walks a leaf.
   The style (washes, clover pieces, meadow sheets, gully, willow arch + sunbeam, the hamster rig, wood, splash, camera,
   paper, words) is the house kit `kit-clover.js` (styles/clover); this file keeps only the story. */
const K = window.Clover, S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;

const L = 520, PW = 34, CBX = L - 140, CBW = 32, CBH = 104, CBHL = 40;   // cross: post length, width; crossbar (from foot), thickness, half-length upright / lying
const FY = 1300, BY = 1250, RT = 1204, PN = 1352;                         // my lane, the others' lane, the path's far / near edge
const REST = 26, G = L - 2 * REST;                                         // a full cross rests 26 px on each lip: the gully is G wide
const KM = 2.5, KP = 2.2;                                                  // hamster scale (world px per lab unit): me / the others
const WATER = 2010;   // the brook, far below (mostly out of frame, in shadow)
const D = { L, PW, CBX, CBW, CBH, CBHL };   // the cross's dims for the kit's wood sprites
const TX = {}, FX = {};
const crossSprite = (col, edge, line, lying, seed) => K.crossSprite(col, edge, line, lying, seed, D), drawCross = K.drawCross;

// ---------------- timeline: my path (integrated once), the cuts ----------------
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
const RUNV = 330;
function vMe(t) {
  if (t < 3.2) return 40 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1));          // staggering under the whole cross
  if (t < 4.6) return 0;
  if (t < 5.0) return RUNV * eio((t - 4.6) / .4);                              // lighter: big bounding hops
  if (t < 8.3) return RUNV;
  if (t < 8.6) return lerp(RUNV, 130, (t - 8.3) / .3);
  if (t < 9.0) return 130 * (1 - ss(8.6, 9.0, t));
  if (t < 10.0) return 0;
  if (t < 10.4) return 380 * Math.sin(Math.PI * (t - 10) / .4);

}
const strideMe = t => t < 4.6 ? 84 : t < 8.8 ? 230 : 120;   // world px per step cycle (waddle) / per hop
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };

const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const FLECKS = [], DROPS = [];
let E = 1600, GX = 0, GAY = 0, ROADX0 = -1500, ROADX1 = 0, SAWLIE = null;
const CUTD = 190;   // the cut point is this far ahead of me when I saw (facing back)
function buildTimeline() {
  let x = 0, p = 0;

    const r = rng(100 + k);

      vx: (r() - .5) * (n < 13 ? 160 : 300), vy: -(70 + r() * (n < 13 ? 150 : 240)), land: FY + 22 + r() * 40, r0: r() * TAU, vr: (r() - .5) * 20, sz: 3 + r() * 4, col: r() < .5 ? '#f6dca4' : '#e8bd76' });
  });

}
function pieceAt(c, t) {   // a cut piece lying where it fell — it never moves again (v2: nothing is repaired)
  const sh = 18 * eo((t - c.drop) / .25), y0 = c.y, cu = (c.u0 + c.u1) / 2;
  const cx = c.baseX + cu - sh, cy = y0, a = -.05 * eo((t - c.drop) / .25);
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a };
}
const SLOTS = [22.9, 23.6, 24.3];   // the outline's missing span lights one piece-length at a time (soft knocks in the soundtrack)

// ---------------- the carried cross ----------------
// the post rests against my chest/shoulder (local 34, -34) and rises ahead; the foot trails behind toward the road
function carryX(F, left, a0) {
  const u0 = L * (1 - left), contact = clamp(Math.max(212, u0 + 6), 212, CBX - 106);
  const flat = left < .55; if (flat) a0 = 0;                                                   // the short cross is carried flat (crossbar foreshortened), clear of the face
  const X = K.carryLong(F, a0, { contact, u0 });                                              // (the foot never goes through the road)
  X.u0 = u0; X.lie = false; X.flat = flat; return X;
}
const SAW_PAW = [50, -45];   // the saw paw: in front of the chest, just under the muzzle, above the post
function gripCarry(F, X, sawHeld) { F.paws = [upOn(X, Math.max(X.u0 + 8, X.contact - 34), PW / 2 - 4), sawHeld ? worldPt(F, ...SAW_PAW) : upOn(X, X.contact + 14, PW / 2 - 4)];
  F.nearLow = false; F.nearSh = null; F.farBehind = true; F.farSh = [8, -54]; return F; }

// ---------------- the saw ----------------
// P(u, v) = grip + d·u + up·v; the handle spans u −24…10, the blade u 10…114 with its teeth along v = −10
const BLEN = 104;

  ctx.fillStyle = 'rgba(120,80,50,.55)'; ctx.fill(smooth([P(2, 16), P(-10, 18), P(-16, 8), P(-12, -2), P(2, -2)]));   // the grip hole

const CUT_ANG = Math.PI - .56;   // the cutting stroke (facing back, blade down-forward)
function sawState(c, t) {

}
function sawSpec(c, t) {
  const st = sawState(c, t);   // (far arm behind the body)
  return { x: c.mx, gy: FY, k: KM, f: -1, lean: .46, crouch: .9, bob: 0, sq: 1, head: -.25, eye: 'strain', feet: [[-22, 0], [18, 0]], paws: [[c.cutX + 92, c.y - PW / 2 + 1], st.grip], pal: PAL.me, farBehind: true, tag: 'saw' };
}
const hangSaw = (F, sw = 0) => ({ grip: worldPt(F, ...SAW_PAW), ang: Math.PI / 2 - F.f * (.42 + sw) });

// ---------------- me ----------------
function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), left = leftAt(t);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const sway = Math.sin(tt * TAU / 1.15); const F = hamWalk(x, FY, KM, 1, ph, { stride: 18, lift: 5, lean: .26 + .06 * sway, bob: 2.5, waddle: .04, head: -.35, eye: 'strain' });
      F.crouch = .25 + .12 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, .44 + .04 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.1, tt); if (k < 1) { const F = hamWalk(x, FY, KM, 1, ph, { stride: 22, lift: 7, lean: .2, head: -.1, eye: 'open' }); return [k > 0 ? mixSpec(F, hamWalk(x, FY, KM, 1, ph, { hop: 34, lean: .28, head: .1, eye: 'open' }), k) : F, .36]; }
      const F = hamWalk(x, FY, KM, 1, ph, { hop: 34 * (1 - ss(8.3, 8.75, tt)), lean: .28, head: .15, eye: 'open' }); return [F, .34]; }
    return [hamWalk(x, FY, KM, 1, ph, { stride: 30, lift: 10, lean: .18, head: .05, eye: 'open' }), .34];
  };
  const sawHeld = t < CUTS[2].drop;
  const carried = (F, a0, lf, held) => { F.pal = PAL.me; F.tag = 'carry'; const X = carryX(F, lf, a0); gripCarry(F, X, held); return [F, X]; };
  { const c2 = CUTS[1], c3 = CUTS[2];   // after the second piece drops I stay crouched and shuffle along the beam to the next cut (no pop up and down)
    if (t >= c2.drop && t < c3.saw0) { const k = eio((tp - c2.drop - .05) / (c3.saw0 - c2.drop - .12)), A = sawSpec(c2, c2.drop - .01), Bs = sawSpec(c3, c3.saw0 - .01), F = mixSpec(A, Bs, k);
      F.pal = PAL.me; F.farBehind = true; F.bob = 5 * Math.abs(Math.sin(Math.PI * 2 * k)); F.eye = 'open'; F.tag = 'shuffle';
      const u0 = L * (1 - S.left[2]), XA = { x: c2.baseX, y: c2.y, a: 0, u0, lie: true }, XB = { x: c3.baseX, y: c3.y, a: 0, u0, lie: true };
      return { F, X: mixX(XA, XB, k), saw: { grip: F.paws[1], ang: CUT_ANG } }; } }
  for (const c of CUTS) {
    const w0 = c.k === 2 ? c.saw0 : c.s, w1 = c.k === 1 ? c.drop : c.up1;
    if (t >= w0 && t < w1) {
      const lf0 = S.left[c.k], lf1 = S.left[c.k + 1], [W0, a0] = walk(c.s, c.mx), [W1, a1] = walk(c.up1, c.mx), last = c.k === 2;
      const [WA, XA] = carried(W0, a0, lf0, true), [WB, XB] = carried(W1, a1, lf1, !last);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      if (t < c.s + c.d) { const k = eio((tp - c.s) / c.d), F = mixSpec(WA, SP, k); F.pal = PAL.me; F.eye = 'open';
        const hs = hangSaw(WA); F.paws[1] = [lerp(hs.grip[0], cg[0], k), lerp(hs.grip[1], cg[1], k)]; F.farBehind = true;
        return { F, X: mixX(XA, XL, k), c, saw: { grip: F.paws[1], ang: lerp(hs.ang, CUT_ANG + (CUT_ANG < hs.ang ? 0 : 0), k) } }; }

      const k = eio((tp - c.drop) / (c.up1 - c.drop)), F = mixSpec(SP, WB, k); F.pal = PAL.me; F.eye = 'open';
      const hs = hangSaw(WB); if (!last) F.paws[1] = [lerp(cg[0], hs.grip[0], k), lerp(cg[1], hs.grip[1], k)];
      F.farBehind = true;
      return { F, X: mixX(XL, XB, k), c, saw: { grip: F.paws[1], ang: lerp(CUT_ANG, last ? CUT_ANG + .3 : hs.ang, k) } };
    }
  }

    return { F: G2, X, saw: sawHeld ? hangSaw(G2, .12 * Math.sin(TAU * (G2.ph || 0))) : null }; }
  // at the edge: stop short (startled), step aside for the others, come back
  if (t < 18.4) { const [F0] = walk(12, E - 168), k = eio((tp - 12) / .3);
    const bx = -190 * eio((tp - 12.9) / .7) + 190 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.85, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.65, 17.55, .12, .12));
    const st = standSpec(E - 168 + bx, FY, KM, 1, { lean: .1, eye: 'open' });
    const STx = mv > 0 ? mixSpec(st, hamWalk(E - 168 + bx, FY, KM, 1, (E + bx) / 110, { stride: 28, lean: .14 }), mv) : st;
    const F = mixSpec(F0, STx, k); F.pal = PAL.me;
    F.lean += -.22 * Math.sin(Math.PI * clamp((tp - 12) / .5)); F.eye = tp < 13.2 ? 'shock' : 'open'; F.head = tp < 13.2 ? .2 : .1;
    const [G2, X] = carried(F, .34, left, false); return { F: G2, X }; }
  const XLay = { x: E - REST - L * (1 - left), y: FY + 30, a: 0, u0: L * (1 - left), lie: true };
  const LAY = { ...standSpec(E - 156, FY, KM, 1), lean: .52, crouch: .55, head: -.15, eye: 'open', pal: PAL.me, tag: 'lay' };
  LAY.paws = [upOn(XLay, L * (1 - left) + 46, PW / 2 - 3), upOn(XLay, L * (1 - left) + 12, PW / 2 - 3)]; stepTo(LAY, 10);   // pressing the cut end down on the lip
  const REACH = { ...LAY, x: E - 148, lean: .48, crouch: .35, paws: [[E - 30, FY - 120], [E + 6, FY - 60]], eye: 'shock', head: .15, tag: 'reach' };
  if (t < B.tip) { if (t < 18.9) { const ST = standSpec(E - 168, FY, KM, 1, { lean: .08 }); ST.pal = PAL.me; const STc = carried(ST, .34, left, false), k = eio((tp - 18.4) / .4);
      const F = mixSpec(STc[0], LAY, k); F.pal = PAL.me; return { F, X: mixX(STc[1], XLay, eio((t - 18.4) / .4)), lay: true }; }

  const kk = eio((tp - 22.6) / .4), F = mixSpec(BACK, FWD, kk); F.pal = PAL.me; F.sq = 1 - .09 * Math.sin(Math.PI * kk); F.eye = tp > 24.5 ? 'wet' : 'open'; F.head = -.05 - .1 * ss(23.0, 24.6, tp); F.lean = .1 + .06 * ss(24.4, 25.4, tp); return { F, X: null };
}
// my cross once my paws slip: it tips over the lip, then falls into the brook
function fallX(t) {
  if (t < B.tip) return null;
  const left = S.left[3], u0 = L * (1 - left), pv = [E, FY + 30 + PW / 2];
  const X0 = { x: E - REST - u0, y: FY + 30, a: 0, u0, lie: true };
  if (t < B.fall) return rotAbout(X0, pv, .45 * Math.pow((t - B.tip) / (B.fall - B.tip), 2));
  const X1 = rotAbout(X0, pv, .45), u = t - B.fall, cu = (u0 + L) / 2, c0 = cpt(X1, cu);
  const cx = c0[0] + 50 * u, cy = Math.min(c0[1] + 160 * u + 1500 * u * u, WATER), a = X1.a + 2.0 * u + 1.0 * u * u;
  return { ...X1, x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, alpha: 1 - ss(B.fall + .3, B.fall + .62, t), dark: ss(B.fall + .05, B.fall + .45, t), clip: true };
}
const SPLASH = () => B.fall + .62;   // when it reaches the water, far below

// ---------------- the others: lay it across → walk over → pull it back from the far side → shoulder it → into the light ----------------
const PIL = [{ x0: -700, ph: .3 }, { x0: -400, ph: .75 }, { x0: 300, ph: .1 }, { x0: 470, ph: .55 }];
const BRIDGE_Y = [BY + 22, BY + 30, BY + 38], PULL = 150;
function pilState(i, t) {
  const tp = t12(t), P = PIL[i], j = 3 - i, T = j < 3 ? B.bridges[j] : 99, yb = BRIDGE_Y[j] ?? BY, pal = PAL.p[i];
  const xAt = tt => { if (tt <= 9 || j > 2) return P.x0 + 50 * tt; const xa = P.x0 + 450, xb = E - 430 - 280 * j, xc = E - 128;
    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, clamp((tt - 12) / (T - .35 - 12))); };

  if (j > 2) { if (t >= 12) return null; const [F, X] = carry(tp, xAt(tp)); return { F, X }; }

  if (t < T) { const [F0, X0] = carry(T - .35, E - 128), k = eio((tp - T + .35) / .35); return { F: { ...mixSpec(F0, LAY, k), pal }, X: mixX(X0, XB, eio((t - T + .35) / .35)) }; }

    const F = hamWalk(x, gy, KP, 1, P.ph + x / 110, { stride: 30, lift: 11, lean: .2, head: .05, eye: 'open' }); F.pal = pal; return { F, B: XB }; }
  // from the far side: turn, crouch, take the top end and pull it back, levering it up out of the gully over the far lip
  const pullX = k => rotAbout({ ...XB, x: XB.x + PULL * k }, [E + G + PULL * k, yb + PW / 2], .8 * k * k);
  const xpAt = k => E + G + REST + 100 + PULL * k;
  const PULLS = k => { const X = pullX(k), x = xpAt(k); const F = { ...standSpec(x, BY, KP, -1), lean: .62 - .22 * k, crouch: .85 - .3 * k, head: -.1, eye: 'strain', pal, feet: [[-20, 0], [18, 0]], tag: 'pull' };
    F.paws = [upOn(X, L - 40, PW / 2 - 3), upOn(X, L - 66, PW / 2 - 3)]; return [stepTo(F, 60), X]; };
  if (t < T + 1.2) { const k = eio(clamp((tp - T - .8) / .4)), [F, X] = PULLS(k);
    const k0 = eio((tp - T - .8) / .1); return { F: k0 < 1 ? { ...mixSpec(hamWalk(xs1, BY, KP, 1, 0, {}), F, k0), pal } : F, X }; }
  const [Fp, Xp] = PULLS(1), xg = xpAt(1);
  if (t < T + 1.5) { const k = eio((tp - T - 1.2) / .3), [Fc, Xc] = carry(T + 1.5, xg, BY, 110);
    return { F: { ...mixSpec(Fp, Fc, k), pal }, X: mixX(Xp, Xc, eio((t - T - 1.2) / .3)) }; }
  const x = lerp(xg, GX + 10, clamp((tp - T - 1.5) / .35)), [F, X] = carry(tp, x, BY, 110);
  F.alpha = 1 - ss(T + 1.55, T + 1.85, t); F.inGate = x > GX - 120; if (F.alpha <= 0) return null;
  return { F, X };
}

// ---------------- camera ----------------
const mixCam = (a, b, k) => k <= 0 ? a : k >= 1 ? b : { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), z: lerp(a.z, b.z, k) };
let BACKX = 0, BACKC = null;
function camAt(t) {
  let c = { x: meX(t) + 70 + 110 * ss(4.3, 5.4, t), y: 1090, z: 1.03 };
  c = mixCam({ x: meX(t) + 95, y: 1080, z: 1.62 }, c, eio((t - 1.5) / 1.1));        // the hook: close on me (saw in my paw), widening to the procession by ~2.6
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: (cc.mx + cc.cutX) / 2 - 20, y: 1150, z: 1.32 });
  c = mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = mixCam(c, mixCam(at(c2), at(c3), eio((t - 10.0) / .45)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));   // the gully stays out of frame until I reach it
  if (t >= 12) c = mixCam(c, { x: E + 345, y: 1000, z: .74 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = mixCam(c, { x: E + 150, y: 1150, z: 1.12 }, eio((t - 18.2) / .45));
  if (t >= B.fall) c = mixCam(c, { x: E + 190, y: 1380, z: 1.42 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .75) c = mixCam(c, { x: E + 110, y: 1150, z: 1.1 }, eio((t - B.fall - .75) / .7));
  if (t >= B.back + .15) c = mixCam(c, BACKC, eio((t - B.back - .15) / .8));   // one continuous move back along the road: each piece glows where it lies
  if (t >= 22.2) c = mixCam(c, { x: E + 130, y: 1150, z: 1.02 }, eio((t - 22.2) / .7));   // …and back: the gully, me at the lip, the outline
  const k = 1 - ss(B.fall, B.fall + .6, t); c.sx = t >= B.fall ? 16 * k * Math.sin(t * 97) : 0; c.sy = t >= B.fall ? 12 * k * Math.sin(t * 131 + 1) : 0;
  return c;
}
const layer = K.layer;

// ---------------- the world: sheets ----------------
function buildSheets() {
  ROADX0 = -1500; ROADX1 = E + G + 1500;
  const r = rng(5);   // ONE random stream through every builder, in this order
  TX.sky = K.skySheet(r);                                   // parallax .1
  TX.far = K.farMeadow(r, -1100, 1900);                     // parallax .32: pale, blurred clover and flower heads
  TX.mid = K.midBand(r, -1300, E * .72 + 1500);             // parallax .72
  FX.tall = K.tallFlowers(r, -900, E * .55 + 900);          // parallax .55 (drawn live: they sway)
  TX.ground = K.ground(r, { x0: ROADX0, x1: ROADX1, top: RT, bottom: PN, y1: 2560, gap: { E, G } });
  TX.gully = K.gully(r, { E, G, top: RT, y1: 2560 });
  GX = E + G + 400; GAY = BY - 290;                         // the willow arch on the far side
  FX.dapple = K.dapple();
  FX.beam = K.sunbeam(r);
  FX.motes = K.motes(r, GX);
  TX.arch = K.arch({ x: GX, top: GAY, base: BY }, FX.beam, FX.motes);
  FX.fore = K.foreLeaves(r, -1200, (E + G + 900) * 1.18);  // parallax 1.18
}

// ---------------- the world: per frame ----------------
function crossOutline(x, y) { return K.crossPts(CBHL, D).map(([a, b]) => [x + a, y + b]); }
function guide(ctx, t, k, al, slots) {   // a dashed coloured-pencil outline of my whole cross across the gully (ghostly: never solid wood)
  const x0 = E - REST, y0 = FY + 34, ol = crossOutline(x0, y0), x1 = x0 - 6 + (L + 12) * k;
  ctx.save(); ctx.globalAlpha = al; ctx.beginPath(); ctx.rect(x0 - 10, FY - 200, x1 - (x0 - 10), 400); ctx.clip();
  ctx.fillStyle = 'rgba(245,214,150,.16)'; ctx.fill(pathOf(ol));
  if (slots) CUTS.forEach((c, i) => {   // slot i = piece i's length, from the near lip: warm light inside the outline, not wood
    const v = ss(SLOTS[i], SLOTS[i] + .22, t); if (v <= 0) return; const a = x0 + c.u0, b = x0 + c.u1, fl = 1 + .5 * Math.exp(-(t - SLOTS[i]) * 5);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createLinearGradient(0, y0 - PW, 0, y0 + PW); g.addColorStop(0, 'rgba(255,200,110,0)'); g.addColorStop(.5, `rgba(255,206,120,${.55 * v * fl})`); g.addColorStop(1, 'rgba(255,200,110,0)');
    ctx.fillStyle = g; ctx.fillRect(a + 2, y0 - PW, b - a - 4, PW * 2); ctx.restore();
    ctx.fillStyle = `rgba(255,236,190,${.45 * v})`; ctx.fillRect(a + 3, y0 - PW / 2 + 3, b - a - 6, PW - 6);
    ctx.strokeStyle = `rgba(186,112,38,${.9 * v})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(b, y0 - PW / 2 - 6); ctx.lineTo(b, y0 + PW / 2 + 6); ctx.stroke();   // the slot's end mark
  });
  ctx.setLineDash([18, 11]); ctx.lineDashOffset = -t * 16; ctx.lineCap = 'round'; ctx.lineWidth = 6.5; ctx.strokeStyle = 'rgba(176,104,34,.95)'; ctx.stroke(pathOf(ol)); ctx.setLineDash([]);
  ctx.restore();
}
function world(ctx, t) {
  drawSheet(ctx, TX.gully);
  K.brook(ctx, t, E, G, WATER);   // a faint glint of the brook far below
  drawSheet(ctx, TX.ground);
  K.drawDapple(ctx, t, FX.dapple, ROADX0, ROADX1, RT, PN);   // dappled light drifting over the path
  // the arch: warm light inside it, the others walking into it, the twig frame, rays and motes
  TX.arch.back(ctx);
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  ctx.save(); TX.arch.clip(ctx);
  for (const P of pils) if (P.F && P.F.inGate) drawHam(ctx, P.F, P.X ? () => drawCross(ctx, P.X.lie ? TX.xLie : TX.xUp, P.X.u0, L, P.X.x, P.X.y, P.X.a, P.F.alpha) : null);
  ctx.restore();
  TX.arch.front(ctx, t);
  // back lane: a bridge (only ever one, its owner's), then the others
  for (const P of pils) if (P.B) { ctx.fillStyle = 'rgba(70,90,90,.18)'; drawCross(ctx, TX.xLie, 0, L, P.B.x, P.B.y, P.B.a); }
  pils.slice().sort((a, b) => (a.F ? a.F.x : 0) - (b.F ? b.F.x : 0)).forEach(P => { if (P.F && !P.F.inGate) hamShadow(ctx, P.F, .8); });
  pils.slice().sort((a, b) => (a.F ? a.F.x : 0) - (b.F ? b.F.x : 0)).forEach(P => {
    if (!P.F || P.F.inGate) return; const X = P.X;
    drawHam(ctx, P.F, X ? () => drawCross(ctx, X.lie ? TX.xLie : TX.xUp, X.u0, L, X.x, X.y, X.a, P.F.alpha ?? 1) : null);
  });
  // the guide shows the missing span while my short cross hangs off the lip, and again when the pieces come back
  if (t >= 18.65 && t < 19.75) guide(ctx, t, eio((t - 18.65) / .3), 1 - ss(19.45, 19.75, t));
  if (t >= 22.35) guide(ctx, t, eio((t - 22.35) / .45), 1, true);
  // the saw I leave on the road after the last cut
  const c3 = CUTS[2];
  if (t >= c3.up1) { const k = eio((t - c3.up1) / .22), g0 = SAWLIE.from;   // the saw leaves my paw only once I stand up again
    drawSaw(ctx, [lerp(g0.grip[0], SAWLIE.grip[0], k), lerp(g0.grip[1], SAWLIE.grip[1], k)], lerp(g0.ang, SAWLIE.ang, k)); }
  // the pieces I cut, lying where they fell (my lane); they glow once I look back, and fly into the gap one by one
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), hl = ss(B.back + .25 + (2 - c.k) * .25, B.back + .75 + (2 - c.k) * .25, t);
    const cu = (c.u0 + c.u1) / 2, cx = p.x + Math.cos(p.a) * cu, cy = p.y + Math.sin(p.a) * cu;
    if (hl > 0) { ctx.fillStyle = 'rgba(70,110,130,.12)'; ctx.beginPath(); ctx.ellipse(cx, c.y + PW / 2 + 2, (c.u1 - c.u0) / 2 + 6, 7, 0, 0, TAU); ctx.fill(); }
    if (hl > 0) { const R = 150, g = ctx.createRadialGradient(cx, cy, 10, cx, cy, R), pulse = .85 + .15 * Math.sin((t - B.back) * 3 + c.k);
      g.addColorStop(0, `rgba(255,222,150,${.5 * hl * pulse})`); g.addColorStop(1, 'rgba(255,200,120,0)'); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R); ctx.restore(); }
    else { ctx.fillStyle = 'rgba(70,110,130,.16)'; ctx.beginPath(); ctx.ellipse(cx, c.y + PW / 2 + 2, (c.u1 - c.u0) / 2 + 6, 7, 0, 0, TAU); ctx.fill(); }
    drawCross(ctx, TX.gLie, c.u0, c.u1, p.x, p.y, p.a, 1, hl); }
  // me and my cross (and the saw in my paw)
  const M = poseMe(t), F = M.F; F.pal = PAL.me;
  hamShadow(ctx, F);
  const myCross = X => { if (X) drawCross(ctx, X.lie || X.flat ? TX.gLie : TX.gUp, X.u0, L, X.x, X.y, X.a); };
  drawHam(ctx, F, () => {
    if (M.X && M.X.lie && !M.lay) myCross(M.X);
    if (M.kerf) { ctx.fillStyle = 'rgba(90,55,25,.85)'; ctx.fillRect(M.c.cutX - 1.8, M.c.y - PW / 2, 3.6, M.kerf.kp * PW * .92 + .5); }
    if (M.X && !M.X.lie) myCross(M.X);
    if (M.saw) drawSaw(ctx, M.saw.grip, M.saw.ang);
    if (M.lay) myCross(M.X);
  });
  if (M.c && t >= M.c.drop && t < M.c.drop + .09) K.cutFlash(ctx, M.c.cutX - 18, M.c.y, PW + 16);
  // my cross over the edge: tips, falls (clipped to the gully so it drops between the lips), splashes into the brook
  const FXc = fallX(t);
  if (FXc && (FXc.alpha ?? 1) > 0) { ctx.save(); if (FXc.clip) { ctx.beginPath(); ctx.rect(E + 2, -4000, G - 4, 4000 + WATER + 40); ctx.clip(); }
    if (FXc.dark > 0) ctx.filter = `brightness(${(1 - .65 * FXc.dark).toFixed(3)})`; drawCross(ctx, TX.gLie, FXc.u0, L, FXc.x, FXc.y, FXc.a, FXc.alpha ?? 1); ctx.restore(); }
  K.splash(ctx, t - SPLASH(), E + G * .5, WATER + 4, DROPS, { clip: [E + 2, RT - 400, G - 4, 2000] });
  K.chips(ctx, t, FLECKS);
}

// ---------------- frame ----------------
function draw(ctx, t) {
  const cm = camAt(t);
  ctx.fillStyle = C.sky1; ctx.fillRect(0, 0, W, H);
  layer(ctx, cm, .1, () => drawSheet(ctx, TX.sky));
  layer(ctx, cm, .32, () => drawSheet(ctx, TX.far));
  layer(ctx, cm, .55, () => K.drawTall(ctx, t, FX.tall));
  layer(ctx, cm, .72, () => drawSheet(ctx, TX.mid));
  layer(ctx, cm, 1, () => world(ctx, t));
  layer(ctx, cm, 1.18, () => K.drawFore(ctx, t, FX.fore, 4));
  // warm wash once the light is in view, then paper
  K.warmWash(ctx, ss(12.2, 13.2, t) * (1 - .5 * ss(B.back, B.back + .8, t)) + .5 * ss(B.back, B.back + .8, t));
  K.flash(ctx, t, B.fall, .3, .35);
  K.endPlate(ctx, t, B.end);
  K.paperPass(ctx);
  if (t < B.end) K.captions(ctx, t, S.lines);
  K.endCard(ctx, t, S.endCard, B.end);
}

async function init() {
  K.init();
  buildTimeline(); buildSheets();
  TX.gUp = crossSprite(C.gold, C.goldD, C.goldL, false, 3); TX.gLie = crossSprite(C.gold, C.goldD, C.goldL, true, 4); TX.gUp.endc = TX.gLie.endc = '#f7dca0';
  K.glowSprite(TX.gLie);
  TX.xUp = crossSprite(C.xw, C.xwD, C.xwL, false, 5); TX.xLie = crossSprite(C.xw, C.xwD, C.xwL, true, 6); TX.xUp.endc = TX.xLie.endc = '#e6dfd0';
  SAWLIE.from = poseMe(CUTS[2].up1 - 1e-4).saw;
  { const p2 = CUTS[1].baseX + CUTS[1].u0; BACKC = { x: p2 + 320, y: 1150, z: 1.0 }; window.__dbg = { E, cuts: CUTS.map(c => [c.mx, c.cutX]), BACKC, BACKX }; }
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: K.FONTS, init, draw });
</script>
