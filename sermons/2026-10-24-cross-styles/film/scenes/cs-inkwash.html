<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* 잘라 낸 건 다리였다 — 12 ink + grey watercolour + orange coloured-pencil sketchbook (from lab-inkwash, ref 12).
   The lab's room moves outdoors: a paved road drawn like the lab's checker floor (grey-washed slabs, orange pencil grid,
   graphite hatch), poplars and fence posts, low hills that bloom up into bare paper, orange construction lines running
   off into the unfinished sheet. Everyone is a little hooded crow-traveller (the lab's ink figure, round head + beak);
   I am the solid black-ink one, the others are grey-washed with an ink outline. My cross is the one amber wash on the
   page (the lab's lamp colour); the others' crosses are grey. The far side of the gap is a plain stone arch whose light
   blooms out across the wet paper (the lab's lamp bloom). The turn is carried by the sketchbook itself: the missing span
   of my cross is a construction outline (white gel pen + orange pencil over the dark wash) — what should have been there —
   and at the end the amber pieces fly back into that outline and a warm wash blooms across the finished bridge.
   Lines boil (3 drawings on 8 fps); the paper's tooth is a periodic height field shared by paper, pencil and ink dropout.
   Choreography after cross-papercut (1cor4) with the v2 viewer fixes. */
const TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
const INK = '#161413';
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------------- hand-drawn toolkit (from lab-inkwash) ----------------
const HD = {};
HD.hash = (i, s = 0) => { let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
HD.t12 = t => Math.floor(t * 12 + 1e-6) / 12;
HD.spline = (P, step = 3, closed = false) => {
  const n = P.length; if (n < 2) return P.map(p => p.slice());
  const get = i => closed ? P[((i % n) + n) % n] : P[clamp(i, 0, n - 1)];
  const out = [], segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), m = Math.max(1, Math.ceil(L / step));
    for (let j = 0; j < m; j++) { const t = j / m, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3))); }
  }
  out.push(closed ? out[0].slice() : P[n - 1].slice()); return out;
};
HD.seg = (a, b, step = 4) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]), m = Math.max(1, Math.ceil(L / step)), o = [];
  for (let i = 0; i <= m; i++) o.push([lerp(a[0], b[0], i / m), lerp(a[1], b[1], i / m)]); return o; };
HD.poly = (P, closed = false, step = 4) => { const o = []; const n = P.length, m = closed ? n : n - 1; for (let i = 0; i < m; i++) { const sg = HD.seg(P[i], P[(i + 1) % n], step); if (i) sg.shift(); o.push(...sg); } return o; };
HD.arc = (cx, cy, rx, ry, a0, a1, step = 4, rot = 0) => { const L = Math.abs(a1 - a0) * Math.max(rx, ry), m = Math.max(2, Math.ceil(L / step)), o = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i <= m; i++) { const a = lerp(a0, a1, i / m), x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push([cx + x * c - y * s, cy + x * s + y * c]); } return o; };
HD.normals = pts => pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
HD.lengths = pts => { const s = [0]; for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return s; };
HD.wob = (pts, seed, amp, wl = 120) => { if (!amp || pts.length < 2) return pts; const N = HD.normals(pts), Sx = HD.lengths(pts), oy = (seed * 17.37) % 997;
  return pts.map((p, i) => { const d = (noise(Sx[i] / wl, oy) - .5) * 2 * amp; return [p[0] + N[i][0] * d, p[1] + N[i][1] * d]; }); };
HD.boil = (pts, seed, f, amp, wl = 90) => { if (!amp) return pts; const s = (seed * 31 + f * 977) | 0, dx = (HD.hash(s, 1) - .5) * amp, dy = (HD.hash(s, 2) - .5) * amp;
  return HD.wob(pts, s, amp, wl).map(p => [p[0] + dx, p[1] + dy]); };
HD.ribbon = (pts, wf) => {
  const n = pts.length, N = HD.normals(pts), Sx = HD.lengths(pts), L = Sx[n - 1] || 1, Lf = [], Rt = [], ws = [];
  for (let i = 0; i < n; i++) { const w = Math.max(0, wf(Sx[i] / L, Sx[i], i, L)) / 2; ws.push(w); Lf.push([pts[i][0] + N[i][0] * w, pts[i][1] + N[i][1] * w]); Rt.push([pts[i][0] - N[i][0] * w, pts[i][1] - N[i][1] * w]); }
  const p = new Path2D(); p.moveTo(Lf[0][0], Lf[0][1]); for (let i = 1; i < n; i++) p.lineTo(Lf[i][0], Lf[i][1]);
  const ae = Math.atan2(N[n - 1][1], N[n - 1][0]); if (ws[n - 1] > .4) p.arc(pts[n - 1][0], pts[n - 1][1], ws[n - 1], ae, ae + Math.PI, true); else p.lineTo(Rt[n - 1][0], Rt[n - 1][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(Rt[i][0], Rt[i][1]);
  const a0 = Math.atan2(N[0][1], N[0][0]); if (ws[0] > .4) p.arc(pts[0][0], pts[0][1], ws[0], a0 + Math.PI, a0, true);
  p.closePath(); return p;
};
HD.ink = (ctx, pts, o = {}) => {
  if (!pts || pts.length < 2) return;
  const w = o.w ?? 8, ts = o.ts ?? w * 2.5, te = o.te ?? w * 3.5, mn = o.mn ?? .2, press = o.press ?? .3, pw = o.pw ?? 70, rough = o.rough ?? .08, seed = o.seed ?? 1, mnE = o.mnE ?? mn;
  const wf = (u, s, i, L) => { const k = Math.min(1, mn + (1 - mn) * ss(0, ts, s)) * Math.min(1, mnE + (1 - mnE) * ss(0, te, L - s));
    return w * k * (1 + press * (noise(s / pw, seed * 3.7 % 500) - .5) * 2) * (1 + rough * (HD.hash(i, seed) - .5) * 2); };
  ctx.fillStyle = o.col || '#151312'; ctx.fill(HD.ribbon(pts, wf));
};
HD.pathOf = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (const q of pts) p.lineTo(q[0], q[1]); p.closePath(); return p; };
function pencil(g, pts, seed, f, pat, o = {}) { HD.ink(g, HD.boil(HD.wob(pts, seed, o.wob ?? 1.2, 200), seed, f, o.boil ?? 1, 120), { w: o.w ?? 3.2, ts: 30, te: 40, mn: .3, press: .5, pw: 120, rough: .2, seed, col: pat, ...o }); }
function ink(g, pts, seed, f, o = {}) { HD.ink(g, HD.boil(HD.wob(HD.wob(pts, seed + 3, (o.wob ?? 2.6) * .5, 26), seed, o.wob ?? 3.4, 140), seed, f, o.boil ?? 1.6, 80), { w: 5.5, ts: 8, te: 14, mn: .35, press: .45, pw: 60, rough: .12, seed, col: INK, ...o }); }

// ---------------- paper: one periodic tooth tile shared by paper, pencil (peaks) and ink (dropout in the valleys) ----------------
const NT = 1008;
function pnoise(x, y, P, s) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const h = (a, b) => HD.hash((((a % P) + P) % P) * 7919 + (((b % P) + P) % P), s);
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
const TX = {}, PAT = {};
function tile(fn) { const c = Pilot.canvas(NT, NT), g = c.getContext('2d'), d = g.createImageData(NT, NT); for (let i = 0; i < NT * NT; i++) fn(i, d.data, i * 4); g.putImageData(d, 0, 0); return c; }
function buildTiles() {
  const T = new Float32Array(NT * NT), r = rng(21);
  for (let y = 0; y < NT; y++) for (let x = 0; x < NT; x++) T[y * NT + x] = .62 * pnoise(x / 7, y / 7, 144, 1) + .38 * pnoise(x / 2.1, y / 2.1, 480, 2);
  for (let k = 0; k < 300; k++) { let x = r() * NT, y = r() * NT, a = r() * TAU; const l = 8 + r() * 30;
    for (let i = 0; i < l; i++) { a += (r() - .5) * .3; x += Math.cos(a); y += Math.sin(a); const xi = ((x | 0) % NT + NT) % NT, yi = ((y | 0) % NT + NT) % NT; T[yi * NT + xi] = Math.min(1, T[yi * NT + xi] + .18); } }
  const at = (x, y) => T[((y + NT) % NT) * NT + ((x + NT) % NT)];
  const base = [251, 250, 246];
  TX.paper = tile((i, D, o) => { const x = i % NT, y = (i / NT) | 0, sh = (at(x - 1, y - 1) - at(x + 1, y + 1)) * 34, m = (pnoise(x / 252, y / 252, 4, 3) - .5) * 6, k = sh + m + (r() - .5) * 3;
    D[o] = base[0] + k; D[o + 1] = base[1] + k; D[o + 2] = base[2] + k - m * .3; D[o + 3] = 255; });
  const mask = (rgb, mode, thr, soft, amax) => tile((i, D, o) => { const v = mode === 'peak' ? (T[i] - thr) / soft : (thr - T[i]) / soft; D[o] = rgb[0]; D[o + 1] = rgb[1]; D[o + 2] = rgb[2]; D[o + 3] = clamp(v) * amax * 255; });
  TX.peaks = mask([0, 0, 0], 'peak', .5, .18, 1);
  TX.orange = mask([210, 101, 44], 'peak', .22, .3, .9);
  TX.graphite = mask([60, 58, 58], 'peak', .25, .3, .75);
  const ik = Pilot.hex(INK);
  TX.ink = tile((i, D, o) => { const k = clamp((.3 - T[i]) / .1) * .22; D[o] = lerp(ik[0], 250, k); D[o + 1] = lerp(ik[1], 249, k); D[o + 2] = lerp(ik[2], 245, k); D[o + 3] = 255; });
  TX.pool = tile((i, D, o) => { const x = i % NT, y = (i / NT) | 0, v = .57 * pnoise(x / 72, y / 72, 14, 5) + .29 * pnoise(x / 36, y / 36, 28, 6) + .14 * pnoise(x / 18, y / 18, 56, 7);
    D[o] = 60; D[o + 1] = 58; D[o + 2] = 58; D[o + 3] = clamp((v - .45) * 2.2) * 120; });
  const pc = Pilot.canvas(2, 2).getContext('2d');
  for (const k of ['paper', 'peaks', 'orange', 'graphite', 'ink', 'pool']) PAT[k] = pc.createPattern(TX[k], 'repeat');
}

// ---------------- watercolour wash (into a white-based layer through a scratch canvas TW with the same pixel mapping) ----------------
let TW = null;   // { c, g, ox, oy, k }: pixel = (world - o) * k
function bbox(P, pad) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of P) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  return [Math.floor(x0 - pad), Math.floor(y0 - pad), Math.ceil(x1 - x0 + 2 * pad), Math.ceil(y1 - y0 + 2 * pad)]; }
function mkTW(w, h, ox, oy, k = 1) { const c = Pilot.canvas(w, h), g = c.getContext('2d'); g.setTransform(k, 0, 0, k, -ox * k, -oy * k); g.lineJoin = g.lineCap = 'round'; return { c, g, ox, oy, k }; }
function wash(g, pts, col, a, o = {}) {
  const sd = o.seed || 1;
  let P = o.round ? HD.spline(pts, 5, true) : HD.poly(pts, true, 5);
  P = HD.wob(P, sd, o.wob ?? 3, o.wl ?? 60); P = HD.wob(P, sd + 5, o.fr ?? 1.3, 8);
  const [bx, by, bw, bh] = bbox(P, 14), t = TW.g, path = HD.pathOf(P);
  t.save(); t.globalCompositeOperation = 'source-over'; t.globalAlpha = 1; t.clearRect(bx, by, bw, bh);
  t.fillStyle = rgba(col, a); t.fill(path);
  t.save(); t.clip(path); t.globalCompositeOperation = 'source-atop'; t.globalAlpha = o.pool ?? .5; t.fillStyle = PAT.pool; t.fillRect(bx, by, bw, bh); t.restore();
  if (o.streak) { t.save(); t.clip(path); const r = rng(sd + 9); const vert = o.horiz ? 0 : 1;
    for (let i = 0; i < o.streak; i++) { let a0, a1;
      if (vert) { const x = bx + r() * bw; a0 = [x, by - 20 + r() * bh * .3]; a1 = [x + (r() - .5) * 14, by + bh * (.5 + r() * .6)]; }
      else { const y = by + r() * bh; a0 = [bx - 20 + r() * bw * .3, y]; a1 = [bx + bw * (.5 + r() * .6), y + (r() - .5) * 10]; }
      HD.ink(t, HD.wob(HD.seg(a0, a1, 8), sd + i, 4, 80), { w: 8 + r() * 30, ts: 40, te: 60, mn: .2, press: .5, seed: sd + i * 3, col: rgba(col, a * (.25 + r() * .5)) }); } t.restore(); }
  t.lineJoin = 'round'; t.strokeStyle = rgba(col, Math.min(1, a * (o.edge ?? .9))); t.lineWidth = 2.6; t.save(); t.clip(path); t.stroke(path); t.restore();
  t.globalCompositeOperation = 'destination-out'; t.globalAlpha = (o.gran ?? .45) * .3; t.fillStyle = PAT.peaks; t.fillRect(bx, by, bw, bh);
  t.restore();
  const k = TW.k, px = Math.max(0, Math.floor((bx - TW.ox) * k)), py = Math.max(0, Math.floor((by - TW.oy) * k)),
    pw = Math.min(TW.c.width, Math.ceil((bx + bw - TW.ox) * k)) - px, ph = Math.min(TW.c.height, Math.ceil((by + bh - TW.oy) * k)) - py;
  if (pw <= 0 || ph <= 0) return;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'multiply'; g.globalAlpha = 1; if (o.blur) g.filter = `blur(${o.blur}px)`; g.drawImage(TW.c, px, py, pw, ph, px, py, pw, ph); g.restore();
}
function bloomEdge(g, cx, cy, r, col, a, seed, a0 = 0, a1 = TAU, sq = .8) { const pts = []; for (let i = 0; i <= 160; i++) { const an = lerp(a0, a1, i / 160), rr = r * (1 + .12 * (fbm(an * 3 + seed, seed, 4) - .5) * 2 + .05 * Math.sin(an * 23 + seed)); pts.push([cx + Math.cos(an) * rr, cy + Math.sin(an) * rr * sq]); }
  g.save(); g.globalCompositeOperation = 'multiply'; g.strokeStyle = rgba(col, a); g.lineWidth = 2; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); g.restore(); }
function whiteLayer(w, h, ox, oy, k = 1) { const c = Pilot.canvas(w, h), g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.setTransform(k, 0, 0, k, -ox * k, -oy * k); g.lineJoin = g.lineCap = 'round'; return { c, g, x0: ox, y0: oy, k }; }

// ---------------- the world's numbers (the choreography of cross-papercut) ----------------
const L = 520, PW = 34, CBX = L - 130, CBW = 32, CBH = 118, CBHL = 50;
const FY = 1300, BY = 1252, RT = 1212, RN = 1440;              // my lane, the others' lane, road far edge, road near edge
const REST = 26, G = L - 2 * REST;
const t12 = HD.t12, frac = x => x - Math.floor(x);
const CYB = 1080, CYE = 1090;   // v2 camera heights for the look back and the last hold
const ROWY = [RT, 1236, 1264, 1298, 1340, 1388, RN], SW = 104, OB = .5;   // road slabs: rows (foreshortened), slab width, oblique joints

// ---------------- crosses: sprites (3 boiled drawings), drawn with a paper patch then multiplied ----------------
const KX = 2, CPAD = 14;
const AMBER = [222, 136, 52], GREYW = [118, 114, 112];
function crossOutline(hb, x = 0, y = 0) { return [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],
  [CBX + CBW / 2, PW / 2], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, PW / 2], [0, PW / 2]].map(([a, b]) => [x + a, y + b]); }
function crossSprite(mine, lying) {
  const hb = lying ? CBHL : CBH, w = (L + 2 * CPAD) * KX, h = (2 * hb + 2 * CPAD) * KX, out = crossOutline(hb), sd = (mine ? 10 : 20) + (lying ? 1 : 0);
  const base = Pilot.canvas(w, h), bg = base.getContext('2d'); bg.setTransform(KX, 0, 0, KX, CPAD * KX, (hb + CPAD) * KX);
  TW = mkTW(w, h, -CPAD, -(hb + CPAD), KX);
  wash(bg, out, mine ? AMBER : GREYW, mine ? .7 : .34, { seed: sd, wob: .8, fr: .7, wl: 40, edge: 1.4, gran: .55, pool: .55 });
  wash(bg, [[0, PW / 2 - 11], [L, PW / 2 - 11], [L, PW / 2], [0, PW / 2]], mine ? [176, 92, 34] : [90, 88, 88], mine ? .45 : .22, { seed: sd + 2, wob: .6, fr: .5 });
  wash(bg, [[CBX + 4, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, hb], [CBX + 4, hb]], mine ? [176, 92, 34] : [90, 88, 88], mine ? .35 : .2, { seed: sd + 3, wob: .5, fr: .5 });
  const PATp = mine ? PAT.orange : PAT.graphite;
  return { hb, c: [0, 1, 2].map(f => {
    const c = Pilot.canvas(w, h), g = c.getContext('2d'); g.drawImage(base, 0, 0); g.setTransform(KX, 0, 0, KX, CPAD * KX, (hb + CPAD) * KX); g.lineJoin = g.lineCap = 'round';
    // wood grain (pencil), knots
    const r = rng(sd * 7);
    for (let k = 0; k < 4; k++) { const y = -PW / 2 + 6 + k * 7.5 + r() * 2; pencil(g, HD.seg([6 + r() * 30, y], [L - 10 - r() * 40, y + (r() - .5) * 3], 6), sd * 10 + k, f, PATp, { w: 1.8, wob: 1, boil: .5 }); }
    for (let k = 0; k < 3; k++) { const x = CBX - CBW / 2 + 7 + k * 9; pencil(g, HD.seg([x, -hb + 8], [x + (r() - .5) * 2, hb - 8], 5), sd * 20 + k, f, PATp, { w: 1.6, wob: .8, boil: .5 }); }
    ink(g, HD.arc(L * .3, 2, 7, 3.4, 0, TAU, 2), sd * 30, f, { w: 2.2, ts: 2, te: 2, wob: .3, boil: .4 });
    // the ink outline, edge by edge (overshooting a little at the corners)
    for (let i = 0; i < out.length; i++) { const a = out[i], b = out[(i + 1) % out.length], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, e = 2.5;
      ink(g, HD.seg([a[0] - dx / l * e, a[1] - dy / l * e], [b[0] + dx / l * e, b[1] + dy / l * e], 4), sd * 50 + i, f, { w: mine ? 4 : 3.4, ts: 4, te: 6, wob: .8, boil: .9 }); }
    g.setTransform(1, 0, 0, 1, 0, 0); return c; }) };
}
let BF = 0;   // the boiled drawing shown in this frame
function drawCross(ctx, SP, u0, u1, x, y, a, alpha = 1) {
  if (u1 - u0 < .5 || alpha <= 0) return;
  const hb = SP.hb, left = u0 <= .5 ? -CPAD : u0, right = u1 >= L - .5 ? L + CPAD : u1;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.rect(left, -hb - CPAD, right - left, 2 * hb + 2 * CPAD); ctx.clip();
  ctx.fillStyle = PAT.paper; ctx.fill(HD.pathOf(crossOutline(hb).map(([p, q]) => [p, q * 1.03])));
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(SP.c[BF], (left + CPAD) * KX, 0, (right - left) * KX, SP.c[0].height, left, -hb - CPAD, right - left, 2 * hb + 2 * CPAD);
  ctx.globalCompositeOperation = 'source-over';
  for (const u of [u0, u1]) if (u > .5 && u < L - .5) ink(ctx, HD.seg([u, -PW / 2 - 1.5], [u + 1, PW / 2 + 1.5], 3), 900 + (u | 0), BF, { w: 3.8, ts: 3, te: 3, wob: .5, boil: .6 });
  ctx.restore();
}

// ---------------- the crow-travellers (lab figure: ink cloak, round hood + beak, stick legs, mitten hands) ----------------
function ik(a, t, l1, l2, pick) {

    ctx.setLineDash([16, 10]); ctx.lineDashOffset = -t * 16; ctx.strokeStyle = 'rgba(226,132,58,1)'; ctx.lineWidth = 5; ctx.stroke(ol); ctx.setLineDash([]);
    ctx.restore();
    ink(ctx, HD.seg([x, FY + 34 - PW / 2 - 6], [x, FY + 34 + PW / 2 + 6], 3), 960 + j, BF, { w: 3, ts: 3, te: 3, wob: .4, boil: .5, col: `rgba(30,24,20,${k})` }); });
}
function glowAt(ctx, t, cx, cy, hl, seed) {   // a glowing piece: a warm halo washed around it, pencil rays flicking out (boiled)
  if (hl <= 0) return; const R = 150, pulse = .85 + .15 * Math.sin((t - B.back) * 5 + seed);
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, R);
  g.addColorStop(0, `rgba(240,172,84,${.55 * hl * pulse})`); g.addColorStop(.6, `rgba(244,190,110,${.25 * hl * pulse})`); g.addColorStop(1, 'rgba(250,220,170,0)');
  ctx.fillStyle = g; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R); ctx.restore();
}
function world(ctx, t) {
  drawGateLight(ctx, t);
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  for (const P of pils) if (P.B) drawCross(ctx, TX.xLie, 0, L, P.B.x, P.B.y, P.B.a);
  pils.slice().sort((a, b) => a.F.hip[0] - b.F.hip[0]).forEach(P => {
    const X = P.X, dc = X ? () => drawCross(ctx, X.lie ? TX.xLie : TX.xUp, X.u0, L, X.x, X.y, X.a, P.F.alpha ?? 1) : null;
    drawFig(ctx, P.F, X && (X.lie || X.front) ? dc : null, X && !X.lie && !X.front ? dc : null);
  });
  // the missing span while my short cross hangs off the lip, and again when the pieces come back
  if (t >= 18.5 && t < 19.75) guide(ctx, t, eio((t - 18.5) / .55), 1 - ss(19.4, 19.75, t));
  outlineSlots(ctx, t);
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip;
    drawSaw(ctx, [lerp(g0[0], SAWLIE.grip[0], k), lerp(g0[1], SAWLIE.grip[1], k)], lerp(CUT_ANG, SAWLIE.ang, k)); }
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), cu = (c.u0 + c.u1) / 2, hl = ss(21.35 + (2 - c.k) * .18, 21.75 + (2 - c.k) * .18, t);
    glowAt(ctx, t, p.x + Math.cos(p.a) * cu, p.y + Math.sin(p.a) * cu, hl, 11 + c.k * 5);
    if (t < FILL[c.k][0]) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .45; ctx.drawImage(TX.shadow, p.x + c.u0 - 10, p.y + 8, c.u1 - c.u0 + 20, 22); ctx.restore(); }
    drawCross(ctx, TX.gLie, c.u0, c.u1, p.x, p.y, p.a); }
  // the finished bridge: a warm wash blooms across it
  const M = poseMe(t), F = M.F; F.me = true;
  const myCross = X => { if (X) drawCross(ctx, X.lie ? TX.gLie : TX.gUp, X.u0, L, X.x, X.y, X.a); };
  drawFig(ctx, F, () => {
    if (M.X && (M.X.lie || M.X.front)) myCross(M.X);
    if (M.kerf) { ctx.fillStyle = INK; ctx.fillRect(M.c.cutX - 1.6, M.c.y - PW / 2, 3.2, M.kerf.kp * PW * .92 + .5); }
    if (M.saw) drawSaw(ctx, M.saw.grip, M.saw.ang);
  }, M.X && !M.X.lie && !M.X.front ? () => myCross(M.X) : null);
  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { ctx.save(); if (FX.clip) { ctx.beginPath(); ctx.rect(E + 2, -4000, G - 4, 9000); ctx.clip(); } drawCross(ctx, TX.gLie, FX.u0, L, FX.x, FX.y, FX.a, FX.alpha ?? 1); ctx.restore(); }
  drawFlecks(ctx, t);
}

// ---------------- words ----------------
const FONT = "'Gowun Batang',serif";

function captionLift(ctx, t) {   // a lifted patch of paper behind the words (a wet tissue taking the wash back off)
  ctx.save(); ctx.font = `700 54px ${FONT}`;
  for (const [a, b, s, src] of S.lines) { const al = Pilot.win(t, a, b, .35, .45); if (al <= 0) continue;
    const lines = s.split('\n'), w = Math.max(...lines.map(l => ctx.measureText(Pilot.tr(l)).width)) + 200, h = lines.length * 90 + (src ? 110 : 0) + 90;
    ctx.globalAlpha = al * .8; ctx.drawImage(TX.lift, 540 - w / 2, 420 - 70 - 45, w, h); }
  ctx.restore();
}
function endPlate(ctx, t) {   // a fresh page washed over the picture: the end card sits on near-bare paper
  const k = ss(B.end - .2, B.end + .35, t); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = PAT.paper; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalAlpha = k; ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(TX.endWash, 0, 0); ctx.restore();
}

// ---------------- frame ----------------
function draw(ctx, t) {
  BF = Math.floor(t * 8 + 1e-6) % 3;
  const cm = camAt(t);
  ctx.fillStyle = '#fbfaf6'; ctx.fillRect(0, 0, W, H);
  layer(ctx, cm, 1, () => { const v = vis(ctx); ctx.fillStyle = PAT.paper; ctx.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0); });
  layer(ctx, cm, .5, () => mulSheet(ctx, TX.far));
  layer(ctx, cm, 1, () => {
    const v = vis(ctx); ctx.fillStyle = PAT.paper; if (v.y1 > RT + 5) ctx.fillRect(v.x0, RT + 5, v.x1 - v.x0, v.y1 - RT - 5);
    ctx.fill(HD.pathOf(gateWall()));
    mulSheet(ctx, TX.plate[BF]);
    world(ctx, t);
  });
  layer(ctx, cm, 1.25, () => mulSheet(ctx, TX.fg));
  endPlate(ctx, t);
  if (t < B.end) { captionLift(ctx, t);
    Story.captions(ctx, t, S.lines, { font: FONT, srcFont: FONT, weight: 700, y: 420, color: '#2a2522', srcColor: '#5b4a3e', shadow: 'rgba(0,0,0,0)', shadowBlur: 0 }); }
  Story.endCard(ctx, t, S.endCard, B.end, { font: FONT, srcFont: FONT, color: '#221d1a', srcColor: '#5b4c40', y: 860, titleShadow: '' });
}
async function init() {
  buildTiles(); buildTimeline();
  // the plate's extent: every camera view over the film
  let x0 = 1e9, x1 = -1e9, fx0 = 1e9, fx1 = -1e9;
  for (let t = 0; t <= S.DUR; t += .05) { const c = camAt(t), hw = 540 / c.z + 40; x0 = Math.min(x0, c.x - hw); x1 = Math.max(x1, c.x + hw);
    const z2 = 1 + (c.z - 1) * .5, hw2 = 540 / z2 + 40; fx0 = Math.min(fx0, c.x * .5 - hw2); fx1 = Math.max(fx1, c.x * .5 + hw2);
    const z3 = 1 + (c.z - 1) * 1.25, hw3 = 540 / z3 + 40; GX0 = Math.min(GX0, c.x * 1.25 - hw3); GX1 = Math.max(GX1, c.x * 1.25 + hw3); }
  PX0 = Math.floor(Math.min(x0, -560)); PX1 = Math.ceil(Math.max(x1, GX + 700)); FX0 = Math.floor(fx0); FX1 = Math.ceil(fx1);
  planProps();
  const pw = PX1 - PX0, ph = PY1 - PY0;
  TW = mkTW(FX1 - FX0, FY1 - FY0, FX0, FY0); TX.far = whiteLayer(FX1 - FX0, FY1 - FY0, FX0, FY0); buildFar(TX.far.g);
  TW = mkTW(pw, ph, PX0, PY0);
  const base = whiteLayer(pw, ph, PX0, PY0); buildWashes(base.g);
  TX.plate = [0, 1, 2].map(f => { const Lr = whiteLayer(pw, ph, PX0, PY0); Lr.g.setTransform(1, 0, 0, 1, 0, 0); Lr.g.drawImage(base.c, 0, 0); Lr.g.setTransform(1, 0, 0, 1, -PX0, -PY0);
    Lr.g.globalCompositeOperation = 'multiply'; buildLines(Lr.g, f); return Lr; });
  base.c.width = base.c.height = 1;
  { const w = Math.ceil(GX1 - GX0), h = GY1 - GY0; TW = mkTW(w, h, GX0, GY0); TX.fg = whiteLayer(w, h, GX0, GY0); buildFG(TX.fg.g); }
  TX.bloom = buildBloom();
  TW.c.width = TW.c.height = 1;
  TX.gUp = crossSprite(true, false); TX.gLie = crossSprite(true, true); TX.xUp = crossSprite(false, false); TX.xLie = crossSprite(false, true);
  TW = null;
  { const c = Pilot.canvas(180, 44), g = c.getContext('2d'); g.filter = 'blur(5px)'; g.fillStyle = 'rgba(80,78,78,.8)'; g.beginPath(); g.ellipse(90, 22, 72, 11, 0, 0, TAU); g.fill(); TX.shadow = c; }
  { const c = Pilot.canvas(600, 260), g = c.getContext('2d'); g.filter = 'blur(18px)'; g.fillStyle = PAT.paper; g.beginPath(); g.roundRect(50, 50, 500, 160, 60); g.fill(); TX.lift = c; }
  { const Lr = whiteLayer(W, H, 0, 0); TW = mkTW(W, H, 0, 0);   // the end card's quiet wash band and a pencil rule
    const blob = []; for (let i = 0; i < 24; i++) { const a = i / 24 * TAU, q = .86 + .28 * fbm(Math.cos(a) + 3, Math.sin(a) + 5, 3); blob.push([540 + Math.cos(a) * 470 * q, 960 + Math.sin(a) * 300 * q]); }
    wash(Lr.g, blob, [150, 140, 132], .1, { seed: 990, round: 1, wob: 16, wl: 70, streak: 8, horiz: 1, edge: 1.8 });
    pencil(Lr.g, HD.seg([300, 1010], [780, 1006], 6), 991, 0, PAT.orange, { w: 3 });
    TX.endWash = Lr.c; TW = null; }
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 62px 'Gowun Batang'", "400 30px 'Gowun Batang'"], init, draw });
