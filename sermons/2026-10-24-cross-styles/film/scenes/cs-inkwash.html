<script>
/* 잘라 낸 건 다리였다 — 12 ink + grey watercolour + orange coloured-pencil sketchbook (from lab-inkwash, ref 12).
   The worked example of the house style `inkwash` (styles/inkwash/STYLE.md): the style — paper tooth, washes, boiled
   ink and pencil lines, the crow-traveller rig, road / poplars / fence / gap / arch / far land / foreground pieces,
   the amber bloom, captions and end card — lives in kit-inkwash.js (window.Inkwash); this file keeps only the story.
   The lab's room moves outdoors: a paved road drawn like the lab's checker floor (grey-washed slabs, orange pencil grid,
   graphite hatch), poplars and fence posts, low hills that bloom up into bare paper, orange construction lines running
   off into the unfinished sheet. Everyone is a little hooded crow-traveller (the lab's ink figure, round head + beak);
   I am the solid black-ink one, the others are grey-washed with an ink outline. My cross is the one amber wash on the
   page (the lab's lamp colour); the others' crosses are grey. The far side of the gap is a plain stone arch whose light
   blooms out across the wet paper (the lab's lamp bloom). The turn is carried by the sketchbook itself: the missing span
   of my cross is a construction outline (white gel pen + orange pencil over the dark wash) — what should have been there.
   Lines boil (3 drawings on 8 fps); the paper's tooth is a periodic height field shared by paper, pencil and ink dropout.
   Choreography after cross-papercut (1cor4) with the v2 viewer fixes. */
const TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
// the kit, and the kit names this story uses
const K = Inkwash, HD = K.HD, PAT = K.PAT, INK = K.INK, ink = K.ink, pencil = K.pencil, wash = K.wash;
const walkSpec = K.walk, standSpec = K.stand, hangHands = K.hangHands, mixSpec = K.mix, frame = K.frame, shoulderOf = K.shoulderOf, cpt = K.beamPt, rotAbout = K.rotAbout;
const TX = {};   // this story's built layers and sprites

// ---------------- the world's numbers (the choreography of cross-papercut) ----------------
const L = 520, PW = 34, CBX = L - 130, CBW = 32, CBH = 118, CBHL = 50;
const FY = 1300, BY = 1252, RT = 1212, RN = 1440;              // my lane, the others' lane, road far edge, road near edge
const REST = 26, G = L - 2 * REST;
const t12 = HD.t12, frac = x => x - Math.floor(x);
const CYB = 1080, CYE = 1090;   // v2 camera heights for the look back and the last hold
const ROWY = [RT, 1236, 1264, 1298, 1340, 1388, RN], SW = 104, OB = .5;   // road slabs: rows (foreshortened), slab width, oblique joints

// ---------------- crosses: sprites (3 boiled drawings, K.prop), drawn with a paper patch then multiplied ----------------
const KX = 2, CPAD = 14;
const AMBER = K.AMBER, GREYW = K.GREYW;
function crossOutline(hb, x = 0, y = 0) { return [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],
  [CBX + CBW / 2, PW / 2], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, PW / 2], [0, PW / 2]].map(([a, b]) => [x + a, y + b]); }
function crossSprite(mine, lying) {
  const hb = lying ? CBHL : CBH, out = crossOutline(hb), sd = (mine ? 10 : 20) + (lying ? 1 : 0), PATp = mine ? PAT.orange : PAT.graphite;
  const sp = K.prop({ w: (L + 2 * CPAD) * KX, h: (2 * hb + 2 * CPAD) * KX, ox: -CPAD, oy: -(hb + CPAD), k: KX,
    base: bg => {
      wash(bg, out, mine ? AMBER : GREYW, mine ? .7 : .34, { seed: sd, wob: .8, fr: .7, wl: 40, edge: 1.4, gran: .55, pool: .55 });
      wash(bg, [[0, PW / 2 - 11], [L, PW / 2 - 11], [L, PW / 2], [0, PW / 2]], mine ? [176, 92, 34] : [90, 88, 88], mine ? .45 : .22, { seed: sd + 2, wob: .6, fr: .5 });
      wash(bg, [[CBX + 4, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, hb], [CBX + 4, hb]], mine ? [176, 92, 34] : [90, 88, 88], mine ? .35 : .2, { seed: sd + 3, wob: .5, fr: .5 }); },
    lines: (g, f) => {
      // wood grain (pencil), knots
      const r = rng(sd * 7);
      for (let k = 0; k < 4; k++) { const y = -PW / 2 + 6 + k * 7.5 + r() * 2; pencil(g, HD.seg([6 + r() * 30, y], [L - 10 - r() * 40, y + (r() - .5) * 3], 6), sd * 10 + k, f, PATp, { w: 1.8, wob: 1, boil: .5 }); }
      for (let k = 0; k < 3; k++) { const x = CBX - CBW / 2 + 7 + k * 9; pencil(g, HD.seg([x, -hb + 8], [x + (r() - .5) * 2, hb - 8], 5), sd * 20 + k, f, PATp, { w: 1.6, wob: .8, boil: .5 }); }
      ink(g, HD.arc(L * .3, 2, 7, 3.4, 0, TAU, 2), sd * 30, f, { w: 2.2, ts: 2, te: 2, wob: .3, boil: .4 });
      // the ink outline, edge by edge (overshooting a little at the corners)
      for (let i = 0; i < out.length; i++) { const a = out[i], b = out[(i + 1) % out.length], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, e = 2.5;
        ink(g, HD.seg([a[0] - dx / l * e, a[1] - dy / l * e], [b[0] + dx / l * e, b[1] + dy / l * e], 4), sd * 50 + i, f, { w: mine ? 4 : 3.4, ts: 4, te: 6, wob: .8, boil: .9 }); } } });
  sp.hb = hb; return sp;
}
function drawCross(ctx, SP, u0, u1, x, y, a, alpha = 1) {
  if (u1 - u0 < .5 || alpha <= 0) return;
  const hb = SP.hb, left = u0 <= .5 ? -CPAD : u0, right = u1 >= L - .5 ? L + CPAD : u1;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.rect(left, -hb - CPAD, right - left, 2 * hb + 2 * CPAD); ctx.clip();
  ctx.fillStyle = PAT.paper; ctx.fill(HD.pathOf(crossOutline(hb).map(([p, q]) => [p, q * 1.03])));
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(SP.c[K.BF], (left + CPAD) * KX, 0, (right - left) * KX, SP.c[0].height, left, -hb - CPAD, right - left, 2 * hb + 2 * CPAD);
  ctx.globalCompositeOperation = 'source-over';
  for (const u of [u0, u1]) if (u > .5 && u < L - .5) ink(ctx, HD.seg([u, -PW / 2 - 1.5], [u + 1, PW / 2 + 1.5], 3), 900 + (u | 0), K.BF, { w: 3.8, ts: 3, te: 3, wob: .5, boil: .6 });
  ctx.restore();
}

// ---------------- timeline: my path (integrated once), the cuts ----------------
const SME = 1.04, SPI = .95;
const DT = 1 / 240, NTL = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NTL), MEP = new Float32Array(NTL);
function vMe(t) {
  if (t < 3.2) return 44 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1));
  if (t < 4.6) return 0;
  if (t < 5.0) return 370 * eio((t - 4.6) / .4);
  if (t < 8.3) return 370;
  if (t < 8.6) return lerp(370, 150, (t - 8.3) / .3);
  if (t < 9.0) return 150 * (1 - ss(8.6, 9.0, t));
  if (t < 10.0) return 0;
  if (t < 10.4) return 450 * Math.sin(Math.PI * (t - 10) / .4);
  if (t < 11.35) return 0;
  if (t < 12.0) return 640 * Math.sin(Math.PI * (t - 11.35) / .65);

}
const strideMe = t => t < 4.6 ? 116 : t < 8.8 ? 270 : 170;
const tab = (T, t) => { const i = clamp(t / DT, 0, NTL - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };

const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const FILL = [[99, 100], [99, 100], [99, 100]];   // v2: the pieces never move (they stay where they fell)
const SLOTS = [22.9, 23.6, 24.3];                  // v2: the outline's missing span lights slot by slot (one piece's length each)
const pieceX = c => c.baseX + (c.u0 + c.u1) / 2 - 18;
const FLECKS = []; let SPAT = [];
let E = 1600, GX = 0, GAY = 0, SAWLIE = null, ARCH = null;
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NTL; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }
  E = meX(12) + 52; GX = E + G + 380; GAY = BY + 4 - 330;
  ARCH = { x: GX, base: BY + 4, cy: GAY, ra: 98, ro: 134 };   // the gate across the gap (K.arch*)
  CUTS.forEach((c, k) => {
    c.k = k; c.mx = meX(c.s); c.cutX = c.mx - 205 * SME; c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.baseX = c.cutX - c.u1; c.y = FY + 26;
    const r = rng(100 + k);   // sawdust: amber crumbs off the kerf
    for (let n = 0; n < 18; n++) FLECKS.push({ t0: n < 12 ? lerp(c.saw0, c.drop, n / 12) : c.drop + r() * .05, x: c.cutX + (r() - .5) * 8, y: c.y - PW / 2,
      vx: (r() - .5) * (n < 12 ? 180 : 320), vy: -(80 + r() * (n < 12 ? 160 : 260)), land: FY + 18 + r() * 44, sz: 2.2 + r() * 3, col: r() > .4 ? 'rgba(214,132,56,.85)' : 'rgba(60,50,44,.8)', stay: 1 });
  });
  const c3 = CUTS[2]; SAWLIE = { grip: [c3.cutX + 150, FY + 52], ang: Math.PI + .05 };
  SPAT = K.spatter(E + 4, FY + 30, 200);   // when my cross goes over: amber and ink drops flung off the lip (they stay — it is paint)
}
function pieceAt(c, t) {
  const sh = 18 * eo((t - c.drop) / .25), y0 = c.y, cu = (c.u0 + c.u1) / 2;
  let cx = c.baseX + cu - sh, cy = y0, a = -.05 * eo((t - c.drop) / .25);
  const [f0, f1] = FILL[c.k];
  if (t > f0) { const u = clamp((t - f0) / (f1 - f0)), e = eio(u), tx = E - REST + cu, ty = FY + 34;
    cx = lerp(cx, tx, e); cy = lerp(cy, ty, e) - (c.k ? 190 : 280) * Math.sin(Math.PI * u); a = lerp(a, 0, e) + Math.sin(u * Math.PI * 3) * .55 * (1 - u); }
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a };
}

// ---------------- poses (cross-papercut; the rig is the kit's) ----------------
function carryCross(F, left, a0) {   // the cross on the near shoulder (K.onShoulder), touching it `contact` px from its foot
  const contact = L - Math.min(282, left * L - 36);
  return { ...K.onShoulder(F, PW, a0, contact), u0: L * (1 - left), lie: false };
}
const CA = -1.0, GHI = 105, GLO = 150;   // rig: crosses ride steeper; one fist holds the beam above the head (arm behind the head), the other low behind the back
const gHi = X => Math.min(L - 16, X.contact + GHI), gLo = X => X.contact - GLO >= (X.u0 || 0) + 12 ? X.contact - GLO : null;
function gripCarry(F, X) { const lo = gLo(X); F.hands = [cpt(X, gHi(X)), lo != null ? cpt(X, lo) : null]; F.hand = ['fist', 'fist']; return F; }
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const mixX = (A, Bx, k) => k <= 0 ? A : k >= 1 ? Bx : { ...Bx, x: lerp(A.x, Bx.x, k), y: lerp(A.y, Bx.y, k), a: lerp(A.a, Bx.a, k), u0: Bx.u0, lie: k > .62 ? Bx.lie : A.lie };

// ---------------- the saw ----------------
const CUT_ANG = Math.PI - .72, hangAng = f => Math.atan2(.95, .3 * f);
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];
  return { d, up, heel: [grip[0] - up[0] * 14 + d[0] * 20, grip[1] - up[1] * 14 + d[1] * 20] }; }
function sawState(c, t) {
  const kp = clamp((t - c.saw0) / (c.drop - .06 - c.saw0)), saw = t >= c.saw0 - .05 && t < c.drop + .02;
  const osc = saw ? 24 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, g0 = sawGeo([0, 0], CUT_ANG), d = g0.d, up = g0.up;
  const K = [c.cutX, c.y - PW / 2 + kp * PW * .92], heel = [K[0] - d[0] * (96 - osc), K[1] - d[1] * (96 - osc)];
  return { kp, grip: [heel[0] + up[0] * 14 - d[0] * 20, heel[1] + up[1] * 14 - d[1] * 20], K };
}
function drawSaw(ctx, grip, ang) {
  const { d, up, heel } = sawGeo(grip, ang), P = (u, v) => [heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v], BF = K.BF;
  const blade = [P(0, 30), P(172, 18)]; for (let u = 172; u >= 0; u -= 9) blade.push(P(u, (u / 9 | 0) % 2 ? 3 : -3));
  const handle = [P(-4, 36), P(-38, 46), P(-52, 20), P(-40, -4), P(-6, 2)], hole = [P(-14, 30), P(-34, 36), P(-42, 20), P(-34, 8), P(-14, 12)];
  ctx.save(); ctx.fillStyle = PAT.paper; ctx.fill(HD.pathOf(blade)); ctx.fill(HD.pathOf(HD.spline(handle, 3, true)));
  ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(146,156,172,.5)'; ctx.fill(HD.pathOf(blade));
  ctx.fillStyle = 'rgba(184,110,58,.62)'; ctx.fill(HD.pathOf(HD.spline(handle, 3, true))); ctx.restore();
  ctx.fillStyle = PAT.paper; ctx.fill(HD.pathOf(HD.spline(hole, 3, true)));
  ink(ctx, HD.poly([P(0, 30), P(172, 18), P(172, -2)]), 950, BF, { w: 3.2, ts: 3, te: 3, wob: .5, boil: .6 });
  ink(ctx, blade.slice(2).concat([P(0, -3)]), 951, BF, { w: 2.4, ts: 3, te: 3, wob: .2, boil: .3, mn: .6 });
  ink(ctx, HD.spline(handle, 3, true), 952, BF, { w: 3.6, ts: 3, te: 3, wob: .5, boil: .6 });
  ink(ctx, HD.spline(hole, 3, true), 953, BF, { w: 2.6, ts: 3, te: 3, wob: .3, boil: .4 });
}
function sawSpec(c, t) {
  const f = -1, mx = c.mx, s = SME, st = sawState(c, t);
  return { s, f, gy: FY, hip: [mx, FY - 84 * s], ang: f * 1.1, feet: [[mx + 74 * s, FY], [mx - 60 * s, FY]], hands: [st.grip, [c.cutX + 112 * s, c.y - PW / 2 - 4]],
    hand: ['fist', 'flat'], tilt: .32, eye: 'calm', sway: 0, farFront: true };
}
const hangGrip = (F, sw = 0) => { const sh = shoulderOf(F); return [sh[0] + F.f * (16 + sw) * F.s, sh[1] + 128 * F.s]; };
const rIdx = F => F.f > 0 ? 1 : 0, lIdx = F => F.f > 0 ? 0 : 1;

function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), left = leftAt(t);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const F = walkSpec(x, FY, SME, 1, ph, 116, .3 + .1 * Math.sin(tt * TAU / 1.15), 16); F.eye = 'strain'; F.tilt = .12; F.hip[1] += 6 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, CA + .07 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt); const F = walkSpec(x, FY, SME, 1, ph, lerp(116, 270, k), lerp(.16, .3, k), lerp(20, 62, k)); return [F, CA - .04]; }
    const F = walkSpec(x, FY, SME, 1, ph, 170, .16, 34); return [F, CA];
  };
  const sawHeld = t < CUTS[2].drop;
  const carried = (F, a0, lf, held) => { const X = carryCross(F, lf, a0); gripCarry(F, X);
    if (held) { F.hands[0] = cpt(X, gHi(X)); F.hands[1] = hangGrip(F, F.ph != null ? 18 * Math.sin(TAU * F.ph) : 0); }
    return [F, X]; };
  for (const c of CUTS) {

      const [WA, XA] = carried(W0, a0, lf0, true), [WB, XB] = carried(W1, a1, lf1, !last);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      const uPin = c.cutX + 112 * SME - c.baseX;   // rig: the pinning hand well clear of the saw handle
      if (t < c.s + c.d) { const k = eio((tp - c.s) / c.d), F = mixSpec(WA, SP, k), Xm = mixX(XA, XL, k);
        F.hands[rIdx(F)] = lerp2(WA.hands[1], cg, k);
        F.hands[lIdx(F)] = cpt(Xm, lerp(gHi(XA), uPin, k), lerp(0, -PW / 2 - 4, k));   // rig: pinned to the beam while it comes down
        F.hand = F.f > 0 ? ['fist', 'fist'] : ['fist', k > .7 ? 'flat' : 'fist']; F.farFront = k > .3;   // rig: the beam comes down in front (layers switch once it is below the chin)
        return { F, X: k > .3 ? { ...Xm, front: true } : Xm, c, saw: { grip: F.hands[rIdx(F)], ang: lerp(hangAng(1), CUT_ANG, k) } }; }
      if (t < c.drop) { const st = sawState(c, t); return { F: sawSpec(c, t), X: XL, c, kerf: st, saw: { grip: st.grip, ang: CUT_ANG } }; }
      const k = eio((tp - c.drop) / (c.up1 - c.drop)), F = mixSpec(SP, WB, k), Xm = mixX(XL, XB, k);
      F.hands[rIdx(F)] = lerp2(cg, WB.hands[1] || hangHands(WB)[1], k);   // the saw hand (it lets the saw go after the last cut)
      F.hands[lIdx(F)] = cpt(Xm, lerp(uPin, gHi(XB), k), lerp(-PW / 2 - 4, 0, k));   // rig: the other hand stays on the beam and lifts it
      F.hand = F.f > 0 ? ['fist', 'fist'] : ['fist', k < .3 ? 'flat' : 'fist']; F.farFront = k < .7;
      const saw = last ? null : { grip: F.hands[rIdx(F)], ang: lerp(CUT_ANG, hangAng(1), k) };
      return { F, X: k < .7 ? { ...Xm, front: true } : Xm, c, saw };
    }
  }
  if (t < 12) { const [F, a] = walk(tp); const [G2, X] = carried(F, a, left, sawHeld); return { F: G2, X, saw: sawHeld ? { grip: G2.hands[1], ang: hangAng(1) } : null }; }
  if (t < 18.4) { const [F0] = walk(12, E - 52), k = eio((tp - 12) / .3);
    const bx = -150 * eio((tp - 12.9) / .7) + 150 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.85, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.65, 17.55, .12, .12));
    const STx = mv > 0 ? mixSpec(standSpec(E - 52 + bx, FY, SME, 1, .08), walkSpec(E - 52 + bx, FY, SME, 1, (E + bx) / 150, 150, .1, 24), mv) : standSpec(E - 52 + bx, FY, SME, 1, .08);

    F.ang += .16 * Math.sin(Math.PI * clamp((tp - 12) / .5)) * (tp < 12.5 ? -1 : 0); F.eye = tp < 13.2 ? 'shock' : 'calm';
    const [G2, X] = carried(F, CA, left, false); return { F: G2, X }; }
  const XLay = { x: E - REST - L * (1 - left), y: FY + 34, a: 0, u0: L * (1 - left), lie: true };
  const u0L = L * (1 - left), PV = -PW / 2 - 4;
  const LAY = { ...standSpec(E - 52, FY, SME, 1), hip: [E - 34, FY - 82 * SME], ang: 1.12, feet: [[E - 96, FY], [E - 8, FY]], tilt: .3 };
  LAY.hands = [cpt(XLay, u0L + 104, PV), cpt(XLay, u0L + 62, PV)]; LAY.hand = ['flat', 'flat'];
  const REACH = { ...LAY, hip: [E - 66, FY - 160 * SME], ang: .46, hands: [null, [E + 70, FY - 20]], hand: ['fist', 'open'], eye: 'shock', tilt: .45 };
  if (t < B.tip) { if (t < 18.9) { const ST = standSpec(E - 52, FY, SME, 1, .08), STc = carried(ST, CA, left, false), k = eio((tp - 18.4) / .5), Xm = mixX(STc[1], XLay, k);

      F.hands = [cpt(Xm, lerp(gHi(STc[1]), u0L + 104, k), lerp(0, PV, k)), cpt(Xm, lerp(lo ?? u0L + 12, u0L + 62, k), lerp(0, PV, k))];   // rig: the low fist pinned at the beam's cut end
      F.hand = k > .6 ? ['flat', 'flat'] : ['fist', 'fist']; F.farFront = k > .45; return { F, X: k > .45 ? { ...Xm, front: true } : Xm, lay: true }; }
    return { F: LAY, X: XLay, lay: true }; }
  if (t < B.back) { const k = eio((tp - B.tip) / .25), F = mixSpec(LAY, REACH, k); F.hand = REACH.hand; if (tp > 20.6) F.eye = 'down'; return { F, X: null }; }

}
function fallX(t) {

  if (t < B.fall) return rotAbout(X0, pv, .5 * Math.pow((t - B.tip) / (B.fall - B.tip), 2));
  const X1 = rotAbout(X0, pv, .5), u = t - B.fall, cu = (u0 + L) / 2, c0 = cpt(X1, cu);

  return { ...X1, x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, alpha: 1 - ss(B.fall + .55, B.fall + 1.05, t), clip: true };

// ---------------- the others ----------------
const PIL = [{ x0: -470, ph: .3 }, { x0: -230, ph: .75 }, { x0: 190, ph: .1 }, { x0: 430, ph: .55 }];
const BRIDGE_Y = [BY - 6, BY + 4, BY + 14], PULL = 210;
function pilState(i, t) {
  const tp = t12(t), P = PIL[i], j = 3 - i, T = j < 3 ? B.bridges[j] : 99, yb = BRIDGE_Y[j] ?? BY;
  const xAt = tt => { if (tt <= 9 || j > 2) return P.x0 + 52 * tt; const xa = P.x0 + 468, xb = E - 300 - 130 * j, xc = E - 46;
    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, clamp((tt - 12) / (T - .35 - 12))); };
  const carry = (tt, x, gy = BY, stride = 118, lean = .27) => { const F = walkSpec(x, gy, SPI, 1, P.ph + x / (stride * SPI), stride, lean, 18); F.seed = 40 + i * 7; F.tilt = .05; const X = carryCross(F, 1, CA); gripCarry(F, X); return [F, X]; };
  const tag = F => { F.seed = 40 + i * 7; return F; };
  if (j > 2) { if (t >= 12) return null; const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  if (t < T - .35) { const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  const XB = { x: E - REST, y: yb, a: 0, u0: 0, lie: true };
  const PV = -PW / 2 - 4, LAY = { ...standSpec(E - 46, BY, SPI, 1), hip: [E - 58, BY - 84 * SPI], ang: 1.15, feet: [[E - 118, BY], [E - 14, BY]], tilt: .3 };
  LAY.hands = [cpt(XB, 76, PV), cpt(XB, 30, PV)]; LAY.hand = ['flat', 'flat'];
  if (t < T) { const [F0, X0] = carry(T - .35, E - 46), k = eio((tp - T + .35) / .35), Xm = mixX(X0, XB, k), F = mixSpec(F0, LAY, k), lo = gLo(X0);
    F.hands = [cpt(Xm, lerp(gHi(X0), 76, k), lerp(0, PV, k)), cpt(Xm, lerp(lo ?? 30, 30, k), lerp(0, PV, k))]; F.hand = k > .7 ? ['flat', 'flat'] : ['fist', 'fist']; F.farFront = k > .55;
    return { F: tag(F), X: k > .55 ? { ...Xm, front: true } : Xm }; }
  const xs0 = E - 24, xs1 = E + G + 70;
  if (t < T + .3) { const F = mixSpec(LAY, standSpec(xs0, yb - PW / 2, SPI, 1, .1), eio((tp - T) / .25)); return { F: tag(F), B: XB }; }
  if (t < T + .9) { const x = lerp(xs0, xs1, eio(clamp((tp - T - .3) / .6))), gy = x < E + G + 4 ? yb - PW / 2 : BY;
    const F = walkSpec(x, gy, SPI, 1, P.ph + x / (170 * SPI), 170, .12, 30); F.tilt = -.05; F.hands = hangHands(F, 26 * Math.sin(TAU * (P.ph + x / (170 * SPI)))); return { F: tag(F), B: XB }; }
  const pv = [E + G, yb + PW / 2], pullX = k => rotAbout({ ...XB, x: XB.x + PULL * k }, [pv[0], pv[1]], -.1 * k);
  const xpAt = k => xs1 + 10 + PULL * k;
  const PULLS = k => { const X = pullX(k), x = xpAt(k); const F = { ...standSpec(x, BY, SPI, -1), hip: [x + 8, BY - 84 * SPI], ang: -1.12, feet: [[x + 64, BY], [x - 40, BY]], tilt: .2 };
    const sh = frame(F).P(4, 136), u = clamp(sh[0] - X.x, 80, L - 40); F.gu = [Math.min(L - 10, u + 24), u - 26];   // rig: crouched, both fists ON the beam under the shoulders
    F.hands = [cpt(X, F.gu[0], -PW / 2 + 2), cpt(X, F.gu[1], -PW / 2 + 2)]; return [tag(F), X]; };
  if (t < T + 1.25) { const k = eio(clamp((tp - T - .9) / .35)), [F, X] = PULLS(k);
    const k0 = eio((tp - T - .9) / .1); return { F: k0 < 1 ? tag(mixSpec(walkSpec(xs1, BY, SPI, 1, 0, 170, .1), F, k0)) : F, X }; }
  const [Fp, Xp] = PULLS(1), xg = xpAt(1);
  if (t < T + 1.6) { const k = eio((tp - T - 1.25) / .35), [Fc, Xc] = carry(T + 1.6, xg, BY, 150, .2), Xm = mixX(Xp, Xc, k), F = mixSpec(Fp, Fc, k), lo = gLo(Xc);
    F.hands = [cpt(Xm, lerp(Fp.gu[0], gHi(Xc), k), lerp(-PW / 2 + 2, 0, k)), cpt(Xm, lerp(Fp.gu[1], lo ?? Fp.gu[1], k), lerp(-PW / 2 + 2, 0, k))]; F.hand = ['fist', 'fist']; F.farFront = k < .85;   // rig: shouldering it, hands stay on
    return { F: tag(F), X: k < .85 ? { ...Xm, front: true } : Xm }; }
  const x = lerp(xg, GX + 10, clamp((tp - T - 1.6) / .3)), [F, X] = carry(tp, x, BY, 150, .2);
  F.alpha = 1 - ss(T + 1.62, T + 1.9, t); if (F.alpha <= 0) return null;
  return { F, X };
}

// ---------------- camera ----------------
const mixCam = K.mixCam;
function camAt(t) {
  let c = { x: meX(t) + 60 + 90 * ss(4.3, 5.4, t), y: 995, z: 1.03 };
  c = mixCam({ x: meX(t) + 34, y: 1000, z: 1.62 }, c, eio((t - 1.5) / 1.1));
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: (cc.mx + cc.cutX) / 2 - 10, y: 1065, z: 1.32 });
  c = mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = mixCam(c, mixCam(at(c2), at(c3), eio((t - 10.0) / .45)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));
  if (t >= 12) c = mixCam(c, { x: E + 345, y: 990, z: .72 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = mixCam(c, { x: E + 190, y: 1090, z: .98 }, eio((t - 18.2) / .45));
  if (t >= B.fall) c = mixCam(c, { x: E + 160, y: 1200, z: 1.34 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .65) c = mixCam(c, { x: E + 150, y: 1060, z: 1.0 }, eio((t - B.fall - .65) / .7));
  if (t >= B.back) { const zb = .95, px = (pieceX(CUTS[1]) + pieceX(CUTS[2])) / 2, xb = Math.max(px, E - 52 - 330 / zb);   // one move back down the road (me still in frame, right)
    c = mixCam(c, { x: xb, y: CYB, z: zb }, eio((t - 21.3) / .7)); }
  if (t >= 22.15) c = mixCam(c, { x: E + 170, y: CYE, z: .98 }, eio((t - 22.15) / .65));   // …and back: me at the lip, the gap, the outline
  [c.sx, c.sy] = K.hitShake(t, B.fall);   // the hit: my cross goes over
  return c;
}

// ---------------- the drawn world (built once: washes, then 3 boiled drawings of the lines) ----------------
let PX0 = -600, PX1 = 3600, PY0 = 470, PY1 = 2460, FX0 = -800, FX1 = 2400;
const FY0 = 640, FY1 = 1290;
let ROAD = null, GAP = null;   // K.road / K.gap* descriptions, set in init
const TREES = [], POSTS = [];
function planProps() {
  const r = rng(77);
  for (let x = PX0 + 150; x < PX1; x += 520 + r() * 380) { if (x > E - 420 && x < GX + 420) continue; TREES.push({ x, h: 330 + r() * 150, w: 70 + r() * 34, s: TREES.length }); }
  for (let x = PX0 + 60; x < PX1; x += 430 + r() * 160) { if (x > E - 120 && x < E + G + 60) continue; if (Math.abs(x - GX) < 360) continue; POSTS.push(x); }
}
function buildWashes(g) {
  K.roadWashes(g, ROAD);                                  // road band, slabs (the lab's checker, outdoors), verge
  for (const T of TREES) K.poplarWash(g, T, RT - 4);      // poplars (behind the road) and fence posts
  for (const x of POSTS) K.postWash(g, x, RT);
  K.gapWash(g, GAP);                                      // the gap: a dark streaky wash going down into the sheet
  K.archWash(g, ARCH);                                    // the gate: a grey stone wall, the arch opening dim before the light comes
  K.bloomEdge(g, PX0 + 900, RN + 160, 140, K.W0, .18, 13, Math.PI * 1.2, Math.PI * 1.7);
}
function buildLines(g, f) {
  pencil(g, HD.seg([PX0 + 30, 1046], [PX1 - 30, 1040], 8), 1, f, PAT.orange, { w: 2.8 });   // construction: the horizon
  K.roadLines(g, f, ROAD);
  for (const T of TREES) K.poplarLines(g, T, RT - 4, f);
  K.fenceLines(g, POSTS, RT, f, (x, nx) => x < E && nx > E);   // no rope across the gap
  K.gapLines(g, f, GAP);
  K.archLines(g, f, ARCH);
}
let GX0 = 1e9, GX1 = -1e9; const GY0 = 1440, GY1 = 2700;

// ---------------- the live world ----------------
const BLOOM_C = () => [GX, BY - 160];
function drawGateLight(ctx, t) {   // the arch's warm light, revealed live from 12.0 like the lab's lamp
  if (t < B.gap) return; const R = 600 * eo((t12(t) - B.gap) / 1.3) + 10 * Math.max(0, t - 13.3); if (R <= 0) return;
  K.drawBloom(ctx, TX.bloom, BLOOM_C(), R, t, K.archOpening(ARCH, -3));
}
function drawFlecks(ctx, t) {
  ctx.save(); ctx.globalCompositeOperation = 'multiply';
  for (const q of FLECKS) { const u = t - q.t0; if (u < 0) continue;
    const tl = (-q.vy + Math.sqrt(q.vy * q.vy + 4 * 700 * (q.land - q.y))) / 1400, uu = Math.min(u, Math.max(0, tl));
    const x = q.x + q.vx * uu, y = q.y + q.vy * uu + 700 * uu * uu; if (t > B.back + 2.5) continue;
    ctx.fillStyle = q.col; ctx.beginPath(); ctx.ellipse(x, y, q.sz, q.sz * .7, 0, 0, TAU); ctx.fill(); }
  ctx.restore();

}
function guide(ctx, t, k, al, glow = 0) {   // the construction outline of my whole cross across the gap (drawn on by k)
  if (al <= 0) return;
  const ol = crossOutline(CBHL, E - REST, FY + 34), x1 = E - REST - 4 + (L + 8) * k;
  K.ghostOutline(ctx, ol, t, al, glow, [E - REST - 10, FY - 200, x1 - (E - REST - 10), 400]);
}
function outlineSlots(ctx, t) {   // v2: the dashed outline of my whole cross over the open gap; its missing span lights one piece-length at a time
  const al = ss(22.15, 22.6, t); if (al <= 0) return;
  guide(ctx, t, 1, al);
  const ol = HD.pathOf(HD.boil(HD.poly(crossOutline(CBHL, E - REST, FY + 34), true, 6), 77, K.BF, .8, 30));
  let x = E - REST + S.left[3] * L;
  CUTS.forEach((c, j) => { const len = c.u1 - c.u0, x0 = x; x += len; const k = ss(SLOTS[j], SLOTS[j] + .3, t); if (k <= 0) return;
    const fl = 1 - ss(SLOTS[j] + .05, SLOTS[j] + .6, t);   // a small brightening as it lands (the knock)
    ctx.save(); ctx.beginPath(); ctx.rect(x0, FY - 200, len, 400); ctx.clip(); ctx.globalAlpha = k;
    ctx.fillStyle = `rgba(246,${200 + 30 * fl},${130 + 60 * fl},.62)`; ctx.fill(ol);
    ctx.setLineDash([16, 10]); ctx.lineDashOffset = -t * 16; ctx.strokeStyle = 'rgba(226,132,58,1)'; ctx.lineWidth = 5; ctx.stroke(ol); ctx.setLineDash([]);

}
function glowAt(ctx, t, cx, cy, hl, seed) {   // a glowing piece: a warm halo washed around it

}
function world(ctx, t) {
  drawGateLight(ctx, t);
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  for (const P of pils) if (P.B) drawCross(ctx, TX.xLie, 0, L, P.B.x, P.B.y, P.B.a);
  pils.slice().sort((a, b) => a.F.hip[0] - b.F.hip[0]).forEach(P => {
    const X = P.X, dc = X ? () => drawCross(ctx, X.lie ? TX.xLie : TX.xUp, X.u0, L, X.x, X.y, X.a, P.F.alpha ?? 1) : null;
    K.drawFig(ctx, P.F, X && (X.lie || X.front) ? dc : null, X && !X.lie && !X.front ? dc : null);
  });

    drawSaw(ctx, [lerp(g0[0], SAWLIE.grip[0], k), lerp(g0[1], SAWLIE.grip[1], k)], lerp(CUT_ANG, SAWLIE.ang, k)); }
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), cu = (c.u0 + c.u1) / 2, hl = ss(21.35 + (2 - c.k) * .18, 21.75 + (2 - c.k) * .18, t);
    glowAt(ctx, t, p.x + Math.cos(p.a) * cu, p.y + Math.sin(p.a) * cu, hl, 11 + c.k * 5);
    if (t < FILL[c.k][0]) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .45; ctx.drawImage(K.TX.shadow, p.x + c.u0 - 10, p.y + 8, c.u1 - c.u0 + 20, 22); ctx.restore(); }
    drawCross(ctx, TX.gLie, c.u0, c.u1, p.x, p.y, p.a); }

  K.drawFig(ctx, F, () => {
    if (M.X && (M.X.lie || M.X.front)) myCross(M.X);
    if (M.kerf) { ctx.fillStyle = INK; ctx.fillRect(M.c.cutX - 1.6, M.c.y - PW / 2, 3.2, M.kerf.kp * PW * .92 + .5); }
    if (M.saw) drawSaw(ctx, M.saw.grip, M.saw.ang);

  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { ctx.save(); if (FX.clip) { ctx.beginPath(); ctx.rect(E + 2, -4000, G - 4, 9000); ctx.clip(); } drawCross(ctx, TX.gLie, FX.u0, L, FX.x, FX.y, FX.a, FX.alpha ?? 1); ctx.restore(); }
  drawFlecks(ctx, t);
}

// ---------------- frame ----------------
function draw(ctx, t) {
  K.boilAt(t);
  const cm = camAt(t);
  K.paper(ctx, cm);
  K.layer(ctx, cm, .5, () => K.mulSheet(ctx, TX.far));
  K.layer(ctx, cm, 1, () => {
    const v = K.vis(ctx); ctx.fillStyle = PAT.paper; if (v.y1 > RT + 5) ctx.fillRect(v.x0, RT + 5, v.x1 - v.x0, v.y1 - RT - 5);
    ctx.fill(HD.pathOf(K.archWall(ARCH)));
    K.mulSheet(ctx, TX.plate[K.BF]);
    world(ctx, t);
  });
  K.layer(ctx, cm, 1.25, () => K.mulSheet(ctx, TX.fg));
  K.endPlate(ctx, t, B.end);
  if (t < B.end) K.captions(ctx, t, S.lines);
  K.endCard(ctx, t, S.endCard, B.end);
}
async function init() {
  K.init(); buildTimeline();
  // the plates' extents: every camera view over the film (plate 1, far .5, foreground 1.25)
  const [x0, x1] = K.camExtent(camAt, S.DUR, 1), [fx0, fx1] = K.camExtent(camAt, S.DUR, .5);
  [GX0, GX1] = K.camExtent(camAt, S.DUR, 1.25);
  PX0 = Math.floor(Math.min(x0, -560)); PX1 = Math.ceil(Math.max(x1, GX + 700)); FX0 = Math.floor(fx0); FX1 = Math.ceil(fx1);
  ROAD = { segs: [[PX0 - 40, E], [E + G, PX1 + 40]], top: RT, near: RN, rows: ROWY, sw: SW, ob: OB, x0: PX0, x1: PX1 };
  GAP = { e: E, w: G, top: RT, bottom: PY1, seed: 81 };
  planProps();

  K.scratch(FX1 - FX0, FY1 - FY0, FX0, FY0); TX.far = K.whiteLayer(FX1 - FX0, FY1 - FY0, FX0, FY0); K.farLand(TX.far.g, FX0, FX1);
  K.scratch(pw, ph, PX0, PY0);
  const base = K.whiteLayer(pw, ph, PX0, PY0); buildWashes(base.g);
  TX.plate = [0, 1, 2].map(f => { const Lr = K.whiteLayer(pw, ph, PX0, PY0); Lr.g.setTransform(1, 0, 0, 1, 0, 0); Lr.g.drawImage(base.c, 0, 0); Lr.g.setTransform(1, 0, 0, 1, -PX0, -PY0);
    Lr.g.globalCompositeOperation = 'multiply'; buildLines(Lr.g, f); return Lr; });
  base.c.width = base.c.height = 1;
  { const w = Math.ceil(GX1 - GX0), h = GY1 - GY0; K.scratch(w, h, GX0, GY0); TX.fg = K.whiteLayer(w, h, GX0, GY0); K.foreground(TX.fg.g, GX0, GX1); }   // v2: weeds and wildflowers so the lower half is drawn
  TX.bloom = K.bloomSheet(BLOOM_C(), { box: [GX - 600, GAY - 560, 1200, 1200], opening: K.archOpening(ARCH, -4), heart: { c: [GX, BY - 120], r: 170, rect: [GX - 200, BY - 400, 400, 420] },
    spill: [[GX - 120, BY + 2], [GX + 120, BY + 2], [GX + 330, BY + 120], [GX - 300, BY + 130]] });
  TX.gUp = crossSprite(true, false); TX.gLie = crossSprite(true, true); TX.xUp = crossSprite(false, false); TX.xLie = crossSprite(false, true);
  K.scratchFree();
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: K.FONTS, init, draw });
