<script>
/* 잘라 낸 건 다리였다 — 06 textured gouache picture book (from lab-storybook: the fox and the lantern).
   A teal swamp forest at night: pale misty trunks far → dark teal near, a pale moon, rounded hills, a strip of still
   water behind; flat opaque gouache shapes with rough edges and a chalky dry-brush tooth in every shape; diamond motes
   float; blue-leafed swamp plants sway at the bottom over bright turquoise water. The road is a mossy embankment above
   the water. "Me" is the lab's orange fox in a dark cloak with a white knit collar; the others are grey foxes in slate
   cloaks (quieter). Every cross is muted brown wood except mine — lantern-gold, with the lab lantern's grainy halo:
   the one accent. The gap is a ravine cut through the embankment down to dark water; across it a plain round stone
   arch in a hillside pours warm lantern light, the lab's lantern hanging on its hooked pole beside it. The hit: crash
   zoom + shake, chalk dust off the lip, then the cross splashes into the dark water far below.
   The choreography (timeline, poses, camera) is the paper-cut version's (cross-papercut), redrawn. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const C = {
  sky0: '#1d4256', sky1: '#3b7583', sky2: '#5e9a9c', far: '#4a8189', far2: '#3c717d', mid: '#28525f', near: '#173444', near2: '#10283a',
  hill: '#2a5a60', hillT: '#3a7471', hill2: '#25525a', bush: '#1b3f52', bush2: '#21506a',
  water0: '#3f8f98', water1: '#6cc3c2', water2: '#8fded5', leaf: '#2d6cb8', leaf2: '#4a92d6', stem: '#0f2534', moon: '#f1fbf4',
  moss: '#3d7a72', moss2: '#2c6064', moss3: '#22505a', cliff: '#214a55', cliff2: '#1a3d48', cliffL: '#2c5c66',
  cloak: '#1f2633', cloak2: '#2b3444', sleeve: '#323d50', fox: '#c4612c', fox2: '#9b4420', white: '#f2eee2', leg: '#2a1a16', paw: '#e6dccb',
  gcloak: '#2e3b45', gcloak2: '#3a4a54', gsleeve: '#3b4955', gfur: '#8c8579', gfur2: '#6b655c', gwhite: '#d6d2c6', gleg: '#2a2622', gpaw: '#cfc8ba',
  wood: '#eab55c', woodL: '#ffdc8e', woodD: '#b07832', xwood: '#6b5a48', xwoodL: '#8a7760', xwoodD: '#4e4134',
  gold: '#ffd16a', gate: '#e8a64a', warm: '#ffd16a', warm2: '#ffb14a', stone: '#9fb6ae', stone2: '#7e9890', ink: '#f4f0e2',
  steel: '#c3d0cc', steelD: '#8a9c99', handle: '#6a4228',
};
const L = 520, PW = 34, CBX = L - 130, CBW = 32, CBH = 118, CBHL = 50;   // cross: post length, width; crossbar (from foot), thickness, half-length upright / lying
const FY = 1300, BY = 1252, RT = 1212;                                    // front lane (me), back lane (the others), the embankment's far edge
const REST = 26, G = L - 2 * REST;                                        // a full cross rests 26 px on each lip: the gap is G wide
const LIP = 1372;                                                          // the path's front edge (WATER, the water line, is set with the world)
const shade = (hex, k) => { const c = Pilot.hex(hex); return `rgb(${Math.min(255, c[0] * k) | 0},${Math.min(255, c[1] * k) | 0},${Math.min(255, c[2] * k) | 0})`; };
const t12 = t => Math.floor(t * 12 + 1e-6) / 12;                          // figures pose on twos (12 fps), like a hand-animated picture book
const frac = x => x - Math.floor(x);
const pathOf = (pts, closed = true) => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); if (closed) p.closePath(); return p; };
const mid2 = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
function smooth(pts, closed = true) {
  const p = new Path2D(), n = pts.length;

    for (let i = 0; i < n; i++) { const a = pts[i], m = mid2(a, pts[(i + 1) % n]); p.quadraticCurveTo(a[0], a[1], m[0], m[1]); } p.closePath(); }
  else { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n - 1; i++) { const m = mid2(pts[i], pts[i + 1]); p.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); } p.lineTo(pts[n - 1][0], pts[n - 1][1]); }

const blobPath = pts => smooth(pts);
// resample a polyline and push points off by low noise: a gouache edge, never ruler-straight
function rough(pts, amp, seed, step = 10, closed = true) {

const ell = (cx, cy, rx, ry, n = 28) => { const o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return o; };

}

// ---------------- textures ----------------
const TX = {};
function chalkTexture(w, h, seed, k = 1) {   // white & dark dry-brush speckle with soft blotches; transparent elsewhere (the lab's)
  const c = Pilot.canvas(w, h), x = c.getContext('2d'), d = x.createImageData(w, h), r = rng(seed), q = d.data;
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
    const b = noise(i / 60 + seed, y / 60) * .55 + noise(i / 13, y / 13 + seed) * .3 + noise(i / 140, y / 9 + seed) * .4;
    const v = (b - .62) * 1.25 + (r() - .5) * .95, o = (y * w + i) * 4;
    if (v > 0) { q[o] = 236; q[o + 1] = 250; q[o + 2] = 244; q[o + 3] = Math.min(255, v * 70 * k); }
    else { q[o] = 6; q[o + 1] = 22; q[o + 2] = 34; q[o + 3] = Math.min(255, -v * 80 * k); }
  }
  x.putImageData(d, 0, 0); return c;
}
function grainTile(n, seed) { const c = Pilot.canvas(n, n), x = c.getContext('2d'), d = x.createImageData(n, n), r = rng(seed);
  for (let i = 0; i < n * n; i++) { const v = 128 + (r() - .5) * 90; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
  x.putImageData(d, 0, 0); return c; }
// fill a path, then lay the chalk tooth inside it (pattern in the drawing's own coordinates)
function paint(g, path, col, tex = .9) {
  g.fillStyle = col; g.fill(path);
  if (tex > 0) { g.save(); g.clip(path); g.globalAlpha *= tex; g.fillStyle = TX.chalkPat; g.fill(path); g.restore(); }
}
function haloSprite() {   // the lantern's grainy, dotted gouache halo (the lab's)
  const n = 360, c = Pilot.canvas(n, n), x = c.getContext('2d'), r = rng(77);
  for (let i = 0; i < 3400; i++) { const a = r() * TAU, d = Math.pow(r(), .7) * n / 2, k = 1 - d / (n / 2);
    x.fillStyle = `rgba(255,${200 + r() * 50 | 0},${90 + r() * 60 | 0},${.18 + k * .75})`; const s = 1.8 + r() * 3 * k;
    x.fillRect(n / 2 + Math.cos(a) * d, n / 2 + Math.sin(a) * d, s, s); }
  return c;
}
function sprite(N, stops) { const c = Pilot.canvas(N, N), g = c.getContext('2d'), gr = g.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N / 2); for (const [o, col] of stops) gr.addColorStop(o, col); g.fillStyle = gr; g.fillRect(0, 0, N, N); return c; }

// ---------------- crosses (prebuilt sprites; post along +x, foot at x=0) ----------------
const KX = 2, CPAD = 14;
function crossSprite(mine, lying) {
  const hb = lying ? CBHL : CBH, w = (L + 2 * CPAD) * KX, h = (2 * hb + 2 * CPAD) * KX, c = Pilot.canvas(w, h), g = c.getContext('2d');
  g.setTransform(KX, 0, 0, KX, CPAD * KX, (hb + CPAD) * KX);
  const out = [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],
    [CBX + CBW / 2, PW / 2], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, PW / 2], [0, PW / 2]];
  const p = smooth(rough(out, 1.6, mine ? 3 : 5, 8)), [b, l, d] = mine ? [C.wood, C.woodL, C.woodD] : [C.xwood, C.xwoodL, C.xwoodD];
  g.fillStyle = b; g.fill(p); g.save(); g.clip(p);
  g.fillStyle = l; g.fillRect(0, -PW / 2 - 4, L + 4, PW * .38); g.fillRect(CBX - CBW / 2 - 4, -hb - 4, CBW * .38, 2 * hb + 8);   // the lit faces
  g.fillStyle = d; g.fillRect(0, PW * .22, L + 4, PW); g.fillRect(CBX + CBW * .2, -hb - 4, CBW, 2 * hb + 8);                     // the shaded faces
  g.fillStyle = b; g.fillRect(CBX - CBW / 2 + CBW * .38, -PW / 2 + PW * .38, CBW * .58, PW * .6);
  const r = rng(lying ? 12 : 11); g.strokeStyle = mine ? 'rgba(130,70,20,.4)' : 'rgba(30,22,16,.4)'; g.lineWidth = 2; g.lineCap = 'round';
  for (let k = 0; k < 6; k++) { const y0 = -PW / 2 + 5 + r() * (PW - 10), x0 = r() * L * .8; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + 40 + r() * 90, y0 + (r() - .5) * 3); g.stroke(); }   // brushed grain
  g.globalAlpha = .9; g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = TX.chalkPat; g.fillRect(0, 0, w, h);
  g.restore();

}
function drawCross(ctx, X, u0, u1, x, y, a, alpha = 1, glow = 0) {
  if (u1 - u0 < .5 || alpha <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.globalAlpha = alpha;
  const hb = X.hb, dh = 2 * hb + 2 * CPAD, left = u0 <= .5 ? -CPAD : u0, right = u1 >= L - .5 ? L + CPAD : u1;
  ctx.drawImage(X.c, (left + CPAD) * KX, 0, (right - left) * KX, dh * KX, left, -hb - CPAD, right - left, dh);
  ctx.restore();
}
// the lantern's grainy halo laid along my cross (between u0 and u1), the accent
function crossHalo(ctx, X, u0, u1, a, k) {
  if (k <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .2 * k;
  const n = Math.max(1, Math.round((u1 - u0) / 90));
  for (let i = 0; i <= n; i++) { const u = lerp(u0, u1, n ? i / n : .5), p = [X.x + Math.cos(X.a) * u, X.y + Math.sin(X.a) * u], R = 56; ctx.drawImage(TX.halo, p[0] - R, p[1] - R, 2 * R, 2 * R); }

let E = 1600, GX = 0, GAY = 0, ROADX0 = -1600, ROADX1 = 0;

// ---------------- the figure (jointed: IK limbs, poses on twos) ----------------
function ik(a, t, l1, l2, pick) {
  let dx = t[0] - a[0], dy = t[1] - a[1], d = Math.hypot(dx, dy) || 1e-6; const dd = clamp(d, Math.abs(l1 - l2) + .5, l1 + l2 - .5);

function frame(F) {   // torso frame: P(a, b) = hip + forward·a + up·b (scaled)

const shoulderOf = F => frame(F).P(4, 136);
// the light that edges a figure: cool blue in the cave, warm near the gate
const rimOf = x => Pilot.mix([150, 205, 255], [255, 200, 135], ss(E + G * .6, GX - 80, x));

  else { pts = []; for (let i = 0; i < 10; i++) { const q = i / 10 * TAU; pts.push([hd[0] + Math.cos(q) * 11.5 * s, hd[1] + Math.sin(q) * 10 * s]); }
    pts.splice(7, 0, [hd[0] + Math.cos(an - 1.9) * 14 * s, hd[1] + Math.sin(an - 1.9) * 14 * s]); }   // a thumb bump

// a caped traveller: thin legs under a long bell cape, sleeves, pale hands, a round head (me: dark hair with a tail;
// the others: a soft round hood). Every part is a flat fill with a thin rim of light on its upper-right edge.
// a fox in a cloak (the lab's fox, jointed): thin dark legs, a bushy tail, a heavy dark cloak to the knees, a pale knit
// collar, a big fox head; me = orange fox, the others = grey foxes in slate cloaks
function drawFig(ctx, F, mid, back, mid0) {

  const al = F.alpha ?? 1; if (al <= 0) return; ctx.save(); ctx.globalAlpha = al;

                : { cl: C.gcloak, cl2: C.gcloak2, sl: C.gsleeve, fur: C.gfur, fur2: C.gfur2, wh: C.gwhite, leg: C.gleg, paw: C.gpaw };

  ctx.fillStyle = K.fur; ctx.fill(tail); ctx.save(); ctx.clip(tail); ctx.fillStyle = K.wh; ctx.beginPath(); ctx.ellipse(-124, 26, 28, 20, .2, 0, TAU); ctx.fill();
  ctx.fillStyle = K.fur2; ctx.beginPath(); ctx.ellipse(-40, -16, 60, 12, .1, 0, TAU); ctx.fill(); ctx.restore(); ctx.restore();

  ctx.fillStyle = K.cl; for (let k = 0; k < 5; k++) { const p = [lerp(c0[0], c1[0], .1 + k * .2), lerp(c0[1], c1[1], .1 + k * .2)]; ctx.fillRect(p[0] - 2.5 * s, p[1] - 2.5 * s, 5 * s, 5 * s); }

  ctx.fillStyle = K.wh; ctx.beginPath(); ctx.ellipse(10, 8, 13, 11, 0, 0, TAU); ctx.fill();

  ctx.save(); ctx.globalAlpha = a * .6; ctx.translate(540, three ? 490 : 440); ctx.scale(1, three ? .42 : .3); ctx.drawImage(SHADE, -560, -560, 1120, 1120); ctx.restore();
}
function endPlate(ctx, t) {   // a painted page comes over the picture
  const k = ss(B.end - .2, B.end + .35, t); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.drawImage(PLATE, 0, 0); ctx.restore();
  if (k > .05) { const x = 540, y = 1390; ctx.save(); ctx.globalAlpha = k; ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(TX.halo, x - 90, y - 90, 180, 180); ctx.restore(); }
}

// ---------------- frame ----------------
let SOFTG = null, DASH = [], DROPS = [], MOTES = [], PLANTS = [], MIST = null, SHADE = null, PLATE = null, FIG = {}, SKY = null, VIG = null, GRAIN = null;
function draw(ctx, t) {
  const cm = camAt(t), lk = lightK(t);
  ctx.fillStyle = C.sky1; ctx.fillRect(0, 0, W, H);
  layer(ctx, cm, .15, () => drawSheet(ctx, SH.far));
  layer(ctx, cm, .42, () => drawSheet(ctx, SH.mid));
  layer(ctx, cm, .7, () => drawSheet(ctx, SH.near));
  layer(ctx, cm, 1, () => world(ctx, t, cm, lk));
  drawMotes(ctx, t, cm);
  drawFore(ctx, t, cm);
  ctx.drawImage(VIG, 0, 0);
  const dim = 1 - lk; if (dim > 0) { ctx.fillStyle = `rgba(6,20,30,${.5 * dim})`; ctx.fillRect(0, 0, W, H); }
  ctx.save(); ctx.globalAlpha = .06;
  GRAIN.setTransform(new DOMMatrix([cm.z, 0, 0, cm.z, 540 - cm.x * cm.z, 960 - cm.y * cm.z])); ctx.fillStyle = GRAIN; ctx.fillRect(0, 0, W, H); ctx.restore();
  endPlate(ctx, t);
  if (t < B.end) { captionShade(ctx, t);
    Story.captions(ctx, t, S.lines, { font: BATANG, weight: 700, size: 60, color: C.ink, srcColor: '#cfe6e0', y: 430, shadow: 'rgba(6,26,36,.85)', shadowBlur: 20 }); }
  Story.endCard(ctx, t, S.endCard, B.end, { font: BATANG, color: C.ink, srcColor: '#cfe6e0', y: 880, titleShadow: 'rgba(6,26,36,.6)' });
}

async function init() {
  TX.chalk = chalkTexture(W, H, 5); TX.chalkPat = Pilot.canvas(1, 1).getContext('2d').createPattern(TX.chalk, 'repeat'); TX.halo = haloSprite();
  buildTimeline(); buildWorld();
  // where my falling cross reaches the water: the splash
  for (let t = B.fall; t < B.fall + 2; t += 1 / 120) { const X = fallX(t), c0 = cpt(X, (X.u0 + L) / 2); if (c0[1] > WATER) { SPLASH = t; break; } }
  TX.gUp = crossSprite(true, false); TX.gLie = crossSprite(true, true); TX.xUp = crossSprite(false, false); TX.xLie = crossSprite(false, true);
  FIG.c = Pilot.canvas(W, H); FIG.x = FIG.c.getContext('2d');
  SOFTG = sprite(256, [[0, 'rgba(255,214,140,.9)'], [.35, 'rgba(255,190,110,.35)'], [1, 'rgba(255,170,90,0)']]);
  MIST = sprite(128, [[0, 'rgba(200,240,232,.6)'], [1, 'rgba(200,240,232,0)']]);
  SHADE = sprite(128, [[0, 'rgba(6,26,36,.8)'], [.6, 'rgba(6,26,36,.45)'], [1, 'rgba(6,26,36,0)']]);
  const g0 = Pilot.canvas(1, 1).getContext('2d'), sg = g0.createLinearGradient(0, 0, 0, H); sg.addColorStop(0, C.sky0); sg.addColorStop(.6, C.sky1); sg.addColorStop(1, C.near); SKY = sg;
  VIG = Pilot.canvas(W, H); { const x = VIG.getContext('2d'), g = x.createRadialGradient(W / 2, H * .5, H * .3, W / 2, H * .5, H * .78); g.addColorStop(0, 'rgba(6,20,30,0)'); g.addColorStop(1, 'rgba(6,20,30,.42)'); x.fillStyle = g; x.fillRect(0, 0, W, H); }
  GRAIN = Pilot.canvas(1, 1).getContext('2d').createPattern(grainTile(256, 3), 'repeat');
  PLATE = Pilot.canvas(W, H); { const x = PLATE.getContext('2d'); x.fillStyle = '#16323f'; x.fillRect(0, 0, W, H);
    const g = x.createRadialGradient(540, 940, 60, 540, 940, 900); g.addColorStop(0, 'rgba(70,130,135,.55)'); g.addColorStop(1, 'rgba(70,130,135,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.globalAlpha = .9; x.drawImage(TX.chalk, 0, 0); x.globalAlpha = 1;
    x.strokeStyle = 'rgba(214,240,232,.35)'; x.lineWidth = 3; x.stroke(smooth(rough([[110, 620], [970, 620], [970, 1480], [110, 1480]], 8, 3, 20))); }
  const r = rng(101);
  for (let i = 0; i < 160; i++) { const y = WATER + 20 + Math.pow(r(), 1.3) * 600; DASH.push({ x: ROADX0 + r() * (ROADX1 - ROADX0), y, l: 20 + r() * 70, w: 2 + r() * 1.5, a: .35 + r() * .35, f: .8 + r() * 1.6, p: r() * TAU }); }
  for (let i = 0; i < 18; i++) DROPS.push({ vx: (r() - .5) * 360, vy: 300 + r() * 360, s: 3 + r() * 4 });
  for (let i = 0; i < 40; i++) MOTES.push({ x: r() * 1180, y: 160 + r() * 1400, s: 3 + r() * 5, a: .3 + r() * .45, f: .4 + r() * .7, p: r() * TAU });
  PLANTS = [{ c: plantSprite(3, false), x: 60, y: 1990, s: .78, f: .9, p: 0 }, { c: plantSprite(8, true), x: 1030, y: 1990, s: .7, f: .75, p: 2 }];
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 60px 'Gowun Batang'", "700 72px 'Gowun Batang'", "400 34px 'Noto Sans KR'", "500 34px 'Noto Sans KR'"], init, draw });
</script>
