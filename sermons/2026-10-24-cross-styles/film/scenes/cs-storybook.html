<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script><script src="kit-storybook.js"></script>
<script>
/* 잘라 낸 건 다리였다 — 06 textured gouache picture book (from lab-storybook: the fox and the lantern).
   A teal swamp forest at night: pale misty trunks far → dark teal near, a pale moon, rounded hills, a strip of still
   water behind; flat opaque gouache shapes with rough edges and a chalky dry-brush tooth in every shape; diamond motes
   float; blue-leafed swamp plants sway at the bottom over bright turquoise water. The road is a mossy embankment above
   the water. "Me" is the lab's orange fox in a dark cloak with a white knit collar; the others are grey foxes in slate
   cloaks (quieter). Every cross is muted brown wood except mine — lantern-gold, with the lab lantern's grainy halo:
   the one accent. The gap is a ravine cut through the embankment down to dark water; across it a plain round stone
   arch in a hillside pours warm lantern light, the lab's lantern hanging on its hooked pole beside it. The hit: crash
   zoom + shake, chalk dust off the lip, then the cross splashes into the dark water far below.
   The choreography (timeline, poses, camera) is the paper-cut version's (cross-papercut), redrawn.
   The forest, the fox rig, the textures, the light and the words are the house style's kit (kit-storybook.js =
   styles/storybook/kit.js); this file keeps only the story: the crosses, the saw, the timeline, the poses, the others'
   bridges, the camera, the guide. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const K = Storybook, C = K.C, TX = K.TX, { t12, frac, pathOf } = K;
const L = 520, PW = 34, CBX = L - 130, CBW = 32, CBH = 118, CBHL = 50;   // cross: post length, width; crossbar (from foot), thickness, half-length upright / lying
const { FY, BY, RT, LIP, WATER } = K.Y;                                  // front lane (me), back lane (the others), the embankment's far edge, front edge, water line
const REST = 26, G = L - 2 * REST;                                        // a full cross rests 26 px on each lip: the gap is G wide

// ---------------- crosses (prebuilt kit beam sprites; post along +x, foot at x=0) ----------------
const crossSprite = (mine, lying) => K.beamSprite({ len: L, w: PW, bar: { at: CBX, w: CBW }, hb: lying ? CBHL : CBH, lit: mine, seed: lying ? 12 : 11 });
let E = 1600, GX = 0, SPLASH = 99;

// ---------------- timeline: my path (integrated once), the cuts ----------------
const SME = 1.04, SPI = .95;                    // me (nearest) a touch larger than the others
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 44 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1));        // staggering
  if (t < 4.6) return 0;
  if (t < 5.0) return 370 * eio((t - 4.6) / .4);                            // lighter: big quick strides
  if (t < 8.3) return 370;
  if (t < 8.6) return lerp(370, 150, (t - 8.3) / .3);
  if (t < 9.0) return 150 * (1 - ss(8.6, 9.0, t));
  if (t < 10.1) return 0;
  if (t < 10.4) return 520 * Math.sin(Math.PI * (t - 10.1) / .3);
  if (t < 11.5) return 0;
  if (t < 12.0) return 760 * Math.sin(Math.PI * (t - 11.5) / .5);
  return 0;
}
const strideMe = t => t < 4.6 ? 116 : t < 8.8 ? 270 : 170;
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };
const meX = t => tab(MEX, t), meP = t => tab(MEP, t);
const CUTS = [{ s: 3.2, d: .3, saw0: 3.5, drop: 4.0, up1: 4.4 }, { s: 9.0, d: .3, saw0: 9.3, drop: 9.8, up1: 10.1 }, { s: 10.4, d: .3, saw0: 10.7, drop: 11.2, up1: 11.5 }];
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const FILL = [[99, 100], [99, 100], [99, 100]];   // v2: the pieces never fly — they stay where they fell
const SLOTS = [22.9, 23.6, 24.3];                  // v2: the outline's missing span lights slot by slot (one piece's length each)
const PIECE_GLOW = (c, t) => ss(B.back + .25 + (2 - c.k) * .25, B.back + .65 + (2 - c.k) * .25, t);   // each piece glows where it lies as the camera passes it (3, 2, 1)
const FLECKS = [];
let SAWLIE = null;   // where I leave the saw after the last cut
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }
  E = meX(12) + 52;
  CUTS.forEach((c, k) => {
    c.k = k; c.mx = meX(c.s); c.cutX = c.mx - 205 * SME; c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.baseX = c.cutX - c.u1; c.y = FY + 26;
    const r = rng(100 + k);
    for (let n = 0; n < 18; n++) FLECKS.push({ t0: n < 12 ? lerp(c.saw0, c.drop, n / 12) : c.drop + r() * .05, x: c.cutX + (r() - .5) * 8, y: c.y - PW / 2,
      vx: (r() - .5) * (n < 12 ? 180 : 320), vy: -(80 + r() * (n < 12 ? 160 : 260)), land: FY + 18 + r() * 44, r0: r() * TAU, vr: (r() - .5) * 20, sz: 4 + r() * 5, col: C.gold });
  });
  const c3 = CUTS[2]; SAWLIE = { grip: [c3.cutX + 150, FY + 52], ang: Math.PI + .05 };
  const r = rng(200);   // flecks off the lip as my cross goes over
  for (let n = 0; n < 16; n++) FLECKS.push({ t0: B.fall + r() * .1, x: E + 6 + r() * 30, y: FY + 30, vx: (r() - .2) * 260, vy: -(60 + r() * 220), land: 2600, r0: r() * TAU, vr: (r() - .5) * 24, sz: 4 + r() * 6, col: n % 3 ? C.gold : C.gate });
}
function pieceAt(c, t) {   // a cut piece lying where it fell (shifted a little as it came off), or flying into the gap at the end
  const sh = 18 * eo((t - c.drop) / .25), y0 = c.y, cu = (c.u0 + c.u1) / 2;
  let cx = c.baseX + cu - sh, cy = y0, a = -.05 * eo((t - c.drop) / .25);
  const [f0, f1] = FILL[c.k];
  if (t > f0) { const u = clamp((t - f0) / (f1 - f0)), e = eio(u), tx = E - REST + cu, ty = FY + 34;
    cx = lerp(cx, tx, e); cy = lerp(cy, ty, e) - (c.k ? 190 : 280) * Math.sin(Math.PI * u); a = lerp(a, 0, e) + Math.sin(u * Math.PI * 3) * .55 * (1 - u); }
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a };
}

// ---------------- poses (the rig is the kit's: Storybook.walk / stand / mix / figure) ----------------
// the cross on a figure's shoulder: {x, y, a} = foot origin and angle; the contact point on the post rests on the shoulder
function carryCross(F, left, a0) { const X = K.carry(F, a0, PW, L - Math.min(282, left * L - 36)); X.u0 = L * (1 - left); X.lie = false; return X; }
const cpt = K.pt, mixX = K.mixX, rotAbout = K.rotAbout;
function gripCarry(F, X) { F.hands = [cpt(X, Math.min(L - 16, X.contact + 26)), cpt(X, Math.min(L - 14, X.contact + 80))]; F.hand = ['fist', 'fist']; return F; }

// ---------------- the saw (always in my right hand until I leave it on the road after the last cut) ----------------
const CUT_ANG = Math.PI - .72, hangAng = f => Math.atan2(.95, .3 * f);
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];
  return { d, up, heel: [grip[0] - up[0] * 14 + d[0] * 20, grip[1] - up[1] * 14 + d[1] * 20] }; }
function sawState(c, t) {   // the cutting stroke: the teeth pass through the kerf, the blade moves along its own length
  const kp = clamp((t - c.saw0) / (c.drop - .06 - c.saw0)), saw = t >= c.saw0 - .05 && t < c.drop + .02;
  const osc = saw ? 24 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, g0 = sawGeo([0, 0], CUT_ANG), d = g0.d, up = g0.up;
  const K = [c.cutX, c.y - PW / 2 + kp * PW * .92], heel = [K[0] - d[0] * (96 - osc), K[1] - d[1] * (96 - osc)];
  return { kp, grip: [heel[0] + up[0] * 14 - d[0] * 20, heel[1] + up[1] * 14 - d[1] * 20], K };
}
function drawSaw(ctx, grip, ang) {
  const { d, up, heel } = sawGeo(grip, ang);
  const P = (u, v) => [heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v];
  const blade = [P(0, 30), P(172, 18)]; for (let u = 172; u >= 0; u -= 9) blade.push(P(u, (u / 9 | 0) % 2 ? 3 : -3));
  ctx.fillStyle = C.steelD; ctx.fill(pathOf(blade));
  ctx.fillStyle = C.steel; ctx.fill(pathOf([P(0, 30), P(172, 18), P(172, 11), P(0, 20)]));
  ctx.fillStyle = 'rgba(20,40,50,.5)'; ctx.beginPath(); ctx.arc(...P(152, 13), 3.2, 0, TAU); ctx.fill();
  const hp = pathOf([P(-4, 36), P(-38, 46), P(-52, 20), P(-40, -4), P(-6, 2)]), hole = pathOf([P(-14, 30), P(-34, 36), P(-42, 20), P(-34, 8), P(-14, 12)]);
  const hnd = new Path2D(); hnd.addPath(hp); hnd.addPath(hole); ctx.fillStyle = C.handle; ctx.fill(hnd, 'evenodd');
}
function sawSpec(c, t) {
  const f = -1, mx = c.mx, s = SME, st = sawState(c, t);
  return { s, f, gy: FY, hip: [mx, FY - 84 * s], ang: f * 1.1, feet: [[mx + 74 * s, FY], [mx - 60 * s, FY]], hands: [st.grip, [c.cutX + 44 * s, c.y - PW / 2 - 3]],
    hand: ['fist', 'flat'], tilt: .32, eye: 'calm', sway: 0, farFront: true };
}
const rIdx = F => F.f > 0 ? 1 : 0, lIdx = F => F.f > 0 ? 0 : 1;
const HOLD = 160;   // how far up the beam (past the shoulder) my front hand grips — clear of the head
const UPIN = c => c.cutX + 44 * SME - c.baseX;   // where my pinning hand presses the lying cross (along the post)

// how I carry my cross: the shorter it gets, the flatter it rides on my shoulder (a short cross tilted 45° would read as an X)
function holdFront(F, lf) {   // my short cross held flat in both hands at the waist (no tilt through 45°, nothing at the face)
  const u0 = L * (1 - lf), cx = F.hip[0] + F.f * 40 * F.s, y = F.hip[1] + 6 * F.s, a = F.f > 0 ? 0 : Math.PI;
  const X = { x: cx - Math.cos(a) * (u0 + L) / 2, y, a, u0, lie: true, contact: u0 + 150 - HOLD };
  F.hands = [cpt(X, u0 + 150), cpt(X, u0 + 96)]; F.hand = ['fist', 'fist']; return [F, X];
}
const angFor = lf => lerp(-.16, -.42, clamp((lf - .48) / .52));
function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), left = leftAt(t);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const F = K.walk(x, FY, SME, 1, ph, 116, .3 + .1 * Math.sin(tt * TAU / 1.15), 16); F.eye = 'strain'; F.tilt = .12; F.hip[1] += 6 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, -.4 + .05 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt); const F = K.walk(x, FY, SME, 1, ph, lerp(116, 270, k), lerp(.16, .3, k), lerp(20, 62, k)); return [F, angFor(leftAt(tt))]; }
    const F = K.walk(x, FY, SME, 1, ph, 170, .16, 34); return [F, angFor(leftAt(tt))];
  };
  const sawHeld = t < CUTS[2].drop;
  // carried: the far (left) hand holds the post ahead of my face; the near (right) hand carries the saw — or, once the saw is gone, the post too
  const carried = (F, a0, lf, held) => { if (lf < .5 && !held) return holdFront(F, lf); const X = carryCross(F, lf, a0); F.hands = [cpt(X, Math.min(L - 16, X.contact + HOLD)), cpt(X, Math.min(L - 16, X.contact + HOLD - 46))]; F.hand = ['fist', 'fist'];
    if (held) F.hands[1] = K.hangGrip(F, F.ph != null ? 18 * Math.sin(TAU * F.ph) : 0);
    return [F, X]; };
  for (const c of CUTS) {
    if (t >= c.s && t < c.up1) {
      const lf0 = S.left[c.k], lf1 = S.left[c.k + 1], [W0, a0] = walk(c.s, c.mx), [W1, a1] = walk(c.up1, c.mx), last = c.k === 2;
      const [WA, XA] = carried(W0, a0, lf0, true), [WB, XB] = carried(W1, a1, lf1, !last);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      if (t < c.s + c.d) { const k = eio((tp - c.s) / c.d), F = K.mix(WA, SP, k);
        F.hands[rIdx(F)] = [lerp(WA.hands[1][0], cg[0], k), lerp(WA.hands[1][1], cg[1], k)];
        const Xm = mixX(XA, XL, k); F.hands[lIdx(F)] = cpt(Xm, lerp(Math.min(L - 16, XA.contact + HOLD), UPIN(c), k), lerp(0, -PW / 2 - 3, k));
        F.hand = F.f > 0 ? ['fist', 'fist'] : ['fist', 'flat']; F.farOver = true;
        return { F, X: Xm, c, saw: { grip: F.hands[rIdx(F)], ang: lerp(hangAng(1), CUT_ANG, k) } }; }
      if (t < c.drop) { const st = sawState(c, t); return { F: sawSpec(c, t), X: XL, c, kerf: st, saw: { grip: st.grip, ang: CUT_ANG } }; }
      const k = eio((tp - c.drop) / (c.up1 - c.drop)), F = K.mix(SP, WB, k);
      const rT = WB.hands[1], lT = WB.hands[0];
      const Xm = mixX(XL, XB, k);
      const ks = k * k * k; F.hands[rIdx(F)] = last ? cpt(Xm, lerp(UPIN(c) + 60, Math.min(L - 16, XB.contact + HOLD - 46), k), lerp(-PW / 2 - 3, 0, k)) : [lerp(cg[0], rT[0], ks), lerp(cg[1] + 30 * Math.sin(Math.PI * k), rT[1], ks)];
      F.hands[lIdx(F)] = cpt(Xm, lerp(UPIN(c), Math.min(L - 16, XB.contact + HOLD), k), lerp(-PW / 2 - 3, 0, k)); F.farOver = true;
      F.hand = F.f > 0 ? ['fist', 'fist'] : ['fist', 'flat'];
      const saw = last ? null : { grip: F.hands[rIdx(F)], ang: lerp(CUT_ANG, hangAng(1), ks) };
      return { F, X: Xm, c, saw };
    }
  }
  if (t < 12) { const [F, a] = walk(tp); const [G2, X] = carried(F, a, left, sawHeld); return { F: G2, X, saw: sawHeld ? { grip: G2.hands[1], ang: hangAng(1) } : null }; }
  // at the edge: stop, step aside for the others, come back
  if (t < 18.4) { const [F0] = walk(12, E - 52), k = eio((tp - 12) / .3);
    const bx = -150 * eio((tp - 12.9) / .7) + 150 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.85, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.65, 17.55, .12, .12));
    const STx = mv > 0 ? K.mix(K.stand(E - 52 + bx, FY, SME, 1, .08), K.walk(E - 52 + bx, FY, SME, 1, (E + bx) / 150, 150, .1, 24), mv) : K.stand(E - 52 + bx, FY, SME, 1, .08);
    const F = K.mix(F0, STx, k);
    F.ang += .16 * Math.sin(Math.PI * clamp((tp - 12) / .5)) * (tp < 12.5 ? -1 : 0); F.eye = tp < 13.2 ? 'shock' : 'calm';
    const [G2, X] = carried(F, angFor(left), left, false); return { F: G2, X }; }
  const XLay = { x: E - REST - L * (1 - left), y: FY + 34, a: 0, u0: L * (1 - left), lie: true };
  const LAY = { ...K.stand(E - 52, FY, SME, 1), hip: [E - 66, FY - 92 * SME], ang: 1.2, feet: [[E - 104, FY], [E - 30, FY]], tilt: -.5 };
  LAY.hands = [cpt(XLay, L * (1 - left) + 70), cpt(XLay, L * (1 - left) + 26)]; LAY.hand = ['flat', 'flat'];   // pressing the foot end down on the lip
  const REACH = { ...LAY, hip: [E - 66, FY - 160 * SME], ang: .46, hands: [[E - 36, FY - 64], [E + 70, FY - 20]], hand: ['fist', 'open'], eye: 'shock', tilt: .45 };
  if (t < B.tip) { if (t < 18.9) { const ST = K.stand(E - 52, FY, SME, 1, .08), STc = carried(ST, angFor(left), left, false), k = eio((tp - 18.4) / .4);
      const e = eio((t - 18.4) / .4), Xm = mixX(STc[1], XLay, e), F = K.mix(STc[0], LAY, k), u0 = L * (1 - left);
      F.hands = [cpt(Xm, lerp(Math.min(L - 16, STc[1].contact + HOLD), u0 + 70, e)), cpt(Xm, lerp(Math.min(L - 16, STc[1].contact + HOLD - 46), u0 + 26, e))];
      F.hand = k > .5 ? ['flat', 'flat'] : ['fist', 'fist']; return { F, X: Xm, lay: true }; }
    return { F: LAY, X: XLay, lay: true }; }
  if (t < B.back) { const k = eio((tp - B.tip) / .45), F = K.mix(LAY, REACH, k); F.hand = REACH.hand; if (tp > 20.6) F.eye = 'down'; return { F, X: null }; }
  const BACK = { ...K.stand(E - 52, FY, SME, -1, .04), tilt: .05, eye: 'calm' }, FWD = { ...K.stand(E - 52, FY, SME, 1, .1), tilt: .38, eye: 'down' };
  if (t < 22.5) return { F: K.mix(REACH, BACK, eio((tp - B.back) / .3)), X: null };
  return { F: K.mix(BACK, FWD, eio((tp - 22.5) / .3)), X: null };
}
// my cross once my hands slip: it tips over the lip, then falls into the dark
function fallX(t) {
  if (t < B.tip) return null;
  const left = S.left[3], u0 = L * (1 - left), pv = [E, FY + 34 + PW / 2];
  const X0 = { x: E - REST - u0, y: FY + 34, a: 0, u0, lie: true };
  if (t < B.fall) return rotAbout(X0, pv, .5 * Math.pow((t - B.tip) / (B.fall - B.tip), 2));
  const X1 = rotAbout(X0, pv, .5), u = t - B.fall, cu = (u0 + L) / 2, c0 = cpt(X1, cu);   // tumble about its own middle
  const cx = c0[0] + 90 * u, cy = c0[1] + 160 * u + 1500 * u * u, a = X1.a + 2.6 * u + 1.2 * u * u;
  return { ...X1, x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, alpha: 1 - ss(B.fall + .55, B.fall + 1.05, t), clip: true };
}


// ---------------- the others: lay it across → walk over → pull it back from the far side → shoulder it → into the light ----------------
const PIL = [{ x0: -540, ph: .3 }, { x0: -290, ph: .75 }, { x0: 270, ph: .1 }, { x0: 520, ph: .55 }];
const BRIDGE_Y = [BY - 6, BY + 4, BY + 14], PULL = 210;
function pilState(i, t) {
  const tp = t12(t), P = PIL[i], j = 3 - i, T = j < 3 ? B.bridges[j] : 99, yb = BRIDGE_Y[j] ?? BY;
  const xAt = tt => { if (tt <= 9 || j > 2) return P.x0 + 52 * tt; const xa = P.x0 + 468, xb = E - 300 - 130 * j, xc = E - 46;
    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, clamp((tt - 12) / (T - .35 - 12))); };
  const carry = (tt, x, gy = BY, stride = 118, lean = .27) => { const F = K.walk(x, gy, SPI, 1, P.ph + x / (stride * SPI), stride, lean, 18); F.col = C.pil; F.tilt = .05; const X = carryCross(F, 1, -.42); gripCarry(F, X); return [F, X]; };
  if (j > 2) { if (t >= 12) return null; const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  if (t < T - .35) { const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  const XB = { x: E - REST, y: yb, a: 0, u0: 0, lie: true };
  const LAY = { ...K.stand(E - 46, BY, SPI, 1), hip: [E - 58, BY - 96 * SPI], ang: 1.1, feet: [[E - 96, BY], [E - 22, BY]], tilt: -.45, col: C.pil };
  LAY.hands = [cpt(XB, 70), cpt(XB, 26)];
  if (t < T) { const [F0, X0] = carry(T - .35, E - 46), k = eio((tp - T + .35) / .35), e = eio((t - T + .35) / .35), Xm = mixX(X0, XB, e), F = { ...K.mix(F0, LAY, k), col: C.pil };
    F.hands = [cpt(Xm, lerp(X0.contact + 26, 70, e)), cpt(Xm, lerp(X0.contact + 80, 26, e))]; return { F, X: Xm }; }
  const xs0 = E - 24, xs1 = E + G + 70;
  if (t < T + .3) { const F = K.mix(LAY, K.stand(xs0, yb - PW / 2, SPI, 1, .1), eio((tp - T) / .25)); F.col = C.pil; return { F, B: XB }; }
  if (t < T + .75) { const x = lerp(xs0, xs1, eio(clamp((tp - T - .3) / .45))), gy = x < E + G + 4 ? yb - PW / 2 : BY;
    const F = K.walk(x, gy, SPI, 1, P.ph + x / (170 * SPI), 170, .12, 30); F.col = C.pil; F.tilt = -.05; F.hands = K.hangHands(F, 26 * Math.sin(TAU * (P.ph + x / (170 * SPI)))); return { F, B: XB }; }
  // from the far side: turn, crouch, take the top end and pull it back across (pressing it down over the far lip as a lever)
  const pv = [E + G, yb + PW / 2], pullX = k => rotAbout({ ...XB, x: XB.x + PULL * k }, [pv[0], pv[1]], -.1 * k);
  const xpAt = k => xs1 + 10 + PULL * k;
  const PULLS = k => { const X = pullX(k), x = xpAt(k); const F = { ...K.stand(x, BY, SPI, -1), hip: [x + 14, BY - 84 * SPI], ang: -1.1, feet: [[x + 36, BY], [x - 30, BY]], tilt: -.35, col: C.pil };
    F.hands = [cpt(X, L - 44), cpt(X, L - 92)]; return [F, X]; };
  if (t < T + 1.0) { const k = eio(clamp((tp - T - .75) / .25)), [F, X] = PULLS(k);
    const k0 = eio((tp - T - .75) / .08); return { F: k0 < 1 ? { ...K.mix(K.walk(xs1, BY, SPI, 1, 0, 170, .1), F, k0), col: C.pil } : F, X }; }
  const [Fp, Xp] = PULLS(1), xg = xpAt(1);
  if (t < T + 1.3) { const k = eio((tp - T - 1.0) / .3), e = eio((t - T - 1.0) / .3), [Fc, Xc] = carry(T + 1.3, xg, BY, 150, .2), Xm = mixX(Xp, Xc, e), F = { ...K.mix(Fp, Fc, k), col: C.pil };
    F.hands = F.f < 0 ? [cpt(Xm, lerp(L - 44, Xc.contact + 26, e)), cpt(Xm, lerp(L - 92, Xc.contact + 80, e))] : [cpt(Xm, lerp(L - 44, Xc.contact + 26, e)), cpt(Xm, lerp(L - 92, Xc.contact + 80, e))];
    return { F, X: Xm }; }
  const x = lerp(xg, GX + 10, clamp((tp - T - 1.3) / .35)), [F, X] = carry(tp, x, BY, 150, .2);
  F.alpha = 1 - ss(T + 1.42, T + 1.7, t); F.inGate = x > GX - 110; if (F.alpha <= 0) return null;
  return { F, X };
}


// ---------------- camera ----------------
function camAt(t) {
  let c = { x: meX(t) + 60 + 90 * ss(4.3, 5.4, t), y: 1050, z: 1.03 };
  c = K.mixCam({ x: meX(t) + 34, y: 1000, z: 1.62 }, c, eio((t - 1.5) / 1.1));       // the hook: close on me (the saw in my hand), widening to the procession by ~2.6
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: (cc.mx + cc.cutX) / 2 - 10, y: 1120, z: 1.32 });
  c = K.mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = K.mixCam(c, K.mixCam(at(c2), at(c3), eio((t - 10.0) / .45)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));   // the chasm stays out of frame until I reach it
  if (t >= 12) c = K.mixCam(c, { x: E + 330, y: 1060, z: .86 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = K.mixCam(c, { x: E + 190, y: 1090, z: .98 }, eio((t - 18.2) / .45));
  if (t >= B.fall) c = K.mixCam(c, { x: E + 160, y: 1200, z: 1.34 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .65) c = K.mixCam(c, { x: E + 150, y: 1060, z: 1.0 }, eio((t - B.fall - .65) / .7));
  if (t >= B.back) c = K.mixCam(c, { x: E - 340, y: 1130, z: .98 }, eio((t - B.back) / .8));      // travel back down the road: pieces 2-3 glow where they lie, I stay in frame at the lip looking back
  if (t >= 22.3) c = K.mixCam(c, { x: E + 190, y: 1110, z: .95 }, eio((t - 22.3) / .75));          // back out to the gap: me at the lip, the outline over the gap
  return K.shake(c, t, B.fall);   // the hit: shake
}

function crossOutline(x, y) {
  const hb = CBHL; return [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],
    [CBX + CBW / 2, PW / 2], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, PW / 2], [0, PW / 2]].map(([a, b]) => [x + a, y + b]);
}
function guide(ctx, t, k, al) {   // a dashed chalk outline of my whole cross across the gap
  const ol = crossOutline(E - REST, FY + 34), x1 = E - REST - 4 + (L + 8) * k;
  ctx.save(); ctx.globalAlpha = al; ctx.beginPath(); ctx.rect(E - REST - 10, FY - 200, x1 - (E - REST - 10), 400); ctx.clip();
  ctx.fillStyle = 'rgba(255,214,140,.14)'; ctx.fill(pathOf(ol));
  const glow = 0;
  ctx.setLineDash([14, 9]); ctx.lineDashOffset = -t * 18; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.strokeStyle = `rgba(255,236,190,${.88 + .12 * glow})`; ctx.stroke(pathOf(ol)); ctx.setLineDash([]);
  if (glow > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 14; ctx.strokeStyle = `rgba(255,200,110,${.3 * glow})`; ctx.stroke(pathOf(ol)); }
  ctx.restore();
}
// v2 ending: the dashed chalk outline of my whole cross over the open gap (ghostly); the span my cut pieces would make
// lights slot by slot (22.9 / 23.6 / 24.3) — put together, exactly this long. Nothing is filled in; the gap stays open.
function guideEnd(ctx, t) {
  const a = ss(22.3, 22.8, t); if (a <= 0) return;
  guide(ctx, t, eio((t - 22.3) / .5), a * .85);
  for (const c of CUTS) { const t0 = SLOTS[c.k], k = ss(t0, t0 + .22, t); if (k <= 0) continue;
    const x0 = E - REST + c.u0 + 2, x1 = E - REST + c.u1 - 2, y = FY + 34, knock = Math.exp(-Math.max(0, t - t0) * 3.5);
    ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = `rgba(255,214,130,${.3 + .2 * knock})`; ctx.fillRect(x0, y - PW / 2 + 2, x1 - x0, PW - 4);
    ctx.setLineDash([14, 9]); ctx.lineDashOffset = -t * 18; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,238,195,.95)'; ctx.strokeRect(x0, y - PW / 2 + 2, x1 - x0, PW - 4); ctx.setLineDash([]);
    ctx.restore(); K.soft(ctx, (x0 + x1) / 2, y, (x1 - x0) * .75 + 30, k * (.25 + .4 * knock)); }
}

const PIECE_HL = (c, t) => PIECE_GLOW(c, t);
let LASTM = null;
function figures(ctx, t, pils) {
  for (const P of pils) if (P.B) K.drawBeam(ctx, TX.xLie, 0, L, P.B.x, P.B.y, P.B.a);
  pils.slice().sort((a, b) => (a.F ? a.F.hip[0] : 0) - (b.F ? b.F.hip[0] : 0)).forEach(P => {
    if (!P.F || P.F.inGate) return; const X = P.X;
    const dc = X ? () => K.drawBeam(ctx, X.lie ? TX.xLie : TX.xUp, X.u0, L, X.x, X.y, X.a) : null;
    K.figure(ctx, P.F, X && X.lie ? dc : null, X && !X.lie ? dc : null);
  });
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip; drawSaw(ctx, [lerp(g0[0], SAWLIE.grip[0], k), lerp(g0[1], SAWLIE.grip[1], k)], lerp(CUT_ANG, SAWLIE.ang, k)); }
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t); K.drawBeam(ctx, TX.gLie, c.u0, c.u1, p.x, p.y, p.a, 1, .3 + .7 * PIECE_HL(c, t)); }
  const M = poseMe(t), F = M.F; F.me = true; LASTM = M;
  const myCross = X => { if (!X) return; K.drawBeam(ctx, X.lie ? TX.gLie : TX.gUp, X.u0, L, X.x, X.y, X.a, 1, .55); };
  K.figure(ctx, F, () => {
    if (M.X && M.X.lie) myCross(M.X);
    if (M.kerf) { ctx.fillStyle = '#3a1d0a'; ctx.fillRect(M.c.cutX - 1.6, M.c.y - PW / 2, 3.2, M.kerf.kp * PW * .92 + .5); }
    if (M.saw) drawSaw(ctx, M.saw.grip, M.saw.ang);
  }, null, M.X && !M.X.lie ? () => myCross(M.X) : null);
  if (M.c && t >= M.c.drop && t < M.c.drop + .09) { const c = M.c; ctx.strokeStyle = 'rgba(255,240,200,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(c.cutX - 18, c.y - PW / 2 - 8); ctx.lineTo(c.cutX - 18, c.y + PW / 2 + 8); ctx.stroke(); }
  const FX = fallX(t);
  if (FX && t < SPLASH + .05) { ctx.save(); if (FX.clip) { ctx.beginPath(); ctx.rect(E + 2, -4000, G - 4, 4000 + WATER + 6); ctx.clip(); }
    const d = clamp((t - B.fall) / (SPLASH - B.fall)), c0 = cpt(FX, (FX.u0 + L) / 2), sc = 1 - .5 * d;   // it falls away into the cleft: smaller, hazier
    ctx.translate(c0[0], c0[1]); ctx.scale(sc, sc); ctx.translate(-c0[0], -c0[1]); K.drawBeam(ctx, TX.gLie, FX.u0, L, FX.x, FX.y, FX.a, 1 - .55 * d * d, .7); ctx.restore(); }
}

// ---------------- the world layer (the kit's picture-book world around the story) ----------------
function world(ctx, t, cm, lk) {
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  K.ground(ctx, t, cm, lk, () => {   // whoever is walking into the gate's light
    for (const P of pils) if (P.F && P.F.inGate) K.figure(ctx, P.F, null, P.X && !P.X.lie ? () => K.drawBeam(ctx, TX.xUp, P.X.u0, L, P.X.x, P.X.y, P.X.a, P.F.alpha) : null);
  });
  K.figures(ctx, cm, fc => figures(fc, t, pils));   // bridges, the others, my pieces, me — chalked as one layer
  // the glows on top (unchalked): my cross's halo, the pieces' halos, the guide
  const M = LASTM;
  if (M && M.X) K.beamHalo(ctx, M.X, M.X.u0, L, 1);
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), hl = PIECE_HL(c, t), cu = (c.u0 + c.u1) / 2, cx = p.x + Math.cos(p.a) * cu, cy = p.y + Math.sin(p.a) * cu;
    K.halo(ctx, cx, cy, 60, .22); if (hl > 0) K.soft(ctx, cx, cy, 160, .5 * hl * (.92 + .08 * Math.sin((t - B.back) * 2.2 + c.k))); }   // they never move; each glows softly where it lies
  const FX2 = fallX(t); if (FX2 && t < SPLASH) { const c0 = cpt(FX2, (FX2.u0 + L) / 2), d = clamp((t - B.fall) / (SPLASH - B.fall)); K.halo(ctx, c0[0], c0[1], 120 * (1 - .5 * d), .7 * (1 - .6 * d)); }
  if (t >= 18.75 && t < 19.75) guide(ctx, t, eio((t - 18.75) / .35), 1 - ss(19.4, 19.75, t));
  guideEnd(ctx, t);
  K.flecks(ctx, t, FLECKS);
  K.dust(ctx, t, B.fall, E + 10, FY + 30);   // the hit: chalk dust off the lip
  K.splash(ctx, t, SPLASH, E + G * .5);      // then the splash far below
}

// ---------------- frame ----------------
function draw(ctx, t) {
  const cm = camAt(t), lk = K.hitLight(t, B.fall);   // the hit: the light dips, then comes back
  K.backdrop(ctx, t, cm);
  K.layer(ctx, cm, 1, () => world(ctx, t, cm, lk));
  K.fore(ctx, t, cm);
  K.post(ctx, cm, lk);
  K.endPlate(ctx, t, B.end);
  K.captions(ctx, t, S.lines, B.end);
  K.endCard(ctx, t, S.endCard, B.end);
}

async function init() {
  K.init(); buildTimeline();
  GX = E + G + 320;
  K.buildWorld({ x0: -1600, x1: E + G + 1700, gap: { x: E, w: G }, gate: { x: GX },
    clearOK: x => !(CUTS.some(c => x > c.mx - 330 && x < c.mx + 320) || Math.abs(x - E + 60) < 200) });   // not where I kneel to saw, not at the lip
  // where my falling cross reaches the water: the splash
  for (let t = B.fall; t < B.fall + 2; t += 1 / 120) { const X = fallX(t), c0 = cpt(X, (X.u0 + L) / 2); if (c0[1] > WATER) { SPLASH = t; break; } }
  TX.gUp = crossSprite(true, false); TX.gLie = crossSprite(true, true); TX.xUp = crossSprite(false, false); TX.xLie = crossSprite(false, true);
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: K.FONTS, init, draw });
</script>
