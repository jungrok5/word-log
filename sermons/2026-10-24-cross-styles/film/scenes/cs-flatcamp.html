// ---------------- pixel primitives (whole-pixel rects only) ----------------
const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

// ---------------- timeline: my path (integrated once), the cuts ----------------

const FILL = [[22.2, 23.3], [22.65, 23.7], [23.1, 24.1]];
const FLECKS = [];
let SAWLIE = null, E = 1600, GX = 0;
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }

// ---------------- poses ----------------

  for (const o of LAYS.mid.items) { const x = o.x - mox; if (x < -40 || x > bw + 40) continue;
    if (o.k === 'cap') { R(c, x + (o.w >> 1) - 1, gy - o.h * .45, 3, o.h * .45 + 1, P.stem); capsule(c, x, gy - o.h - 4, o.w, o.h, P[o.col], P[o.col + 's']); }
    else if (o.k === 'pine') pine(c, x + (o.w >> 1), gy - o.h, o.h + 1, o.w, P.pine, P.pineS);
    else if (o.k === 'bush') capsule(c, x, gy - o.h + 1, o.w, o.h, P.bush, P.bushS);
    else if (o.k === 'mush') { R(c, x, gy - 3, 1, 3, '#d8ccb4'); R(c, x - 2, gy - 4, 5, 1, P.mush); R(c, x - 1, gy - 5, 3, 1, P.mush); } }
}
function haze(c, t) {   // mist bars and the lab's ghosts, drifting in whole-pixel steps (not palette-swapped)
  const bw = c.canvas.width, q = step8(t), hx = Math.round((V.OX + 540 / V.K) * .55 - 540 / V.K);
  for (const m of HAZE) { const x = Math.round(((m.x + q * 3 - hx) % 400 + 400) % 400) - 60; if (x > bw) continue;
    c.globalAlpha = m.a; pxRR(c, x, Math.round(m.y - V.OY), m.w, 4, 2, '#5a72c8'); c.globalAlpha = 1; }
  const gx = Math.round((V.OX + 540 / V.K) * .3 - 540 / V.K);
  for (const g of SPOOK) { const x = Math.round(((g.x + Math.sin(q * .55 + g.ph) * 6 + g.dir * q * 1.5 - gx) % 400 + 400) % 400) - 60, y = Math.round(g.y + Math.sin(q * 1.3 + g.ph * 2) * 4 - V.OY);
    if (x > bw || y < -20) continue; c.globalAlpha = g.big ? .26 : .2; c.drawImage(SPR.ghost[Math.floor(q * 4 + g.ph * 3) % 2], x, y); c.globalAlpha = 1; }
}

// ---------------- road, chasm, gate ----------------
function road(c, P, st) {
  const bw = c.canvas.width, bh = c.canvas.height, top = GYP - V.OY, ea = Math.round(E / U) - V.OX, eb = Math.round((E + G) / U) - V.OX;
  if (eb > -10 && ea < bw + 10) {
    R(c, ea, top, eb - ea, bh - top, P.deep);
    const FXs = st.FXs; if (FXs && FXs.clip) crossPx(c, WOOD, FXs.u0, L, FXs.x, FXs.y, FXs.a, true);   // falling between the walls
    const r = rng(71), half = (eb - ea) >> 1;
    for (let j = 0; top + j < bh; j += 3) { const i2 = Math.min(half, 4 + Math.floor(j * .55) + (r() * 3 | 0)), i1 = Math.min(half - 1, 1 + Math.floor(j * .25) + (r() * 2 | 0));
      const i2b = Math.min(half, 4 + Math.floor(j * .55) + (r() * 3 | 0)), i1b = Math.min(half - 1, 1 + Math.floor(j * .25) + (r() * 2 | 0));
      R(c, ea, top + j, i2, 3, P.chasm2); R(c, ea, top + j, i1, 3, P.chasm); R(c, eb - i2b, top + j, i2b, 3, P.chasm2); R(c, eb - i1b, top + j, i1b, 3, P.chasm); }
  }
  for (const [a, b] of [[-2, ea], [eb, bw + 2]]) { if (b <= a) continue;
    R(c, a, top, b - a, bh - top, P.ground); R(c, a, top, b - a, 1, P.gTop); R(c, a, top + 17, b - a, bh, P.groundD);
    for (let x = a; x < b; x++) { const gx = x + V.OX; if (((gx * 7) % 9 + 9) % 9 === 0) { const h = ((gx * 5) % 3 + 3) % 3 + 1; R(c, x, top - h, 1, h, P.gTop); } } }
}
const GATE = () => { const gx = GX / U - V.OX, gy = (BY + 4) / U - V.OY; return { gx: Math.round(gx), gy: Math.round(gy), ay: Math.round(gy - 36) }; };
function arcPts(cx, cy, r, a0, a1, n = 14) { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return o; }
function gateDoor(c, P, t) {   // the doorway burns like the lab's campfire: banded flame colours, flickering on 12s
  const { gx, gy, ay } = GATE(), q = step12(t), r = rng(1 + Math.floor(q * 12) % 6);
  pxPoly(c, [[gx - 12, gy], ...arcPts(gx, ay, 12, Math.PI, TAU), [gx + 12, gy]], P.door);
  pxPoly(c, [[gx - 9, gy], ...arcPts(gx, ay + 3, 9, Math.PI, TAU), [gx + 9, gy]], '#f8b830');
  const hw = 4 + (r() * 2 | 0); pxPoly(c, [[gx - hw, gy], ...arcPts(gx, ay + 8, hw, Math.PI, TAU, 8), [gx + hw, gy]], '#fff0a0');
  R(c, gx - 18, gy, 37, 2, P.door);   // light on the ground at the threshold
}
function gateArch(c, P) {
  const { gx, gy, ay } = GATE();
  pxPoly(c, [[gx - 18, gy], ...arcPts(gx, ay, 18, Math.PI, TAU), [gx + 18, gy], [gx + 12, gy], ...arcPts(gx, ay, 12, TAU, Math.PI), [gx - 12, gy]], P.gate);
  pxPoly(c, [[gx + 13, gy], [gx + 13, ay], [gx + 18, ay], [gx + 18, gy]], P.gateS);
  R(c, gx - 20, gy - 3, 9, 3, P.gate); R(c, gx + 12, gy - 3, 9, 3, P.gateS);
  R(c, gx - 1, ay - 21, 3, 3, P.gateS);   // keystone
  capsule(c, gx - 46, gy - 14, 22, 15, P.bush, P.bushS); capsule(c, gx + 26, gy - 16, 26, 17, P.bush, P.bushS); capsule(c, gx + 52, gy - 11, 18, 12, P.canB, P.canBs);
}
function embers(c, t, x0, y0, n, seed, spread = 10) {   // rising embers in whole-pixel steps (the lab's)
  for (let i = 0; i < n; i++) { const er = rng(seed + i), per = .9 + er() * .9, ph = er() * per, age = ((t + ph) % per + per) % per;
    const ex = x0 + Math.round((er() - .5) * spread + Math.sin(age * 5 + i) * 2), ey = y0 - Math.round(age * 40);
    R(c, ex, ey, 1, 2 + (er() * 2 | 0), age / per > .7 ? '#c86020' : '#f0a030'); }
}

// ---------------- the world (drawn twice: night palette and lit palette; the lit one shows through pixel circles) ----------------
function world(c, P, pk, t, st) {
  background(c, P);
  road(c, P, st);
  const tq = step8(t), pal = PI[pk], xw = PXW[pk];
  const { gx } = GATE(); const gateVis = gx > -40 && gx < c.canvas.width + 40;
  const drawPil = Pp => { const X = Pp.X, dc = X ? () => crossPx(c, xw, X.u0, L, X.x, X.y, X.a, X.lie) : null; figPx(c, Pp.F, pal, X && X.lie ? dc : null, null, X && !X.lie ? dc : null); };
  if (gateVis) { gateDoor(c, P, t); for (const Pp of st.pils) if (Pp.F.inGate) drawPil(Pp); gateArch(c, P); }
  for (const Pp of st.pils) if (Pp.B) crossPx(c, xw, 0, L, Pp.B.x, Pp.B.y, Pp.B.a, true);
  st.pils.slice().sort((a, b) => a.F.hip[0] - b.F.hip[0]).forEach(Pp => { if (!Pp.F.inGate) drawPil(Pp); });
  const c3 = CUTS[2];
  if (t >= c3.drop) { const kk = eio((step12(t) - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip;
    sawPx(c, [lerp(g0[0], SAWLIE.grip[0], kk), lerp(g0[1], SAWLIE.grip[1], kk)], lerp(CUT_ANG, SAWLIE.ang, kk), SAW[pk]); }
  for (const p of st.pieces) crossPx(c, p.glow > .5 ? EMBER : WOOD, p.c.u0, p.c.u1, p.x, p.y, p.a, true);
  const M = st.M, F = M.F, myCross = X => { if (X) crossPx(c, WOOD, X.u0, L, X.x, X.y, X.a, X.lie); };
  figPx(c, F, ME[pk], () => {
    if (M.X && M.X.lie) myCross(M.X);
    if (M.kerf) { const a = B2([M.c.cutX, M.c.y - PW / 2]); R(c, a[0], a[1], 1, Math.max(1, M.kerf.kp * PW * .92 / U), P.deep); }
    if (M.saw) sawPx(c, M.saw.grip, M.saw.ang, SAW[pk]);
  }, null, M.X && !M.X.lie ? () => myCross(M.X) : null);
  const FXs = st.FXs; if (FXs && !FXs.clip) crossPx(c, WOOD, FXs.u0, L, FXs.x, FXs.y, FXs.a, true);
  // sawdust: orange chips on 12s
  const tq12 = step12(t);
  for (const q of FLECKS) { const u = tq12 - q.t0; if (u < 0 || u > 1.3) continue;
    const tl = (-q.vy + Math.sqrt(q.vy * q.vy + 4 * 700 * (q.land - q.y))) / 1400, uu = Math.min(u, Math.max(0, tl)), p = B2([q.x + q.vx * uu, q.y + q.vy * uu + 700 * uu * uu]);
    R(c, p[0], p[1], 1, 1, q.col); }
}
function crossOutline(x, y) {
  const hb = CBHL; return [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],
    [CBX + CBW / 2, PW / 2], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, PW / 2], [0, PW / 2]].map(([a, b]) => [x + a, y + b]);
}
function guidePx(c, t, k) {   // the dashed outline of my whole cross across the chasm, in marching pixel dashes
  const ol = crossOutline(E - REST, FY + 34).map(B2), xmax = B2([E - REST + L * k, 0])[0], off = Math.floor(step8(t) * 8);
  c.fillStyle = '#f4f0dc'; let s = 0;
  for (let i = 0; i < ol.length; i++) { const a = ol[i], b = ol[(i + 1) % ol.length], n = Math.max(1, Math.round(Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]))));
    for (let j = 0; j < n; j++, s++) { const x = Math.round(lerp(a[0], b[0], j / n)), y = Math.round(lerp(a[1], b[1], j / n)); if (x > xmax) continue; if (((s + off) >> 1) % 2 === 0) c.fillRect(x, y, 1, 1); } }
}

// ---------------- the camera: shots ----------------
function shotAt(t) {
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => (cc.mx + cc.cutX) / 2 - 10;
  if (t < 2.4) return { K: 13, x: meX(t) + 30, y: 1000 };                     // the hook: close on me, the saw in my hand
  if (t < 3.15) return { K: 8, x: meX(t) + 60, y: 900 };                     // the procession
  if (t < 4.55) return { K: 10, x: at(c1), y: 1020 };                         // the first cut
  if (t < 8.95) return { K: 8, x: meX(t) + 60, y: 900 };                     // lighter: I run, the others fall behind
  if (t < 11.4) return { K: 10, x: lerp(at(c2), at(c3), eio((t - 10) / .45)), y: 1020 };   // twice more
  if (t < 12.05) return { K: 8, x: Math.min(meX(t) + 60, E - 540 - 10), y: 900 };
  if (t < 18.2) return { K: 6, x: E + 300, y: 915 };                          // the road ends; the others cross, one at a time
  if (t < B.fall) return { K: 9, x: E + 160, y: 1110 };                       // mine: short
  if (t < B.fall + .7) return { K: 11, x: E + 160, y: 1200, shake: 1 - ss(B.fall, B.fall + .55, t) };   // the hit
  if (t < B.back) return { K: 8, x: E + 150, y: 1060 };
  return { K: 10, x: lerp(E - 360, E + 210, eio((t - 22.75) / 1.1)), y: 1010 };   // I look back; the pieces fly to the gap
}
function lightsAt(t) {   // in design units
  const q = step8(t), D = [];
  if (q >= B.gap) D.push({ x: GX - 40, y: BY - 150, r: 470 * backEase(clamp((q - B.gap - .1) / .5)) });
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, step12(t)), sw = ss(B.back + .2 + (2 - c.k) * .15, B.back + .6 + (2 - c.k) * .15, q), land = ss(FILL[c.k][1], FILL[c.k][1] + .4, q);
    const r = 150 * sw * (1 - .45 * land); if (r > 8) D.push({ x: p.cx, y: p.cy, r }); }
  if (q >= 24.1) D.push({ x: E - REST + L / 2, y: FY + 20, r: 340 * backEase(clamp((q - 24.1) / .6)) });

}

// ---------------- frame (the lab's dark blobby window) ----------------
const LW = 180, LH = 320;
function framePlate() {
  const c = Pilot.canvas(LW, LH), x = c.getContext('2d');
  R(x, 0, 0, LW, LH, FRAME);
  x.globalCompositeOperation = 'destination-out'; pxRR(x, 10, 24, LW - 20, 270, 12, '#000'); x.globalCompositeOperation = 'source-over';
  const blobs = [[10, 58, 8], [6, 80, 6], [12, 126, 9], [8, 152, 5], [10, 200, 8], [5, 226, 7], [12, 278, 10],
    [170, 50, 7], [175, 92, 10], [168, 134, 6], [174, 178, 9], [170, 224, 6], [172, 276, 10],
    [34, 24, 8], [52, 20, 6], [98, 26, 10], [124, 22, 7], [148, 28, 8]];
  for (const [bx_, by_, br] of blobs) pxCircle(x, bx_, by_, br, FRAME);
  pxLine(x, 10, 50, 33, 54, 4, FRAME); pxLine(x, 33, 54, 38, 64, 3, FRAME); pxCircle(x, 39, 66, 3, FRAME);
  pxLine(x, 170, 116, 155, 121, 4, FRAME); pxLine(x, 155, 121, 152, 113, 3, FRAME); pxLine(x, 155, 121, 158, 131, 2, FRAME);
  pxRR(x, 158, 150, 14, 16, 5, FRAME); R(x, 159, 148, 2, 3, FRAME); R(x, 169, 148, 2, 3, FRAME);   // an owl in the frame
  R(x, 0, 290, LW, LH - 290, FRAME); R(x, 0, 290, LW, 1, FRAME2);
  return c;
}
function frameEyes(c, t) {
  for (const [ex, ey, col, ph] of [[14, 274, '#f0c040', 0], [163, 156, '#f0c040', 2.3], [165, 76, '#ffffff', .6]]) {
    if (((t + ph) % 2.3) < .125) { R(c, ex, ey + 1, 2, 1, col); R(c, ex + 4, ey + 1, 2, 1, col); continue; }
    R(c, ex, ey, 2, 2, col); R(c, ex + 4, ey, 2, 2, col); }
}

// ---------------- frame ----------------
const BUF = {};
function bufs(K) { if (!BUF[K]) { const w = Math.ceil(W / K), h = Math.ceil(H / K), mk = () => { const cv = Pilot.canvas(w, h); return cv.getContext('2d'); };
    BUF[K] = { n: mk(), l: mk(), m: mk(), tmp: mk() }; } return BUF[K]; }
let FR, FX, FRC, CAP, CX;
function draw(ctx, t) {
  const sh = shotAt(t), K = sh.K, bb = bufs(K), q8 = step8(t);
  const shx = sh.shake ? Math.round(Math.sin(q8 * 97) * 2 * sh.shake) : 0, shy = sh.shake ? Math.round(Math.sin(q8 * 131 + 1) * 2 * sh.shake) : 0;
  V = { K, OX: Math.round(sh.x / U - 540 / K) + shx, OY: Math.round(sh.y / U - 960 / K) + shy };
  const M = poseMe(q8), FXs = fallX(step12(t));
  const pils = [0, 1, 2, 3].map(i => pilState(i, q8)).filter(p => p && p.F);
  const pieces = CUTS.filter(c => t >= c.drop).map(c => { const p = pieceAt(c, step12(t)); return { ...p, c, glow: ss(B.back + .2 + (2 - c.k) * .15, B.back + .6 + (2 - c.k) * .15, q8) }; });
  const st = { M, FXs, pils, pieces };
  const flash = t >= B.fall && t < B.fall + .1;
  world(bb.n, N, 'N', t, st);
  const D = lightsAt(t);
  if (D.length || flash) {
    world(bb.l, LP, 'L', t, st);
    const m = bb.m, mw = m.canvas.width, mh = m.canvas.height; m.clearRect(0, 0, mw, mh);
    if (flash) R(m, 0, 0, mw, mh, '#fff');
    for (const d of D) { const cx = Math.round(d.x / U - V.OX), cy = Math.round(d.y / U - V.OY), r = Math.round(d.r / U); if (r < 1) continue;
      pxCircle(m, cx, cy, r, '#fff'); m.fillStyle = '#fff';
      for (let dy = -r - 8; dy <= r + 8; dy++) { const yy = cy + dy; if (yy < 0 || yy >= mh) continue;
        for (let dx = -r - 8; dx <= r + 8; dx++) { const xx = cx + dx; if (xx < 0 || xx >= mw) continue; const dd = Math.hypot(dx, dy); if (dd <= r || dd > r + 8) continue;
          if (dd < r + 4 ? ((dx + dy) & 1) === 0 : ((dx & 1) === 0 && (dy & 1) === 0)) m.fillRect(xx, yy, 1, 1); } } }
    const tp = bb.tmp; tp.globalCompositeOperation = 'source-over'; tp.clearRect(0, 0, mw, mh); tp.drawImage(bb.l.canvas, 0, 0);
    tp.globalCompositeOperation = 'destination-in'; tp.drawImage(m.canvas, 0, 0); tp.globalCompositeOperation = 'source-over';
    bb.n.drawImage(tp.canvas, 0, 0);
  }
  // embers: from the burning doorway, and from the pieces once they catch

  for (const p of pieces) if (p.glow > .5) { const b = B2([p.cx, p.cy]); embers(bb.n, t, Math.round(b[0]), Math.round(b[1]) - 3, 4, 60 + p.c.k * 7, 8); }
  if (t >= 18.75 && t < 19.75) guidePx(bb.n, t, eio((t - 18.75) / .35));
  if (t >= B.fill[0] - .2) guidePx(bb.n, t, eio((t - B.fill[0] + .2) / .45));
  haze(bb.n, t);
  ctx.imageSmoothingEnabled = false; ctx.drawImage(bb.n.canvas, 0, 0, bb.n.canvas.width * K, bb.n.canvas.height * K);
  // the lab's frame on its own 6× grid; at the end it closes in, whole pixels at a time, to a plain plate for the card
  FX.clearRect(0, 0, LW, LH); FX.drawImage(FR, 0, 0); frameEyes(FX, t);
  const ke = ss(B.end - .25, B.end + .3, step8(t)); if (ke > 0) { const n = Math.round(ke * 92); R(FX, 0, 0, LW, n + 24, FRAME); R(FX, 0, LH - n - 30, LW, n + 30, FRAME); R(FX, 0, 0, Math.round(ke * 90) + 10, LH, FRAME); R(FX, LW - Math.round(ke * 90) - 10, 0, Math.round(ke * 90) + 10, LH, FRAME); }
  ctx.drawImage(FRC, 0, 0, W, H);
  // captions on a half-resolution grid (chunky, still readable), blown up 2× — as in the lab
  if (t < B.end) { CX.setTransform(1, 0, 0, 1, 0, 0); CX.clearRect(0, 0, W / 2, H / 2); CX.setTransform(.5, 0, 0, .5, 0, 0);
    CX.save(); CX.translate(6, 6); Story.captions(CX, t, S.lines, { font: FONT, weight: 400, size: 70, color: '#151a3c', srcColor: '#151a3c', y: 410, shadow: 'rgba(0,0,0,0)', shadowBlur: 1 }); CX.restore();
    Story.captions(CX, t, S.lines, { font: FONT, weight: 400, size: 70, color: '#f4f0dc', srcColor: '#c8d0f0', y: 410, shadow: 'rgba(0,0,0,0)', shadowBlur: 1 });
    ctx.drawImage(CAP, 0, 0, W, H); }
  Story.endCard(ctx, t, S.endCard, B.end, { font: FONT, color: '#f4f0dc', srcColor: '#aab4e0', y: 860, titleShadow: 'rgba(0,0,0,0)' });
}

async function init() {
  buildTimeline(); buildLayers();
  SPR.ghost = GHOST.map(g => sprite(g, { g: '#c8d4ff', e: '#1a2050' }));
  FR = framePlate(); FRC = Pilot.canvas(LW, LH); FX = FRC.getContext('2d');
  CAP = Pilot.canvas(W / 2, H / 2); CX = CAP.getContext('2d'); CX.imageSmoothingEnabled = false;
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 70px 'Do Hyeon'"], init, draw });
