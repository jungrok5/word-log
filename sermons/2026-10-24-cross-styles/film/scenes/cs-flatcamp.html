<script>
/* 잘라 낸 건 다리였다 — 05 flat geometric pixel diorama (from lab-flatcamp).
   The world is painted on a coarse pixel grid with whole-pixel rects and scanline polygons only (no anti-aliasing), blown
   up nearest-neighbour at an integer scale per shot (13× close-up … 6× wide — the camera CUTS between pixel scales and pans in
   whole pixels, like a pixel game). The dark blobby frame of the lab is always there: we watch the forest through it.
   Characters (the lab's little hooded wanderers) are posed on twos (8 drawings a second); falling and flying things on 12s.
   The blue night is the whole palette — the warm accent is MY CROSS (campfire-orange wood); the others' crosses are cold
   blue-grey wood. The style's light is the lab's campfire grammar: a palette swap inside a pixel circle with a dithered rim
   (the forest near the light turns green/lilac). The gate across the chasm burns like a campfire; when I look back, the pieces
   I cut catch like embers — each with its own pixel circle of light — and fly into the dashed outline over the gap.
   The style (pixel primitives, the shot/view and buffers, palettes, forest backdrop, ground/chasm, burning gate, embers,
   the palette-swap light, the window frame, the wanderer rig, captions) lives in kit-flatcamp.js (styles/flatcamp/);
   this file keeps only the story: timeline, cuts, saw, poses, the others, shots, light pools, order of drawing. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const FC = Flatcamp, TAU = Math.PI * 2, U = FC.U;
const N = FC.NIGHT, LP = FC.LIT, ME = FC.FIG.me, PI = FC.FIG.other, WOOD = FC.WOOD, EMBER = FC.EMBER, PXW = FC.WOOD_COLD;   // my cross = the warm accent; the others' = cold wood
const SAW = { N: { bl: '#9aa4d0', bl2: '#6e78a8', h: '#2a2440', h2: '#1a1630' }, L: { bl: '#c8d0e8', bl2: '#98a0c0', h: '#3a3050', h2: '#241e38' } };
const RED = WOOD.a;   // (sawdust colour, used by the shared timeline)

const GEO = FC.crossGeo({ L: 520, PW: 40, CBX: 442, CBW: 36, CBH: 86, CBHL: 40 }), { L, PW, CBX } = GEO;   // cross: post length, width; crossbar (from foot)
const FY = 1300, BY = 1252, RT = 1212;
const REST = 26, G = L - 2 * REST;
const { step8, step12, backEase, B2, R, pxPoly } = FC;
const { frame, shoulderOf, hangHands, cpt, mixX, rotAbout, hangGrip } = FC;
const walkSpec = FC.walk, standSpec = FC.stand, mixSpec = FC.mix, rIdx = FC.handR, lIdx = FC.handL;

const crossPx = (c, K, u0, u1, x, y, a, lying) => FC.cross(c, K, GEO, u0, u1, x, y, a, lying), figPx = FC.figure;
const GYP = Math.round(RT / U);
let FOREST;

// ---------------- timeline: my path (integrated once), the cuts ----------------
const SME = 1.04, SPI = .95;
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 44 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1));        // staggering
  if (t < 4.6) return 0;
  if (t < 5.0) return 390 * eio((t - 4.6) / .4);                            // lighter: big quick strides
  if (t < 8.3) return 390;
  if (t < 8.6) return lerp(390, 150, (t - 8.3) / .3);
  if (t < 9.0) return 150 * (1 - ss(8.6, 9.0, t));
  if (t < 10.0) return 0;
  if (t < 10.4) return 450 * Math.sin(Math.PI * (t - 10) / .4);

}
const strideMe = t => t < 4.6 ? 112 : t < 8.8 ? 262 : 170;
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };
const meX = t => tab(MEX, t), meP = t => tab(MEP, t);
const CUTS = [{ s: 3.2, d: .3, saw0: 3.5, drop: 4.0, up1: 4.4 }, { s: 9.0, d: .28, saw0: 9.28, drop: 9.75, up1: 10.0 }, { s: 10.4, d: .25, saw0: 10.65, drop: 11.12, up1: 11.35 }];
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const FILL = [[22.2, 23.3], [22.65, 23.7], [23.1, 24.1]];
const FLECKS = [];
let SAWLIE = null, E = 1600, GX = 0;
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }
  E = meX(12) + 52; GX = E + G + 300;
  CUTS.forEach((c, k) => {
    c.k = k; c.mx = meX(c.s); c.cutX = c.mx - 142 * SME; c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.baseX = c.cutX - c.u1; c.y = FY + 26;
    const r = rng(100 + k);
    for (let n = 0; n < 16; n++) FLECKS.push({ t0: n < 11 ? lerp(c.saw0, c.drop, n / 11) : c.drop + r() * .05, x: c.cutX + (r() - .5) * 8, y: c.y - PW / 2,
      vx: (r() - .5) * (n < 11 ? 180 : 320), vy: -(80 + r() * (n < 11 ? 160 : 260)), land: FY + 18 + r() * 44, r0: r() * TAU, vr: (r() - .5) * 20, sz: 4 + r() * 5, col: RED });
  });

}
function pieceAt(c, t) {
  const sh = 18 * eo((t - c.drop) / .25), y0 = c.y, cu = (c.u0 + c.u1) / 2;
  let cx = c.baseX + cu - sh, cy = y0, a = -.05 * eo((t - c.drop) / .25);
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, cx, cy };
}

// ---------------- the saw ----------------
const CUT_ANG = Math.PI - .6, hangAng = f => Math.atan2(.95, .3 * f);
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];

  const osc = saw ? 26 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, g0 = sawGeo([0, 0], CUT_ANG), d = g0.d, up = g0.up;

}

  const f = -1, mx = c.mx, s = SME, st = sawState(c, t);

    hand: ['fist', 'flat'], tilt: .35, eye: 'calm', sway: 0, farFront: true };
}

function poseMe(t) {

  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const F = walkSpec(x, FY, SME, 1, ph, 112, .3 + .1 * Math.sin(tt * TAU / 1.15), 16); F.eye = 'strain'; F.tilt = .14; F.hip[1] += 6 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, -.6 + .07 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt); const F = walkSpec(x, FY, SME, 1, ph, lerp(112, 262, k), lerp(.16, .32, k), lerp(20, 58, k)); F.hip[1] += 8 * k; F.sway *= 1 + 1.5 * k; return [F, -.62]; }
    const F = walkSpec(x, FY, SME, 1, ph, 170, .16, 34); return [F, -.6];

  const holdUp = (F, lf) => { const u0 = L * (1 - lf), X = { x: F.hip[0] + 96 * F.s, y: FY - 2 + u0, a: -Math.PI / 2, u0, lie: false, held: true };
    F.hands = [hangHands(F)[0], cpt(X, CBX - 40, 4)]; F.hand = ['fist', 'fist']; F.farOver = false; return [F, X]; };
  const carried = (F, a0, lf, held) => { const X = carryCross(F, lf, lf < 1 ? -.4 : a0); gripCarry(F, X);   // lighter: carried flatter (a tilted short cross must never read as an X)
    if (held) { F.hands[1] = hangGrip(F, F.ph != null ? 18 * Math.sin(TAU * F.ph) : 0); }
    return [F, X]; };
  for (const c of CUTS) {
    if (t >= c.s && t < c.up1) {
      const lf0 = S.left[c.k], lf1 = S.left[c.k + 1], [W0, a0] = walk(c.s, c.mx), [W1, a1] = walk(c.up1, c.mx), last = c.k === 2;
      const [WA, XA] = carried(W0, a0, lf0, true), [WB, XB] = last ? holdUp(W1, lf1) : carried(W1, a1, lf1, true);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      if (t < c.s + c.d) { const k = eio((tp - c.s) / c.d), F = mixSpec(WA, SP, k);
        F.hands[rIdx(F)] = [lerp(WA.hands[1][0], cg[0], k), lerp(WA.hands[1][1], cg[1], k)];
        const Xm = { ...mixX(XA, XL, k), lie: k > .8 }, onX = cpt(Xm, CBX, 58 * (1 - k)), k2 = ss(.55, 1, k);   // the hand rides the crossbar down, then slides to the beam
        F.hands[lIdx(F)] = [lerp(onX[0], SP.hands[1][0], k2), lerp(onX[1], SP.hands[1][1], k2)];
        F.hand = F.f > 0 ? ['fist', 'fist'] : ['fist', 'flat'];
        return { F, X: Xm, c, saw: { grip: F.hands[rIdx(F)], ang: lerp(hangAng(1), CUT_ANG, k) } }; }

      const k = eio((tp - c.drop) / (c.up1 - c.drop)), F = mixSpec(SP, WB, k);
      const rT = WB.hands[1], lT = WB.hands[0];
      const Xm = { ...mixX(XL, XB, k), lie: k < .2 }, k1 = ss(0, .4, k), onX = last ? cpt(Xm, CBX - 40, 4) : cpt(Xm, CBX, 58 * k);   // one hand: the saw (to my hip); the other: the cross
      F.hands[rIdx(F)] = last ? [lerp(SP.hands[1][0], onX[0], k1), lerp(SP.hands[1][1], onX[1], k1)] : [lerp(cg[0], rT[0], k), lerp(cg[1], rT[1], k)];
      F.hands[lIdx(F)] = last ? hangHands(F)[lIdx(F)] : [lerp(SP.hands[1][0], onX[0], k1), lerp(SP.hands[1][1], onX[1], k1)];
      F.hand = ['fist', 'fist'];

    }
  }
  if (t < 12) { const [F, a] = walk(tp); const [G2, X] = sawHeld ? carried(F, a, left, true) : holdUp(F, left); return { F: G2, X, saw: sawHeld ? { grip: G2.hands[1], ang: hangAng(1) } : null }; }
  if (t < 18.4) { const [F0] = walk(12, E - 52), k = eio((tp - 12) / .3);
    const bx = -150 * eio((tp - 12.9) / .7) + 52 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.85, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.65, 17.55, .12, .12));
    const STx = mv > 0 ? mixSpec(standSpec(E - 52 + bx, FY, SME, 1, .08), walkSpec(E - 52 + bx, FY, SME, 1, (E + bx) / 150, 150, .1, 24), mv) : standSpec(E - 52 + bx, FY, SME, 1, .08);
    const F = mixSpec(F0, STx, k);
    F.ang += .16 * Math.sin(Math.PI * clamp((tp - 12) / .5)) * (tp < 12.5 ? -1 : 0); F.eye = tp < 13.2 ? 'shock' : 'calm';
    const [G2, X] = holdUp(F, left); return { F: G2, X }; }
  const u0L = L * (1 - left), XLay = { x: E - REST - u0L, y: FY + 34, a: 0, u0: u0L, lie: true };
  const LAY = { ...standSpec(E - 66, FY, SME, 1), hip: [E - 70, FY - 58 * SME], ang: 1.0, feet: [[E - 110, FY], [E - 26, FY]], tilt: .25 };   // kneeling at the lip, leaning over
  const onBeam = X => [cpt(X, X.u0 + 40, -PW / 2 - 4), cpt(X, X.u0 + 100, -PW / 2 - 4)];
  LAY.hands = onBeam(XLay); LAY.hand = ['flat', 'flat'];
  const REACH = { ...LAY, hip: [E - 72, FY - 112 * SME], ang: .5, hands: [[E - 170, FY - 100], [E + 70, FY - 10]], hand: ['fist', 'open'], eye: 'shock', tilt: .4 };
  if (t < 19.45) {
    if (t < 18.95) {   // tip it forward about its foot (hand sliding down the shaft), then slide it out onto the lip
      const ST = standSpec(E - 150, FY, SME, 1, .08), STc = holdUp(ST, left), k = eio((tp - 18.4) / .4), k1 = eio(clamp((tp - 18.4) / .38)), k2 = eio(clamp((tp - 18.7) / .25));
      const pv = [lerp(STc[1].x, E - REST, k2), lerp(FY - 2, FY + 34, k2)], a = lerp(-Math.PI / 2, 0, k1);
      const X = { x: pv[0] - Math.cos(a) * u0L, y: pv[1] - Math.sin(a) * u0L, a, u0: u0L, lie: k1 > .6 };
      const F = mixSpec(STc[0], LAY, k), hb = onBeam(X), hs = cpt(X, lerp(CBX - 40, u0L + 100, k1), lerp(4, -PW / 2 - 4, k1));
      F.hands = [k > .5 ? hb[0] : [lerp(STc[0].hands[0][0], hb[0][0], k * 2), lerp(STc[0].hands[0][1], hb[0][1], k * 2)], hs]; F.hand = k1 > .6 ? ['flat', 'flat'] : ['fist', 'fist'];

    const FXt = fallX(t), F = { ...LAY, hands: onBeam(FXt), eye: 'shock' };   // it starts to tip: my hands go with it…
    return { F, X: null, lay: true }; }

  const BACK = { ...standSpec(E - 52, FY, SME, -1, .04), tilt: -.05, eye: 'calm' }, FWD = { ...standSpec(E - 52, FY, SME, 1, .1), tilt: .3, eye: 'calm' };
  const UP = { ...standSpec(E - 52, FY, SME, 1, .06), tilt: .1, eye: 'calm' };
  if (t < B.back + .25) return { F: mixSpec(REACH, UP, eio((tp - B.back) / .25)), X: null };   // rise…
  if (t < 22.45) return { F: mixSpec(UP, BACK, eio((tp - B.back - .25) / .18)), X: null };     // …then turn

function fallX(t) {

}

// ---------------- the others ----------------
const PIL = [{ x0: -470, ph: .3 }, { x0: -230, ph: .75 }, { x0: 190, ph: .1 }, { x0: 430, ph: .55 }];
const BRIDGE_Y = [BY - 6, BY + 4, BY + 14], PULL = 210;
function pilState(i, t) {
  const tp = t, P = PIL[i], j = 3 - i, T = j < 3 ? B.bridges[j] : 99, yb = BRIDGE_Y[j] ?? BY;
  const xAt = tt => { if (tt <= 9 || j > 2) return P.x0 + 52 * tt; const xa = P.x0 + 468, xb = E - 430 - 120 * j, xc = E - 46;
    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, eio(clamp((tt - (T - 1.3)) / .95))); };
  const carry = (tt, x, gy = BY, stride = 118, lean = .27) => { const F = walkSpec(x, gy, SPI, 1, P.ph + x / (stride * SPI), stride, lean, 18); F.tilt = .1; F.eye = 'closed'; const X = carryCross(F, 1, -.5); gripCarry(F, X); return [F, X]; };
  if (j > 2) { if (t >= 12) return null; const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  if (t < T - .35) { const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  const XB = { x: E - REST, y: yb, a: 0, u0: 0, lie: true };
  const LAY = { ...standSpec(E - 46, BY, SPI, 1), hip: [E - 56, BY - 70 * SPI], ang: .95, feet: [[E - 96, BY], [E - 22, BY]], tilt: .2 };
  const shaft = X => [cpt(X, 95, -PW / 2 - 3), cpt(X, 30, -PW / 2 - 3)];
  LAY.hands = shaft(XB); LAY.hand = ['fist', 'fist'];
  if (t < T) { const [F0, X0] = carry(T - .35, E - 46), k = eio((tp - T + .35) / .35), X = mixX(X0, XB, k), F = mixSpec(F0, LAY, k), on = shaft(X), kh = ss(0, .35, k);
    F.hands = [0, 1].map(i => [lerp(F0.hands[i][0], on[i][0], kh), lerp(F0.hands[i][1], on[i][1], kh)]); F.hand = ['fist', 'fist']; return { F, X }; }

  if (t < T + .3) { const F = mixSpec(LAY, standSpec(xs0, yb - PW / 2, SPI, 1, .1), eio((tp - T) / .25)); return { F, B: XB }; }
  if (t < T + .9) { const x = lerp(xs0, xs1, eio(clamp((tp - T - .3) / .6))), gy = x < E + G + 4 ? yb - PW / 2 : BY;
    const F = walkSpec(x, gy, SPI, 1, P.ph + x / (170 * SPI), 170, .12, 30); F.tilt = -.05; F.hands = hangHands(F, 26 * Math.sin(TAU * (P.ph + x / (170 * SPI)))); return { F, B: XB }; }

    F.hands = [cpt(X, L - 44), cpt(X, L - 92)]; return [F, X]; };

}
function sawPx(c, grip, ang, Cs) {
  const { d, up, heel } = sawGeo(grip, ang), P = (u, v) => B2([heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v]);
  pxPoly(c, [P(0, 30), P(172, 18), P(172, -4), P(0, -4)], Cs.bl);
  pxPoly(c, [P(0, 5), P(172, 5), P(172, -4), P(0, -4)], Cs.bl2);
  pxPoly(c, [P(-4, 38), P(-40, 48), P(-54, 20), P(-42, -6), P(-6, 0)], Cs.h);
  pxPoly(c, [P(-14, 30), P(-34, 36), P(-42, 20), P(-34, 8), P(-14, 12)], Cs.h2);
}

// ---------------- the world (drawn twice: night palette and lit palette; the lit one shows through pixel circles) ----------------
const GATE = () => FC.gatePos(GX, BY + 4);
function world(c, P, pk, t, st) {
  FC.background(c, P, FOREST, GYP);
  FC.ground(c, P, GYP, { gap: [E, G], inGap: () => { const FXs = st.FXs; if (FXs && FXs.clip) crossPx(c, WOOD, FXs.u0, L, FXs.x, FXs.y, FXs.a, true); } });   // falling between the walls
  const tq = step8(t), pal = PI[pk], xw = PXW[pk];
  const Gp = GATE(), gx = Gp.gx; const gateVis = gx > -40 && gx < c.canvas.width + 40;
  const drawPil = Pp => { const X = Pp.X, dc = X ? () => crossPx(c, xw, X.u0, L, X.x, X.y, X.a, X.lie) : null; figPx(c, Pp.F, pal, X && X.lie ? dc : null, null, X && !X.lie ? dc : null); };
  if (gateVis) { FC.gateDoor(c, P, t, Gp); for (const Pp of st.pils) if (Pp.F.inGate) drawPil(Pp); FC.gateArch(c, P, Gp); }
  for (const Pp of st.pils) if (Pp.B) crossPx(c, xw, 0, L, Pp.B.x, Pp.B.y, Pp.B.a, true);
  st.pils.slice().sort((a, b) => a.F.hip[0] - b.F.hip[0]).forEach(Pp => { if (!Pp.F.inGate) drawPil(Pp); });
  const c3 = CUTS[2];
  if (t >= c3.drop) { const kk = eio((step12(t) - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip;
    sawPx(c, [lerp(g0[0], SAWLIE.grip[0], kk), lerp(g0[1], SAWLIE.grip[1], kk)], lerp(CUT_ANG, SAWLIE.ang, kk), SAW[pk]); }
  for (const p of st.pieces) crossPx(c, p.glow > .5 ? EMBER : WOOD, p.c.u0, p.c.u1, p.x, p.y, p.a, true);
  const M = st.M, F = M.F, myCross = X => { if (X) crossPx(c, WOOD, X.u0, L, X.x, X.y, X.a, X.lie); };
  figPx(c, F, ME[pk], () => {
    if (M.X && M.X.lie) myCross(M.X);
    if (M.kerf) { const a = B2([M.c.cutX, M.c.y - PW / 2]); R(c, a[0], a[1], 1, Math.max(1, M.kerf.kp * PW * .92 / U), P.deep); }
    if (M.saw) sawPx(c, M.saw.grip, M.saw.ang, SAW[pk]);
  }, M.X && M.X.held ? () => myCross(M.X) : null, M.X && !M.X.lie && !M.X.held ? () => myCross(M.X) : null);
  const FXs = st.FXs; if (FXs && !FXs.clip) crossPx(c, WOOD, FXs.u0, L, FXs.x, FXs.y, FXs.a, true);
  // sawdust: orange chips on 12s
  const tq12 = step12(t);
  for (const q of FLECKS) { const u = tq12 - q.t0; if (u < 0 || u > 1.3) continue;
    const tl = (-q.vy + Math.sqrt(q.vy * q.vy + 4 * 700 * (q.land - q.y))) / 1400, uu = Math.min(u, Math.max(0, tl)), p = B2([q.x + q.vx * uu, q.y + q.vy * uu + 700 * uu * uu]);
    R(c, p[0], p[1], 1, 1, q.col); }
}
function guidePx(c, t, k, x0 = E - REST) {   // the dashed outline of my whole cross across the chasm, in marching pixel dashes
  FC.dashedPx(c, FC.outline(GEO, x0, FY + 34), t, x0 + L * k);
}
function slotsPx(c, t) {
  for (const p of CUTS) { if (t < SLOT[p.k]) continue; const fresh = t < SLOT[p.k] + .25;
    FC.fireFill(c, [E + 4 + p.u0 + 4, FY + 34 - PW / 2 + 4], [E + 4 + p.u1 - 4, FY + 34 + PW / 2 - 4], fresh); }
}
// ---------------- the camera: shots ----------------
function shotAt(t) {
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => (cc.mx + cc.cutX) / 2 - 10;
  if (t < 2.4) return { K: 13, x: meX(t) + 30, y: 1000 };                     // the hook: close on me, the saw in my hand
  if (t < 3.15) return { K: 8, x: meX(t) + 60, y: 900 };                     // the procession
  if (t < 4.55) return { K: 10, x: at(c1), y: 1020 };                         // the first cut
  if (t < 8.95) return { K: 8, x: meX(t) + 60, y: 900 };                     // lighter: I run, the others fall behind
  if (t < 11.4) return { K: 10, x: lerp(at(c2), at(c3), eio((t - 10) / .45)), y: 1020 };   // twice more
  if (t < 11.8) return { K: 8, x: meX(t) + 20, y: 900 };                      // I run on to the edge (always in frame)
  if (t < 18.2) return { K: 6, x: E + 250, y: 915 };                          // the road ends; the others cross, one at a time                          // the road ends; the others cross, one at a time
  if (t < B.fall) return { K: 9, x: E + 160, y: 1110 };                       // mine: short
  if (t < B.fall + .7) return { K: 11, x: E + 160, y: 1200, shake: 1 - ss(B.fall, B.fall + .55, t) };   // the hit
  if (t < B.back) return { K: 8, x: E + 150, y: 1060 };
  // I stay at the lip and look back: the camera travels back along the road in one move (the pieces glow where they lie), and returns
  const x = t < 21.55 ? E - 150 : t < 22.35 ? lerp(E - 150, E - 600, eio((t - 21.55) / .8)) : lerp(E - 600, E + 180, eio((t - 22.35) / .6));
  return { K: 9, x, y: 1010 };   // I look back; the pieces fly to the gap
}
const SLOT = [22.9, 23.6, 24.3];   // the outline's missing span lights slot by slot (one piece's length each)
function lightsAt(t) {   // in design units
  const q = step8(t), D = [];
  if (q >= B.gap) D.push({ x: GX - 40, y: BY - 150, r: 470 * backEase(clamp((q - B.gap - .1) / .5)) });
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, step12(t)), sw = ss(B.back + .2 + (2 - c.k) * .2, B.back + .6 + (2 - c.k) * .2, q);
    const r = 130 * sw * (q >= SLOT[c.k] && q < SLOT[c.k] + .25 ? 1.2 : 1); if (r > 8) D.push({ x: p.cx, y: p.cy, r }); }
  for (const c of CUTS) if (q >= SLOT[c.k]) D.push({ x: E + 4 + (c.u0 + c.u1) / 2, y: FY + 34, r: 100 * eo(clamp((q - SLOT[c.k]) / .25)) });
  return D;
}

// ---------------- frame ----------------
function draw(ctx, t) {
  const sh = shotAt(t), K = sh.K, bb = FC.bufs(K), q8 = step8(t), [shx, shy] = FC.shake(sh, t);
  FC.setView(K, sh.x, sh.y, shx, shy);
  const M = poseMe(q8), FXs = fallX(step12(t));
  const pils = [0, 1, 2, 3].map(i => pilState(i, q8)).filter(p => p && p.F);
  const pieces = CUTS.filter(c => t >= c.drop).map(c => { const p = pieceAt(c, step12(t)); return { ...p, c, glow: ss(B.back + .2 + (2 - c.k) * .15, B.back + .6 + (2 - c.k) * .15, q8) }; });
  const st = { M, FXs, pils, pieces };
  const flash = t >= B.fall && t < B.fall + .1;
  world(bb.n, N, 'N', t, st);
  FC.lit(bb, lightsAt(t), g => world(g, LP, 'L', t, st), flash);
  // embers: from the burning doorway, and from the pieces once they catch
  if (t >= B.gap) { const g = GATE(); FC.embers(bb.n, t, g.gx, g.ay - 14, 7, 40, 14); }
  for (const p of pieces) if (p.glow > .5) { const b = B2([p.cx, p.cy]); FC.embers(bb.n, t, Math.round(b[0]), Math.round(b[1]) - 3, 4, 60 + p.c.k * 7, 8); }
  if (t >= 18.75 && t < 19.75) guidePx(bb.n, t, eio((t - 18.75) / .35));
  if (t >= 22.45) { guidePx(bb.n, t, eio((t - 22.45) / .4), E + 4); slotsPx(bb.n, t); }
  FC.haze(bb.n, t, FOREST);
  FC.present(ctx, bb);
  FC.windowFrame(ctx, t, B.end);   // the lab's frame; at the end it closes in, whole pixels at a time, to a plain plate for the card
  if (t < B.end) FC.captions(ctx, t, S.lines);   // v2: captions crisp at full resolution (Do Hyeon), with a hard offset shadow
  FC.endCard(ctx, t, S.endCard, B.end);
}

async function init() { buildTimeline(); GX = E + G + 240; FOREST = FC.forest(11); FC.init(); }
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: FC.FONTS, init, draw });
</script>
