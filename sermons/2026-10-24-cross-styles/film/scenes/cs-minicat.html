<title>잘라 낸 건 다리였다 · 09 미니멀 고양이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hi+Melody&family=Noto+Sans+KR:wght@500&display=swap">

<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script><script src="kit-minicat.js"></script>
<script>
/* 잘라 낸 건 다리였다 — 09 minimal line + flat blue (the style lab's cat, lab-minicat.html). v2: a side view.
   The lab's cornflower blue with a faint paper tooth and a thin steady black hand line. Small white cats in pyjamas walk
   along a long flat ledge of shallow water (a light band with a firm ink front edge), the sky above (moon, lavender cloud
   blobs), the open water below the ledge (darker, soft lavender reflections, broken ripple arcs; every footfall rings).
   I am the white cat in cream pyjamas; the others are paler grey-lavender cats. Each carries a long wooden cross on the
   shoulder at a shallow angle — the crossbar just behind the head, the top end held in front of the chest by a paw, the long
   post trailing behind to the ground — so its length reads, and so does "short" later. My cross is the one warm thing
   (honey wood); the only other warm light is the door across the gap. The ledge ends at a real drop: the band breaks,
   water spills over both lips into a dark ravine that falls away to black. At the end the pieces glow where they lie on
   the ledge (the camera travels back to them and returns), and the dashed outline of my whole cross over the gap lights
   slot by slot — the gap stays open.
   The style (hand line, the cat rig, sky, ledge + water, ripples, the gap, the lit door, splash, captions, end plate) is the
   house-style kit styles/minicat (kit-minicat.js, window.MiniCat); this file keeps only the story. */
const MC = MiniCat, S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2, C = MC.C;
const { t12, frac, lerp2, wob, pathOf, inkPts, stroke, ink, ell, arc, CS, frameOf, armOf, drawCat, drawCatRefl, walkSpec, standSpec, crouchSpec, mixSpec } = MC;

// ---------------- the world's measures ----------------
const L = 560, PW = 30, CBX = 430, CBH = 92, CBW = 30; // a cross: post length/width, crossbar at CBX (from the foot), half-length, width
const PWL = 18, PFACE = 9, CBHL = 34;                  // lying flat: the post's top face, its front face, the crossbar foreshortened
const REST = 34, G = L - 2 * REST;                     // a whole cross rests 34 on each lip: the gap is G wide
const WL = 1300, FY = WL, BY = WL - 22, LIE = 26, TOPE = WL - 46, FRONTE = WL + 10;   // my feet, the others' (just behind); the ledge's back and front edges
const HONEY = { f: C.honey, face: C.honeyF }, GREY = { f: C.pX, face: C.pXf };
let E = 1500, GX = 0;                                  // the gap's near lip (set from my path), the door

// ---------------- crosses ----------------
// X = { x, y, a, k, u0, u1 } — (x, y) the foot end (u = 0), a the post's angle (foot → top), k: 0 upright … 1 lying flat
function crossLocal(u0, u1, k) {
  const hb = lerp(CBH, CBHL, k), pw = lerp(PW, PWL, k) / 2, bar = u0 < CBX - CBW / 2 && u1 > CBX + CBW / 2, o = [[u0, -pw]];
  if (bar) o.push([CBX - CBW / 2, -pw], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -pw]);
  o.push([u1, -pw], [u1, pw]);
  if (bar) o.push([CBX + CBW / 2, pw], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, pw]);
  o.push([u0, pw]); return o;
}
const xpt = MC.objPt;
function drawCross(ctx, X, pal, o = {}) {
  const u0 = X.u0 || 0, u1 = X.u1 ?? L; if (u1 - u0 < 1) return;
  const k = X.k || 0, loc = crossLocal(u0, u1, k), pts = loc.map(([u, v]) => xpt(X, u, v));
  if (o.refl) { ink(ctx, pts, { fill: o.refl, smooth: false, part: [.15, .6] }); return; }
  if (k > .05) { const dy = PFACE * k; ink(ctx, pts.map(p => [p[0], p[1] + dy]), { fill: pal.face, smooth: false }); }
  ink(ctx, pts, { fill: pal.f, smooth: false });
  // wood grain: a couple of short strokes and a knot along the post
  ctx.save(); ctx.globalAlpha *= .55;
  for (const [ua, ub, v] of [[60, 150, -.18], [230, 330, .2], [CBX + 40, CBX + 110, -.1]]) if (ua > u0 + 6 && ub < u1 - 6)
    ink(ctx, [xpt(X, ua, v * PW * lerp(1, .55, k)), xpt(X, ub, v * PW * lerp(1, .55, k))], { closed: false, lw: 1.6, smooth: false });
  ctx.restore();
}
const rotAbout = MC.rotAbout;
const mixX = MC.mixObj;
const lying = (x, y, u0 = 0, u1 = L) => ({ x, y, a: 0, k: 1, u0, u1 });

// ---------------- the cats: the kit's rig (MiniCat.drawCat), my palette and theirs ----------------
const MEPAL = MC.MEPAL, PILPAL = MC.PILPAL;

// ---------------- carrying ----------------
// dragged on the shoulder: the top end rests on my shoulder, tied there with the lab's strap (over the shoulder, across the
// chest, held by the near paw); the crossbar stands clear behind me, the long post trails down to the water — a whole cross
// drags its foot, a cut one hangs clear (the shorter it is, the shorter the tail behind the crossbar)
const TL = [-34, 72], GRIPU = L - 30, GRIPU2 = L - 60;
const shoulderCarry = (Fr, gy, u0) => MC.shoulderCarry(Fr, gy, u0, L);
function carrySpec(F, u0, pal, holdStrap) {   // put the cross on F's shoulder, tied with the strap (the near paw holds the strap when it's free)
  const X = shoulderCarry(frameOf(F), F.gy, u0); F.X = X; F.strap = holdStrap ? 'hold' : 'wrap';
  F.back = () => drawCross(ctxNow, X, pal); return F;
}

// ---------------- my path (integrated once), the cuts ----------------
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 40 * (1 + .55 * Math.sin(t * TAU / 1.3 - 1));          // trudging, staggering
  if (t < 4.6) return 0;
  if (t < 5.0) return 190 * eio((t - 4.6) / .4);                              // lighter: big quick hops
  if (t < 8.3) return 190;
  if (t < 8.6) return lerp(190, 90, (t - 8.3) / .3);
  if (t < 9.0) return 90 * (1 - ss(8.6, 9.0, t));
  if (t < 9.95) return 0;
  if (t < 10.35) return (L * (S.left[2] - S.left[3])) * Math.PI / (2 * .4) * Math.sin(Math.PI * (t - 9.95) / .4);   // scoot along the lying cross: exactly one more piece
  if (t < 11.35) return 0;
  if (t < 12.0) return 520 * Math.sin(Math.PI * (t - 11.35) / .65);
  return 0;
}
const strideMe = t => t < 4.6 ? 70 : t < 9 ? 150 : t < 11 ? 60 : 150;
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };
const meX = t => tab(MEX, t), meP = t => tab(MEP, t);
const CUTS = [{ s: 3.2, d: .3, saw0: 3.5, drop: 4.0, up1: 4.4 }, { s: 9.0, d: .2, saw0: 9.2, drop: 9.8, up1: 10.4 }, { s: 10.4, d: .15, saw0: 10.55, drop: 11.2, up1: 11.35 }];
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const SLOTS = [22.9, 23.6, 24.3];   // the outline's missing span lights one piece-length at a time
const HIPOFF = 112;   // while sawing I crouch facing the foot end, my hip HIPOFF right of the cut
const MEX_EDGE = () => E - 118;   // where I stand at the lip
let STEPS = [], SAWLIE = null, PIECES = [], TRAVEL = null;
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }
  E = meX(12) + 118;
  CUTS.forEach((c, k) => { c.k = k; c.mx = meX(c.s); c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.cutX = c.mx - HIPOFF; });
  CUTS[0].xl = CUTS[0].cutX - CUTS[0].u1; CUTS[1].xl = CUTS[1].cutX - CUTS[1].u1; CUTS[2].xl = CUTS[1].xl; CUTS[2].cutX = CUTS[2].xl + CUTS[2].u1;
  CUTS[2].mx = CUTS[2].cutX + HIPOFF;
  const OFF = [[-24, 2, -.04], [-70, -8, .05], [16, 8, -.06]];
  PIECES = CUTS.map((c, k) => ({ c, x: c.xl + OFF[k][0], y: FY - LIE + OFF[k][1], a: OFF[k][2], u0: c.u0, u1: c.u1 }));
  SAWLIE = { x: CUTS[2].cutX + 60, y: FY - LIE + 18 };
  GX = E + G + 640;
}
function pieceAt(P, t) {   // a cut piece where it fell (it slides a little off the cut and stays)
  const c = P.c, k = eo((t - c.drop) / .3);
  return { x: lerp(c.xl, P.x, k), y: lerp(FY - LIE, P.y, k), a: P.a * k, k: 1, u0: P.u0, u1: P.u1 };
}

// ---------------- the saw ----------------
const CUT_ANG = Math.PI - .5;
function sawFrame(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let n = [-d[1], d[0]]; if (n[1] > 0) n = [-n[0], -n[1]];
  const heel = [grip[0] + d[0] * 30 - n[0] * 12, grip[1] + d[1] * 30 - n[1] * 12]; return { d, n, heel, P: (u, v) => [heel[0] + d[0] * u + n[0] * v, heel[1] + d[1] * u + n[1] * v] }; }
function drawSaw(ctx, grip, ang) {
  const { P } = sawFrame(grip, ang), blade = [P(0, 28), P(150, 16)];
  for (let u = 150; u >= 0; u -= 8) blade.push(P(u, (u / 8 | 0) % 2 ? -4 : -9));
  ink(ctx, blade, { fill: C.saw, smooth: false, lw: 2.6 });
  ink(ctx, [P(-4, 34), P(-46, 44), P(-58, 16), P(-44, -10), P(-4, -6)], { fill: C.handle, lw: 2.6 });
  ink(ctx, [P(-16, 26), P(-38, 32), P(-44, 16), P(-36, 4), P(-16, 8)], { fill: C.field, lw: 2 });   // the grip hole
  ink(ctx, [P(8, 4), P(8, 20)], { closed: false, lw: 1.6 }); ink(ctx, [P(16, 4), P(16, 19)], { closed: false, lw: 1.6 });
}
function sawState(c, t) {   // the stroke: the teeth pass through the kerf, the blade moves along its own length
  const kp = clamp((t - c.saw0) / (c.drop - .06 - c.saw0)), on = t >= c.saw0 - .05 && t < c.drop + .02;
  const osc = on ? 28 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, { d, n } = sawFrame([0, 0], CUT_ANG);
  const K = [c.cutX, FY - LIE - PWL / 2 + kp * (PWL + PFACE) * .9], uc = 70 + osc;
  const heel = [K[0] - d[0] * uc + n[0] * 6, K[1] - d[1] * uc + n[1] * 6];
  return { kp, K, grip: [heel[0] - d[0] * 30 + n[0] * 12, heel[1] - d[1] * 30 + n[1] * 12] };
}
const hangSaw = (Fr, F) => { const { hand } = armOf(Fr, F, true); return { grip: hand, ang: Math.atan2(1, -.25 * F.f) }; };

// ---------------- me ----------------
function sawSpec(c, t, mx) {
  const F = crouchSpec(mx, FY, -1, { lean: .9, head: .42, crouch: 20, face: 'calm' }), st = sawState(c, t);
  F.hands = [[c.cutX + 34, FY - LIE - PWL / 2 - 2], st.grip]; F.grip = true; return F;
}
function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), left = leftAt(t), u0 = L * (1 - left);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const sway = Math.sin(tt * TAU / 1.3); return walkSpec(x, FY, 1, ph, 70, { lean: .34 + .06 * sway, head: .42, face: 'strain', bob: 3 }); }
    if (tt < 9) { const k = ss(4.6, 5.1, tt); return walkSpec(x, FY, 1, ph, lerp(70, 150, k), { stance: lerp(.6, .38, k), lift: lerp(9, 30, k), bob: lerp(3, 22, k), lean: lerp(.32, .16, k), head: lerp(.4, -.05, k), face: k > .5 ? 'happy' : 'calm' }); }
    return walkSpec(x, FY, 1, ph, 150, { stance: .4, lift: 26, bob: 18, lean: .2, head: 0, face: 'calm' });
  };
  // walking: the cross tied on my shoulder, the near paw on the strap, the saw in the far paw (hanging in front of me).
  // Turning round to saw swaps which paw faces us, so the saw paw is the near one while I saw and the strap paw pins the post.
  const farSaw = F => { const Fr = frameOf(F); return { grip: Fr.TF(42, 30), ang: Math.atan2(1, .3 * F.f) }; };
  const carried = (F, lu0, saw) => { carrySpec(F, lu0, HONEY, true);
    if (saw) { const sv = farSaw(F); F.hands[0] = sv.grip; const X = F.X; F.back = () => { drawCross(ctxNow, X, HONEY); drawSaw(ctxNow, sv.grip, sv.ang); }; } return F; };
  const noStrap = F => { F.strap = null; return F; };
  // a turn while handling the cross: the saw paw and the cross paw keep their jobs; which slot they draw in flips with the body
  const handle = (F, k, crossPaw, sawGrip, sawAng, Xm) => {
    // mid-turn (body squashed) the paw on the cross is the near one, drawn over the body, so the cross never moves by itself
    const nearCross = F.f > 0 || (F.sq ?? 1) < .999;
    F.back = () => { drawCross(ctxNow, Xm, HONEY); if (sawGrip && nearCross) drawSaw(ctxNow, sawGrip, sawAng); };
    if (sawGrip && !nearCross) { F.mid = () => drawSaw(ctxNow, sawGrip, sawAng); F.grip = true; } else F.grip = false;
    const other = sawGrip || F.hands[nearCross ? 0 : 1];
    F.hands = nearCross ? [other, crossPaw] : [crossPaw, other]; return F; };
  for (const c of CUTS) {
    if (t < c.s || t >= c.up1) continue;
    const mx = c.mx, lieX = u => lying(c.xl, FY - LIE, u, L);
    if (c.k === 2) {   // the cross is still down from cut 2: saw again, then shoulder the short one (the saw is left on the road)
      if (t < c.drop) { const F = sawSpec(c, tp, mx), st = sawState(c, t); F.mid = () => drawSaw(ctxNow, st.grip, CUT_ANG);
        return { F, lieX: lieX(CUTS[1].u1), c, kerf: t >= c.saw0, kp: st.kp }; }
      const k = eio((tp - c.drop) / (c.up1 - c.drop)), A = sawSpec(c, c.drop - .01, mx), Bw = carried(walk(c.up1, mx), c.u1, false), F = noStrap(mixSpec(A, Bw, k));
      const Xm = mixX(lieX(c.u1), Bw.X, k); if (k > .9) F.strap = 'hold';
      const crossPaw = xpt(Xm, lerp(c.u1 + 34, L - 40, k)), free = lerp2(A.hands[1], armOf(frameOf(Bw), Bw, false).hand, k);
      F.back = () => drawCross(ctxNow, Xm, HONEY); F.hands = F.f > 0 ? [free, crossPaw] : [crossPaw, free];
      if (k > .9) F.hands[1] = null;
      return { F, c, sawDropT: c.drop };
    }
    const W0 = carried(walk(c.s, mx), c.u0, true), sv0 = farSaw(W0);
    if (t < c.s + c.d) {   // take the post with the strap paw, set it down behind me, turn to its foot end
      const k = eio((tp - c.s) / c.d), SP = sawSpec(c, c.saw0, mx), F = noStrap(mixSpec(W0, SP, k)); F.face = 'calm';
      const Xm = mixX(W0.X, lieX(c.u0), k), sg = sawState(c, c.saw0).grip;
      handle(F, k, xpt(Xm, lerp(L - 40, c.u1 + 34, k)), lerp2(sv0.grip, sg, k), lerp(sv0.ang, CUT_ANG, k), Xm);
      return { F, c };
    }
    if (t < c.drop) { const F = sawSpec(c, t, mx), st = sawState(c, t); F.mid = () => drawSaw(ctxNow, st.grip, CUT_ANG);
      return { F, lieX: lieX(c.u0), c, kerf: t >= c.saw0, kp: st.kp }; }
    if (c.k === 1) {   // after the second cut: scoot along it (still crouched, facing its foot) for one more
      const sx = meX(t), F = sawSpec(CUTS[2], CUTS[2].saw0 - .2, sx); const ph = meP(tp) * 2;
      F.feet = [[sx + 20 * CS, FY - Math.max(0, Math.sin(ph * TAU)) * 8], [sx - 4 * CS, FY - Math.max(0, -Math.sin(ph * TAU)) * 8]];
      const st = sawState(CUTS[2], CUTS[2].saw0 - .3), cutNow = c.cutX + (sx - c.mx);
      F.hands = [[cutNow + 34, FY - LIE - PWL / 2 - 2], [st.grip[0] + sx - CUTS[2].mx, st.grip[1]]];
      F.mid = () => drawSaw(ctxNow, F.hands[1], CUT_ANG);
      return { F, lieX: lieX(c.u1) };
    }
    // pick it up again (cut 1): the pinning paw heaves the post up onto my shoulder, the saw paw comes round with the turn
    const k = eio((tp - c.drop) / (c.up1 - c.drop)), A = sawSpec(c, c.drop - .01, mx), Bw = carried(walk(c.up1, mx), c.u1, true), F = noStrap(mixSpec(A, Bw, k));
    if (k > .9) F.strap = 'hold'; F.face = 'calm';
    const Xm = mixX(lieX(c.u1), Bw.X, k), sg = sawState(c, c.drop - .01).grip, sv1 = farSaw(Bw);
    handle(F, k, k > .92 ? armOf(frameOf(Bw), Bw, true).hand : xpt(Xm, lerp(c.u1 + 34, L - 40, k)), lerp2(sg, sv1.grip, k), lerp(CUT_ANG, sv1.ang, k), Xm);
    return { F, c };
  }
  if (t < 12) { const F = carried(walk(tp), u0, t < CUTS[2].drop); return { F }; }
  // at the edge: a sudden stop, step back for the others, come forward again to lay mine
  const EX = MEX_EDGE();
  if (t < 18.4) {
    const bx = -150 * eio((tp - 12.9) / .7) + 150 * eio((tp - 17.55) / .7), x = EX + bx;
    const moving = (tp > 12.9 && tp < 13.6) || (tp > 17.55 && tp < 18.25);
    let F = moving ? walkSpec(x, FY, 1, x / 60, 60, { lean: .12, head: .05, bob: 3 }) :   // backing away, still facing the gap
       standSpec(x, FY, 1, { lean: .1, head: tp < 13 ? -.08 : .05 });
    if (tp < 12.9) { F.lean = -.1 * Math.sin(Math.PI * clamp((tp - 12) / .5)) + .08; F.face = tp < 12.8 ? 'shock' : 'calm'; }
    if (!moving && tp > 13.6) { F.head = .05 + .08 * Math.sin(tp * 1.3); F.face = 'look'; }
    return { F: carried(F, u0, false) };
  }
  const XLay = lying(E - REST - u0, FY - LIE, u0, L);
  const LAY = { ...crouchSpec(E - REST - HIPOFF + 30, FY, 1, { lean: .9, head: .35, crouch: 20 }), face: 'calm' };
  LAY.hands = [xpt(XLay, u0 + 56), xpt(XLay, u0 + 20)];
  if (t < B.tip) {
    if (t < 18.85) { const ST = carried(standSpec(EX, FY, 1, { lean: .1 }), u0, false), k = eio((tp - 18.4) / .4), F = noStrap(mixSpec(ST, LAY, k));
      const Xm = mixX(ST.X, XLay, eio((t - 18.4) / .4)); F.back = () => drawCross(ctxNow, Xm, HONEY);
      F.hands = [xpt(Xm, lerp(GRIPU, u0 + 56, k)), xpt(Xm, lerp(GRIPU2, u0 + 20, k))]; return { F, lay: true }; }
    return { F: { ...LAY, face: t > 19.0 ? 'strain' : 'calm' }, X: XLay, lay: true };
  }
  const REACH = { ...LAY, x: LAY.x - 10, lean: .55, crouch: 6, head: .2, face: 'shock', hands: [[E - 30, FY - 150], [E + 10, FY - 100]] };
  if (t < B.back) { const k = eio((tp - B.tip) / .25), F = mixSpec(LAY, REACH, k); F.face = tp > 20.5 ? 'down' : 'shock'; if (tp > 20.5) { F.head = .45; }
    if (tp > 20.4) { const k2 = eio((tp - 20.4) / .4); F.hands = [lerp2(REACH.hands[0], armOf(frameOf(F), { ...F, hands: [null, null] }, false).hand, k2), lerp2(REACH.hands[1], armOf(frameOf(F), { ...F, hands: [null, null] }, true).hand, k2)]; }
    return { F }; }
  // I stay at the lip: turn and look back down the ledge; then turn to the gap again and look at the outline
  const x0 = REACH.x, BACK = { ...standSpec(x0, FY, -1, { lean: .04, head: -.06 }), face: 'look' }, FWD = { ...standSpec(x0, FY, 1, { lean: .06, head: .12 }), face: 'look' };
  const DOWN = { ...standSpec(x0, FY, 1, { lean: .03, head: .02 }) };
  if (t < 22.5) return { F: mixSpec({ ...DOWN, face: 'down' }, BACK, eio((tp - B.back) / .3)) };
  return { F: { ...mixSpec(BACK, FWD, eio((tp - 22.5) / .3)), face: tp > 24.6 ? 'down' : 'look' } };
}
// my short cross once my paws slip: it tips over the lip, then falls into the dark
function fallX(t) {
  if (t < B.tip) return null;
  const u0 = L * (1 - S.left[3]), pv = [E, FY - LIE + PWL / 2], X0 = lying(E - REST - u0, FY - LIE, u0, L);
  if (t < B.fall) return { X: rotAbout(X0, pv, .45 * Math.pow((t - B.tip) / (B.fall - B.tip), 2)), s: 1, al: 1 };
  const u = t - B.fall, X1 = rotAbout(X0, pv, .45), cu = (u0 + L) / 2, c0 = xpt(X1, cu);
  const cx = c0[0] + 60 * u, cy = c0[1] + 240 * u + 1500 * u * u, a = X1.a + 2.2 * u + 1.4 * u * u, s = 1 / (1 + 1.6 * u);
  return { X: { ...X1, x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a }, s, c: [cx, cy], al: 1 - ss(B.fall + .7, B.fall + 1.2, t) };
}

// ---------------- the others: lay it across → walk over → pull it back from the far side → shoulder it → into the light ----------------
const PIL = [{ x0: 260, ph: .1 }, { x0: 140, ph: .55 }, { x0: -250, ph: .8 }], PULL = 220;
function pilX(j, t) {
  const P = PIL[j], T = B.bridges[j], x46 = P.x0 + 34 * 4.6, xb = x46 + 15 * (11.4 - 4.6);   // they plod on while I race ahead (and stay out of sight)
  if (t <= 4.6) return P.x0 + 34 * t;
  if (t <= 11.4) return x46 + 15 * (t - 4.6);
  const k = clamp((t - 11.4) / (T - .25 - 11.4)); return lerp(xb, E - REST - HIPOFF + 30, k * k * (1.6 - .6 * k));
}
function pilState(j, t) {   // lay (T−.25…T) → over (…T+.5) → pull back (…T+.8) → shoulder (…T+.95) → off into the light, clear of the gap by ≈T+1.25
  const tp = t12(t), P = PIL[j], T = B.bridges[j], yb = BY - 20, top = yb - PWL / 2 - 2;
  const tag = F => { F.pal = PILPAL; return F; };
  const carry = (x, stride = 70, o = {}) => carrySpec(tag(walkSpec(x, BY, 1, P.ph + x / stride, stride, { lean: .3, head: .34, bob: 3, face: 'strain', ...o })), 0, GREY, true);
  const ns = F => { F.strap = null; return F; };
  if (t < T - .25) { const x = pilX(j, tp); return { F: carry(x, tp > 11.4 ? 130 : 70, tp > 11.4 ? { lean: .24, head: .2, face: 'calm' } : {}) }; }
  const XB = lying(E - REST, yb);
  const LAY = tag({ ...crouchSpec(E - REST - HIPOFF + 30, BY, 1, { lean: .9, head: .3, crouch: 20 }) }); LAY.hands = [xpt(XB, 56), xpt(XB, 20)];
  if (t < T) { const F0 = carry(E - REST - HIPOFF + 30), k = eio((tp - T + .25) / .25), F = ns(tag(mixSpec(F0, LAY, k))), Xm = mixX(F0.X, XB, eio((t - T + .25) / .25));
    F.back = () => drawCross(ctxNow, Xm, GREY); F.hands = [xpt(Xm, lerp(GRIPU, 56, k)), xpt(Xm, lerp(GRIPU2, 20, k))]; return { F }; }
  const xs0 = E - 30, xs1 = E + G + 60;
  if (t < T + .15) { const F = tag(mixSpec(LAY, standSpec(xs0, top, 1, { lean: .08 }), eio((tp - T) / .15))); return { F, bridge: XB, onBridge: true }; }
  if (t < T + .5) { const x = lerp(xs0, xs1, eio(clamp((tp - T - .15) / .35))), gy = x < E + G + 10 ? top : BY;
    const F = tag(walkSpec(x, gy, 1, P.ph + x / 140, 140, { lean: .12, head: -.02, bob: 8, lift: 18 })); return { F, bridge: XB, onBridge: x < E + G + 10 }; }
  // from the far side: turn, crouch, take the top end and pull it back across
  const pullX = k => rotAbout({ ...XB, x: XB.x + PULL * k }, [E + G, yb], -.08 * k);
  const PULLS = k => { const X = pullX(k), x = E - REST + L + PULL * k + 70; const F = tag(crouchSpec(x, BY, -1, { lean: .8, head: .25, crouch: 16 }));
    F.hands = [xpt(X, L - 50), xpt(X, L - 12)]; return [F, X]; };
  if (t < T + .8) { const k = eio(clamp((tp - T - .5) / .3)), [F, X] = PULLS(k), k0 = eio((tp - T - .5) / .12);
    return { F: k0 < 1 ? tag(mixSpec(standSpec(xs1, BY, 1), F, k0)) : F, bridge: X, pulling: true }; }
  const [Fp, Xp] = PULLS(1), xg = Fp.x;
  if (t < T + .95) { const k = eio((tp - T - .8) / .15), Fc = carry(xg, 120), F = ns(tag(mixSpec(Fp, Fc, k))), Xm = mixX(Xp, Fc.X, k);
    F.back = () => drawCross(ctxNow, Xm, GREY); F.hands = [xpt(Xm, lerp(L - 50, GRIPU, k)), xpt(Xm, lerp(L - 12, GRIPU2, k))]; return { F }; }
  const x = lerp(xg, GX, eio(clamp((tp - T - .95) / .45))), F = carry(x, 150, { lean: .2, head: .1, face: 'calm', stance: .45, lift: 16, bob: 8 });
  F.alpha = 1 - ss(T + 1.25, T + 1.5, t); if (F.alpha <= 0) return null; F.inGate = x > GX - 90;
  return { F };
}

// ---------------- camera ----------------
const mixCam = MC.mixCam;
const GAPCAM = () => ({ x: E + 190, y: WL - 300, z: .95 });
function camAt(t) {
  let c = { x: meX(t) + 170 * ss(4.3, 5.4, t) + 90, y: WL - 330, z: .9 };
  c = mixCam({ x: meX(t) + 20, y: WL - 300, z: 1.75 }, c, eio((t - 1.2) / 1.4));        // the hook: close on me, the saw in my paw; widening by ~2.6
  const at = cc => ({ x: cc.cutX + 70, y: WL - 260, z: 1.25 });
  c = mixCam(c, at(CUTS[0]), Pilot.win(t, CUTS[0].s - .05, CUTS[0].up1 + .25, .32, .35));
  c = mixCam(c, mixCam(at(CUTS[1]), at(CUTS[2]), eio((t - 9.9) / .55)), Pilot.win(t, CUTS[1].s - .1, CUTS[2].up1 + .2, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 20 + 1500 * ss(11.5, 12.4, t) * ss(11.5, 12.4, t));   // the gap stays out of frame until I reach it
  if (t >= 12) c = mixCam(c, { x: E + 430, y: WL - 330, z: .72 }, eio((t - 12.05) / .95));
  if (t >= 18.1) c = mixCam(c, { x: E + 150, y: WL - 260, z: 1.05 }, eio((t - 18.1) / .5));
  if (t >= B.fall) c = mixCam(c, { x: E + 120, y: WL - 120, z: 1.35 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .6) c = mixCam(c, { x: E + 140, y: WL - 260, z: 1.05 }, eio((t - B.fall - .6) / .7));
  // I look back: one continuous move back down the ledge past the glowing pieces, then out again over the gap
  if (t >= B.back + .15) c = mixCam(c, TRAVEL, eio((t - B.back - .15) / .7));
  if (t >= 22.25) c = mixCam(c, GAPCAM(), eio((t - 22.25) / .6));
  const k = 1 - ss(B.fall, B.fall + .55, t); c.sx = t >= B.fall ? 16 * k * Math.sin(t * 97) : 0; c.sy = t >= B.fall ? 12 * k * Math.sin(t * 131 + 1) : 0;
  return c;
}

// ---------------- prebuilt ----------------
let SKY, ARCS = [], GAPD = null;
function init() {
  buildTimeline();
  MC.init();
  // the sky (parallax .4): the moon, lavender cloud blobs part-outlined, star specks — all above the ledge; the ripple rings below
  const r = rng(31);
  SKY = MC.buildSky(r, { moons: [{ x: E * .4 + 420, y: 690, rx: 56, ry: 44, f: [1.7, 2.3] }, { x: 300, y: 700, rx: 48, ry: 38, f: [1.3, 2.1] }], from: -700, to: E * .4 + 1400, starsFrom: -700, starsSpan: E * .4 + 2200 });
  ARCS = MC.buildArcs(r, { from: -900, to: E + 1800, y: FRONTE, gaps: [[E, E + G]] });
  // the gap: lips, strata ticks, a gradient falling away to black
  GAPD = MC.buildGap({ x: E, w: G, top: TOPE, front: FRONTE, base: WL });
  TRAVEL = (() => { const xs = PIECES.map(P => P.x + (P.u0 + P.u1) / 2), x0 = Math.min(...xs) - 120, x1 = Math.max(...xs) + 160, z = clamp(1080 / (x1 - x0), .62, 1.05);
    return { x: (x0 + x1) / 2, y: WL - 230, z }; })();
  // footfall rings (sampled once) — only on the water, never over the gap
  STEPS = MC.footfalls(t => { const set = [poseMe(t).F]; for (let j = 0; j < 3; j++) { const s = pilState(j, t); if (s && s.F && !s.onBridge) set.push(s.F); } return set; },
    { dur: S.DUR, until: 26, onWater: x => x < E || x > E + G });
}
let ctxNow = null;

// the dashed outline of my whole cross over the gap; its missing span (the three piece-lengths) lights slot by slot
function outline(ctx, t, al, full) {
  const X = lying(E - REST, FY - LIE), sh = L * S.left[3];
  const pts = (full ? crossLocal(0, L, 1) : [[sh, -PWL / 2], [L, -PWL / 2], [L, PWL / 2], [sh, PWL / 2]]).map(([u, v]) => xpt(X, u, v));
  ctx.save(); ctx.globalAlpha *= al;
  ctx.fillStyle = 'rgba(241,195,90,.10)'; ctx.fill(pathOf(pts));
  if (full) for (let k = 0; k < 3; k++) { const on = ss(SLOTS[k], SLOTS[k] + .25, t); if (on <= 0) continue;
    const u0 = L * (1 - S.left[k]), u1 = L * (1 - S.left[k + 1]), q = [[u0 + 3, -PWL / 2], [u1 - 3, -PWL / 2], [u1 - 3, PWL / 2], [u0 + 3, PWL / 2]].map(([u, v]) => xpt(X, u, v)), c = xpt(X, (u0 + u1) / 2);
    const pulse = 1 + .35 * Math.exp(-(t - SLOTS[k]) * 4);
    ctx.save(); ctx.globalAlpha *= on * .8; const R = 95 * pulse; ctx.drawImage(MC.GLOW, c[0] - R, c[1] - R * .8, 2 * R, 1.6 * R); ctx.restore();
    ctx.save(); ctx.globalAlpha *= on * .9; ctx.fillStyle = 'rgba(255,214,120,1)'; ctx.fill(pathOf(q)); ctx.restore();
    ctx.save(); ctx.globalAlpha *= on; ctx.setLineDash([7 * MC.LW, 6 * MC.LW]); ctx.lineWidth = 2.6 * MC.LW; ctx.strokeStyle = '#fff6dc'; ctx.stroke(pathOf(q)); ctx.restore(); }
  ctx.setLineDash([16 * MC.LW, 10 * MC.LW]); ctx.lineDashOffset = -t * 14; ctx.lineWidth = 4.2 * MC.LW; ctx.strokeStyle = 'rgba(255,240,205,1)'; ctx.stroke(pathOf(pts)); ctx.setLineDash([]);
  ctx.restore();
}

const DOOR = () => ({ x: GX, gy: BY - 24, w: 92, h: 330, pool: FRONTE });
function world(ctx, t, cm) {
  MC.ledge(ctx, cm, { top: TOPE, front: FRONTE, gaps: [[E, E + G]] });
  ctx.save(); ctx.clip(MC.gapClip(GAPD));
  MC.ripples(ctx, t, ARCS, STEPS);
  const pils = [0, 1, 2].map(j => pilState(j, t)).filter(Boolean), M = poseMe(t);
  for (const P of pils) if (!P.onBridge) drawCatRefl(ctx, P.F, FRONTE);
  if (M.F) drawCatRefl(ctx, M.F, FRONTE);
  ctx.restore();
  MC.drawGap(ctx, t, GAPD);
  MC.door(ctx, t, DOOR(), true);
  // the others (just behind me): bridges (only ever one, its owner's), the cats (those inside the door behind its frame)
  for (const P of pils) if (P.bridge) drawCross(ctx, P.bridge, GREY);
  for (const P of pils) if (P.F.inGate) drawCat(ctx, P.F);
  MC.door(ctx, t, DOOR(), false);
  pils.filter(P => !P.F.inGate).sort((a, b) => a.F.x - b.F.x).forEach(P => drawCat(ctx, P.F));
  // the missing span while my short cross hangs off the lip; the whole outline at the end
  if (t >= 18.65 && t < 19.75) outline(ctx, t, eio((t - 18.65) / .3) * (1 - ss(19.4, 19.75, t)), false);
  if (t >= 22.3) outline(ctx, t, eio((t - 22.3) / .45), true);
  // the saw I left after the last cut
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip; drawSaw(ctx, lerp2(g0, [SAWLIE.x, SAWLIE.y - 10], k), lerp(CUT_ANG, Math.PI - .06, k)); }
  // the cut pieces where they fell: when I look back they glow where they lie (and lit again as their slot lights)
  for (const P of PIECES) if (t >= P.c.drop) {
    const X = pieceAt(P, t), cu = (P.u0 + P.u1) / 2, c = xpt(X, cu);
    const hl = ss(B.back + .3 + P.c.k * .12, B.back + .9 + P.c.k * .12, t) * (.75 + .25 * Math.sin((t - B.back) * 3 + P.c.k)) + .4 * Math.exp(-Math.max(0, t - SLOTS[P.c.k]) * 3) * (t > SLOTS[P.c.k] ? 1 : 0);
    if (hl > 0) { ctx.save(); ctx.globalAlpha = Math.min(1, hl); const R = 165; ctx.drawImage(MC.GLOW, c[0] - R, c[1] - R * .75, 2 * R, 1.5 * R); ctx.restore(); }
    drawCross(ctx, X, HONEY);
  }
  if (M.lieX) { drawCross(ctx, M.lieX, HONEY); if (M.kerf) { ctx.fillStyle = C.ink; ctx.fillRect(M.c.cutX - 1.6, FY - LIE - PWL / 2, 3.2, M.kp * (PWL + PFACE) + .5); } }
  if (M.lay && M.X) drawCross(ctx, M.X, HONEY);
  drawCat(ctx, M.F);
  if (M.c && t >= M.c.drop && t < M.c.drop + .1) { const c = M.c; stroke(ctx, pathOf([[c.cutX - 14, FY - LIE - 30], [c.cutX - 14, FY - LIE + 30]], false), { lw: 2.4, col: '#fff' }); }
  // my short cross over the edge: tips, falls into the dark between the lips, shrinking; the splash at the lip
  const FX = fallX(t);
  if (FX && FX.al > 0) { ctx.save(); if (t >= B.fall) { ctx.beginPath(); ctx.rect(E + 3, TOPE - 600, G - 6, 9000); ctx.clip(); }
    ctx.globalAlpha = FX.al; if (FX.s < 1) { ctx.translate(FX.c[0], FX.c[1]); ctx.scale(FX.s, FX.s); ctx.translate(-FX.c[0], -FX.c[1]); }
    drawCross(ctx, FX.X, HONEY); if (t > B.fall) { ctx.globalAlpha = FX.al * ss(B.fall, B.fall + .9, t) * .85; ctx.fillStyle = '#0a1024'; ctx.fill(pathOf(crossLocal(FX.X.u0, L, 1).map(([u, v]) => xpt(FX.X, u, v)))); }
    ctx.restore(); }
  MC.splash(ctx, t, B.fall, E + 30, FY - LIE);
  // speed lines behind me while I run
  MC.speedLines(ctx, t, M.F, Pilot.win(t, 4.8, 8.7, .2, .25) + Pilot.win(t, 11.4, 12.05, .1, .1));
}

// ---------------- frame ----------------
function draw(ctx, t) {
  ctxNow = ctx;
  const cm = camAt(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); MC.background(ctx);
  MC.drawSky(ctx, cm, SKY);
  ctx.save(); MC.setCam(ctx, cm, 1); world(ctx, t, cm); ctx.restore(); MC.setLW(1);
  // the end: a plain plate of the same blue (the moon, a few rings), the card in the hand font
  MC.endPlate(ctx, t, B.end);
  if (t < B.end) MC.captions(ctx, t, S.lines);
  MC.endCard(ctx, t, S.endCard, B.end);
  MC.grain(ctx);
}

Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: MC.FONTS, init, draw });
</script>
