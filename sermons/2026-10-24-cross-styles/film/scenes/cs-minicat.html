<script>
/* 잘라 낸 건 다리였다 — 09 minimal line + flat blue (the style lab's cat, lab-minicat.html).
   One cornflower-blue field — the whole world is still, shallow water — with a faint paper tooth; a thin steady black
   hand line; small white cats in pyjamas walking on the water, each mirrored below as soft lavender blobs; sparse broken
   ripple arcs; every footfall leaves a ring. I am the white cat in cream pyjamas; the others are paler, grey-lavender cats.
   My cross is the one warm thing (honey wood); the only other warm light is the door across the gap (the lab's sparkler
   glow). The way ends at a rift in the water — a dark crack that runs off into the distance. The medium carries the turn:
   things that land on this water ring, so every cut piece I drop leaves rings and stays floating where it fell; when I
   look back, the pieces catch like sparklers and fly, trailing star sparks, into the dashed outline of my cross. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const C = { field: '#5680bd', lav: '#7c91c8', lavL: '#a9b2d4', moon: '#b3b9c9', ink: '#1a1c28', white: '#fbfcfd', cream: '#f2e8c6', cream2: '#e3d8b4',
  refl: '#8d9bcb', refl2: '#a7afd0', reflW: '#b7ab93',
  pBody: '#dfe2ec', pCloth: '#b9c1dc', pCloth2: '#a6afd0', pX: '#c7cce2', pXf: '#a3abcf',
  honey: '#f1c35a', honeyF: '#cf9a3a', rift: '#2a3d70', rift2: '#16213f', wall: '#3b5291', saw: '#dde1ec', handle: '#d9c39a', light: '#fff3d2' };
const t12 = t => Math.floor(t * 12 + 1e-6) / 12;
const frac = x => x - Math.floor(x);
let LW = 1;   // 1 / zoom: the hand line stays ~3 px on screen at any zoom

// ---------------- hand line (steady: a fixed tremor, no boil) ----------------
const wob = (p, a = 1) => [p[0] + (noise(p[0] * .05 + 40, p[1] * .05) - .5) * 1.6 * a, p[1] + (noise(p[0] * .05, p[1] * .05 + 90) - .5) * 1.6 * a];
function chaikin(pts, closed, it = 3) {

    for (let i = 0; i < m; i++) { const a = pts[i], b = pts[(i + 1) % n]; o.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); }
    if (!closed) o.push(pts[n - 1]); pts = o; }

}

    for (let j = 0; j < k; j++) o.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]); }

}

function inkPts(pts, o = {}) { const closed = o.closed !== false, sm = o.smooth !== false && pts.length > 2;
  return resample(sm ? chaikin(pts, closed, o.it ?? 3) : pts, closed, o.step || 9).map(p => wob(p, o.amp ?? 1)); }
function stroke(ctx, path, o) { ctx.strokeStyle = o.col || C.ink; ctx.lineWidth = (o.lw || 3) * LW; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(path); }
// o.part = [from, to] (0..1 along the outline): stroke only that stretch (the reflections' half-outline)
function ink(ctx, pts, o = {}) {

  if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(path); }
  if (o.lw !== 0) {
    if (o.part) { const n = P.length, a = Math.floor(o.part[0] * n), b = Math.floor(o.part[1] * n), q = []; for (let i = a; i <= b; i++) q.push(P[((i % n) + n) % n]); stroke(ctx, pathOf(q, false), o); }
    else stroke(ctx, path, o); }
  return path;
}
// a static shape, built once: { fill path, line path }
function shape(pts, o = {}) { const closed = o.closed !== false, P = inkPts(pts, o), f = pathOf(P, closed); let l = f;
  if (o.part) { const n = P.length, a = Math.floor(o.part[0] * n), b = Math.floor(o.part[1] * n), q = []; for (let i = a; i <= b; i++) q.push(P[((i % n) + n) % n]); l = pathOf(q, false); }
  return { f, l, fill: o.fill, lw: o.lw ?? 3, col: o.col }; }
function drawShape(ctx, s) { if (s.fill) { ctx.fillStyle = s.fill; ctx.fill(s.f); } if (s.lw) stroke(ctx, s.l, { lw: s.lw, col: s.col }); }
const ell = (cx, cy, rx, ry, n = 24, a0 = 0) => { const o = []; for (let i = 0; i < n; i++) { const a = a0 + i / n * TAU; o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return o; };
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
function tube(line, wd) {
  const L = [], R = [];
  for (let i = 0; i < line.length; i++) { const a = line[Math.max(0, i - 1)], b = line[Math.min(line.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    L.push([line[i][0] - dy * wd[i], line[i][1] + dx * wd[i]]); R.push([line[i][0] + dy * wd[i], line[i][1] - dx * wd[i]]); }
  return L.concat(R.reverse());
}
function blobPts(cx, cy, rx, ry, seed, n = 18) { const r = rng(seed), o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU, k = .72 + r() * .5 + .18 * Math.sin(a * 3 + seed);
  o.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k * (.8 + .4 * r())]); } return o; }
function arc(ctx, cx, cy, rx, ry, a0, a1, lw = 2.6, col = C.ink) {
  const pts = []; for (let i = 0; i <= 18; i++) { const a = a0 + (a1 - a0) * i / 18; pts.push(wob([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry])); }
  stroke(ctx, pathOf(pts, false), { lw, col });
}

// ---------------- the world's measures ----------------
const CS = 1.3;                                       // every cat is drawn at the lab's size
const L = 540, PW = 30, CBX = 400, CBH = 92, CBW = 30; // a cross: post length/width, crossbar at CBX (from the foot), half-length, width
const PWL = 18, PFACE = 9, CBHL = 40;                  // lying flat: the post's top face, its front face, the crossbar foreshortened
const REST = 34, G = L - 2 * REST;                     // a whole cross rests 34 on each lip: the gap is G wide
const FY = 1265, BY = 1150, LIE = 28;                  // front lane (me), back lane (the others); a laid cross lies LIE behind its lane
const HONEY = { f: C.honey, face: C.honeyF }, GREY = { f: C.pX, face: C.pXf };
let E = 1500, GX = 0;                                  // the gap's near lip (set from my path), the door

// ---------------- crosses ----------------
// X = { x, y, a, k, u0, u1 } — (x, y) the foot end (u = 0), a the post's angle (foot → top), k: 0 upright … 1 lying flat
function crossLocal(u0, u1, k) {
  const hb = lerp(CBH, CBHL, k), pw = lerp(PW, PWL, k) / 2, bar = u0 < CBX - CBW / 2 && u1 > CBX + CBW / 2, o = [[u0, -pw]];
  if (bar) o.push([CBX - CBW / 2, -pw], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -pw]);
  o.push([u1, -pw], [u1, pw]);
  if (bar) o.push([CBX + CBW / 2, pw], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, pw]);
  o.push([u0, pw]); return o;
}
const xpt = (X, u, v = 0) => { const c = Math.cos(X.a), s = Math.sin(X.a); return [X.x + u * c - v * s, X.y + u * s + v * c]; };
function drawCross(ctx, X, pal, o = {}) {
  const u0 = X.u0 || 0, u1 = X.u1 ?? L; if (u1 - u0 < 1) return;
  const k = X.k || 0, loc = crossLocal(u0, u1, k), pts = loc.map(([u, v]) => xpt(X, u, v));
  if (o.refl) { ink(ctx, pts, { fill: o.refl, smooth: false, part: [.15, .6] }); return; }
  if (k > .05) { const dy = PFACE * k; ink(ctx, pts.map(p => [p[0], p[1] + dy]), { fill: pal.face, smooth: false }); }
  ink(ctx, pts, { fill: pal.f, smooth: false });
  // wood grain: a couple of short strokes and a knot along the post
  ctx.save(); ctx.globalAlpha *= .55;
  for (const [ua, ub, v] of [[60, 150, -.18], [230, 330, .2], [CBX + 40, CBX + 110, -.1]]) if (ua > u0 + 6 && ub < u1 - 6)
    ink(ctx, [xpt(X, ua, v * PW * lerp(1, .55, k)), xpt(X, ub, v * PW * lerp(1, .55, k))], { closed: false, lw: 1.6, smooth: false });
  ctx.restore();
}
function rotAbout(X, pv, th) { const ox = X.x - pv[0], oy = X.y - pv[1]; return { ...X, x: pv[0] + ox * Math.cos(th) - oy * Math.sin(th), y: pv[1] + ox * Math.sin(th) + oy * Math.cos(th), a: X.a + th }; }
const mixX = (A, B, k) => k <= 0 ? A : k >= 1 ? B : { ...B, x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k), a: lerp(A.a, B.a, k), k: lerp(A.k || 0, B.k || 0, k) };
const lying = (x, y, u0 = 0, u1 = L) => ({ x, y, a: 0, k: 1, u0, u1 });

// ---------------- the cat (the lab's cat, any pose) ----------------
// F = { x, gy, f (+1 faces right), lean, head, bob, crouch, feet:[far, near], hands:[far, near] (world points or null), face, pal, alpha,
//       strap ('hold' | 'wrap' | null), back(), mid() } — back() draws behind everything, mid() between the body and the near arm
const MEPAL = { body: C.white, c1: C.cream, c2: C.cream2 }, PILPAL = { body: C.pBody, c1: C.pCloth, c2: C.pCloth2 };
function frameOf(F) {
  const a = F.lean || 0, f = F.f, up = [f * Math.sin(a), -Math.cos(a)], fw = [f * Math.cos(a), Math.sin(a)];
  const hip = [F.x, F.gy - (46 + (F.bob || 0) - (F.crouch || 0)) * CS];
  const TF = (u, v) => [hip[0] + (u * fw[0] + v * up[0]) * CS, hip[1] + (u * fw[1] + v * up[1]) * CS];
  const ha = a * .5 + (F.head || 0), hu = [f * Math.sin(ha), -Math.cos(ha)], hf = [f * Math.cos(ha), Math.sin(ha)];
  const nk = TF(6, 80), hc = [nk[0] + (hu[0] * 50 + hf[0] * 6) * CS, nk[1] + (hu[1] * 50 + hf[1] * 6) * CS];
  const HF = (u, v) => [hc[0] + (u * hf[0] + v * hu[0]) * CS, hc[1] + (u * hf[1] + v * hu[1]) * CS];
  return { hip, TF, HF, hc, up, fw, f, a };
}
function ik(h, ft, l1, l2, bend) {
  const dx = ft[0] - h[0], dy = ft[1] - h[1], d = Math.max(1, Math.min(Math.hypot(dx, dy), l1 + l2 - .5)), a = Math.atan2(dy, dx);
  const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  return [h[0] + Math.cos(a - bend * al) * l1, h[1] + Math.sin(a - bend * al) * l1];
}
const TORSO = [[-36, -8], [-40, 36], [-34, 70], [-14, 82], [16, 82], [34, 70], [42, 36], [40, -8], [0, -12]];
const HEAD = [[-54, -10], [-56, 14], [-52, 34], [-46, 62], [-30, 44], [0, 46], [24, 46], [44, 64], [52, 34], [58, 12], [56, -12], [38, -34], [0, -40], [-36, -34]];
const COLLAR = [[-30, 8], [-12, -4], [0, 6], [14, -4], [32, 8], [14, 20], [0, 12], [-14, 20]];
function armOf(Fr, F, near) {
  const { TF, f } = Fr, sh = near ? TF(-8, 64) : TF(4, 66);
  let hand = F.hands && F.hands[near ? 1 : 0];
  if (!hand) hand = near ? TF(6, 16) : TF(14, 18);
  const el = ik(sh, hand, 27 * CS, 27 * CS, -f);
  return { sh, el, hand };
}
function drawArm(ctx, Fr, F, near, col) {
  const { sh, el, hand } = armOf(Fr, F, near), d = [hand[0] - el[0], hand[1] - el[1]], n = Math.hypot(...d) || 1;
  ink(ctx, tube([sh, el, hand, [hand[0] + d[0] / n * 5 * CS, hand[1] + d[1] / n * 5 * CS]], [13 * CS, 12 * CS, 11 * CS, 8 * CS]), { fill: col, lw: 2.8 });
  ink(ctx, ell(hand[0] + d[0] / n * 4, hand[1] + d[1] / n * 4, 8.5 * CS, 7.5 * CS, 12), { fill: F.pal.body, lw: 2.4 });
  if (near && F.grip) {   // the thumb over the handle
    const q = [hand[0] - d[1] / n * 4 * CS * Fr.f, hand[1] + d[0] / n * 4 * CS * Fr.f];
    ink(ctx, [[q[0] - 5 * CS, q[1] - 3 * CS], [q[0] + 2 * CS, q[1] - 5 * CS], [q[0] + 7 * CS, q[1] - 1 * CS]], { closed: false, lw: 2 });
  }
}
function drawCat(ctx, F) {
  const al = F.alpha ?? 1; if (al <= 0) return; if (!F.pal) F.pal = MEPAL;
  ctx.save(); ctx.globalAlpha *= al;
  const Fr = frameOf(F), { hip, TF, HF, f } = Fr, P = F.pal;
  if (F.back) F.back(Fr);
  drawArm(ctx, Fr, F, false, P.c2);
  for (const [i, dx, col] of [[0, -8, P.c2], [1, 6, P.c1]]) {
    const ft = F.feet[i], hp = [hip[0] + dx * f * CS, hip[1]], ank = [ft[0] + dx * .6 * f * CS, ft[1] - 8 * CS], kn = ik(hp, ank, 25 * CS, 25 * CS, f);
    ink(ctx, ell(ank[0] + 3 * f * CS, ank[1] + 2 * CS, 13 * CS, 8 * CS, 14), { fill: P.body, lw: 2.8 });
    ink(ctx, tube([[hp[0], hp[1] - 10 * CS], kn, [ank[0], ank[1] - 2 * CS]], [17 * CS, 16 * CS, 14 * CS]), { fill: col, lw: 2.8 });
  }
  ink(ctx, TORSO.map(q => TF(q[0], q[1])), { fill: P.c1 });
  if (F.strap) {   // the strap that holds the cross on the back, over the near shoulder
    const s = F.strap === 'hold' ? [TF(-34, 72), TF(-6, 86), TF(20, 78), TF(28, 52), TF(22, 24)] : [TF(-34, 72), TF(-6, 86), TF(20, 78), TF(30, 50), TF(30, 22), TF(18, 4)];
    ink(ctx, s, { closed: false, lw: 6, col: C.ink }); ink(ctx, s, { closed: false, lw: 2.6, col: C.white });
  }
  ctx.fillStyle = P.c1; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.8 * LW;
  for (const v of [24, 48]) { const q = TF(30, v); ctx.beginPath(); ctx.arc(q[0], q[1], 3.6 * CS, 0, TAU); ctx.fill(); ctx.stroke(); }
  ink(ctx, COLLAR.map(q => TF(q[0] + 4, q[1] + 78)), { fill: P.body, lw: 2.6 });
  ink(ctx, HEAD.map(q => HF(q[0], q[1])), { fill: P.body });
  ink(ctx, [HF(-36, 38), HF(-30, 28)], { closed: false, lw: 2.2 }); ink(ctx, [HF(30, 38), HF(26, 28)], { closed: false, lw: 2.2 });
  face(ctx, Fr, F.face || 'calm');
  if (F.mid) F.mid(Fr);
  drawArm(ctx, Fr, F, true, P.c1);
  if (F.front) F.front(Fr);
  ctx.restore();
}
function face(ctx, Fr, fc) {
  const { HF } = Fr; ctx.fillStyle = C.ink;
  const dot = (u, v, r = 1) => { const e = HF(u, v); ctx.beginPath(); ctx.ellipse(e[0], e[1], 3.6 * CS * r, 4.4 * CS * r, 0, 0, TAU); ctx.fill(); };
  if (fc === 'strain') for (const u of [-6, 30]) ink(ctx, [HF(u - 6, -7), HF(u, -10), HF(u + 6, -7)], { closed: false, lw: 2.4 });
  else if (fc === 'down') for (const u of [-6, 30]) ink(ctx, [HF(u - 6, -6), HF(u, -9), HF(u + 6, -6)], { closed: false, lw: 2.4 });
  else if (fc === 'happy') for (const u of [-6, 30]) ink(ctx, [HF(u - 6, -8), HF(u, -2), HF(u + 6, -8)], { closed: false, lw: 2.4 });
  else for (const u of [-6, 30]) dot(u, -2, fc === 'shock' ? 1.2 : 1);
  // worried brows on strain / shock / down
  if (fc === 'strain' || fc === 'down' || fc === 'shock') { ink(ctx, [HF(-12, 14), HF(-4, 18)], { closed: false, lw: 2 }); ink(ctx, [HF(26, 18), HF(34, 14)], { closed: false, lw: 2 }); }
  const mo = HF(13, -18);
  if (fc === 'shock' || fc === 'look') { ctx.beginPath(); ctx.ellipse(mo[0], mo[1], (fc === 'shock' ? 3.6 : 2.8) * CS, (fc === 'shock' ? 4.6 : 3.4) * CS, 0, 0, TAU); ctx.fill(); }
  else if (fc === 'happy') ink(ctx, [HF(8, -16), HF(13, -21), HF(18, -16)], { closed: false, lw: 2 });
  else ink(ctx, [HF(9, -18), HF(13, -20), HF(17, -18)], { closed: false, lw: 2 });
  for (const s of [-1, 1]) { const o = s < 0 ? HF(-46, -12) : HF(52, -10), dx = s * Fr.f;
    ink(ctx, [o, [o[0] + dx * 26 * CS, o[1] - 4 * CS]], { closed: false, lw: 1.8 }); ink(ctx, [[o[0], o[1] + 6 * CS], [o[0] + dx * 24 * CS, o[1] + 10 * CS]], { closed: false, lw: 1.8 }); }
}
// the reflection: the same figure flipped about its water line, simplified into lavender blobs
function drawCatRefl(ctx, F, Xs) {
  const al = (F.alpha ?? 1) * .95; if (al <= 0) return;
  ctx.save(); ctx.globalAlpha *= al; ctx.translate(0, 2 * F.gy + 6); ctx.scale(1, -1);
  const Fr = frameOf(F), { TF, HF } = Fr;
  for (const X of Xs) if (X) drawCross(ctx, X.X, null, { refl: X.me ? C.reflW : C.refl2 });
  ink(ctx, tube([TF(-6, 2), TF(-6, -34)], [24 * CS, 22 * CS]), { fill: C.refl2, lw: 0 });
  ink(ctx, [[-40, 0], [-44, 50], [-36, 84], [30, 86], [44, 52], [40, 0]].map(q => TF(q[0], q[1])), { fill: C.refl, lw: 3, part: [.5, 1.0] });
  ink(ctx, blobPts(Fr.hc[0], Fr.hc[1], 56 * CS, 46 * CS, 2, 14), { fill: C.refl2, lw: 3, part: [.45, .95] });
  ctx.restore();
}

// ---------------- carrying ----------------
// on the back: the strap holds the post at the back of the near shoulder; the post rises forward-up past the head, so the
// crossbar stands clear above it; a whole cross drags its foot on the water; a shortened one hangs clear of it
const BETA = 1.2;
function backCarry(Fr, gy, u0) {
  const { TF } = Fr, P0 = TF(-36, 74), P1 = TF(-36 + Math.cos(BETA) * 10, 74 + Math.sin(BETA) * 10);
  const d = [(P1[0] - P0[0]) / (10 * CS), (P1[1] - P0[1]) / (10 * CS)], a = Math.atan2(d[1], d[0]);
  const reach = (gy - P0[1]) / Math.max(.2, -d[1]);   // along the post from the strap down to the water
  const sc = Math.max(reach, u0 + 32);
  return { x: P0[0] - d[0] * sc, y: P0[1] - d[1] * sc, a, k: 0, u0, u1: L };
}
// in the hand at my side (only the short cross, after the last cut): held under the arm, the crossbar ahead of me
function sideCarry(F, u0) {
  const f = F.f, len = L - u0, yy = F.gy - 100 - (F.bob || 0) * CS * .6;
  const x0 = F.x + f * (95 * 1 - (CBX - u0));   // the crossbar sits ~95 ahead of my hip
  return f > 0 ? { x: x0 - u0, y: yy, a: 0, k: 0, u0, u1: L } : { x: x0 + u0, y: yy, a: Math.PI, k: 0, u0, u1: L };
}

// ---------------- my path (integrated once), the cuts ----------------
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 40 * (1 + .55 * Math.sin(t * TAU / 1.3 - 1));          // trudging, staggering
  if (t < 4.6) return 0;
  if (t < 5.0) return 215 * eio((t - 4.6) / .4);                              // lighter: big quick hops
  if (t < 8.3) return 215;
  if (t < 8.6) return lerp(215, 90, (t - 8.3) / .3);
  if (t < 9.0) return 90 * (1 - ss(8.6, 9.0, t));
  if (t < 9.95) return 0;
  if (t < 10.35) return 76 * Math.PI / (2 * .4) * Math.sin(Math.PI * (t - 9.95) / .4);   // scoot along the lying cross: exactly one more piece
  if (t < 11.35) return 0;
  if (t < 12.0) return 560 * Math.sin(Math.PI * (t - 11.35) / .65);
  return 0;

    for (let i = 0; i < 5; i++) { const R = 330 + i * 70 + (t - B.end) * 6; arc(ctx, 540, 1360, R, R * .3, .5 + i * .9, .9 + i * .9, 2.6); } ctx.restore(); }
  if (t < B.end) Story.captions(ctx, t, S.lines, { font: HAND, weight: 400, size: 74, y: 410, color: C.ink, srcColor: '#20243a', shadow: 'rgba(86,128,189,.95)', shadowBlur: 16 });
  ctx.save(); ctx.translate(540, 820); ctx.scale(1.18, 1.18); ctx.translate(-540, -820);
  Story.endCard(ctx, t, S.endCard, B.end, { font: HAND, color: C.ink, srcFont: HAND, srcColor: '#22263c', y: 820, titleShadow: '' });
  ctx.restore();
  ctx.drawImage(GRAIN, 0, 0);
}

Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 80px 'Hi Melody'", "500 28px 'Noto Sans KR'"], init, draw });
