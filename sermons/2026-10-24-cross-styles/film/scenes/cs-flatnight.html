<script>
/* 잘라 낸 건 다리였다 — 04 flat vector night forest (from lab-flatnight).
   Every surface is one flat fill of blue/indigo, no outlines, no gradients; depth is value steps between parallax layers.
   Light is a hard-edged disc that shows the world in its "lit" palette. In the lab the disc came from a red lantern; here
   MY CROSS is the lantern: red frame, pale glass core — the one accent — and its disc of light walks with me.
   The style carries the turn: every cut makes my light smaller, and each piece I saw off keeps a little disc of its own on
   the road behind me. The others walk in the dark (quiet purple crosses) and step into the gate's light. When my short
   cross falls, my light falls with it into the chasm — the frame goes dark. I turn: the little lights behind me swell,
   lift and fly into the dashed outline over the gap, and the whole span lights up again.
   The style (palettes, flat shapes, parallax forest, light discs, the traveller rig, road/chasm/gate, captions) lives in
   kit-flatnight.js (styles/flatnight/); this file keeps only the story: the timeline, the cuts, the saw, the poses,
   the others, the camera, the light pools, and the world's order of drawing. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;

const { DK, LT, FLAME } = FN, ME = FN.FIG.me, PI = FN.FIG.other, MX = FN.WOOD, PX = FN.WOOD_COLD;   // my cross = the warm accent; the others' = cold purple
const SAW = { l: { bl: '#c9d0ff', bl2: '#97a3f5', h: '#3b137a', h2: '#1c0748' }, d: { bl: '#5560c0', bl2: '#3f49a6', h: '#22094f', h2: '#120430' } };

const GEO = FN.crossGeo({ L: 520, PW: 36, CBX: 442, CBW: 34, CBH: 86, CBHL: 40 }), { L, PW, CBX } = GEO;   // cross: post length, width; crossbar (from foot)
const FY = 1300, BY = 1252, RT = 1212;                                    // front lane (me), back lane (the others), road's far edge
const REST = 26, G = L - 2 * REST;                                        // a full cross rests 26 px on each lip: the chasm is G wide
const backEase = u => 1 + 2.70158 * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2);
const drawCross = (ctx, K, u0, u1, x, y, a, lying, alpha) => FN.cross(ctx, K, GEO, u0, u1, x, y, a, lying, alpha);
const { frame, shoulderOf, hangHands, cpt, mixX, rotAbout, hangGrip } = FN, drawFig = FN.figure;

let FOREST;

// ---------------- timeline: my path (integrated once), the cuts ----------------
const SME = 1.04, SPI = .95;
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 44 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1));        // staggering
  if (t < 4.6) return 0;
  if (t < 5.0) return 390 * eio((t - 4.6) / .4);                            // lighter: big quick strides
  if (t < 8.3) return 390;
  if (t < 8.6) return lerp(390, 150, (t - 8.3) / .3);
  if (t < 9.0) return 150 * (1 - ss(8.6, 9.0, t));
  if (t < 10.0) return 0;
  if (t < 10.4) return 450 * Math.sin(Math.PI * (t - 10) / .4);
  if (t < 11.35) return 0;

}
const strideMe = t => t < 4.6 ? 112 : t < 8.8 ? 262 : 170;
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };

const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const FILL = [[22.2, 23.3], [22.65, 23.7], [23.1, 24.1]];
const FLECKS = [];
let SAWLIE = null, E = 1600, GX = 0;
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }

  CUTS.forEach((c, k) => {
    c.k = k; c.mx = meX(c.s); c.cutX = c.mx - 142 * SME; c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.baseX = c.cutX - c.u1; c.y = FY + 26;
    const r = rng(100 + k);
    for (let n = 0; n < 16; n++) FLECKS.push({ t0: n < 11 ? lerp(c.saw0, c.drop, n / 11) : c.drop + r() * .05, x: c.cutX + (r() - .5) * 8, y: c.y - PW / 2,
      vx: (r() - .5) * (n < 11 ? 180 : 320), vy: -(80 + r() * (n < 11 ? 160 : 260)), land: FY + 18 + r() * 44, r0: r() * TAU, vr: (r() - .5) * 20, sz: 4 + r() * 5, col: '#e8b070' });
  });

}
function pieceAt(c, t) {
  const sh = 18 * eo((t - c.drop) / .25), y0 = c.y, cu = (c.u0 + c.u1) / 2;
  let cx = c.baseX + cu - sh, cy = y0, a = -.05 * eo((t - c.drop) / .25);
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, cx, cy };
}


// ---------------- the saw ----------------
const CUT_ANG = Math.PI - .6, hangAng = f => Math.atan2(.95, .3 * f);
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];

function sawState(c, t) {

}
function drawSaw(ctx, grip, ang, Cs) {
  const { d, up, heel } = sawGeo(grip, ang);
  const P = (u, v) => [heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v];
  const poly = (pts, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(...pts[0]); for (const p of pts.slice(1)) ctx.lineTo(...p); ctx.closePath(); ctx.fill(); };
  const blade = [P(0, 30), P(172, 18)]; for (let u = 172; u >= 0; u -= 9) blade.push(P(u, (u / 9 | 0) % 2 ? 2 : -4));
  poly(blade, Cs.bl);
  const low = [P(0, 9), P(172, 8)]; for (let u = 172; u >= 0; u -= 9) low.push(P(u, (u / 9 | 0) % 2 ? 2 : -4));
  poly(low, Cs.bl2);
  ctx.fillStyle = Cs.bl2; ctx.beginPath(); ctx.arc(...P(152, 18), 4.5, 0, TAU); ctx.fill();
  poly([P(-4, 38), P(-40, 48), P(-54, 20), P(-42, -6), P(-6, 0)], Cs.h);
  poly([P(-14, 30), P(-34, 36), P(-42, 20), P(-34, 8), P(-14, 12)], Cs.h2);
}
function sawSpec(c, t) {
  const f = -1, mx = c.mx, s = SME, st = sawState(c, t);
  return { s, f, gy: FY, hip: [mx, FY - 44 * s], ang: f * .62, feet: [[mx + 66 * s, FY], [mx - 44 * s, FY]], hands: [st.grip, [c.cutX + 116 * s, c.y - PW / 2 + 5]],
    hand: ['fist', 'flat'], tilt: .35, eye: 'calm', sway: 0, farFront: true };
}

function poseMe(t) {
  const tp = t, dx = 0, left = leftAt(t);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const F = walkSpec(x, FY, SME, 1, ph, 112, .3 + .1 * Math.sin(tt * TAU / 1.15), 16); F.eye = 'strain'; F.tilt = .14; F.hip[1] += 6 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, -.6 + .07 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt); const F = walkSpec(x, FY, SME, 1, ph, lerp(112, 262, k), lerp(.16, .32, k), lerp(20, 58, k)); F.hip[1] += 8 * k; F.sway *= 1 + 1.5 * k; return [F, -.62]; }
    const F = walkSpec(x, FY, SME, 1, ph, 170, .16, 34); return [F, -.6];
  };
  const sawHeld = t < CUTS[2].drop;

  const holdUp = (F, lf) => { const u0 = L * (1 - lf), X = { x: F.hip[0] + 96 * F.s, y: FY - 2 + u0, a: -Math.PI / 2, u0, lie: false, held: true };
    F.hands = [hangHands(F)[0], cpt(X, CBX - 40, 4)]; F.hand = ['fist', 'fist']; F.farOver = false; return [F, X]; };
  const carried = (F, a0, lf, held) => { const X = carryCross(F, lf, lf < 1 ? -.4 : a0); gripCarry(F, X);   // lighter: carried flatter (a tilted short cross must never read as an X)
    if (held) { F.hands[1] = hangGrip(F, F.ph != null ? 18 * Math.sin(TAU * F.ph) : 0); }
    return [F, X]; };
  for (const c of CUTS) {
    if (t >= c.s && t < c.up1) {
      const lf0 = S.left[c.k], lf1 = S.left[c.k + 1], [W0, a0] = walk(c.s, c.mx), [W1, a1] = walk(c.up1, c.mx), last = c.k === 2;
      const [WA, XA] = carried(W0, a0, lf0, true), [WB, XB] = last ? holdUp(W1, lf1) : carried(W1, a1, lf1, true);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      if (t < c.s + c.d) { const k = eio((tp - c.s) / c.d), F = mixSpec(WA, SP, k);
        F.hands[rIdx(F)] = [lerp(WA.hands[1][0], cg[0], k), lerp(WA.hands[1][1], cg[1], k)];
        const Xm = { ...mixX(XA, XL, k), lie: k > .8 }, onX = cpt(Xm, CBX, 58 * (1 - k)), k2 = ss(.55, 1, k);   // the hand rides the crossbar down, then slides to the beam
        F.hands[lIdx(F)] = [lerp(onX[0], SP.hands[1][0], k2), lerp(onX[1], SP.hands[1][1], k2)];
        F.hand = F.f > 0 ? ['fist', 'fist'] : ['fist', 'flat'];
        return { F, X: Xm, c, saw: { grip: F.hands[rIdx(F)], ang: lerp(hangAng(1), CUT_ANG, k) } }; }

      const k = eio((tp - c.drop) / (c.up1 - c.drop)), F = mixSpec(SP, WB, k);
      const rT = WB.hands[1], lT = WB.hands[0];
      const Xm = { ...mixX(XL, XB, k), lie: k < .2 }, k1 = ss(0, .4, k), onX = last ? cpt(Xm, CBX - 40, 4) : cpt(Xm, CBX, 58 * k);   // one hand: the saw (to my hip); the other: the cross
      F.hands[rIdx(F)] = last ? [lerp(SP.hands[1][0], onX[0], k1), lerp(SP.hands[1][1], onX[1], k1)] : [lerp(cg[0], rT[0], k), lerp(cg[1], rT[1], k)];
      F.hands[lIdx(F)] = last ? hangHands(F)[lIdx(F)] : [lerp(SP.hands[1][0], onX[0], k1), lerp(SP.hands[1][1], onX[1], k1)];
      F.hand = ['fist', 'fist'];
      const saw = last ? null : { grip: F.hands[rIdx(F)], ang: lerp(CUT_ANG, hangAng(1), k) };

    }
  }

  if (t < 18.4) { const [F0] = walk(12, E - 52), k = eio((tp - 12) / .3);
    const bx = -150 * eio((tp - 12.9) / .7) + 52 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.85, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.65, 17.55, .12, .12));
    const STx = mv > 0 ? mixSpec(standSpec(E - 52 + bx, FY, SME, 1, .08), walkSpec(E - 52 + bx, FY, SME, 1, (E + bx) / 150, 150, .1, 24), mv) : standSpec(E - 52 + bx, FY, SME, 1, .08);
    const F = mixSpec(F0, STx, k);
    F.ang += .16 * Math.sin(Math.PI * clamp((tp - 12) / .5)) * (tp < 12.5 ? -1 : 0); F.eye = tp < 13.2 ? 'shock' : 'calm';
    const [G2, X] = holdUp(F, left); return { F: G2, X }; }
  const u0L = L * (1 - left), XLay = { x: E - REST - u0L, y: FY + 34, a: 0, u0: u0L, lie: true };
  const LAY = { ...standSpec(E - 66, FY, SME, 1), hip: [E - 70, FY - 58 * SME], ang: 1.0, feet: [[E - 110, FY], [E - 26, FY]], tilt: .25 };   // kneeling at the lip, leaning over
  const onBeam = X => [cpt(X, X.u0 + 40, -PW / 2 - 4), cpt(X, X.u0 + 100, -PW / 2 - 4)];
  LAY.hands = onBeam(XLay); LAY.hand = ['flat', 'flat'];
  const REACH = { ...LAY, hip: [E - 72, FY - 112 * SME], ang: .5, hands: [[E - 170, FY - 100], [E + 70, FY - 10]], hand: ['fist', 'open'], eye: 'shock', tilt: .4 };
  if (t < 19.45) {
    if (t < 18.95) {   // tip it forward about its foot (hand sliding down the shaft), then slide it out onto the lip
      const ST = standSpec(E - 150, FY, SME, 1, .08), STc = holdUp(ST, left), k = eio((tp - 18.4) / .4), k1 = eio(clamp((tp - 18.4) / .38)), k2 = eio(clamp((tp - 18.7) / .25));
      const pv = [lerp(STc[1].x, E - REST, k2), lerp(FY - 2, FY + 34, k2)], a = lerp(-Math.PI / 2, 0, k1);
      const X = { x: pv[0] - Math.cos(a) * u0L, y: pv[1] - Math.sin(a) * u0L, a, u0: u0L, lie: k1 > .6 };
      const F = mixSpec(STc[0], LAY, k), hb = onBeam(X), hs = cpt(X, lerp(CBX - 40, u0L + 100, k1), lerp(4, -PW / 2 - 4, k1));

  const UP = { ...standSpec(E - 52, FY, SME, 1, .06), tilt: .1, eye: 'calm' };
  if (t < B.back + .25) return { F: mixSpec(REACH, UP, eio((tp - B.back) / .25)), X: null };   // rise…
  if (t < 22.45) return { F: mixSpec(UP, BACK, eio((tp - B.back - .25) / .18)), X: null };     // …then turn

function fallX(t) {

  return { ...X1, x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, alpha: 1 - ss(B.fall + .7, B.fall + 1.05, t), clip: true, cx, cy };

// ---------------- the others ----------------
const PIL = [{ x0: -470, ph: .3 }, { x0: -230, ph: .75 }, { x0: 190, ph: .1 }, { x0: 430, ph: .55 }];
const BRIDGE_Y = [BY - 6, BY + 4, BY + 14], PULL = 210;
function pilState(i, t) {
  const tp = t, P = PIL[i], j = 3 - i, T = j < 3 ? B.bridges[j] : 99, yb = BRIDGE_Y[j] ?? BY;
  const xAt = tt => { if (tt <= 9 || j > 2) return P.x0 + 52 * tt; const xa = P.x0 + 468, xb = E - 430 - 120 * j, xc = E - 46;
    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, eio(clamp((tt - (T - 1.3)) / .95))); };
  const carry = (tt, x, gy = BY, stride = 118, lean = .27) => { const F = walkSpec(x, gy, SPI, 1, P.ph + x / (stride * SPI), stride, lean, 18); F.tilt = .1; F.eye = 'closed'; const X = carryCross(F, 1, -.5); gripCarry(F, X); return [F, X]; };
  if (j > 2) { if (t >= 12) return null; const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  if (t < T - .35) { const [F, X] = carry(tp, xAt(tp)); return { F, X }; }

  const LAY = { ...standSpec(E - 46, BY, SPI, 1), hip: [E - 56, BY - 70 * SPI], ang: .95, feet: [[E - 96, BY], [E - 22, BY]], tilt: .2 };
  const shaft = X => [cpt(X, 95, -PW / 2 - 3), cpt(X, 30, -PW / 2 - 3)];
  LAY.hands = shaft(XB); LAY.hand = ['fist', 'fist'];
  if (t < T) { const [F0, X0] = carry(T - .35, E - 46), k = eio((tp - T + .35) / .35), X = mixX(X0, XB, k), F = mixSpec(F0, LAY, k), on = shaft(X), kh = ss(0, .35, k);
    F.hands = [0, 1].map(i => [lerp(F0.hands[i][0], on[i][0], kh), lerp(F0.hands[i][1], on[i][1], kh)]); F.hand = ['fist', 'fist']; return { F, X }; }

    const k0 = eio((tp - T - .9) / .1); return { F: k0 < 1 ? mixSpec(walkSpec(xs1, BY, SPI, 1, 0, 170, .1), F, k0) : F, X }; }
  const [Fp, Xp] = PULLS(1), xg = xpAt(1);
  const XH = { ...Xp, x: Xp.x + 20, y: Xp.y - 70, a: Xp.a - .28 }, HOLD = { ...standSpec(xg + 4, BY, SPI, -1, .06), tilt: .05, hands: [cpt(XH, L - 40), cpt(XH, L - 96)] };   // stand, holding the beam end
  if (t < T + 1.4) { const k = eio((tp - T - 1.25) / .15); return { F: mixSpec(Fp, HOLD, k), X: mixX(Xp, XH, k) }; }
  if (t < T + 1.6) { const k = eio((tp - T - 1.4) / .2), [Fc, Xc] = carry(T + 1.6, xg, BY, 150, .2); return { F: mixSpec(HOLD, Fc, k), X: mixX(XH, Xc, k) }; }   // turn and hoist
  const x = lerp(xg, GX + 10, clamp((tp - T - 1.6) / .3)), [F, X] = carry(tp, x, BY, 150, .2);
  F.alpha = 1 - ss(T + 1.65, T + 1.88, t); F.inGate = x > GX - 110; if (F.alpha <= 0) return null;
  return { F, X };
}

// ---------------- camera ----------------
const mixCam = FN.mixCam;
function camAt(t) {
  let c = { x: meX(t) + 60 + 90 * ss(4.3, 5.4, t), y: 1040, z: 1.03 };
  c = mixCam({ x: meX(t) + 30, y: 1000, z: 1.6 }, c, eio((t - 1.5) / 1.1));
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: (cc.mx + cc.cutX) / 2 - 10, y: 1120, z: 1.32 });
  c = mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = mixCam(c, mixCam(at(c2), at(c3), eio((t - 10.0) / .45)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));
  if (t >= 12) c = mixCam(c, { x: E + 300, y: 915, z: .8 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = mixCam(c, { x: E + 160, y: 1110, z: 1.1 }, eio((t - 18.2) / .45));
  if (t >= B.fall) c = mixCam(c, { x: E + 160, y: 1200, z: 1.34 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .65) c = mixCam(c, { x: E + 150, y: 1060, z: 1.0 }, eio((t - B.fall - .65) / .7));
  if (t >= B.back) c = mixCam(c, { x: E - 150, y: 1060, z: 1.05 }, eio((t - B.back) / .35));     // I turn at the lip
  if (t >= 21.55) c = mixCam(c, { x: E - 590, y: 1080, z: 1.12 }, eio((t - 21.55) / .8));     // the camera travels back along the road: the pieces glow where they lie
  if (t >= 22.35) c = mixCam(c, { x: E + 190, y: 1060, z: .9 }, eio((t - 22.35) / .6));       // and returns: the gap, me at the lip, the outline
  [c.sx, c.sy] = FN.shake(t, B.fall);   // the hit
  return c;
}

// ---------------- light discs (world coords) ----------------
const discR = left => 90 + 170 * left;
const SLOT = [22.9, 23.6, 24.3];   // the outline's missing span lights slot by slot (one piece's length each)
function lights(t, M, FXs, pils) {   // soft light pools (world coords); v2: fewer, smaller, soft-edged
  const D = [], wob = Math.sin(t * TAU / 1.9) * 3;
  // the warmth around my cross walks with it, and gets smaller with every cut
  if (M.X) { const X = M.X, m = cpt(X, (X.u0 + L) / 2); let r = discR(leftAt(t));
    for (const c of CUTS) if (t >= c.drop && t < c.drop + .35) r = lerp(discR(S.left[c.k]), discR(S.left[c.k + 1]), eo((t - c.drop) / .35));
    D.push({ x: m[0], y: m[1] + 20, r: r + wob, warm: 1 }); }
  if (FXs && (FXs.alpha ?? 1) > 0) { const m = cpt(FXs, (FXs.u0 + L) / 2), r = discR(S.left[3]) * (1 - ss(B.fall + .1, B.fall + .8, t)); if (r > 1) D.push({ x: m[0], y: m[1], r, warm: 1 }); }
  if (t >= B.gap) D.push({ x: GX - 60, y: BY - 160, r: 470 * eo(clamp((t - B.gap - .1) / .6)) });
  // when I look back, each piece glows where it lies
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), sw = ss(B.back + .2 + (2 - c.k) * .2, B.back + .7 + (2 - c.k) * .2, t);
    const pulse = 1 + .25 * Math.exp(-Math.max(0, t - SLOT[c.k]) * 5) * (t >= SLOT[c.k] ? 1 : 0);
    if (sw > .01) D.push({ x: p.cx, y: p.cy, r: 130 * sw * pulse, warm: sw }); }
  // the slots of the outline over the gap
  for (const c of CUTS) { const k = ss(SLOT[c.k], SLOT[c.k] + .3, t); if (k > .01) D.push({ x: E - REST + (c.u0 + c.u1) / 2, y: FY + 34, r: 120 * k, warm: k }); }
  return D;
}

// ---------------- the world (drawn twice: dark, then lit inside the discs) ----------------
function drawPil(ctx, P, pal, cross) {
  const X = P.X, dc = X ? () => drawCross(ctx, cross, X.u0, L, X.x, X.y, X.a, X.lie, P.F.alpha ?? 1) : null;
  drawFig(ctx, P.F, pal, X && X.lie ? dc : null, null, X && !X.lie ? dc : null);
}
function world(ctx, t, k, st) {   // k = 'd' | 'l'
  const C = k === 'd' ? DK : LT, pal = PI[k], cross = PX[k];
  FN.road(ctx, C, st.x0, st.x1, { top: RT, near: FY + 70, gap: [E, G], inGap: () => {   // my cross falling between the walls
    const FXs = st.FXs; if (FXs && FXs.clip && (FXs.alpha ?? 1) > 0) drawCross(ctx, MX, FXs.u0, L, FXs.x, FXs.y, FXs.a, true, FXs.alpha ?? 1); } });
  if (st.x1 > GX - 600) { FN.gate(ctx, C, GX, BY + 4, true);
    for (const P of st.pils) if (P.F && P.F.inGate) drawPil(ctx, P, pal, cross);
    FN.gate(ctx, C, GX, BY + 4, false); }
  for (const P of st.pils) if (P.B) drawCross(ctx, cross, 0, L, P.B.x, P.B.y, P.B.a, true);
  st.pils.slice().sort((a, b) => a.F.hip[0] - b.F.hip[0]).forEach(P => { if (!P.F.inGate) drawPil(ctx, P, pal, cross); });
  // the saw I left on the road after the last cut
  const c3 = CUTS[2];
  if (t >= c3.drop) { const kk = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip;
    drawSaw(ctx, [lerp(g0[0], SAWLIE.grip[0], kk), lerp(g0[1], SAWLIE.grip[1], kk)], lerp(CUT_ANG, SAWLIE.ang, kk), SAW[k]); }
  // the pieces I cut, lying where they fell (they fly into the gap at the end)
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t); drawCross(ctx, MX, c.u0, c.u1, p.x, p.y, p.a, true); }
  // me, my cross, the saw
  const M = st.M, F = M.F;
  const myCross = X => { if (X) drawCross(ctx, MX, X.u0, L, X.x, X.y, X.a, X.lie); };
  drawFig(ctx, F, ME[k], () => {
    if (M.X && M.X.lie) myCross(M.X);
    if (M.kerf) { ctx.fillStyle = C.deep; ctx.fillRect(M.c.cutX - 2, M.c.y - PW / 2, 4, M.kerf.kp * PW * .92 + .5); }
    if (M.saw) drawSaw(ctx, M.saw.grip, M.saw.ang, SAW[k]);
  }, M.X && M.X.held ? () => myCross(M.X) : null, M.X && !M.X.lie && !M.X.held ? () => myCross(M.X) : null);   // held upright at my side: behind the arm that grips it
  // my cross over the edge: tips, falls (clipped to the chasm)
  const FXs = st.FXs;
  if (FXs && !FXs.clip) drawCross(ctx, MX, FXs.u0, L, FXs.x, FXs.y, FXs.a, true);
  // sawdust
  for (const q of FLECKS) {
    const u = t - q.t0; if (u < 0) continue; const al = 1 - ss(q.t0 + 1.0, q.t0 + 1.6, t); if (al <= 0) continue;
    const tl = (-q.vy + Math.sqrt(q.vy * q.vy + 4 * 700 * (q.land - q.y))) / 1400, uu = Math.min(u, Math.max(0, tl));
    const x = q.x + q.vx * uu, y = q.y + q.vy * uu + 700 * uu * uu, r = q.r0 + q.vr * uu;
    ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = q.col; ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = r + i * TAU / 3 + (i === 1 ? .5 : 0); ctx.lineTo(x + Math.cos(a) * q.sz, y + Math.sin(a) * q.sz * .7); } ctx.fill(); ctx.restore();
  }
}
function guide(ctx, t, k, al) {   // the dashed outline of my whole cross across the chasm
  const x1 = E - REST - 4 + (L + 8) * k;
  FN.dashed(ctx, FN.outline(GEO, E - REST, FY + 34), t, al, [E - REST - 10, FY - 200, x1 - (E - REST - 10), 400]);
}
function slots(ctx, t) {
  for (const c of CUTS) { const k = ss(SLOT[c.k], SLOT[c.k] + .3, t); if (k <= 0) continue;
    const fl = 1 + .5 * Math.exp(-Math.max(0, t - SLOT[c.k]) * 6);
    FN.warmBar(ctx, E - REST + c.u0 + 3, E - REST + c.u1 - 3, FY + 34, PW - 6, k, fl); }
}

// ---------------- frame ----------------
function draw(ctx, t) {
  const cm = camAt(t), M = poseMe(t), FXs = fallX(t);
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(p => p && p.F);
  const T1 = FN.layerT(cm, 1), st = { M, FXs, pils, x0: (0 - T1.e) / T1.z, x1: (Pilot.W - T1.e) / T1.z };
  const D = lights(t, M, FXs, pils).map(d => { const [x, y] = FN.toScreen(cm, d.x, d.y); return { x, y, r: d.r * cm.z }; });   // (no warm screen: the approved look)
  const pass = (g, k) => {
    FN.backdrop(g, cm, k === 'd' ? DK : LT, FOREST);
    if (k === 'd' && t < 11.8) FN.eyes(g, t, cm, FOREST.eyes);
    FN.layer(g, cm, 1, () => world(g, t, k, st));
  };
  pass(ctx, 'd');
  FN.lit(ctx, D, g => pass(g, 'l'));
  FN.layer(ctx, cm, 1, () => {
    if (t >= 18.75 && t < 19.75) guide(ctx, t, eio((t - 18.75) / .35), 1 - ss(19.4, 19.75, t));
    if (t >= 22.45) { guide(ctx, t, eio((t - 22.45) / .4), .9); slots(ctx, t); }
    FN.hitRing(ctx, t, B.fall, E + 40, FY + 60);   // the hit: a hard flash ring from the lip as my light goes over
  });
  FN.foreground(ctx, cm, t);
  FN.endPlate(ctx, t, B.end);   // the night closes in for the card
  if (t < B.end) FN.captions(ctx, t, S.lines);
  FN.endCard(ctx, t, S.endCard, B.end);
}

async function init() { buildTimeline(); FOREST = FN.forest(5); FN.init(); }
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: FN.FONTS, init, draw });
</script>
