<script>
/* 잘라 낸 건 다리였다 — 04 flat vector night forest (from lab-flatnight).
   Every surface is one flat fill of blue/indigo, no outlines, no gradients; depth is value steps between parallax layers.
   Light is a hard-edged disc that shows the world in its "lit" palette. In the lab the disc came from a red lantern; here
   MY CROSS is the lantern: red frame, pale glass core — the one accent — and its disc of light walks with me.
   The style carries the turn: every cut makes my light smaller, and each piece I saw off keeps a little disc of its own on
   the road behind me. The others walk in the dark (quiet purple crosses) and step into the gate's light. When my short
   cross falls, my light falls with it into the chasm — the frame goes dark. I turn: the little lights behind me swell,
   lift and fly into the dashed outline over the gap, and the whole span lights up again. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const FONT = "'Noto Sans KR',sans-serif";
// dark palette (night) and lit palette (inside the light discs) — same keys
const DK = { sky: '#131c81', trunk: '#151878', trunk2: '#14146f', hill: '#121a76', hill2: '#14146f',
  rowA: '#17209a', rowAm: '#1a2ab4', rowAb: '#121777', rowB: '#152ec3', rowBm: '#1b5af4', rowBb: '#101c8e',
  ground: '#14115f', bush: '#1826b4', bush2: '#131a7c', sprout: '#14146f',
  road: '#14115f', road2: '#110d55', tuft: '#18157a', chasm: '#0b0842', chasm2: '#070530', deep: '#020114', gate: '#1b2192', gate2: '#151a7c', spill: '#1d1f8a' };
const LT = { sky: '#2939ff', trunk: '#2632ee', trunk2: '#2530e4', hill: '#2a34ea', hill2: '#2730dc',
  rowA: '#2c3ff8', rowAm: '#3550ff', rowAb: '#2633e2', rowB: '#3249ff', rowBm: '#4f74ff', rowBb: '#2836e6',
  ground: '#282ade', bush: '#2e44f5', bush2: '#2a37e8', sprout: '#2531d8',
  road: '#282ade', road2: '#2326cc', tuft: '#3040f0', chasm: '#1a1cb4', chasm2: '#121288', deep: '#07063e', gate: '#3c4fff', gate2: '#3141f0', spill: '#5a6cff' };
const FG = { dark: '#130a53', dark2: '#0c0642', mark: '#1c1676', ground: '#18146b', ground2: '#120d58', plant: '#0e0848', plant2: '#0a053a' };
const RED = '#ff2d5a', RED2 = '#c8164a', PINK = '#ec99d4', PINK2 = '#d27cbd', FLAME = '#ffe6f2', GLASS = '#ffd1e3';
// figures: me (the lab's traveller) and the others (same kind, quieter: no pink, purple crosses)
// v2: figures are near-black ink against the blue (viewers: blue-on-blue figures were hard to read)
const ME = { l: { c: '#0c0936', c2: '#25309e', cd: '#06041f', face: PINK, hand2: PINK2, fr: '#3a4cff', leg: '#04031a', leg2: '#080626', eye: '#3b1366' },
             d: { c: '#08062a', c2: '#18207a', cd: '#040316', face: '#8a5aa8', hand2: '#744a90', fr: '#2433b0', leg: '#030212', leg2: '#05041c', eye: '#1a0a3a' } };
const PI = { l: { c: '#0e0b40', c2: '#1d2690', cd: '#07052a', face: '#c4b4ee', hand2: '#a594d8', fr: '#3d5cf0', leg: '#05041c', leg2: '#08062a', eye: '#2a1a66' },
             d: { c: '#07051f', c2: '#10145a', cd: '#040312', face: '#6556b4', hand2: '#544698', fr: '#1c26a0', leg: '#030210', leg2: '#05041a', eye: '#120a3a' } };
const MX = { a: '#e0a052', b: '#a8642a', c: '#f8d394', grain: '#c07c3a' };                     // my cross: honey wood, warm as the lab's lantern (the one accent)
const PX = { l: { a: '#5a24a8', b: '#3b137a', c: '#7a3ccc' }, d: { a: '#2f1272', b: '#220b58', c: '#3f1a8a' } };
const SAW = { l: { bl: '#c9d0ff', bl2: '#97a3f5', h: '#3b137a', h2: '#1c0748' }, d: { bl: '#5560c0', bl2: '#3f49a6', h: '#22094f', h2: '#120430' } };

const L = 520, PW = 36, CBX = L - 78, CBW = 34, CBH = 86, CBHL = 40;   // cross: post length, width; crossbar (from foot), thickness, half-length upright / lying
const FY = 1300, BY = 1252, RT = 1212;                                    // front lane (me), back lane (the others), road's far edge
const REST = 26, G = L - 2 * REST;                                        // a full cross rests 26 px on each lip: the chasm is G wide
const HIPH = 124, LEG1 = 74, LEG2 = 70, ARM1 = 70, ARM2 = 68;              // figure proportions (the lab's short-legged traveller)
const frac = x => x - Math.floor(x);
const backEase = u => 1 + 2.70158 * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2);

// ---------------- flat shapes (from the lab) ----------------
function leafShape(ctx, x, y, len, wid, ang) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(0, -len / 2);
  ctx.quadraticCurveTo(wid, 0, 0, len / 2); ctx.quadraticCurveTo(-wid, 0, 0, -len / 2); ctx.fill(); ctx.restore();
}
function drop(ctx, cx, cy, r, tx, ty, bulge = .32) {
  const a = Math.atan2(ty - cy, tx - cx), d = Math.hypot(tx - cx, ty - cy), be = Math.acos(clamp(r / d, -1, 1));
  const p1 = [cx + r * Math.cos(a + be), cy + r * Math.sin(a + be)], p2 = [cx + r * Math.cos(a - be), cy + r * Math.sin(a - be)];
  const ctl = (p, sgn) => { const mx = (p[0] + tx) / 2, my = (p[1] + ty) / 2, dx = p[0] - tx, dy = p[1] - ty, Ln = Math.hypot(dx, dy);
    return [mx + sgn * -dy / Ln * Ln * bulge, my + sgn * dx / Ln * Ln * bulge]; };
  const c1 = ctl(p1, -1), c2 = ctl(p2, 1);
  ctx.moveTo(tx, ty); ctx.quadraticCurveTo(c1[0], c1[1], p1[0], p1[1]); ctx.arc(cx, cy, r, a + be, a - be + TAU);
  ctx.quadraticCurveTo(c2[0], c2[1], tx, ty); ctx.closePath();
}
function crownTiers(cx, top, h, w, n) {
  const T = [{ c: [cx, top + h * .34], r: w * .25, tip: [cx, top] }];
  for (let i = 1; i < n; i++) { const f = i / (n - 1 || 1);
    for (const s of [-1, 1]) T.push({ c: [cx + s * w * lerp(.25, .29, f), top + h * lerp(.53, .79, f)], r: w * lerp(.18, .21, f),
      tip: [cx + s * w * lerp(.47, .53, f), top + h * lerp(.25, .50, f)], s, i }); }
  return T;
}
function leafyTree(ctx, cx, ground, h, w, n, c, seed) {
  const r = rng(seed), ch = Math.min(h * .62, w * 1.55), top = ground - h;
  const T = crownTiers(cx, top, ch, w, n);
  ctx.fillStyle = c.crown; ctx.beginPath();
  for (const l of T) drop(ctx, l.c[0], l.c[1], l.r, l.tip[0], l.tip[1]);
  ctx.ellipse(cx, top + ch * .70, w * .2, ch * .28, 0, 0, TAU); ctx.fill('nonzero');
  ctx.fillStyle = c.branch; const tw = w * .06;
  ctx.beginPath(); ctx.moveTo(cx - tw, ground); ctx.lineTo(cx - tw * .5, top + ch * .30); ctx.arc(cx, top + ch * .30, tw * .5, Math.PI, 0); ctx.lineTo(cx + tw, ground); ctx.fill();
  ctx.strokeStyle = c.branch; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(4, w * .035);
  const yb = top + ch * .80;
  ctx.beginPath(); ctx.moveTo(cx - w * .26, yb - ch * .07); ctx.quadraticCurveTo(cx, yb + ch * .09, cx + w * .26, yb - ch * .07); ctx.stroke();
  if (n > 2) { const s = r() < .5 ? -1 : 1, ym = top + ch * .55;
    ctx.beginPath(); ctx.moveTo(cx, ym + ch * .04); ctx.quadraticCurveTo(cx + s * w * .10, ym + ch * .03, cx + s * w * .12, ym - ch * .05); ctx.stroke(); }
  ctx.fillStyle = c.mark;
  for (const l of T) { if (!l.s || r() < .3) continue;
    const a = Math.atan2(l.tip[1] - l.c[1], l.tip[0] - l.c[0]);
    leafShape(ctx, lerp(l.c[0], l.tip[0], .3), lerp(l.c[1], l.tip[1], .3), w * .10, w * .04, a + Math.PI / 2); }
  if (r() < .7) leafShape(ctx, cx + w * .1, top + ch * .38, w * .09, w * .036, .6);
}
function bareTrunk(ctx, x, w, col, seed, top, ground) {
  const r = rng(seed); ctx.fillStyle = col; ctx.fillRect(x - w / 2, top, w, ground - top);
  ctx.strokeStyle = col; ctx.lineWidth = w * .45; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) { const y = 200 + r() * 800, s = r() < .5 ? -1 : 1, Ln = w * (1.2 + r() * 1.6);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + s * Ln * .9, y - Ln * .1, x + s * Ln, y - Ln * .8); ctx.stroke(); }
}
function bush(ctx, x, y, w, h, col) {
  ctx.fillStyle = col; ctx.beginPath(); const n = 3; ctx.moveTo(x - w / 2, y);
  for (let i = 0; i < n; i++) { const a = x - w / 2 + w * i / n, b = a + w / n, hh = h * (i === 1 ? 1 : .72); ctx.bezierCurveTo(a, y - hh * 1.2, b, y - hh * 1.2, b, y); }
  ctx.closePath(); ctx.fill();
}
function sprout(ctx, x, y, s, col, sway = 0) {
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 4 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x, y - 20 * s, x + sway * 10 * s, y - 34 * s); ctx.stroke();
  leafShape(ctx, x + sway * 10 * s, y - 46 * s, 28 * s, 11 * s, sway * .2);
  leafShape(ctx, x - 14 * s + sway * 4 * s, y - 24 * s, 26 * s, 10 * s, -1.0 + sway * .2);
  leafShape(ctx, x + 14 * s + sway * 4 * s, y - 24 * s, 26 * s, 10 * s, 1.0 + sway * .2);
}
function clump(ctx, x, y, s, col, sway, seed) {
  const r = rng(seed); ctx.fillStyle = col;
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * .42 + (r() - .5) * .2 + sway * .06, Ln = s * (90 + r() * 60);
    const tx = x + Math.cos(a) * Ln, ty = y + Math.sin(a) * Ln, nx = -Math.sin(a), ny = Math.cos(a), wd = s * 20;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.cos(a) * Ln * .5 + nx * wd, y + Math.sin(a) * Ln * .5 + ny * wd, tx + (i - 2) * s * 10, ty + s * 6);
    ctx.quadraticCurveTo(x + Math.cos(a) * Ln * .5 - nx * wd, y + Math.sin(a) * Ln * .5 - ny * wd, x, y); ctx.fill(); }
}
const hillY = (x, base, amps) => base + amps.reduce((s, [a, per, ph]) => s + a * Math.sin(TAU * x / per + ph), 0);
function hill(ctx, x0, x1, base, amps, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x0, 4000);
  for (let x = Math.floor(x0 / 8) * 8; x <= x1 + 8; x += 8) ctx.lineTo(x, hillY(x, base, amps)); ctx.lineTo(x1 + 8, 4000); ctx.fill();
}

// ---------------- background layers (drawn live: flat vectors stay crisp under the camera) ----------------
const LAYERS = [ { id: 'trunks', p: .22, items: [] }, { id: 'rowA', p: .38, items: [] }, { id: 'rowB', p: .58, items: [] }, { id: 'mid', p: .82, items: [] } ];
const EYES = [];
function buildLayers() {
  const r = rng(5);
  for (const Ly of LAYERS) {
    let x = -2600; const it = Ly.items;
    while (x < 5200) {
      if (Ly.id === 'trunks') { it.push({ k: 'trunk', x, w: 12 + r() * 20, c: r() < .5 ? 'trunk' : 'trunk2', seed: 100 + it.length }); x += 70 + r() * 90; }
      if (Ly.id === 'rowA') { it.push({ k: 'tree', x, g: 1118, h: 520 + r() * 90, w: 190 + r() * 40, n: 3, seed: 300 + it.length }); x += 230 + r() * 110; }
      if (Ly.id === 'rowB') { it.push({ k: 'tree', x, g: 1162, h: 760 + r() * 120, w: 280 + r() * 50, n: 4, seed: 500 + it.length });
        if (r() < .6) it.push({ k: 'bush', x: x + 150 + r() * 60, y: 1160, w: 150, h: 46, c: 'bush2' }); x += 330 + r() * 170; }
      if (Ly.id === 'mid') { const k = r();
        if (k < .3) it.push({ k: 'trunkM', x, w: 26 + r() * 10, seed: 700 + it.length });
        it.push({ k: 'bush', x: x + 60, y: 1212, w: 170 + r() * 70, h: 52 + r() * 14, c: 'bush' });
        if (r() < .5) it.push({ k: 'bush', x: x + 170, y: 1214, w: 120, h: 36, c: 'bush2' });
        if (r() < .4 && EYES.length < 40) EYES.push({ x: x + 60, y: 1196, s: 1.4, seed: EYES.length * 7 + 3 });
        x += 260 + r() * 160; }
    }
  }
}
function drawLayer(ctx, Ly, C, x0, x1) {
  const id = Ly.id;
  if (id === 'trunks') { for (const o of Ly.items) if (o.x > x0 - 80 && o.x < x1 + 80) bareTrunk(ctx, o.x, o.w, C[o.c], o.seed, -1400, 1100);
    hill(ctx, x0, x1, 1080, [[16, 900, .4], [8, 430, 1.7]], C.hill); }
  if (id === 'rowA') { const c = { crown: C.rowA, mark: C.rowAm, branch: C.rowAb };
    for (const o of Ly.items) if (o.x > x0 - 200 && o.x < x1 + 200) leafyTree(ctx, o.x, o.g, o.h, o.w, o.n, c, o.seed);
    hill(ctx, x0, x1, 1120, [[10, 700, 2.1], [5, 260, .3]], C.hill2); }
  if (id === 'rowB') { const c = { crown: C.rowB, mark: C.rowBm, branch: C.rowBb };
    for (const o of Ly.items) if (o.x > x0 - 260 && o.x < x1 + 260) { if (o.k === 'tree') leafyTree(ctx, o.x, o.g, o.h, o.w, o.n, c, o.seed); else bush(ctx, o.x, o.y, o.w, o.h, C[o.c]); }
    hill(ctx, x0, x1, 1162, [[10, 800, 2.1], [5, 300, .3]], C.hill2); }
  if (id === 'mid') {
    for (const o of Ly.items) if (o.x > x0 - 200 && o.x < x1 + 200) { if (o.k === 'trunkM') bareTrunk(ctx, o.x, o.w, C.ground, o.seed, -1400, 1220); }
    for (const o of Ly.items) if (o.x > x0 - 200 && o.x < x1 + 200) { if (o.k === 'bush') bush(ctx, o.x, o.y, o.w, o.h, C[o.c]); }
    hill(ctx, x0, x1, 1214, [[6, 600, .9], [3, 210, 2.4]], C.ground);
  }
}

// ---------------- camera-layer helper ----------------
function layerT(cm, p) { const z = 1 + (cm.z - 1) * p, cx = cm.x * p, cy = 960 + (cm.y - 960) * p; return { z, e: 540 - cx * z + cm.sx * p, f: 960 - cy * z + cm.sy * p, cx }; }
function layer(ctx, cm, p, fn) { const T = layerT(cm, p); ctx.save(); ctx.setTransform(T.z, 0, 0, T.z, T.e, T.f); fn((0 - T.e) / T.z, (W - T.e) / T.z); ctx.restore(); }
const toScreen = (cm, x, y) => [540 + (x - cm.x) * cm.z + cm.sx, 960 + (y - cm.y) * cm.z + cm.sy];

// ---------------- the cross (flat: frame + shade strip; mine has a lantern-glass core) ----------------
// local x along the post: foot at 0, top at L; crossbar at CBX. lying = crossbar foreshortened (lying flat).
function drawCross(ctx, K, u0, u1, x, y, a, lying, alpha = 1) {
  if (u1 - u0 < .5 || alpha <= 0) return;
  const hb = lying ? CBHL : CBH;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); if (alpha < 1) ctx.globalAlpha *= alpha;
  ctx.beginPath(); ctx.rect(u0, -hb - 6, u1 - u0, 2 * hb + 12); ctx.clip();
  ctx.fillStyle = K.a; ctx.beginPath(); ctx.roundRect(0, -PW / 2, L, PW, 5); ctx.roundRect(CBX - CBW / 2, -hb, CBW, 2 * hb, 5); ctx.fill();
  ctx.fillStyle = K.b; ctx.beginPath(); ctx.rect(0, PW / 2 - 9, L, 9); ctx.rect(CBX + CBW / 2 - 9, -hb + 4, 9, 2 * hb - 8); ctx.fill();
  ctx.fillStyle = K.c; ctx.beginPath(); ctx.rect(8, -PW / 2 + 5, L - 16, 4); ctx.fill();
  if (K.grain) { ctx.strokeStyle = K.grain; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.beginPath();   // flat wood grain: two long strokes and a knot
    ctx.moveTo(30, -2); ctx.lineTo(CBX - 40, -2); ctx.moveTo(60, 6); ctx.lineTo(CBX - 70, 6); ctx.moveTo(CBX + 30, 1); ctx.lineTo(L - 16, 1); ctx.stroke();
    ctx.fillStyle = K.grain; for (const u of [150, 330]) { ctx.beginPath(); ctx.ellipse(u, 1, 7, 3.5, 0, 0, TAU); ctx.fill(); } }
  ctx.fillStyle = K.c;   // fresh cut faces
  if (u0 > .5) ctx.fillRect(u0, -PW / 2, 6, PW);
  if (u1 < L - .5) ctx.fillRect(u1 - 6, -PW / 2, 6, PW);
  ctx.restore();
}

// ---------------- figures (the lab's hooded traveller, rigged) ----------------
// spec: { s, f (+1 faces right), gy, hip:[x,y], ang, feet:[far, near], hands:[far, near], hand:[type far, type near], tilt, eye, sway, farFront, alpha }
function ik(a, t, l1, l2, pick) {
  let dx = t[0] - a[0], dy = t[1] - a[1], d = Math.hypot(dx, dy) || 1e-6; const dd = clamp(d, Math.abs(l1 - l2) + .5, l1 + l2 - .5);
  const tx = a[0] + dx / d * dd, ty = a[1] + dy / d * dd, an = Math.atan2(ty - a[1], tx - a[0]), b = Math.acos(clamp((l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd), -1, 1));
  const j1 = [a[0] + Math.cos(an + b) * l1, a[1] + Math.sin(an + b) * l1], j2 = [a[0] + Math.cos(an - b) * l1, a[1] + Math.sin(an - b) * l1];
  return [pick(j1, j2), [tx, ty]];
}
function frame(F) {
  const up = [Math.sin(F.ang), -Math.cos(F.ang)], fw = [F.f * Math.cos(F.ang), F.f * Math.sin(F.ang)], s = F.s;
  return { up, fw, P: (a, b) => [F.hip[0] + fw[0] * a * s + up[0] * b * s, F.hip[1] + fw[1] * a * s + up[1] * b * s] };
}
const shoulderOf = F => frame(F).P(2, 118);
function hood(ctx, N, rot, f, k, C, eye) {
  ctx.save(); ctx.translate(N[0], N[1]); ctx.rotate(rot); ctx.scale(f * k, k);
  ctx.fillStyle = C.c; ctx.beginPath();
  ctx.moveTo(-40, 10); ctx.bezierCurveTo(-58, -40, -40, -98, 8, -100); ctx.bezierCurveTo(48, -100, 64, -60, 58, -20);
  ctx.bezierCurveTo(56, 0, 40, 14, 20, 16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.face; ctx.beginPath(); ctx.moveTo(16, -64); ctx.bezierCurveTo(44, -66, 54, -40, 50, -16); ctx.bezierCurveTo(46, -2, 30, 4, 18, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.fr; ctx.beginPath(); ctx.moveTo(10, -70); ctx.bezierCurveTo(34, -78, 54, -62, 54, -38); ctx.bezierCurveTo(42, -52, 26, -50, 14, -40); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.cd; ctx.beginPath(); ctx.moveTo(-6, -92); ctx.bezierCurveTo(-30, -84, -40, -30, -30, 6); ctx.lineTo(-40, 10); ctx.bezierCurveTo(-58, -40, -40, -98, 8, -100); ctx.fill();
  ctx.strokeStyle = C.eye; ctx.fillStyle = C.eye; ctx.lineWidth = 4; ctx.lineCap = 'round';
  if (eye === 'strain') { ctx.beginPath(); ctx.moveTo(33, -36); ctx.lineTo(41, -31); ctx.lineTo(33, -27); ctx.stroke(); }
  else if (eye === 'down' || eye === 'closed') { ctx.beginPath(); ctx.moveTo(34, -32); ctx.quadraticCurveTo(40, -27, 46, -31); ctx.stroke(); }
  else if (eye === 'shock') { ctx.beginPath(); ctx.ellipse(41, -35, 4.6, 7, 0, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.moveTo(34, -50); ctx.lineTo(46, -53); ctx.stroke(); }
  else { ctx.beginPath(); ctx.ellipse(41, -34, 3.6, 5.4, 0, 0, TAU); ctx.fill(); }
  ctx.restore();
}
function drawFig(ctx, F, C, mid, back, over) {
  const s = F.s, f = F.f, { up, fw, P } = frame(F);
  const al = F.alpha ?? 1; if (al <= 0) return; ctx.save(); if (al < 1) ctx.globalAlpha *= al;
  const sh = P(12, 114), shF = P(-8, 112);
  const elbowPick = (a, b) => (a[1] - f * a[0] * .35) > (b[1] - f * b[0] * .35) ? a : b, kneePick = (a, b) => f * a[0] > f * b[0] ? a : b;
  const arm = (S0, T, c, type) => {
    if (!T) T = [S0[0] - f * 8 * s, S0[1] + 116 * s];
    const [el, hd] = ik(S0, T, ARM1 * s, ARM2 * s, elbowPick);
    ctx.strokeStyle = c; ctx.lineWidth = 27 * s; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    for (let x = Math.floor(x0 / 8) * 8; x <= x1 + 8; x += 8) ctx.lineTo(x, 1700 + 18 * Math.sin(x / 160) + 9 * Math.sin(x / 53 + 1)); ctx.lineTo(x1 + 10, 4000); ctx.fill();
    for (let x = Math.floor(x0 / 320) * 320; x < x1 + 320; x += 320) { const sw = Math.sin(t * 1.7 + x * .01), q = (x / 320) & 3;
      if (q === 0) clump(ctx, x + 40, 1760, 1.3, FG.plant, sw, 5); else if (q === 1) sprout(ctx, x + 60, 1730, 1.8, FG.plant, -sw * .5);
      else if (q === 2) clump(ctx, x + 120, 1770, .9, FG.plant, -sw, 8); else sprout(ctx, x + 10, 1720, 1.3, FG.plant, sw * .5); }
  });
}
const FGT = [];

// ---------------- frame ----------------
function draw(ctx, t) {
  const cm = camAt(t), M = poseMe(t), FXs = fallX(t);
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(p => p && p.F);
  const T1 = layerT(cm, 1), st = { M, FXs, pils, x0: (0 - T1.e) / T1.z, x1: (W - T1.e) / T1.z };
  const D = lights(t, M, FXs, pils).map(d => { const [x, y] = toScreen(cm, d.x, d.y); return { x, y, r: d.r * cm.z }; });
  const pass = (g, k) => {
    const C = k === 'd' ? DK : LT;
    g.fillStyle = C.sky; g.fillRect(0, 0, W, H);
    for (const Ly of LAYERS) { layer(g, cm, Ly.p, (x0, x1) => drawLayer(g, Ly, C, x0, x1)); if (Ly.id === 'trunks') moon(g); }
    if (k === 'd' && t < 11.8) eyes(g, t, cm);
    layer(g, cm, 1, () => world(g, t, k, st));
  };
  pass(ctx, 'd');
  if (D.length) {   // the lit world shows through soft-edged pools (radial falloff), then a faint lantern warmth on top
    const o = OFF.getContext('2d'); o.setTransform(1, 0, 0, 1, 0, 0); o.globalCompositeOperation = 'source-over'; o.globalAlpha = 1; pass(o, 'l');
    const m = MSK.getContext('2d'); m.setTransform(1, 0, 0, 1, 0, 0); m.clearRect(0, 0, W, H); m.globalCompositeOperation = 'lighter';
    for (const d of D) if (d.r > 2) { const g = m.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.45, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      m.fillStyle = g; m.fillRect(d.x - d.r, d.y - d.r, 2 * d.r, 2 * d.r); }
    o.globalCompositeOperation = 'destination-in'; o.drawImage(MSK, 0, 0); o.globalCompositeOperation = 'source-over';
    ctx.drawImage(OFF, 0, 0);
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    for (const d of D) if (d.warm && d.r > 2) { const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * .8); g.addColorStop(0, `rgba(255,176,90,${.22 * d.warm})`); g.addColorStop(1, 'rgba(255,176,90,0)');
      ctx.fillStyle = g; ctx.fillRect(d.x - d.r, d.y - d.r, 2 * d.r, 2 * d.r); }
    ctx.restore();
  }
  layer(ctx, cm, 1, () => {
    if (t >= 18.75 && t < 19.75) guide(ctx, t, eio((t - 18.75) / .35), 1 - ss(19.4, 19.75, t));
    if (t >= 22.45) { guide(ctx, t, eio((t - 22.45) / .4), .9); slots(ctx, t); }
    // the hit: a hard flash ring from the lip as my light goes over
    if (t >= B.fall && t < B.fall + .22) { const u = (t - B.fall) / .22; ctx.strokeStyle = FLAME; ctx.lineWidth = 10 * (1 - u) + 2; ctx.beginPath(); ctx.arc(E + 40, FY + 60, 60 + 520 * eo(u), 0, TAU); ctx.stroke(); }
  });
  foreground(ctx, cm, t);
  // end card plate: the night closes in (flat dark indigo)
  const ke = ss(B.end - .2, B.end + .35, t);
  if (ke > 0) { ctx.fillStyle = `rgba(12,8,62,${.84 * ke})`; ctx.fillRect(0, 0, W, H); if (ke > .5) { ctx.save(); ctx.globalAlpha = (ke - .5) * 2; moon(ctx); ctx.restore(); } }
  if (t < B.end) Story.captions(ctx, t, S.lines, { font: FONT, weight: 700, color: '#e4e7ff', srcColor: '#c3c9ff', y: 420, shadow: 'rgba(8,4,52,.8)', shadowBlur: 16 });
  Story.endCard(ctx, t, S.endCard, B.end, { font: FONT, color: '#eef0ff', srcColor: '#b9c1ff', y: 860, titleShadow: 'rgba(0,0,0,.35)' });
}

let OFF, MSK;
async function init() {
  buildTimeline(); buildLayers(); OFF = Pilot.canvas(W, H); MSK = Pilot.canvas(W, H);
  for (const tt of [5.3, 6.6, 7.9]) FGT.push(camAt(tt).x * 1.45 + 140);   // foreground trees pass the centre on the run, never over a cut
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 62px 'Noto Sans KR'", "500 34px 'Noto Sans KR'", "400 28px 'Noto Sans KR'"], init, draw });
</script>
