<script>
/* 잘라 낸 건 다리였다 — 01 misty silhouette forest (from lab-fogforest). The worked example of the `fogforest` house style:

   this file keeps only the story — the timeline, the poses, the crosses and the saw, the others, the camera, the order of a frame.
   The lab's one warm accent (a lantern in the fog) becomes two things: MY cross — the only warm-lit object in a world of
   teal silhouettes — and the light in the arch beyond the ravine. Everyone else, and their crosses, are silhouettes.
   The turn is carried by the fog: the ravine is a cut through the path with mist rising in it; my short cross tips and
   sinks into that mist (the hit: a push-in, a shake, a gust of mist from below); the pieces I cut lie on the path still
   holding the warm light, and the dashed outline of my whole cross lights slot by slot over the open gap.

const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;

    const r = rng(100 + k);

      vx: (r() - .5) * (n < 12 ? 180 : 320), vy: -(80 + r() * (n < 12 ? 160 : 260)), land: FY + 18 + r() * 44, r0: r() * TAU, vr: (r() - .5) * 20, sz: 3 + r() * 4, col: C.goldL });
  });

  const c3 = CUTS[2]; SAWLIE = { grip: [c3.cutX + 150, FY + 52], ang: Math.PI + .05 };

function pieceAt(c, t) {   // a cut piece lying where it fell (shifted a little as it came off) — it never moves again
  const sh = 18 * eo((t - c.drop) / .25), cu = (c.u0 + c.u1) / 2, cx = c.baseX + cu - sh, cy = c.y, a = -.05 * eo((t - c.drop) / .25);
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, cx, cy };
}

// ---------------- poses (after cross-papercut) ----------------
function carryCross(F, left, a0) {   // my cross / theirs on the near shoulder (kit: onShoulder), touching at `contact`
  const contact = L - Math.min(282, left * L - 36);

}
function gripCarry(F, X) { F.hands = [FF.pt(X, Math.min(L - 16, X.contact + 64)), FF.pt(X, Math.min(L - 14, X.contact + 106))]; F.hand = ['fist', 'fist']; return F; }

const CUT_ANG = Math.PI - .72, hangAng = f => Math.atan2(.95, .3 * f);

function sawSpec(c, t) {

    hand: ['fist', 'flat'], tilt: .32, sway: 0, farFront: true };
}
const hangGrip = (F, sw = 0) => { const sh = FF.shoulderOf(F); return [sh[0] + F.f * (44 + sw) * F.s, sh[1] + 118 * F.s]; };   // the saw hand hangs a little forward, the arm in front of the body
const rIdx = F => F.f > 0 ? 1 : 0, lIdx = F => F.f > 0 ? 0 : 1;

function poseMe(t) {

  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const F = FF.walk(x, FY, SME, 1, ph, 116, .3 + .1 * Math.sin(tt * TAU / 1.15), 16); F.tilt = .12; F.hip[1] += 6 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, -.4 + .06 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt); const F = FF.walk(x, FY, SME, 1, ph, lerp(116, 270, k), lerp(.16, .3, k), lerp(20, 62, k)); return [F, -.46]; }

  const carried = (F, a0, lf, held) => { const X = carryCross(F, lf, a0); gripCarry(F, X);
    if (held) { F.hands[0] = FF.pt(X, Math.min(L - 14, X.contact + 106)); F.hands[1] = hangGrip(F, F.ph != null ? 18 * Math.sin(TAU * F.ph) : 0); }
    return [F, X]; };
  for (const c of CUTS) {
    if (t >= c.s && t < c.up1) {
      const lf0 = S.left[c.k], lf1 = S.left[c.k + 1], [W0, a0] = walk(c.s, c.mx), [W1, a1] = walk(c.up1, c.mx), last = c.k === 2;
      const [WA, XA] = carried(W0, a0, lf0, true), [WB, XB] = carried(W1, a1, lf1, !last);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      if (t < c.s + c.d) { const k = eio((tp - c.s) / c.d), F = FF.mix(WA, SP, k);
        F.hands[rIdx(F)] = [lerp(WA.hands[1][0], cg[0], k), lerp(WA.hands[1][1], cg[1], k)];
        const Xm = FF.mixX(XA, XL, k), uPin = c.u1 + 44 * SME, uA = Math.min(L - 14, XA.contact + 106);
        F.hands[lIdx(F)] = FF.pt(Xm, lerp(uA, uPin, k), lerp(0, -PW / 2 - 3, k));
        F.hand = F.f > 0 ? ['fist', 'fist'] : ['fist', k > .6 ? 'flat' : 'fist'];
        return { F, X: Xm, c, saw: { grip: F.hands[rIdx(F)], ang: lerp(hangAng(1), CUT_ANG, k) } }; }

  }

  if (t < 18.4) { const [F0] = walk(12, E - 52), k = eio((tp - 12) / .3);
    const bx = -150 * eio((tp - 12.9) / .7) + 150 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.85, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.65, 17.55, .12, .12));
    const STx = mv > 0 ? FF.mix(FF.stand(E - 52 + bx, FY, SME, 1, .08), FF.walk(E - 52 + bx, FY, SME, 1, (E + bx) / 150, 150, .1, 24), mv) : FF.stand(E - 52 + bx, FY, SME, 1, .08);
    const F = FF.mix(F0, STx, k);
    F.ang += .16 * Math.sin(Math.PI * clamp((tp - 12) / .5)) * (tp < 12.5 ? -1 : 0);
    const [, XC] = carried(F, -.45, left, false), XU = upright(F, left), kk = eio((tp - 12.05) / .5), Xm = FF.mixX(XC, XU, kk);
    const uC = [Math.min(L - 16, XC.contact + 64), Math.min(L - 14, XC.contact + 106)], uU = uprightHands(left);
    F.hands = [0, 1].map(i => FF.pt(Xm, lerp(uC[i], uU[i], kk))); F.hand = ['fist', 'fist']; return { F, X: Xm }; }
  const XLay = { x: E - REST - L * (1 - left), y: FY + 34, a: 0, u0: L * (1 - left), lie: true };
  const LAY = { ...FF.stand(E - 52, FY, SME, 1), hip: [E - 92, FY - 74], ang: 1.12, feet: [[E - 92 - 74 * SME, FY], [E - 92 + 60 * SME, FY]], tilt: .3 };   // kneeling at the lip, pressing the foot end down
  LAY.hands = [FF.pt(XLay, L * (1 - left) + 70, -PW / 2 - 4), FF.pt(XLay, L * (1 - left) + 26, -PW / 2 - 4)]; LAY.hand = ['flat', 'flat'];
  const REACH = { ...LAY, hip: [E - 66, FY - 160 * SME], ang: .46, hands: [null, [E + 70, FY - 20]], hand: ['fist', 'open'], tilt: .45 };
  if (t < B.tip) { if (t < 18.9) { const ST = FF.stand(E - 52, FY, SME, 1, .08), STc = [ST, upright(ST, left)], k = eio((tp - 18.4) / .4);

      F.hands = [0, 1].map(i => FF.pt(Xm, lerp(uC[i], uL[i], kt), lerp(0, -PW / 2 - 4, kt))); F.hand = kt > .7 ? ['flat', 'flat'] : ['fist', 'fist']; return { F, X: Xm, lay: kt > .5 }; }

function fallX(t) {

// ---------------- the others ----------------
const PIL = [{ x0: -470, ph: .3 }, { x0: -230, ph: .75 }, { x0: 190, ph: .1 }, { x0: 430, ph: .55 }];
const BRIDGE_Y = [BY - 6, BY + 4, BY + 14], PULL = 210;
function pilState(i, t) {

    const k0 = eio((tp - T - .9) / .2); return { F: k0 < 1 ? { ...FF.mix(FF.walk(xs1, BY, SPI, 1, 0, 170, .1), F, k0), col: C.pil } : F, X }; }
  const [Fp, Xp] = PULLS(1), xg = xpAt(1);
  if (t < T + 1.5) { const k = eio((tp - T - 1.25) / .25), [Fc, Xc] = carry(T + 1.5, xg, BY, 150, .2), Xm = FF.mixX(Xp, Xc, k), F = { ...FF.mix(Fp, Fc, k), col: C.pil };
    const uP = [L - 44, L - 92], uC = [Math.min(L - 16, Xc.contact + 64), Math.min(L - 14, Xc.contact + 106)]; F.hands = [0, 1].map(i => FF.pt(Xm, lerp(uP[i], uC[i], k))); F.hand = ['fist', 'fist'];
    return { F, X: Xm }; }
  const x = lerp(xg, GX + 10, clamp((tp - T - 1.5) / .35)), [F, X] = carry(tp, x, BY, 150, .2);
  F.alpha = 1 - ss(T + 1.55, T + 1.85, t); if (F.alpha <= 0) return null;
  return { F, X };
}

// ---------------- camera ----------------
function camAt(t) {
  let c = { x: meX(t) + 60 + 90 * ss(4.3, 5.4, t), y: 1050, z: 1.03 };
  c = FF.mixCam({ x: meX(t) + 34, y: 1000, z: 1.62 }, c, eio((t - 1.5) / 1.1));
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: (cc.mx + cc.cutX) / 2 - 10, y: 1120, z: 1.32 });
  c = FF.mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = FF.mixCam(c, FF.mixCam(at(c2), at(c3), eio((t - 10.0) / .45)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));
  if (t >= 12) c = FF.mixCam(c, { x: E + 380, y: 1000, z: .74 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = FF.mixCam(c, { x: E + 190, y: 1090, z: .98 }, eio((t - 18.2) / .45));
  if (t >= B.fall) c = FF.mixCam(c, { x: E + 160, y: 1200, z: 1.34 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .65) c = FF.mixCam(c, { x: E + 150, y: 1080, z: 1.0 }, eio((t - B.fall - .65) / .7));
  if (t >= B.back) c = FF.mixCam(c, { x: PX, y: 1110, z: 1.12 }, eio((t - B.back - .05) / 1.0));       // travel back along the road: the pieces glow where they lie
  if (t >= 22.2) c = FF.mixCam(c, { x: E + 150, y: 1110, z: 1.06 }, eio((t - 22.2) / .65));               // and back to the gap, me at the lip, the outline over it
  return FF.shake(c, t, B.fall);   // the hit
}

// ---------------- the world: path, ravine, arch (kit pieces placed for this story) ----------------
let ROAD = null, GAP = null, ARCH = null;
function buildWorld() {
  ROAD = FF.road({ x0: ROADX0, x1: ROADX1, top: RT, gaps: [{ x: E, w: G }] });
  GAP = FF.gap({ x: E, w: G, top: RT });
  ARCH = { x: GX, cy: GAY, base: BY };
}
const drawCross = (ctx, kind, u0, u1, x, y, a, lying) => FF.cross(ctx, kind, u0, u1, x, y, a, lying);

// ---------------- the action layer: figures, crosses, saw, pieces ----------------
function drawAction(a, t, M, pils) {
  // a bridge (only ever one, its owner's), then the others
  for (const P of pils) if (P.B) drawCross(a, C.pil, 0, L, P.B.x, P.B.y, P.B.a, true);
  pils.slice().sort((p, q) => p.F.hip[0] - q.F.hip[0]).forEach(P => {
    const X = P.X, dc = g => X ? () => drawCross(g, C.pil, X.u0, L, X.x, X.y, X.a, X.lie) : null;
    FF.withAlpha(a, P.F.alpha ?? 1, g => FF.figure(g, P.F, X && X.lie ? dc(g) : null, X && !X.lie ? dc(g) : null));
  });
  // the saw I left on the road after the last cut
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip;
    drawSaw(a, [lerp(g0[0], SAWLIE.grip[0], k), lerp(g0[1], SAWLIE.grip[1], k)], lerp(CUT_ANG, SAWLIE.ang, k)); }
  // the pieces I cut, lying where they fell
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t); drawCross(a, 'mine', c.u0, c.u1, p.x, p.y, p.a, true); }
  // me, my cross, the saw
  const F = M.F; F.col = C.me; F.armCol = '#26413f';
  const myCross = X => { if (X) drawCross(a, 'mine', X.u0, L, X.x, X.y, X.a, X.lie); };
  FF.figure(a, F, () => {
    if (M.X && M.X.lie) myCross(M.X);
    if (M.kerf) { a.fillStyle = '#3a1e0c'; a.fillRect(M.c.cutX - 1.8, M.c.y - PW / 2, 3.6, M.kerf.kp * PW * .92 + .5); }
    if (M.saw) drawSaw(a, M.saw.grip, M.saw.ang);
  }, M.X && !M.X.lie ? () => myCross(M.X) : null);
  // my cross tipping over the lip (once it drops, it is drawn behind the mist in the ravine)
  const FX = fallX(t); if (FX && !FX.clip) drawCross(a, 'mine', FX.u0, L, FX.x, FX.y, FX.a, true);
}
function slots(ctx, t, al) {   // the dashed outline of my whole cross over the open gap; its missing span lights slot by slot
  const ol = FF.crossOutline(E - REST, FY + 34), p = new Path2D(); p.moveTo(...ol[0]); for (const q of ol.slice(1)) p.lineTo(...q); p.closePath();
  ctx.save(); ctx.globalAlpha = al; ctx.setLineDash([16, 10]); ctx.lineDashOffset = -t * 14; ctx.lineWidth = 4.5; ctx.strokeStyle = 'rgba(255,230,185,.85)'; ctx.stroke(p); ctx.setLineDash([]); ctx.restore();
  CUTS.forEach((c, k) => { const T = SLOTS[k], lit = ss(T - .05, T + .2, t); if (lit <= 0) return; const x0 = E - REST + c.u0, x1 = E - REST + c.u1, kick = 1 - ss(T + .05, T + .7, t);
    ctx.save(); ctx.beginPath(); ctx.rect(x0 + 1.5, FY - 100, x1 - x0 - 3, 300); ctx.clip();
    ctx.globalAlpha = al * lit; ctx.fillStyle = `rgba(255,206,130,${.5 + .35 * kick})`; ctx.fill(p);
    ctx.setLineDash([16, 10]); ctx.lineDashOffset = -t * 14; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,236,190,.95)'; ctx.stroke(p); ctx.setLineDash([]);
    ctx.restore();
    ctx.save(); ctx.globalAlpha = al * lit; ctx.globalCompositeOperation = 'lighter'; const cx = (x0 + x1) / 2, R = 110 + 60 * kick, g = ctx.createRadialGradient(cx, FY + 34, 4, cx, FY + 34, R);   // soft light, not clipped (no boxes)
    g.addColorStop(0, `rgba(255,200,120,${.2 + .35 * kick})`); g.addColorStop(1, 'rgba(255,180,100,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, FY + 34, R, 0, TAU); ctx.fill();
    ctx.restore(); });
}
function guide(ctx, t, k, al) {   // a dashed outline of my whole cross across the ravine
  const ol = FF.crossOutline(E - REST, FY + 34), x1 = E - REST - 4 + (L + 8) * k, p = new Path2D(); p.moveTo(...ol[0]); for (const q of ol.slice(1)) p.lineTo(...q); p.closePath();
  ctx.save(); ctx.globalAlpha = al; ctx.beginPath(); ctx.rect(E - REST - 10, FY - 200, x1 - (E - REST - 10), 400); ctx.clip();
  ctx.fillStyle = 'rgba(255,214,150,.16)'; ctx.fill(p);
  const glow = ss(24.15, 24.45, t) * (1 - .5 * ss(24.7, 25.5, t));
  ctx.setLineDash([16, 10]); ctx.lineDashOffset = -t * 18; ctx.lineWidth = 5; ctx.strokeStyle = `rgba(255,222,165,${.85 + .15 * glow})`; ctx.stroke(p); ctx.setLineDash([]);
  if (glow > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 14; ctx.strokeStyle = `rgba(255,210,140,${.3 * glow})`; ctx.stroke(p); }
  ctx.restore();
}

// ---------------- frame ----------------
function draw(ctx, t) {
  if (t > B.end + .3) { ctx.drawImage(FF.TX.sky, 0, 0); const c0 = camAt(B.end); FF.putPlane(ctx, c0, 0); FF.putPlane(ctx, c0, 1); FF.endPlate(ctx, t, B.end); FF.endCard(ctx, t, S.endCard, B.end); return; }
  const cm = camAt(t), [z1, ex1, ey1] = FF.layerM(cm, 1);
  FF.backdrop(ctx, cm, t);
  // the world: the ravine (and my cross sinking into its mist), the path, the arch
  const FX = fallX(t);
  FF.layer(ctx, cm, 1, () => {
    FF.drawRoad(ctx, ROAD); FF.drawGap(ctx, GAP);
    if (FX && FX.clip) { ctx.save(); ctx.clip(GAP.path); drawCross(ctx, 'mine', FX.u0, L, FX.x, FX.y, FX.a, true);
      const cc = FF.pt(FX, (FX.u0 + L) / 2); FF.glowAt(ctx, cc[0], cc[1], 160, .35 * (1 - FX.fade)); ctx.restore(); }
    FF.gapMist(ctx, t, GAP, B.fall);   // mist rising in the ravine (and a gust of it when my cross goes down)
    FF.gapEdges(ctx, GAP);
    FF.arch(ctx, t, ARCH);
    if (t >= 18.75 && t < 19.75) guide(ctx, t, eio((t - 18.75) / .35), 1 - ss(19.4, 19.75, t));
    if (t >= 22.4) slots(ctx, t, ss(22.4, 22.85, t));
  });
  FF.midFog(ctx, cm, t);
  // the action layer, with its rim of fog light (and warm light from the arch once it is in view)
  const M = poseMe(t), pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  FF.action(ctx, z1, ex1, ey1, FY - 760, FY + 220, a => drawAction(a, t, M, pils));
  FF.rim(ctx, ...FF.RIM_FOG(z1), 1);
  FF.rim(ctx, ...FF.RIM_WARM(z1), ss(12.2, 13.2, t) * .85);
  // warm light: my cross carries it; the pieces glow when I look back
  FF.layer(ctx, cm, 1, () => {
    if (M.X) { const cc = FF.pt(M.X, (M.X.u0 + L) / 2); FF.glowAt(ctx, cc[0], cc[1], 190, .18); }
    if (FX && !FX.clip) { const cc = FF.pt(FX, (FX.u0 + L) / 2); FF.glowAt(ctx, cc[0], cc[1], 190, .18); }
    for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), hl = ss(B.back + .2 + (2 - c.k) * .15, B.back + .6 + (2 - c.k) * .15, t);
      FF.glowAt(ctx, p.cx, p.cy, 170, (.08 + .55 * hl) * (.85 + .15 * Math.sin((t - B.back) * 5 + c.k))); }
    FF.flecks(ctx, t, FLECKS);
  });
  // foreground: low fog over the path, the dark bank, the framing trunks and moss, the dark canopy (keeps the words clear)
  FF.foreground(ctx, cm, t);
  if (t < B.end) FF.captions(ctx, t, S.lines);
  FF.endPlate(ctx, t, B.end);
  FF.endCard(ctx, t, S.endCard, B.end);
}
async function init() {
  buildTimeline();
  FF.init({ cam: camAt, dur: S.DUR });
  FF.forest(); FF.buildFrame(); buildWorld();
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: FF.FONTS, init, draw });
</script>
