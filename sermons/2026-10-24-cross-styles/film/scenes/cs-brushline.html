<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script><script src="kit-brushline.js"></script>
<script>
/* cs-brushline — 잘라 낸 건 다리였다, drawn as a minimal black brush-pen line on white (from lab-brushline, ref 15).
   Same look as the approved lab: very few strokes, each a pressure ribbon with tapered ends and a dry tail, white-filled
   shapes, everything boiling (3 drawings on 8 fps), hand-lettered words (Hi Melody, inked twice).
   "Me" is the lab's bear in full black brush; the others are the same bears in a thin grey brush (quieter). The one
   colour is the lab's warm spot-colour dab: it sits under MY cross (and later the cut pieces), and fills the far doorway.
   The medium carries the turn: the world is one long brush line — the road — and the gap is simply where the line
   breaks off and falls away. My short cross can't reach the other end of the line; the cut pieces, dabbed warm again,
   fly back into the brushed dashes of my whole cross. Everything is redrawn in screen space (the camera never scales the brush). */
/* The STYLE (paper, brush, boil, warm dab, the bear rig, the ground line and its break, the doorway, words) is the
   house-style kit styles/brushline (vendored as kit-brushline.js); this file keeps only the story: the cross, the saw,
   the timeline, the poses, the camera and the order things are drawn in. */
const K = BrushLine, HD = K.HD, TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
const { brS, brW, pathS, whiteS, dabS, dabPoly, toS, cpt, rotAbout, mixX, farU, nearU, attach, gripCarry, walkSpec, standSpec, mixSpec, drawBear } = K;
const INK = K.INK, GREY = K.GREY, PAPER = K.PAPER;
const L = 520, PW = 34, CBX = L - 120, CBW = 32, CBH = 112, CBHL = 40;   // cross: post length/width, crossbar position (from foot), thickness, half-length upright / lying
const FY = 1300, LYY = FY - 16;                                          // the ground line; where a lying cross sits on it
const REST = 26, G = L - 2 * REST;                                        // a full cross rests 26 on each end of the line: the gap is G wide
const SME = 1.0, SPI = .84;                                               // me (nearest) bigger than the others
const t12 = K.t12, frac = K.frac, bf = K.bf;
const PINU = 52;   // where the free hand pins the beam while I saw (from the cut)
const mulM = HD.mul, xf = HD.xf;

// ---------------- the cross (local: foot at u=0, top at u=L, v across) ----------------
function crossOutline(lying) { const hb = lying ? CBHL : CBH;
  return [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],
    [CBX + CBW / 2, PW / 2], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, PW / 2], [0, PW / 2]]; }
function clipU(P, u0, u1) {
  const cl = (P, keep, X) => { const o = []; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length], ka = keep(a), kb = keep(b);
    if (ka) o.push(a); if (ka !== kb) o.push([X, a[1] + (b[1] - a[1]) * (X - a[0]) / (b[0] - a[0])]); } return o; };
  return cl(cl(P, p => p[0] >= u0 - 1e-6, u0), p => p[0] <= u1 + 1e-6, u1);
}
// X = { x, y, a } foot origin + angle. o = { lying, mine, alpha, seed }
function drawCross(X, u0, u1, o = {}) {
  if (u1 - u0 < 1) return;
  const S = mulM(K.M, HD.mat(X.x, X.y, X.a)), lying = !!o.lying, sd = o.seed || 300, mine = !!o.mine;
  const P = clipU(crossOutline(lying), u0, u1), dense = HD.poly(P, true, 3);
  const scr = HD.boil(HD.wob(xf(dense, S), sd, 1.4, 110), sd, K.fd, 1.2, 70);
  const al = o.alpha ?? 1; K.g.save(); K.g.globalAlpha = al;
  whiteS(scr);
  if (mine) dabPoly(scr, al);
  HD.ink(K.g, scr, { w: (mine ? 9.5 : 6) * K.pz, ts: 6, te: 6, mn: .6, press: .28, pw: 60, rough: .08, seed: sd + 1, col: mine ? INK : GREY });
  // one brushed grain line down the post (fixed in u, so the cut pieces line up again)
  const ga = Math.max(40, u0 + 10), gb = Math.min(CBX - 40, u1 - 10);
  if (gb - ga > 30) brS(xf(HD.seg([ga, -PW * .12], [gb, -PW * .12], 4), S), sd + 9, { w: mine ? 4.5 : 3.2, ts: 10, te: 26, mn: .15, col: mine ? INK : GREY, dry: .4 });
  K.g.restore();
  return scr;
}

// ---------------- the saw (a few brush strokes) ----------------
const CUT_ANG = Math.PI - .72, BLADE = 160;
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];
  return { d, up, heel: [grip[0] - up[0] * 14 + d[0] * 20, grip[1] - up[1] * 14 + d[1] * 20] }; }
function drawSaw(grip, ang, seed = 1400) {
  const { d, up, heel } = sawGeo(grip, ang), P = (u, v) => toS([heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v]);
  const blade = [P(0, 30), P(BLADE, 17), P(BLADE, -3), P(0, -3)];
  whiteS(blade); brS(HD.poly([P(0, 30), P(BLADE, 17), P(BLADE, -2)], false, 3), seed, { w: 6, ts: 6, te: 8 });
  const teeth = []; for (let u = BLADE; u >= 2; u -= 10) { teeth.push(P(u, -2)); teeth.push(P(u - 5, -9)); } teeth.push(P(0, -2));
  brS(teeth, seed + 1, { w: 4, ts: 4, te: 4, mn: .5, dry: 0, wob: .5, boil: .6 });
  const h = HD.spline([P(-2, 34), P(-34, 44), P(-52, 20), P(-40, -6), P(-4, 0)], 3, true);
  whiteS(h); brS(h, seed + 2, { w: 8, ts: 6, te: 6, mn: .5 });
  brS(HD.spline([P(-14, 28), P(-31, 32), P(-38, 18), P(-30, 8), P(-14, 12)], 2, true), seed + 3, { w: 5, ts: 3, te: 3, mn: .6, dry: 0 });
}

// ---------------- timeline: my path (integrated once), the cuts ----------------
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 44 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1));        // staggering
  if (t < 4.6) return 0;
  if (t < 5.0) return 380 * eio((t - 4.6) / .4);                            // lighter: big bounding strides
  if (t < 8.3) return 380;
  if (t < 8.6) return lerp(380, 150, (t - 8.3) / .3);
  if (t < 9.0) return 150 * (1 - ss(8.6, 9.0, t));
  if (t < 10.15) return 0;
  if (t < 10.4) return 720 * Math.sin(Math.PI * (t - 10.15) / .25);
  if (t < 11.5) return 0;
  if (t < 12.0) return 832 * Math.sin(Math.PI * (t - 11.5) / .5);
  return 0;
}
const strideMe = t => t < 4.6 ? 110 : t < 8.8 ? 270 : 170;
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };
const meX = t => tab(MEX, t), meP = t => tab(MEP, t);
const CUTS = [{ s: 3.2, d: .3, saw0: 3.5, drop: 4.0, up1: 4.4 }, { s: 9.0, d: .3, saw0: 9.3, drop: 9.8, up1: 10.15 }, { s: 10.4, d: .3, saw0: 10.7, drop: 11.2, up1: 11.5 }];   // set-down / pick-up take 3–4 drawings
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const FILL = [[22.2, 23.3], [22.65, 23.7], [23.1, 24.1]];
const FLECKS = [];
let E = 1600, GX = 0, GAY = 0, SAWLIE = null, EDGE = 0;
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }
  E = meX(12) + 70; EDGE = E - 92; GX = E + G + 300; GAY = FY - 250;
  CUTS.forEach((c, k) => {
    c.k = k; c.mx = meX(c.s); c.cutX = c.mx - 168; c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.baseX = c.cutX - c.u1; c.y = LYY;
    const r = rng(100 + k);
    for (let n = 0; n < 14; n++) FLECKS.push({ t0: n < 10 ? lerp(c.saw0, c.drop, n / 10) : c.drop + r() * .05, x: c.cutX + (r() - .5) * 8, y: c.y - PW / 2,
      vx: (r() - .5) * (n < 10 ? 170 : 300), vy: -(80 + r() * (n < 10 ? 150 : 240)), land: FY - 4, r0: r() * TAU, vr: (r() - .5) * 20, sz: 5 + r() * 5, seed: 2000 + k * 40 + n });
  });
  const c3 = CUTS[2]; SAWLIE = { grip: [c3.cutX + 150, FY - 34], ang: Math.PI + .02 };
  const r = rng(200);
  for (let n = 0; n < 12; n++) FLECKS.push({ t0: B.fall + r() * .1, x: E + 6 + r() * 30, y: LYY, vx: (r() - .2) * 240, vy: -(60 + r() * 200), land: 2800, r0: r() * TAU, vr: (r() - .5) * 24, sz: 5 + r() * 6, seed: 2300 + n });
}
function pieceAt(c, t) {   // a cut piece lying on the line where it fell — it never moves again
  const sh = 18 * eo((t - c.drop) / .25), cu = (c.u0 + c.u1) / 2, cx = c.baseX + cu - sh, cy = c.y, a = -.04 * eo((t - c.drop) / .25);
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, cx, cy };
}
const SLOTS = [[22.9, 0], [23.6, 1], [24.3, 2]];   // the outline's missing span lights one piece-length at a time (soft knocks in the soundtrack)

// ---------------- poses ----------------
// the cross on a bear's shoulder: it rests on the back shoulder, foot trailing down behind, the crossing up above the head
const TOPX = 312;
function carryCross(F, left, a0) {   // the last, short cross is slung lower: its crossbar shows behind the shoulder, not hidden by the head
  const contact = left < .55 ? L - 50 : L - Math.min(TOPX * F.s, left * L - 40);
  return { ...K.shoulder(F, a0, PW, contact), u0: L * (1 - left) };
}
const hangAng = f => f > 0 ? .5 : Math.PI - .5;
const hangGrip = K.hangGrip;
function sawState(c, t) {
  const kp = clamp((t - c.saw0) / (c.drop - .06 - c.saw0)), saw = t >= c.saw0 - .05 && t < c.drop + .02;
  const osc = saw ? 26 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, g0 = sawGeo([0, 0], CUT_ANG), d = g0.d, up = g0.up;
  const K = [c.cutX, c.y - PW / 2 + kp * PW * .92], heel = [K[0] - d[0] * (92 - osc), K[1] - d[1] * (92 - osc)];
  return { kp, grip: [heel[0] + up[0] * 14 - d[0] * 20, heel[1] + up[1] * 14 - d[1] * 20], K };
}
function sawSpec(c, t) {   // turned back to the cross, bent over it: the far paw pins it beside the cut, the near paw saws
  const f = -1, mx = c.mx, s = SME, st = sawState(c, t);
  return { kind: 'me', s, f, gy: FY, hip: [mx, FY - 80 * s], ang: f * .62, feet: [[mx + 44, FY], [mx - 30, FY]], hands: [[c.cutX + 52, c.y - PW / 2 - 6], st.grip],
    hand: ['flat', 'grip'], tilt: .25, eye: 'down', farFront: true };
}

function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), left = leftAt(t);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const w = Math.sin(tt * TAU / 1.15); const F = walkSpec(x, FY, SME, 1, ph, 110, .26 + .07 * w, 14); F.eye = 'squeeze'; F.tilt = .2; F.sweat = 1;
      F.hip[1] += 7 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, -1.1 + .04 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt); const F = walkSpec(x, FY, SME, 1, ph, lerp(110, 270, k), lerp(.2, .04, k), lerp(16, 64, k)); F.run = tt < 8.4 ? k : 0;
      F.eye = k > .5 ? 'happy' : 'dot'; F.tilt = lerp(.12, -.1, k); return [F, -1.05]; }
    const F = walkSpec(x, FY, SME, 1, ph, 170, .1, 30); F.eye = 'happy'; return [F, -1.05];
  };
  const sawHeld = t < CUTS[2].drop;
  const carried = (F, a0, lf, held) => { const X = carryCross(F, lf, a0); gripCarry(F, X, held);
    if (held) F.hands[1] = hangGrip(F, F.ph != null ? 10 * Math.sin(TAU * F.ph) : 0); return [F, X]; };
  const me = F => { F.kind = 'me'; return F; };
  for (const c of CUTS) {
    if (t >= c.s && t < c.up1) {
      const lf0 = S.left[c.k], lf1 = S.left[c.k + 1], [W0, a0] = walk(c.s, c.mx), [W1, a1] = walk(c.up1, c.mx), last = c.k === 2;
      const [WA, XA] = carried(W0, a0, lf0, true), [WB, XB] = carried(W1, a1, lf1, !last);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      const PIN = c.u1 + PINU;
      if (t < c.s + c.d) { const k = eio((tp - c.s) / c.d), F = mixSpec(WA, SP, k), X = mixX(XA, XL, eio(clamp(k * 1.5)), .7);   // the beam gets down quickly (no long diagonal 'X' frames)
        const XX = attach(F, X, 0, lerp(farU(XA), PIN, k), -PW / 2 * k);   // the free paw stays on the beam all the way down
        F.hands[1] = [lerp(WA.hands[1][0], cg[0], k), lerp(WA.hands[1][1], cg[1], k)]; F.hand = ['grip', 'grip'];
        return { F: me(F), X: XX, c, saw: { grip: F.hands[1], ang: lerp(hangAng(1), CUT_ANG, k) } }; }
      if (t < c.drop) { const st = sawState(c, t); return { F: me(sawSpec(c, t)), X: XL, c, kerf: st, saw: { grip: st.grip, ang: CUT_ANG } }; }
      const k = eio((tp - c.drop) / (c.up1 - c.drop)), k2 = eio((tp - c.drop) / ((c.up1 - c.drop) * .55)), F = mixSpec(SP, WB, k), X = mixX(XL, XB, eio(clamp(k * 1.6)), .3);   // ...and up onto the shoulder before the saw hand moves
      const XX = attach(F, X, 0, lerp(PIN, farU(XB), k), -PW / 2 * (1 - k));   // ...and lifts it back onto the shoulder
      const rT = last ? cpt(XX, nearU(XB)) : WB.hands[1], kk = last ? k : k2;   // the saw paw moves off forward first (the far paw has the beam, low behind)
      F.hands[1] = [lerp(cg[0], rT[0], kk), lerp(cg[1], rT[1], kk)]; F.hand = ['grip', 'grip'];
      const saw = last ? null : { grip: F.hands[1], ang: lerp(CUT_ANG, hangAng(1), k2) };
      return { F: me(F), X: XX, c, saw };
    }
  }
  if (t < 12) { const [F, a] = walk(tp); const [G2, X] = carried(F, a, left, sawHeld); return { F: me(G2), X, saw: sawHeld ? { grip: G2.hands[1], ang: hangAng(1) } : null }; }
  // at the edge: stop short (shock), stand the short cross on the ground in front of me (both paws on its post), step back for the others, come back
  const XUP = bx => ({ x: EDGE + bx + 138, y: FY - 2 + L * (1 - left), a: -Math.PI / 2, u0: L * (1 - left), lie: false });   // its cut foot on the ground
  const upHands = X => [cpt(X, X.u0 + 178, PW / 2), cpt(X, X.u0 + 112, -PW / 2)];
  if (t < 18.4) { const [F0] = walk(12, EDGE), k = eio((tp - 12) / .3), F = mixSpec(F0, standSpec(EDGE, FY, SME, 1, .04), k);
    F.ang += -.14 * Math.sin(Math.PI * clamp((tp - 12) / .5)) * (tp < 12.5 ? 1 : 0); F.eye = tp < 13.2 ? 'shock' : 'dot'; F.ticks = tp > 12.05 && tp < 13.2;
    // the cross slides down my back till its foot is on the ground (paws on the beam), then I swing it round to stand in front of me —
    // it stays behind the body the whole way (no crossbar over the head)
    const [, XC] = carried(F0, -1.05, left, false), XU = XUP(0), XD = { ...XC, y: XC.y + (FY - 2 - cpt(XC, XC.u0)[1]) };
    const ka = eio((tp - 12.2) / .3), kb = eio((tp - 12.5) / .4); let X;
    if (kb <= 0) { X = mixX(XC, XD, ka, 2); F.hands = [cpt(X, farU(XC)), cpt(X, nearU(XC))]; F.carry = true; }
    else { X = mixX(XD, XU, kb, 2); F.hands = [cpt(X, lerp(farU(XC), XU.u0 + 178, kb), PW / 2 * kb), cpt(X, lerp(nearU(XC), XU.u0 + 112, kb), -PW / 2 * kb)]; F.carry = kb < .5; }
    F.hand = ['grip', 'grip'];
    return { F: me(F), X }; }
  const u0 = L * (1 - left), XLay = { x: E - REST - u0, y: LYY, a: 0, u0, lie: true };
  const LAY = me({ ...standSpec(EDGE, FY, SME, 1), hip: [EDGE + 6, FY - 78 * SME], ang: .62, feet: [[EDGE - 30, FY], [EDGE + 30, FY]], tilt: .3, eye: 'down' });
  LAY.hands = [cpt(XLay, u0 + 64, -PW / 2), cpt(XLay, u0 + 22, -PW / 2)]; LAY.hand = ['flat', 'flat'];   // pressing the near end down on the line
  const REACH = me({ ...LAY, hip: [EDGE, FY - 84 * SME], ang: .34, hands: [[EDGE + 120, FY - 40], [EDGE + 176, FY - 60]], hand: ['open', 'open'], eye: 'shock', tilt: .3, ticks: true });   // both paws reach down after it, below the chin
  if (t < B.tip) { if (t < 18.9) { const XU = XUP(0), ST = me({ ...standSpec(EDGE, FY, SME, 1, .04), hands: upHands(XU), hand: ['grip', 'grip'] }), k = eio((tp - 18.4) / .4);
      const X = mixX(XU, XLay, eio(clamp(k * 1.4)), .55), F = mixSpec(ST, LAY, k);   // both paws stay on the post while I lay it down
      let XX = attach(F, X, 0, lerp(XU.u0 + 178, u0 + 64, k), lerp(PW / 2, -PW / 2, k)); XX = attach(F, XX, 1, lerp(XU.u0 + 112, u0 + 22, k), -PW / 2);
      F.hands[0] = cpt(XX, lerp(XU.u0 + 178, u0 + 64, k), lerp(PW / 2, -PW / 2, k));
      F.hand = k > .5 ? ['flat', 'flat'] : ['grip', 'grip']; return { F: me(F), X: XX }; }
    return { F: LAY, X: XLay }; }
  if (t < B.back) { const k = eio((tp - B.tip) / .22), F = mixSpec(LAY, REACH, k); F.hand = REACH.hand; F.bang = tp >= B.tip && tp < B.fall + .7; F.ticks = tp < 20.6;
    if (tp > 20.4) { F.eye = 'down'; F.ticks = false; } return { F: me(F), X: null }; }
  // I stay at the lip: turn and look back down the line at the pieces, then turn back to the gap and look down at the outline
  const BACK = me({ ...standSpec(EDGE, FY, SME, -1, .04), tilt: .05, eye: 'dot' }), FWD = me({ ...standSpec(EDGE, FY, SME, 1, .1), tilt: .22, eye: 'down' });
  if (t < 22.45) { const F = mixSpec(REACH, BACK, eio((tp - B.back) / .6)); F.eye = tp > B.back + .15 ? 'dot' : 'down'; F.ticks = tp > 21.75 && tp < 22.3; return { F, X: null }; }
  const F = mixSpec(BACK, FWD, eio((tp - 22.45) / .6)); return { F, X: null };
}
// my cross once my paws slip: it tips over the end of the line, then falls into the white below
function fallX(t) {
  if (t < B.tip) return null;
  const left = S.left[3], u0 = L * (1 - left), pv = [E, LYY + PW / 2];
  const X0 = { x: E - REST - u0, y: LYY, a: 0, u0, lie: true };
  if (t < B.fall) return rotAbout(X0, pv, .5 * Math.pow((t - B.tip) / (B.fall - B.tip), 2));
  const X1 = rotAbout(X0, pv, .5), u = t - B.fall, cu = (u0 + L) / 2, c0 = cpt(X1, cu);
  const cx = c0[0] + 80 * u, cy = c0[1] + 160 * u + 1500 * u * u, a = X1.a + 2.4 * u + 1.2 * u * u;
  return { ...X1, x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, alpha: 1 - ss(B.fall + .55, B.fall + 1.0, t), clip: true };
}

// ---------------- the others: lay it across → walk over → pull it back from the far side → shoulder it → into the light ----------------
const PIL = [{ x0: -640, ph: .3 }, { x0: -360, ph: .75 }, { x0: 330, ph: .1 }, { x0: 600, ph: .55 }];
const BRIDGE_Y = [LYY, LYY, LYY], PULL = 210;
function pilState(i, t) {
  const tp = t12(t), P = PIL[i], j = 3 - i, T = j < 3 ? B.bridges[j] : 99, yb = BRIDGE_Y[j] ?? LYY, pe = E - 70;
  const tag = F => { F.kind = 'pil'; F.id = i; return F; };
  const xAt = tt => { if (tt <= 9 || j > 2) return P.x0 + 52 * tt; const xa = P.x0 + 468, xb = E - 320 - 140 * j, xc = pe;
    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, clamp((tt - 12) / (T - .35 - 12))); };
  const carry = (tt, x, stride = 104, lean = .2) => { const F = tag(walkSpec(x, FY, SPI, 1, P.ph + x / stride, stride, lean, 14)); F.tilt = .06; const X = carryCross(F, 1, -1.08); gripCarry(F, X, false); return [F, X]; };
  if (j > 2) { if (t >= 12) return null; const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  if (t < T - .35) { const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  const XB = { x: E - REST, y: yb, a: 0, u0: 0, lie: true };
  const LAY = tag({ ...standSpec(pe, FY, SPI, 1), hip: [pe + 6, FY - 76 * SPI], ang: .6, feet: [[pe - 26, FY], [pe + 26, FY]], tilt: .25 });
  LAY.hands = [cpt(XB, 60, -PW / 2), cpt(XB, 20, -PW / 2)]; LAY.hand = ['flat', 'flat'];
  if (t < T) { const [F0, X0] = carry(T - .35, pe), k = eio((tp - T + .35) / .35), X = mixX(X0, XB, eio(clamp(k * 1.4)), .55), F = tag(mixSpec(F0, LAY, k));
    F.hands = [cpt(X, lerp(farU(X0), 60, k), -PW / 2 * k), cpt(X, lerp(nearU(X0), 20, k), -PW / 2 * k)]; F.hand = ['grip', 'grip']; F.carry = k < .5; return { F, X }; }
  const xs0 = E + 4, xs1 = E + G + 70;
  if (t < T + .3) { const F = tag(mixSpec(LAY, standSpec(xs0, yb - PW / 2, SPI, 1, .1), eio((tp - T) / .25))); return { F, B: XB }; }
  if (t < T + .9) { const x = lerp(xs0, xs1, eio(clamp((tp - T - .3) / .6))), gy = x < E + G + 4 ? yb - PW / 2 : FY;
    const F = tag(walkSpec(x, gy, SPI, 1, P.ph + x / 150, 150, .1, 24)); return { F, B: XB }; }
  // from the far side: turn, crouch, take the top end and pull it back across
  const pv = [E + G, yb + PW / 2], pullX = k => rotAbout({ ...XB, x: XB.x + PULL * k }, pv, -.1 * k), xpAt = k => xs1 + 40 + PULL * k;
  const PULLS = k => { const X = pullX(k), x = xpAt(k); const F = tag({ ...standSpec(x, FY, SPI, -1), hip: [x + 8, FY - 74 * SPI], ang: -.55, feet: [[x + 30, FY], [x - 24, FY]], tilt: .2 });
    F.hands = [cpt(X, L - 30, -PW / 2), cpt(X, L - 76, -PW / 2)]; F.hand = ['grip', 'grip']; return [F, X]; };
  if (t < T + 1.25) { const k = eio(clamp((tp - T - .9) / .35)), [F, X] = PULLS(k);
    const k0 = eio((tp - T - .9) / .1); return { F: k0 < 1 ? tag(mixSpec(walkSpec(xs1, FY, SPI, 1, 0, 150, .1), F, k0)) : F, X }; }
  const [Fp, Xp] = PULLS(1), xg = xpAt(1);
  if (t < T + 1.5) { const k = eio((tp - T - 1.25) / .25), [Fc, Xc] = carry(T + 1.5, xg, 130, .16), X = mixX(Xp, Xc, k, .3), F = tag(mixSpec(Fp, Fc, k));
    F.hands = [cpt(X, lerp(L - 30, farU(Xc), k), -PW / 2 * (1 - k)), cpt(X, lerp(L - 76, nearU(Xc), k), -PW / 2 * (1 - k))]; F.hand = ['grip', 'grip']; F.carry = k > .5; return { F, X }; }
  const x = lerp(xg, GX + 10, clamp((tp - T - 1.5) / .35)), [F, X] = carry(tp, x, 130, .16);
  F.alpha = 1 - ss(T + 1.55, T + 1.85, t); if (F.alpha <= 0) return null;
  return { F, X };
}

// ---------------- camera ----------------
const mixCam = K.mixCam;
function camAt(t) {   // the line sits low (≈1440 on screen), so the figures fill the frame
  const cy = z => FY - 470 / z;
  let c = { x: meX(t) + 70 + 80 * ss(4.3, 5.4, t), y: cy(1.12), z: 1.12 };
  c = mixCam({ x: meX(t) + 40, y: cy(1.4), z: 1.4 }, c, eio((t - 1.5) / 1.1));       // the hook: close on me (the saw in my paw), widening to the procession by ~2.6
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: (cc.mx + cc.cutX) / 2 + 10, y: cy(1.3), z: 1.3 });
  c = mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = mixCam(c, mixCam(at(c2), at(c3), eio((t - 10.1) / .45)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));   // the break in the line stays out of frame until I reach it
  if (t >= 12) c = mixCam(c, { x: E + 330, y: cy(.86), z: .86 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = mixCam(c, { x: E + 140, y: cy(1.12), z: 1.12 }, eio((t - 18.2) / .45));
  if (t >= B.fall) c = mixCam(c, { x: E + 120, y: cy(1.32) + 60, z: 1.32 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .65) c = mixCam(c, { x: E + 110, y: cy(1.12), z: 1.12 }, eio((t - B.fall - .65) / .7));
  if (t >= B.back) c = mixCam(c, { x: E - 345, y: cy(1.3), z: 1.3 }, eio((t - B.back - .05) / .72));    // one move back along the line: the pieces glow where they lie
  if (t >= 22.2) c = mixCam(c, { x: E + 160, y: cy(1.14), z: 1.14 }, eio((t - 22.2) / .65));            // and back: the gap, me at the lip, the outline
  const k = 1 - ss(B.fall, B.fall + .55, t);
  [c.sx, c.sy] = K.shake(t, B.fall);
  return c;
}

// ---------------- the world: one long brush line (kit pieces placed for this story) ----------------
let TUFTS = [], GL = null;
function guide(t, k, al) {   // brushed dashes: the outline of my whole cross across the gap
  const S0 = mulM(K.M, HD.mat(E - REST, LYY, 0)), ol = HD.poly(crossOutline(true), true, 3), x1 = (L + 8) * k - 4;
  const pts = xf(ol.filter(p => p[0] <= x1 + .5), S0); if (pts.length < 2) return;
  K.g.save(); K.g.globalAlpha = al;
  K.dashed(pts, t, 4400);
  K.g.restore();
}
function litSlots(t) {   // each slot of the missing span lights warm — exactly one piece long; the outline stays a ghost, the gap stays open
  const S0 = mulM(K.M, HD.mat(E - REST, LYY, 0));
  for (const [t0, k] of SLOTS) { const a = eo((t - t0) / .3); if (a <= 0) continue; const c = CUTS[k];
    const P = xf(HD.poly(clipU(crossOutline(true), c.u0 + 2, c.u1 - 2), true, 3), S0);
    K.g.save(); K.g.globalAlpha = a; K.g.fillStyle = PAPER; pathS(K.g, P); K.g.fill(); K.g.restore();
    dabPoly(P, a); dabPoly(P, a * .8);
    const fl = 1 - ss(t0 + .15, t0 + .7, t); if (fl > 0) { const cc = xf([[(c.u0 + c.u1) / 2, 0]], S0)[0], rx = ((c.u1 - c.u0) / 2 + 26) * K.cam.z, ry = 46 * K.cam.z;
      for (let i = 0; i < 6; i++) { const an = -Math.PI * (.1 + i * .16); K.g.save(); K.g.globalAlpha = fl;
        brS(HD.seg([cc[0] + Math.cos(an) * rx, cc[1] + Math.sin(an) * ry], [cc[0] + Math.cos(an) * rx * 1.3, cc[1] + Math.sin(an) * ry * 1.5], 2), 4900 + k * 10 + i, { w: 6, ts: 3, te: 10, dry: 0 }); K.g.restore(); } } }
}
function world(t) {
  K.drawGround(GL, TUFTS, FY);
  if (toS([GX - 300, 0])[0] < W + 40) K.doorway(t, { x: GX, gy: FY, ay: GAY });
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  for (const P of pils) if (P.B) drawCross(P.B, 0, L, { lying: true, seed: 330 + P.F.id * 9 });
  pils.slice().sort((a, b) => a.F.hip[0] - b.F.hip[0]).forEach(P => {
    const X = P.X, dc = X ? () => drawCross(X, X.u0, L, { lying: X.lie, seed: 340 + P.F.id * 9, alpha: P.F.alpha ?? 1 }) : null;
    drawBear(P.F, X && !X.lie ? dc : null, X && X.lie ? dc : null);
  });
  if (t >= 18.75 && t < 19.75) guide(t, eio((t - 18.75) / .35), 1 - ss(19.4, 19.75, t));
  if (t >= 22.35) { guide(t, eio((t - 22.35) / .45), 1); litSlots(t); }
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip; drawSaw([lerp(g0[0], SAWLIE.grip[0], k), lerp(g0[1], SAWLIE.grip[1], k)], lerp(CUT_ANG, SAWLIE.ang, k)); }
  // the pieces I cut, lying on the line where they fell; once I look back each one glows warm where it lies (they never move)
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), hl = ss(B.back + .3 + (2 - c.k) * .18, B.back + .75 + (2 - c.k) * .18, t);
    const cc = toS([p.cx, p.cy]), pulse = hl * (.85 + .15 * Math.sin((t - B.back) * 4 + c.k));
    if (hl > 0) dabS(cc[0], cc[1], ((c.u1 - c.u0) / 2 + 56) * K.cam.z, 66 * K.cam.z, 1, c.k * 3, pulse);
    drawCross(p, c.u0, c.u1, { lying: true, mine: true, seed: 360 + c.k * 7 });
    if (hl > 0) for (let i = 0; i < 6; i++) { const a = -Math.PI * (.12 + i * .15), rx = ((c.u1 - c.u0) / 2 + 40) * K.cam.z, ry = 50 * K.cam.z;
      K.g.save(); K.g.globalAlpha = hl; brS(HD.seg([cc[0] + Math.cos(a) * rx, cc[1] + Math.sin(a) * ry], [cc[0] + Math.cos(a) * rx * 1.3, cc[1] + Math.sin(a) * ry * 1.5], 2), 4500 + c.k * 10 + i, { w: 6, ts: 3, te: 10, dry: 0 }); K.g.restore(); } }
  // me and my cross (and the saw in my near paw)
  const M = poseMe(t), F = M.F;
  const myCross = X => { if (X) drawCross(X, X.u0, L, { lying: X.lie, mine: true, seed: 300 }); };
  drawBear(F, M.X && !M.X.lie ? () => myCross(M.X) : null, () => {
    if (M.X && M.X.lie) myCross(M.X);
    if (M.kerf) { const a = toS([M.c.cutX, M.c.y - PW / 2]), b = toS([M.c.cutX, M.c.y - PW / 2 + M.kerf.kp * PW * .92 + .5]); brS([a, b], 4700, { w: 5, raw: true, ts: 1, te: 1, mn: 1, dry: 0 }); }
    if (M.saw) drawSaw(M.saw.grip, M.saw.ang);
  });
  if (M.c && t >= M.c.drop && t < M.c.drop + .12) { const c = M.c; for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * .45;
    brW(HD.seg([c.cutX + Math.cos(a) * 40, c.y - 24 + Math.sin(a) * 40], [c.cutX + Math.cos(a) * 76, c.y - 24 + Math.sin(a) * 76], 2), 4800 + i, { w: 6, ts: 3, te: 10, dry: 0 }); } }
  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { K.g.save(); if (FX.clip) { const a = toS([E + 3, FY - 4000]), b = toS([E + G - 3, FY + 9000]); K.g.beginPath(); K.g.rect(a[0], a[1], b[0] - a[0], b[1] - a[1]); K.g.clip();
      K.hl.save(); K.hl.beginPath(); K.hl.rect(a[0], a[1], b[0] - a[0], b[1] - a[1]); K.hl.clip(); }
    drawCross(FX, FX.u0, L, { lying: true, mine: true, seed: 300, alpha: FX.alpha ?? 1 });
    if (FX.clip) { K.hl.restore(); const cc = cpt(FX, (FX.u0 + L) / 2); for (let i = -1; i <= 1; i++) brW([[cc[0] + i * 46, cc[1] - 130], [cc[0] + i * 46, cc[1] - 290]], 4900 + i, { w: 6, ts: 4, te: 30, mn: .2 }); }
    K.g.restore(); }
  // the hit: brushed impact strokes at the end of the line
  K.hit(t, B.fall, [E + 20, FY + 10]);
  // sawdust: little brush specks
  K.specks(FLECKS, t);
}

// ---------------- frame ----------------
function draw(ctx, t) {
  K.begin(ctx, t, camAt(t));
  world(t);
  K.end(ctx, 1 - ss(B.end - .15, B.end + .35, t));   // the end card sits on plain paper
  K.captions(ctx, t, S.lines, { until: B.end }); K.endCard(ctx, t, S.endCard, B.end);
}
async function init() {
  K.init();
  buildTimeline();
  TUFTS = K.tufts({ x0: -1500, x1: E + G + 1600, skip: x => x > E - 60 && x < E + G + 60 });
  GL = K.groundLine({ from: -1600, to: E + G + 1800, gaps: [[E, E + G]] });
}
window.__dbg = () => ({ E, G, GX, cuts: CUTS.map(c => [c.mx, c.cutX, c.baseX, c.u0, c.u1]) });
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 86px 'Hi Melody'"], init, draw });
</script>
