<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잘라 낸 건 다리였다 · 미니멀 붓선</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hi+Melody&display=swap">
</head>
<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* ---- hand-drawn toolkit (shared by the lab-* hand-drawn scenes; inlined at build time) ----
   Lines are variable-width ribbons built from densely sampled polylines: a static hand wobble per stroke (seeded),
   a boil displacement per drawing (3 drawings cycled on 8–12 fps), pressure along the length, tapered ends, ragged
   edges. Ink is laid on a white layer that is multiplied onto a paper whose tooth is a real height field, so ink drops
   out in the valleys and pencil only catches the peaks. */
const TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
const HD = {};
HD.hash = (i, s = 0) => { let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
HD.t12 = t => Math.floor(t * 12 + 1e-6) / 12;
HD.spline = (P, step = 3, closed = false) => {
  const n = P.length; if (n < 2) return P.map(p => p.slice());
  const get = i => closed ? P[((i % n) + n) % n] : P[clamp(i, 0, n - 1)];
  const out = [], segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), m = Math.max(1, Math.ceil(L / step));
    for (let j = 0; j < m; j++) { const t = j / m, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3))); }
  }
  out.push(closed ? out[0].slice() : P[n - 1].slice()); return out;
};
HD.seg = (a, b, step = 4) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]), m = Math.max(1, Math.ceil(L / step)), o = [];
  for (let i = 0; i <= m; i++) o.push([lerp(a[0], b[0], i / m), lerp(a[1], b[1], i / m)]); return o; };
HD.poly = (P, closed = false, step = 4) => { const o = []; const n = P.length, m = closed ? n : n - 1; for (let i = 0; i < m; i++) { const sg = HD.seg(P[i], P[(i + 1) % n], step); if (i) sg.shift(); o.push(...sg); } return o; };
HD.arc = (cx, cy, rx, ry, a0, a1, step = 4, rot = 0) => { const L = Math.abs(a1 - a0) * Math.max(rx, ry), m = Math.max(2, Math.ceil(L / step)), o = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i <= m; i++) { const a = lerp(a0, a1, i / m), x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push([cx + x * c - y * s, cy + x * s + y * c]); } return o; };
HD.normals = pts => pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
HD.lengths = pts => { const s = [0]; for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return s; };
// hand wobble: perpendicular low-frequency displacement
HD.wob = (pts, seed, amp, wl = 120) => { if (!amp || pts.length < 2) return pts; const N = HD.normals(pts), Sx = HD.lengths(pts), oy = (seed * 17.37) % 997;
  return pts.map((p, i) => { const d = (noise(Sx[i] / wl, oy) - .5) * 2 * amp; return [p[0] + N[i][0] * d, p[1] + N[i][1] * d]; }); };
// one boiled drawing: a new wobble + a tiny drift, per drawing index f
HD.boil = (pts, seed, f, amp, wl = 90) => { if (!amp) return pts; const s = (seed * 31 + f * 977) | 0, dx = (HD.hash(s, 1) - .5) * amp, dy = (HD.hash(s, 2) - .5) * amp;
  return HD.wob(pts, s, amp, wl).map(p => [p[0] + dx, p[1] + dy]); };
HD.xf = (pts, m) => pts.map(p => [m.a * p[0] + m.c * p[1] + m.e, m.b * p[0] + m.d * p[1] + m.f]);   // apply a DOMMatrix-like
HD.mat = (x, y, rot = 0, sx = 1, sy = sx) => { const c = Math.cos(rot), s = Math.sin(rot); return { a: c * sx, b: s * sx, c: -s * sy, d: c * sy, e: x, f: y }; };
HD.mul = (A, Bm) => ({ a: A.a * Bm.a + A.c * Bm.b, b: A.b * Bm.a + A.d * Bm.b, c: A.a * Bm.c + A.c * Bm.d, d: A.b * Bm.c + A.d * Bm.d, e: A.a * Bm.e + A.c * Bm.f + A.e, f: A.b * Bm.e + A.d * Bm.f + A.f });
HD.pt = (m, x, y) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
// variable-width ribbon (round caps where the end is wide)
HD.ribbon = (pts, wf) => {
  const n = pts.length, N = HD.normals(pts), Sx = HD.lengths(pts), L = Sx[n - 1] || 1, Lf = [], Rt = [], ws = [];
  for (let i = 0; i < n; i++) { const w = Math.max(0, wf(Sx[i] / L, Sx[i], i, L)) / 2; ws.push(w); Lf.push([pts[i][0] + N[i][0] * w, pts[i][1] + N[i][1] * w]); Rt.push([pts[i][0] - N[i][0] * w, pts[i][1] - N[i][1] * w]); }
  const p = new Path2D(); p.moveTo(Lf[0][0], Lf[0][1]); for (let i = 1; i < n; i++) p.lineTo(Lf[i][0], Lf[i][1]);
  const ae = Math.atan2(N[n - 1][1], N[n - 1][0]); if (ws[n - 1] > .4) p.arc(pts[n - 1][0], pts[n - 1][1], ws[n - 1], ae, ae + Math.PI, true); else p.lineTo(Rt[n - 1][0], Rt[n - 1][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(Rt[i][0], Rt[i][1]);
  const a0 = Math.atan2(N[0][1], N[0][0]); if (ws[0] > .4) p.arc(pts[0][0], pts[0][1], ws[0], a0 + Math.PI, a0, true);
  p.closePath(); return p;
};
// an ink line: o = { w, ts, te (taper lengths px), mn (tip width fraction), press, pw (pressure wavelength), rough, seed, col, dry }
HD.ink = (ctx, pts, o = {}) => {
  if (!pts || pts.length < 2) return;
  const w = o.w ?? 8, ts = o.ts ?? w * 2.5, te = o.te ?? w * 3.5, mn = o.mn ?? .2, press = o.press ?? .3, pw = o.pw ?? 70, rough = o.rough ?? .08, seed = o.seed ?? 1, mnE = o.mnE ?? mn;
  const wf = (u, s, i, L) => { const k = Math.min(1, mn + (1 - mn) * ss(0, ts, s)) * Math.min(1, mnE + (1 - mnE) * ss(0, te, L - s));
    return w * k * (1 + press * (noise(s / pw, seed * 3.7 % 500) - .5) * 2) * (1 + rough * (HD.hash(i, seed) - .5) * 2); };
  ctx.fillStyle = o.col || '#151312'; ctx.fill(HD.ribbon(pts, wf));
  if (o.blob) { ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], w * o.blob, 0, TAU); ctx.fill(); }   // a marker resting a moment at the start
  if (o.dry) {   // dry-brush streaks in the tail: thin paper-white lines along the stroke
    const N = HD.normals(pts), Sx = HD.lengths(pts), L = Sx[Sx.length - 1], r = rng(seed * 7 + 3);
    ctx.save(); ctx.strokeStyle = o.paper || '#fff'; ctx.lineCap = 'round';
    for (let k = 0; k < (o.dryN || 4); k++) { const f = (r() - .5) * .7, u0 = 1 - o.dry * (.3 + .7 * r()); ctx.lineWidth = (o.dryW || 1) * (.5 + r() * .7); ctx.globalAlpha = .55 + r() * .45; ctx.beginPath(); let st = false;
      for (let i = 0; i < pts.length; i++) { const u = Sx[i] / L; if (u < u0) continue; const ww = wf(u, Sx[i], i, L) * f; const x = pts[i][0] + N[i][0] * ww, y = pts[i][1] + N[i][1] * ww; if (!st) { ctx.moveTo(x, y); st = true; } else ctx.lineTo(x, y); }
      ctx.stroke(); }
    ctx.restore();
  }
};
// a closed hand shape: fill (paper white or colour) — the outline is drawn separately with HD.ink
HD.fillPts = (ctx, pts, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); };
HD.pathOf = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (const q of pts) p.lineTo(q[0], q[1]); p.closePath(); return p; };

// ---- paper: a tooth height field (full frame) → paper colour, ink dropout (white specks), pencil deposit masks ----
HD.tooth = (seed = 1, s1 = 6, s2 = 2.2, fib = 0) => {
  const T = new Float32Array(W * H), r = rng(seed), ox = r() * 500, oy = r() * 500;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = .62 * noise(x / s1 + ox, y / s1 + oy) + .38 * noise(x / s2 + oy, y / s2 + ox);
    T[y * W + x] = v; }
  if (fib) { // fibres: thin streaks raised a little
    for (let k = 0; k < fib; k++) { let x = r() * W, y = r() * H, a = r() * TAU; const l = 8 + r() * 30;
      for (let i = 0; i < l; i++) { a += (r() - .5) * .3; x += Math.cos(a); y += Math.sin(a); const xi = x | 0, yi = y | 0; if (xi >= 0 && yi >= 0 && xi < W && yi < H) T[yi * W + xi] = Math.min(1, T[yi * W + xi] + .18); } } }
  return T;
};
// paper canvas: base colour, low-frequency mottling, embossed tooth (light from top-left), fine grain, edge falloff
HD.paper = (T, o = {}) => {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), d = g.createImageData(W, H), D = d.data, base = o.base || [250, 249, 245];
  const mot = o.mott ?? 6, emb = o.emb ?? 26, gr = o.grain ?? 4, vig = o.vig ?? 0, r = rng(o.seed || 9), mscale = o.mscale || 260;
  const tint = o.tint || [0, 0, 0];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, x0 = Math.max(0, x - 1), y0 = Math.max(0, y - 1), x1 = Math.min(W - 1, x + 1), y1 = Math.min(H - 1, y + 1);
    const sh = (T[y0 * W + x0] - T[y1 * W + x1]) * emb, m = (noise(x / mscale + 40, y / mscale + 7) - .5) * 2 * mot;
    const dx = (x / W - .5), dy = (y / H - .5), v = -vig * (dx * dx * 1.4 + dy * dy) * 4;
    const n = (r() - .5) * gr, k = sh + m + n + v;
    D[i * 4] = base[0] + k + tint[0] * m / (mot || 1); D[i * 4 + 1] = base[1] + k + tint[1] * m / (mot || 1); D[i * 4 + 2] = base[2] + k + tint[2] * m / (mot || 1); D[i * 4 + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
};
// a full-frame canvas of colour `col` whose alpha follows the tooth: mode 'peak' (pencil catches the peaks) or 'valley' (ink misses the valleys)
HD.toothMask = (T, col, mode = 'valley', thr = .35, soft = .18, amax = 1) => {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), d = g.createImageData(W, H), D = d.data, rgb = Pilot.hex(col);
  for (let i = 0; i < W * H; i++) { const v = mode === 'peak' ? (T[i] - thr) / soft : (thr - T[i]) / soft, a = clamp(v) * amax;
    D[i * 4] = rgb[0]; D[i * 4 + 1] = rgb[1]; D[i * 4 + 2] = rgb[2]; D[i * 4 + 3] = a * 255; }
  g.putImageData(d, 0, 0); return c;
};
// layers: a white canvas you draw ink on, then multiply onto the frame
HD.layer = () => { const c = Pilot.canvas(W, H), g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round'; return { c, g }; };
HD.clearWhite = (g, x = 0, y = 0, w = W, h = H) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.fillStyle = '#fff'; g.fillRect(x, y, w, h); g.restore(); };
HD.dropout = (g, mask, a = 1, x = 0, y = 0, w = W, h = H) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = a; g.drawImage(mask, x, y, w, h, x, y, w, h); g.restore(); };
HD.multiply = (ctx, c, x = 0, y = 0, w = W, h = H, a = 1) => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = a; ctx.drawImage(c, x, y, w, h, x, y, w, h); ctx.restore(); };

// walk: distance along x with a slowing stop (speed 1 → 0 over the last `dec` fraction), from a lookup table
HD.walker = (x0, x1, T, dec = .3) => { const n = 400, tab = [0]; let s = 0; for (let i = 1; i <= n; i++) { const u = i / n; s += 1 - ss(1 - dec, 1, u); tab.push(s); }
  return t => { if (t <= 0) return x0 + (t / T) * n * (x1 - x0) / tab[n]; if (t >= T) return x1; const f = t / T * n, i = Math.floor(f), k = f - i; return x0 + (x1 - x0) * lerp(tab[i], tab[Math.min(n, i + 1)], k) / tab[n]; }; };

/* cs-brushline — 잘라 낸 건 다리였다, drawn as a minimal black brush-pen line on white (from lab-brushline, ref 15).
   Same look as the approved lab: very few strokes, each a pressure ribbon with tapered ends and a dry tail, white-filled
   shapes, everything boiling (3 drawings on 8 fps), hand-lettered words (Hi Melody, inked twice).
   "Me" is the lab's bear in full black brush; the others are the same bears in a thin grey brush (quieter). The one
   colour is the lab's warm spot-colour dab: it sits under MY cross (and later the cut pieces), and fills the far doorway.
   The medium carries the turn: the world is one long brush line — the road — and the gap is simply where the line
   breaks off and falls away. My short cross can't reach the other end of the line; the cut pieces, dabbed warm again,
   fly back into the brushed dashes of my whole cross. Everything is redrawn in screen space (the camera never scales the brush). */
const INK = '#1c1a19', GREY = 'rgba(28,26,25,.5)', PAPER = '#ffffff';
const DAB = ['rgba(252,222,164,.55)', 'rgba(250,206,140,.28)', 'rgba(253,232,190,.35)'];
const L = 520, PW = 34, CBX = L - 120, CBW = 32, CBH = 112, CBHL = 40;   // cross: post length/width, crossbar position (from foot), thickness, half-length upright / lying
const FY = 1300, LYY = FY - 16;                                          // the ground line; where a lying cross sits on it
const REST = 26, G = L - 2 * REST;                                        // a full cross rests 26 on each end of the line: the gap is G wide
const SME = 1.0, SPI = .84;                                               // me (nearest) bigger than the others
const t12 = HD.t12, frac = x => x - Math.floor(x), bf = t => Math.floor(t * 8 + 1e-6) % 3;
const TX = {};

// ---------------- camera + brush in screen space ----------------
let CAM = { x: 0, y: 1000, z: 1, sx: 0, sy: 0 }, CMX = null, PZ = 1, FD = 0, G_ = null, HLg = null, HLc = null, INKL = null;
function setCam(c) { CAM = c; CMX = { a: c.z, b: 0, c: 0, d: c.z, e: 540 - c.x * c.z + c.sx, f: 960 - c.y * c.z + c.sy }; PZ = Math.pow(c.z, .55); }
const toS = p => [CMX.a * p[0] + CMX.e, CMX.d * p[1] + CMX.f];
const BW = 11;
function brS(pts, seed, o = {}) {
  if (!pts || pts.length < 2) return;
  const q = o.raw ? pts : HD.boil(HD.wob(pts, seed, o.wob ?? 1.6, 140), seed, FD, o.boil ?? 1.5, 80);
  HD.ink(G_, q, { ts: 14, te: 22, mn: .25, press: .32, pw: 60, rough: .1, seed, col: INK, dry: .28, dryN: 2, ...o, w: (o.w ?? BW) * (o.fix ? 1 : PZ) });
}
const brW = (pts, seed, o) => brS(pts.map(toS), seed, o);
function pathS(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts) g.lineTo(p[0], p[1]); g.closePath(); }
function whiteS(pts) { G_.fillStyle = PAPER; pathS(G_, pts); G_.fill();   // paper fill: hides what is behind, the dab too
  HLg.save(); HLg.globalCompositeOperation = 'destination-out'; HLg.globalAlpha = 1; HLg.fillStyle = '#000'; pathS(HLg, pts); HLg.fill(); HLg.restore(); }
function paperRibbon(pts, o) { HD.ink(G_, pts, { ...o, col: PAPER });
  HLg.save(); HLg.globalCompositeOperation = 'destination-out'; HD.ink(HLg, pts, { ...o, col: '#000' }); HLg.restore(); }
function dabS(cx, cy, rx, ry, k = 1, seed = 0, a = 1) {   // the lab's spot-colour dab: three loose passes, each a little off the last
  if (k <= 0) return;
  HLg.save(); HLg.globalAlpha = a;
  for (let pass = 0; pass < 3; pass++) { const pts = []; for (let i = 0; i < 36; i++) { const an = i / 36 * TAU, r = (1 + .09 * Math.sin(an * 2 + pass * 2.1 + seed) + .16 * (noise(an * 1.7 + pass * 4 + seed, FD * 2.3) - .5)) * (.55 + .45 * k);
      pts.push([cx + pass * 5 + Math.cos(an) * r * rx, cy - pass * 4 + Math.sin(an) * r * ry]); }
    HD.fillPts(HLg, HD.spline(pts, 6, true), DAB[pass]); }
  HLg.restore();
}
function dabPoly(pts, a = 1) {   // a dab that follows a shape (the cross), loosely, a little off the lines
  HLg.save(); HLg.globalAlpha = a;
  for (let pass = 0; pass < 2; pass++) { const off = pass ? [6, -5] : [-3, 4]; HLg.fillStyle = DAB[pass]; pathS(HLg, HD.wob(pts, 70 + pass * 13 + FD * 5, 6, 60).map(p => [p[0] + off[0], p[1] + off[1]])); HLg.fill(); }
  HLg.restore();
}
const mulM = HD.mul, xf = HD.xf;

// ---------------- the cross (local: foot at u=0, top at u=L, v across) ----------------
function crossOutline(lying) { const hb = lying ? CBHL : CBH;
  return [[0, -PW / 2], [CBX - CBW / 2, -PW / 2], [CBX - CBW / 2, -hb], [CBX + CBW / 2, -hb], [CBX + CBW / 2, -PW / 2], [L, -PW / 2], [L, PW / 2],
    [CBX + CBW / 2, PW / 2], [CBX + CBW / 2, hb], [CBX - CBW / 2, hb], [CBX - CBW / 2, PW / 2], [0, PW / 2]]; }
function clipU(P, u0, u1) {
  const cl = (P, keep, X) => { const o = []; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length], ka = keep(a), kb = keep(b);
    if (ka) o.push(a); if (ka !== kb) o.push([X, a[1] + (b[1] - a[1]) * (X - a[0]) / (b[0] - a[0])]); } return o; };
  return cl(cl(P, p => p[0] >= u0 - 1e-6, u0), p => p[0] <= u1 + 1e-6, u1);
}
// X = { x, y, a } foot origin + angle. o = { lying, mine, alpha, seed }
function drawCross(X, u0, u1, o = {}) {
  if (u1 - u0 < 1) return;
  const S = mulM(CMX, HD.mat(X.x, X.y, X.a)), lying = !!o.lying, sd = o.seed || 300, mine = !!o.mine;
  const P = clipU(crossOutline(lying), u0, u1), dense = HD.poly(P, true, 3);
  const scr = HD.boil(HD.wob(xf(dense, S), sd, 1.4, 110), sd, FD, 1.2, 70);
  const al = o.alpha ?? 1; G_.save(); G_.globalAlpha = al;
  whiteS(scr);
  if (mine) dabPoly(scr, al);
  HD.ink(G_, scr, { w: (mine ? 9.5 : 6) * PZ, ts: 6, te: 6, mn: .6, press: .28, pw: 60, rough: .08, seed: sd + 1, col: mine ? INK : GREY });
  // one brushed grain line down the post (fixed in u, so the cut pieces line up again)
  const ga = Math.max(40, u0 + 10), gb = Math.min(CBX - 40, u1 - 10);
  if (gb - ga > 30) brS(xf(HD.seg([ga, -PW * .12], [gb, -PW * .12], 4), S), sd + 9, { w: mine ? 4.5 : 3.2, ts: 10, te: 26, mn: .15, col: mine ? INK : GREY, dry: .4 });
  G_.restore();
  return scr;
}
const cpt = (X, u, v = 0) => [X.x + Math.cos(X.a) * u - Math.sin(X.a) * v, X.y + Math.sin(X.a) * u + Math.cos(X.a) * v];

// ---------------- the saw (a few brush strokes) ----------------
const CUT_ANG = Math.PI - .72, BLADE = 160;
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];
  return { d, up, heel: [grip[0] - up[0] * 14 + d[0] * 20, grip[1] - up[1] * 14 + d[1] * 20] }; }
function drawSaw(grip, ang, seed = 1400) {
  const { d, up, heel } = sawGeo(grip, ang), P = (u, v) => toS([heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v]);
  const blade = [P(0, 30), P(BLADE, 17), P(BLADE, -3), P(0, -3)];
  whiteS(blade); brS(HD.poly([P(0, 30), P(BLADE, 17), P(BLADE, -2)], false, 3), seed, { w: 6, ts: 6, te: 8 });

    if (M.kerf) { const a = toS([M.c.cutX, M.c.y - PW / 2]), b = toS([M.c.cutX, M.c.y - PW / 2 + M.kerf.kp * PW * .92 + .5]); brS([a, b], 4700, { w: 5, raw: true, ts: 1, te: 1, mn: 1, dry: 0 }); }
    if (M.saw) drawSaw(M.saw.grip, M.saw.ang);
  });
  if (M.c && t >= M.c.drop && t < M.c.drop + .12) { const c = M.c; for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * .45;
    brW(HD.seg([c.cutX + Math.cos(a) * 40, c.y - 24 + Math.sin(a) * 40], [c.cutX + Math.cos(a) * 76, c.y - 24 + Math.sin(a) * 76], 2), 4800 + i, { w: 6, ts: 3, te: 10, dry: 0 }); } }
  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { G_.save(); if (FX.clip) { const a = toS([E + 3, FY - 4000]), b = toS([E + G - 3, FY + 9000]); G_.beginPath(); G_.rect(a[0], a[1], b[0] - a[0], b[1] - a[1]); G_.clip();
      HLg.save(); HLg.beginPath(); HLg.rect(a[0], a[1], b[0] - a[0], b[1] - a[1]); HLg.clip(); }
    drawCross(FX, FX.u0, L, { lying: true, mine: true, seed: 300, alpha: FX.alpha ?? 1 });
    if (FX.clip) { HLg.restore(); const cc = cpt(FX, (FX.u0 + L) / 2); for (let i = -1; i <= 1; i++) brW([[cc[0] + i * 46, cc[1] - 130], [cc[0] + i * 46, cc[1] - 290]], 4900 + i, { w: 6, ts: 4, te: 30, mn: .2 }); }
    G_.restore(); }
  // the hit: brushed impact strokes at the end of the line
  if (t >= B.fall && t < B.fall + .45) { const k = (t - B.fall) / .45, c = [E + 20, FY + 10];
    for (let i = 0; i < 9; i++) { const a = -Math.PI * (.0 + i * .125), r0 = 60 + 130 * eo(k), r1 = r0 + 50 * (1 - k) + 18;
      brW(HD.seg([c[0] + Math.cos(a) * r0, c[1] + Math.sin(a) * r0 * .8], [c[0] + Math.cos(a) * r1, c[1] + Math.sin(a) * r1 * .8], 2), 5000 + i, { w: 9, ts: 3, te: 14, dry: 0 }); } }
  // sawdust: little brush specks
  for (const q2 of FLECKS) { const u = t - q2.t0; if (u < 0) continue; const al = 1 - ss(q2.t0 + 1.0, q2.t0 + 1.6, t); if (al <= 0) continue;
    const tl = (-q2.vy + Math.sqrt(q2.vy * q2.vy + 4 * 700 * (q2.land - q2.y))) / 1400, uu = Math.min(u, Math.max(0, tl));
    const x = q2.x + q2.vx * uu, y = q2.y + q2.vy * uu + 700 * uu * uu, r = q2.r0 + q2.vr * uu;
    G_.save(); G_.globalAlpha = al; brW([[x - Math.cos(r) * q2.sz, y - Math.sin(r) * q2.sz], [x + Math.cos(r) * q2.sz, y + Math.sin(r) * q2.sz]], q2.seed, { w: 5, ts: 1, te: 3, mn: .5, dry: 0 }); G_.restore(); }
}

// ---------------- words ----------------
const HAND = "'Hi Melody',cursive";
function words(ctx, t) {
  if (t >= B.end) return;
  const f = FD, lines = S.lines.map(l => [l[0], l[1], l[2]]), o = { font: HAND, weight: 400, size: 86, y: 410, color: '#22201e', shadow: 'rgba(0,0,0,0)', shadowBlur: 0 };
  ctx.save(); ctx.translate([0, 1, -1][f], [0, -1, 1][f]);
  Story.captions(ctx, t, lines, o); ctx.translate(1.2, .4); Story.captions(ctx, t, lines, o);   // inked twice, like the lab
  for (const [a, b, s, src] of S.lines) { if (!src) continue; const al = Pilot.win(t, a, b, .35, .45); if (al <= 0) continue;
    const n = s.split('\n').length; Pilot.text(ctx, src, W / 2, 410 + (n - 1) * 86 * 1.55 + 90, { size: 44, font: HAND, color: '#3a3633', alpha: al }); }
  ctx.restore();
}
function endCard(ctx, t) {
  if (t < B.end - .2) return;
  const k = 1.3, cy = 900; ctx.save(); ctx.setTransform(k, 0, 0, k, 540 - 540 * k + [0, 1, -1][FD], cy - cy * k + [0, -1, 1][FD]);
  const o = { font: HAND, srcFont: HAND, color: '#22201e', srcColor: '#3a3633', y: 840, titleShadow: '' };
  Story.endCard(ctx, t, S.endCard, B.end, o); ctx.translate(1, .4); Story.endCard(ctx, t, S.endCard, B.end, { ...o, srcColor: 'rgba(0,0,0,0)' });
  ctx.restore();
}

// ---------------- frame ----------------
function draw(ctx, t) {
  FD = bf(t); setCam(camAt(t));
  const g = INKL.g; G_ = g;
  ctx.drawImage(TX.paper, 0, 0);
  HD.clearWhite(g); HLg.clearRect(0, 0, W, H);
  world(t);
  HD.dropout(g, TX.drop, .55);
  const fade = 1 - .97 * ss(B.end - .15, B.end + .35, t);
  HD.multiply(ctx, HLc, 0, 0, W, H, fade); HD.multiply(ctx, INKL.c, 0, 0, W, H, fade);
  words(ctx, t); endCard(ctx, t);
}
async function init() {
  const T = HD.tooth(5, 4, 1.6, 1500);
  TX.paper = HD.paper(T, { base: [252, 251, 248], mott: 2.5, emb: 7, grain: 2.5, vig: .02 });
  TX.drop = HD.toothMask(T, '#ffffff', 'valley', .24, .08, .8);
  buildTimeline(); buildWorld(); buildLine();
  INKL = HD.layer(); HLc = Pilot.canvas(W, H); HLg = HLc.getContext('2d');
}
window.__dbg = () => ({ E, G, GX, cuts: CUTS.map(c => [c.mx, c.cutX, c.baseX, c.u0, c.u1]) });
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 86px 'Hi Melody'"], init, draw });
</script>
