<script>
/* 잘라 낸 건 다리였다 — 10 파스텔 색연필 그림책 (from lab-pastelbook).
   A sunny picture-book meadow in soft coloured pencil: flat light fills with pencil grain and paper tooth, thin wobbly
   outlines a darker pencil of each colour, puffy union-of-circles clouds, cone and lollipop trees, a cream path.
   "Me" is the lab's small cream bear; the others are bears in quieter greys and beiges. Everyone carries a wooden cross;
   MINE is the one honey-coloured piece of wood in the book (the accent) — the others' are weathered grey wood.
   The way runs along a cream path to a ravine (an earthy V-cut, lilac haze, a stream far below); across it a pink-roofed
   cottage with an open arched door full of warm gold light — the others walk in, home. The turn is told the picture-book
   way: pencil sawdust curls and impact ticks, sweat drops, a crash-zoom with a wobble, glowing pieces with sparkle ticks
   flying into a dashed pencil outline of my whole cross. Figures pose on twos (12 fps); the camera moves on ones.
   The style (pencil marks, meadow, ravine, cottage, the jointed bear, wood, effects, camera, paper, words) is the house
   kit `kit-pastelbook.js` (styles/pastelbook); this file keeps only the story: the timeline, poses, crosses, saw, camera. */
const K = window.Pastelbook, S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const { C, ME, PALS, XME, XPIL, t12, frac, smooth, rough, fillPencil, pencil, drawSheet, drawBear, walkSpec, standSpec, hangHands, hangGrip, mixSpec, shoulderOf, cpt, mixX, rotAbout } = K;
const L = 520, PW = 34, CBX = L - 112, CBW = 32, CBH = 94, CBHL = 40;   // cross: post length/width; crossbar (from foot), thickness, half-length upright / lying
const FY = 1300, BY = 1252, RT = 1212, PB = 1352;                         // front lane (me), back lane (the others), path's far edge, path's near edge
const REST = 26, G = L - 2 * REST;                                        // a full cross rests 26 px on each lip: the ravine is G wide
const HIPH = 104;                                                         // the bear's hip height (unit scale)
const D = { L, PW, CBX, CBW, CBH, CBHL };                                 // the cross's dims for the kit's wood sprites
const TX = {};
const drawCross = K.drawCross, crossSprite = (pal, lying, seed) => K.crossSprite(pal, lying, seed, D);

// ---------------- the world sheets (built once E — the ravine's near lip — is known) ----------------
let E = 1600, GX = 0, ROADX0 = -1500, ROADX1 = 0, RV = null, COT = null;
const RIDGE = 1040;
function buildSheets() {
  ROADX1 = E + G + 1500;
  RV = K.ravine({ E, G, top: RT, bottom: PB, ridge: RIDGE }); TX.trench = RV.path;
  TX.far = K.farHills(-1300, 2500);                  // parallax .35
  TX.mid = K.midMeadow(-1300, 3800);                 // parallax .65
  TX.road = K.road({ x0: ROADX0, x1: ROADX1, ridge: RIDGE, top: RT, bottom: PB, pathEnd: GX + 250, y1: 2700, gap: RV });
  TX.ravine = RV.sheet;
  // the cottage on the far side: cream walls, pink roof, an open arched door full of warm light
  COT = K.cottage({ x: GX, base: BY, doorW: 96, doorTop: BY - 250, wins: [GX - 185, GX + 175], spillTo: PB });
}

// ---------------- timeline: my path (integrated once), the cuts ----------------
const SME = 1.16, SPI = 1.04;                   // me (nearest) a touch larger than the others
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 44 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1));        // staggering
  if (t < 4.6) return 0;
  if (t < 5.0) return 380 * eio((t - 4.6) / .4);                            // lighter: big bouncy strides
  if (t < 8.3) return 380;
  if (t < 8.6) return lerp(380, 150, (t - 8.3) / .3);
  if (t < 9.0) return 150 * (1 - ss(8.6, 9.0, t));
  if (t < 10.0) return 0;
  if (t < 10.4) return 286 * Math.sin(Math.PI * (t - 10) / .4);           // still crouched: shuffle along the cross to the next cut
  if (t < 11.6) return 0;
  if (t < 12.0) return 640 * Math.sin(Math.PI * (t - 11.6) / .4);
  return 0;
}
const strideMe = t => t < 4.6 ? 74 : t < 8.8 ? 190 : 110;
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };
const meX = t => tab(MEX, t), meP = t => tab(MEP, t);
const CUTS = [{ s: 3.2, d: .3, saw0: 3.5, drop: 4.0, up1: 4.4 }, { s: 9.0, d: .4, saw0: 9.4, drop: 9.8, up1: 10.4, stay: true }, { s: 10.4, d: 0, saw0: 10.55, drop: 11.2, up1: 11.6 }];   // between cuts 2 and 3 the cross stays down
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const SLOTS = [22.9, 23.6, 24.3];   // the outline's missing span lights slot by slot (one piece's length each)
const FLECKS = [], STEPS = [];
let SAWLIE = null;   // where I leave the saw after the last cut
const CUTD = 135;    // how far behind me (crouched, facing back) the cut is
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); const p0 = p; x += v * DT; p += v / strideMe(t) * DT;
    if (t > 4.75 && t < 8.7 && Math.floor(p * 2) > Math.floor(p0 * 2)) STEPS.push({ t, x: x + .29 * strideMe(t) * SME }); }   // footfalls while running: little dust puffs
  E = meX(12) + 52;
  CUTS.forEach((c, k) => {
    c.k = k; c.mx = meX(c.s); c.cutX = c.mx - CUTD; c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.baseX = c.cutX - c.u1; c.y = FY + 26;
    if (k === 2) { c.baseX = CUTS[1].baseX; c.cutX = c.baseX + c.u1; c.mx = c.cutX + CUTD; }   // the same lying cross, cut further along
    const r = rng(100 + k);
    for (let n = 0; n < 16; n++) FLECKS.push({ t0: n < 11 ? lerp(c.saw0, c.drop, n / 11) : c.drop + r() * .05, x: c.cutX + (r() - .5) * 8, y: c.y - PW / 2,
      vx: (r() - .5) * (n < 11 ? 170 : 300), vy: -(80 + r() * (n < 11 ? 150 : 240)), land: FY + 20 + r() * 44, r0: r() * TAU, vr: (r() - .5) * 16, sz: 5 + r() * 4, col: XME.h, line: XME.g });
  });
  const c3 = CUTS[2]; SAWLIE = { grip: [c3.cutX + 150, FY + 52], ang: Math.PI + .05 };
  const r = rng(200);   // crumbs off the lip as my cross goes over
  for (let n = 0; n < 16; n++) FLECKS.push({ t0: B.fall + r() * .1, x: E + 2 + r() * 30, y: FY + 30, vx: (r() - .2) * 240, vy: -(50 + r() * 200), land: 2600, r0: r() * TAU, vr: (r() - .5) * 20, sz: 4 + r() * 5, col: n % 3 ? C.earth : XME.h, line: n % 3 ? C.earthL : XME.g });
}
function pieceAt(c, t) {   // a cut piece lying where it fell (shifted a little as it came off) — it never moves again
  const sh = 18 * eo((t - c.drop) / .25), cu = (c.u0 + c.u1) / 2, a = -.05 * eo((t - c.drop) / .25), cx = c.baseX + cu - sh, cy = c.y;
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a };
}


// ---------------- poses (the kit's bear: walkSpec / standSpec / mixSpec …) ----------------
// the cross on a bear's shoulder: {x, y, a} = foot origin and angle; the contact point on the post rests on the shoulder
function carryCross(F, left, a0) {
  const X = K.carryLong(F, a0, { w: PW, contact: L - Math.min(282, left * L - 36) });
  X.u0 = L * (1 - left); X.lie = false; return X;
}
function gripCarry(F, X) { F.hands = [cpt(X, Math.min(L - 16, X.contact + 40)), cpt(X, Math.max(X.u0 + 16, X.contact - 38), 7)]; F.hand = ['fist', 'fist']; return F; }   // far paw ahead (behind the head), near paw steadies the beam on the shoulder

// ---------------- the saw (in my paw until I leave it on the road after the last cut) ----------------
const CUT_ANG = Math.PI - .72, hangAng = f => Math.atan2(.8, .6 * f), KERF = 66;
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];
  return { d, up, heel: [grip[0] - up[0] * 14 + d[0] * 20, grip[1] - up[1] * 14 + d[1] * 20] }; }
function sawState(c, t) {   // the cutting stroke: the teeth pass through the kerf, the blade moves along its own length
  const kp = clamp((t - c.saw0) / (c.drop - .06 - c.saw0)), saw = t >= c.saw0 - .05 && t < c.drop + .02;
  const osc = saw ? 20 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, g0 = sawGeo([0, 0], CUT_ANG), d = g0.d, up = g0.up;
  const K = [c.cutX, c.y - PW / 2 + kp * PW * .92], heel = [K[0] - d[0] * (KERF - osc), K[1] - d[1] * (KERF - osc)];
  return { kp, grip: [heel[0] + up[0] * 14 - d[0] * 20, heel[1] + up[1] * 14 - d[1] * 20], K };
}
const SAW = {};
function buildSaw() {   // in saw-local (u along the blade, v toward its back), drawn with a basis transform
  const blade = [[0, 26], [124, 15], [128, 8]]; for (let u = 124; u >= 0; u -= 8) blade.push([u, (u / 8 | 0) % 2 ? 3 : -3]);
  SAW.blade = smooth(rough(blade, .8, 3, 6));
  const hd = new Path2D(smooth(rough([[2, 32], [-30, 44], [-44, 20], [-34, -6], [2, 2]], 1, 4, 6))); hd.addPath(smooth(rough([[-12, 26], [-28, 31], [-35, 18], [-28, 6], [-12, 10]], .6, 5, 5)));
  SAW.handle = hd;
}
function drawSaw(ctx, grip, ang) {
  const { d, up, heel } = sawGeo(grip, ang);
  ctx.save(); ctx.transform(d[0], d[1], up[0], up[1], heel[0], heel[1]);
  fillPencil(ctx, SAW.blade, C.saw, { grain: .35 }); pencil(ctx, SAW.blade, C.sawL, 2.2);
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(10, 19); ctx.lineTo(100, 13); ctx.stroke();
  ctx.fillStyle = C.sawL; ctx.beginPath(); ctx.arc(110, 12, 3, 0, TAU); ctx.fill();
  fillPencil(ctx, SAW.handle, C.handle, { rule: 'evenodd', grain: .4 }); pencil(ctx, SAW.handle, C.handleL, 2.2);
  ctx.fillStyle = C.handleL; for (const [u, v] of [[-3, 10], [-3, 24]]) { ctx.beginPath(); ctx.arc(u, v, 2.4, 0, TAU); ctx.fill(); }
  ctx.restore();
}
function sawSpec(c, t) {   // crouched over the cross lying behind me, facing back: one paw pins the post, the other saws
  const f = -1, mx = c.mx, s = SME, st = sawState(c, t);
  return { s, f, gy: FY, hip: [mx, FY - 46 * s], ang: f * 1.3, feet: [[mx + 30 * s, FY], [mx - 48 * s, FY]], hands: [st.grip, [c.cutX - 34 * s, c.y - PW / 2 - 4]],
    hand: ['grip', 'flat'], tilt: -.3, eye: 'calm', farFront: true };
}
const rIdx = F => F.f > 0 ? 1 : 0, lIdx = F => F.f > 0 ? 0 : 1;

function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), left = leftAt(t);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const F = walkSpec(x, FY, SME, 1, ph, 74, .32 + .1 * Math.sin(tt * TAU / 1.15), 10, 3); F.eye = 'strain'; F.tilt = .12; F.sweat = 1;
      F.hip[1] += 6 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, -.5 + .07 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt); const F = walkSpec(x, FY, SME, 1, ph, lerp(74, 190, k), lerp(.16, .28, k), lerp(14, 44, k), lerp(4, 12, k)); F.eye = k > .5 ? 'happy' : 'calm'; F.tilt = -.06 * k; return [F, -.62]; }
    const F = walkSpec(x, FY, SME, 1, ph, 110, .16, 22, 6); F.eye = 'calm'; return [F, -.6];
  };
  const sawHeld = t < CUTS[2].drop;
  // carried: the far paw holds the post ahead of my face; the near paw carries the saw — or, once the saw is gone, the post too
  const carried = (F, a0, lf, held) => { const X = carryCross(F, lf, a0); gripCarry(F, X);
    if (held) { F.hands[0] = hangGrip(F, F.ph != null ? 10 * Math.sin(TAU * F.ph) : 0); F.hand = ['grip', 'fist']; F.farFront = true; }   // far paw carries the saw in front, near paw holds the beam
    return [F, X]; };
  for (const c of CUTS) {
    if (t >= c.s && t < c.up1) {
      const lf0 = S.left[c.k], lf1 = S.left[c.k + 1], [W0, a0] = walk(c.s, c.mx), [W1, a1] = walk(c.up1, c.mx), last = c.k === 2;
      const [WA, XA] = carried(W0, a0, lf0, true), [WB, XB] = carried(W1, a1, lf1, !last);
      const XL = { x: c.baseX, y: c.y, a: 0, u0: L * (1 - left), lie: true }, SP = sawSpec(c, tp), cg = sawState(c, tp).grip;
      if (t < c.s + c.d) { const k = eio((tp - c.s) / c.d), F = mixSpec(WA, SP, k);
        F.hands[0] = [lerp(WA.hands[0][0], cg[0], k), lerp(WA.hands[0][1], cg[1], k)];
        const Xm = mixX(XA, XL, k), onBeam = cpt(Xm, Math.max(Xm.u0 + 16, lerp(XA.contact - 38, c.u1 + 60, k)), 7 * (1 - k)), kk = ss(.55, 1, k);
        F.hands[1] = [lerp(onBeam[0], SP.hands[1][0], kk), lerp(onBeam[1], SP.hands[1][1], kk)];
        F.hand = ['grip', kk > .5 ? 'flat' : 'fist']; F.farFront = true;
        return { F, X: Xm, c, saw: { grip: F.hands[0], ang: lerp(hangAng(1), CUT_ANG, k) } }; }
      if (t < c.drop) { const st = sawState(c, t), F = sawSpec(c, t); F.eye = c.k ? 'calm' : 'strain'; return { F, X: XL, c, kerf: st, saw: { grip: st.grip, ang: CUT_ANG } }; }
      if (c.stay) { const c3 = CUTS[2], S3 = sawSpec(c3, tp), g3 = sawState(c3, tp).grip, k = eio((tp - 10.0) / .4), F = mixSpec(SP, S3, k);
        F.hands[0] = [lerp(cg[0], g3[0], k), lerp(cg[1], g3[1], k)]; F.hands[1] = [lerp(SP.hands[1][0], S3.hands[1][0], k), lerp(SP.hands[1][1], S3.hands[1][1], k) - 26 * Math.sin(Math.PI * k)];
        F.hand = ['grip', 'flat']; F.farFront = true; F.eye = 'calm';
        return { F, X: { ...XL, u0: L * (1 - S.left[2]) }, c, saw: { grip: F.hands[0], ang: CUT_ANG } }; }
      const k = eio((tp - c.drop) / (c.up1 - c.drop)), F = mixSpec(SP, WB, k);
      const Xm = mixX(XL, XB, k), kk = ss(0, .3, k), onBeam = cpt(Xm, Math.max(Xm.u0 + 16, lerp(c.u1 + 60, XB.contact - 38, k)), 7 * k);
      const ks = ss(0, .45, k), clear = 60 * Math.sin(Math.PI * clamp(k / .8));
      F.hands[0] = [lerp(cg[0], WB.hands[0][0], ks) + clear * .4, lerp(cg[1], WB.hands[0][1], ks) - clear]; F.hands[1] = [lerp(SP.hands[1][0], onBeam[0], kk), lerp(SP.hands[1][1], onBeam[1], kk)];
      F.hand = [last && k > .5 ? 'fist' : 'grip', k > .5 ? 'fist' : 'flat']; F.farFront = !(last && k > .5); F.eye = 'calm';
      const saw = last ? null : { grip: F.hands[0], ang: lerp(CUT_ANG, hangAng(1), k) };
      return { F, X: Xm, c, saw };
    }
  }
  if (t < 12) { const [F, a] = walk(tp); const [G2, X] = carried(F, a, left, sawHeld); return { F: G2, X, saw: sawHeld ? { grip: G2.hands[0], ang: hangAng(1) } : null }; }
  // at the edge: a startled stop, step back for the others, come forward again
  if (t < 18.4) { const [F0] = walk(12, E - 52), k = eio((tp - 12) / .3);
    const bx = -150 * eio((tp - 12.9) / .7) + 150 * eio((tp - 17.6) / .7), mv = Pilot.win(tp, 12.85, 18.35, .12, .12) * (1 - Pilot.win(tp, 13.65, 17.55, .12, .12));
    const ST0 = standSpec(E - 52 + bx, FY, SME, 1, .08), STx = mv > 0 ? mixSpec(ST0, walkSpec(E - 52 + bx, FY, SME, 1, (E + bx) / 100, 100, .1, 18), mv) : ST0;
    const F = mixSpec(F0, STx, k);
    F.ang += .16 * Math.sin(Math.PI * clamp((tp - 12) / .5)) * (tp < 12.5 ? -1 : 0); F.eye = tp < 13.2 ? 'shock' : 'calm'; F.sweat = tp < 13.2 ? 1 : 0;
    const [G2, X] = carried(F, -.6, left, false); return { F: G2, X }; }
  const XLay = { x: E - REST - L * (1 - left), y: FY + 34, a: 0, u0: L * (1 - left), lie: true };
  // laying it: kneeling at the lip, both paws pressing the near end down
  const LAY = { ...standSpec(E - 46, FY, SME, 1), hip: [E - 46, FY - 40 * SME], ang: 1.25, feet: [[E - 96, FY], [E - 14, FY]], tilt: -.35 };
  const U1 = XLay.u0 + 86, U2 = XLay.u0 + 58; LAY.hands = [cpt(XLay, U1, -PW / 2 + 4), cpt(XLay, U2, -PW / 2 + 4)]; LAY.hand = ['flat', 'flat'];
  const XMid = { x: E - 66 - XLay.u0, y: FY - 130, a: -.06, u0: XLay.u0, lie: true };   // held in front of the belly
  const HOLD = { ...standSpec(E - 52, FY, SME, 1, .12), tilt: .25, eye: 'calm' }; HOLD.hands = [cpt(XMid, U1, 4), cpt(XMid, U2, 6)];
  const REACH = { ...LAY, hip: [E - 52, FY - 80 * SME], ang: .6, hands: [[E - 130, FY - 90], [E + 64, FY - 10]], hand: ['fist', 'open'], eye: 'shock', tilt: .1, sweat: 1 };
  if (t < B.tip) { if (t < 18.9) { const ST = standSpec(E - 52, FY, SME, 1, .08), STc = carried(ST, -.6, left, false), X0 = STc[1];
      if (tp < 18.65) { const k = eio((tp - 18.4) / .25), F = mixSpec(STc[0], HOLD, k), Xm = mixX(X0, XMid, k);
        F.hands = [cpt(Xm, lerp(Math.min(L - 16, X0.contact + 40), U1, k), 4 * k), cpt(Xm, lerp(Math.max(X0.u0 + 16, X0.contact - 38), U2, k), 7 - k)]; return { F, X: Xm, lay: true }; }
      const k = eio((tp - 18.65) / .25), F = mixSpec(HOLD, LAY, k), Xm = mixX(XMid, XLay, k);
      F.hands = [cpt(Xm, U1, lerp(4, -PW / 2 + 4, k)), cpt(Xm, U2, lerp(6, -PW / 2 + 4, k))];
      F.hand = k > .5 ? ['flat', 'flat'] : ['fist', 'fist']; return { F, X: Xm, lay: true }; }
    const F = { ...LAY, eye: tp > 18.95 ? 'down' : 'calm' }; return { F, X: XLay, lay: true }; }
  if (t < B.back) { const k = eio((tp - B.tip) / .25), F = mixSpec(LAY, REACH, k); F.hand = REACH.hand; F.eye = tp > 20.6 ? 'down' : 'shock'; F.sweat = tp > 20.6 ? 0 : 1; return { F, X: null }; }
  const BACK = { ...standSpec(E - 52, FY, SME, -1, .04), tilt: -.05, eye: 'calm' }, FWD = { ...standSpec(E - 52, FY, SME, 1, .1), tilt: .3, eye: 'down' };
  if (t < 22.45) return { F: mixSpec(REACH, BACK, eio((tp - B.back) / .35)), X: null };
  return { F: mixSpec(BACK, FWD, eio((tp - 22.45) / .35)), X: null };
}
// my cross once my paws slip: it tips over the lip, then falls into the ravine
function fallX(t) {
  if (t < B.tip) return null;
  const left = S.left[3], u0 = L * (1 - left), pv = [E, FY + 34 + PW / 2];
  const X0 = { x: E - REST - u0, y: FY + 34, a: 0, u0, lie: true };
  if (t < B.fall) return rotAbout(X0, pv, .5 * Math.pow((t - B.tip) / (B.fall - B.tip), 2));
  const X1 = rotAbout(X0, pv, .5), u = t - B.fall, cu = (u0 + L) / 2, c0 = cpt(X1, cu);   // tumble about its own middle
  const cx = c0[0] + 90 * u, cy = c0[1] + 160 * u + 1500 * u * u, a = X1.a + 2.6 * u + 1.2 * u * u;
  return { ...X1, x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, alpha: 1 - ss(B.fall + .55, B.fall + 1.05, t), clip: true };
}

// ---------------- the others: lay it across → walk over → pull it back from the far side → shoulder it → into the light ----------------
const PIL = [{ x0: -470, ph: .3 }, { x0: -230, ph: .75 }, { x0: 190, ph: .1 }, { x0: 430, ph: .55 }];
const BRIDGE_Y = [BY - 6, BY + 4, BY + 14], PULL = 210;
function pilState(i, t) {
  const tp = t12(t), P = PIL[i], j = 3 - i, T = j < 3 ? B.bridges[j] : 99, yb = BRIDGE_Y[j] ?? BY, pal = PALS[i];
  const xAt = tt => { if (tt <= 9 || j > 2) return P.x0 + 52 * tt; const xa = P.x0 + 468, xb = E - 380 - 115 * j, xc = E - 40;
    if (tt <= 12) return lerp(xa, xb, (tt - 9) / 3); return lerp(xb, xc, clamp((tt - 12) / (T - .35 - 12))); };
  const carry = (tt, x, gy = BY, stride = 78, lean = .27) => { const F = walkSpec(x, gy, SPI, 1, P.ph + x / (stride * SPI), stride, lean, 12, 3); F.pal = pal; F.tilt = .05; const X = carryCross(F, 1, -.5); gripCarry(F, X); return [F, X]; };
  if (j > 2) { if (t >= 12) return null; const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  if (t < T - .35) { const [F, X] = carry(tp, xAt(tp)); return { F, X }; }
  const XB = { x: E - REST, y: yb, a: 0, u0: 0, lie: true };
  const LAY = { ...standSpec(E - 40, BY, SPI, 1), hip: [E - 40, BY - 62 * SPI], ang: 1.15, feet: [[E - 84, BY], [E - 14, BY]], tilt: -.3, pal };
  LAY.hands = [cpt(XB, 44), cpt(XB, 14)]; LAY.hand = ['flat', 'flat'];
  if (t < T) { const [F0, X0] = carry(T - .35, E - 40), k = eio((tp - T + .35) / .35); return { F: { ...mixSpec(F0, LAY, k), pal }, X: mixX(X0, XB, eio((t - T + .35) / .35)) }; }
  const xs0 = E - 20, xs1 = E + G + 60;
  if (t < T + .3) { const F = mixSpec(LAY, standSpec(xs0, yb - PW / 2, SPI, 1, .1), eio((tp - T) / .25)); F.pal = pal; return { F, B: XB }; }
  if (t < T + .9) { const x = lerp(xs0, xs1, eio(clamp((tp - T - .3) / .6))), gy = x < E + G + 4 ? yb - PW / 2 : BY;
    const F = walkSpec(x, gy, SPI, 1, P.ph + x / (110 * SPI), 110, .12, 22, 5); F.pal = pal; F.tilt = -.05; F.hands = hangHands(F, 18 * Math.sin(TAU * (P.ph + x / (110 * SPI)))); return { F, B: XB }; }
  // from the far side: turn, crouch, take the top end and pull it back across (dragging it over the far lip)
  const pv = [E + G, yb + PW / 2], pullX = k => rotAbout({ ...XB, x: XB.x + PULL * k }, [pv[0], pv[1]], -.1 * k);
  const xpAt = k => xs1 + 30 + PULL * k;
  const PULLS = k => { const X = pullX(k), x = xpAt(k); const F = { ...standSpec(x, BY, SPI, -1), hip: [x + 6, BY - 66 * SPI], ang: -1.05, feet: [[x + 30, BY], [x - 22, BY]], tilt: -.25, pal };
    F.hands = [cpt(X, L - 26), cpt(X, L - 66)]; F.hand = ['fist', 'fist']; return [F, X]; };
  if (t < T + 1.25) { const k = eio(clamp((tp - T - .9) / .35)), [F, X] = PULLS(k);
    const k0 = eio((tp - T - .9) / .1); return { F: k0 < 1 ? { ...mixSpec(walkSpec(xs1, BY, SPI, 1, 0, 110, .1), F, k0), pal } : F, X }; }
  const [Fp, Xp] = PULLS(1), xg = xpAt(1);
  if (t < T + 1.5) { const k = eio((tp - T - 1.25) / .25), [Fc, Xc] = carry(T + 1.5, xg, BY, 96, .2); return { F: { ...mixSpec(Fp, Fc, k), pal }, X: mixX(Xp, Xc, eio((t - T - 1.25) / .25)) }; }
  const x = lerp(xg, GX + 10, clamp((tp - T - 1.5) / .35)), [F, X] = carry(tp, x, BY, 96, .2);
  F.alpha = 1 - ss(T + 1.55, T + 1.85, t); F.inGate = x > GX - 110; if (F.alpha <= 0) return null;
  return { F, X };
}

// ---------------- camera ----------------
const mixCam = (a, b, k) => k <= 0 ? a : k >= 1 ? b : { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), z: lerp(a.z, b.z, k) };
function camAt(t) {
  let c = { x: meX(t) + 60 + 90 * ss(4.3, 5.4, t), y: 1100, z: 1.14 };
  c = mixCam({ x: meX(t) + 30, y: 1060, z: 1.75 }, c, eio((t - 1.5) / 1.1));       // the hook: close on me (the saw in my paw), widening to the procession by ~2.6
  const c1 = CUTS[0], c2 = CUTS[1], c3 = CUTS[2], at = cc => ({ x: (cc.mx + cc.cutX) / 2 - 10, y: 1150, z: 1.4 });
  c = mixCam(c, at(c1), Pilot.win(t, c1.s - .05, c1.up1 + .2, .32, .35));
  c = mixCam(c, mixCam(at(c2), at(c3), eio((t - 10.0) / .45)), Pilot.win(t, c2.s - .1, c3.up1 + .25, .3, .4));
  if (t < 12.4) c.x = Math.min(c.x, E - 540 / c.z - 10 + 1600 * ss(11.45, 12.4, t) * ss(11.45, 12.4, t));   // the ravine stays out of frame until I reach it
  if (t >= 12) c = mixCam(c, { x: E + 330, y: 1040, z: .86 }, eio((t - 12.05) / .95));
  if (t >= 18.2) c = mixCam(c, { x: E + 200, y: 1130, z: 1.12 }, eio((t - 18.2) / .45));
  if (t >= B.fall) c = mixCam(c, { x: E + 170, y: 1240, z: 1.45 }, eo((t - B.fall) / .09));
  if (t >= B.fall + .65) c = mixCam(c, { x: E + 170, y: 1110, z: 1.1 }, eio((t - B.fall - .65) / .7));
  if (t >= B.back) c = mixCam(c, { x: E - 400, y: 1150, z: 1.12 }, eio((t - B.back) / .8));      // travel back along the road: the pieces lie there, glowing
  if (t >= 22.15) c = mixCam(c, { x: E + 210, y: 1120, z: 1.02 }, eio((t - 22.15) / .75));    // back to the gap: me at the lip, the outline over the open gap
  const k = 1 - ss(B.fall, B.fall + .55, t); c.sx = t >= B.fall ? 15 * k * Math.sin(t * 97) : 0; c.sy = t >= B.fall ? 11 * k * Math.sin(t * 131 + 1) : 0;
  return c;
}
const layer = K.layer;

// ---------------- the world ----------------
const OUTLINE = () => TX.outline || (TX.outline = smooth(rough(K.crossPts(CBHL, D).map(([a, b]) => [E - REST + a, FY + 34 + b]), 1, 9, 9)));
function guide(ctx, t, k, al) {   // the dashed pencil outline of my whole cross across the ravine (revealed left to right)
  const ol = OUTLINE(), x1 = E - REST - 4 + (L + 8) * k;
  ctx.save(); ctx.globalAlpha = al; ctx.beginPath(); ctx.rect(E - REST - 10, FY - 200, x1 - (E - REST - 10), 400); ctx.clip();
  ctx.fillStyle = 'rgba(248,207,130,.22)'; ctx.fill(ol);
  ctx.setLineDash([14, 10]); ctx.lineDashOffset = -t * 16; ctx.lineCap = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = XME.l; ctx.stroke(ol); ctx.setLineDash([]);
  ctx.restore();
}
function slots(ctx, t) {   // the ending: a ghostly dashed outline of my whole cross over the open gap; its missing span lights slot by slot
  const ol = OUTLINE(), al = ss(22.3, 22.8, t), x0 = E - REST + L * S.left[3];
  ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = 'rgba(248,226,190,.16)'; ctx.fill(ol);
  ctx.setLineDash([12, 11]); ctx.lineDashOffset = -t * 10; ctx.lineCap = 'round'; ctx.lineWidth = 3.6; ctx.strokeStyle = 'rgba(148,88,42,.75)'; ctx.stroke(ol); ctx.setLineDash([]); ctx.restore();
  let xa = x0;
  [2, 1, 0].forEach((k, i) => { const c = CUTS[k], w = c.u1 - c.u0, xb = xa + w, on = eo((t - SLOTS[i]) / .35); if (on > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(xa, FY - 120, w, 260); ctx.clip();
      ctx.globalAlpha = on * .85; ctx.fillStyle = XME.h; ctx.fill(ol);
      ctx.globalCompositeOperation = 'screen'; const g = ctx.createRadialGradient((xa + xb) / 2, FY + 34, 6, (xa + xb) / 2, FY + 34, 120);
      g.addColorStop(0, `rgba(255,222,150,${.6 * on * (1 - .5 * ss(SLOTS[i] + .4, SLOTS[i] + 1.2, t))})`); g.addColorStop(1, 'rgba(255,214,140,0)'); ctx.fillStyle = g; ctx.fillRect(xa - 10, FY - 120, w + 20, 260);
      ctx.restore();
      ctx.save(); ctx.globalAlpha = on; ctx.strokeStyle = XME.l; ctx.lineWidth = 2.6; ctx.lineCap = 'round';   // the slot's end mark
      ctx.beginPath(); ctx.moveTo(xb, FY + 34 - PW / 2 - 6); ctx.lineTo(xb, FY + 34 + PW / 2 + 6); ctx.stroke(); ctx.restore(); }
    xa = xb; });
}
function world(ctx, t) {
  drawSheet(ctx, TX.ravine); drawSheet(ctx, TX.road);
  // the cottage door: warm light inside the arch (the others walk into it), then the cottage over them
  COT.back(ctx, t);
  const pils = [0, 1, 2, 3].map(i => pilState(i, t)).filter(Boolean);
  for (const P of pils) if (P.F && P.F.inGate) drawBear(ctx, P.F, null, P.X ? () => drawCross(ctx, TX.xUp, P.X.u0, L, P.X.x, P.X.y, P.X.a) : null);
  COT.front(ctx, t);
  // back lane: a bridge (only ever one, its owner's), then the others
  for (const P of pils) if (P.B) drawCross(ctx, TX.xLie, 0, L, P.B.x, P.B.y, P.B.a, 1, .8);
  pils.slice().sort((a, b) => (a.F ? a.F.hip[0] : 0) - (b.F ? b.F.hip[0] : 0)).forEach(P => {
    if (!P.F || P.F.inGate) return; const X = P.X;
    const dc = X ? () => drawCross(ctx, X.lie ? TX.xLie : TX.xUp, X.u0, L, X.x, X.y, X.a, 1, X.lie ? .8 : 0) : null;
    drawBear(ctx, P.F, X && X.lie ? dc : null, X && !X.lie ? dc : null);
  });
  // the guide shows the missing span while my short cross hangs off the lip, and again when the pieces come back
  if (t >= 18.75 && t < 19.75) guide(ctx, t, eio((t - 18.75) / .35), 1 - ss(19.4, 19.75, t));
  if (t >= 22.3) slots(ctx, t);
  // the saw I left on the road after the last cut
  const c3 = CUTS[2];
  if (t >= c3.drop) { const k = eio((t - c3.drop) / .2), g0 = sawState(c3, c3.drop - .01).grip;
    drawSaw(ctx, [lerp(g0[0], SAWLIE.grip[0], k), lerp(g0[1], SAWLIE.grip[1], k)], lerp(CUT_ANG, SAWLIE.ang, k)); }
  // the pieces I cut, lying where they fell (front lane); they glow once I look back, and fly into the gap one by one
  for (const c of CUTS) if (t >= c.drop) { const p = pieceAt(c, t), hl = ss(B.back + .25 + (2 - c.k) * .2, B.back + .75 + (2 - c.k) * .2, t);
    const cu = (c.u0 + c.u1) / 2, cx = p.x + Math.cos(p.a) * cu, cy = p.y + Math.sin(p.a) * cu;
    if (hl > 0) { const R = 130, g2 = ctx.createRadialGradient(cx, cy, 8, cx, cy, R), pulse = .85 + .15 * Math.sin((t - B.back) * 3 + c.k);
      g2.addColorStop(0, `rgba(255,222,150,${.55 * hl * pulse})`); g2.addColorStop(.5, `rgba(255,214,140,${.18 * hl * pulse})`); g2.addColorStop(1, 'rgba(255,214,140,0)');
      ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g2; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R); ctx.restore(); }
    drawCross(ctx, TX.gLie, c.u0, c.u1, p.x, p.y, p.a, 1, .9); }
  // me and my cross (and the saw in my paw)
  const M = poseMe(t), F = M.F; F.pal = ME;
  const myCross = X => { if (!X) return; drawCross(ctx, X.lie ? TX.gLie : TX.gUp, X.u0, L, X.x, X.y, X.a, 1, X.lie ? .9 : 0); };
  drawBear(ctx, F, () => {
    if (M.X && M.X.lie) myCross(M.X);
    if (M.kerf) { ctx.fillStyle = XME.l; ctx.fillRect(M.c.cutX - 1.6, M.c.y - PW / 2, 3.2, M.kerf.kp * PW * .92 + .5); }
    if (M.saw) drawSaw(ctx, M.saw.grip, M.saw.ang);
  }, M.X && !M.X.lie ? () => myCross(M.X) : null);
  if (t > 4.7 && t < 9.4) {   // the run: dust puffs at each footfall, pencil speed ticks behind me
    K.dust(ctx, t, STEPS, FY);
    K.speedLines(ctx, t, F.hip[0] - 70 * SME, FY - 120, ss(4.8, 5.2, t) * (1 - ss(8.3, 8.7, t))); }
  if (M.c) K.snapTicks(ctx, t, M.c.drop, M.c.cutX - 10, M.c.y);   // the snap: pencil impact ticks around the cut
  // my cross over the edge: tips, falls (clipped to the ravine so it drops in between the lips)
  const FX = fallX(t);
  if (FX && (FX.alpha ?? 1) > 0) { ctx.save(); if (FX.clip) ctx.clip(TX.trench); drawCross(ctx, TX.gLie, FX.u0, L, FX.x, FX.y, FX.a, FX.alpha ?? 1); ctx.restore(); }
  K.hit(ctx, t, B.fall, E + 4, FY + 40);   // the hit: dust curls off the lip and pencil impact ticks
  K.chips(ctx, t, FLECKS);
}
function drawButterfly(ctx, t) {   // a butterfly drifting past me in the opening
  if (t > 5) return; const x0 = meX(t); K.butterfly(ctx, t, x0 + 150 + Math.sin(t * .9) * 60 + t * 20, 1010 + Math.sin(t * 1.4) * 34 - t * 16, 1 - ss(4.2, 5, t));
}

// ---------------- frame ----------------
function draw(ctx, t) {
  const cm = camAt(t);
  ctx.drawImage(K.sky, 0, 0);
  layer(ctx, cm, .12, () => K.drawClouds(ctx, t, FX.clouds));
  layer(ctx, cm, .35, () => drawSheet(ctx, TX.far));
  layer(ctx, cm, .65, () => drawSheet(ctx, TX.mid));
  layer(ctx, cm, 1, () => { world(ctx, t); drawButterfly(ctx, t); });
  K.paperPass(ctx, cm);   // paper over everything (tooth + soft unevenness), locked to the world so it never crawls
  K.endPlate(ctx, t, B.end);
  if (t < B.end) K.captions(ctx, t, S.lines);
  K.endCard(ctx, t, S.endCard, B.end);
}

const FX = {};
async function init() {
  K.init();
  FX.clouds = K.clouds();
  buildSaw(); buildTimeline();
  GX = E + G + 330;
  buildSheets();
  TX.gUp = crossSprite(XME, false, 3); TX.gLie = crossSprite(XME, true, 4);
  TX.xUp = crossSprite(XPIL, false, 5); TX.xLie = crossSprite(XPIL, true, 6);
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: K.FONTS, init, draw });
</script>
