<script>
/* 잘라 낸 건 다리였다 — 02 dark forest, glowing spirits (from lab-spiritglow).
   The lab's look: a dark painterly forest at night — thin black trunks with broken lit edges, rock slabs cut with a
   palette knife, shallow pools glowing cyan-white from the figures standing in them, a far crowd of tiny flickering
   figures, heavy grain; everything painted once (shapes → a knife pass that re-paints each plane in short flat strokes
   sampled from itself → grain), the life drawn on top (glows breathe, the far crowd flickers).
   Here everyone is one of those glowing figures; their crosses are dark wood lit at the edge by their own glow. MY cross
   is the only warm thing — it glows amber like the lab's far light — and the arch beyond the ravine holds that same amber
   light. The turn is carried by light: my short amber cross hangs over the black ravine, tips, and its glow sinks into
   the dark until it goes out (a push-in, a shake, a last amber flare far below). Then the pieces I cut, still amber on
   the rocks behind me, brighten, lift and fly back into the dashed outline of my whole cross.
   Choreography after cross-papercut (1cor4 v2) — same beats, poses and camera grammar, painted in light. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const C = {
  top: '#03090c', trunk: '#040d10', ink: '#e4fbf5', fogD: '#2a7a72',
  me: '#24404a', pil: '#1a2f36', skin: '#e3b48e', skinP: '#c79a7a', legs: '#142329', gold: '#ffbe62', goldL: '#fff1cc', goldD: '#d9782a',
  steel: '#5f8f8b', handle: '#120b07', wood: '#0d2526', woodL: 'rgba(150,250,228,.8)',
};
const hx = Pilot.hex, mixHex = (a, b, k) => Pilot.rgb(Pilot.mix(hx(a), hx(b), k));
const L = 520, PW = 34, CBX = L - 130, CBW = 32, CBH = 118, CBHL = 50;
const FY = 1300, BY = 1252, RT = 1212;
const REST = 26, G = L - 2 * REST;
const t12 = t => t;
const frac = x => x - Math.floor(x);
const pathOf = pts => { const p = new Path2D(); p.moveTo(...pts[0]); for (const q of pts.slice(1)) p.lineTo(...q); p.closePath(); return p; };

// ---------------- jointed glowing figure (one flat light colour; the bloom pass makes it glow) ----------------
function ik(a, t, l1, l2, pick) {
  let dx = t[0] - a[0], dy = t[1] - a[1], d = Math.hypot(dx, dy) || 1e-6; const dd = clamp(d, Math.abs(l1 - l2) + .5, l1 + l2 - .5);
  const tx = a[0] + dx / d * dd, ty = a[1] + dy / d * dd, an = Math.atan2(ty - a[1], tx - a[0]), b = Math.acos(clamp((l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd), -1, 1));
  const j1 = [a[0] + Math.cos(an + b) * l1, a[1] + Math.sin(an + b) * l1], j2 = [a[0] + Math.cos(an - b) * l1, a[1] + Math.sin(an - b) * l1];
  return [pick(j1, j2), [tx, ty]];
}
function frame(F) {
  const up = [Math.sin(F.ang), -Math.cos(F.ang)], fw = [F.f * Math.cos(F.ang), F.f * Math.sin(F.ang)], s = F.s;
  return { up, fw, P: (a, b) => [F.hip[0] + fw[0] * a * s + up[0] * b * s, F.hip[1] + fw[1] * a * s + up[1] * b * s] };
}
const shoulderOf = F => frame(F).P(4, 136);
function capsule(a, b, wa, wb, n = 7) {
  const dx = b[0] - a[0], dy = b[1] - a[1], an = Math.atan2(dy, dx), pts = [];
  for (let i = 0; i <= n; i++) { const q = an + Math.PI / 2 + Math.PI * i / n; pts.push([a[0] + Math.cos(q) * wa / 2, a[1] + Math.sin(q) * wa / 2]); }
  for (let i = 0; i <= n; i++) { const q = an - Math.PI / 2 + Math.PI * i / n; pts.push([b[0] + Math.cos(q) * wb / 2, b[1] + Math.sin(q) * wb / 2]); }
  return pts;
}
function poly(ctx, pts, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); }
function drawFig(ctx, F, mid, back) {
  const s = F.s, f = F.f, col = F.col, far = mixHex(col, '#000000', .35), skin = F.skin || C.skin, skinF = mixHex(skin, '#000000', .3), { P } = frame(F);
  const sh = P(4, 136), shF = P(-3, 134);
  const elbowPick = (a, b) => (a[1] - f * a[0] * .35) > (b[1] - f * b[0] * .35) ? a : b, kneePick = (a, b) => f * a[0] > f * b[0] ? a : b;
  const arm = (S0, T, c, type, hc) => {
    if (!T) T = [S0[0] - f * 8 * s, S0[1] + 140 * s];
    const [el, hd] = ik(S0, T, 78 * s, 74 * s, elbowPick);
    poly(ctx, capsule(S0, el, 21 * s, 16 * s), c); poly(ctx, capsule(el, hd, 16 * s, 12 * s), c);
    if (F.edge && c !== far) { ctx.strokeStyle = F.edge; ctx.lineWidth = 1.8; for (const q of [capsule(S0, el, 21 * s, 16 * s), capsule(el, hd, 16 * s, 12 * s)]) { ctx.beginPath(); ctx.moveTo(...q[0]); for (const v of q) ctx.lineTo(...v); ctx.closePath(); ctx.stroke(); } }
    const an = Math.atan2(hd[1] - el[1], hd[0] - el[0]);
    let pts;
    if (type === 'flat') pts = [[-4, -7], [10, -8], [24, -5], [28, 0], [22, 4], [-2, 6], [-8, 2]].map(([u, v]) => [hd[0] + f * u * s, hd[1] + v * s - 4 * s]);
    else if (type === 'open') pts = [[-6, -8], [16, -9], [26, -4], [18, -2], [27, 2], [16, 5], [-2, 9], [-8, 2]].map(([u, v]) => [hd[0] + (Math.cos(an) * u - Math.sin(an) * v) * s, hd[1] + (Math.sin(an) * u + Math.cos(an) * v) * s]);
    else { pts = []; for (let i = 0; i < 12; i++) { const q = i / 12 * TAU; pts.push([hd[0] + Math.cos(q) * 13 * s, hd[1] + Math.sin(q) * 11.5 * s]); }
      pts.splice(8, 0, [hd[0] + Math.cos(an - 1.9) * 16 * s, hd[1] + Math.sin(an - 1.9) * 16 * s]); }   // a thumb over the grip
    poly(ctx, capsule(el, [lerp(el[0], hd[0], .82), lerp(el[1], hd[1], .82)], 17 * s, 14 * s), c);   // the sleeve
    poly(ctx, pts, hc);
  };
  const leg = (T, c) => {
    const hp = P(-2, -2), ank = [T[0], T[1] - 9 * s];
    const [kn, an] = ik(hp, ank, 96 * s, 90 * s, kneePick);
    poly(ctx, capsule(hp, kn, 26 * s, 20 * s), c); poly(ctx, capsule(kn, an, 20 * s, 14 * s), c);
    const lift = Math.max(0, F.gy - T[1]), toe = lift > 6 * s ? .35 : 0;
    poly(ctx, [[-11, -14], [8, -13], [30, -6], [36, 1], [-12, 1]].map(([u, v]) => { const cu = Math.cos(toe), su = Math.sin(toe); return [an[0] + f * (u * cu - v * su) * s, an[1] + 9 * s + (u * su + v * cu) * s]; }), c);
  };
  if (back) back();
  if (!F.farFront) arm(shF, F.hands[0], far, F.hand?.[0] || 'fist', skinF);
  leg(F.feet[0], far); leg(F.feet[1], F.legCol || col);
  // the cloak: hangs from the hip to the knee, a ragged hem that sways
  const hemD = Math.max(40 * s, F.gy - F.hip[1] - 70 * s), sw = (F.sway || 0) * s;
  const skx = (a, b) => [F.hip[0] + f * a * s + sw * b / hemD, F.hip[1] + b];
  const cl = [skx(-30, -10), skx(28, -10), skx(40, hemD * .55)];
  for (let i = 0; i <= 9; i++) { const u = i / 9, a = lerp(50, -50, u); cl.push(skx(a, hemD + (i % 2 ? -7 : 3) * s + Math.sin(i * 1.7 + (F.ph || 0) * 6) * 2 * s)); }
  cl.push(skx(-40, hemD * .55)); poly(ctx, cl, col);
  poly(ctx, [[-26, -6], [-33, 40], [-34, 100], [-27, 138], [-10, 152], [10, 154], [25, 142], [29, 110], [31, 60], [26, -6]].map(([a, b]) => P(a, b)), col);
  // head: a soft round hood (no point), the face in profile just inside its rim
  const tilt = F.ang + (F.tilt || 0), hu = [Math.sin(tilt), -Math.cos(tilt)], hf = [f * Math.cos(tilt), f * Math.sin(tilt)], N = P(6, 146);
  const Hc = [N[0] + hu[0] * 30 * s + hf[0] * 4 * s, N[1] + hu[1] * 30 * s + hf[1] * 4 * s], Q = (a, b) => [Hc[0] + (hf[0] * a + hu[0] * b) * s, Hc[1] + (hf[1] * a + hu[1] * b) * s];
  // the hood, a little fuller than the head, with the face in profile inside its opening
  poly(ctx, [[-32, -42], [-39, -20], [-40, 2], [-35, 22], [-24, 36], [-8, 44], [10, 44], [24, 36], [32, 22], [34, 10], [30, -14], [24, -26], [10, -34], [2, -44], [-16, -50]].map(([a, b]) => Q(a, b)), col);
  poly(ctx, [[10, 26], [21, 23], [28, 15], [31, 8], [36, 2], [38, -3], [33, -7], [31, -12], [28, -19], [20, -25], [11, -27], [6, -12], [5, 10]].map(([a, b]) => Q(a, b)), skin);
  ctx.strokeStyle = col; ctx.lineWidth = 7 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(...Q(9, 30)); ctx.quadraticCurveTo(...Q(1, 2), ...Q(9, -30)); ctx.stroke();   // the hood's rim around the face
  ctx.fillStyle = mixHex(skin, '#000000', .25); ctx.beginPath(); ctx.moveTo(...Q(12, 27)); ctx.lineTo(...Q(28, 22)); ctx.lineTo(...Q(31, 12)); ctx.lineTo(...Q(16, 18)); ctx.closePath(); ctx.fill();   // shade under the hood's brim
  const E0 = Q(24, 8); ctx.fillStyle = '#1b1210'; ctx.beginPath(); ctx.ellipse(E0[0], E0[1], 2.6 * s, (F.blink ? .6 : 3) * s, tilt, 0, TAU); ctx.fill();   // the eye
  ctx.strokeStyle = '#3a2418'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(...Q(19, 13)); ctx.lineTo(...Q(29, 12)); ctx.stroke();   // brow
  if (mid) mid();
  if (F.farFront) arm(shF, F.hands[0], far, F.hand?.[0] || 'fist', skinF);
  arm(sh, F.hands[1], col, F.hand?.[1] || 'fist', skin);
}

// ---------------- timeline: my path, the cuts (after cross-papercut) ----------------
const SME = 1.04, SPI = .95;
const DT = 1 / 240, NT = Math.ceil((S.DUR + 1) / DT) + 2, MEX = new Float32Array(NT), MEP = new Float32Array(NT);
function vMe(t) {
  if (t < 3.2) return 44 * (1 + .6 * Math.sin(t * TAU / 1.15 - 1));
  if (t < 4.6) return 0;
  if (t < 5.0) return 370 * eio((t - 4.6) / .4);
  if (t < 8.3) return 370;
  if (t < 8.6) return lerp(370, 150, (t - 8.3) / .3);
  if (t < 9.0) return 150 * (1 - ss(8.6, 9.0, t));
  if (t < 10.0) return 0;
  if (t < 10.4) return 450 * Math.sin(Math.PI * (t - 10) / .4);
  if (t < 11.35) return 0;
  if (t < 12.0) return 640 * Math.sin(Math.PI * (t - 11.35) / .65);
  return 0;
}
const strideMe = t => t < 4.6 ? 116 : t < 8.8 ? 270 : 170;
const tab = (T, t) => { const i = clamp(t / DT, 0, NT - 2), i0 = Math.floor(i); return lerp(T[i0], T[i0 + 1], i - i0); };
const meX = t => tab(MEX, t), meP = t => tab(MEP, t);
const CUTS = [{ s: 3.2, d: .3, saw0: 3.5, drop: 4.0, up1: 4.4 }, { s: 9.0, d: .2, saw0: 9.2, drop: 9.8, up1: 10.0 }, { s: 10.4, d: .15, saw0: 10.55, drop: 11.2, up1: 11.35 }];
const leftAt = t => S.left[CUTS.filter(c => t >= c.drop).length];
const SLOTS = [22.9, 23.6, 24.3];   // the outline's missing span lights slot by slot (one piece's length each)
let PX = 0;   // where the camera looks back to: between pieces 2 and 3
const FLECKS = [];
let SAWLIE = null, E = 1600, GX = 0, GAY = 0, ROADX0 = -1500, ROADX1 = 0;
function buildTimeline() {
  let x = 0, p = 0;
  for (let i = 0; i < NT; i++) { const t = i * DT; MEX[i] = x; MEP[i] = p; const v = vMe(t); x += v * DT; p += v / strideMe(t) * DT; }
  E = meX(12) + 52; ROADX1 = E + G + 1500; GX = E + G + 380; GAY = BY + 4 - 330;
  CUTS.forEach((c, k) => {
    c.k = k; c.mx = meX(c.s); c.cutX = c.mx - 205 * SME; c.u0 = L * (1 - S.left[k]); c.u1 = L * (1 - S.left[k + 1]); c.baseX = c.cutX - c.u1; c.y = FY + 26;
    const r = rng(100 + k);
    for (let n = 0; n < 18; n++) FLECKS.push({ t0: n < 12 ? lerp(c.saw0, c.drop, n / 12) : c.drop + r() * .05, x: c.cutX + (r() - .5) * 8, y: c.y - PW / 2,
      vx: (r() - .5) * (n < 12 ? 180 : 320), vy: -(80 + r() * (n < 12 ? 160 : 260)), land: FY + 18 + r() * 44, r0: r() * TAU, vr: (r() - .5) * 20, sz: 3 + r() * 4, col: C.goldL });
  });
  PX = (CUTS[1].baseX + (CUTS[1].u0 + CUTS[1].u1) / 2 + CUTS[2].baseX + (CUTS[2].u0 + CUTS[2].u1) / 2) / 2 - 18;
  const c3 = CUTS[2]; SAWLIE = { grip: [c3.cutX + 150, FY + 52], ang: Math.PI + .05 };
}
function pieceAt(c, t) {   // a cut piece lying where it fell (shifted a little as it came off) — it never moves again
  const sh = 18 * eo((t - c.drop) / .25), cu = (c.u0 + c.u1) / 2, cx = c.baseX + cu - sh, cy = c.y, a = -.05 * eo((t - c.drop) / .25);
  return { x: cx - Math.cos(a) * cu, y: cy - Math.sin(a) * cu, a, cx, cy };
}

// ---------------- poses (after cross-papercut) ----------------
function walkSpec(x, gy, s, f, ph, stride, lean, lift = 22) {
  const feet = [0, 1].map(i => { const p = frac(ph + i * .5); let off, up = 0;
    if (p < .58) off = stride * (.29 - p); else { const u = (p - .58) / .42; off = -.29 * stride + .58 * stride * eio(u); up = lift * Math.sin(Math.PI * u); }
    return [x + f * off * s, gy - up * s]; });
  const hipH = (176 - 5 * Math.abs(Math.sin(TAU * ph))) * s;
  return { s, f, gy, hip: [x, gy - hipH], ang: f * lean, feet, hands: [null, null], hand: ['fist', 'fist'], tilt: 0, sway: -f * 7 * Math.sin(TAU * ph), ph };
}
function standSpec(x, gy, s, f, lean = .05) { return { s, f, gy, hip: [x, gy - 178 * s], ang: f * lean, feet: [[x - f * 18 * s, gy], [x + f * 22 * s, gy]], hands: [null, null], hand: ['fist', 'fist'], tilt: 0, sway: 0 }; }
function hangHands(F, swing = 0) { const sh = frame(F).P(4, 136); return [[sh[0] - F.f * (10 + swing) * F.s, sh[1] + 140 * F.s], [sh[0] - F.f * (10 - swing) * F.s, sh[1] + 140 * F.s]]; }
function mixSpec(A, Bs, k) {
  if (k <= 0) return A; if (k >= 1) return Bs;
  const l2 = (a, b) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)], hA = hangHands(A), hB = hangHands(Bs);
  const pick = k < .5 ? A : Bs;
  return { ...pick, s: lerp(A.s, Bs.s, k), gy: lerp(A.gy, Bs.gy, k), hip: l2(A.hip, Bs.hip), ang: lerp(A.ang, Bs.ang, k), feet: [l2(A.feet[0], Bs.feet[0]), l2(A.feet[1], Bs.feet[1])],
    hands: [0, 1].map(i => l2(A.hands[i] || hA[i], Bs.hands[i] || hB[i])), hand: pick.hand.slice(), tilt: lerp(A.tilt || 0, Bs.tilt || 0, k), sway: lerp(A.sway || 0, Bs.sway || 0, k) };
}
function carryCross(F, left, a0) {
  const fr = frame(F), sh = shoulderOf(F), T = [sh[0] + fr.up[0] * 11 * F.s, sh[1] + fr.up[1] * 11 * F.s];
  const a = F.f > 0 ? a0 : Math.PI - a0, d = [Math.cos(a), Math.sin(a)]; let n = [d[1], -d[0]]; if (n[1] > 0) n = [-n[0], -n[1]];

  return { x: T[0] + n[0] * PW / 2 - d[0] * contact, y: T[1] + n[1] * PW / 2 - d[1] * contact, a, contact, u0: L * (1 - left), lie: false };
}
const cpt = (X, u, v = 0) => [X.x + Math.cos(X.a) * u - Math.sin(X.a) * v, X.y + Math.sin(X.a) * u + Math.cos(X.a) * v];
function gripCarry(F, X) { F.hands = [cpt(X, Math.min(L - 16, X.contact + 26)), cpt(X, Math.min(L - 14, X.contact + 80))]; F.hand = ['fist', 'fist']; return F; }
const mixX = (A, Bx, k) => k <= 0 ? A : k >= 1 ? Bx : { ...Bx, x: lerp(A.x, Bx.x, k), y: lerp(A.y, Bx.y, k), a: lerp(A.a, Bx.a, k), u0: Bx.u0, lie: k > .62 ? Bx.lie : A.lie };
function rotAbout(X, pv, th) { const ox = X.x - pv[0], oy = X.y - pv[1]; return { ...X, x: pv[0] + ox * Math.cos(th) - oy * Math.sin(th), y: pv[1] + ox * Math.sin(th) + oy * Math.cos(th), a: X.a + th }; }

// ---------------- the saw ----------------
const CUT_ANG = Math.PI - .72, hangAng = f => Math.atan2(.95, .3 * f);
function sawGeo(grip, ang) { const d = [Math.cos(ang), Math.sin(ang)]; let up = [-d[1], d[0]]; if (up[1] > 0 || (up[1] === 0 && up[0] > 0)) up = [-up[0], -up[1]];
  return { d, up, heel: [grip[0] - up[0] * 14 + d[0] * 20, grip[1] - up[1] * 14 + d[1] * 20] }; }
function sawState(c, t) {
  const kp = clamp((t - c.saw0) / (c.drop - .06 - c.saw0)), saw = t >= c.saw0 - .05 && t < c.drop + .02;
  const osc = saw ? 24 * Math.sin(TAU * 3.4 * (t - c.saw0)) : 0, g0 = sawGeo([0, 0], CUT_ANG), d = g0.d, up = g0.up;
  const K = [c.cutX, c.y - PW / 2 + kp * PW * .92], heel = [K[0] - d[0] * (96 - osc), K[1] - d[1] * (96 - osc)];
  return { kp, grip: [heel[0] + up[0] * 14 - d[0] * 20, heel[1] + up[1] * 14 - d[1] * 20], K };
}
function drawSaw(ctx, grip, ang) {
  const { d, up, heel } = sawGeo(grip, ang);
  const P = (u, v) => [heel[0] + d[0] * u + up[0] * v, heel[1] + d[1] * u + up[1] * v];
  const blade = [P(0, 30), P(172, 18)]; for (let u = 172; u >= 0; u -= 9) blade.push(P(u, (u / 9 | 0) % 2 ? 3 : -3));
  poly(ctx, blade, C.steel);
  ctx.strokeStyle = 'rgba(190,255,240,.85)'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(...P(4, 27)); ctx.lineTo(...P(168, 16)); ctx.moveTo(...P(4, -1)); ctx.lineTo(...P(170, -1)); ctx.stroke();
  poly(ctx, [P(-4, 36), P(-38, 46), P(-52, 20), P(-40, -4), P(-6, 2)], C.handle);
}
function sawSpec(c, t) {
  const f = -1, mx = c.mx, s = SME, st = sawState(c, t);
  return { s, f, gy: FY, hip: [mx, FY - 84 * s], ang: f * 1.1, feet: [[mx + 74 * s, FY], [mx - 60 * s, FY]], hands: [st.grip, [c.cutX + 44 * s, c.y - PW / 2 - 3]],
    hand: ['fist', 'flat'], tilt: .32, sway: 0, farFront: true };
}
const hangGrip = (F, sw = 0) => { const sh = shoulderOf(F); return [sh[0] + F.f * (44 + sw) * F.s, sh[1] + 118 * F.s]; };
const rIdx = F => F.f > 0 ? 1 : 0, lIdx = F => F.f > 0 ? 0 : 1;

function poseMe(t) {
  const tp = Math.max(0, t12(t)), dx = meX(t) - meX(tp), left = leftAt(t);
  const walk = (tt, xx) => {
    const x = xx ?? meX(tt) + dx, ph = meP(tt);
    if (tt < 3.2) { const F = walkSpec(x, FY, SME, 1, ph, 116, .3 + .1 * Math.sin(tt * TAU / 1.15), 16); F.tilt = .12; F.hip[1] += 6 * Math.max(0, Math.sin(tt * TAU / 1.15 + 2)); return [F, -.5 + .07 * Math.sin(tt * TAU / 1.15 + .6)]; }
    if (tt < 8.8) { const k = ss(4.6, 5.2, tt); const F = walkSpec(x, FY, SME, 1, ph, lerp(116, 270, k), lerp(.16, .3, k), lerp(20, 62, k)); return [F, -.62]; }
    const F = walkSpec(x, FY, SME, 1, ph, 170, .16, 34); return [F, -.6];
  };
