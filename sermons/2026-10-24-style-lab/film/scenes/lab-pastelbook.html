<script>
/* 10 — soft pastel coloured-pencil picture book (a sunny meadow).
   Flat light fills laid in pencil (visible paper tooth: tiny white specks where the pencil skipped, diagonal stroke grain),
   thin wobbly warm-brown outlines (each colour outlined in a darker pencil of itself), puffy clouds outlined by the
   union-of-circles trick, cone and lollipop trees, a cream winding path and a pink-roofed cottage.
   "Me" is a small cream bear with a big wooden crate strapped on its back, bouncing along the path on twos (12 fps);
   the cottage window lights warm gold at 3.2 (the accent; chimney smoke starts), the crate slips off and thumps down.
   Native motion: clouds drift, grass tufts and flowers sway, a butterfly, a rabbit's ears twitch. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const C = {
  sky0: '#a9d4ea', sky1: '#cfe8f1', cloud: '#fdfcf6', cloudL: '#b9a596',
  hillF: '#a7cf93', hillFL: '#86b07a', hill: '#b4da98', hillL: '#8fba7f', mead: '#bfe0a0', meadL: '#97c084', meadD: '#aed392',
  cone: '#86bd78', coneL: '#5f9862', round: '#99cc84', roundD: '#86bb74', roundL: '#6aa064', trunk: '#b48a72', trunkL: '#87604f',
  path: '#f5efc4', pathL: '#d5c993', wall: '#fbf5e6', wallL: '#c4ad98', roof: '#f3b6c0', roofD: '#e9a1ae', roofL: '#c08593',
  win: '#e8e2c4', warm: '#ffd77a', door: '#d9b494',
  bear: '#ecd0a6', bearD: '#dcb98b', bearL: '#a57d5a', muzzle: '#f8ecd6', blush: '#f4b3a8',
  box: '#d9a877', boxD: '#c08c5c', boxL: '#8f6443', strap: '#9d6b4b',
  flowerW: '#fffdf4', flowerY: '#f8de7c', flowerP: '#f6c0c8', ink: '#8a6450',
};
const GY = 1560, X0 = 250, FS = 1.3;
const WIN = { x: 790, y: 906 };   // the cottage's front window centre (the warm accent)

// ---------------- pencil helpers ----------------
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
function smooth(pts, closed = true) {
  const p = new Path2D(), n = pts.length;
  if (closed) { const m0 = mid(pts[n - 1], pts[0]); p.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) { const a = pts[i], m = mid(a, pts[(i + 1) % n]); p.quadraticCurveTo(a[0], a[1], m[0], m[1]); } p.closePath(); }
  else { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n - 1; i++) { const m = mid(pts[i], pts[i + 1]); p.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); } p.lineTo(pts[n - 1][0], pts[n - 1][1]); }
  return p;
}
function rough(pts, amp, seed, step = 10, closed = true) {
  const o = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) { const a = pts[i], b = pts[(i + 1) % n], L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.max(1, Math.round(L / step));
    for (let j = 0; j < k; j++) { const u = j / k, x = a[0] + (b[0] - a[0]) * u, y = a[1] + (b[1] - a[1]) * u;
      o.push([x + (noise(x * .03 + seed, y * .03) - .5) * amp, y + (noise(y * .03 + seed * 1.7, x * .03 + 9) - .5) * amp]); } }
  if (!closed) o.push(pts[n - 1]);
  return o;
}
const ellPts = (cx, cy, rx, ry, n = 22) => { const o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return o; };
const TX = {};
// a pencil line: the main stroke plus a faint second pass slightly off, like a pencil going over its own line
function pencil(ctx, path, col, w = 2.6) {
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.globalAlpha = .9; ctx.stroke(path);
  ctx.translate(.8, .6); ctx.globalAlpha = .28; ctx.lineWidth = w * .7; ctx.stroke(path); ctx.restore();
}
// coloured-pencil fill: flat colour, diagonal pencil grain of a darker/lighter shade, a shade band toward one side
function fillPencil(ctx, path, col, o = {}) {
  ctx.fillStyle = col; ctx.fill(path);
  ctx.save(); ctx.clip(path);
  if (o.shade) { const [x0, y0, x1, y1] = o.shadeDir || [0, 0, 0, 1]; const b = o.bbox; const g = ctx.createLinearGradient(lerp(b[0], b[2], x0), lerp(b[1], b[3], y0), lerp(b[0], b[2], x1), lerp(b[1], b[3], y1));
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.55, 'rgba(0,0,0,0)'); g.addColorStop(1, o.shade); ctx.fillStyle = g; ctx.fillRect(b[0] - 5, b[1] - 5, b[2] - b[0] + 10, b[3] - b[1] + 10); }
  ctx.globalAlpha = o.grain ?? .5; ctx.drawImage(TX.strokes, 0, 0);
  ctx.restore();
}
function shape(ctx, pts, fill, line, o = {}) {
  const p = smooth(o.amp === 0 ? pts : rough(pts, o.amp ?? 3, o.seed ?? 1, o.step ?? 9));
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  fillPencil(ctx, p, fill, { ...o, bbox: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)] });
  if (line) pencil(ctx, p, line, o.lw || 2.6);
  return p;
}
// union of wobbly circles with a single outer outline (stroke all, then fill all over it)
function blobs(ctx, circles, fill, line, o = {}) {
  const p = new Path2D(); let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
  circles.forEach(([cx, cy, r], i) => { p.addPath(smooth(rough(ellPts(cx, cy, r, r * (o.sq || 1), 20), o.amp ?? 3, (o.seed || 1) + i * 3.3, 8)));
    bx0 = Math.min(bx0, cx - r); by0 = Math.min(by0, cy - r); bx1 = Math.max(bx1, cx + r); by1 = Math.max(by1, cy + r); });
  if (line) { ctx.save(); ctx.strokeStyle = line; ctx.lineWidth = (o.lw || 2.6) * 2; ctx.lineJoin = 'round'; ctx.globalAlpha = .9; ctx.stroke(p); ctx.restore(); }
  fillPencil(ctx, p, fill, { ...o, bbox: [bx0, by0, bx1, by1] });
  return p;
}
function strokesTexture(w, h, seed) {   // pencil grain: diagonal streaks, paper tooth specks (white where the pencil skipped)
  const c = Pilot.canvas(w, h), x = c.getContext('2d'), d = x.createImageData(w, h), q = d.data, r = rng(seed);
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
    const s = noise((i + y) * .5, (i - y) * .13 + seed) - .5, tooth = r(), o = (y * w + i) * 4;
    if (tooth > .91 || s > .25) { q[o] = q[o + 1] = q[o + 2] = 255; q[o + 3] = tooth > .91 ? 120 : (s - .25) * 380; }
    else if (s < -.28) { q[o] = 60; q[o + 1] = 50; q[o + 2] = 40; q[o + 3] = (-s - .28) * 180; }
  }
  x.putImageData(d, 0, 0); return c;
}
function paperTexture(w, h, seed) {   // final pass: fine tooth + soft warm unevenness
  const c = Pilot.canvas(w, h), x = c.getContext('2d'), d = x.createImageData(w, h), q = d.data, r = rng(seed);
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
    const lo = noise(i / 180, y / 180 + seed) - .5, t = r(), o = (y * w + i) * 4, v = 128 + lo * 40 + (t - .5) * 46 + (t > .97 ? 50 : 0);
    q[o] = q[o + 1] = q[o + 2] = v; q[o + 3] = 255; }
  x.putImageData(d, 0, 0); return c;
}

// ---------------- the meadow (static) ----------------
function cone(ctx, x, y, h, seed) {   // a soft cone tree in tiers
  shape(ctx, [[x - 9, y], [x - 7, y + 30], [x + 7, y + 30], [x + 9, y]], C.trunk, C.trunkL, { seed, amp: 1.5, lw: 2.2 });
  const w = h * .42, pts = [[x, y - h], [x + w * .45, y - h * .55], [x + w * .32, y - h * .55], [x + w * .8, y - h * .12], [x + w * .5, y - h * .12], [x + w, y + 4], [x - w, y + 4], [x - w * .5, y - h * .12], [x - w * .8, y - h * .12], [x - w * .32, y - h * .55], [x - w * .45, y - h * .55]];
  shape(ctx, pts, C.cone, C.coneL, { seed: seed + 1, amp: 3, shade: 'rgba(40,90,50,.22)', shadeDir: [0, 0, 1, .4] });
  ctx.save(); ctx.strokeStyle = C.coneL; ctx.lineWidth = 2; ctx.globalAlpha = .55; ctx.lineCap = 'round';
  for (const [dx, dy] of [[-w * .2, -h * .3], [w * .25, -h * .05], [-w * .35, h * .02]]) { ctx.beginPath(); ctx.moveTo(x + dx, y + dy); ctx.lineTo(x + dx + 6, y + dy - 10); ctx.stroke(); }
  ctx.restore();
}
function roundTree(ctx, x, y, r, seed, trunkH = 60) {
  shape(ctx, [[x - 12, y - r * .3], [x - 13, y + trunkH], [x + 13, y + trunkH], [x + 12, y - r * .3]], C.trunk, C.trunkL, { seed, amp: 2 });
  const rr = rng(seed), cs = [[x, y - r * .55, r * .72], [x - r * .5, y - r * .1, r * .6], [x + r * .5, y - r * .12, r * .62], [x, y + r * .05, r * .6], [x - r * .1, y - r * 1.0, r * .5]];
  blobs(ctx, cs.map(c => [c[0] + (rr() - .5) * 8, c[1], c[2]]), rr() < .5 ? C.round : C.roundD, C.roundL, { seed, shade: 'rgba(40,90,50,.22)', shadeDir: [.2, 0, .9, 1] });
  ctx.save(); ctx.strokeStyle = C.roundL; ctx.lineWidth = 2.2; ctx.globalAlpha = .6; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) { const a = rr() * TAU, d = r * .4 * rr(); ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * d, y - r * .4 + Math.sin(a) * d); ctx.quadraticCurveTo(x + Math.cos(a) * d + 8, y - r * .4 + Math.sin(a) * d - 4, x + Math.cos(a) * d + 12, y - r * .4 + Math.sin(a) * d - 14); ctx.stroke(); }
  ctx.restore();
}
function bushRow(ctx, x, y, n, r, seed, col = C.meadD) {
  const rr = rng(seed), cs = []; for (let i = 0; i < n; i++) cs.push([x + i * r * 1.25, y - rr() * r * .3, r * (.8 + rr() * .4)]);
  const p = blobs(ctx, cs, col, C.meadL, { seed, sq: .78, lw: 2.2 });
}
function hillPath(y0, amp, ph, seed, k = 1) { const pts = [[-40, 1920]]; for (let i = 0; i <= 20; i++) { const u = i / 20, x = -40 + u * 1160; pts.push([x, y0 - Math.sin(u * Math.PI * k + ph) * amp]); } pts.push([1120, 1920]); return pts; }
function pathRibbon() {   // the winding path: centreline + perspective width
  const cl = [[-80, 1640, 150], [150, 1612, 140], [430, 1580, 128], [700, 1530, 112], [850, 1460, 96], [820, 1380, 80], [600, 1320, 68], [430, 1262, 58], [470, 1180, 50], [640, 1110, 42], [740, 1040, 36], [770, 980, 30]];
  const pts = []; for (let i = 0; i < cl.length - 1; i++) for (let j = 0; j < 8; j++) { const u = j / 8, a = cl[i], b = cl[i + 1]; pts.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)]); }
  pts.push(cl[cl.length - 1]);
  const sm = pts.map((p, i) => { const a = pts[Math.max(0, i - 2)], b = pts[Math.min(pts.length - 1, i + 2)]; return [(a[0] + p[0] * 2 + b[0]) / 4, (a[1] + p[1] * 2 + b[1]) / 4, p[2]]; });
  const L = [], R = []; sm.forEach((p, i) => { const a = sm[Math.max(0, i - 1)], b = sm[Math.min(sm.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
    const nx = -dy / d, ny = dx / d, w = p[2] / 2; L.push([p[0] + nx * w, p[1] + ny * w * .55]); R.push([p[0] - nx * w, p[1] - ny * w * .55]); });
  return { L, R };
}
function buildSky() {
  const c = Pilot.canvas(W, H), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 900); g.addColorStop(0, C.sky0); g.addColorStop(1, C.sky1); x.fillStyle = g; x.fillRect(0, 0, W, 1000);
  x.save(); x.globalAlpha = .25; x.drawImage(TX.strokes, 0, 0); x.restore();
  return c;
}
function cloudSprite(w, h, seed, n) {   // a puffy cloud: a row of round bumps on a flat-ish base
  const pd = Math.round(h * .5), c = Pilot.canvas(w + 2 * pd, h + 2 * pd), x = c.getContext('2d'), r = rng(seed), cs = [];
  const base = pd + h;
  for (let i = 0; i < n; i++) { const u = (i + .5) / n, rr = h * (.3 + .3 * Math.sin(u * Math.PI)) * (.85 + r() * .3);
    cs.push([pd + w * (.06 + .88 * u), base - rr * .75 - Math.sin(u * Math.PI) * h * .3, rr]); }
  for (let i = 0; i < n - 1; i++) { const u = (i + 1) / n; cs.push([pd + w * (.06 + .88 * u), base - h * .3, h * .3]); }
  blobs(x, cs, C.cloud, C.cloudL, { seed, lw: 2.4, grain: .2 });
  x.globalCompositeOperation = 'source-atop'; const g = x.createLinearGradient(0, base - h * .5, 0, base); g.addColorStop(0, 'rgba(170,200,220,0)'); g.addColorStop(1, 'rgba(170,200,220,.32)'); x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  c.pd = pd; return c;
}
function buildLand() {
  const c = Pilot.canvas(W, H), x = c.getContext('2d'), r = rng(9);
  // far hills
  shape(x, hillPath(820, 60, .2, 1, 1.6), C.hillF, C.hillFL, { seed: 2, amp: 2, step: 14, shade: 'rgba(60,110,70,.12)' });
  cone(x, 120, 800, 120, 11); cone(x, 205, 790, 150, 12); cone(x, 990, 780, 130, 13);
  shape(x, hillPath(930, 80, -.3, 3, 1.1), C.hill, C.hillL, { seed: 4, amp: 2, step: 14 });
  bushRow(x, 60, 932, 3, 26, 21, C.hill); bushRow(x, 380, 905, 2, 22, 22, C.hill);
  // the cottage on the crest
  drawCottage(x);
  cone(x, 960, 940, 210, 14); roundTree(x, 1050, 900, 70, 15, 50);
  // the meadow
  shape(x, hillPath(1060, 40, .8, 5, 1.3), C.mead, C.meadL, { seed: 6, amp: 2, step: 14 });
  // the path
  const { L, R } = pathRibbon(); const pp = smooth([...L, ...R.slice().reverse()]);
  fillPencil(x, pp, C.path, { grain: .45, bbox: [0, 900, W, 1700] });
  pencil(x, smooth(rough(L, 2.5, 31, 10, false), false), C.pathL, 2.4); pencil(x, smooth(rough(R, 2.5, 32, 10, false), false), C.pathL, 2.4);
  // meadow furniture: bush rows, trees, flower dots, grass ticks
  bushRow(x, 30, 1130, 3, 30, 41); bushRow(x, 860, 1210, 3, 28, 42); bushRow(x, 120, 1380, 2, 34, 43); bushRow(x, 620, 1690, 4, 36, 44);
  roundTree(x, 140, 1210, 92, 51, 80); roundTree(x, 960, 1350, 120, 52, 110);
  cone(x, 300, 1110, 170, 53);
  // a little pond low on the right (ducklings bob on it, live)
  const pond = shape(x, ellPts(800, 1802, 200, 50, 26), '#a9dcd8', '#7fb3ad', { seed: 54, amp: 4, step: 12, shade: 'rgba(60,120,130,.18)', shadeDir: [0, 1, 0, 0] });
  x.save(); x.clip(pond); x.strokeStyle = 'rgba(255,255,255,.8)'; x.lineWidth = 2.4; x.lineCap = 'round';
  for (const [px, py, l] of [[660, 1800, 40], [930, 1790, 30], [760, 1838, 50]]) { x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + l / 2, py - 4, px + l, py); x.stroke(); } x.restore();
  for (const [px, py, rr] of [[640, 1772, 14], [662, 1766, 10], [980, 1768, 12]]) shape(x, ellPts(px, py, rr, rr * .7, 12), '#e4ded2', '#b2a898', { seed: px, amp: 1, lw: 2 });
  // foreground framing: a big round tree bottom-left, bushes bottom-right
  roundTree(x, 30, 1830, 170, 55, 140); bushRow(x, 860, 1900, 3, 48, 56); bushRow(x, 300, 1910, 3, 40, 57);
  // grass ticks (static ones; a few live tufts sway in draw)
  x.save(); x.strokeStyle = C.meadL; x.lineWidth = 2; x.lineCap = 'round'; x.globalAlpha = .7;
  for (let i = 0; i < 110; i++) { const gx = r() * W, gy = 1000 + r() * 820, s = .6 + (gy - 1000) / 820;
    if (gy > 1500 && gy < 1700 && gx > 0 && gx < 760) continue;
    x.beginPath(); x.moveTo(gx - 5 * s, gy - 8 * s); x.lineTo(gx, gy); x.lineTo(gx + 3 * s, gy - 10 * s); x.stroke(); }
  x.restore();
  return c;
}
function drawCottage(x) {
  const cx = 720, by = 960;   // left wall x, base y
  // gable end (front, facing us) and side wall
  shape(x, [[cx - 150, by], [cx - 150, by - 96], [cx, by - 96], [cx, by]], C.wall, C.wallL, { seed: 61, amp: 1.6, shade: 'rgba(120,100,80,.12)', shadeDir: [0, 0, 0, 1] });
  shape(x, [[cx, by], [cx, by - 96], [cx + 68, by - 170], [cx + 136, by - 96], [cx + 136, by]], C.wall, C.wallL, { seed: 62, amp: 1.6 });
  // roof: long pink slope over the side, edge over the gable
  shape(x, [[cx - 170, by - 90], [cx - 92, by - 178], [cx + 72, by - 178], [cx + 4, by - 90]], C.roof, C.roofL, { seed: 63, amp: 1.8, shade: 'rgba(200,110,130,.25)', shadeDir: [0, 0, 0, 1] });
  shape(x, [[cx + 72, by - 182], [cx + 150, by - 92], [cx + 136, by - 88], [cx + 68, by - 166], [cx + 2, by - 88], [cx - 8, by - 94]], C.roofD, C.roofL, { seed: 64, amp: 1.2 });
  // chimney
  shape(x, [[cx - 70, by - 160], [cx - 70, by - 200], [cx - 44, by - 200], [cx - 44, by - 172]], C.roofD, C.roofL, { seed: 65, amp: 1 });
  shape(x, [[cx - 76, by - 200], [cx - 76, by - 210], [cx - 38, by - 210], [cx - 38, by - 200]], C.roof, C.roofL, { seed: 66, amp: 1 });
  // door (gable end) and the side windows (front window is drawn live)
  shape(x, [[cx + 50, by], [cx + 50, by - 58], [cx + 86, by - 58], [cx + 86, by]], C.door, C.wallL, { seed: 67, amp: 1.2 });
  x.fillStyle = C.wallL; x.beginPath(); x.arc(cx + 80, by - 28, 2.4, 0, TAU); x.fill();
  for (const wx of [cx - 125]) shape(x, [[wx, by - 70], [wx, by - 40], [wx + 30, by - 40], [wx + 30, by - 70]], C.win, C.wallL, { seed: 68 + wx, amp: 1 });
}

// ---------------- the bear (live, on twos) ----------------
const V = 80, T1 = 1.9, DEC = .7, STRIDE = 30, CYC = 60;
const walkX = t => { if (t < T1) return V * t; const u = Math.min(t - T1, DEC); return V * T1 + V * u - V * u * u / (2 * DEC); };
const speed = t => t < T1 ? 1 : Math.max(0, 1 - (t - T1) / DEC);
const t12 = t => Math.floor(t * 12 + 1e-6) / 12;
const rot = (p, a, o) => { const c = Math.cos(a), s = Math.sin(a), x = p[0] - o[0], y = p[1] - o[1]; return [o[0] + x * c - y * s, o[1] + x * s + y * c]; };
function footAt(u, s) { if (u < .5) return [s / 2 - s * (u / .5), 0]; const w = (u - .5) / .5, e = w * w * (3 - 2 * w); return [-s / 2 + s * e, -14 * Math.sin(Math.PI * w)]; }
function pose(t) {
  const X = walkX(t), ph = X / CYC, sp = speed(t);
  const sag = ss(2.6, 3.0, t) * (1 - ss(3.3, 3.8, t)), look = eio((t - 3.2) / .5), relief = eo((t - 4.4) / .5);
  const hop = Math.abs(Math.sin(ph * TAU)) * 9 * sp;            // the bounce: up between footfalls
  const hipY = -40 - hop + sag * 5 - relief * 2;
  const lean = .2 + sag * .06 - look * .06 - relief * .16 + (t > 4.4 ? -.07 * Math.sin(clamp((t - 4.4) / .5) * Math.PI) : 0);
  const head = -.25 - sag * .12 + look * .5 + .05 * Math.sin(ph * TAU * 2) * sp;
  const stretch = 1 + .05 * Math.sin(clamp((t - 4.45) / .6) * Math.PI) + .012 * Math.sin((t - 4.4) * 2.8) * ss(4.9, 5.3, t);
  return { X, ph, sp, hipY, lean, head, look, relief, stretch, sag };
}
function cratePos(t, P) {
  const onBack = pp => { const c = rot([-54, pp.hipY - 70], pp.lean, [0, pp.hipY]); return { x: c[0], y: c[1], r: pp.lean * .9, sq: 1 }; };
  if (t < 3.95) return onBack(P);
  const a = onBack(pose(3.95));
  if (t < 4.15) { const u = eio((t - 3.95) / .2); return { x: a.x - 10 * u, y: a.y + 16 * u, r: a.r - .12 * u, sq: 1 }; }
  const s0 = { x: a.x - 10, y: a.y + 16, r: a.r - .12 }, end = { x: -118, y: -2, r: 0 };

function drawFlower(ctx, f, t) {
