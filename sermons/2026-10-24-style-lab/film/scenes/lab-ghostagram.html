<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>스타일 실험 · 고스타그램 네온 지하철</title>

<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script src="lab-ghostagram-rig.js"></script>
<script>
/* 고스타그램 — a night subway car in one-point perspective, lo-fi album-cover mood: violet / magenta / electric blue, a cyan
   neon tube down the ceiling, pink strap rings, glossy floor reflections, bokeh specks, VHS grain + a slight colour fringe.
   Clean ink outlines, flat cel colour, one hard shadow tone, neon rim bands on every figure edge (lab-ghostagram-rig.js).
   Me = the cavesil hooded figure (dark hoodie, pale profile face) carrying a wooden cross on the shoulder, hands on the beam.
   The passengers = graphite sheet ghosts, lit from below by their phones, scrolling — each with their own attitude:
   headphones on the near bench, a backwards cap squatting by the door, round sunglasses nodding to the beat (90 BPM).
   Beats (script.js): trudge in 0–2.6, stop, look up 3.2 as the train runs into a lit station (amber sweeps the windows from
   the far end — the one warm thing), the cross slips off and lands 4.4–4.85 (floor reflections jiggle, the ghosts glance
   up), breathe. Poses on twos (12 fps), light / tunnel / straps / bokeh on ones. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot, R = window.Rig, INK = R.INK;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const FONT = "'Jua',sans-serif";
const t12 = t => Math.floor(t * 12 + 1e-6) / 12;
const frac = x => x - Math.floor(x);
const BEAT = 2 / 3;   // 90 BPM → 9 beats in the 6-s loop

// ---------------- perspective: camera at the origin looking down +z, eye 1.5 m above the floor ----------------
const FOC = 900, VX = 520, VY = 830, PVX = 520, PVY = 1050;
const HW = 1.45, FL = -1.5, WT = .42, CL = .80, CX = .98, ZE = 21;
const pr = (x, y, z) => [VX + FOC * x / z, VY - FOC * y / z];
const SEG = [['bench', .6, 3.9], ['door', 4.0, 5.3], ['bench', 5.45, 9.55], ['door', 9.7, 11.0], ['bench', 11.15, 15.25], ['door', 15.4, 16.7], ['bench', 16.85, ZE]];

const COL = {
  navy: '#0a0827', ceil: '#2b2378', ceil2: '#3d2f9c', cove: '#4a35b4', wall: '#3a2a98', wall2: '#2a1f76', kick: '#231a62',
  win: '#100c3a', door: '#5a44c8', doorD: '#3d2d9a', seat: '#a23fc8', seatF: '#6a2696', seatB: '#8a34b4', floor: '#2a1d72', floor2: '#5a3cbc',
  pole: '#c9d2ff', rail: '#9fb0ff', strap: '#ff5fc0', strapB: '#ff8ad6', cyan: '#7ff4ff', mag: '#ff4fd8', amber: '#ffb347', amberL: '#ffe2a6',
  wood: '#9a6044', woodS: '#5e3150', woodL: '#d39a6c',
  hood: '#2c2272', hoodD: '#1a1450', hoodFar: '#1e1758', hoodNear: '#3a2d8e', skin: '#f3ecff', skinD: '#c9b8f0',
  sheet: '#efeaff', sheetD: '#a99ae6',
};
const rgb = Pilot.hex, css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`, mixc = (a, b, k) => Pilot.mix(rgb(a), rgb(b), k);

// ---------------- timing ----------------
const DROP = B.drop, SLIDE = DROP + .2, IMPACT = DROP + .45;
// the station: amber sweeps the windows from the far end toward us (the train runs into a lit platform), fades a little at the end
const zFront = t => ZE + 3 - 46 * (t - 3.02);
const warmZ = (z, t) => ss(zFront(t) - 1.5, zFront(t) + 1.5, z) * (1 - .55 * ss(5.05, 5.95, t));
const warmAll = t => warmZ(2.5, t);
// neon tube: buzz + two quick drop-outs
const tubeK = t => { let k = .92 + .08 * Math.sin(t * 157) * Math.sin(t * 43);
  for (const [a, d] of [[1.55, .12], [5.2, .08]]) if (t > a && t < a + d) k *= [.35, .9, .25, .8][Math.floor((t - a) / d * 4)] ?? 1;
  return k; };

// ---------------- me: position (integrated once), walk phase ending on a planted stance ----------------
const ZME = 2.45, GY = pr(0, FL, ZME)[1], SME = FOC / ZME * 1.68 / 388;
const X0 = 905, DT = 1 / 240, NT = Math.ceil(7 / DT) + 2, MEX = new Float32Array(NT);
const vMe = t => t < 2.15 ? 92 * (1 + .45 * Math.sin(t * TAU / 1.24 - .9)) : 92 * (1 - ss(2.15, 2.6, t)) * (1 + .45 * Math.sin(t * TAU / 1.24 - .9));
for (let i = 1; i < NT; i++) MEX[i] = MEX[i - 1] + vMe((i - .5) * DT) * DT;
const distAt = t => { const u = clamp(t, 0, 6.9) / DT, i = Math.floor(u); return lerp(MEX[i], MEX[i + 1], u - i); };
const DTOT = distAt(2.6), NSTEP = Math.max(1, Math.round(DTOT / (116 * SME) - .54)), STRIDE = DTOT / (SME * (NSTEP + .54));
const meX = t => X0 - distAt(t);

// the cross (kit beam units × SME): post L, width PW, crossbar at CBX from the foot, half-length CBH (upright) / CBHL (lying)
const L = 520, PW = 34, CBX = L - 130, CBW = 32, CBH = 118, CBHL = 46, CONTACT = 238, HOLD = 128;
const cpt = (X, u, v = 0) => [X.x + Math.cos(X.a) * u - Math.sin(X.a) * v, X.y + Math.sin(X.a) * u + Math.cos(X.a) * v];
function carry(F, a0, w, contact) {   // styles/cavesil carry(): the beam rests ON the shoulder, behind the head
  const fr = R.frame(F), sh = fr.P(-10, 128), T = [sh[0] + fr.up[0] * 10 * F.s, sh[1] + fr.up[1] * 10 * F.s];
  const a = F.f > 0 ? a0 : Math.PI - a0, d = [Math.cos(a), Math.sin(a)]; let n = [d[1], -d[0]]; if (n[1] > 0) n = [-n[0], -n[1]];
  return { x: T[0] + n[0] * w / 2 - d[0] * contact, y: T[1] + n[1] * w / 2 - d[1] * contact, a, contact };
}
function walkPose(x, gy, s, f, ph, stride, lean, lift = 16) {   // styles/cavesil walk()
  const feet = [0, 1].map(i => { const p = frac(ph + i * .5); let off, up = 0;
    if (p < .58) off = stride * (.29 - p); else { const u = (p - .58) / .42; off = -.29 * stride + .58 * stride * eio(u); up = lift * Math.sin(Math.PI * u); }
    return [x + f * off * s, gy - up * s]; });
  const hipH = (176 - 5 * Math.abs(Math.sin(TAU * ph))) * s;
  return { s, f, gy, hip: [x, gy - hipH], ang: f * lean, feet, hands: [null, null], hand: ['fist', 'fist'], tilt: 0, eye: 'calm', sway: -f * 7 * Math.sin(TAU * ph), ph };
}
const hangHands = F => { const sh = R.frame(F).P(4, 136); return [[sh[0] - F.f * 10 * F.s, sh[1] + 140 * F.s], [sh[0] - F.f * 4 * F.s, sh[1] + 142 * F.s]]; };
function poseMe(t) {
  const tw = Math.min(t, 2.6), ph = distAt(tw) / (STRIDE * SME), x = meX(tw);
  const wk = 1 - ss(2.3, 2.7, t), look = eio(ss(B.look - .05, B.look + .5, t)), rel = ss(DROP + .1, DROP + .6, t);
  const bob = Math.sin(t * TAU / 1.24 + .6);
  let lean = lerp(.3 + .06 * bob * wk, .36, ss(2.5, 2.8, t)); lean = lerp(lean, .2, look); lean = lerp(lean, .07, rel);
  const F = walkPose(x, GY, SME, -1, ph, STRIDE, lean, 16);
  F.sway *= wk;
  F.hip[1] += (6 * Math.max(0, bob) * wk + 10 * ss(2.5, 2.9, t) * (1 - look)) * SME - 6 * SME * rel + 2.5 * SME * Math.sin((t - DROP) * TAU / 1.7) * ss(DROP + .6, DROP + 1.1, t);
  F.col = COL.hood; F.colD = COL.hoodD; F.colFar = COL.hoodFar; F.colNear = COL.hoodNear; F.colLeg = '#251c66'; F.skin = COL.skin; F.skinD = COL.skinD;
  F.shoe = { shoe: '#f4f0ff', sole: '#ff5fc0', lace: '#2c2272' };
  F.eye = look > .3 ? 'calm' : 'strain'; F.mouth = t > DROP + .25 && t < DROP + 1.1 ? 'o' : look > .3 ? 'soft' : null;
  // head: down and weary → up toward the light ahead (the far end, over the crossbar)
  const tl = R.frame(F).P(6, 176), T = [VX - 40, VY - 170], aim = Math.atan2(-(T[1] - tl[1]), -(T[0] - tl[0]));
  F.tilt = lerp(.16 + .03 * bob * wk + .06 * ss(2.5, 2.9, t), clamp(aim - F.ang, -.7, .7), look);
  return F;
}
const crossAt = (F) => { const X = carry(F, -.4, PW * SME, CONTACT * SME); return X; };
const gripsOn = (F, X) => [cpt(X, (CONTACT + HOLD) * SME), cpt(X, (CONTACT + HOLD - 50) * SME)];
// the drop: hands open, the beam slides back along itself off the shoulder, then topples back and lands on the floor behind
// me, angled into the car toward the aisle (foot end just behind my heels, top end back by the far door) — a 3-D box on the floor
const M = 1.68 / 388;                                     // metres per kit unit at my size
const LAND = { foot: [.9, 2.65], top: [-.25, 4.58], th: .065 };   // where it lies (world x, z) and its thickness (m)
function crossEnds(t) {   // screen end points of the post's centre line (foot, top) + fall progress u
  if (t < DROP) { const F = poseMe(t12(t)), X = crossAt(F); return { foot: [X.x, X.y], top: cpt(X, L * SME), u: 0 }; }
  const F0 = poseMe(t12(DROP - 1e-3)), X0 = crossAt(F0), d = [Math.cos(X0.a), Math.sin(X0.a)];
  const back = (L - CONTACT + 24) * SME;
  if (t < SLIDE) { const u = (t - DROP) / (SLIDE - DROP), sl = back * u * u, X = { x: X0.x - d[0] * sl, y: X0.y - d[1] * sl, a: X0.a }; return { foot: [X.x, X.y], top: cpt(X, L * SME), u: 0 }; }
  const Xs = { x: X0.x - d[0] * back, y: X0.y - d[1] * back, a: X0.a }, top0 = cpt(Xs, L * SME), foot0 = [Xs.x, Xs.y];
  const u = clamp((t - SLIDE) / (IMPACT - SLIDE)), y = FL + LAND.th / 2;
  const fT = pr(LAND.foot[0], y, LAND.foot[1]), tT = pr(LAND.top[0], y, LAND.top[1]);
  const q = u * u, q2 = clamp(u * 1.25) ** 2;
  return { foot: [lerp(foot0[0], fT[0], q2), lerp(foot0[1], fT[1], q2)], top: [lerp(top0[0], tT[0], q), lerp(top0[1], tT[1], q)], u };
}
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]], add2 = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
function quads2D(foot, top, hb) {   // the flat cross between two screen points: post + crossbar quads (upper side first)
  const dv = sub(top, foot), Ln = Math.hypot(dv[0], dv[1]) || 1, d = [dv[0] / Ln, dv[1] / Ln]; let up = [-d[1], d[0]]; if (up[1] > 0) up = [-up[0], -up[1]];
  const pw = PW * SME / 2, cbw = CBW * SME / 2, h = hb * SME, c = add2(foot, dv, CBX / L);
  return { post: [add2(foot, up, pw), add2(top, up, pw), add2(top, up, -pw), add2(foot, up, -pw)],
    bar: [add2(add2(c, up, h), d, cbw), add2(add2(c, up, h), d, -cbw), add2(add2(c, up, -h), d, -cbw), add2(add2(c, up, -h), d, cbw)] };
}
function quads3D(y) {   // the lying cross as projected boxes (top faces at height y): same corner order as quads2D
  const [fx, fz] = LAND.foot, [tx, tz] = LAND.top, Ln = Math.hypot(tx - fx, tz - fz), d = [(tx - fx) / Ln, (tz - fz) / Ln];
  let pp = [d[1], -d[0]]; const P = (u, v) => pr(fx + d[0] * u + pp[0] * v, y, fz + d[1] * u + pp[1] * v);
  if (P(Ln / 2, .1)[1] > P(Ln / 2, -.1)[1]) pp = [-pp[0], -pp[1]];
  const pw = PW * M / 2, cbw = CBW * M / 2, h = CBH * M, cb = Ln * CBX / L;
  return { post: [P(0, pw), P(Ln, pw), P(Ln, -pw), P(0, -pw)], bar: [P(cb + cbw, h), P(cb - cbw, h), P(cb - cbw, -h), P(cb + cbw, -h)] };
}
function crossQuads(t) {
  const E = crossEnds(t), hb = lerp(CBH, CBH * .6, ss(.2, 1, E.u)), A = quads2D(E.foot, E.top, hb), m = t < SLIDE ? 0 : ss(.45, 1, E.u);
  if (m <= 0) return { ...A, m: 0 };
  const Tp = quads3D(FL + LAND.th), Bt = quads3D(FL);
  let b = 0; if (t > IMPACT) { const v = t - IMPACT; b = 12 * SME * Math.exp(-v * 7) * Math.abs(Math.sin(v * 15)); }
  const mix = (P, Q) => P.map((p, i) => [lerp(p[0], Q[i][0], m), lerp(p[1], Q[i][1], m) - b]);
  return { post: mix(A.post, Tp.post), bar: mix(A.bar, Tp.bar), postB: mix(A.post, Bt.post), barB: mix(A.bar, Bt.bar), m };
}
function meFull(t) {
  const tp = t12(t), F = poseMe(tp);
  if (tp < DROP) { const X = crossAt(F); F.hands = gripsOn(F, X); return F; }
  const F0 = poseMe(t12(DROP - 1e-3)), hg = gripsOn(F0, crossAt(F0)), hh = hangHands(F), k = eio(ss(DROP + .03, DROP + .42, tp));
  const sw = Math.exp(-(tp - DROP - .5) * 4) * Math.sin((tp - DROP - .5) * 10) * ss(DROP + .45, DROP + .5, tp) * 10 * SME;
  F.hands = [0, 1].map(i => [lerp(hg[i][0], hh[i][0], k) - F.f * sw, lerp(hg[i][1], hh[i][1], k)]);
  F.hand = k < .15 ? ['open', 'open'] : ['open', 'open'];
  return F;
}

// ---------------- the cross (drawn as cel wood: ink outline, flat wood, one hard shadow tone, neon / amber rims) ----------------
function drawCross(ctx, Q, lt, warm) {
  const s = SME, P2q = q => { const p = new Path2D(); q.forEach((v, i) => i ? p.lineTo(v[0], v[1]) : p.moveTo(v[0], v[1])); p.closePath(); return p; };
  // lying: the box sides first (dark wood), so the cross sits on the floor with thickness
  if (Q.m > 0) { const sides = new Path2D();
    for (const [T, Bq] of [[Q.post, Q.postB], [Q.bar, Q.barB]]) for (let i = 0; i < 4; i++) { const j = (i + 1) % 4; sides.addPath(P2q([T[i], T[j], Bq[j], Bq[i]])); }
    ctx.save(); ctx.globalAlpha = Q.m; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 3.4 * s; ctx.stroke(sides); ctx.fillStyle = '#7a4650'; ctx.fill(sides); ctx.restore(); }
  const post = P2q(Q.post), bar = P2q(Q.bar), all = new Path2D(); all.addPath(post); all.addPath(bar);
  R.cel(ctx, all, COL.wood, s, lt, () => {
    // hard shadow on the lower half of the post and one side of the bar; a few grain lines along the post
    const [a, b, c, d] = Q.post, mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    ctx.save(); ctx.globalAlpha = 1 - Q.m; ctx.fillStyle = COL.woodS; ctx.fill(P2q([mid(a, d), mid(b, c), c, d]));
    const [e, f, g, h] = Q.bar; ctx.fill(P2q([mid(e, f), f, g, mid(h, g)])); ctx.restore();
    if (Q.m > 0) { ctx.fillStyle = `rgba(255,236,200,${.35 * Q.m})`; ctx.fill(P2q([a, b, mid(b, c), mid(a, d)])); }   // lying: the top face catches the light
    ctx.strokeStyle = 'rgba(70,30,60,.55)'; ctx.lineWidth = 1.6 * s;
    for (const k of [.22, .42, .62]) { const p = [lerp(a[0], d[0], k), lerp(a[1], d[1], k)], q = [lerp(b[0], c[0], k), lerp(b[1], c[1], k)];
      ctx.beginPath(); ctx.moveTo(lerp(p[0], q[0], .06), lerp(p[1], q[1], .06)); ctx.lineTo(lerp(p[0], q[0], .94), lerp(p[1], q[1], .94)); ctx.stroke(); }
    if (warm > 0) { ctx.fillStyle = `rgba(255,190,110,${.35 * warm})`; ctx.globalCompositeOperation = 'screen'; ctx.fill(all); ctx.globalCompositeOperation = 'source-over'; }
  }, lerp(2.2, 1.5, Q.m));
}

// ---------------- the passengers ----------------
const gyAt = z => pr(0, FL, z)[1];
const sAt = (z, k = 1) => FOC / z * 1.55 / 388 * k;
const nod = (t, k) => k * Math.exp(-frac(t / BEAT + .15) * 7);
// glance: after the thud they look up from their phones for a beat
const glance = t => ss(IMPACT + .05, IMPACT + .2, t) * (1 - ss(5.45, 5.75, t));
function sitPose(x, gy, s, f, lean = -.06) {   // sitting on the bench: hip at seat height, thighs forward, shins down
  const hip = [x, gy - 113 * s];
  return { s, f, gy, hip, ang: f * lean, feet: [[x + f * 92 * s, gy], [x + f * 112 * s, gy - 1 * s]], hands: [null, null], hand: ['fist', 'fist'], tilt: .38, eye: 'calm', sway: 0, lap: 108, lapY: -10, hemUp: 64 };
}
function squatPose(x, gy, s, f) {   // a street squat: hip low, knees up and out, heels down
  return { s, f, gy, hip: [x, gy - 54 * s], ang: f * .3, feet: [[x - f * 10 * s, gy], [x + f * 74 * s, gy]], hands: [null, null], hand: ['fist', 'fist'], tilt: .2, eye: 'calm', sway: 0, lap: 76, lapY: -62, hemUp: 26 };
}
function standLean(x, gy, s, f) {
  return { s, f, gy, hip: [x, gy - 176 * s], ang: -f * .08, feet: [[x - f * 6 * s, gy], [x + f * 40 * s, gy]], hands: [null, null], hand: ['fist', 'fist'], tilt: .3, eye: 'calm', sway: 0, front: 0 };
}
// a phone held in front of the face: { c: centre, a: angle, w, h } — mittens at its lower corners
function phoneAt(F, k = 1) { const fr = R.frame(F), c = fr.P(82, 112 + 10 * k); return { c, a: -F.f * .35, w: 22 * F.s, h: 36 * F.s }; }
function drawPhone(ctx, ph, t, seed) {
  ctx.save(); ctx.translate(ph.c[0], ph.c[1]); ctx.rotate(ph.a);
  const p = new Path2D(); p.roundRect(-ph.w / 2, -ph.h / 2, ph.w, ph.h, ph.w * .18);
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke(p); ctx.fillStyle = '#1a1240'; ctx.fill(p);
  const sw = ph.w * .82, shh = ph.h * .86; ctx.save(); ctx.beginPath(); ctx.rect(-sw / 2, -shh / 2, sw, shh); ctx.clip();
  ctx.fillStyle = '#dff8ff'; ctx.fillRect(-sw / 2, -shh / 2, sw, shh);
  // a feed of little square posts scrolling up (ghost-stagram)
  const cell = sw / 2.2, off = frac(t * .9 + seed * .37) * cell * 1.1, cols = ['#ff7fd8', '#7fd8ff', '#b59cff', '#ff9fcf', '#8ff0ff', '#c8b4ff'];
  for (let j = -1; j < 5; j++) for (let i = 0; i < 2; i++) { ctx.fillStyle = cols[(j + i * 3 + seed + Math.floor(t * .9 + seed * .37) * 2 + 60) % 6];
    ctx.fillRect(-sw / 2 + 1.5 + i * (cell + 1.5), -shh / 2 + j * cell * 1.1 - off + 2, cell, cell); }
  ctx.restore(); ctx.restore();
}
const phoneGrips = ph => { const c = Math.cos(ph.a), s = Math.sin(ph.a), P = (u, v) => [ph.c[0] + u * c - v * s, ph.c[1] + u * s + v * c]; return [P(-ph.w * .1, ph.h * .5), P(ph.w * .05, ph.h * .62)]; };
const GH = [
  // left bench, near: headphones, sitting, scrolling
  { kind: 'sit', z: 3.05, x: -1.22, k: 1.02, f: 1, acc: { phones: '#5ff0ff' }, seed: 1, nod: .05, sheet: '#efeaff' },
  // by the left door: a backwards cap, squatting, scrolling
  { kind: 'squat', z: 5.0, x: -1.02, k: .95, f: 1, acc: { cap: '#ff4fa8', cap2: '#3b2bb0' }, seed: 2, nod: .04, sheet: '#e8e2ff' },
  // left side, by the far door: round sunglasses, one mitten on a strap, nodding hard to the beat
  { kind: 'lean', z: 9.2, x: -.8, k: 1.0, f: 1, acc: { glasses: true }, seed: 3, nod: .12, sheet: '#ece7ff', mouth: 'grin' },
  // right bench, far: a small one curled over the phone
  { kind: 'sit', z: 12.5, x: 1.2, k: .85, f: -1, acc: {}, seed: 4, nod: .03, sheet: '#e4ddff' },
];
function ghostPose(g, t) {
  const tp = t12(t), s = sAt(g.z, g.k), [x, gy] = [pr(g.x, FL, g.z)[0], gyAt(g.z)];
  const F = g.kind === 'sit' ? sitPose(x, gy, s, g.f) : g.kind === 'squat' ? squatPose(x, gy, s, g.f) : standLean(x, gy, s, g.f);
  const gl = glance(tp), n = nod(tp, g.nod) * (1 - gl);
  F.tilt += n - .5 * gl; F.look = [lerp(4, g.f > 0 ? 10 : 12, gl) , lerp(4, -6, gl)]; F.eye = gl > .5 ? 'calm' : 'calm';
  F.mouth = gl > .5 ? 'o' : g.mouth; F.hip[1] += n * 30 * s;
  F.sheet = g.sheet; F.sheetD = COL.sheetD; F.acc = g.acc; F.shoe = { shoe: '#f6f2ff', sole: g.seed % 2 ? '#7ff4ff' : '#ff5fc0', lace: '#3a2a98' };
  const ph = phoneAt(F, gl); ph.c[1] += 30 * s * gl; F.ph = ph;   // the phone drops a little while they look up

  if (wa > 0) { ctx.save(); ctx.globalCompositeOperation = 'screen'; const g = ctx.createRadialGradient(VX, VY, 20, VX, VY, 900); g.addColorStop(0, `rgba(255,170,80,${.45 * wa})`); g.addColorStop(.5, `rgba(255,120,60,${.12 * wa})`); g.addColorStop(1, 'rgba(255,120,60,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }

  drawTube(ctx, t, tk);
  drawStraps(ctx, t, false);

  const F = meFull(t), CQ = crossQuads(t), wk = warmZ(ZME, t), lt = rimFor(-1, wk);
  const meDraw = (c, refl) => { if (!refl || t < SLIDE) drawCross(c, CQ, lt, wk); R.me(c, F, lt, null, null); };
  RX.setTransform(1, 0, 0, 1, 0, 0); RX.clearRect(0, 0, RB.width, RB.height); RX.setTransform(.5, 0, 0, .5, 0, 0); meDraw(RX, true);
  RX.globalCompositeOperation = 'destination-in'; RX.fillStyle = grad(RX, 0, GY, 0, GY - 520, [[0, 'rgba(0,0,0,1)'], [1, 'rgba(0,0,0,0)']]); RX.fillRect(0, 0, W, H); RX.globalCompositeOperation = 'source-over';

  for (let k = 0; k < 2; k++) ctx.drawImage(RB, jig * 10 * Math.sin(t * 40 + k * 2) + k * 3, 0, W, H);
  ctx.restore();
  // soft contact shadow under me
  ctx.fillStyle = 'rgba(6,2,30,.55)'; ctx.beginPath(); ctx.ellipse(F.hip[0] + 6, GY + 2, 110 * SME, 16 * SME, 0, 0, TAU); ctx.fill();
  meDraw(ctx);
  drawStraps(ctx, t, true);
  ctx.restore();
  // ---- bloom: tube, panels, windows, phones, the amber station (quarter res) ----
  GX.setTransform(1, 0, 0, 1, 0, 0); GX.clearRect(0, 0, GL.width, GL.height); GX.setTransform(GS, 0, 0, GS, GS * shx, GS * shy); cam(GX);
  drawTube(GX, t, tk);
  GX.save(); GX.globalAlpha = .55; drawWindows(GX, t); GX.restore();
  for (const { F } of gp) { GX.fillStyle = 'rgba(200,250,255,.9)'; GX.beginPath(); GX.arc(F.ph.c[0], F.ph.c[1], F.ph.w * .7, 0, TAU); GX.fill(); }
  GX.fillStyle = 'rgba(255,90,220,.7)'; GX.beginPath(); GX.arc(VX, VY, 40, 0, TAU); GX.fill();
  for (const [X, r] of [[GBX, 3], [GWX, 12]]) { X.setTransform(1, 0, 0, 1, 0, 0); X.clearRect(0, 0, GB.width, GB.height); X.filter = `blur(${r}px)`; X.drawImage(GL, 0, 0); X.filter = 'none'; }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .55; ctx.drawImage(GB, 0, 0, W, H); ctx.globalAlpha = .75; ctx.drawImage(GW, 0, 0, W, H); ctx.restore();
  bokeh(ctx, t);
  // ---- caption: bubbly retro lettering (Jua), white on a hard violet drop + pink neon glow ----
  ctx.save(); ctx.globalAlpha = .55 * Pilot.win(t, S.lines[0][0], S.lines[0][1], .35, .45); const cg = ctx.createRadialGradient(W / 2, 420, 20, W / 2, 420, 420);
  cg.addColorStop(0, 'rgba(10,4,40,.85)'); cg.addColorStop(1, 'rgba(10,4,40,0)'); ctx.fillStyle = cg; ctx.save(); ctx.translate(W / 2, 420); ctx.scale(1.25, .55); ctx.translate(-W / 2, -420); ctx.fillRect(0, 0, W, H); ctx.restore(); ctx.restore();
  Story.captions(ctx, t, S.lines, { font: FONT, size: 92, weight: 400, y: 392 + 8, color: '#4a1fc0', shadow: 'rgba(20,0,60,.8)', shadowBlur: 4 });
  Story.captions(ctx, t, S.lines, { font: FONT, size: 92, weight: 400, y: 392, color: '#fff7ff', shadow: 'rgba(255,60,200,.95)', shadowBlur: 26 });
  // ---- lo-fi grade: colour fringe, scanlines, grain, vignette ----
  CHX.setTransform(1, 0, 0, 1, 0, 0); CHX.globalCompositeOperation = 'source-over'; CHX.drawImage(ctx.canvas, 0, 0, CH.width, CH.height);
  CHX.globalCompositeOperation = 'multiply'; CHX.fillStyle = '#ff2a8a'; CHX.fillRect(0, 0, CH.width, CH.height);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .16; ctx.drawImage(CH, -5, 0, W, H); ctx.restore();
  ctx.drawImage(VIG, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .13; const gi = Math.floor(t * 12) % 3, ox = (Math.floor(t * 12) * 73) % 256, oy = (Math.floor(t * 12) * 131) % 256;
  ctx.fillStyle = ctx.createPattern(GRAIN[gi], 'repeat'); ctx.translate(-ox, -oy); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 92px 'Jua'"], init, draw });
