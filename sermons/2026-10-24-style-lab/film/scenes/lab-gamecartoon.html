<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스타일 실험 · 17 게임 광고 카툰</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
</head>
<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* 17 — mobile-game-ad cartoon. Every near shape gets a thick dark ink outline (stroked twice its width under the fill, so
   the line sits outside), a flat base colour, one hard cel shadow (the shape minus itself shifted toward the light) and a
   glossy highlight. Saturated palette, painterly-but-banded storm sky. Motion is the genre's: squash on every footfall,
   anticipation before each pop, overshoot springs, a smear + speed lines on the fall, a THUD with camera shake, dust puffs
   and a cracked ground. The cat pilot trudges under a comically giant pack; at 3.2 a golden beam breaks the storm ahead. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const FONT = "'Jua',sans-serif";
const INK = '#24152e';
const C = { fur: '#ffad2e', furS: '#e07a1c', furH: '#ffd77a', stripe: '#e0741a', cream: '#fff3dc', creamS: '#f0cfa6', pink: '#ff8fa8',
  goggle: '#9aa6bd', goggleS: '#6c7690', lens: '#5ec8ff', lensS: '#2b8fe0', band: '#2f7fe0', bandS: '#1f5cb0', scarf: '#ef3b36', scarfS: '#b8222a',
  boot: '#7a4526', bootS: '#552f1a', pack: '#23b89b', packS: '#148370', packH: '#7ff0d4', pocket: '#1d9e86', strap: '#8a5530', strapS: '#5f381e',
  roll: '#8b5cf6', rollS: '#6238c8', rollH: '#c4a8ff', buckle: '#ffd23a', pan: '#3a3a4a', panS: '#23232e', pot: '#c9d3e0', potS: '#8e9bb0',
  road: '#a98a6c', roadS: '#8a6b52', roadTop: '#d8b48a', grass: '#46c24a', grassS: '#2e9a3c', grassH: '#8be86a', hill1: '#5b8fb8', hill2: '#3f6f9e', gold: '#ffd75e' };

// ---------------- motion ----------------
const D = 330, WALK_END = B.walk[1], V0 = D / (WALK_END - .4);
const dist = t => { const t1 = WALK_END - .8; if (t <= t1) return V0 * t; const u = clamp(t - t1, 0, .8); return V0 * t1 + V0 * (u - u * u / 1.6); };
const FX = 520, FY = 1500, CS = 1.12;
const spring = (u, f = 3, z = 4) => u <= 0 ? 0 : 1 - Math.exp(-z * u) * Math.cos(TAU * f * u);   // 0→1 with overshoot
function rig(t) {   // everything the cat's body does, as a function of time
  const d = dist(t), L = 82, c = d / (2 * L), walking = 1 - ss(WALK_END - .2, WALK_END + .15, t);
  const ph = c * TAU, fall = Math.pow(Math.abs(Math.cos(ph)), 6) * walking;    // 1 on each footfall
  let sx = 1 + .05 * fall, sy = 1 - .07 * fall, bob = 12 * fall - 6 * walking * Math.abs(Math.sin(ph));
  let lean = .13 * (1 - ss(B.look - .1, B.look + .3, t)) + .02;
  // stop: sag (heavy), anticipation crouch before the look, pop up with overshoot
  const sag = ss(B.stop, B.stop + .3, t) * (1 - ss(B.look - .25, B.look, t));
  const crouch = ss(B.look - .25, B.look - .05, t) * (1 - ss(B.look - .05, B.look + .02, t));
  const pop = t > B.look - .05 ? 1 - spring(t - B.look + .05, 2.2, 5) : 1;   // 1 → 0 with ringing
  sy *= 1 - .08 * sag - .1 * crouch + .10 * (t > B.look - .05 && t < B.look + .8 ? Math.exp(-(t - B.look) * 5) * Math.cos((t - B.look) * 14) : 0);
  sx *= 1 + .05 * sag + .07 * crouch;
  bob += 14 * sag + 18 * crouch;
  // the drop: strain, then relief hop at the impact
  const strain = ss(B.drop - .5, B.drop - .1, t) * (1 - ss(B.drop - .1, B.drop, t));
  sy *= 1 - .05 * strain; sx *= 1 + .03 * strain;
  let hop = 0; if (t >= B.drop) { const u = t - B.drop; if (u < .38) { const k = u / .38; hop = -90 * 4 * k * (1 - k); sy *= 1 + .12 * Math.sin(Math.PI * k); sx *= 1 - .06 * Math.sin(Math.PI * k); }
    else { const v = u - .38; const sq = Math.exp(-v * 7) * Math.cos(v * 22); sy *= 1 - .12 * sq; sx *= 1 + .08 * sq; } }
  const breathe = ss(B.drop + .8, B.drop + 1.2, t) * Math.sin((t - B.drop) * TAU / 1.5) * .012;
  sy *= 1 + breathe;
  const head = (t < B.look ? .10 + .05 * sag : lerp(.10, -.12, 1 - pop)) ;
  return { d, c, ph, walking, sx, sy, bob, lean: lean - .04 * ss(B.drop, B.drop + .3, t), hop, head, lookK: ss(B.look - .02, B.look + .1, t), pop };
}
function camAt(t) {
  const z = 1 + .045 * ss(B.look, B.look + .9, t) * (1 - ss(5.0, 5.95, t)) - .01 * (t > B.drop && t < B.drop + .12 ? 1 : 0);
  let sx = 0, sy = 0; if (t > B.drop) { const u = t - B.drop, a = 26 * Math.exp(-u * 7); sx = a * Math.sin(u * 63); sy = a * Math.cos(u * 51) * 1.2; }
  return { z, sx, sy };
}

// ---------------- ink helpers ----------------
function inked(ctx, p, fill, ow = 9) { ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = ow * 2; ctx.stroke(p); ctx.fillStyle = fill; ctx.fill(p); }
function cel(ctx, p, col, dx, dy) {   // hard cel shadow: the shape minus itself shifted toward the light
  ctx.save(); ctx.clip(p); const q = new Path2D(); q.rect(-5000, -5000, 10000, 10000); q.addPath(p, new DOMMatrix([1, 0, 0, 1, dx, dy]));
  ctx.fillStyle = col; ctx.fill(q, 'evenodd'); ctx.restore(); }
function shine(ctx, x, y, rx, ry, rot, col = 'rgba(255,255,255,.75)') { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill(); }
const P2 = f => { const p = new Path2D(); f(p); return p; };
const ell = (x, y, rx, ry, r = 0) => P2(p => p.ellipse(x, y, rx, ry, r, 0, TAU));
const rr = (x, y, w, h, r) => P2(p => p.roundRect(x, y, w, h, r));

// ---------------- sky + world ----------------
let SKY, SKYW, CLOUDS = [], TEX;
function buildSky() {
  // two banded skies (storm / golden), painted once
  const mk = (bands) => { const c = Pilot.canvas(W, H), x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 1500); bands.forEach(([o, col]) => g.addColorStop(o, col)); x.fillStyle = g; x.fillRect(0, 0, W, H); return c; };
  SKY = mk([[0, '#2c3556'], [.35, '#46557a'], [.7, '#6f7f9f'], [1, '#9aa4b8']]);
  SKYW = mk([[0, '#3d5fa8'], [.3, '#7d8fd0'], [.6, '#ffb0a0'], [.85, '#ffd27a'], [1, '#fff0b8']]);
  const r = rng(7);
  for (let i = 0; i < 9; i++) CLOUDS.push({ x: r() * 1300 - 100, y: 160 + i * 120 + r() * 60, s: .7 + r() * .7, seed: i * 13 + 3, sp: 6 + r() * 10, side: r() < .5 ? -1 : 1 });
}
function cloudPath(s, seed) {   // a puffy cartoon cloud from overlapping circles
  const r = rng(seed), p = new Path2D(), n = 5 + Math.floor(r() * 3), w = 260 * s;
  for (let i = 0; i < n; i++) { const f = i / (n - 1), x = (f - .5) * w, rad = (60 + r() * 50) * s * (1 - Math.abs(f - .5) * .8), y = -rad * .5 - r() * 20 * s;
    p.moveTo(x + rad, y); p.arc(x, y, rad, 0, TAU); }
  p.moveTo(-w * .55, 0); p.roundRect(-w * .55, -30 * s, w * 1.1, 34 * s, 17 * s);
  return p;
}
function sky(ctx, t, warm) {
  ctx.drawImage(SKY, 0, 0);
  if (warm > 0) { ctx.save(); ctx.globalAlpha = warm; ctx.drawImage(SKYW, 0, 0); ctx.restore(); }
  // clouds: storm grey → lit with gold rims; they drift apart from the break in the clouds
  const part = ss(B.look - .1, B.look + 1.2, t);
  for (const cl of CLOUDS) {
    const x = ((cl.x + t * cl.sp) % 1400) - 160 + (cl.x > 640 ? 1 : -1) * part * 70 * (cl.y < 800 ? 1 : .4), y = cl.y;
    const p = cloudPath(cl.s, cl.seed);
    ctx.save(); ctx.translate(x, y);
    const base = Pilot.mix(Pilot.hex('#5d6a8c'), Pilot.hex('#ffe2b8'), warm * .85), shade = Pilot.mix(Pilot.hex('#3e4868'), Pilot.hex('#d98a8a'), warm * .8);
    ctx.fillStyle = Pilot.rgb(base); ctx.fill(p); cel(ctx, p, Pilot.rgb(shade), 0, -26 * cl.s);
    if (warm > .05) { ctx.save(); ctx.globalAlpha = warm; cel(ctx, p, '#fff6c8', -10, 16 * cl.s); ctx.restore(); }   // gold rim on top
    ctx.restore();
  }
}
// the golden beam breaking through ahead (screen blend wedge + rays)
function beam(ctx, t) {
  const k = ss(B.look - .05, B.look + .35, t); if (k <= 0) return;
  const ox = 930, oy = -80, shim = 1 + .05 * Math.sin(t * 7);
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  // wide soft cone
  const g = ctx.createLinearGradient(ox, oy, 760, 1500); g.addColorStop(0, `rgba(255,230,140,${.75 * k})`); g.addColorStop(1, `rgba(255,200,90,${.25 * k})`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(ox - 60, oy); ctx.lineTo(ox + 70, oy); ctx.lineTo(1180, 1540); ctx.lineTo(560 - 80 * (1 - k), 1540); ctx.fill();
  // god-ray stripes inside it, turning slowly
  for (let i = 0; i < 6; i++) { const a = .05 + i * .06 + Math.sin(t * .8 + i) * .01, wd = .018 + (i % 2) * .012;
    ctx.fillStyle = `rgba(255,248,200,${(.22 + .1 * (i % 3)) * k * shim})`; ctx.beginPath(); ctx.moveTo(ox, oy);
    ctx.lineTo(ox + Math.sin(-a - .32) * 2000, oy + Math.cos(-a - .32) * 2000); ctx.lineTo(ox + Math.sin(-a - wd - .32) * 2000, oy + Math.cos(-a - wd - .32) * 2000); ctx.fill(); }
  // pool of light on the road ahead
  const pg = ctx.createRadialGradient(860, 1520, 10, 860, 1520, 330); pg.addColorStop(0, `rgba(255,240,170,${.8 * k})`); pg.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.ellipse(860, 1520, 330, 90, 0, 0, TAU); ctx.fill();
  // a burst bloom at the moment it breaks
  const fl = Math.exp(-Math.max(0, t - B.look) * 3.2) * ss(B.look - .05, B.look + .05, t);
  if (fl > .01) { const bg = ctx.createRadialGradient(ox - 60, 150, 0, ox - 60, 150, 900); bg.addColorStop(0, `rgba(255,250,215,${.9 * fl})`); bg.addColorStop(1, 'rgba(255,240,180,0)'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  // sparkles drifting down the beam (4-point stars)
  for (let i = 0; i < 14; i++) { const r = rng(90 + i), per = 2 + r() * 2, u = ((t - B.look + r() * per) % per) / per; if (t - B.look < u * per * 0 ) continue;
    const y = lerp(100, 1450, u), x = lerp(900, lerp(620, 1120, r()), u) + Math.sin(t * 2 + i) * 20, s = (6 + r() * 10) * Math.sin(Math.PI * u) * k;
    star(ctx, x, y, s, `rgba(255,255,235,${.9 * k})`); }
}
function star(ctx, x, y, s, col) { if (s < .5) return; ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y - s * 2);
  ctx.quadraticCurveTo(x, y, x + s * 2, y); ctx.quadraticCurveTo(x, y, x, y + s * 2); ctx.quadraticCurveTo(x, y, x - s * 2, y); ctx.quadraticCurveTo(x, y, x, y - s * 2); ctx.fill(); }
// distant hills, the cliff road, grass, pebbles — periodic so the stop lines up with frame 0
function world(ctx, t, d, warm) {
  const hillC = (a, b) => Pilot.rgb(Pilot.mix(Pilot.hex(a), Pilot.hex(b), warm * .7));
  // far city skyline on the horizon
  ctx.fillStyle = hillC('#4a5a80', '#c08a9a');
  const off2 = d * .12;
  for (let i = -1; i < 12; i++) { const r = rng(300 + ((i + Math.floor(off2 / 110)) % 9 + 9) % 9), x = i * 110 - (off2 % 110), h = 90 + r() * 140;
    ctx.fillRect(x, 1240 - h, 86, h + 20); if (r() < .5) ctx.fillRect(x + 30, 1240 - h - 30, 16, 30); }
  // hills (two layers)
  for (const [k, base, amp, col, colW, n] of [[.25, 1290, 50, C.hill1, '#e7a080', 2], [.5, 1360, 40, C.hill2, '#c97a70', 3]]) {
    const p = D * k, o = d * k; ctx.fillStyle = hillC(col, colW); ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, base - amp * (.6 + .4 * Math.sin(TAU * n * (x + o) / (p * 4)) * Math.sin(TAU * (x + o) / (p * 2) + 1)));
    ctx.lineTo(W, H); ctx.fill(); }
  // grass bank + road (inked)
  const gp = P2(p => { p.moveTo(-20, 1420); for (let x = -20; x <= W + 20; x += 20) p.lineTo(x, 1420 + 10 * Math.sin(TAU * 2 * (x + d) / D)); p.lineTo(W + 20, H + 20); p.lineTo(-20, H + 20); p.closePath(); });
  inked(ctx, gp, C.grass, 6); cel(ctx, gp, C.grassS, 0, -40);
  const rp = P2(p => { p.moveTo(-20, 1478); p.lineTo(W + 20, 1478); p.lineTo(W + 20, 1640); p.lineTo(-20, 1640); p.closePath(); });
  inked(ctx, rp, C.road, 7); cel(ctx, rp, C.roadS, 0, -70);
  ctx.fillStyle = C.roadTop; ctx.fillRect(-20, 1480, W + 40, 10);
  // pebbles + tufts (period D)
  const o = ((d % D) + D) % D;
  for (let rep = -1; rep < 5; rep++) { const bx = rep * D - o;
    for (const [px, py, pr] of [[40, 1540, 10], [150, 1590, 7], [250, 1520, 6]]) { const pp = ell(bx + px, py, pr * 1.5, pr, 0); inked(ctx, pp, '#c9ad8e', 4); }
    for (const [gx, gy, gs] of [[90, 1424, 1], [230, 1430, .8]]) tuft(ctx, bx + gx, gy, gs, t); }
  // lower meadow in front of the road (darker, grass blades)
  const fp = P2(p => { p.moveTo(-20, 1660); for (let x = -20; x <= W + 20; x += 20) p.lineTo(x, 1650 + 12 * Math.sin(TAU * 3 * (x + d * 1.3) / (D * 1.3))); p.lineTo(W + 20, H + 20); p.lineTo(-20, H + 20); p.closePath(); });
  inked(ctx, fp, C.grassS, 7); cel(ctx, fp, '#23803a', 0, -50);
  const o2 = (((d * 1.3) % (D * 1.3)) + D * 1.3) % (D * 1.3);
  for (let rep = -1; rep < 5; rep++) { const bx = rep * D * 1.3 - o2; tuft(ctx, bx + 120, 1680, 1.6, t); flower(ctx, bx + 300, 1700, t); }
}
function tuft(ctx, x, y, s, t) { const sw = Math.sin(t * 2.2 + x * .01) * 4;
  const p = P2(p => { p.moveTo(x - 22 * s, y); p.quadraticCurveTo(x - 20 * s, y - 20 * s, x - 26 * s + sw, y - 40 * s); p.quadraticCurveTo(x - 8 * s, y - 24 * s, x, y - 50 * s);
    p.quadraticCurveTo(x + 6 * s + sw, y - 26 * s, x + 26 * s + sw, y - 38 * s); p.quadraticCurveTo(x + 18 * s, y - 16 * s, x + 22 * s, y); p.closePath(); });
  inked(ctx, p, C.grass, 4); cel(ctx, p, C.grassS, 6, -10); }
function flower(ctx, x, y, t) { const sw = Math.sin(t * 2 + x) * 3; ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + sw, y - 40); ctx.stroke();
  ctx.strokeStyle = C.grass; ctx.lineWidth = 4; ctx.stroke();
  for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; inked(ctx, ell(x + sw + Math.cos(a) * 11, y - 46 + Math.sin(a) * 11, 9, 9), '#ff6fa0', 3); }
  inked(ctx, ell(x + sw, y - 46, 7, 7), C.buckle, 3); }

// ---------------- the cat ----------------
function leg(ctx, x, y, lift, front) {   // stubby leg with a boot
  const p = rr(x - 24, y - 74 - lift, 48, 62, 22); inked(ctx, p, front ? C.fur : C.furS, 8); if (front) cel(ctx, p, C.furS, 10, -8);
  const b = P2(q => q.roundRect(x - 28, y - 30 - lift, 64, 32, [16, 18, 8, 8])); inked(ctx, b, front ? C.boot : C.bootS, 8); cel(ctx, b, C.bootS, 0, -10);
  if (front) shine(ctx, x + 14, y - 22 - lift, 10, 4, 0, 'rgba(255,255,255,.45)');
}
function pack(ctx, t, R, slip) {   // the giant pack, local origin = where it sits on the cat's back
  // sleeping roll on top
  const roll = rr(-330, -700, 330, 110, 55); inked(ctx, roll, C.roll); cel(ctx, roll, C.rollS, 0, -26);
  ctx.save(); ctx.clip(roll); ctx.strokeStyle = C.rollS; ctx.lineWidth = 10; for (const x of [-250, -90]) { ctx.beginPath(); ctx.moveTo(x, -700); ctx.lineTo(x, -590); ctx.stroke(); } ctx.restore();
  shine(ctx, -200, -676, 90, 12, 0, 'rgba(255,255,255,.4)');
  inked(ctx, ell(-330, -645, 26, 54), C.rollH, 6); ctx.strokeStyle = C.rollS; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(-330, -645, 14, 0, TAU * .8); ctx.stroke();
  // kettle hanging off the left
  const sw = Math.sin(R.ph - .6) * .12 * R.walking + Math.sin(t * 2.4) * .03;
  ctx.save(); ctx.translate(-330, -430); ctx.rotate(sw);
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 40); ctx.stroke();
  const ket = P2(q => { q.moveTo(-46, 110); q.quadraticCurveTo(-52, 40, 0, 40); q.quadraticCurveTo(52, 40, 46, 110); q.closePath(); });
  inked(ctx, ket, C.pot, 7); cel(ctx, ket, C.potS, 12, -10); shine(ctx, 16, 64, 7, 18, -.4);
  ctx.restore();
  // main body of the pack
  const body = rr(-310, -600, 290, 520, 70); inked(ctx, body, C.pack); cel(ctx, body, C.packS, 34, -30);
  shine(ctx, -110, -560, 70, 14, -.1, 'rgba(255,255,255,.45)'); shine(ctx, -40, -470, 8, 40, 0, 'rgba(255,255,255,.35)');
  // top flap + buckles
  const flap = P2(q => { q.moveTo(-300, -560); q.lineTo(-30, -560); q.lineTo(-40, -440); q.quadraticCurveTo(-165, -400, -290, -440); q.closePath(); });
  inked(ctx, flap, C.pocket, 7); cel(ctx, flap, C.packS, 20, -14);
  for (const bx of [-230, -110]) { const st = rr(bx - 12, -470, 24, 110, 6); inked(ctx, st, C.strap, 5); inked(ctx, rr(bx - 18, -400, 36, 26, 6), C.buckle, 5); }
  // front pocket
  const pk = rr(-280, -300, 220, 170, 40); inked(ctx, pk, C.pocket, 7); cel(ctx, pk, C.packS, 20, -16);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 5; ctx.setLineDash([14, 12]); ctx.beginPath(); ctx.roundRect(-262, -282, 184, 134, 28); ctx.stroke(); ctx.setLineDash([]);
  // frying pan strapped on the side
  ctx.save(); ctx.translate(-30, -200); ctx.rotate(-.5 + sw * .5);
  const hp = rr(-8, -150, 16, 120, 8); inked(ctx, hp, C.boot, 5); const pan = ell(0, 0, 58, 58); inked(ctx, pan, C.pan, 7); cel(ctx, pan, C.panS, 12, -12); shine(ctx, -18, -20, 18, 8, -.6, 'rgba(255,255,255,.35)');
  ctx.restore();
  // a patch + sweat-stain tag
  inked(ctx, rr(-250, -190, 60, 50, 10), '#ff7ab0', 5);
}
function cat(ctx, t, R) {
  const look = R.lookK, sparkle = look;
  // tail (behind everything of the cat)
  const tw = Math.sin(t * 3) * 14 + Math.sin(R.ph) * 8 * R.walking;
  const tail = new Path2D(); tail.moveTo(-60, -100); tail.bezierCurveTo(-150, -110, -170 + tw, -40, -200 + tw, -150);
  ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 50; ctx.stroke(tail); ctx.strokeStyle = C.fur; ctx.lineWidth = 32; ctx.stroke(tail);
  ctx.strokeStyle = C.stripe; ctx.lineWidth = 32; ctx.setLineDash([16, 22]); ctx.stroke(tail); ctx.setLineDash([]);
  // legs: alternate with lift (back leg first)
  const L1 = Math.sin(R.ph) * R.walking, L2 = -L1;
  const lift = v => Math.max(0, v) * 34;
  leg(ctx, -38 + 38 * L2, 0, lift(L2) * (1 - Math.abs(R.hop) / 200), false);
  // body
  const bodyP = P2(q => { q.moveTo(-90, -100); q.bezierCurveTo(-110, -230, 60, -290, 100, -170); q.bezierCurveTo(120, -100, 80, -40, 10, -40); q.bezierCurveTo(-60, -40, -86, -60, -90, -100); q.closePath(); });
  inked(ctx, bodyP, C.fur); cel(ctx, bodyP, C.furS, 26, -22);
  ctx.save(); ctx.clip(bodyP); inked(ctx, ell(48, -120, 52, 70, -.2), C.cream, 0); cel(ctx, ell(48, -120, 52, 70, -.2), C.creamS, 14, -12); ctx.restore();
  ctx.save(); ctx.clip(bodyP); ctx.strokeStyle = C.stripe; ctx.lineWidth = 14; ctx.lineCap = 'round';
  for (const [x, y] of [[-70, -160], [-60, -120], [-40, -205]]) { ctx.beginPath(); ctx.moveTo(x - 20, y); ctx.lineTo(x + 18, y + 6); ctx.stroke(); } ctx.restore();
  ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.stroke(bodyP);
  leg(ctx, 34 + 38 * L1, 0, lift(L1) * (1 - Math.abs(R.hop) / 200), true);
}
function head(ctx, t, R) {
  const look = R.lookK;
  // ears
  const earL = P2(q => { q.moveTo(-110, -60); q.quadraticCurveTo(-130, -170, -80, -190); q.quadraticCurveTo(-30, -150, -20, -100); q.closePath(); });
  const earR = P2(q => { q.moveTo(40, -110); q.quadraticCurveTo(70, -200, 120, -190); q.quadraticCurveTo(140, -130, 120, -60); q.closePath(); });
  for (const e of [earL, earR]) { inked(ctx, e, C.fur); cel(ctx, e, C.furS, 14, -10); }
  inked(ctx, P2(q => { q.moveTo(-96, -90); q.quadraticCurveTo(-104, -150, -80, -166); q.quadraticCurveTo(-52, -140, -46, -110); q.closePath(); }), C.pink, 0);
  inked(ctx, P2(q => { q.moveTo(62, -116); q.quadraticCurveTo(82, -170, 108, -168); q.quadraticCurveTo(118, -130, 108, -90); q.closePath(); }), C.pink, 0);
  // head: big squashy round
  const hp = P2(q => { q.ellipse(10, -20, 140, 118, 0, 0, TAU); });
  inked(ctx, hp, C.fur); cel(ctx, hp, C.furS, 30, -26); shine(ctx, -40, -118, 46, 14, -.25, 'rgba(255,255,255,.5)');
  // forehead stripes, muzzle
  ctx.save(); ctx.clip(hp); ctx.fillStyle = C.stripe;
  for (const [x, w] of [[-30, 16], [0, 14], [28, 12]]) { ctx.beginPath(); ctx.moveTo(x - w / 2, -140); ctx.lineTo(x + w / 2, -140); ctx.lineTo(x + 2, -96); ctx.fill(); }
  const mz = ell(62, 34, 92, 62, -.1); ctx.fillStyle = C.cream; ctx.fill(mz); cel(ctx, mz, C.creamS, 16, -16);
  ctx.restore(); ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.stroke(hp);
  // goggles band across the forehead
  ctx.save(); ctx.clip(hp); const band = P2(q => { q.moveTo(-140, -60); q.quadraticCurveTo(10, -130, 160, -80); q.lineTo(160, -52); q.quadraticCurveTo(10, -100, -140, -30); q.closePath(); });
  inked(ctx, band, C.band, 4); cel(ctx, band, C.bandS, 0, -8); ctx.restore();
  for (const [gx, gy] of [[8, -88], [86, -74]]) { const fr = ell(gx, gy, 38, 34); inked(ctx, fr, C.goggle, 8); cel(ctx, fr, C.goggleS, 8, -8);
    const ln = ell(gx, gy, 24, 21); inked(ctx, ln, C.lens, 4); cel(ctx, ln, C.lensS, 6, -8); shine(ctx, gx - 8, gy - 8, 7, 5, -.5, 'rgba(255,255,255,.9)'); }
  // eyes: tired flat arcs while trudging; big sparkly eyes once it looks up
  const blink = (t > 5.1 && t < 5.22) ? 1 : 0;
  for (const [ex, ey] of [[30, 6], [104, 12]]) {
    if (look < .5 || blink) { ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(ex - 18, ey + 2); ctx.quadraticCurveTo(ex, ey + 12, ex + 18, ey + 2); ctx.stroke();
      if (!blink) { ctx.beginPath(); ctx.moveTo(ex - 16, ey - 12); ctx.lineTo(ex + 14, ey - 18 + (ex > 60 ? 4 : 0)); ctx.lineWidth = 6; ctx.stroke(); } }   // heavy lid line
    else { const s = 1 + .25 * (1 - R.pop); inked(ctx, ell(ex, ey, 17 * s, 23 * s), '#1d1226', 0);
      shine(ctx, ex - 5 * s, ey - 9 * s, 7 * s, 8 * s, 0, '#ffffff'); shine(ctx, ex + 6 * s, ey + 8 * s, 3.5 * s, 3.5 * s, 0, '#ffffff');
      star(ctx, ex + 8 * s, ey - 12 * s, 3 * s, '#ffffff'); }
  }
  // cheeks, nose, mouth (ω), whiskers
  shine(ctx, 0, 46, 22, 12, 0, 'rgba(255,120,150,.55)'); shine(ctx, 136, 50, 18, 11, 0, 'rgba(255,120,150,.55)');
  inked(ctx, P2(q => { q.moveTo(70, 30); q.lineTo(90, 30); q.lineTo(80, 42); q.closePath(); }), C.pink, 3);
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(60, 50); ctx.quadraticCurveTo(68, 62, 80, 50); ctx.quadraticCurveTo(92, 62, 100, 50); ctx.stroke();
  if (look > .5) { inked(ctx, P2(q => { q.moveTo(68, 58); q.quadraticCurveTo(80, 90 * (1 - R.pop * .5) + 20, 92, 58); q.closePath(); }), '#c8304a', 4); }   // open mouth "oh!"
  ctx.lineWidth = 4; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(150, 38 + s * 8); ctx.lineTo(186, 30 + s * 16); ctx.stroke(); }
  // sweat drop while trudging
  if (look < .5) { const u = (t % 1.1) / 1.1, y = -60 + u * 50; ctx.globalAlpha = 1 - u; inked(ctx, P2(q => { q.moveTo(-120, y - 26); q.quadraticCurveTo(-100, y, -110, y + 8); q.quadraticCurveTo(-130, y + 4, -120, y - 26); }), '#8fe0ff', 3); ctx.globalAlpha = 1; }
}
function scarf(ctx, t, R) {
  const fl = t * 9, wind = 1 + R.walking * .4;
  const p = P2(q => { q.moveTo(-60, -250); for (let i = 0; i <= 6; i++) { const f = i / 6; q.lineTo(-60 - f * 150 * wind, -250 + f * 30 + Math.sin(fl + f * 5) * 14 * f); }
    for (let i = 6; i >= 0; i--) { const f = i / 6; q.lineTo(-60 - f * 140 * wind, -214 + f * 40 + Math.sin(fl + f * 5 + .6) * 14 * f); } q.closePath(); });
  inked(ctx, p, C.scarf, 7); cel(ctx, p, C.scarfS, 0, -12);
  const band = rr(-70, -262, 170, 50, 25); inked(ctx, band, C.scarf, 8); cel(ctx, band, C.scarfS, 10, -14); shine(ctx, 30, -248, 30, 6, 0, 'rgba(255,255,255,.5)');
}
function arm(ctx, t, R, onStrap) {   // front arm gripping the strap (or relaxed / raised after the drop)
  const up = ss(B.drop + .05, B.drop + .3, t) * (1 - ss(B.drop + .9, B.drop + 1.4, t));
  const hx = onStrap ? 70 : lerp(96, 140, up), hy = onStrap ? -200 : lerp(-120, -300, up);
  const a = new Path2D(); a.moveTo(40, -210); a.quadraticCurveTo(lerp(90, 100, up), lerp(-180, -240, up), hx, hy);
  ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 56; ctx.stroke(a); ctx.strokeStyle = C.fur; ctx.lineWidth = 38; ctx.stroke(a);
  inked(ctx, ell(hx, hy, 26, 24), C.cream, 7); cel(ctx, ell(hx, hy, 26, 24), C.creamS, 6, -6);
}

// ---------------- effects ----------------
function dustPuff(ctx, x, y, s, a) {   // a cel-shaded cartoon dust cloud
  if (a <= 0 || s <= 0) return; ctx.save(); ctx.globalAlpha = a;
  const p = P2(q => { for (const [dx, dy, r] of [[0, 0, 40], [-38, 10, 30], [36, 8, 32], [-14, -26, 28], [20, -22, 26]]) { q.moveTo(x + dx * s + r * s, y + dy * s); q.arc(x + dx * s, y + dy * s, r * s, 0, TAU); } });
  inked(ctx, p, '#efe2cf', 5); cel(ctx, p, '#cdb89c', 10, -14); ctx.restore();
}
function speedRing(ctx, cx, cy, a, seed, r0 = 420) {   // anime emphasis lines from the edges toward a point
  if (a <= .01) return; const r = rng(seed); ctx.save(); ctx.fillStyle = `rgba(255,255,255,${.85 * a})`;
  for (let i = 0; i < 46; i++) { const ang = r() * TAU, w = .006 + r() * .012, rin = r0 + r() * 260;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * rin, cy + Math.sin(ang) * rin); ctx.lineTo(cx + Math.cos(ang - w) * 2200, cy + Math.sin(ang - w) * 2200); ctx.lineTo(cx + Math.cos(ang + w) * 2200, cy + Math.sin(ang + w) * 2200); ctx.fill(); }
  ctx.restore();
}

// ---------------- frame ----------------
function draw(ctx, t) {
  const R = rig(t), cm = camAt(t), warm = ss(B.look - .05, B.look + 1.0, t);
  ctx.save();
  ctx.translate(540 + cm.sx, 1100 + cm.sy); ctx.scale(cm.z, cm.z); ctx.translate(-540, -1100);
  sky(ctx, t, warm);
  world(ctx, t, R.d, warm);
  beam(ctx, t);
  // the pack once it's down (in the world, behind the cat), with its fall smear
  const slipK = ss(B.drop - .4, B.drop, t);
  const packOn = t < B.drop;
  // ground crack + shadow under the cat
  ctx.fillStyle = 'rgba(40,20,40,.28)'; ctx.beginPath(); ctx.ellipse(FX + 20, FY + 4, 150 * (1 - Math.min(.5, Math.abs(R.hop) / 200)), 22, 0, 0, TAU); ctx.fill();
  if (t >= B.drop) {   // cracks in the road where the pack landed
    const k = eo(clamp((t - B.drop) / .12)); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (const [a, l] of [[-.2, 120], [.1, 90], [3.0, 110], [3.4, 80], [2.7, 60]]) { ctx.beginPath(); ctx.moveTo(FX - 190, FY + 8); ctx.lineTo(FX - 190 + Math.cos(a) * l * k, FY + 8 + Math.abs(Math.sin(a)) * 30 * k + 4); ctx.lineTo(FX - 190 + Math.cos(a) * l * k * 1.3, FY + 14 + Math.abs(Math.sin(a)) * 40 * k); ctx.stroke(); }
    ctx.fillStyle = 'rgba(40,20,40,.3)'; ctx.beginPath(); ctx.ellipse(FX - 190, FY + 6, 200, 26, 0, 0, TAU); ctx.fill();
  }
  if (!packOn) {
    const u = t - B.drop, sq = Math.exp(-u * 8) * Math.cos(u * 30);
    ctx.save(); ctx.translate(FX - 190 + 165 * CS * .8, FY); ctx.scale(CS * (1 + .18 * sq), CS * (1 - .22 * sq)); ctx.rotate(-.06); ctx.translate(0, 80 * 1);
    pack(ctx, t, { ph: 0, walking: 0 }, 1); ctx.restore();
  }
  // the cat (and the pack while it's still on its back)
  ctx.save(); ctx.translate(FX, FY + R.bob + R.hop); ctx.scale(CS * R.sx, CS * R.sy); ctx.rotate(R.lean);
  if (packOn) {
    const lagY = Math.sin(R.ph * 2 - 1.2) * 10 * R.walking, fallY = slipK * slipK * 160, fallX = -slipK * 60;
    ctx.save(); ctx.translate(-30 + fallX, -110 + lagY + fallY); ctx.rotate(-.05 * slipK - .03 * Math.sin(R.ph * 2) * R.walking);
    if (slipK > .55) { ctx.save(); ctx.globalAlpha = .35; ctx.translate(0, -70 * (slipK - .55) * 2); pack(ctx, t, R, slipK); ctx.restore(); }   // smear ghost
    pack(ctx, t, R, slipK); ctx.restore();
  }
  scarf(ctx, t, R);
  cat(ctx, t, R);
  // straps over the shoulder while it carries the load
  if (packOn) { const st = new Path2D(); st.moveTo(-60, -250 + slipK * 80); st.quadraticCurveTo(20, -280 + slipK * 60, 60 - slipK * 70, -190 + slipK * 40);
    ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 40; ctx.stroke(st); ctx.strokeStyle = C.strap; ctx.lineWidth = 24; ctx.stroke(st); }
  ctx.save(); ctx.translate(20, -300); ctx.rotate(R.head); head(ctx, t, R); ctx.restore();
  arm(ctx, t, R, packOn && slipK < .6);
  ctx.restore();
  // impact: dust puffs both ways, star burst
  if (t >= B.drop) { const u = t - B.drop;
    for (const [dx, dir, s0] of [[-80, -1, 1.3], [80, 1, 1.1], [-200, -1, .9], [190, 1, .8], [0, 0, 1.5]]) {
      const k = eo(clamp(u / .45)), a = 1 - ss(.5, 1.2, u);
      dustPuff(ctx, FX - 190 + dx + dir * 160 * k, FY + 10 - 30 * k - (dir === 0 ? 40 * k : 0), s0 * (.4 + .9 * k), a); }
    if (u < .25) { ctx.save(); ctx.globalAlpha = 1 - u / .25; ctx.fillStyle = '#fff7c8'; star(ctx, FX - 190, FY - 120, 60 * (1 + u * 4), '#fff7c8'); ctx.restore(); }
  }
  ctx.restore();
  // emphasis lines (screen space): the reveal and the thud
  speedRing(ctx, 760, 900, (ss(B.look - .02, B.look + .05, t) * (1 - ss(B.look + .1, B.look + .45, t))) * .9, 11, 520);
  speedRing(ctx, FX - 120, FY - 100, (t >= B.drop ? 1 - ss(B.drop + .05, B.drop + .35, t) : 0) * .8, 12, 380);
  // warm grade + vignette
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = .35 * warm; ctx.fillStyle = '#ffb040'; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.drawImage(TEX.vig, 0, 0);
  caption(ctx, t);
}
function caption(ctx, t) {   // chunky game-title caption: drop shadow, thick ink ring, cream fill, pop-in
  const a = S.lines[0][0], pop = t < a ? 0 : 1 + .25 * Math.exp(-(t - a) * 8) * Math.sin((t - a) * 22) * (t - a < .6 ? 1 : 0);
  ctx.save(); if (pop !== 1 && pop > 0) { ctx.translate(540, 440); ctx.scale(pop, pop); ctx.translate(-540, -440); }
  const o = { font: FONT, weight: 400, size: 84, y: 400, shadow: 'rgba(0,0,0,0)', shadowBlur: 1, fadeIn: .12 };
  ctx.save(); ctx.translate(0, 12); Story.captions(ctx, t, S.lines, { ...o, color: 'rgba(36,21,46,.55)' }); ctx.restore();
  for (let i = 0; i < 16; i++) { const an = i / 16 * TAU; ctx.save(); ctx.translate(Math.cos(an) * 8, Math.sin(an) * 8); Story.captions(ctx, t, S.lines, { ...o, color: INK }); ctx.restore(); }
  Story.captions(ctx, t, S.lines, { ...o, color: '#fff6dc' });
  ctx.restore();
}
async function init() {
  buildSky();
  const v = Pilot.canvas(W, H), x = v.getContext('2d'), g = x.createRadialGradient(540, 1000, 500, 540, 1000, 1250);
  g.addColorStop(0, 'rgba(20,10,30,0)'); g.addColorStop(1, 'rgba(20,10,30,.45)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  TEX = { vig: v };
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 84px 'Jua'"], init, draw });
</script>
