<!doctype html>

<meta charset="utf-8">

<title>스타일 실험 · 펜 낙서 · 비 오는 새</title>

<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* ---- hand-drawn toolkit (shared by the lab-* hand-drawn scenes; inlined at build time) ----
   Lines are variable-width ribbons built from densely sampled polylines: a static hand wobble per stroke (seeded),
   a boil displacement per drawing (3 drawings cycled on 8–12 fps), pressure along the length, tapered ends, ragged
   edges. Ink is laid on a white layer that is multiplied onto a paper whose tooth is a real height field, so ink drops
   out in the valleys and pencil only catches the peaks. */
const TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
const HD = {};
HD.hash = (i, s = 0) => { let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
HD.t12 = t => Math.floor(t * 12 + 1e-6) / 12;
HD.spline = (P, step = 3, closed = false) => {
  const n = P.length; if (n < 2) return P.map(p => p.slice());
  const get = i => closed ? P[((i % n) + n) % n] : P[clamp(i, 0, n - 1)];
  const out = [], segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), m = Math.max(1, Math.ceil(L / step));
    for (let j = 0; j < m; j++) { const t = j / m, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3))); }
  }
  out.push(closed ? out[0].slice() : P[n - 1].slice()); return out;
};
HD.seg = (a, b, step = 4) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]), m = Math.max(1, Math.ceil(L / step)), o = [];
  for (let i = 0; i <= m; i++) o.push([lerp(a[0], b[0], i / m), lerp(a[1], b[1], i / m)]); return o; };
HD.poly = (P, closed = false, step = 4) => { const o = []; const n = P.length, m = closed ? n : n - 1; for (let i = 0; i < m; i++) { const sg = HD.seg(P[i], P[(i + 1) % n], step); if (i) sg.shift(); o.push(...sg); } return o; };
HD.arc = (cx, cy, rx, ry, a0, a1, step = 4, rot = 0) => { const L = Math.abs(a1 - a0) * Math.max(rx, ry), m = Math.max(2, Math.ceil(L / step)), o = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i <= m; i++) { const a = lerp(a0, a1, i / m), x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push([cx + x * c - y * s, cy + x * s + y * c]); } return o; };
HD.normals = pts => pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
HD.lengths = pts => { const s = [0]; for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return s; };
// hand wobble: perpendicular low-frequency displacement
HD.wob = (pts, seed, amp, wl = 120) => { if (!amp || pts.length < 2) return pts; const N = HD.normals(pts), Sx = HD.lengths(pts), oy = (seed * 17.37) % 997;
  return pts.map((p, i) => { const d = (noise(Sx[i] / wl, oy) - .5) * 2 * amp; return [p[0] + N[i][0] * d, p[1] + N[i][1] * d]; }); };
// one boiled drawing: a new wobble + a tiny drift, per drawing index f
HD.boil = (pts, seed, f, amp, wl = 90) => { if (!amp) return pts; const s = (seed * 31 + f * 977) | 0, dx = (HD.hash(s, 1) - .5) * amp, dy = (HD.hash(s, 2) - .5) * amp;
  return HD.wob(pts, s, amp, wl).map(p => [p[0] + dx, p[1] + dy]); };
HD.xf = (pts, m) => pts.map(p => [m.a * p[0] + m.c * p[1] + m.e, m.b * p[0] + m.d * p[1] + m.f]);   // apply a DOMMatrix-like
HD.mat = (x, y, rot = 0, sx = 1, sy = sx) => { const c = Math.cos(rot), s = Math.sin(rot); return { a: c * sx, b: s * sx, c: -s * sy, d: c * sy, e: x, f: y }; };
HD.mul = (A, Bm) => ({ a: A.a * Bm.a + A.c * Bm.b, b: A.b * Bm.a + A.d * Bm.b, c: A.a * Bm.c + A.c * Bm.d, d: A.b * Bm.c + A.d * Bm.d, e: A.a * Bm.e + A.c * Bm.f + A.e, f: A.b * Bm.e + A.d * Bm.f + A.f });
HD.pt = (m, x, y) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
// variable-width ribbon (round caps where the end is wide)
HD.ribbon = (pts, wf) => {
  const n = pts.length, N = HD.normals(pts), Sx = HD.lengths(pts), L = Sx[n - 1] || 1, Lf = [], Rt = [], ws = [];
  for (let i = 0; i < n; i++) { const w = Math.max(0, wf(Sx[i] / L, Sx[i], i, L)) / 2; ws.push(w); Lf.push([pts[i][0] + N[i][0] * w, pts[i][1] + N[i][1] * w]); Rt.push([pts[i][0] - N[i][0] * w, pts[i][1] - N[i][1] * w]); }
  const p = new Path2D(); p.moveTo(Lf[0][0], Lf[0][1]); for (let i = 1; i < n; i++) p.lineTo(Lf[i][0], Lf[i][1]);
  const ae = Math.atan2(N[n - 1][1], N[n - 1][0]); if (ws[n - 1] > .4) p.arc(pts[n - 1][0], pts[n - 1][1], ws[n - 1], ae, ae + Math.PI, true); else p.lineTo(Rt[n - 1][0], Rt[n - 1][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(Rt[i][0], Rt[i][1]);
  const a0 = Math.atan2(N[0][1], N[0][0]); if (ws[0] > .4) p.arc(pts[0][0], pts[0][1], ws[0], a0 + Math.PI, a0, true);
  p.closePath(); return p;
};
// an ink line: o = { w, ts, te (taper lengths px), mn (tip width fraction), press, pw (pressure wavelength), rough, seed, col, dry }
HD.ink = (ctx, pts, o = {}) => {
  if (!pts || pts.length < 2) return;
  const w = o.w ?? 8, ts = o.ts ?? w * 2.5, te = o.te ?? w * 3.5, mn = o.mn ?? .2, press = o.press ?? .3, pw = o.pw ?? 70, rough = o.rough ?? .08, seed = o.seed ?? 1, mnE = o.mnE ?? mn;
  const wf = (u, s, i, L) => { const k = Math.min(1, mn + (1 - mn) * ss(0, ts, s)) * Math.min(1, mnE + (1 - mnE) * ss(0, te, L - s));
    return w * k * (1 + press * (noise(s / pw, seed * 3.7 % 500) - .5) * 2) * (1 + rough * (HD.hash(i, seed) - .5) * 2); };
  ctx.fillStyle = o.col || '#151312'; ctx.fill(HD.ribbon(pts, wf));
  if (o.blob) { ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], w * o.blob, 0, TAU); ctx.fill(); }   // a marker resting a moment at the start
  if (o.dry) {   // dry-brush streaks in the tail: thin paper-white lines along the stroke
    const N = HD.normals(pts), Sx = HD.lengths(pts), L = Sx[Sx.length - 1], r = rng(seed * 7 + 3);
    ctx.save(); ctx.strokeStyle = o.paper || '#fff'; ctx.lineCap = 'round';
    for (let k = 0; k < (o.dryN || 4); k++) { const f = (r() - .5) * .7, u0 = 1 - o.dry * (.3 + .7 * r()); ctx.lineWidth = (o.dryW || 1) * (.5 + r() * .7); ctx.globalAlpha = .55 + r() * .45; ctx.beginPath(); let st = false;
      for (let i = 0; i < pts.length; i++) { const u = Sx[i] / L; if (u < u0) continue; const ww = wf(u, Sx[i], i, L) * f; const x = pts[i][0] + N[i][0] * ww, y = pts[i][1] + N[i][1] * ww; if (!st) { ctx.moveTo(x, y); st = true; } else ctx.lineTo(x, y); }
      ctx.stroke(); }
    ctx.restore();
  }
};
// a closed hand shape: fill (paper white or colour) — the outline is drawn separately with HD.ink
HD.fillPts = (ctx, pts, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); };
HD.pathOf = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (const q of pts) p.lineTo(q[0], q[1]); p.closePath(); return p; };

// ---- paper: a tooth height field (full frame) → paper colour, ink dropout (white specks), pencil deposit masks ----
HD.tooth = (seed = 1, s1 = 6, s2 = 2.2, fib = 0) => {
  const T = new Float32Array(W * H), r = rng(seed), ox = r() * 500, oy = r() * 500;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = .62 * noise(x / s1 + ox, y / s1 + oy) + .38 * noise(x / s2 + oy, y / s2 + ox);
    T[y * W + x] = v; }
  if (fib) { // fibres: thin streaks raised a little
    for (let k = 0; k < fib; k++) { let x = r() * W, y = r() * H, a = r() * TAU; const l = 8 + r() * 30;
      for (let i = 0; i < l; i++) { a += (r() - .5) * .3; x += Math.cos(a); y += Math.sin(a); const xi = x | 0, yi = y | 0; if (xi >= 0 && yi >= 0 && xi < W && yi < H) T[yi * W + xi] = Math.min(1, T[yi * W + xi] + .18); } } }
  return T;
};
// paper canvas: base colour, low-frequency mottling, embossed tooth (light from top-left), fine grain, edge falloff
HD.paper = (T, o = {}) => {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), d = g.createImageData(W, H), D = d.data, base = o.base || [250, 249, 245];
  const mot = o.mott ?? 6, emb = o.emb ?? 26, gr = o.grain ?? 4, vig = o.vig ?? 0, r = rng(o.seed || 9), mscale = o.mscale || 260;
  const tint = o.tint || [0, 0, 0];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, x0 = Math.max(0, x - 1), y0 = Math.max(0, y - 1), x1 = Math.min(W - 1, x + 1), y1 = Math.min(H - 1, y + 1);
    const sh = (T[y0 * W + x0] - T[y1 * W + x1]) * emb, m = (noise(x / mscale + 40, y / mscale + 7) - .5) * 2 * mot;
    const dx = (x / W - .5), dy = (y / H - .5), v = -vig * (dx * dx * 1.4 + dy * dy) * 4;
    const n = (r() - .5) * gr, k = sh + m + n + v;
    D[i * 4] = base[0] + k + tint[0] * m / (mot || 1); D[i * 4 + 1] = base[1] + k + tint[1] * m / (mot || 1); D[i * 4 + 2] = base[2] + k + tint[2] * m / (mot || 1); D[i * 4 + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
};
// a full-frame canvas of colour `col` whose alpha follows the tooth: mode 'peak' (pencil catches the peaks) or 'valley' (ink misses the valleys)
HD.toothMask = (T, col, mode = 'valley', thr = .35, soft = .18, amax = 1) => {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), d = g.createImageData(W, H), D = d.data, rgb = Pilot.hex(col);
  for (let i = 0; i < W * H; i++) { const v = mode === 'peak' ? (T[i] - thr) / soft : (thr - T[i]) / soft, a = clamp(v) * amax;
    D[i * 4] = rgb[0]; D[i * 4 + 1] = rgb[1]; D[i * 4 + 2] = rgb[2]; D[i * 4 + 3] = a * 255; }
  g.putImageData(d, 0, 0); return c;
};
// layers: a white canvas you draw ink on, then multiply onto the frame
HD.layer = () => { const c = Pilot.canvas(W, H), g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round'; return { c, g }; };
HD.clearWhite = (g, x = 0, y = 0, w = W, h = H) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.fillStyle = '#fff'; g.fillRect(x, y, w, h); g.restore(); };
HD.dropout = (g, mask, a = 1, x = 0, y = 0, w = W, h = H) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = a; g.drawImage(mask, x, y, w, h, x, y, w, h); g.restore(); };
HD.multiply = (ctx, c, x = 0, y = 0, w = W, h = H, a = 1) => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = a; ctx.drawImage(c, x, y, w, h, x, y, w, h); ctx.restore(); };

// walk: distance along x with a slowing stop (speed 1 → 0 over the last `dec` fraction), from a lookup table
HD.walker = (x0, x1, T, dec = .3) => { const n = 400, tab = [0]; let s = 0; for (let i = 1; i <= n; i++) { const u = i / n; s += 1 - ss(1 - dec, 1, u); tab.push(s); }
  return t => { if (t <= 0) return x0 + (t / T) * n * (x1 - x0) / tab[n]; if (t >= T) return x1; const f = t / T * n, i = Math.floor(f), k = f - i; return x0 + (x1 - x0) * lerp(tab[i], tab[Math.min(n, i + 1)], k) / tab[n]; }; };

/* lab-pendoodle — black ballpoint doodle on off-white paper (ref 14).
   Thin semi-opaque pen lines (overlaps darken like real ballpoint), a scribble-filled little round bird, rain strokes
   falling on twos, puddle scribbles that ripple, broken hatched reflections, hand-lettered words. The one accent: a
   yellow highlighter where the street lamp comes on. The bird plods in under a big bundle, stops under the lamp, looks
   up as it lights, the bundle slips off into the puddle (splash), then it just stands there in the lit rain. */
const INK = 'rgba(34,31,40,.9)', INKS = '#221f28';
const GY = 1410, X0 = 250, X1 = 560, A = 15, POSTX = 700;
const walkX = HD.walker(X0, X1, B.stop, .3);
const bf = t => Math.floor(t * 8 + 1e-6) % 3;
const TX = {};
let PENK = 1;
const WZ = 1.45, WM = [WZ, 0, 0, WZ, 540 - 540 * WZ, 1330 - 1330 * WZ];   // post, bird and light are drawn 1.45x about (540, 1330); rain and puddle marks in screen space
function pen(g, pts, seed, f, o = {}) { HD.ink(g, HD.boil(HD.wob(pts, seed, o.wob ?? 1.5, 90), seed, f, o.boil ?? 1.3, 60), { ts: 5, te: 9, mn: .45, press: .22, pw: 50, rough: .1, seed, col: INK, ...o, w: (o.w ?? 3.8) * PENK }); }

// ---------------- ground scribbles (puddle marks), each with 3 ripple drawings ----------------
const MARKS = [];
function buildMarks() {
  const r = rng(77);
  for (let i = 0; i < 150; i++) {
    const y = 1150 + Math.pow(r(), .8) * 390, depth = (y - 1150) / 390, x = 30 + r() * 1020;
    if (Math.abs(x - (540 + (POSTX - 540) * WZ)) < 70 && y > 1400) continue;
    const s = .55 + .7 * depth, ty = r();
    MARKS.push({ x, y, s, type: ty < .36 ? 'paren' : ty < .62 ? 'dash' : ty < .8 ? 'wave' : ty < .9 ? 'cup' : 'tick', seed: 1000 + i, ph: Math.floor(r() * 3), len: 10 + r() * 22 });
  }
}
function drawMark(g, m, k, f) {   // k: ripple drawing 0..2
  const { x, y, s } = m, sd = m.seed;
  if (m.type === 'paren') { const rr = (7 + 4 * k) * s;
    pen(g, HD.arc(x - rr * .9, y, rr * .7, rr * .45, Math.PI * .6, Math.PI * 1.4, 2), sd, f, { w: 3.2 });
    pen(g, HD.arc(x + rr * .9, y, rr * .7, rr * .45, -Math.PI * .4, Math.PI * .4, 2), sd + 1, f, { w: 3.2 });
    if (k > 0) pen(g, HD.seg([x - rr * .25, y + rr * .1], [x + rr * .3, y + rr * .1], 2), sd + 2, f, { w: 3 }); }
  else if (m.type === 'dash') { const l = m.len * s * (1 + .15 * k); pen(g, HD.seg([x - l / 2, y], [x + l / 2, y + 1], 3), sd, f, { w: 3.2 }); if (k === 2) pen(g, HD.seg([x + l / 2 + 8, y], [x + l / 2 + 14, y], 2), sd + 1, f, { w: 3 }); }
  else if (m.type === 'wave') { const l = (16 + 3 * k) * s, pts = []; for (let i = 0; i <= 12; i++) { const u = i / 12; pts.push([x - l + 2 * l * u, y + Math.sin(u * TAU * 1.5 + k) * 3 * s]); } pen(g, pts, sd, f, { w: 3 }); }
  else if (m.type === 'cup') { const rr = (6 + 2 * k) * s; pen(g, HD.arc(x, y - rr * .3, rr, rr * .6, Math.PI * .1, Math.PI * .9, 2), sd, f, { w: 3 }); }
  else { pen(g, HD.seg([x, y - 7 * s], [x + 1, y + 2], 2), sd, f, { w: 3 }); pen(g, HD.seg([x + 7 * s, y - 5 * s], [x + 7 * s, y + 2], 2), sd + 1, f, { w: 3 }); }
}

// ---------------- the lamp post (static, 3 drawings) ----------------
function drawPost(g, f) {
  const x = POSTX, top = 905;
  // pole: two wobbly lines, hatching on its shade side
  pen(g, HD.seg([x - 8, GY + 6], [x - 6, top], 5), 1, f, { w: 4.2 }); pen(g, HD.seg([x + 8, GY + 4], [x + 7, top], 5), 2, f, { w: 4.2 });
  for (let y = top + 30; y < GY - 30; y += 13) pen(g, HD.seg([x + 1, y], [x + 7, y - 6], 2), 3 + y, f, { w: 2.4, mn: .4 });
  pen(g, HD.poly([[x - 17, GY + 6], [x - 15, GY - 34], [x + 16, GY - 34], [x + 17, GY + 4]]), 4, f, { w: 3.6 });
  pen(g, HD.seg([x - 13, GY - 44], [x + 13, GY - 44], 2), 5, f, { w: 3.2 });
  // a little crossbar with two curls, then the lantern: a glass box, a pointed cap, a finial
  pen(g, HD.seg([x - 30, top], [x + 30, top], 3), 6, f, { w: 4 });
  pen(g, HD.spline([[x - 28, top], [x - 36, top + 12], [x - 26, top + 20], [x - 20, top + 12]], 2), 7, f, { w: 3.2 });
  pen(g, HD.spline([[x + 28, top], [x + 36, top + 12], [x + 26, top + 20], [x + 20, top + 12]], 2), 8, f, { w: 3.2 });
  const L = [[x - 24, top - 4], [x - 34, top - 72], [x + 34, top - 72], [x + 24, top - 4]];
  pen(g, HD.poly(L, true), 9, f, { w: 4 });
  pen(g, HD.seg([x, top - 6], [x, top - 70], 3), 10, f, { w: 3 }); pen(g, HD.seg([x - 30, top - 40], [x + 30, top - 40], 3), 11, f, { w: 3 });
  pen(g, HD.poly([[x - 44, top - 72], [x, top - 108], [x + 44, top - 72]]), 12, f, { w: 4.2 });
  pen(g, HD.seg([x - 40, top - 76], [x + 40, top - 76], 3), 13, f, { w: 3.4 });
  for (let i = -2; i <= 2; i++) pen(g, HD.seg([x + i * 12, top - 80 + Math.abs(i) * 3], [x + i * 9, top - 96 + Math.abs(i) * 6], 2), 14 + i, f, { w: 2.4 });
  HD.fillPts(g, HD.boil(HD.arc(x, top - 116, 7, 7, 0, TAU, 2), 20, f, .5, 10), INK);
  // reflection of the post in the puddle: broken vertical hatching, mirrored and wobbling
  const r = rng(31);
  for (let y = GY + 18; y < GY + 250; y += 8 + r() * 7) { const w2 = 12 * (1 - (y - GY) / 360), xo = Math.sin(y * .07) * 4;
    for (let k = 0; k < 3; k++) if (r() > .3) pen(g, HD.seg([x - w2 + k * w2 + xo, y], [x - w2 + k * w2 + xo + (r() - .5) * 3, y + 5 + r() * 9], 2), 40 + y * 3 + k, f, { w: 3, mn: .3 }); }
  for (let y = GY + 40; y < GY + 230; y += 34) { const pts = []; for (let i = 0; i <= 10; i++) pts.push([x - 34 + i * 7, y + Math.sin(i * 1.4 + y) * 2.5]); pen(g, pts, 300 + y, f, { w: 2.6 }); }
}

// ---------------- the bird ----------------
// body sprite: a round scribble-filled bird (pen hatched back and forth until nearly solid), 3 drawings
function scribble(g, shape, seed, dens, alpha) {   // pen hatching back and forth inside a shape until it is nearly solid
  const r = rng(seed); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of shape) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.max(x1 - x0, y1 - y0) * .8;
  g.save(); g.clip(HD.pathOf(shape));
  for (let pass = 0; pass < dens.length; pass++) { const a = dens[pass][0], sp = dens[pass][1];
    for (let s = -R; s < R; s += sp * (.8 + .5 * r())) { const ca = Math.cos(a), sa = Math.sin(a), p0 = [cx - ca * R - sa * s, cy - sa * R + ca * s], p1 = [cx + ca * R - sa * s, cy + sa * R + ca * s];
      HD.ink(g, HD.wob(HD.seg(p0, p1, 5), seed + pass * 97 + s * 3 | 0, 1.2, 30), { w: 3.2, ts: 3, te: 3, mn: .6, press: .25, seed: seed + 31 + s | 0, col: `rgba(34,31,40,${alpha})` }); } }
  g.restore();
}
function birdBody(f) {   // sprite 300x300, origin (hip) at (150, 170)
  const c = Pilot.canvas(300, 300), g = c.getContext('2d'), o = [150, 170];
  g.lineJoin = g.lineCap = 'round';
  const P = pts => pts.map(p => [p[0] + o[0], p[1] + o[1]]);
  const body = HD.boil(P(HD.spline([[-12, -56], [26, -40], [40, -8], [24, 24], [-10, 32], [-44, 18], [-78, 2], [-50, -26]], 3, true)), 501, f, 1.3, 50);
  scribble(g, body, 600 + f * 13, [[-.9, 5], [.6, 6]], .6);
  HD.ink(g, body, { w: 4, ts: 4, te: 4, mn: .7, press: .2, seed: 502, col: INK });
  const head = HD.boil(P(HD.arc(16, -78, 40, 38, 0, TAU, 3)), 503, f, 1.2, 40);
  scribble(g, head, 700 + f * 13, [[-.7, 4.6], [.8, 5], [.1, 7]], .62);
  HD.ink(g, head, { w: 4, ts: 4, te: 4, mn: .7, press: .2, seed: 504, col: INK });
  // tail ticks
  for (const [a, b, cc, d] of [[-76, 0, -96, -8], [-74, 6, -98, 6]]) HD.ink(g, HD.boil(P(HD.seg([a, b], [cc, d], 2)), 505 + a, f, .8, 20), { w: 3.4, ts: 3, te: 6, mn: .4, seed: 506, col: INK });

}
function pose(t) {
  const q = HD.t12(t), moving = q < B.stop, x = walkX(Math.min(q, B.stop)), ph = (x - X0) * Math.PI / (2 * A);
  let lean = moving ? .2 + .06 * Math.sin(2 * ph) : .2, bob = moving ? 5 * Math.abs(Math.sin(ph)) : 0;
  const st = eo((q - B.stop) / .3);
  if (!moving) { bob = 6 * Math.sin(Math.PI * clamp((q - B.stop) / .4)); lean = lerp(.2, .26, st); }
  const lk = eio((q - B.look) / .3); lean = lerp(lean, -.2, lk);
  const rel = eo((q - B.drop) / .4); lean = lerp(lean, -.08, rel);
  const legs = [0, 1].map(k => { const pp = ph + k * Math.PI; return moving ? [A * Math.sin(pp), 9 * Math.max(0, Math.cos(pp))] : [lerp(A * Math.sin(pp), k ? -8 : 8, st), 0]; });

}
function bundle(g, M, f, seed = 800) {
  const P = pts => HD.xf(pts, M);
  const out = HD.spline([[-6, -112], [30, -92], [36, -40], [20, 10], [-40, 22], [-110, 12], [-140, -40], [-124, -104], [-80, -130], [-40, -126]], 3, true);
  HD.fillPts(g, HD.boil(P(out), seed, f, 1, 50), '#fff');
  pen(g, P(out), seed + 1, f, { w: 4.2, ts: 4, te: 4 });
  // knot + ties, cloth folds, a patch, hatch shading underneath (pen)
  pen(g, P(HD.spline([[-70, -128], [-58, -150], [-44, -146], [-50, -126]], 2)), seed + 2, f, { w: 3.6 });
  pen(g, P(HD.spline([[-50, -128], [-30, -152], [-18, -140], [-36, -122]], 2)), seed + 3, f, { w: 3.6 });
  pen(g, P(HD.spline([[-96, -96], [-80, -60], [-86, -20]], 3)), seed + 4, f, { w: 3 }); pen(g, P(HD.spline([[-30, -80], [-16, -40]], 3)), seed + 5, f, { w: 3 });
  for (let i = 0; i < 9; i++) { const x = -118 + i * 15; pen(g, P(HD.seg([x, -6 + Math.abs(i - 4) * 2], [x + 10, 10 - Math.abs(i - 4)], 2)), seed + 20 + i, f, { w: 2.6, mn: .3 }); }
}
function drawBird(g, t, f) {
  const p = pose(t), q = p.q, fx = p.x, hipY = GY - 44 - p.bob;
  const Mb = HD.mat(fx, hipY, p.lean);
  // the bundle: on the back → slides off → splashes into the puddle behind
  let Mx; const s1 = clamp((q - 4.02) / .22);
  if (q < 4.24) Mx = HD.mul(Mb, HD.mat(-40 - 30 * s1 * s1, -40 + 30 * s1 * s1, -.3 * s1));
  else { const a = HD.mul(Mb, HD.mat(-70, -10, -.3)), land = HD.mat(fx - 74, GY + 12, -.12), k = clamp((q - 4.24) / .16);
    Mx = q < B.drop ? { a: lerp(a.a, land.a, k), b: lerp(a.b, land.b, k), c: lerp(a.c, land.c, k), d: lerp(a.d, land.d, k), e: lerp(a.e, land.e, k), f: lerp(a.f, land.f, k * k) } : land; }
  // legs (thin pen lines with three-toed feet)
  for (const [k, side] of [[1, -1], [0, 1]]) { const [dx, ly] = p.legs[k], top = HD.pt(Mb, side * 10, 40), ft = [fx + dx + side * 4, GY - ly];
    pen(g, HD.spline([top, [lerp(top[0], ft[0], .5) + 3, lerp(top[1], ft[1], .5)], ft], 2), 900 + k, f, { w: 3.6, mn: .7 });
    for (const a of [-.5, .15, .7]) pen(g, HD.seg(ft, [ft[0] + Math.cos(a) * 13, ft[1] + Math.sin(a) * 4 + 2], 2), 910 + k * 5 + a * 10 | 0, f, { w: 3, mn: .5 }); }
  const behind = q < 4.24;
  if (!behind) bundle(g, Mx, f);
  // the strap goes round the chest
  if (q < 4.1) { const sl = clamp((q - 4.02) / .08); pen(g, HD.xf(HD.spline([[-50, -88 + 30 * sl], [0, -56], [44, -10], [30, 24]], 3), Mb), 950, f, { w: 3.6 }); }
  if (behind) bundle(g, Mx, f);
  // body sprite
  g.save(); g.setTransform(Mb.a, Mb.b, Mb.c, Mb.d, Mb.e, Mb.f); g.drawImage(TX.bird[f], -150, -170); g.restore();
  if (q < 4.1) { const sl = clamp((q - 4.02) / .08); pen(g, HD.xf(HD.spline([[-40, -40 + 16 * sl], [20, -16], [52, 14]], 3), Mb), 951, f, { w: 4 }); }
  // eye (white disc + pupil), beak
  const eyeC = HD.pt(Mb, 26, -84), eyeR = 17;
  HD.fillPts(g, HD.boil(HD.arc(eyeC[0], eyeC[1], eyeR, eyeR, 0, TAU, 2), 960, f, 1, 20), '#fff');
  pen(g, HD.arc(eyeC[0], eyeC[1], eyeR, eyeR, .3, TAU + .2, 2), 961, f, { w: 3.6 });
  const look = p.look, blink = q > 5.2 && q < 5.3;
  if (!blink) { const pc = [eyeC[0] + lerp(5, 3, look), eyeC[1] + lerp(3, -6, look)]; HD.fillPts(g, HD.boil(HD.arc(pc[0], pc[1], 7.5, 7.5, 0, TAU, 2), 962, f, .6, 10), INKS); }
  else pen(g, HD.seg([eyeC[0] - 12, eyeC[1]], [eyeC[0] + 12, eyeC[1]], 2), 963, f, { w: 3.6 });
  const bk = HD.pt(Mb, 54, -84), bk2 = HD.pt(Mb, 92, -78), bk3 = HD.pt(Mb, 55, -70);
  pen(g, [bk, ...HD.seg(bk, bk2, 3).slice(1), ...HD.seg(bk2, bk3, 3).slice(1)], 964, f, { w: 4 });
  // little worry ticks round the head once it looks up (like a doodle's emphasis marks)
  if (q > B.look + .1 && q < B.drop + .2) { const hc = HD.pt(Mb, 16, -84);
    for (let i = 0; i < 5; i++) { const a = -Math.PI * (.25 + i * .12), r0 = 82, r1 = 98; pen(g, HD.seg([hc[0] + Math.cos(a) * r0, hc[1] + Math.sin(a) * r0], [hc[0] + Math.cos(a) * r1, hc[1] + Math.sin(a) * r1], 2), 970 + i, f, { w: 3.2 }); } }
  // splash when the bundle lands
  if (q >= B.drop && q < B.drop + .5) { const k = (q - B.drop) / .5, sx = fx - 120, sy = GY + 16;
    for (let i = 0; i < 6; i++) { const a = -Math.PI * (.15 + i * .14), r0 = 50 + 60 * k, d = [sx + Math.cos(a) * r0 * 1.6, sy + Math.sin(a) * r0 * .9 + 60 * k * k];
      HD.fillPts(g, HD.arc(d[0], d[1], 4.5 * (1 - k * .5), 5.5 * (1 - k * .5), 0, TAU, 2), INK); }
    pen(g, HD.arc(sx, sy + 8, 120 + 50 * k, 18 + 6 * k, Math.PI * .05, Math.PI * .95, 4), 980, f, { w: 3.4 });
    pen(g, HD.arc(sx, sy + 8, 150 + 70 * k, 26 + 8 * k, Math.PI * .1, Math.PI * .4, 4), 981, f, { w: 3 }); }
  // the bird's reflection: broken short verticals under it
  const r = rng(990);
  for (let y = GY + 14; y < GY + 150; y += 8 + r() * 6) { const w2 = 36 * (1 - (y - GY) / 200); for (let k = 0; k < 4; k++) if (r() > .3) pen(g, HD.seg([fx - w2 + k * w2 * .66 + (r() - .5) * 4, y], [fx - w2 + k * w2 * .66, y + 5 + r() * 7], 2), 1000 + y * 4 + k, f, { w: 3, mn: .3 }); }
}

// ---------------- rain (falls on twos) ----------------
const DROPS = [];
function buildRain() { const r = rng(4242); for (let i = 0; i < 150; i++) { const floor = 1130 + Math.pow(r(), .7) * 420; DROPS.push({ x: 20 + r() * 1040, y0: r() * 2000, v: 1300 + r() * 500, len: 30 + r() * 60, floor, seed: 3000 + i }); } }
function rain(g, t, f) {
  const q = HD.t12(t);
  for (const d of DROPS) { const span = d.floor + 120, y = ((d.y0 + d.v * q) % span) - 120; if (y + d.len < 40) continue;
    const y1 = Math.min(y + d.len, d.floor); if (y1 - y < 8) continue;
    pen(g, HD.seg([d.x, y], [d.x - 1.5, y1], 6), d.seed, f, { w: 3.2, ts: 4, te: 12, mn: .3, wob: .6, boil: .6 }); }
}

// ---------------- the lamp's light: yellow highlighter (the one colour) + tick marks ----------------
function lampLight(ctx, t, f) {
  const q = HD.t12(t); if (q < B.look) return;
  const on = q < B.look + .09 ? .5 : 1, hx = POSTX, hy = 905 - 40, r = rng(55 + f);
  ctx.save(); ctx.setTransform(...WM); ctx.globalCompositeOperation = 'multiply'; ctx.lineCap = 'round';
  // the pool of light: highlighter strokes fanning down from the lantern
  ctx.strokeStyle = `rgba(255,238,120,${.3 * on})`;
  for (let i = 0; i < 11; i++) { const u = i / 10, xTop = hx - 26 + u * 52, xBot = hx - 170 + u * 340 + (r() - .5) * 14; ctx.lineWidth = 22 + r() * 6; ctx.beginPath(); ctx.moveTo(xTop, hy + 30); ctx.lineTo(xBot, GY + 10 + (r() - .5) * 24); ctx.stroke(); }
  // round the lantern: a quick scribbled ring, twice
  ctx.strokeStyle = `rgba(255,232,96,${.42 * on})`; ctx.lineWidth = 24;
  ctx.beginPath(); for (let i = 0; i <= 30; i++) { const a = i / 30 * TAU * 1.2 + f, rr = 56 + 8 * Math.sin(i * 1.9 + f); ctx.lineTo(hx + Math.cos(a) * rr, hy + Math.sin(a) * rr); } ctx.stroke();
  // its reflection in the puddle: horizontal dashes
  ctx.strokeStyle = `rgba(255,236,110,${.32 * on})`; ctx.lineWidth = 12;
  for (let i = 0; i < 6; i++) { const y = GY + 30 + i * 24, w2 = 120 - i * 14 + r() * 16; ctx.beginPath(); ctx.moveTo(hx - w2 / 2 + (r() - .5) * 14, y); ctx.lineTo(hx + w2 / 2, y + (r() - .5) * 4); ctx.stroke(); }
  ctx.restore();
}
function lampTicks(g, t, f) {
  const q = HD.t12(t); if (q < B.look) return;
  const hx = POSTX, hy = 905 - 40;
  for (let i = 0; i < 11; i++) { const a = Math.PI * (.95 + i * .11), r0 = 66, r1 = 84 + (i % 2) * 10; pen(g, HD.seg([hx + Math.cos(a) * r0, hy + Math.sin(a) * r0], [hx + Math.cos(a) * r1, hy + Math.sin(a) * r1], 2), 1200 + i, f, { w: 3.4 }); }
}

// ---------------- frame ----------------
let INKL;
function draw(ctx, t) {
  const f = bf(t), g = INKL.g, q = HD.t12(t);
  ctx.drawImage(TX.paper, 0, 0);
  lampLight(ctx, t, f);
  HD.clearWhite(g);
  g.drawImage(TX.post[f], 0, 0);
  for (const m of MARKS) drawMark(g, m, (Math.floor(q * 12 / 3) + m.ph) % 3, f);
  rain(g, t, f);
  g.setTransform(...WM); PENK = .8;

  g.setTransform(1, 0, 0, 1, 0, 0); PENK = 1;
  HD.dropout(g, TX.drop, .5);
  HD.multiply(ctx, INKL.c);
  // hand-lettered words: pen script, ink, boiling with the drawing

  Story.captions(ctx, t, S.lines, { font: "'Nanum Pen Script','Nanum Pen',cursive", weight: 400, size: 96, y: 400, color: '#25222b', shadow: 'rgba(0,0,0,0)', shadowBlur: 0 });

}
async function init() {

  TX.drop = HD.toothMask(T, '#ffffff', 'valley', .3, .12, .8);
  buildMarks(); buildRain();

Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 96px 'Nanum Pen Script'", "400 96px 'Nanum Pen'"], init, draw });
