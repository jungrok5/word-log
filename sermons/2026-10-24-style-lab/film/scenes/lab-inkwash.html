<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* ---- hand-drawn toolkit (shared by the lab-* hand-drawn scenes; inlined at build time) ----
   Lines are variable-width ribbons built from densely sampled polylines: a static hand wobble per stroke (seeded),
   a boil displacement per drawing (3 drawings cycled on 8–12 fps), pressure along the length, tapered ends, ragged
   edges. Ink is laid on a white layer that is multiplied onto a paper whose tooth is a real height field, so ink drops
   out in the valleys and pencil only catches the peaks. */
const TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
const HD = {};
HD.hash = (i, s = 0) => { let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
HD.t12 = t => Math.floor(t * 12 + 1e-6) / 12;
HD.spline = (P, step = 3, closed = false) => {
  const n = P.length; if (n < 2) return P.map(p => p.slice());
  const get = i => closed ? P[((i % n) + n) % n] : P[clamp(i, 0, n - 1)];
  const out = [], segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), m = Math.max(1, Math.ceil(L / step));
    for (let j = 0; j < m; j++) { const t = j / m, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3))); }
  }
  out.push(closed ? out[0].slice() : P[n - 1].slice()); return out;
};
HD.seg = (a, b, step = 4) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]), m = Math.max(1, Math.ceil(L / step)), o = [];
  for (let i = 0; i <= m; i++) o.push([lerp(a[0], b[0], i / m), lerp(a[1], b[1], i / m)]); return o; };
HD.poly = (P, closed = false, step = 4) => { const o = []; const n = P.length, m = closed ? n : n - 1; for (let i = 0; i < m; i++) { const sg = HD.seg(P[i], P[(i + 1) % n], step); if (i) sg.shift(); o.push(...sg); } return o; };
HD.arc = (cx, cy, rx, ry, a0, a1, step = 4, rot = 0) => { const L = Math.abs(a1 - a0) * Math.max(rx, ry), m = Math.max(2, Math.ceil(L / step)), o = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i <= m; i++) { const a = lerp(a0, a1, i / m), x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push([cx + x * c - y * s, cy + x * s + y * c]); } return o; };
HD.normals = pts => pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
HD.lengths = pts => { const s = [0]; for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return s; };
// hand wobble: perpendicular low-frequency displacement
HD.wob = (pts, seed, amp, wl = 120) => { if (!amp || pts.length < 2) return pts; const N = HD.normals(pts), Sx = HD.lengths(pts), oy = (seed * 17.37) % 997;
  return pts.map((p, i) => { const d = (noise(Sx[i] / wl, oy) - .5) * 2 * amp; return [p[0] + N[i][0] * d, p[1] + N[i][1] * d]; }); };
// one boiled drawing: a new wobble + a tiny drift, per drawing index f
HD.boil = (pts, seed, f, amp, wl = 90) => { if (!amp) return pts; const s = (seed * 31 + f * 977) | 0, dx = (HD.hash(s, 1) - .5) * amp, dy = (HD.hash(s, 2) - .5) * amp;
  return HD.wob(pts, s, amp, wl).map(p => [p[0] + dx, p[1] + dy]); };
HD.xf = (pts, m) => pts.map(p => [m.a * p[0] + m.c * p[1] + m.e, m.b * p[0] + m.d * p[1] + m.f]);   // apply a DOMMatrix-like
HD.mat = (x, y, rot = 0, sx = 1, sy = sx) => { const c = Math.cos(rot), s = Math.sin(rot); return { a: c * sx, b: s * sx, c: -s * sy, d: c * sy, e: x, f: y }; };
HD.mul = (A, Bm) => ({ a: A.a * Bm.a + A.c * Bm.b, b: A.b * Bm.a + A.d * Bm.b, c: A.a * Bm.c + A.c * Bm.d, d: A.b * Bm.c + A.d * Bm.d, e: A.a * Bm.e + A.c * Bm.f + A.e, f: A.b * Bm.e + A.d * Bm.f + A.f });
HD.pt = (m, x, y) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
// variable-width ribbon (round caps where the end is wide)
HD.ribbon = (pts, wf) => {
  const n = pts.length, N = HD.normals(pts), Sx = HD.lengths(pts), L = Sx[n - 1] || 1, Lf = [], Rt = [], ws = [];
  for (let i = 0; i < n; i++) { const w = Math.max(0, wf(Sx[i] / L, Sx[i], i, L)) / 2; ws.push(w); Lf.push([pts[i][0] + N[i][0] * w, pts[i][1] + N[i][1] * w]); Rt.push([pts[i][0] - N[i][0] * w, pts[i][1] - N[i][1] * w]); }
  const p = new Path2D(); p.moveTo(Lf[0][0], Lf[0][1]); for (let i = 1; i < n; i++) p.lineTo(Lf[i][0], Lf[i][1]);
  const ae = Math.atan2(N[n - 1][1], N[n - 1][0]); if (ws[n - 1] > .4) p.arc(pts[n - 1][0], pts[n - 1][1], ws[n - 1], ae, ae + Math.PI, true); else p.lineTo(Rt[n - 1][0], Rt[n - 1][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(Rt[i][0], Rt[i][1]);
  const a0 = Math.atan2(N[0][1], N[0][0]); if (ws[0] > .4) p.arc(pts[0][0], pts[0][1], ws[0], a0 + Math.PI, a0, true);
  p.closePath(); return p;
};
// an ink line: o = { w, ts, te (taper lengths px), mn (tip width fraction), press, pw (pressure wavelength), rough, seed, col, dry }
HD.ink = (ctx, pts, o = {}) => {
  if (!pts || pts.length < 2) return;
  const w = o.w ?? 8, ts = o.ts ?? w * 2.5, te = o.te ?? w * 3.5, mn = o.mn ?? .2, press = o.press ?? .3, pw = o.pw ?? 70, rough = o.rough ?? .08, seed = o.seed ?? 1, mnE = o.mnE ?? mn;
  const wf = (u, s, i, L) => { const k = Math.min(1, mn + (1 - mn) * ss(0, ts, s)) * Math.min(1, mnE + (1 - mnE) * ss(0, te, L - s));
    return w * k * (1 + press * (noise(s / pw, seed * 3.7 % 500) - .5) * 2) * (1 + rough * (HD.hash(i, seed) - .5) * 2); };
  ctx.fillStyle = o.col || '#151312'; ctx.fill(HD.ribbon(pts, wf));
  if (o.blob) { ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], w * o.blob, 0, TAU); ctx.fill(); }   // a marker resting a moment at the start
  if (o.dry) {   // dry-brush streaks in the tail: thin paper-white lines along the stroke
    const N = HD.normals(pts), Sx = HD.lengths(pts), L = Sx[Sx.length - 1], r = rng(seed * 7 + 3);
    ctx.save(); ctx.strokeStyle = o.paper || '#fff'; ctx.lineCap = 'round';
    for (let k = 0; k < (o.dryN || 4); k++) { const f = (r() - .5) * .7, u0 = 1 - o.dry * (.3 + .7 * r()); ctx.lineWidth = (o.dryW || 1) * (.5 + r() * .7); ctx.globalAlpha = .55 + r() * .45; ctx.beginPath(); let st = false;
      for (let i = 0; i < pts.length; i++) { const u = Sx[i] / L; if (u < u0) continue; const ww = wf(u, Sx[i], i, L) * f; const x = pts[i][0] + N[i][0] * ww, y = pts[i][1] + N[i][1] * ww; if (!st) { ctx.moveTo(x, y); st = true; } else ctx.lineTo(x, y); }
      ctx.stroke(); }
    ctx.restore();
  }
};
// a closed hand shape: fill (paper white or colour) — the outline is drawn separately with HD.ink
HD.fillPts = (ctx, pts, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); };
HD.pathOf = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (const q of pts) p.lineTo(q[0], q[1]); p.closePath(); return p; };

// ---- paper: a tooth height field (full frame) → paper colour, ink dropout (white specks), pencil deposit masks ----
HD.tooth = (seed = 1, s1 = 6, s2 = 2.2, fib = 0) => {
  const T = new Float32Array(W * H), r = rng(seed), ox = r() * 500, oy = r() * 500;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = .62 * noise(x / s1 + ox, y / s1 + oy) + .38 * noise(x / s2 + oy, y / s2 + ox);
    T[y * W + x] = v; }
  if (fib) { // fibres: thin streaks raised a little
    for (let k = 0; k < fib; k++) { let x = r() * W, y = r() * H, a = r() * TAU; const l = 8 + r() * 30;
      for (let i = 0; i < l; i++) { a += (r() - .5) * .3; x += Math.cos(a); y += Math.sin(a); const xi = x | 0, yi = y | 0; if (xi >= 0 && yi >= 0 && xi < W && yi < H) T[yi * W + xi] = Math.min(1, T[yi * W + xi] + .18); } } }
  return T;
};
// paper canvas: base colour, low-frequency mottling, embossed tooth (light from top-left), fine grain, edge falloff
HD.paper = (T, o = {}) => {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), d = g.createImageData(W, H), D = d.data, base = o.base || [250, 249, 245];
  const mot = o.mott ?? 6, emb = o.emb ?? 26, gr = o.grain ?? 4, vig = o.vig ?? 0, r = rng(o.seed || 9), mscale = o.mscale || 260;
  const tint = o.tint || [0, 0, 0];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, x0 = Math.max(0, x - 1), y0 = Math.max(0, y - 1), x1 = Math.min(W - 1, x + 1), y1 = Math.min(H - 1, y + 1);
    const sh = (T[y0 * W + x0] - T[y1 * W + x1]) * emb, m = (noise(x / mscale + 40, y / mscale + 7) - .5) * 2 * mot;
    const dx = (x / W - .5), dy = (y / H - .5), v = -vig * (dx * dx * 1.4 + dy * dy) * 4;
    const n = (r() - .5) * gr, k = sh + m + n + v;
    D[i * 4] = base[0] + k + tint[0] * m / (mot || 1); D[i * 4 + 1] = base[1] + k + tint[1] * m / (mot || 1); D[i * 4 + 2] = base[2] + k + tint[2] * m / (mot || 1); D[i * 4 + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
};
// a full-frame canvas of colour `col` whose alpha follows the tooth: mode 'peak' (pencil catches the peaks) or 'valley' (ink misses the valleys)
HD.toothMask = (T, col, mode = 'valley', thr = .35, soft = .18, amax = 1) => {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), d = g.createImageData(W, H), D = d.data, rgb = Pilot.hex(col);
  for (let i = 0; i < W * H; i++) { const v = mode === 'peak' ? (T[i] - thr) / soft : (thr - T[i]) / soft, a = clamp(v) * amax;
    D[i * 4] = rgb[0]; D[i * 4 + 1] = rgb[1]; D[i * 4 + 2] = rgb[2]; D[i * 4 + 3] = a * 255; }
  g.putImageData(d, 0, 0); return c;
};
// layers: a white canvas you draw ink on, then multiply onto the frame
HD.layer = () => { const c = Pilot.canvas(W, H), g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round'; return { c, g }; };
HD.clearWhite = (g, x = 0, y = 0, w = W, h = H) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.fillStyle = '#fff'; g.fillRect(x, y, w, h); g.restore(); };
HD.dropout = (g, mask, a = 1, x = 0, y = 0, w = W, h = H) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = a; g.drawImage(mask, x, y, w, h, x, y, w, h); g.restore(); };
HD.multiply = (ctx, c, x = 0, y = 0, w = W, h = H, a = 1) => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = a; ctx.drawImage(c, x, y, w, h, x, y, w, h); ctx.restore(); };

// walk: distance along x with a slowing stop (speed 1 → 0 over the last `dec` fraction), from a lookup table
HD.walker = (x0, x1, T, dec = .3) => { const n = 400, tab = [0]; let s = 0; for (let i = 1; i <= n; i++) { const u = i / n; s += 1 - ss(1 - dec, 1, u); tab.push(s); }
  return t => { if (t <= 0) return x0 + (t / T) * n * (x1 - x0) / tab[n]; if (t >= T) return x1; const f = t / T * n, i = Math.floor(f), k = f - i; return x0 + (x1 - x0) * lerp(tab[i], tab[Math.min(n, i + 1)], k) / tab[n]; }; };

/* lab-inkwash — ink + grey watercolour washes + orange coloured-pencil construction lines on white cold-press paper
   (ref 12). A loose architectural interior (tall arched window, curtain, dark streaky wall, bookcase, checker floor,
   an armchair, a floor lamp), left unfinished at the top where the construction lines run out into bare paper.
   Washes are glazes multiplied over each other with darkened edges, granulation in the tooth and cauliflower blooms;
   pencil only catches the paper's peaks; ink lines wobble and boil (3 drawings on 8 fps).
   A small black-ink traveller trudges in under a grey-washed sack, stops, looks up as the lamp comes on — a warm wash
   blooms out across the wet paper (the one accent) — the sack slips off and thumps down (a spatter), then a breath. */
const VP = [530, 1000], FLOOR = 1250, X0 = 190, X1 = 440, A = 20, FY = 1478;
const walkX = HD.walker(X0, X1, B.stop, .3);
const bf = t => Math.floor(t * 8 + 1e-6) % 3;
const TX = {}, PLATE = /[?&]plate=1/.test(location.search);
const INK = '#161413';
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------------- watercolour wash (built once) ----------------
let TMP, TMPG;
function bbox(P, pad) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of P) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  x0 = clamp(Math.floor(x0 - pad), 0, W); y0 = clamp(Math.floor(y0 - pad), 0, H); x1 = clamp(Math.ceil(x1 + pad), 0, W); y1 = clamp(Math.ceil(y1 + pad), 0, H); return [x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0)]; }
// pts: polygon corners (closed). o: { seed, wob, wl, fr, edge, gran, pool, blur, round, streak }
function wash(g, pts, col, a, o = {}) {
  const sd = o.seed || 1;
  let P = o.round ? HD.spline(pts, 5, true) : HD.poly(pts, true, 5);
  P = HD.wob(P, sd, o.wob ?? 3, o.wl ?? 60); P = HD.wob(P, sd + 5, o.fr ?? 1.3, 8);
  const [bx, by, bw, bh] = bbox(P, 12), t = TMPG;
  t.save(); t.setTransform(1, 0, 0, 1, 0, 0); t.globalCompositeOperation = 'source-over'; t.globalAlpha = 1; t.clearRect(bx, by, bw, bh);
  const path = HD.pathOf(P);
  t.fillStyle = rgba(col, a); t.fill(path);
  // a second, uneven layer (pigment settles unevenly)
  t.save(); t.clip(path); t.globalCompositeOperation = 'source-atop'; t.globalAlpha = (o.pool ?? .5); t.drawImage(TX.pool, bx, by, bw, bh, bx, by, bw, bh); t.restore();
  // streaky brush marks (vertical by default)
  if (o.streak) { t.save(); t.clip(path); const r = rng(sd + 9); for (let i = 0; i < o.streak; i++) { const x = bx + r() * bw, y0 = by - 20 + r() * bh * .3, y1 = by + bh * (.5 + r() * .6);
      HD.ink(t, HD.wob(HD.seg([x, y0], [x + (r() - .5) * 14, y1], 8), sd + i, 4, 80), { w: 8 + r() * 30, ts: 40, te: 60, mn: .2, press: .5, seed: sd + i * 3, col: rgba(col, a * (.25 + r() * .5)) }); } t.restore(); }
  // edge darkening: pigment pools at the drying edge
  t.lineJoin = 'round'; t.strokeStyle = rgba(col, Math.min(1, a * (o.edge ?? .9))); t.lineWidth = 2.6; t.save(); t.clip(path); t.stroke(path); t.restore();
  // granulation: pigment thins on the tooth's peaks
  t.globalCompositeOperation = 'destination-out'; t.globalAlpha = (o.gran ?? .45) * .3; t.drawImage(TX.peaks, bx, by, bw, bh, bx, by, bw, bh);
  t.restore();
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'multiply'; if (o.blur) g.filter = `blur(${o.blur}px)`; g.drawImage(TMP, bx, by, bw, bh, bx, by, bw, bh); g.restore();
}
// lift: take paint off back to paper (a wet tissue)
function lift(g, pts, a, seed) { let P = HD.wob(HD.poly(pts, true, 5), seed, 2.4, 40); g.save(); g.globalCompositeOperation = 'source-over'; g.fillStyle = `rgba(255,255,255,${a})`; g.fill(HD.pathOf(P)); g.restore(); }
// cauliflower bloom edge: a lacy dark line where a wash crept back into a drying one
function bloomEdge(g, cx, cy, r, col, a, seed, a0 = 0, a1 = TAU) { const pts = []; for (let i = 0; i <= 160; i++) { const an = lerp(a0, a1, i / 160), rr = r * (1 + .12 * (fbm(an * 3 + seed, seed, 4) - .5) * 2 + .05 * Math.sin(an * 23 + seed)); pts.push([cx + Math.cos(an) * rr, cy + Math.sin(an) * rr * .8]); }
  g.save(); g.globalCompositeOperation = 'multiply'; g.strokeStyle = rgba(col, a); g.lineWidth = 2; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); g.restore(); }

// floor perspective
const ROWZ = [1, 1.14, 1.31, 1.52, 1.78, 2.1, 2.5];
const rowY = z => VP[1] + (FLOOR - VP[1]) * z;
const colX = (xb, z) => VP[0] + (xb - VP[0]) * z;
const COLS = []; for (let x = -260; x <= 1300; x += 86) COLS.push(x);

function buildWashes(g) {
  const W0 = [70, 70, 74], GREY = [96, 96, 100], WARM = [176, 120, 78], BROWN = [150, 116, 86];
  // ceiling / upper wall: dark wash that bleeds up into bare paper (blooms at its upper edge)
  // the upper wall goes dark towards the right and dissolves into bare paper above (soft, blooming, unfinished)
  wash(g, [[430, 700], [520, 640], [700, 600], [900, 590], [1080, 570], [1080, 720], [700, 730], [520, 760]], GREY, .3, { seed: 3, round: 1, wob: 22, wl: 70, streak: 12, edge: 1.4 });
  wash(g, [[560, 690], [700, 650], [880, 640], [1080, 630], [1080, 700], [560, 720]], W0, .32, { seed: 4, round: 1, wob: 16, streak: 14, edge: 1.3 });
  wash(g, [[40, 700], [120, 662], [250, 640], [380, 650], [450, 700], [440, 760], [60, 760]], GREY, .14, { seed: 2, round: 1, wob: 18, edge: 1.6 });
  // dark wall between window and bookcase: heavy, streaky
  wash(g, [[520, 700], [840, 690], [842, 1252], [518, 1256]], W0, .62, { seed: 5, wob: 3, streak: 40, gran: .55, edge: 1 });
  wash(g, [[540, 720], [830, 710], [832, 1000], [536, 1040]], W0, .3, { seed: 6, wob: 8, streak: 20 });
  // window recess shadow (right side of the window, under the arch) and the curtain
  wash(g, [[372, 760], [438, 742], [440, 1244], [380, 1240]], GREY, .28, { seed: 7, streak: 6 });
  wash(g, [[440, 700], [528, 700], [532, 1248], [446, 1250]], GREY, .2, { seed: 8, streak: 18, gran: .6 });
  wash(g, [[80, 770], [160, 700], [255, 650], [350, 700], [430, 770], [430, 900], [80, 900]], [150, 160, 172], .12, { seed: 20, round: 1, wob: 12, edge: 1.6 });
  wash(g, [[80, 1130], [430, 1130], [430, 1238], [80, 1238]], GREY, .1, { seed: 21, wob: 6 });
  // a warm stain in a low pane (paper and light)
  wash(g, [[180, 1010], [250, 990], [262, 1100], [200, 1140], [170, 1090]], WARM, .22, { seed: 9, round: 1, wob: 10, edge: 1.4 });
  // bookcase: warm grey, books in a brown glaze
  wash(g, [[842, 600], [1080, 590], [1080, 1262], [842, 1256]], BROWN, .22, { seed: 10, streak: 16 });
  const r = rng(11);

const LC = [650, 1060];

function bloomPath(R, t) { const pts = []; for (let i = 0; i < 120; i++) { const a = i / 120 * TAU, n = fbm(Math.cos(a) * 1.6 + 5, Math.sin(a) * 1.6 + 2, 3), rr = R * (.82 + .36 * n) * (1 + .03 * Math.sin(a * 9 + HD.t12(t) * .6)); pts.push([LC[0] + Math.cos(a) * rr, LC[1] + Math.sin(a) * rr * (a > 0 && a < Math.PI ? 1.15 : .85)]); } return pts; }
function drawBloom(ctx, t) {
  const R = bloomR(t); if (R <= 0) return;
  const pts = bloomPath(R, t), pth = HD.pathOf(pts);
  // inside the wet front the room is the lit painting: paint lifted near the lamp, a warm glaze over it
  ctx.save(); ctx.clip(pth); ctx.drawImage(TX.paper, 0, 0); HD.multiply(ctx, TX.lit); ctx.restore();
  // the wet front: pigment piling up at the advancing edge (a darker warm line, a softer one inside)
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(214,150,84,.32)'; ctx.lineWidth = 2.6; ctx.stroke(pth);
  ctx.save(); ctx.clip(pth); ctx.strokeStyle = 'rgba(232,180,110,.16)'; ctx.lineWidth = 14; ctx.stroke(pth); ctx.restore();
  ctx.restore();
}
function buildBloom() {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  const WARM = [246, 190, 96];
  for (const [r, a, s] of [[470, .2, 1], [320, .16, 2], [190, .16, 3], [100, .2, 4]]) { const pts = []; for (let i = 0; i < 40; i++) { const an = i / 40 * TAU, rr = r * (.85 + .3 * fbm(an + s * 3, s, 3)); pts.push([LC[0] + Math.cos(an) * rr, LC[1] + Math.sin(an) * rr * .95]); } wash(g, pts, WARM, a, { seed: 900 + s, round: 1, wob: 10, edge: 1.2, gran: .35, pool: .4 }); }
  // the shade itself, glowing, and a warm pool on the floor and over the chair
  wash(g, [[618, 1012], [684, 1012], [710, 1088], [592, 1088]], [240, 170, 80], .55, { seed: 910, edge: 1.3 });
  wash(g, [[560, 1400], [760, 1300], [990, 1330], [1000, 1460], [640, 1480]], WARM, .2, { seed: 911, round: 1, wob: 14 });
  return c;
}

// ---------------- frame ----------------
let INKL, FIGCLIP = null;
function draw(ctx, t) {
  const f = bf(t), g = INKL.g;
  ctx.drawImage(TX.paper, 0, 0);
  HD.multiply(ctx, TX.washes);
  if (PLATE) { HD.multiply(ctx, TX.lines[0]); return; }   // ?plate=1: the bare room, for the image model to repaint
  drawBloom(ctx, t);
  HD.multiply(ctx, TX.lines[f]);
  HD.clearWhite(g, 0, 1100, W, 600);
  drawFigure(ctx, g, t, f);
  HD.dropout(g, TX.drop, .25, 0, 1100, W, 600);
  ctx.save(); ctx.clip(FIGCLIP, 'nonzero'); ctx.drawImage(TX.paper, 0, 0); ctx.restore();   // the figure is opaque: nothing behind shows through its eye or the rope
  HD.multiply(ctx, INKL.c, 0, 1100, W, 600);
  Story.captions(ctx, t, S.lines, { font: "'Gowun Batang',serif", weight: 700, size: 62, y: 400, color: '#2a2522', shadow: 'rgba(0,0,0,0)', shadowBlur: 0 });
}
async function init() {
  const T = HD.tooth(21, 7, 2.6, 300);
  TX.paper = HD.paper(T, { base: [251, 250, 246], mott: 3, emb: 34, grain: 3, vig: .04, mscale: 300 });
  TX.peaks = HD.toothMask(T, '#000000', 'peak', .5, .18, 1);
  TX.drop = HD.toothMask(T, '#ffffff', 'valley', .3, .1, .9);
  TX.orange = HD.toothMask(T, '#d2652c', 'peak', .22, .3, .9);
  TX.graphite = HD.toothMask(T, '#3c3a3a', 'peak', .25, .3, .75);
  { const c = Pilot.canvas(W, H), g = c.getContext('2d'), d = g.createImageData(W, H);   // uneven pigment (a darker settle)
    for (let y = 0; y < H; y += 1) for (let x = 0; x < W; x++) { const i = (y * W + x) * 4, v = fbm(x / 70, y / 70, 3); d.data[i] = 60; d.data[i + 1] = 58; d.data[i + 2] = 58; d.data[i + 3] = clamp((v - .45) * 2.2) * 120; }
    g.putImageData(d, 0, 0); TX.pool = c; }
  TMP = Pilot.canvas(W, H); TMPG = TMP.getContext('2d');
  { const L = HD.layer(); HD.clearWhite(L.g); buildWashes(L.g); TX.washes = L.c; }
  TX.lines = [0, 1, 2].map(f => { const L = HD.layer(); HD.clearWhite(L.g); buildLines(L.g, f); return L.c; });
  TX.bloom = buildBloom();
  { const c = Pilot.canvas(W, H), g = c.getContext('2d'); g.drawImage(TX.washes, 0, 0);
    const lg = g.createRadialGradient(LC[0], LC[1], 20, LC[0], LC[1] + 60, 520); lg.addColorStop(0, 'rgba(255,255,255,.8)'); lg.addColorStop(.5, 'rgba(255,255,255,.48)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lg; g.fillRect(0, 0, W, H); g.globalCompositeOperation = 'multiply'; g.drawImage(TX.bloom, 0, 0); TX.lit = c; }
  TX.sack = [0, 1, 2].map(sackSprite);
  { const c = Pilot.canvas(180, 44), g = c.getContext('2d'); g.filter = 'blur(5px)'; g.fillStyle = 'rgba(80,78,78,.8)'; g.beginPath(); g.ellipse(90, 22, 72, 11, 0, 0, TAU); g.fill(); TX.shadow = c; }
  INKL = HD.layer();
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 62px 'Gowun Batang'"], init, draw });

</script>
