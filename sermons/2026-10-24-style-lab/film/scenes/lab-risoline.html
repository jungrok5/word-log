<script>
/* 07 — risograph comic line. Two-ink print look: a flat, mottled teal-blue field with heavy print grain; a thick, slightly

// ---------------- hand line ----------------
let LWK = 1;                          // line-width factor (the figure is drawn scaled up)
function wob(p, amp = 1.8, k = K) {   // per-boil-frame jitter (smooth in space) + a fixed hand tremor

// ---------------- prebuilt print ----------------
let BG, GRAIN, TONE, TONE_D, GLOW;
function init() {

  BG = Pilot.canvas(W, H); const b = BG.getContext('2d');
  b.fillStyle = C.field; b.fillRect(0, 0, W, H);
  const mw = 90, mh = 160, m = Pilot.canvas(mw, mh), mx = m.getContext('2d'), md = mx.createImageData(mw, mh);
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) { const v = Pilot.fbm(x * .09 + 3, y * .09 + 7, 4), i = (y * mw + x) * 4;
    const k = (v - .5) * 2; md.data[i] = md.data[i + 1] = md.data[i + 2] = k > 0 ? 255 : 20; md.data[i + 3] = Math.abs(k) * 34; }
  mx.putImageData(md, 0, 0); b.imageSmoothingEnabled = true; b.drawImage(m, 0, 0, W, H);
  // grain: clumpy (half-res, upscaled) + fine, light and dark specks, over everything
  GRAIN = Pilot.canvas(W, H); const g = GRAIN.getContext('2d'), gd = g.createImageData(W, H), r = rng(77);
  const hw = W >> 1, hh = H >> 1, hr = new Float32Array(hw * hh); for (let i = 0; i < hr.length; i++) hr[i] = r();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = (y * W + x) * 4, v = .6 * hr[(y >> 1) * hw + (x >> 1)] + .4 * r() - .5;
    if (v > 0) { gd.data[i] = 255; gd.data[i + 1] = 252; gd.data[i + 2] = 240; gd.data[i + 3] = Math.min(255, v * v * 4 * 120); }
    else { gd.data[i] = 18; gd.data[i + 1] = 36; gd.data[i + 2] = 44; gd.data[i + 3] = Math.min(255, v * v * 4 * 130); } }
  g.putImageData(gd, 0, 0);

  const mk = (cell, rad, a) => { const c = Pilot.canvas(cell * 2, cell * 2), x = c.getContext('2d'), rr = rng(5); x.fillStyle = `rgba(29,33,35,${a})`;
    for (const [px, py] of [[cell / 2, cell / 2], [cell * 1.5, cell * 1.5], [cell * 1.5, cell / 2], [cell / 2, cell * 1.5]].slice(0, 4)) {
      x.beginPath(); x.ellipse(px, py, rad * (.85 + rr() * .3), rad * (.85 + rr() * .3), 0, 0, TAU); x.fill(); }
    return c; };

  gr.addColorStop(0, 'rgba(247,214,120,.95)'); gr.addColorStop(.35, 'rgba(244,206,108,.45)'); gr.addColorStop(.7, 'rgba(240,200,100,.12)'); gr.addColorStop(1, 'rgba(240,200,100,0)');
  gl.fillStyle = gr; gl.fillRect(0, 0, 256, 256);

let TS = 1;
const tone = (ctx, c, ox, oy) => { const p = ctx.createPattern(c, 'repeat'); p.setTransform(new DOMMatrix().translate(Math.round(ox), Math.round(oy)).scale(TS)); return p; };
const glow = (ctx, x, y, r, a) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.drawImage(GLOW, x - r, y - r, r * 2, r * 2); ctx.restore(); };

// ---------------- the figure (poses on twos) ----------------
const D = 100, CYC = 1.5, STANCE = .62, LEG1 = 86, LEG2 = 84;
const X0 = 362;
function pose(t) {
  const u = clamp(t / B.stop), dist = D * CYC * (1.5 * u - .5 * u * u * u), ph = dist / D;
  const sag = ss(B.stop, B.stop + .35, t) * (1 - ss(B.drop + .15, B.drop + .7, t));
  const look = ss(B.look, B.look + .45, t), relief = ss(B.drop + .1, B.drop + .75, t);
  const walking = t < B.stop;

  const hip = [X0 + dist, G - 158 + bob + sag * 9 - relief * 6 - breath * 1.5];

function legFoot(ph, off, walking, hipX) {

  const mid1 = [(hp[0] + kn[0]) / 2, (hp[1] + kn[1]) / 2], mid2 = [(kn[0] + ank[0]) / 2, (kn[1] + ank[1]) / 2];

  const a = -foot.toe;

// sack (bundle), local coords centred, y down
const SACK = [[-62, -84], [-92, -48], [-108, 4], [-104, 56], [-82, 96], [-40, 116], [10, 120], [58, 110], [92, 82], [106, 34], [100, -22], [78, -66], [40, -92], [0, -98]];
function drawSack(ctx, c, ang, sx, sy, loose, tp) {
  const T = p => { const q = rot2([p[0] * sx, p[1] * sy], ang); return [c[0] + q[0], c[1] + q[1]]; };
  const pts = SACK.map(T);

  ctx.save(); ctx.translate(2.5, 1.6); ctx.clip(path);

  ink(ctx, ell(0, -96, 20, 13).map(T), { fill: C.cream, lw: 6 });

  ink(ctx, [[-104, -6], [-50, 10], [10, 14], [70, 4], [104, 0]].map(T), { closed: false, lw: 6 });
  ink(ctx, [[-102, 8], [-50, 24], [10, 28], [70, 18], [104, 14]].map(T), { closed: false, lw: 5 });
  ink(ctx, [[-40, -70], [-56, -30]].map(T), { closed: false, lw: 4.5 });
  ink(ctx, [[48, 60], [66, 84]].map(T), { closed: false, lw: 4.5 });

    ink(ctx, [[84, -50], [118, -10], [126, 40], [112, 80]].map(T), { closed: false, lw: 15 }); ink(ctx, [[84, -50], [118, -10], [126, 40], [112, 80]].map(T), { closed: false, lw: 6, col: C.cream });

function drawFigure(ctx, tp) {

  const nk = TF(14, 136), hc = [nk[0] + hu[0] * 62 + hf[0] * 8, nk[1] + hu[1] * 62 + hf[1] * 8], HS = 1.18;

  ink(ctx, [HF(-14, 76), HF(-8, 50)], { closed: false, lw: 4 * lw }); ink(ctx, [HF(18, 80), HF(16, 54)], { closed: false, lw: 4 * lw });
}
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];

// ---------------- comic marks ----------------
function squiggle(ctx, x0, y0, len, amp, ph, lw = 4.5) {   // a "~~~~" line ending in a tiny circle
  const pts = []; for (let i = 0; i <= 14; i++) { const u = i / 14; pts.push([x0 + u * len, y0 + Math.sin(u * 3.2 * TAU + ph) * amp * (.5 + .5 * u)]); }
  ink(ctx, pts, { closed: false, lw, step: 8 });
  ctx.lineWidth = 3.5; ctx.strokeStyle = C.ink; const c = wob([x0 + len + 14, y0]); ctx.beginPath(); ctx.arc(c[0], c[1], 4.5, 0, TAU); ctx.stroke();
}
function sparkle(ctx, x, y, r, a, glowA = .7) {
  if (a <= .01) return; glow(ctx, x, y, r * 2.6, a * glowA);
  ctx.save(); ctx.globalAlpha = a; ink(ctx, spark4(x, y, r), { fill: C.yel, lw: 3.2, smooth: false, raw: true, amp: .8, mx: 1.5, my: 1 }); ctx.restore();
}
const SPARKS = [[160, 1060, 26, .0], [930, 1220, 22, .35], [720, 1600, 18, .7], [120, 1380, 16, .2]];   // scattered, from frame 0
const NEAR = [[680, 620, 20, .1], [985, 700, 24, .5], [1010, 1000, 16, .8], [770, 560, 14, .3], [600, 790, 15, .6]];

// ---------------- scene ----------------
function cloud(ctx, x, y, s, seed) {   // flat cream cloud, ragged print edge, no line
  const r = rng(seed), pts = []; const n = 30;
  for (let i = 0; i < n; i++) { const a = i / n * TAU, rx = 210 * s, ry = 52 * s; const k = 1 + .18 * Math.sin(a * 3 + seed) + .1 * Math.sin(a * 7 + seed * 2);
    pts.push([x + Math.cos(a) * rx * k * (1 + .2 * (r() - .5)), y + Math.sin(a) * ry * k * (Math.sin(a) > 0 ? .6 : 1.15)]); }
  ink(ctx, pts, { fill: C.cream, lw: 0, mx: 0, my: 0, amp: 1.2 });
}
function panel(ctx, tp, look) {   // inset: the face in close-up
  const x0 = 86, y0 = 548, w = 450, h = 262;
  const rect = [[x0, y0], [x0 + w, y0], [x0 + w, y0 + h], [x0, y0 + h]];
  const path = pathOf(resample(rect, true, 16).map(p => wob(p, 1.6)), true, false);
  ctx.save(); ctx.fillStyle = C.panel; ctx.fill(path); ctx.clip(path);
  // light from the right once it looks up
  glow(ctx, x0 + w + 20, y0 + 60, 260, ss(B.look, B.look + .4, tp) * .9);
  const lk = eio(ss(B.look, B.look + .45, tp)), rel = ss(B.drop + .1, B.drop + .7, tp);
  const ang = lerp(.5, -.22, lk) + rel * .08, hc = [x0 + 250 + lk * 10, y0 + 146 - lk * 14];
  const hu = [Math.sin(ang), -Math.cos(ang)], hf = [Math.cos(ang), Math.sin(ang)], HF = (u, v) => [hc[0] + 1.6 * (u * hf[0] + v * hu[0]), hc[1] + 1.6 * (u * hf[1] + v * hu[1])];
  // shoulder + sweater + strap (strap gone after the drop)
  ink(ctx, [[x0 + 40, y0 + h + 30], [x0 + 66, y0 + 236], [x0 + 150, y0 + 206], [x0 + 260, y0 + 204], [x0 + 336, y0 + 230], [x0 + 360, y0 + h + 30]], { fill: C.cream, lw: 7 });
  if (tp < B.drop + .1) { const st = [[x0 + 120, y0 + h + 20], [x0 + 136, y0 + 214], [x0 + 104, y0 + 170]]; ink(ctx, st, { closed: false, lw: 26 }); ink(ctx, st, { closed: false, lw: 12, col: C.cream }); }
  // bundle edge behind, toned
  if (tp < B.drop + .1) ink(ctx, [[x0 - 20, y0 + 20], [x0 + 64, y0 + 40], [x0 + 104, y0 + 130], [x0 + 96, y0 + 250], [x0 - 20, y0 + 270]], { fill: C.cream, tone: tone(ctx, TONE, x0, y0), lw: 7 });
  const face = [[-52, -20], [-56, 16], [-44, 46], [-14, 58], [24, 54], [46, 36], [56, 10], [64, 2], [58, -10], [52, -26], [34, -46], [0, -52], [-34, -44]].map(q => HF(q[0], q[1]));
  ink(ctx, face, { fill: C.cream, lw: 7 });
  beanie(ctx, HF, tone(ctx, TONE_D, x0, y0), 1.15);
  // yellow light on the face side (overprint)
  if (lk > 0) { ctx.save(); ctx.globalAlpha = .2 * lk; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = C.yel; ctx.fill(pathOf(face)); ctx.restore(); }
  ink(ctx, [HF(-30, -2), HF(-40, -12), HF(-34, -28), HF(-24, -22)], { closed: false, lw: 6 });
  if (lk < .5) { ink(ctx, [HF(20, -6), HF(31, -14), HF(42, -9)], { closed: false, lw: 6 });
    // sweat drop + gloom lines
    const sd = HF(-30, 64); ink(ctx, [[sd[0] - 30, sd[1] - 6], [sd[0] - 22, sd[1] - 26], [sd[0] - 14, sd[1] - 6], [sd[0] - 22, sd[1] + 2]], { fill: C.cream, lw: 4.5, step: 6 });
    for (let i = 0; i < 3; i++) { const q = HF(-10 + i * 22, 98); ink(ctx, [[q[0], q[1] - 4], [q[0] + 2, q[1] + 22]], { closed: false, lw: 4.5 }); } }
  else { const e = HF(32, -9); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(e[0], e[1], 12, 14, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = C.yelL; ctx.beginPath(); ctx.arc(e[0] + 4, e[1] - 5, 4.2, 0, TAU); ctx.fill();
    // surprise ticks
    const tk = ss(B.look + .15, B.look + .3, tp) * (1 - ss(B.drop - .3, B.drop, tp));
    if (tk > 0) for (let i = 0; i < 3; i++) { const an = -1.1 + i * .45, c = HF(70, 40); ctx.save(); ctx.globalAlpha = tk;
      ink(ctx, [[c[0] + Math.cos(an) * 26, c[1] + Math.sin(an) * 26], [c[0] + Math.cos(an) * 58, c[1] + Math.sin(an) * 58]], { closed: false, lw: 5 }); ctx.restore(); } }
  const mo = rel > .3 ? [HF(38, -34), HF(46, -39), HF(53, -32)] : lk > .5 ? ell(...HF(44, -34), 5, 6) : [HF(38, -36), HF(50, -34)];
  ink(ctx, mo, { closed: lk > .5 && rel <= .3, lw: 5 });
  // sparkle in the panel
  const sp = ss(B.look + .1, B.look + .35, tp); if (sp > 0) { const tw = .75 + .25 * Math.sin(tp * 9); sparkle(ctx, x0 + w - 48, y0 + 64, 24 * sp * tw, 1); sparkle(ctx, x0 + w - 40, y0 + 168, 13 * sp, 1); }
  ctx.restore();
  ctx.lineWidth = 6; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.stroke(path);
}

function draw(ctx, t) {
  const tp = t12(t); K = Math.round(tp * 12);
  ctx.drawImage(BG, 0, 0);
  // clouds drift a little
  const dr = tp * 4;
  cloud(ctx, 860 + dr, 210, 1.05, 3); cloud(ctx, 980 + dr * .6, 330, .38, 9); cloud(ctx, 150 - dr * .5, 1700, .95, 5); cloud(ctx, 420 - dr * .5, 1790, .3, 11);
  // the star ahead: hidden, pops up on twos at "look", then breathes
  const sA = ss(B.look - .05, B.look + .1, tp), pop = tp < B.look ? 0 : (() => { const k = (tp - B.look) / .32; return k >= 1 ? 1 : 1 + Math.sin(k * Math.PI) * .28 - (1 - k) * (1 - k) * .9; })();
  const sx = 870, sy = 770;
  if (pop > 0) {
    const br = 1 + .05 * Math.sin((tp - B.look) * 4.4);
    glow(ctx, sx, sy, 330 * br, .85 * sA); glow(ctx, sx, sy, 170, .9 * sA);
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(-.14 + .04 * Math.sin(tp * 3)); ctx.scale(pop, pop);
    ink(ctx, star5(0, 0, 96, 50), { fill: C.yel, lw: 6.5, smooth: false, step: 12 });
    // rounded print highlight
    ink(ctx, [[-30, -18], [-12, -34]], { closed: false, lw: 0 });
    ctx.restore();
    // squiggle trails toward it + twinkles
    const q = ss(B.look + .2, B.look + .5, tp);
    ctx.save(); ctx.globalAlpha = q; squiggle(ctx, 610, 700, 110, 9, K * .7); squiggle(ctx, 900, 1010, 80, 8, K * .7 + 2); ctx.restore();
    NEAR.forEach(([x, y, r, o], i) => { const ap = ss(B.look + .1 + i * .07, B.look + .25 + i * .07, tp), tw = .55 + .45 * Math.abs(Math.sin(tp * 3.1 + o * 6));
      sparkle(ctx, x, y, r * tw * ap, ap); });
  }
  SPARKS.forEach(([x, y, r, o]) => { const tw = .45 + .55 * Math.abs(Math.sin(tp * 2.4 + o * 7)); sparkle(ctx, x, y, r * tw, 1, .55); });
  // ground hints
  ink(ctx, [[200, G + 6], [270, G + 4]], { closed: false, lw: 5 }); ink(ctx, [[700, G + 5], [800, G + 7]], { closed: false, lw: 5 }); ink(ctx, [[835, G + 6], [860, G + 6]], { closed: false, lw: 5 });
  ctx.save(); ctx.translate(540, G); ctx.scale(FS, FS); ctx.translate(-540, -G); LWK = 1 / FS * 1.08; TS = 1 / FS;
  const p = drawFigure(ctx, tp);
  // effort marks while trudging: heel puffs and "///"
  if (p.walking) {
    for (const off of [0, .5]) { const ph = ((p.ph + off) % 1 + 1) % 1; if (ph < .18) { const fx = p.hip[0] + D * STANCE / 2 + 8 - ph / STANCE * D * STANCE, k = ph / .18;
      ink(ctx, ell(fx - 44 - k * 20, G - 8 - k * 8, 10 + k * 6, 7 + k * 4), { fill: C.cream, lw: 4, step: 8, amp: 1.2 });
      ink(ctx, ell(fx + 50 + k * 18, G - 6 - k * 6, 7 + k * 4, 5 + k * 3), { fill: C.cream, lw: 4, step: 8, amp: 1.2 }); } }
    ctx.save(); ctx.globalAlpha = 1; squiggle(ctx, p.hip[0] - 300, p.hip[1] - 210, 70, 7, K * .9, 4); squiggle(ctx, p.hip[0] - 320, p.hip[1] - 120, 50, 6, K * .9 + 1, 4); ctx.restore();
  }
  // sweat drops beside the head while sagging
  const sw = ss(B.stop, B.stop + .2, tp) * (1 - ss(B.look, B.look + .2, tp));
  if (sw > 0) { const hx = p.hip[0] + 150, hy = p.hip[1] - 250; ctx.save(); ctx.globalAlpha = sw;
    for (const [dx, dy, s] of [[0, 0, 1], [30, 30, .7]]) ink(ctx, [[hx + dx, hy + dy - 22 * s], [hx + dx + 9 * s, hy + dy], [hx + dx, hy + dy + 8 * s], [hx + dx - 9 * s, hy + dy]], { fill: C.cream, lw: 4, step: 6 });
    ctx.restore(); }
  // impact marks + little stars when the bundle lands
  const land = B.drop + .26, im = tp >= land ? 1 - ss(land + .35, land + .7, tp) : 0;
  if (im > 0) { const cx = pose(B.drop).hip[0] - 205, k = ss(land, land + .2, tp);
    ctx.save(); ctx.globalAlpha = im;
    for (const [an, r0] of [[-2.6, 130], [-2.2, 120], [-.95, 125], [-.55, 132], [-3.0, 135]]) ink(ctx, [[cx + Math.cos(an) * (r0 + k * 20), G - 40 + Math.sin(an) * (r0 * .5 + k * 10)], [cx + Math.cos(an) * (r0 + 40 + k * 30), G - 40 + Math.sin(an) * (r0 * .5 + 20 + k * 14)]], { closed: false, lw: 5 });
    ink(ctx, ell(cx - 130 - k * 30, G - 14, 16 + k * 8, 11 + k * 5), { fill: C.cream, lw: 4.5, step: 8 }); ink(ctx, ell(cx + 128 + k * 30, G - 12, 14 + k * 8, 10 + k * 5), { fill: C.cream, lw: 4.5, step: 8 });
    ctx.restore();
    for (const [dx, dy, r, d] of [[-60, -190, 18, 0], [40, -210, 14, .08], [110, -160, 12, .14]]) { const a = ss(land + d, land + d + .1, tp) * (1 - ss(B.hold[1] - .6, B.hold[1] - .1, tp)); sparkle(ctx, cx + dx, G + dy - k * 20, r, a); }
  }
  // relief breath puff after the drop
  const bp = ss(B.drop + .5, B.drop + .7, tp) * (1 - ss(B.drop + 1.1, B.drop + 1.4, tp));
  if (bp > 0) { const px = p.hip[0] + 140, py = p.hip[1] - 222, k = ss(B.drop + .5, B.drop + 1.3, tp);
    ctx.save(); ctx.globalAlpha = bp; ink(ctx, ell(px + k * 40, py + 6 - k * 6, 26 + k * 12, 14 + k * 5), { fill: C.cream, lw: 4.5, step: 9 }); ink(ctx, ell(px + 70 + k * 60, py - 2 - k * 10, 10, 7), { fill: C.cream, lw: 4, step: 6 }); ctx.restore(); }
  ctx.restore(); LWK = 1; TS = 1;
  panel(ctx, tp, p.look);
  // caption: black ink, handwritten
  Story.captions(ctx, t, S.lines, { font: "'Gaegu',cursive", weight: 700, size: 70, y: 405, color: C.ink, shadow: 'rgba(0,0,0,0)', shadowBlur: 0 });
  // print grain over everything (static, like paper)
  ctx.drawImage(GRAIN, 0, 0);
}

Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 70px 'Gaegu'"], init, draw });
</script>
