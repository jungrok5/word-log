<script>
/* 20 — neon night anime. A starry violet night with painterly clouds; a schoolgirl (pink→violet bob, sailor uniform) in a
   3/4 waist-up shot, carrying a long wooden cross on her far shoulder, held by her hand. Clean variable-width plum line art
   (every line is a tapered polygon), flat cel colour with one hard shadow tone, big layered anime eyes (iris gradient,
   pupil, two highlights, heavy lash line with a wing). Glowing neon paint drips on hair, cheek, hand and collar (bloom on a
   quarter-res buffer). She trudges (bob, hair lag, parallax clouds), stops, looks up as a light flickers on ahead like a
   neon tube (a warm star flare + rim light on her), the cross slips off and falls out of frame (thud, shake, neon splash),
   then she breathes while stars twinkle and the drips pulse. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng, fbm, noise } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const FONT = "'Do Hyeon',sans-serif";
const C = {
  line: '#3d1840', lineD: '#24092b',
  skin: '#fbd3d3', skinS: '#dca3c8', skinD: '#b07cb8', blush: '255,104,160',
  hairA: '#ffa6cf', hairB: '#f483bd', hairC: '#9a72ee', hairD: '#5e55cf', hairS: '#7b56c9', hairH: '#ffd6ea',
  shirt: '#ece4fb', shirtS: '#a597dc', shirtD: '#7c6cc4', navy: '#262a63', navyS: '#171a45', stripe: '#e9e2ff',
  scarf: '#ff3f8f', scarfS: '#c41f6e',
  neon: '#ff2fd2', neonL: '#ff9cf2', neonG: '255,60,220',
  wood: '#9a6238', woodS: '#62391f', woodD: '#45240f', woodL: '#c48650', grain: '#5a3018',
};

// ---------------- curve + ink helpers ----------------
// Catmull-Rom through points; a point [x, y, 1] is a sharp corner (hair tips).
function crSample(pts, closed, seg = 8) {
  const n = pts.length, out = [], g = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  const m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    const a0 = p1[2] ? p1 : p0, a3 = p2[2] ? p2 : p3;
    for (let k = 0; k < seg; k++) {
      const t = k / seg, t2 = t * t, t3 = t2 * t;
      const f = (q0, q1, q2, q3) => .5 * (2 * q1 + (-q0 + q2) * t + (2 * q0 - 5 * q1 + 4 * q2 - q3) * t2 + (-q0 + 3 * q1 - 3 * q2 + q3) * t3);
      // corners: use the corner point itself as the outside neighbour (tangent points at the neighbour)
      const b0 = p1[2] ? [2 * p1[0] - p2[0], 2 * p1[1] - p2[1]] : p0, b3 = p2[2] ? [2 * p2[0] - p1[0], 2 * p2[1] - p1[1]] : p3;
      out.push([f(b0[0], p1[0], p2[0], b3[0]), f(b0[1], p1[1], p2[1], b3[1])]);
    }
  }
  if (!closed) out.push([g(n - 1)[0], g(n - 1)[1]]);
  return out;
}
function shape(ctx, pts, closed = true) {   // smooth path (bezier) through points
  const n = pts.length, g = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  const m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    const k1 = p1[2] ? 0 : 1 / 6, k2 = p2[2] ? 0 : 1 / 6;
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) * k1, p1[1] + (p2[1] - p0[1]) * k1, p2[0] - (p3[0] - p1[0]) * k2, p2[1] - (p3[1] - p1[1]) * k2, p2[0], p2[1]);
  }
  if (closed) ctx.closePath();
}
const tip = (u, a = .18, b = .18) => Math.min(1, u / a, (1 - u) / b);
// a tapered ink stroke: wf(u) gives the width along the curve (u 0..1)
function ink(ctx, pts, wf, col = C.line, seg = 8) {
  const s = crSample(pts, false, seg), n = s.length; if (n < 2) return;
  const L = [0]; for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(s[i][0] - s[i - 1][0], s[i][1] - s[i - 1][1]));
  const tot = L[n - 1] || 1, lt = [], rt = [];
  for (let i = 0; i < n; i++) {
    const a = s[Math.max(0, i - 1)], b = s[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
    const w = Math.max(0, wf(L[i] / tot)) / 2, nx = -dy / d * w, ny = dx / d * w;
    lt.push([s[i][0] + nx, s[i][1] + ny]); rt.push([s[i][0] - nx, s[i][1] - ny]);
  }
  ctx.beginPath(); ctx.moveTo(lt[0][0], lt[0][1]);
  for (let i = 1; i < n; i++) ctx.lineTo(lt[i][0], lt[i][1]);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(rt[i][0], rt[i][1]);
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
const W1 = (w, a = .2, b = .2) => u => w * tip(u, a, b);                 // even line, tapered ends
const WP = (w0, w1, a = .15, b = .15) => u => lerp(w0, w1, u) * tip(u, a, b);
function outline(ctx, pts, w, col = C.line) {   // closed outline as a tapered loop (slight swell)
  ink(ctx, [...pts, pts[0], pts[1]], u => w * (.75 + .35 * Math.sin(u * TAU * 2 + 1)), col, 6);
}
function ell(ctx, x, y, rx, ry, r = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), r, 0, TAU); }
function radial(ctx, x, y, r, stops) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function linear(ctx, x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function ik(sx, sy, tx, ty, l1, l2, bend) {   // two-bone IK: returns elbow; bend = ±1 picks the side
  let dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy); const dd = clamp(d, Math.abs(l1 - l2) + 1, l1 + l2 - .5);
  const a = Math.atan2(dy, dx), c = clamp((l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd), -1, 1), b = Math.acos(c);
  const ang = a + bend * b; return [sx + Math.cos(ang) * l1, sy + Math.sin(ang) * l1, sx + Math.cos(a) * dd, sy + Math.sin(a) * dd];
}

// ---------------- timing ----------------
const walkK = t => 1 - ss(2.2, 2.75, t);
const STEP = .62;   // seconds per step (a trudge)
function phaseAt(t) {   // integrated walk phase: slows to a stop
  const t1 = 2.2, t2 = 2.75; if (t <= t1) return t / STEP * Math.PI;
  const u = Math.min(t, t2) - t1, T = t2 - t1; return (t1 + u - u * u / (2 * T)) / STEP * Math.PI;
}
const lightK = t => {   // neon ignition: flicker 3.0–3.35, then steady (and a slow breath)
  if (t < 3.0) return 0;
  const u = t - 3.0; let k = ss(0, .5, u);
  if (u < .45) { const f = [1, .1, .9, 0, .7, .2, 1, .35, 1][Math.floor(u / .05)] ?? 1; k = Math.max(.15, f) * (.6 + .4 * ss(0, .4, u)); }
  return k * (1 - .25 * ss(5.35, 6.0, t)) * (1 + .03 * Math.sin(t * 7.3));
};
const DROP = B.drop, IMPACT = DROP + .34;
const AX = 486, AY = 1236, K = 1.3;   // the character's anchor (neck base) and scale: a waist-up shot
const charXform = c => { c.translate(AX, AY); c.scale(K, K); c.translate(-AX, -AY); };
const LX = 880, LY = 640;   // the light ahead (screen space)

// ---------------- prebuilt textures ----------------
let SKY, CL1, CL2, GRAIN, STARS, GL, GX, GB, GBX, GT, GTX, GW, GWX;
const GS = .25;
function buildClouds(w, h, seed, opt) {
  const c = Pilot.canvas(w, h), x = c.getContext('2d'), d = x.createImageData(w, h), D = d.data;
  const dens = new Float32Array(w * h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const nx = i / opt.sx, ny = j / opt.sy;
    // tileable horizontally: blend two samples across the seam
    const k = i / w, a = fbm(nx + seed, ny + seed * .7, 5), b = fbm(nx - w / opt.sx + seed, ny + seed * .7, 5);
    let v = a * (1 - k) + b * k;
    const band = opt.band(j / h); v = v * .9 + band - .5;
    dens[j * w + i] = v;
  }
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const v = dens[j * w + i], up = dens[Math.max(0, j - 7) * w + Math.max(0, i - 3)];
    const al = clamp((v - opt.th) / .06), lit = clamp((v - up) * 26 + .1) * (.5 + .5 * clamp((opt.th + .14 - v) / .14));
    const col = Pilot.mix(opt.dark, opt.lite, lit), p = (j * w + i) * 4;
    D[p] = col[0]; D[p + 1] = col[1]; D[p + 2] = col[2]; D[p + 3] = 255 * al * opt.alpha;
  }
  x.putImageData(d, 0, 0); return c;
}
async function init() {
  // sky gradient + stars
  SKY = Pilot.canvas(W, H); const sx = SKY.getContext('2d');
  sx.fillStyle = linear(sx, 0, 0, 0, H, [[0, '#050620'], [.35, '#0d0f36'], [.7, '#1d1a52'], [1, '#2e2366']]); sx.fillRect(0, 0, W, H);
  const r = rng(20);
  STARS = []; for (let i = 0; i < 420; i++) { const y = Math.pow(r(), 1.3) * 1500; STARS.push([r() * W, y, .5 + Math.pow(r(), 6) * 2.6, r() * TAU, .6 + r() * 2.5]); }
  // two painterly cloud layers (wide, tile horizontally; scrolled for parallax)
  CL1 = buildClouds(760, 480, 3.1, { sx: 150, sy: 70, th: .44, band: v => .5 - .35 * Math.abs(v - .55) * 2, dark: [34, 34, 92], lite: [120, 110, 210], alpha: .9 });
  CL2 = buildClouds(760, 480, 9.7, { sx: 110, sy: 55, th: .42, band: v => .38 + .5 * ss(.3, 1, v), dark: [18, 18, 60], lite: [96, 88, 190], alpha: 1 });
  // grain
  GRAIN = Pilot.speckle(256, 256, 40, 7);
  GL = Pilot.canvas(W * GS, H * GS); GX = GL.getContext('2d');
  GB = Pilot.canvas(W * GS, H * GS); GBX = GB.getContext('2d'); GT = Pilot.canvas(W * GS, H * GS); GTX = GT.getContext('2d'); GW = Pilot.canvas(W * GS, H * GS); GWX = GW.getContext('2d');
}

// ---------------- pose ----------------
function poseCore(t) {
  const wk = walkK(t), ph = phaseAt(t);
  let bob = 8 * wk * Math.cos(2 * ph) + 4 * wk, sway = 5 * wk * Math.sin(ph);
  const stopSag = ss(B.stop - .1, B.stop + .35, t) * (1 - ss(3.0, 3.6, t));
  bob += 10 * stopSag;
  // relief after the drop: shoulders rise, overshoot, settle; then breathing
  const rel = t > DROP ? (1 - Math.exp(-(t - DROP) * 5) * Math.cos((t - DROP) * 9)) : 0;
  bob -= 12 * rel - 4 * ss(DROP + .6, DROP + 1.2, t);
  const br = ss(DROP + .5, DROP + 1.0, t) * Math.sin((t - DROP - .5) * TAU / 1.6);
  bob += 3 * br;
  const look = eio(ss(B.look - .1, B.look + .55, t));
  // head: tilted down (weary) → up toward the light; small lag on the walk bob
  const headRot = lerp(.07 + .02 * Math.sin(ph * 2 + .6) * wk + .03 * stopSag, -.11, look) + .02 * Math.sin((t - DROP) * 2.2) * ss(DROP, DROP + .6, t);
  const headDy = -3 * wk * Math.cos(2 * ph - .5) + lerp(6, -10, look);
  const N = [AX + sway, AY + bob];
  // far shoulder sinks under the cross while carrying
  const carry = 1 - ss(DROP, DROP + .25, t);
  return { t, wk, ph, bob, sway, N, look, headRot, headDy, carry, rel, br, stopSag };
}
// the last second eases the body back toward frame 0 (the loop cross-fade then joins near-identical poses)
const RET = t => ss(5.0, 5.95, t);
function pose(t) {
  const p = poseCore(t), k = RET(t); if (k <= 0) return p;
  const q = poseCore(0);
  p.N = [lerp(p.N[0], q.N[0], k), lerp(p.N[1], q.N[1], k)]; p.headRot = lerp(p.headRot, q.headRot, k); p.headDy = lerp(p.headDy, q.headDy, k);
  return p;
}
// eyes: weary half-lid → open on the look; a blink while walking and one after the drop
function eyeState(t) { const e = eyeCore(t), k = RET(t); if (k <= 0) return e; const q = eyeCore(0);
  for (const key of ['open', 'lx', 'ly', 'wide']) e[key] = lerp(e[key], q[key], k); return e; }
function eyeCore(t) {
  const look = ss(B.look - .05, B.look + .35, t);
  let open = lerp(.72, 1, look);
  const blink = (a, d = .16) => { const u = (t - a) / d; return u > 0 && u < 1 ? Math.sin(Math.PI * u) : 0; };
  open *= 1 - blink(1.35) - blink(DROP + .75, .2);
  open = Math.max(0, open - .08 * ss(DROP + .9, DROP + 1.3, t) * (1 - ss(5.5, 6, t)));
  const lx = lerp(.15, .45, look), ly = lerp(.32, -.55, look) + .2 * ss(DROP + .8, DROP + 1.4, t);
  return { open, lx, ly, wide: look };
}

// ---------------- the cross ----------------
const BEAM_W = 58, BAR_W = 54;
function crossGeom(P, t) {
  // rests on the far shoulder; the back end drags on the ground far below-left (pivot)
  const N = P.N, rest = [N[0] + 128, N[1] + 6 + 10 * P.carry];
  const pv = [N[0] - 760, N[1] + 700];
  let a = Math.atan2(rest[1] - pv[1], rest[0] - pv[0]);
  let slide = 0;
  if (t > DROP) { const u = t - DROP; const fall = Math.min(u, IMPACT - DROP); a += 1.25 * fall * fall * 7.5; slide = 240 * fall * fall * 6;
    if (t > IMPACT) { const v = t - IMPACT; a += .03 * Math.exp(-v * 8) * Math.sin(v * 30); } }
  const dist = Math.hypot(rest[0] - pv[0], rest[1] - pv[1]) - slide;
  return { pv, a, dist };   // beam point at s (from the shoulder rest point) = pv + (dist + s)·dir
}
function beamPt(G, s) { return [G.pv[0] + Math.cos(G.a) * (G.dist + s), G.pv[1] + Math.sin(G.a) * (G.dist + s)]; }
const JUNC = 176, TOP = 262, BAR = 140;
function drawCross(ctx, P, t, G) {
  ctx.save(); ctx.translate(G.pv[0], G.pv[1]); ctx.rotate(G.a); ctx.translate(G.dist, 0);
  // local: x along the beam (0 = shoulder rest point), y perpendicular (+ = down-right side)
  const hw = BEAM_W / 2, bw = BAR_W / 2, L = lightK(t);
  const woodBox = (x0, x1, y0, y1, ax) => {   // a beam: front face + a dark top side (thickness) + grain + rim
    const th = 14;
    ctx.fillStyle = C.woodD;
    if (ax) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + th * .5, y0 - th); ctx.lineTo(x1 + th * .5, y0 - th); ctx.lineTo(x1, y0); ctx.closePath(); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(x1, y0); ctx.lineTo(x1 + th, y0 - th * .4); ctx.lineTo(x1 + th, y1 - th * .4); ctx.lineTo(x1, y1); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = linear(ctx, 0, y0, 0, y1, [[0, C.woodL], [.18, C.wood], [.62, C.wood], [.64, C.woodS], [1, C.woodS]]);
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  };
  // long upright (from far behind to the top) and the crossbar at the junction
  woodBox(-1800, TOP, -hw, hw, true);
  ctx.save(); ctx.translate(JUNC, 0); ctx.rotate(-Math.PI / 2);
  woodBox(-BAR, BAR, -bw, bw, false);
  ctx.restore();
  // grain lines
  ctx.save(); ctx.beginPath(); ctx.rect(-1800, -hw, 1800 + TOP, BEAM_W); ctx.clip();
  const r = rng(5);
  for (let i = 0; i < 9; i++) { const y = -hw + 6 + r() * (BEAM_W - 12), x0 = -900 + r() * 700;
    ink(ctx, [[x0, y], [x0 + 300, y + (r() - .5) * 6], [x0 + 700, y + (r() - .5) * 8], [Math.min(TOP - 8, x0 + 1150), y + (r() - .5) * 6]], W1(1.6 + r() * 1.4, .3, .3), 'rgba(70,35,15,.55)'); }
  ell(ctx, 120, 6, 12, 5); ctx.strokeStyle = 'rgba(70,35,15,.6)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  // outline (ink)
  ctx.lineJoin = 'round'; ctx.strokeStyle = C.lineD; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(-1800, -hw); ctx.lineTo(JUNC - bw, -hw); ctx.lineTo(JUNC - bw, -hw - BAR + hw); ctx.lineTo(JUNC + bw, -hw - BAR + hw);
  ctx.lineTo(JUNC + bw, -hw); ctx.lineTo(TOP, -hw); ctx.lineTo(TOP, hw); ctx.lineTo(JUNC + bw, hw); ctx.lineTo(JUNC + bw, BAR); ctx.lineTo(JUNC - bw, BAR);
  ctx.lineTo(JUNC - bw, hw); ctx.lineTo(-1800, hw); ctx.stroke();
  // neon rim from the light ahead (upper right)
  if (L > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,120,200,${.55 * L})`;
    ctx.fillRect(JUNC + bw - 6, -BAR, 6, BAR - hw); ctx.fillRect(TOP - 6, -hw, 6, BEAM_W); ctx.fillRect(JUNC - bw, -BAR, BAR_W, 5); ctx.fillRect(JUNC + bw, -hw, TOP - JUNC - bw, 4);
    ctx.globalCompositeOperation = 'source-over'; }
  ctx.restore();
}

// ---------------- head ----------------
// head-local coords: origin ≈ centre of the face between the eyes, facing screen-right in 3/4.
const FACE = [[-118, -110], [-134, -40], [-136, 10], [-128, 56], [-106, 96], [-62, 128], [-6, 146], [30, 150, 1], [62, 128], [92, 98], [112, 62], [118, 36], [114, 14], [118, -20], [116, -80], [60, -140], [-40, -150]];
function hairGrad(ctx) { return linear(ctx, -170, -200, 170, 120, [[0, C.hairA], [.38, C.hairB], [.66, C.hairC], [1, C.hairD]]); }
const BACK_HAIR = (sw) => [[-40, -232], [-150, -200], [-218, -112], [-240, -10], [-236, 84], [-224, 158], [-206 + sw, 204, 1], [-184, 176], [-160 + sw * .8, 200, 1], [-120, 168], [-40, 176], [40, 184], [104 + sw * .3, 192, 1], [134, 156], [162 + sw * .4, 182, 1], [176, 90], [180, -30], [150, -142], [70, -222]];
function drawBackHair(ctx, P, sw) {
  const pts = BACK_HAIR(sw);
  shape(ctx, pts); ctx.fillStyle = linear(ctx, -200, -150, 160, 160, [[0, '#e070b0'], [.45, '#a660d0'], [1, '#4a3fae']]); ctx.fill();
  // inner shadow (underside of the bob)
  ctx.save(); shape(ctx, pts); ctx.clip();
  ctx.fillStyle = 'rgba(40,20,110,.45)'; shape(ctx, [[-230, 60], [-120, 110], [0, 130], [140, 100], [170, 200], [-240, 220]]); ctx.fill();
  ctx.restore();
  outline(ctx, pts, 4.2);
}
function drawFace(ctx, P, E, t) {
  // skin + one hard shadow tone (cheek away from the light, under the bangs, under the jaw)
  shape(ctx, FACE); ctx.fillStyle = C.skin; ctx.fill();
  ctx.save(); shape(ctx, FACE); ctx.clip();
  ctx.fillStyle = C.skinS;
  shape(ctx, [[-150, -150], [-132, -30], [-140, 60], [-110, 110], [-70, 150], [-120, 200], [-200, 100], [-200, -150]]); ctx.fill();   // near side (the back of the cheek) in shadow
  shape(ctx, [[-150, -120], [130, -120], [130, -52], [110, -52, 1], [94, -26], [72, -48, 1], [44, -18], [18, -42, 1], [-8, -24], [-30, -44, 1], [-50, -22], [-74, -46, 1], [-106, -22], [-150, -36]]); ctx.fill();   // cast by the bangs
  // soft lavender ambient on the shadow side + warm light on the far cheek when the light is on
  ctx.fillStyle = linear(ctx, -140, 0, 120, 0, [[0, 'rgba(150,110,220,.25)'], [.5, 'rgba(150,110,220,0)']]); ctx.fillRect(-160, -160, 300, 340);
  const L = lightK(t); if (L > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = radial(ctx, 150, -60, 230, [[0, `rgba(255,150,170,${.32 * L})`], [1, 'rgba(255,120,180,0)']]); ctx.fillRect(-160, -160, 320, 340); ctx.globalCompositeOperation = 'source-over'; }
  ctx.restore();
  ink(ctx, [[-134, 0], [-128, 52], [-106, 94], [-62, 128], [-6, 146], [30, 150]], WP(2.5, 4.6, .1, .05));
  ink(ctx, [[30, 150], [62, 128], [92, 98], [112, 62], [118, 38], [114, 16]], WP(4.6, 2.2, .05, .2));
  ink(ctx, [[114, 14], [117, -12], [116, -40]], W1(2.4));
  // blush: soft + hatching
  for (const [bx, by, s] of [[-48, 64, 1], [82, 64, .7]]) {

  ink(ctx, [[E0[0] - 26, E0[1] + 16], [E0[0], E0[1] + 22], [E0[0] + 20, E0[1] + 14]], W1(2, .3, .3), 'rgba(96,74,170,.6)');
}
const UA = 215, FA = 205;
function farJoints(P, hand) {   // IK with the elbow kept down and out (toward a pole), never up or across the chest
  const S0 = [134, 62 + 10 * P.carry];
  const A1 = ik(S0[0], S0[1], hand[0], hand[1], UA, FA, 1), A2 = ik(S0[0], S0[1], hand[0], hand[1], UA, FA, -1);
  const pole = [S0[0] + 150, S0[1] + 230], dd = A => Math.hypot(A[0] - pole[0], A[1] - pole[1]);
  return [S0, ...(dd(A1) <= dd(A2) ? A1 : A2)];
}
function wristOnBeam(P, t, G) { const gp = gripPoint(P, t, G), h = [gp.p[0] - P.N[0], gp.p[1] - P.N[1]]; return [h[0] - Math.sin(gp.a) * 74, h[1] + Math.cos(gp.a) * 74]; }
function farArmPose(P, t, G) {   // holding: IK to the grip; after letting go: the joint angles swing to hanging (FK — no elbow flips)
  if (t < DROP) return farJoints(P, wristOnBeam(P, t, G));
  const Pd = pose(DROP - 1e-3), Gd = crossGeom(Pd, DROP - 1e-3), [Sd, exd, eyd, wxd, wyd] = farJoints(Pd, wristOnBeam(Pd, DROP - 1e-3, Gd));
  const a1h = Math.atan2(eyd - Sd[1], exd - Sd[0]), a2h = Math.atan2(wyd - eyd, wxd - exd);
  const k = eio(ss(DROP + .06, DROP + .5, t)), wob = .1 * Math.exp(-(t - DROP - .5) * 5) * Math.sin((t - DROP - .5) * 11) * ss(DROP + .42, DROP + .5, t);
  const a1 = lerp(a1h, 1.42, k) + wob * .5, a2 = lerp(a2h, 1.53, k) + wob;
  const S0 = [134, 62 + 10 * P.carry], ex = S0[0] + Math.cos(a1) * UA, ey = S0[1] + Math.sin(a1) * UA;
  return [S0, ex, ey, ex + Math.cos(a2) * FA, ey + Math.sin(a2) * FA, k];
}
function drawFarArm(ctx, P, t, J) {
  const [S0, ex, ey, wx, wy] = J;
  const sl = sleeve(ctx, S0, [ex, ey], [wx, wy], 40, 38, 32);
  shape(ctx, sl); ctx.fillStyle = C.shirt; ctx.fill();
  ctx.save(); shape(ctx, sl); ctx.clip();
  ctx.fillStyle = C.shirtS; ctx.translate(ex, ey); ctx.fillRect(-10, -400, 80, 800); ctx.setTransform(ctx.getTransform());
  ctx.restore();
  // cuff
  const ang = Math.atan2(wy - ey, wx - ex);
  ctx.save(); ctx.translate(wx, wy); ctx.rotate(ang);
  ctx.fillStyle = C.navy; ctx.fillRect(-46, -33, 46, 66); ctx.fillStyle = C.stripe; ctx.fillRect(-38, -33, 4, 66);
  ctx.restore();
  outline(ctx, sl, 3.8);
  return [wx, wy, ang];
}
// the gripping hand, in beam-local coords: x along the beam (toward the top), y = perpendicular (+ down)
function drawGrip(ctx, open) {
  // the far hand closed round the beam: back of the hand below, four curled fingers over the front face, tips
  // disappearing over the top edge; the thumb is under the beam (only its tip shows at the bottom edge)
  const hw = BEAM_W / 2, lift = -open * 30;   // opening = the fingers straighten up off the beam
  const back = [[-40, hw + 48], [-44, hw + 4], [-30, 6], [40, 4], [46, hw + 2], [34, hw + 46]];
  shape(ctx, back); ctx.fillStyle = C.skin; ctx.fill();
  ctx.save(); shape(ctx, back); ctx.clip(); ctx.fillStyle = C.skinS; ctx.fillRect(-60, hw + 18, 120, 60); ctx.fillRect(18, -10, 40, 120); ctx.restore();
  outline(ctx, back, 3.2);
  // thumb tip under the beam (index side)
  const th = [[28, hw + 2], [44, hw], [52, hw + 9], [44, hw + 17], [28, hw + 14]];
  shape(ctx, th); ctx.fillStyle = C.skinS; ctx.fill(); outline(ctx, th, 2.4);
  for (let i = 0; i < 4; i++) {
    const x0 = 22 - i * 19 - (i ? 0 : -2), wv = i === 3 ? 14 : 17, top = -hw + 1 + lift - (i === 1 ? 4 : i === 2 ? 2 : 0) + (i === 3 ? 6 : 0);
    const f = [[x0, 14], [x0 - 1, -hw * .2 + lift * .4], [x0 + 1, top + 4], [x0 + wv * .5, top - 3], [x0 + wv - 1, top + 4], [x0 + wv + 1, -hw * .2 + lift * .4], [x0 + wv, 14]];
    shape(ctx, f); ctx.fillStyle = C.skin; ctx.fill();
    ctx.save(); shape(ctx, f); ctx.clip(); ctx.fillStyle = C.skinS; ctx.fillRect(x0 + wv * .64, -hw - 20, wv, 100); if (open < .5) ctx.fillRect(x0 - 2, top - 6, wv + 4, 12); ctx.restore();
    outline(ctx, f, 2.6);
    ink(ctx, [[x0 + 3, 2], [x0 + wv * .5, 5], [x0 + wv - 3, 2]], W1(1.7, .3, .3));        // knuckle crease
    ink(ctx, [[x0 + 4, top + 12], [x0 + wv * .5, top + 14], [x0 + wv - 4, top + 12]], W1(1.4, .3, .3));   // where it curls over
  }
}
// ---------------- sky + light ----------------
let scrollX = 0;
function drawSky(ctx, t, P, L) {
  ctx.drawImage(SKY, 0, 0);
  // stars (twinkle)
  for (const [x, y, s, ph, sp] of STARS) {
    const tw = .55 + .45 * Math.sin(t * sp + ph), xx = ((x - scrollX * .05) % W + W) % W;
    ctx.fillStyle = `rgba(235,235,255,${.35 + .6 * tw})`; ctx.fillRect(xx, y, s, s);
    if (s > 2.2) { ctx.fillStyle = `rgba(220,220,255,${.25 * tw})`; ctx.fillRect(xx - s * 1.5, y + s / 2 - .5, s * 4, 1); ctx.fillRect(xx + s / 2 - .5, y - s * 1.5, 1, s * 4); }
  }
  // the light ahead (behind the clouds): warm core + magenta halo
  if (L > 0) {
    const lx = LX, ly = LY;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = radial(ctx, lx, ly, 700, [[0, `rgba(255,120,190,${.45 * L})`], [.4, `rgba(170,60,200,${.18 * L})`], [1, 'rgba(80,20,140,0)']]); ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  // clouds: far layer slow, near layer faster (parallax while walking); lit underside when the light is on
  const draw = (img, y, h, sp, lit) => {
    const w = img.width * (h / img.height), x0 = -((scrollX * sp) % w + w) % w;
    for (let x = x0; x < W; x += w) ctx.drawImage(img, x, y, w + 1, h);
  };
  draw(CL1, 120, 1100, .25 + 0 * t);
  draw(CL2, 760, 1300, .6);
}
function drawFlare(ctx, L, t) {   // the light itself (a four-point anime star) — drawn into main and glow
  if (L <= 0) return;
  const lx = LX, ly = LY;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = radial(ctx, lx, ly, 160, [[0, `rgba(255,250,235,${L})`], [.15, `rgba(255,200,170,${.8 * L})`], [.5, `rgba(255,90,200,${.35 * L})`], [1, 'rgba(255,60,200,0)']]);
  ctx.fillRect(lx - 160, ly - 160, 320, 320);
  const rays = [[0, 330, 7], [Math.PI / 2, 260, 6], [.78, 120, 3], [-.78, 120, 3]];
  for (const [a, len, w] of rays) {
    ctx.save(); ctx.translate(lx, ly); ctx.rotate(a);
    ctx.fillStyle = linear(ctx, -len, 0, len, 0, [[0, 'rgba(255,120,210,0)'], [.5, `rgba(255,240,240,${.9 * L})`], [1, 'rgba(255,120,210,0)']]);
    ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(0, -w); ctx.lineTo(len, 0); ctx.lineTo(0, w); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

// ---------------- character (into CX) ----------------
function headXform(ctx, P) {
  const N = P.N, pv = [N[0] + 6, N[1] - 120];
  ctx.translate(pv[0], pv[1]); ctx.rotate(P.headRot); ctx.translate(-pv[0], -pv[1]);
  ctx.translate(N[0] + 24, N[1] - 244 + P.headDy);
}
function gripPoint(P, t, G) {   // where the hand is: on the beam while holding, then it drops to the side
  if (t < DROP) return { p: beamPt(G, 92), k: 0, a: G.a };
  // let go: the open hand stays where it was (the beam slides away under it), then the arm drops to the side
  const P0 = pose(DROP), G0 = crossGeom(P0, DROP), on = beamPt(G0, 92), hang = [P.N[0] + 168, P.N[1] + 440];
  on[0] += P.N[0] - P0.N[0]; on[1] += P.N[1] - P0.N[1];
  return { p: on, k: 0, a: G0.a };
}
function drawCharacter(ctx, P, t, G) {
  const N = P.N, wind = Math.sin(t * 2.1) * .6 + Math.sin(t * 3.3 + 1) * .4;
  const sw = -P.sway * .8 + 6 * Math.sin(P.ph * 2 - .9) * P.wk + 5 * wind + 8 * (P.rel > 0 ? Math.exp(-(t - DROP) * 3) * Math.sin((t - DROP) * 8) : 0);
  // back hair (behind neck)
  ctx.save(); headXform(ctx, P); drawBackHair(ctx, P, sw); ctx.restore();
  // torso
  ctx.save(); ctx.translate(N[0], N[1]); drawTorso(ctx, P, t); bodyDrips(ctx, t, 'main'); ctx.restore();
  // far arm + hand
  const gp = gripPoint(P, t, G), J = farArmPose(P, t, G);
  ctx.save(); ctx.translate(N[0], N[1]);
  const [wx, wy, ang] = drawFarArm(ctx, P, t, J);
  ctx.restore();
  if (!(J[5] > .02)) { ctx.save(); ctx.translate(gp.p[0], gp.p[1]); ctx.rotate(gp.a); drawGrip(ctx, ss(DROP - .2, DROP, t)); drip(ctx, -10, 46, 8, 22, 'main'); ctx.restore(); }
  else { ctx.save(); ctx.translate(N[0] + wx, N[1] + wy); ctx.rotate(ang - Math.PI / 2); drawRelaxedHand(ctx); ctx.restore(); }
  // head
  const E = eyeState(t);
  ctx.save(); headXform(ctx, P); drawFace(ctx, P, E, t); drawFrontHair(ctx, P, t, sw, wind); drawBrows(ctx, E); drawClip(ctx); headDrips(ctx, t, 'main'); ctx.restore();
}
function drawRelaxedHand(ctx) {   // hanging hand, fingers loosely curled (local: +y = along the forearm, down)
  const h = [[-24, 0], [26, 0], [30, 40], [24, 78], [8, 92, 1], [-6, 80], [-18, 60], [-26, 30]];
  shape(ctx, h); ctx.fillStyle = C.skin; ctx.fill(); ctx.save(); shape(ctx, h); ctx.clip(); ctx.fillStyle = C.skinS; ctx.fillRect(-40, 0, 20, 100); ctx.restore(); outline(ctx, h, 3);
  ink(ctx, [[18, 46], [12, 70]], W1(1.8)); ink(ctx, [[4, 50], [0, 72]], W1(1.6));
}

// ---------------- frame ----------------
function draw(ctx, t) {
  const P = pose(t), L = lightK(t);
  // camera: slow push-in after the look; a thud at the impact
  let shx = 0, shy = 0; if (t > IMPACT) { const v = t - IMPACT, a = 16 * Math.exp(-v * 9); shx = a * Math.sin(v * 70); shy = a * Math.cos(v * 55); }

  drawSky(ctx, t, P, L);
  drawFlare(ctx, L, t);
  ctx.save(); ctx.translate(540 + shx, 1100 + shy); ctx.scale(z, z); ctx.translate(-540, -1100);
  charXform(ctx);

  drawCharacter(ctx, P, t, G);

  for (const [X, r] of [[GBX, 3], [GTX, 1], [GWX, 10]]) { X.setTransform(1, 0, 0, 1, 0, 0); X.clearRect(0, 0, GB.width, GB.height); X.filter = `blur(${r}px)`; X.drawImage(GL, 0, 0); X.filter = 'none'; }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1; ctx.drawImage(GB, 0, 0, W, H); ctx.globalAlpha = .7; ctx.drawImage(GT, 0, 0, W, H); ctx.globalAlpha = .55; ctx.drawImage(GW, 0, 0, W, H); ctx.restore();

  Story.captions(ctx, t, S.lines, { font: FONT, size: 82, weight: 400, y: 370, color: '#fff2fb', shadow: 'rgba(255,40,200,.95)', shadowBlur: 28 });

  ctx.fillStyle = radial(ctx, 540, 1000, 1250, [[.55, 'rgba(10,5,40,0)'], [1, 'rgba(8,4,30,.55)']]); ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .06; ctx.globalCompositeOperation = 'overlay';

  ctx.restore();
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 82px 'Do Hyeon'"], init, draw });
