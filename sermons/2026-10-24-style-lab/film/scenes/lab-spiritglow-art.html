<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스타일 실험 · 02 빛나는 영혼의 숲 (키 아트)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&display=swap">
</head>
<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* 02 key-art version — "the picture comes from an image model, the life comes from code".
   Background: an image-model repaint of lab-spiritglow's code painting (?plate=1, everything but me), registered back
   (scale 1.00, shift 0,0) so the code still knows every pool, figure and the far crowd.
   Me: two image-model drawings on #FF00FF (magenta, because the figure itself is cyan), keyed — wading bent under the
   sack (pose from the code figure, so the waterline and scale are known) and standing relieved, looking up. The sack is
   cut out of the first drawing (dark pixels connected to it, rope included) and falls as its own sprite.
   Code adds: wading (bob and rock on twos), the head lift (the head turned about the neck), the drawing swap, the sack
   splashing and sinking, every glow breathing (bloom from the drawing's own light), ripples, a wavering reflection,
   the far crowd flickering, the warm light ahead (the one accent), grain, the caption. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const WL = 1556, LIGHT = { x: 640, y: 1050 };
const POOL0 = [[250, 1470], [420, 1440], [560, 1452], [700, 1420], [880, 1440], [930, 1500], [900, 1590], [820, 1640], [660, 1660], [520, 1630], [360, 1650], [240, 1610], [210, 1540]];
const SPIRITS = [[800, 1592, 205], [690, 1606, 104], [560, 1342, 84], [405, 1240, 50], [478, 1238, 42], [720, 1248, 56], [856, 1250, 50], [250, 1158, 22], [610, 1152, 24], [660, 1150, 18], [880, 1166, 22]];
// drawing → scene: the drawing came from the code figure at 4.4 px/unit (crop + 1.28 resize); the scene shows it a bit larger
const K = .36, AX = 389, AY = 752, X0 = 300, FS = 1.75, WALK = 92, V = WALK / (B.stop - .3);
function distAt(t) { const a = B.stop - .6; if (t <= a) return V * t; const u = clamp((t - a) / .6); return V * a + V * .6 * (u - u * u / 2); }
const t12 = t => Math.floor(t * 12 + 1e-6) / 12;
const breathe = (t, ph, p = 3) => .5 + .5 * Math.sin(TAU * t / p + ph);
const IMG = {};
function load(name) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(IMG[name] = im); im.onerror = no; im.src = 'art/lab-spiritglow-' + name + '.webp'; }); }
function sprite(N, stops) { const c = Pilot.canvas(N, N), g = c.getContext('2d'), gr = g.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N / 2); for (const [o, col] of stops) gr.addColorStop(o, col); g.fillStyle = gr; g.fillRect(0, 0, N, N); return c; }
// the bloom of a drawing: only its light pixels, blurred (built once per drawing)
function bloomOf(img, blur) {
  const w = img.width / 4 | 0, h = img.height / 4 | 0, c = Pilot.canvas(w, h), g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h); for (let i = 0; i < d.data.length; i += 4) { const l = d.data[i] * .3 + d.data[i + 1] * .59 + d.data[i + 2] * .11; if (l < 120) d.data[i + 3] = 0; }
  g.putImageData(d, 0, 0); const c2 = Pilot.canvas(w, h), g2 = c2.getContext('2d'); g2.filter = `blur(${blur}px)`; g2.drawImage(c, 0, 0); return c2;
}
let HEAD = null, BODY = null, BLOOM_W = null, BLOOM_S = null, FIG = null, GLW = null, GLW_W = null, GRAIN = null, POOLP = null, TINY = [];
const HEADC = { x: 548, y: 338, rx: 66, ry: 74 }, PIVOT = [508, 404];
function splitHead() {
  const w = IMG.walk.width, h = IMG.walk.height, m = Pilot.canvas(w, h), g = m.getContext('2d');
  const gr = g.createRadialGradient(HEADC.x, HEADC.y, 8, HEADC.x, HEADC.y, HEADC.rx); gr.addColorStop(0, '#000'); gr.addColorStop(.8, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.translate(HEADC.x, HEADC.y); g.scale(1, HEADC.ry / HEADC.rx); g.translate(-HEADC.x, -HEADC.y); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.restore();
  HEAD = Pilot.canvas(w, h); const hg = HEAD.getContext('2d'); hg.drawImage(IMG.walk, 0, 0); hg.globalCompositeOperation = 'destination-in'; hg.drawImage(m, 0, 0);
  BODY = Pilot.canvas(w, h); const bg = BODY.getContext('2d'); bg.drawImage(IMG.walk, 0, 0); bg.globalCompositeOperation = 'destination-out'; bg.drawImage(m, 0, 0);
}
const SACK_C = [300, 470];
function pose(t) {
  const tq = t12(t), D = distAt(tq), ph = D / 40, stopK = ss(B.stop - .3, B.stop + .1, tq), swap = tq >= B.drop - .3 ? 1 : 0;
  const bob = (1 - stopK) * 7 * Math.abs(Math.sin(ph * Math.PI)) + 10 * ss(B.stop, B.stop + .3, tq) * (1 - swap) - Math.sin((tq - B.drop) * 2.6) * 5 * ss(B.drop + .3, B.drop + 1, tq);
  const rock = (1 - stopK) * Math.sin(ph * TAU) * .02 + .025 * ss(B.stop, B.stop + .3, tq) * (1 - swap);
  const lift = eio(clamp((tq - B.look) / .6)) * (1 - swap);
  const straighten = .08 * (1 - eo(clamp((tq - (B.drop - .3)) / .7)));
  return { tq, D, bob, rock, lift, swap, straighten };
}
function sackAt(P) {   // drawing-space offset/rotation of the sack sprite about its centre
  const t0 = B.drop - .3, u = clamp((P.tq - t0) / .3), v = clamp((P.tq - B.drop) / 1.8);
  if (P.tq < t0) return null;
  const land = [-140, 300];
  if (P.tq < B.drop) return { dx: lerp(-10, land[0], u), dy: lerp(10, land[1], u * u), a: lerp(-.1, -.6, u) };
  return { dx: land[0] - v * 10, dy: land[1] - Math.sin(clamp((P.tq - B.drop) / .45) * Math.PI) * 26 + eio(v) * 220, a: -.6 - v * .25, sunk: v };
}
function ripples(ctx, x, y, t, period, n, rmax, a, seedT = 0) {
  for (let k = 0; k < n; k++) { const age = ((t + seedT + k * period / n) % period) / period, R = 6 + age * rmax;
    ctx.strokeStyle = `rgba(200,255,240,${a * (1 - age) * ss(0, .15, age)})`; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.ellipse(x, y, R, R * .22, 0, 0, TAU); ctx.stroke(); }
}
const lightK = t => ss(B.look - .3, B.look + .6, t) * (1 - .05 * breathe(t, 0, .37));
function draw(ctx, t) {
  ctx.drawImage(IMG.bg, 0, 0);
  const lk = lightK(t), P = pose(t), glowUp = ss(B.drop, B.drop + 1.2, t);
  // the far crowd flickers; the warm light ahead
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const q of TINY) { const b = breathe(t, q.ph, q.p); ctx.globalAlpha = q.a * (.15 + .35 * b); ctx.drawImage(GLW, q.x - q.s * 1.6, q.y - q.s * 2.2, q.s * 3.2, q.s * 3.2); }
  ctx.restore();
  if (lk > 0) { ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = lk; ctx.drawImage(GLW_W, LIGHT.x - 340, LIGHT.y - 300, 680, 600);
    ctx.globalAlpha = lk * .9; ctx.drawImage(GLW_W, LIGHT.x - 70, LIGHT.y - 70, 140, 140);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = lk; ctx.drawImage(GLW_W, LIGHT.x - 16, LIGHT.y - 16, 32, 32);
    ctx.globalAlpha = lk * .5; ctx.drawImage(GLW_W, LIGHT.x - 160, 1138, 320, 26); ctx.restore(); }
  // every glow breathes; ripples run out from every figure
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, h] of SPIRITS) { const R = h * 1.4 + 30; ctx.globalAlpha = .1 + .12 * breathe(t, x * .01); ctx.drawImage(GLW, x - R, y - h * .55 - R * .8, 2 * R, 1.6 * R); }
  ctx.restore();
  for (const [x, y, h] of SPIRITS) if (h > 30) ripples(ctx, x, y + 1, t, 3, h > 150 ? 3 : 2, h * (h > 150 ? .85 : 1.4), .4, x * .013);
  // me: the drawing (or the swap), placed with its waterline on the pool
  const fc = FIG.getContext('2d'); fc.setTransform(1, 0, 0, 1, 0, 0); fc.clearRect(0, 0, FIG.width, FIG.height);
  const OX = 160, OY = 260, sx = X0 + P.D * FS - OX, sy = WL - OY;
  fc.translate(OX, OY); fc.scale(K, K); fc.translate(0, P.bob);
  if (!P.swap) { fc.rotate(P.rock); fc.translate(-AX, -AY); fc.drawImage(BODY, 0, 0); fc.save(); fc.translate(...PIVOT); fc.rotate(-.32 * P.lift); fc.translate(-PIVOT[0], -PIVOT[1]); fc.drawImage(HEAD, 0, 0); fc.restore(); }
  else { fc.rotate(P.straighten); fc.translate(-AX, -AY); fc.drawImage(IMG.stand, 0, 0); }
  fc.setTransform(1, 0, 0, 1, 0, 0);
  // reflection and sunk sack, clipped to the near pool
  ctx.save(); ctx.clip(POOLP);
  ctx.globalAlpha = .2 + .18 * glowUp;
  for (let y = 0; y < 150; y += 4) { const off = Math.sin(y * .25 + t * 5) * (2 + y * .04); ctx.drawImage(FIG, 0, OY - y - 4, FIG.width, 4, sx + off, WL + y, FIG.width, 4); }
  ctx.globalAlpha = 1;
  const sk = sackAt(P);
  const sackDraw = (alpha) => { ctx.save(); ctx.translate(sx + OX, sy + OY); ctx.scale(K, K); ctx.translate(-AX, -AY); ctx.translate(SACK_C[0] + sk.dx, SACK_C[1] + sk.dy); ctx.rotate(sk.a); ctx.translate(-SACK_C[0], -SACK_C[1]);
    ctx.globalAlpha = alpha; ctx.drawImage(IMG.sack, 0, 0); ctx.restore(); };
  if (sk) sackDraw(.5 - .25 * (sk.sunk || 0));
  ripples(ctx, X0 + P.D * FS + 6, WL + 2, t, 1.4, 3, 120 + 40 * glowUp, .5 * (1 - .4 * ss(B.stop - .3, B.stop + .1, t)) + .2);
  if (t > B.drop - .05) { const age = t - B.drop; for (let k = 0; k < 3; k++) { const a2 = age - k * .25; if (a2 < 0 || a2 > 1.6) continue; const R = 10 + a2 * 120;
    ctx.strokeStyle = `rgba(220,255,246,${.8 * (1 - a2 / 1.6)})`; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.ellipse(X0 + P.D * FS - 44, WL + 6, R, R * .22, 0, 0, TAU); ctx.stroke(); } }
  ctx.restore();
  // body above the water, the sack above the water, bloom over both
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, WL + 3); ctx.clip();
  ctx.globalAlpha = .82 + .18 * glowUp; ctx.drawImage(FIG, sx, sy); ctx.globalAlpha = 1;
  if (sk) sackDraw(1);
  ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; const mb = (.55 + .25 * glowUp) * (.85 + .15 * breathe(t, .4));
  const bl = P.swap ? BLOOM_S : BLOOM_W, bw = bl.width * 4 * K, bh = bl.height * 4 * K;
  ctx.save(); ctx.translate(sx + OX, sy + OY + P.bob * K); ctx.globalAlpha = .4 * mb; ctx.drawImage(bl, -AX * K, -AY * K, bw, bh);
  ctx.globalAlpha = .22 * mb; ctx.drawImage(bl, -AX * K * 1.5 + 0, -AY * K * 1.3, bw * 1.5, bh * 1.3); ctx.restore();
  ctx.globalAlpha = (.1 + .12 * glowUp) * (.8 + .2 * breathe(t, .4)); ctx.drawImage(GLW, X0 + P.D * FS - 200, WL - 280, 400, 360);
  ctx.restore();
  // splash
  if (t > B.drop - .02 && t < B.drop + .7) { const age = t - B.drop + .02, r = rng(77), px = X0 + P.D * FS - 44;
    ctx.fillStyle = 'rgba(220,255,246,.85)'; for (let k = 0; k < 18; k++) { const vx = (r() - .5) * 220, vy = -160 - r() * 220, x = px + vx * age, y = WL + vy * age + 620 * age * age;
      if (y > WL + 4) continue; ctx.globalAlpha = 1 - age / .7; ctx.beginPath(); ctx.arc(x, y, 1.5 + r() * 2.5, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1; }
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .25; ctx.fillStyle = GRAIN; ctx.fillRect(0, 0, W, H); ctx.restore();
  Story.captions(ctx, t, S.lines, { font: "'Nanum Myeongjo','NanumMyeongjo',serif", weight: 700, size: 64, color: '#e4fbf5', y: 420, shadow: 'rgba(0,8,10,.9)', shadowBlur: 20 });
}
async function init() {
  await Promise.all(['bg', 'walk', 'stand', 'sack'].map(load));
  splitHead(); BLOOM_W = bloomOf(IMG.walk, 6); BLOOM_S = bloomOf(IMG.stand, 6);
  FIG = Pilot.canvas(520, 340);
  POOLP = new Path2D(); POOLP.moveTo(...POOL0[0]); for (const q of POOL0.slice(1)) POOLP.lineTo(...q); POOLP.closePath();
  GLW = sprite(128, [[0, 'rgba(160,255,232,.9)'], [.3, 'rgba(70,210,190,.4)'], [1, 'rgba(30,120,110,0)']]);
  GLW_W = sprite(256, [[0, 'rgba(255,236,190,1)'], [.15, 'rgba(255,190,110,.75)'], [.45, 'rgba(220,130,60,.22)'], [1, 'rgba(160,90,40,0)']]);
  const gc = Pilot.canvas(256, 256), gg = gc.getContext('2d'), d = gg.createImageData(256, 256), r0 = rng(5);
  for (let i = 0; i < 65536; i++) { const v = 128 + (r0() - .5) * 60; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
  gg.putImageData(d, 0, 0); GRAIN = gg.createPattern(gc, 'repeat');
  const r = rng(505);
  for (let i = 0; i < 80; i++) { const dd = r(), x = 560 + (r() - .5) * 980 * (.25 + dd * .75), y = 900 + Math.pow(r(), .7) * 250 - (1 - dd) * 60 - Math.abs(r() - .5) * 120 * dd;
    if (x < 60 || x > 1020) continue; TINY.push({ x, y, s: 5 + dd * 7 + (y - 860) * .03, a: .45 + r() * .5, ph: r() * TAU, p: [2, 3, 6][r() * 3 | 0] }); }
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 64px 'Nanum Myeongjo'", "700 64px 'NanumMyeongjo'"], init, draw });
</script>
</body>
