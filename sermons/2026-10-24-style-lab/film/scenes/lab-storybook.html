<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* 06 — textured gouache storybook (teal swamp at night).
   Flat opaque gouache shapes with slightly rough edges, a chalky dry-brush tooth inside every shape, depth by value
   (pale misty trunks far → dark teal near), a pale moon, broken horizontal reflections in still teal water.
   "Me" is a small cloaked fox wading with a huge cloth bundle strapped on its back; ahead on the hill a tall antlered
   spirit holds a lantern on a hooked pole — the warm accent that lights at 3.2. The bundle slips and splashes into the water.
   Native motion: water shimmer, slow ripples, lantern flicker with a grainy halo, floating diamond motes, plants swaying. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const C = {
  sky0: '#1d4256', sky1: '#3b7583', sky2: '#5e9a9c',
  far: '#4a8189', far2: '#3c717d', mid: '#28525f', near: '#173444', near2: '#10283a',
  hillR: '#2a5a60', hillRt: '#3a7471', hillL: '#25525a', hillLt: '#357069', bush: '#1b3f52', bush2: '#21506a',
  water0: '#3f8f98', water1: '#6cc3c2', water2: '#8fded5', refl: '#337f88', refl2: '#2a6f7b',
  bank: '#2b6475', bank2: '#3c7f8a', leaf: '#2d6cb8', leaf2: '#4a92d6', leafD: '#1f4f8e', stem: '#0f2534',
  moon: '#f1fbf4', spirit: '#122636', spirit2: '#1a3446', mask: '#e9efe6',
  cloak: '#1f2633', cloak2: '#2b3444', fox: '#c4612c', fox2: '#9b4420', white: '#f2eee2', leg: '#2a1a16',
  sack: '#a36a3a', sack2: '#7f4c28', sackL: '#c18a52', rope: '#e6d2a4', strap: '#d8b47a',
  warm: '#ffd16a', warm2: '#ffb14a', ink: '#f4f0e2',
};
const GY = 1560, X0 = 300, FS = 1.42;   // FS: the fox's drawing scale                     // ground line (water surface under the fox) and its start x
const LAN = { x: 676, y: 846 };                 // lantern
const WL = 1076;                                // far water line (hills meet water)

// ---------------- shape helpers ----------------
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
function smooth(pts, closed = true) {
  const p = new Path2D(), n = pts.length;
  if (closed) { const m0 = mid(pts[n - 1], pts[0]); p.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) { const a = pts[i], m = mid(a, pts[(i + 1) % n]); p.quadraticCurveTo(a[0], a[1], m[0], m[1]); } p.closePath(); }
  else { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n - 1; i++) { const m = mid(pts[i], pts[i + 1]); p.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); } p.lineTo(pts[n - 1][0], pts[n - 1][1]); }
  return p;
}
// resample a polyline to ~step px and push points off by low noise: a gouache edge, never ruler-straight
function rough(pts, amp, seed, step = 10, closed = true) {
  const o = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) { const a = pts[i], b = pts[(i + 1) % n], L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.max(1, Math.round(L / step));
    for (let j = 0; j < k; j++) { const u = j / k, x = a[0] + (b[0] - a[0]) * u, y = a[1] + (b[1] - a[1]) * u;
      o.push([x + (noise(x * .02 + seed, y * .02) - .5) * amp, y + (noise(y * .02 + seed * 1.7, x * .02 + 9) - .5) * amp]); } }
  if (!closed) o.push(pts[n - 1]);
  return o;
}
const poly = (pts) => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; };
const ell = (cx, cy, rx, ry, n = 28, seed = 0, amp = 0) => { const o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return amp ? rough(o, amp, seed, 8) : o; };

// ---------------- textures (init) ----------------
const TX = {};
function chalkTexture(w, h, seed, k = 1) {   // white & dark dry-brush speckle with soft blotches; transparent elsewhere
  const c = Pilot.canvas(w, h), x = c.getContext('2d'), d = x.createImageData(w, h), r = rng(seed), q = d.data;
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
    const b = noise(i / 60 + seed, y / 60) * .55 + noise(i / 13, y / 13 + seed) * .3 + noise(i / 140, y / 9 + seed) * .4;
    const v = (b - .62) * 1.25 + (r() - .5) * .95, o = (y * w + i) * 4;
    if (v > 0) { q[o] = 236; q[o + 1] = 250; q[o + 2] = 244; q[o + 3] = Math.min(255, v * 70 * k); }
    else { q[o] = 6; q[o + 1] = 22; q[o + 2] = 34; q[o + 3] = Math.min(255, -v * 80 * k); }
  }
  x.putImageData(d, 0, 0); return c;
}
function grainTile(n, seed) { const c = Pilot.canvas(n, n), x = c.getContext('2d'), d = x.createImageData(n, n), r = rng(seed);
  for (let i = 0; i < n * n; i++) { const v = 128 + (r() - .5) * 90; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
  x.putImageData(d, 0, 0); return c; }
// fill a path, then lay the chalk tooth inside it (texture locked to the canvas, so it never crawls)
function paint(ctx, path, col, tex = .9, tx = TX.chalk) {
  ctx.fillStyle = col; ctx.fill(path);
  if (tex > 0) { ctx.save(); ctx.clip(path); ctx.globalAlpha = tex; ctx.drawImage(tx, 0, 0); ctx.restore(); }
}

// ---------------- static world (built once) ----------------
function trunk(x, w, top, bot, seed, lean = 0) {
  const pts = [[x - w / 2, bot], [x - w * .42 + lean, top], [x + w * .42 + lean, top], [x + w / 2, bot]];
  return poly(rough(pts, Math.min(10, w * .25), seed, 14));
}
function branch(ctx, x, y, ang, len, wd, col, seed, depth = 0) {
  const r = rng(seed); ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let px = x, py = y, a = ang; const pts = [[px, py]];
  const n = 5; for (let i = 0; i < n; i++) { a += (r() - .5) * .5; px += Math.cos(a) * len / n; py += Math.sin(a) * len / n; pts.push([px, py]); }
  ctx.lineWidth = wd; ctx.stroke(smooth(pts, false));
  if (depth < 2) for (let i = 1; i < n; i++) if (r() < .55) branch(ctx, pts[i][0], pts[i][1], a + (r() < .5 ? -1 : 1) * (.5 + r() * .5) - .3, len * (.35 + r() * .25), Math.max(1.4, wd * .55), col, seed * 7 + i, depth + 1);
}
function fern(ctx, x, y, h, col, ang = 0, seed = 1) {   // a spiky dark fern / reed tuft silhouette
  const r = rng(seed); ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round';
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(h * .08, -h * .5, h * .02, -h); ctx.stroke();
  for (let i = 1; i < 11; i++) { const u = i / 11, yy = -h * u, xx = h * .08 * Math.sin(u * 2.2), L = h * .34 * (1 - u * .75);
    for (const s of [-1, 1]) { const p = new Path2D(); p.moveTo(xx, yy); p.quadraticCurveTo(xx + s * L * .6, yy - L * .1, xx + s * L, yy - L * .55 - r() * 6); p.quadraticCurveTo(xx + s * L * .5, yy + 4, xx, yy + 5); ctx.fill(p); } }
  ctx.restore();
}
function bushClump(ctx, cx, cy, rw, rh, col, top, seed) {
  const r = rng(seed), pts = [];
  for (let i = 0; i <= 16; i++) { const u = i / 16, a = Math.PI + u * Math.PI, bump = 1 + .12 * Math.sin(u * 23 + seed) + (r() - .5) * .08;
    pts.push([cx + Math.cos(a) * rw * bump, cy + Math.sin(a) * rh * bump]); }
  pts.push([cx + rw, cy + 8], [cx - rw, cy + 8]);
  const p = smooth(rough(pts, 6, seed, 9)); paint(ctx, p, col, 1);
  ctx.save(); ctx.clip(p); ctx.strokeStyle = top; ctx.lineWidth = 3; ctx.globalAlpha = .55;
  for (let i = 0; i < 14; i++) { const a = Math.PI * (1.1 + r() * .8), x = cx + Math.cos(a) * rw * .8, y = cy + Math.sin(a) * rh * .8;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 7, y - 4); ctx.stroke(); }
  ctx.restore();
}
// hill profile helpers (shared with the reflection)
function hillR() { const pts = [[400, WL + 6]]; for (let i = 0; i <= 30; i++) { const u = i / 30, x = 400 + u * 720; pts.push([x, WL - 10 - Math.sin(Math.min(1, u * 1.25) * Math.PI) * 150 - (u > .72 ? Math.sin((u - .72) / .28 * Math.PI * .5) * 150 : 0)]); }
  pts.push([1120, WL + 6]); return smooth(rough(pts, 7, 3, 12)); }
function hillL() { const pts = [[-40, WL + 40]]; for (let i = 0; i <= 24; i++) { const u = i / 24, x = -40 + u * 520; pts.push([x, WL + 20 - Math.pow(Math.sin(u * Math.PI * .9 + .25), .7) * 200 - u * 10]); }
  pts.push([480, WL + 44]); return smooth(rough(pts, 7, 8, 12)); }

function buildBG() {
  const c = Pilot.canvas(W, H), x = c.getContext('2d'), r = rng(11);
  // sky / forest depth: vertical gradient, lighter toward the moon's misty middle
  const g = x.createLinearGradient(0, 0, 0, WL); g.addColorStop(0, C.sky0); g.addColorStop(.45, C.sky1); g.addColorStop(1, C.sky2);
  x.fillStyle = g; x.fillRect(0, 0, W, WL + 60);
  const mg = x.createRadialGradient(760, 250, 40, 760, 250, 620); mg.addColorStop(0, 'rgba(200,240,232,.38)'); mg.addColorStop(1, 'rgba(200,240,232,0)');
  x.fillStyle = mg; x.fillRect(0, 0, W, WL);
  x.save(); x.globalAlpha = .5; x.drawImage(TX.chalk, 0, 0); x.restore();
  // pale light columns between the trees (misty gaps)
  for (const [cx, w, a] of [[150, 46, .16], [395, 30, .14], [585, 64, .12], [930, 40, .15], [1010, 22, .12]]) {
    x.save(); x.globalAlpha = a; paint(x, trunk(cx, w, -10, WL - 60, cx), '#d6f2ea', .4); x.restore(); }
  // moon: an irregular pale disc with a soft halo
  const halo = x.createRadialGradient(760, 250, 50, 760, 250, 210); halo.addColorStop(0, 'rgba(240,255,248,.55)'); halo.addColorStop(1, 'rgba(240,255,248,0)');
  x.fillStyle = halo; x.fillRect(500, 0, 520, 520);
  paint(x, smooth(ell(760, 250, 60, 58, 22, 4, 5)), C.moon, .35);
  // far trunks (misty)
  for (let i = 0; i < 16; i++) { const cx = (i + .3 + r() * .5) * 72, w = 14 + r() * 22; if (Math.abs(cx - 760) < 70) continue;
    paint(x, trunk(cx, w, -20, WL - 30, i * 3.1, (r() - .5) * 8), r() < .5 ? C.far : C.far2, .6);
    x.save(); x.globalAlpha = .9; branch(x, cx, 200 + r() * 500, -Math.PI / 2 + (r() < .5 ? -.9 : .9), 70 + r() * 60, 4, C.far2, i + 40); x.restore(); }
  // mid trunks
  for (const [cx, w, s] of [[60, 58, 1], [250, 40, 2], [470, 34, 3], [640, 26, 9], [905, 52, 4], [1040, 34, 5]]) {
    paint(x, trunk(cx, w, -20, WL - 10, s * 5, (s % 2 ? 6 : -6)), C.mid, .8);
    branch(x, cx, 260 + s * 60, -Math.PI / 2 + (s % 2 ? .8 : -.8), 150, 7, C.mid, s * 13);
    branch(x, cx, 480 + s * 40, -Math.PI / 2 + (s % 2 ? -.9 : .9), 120, 6, C.mid, s * 17); }
  // right hill (the spirit's), with its bushes and ferns
  const hR = hillR(); paint(x, hR, C.hillR, 1);
  x.save(); x.clip(hR); const hg = x.createLinearGradient(0, WL - 170, 0, WL - 60); hg.addColorStop(0, C.hillRt); hg.addColorStop(1, 'rgba(58,116,113,0)');
  x.fillStyle = hg; x.fillRect(0, WL - 200, W, 160); x.drawImage(TX.chalk, 0, 0);
  x.fillStyle = 'rgba(150,210,200,.25)'; for (let i = 0; i < 60; i++) { const px = 470 + r() * 580, py = WL - 140 + r() * 120; x.fillRect(px, py, 5, 2); } x.restore();
  bushClump(x, 1040, WL - 70, 90, 120, C.bush, C.bush2, 21);
  fern(x, 1000, WL - 20, 120, C.near2, .1, 3); fern(x, 470, WL + 2, 70, C.near, -.2, 4); fern(x, 505, WL + 4, 54, C.near, .25, 5);
  // the spirit on the hill (static silhouette; its lantern is drawn live)
  drawSpirit(x);
  // left hill
  const hL = hillL(); paint(x, hL, C.hillL, 1);
  x.save(); x.clip(hL); const lg = x.createLinearGradient(0, WL - 100, 0, WL); lg.addColorStop(0, C.hillLt); lg.addColorStop(1, 'rgba(53,112,105,0)');
  x.fillStyle = lg; x.fillRect(0, WL - 110, 500, 110); x.drawImage(TX.chalk, 0, 0); x.restore();
  bushClump(x, 70, WL + 10, 120, 150, C.bush, C.bush2, 31); bushClump(x, 230, WL + 22, 70, 70, C.bush2, '#2b6680', 32);
  fern(x, 150, WL + 26, 110, C.near2, -.1, 6); fern(x, 330, WL + 36, 80, C.near, .15, 7);
  // near trunks at the edges (darkest), framing
  paint(x, trunk(-6, 96, -20, WL + 70, 50, 4), C.near, .8); paint(x, trunk(1086, 80, -20, WL + 40, 51, -4), C.near, .8);
  branch(x, 30, 380, -.6, 190, 9, C.near, 61); branch(x, 1050, 300, Math.PI + .5, 170, 8, C.near, 62); branch(x, 1050, 640, Math.PI + .7, 120, 7, C.near, 63);
  // water: gradient (darker far, bright turquoise near), with dry-brush streaks
  const wpath = new Path2D(); wpath.rect(0, WL, W, H - WL);
  const wg = x.createLinearGradient(0, WL, 0, H); wg.addColorStop(0, C.water0); wg.addColorStop(.35, C.water1); wg.addColorStop(1, C.water2);
  x.save(); x.fillStyle = wg; x.fillRect(0, WL - 2, W, H - WL + 2); x.restore();
  // reflections: the world above the water, flipped, tinted into the water colour and broken into horizontal slabs
  x.save(); x.beginPath(); x.rect(0, WL, W, 620); x.clip();
  const RC = Pilot.canvas(W, 620), rx = RC.getContext('2d');
  rx.save(); rx.scale(1, -1); rx.drawImage(c, 0, WL - 620, W, 620, 0, -620, W, 620); rx.restore();
  rx.globalCompositeOperation = 'source-atop'; rx.fillStyle = 'rgba(52,128,136,.62)'; rx.fillRect(0, 0, W, 620);
  rx.globalCompositeOperation = 'destination-out';
  for (let y = 22; y < 620; y += 24 + r() * 40) { const gh = 2 + r() * 3 + y * .012; for (let xx = -20; xx < W; xx += 120 + r() * 220) rx.fillRect(xx, y, 30 + r() * 120, gh); }
  const fd = rx.createLinearGradient(0, 0, 0, 620); fd.addColorStop(0, 'rgba(0,0,0,0)'); fd.addColorStop(.45, 'rgba(0,0,0,.4)'); fd.addColorStop(1, 'rgba(0,0,0,1)');
  rx.fillStyle = fd; rx.fillRect(0, 0, W, 620);
  x.globalAlpha = .9; x.drawImage(RC, 0, WL); x.restore();
  // shoreline lip under the hills (a thin darker band) and the first bright line of water
  x.fillStyle = 'rgba(20,60,70,.55)'; x.fillRect(0, WL - 2, W, 6);
  // the hills' feet run into the water as rounded lobes (an uneven shore, not a ruler line)
  for (const [pts, col, sd] of [
    [[[-40, WL - 4], [200, WL - 4], [330, WL + 10], [380, WL + 40], [250, WL + 66], [90, WL + 58], [-40, WL + 70]], C.hillL, 1],
    [[[640, WL - 4], [1120, WL - 4], [1120, WL + 74], [1000, WL + 60], [880, WL + 34], [720, WL + 22]], C.hillR, 2]]) {
    const p = smooth(rough(pts, 8, 80 + sd, 14)); paint(x, p, col, 1);
    x.save(); x.clip(p); x.strokeStyle = 'rgba(150,215,205,.35)'; x.lineWidth = 3; x.stroke(p); x.restore(); }
  // sandbanks / dark shallows in the water (rounded islands like brush puddles)
  const banks = [
    [[-40, 1250], [120, 1232], [260, 1262], [200, 1300], [-40, 1310]],
    [[760, 1200], [920, 1185], [1120, 1192], [1120, 1262], [980, 1250], [820, 1236]],
    [[-40, 1760], [140, 1740], [330, 1772], [420, 1830], [380, 1960], [-40, 1960]],
    [[700, 1790], [860, 1730], [1120, 1720], [1120, 1960], [760, 1960]],
  ];
  banks.forEach((b, i) => { const p = smooth(rough(b, 14, 70 + i, 16)); paint(x, p, i < 2 ? 'rgba(46,108,118,.72)' : C.bank, i < 2 ? .5 : 1);
    if (i >= 2) { x.save(); x.clip(p); x.fillStyle = 'rgba(160,220,214,.28)'; for (let k = 0; k < 120; k++) x.fillRect((i === 2 ? 0 : 700) + r() * 420, 1730 + r() * 200, 3, 3); x.restore(); } });
  // whole water gets the tooth, softer
  x.save(); x.beginPath(); x.rect(0, WL, W, H - WL); x.clip(); x.globalAlpha = .55; x.drawImage(TX.chalk2, 0, 0); x.restore();
  return c;
}

function drawSpirit(x) {
  // tall robed antlered spirit standing on the hilltop, turned toward the fox, holding a hooked lantern pole
  const fx = 836, fy = WL - 128;   // feet
  x.save();
  // long thin legs under the robe
  x.strokeStyle = C.spirit; x.lineCap = 'round'; x.lineWidth = 9;
  x.beginPath(); x.moveTo(fx - 12, fy - 70); x.lineTo(fx - 16, fy); x.moveTo(fx + 12, fy - 70); x.lineTo(fx + 14, fy); x.stroke();
  // robe: a narrow tall bell
  const robe = smooth(rough([[fx - 8, fy - 300], [fx + 16, fy - 298], [fx + 44, fy - 150], [fx + 52, fy - 64], [fx + 20, fy - 56], [fx - 30, fy - 60], [fx - 50, fy - 70], [fx - 36, fy - 170]], 5, 91, 10));
  paint(x, robe, C.spirit, .9);
  // a few pale stitched bands (folk pattern) across the robe
  x.save(); x.clip(robe); x.strokeStyle = 'rgba(200,230,222,.55)'; x.lineWidth = 2;
  for (const yy of [fy - 205, fy - 120]) { x.beginPath(); for (let k = 0; k < 9; k++) { const xx = fx - 50 + k * 12; x.moveTo(xx, yy - 5); x.lineTo(xx + 6, yy + 5); x.moveTo(xx + 6, yy - 5); x.lineTo(xx, yy + 5); } x.stroke(); }
  x.restore();
  // arm reaching forward with the pole
  x.strokeStyle = C.spirit2; x.lineWidth = 14; x.beginPath(); x.moveTo(fx - 4, fy - 270); x.quadraticCurveTo(fx - 40, fy - 220, fx - 68, fy - 232); x.stroke();
  // pole (held at the hand, hook end toward the fox)
  x.strokeStyle = '#0c1d29'; x.lineWidth = 6; x.beginPath(); x.moveTo(fx - 44, fy - 262); x.lineTo(LAN.x + 6, LAN.y - 66); x.stroke();
  x.lineWidth = 4; x.beginPath(); x.moveTo(LAN.x + 6, LAN.y - 66); x.quadraticCurveTo(LAN.x - 16, LAN.y - 78, LAN.x - 4, LAN.y - 52); x.stroke();
  // neck + head: a long pale deer-skull mask
  x.fillStyle = C.spirit; x.fillRect(fx - 4, fy - 330, 14, 40);
  const mask = smooth(rough([[fx - 24, fy - 362], [fx + 6, fy - 372], [fx + 18, fy - 350], [fx - 6, fy - 296], [fx - 22, fy - 300], [fx - 30, fy - 340]], 2.5, 92, 6));
  paint(x, mask, C.mask, .5);
  x.fillStyle = C.spirit; x.beginPath(); x.ellipse(fx - 16, fy - 342, 4, 7, -.3, 0, TAU); x.fill(); x.beginPath(); x.ellipse(fx + 2, fy - 344, 3.5, 6.5, .2, 0, TAU); x.fill();
  // antlers: organic branching, dark, wide
  for (const s of [-1, 1]) branch(x, fx - 8 + s * 10, fy - 364, -Math.PI / 2 + s * .55, 170, 7, C.spirit, s > 0 ? 7 : 3);
  for (const s of [-1, 1]) branch(x, fx - 8 + s * 8, fy - 366, -Math.PI / 2 + s * .95, 120, 5, C.spirit, s > 0 ? 17 : 13);
  x.restore();
}

// ---------------- sprites (init) ----------------
function plantSprite(seed, flip) {   // a tall swaying swamp plant: wiry dark stem, blue oval leaves
  const c = Pilot.canvas(320, 640), x = c.getContext('2d'), r = rng(seed);
  x.translate(160, 640); if (flip) x.scale(-1, 1);
  const stems = [[0, 0, 600, .06], [-30, 0, 430, -.25], [40, 0, 360, .3]];
  for (const [sx, sy, h, a] of stems) {
    const pts = []; for (let i = 0; i <= 8; i++) { const u = i / 8; pts.push([sx + Math.sin(u * 2.3 + seed) * 22 + a * h * u, sy - h * u]); }
    x.strokeStyle = C.stem; x.lineWidth = 6; x.lineCap = 'round'; x.stroke(smooth(pts, false));
    for (let i = 2; i <= 8; i++) { const [px, py] = pts[i], side = i % 2 ? 1 : -1, L = 36 + r() * 22, an = -Math.PI / 2 + side * (.7 + r() * .4);
      x.save(); x.translate(px, py); x.rotate(an + Math.PI / 2);
      const lp = smooth([[0, 0], [L * .32, -L * .4], [0, -L], [-L * .32, -L * .4]]);
      paint(x, lp, r() < .5 ? C.leaf : C.leaf2, .0); x.fillStyle = 'rgba(14,40,90,.35)'; x.save(); x.clip(lp); x.fillRect(-L, -L, L, 2 * L); x.restore();

  if (lit > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,240,190,${.8 * Math.min(1, lit)})`; ctx.beginPath(); ctx.ellipse(x, y - 4, 6, 9, 0, 0, TAU); ctx.fill(); }
  ctx.restore();
}

async function init() {
  TX.chalk = chalkTexture(W, H, 5); TX.chalk2 = chalkTexture(W, H, 9, .7);
  TX.bg = buildBG(); TX.halo = haloSprite();
  TX.vig = Pilot.canvas(W, H); { const x = TX.vig.getContext('2d'), g = x.createRadialGradient(W / 2, H * .52, H * .3, W / 2, H * .52, H * .78);
    g.addColorStop(0, 'rgba(6,20,30,0)'); g.addColorStop(1, 'rgba(6,20,30,.42)'); x.fillStyle = g; x.fillRect(0, 0, W, H); }
  TX.grainPat = Pilot.canvas(1, 1).getContext('2d').createPattern(grainTile(256, 3), 'repeat');
  FB.c = Pilot.canvas(FB.w, FB.h); FB.x = FB.c.getContext('2d'); FB.rc = Pilot.canvas(FB.w, 520); FB.r = FB.rc.getContext('2d');
  const r = rng(101);
  FX.dash = []; for (let i = 0; i < 70; i++) { const y = WL + 20 + Math.pow(r(), 1.3) * 820; FX.dash.push({ x: r() * W, y, l: 20 + r() * 70 * (y - WL) / 500, w: 2 + r() * 1.5, a: .35 + r() * .35, f: .8 + r() * 1.6, p: r() * TAU }); }
  FX.rip = []; for (let i = 0; i < 16; i++) { const y = WL + 60 + r() * 760; FX.rip.push({ x: r() * W, y, r: 60 + r() * 120 * (y - WL) / 400, a: .25 + r() * .25, p: r() * TAU, a0: Math.PI * (.05 + r() * .2), a1: Math.PI * (.8 + r() * .15) }); }
  FX.steps = []; for (let k = -3; k <= 4; k++) { const X = STRIDE * k, tt = k <= 0 ? X / V : (X <= V * T1 ? X / V : (() => { let lo = T1, hi = T1 + DEC; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (walkX(m) < X) lo = m; else hi = m; } return lo; })());
    FX.steps.push({ t: tt, x: X + STRIDE / 2 + 8 }); }
  FX.drops = []; for (let i = 0; i < 16; i++) FX.drops.push({ vx: (r() - .5) * 360, vy: 260 + r() * 300, s: 2.5 + r() * 4 });
  FX.motes = []; for (let i = 0; i < 46; i++) FX.motes.push({ x: r() * W, y: 120 + r() * 1500, s: 3 + r() * 5, a: .35 + r() * .5, f: .4 + r() * .7, p: r() * TAU, v: 0 });
  FX.plants = [{ c: plantSprite(3, false), x: 70, y: 1960, s: 1.05, f: .9, p: 0 }, { c: plantSprite(8, true), x: 1010, y: 1960, s: .95, f: .75, p: 2 }];
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 64px 'Gowun Batang'"], init, draw });
