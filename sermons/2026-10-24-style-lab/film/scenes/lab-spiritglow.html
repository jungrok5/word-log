<script>
/* 02 — a dark painterly forest at night: thin black trunks, flat rock slabs cut with a palette knife, shallow pools that
   glow cyan-white from the figures standing in them, a crowd of tiny glowing figures far off between the trees, heavy grain.
   The painting is built once (shapes, then a knife-stroke pass that re-paints the picture in short flat strokes sampled
   from itself, then grain); the life is drawn on top: each glow breathes, ripples run out from every figure, the far
   crowd flickers. "Me" is one of the glowing figures, wading through the near pool, dimmed by a dark sack on the back.
   The one accent is warm: an amber light far ahead among the crowd. When the sack slips off it splashes and sinks,
   and my glow comes up to match the others. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const C = { top: '#03090c', deep: '#061418', trunk: '#040d10', trunkL: '#0f2a2e', rock: '#0b2427', rockTop: '#2d6a66',
  haze: [40, 150, 140], glow: [150, 255, 232], core: '#eafff9', ink: '#e4fbf5' };
const WL = 1556;   // the near pool's water line where I wade

// ---------------- layout ----------------
// pools: polygons (the water), each lit by the figures standing in it
const POOLS = [
  [[250, 1470], [420, 1440], [560, 1452], [700, 1420], [880, 1440], [930, 1500], [900, 1590], [820, 1640], [660, 1660], [520, 1630], [360, 1650], [240, 1610], [210, 1540]],
  [[470, 1300], [560, 1290], [640, 1310], [660, 1345], [600, 1362], [500, 1356], [455, 1330]],
  [[330, 1228], [450, 1220], [520, 1232], [500, 1250], [360, 1252]],
  [[640, 1236], [760, 1224], [900, 1230], [920, 1252], [780, 1262], [650, 1256]],
  [[180, 1150], [300, 1146], [330, 1160], [200, 1166]], [[560, 1146], [720, 1142], [740, 1156], [580, 1160]], [[820, 1160], [960, 1154], [980, 1168], [840, 1172]],
];
// glowing figures standing in the water: x, water y, height, kind (0 = standing, 1 = sitting low), facing
const SPIRITS = [
  [800, 1592, 205, 0, -1], [690, 1606, 104, 1, 1],
  [560, 1342, 84, 0, 1], [405, 1240, 50, 1, 1], [478, 1238, 42, 0, -1], [720, 1248, 56, 0, 1], [856, 1250, 50, 1, -1],
  [250, 1158, 22, 0, 1], [610, 1152, 24, 0, 1], [660, 1150, 18, 1, 1], [880, 1166, 22, 0, 1],
];
const LIGHT = { x: 640, y: 1050 };   // the warm light far ahead (the accent)
const pathOf = pts => { const p = new Path2D(); p.moveTo(...pts[0]); for (const q of pts.slice(1)) p.lineTo(...q); p.closePath(); return p; };

// ---------------- painting helpers ----------------
function spiritPath(g, x, y, h, kind, face) {   // a simple glowing person from the waterline up (back or front view)
  const s = h / 100, p = new Path2D();
  if (kind === 1) {   // sitting low in the water: head and shoulders
    p.ellipse(x, y - 62 * s, 13 * s, 15 * s, 0, 0, TAU);
    p.moveTo(x - 30 * s, y); p.lineTo(x - 30 * s, y - 30 * s); p.quadraticCurveTo(x - 28 * s, y - 44 * s, x - 10 * s, y - 46 * s);
    p.lineTo(x + 10 * s, y - 46 * s); p.quadraticCurveTo(x + 28 * s, y - 44 * s, x + 30 * s, y - 30 * s); p.lineTo(x + 30 * s, y); p.closePath();
  } else {
    p.ellipse(x + face * 1.5 * s, y - 88 * s, 10.5 * s, 12.5 * s, 0, 0, TAU);
    p.rect(x - 4.5 * s, y - 78 * s, 9 * s, 8 * s);
    p.moveTo(x - 14 * s, y); p.lineTo(x - 16 * s, y - 50 * s); p.quadraticCurveTo(x - 17 * s, y - 68 * s, x - 6 * s, y - 72 * s);
    p.lineTo(x + 6 * s, y - 72 * s); p.quadraticCurveTo(x + 17 * s, y - 68 * s, x + 16 * s, y - 50 * s); p.lineTo(x + 14 * s, y); p.closePath();
    for (const sd of [-1, 1]) { p.moveTo(x + sd * 15 * s, y - 68 * s); p.quadraticCurveTo(x + sd * 22 * s, y - 64 * s, x + sd * 22 * s, y - 50 * s); p.lineTo(x + sd * 21 * s, y - 26 * s);
      p.quadraticCurveTo(x + sd * 19.5 * s, y - 22 * s, x + sd * 18 * s, y - 26 * s); p.lineTo(x + sd * 17.5 * s, y - 52 * s); p.closePath(); }   // arms hanging, a little apart
  }
  return p;
}
function glowSprite(N, stops) { const c = Pilot.canvas(N, N), g = c.getContext('2d'), gr = g.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N / 2);
  for (const [o, col] of stops) gr.addColorStop(o, col); g.fillStyle = gr; g.fillRect(0, 0, N, N); return c; }
function trunkShape(g, r, x, yb, w, top, col, colL, spikes) {   // a straight thin pine trunk with ragged edges and branch stubs
  const N = 30, L = [], R = [];
  for (let i = 0; i <= N; i++) { const u = i / N, y = lerp(yb, top, u), ww = w * (1 - u * .35), dx = (Pilot.noise(u * 6 + x, 2) - .5) * w * .35;
    L.push([x + dx - ww / 2 + (r() - .5) * w * .08, y]); R.push([x + dx + ww / 2 + (r() - .5) * w * .08, y]); }
  g.fillStyle = col; g.beginPath(); g.moveTo(...L[0]); for (const p of L) g.lineTo(...p); for (const p of R.reverse()) g.lineTo(...p); g.closePath(); g.fill();
  // a lit edge on the side toward the glow, broken like a dry brush
  g.strokeStyle = colL; g.lineCap = 'butt';
  for (let i = 0; i < N; i++) { if (r() < .35) continue; const p = (x < 540 ? R : L)[N - i] || R[0], q = (x < 540 ? R : L)[N - i - 1] || p;
    g.lineWidth = 1 + r() * w * .12; g.globalAlpha = .4 + r() * .4; g.beginPath(); g.moveTo(p[0] - (x < 540 ? 2 : -2), p[1]); g.lineTo(q[0] - (x < 540 ? 2 : -2), q[1]); g.stroke(); }
  g.globalAlpha = 1; g.fillStyle = col;
  for (let k = 0; k < spikes; k++) { const y = lerp(yb - 60, top, r() * .9), s = r() < .5 ? -1 : 1, l = 20 + r() * 60 * (w / 30), a = .12 + r() * .35;
    g.beginPath(); g.moveTo(x + s * w * .3, y - 3); g.lineTo(x + s * (w * .3 + l), y + l * a * (r() < .5 ? -1 : 1) * .6); g.lineTo(x + s * w * .3, y + 3); g.closePath(); g.fill(); }
}

// ---------------- the painting (built once) ----------------
let BG = null, FG = null, POOLP = null, NEAR = null;
function lightAt(x, y) {   // how much glow reaches a point from the figures and pools (for lighting rock tops and trunks)
  let s = 0; for (const [sx, sy, h] of SPIRITS) { const d = Math.hypot(x - sx, (y - sy) * 1.8); s += Math.min(1.2, h / 70) * Math.exp(-d / (50 + h * 1.1)); }
  return Math.pow(clamp(s * .7), 1.25);
}
function buildBG() {
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), r = rng(202);
  // night air: near black at the top, a teal haze over the far water
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, C.top); sky.addColorStop(.42, '#07181c'); sky.addColorStop(.58, '#0e3634'); sky.addColorStop(.66, '#0b2b2b'); sky.addColorStop(1, '#061416');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const hz = g.createRadialGradient(560, 1150, 20, 560, 1150, 620); hz.addColorStop(0, 'rgba(60,190,170,.55)'); hz.addColorStop(.5, 'rgba(30,120,112,.22)'); hz.addColorStop(1, 'rgba(20,80,80,0)');
  g.fillStyle = hz; g.fillRect(0, 0, W, H);
  // far trunks, fading into the haze
  for (let i = 0; i < 8; i++) { const x = 120 + r() * 840, w = 5 + r() * 8, yb = 1110 + r() * 60, k = r();
    const col = `rgb(${lerp(8, 22, k) | 0},${lerp(30, 64, k) | 0},${lerp(34, 66, k) | 0})`; trunkShape(g, r, x, yb, w, -50, col, 'rgba(60,150,140,.5)', 6); }
  { const hz2 = g.createRadialGradient(540, 1040, 20, 540, 1040, 520); hz2.addColorStop(0, 'rgba(70,200,180,.42)'); hz2.addColorStop(.5, 'rgba(36,130,122,.18)'); hz2.addColorStop(1, 'rgba(20,80,80,0)');
    g.save(); g.scale(1, .75); g.translate(0, 1040 / .75 - 1040); g.fillStyle = hz2; g.fillRect(0, 0, W, H / .75); g.restore(); }
  // the ground: dark, then the pools' light, then knife-cut rock slabs around them
  g.fillStyle = '#081c1e'; g.beginPath(); g.moveTo(0, 1135); for (let x = 0; x <= W; x += 30) g.lineTo(x, 1128 + Math.sin(x / 90) * 6); g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
  POOLP = POOLS.map(pathOf);
  POOLS.forEach((pts, i) => { const p = POOLP[i], cx = pts.reduce((a, q) => a + q[0], 0) / pts.length, cy = pts.reduce((a, q) => a + q[1], 0) / pts.length;
    g.save(); g.clip(p); g.fillStyle = '#0d4442'; g.fillRect(0, 0, W, H);
    for (const [sx, sy, h] of SPIRITS) { const R = h * 3.2 + 60; if (!g.isPointInPath(p, sx, sy - 2) && Math.hypot(sx - cx, sy - cy) > R * 1.3) continue;
      const gr = g.createRadialGradient(sx, sy, 2, sx, sy, R); gr.addColorStop(0, 'rgba(225,255,248,1)'); gr.addColorStop(.22, 'rgba(120,240,220,.85)'); gr.addColorStop(.6, 'rgba(40,170,160,.45)'); gr.addColorStop(1, 'rgba(20,100,96,0)');
      g.fillStyle = gr; g.save(); g.translate(sx, sy); g.scale(1, .45); g.translate(-sx, -sy); g.fillRect(sx - R, sy - R, 2 * R, 2 * R); g.restore(); }
    // mottled spray in the water
    for (let k = 0; k < 900; k++) { const x = cx + (r() - .5) * 760, y = cy + (r() - .5) * 260; g.fillStyle = r() < .5 ? 'rgba(4,40,40,.35)' : 'rgba(190,255,236,.18)'; g.fillRect(x, y, 1 + r() * 3, 1 + r() * 2); }
    g.restore(); });
  // rock slabs scattered in perspective (far first), bigger toward us; a slab whose centre is in the water is skipped
  const slabs = []; for (let i = 0; i < 230; i++) { const v = Math.pow(r(), .9), y = 1132 + v * 820; slabs.push([r() * (W + 200) - 100, y]); }
  slabs.sort((a, b) => a[1] - b[1]);
  for (const [x0, y] of slabs) {
    const sc = .16 + (y - 1130) / 800 * 1.5, w = (110 + r() * 230) * sc, rh = (30 + r() * 40) * sc, x = x0 - w / 2, cx = x0, cy = y + rh * .5;
    if (POOLP.some(p => g.isPointInPath(p, cx, cy) || g.isPointInPath(p, cx, y + 2))) continue;
    const L = lightAt(cx, y), tilt = (r() - .5) * rh * .6, top = rh * (.25 + r() * .3), k = .7 + r() * .3;
    const pts = [[x + r() * 6 * sc, y + rh + 3], [x, y + tilt * .3 + r() * 5 * sc], [x + w * (.25 + r() * .4), y - r() * 5 * sc], [x + w, y + tilt], [x + w - r() * 12 * sc, y + rh + 3]];
    g.fillStyle = Pilot.rgb([lerp(4, 14, k * (.2 + L)), lerp(12, 44, k * (.2 + L)), lerp(14, 44, k * (.2 + L))]);
    g.beginPath(); g.moveTo(...pts[0]); for (const q of pts) g.lineTo(...q); g.closePath(); g.fill();
    const tl = [lerp(14, 70, L), lerp(40, 178, L), lerp(42, 164, L)];
    g.fillStyle = Pilot.rgb(tl, (.12 + L * .85) * k); g.beginPath(); g.moveTo(...pts[1]); g.lineTo(...pts[2]); g.lineTo(...pts[3]);
    g.lineTo(pts[3][0] - r() * 8 * sc, pts[3][1] + top); g.lineTo(lerp(pts[1][0], pts[3][0], .5 + r() * .3), pts[2][1] + top * (.7 + r() * .5)); g.lineTo(pts[1][0] + r() * 6, pts[1][1] + top * (.5 + r() * .6)); g.closePath(); g.fill();
    if (L > .3 && r() < .5) { g.strokeStyle = `rgba(170,255,236,${(L - .25) * .45})`; g.lineWidth = .8 + sc; g.beginPath(); g.moveTo(...pts[1]); g.lineTo(...pts[2]); g.lineTo(...pts[3]); g.stroke(); }
  }
  // the ground falls into darkness away from the water
  { const vg = g.createRadialGradient(560, 1450, 200, 560, 1450, 900); vg.addColorStop(0, 'rgba(2,8,9,0)'); vg.addColorStop(1, 'rgba(2,8,9,.7)'); g.fillStyle = vg; g.fillRect(0, 1120, W, H); }
  // mid trunks rising out of the ground between the pools
  for (const [x, w, yb] of [[300, 16, 1190], [770, 13, 1180], [905, 22, 1230]]) trunkShape(g, r, x, yb, w, -40, '#06171a', 'rgba(80,190,175,.55)', 8);
  // horizontal glints of light caught on the water edges (a flat brush dragged sideways)
  for (let k = 0; k < 40; k++) { const x = 100 + r() * 880, y = 1140 + r() * 520; const L = lightAt(x, y); if (L < .2) continue;
    g.fillStyle = `rgba(170,255,236,${.25 + L * .3})`; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 30 + r() * 60, y - 3); g.lineTo(x + 40 + r() * 50, y + 1); g.closePath(); g.fill(); }
  knife(c, 7000, r);
  // glowing figures in the water (their bodies are static; their glow breathes, drawn live)
  for (const [x, y, h, kind, face] of SPIRITS) { if (h > 150) continue; g.save(); g.shadowColor = 'rgba(150,255,230,.9)'; g.shadowBlur = h * .25; g.fillStyle = h > 60 ? '#d6fff4' : '#bff8ea'; g.fill(spiritPath(g, x, y, h, kind, face));
    g.fillStyle = 'rgba(230,255,250,.6)'; g.fillRect(x - h * .25, y - 1, h * .5, 2); g.restore(); }
  grain(c, 34, 5);
  return c;
}
// the knife pass: repaint the picture with short flat strokes sampled from itself (vertical above the ground, flat below)
function knife(c, n, r) {
  const g = c.getContext('2d'), d = g.getImageData(0, 0, W, H).data;
  for (let k = 0; k < n; k++) {
    const x = r() * W, y = r() * H, i = ((y | 0) * W + (x | 0)) * 4, j = y < 950 ? .94 + r() * .1 : .9 + r() * .22;
    const ground = y > 1130, a = ground ? (r() - .5) * .9 : Math.PI / 2 + (r() - .5) * .25, l = ground ? 16 + r() * 70 : 14 + r() * 60, w = ground ? 5 + r() * 12 : 2 + r() * 5;
    if (ground && r() < .55) continue;
    g.fillStyle = `rgba(${d[i] * j | 0},${d[i + 1] * j | 0},${d[i + 2] * j | 0},${ground ? .3 + r() * .4 : y < 950 ? .3 + r() * .3 : .55 + r() * .4})`;
    g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.moveTo(-l / 2, -w / 2); g.lineTo(l / 2, -w / 2 + (r() - .5) * 2); g.lineTo(l / 2 - 2, w / 2); g.lineTo(-l / 2 + 1, w / 2); g.closePath(); g.fill(); g.restore();
  }
}
function grain(c, amp, seed) {   // heavy fine grain + a few larger flecks (the painting's spray texture)
  const g = c.getContext('2d'), N = 512, t = Pilot.canvas(N, N), tg = t.getContext('2d'), id = tg.createImageData(N, N), r = rng(seed);
  for (let i = 0; i < N * N; i++) { const v = 128 + (r() - .5) * 2 * amp; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  tg.putImageData(id, 0, 0);
  g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = .55; g.fillStyle = g.createPattern(t, 'repeat'); g.fillRect(0, 0, W, H); g.restore();
}
function buildFG() {   // near trunks at both edges (in front of everything)
  const c = Pilot.canvas(W, H), g = c.getContext('2d'), r = rng(303);
  for (const [x, w] of [[40, 120], [176, 46], [1048, 90], [930, 34]]) trunkShape(g, r, x, H + 20, w, -60, C.trunk, 'rgba(70,170,160,.45)', 10);
  const vg = g.createLinearGradient(0, 0, 0, 760); vg.addColorStop(0, 'rgba(1,5,7,.9)'); vg.addColorStop(1, 'rgba(1,5,7,0)'); g.fillStyle = vg; g.fillRect(0, 0, W, 760);
  const bg = g.createLinearGradient(0, 1700, 0, H); bg.addColorStop(0, 'rgba(2,8,9,0)'); bg.addColorStop(1, 'rgba(2,8,9,.75)'); g.fillStyle = bg; g.fillRect(0, 1700, W, 220);
  knife(c, 0, r); return c;
}

// ---------------- me (model units: water line y = 0, facing +x, drawn at FS) ----------------
const FS = 1.75, X0 = 300, WALK = 92, V = WALK / (B.stop - .3);
function distAt(t) { const a = B.stop - .6; if (t <= a) return V * t; const u = clamp((t - a) / .6); return V * a + V * .6 * (u - u * u / 2); }
function ik(ax, ay, fx, fy, a, b) { const d = Math.min(Math.hypot(fx - ax, fy - ay), a + b - .5), th = Math.atan2(fy - ay, fx - ax), al = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const k1 = [ax + Math.cos(th - al) * a, ay + Math.sin(th - al) * a], k2 = [ax + Math.cos(th + al) * a, ay + Math.sin(th + al) * a]; return k1[0] > k2[0] ? k1 : k2; }
function pose(t) {
  const D = distAt(t), STEP = 24, ph = D / (2 * STEP), stopK = ss(B.stop - .35, B.stop + .15, t), rel = ss(B.drop - .05, B.drop + 1, t);
  const lean = lerp(.26, .32, ss(B.stop, B.stop + .4, t)) * (1 - rel) + .03 * rel;
  const head = lerp(.55, -.18, eio(clamp((t - B.look) / .7)));
  const feet = [0, .5].map((o, i) => { const p = (ph + o) % 1; let fx, lift = 0;
    if (p < .6) fx = STEP * .6 * (1 - 2 * p / .6); else { const q = (p - .6) / .4; fx = -STEP * .6 + STEP * 1.2 * eio(q); lift = Math.sin(Math.PI * q) * 8; }
    return [D + lerp(fx, i ? -6 : 7, stopK), 64 - lift * (1 - stopK)]; });
  const bob = (1 - stopK) * 1.6 * Math.cos(ph * 2 * TAU) + 3 * ss(B.stop, B.stop + .4, t) * (1 - rel) - Math.sin((t - B.drop) * 2.4) * 1.2 * ss(B.drop + .3, B.drop + 1, t);
  return { D, ph, stopK, rel, lean, head, feet, hip: [D + 2, 2 + bob] };
}
function bodyParts(t, P) {
  const U = [Math.sin(P.lean), -Math.cos(P.lean)], F = [Math.cos(P.lean), Math.sin(P.lean)], sh = [P.hip[0] + U[0] * 58, P.hip[1] + U[1] * 58];
  const at = (f, u) => [sh[0] + F[0] * f + U[0] * u, sh[1] + F[1] * f + U[1] * u];
  const hp = P.head + P.lean * .5, nk = at(2, 8), hd = [nk[0] + Math.sin(hp) * 6 + 2, nk[1] - 11 + Math.abs(Math.sin(hp)) * 2];
  return { U, F, sh, at, hp, nk, hd };
}
function drawBody(g, t, P, Bp) {   // the glowing body (one colour; the glow comes from the bloom pass)
  const { at, hd, hp } = Bp;
  g.beginPath();
  g.moveTo(P.hip[0] - 13, 4); g.lineTo(...at(-14, 0)); g.quadraticCurveTo(...at(-13, 10), ...at(-4, 11)); g.lineTo(...at(7, 10));
  g.quadraticCurveTo(...at(14, 7), ...at(14, -6)); g.lineTo(P.hip[0] + 14, 4); g.closePath(); g.fill();      // torso
  g.beginPath(); g.moveTo(...at(-3, 8)); g.lineTo(...at(5, 8)); g.lineTo(hd[0] + 3, hd[1] + 6); g.lineTo(hd[0] - 5, hd[1] + 6); g.fill();   // neck
  g.save(); g.translate(...hd); g.rotate(hp); g.beginPath(); g.ellipse(0, 0, 11, 12.5, 0, 0, TAU); g.fill(); g.beginPath(); g.moveTo(9, -2); g.lineTo(13, 3); g.lineTo(9, 5); g.fill(); g.restore();
  // the near arm: gripping the sack's rope at the chest, then hanging free
  const grip = 1 - ss(B.drop - .7, B.drop - .25, t), sw = Math.sin(P.ph * TAU) * 4 * (1 - P.stopK);
  const hand = [lerp(P.hip[0] + 8 + sw, at(13, -14)[0], grip), lerp(P.hip[1] - 6, at(13, -14)[1], grip)];
  const el = [lerp(P.hip[0] + 2 + sw * .5, at(6, -32)[0], grip), lerp(P.hip[1] - 26, at(6, -32)[1], grip)];
  g.lineCap = 'round'; g.lineWidth = 8.5; g.beginPath(); g.moveTo(...at(1, 2)); g.lineTo(...el); g.lineTo(...hand); g.stroke();
  return hand;
}
function legs(g, P) {   // under the water: dim, wavering
  for (const [i, w] of [[1, 8], [0, 9]]) { const f = P.feet[i], k = ik(P.hip[0], P.hip[1] + 4, f[0], f[1], 32, 32);
    g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(P.hip[0], P.hip[1] + 4); g.lineTo(...k); g.lineTo(...f); g.stroke(); }
}
const SACK = { w: 46, h: 52 };
function sackState(t, P, Bp) {
  const c = Bp.at(-27, -24), t0 = B.drop - .34;
  if (t < t0) { const pre = ss(B.drop - 1, t0, t); return { x: c[0] - pre * 3, y: c[1] + pre * 8, a: P.lean + pre * .14 }; }
  const a0 = { x: c[0] - 3, y: c[1] + 8, a: P.lean + .14 }, land = { x: P.D - 44, y: 8, a: -.5 }, u = clamp((t - t0) / (B.drop - t0));
  if (t < B.drop) return { x: lerp(a0.x, land.x, u), y: lerp(a0.y, land.y, u * u), a: lerp(a0.a, land.a, u) };
  const v = clamp((t - B.drop) / 1.6);   // bobs once, then sinks
  return { x: land.x - v * 4, y: land.y + Math.sin(clamp((t - B.drop) / .5) * Math.PI) * -5 + eio(v) * 44, a: land.a - v * .2, sunk: v };
}
function sackPath(g, s) {
  g.save(); g.translate(s.x, s.y); g.rotate(s.a); const { w, h } = SACK;
  g.beginPath(); g.moveTo(-w * .2, -h * .5); g.bezierCurveTo(-w * .7, -h * .45, -w * .6, h * .5, -w * .1, h * .5);
  g.bezierCurveTo(w * .35, h * .55, w * .62, h * .25, w * .45, -h * .2); g.bezierCurveTo(w * .35, -h * .5, w * .1, -h * .62, -w * .2, -h * .5); g.closePath();
  g.moveTo(-w * .05, -h * .52); g.lineTo(-w * .22, -h * .78); g.lineTo(w * .14, -h * .74); g.closePath();   // the knotted neck
  g.restore();
}

// ---------------- frame ----------------
let FIG, FIGB, GLW, GLW_W, TINY = [];
const breathe = (t, ph, p = 3) => .5 + .5 * Math.sin(TAU * t / p + ph);
const lightK = t => ss(B.look - .3, B.look + .6, t) * (1 - .05 * breathe(t, 0, .37));
function ripples(ctx, x, y, t, period, n, rmax, a, seedT = 0) {
  for (let k = 0; k < n; k++) { const age = ((t + seedT + k * period / n) % period) / period, R = 6 + age * rmax;
    ctx.strokeStyle = `rgba(200,255,240,${a * (1 - age) * ss(0, .15, age)})`; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.ellipse(x, y, R, R * .22, 0, 0, TAU); ctx.stroke(); }
}
const PLATE = (location.search.match(/[?&]plate=(\w+)/) || [])[1] || '';   // ?plate=1: the painting without me (key-art repaint)
const FIGONLY = /[?&]fig=1/.test(location.search);                         // ?fig=1: me alone, at 4x, on magenta
function figOnly(ctx, t) {
  ctx.fillStyle = '#ff00ff'; ctx.fillRect(0, 0, W, H);
  const P = pose(t), Bp = bodyParts(t, P), sk = sackState(t, P, Bp), k = 4.4;
  ctx.save(); ctx.setTransform(k, 0, 0, k, 470 - P.D * k, 1250); ctx.fillStyle = '#d8fff4'; ctx.strokeStyle = '#d8fff4';
  const hand = drawBody(ctx, t, P, Bp); ctx.fillStyle = '#041114'; sackPath(ctx, sk); ctx.fill();
  ctx.strokeStyle = '#06181b'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(sk.x + 8, sk.y - 26); ctx.quadraticCurveTo(...Bp.at(3, 9), ...hand); ctx.stroke();
  ctx.restore();
}
function draw(ctx, t) {
  if (FIGONLY) return figOnly(ctx, t);
  ctx.drawImage(BG, 0, 0);
  const lk = PLATE ? 0 : lightK(t);
  // the far crowd: tiny figures, each flickering softly
  for (const q of TINY) { const b = .55 + .45 * breathe(t, q.ph, q.p), wk = lk * Math.exp(-Math.hypot(q.x - LIGHT.x, (q.y - LIGHT.y) * 1.5) / 160);
    ctx.globalAlpha = q.a * b; ctx.fillStyle = wk > .05 ? `rgb(${lerp(200, 255, wk) | 0},${lerp(255, 214, wk) | 0},${lerp(240, 160, wk) | 0})` : '#c8fff0';
    ctx.beginPath(); ctx.roundRect(q.x - q.s * .26, q.y - q.s, q.s * .52, q.s, [q.s * .2, q.s * .2, 0, 0]); ctx.arc(q.x, q.y - q.s * 1.16, q.s * .18, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  // the warm light ahead
  if (lk > 0) { ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = lk;
    ctx.drawImage(GLW_W, LIGHT.x - 340, LIGHT.y - 300, 680, 600); ctx.globalAlpha = lk * .9; ctx.drawImage(GLW_W, LIGHT.x - 70, LIGHT.y - 70, 140, 140);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = lk; ctx.drawImage(GLW_W, LIGHT.x - 16, LIGHT.y - 16, 32, 32);
    ctx.globalAlpha = lk * .5; ctx.drawImage(GLW_W, LIGHT.x - 160, 1138, 320, 26); ctx.restore(); }
  // every glow breathes; ripples run out from each figure
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, h, , , ph = x * .01] of SPIRITS) { if (h > 150) continue; const R = h * 1.5 + 30; ctx.globalAlpha = .16 + .12 * breathe(t, ph);
    ctx.drawImage(GLW, x - R, y - h * .6 - R * .8, 2 * R, 1.6 * R); }
  ctx.restore();
  for (const [x, y, h, , , ph = x * .013] of SPIRITS) if (h > 30) ripples(ctx, x, y + 1, t, 3, 2, h * 1.4, .45, ph);
  // the near figure on the right (big; drawn live so its glow can breathe with mine)
  const nb = breathe(t, 1.2);
  const [nx, ny, nh] = SPIRITS[0];
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .28 + .12 * nb; ctx.drawImage(GLW, nx - 220, ny - 330, 440, 420); ctx.restore();
  ctx.fillStyle = '#dcfff6'; ctx.fill(spiritPath(ctx, nx, ny, nh, 0, -1)); ctx.fillStyle = 'rgba(240,255,252,.7)'; ctx.fillRect(nx - 44, ny - 1, 88, 3);
  ripples(ctx, nx, ny + 2, t, 3, 3, 170, .5, 1.1);
  if (PLATE) { ctx.drawImage(FG, 0, 0); return; }
  // me
  const P = pose(t), Bp = bodyParts(t, P), sk = sackState(t, P, Bp), wx = X0, glowUp = ss(B.drop, B.drop + 1.2, t);
  const bodyCol = `rgb(${lerp(140, 222, glowUp) | 0},${lerp(214, 255, glowUp) | 0},${lerp(200, 246, glowUp) | 0})`;
  const fc = FIG.getContext('2d'); fc.setTransform(1, 0, 0, 1, 0, 0); fc.clearRect(0, 0, FIG.width, FIG.height);
  const OX = 150, OY = 260; fc.setTransform(FS, 0, 0, FS, OX, OY); fc.fillStyle = bodyCol; fc.strokeStyle = bodyCol;
  const hand = drawBody(fc, t, P, Bp); fc.setTransform(1, 0, 0, 1, 0, 0);
  const sx = wx - OX, sy = WL - OY;
  // reflection and the legs under the water, clipped to the near pool
  ctx.save(); ctx.clip(POOLP[0]);
  ctx.globalAlpha = .22 + .2 * glowUp;
  for (let y = 0; y < 150; y += 5) { const off = Math.sin(y * .25 + t * 5) * (2 + y * .04); ctx.drawImage(FIG, 0, OY - y - 5, FIG.width, 5, sx + off, WL + y, FIG.width, 5); }
  ctx.globalAlpha = .45; ctx.save(); ctx.translate(wx, WL); ctx.scale(FS, FS); ctx.strokeStyle = bodyCol; ctx.translate(Math.sin(t * 4) * .6, 0); legs(ctx, P); ctx.restore();
  ctx.globalAlpha = 1;
  // the sack once it is in the water: a dark shape sinking under the glow
  if (t >= B.drop) { ctx.save(); ctx.translate(wx, WL); ctx.scale(FS, FS); ctx.globalAlpha = .55 - .2 * sk.sunk; ctx.fillStyle = '#031012'; sackPath(ctx, sk); ctx.fill(); ctx.restore(); }
  ripples(ctx, wx + P.hip[0] * FS, WL + 2, t, 1.4, 3, 120 + 40 * glowUp, .55 * (1 - .4 * P.stopK) + .2);
  if (t > B.drop - .05) { const age = t - B.drop; for (let k = 0; k < 3; k++) { const a2 = age - k * .25; if (a2 < 0 || a2 > 1.6) continue; const R = 10 + a2 * 120;
    ctx.strokeStyle = `rgba(220,255,246,${.8 * (1 - a2 / 1.6)})`; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.ellipse(wx + (P.D - 44) * FS, WL + 6, R, R * .22, 0, 0, TAU); ctx.stroke(); } }
  ctx.restore();
  // body, then the sack above the water, then the bloom over both (the glow wraps around the dark sack)
  ctx.drawImage(FIG, sx, sy);
  ctx.save(); ctx.translate(wx, WL); ctx.scale(FS, FS);
  if (t < B.drop) { ctx.fillStyle = '#041114'; sackPath(ctx, sk); ctx.fill();
    // the rope over my shoulder, dark across the glowing chest, to the hand
    ctx.strokeStyle = '#06181b'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(sk.x + 8, sk.y - 26); ctx.quadraticCurveTo(...Bp.at(3, 9), ...hand); ctx.stroke(); }
  else { ctx.beginPath(); ctx.rect(-400, -400, 800, 400 + 1); ctx.clip(); ctx.fillStyle = '#041114'; sackPath(ctx, sk); ctx.fill(); }
  ctx.restore();
  const bc = FIGB.getContext('2d'); bc.clearRect(0, 0, FIGB.width, FIGB.height); bc.filter = 'blur(7px)'; bc.drawImage(FIG, 0, 0, FIGB.width, FIGB.height); bc.filter = 'none';
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; const mb = (.55 + .45 * glowUp) * (.85 + .15 * breathe(t, .4));
  ctx.globalAlpha = .7 * mb; ctx.drawImage(FIGB, sx, sy, FIG.width, FIG.height);
  ctx.globalAlpha = .35 * mb; ctx.drawImage(FIGB, sx - FIG.width * .35, sy - FIG.height * .25, FIG.width * 1.7, FIG.height * 1.5);
  ctx.globalAlpha = (.12 + .2 * glowUp) * (.8 + .2 * breathe(t, .4)); ctx.drawImage(GLW, wx + P.hip[0] * FS - 230, WL - 300, 460, 380);
  ctx.restore();
  // splash where the sack hits
  if (t > B.drop - .02 && t < B.drop + .7) { const age = t - B.drop + .02, r = rng(77), px = wx + (P.D - 44) * FS;
    ctx.fillStyle = 'rgba(220,255,246,.85)'; for (let k = 0; k < 18; k++) { const vx = (r() - .5) * 220, vy = -160 - r() * 220, x = px + vx * age, y = WL + vy * age + 620 * age * age;
      if (y > WL + 4) continue; ctx.globalAlpha = 1 - age / .7; ctx.beginPath(); ctx.arc(x, y, 1.5 + r() * 2.5, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1; }
  ctx.drawImage(FG, 0, 0);
  Story.captions(ctx, t, S.lines, { font: "'Nanum Myeongjo','NanumMyeongjo',serif", weight: 700, size: 64, color: C.ink, y: 420, shadow: 'rgba(0,8,10,.9)', shadowBlur: 20 });
}

async function init() {
  BG = buildBG(); FG = buildFG();
  FIG = Pilot.canvas(480, 340); FIGB = Pilot.canvas(120, 85);
  GLW = glowSprite(256, [[0, 'rgba(160,255,232,.9)'], [.3, 'rgba(70,210,190,.4)'], [1, 'rgba(30,120,110,0)']]);
  GLW_W = glowSprite(256, [[0, 'rgba(255,236,190,1)'], [.15, 'rgba(255,190,110,.75)'], [.45, 'rgba(220,130,60,.22)'], [1, 'rgba(160,90,40,0)']]);
  const r = rng(505);
  for (let i = 0; i < 80; i++) { const d = r(), x = 560 + (r() - .5) * 980 * (.25 + d * .75), y = 900 + Math.pow(r(), .7) * 250 - (1 - d) * 60 - Math.abs(r() - .5) * 120 * d;
    if (x < 60 || x > 1020) continue; TINY.push({ x, y, s: 5 + d * 7 + (y - 860) * .03, a: .45 + r() * .5, ph: r() * TAU, p: [2, 3, 6][r() * 3 | 0] }); }
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 64px 'Nanum Myeongjo'", "700 64px 'NanumMyeongjo'"], init, draw });
</script>
