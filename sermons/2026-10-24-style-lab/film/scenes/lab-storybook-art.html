<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스타일 실험 · 06 그림책 과슈 (키 아트)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
</head>
<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* 06 key-art version — "the picture comes from an image model, the life comes from code".
   Background: an image-model repaint of lab-storybook's own code layout (?plate=1), registered back onto it (plate.py),
   so the lantern (676,846), the water line and the open water are where the code expects them.
   Character: one model sheet on #00FF00 (two trudging drawings with the bundle, one upright looking-up drawing, the
   bundle alone), keyed. Code moves it: the two walk drawings alternate per step (limited animation) with a heavy bob,
   the stop sags, the look-up is a key-drawing swap (upright pose + the bundle as its own layer, a code rope strap),
   the bundle slips and splashes as a separate sprite. Code adds the lantern light, water shimmer, ripples, the fox's
   reflection, motes, vignette, grain and the caption. Art: scenes/art/lab-storybook-*.webp. */
const S = window.SCRIPT, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const GY = 1560, X0 = 330, SC = .72;      // feet line on the water, start x of the feet, drawing scale
const LAN = { x: 676, y: 840 };
const WL = 1076;
// feet anchors of each keyed drawing (measured from the alpha: bottom row centre), in drawing px
const D = { walk1: [299, 650], walk2: [311, 646], stand: [236, 690], load: [182, 331] };
const IMG = {};
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => { const c = Pilot.canvas(i.naturalWidth, i.naturalHeight); c.getContext('2d').drawImage(i, 0, 0); ok(c); }; i.onerror = no; i.src = src; });

// ---------------- motion ----------------
const V = 46, T1 = 1.9, DEC = .7, STEP = .45;
const walkX = t => { if (t < T1) return V * t; const u = Math.min(t - T1, DEC); return V * T1 + V * u - V * u * u / (2 * DEC); };
const speed = t => t < T1 ? 1 : Math.max(0, 1 - (t - T1) / DEC);
function pose(t) {
  const X = walkX(t), sp = speed(t);
  const k = Math.min(t, 2.5) / STEP, step = Math.floor(k), u = k - step;
  const frame = step % 2 ? 'walk2' : 'walk1';
  const bob = -Math.sin(Math.PI * u) * 8 * sp;                       // rises between footfalls, drops on contact
  const contact = Math.exp(-u * 7) * sp;                             // a little squash right after each footfall
  const sag = ss(2.6, 3.05, t) * (1 - ss(3.2, 3.3, t));
  const up = t >= 3.2;                                               // key swap: upright, looking up at the light
  const settle = up ? 1 - Math.exp(-(t - 3.2) * 9) * Math.cos((t - 3.2) * 16) : 0;
  const breath = Math.sin((t - 4.4) * 2.6) * ss(4.7, 5.2, t);
  return { X, sp, frame: up ? 'stand' : frame, bob, contact, sag, up, settle, breath, u, step };
}
function loadPos(t, P) {   // bundle in fox-local px (feet at 0,0; screen scale), on the upright pose's back, then off
  const back = { x: -104, y: -228, r: -.1 };
  if (t < 3.95) return { ...back, y: back.y + (P.up ? (1 - P.settle) * 12 : 0) };
  if (t < 4.18) { const u = eio((t - 3.95) / .23); return { x: back.x - 16 * u, y: back.y + 40 * u, r: back.r - .2 * u }; }
  const s0 = { x: back.x - 16, y: back.y + 40, r: back.r - .28 }, end = { x: -235, y: 8, r: -.12 };
  if (t < 4.4) { const u = (t - 4.18) / .22; return { x: lerp(s0.x, end.x, u), y: lerp(s0.y, end.y, u * u), r: lerp(s0.r, end.r, u) }; }
  const b = Math.exp(-(t - 4.4) * 9) * Math.sin((t - 4.4) * 30) * 7;
  return { x: end.x, y: end.y - Math.abs(b), r: end.r + b * .004, sq: 1 - .08 * Math.exp(-(t - 4.4) * 10) };
}
function piece(x, name, sx, sy, rot = 0, kx = 1, ky = 1) {   // draw a keyed drawing by its feet anchor
  const im = IMG[name], [ax, ay] = D[name];
  x.save(); x.translate(sx, sy); x.rotate(rot); x.scale(SC * kx, SC * ky); x.drawImage(im, -ax, -ay); x.restore();
}
function drawFox(x, t) {   // into the fox buffer, feet at (0,0)
  const P = pose(t);
  const lean = P.sag * .03, sink = P.sag * 5;
  if (!P.up) { piece(x, P.frame, 0, P.bob + sink, lean, 1 + P.contact * .015, 1 - P.contact * .025); return P; }
  const L = loadPos(t, P), ky = (1 + .04 * (1 - P.settle)) * (1 + .008 * P.breath), kx = 1 - .02 * (1 - P.settle);
  const relief = t > 4.4 ? Math.sin(clamp((t - 4.42) / .5) * Math.PI) * .03 : 0;
  // the bundle behind the body while carried
  if (t < 4.18) { drawLoad(x, L); }
  piece(x, 'stand', 0, 0, 0, kx, ky + relief);
  if (t < 4.18) {   // rope strap over the shoulder to the chest (code: the upright drawing has none)
    const sl = ss(3.9, 4.15, t); x.save(); x.strokeStyle = '#d8c59a'; x.lineWidth = 7; x.lineCap = 'round';
    x.beginPath(); x.moveTo(L.x + 70, L.y - 150); x.quadraticCurveTo(-6 + sl * 6, -372 * ky + sl * 30, 30 - sl * 20, -262 * ky + sl * 60); x.stroke();
    x.strokeStyle = 'rgba(90,60,30,.35)'; x.lineWidth = 2; x.stroke(); x.restore(); }
  if (t >= 4.18) drawLoad(x, L);
  return P;
}
function drawLoad(x, L) {
  x.save(); x.translate(L.x, L.y); x.rotate(L.r); if (L.sq) x.scale(2 - L.sq, L.sq);
  x.scale(SC * .95, SC * .95); x.drawImage(IMG.load, -D.load[0], -D.load[1] / 2 - D.load[1] / 2); x.restore();
}

// ---------------- frame ----------------
const FX = {}, FB = { w: 1100, h: 1000, ox: 640, oy: 900 };
function draw(ctx, t) {
  ctx.drawImage(IMG.bg, 0, 0, W, H);
  const lit = ss(3.2, 3.75, t) * (1 + .07 * Math.sin(t * 13.3) + .05 * Math.sin(t * 23.1 + 1)) * (t < 3.32 ? (Math.sin(t * 90) > -.2 ? 1 : .4) : 1);
  // water shimmer over the painted water
  ctx.save(); ctx.lineCap = 'round';
  for (const d of FX.dash) { const a = .5 + .5 * Math.sin(t * d.f + d.p); if (a < .15) continue;
    ctx.strokeStyle = `rgba(214,250,240,${a * d.a})`; ctx.lineWidth = d.w; const xx = d.x + Math.sin(t * .6 + d.p) * 12;
    ctx.beginPath(); ctx.moveTo(xx, d.y); ctx.lineTo(xx + d.l, d.y); ctx.stroke(); }
  ctx.restore();
  if (lit > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 16; i++) { const yy = WL + 20 + i * 15 + (i * i) * .6, ww = (36 - i * 1.6) * (.7 + .3 * Math.sin(t * 3 + i * 1.7)), xx = LAN.x + Math.sin(t * 1.8 + i) * 6;
      ctx.fillStyle = `rgba(255,190,90,${lit * (.3 - i * .015)})`; ctx.fillRect(xx - ww / 2, yy, ww, 3 + (i % 3)); }
    ctx.restore(); }
  // fox buffer
  const fx = FB.x; fx.setTransform(1, 0, 0, 1, 0, 0); fx.clearRect(0, 0, FB.w, FB.h); fx.translate(FB.ox, FB.oy);
  const P = drawFox(fx, t);
  // light from the lantern on the fox once lit: a warm rim on its upper-right edges (alpha minus alpha shifted)
  if (lit > 0 && P.up) { const rc = FB.rimx; rc.setTransform(1, 0, 0, 1, 0, 0); rc.globalCompositeOperation = 'source-over'; rc.clearRect(0, 0, FB.w, FB.h);
    rc.drawImage(FB.c, 0, 0); rc.globalCompositeOperation = 'destination-out'; rc.drawImage(FB.c, -3, 4);
    rc.globalCompositeOperation = 'source-in'; rc.fillStyle = `rgba(255,200,110,${.45 * Math.min(1, lit)})`; rc.fillRect(0, 0, FB.w, FB.h);
    fx.setTransform(1, 0, 0, 1, 0, 0); fx.globalCompositeOperation = 'source-over'; fx.drawImage(FB.rim, 0, 0); }
  const sx = X0 + P.X - FB.ox, sy = GY - FB.oy;
  // ripples: footfalls and the splash
  ctx.save(); ctx.lineWidth = 2.4;
  for (const ev of FX.steps) { const age = t - ev.t; if (age < 0 || age > 2) continue; const k = age / 2, rr = 14 + 110 * eo(k);
    ctx.strokeStyle = `rgba(226,252,244,${.5 * (1 - k)})`; ctx.beginPath(); ctx.ellipse(X0 + ev.x, GY + 2, rr, rr * .17, 0, 0, TAU); ctx.stroke(); }
  if (t > 4.4) for (let j = 0; j < 3; j++) { const age = t - 4.4 - j * .28; if (age < 0) continue; const k = Math.min(1, age / 1.6), rr = 40 + 200 * eo(k);
    ctx.strokeStyle = `rgba(226,252,244,${.6 * (1 - k)})`; ctx.beginPath(); ctx.ellipse(X0 + P.X - 235, GY + 6, rr, rr * .17, 0, 0, TAU); ctx.stroke(); }
  ctx.restore();
  // reflection: flipped, sliced, wobbling, tinted teal
  const rc = FB.r; rc.setTransform(1, 0, 0, 1, 0, 0); rc.globalCompositeOperation = 'source-over'; rc.clearRect(0, 0, FB.w, 520);
  for (let r = 0; r < 500; r += 4) { const off = Math.sin(r * .09 - t * 3.2) * (1.5 + r * .02); rc.drawImage(FB.c, 0, FB.oy - 6 - r - 4, FB.w, 4, off, r, FB.w, 4); }
  rc.globalCompositeOperation = 'source-atop'; rc.fillStyle = 'rgba(28,78,92,.68)'; rc.fillRect(0, 0, FB.w, 520);
  rc.globalCompositeOperation = 'destination-out'; for (let r = 18; r < 520; r += 26 + (r % 11)) rc.fillRect(0, r, FB.w, 2 + r * .012);
  const fd = rc.createLinearGradient(0, 0, 0, 480); fd.addColorStop(0, 'rgba(0,0,0,0)'); fd.addColorStop(1, 'rgba(0,0,0,1)'); rc.fillStyle = fd; rc.fillRect(0, 0, FB.w, 520);
  ctx.save(); ctx.globalAlpha = .8; ctx.drawImage(FB.rc, sx, GY + 2); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, GY - 3); ctx.clip(); ctx.drawImage(FB.c, sx, sy); ctx.restore();
  ctx.strokeStyle = 'rgba(220,252,244,.7)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(X0 + P.X + 8, GY, 56, 7, 0, 0, TAU); ctx.stroke();
  if (t > 4.4 && t < 5.2) { const age = t - 4.4; ctx.fillStyle = 'rgba(220,250,242,.9)';
    for (const d of FX.drops) { const px = X0 + P.X - 235 + d.vx * age, py = GY - 10 - d.vy * age + 900 * age * age; if (py > GY + 6) continue;
      ctx.beginPath(); ctx.ellipse(px, py, d.s, d.s * 1.3, 0, 0, TAU); ctx.fill(); } }
  // lantern glow (the painted lantern is unlit; code lights it)
  if (lit > 0) { const { x, y } = LAN; ctx.save(); ctx.globalCompositeOperation = 'screen';
    const g = ctx.createRadialGradient(x, y, 8, x, y, 520); g.addColorStop(0, `rgba(255,220,130,${.95 * lit})`); g.addColorStop(.12, `rgba(255,190,100,${.42 * lit})`); g.addColorStop(.45, `rgba(255,160,80,${.12 * lit})`); g.addColorStop(1, 'rgba(255,160,80,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 520, y - 520, 1040, 1040);
    ctx.globalAlpha = Math.min(1, lit); const hs = 170 * (.92 + .08 * lit); ctx.drawImage(FX.halo, x - hs, y - hs, 2 * hs, 2 * hs);
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,236,170,${.9 * Math.min(1, lit)})`; ctx.beginPath(); ctx.ellipse(x, y - 2, 9, 13, 0, 0, TAU); ctx.fill(); ctx.restore(); }
  // floating diamond motes
  for (const m of FX.motes) { const yy = m.y + Math.sin(t * m.f + m.p) * 14, xx = m.x + Math.sin(t * m.f * .7 + m.p * 2) * 10, a = m.a * (.55 + .45 * Math.sin(t * m.f * 1.7 + m.p));
    ctx.fillStyle = `rgba(206,236,234,${a})`; ctx.beginPath(); ctx.moveTo(xx, yy - m.s); ctx.lineTo(xx + m.s * .7, yy); ctx.lineTo(xx, yy + m.s); ctx.lineTo(xx - m.s * .7, yy); ctx.closePath(); ctx.fill(); }
  ctx.drawImage(FX.vig, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = .35; ctx.fillStyle = FX.grain; ctx.fillRect(0, 0, W, H); ctx.restore();
  Story.captions(ctx, t, S.lines, { font: "'Gowun Batang',serif", weight: 700, size: 64, color: '#f4f0e2', y: 420, shadow: 'rgba(6,26,36,.9)', shadowBlur: 20 });
}
async function init() {
  const [bg, w1, w2, st, ld] = await Promise.all(['bg', 'walk1', 'walk2', 'stand', 'load'].map(n => loadImg(`art/lab-storybook-${n}.webp`)));
  Object.assign(IMG, { bg, walk1: w1, walk2: w2, stand: st, load: ld });
  FB.c = Pilot.canvas(FB.w, FB.h); FB.x = FB.c.getContext('2d'); FB.rc = Pilot.canvas(FB.w, 520); FB.r = FB.rc.getContext('2d'); FB.rim = Pilot.canvas(FB.w, FB.h); FB.rimx = FB.rim.getContext('2d');
  const r = rng(101);
  FX.dash = []; for (let i = 0; i < 50; i++) { const y = WL + 30 + Math.pow(r(), 1.3) * 800; FX.dash.push({ x: r() * W, y, l: 20 + r() * 70 * (y - WL) / 500, w: 2 + r() * 1.5, a: .25 + r() * .3, f: .8 + r() * 1.6, p: r() * TAU }); }
  FX.steps = []; for (let k = -3; k <= 5; k++) { const tt = k * STEP; if (tt > 2.6) break; FX.steps.push({ t: tt, x: walkX(Math.max(0, tt)) + (tt < 0 ? tt * V : 0) + 30 }); }
  FX.drops = []; for (let i = 0; i < 16; i++) FX.drops.push({ vx: (r() - .5) * 360, vy: 260 + r() * 300, s: 2.5 + r() * 4 });
  FX.motes = []; for (let i = 0; i < 40; i++) FX.motes.push({ x: r() * W, y: 120 + r() * 1500, s: 3 + r() * 5, a: .3 + r() * .45, f: .4 + r() * .7, p: r() * TAU });
  { const n = 360, c = Pilot.canvas(n, n), x = c.getContext('2d'), rr = rng(77);
    for (let i = 0; i < 3400; i++) { const a = rr() * TAU, d = Math.pow(rr(), .7) * n / 2, k = 1 - d / (n / 2); x.fillStyle = `rgba(255,${200 + rr() * 50 | 0},${90 + rr() * 60 | 0},${.18 + k * .75})`; const s = 1.8 + rr() * 3 * k; x.fillRect(n / 2 + Math.cos(a) * d, n / 2 + Math.sin(a) * d, s, s); }
    FX.halo = c; }
  FX.vig = Pilot.canvas(W, H); { const x = FX.vig.getContext('2d'), g = x.createRadialGradient(W / 2, H * .52, H * .3, W / 2, H * .52, H * .78); g.addColorStop(0, 'rgba(6,20,30,0)'); g.addColorStop(1, 'rgba(6,20,30,.35)'); x.fillStyle = g; x.fillRect(0, 0, W, H); }
  FX.grain = Pilot.canvas(1, 1).getContext('2d').createPattern(Pilot.speckle(256, 256, 45, 3), 'repeat');
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 64px 'Gowun Batang'"], init, draw });
</script>
</body>
