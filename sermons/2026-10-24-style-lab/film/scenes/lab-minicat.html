<script>
/* 09 — minimal line on a flat field. One cornflower-blue field (the whole frame is still water) with a faint paper tooth;
   a thin, steady black hand line; a small white cat in cream pyjamas; the soft lavender of reflections (clouds, the moon,
   the cat itself, mirrored and simplified into blobs with a part-outline); sparse broken ripple arcs. Almost nothing
   moves: the cat trudges on twos under a big cloth bundle, each step leaves a small ring; ahead a little sparkler light
   catches (white rays, tiny star sparks, a pale warm core — and its reflection); the bundle slips off and lands on the

const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;

const G = 1130, FS = 1.3, CXF = 540;    // feet on the water; the cat is drawn scaled up around (CXF, G)

// ---------------- hand line (steady: a fixed tremor, no boil) ----------------
const wob = (p, a = 1) => [p[0] + (noise(p[0] * .05 + 40, p[1] * .05) - .5) * 1.6 * a, p[1] + (noise(p[0] * .05, p[1] * .05 + 90) - .5) * 1.6 * a];

const ell = (cx, cy, rx, ry, n = 24) => { const o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return o; };
const rot2 = (p, a) => [p[0] * Math.cos(a) - p[1] * Math.sin(a), p[0] * Math.sin(a) + p[1] * Math.cos(a)];

    L.push([line[i][0] - dy * wd[i], line[i][1] + dx * wd[i]]); R.push([line[i][0] + dy * wd[i], line[i][1] - dx * wd[i]]); }

// an irregular lavender blob (cloud reflection)
function blobPts(cx, cy, rx, ry, seed, n = 18) { const r = rng(seed), o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU, k = .72 + r() * .5 + .18 * Math.sin(a * 3 + seed);

// ---------------- prebuilt ----------------
let BG, GRAIN, GLOW, STEPS = [];
function init() {
  BG = Pilot.canvas(W, H); const b = BG.getContext('2d');
  b.fillStyle = C.field; b.fillRect(0, 0, W, H);
  // very faint tonal drift (paper, not gradient)
  const mw = 60, mh = 106, m = Pilot.canvas(mw, mh), mx = m.getContext('2d'), md = mx.createImageData(mw, mh);
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) { const v = Pilot.fbm(x * .08 + 9, y * .08 + 2, 3), i = (y * mw + x) * 4, k = (v - .5) * 2;
    md.data[i] = md.data[i + 1] = md.data[i + 2] = k > 0 ? 255 : 0; md.data[i + 3] = Math.abs(k) * 16; }
  mx.putImageData(md, 0, 0); b.drawImage(m, 0, 0, W, H);

  ink(b, ell(850, 670, 64, 50, 20).map((q, i) => [q[0] + Math.sin(i * 1.7) * 3, q[1] + Math.cos(i * 2.3) * 3]), { fill: C.moon, lw: 3 });
  // cloud reflections: lavender, part-outlined along their lower edges
  for (const [cx, cy, rx, ry, sd, part] of [[960, 1010, 170, 70, 11, [.0, .55]], [1040, 1110, 90, 40, 5, [.05, .5]], [150, 1560, 220, 80, 7, [-.05, .6]], [360, 1640, 140, 34, 13, [0, .5]], [60, 820, 110, 30, 17, [0, .5]]])
    ink(b, blobPts(cx, cy, rx, ry, sd, 20), { fill: C.lav, lw: 3, part });
  // reflected stars: a few tiny white specks
  const r = rng(21); b.fillStyle = 'rgba(240,244,255,.8)'; for (let i = 0; i < 24; i++) { b.beginPath(); b.arc(r() * W, 160 + r() * 1600, .9 + r() * 1.4, 0, TAU); b.fill(); }
  // paper tooth: fine, light
  GRAIN = Pilot.canvas(W, H); const g = GRAIN.getContext('2d'), gd = g.createImageData(W, H), rr = rng(9);
  for (let i = 0; i < W * H; i++) { const v = rr() - .5, j = i * 4; if (v > 0) { gd.data[j] = gd.data[j + 1] = gd.data[j + 2] = 255; gd.data[j + 3] = v * 34; } else { gd.data[j] = 10; gd.data[j + 1] = 20; gd.data[j + 2] = 50; gd.data[j + 3] = -v * 38; } }
  g.putImageData(gd, 0, 0);
  GLOW = Pilot.canvas(128, 128); { const x = GLOW.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,246,214,1)'); gr.addColorStop(.25, 'rgba(255,238,196,.55)'); gr.addColorStop(.6, 'rgba(240,226,200,.12)'); gr.addColorStop(1, 'rgba(230,220,210,0)'); x.fillStyle = gr; x.fillRect(0, 0, 128, 128); }
  // footfalls: when each foot lands (for the step rings)
  let prev = null;
  for (let i = 0; i <= 26 * 12; i++) { const t = i / 120; if (t > B.stop) break; const ph = pose(t).ph;
    if (prev != null) for (const off of [0, .5]) if (Math.floor(prev + off) !== Math.floor(ph + off)) { STEPS.push([t, legFoot(ph, off, pose(t).hip[0]).x + (off ? -6 : 4)]); }
    prev = ph; }
}

// ---------------- the cat (poses on twos) ----------------
const D = 62, CYC = 1.5, STANCE = .6, LEG1 = 25, LEG2 = 25, X0 = 395;
function pose(t) {
  const u = clamp(t / B.stop), dist = D * CYC * (1.5 * u - .5 * u * u * u), ph = dist / D;
  const sag = ss(B.stop, B.stop + .35, t) * (1 - ss(B.drop + .15, B.drop + .7, t));
  const look = ss(B.look + .05, B.look + .5, t), relief = ss(B.drop + .1, B.drop + .8, t), walking = t < B.stop;
  const bob = walking ? 4 * (.5 + .5 * Math.cos(ph * 2 * TAU)) : 0;
  const breath = Math.sin((t - B.drop) * 2.4) * ss(B.drop + .7, B.drop + 1.3, t);
  const hip = [X0 + dist, G - 46 + bob + sag * 4 - relief * 2 - breath];
  const lean = lerp(.24 + (walking ? .03 * Math.cos(ph * 2 * TAU) : 0) + sag * .07 - look * .08, .02, eo(relief));
  const head = lerp(lerp(.34 + sag * .12, -.2, eio(look)), -.05, relief);

function legFoot(ph, off, hipX) {

  if (p < STANCE) rel = L / 2 - p / STANCE * L; else { const q = (p - STANCE) / (1 - STANCE); rel = -L / 2 + L * ss(0, 1, q); lift = Math.sin(Math.PI * q) * 9; }

function ik(h, f, l1, l2) {
  const dx = f[0] - h[0], dy = f[1] - h[1], d = Math.min(Math.hypot(dx, dy), l1 + l2 - .5), a = Math.atan2(dy, dx);
  const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));

const BUND = [[-58, -50], [-74, -14], [-76, 30], [-62, 60], [-30, 74], [12, 76], [48, 64], [66, 36], [68, -6], [56, -40], [30, -58], [0, -62], [-30, -60]];
function bundle(ctx, c, ang, sx, sy, fill, part) {
  const T = p => { const q = rot2([p[0] * sx, p[1] * sy], ang); return [c[0] + q[0], c[1] + q[1]]; };
  ink(ctx, BUND.map(T), { fill, part });

  ink(ctx, [[-14, -58], [-34, -86], [-6, -78], [4, -62], [16, -80], [40, -84], [22, -56]].map(T), { fill });   // knot ears
  ink(ctx, ell(4, -60, 12, 8, 14).map(T), { fill });
  ink(ctx, [[-40, -30], [-50, 6]].map(T), { closed: false, lw: 2.4 }); ink(ctx, [[30, 30], [44, 50]].map(T), { closed: false, lw: 2.4 });
}
function bundlePose(tp, p, TF) {
  if (tp < B.drop) return { c: TF(-66, 76), a: p.lean * .9, sx: 1, sy: 1, on: true, landed: false };
  const p0 = pose(B.drop), a0 = p0.lean, c0 = [p0.hip[0] - 66 * Math.cos(a0) + 76 * Math.sin(a0), p0.hip[1] - 66 * Math.sin(a0) - 76 * Math.cos(a0)];
  const c1 = [p0.hip[0] - 120, G - 58], s = clamp((tp - B.drop) / .24);
  let c = [lerp(c0[0], c1[0], s), c0[1] + (c1[1] - c0[1]) * s * s], sx = 1, sy = 1;
  const k = tp - (B.drop + .24); if (k >= 0) { const sq = Math.exp(-k * 7) * Math.cos(k * 18); sy = 1 - .1 * sq; sx = 1 + .07 * sq; c = [c[0], G - 58 * sy + Math.sin(k * 3.2) * 2 * ss(.3, 1, k)]; }

function drawCat(ctx, tp, refl) {

    if (!bp.on) { ctx.save(); ctx.translate(0, 2 * G + 6); ctx.scale(1, -1); bundle(ctx, [bp.c[0], Math.min(bp.c[1], G - 58 * bp.sy)], bp.a, bp.sx, bp.sy, C.refl, [.3, .85]); ctx.restore(); }

  // straps over the shoulder

  const nk = TF(6, 80), hc = [nk[0] + hu[0] * 50 + hf[0] * 6, nk[1] + hu[1] * 50 + hf[1] * 6];
  const HF = (u, v) => [hc[0] + u * hf[0] + v * hu[0], hc[1] + u * hf[1] + v * hu[1]];
  ink(ctx, [[-30, 8], [-12, -4], [0, 6], [14, -4], [32, 8], [14, 20], [0, 12], [-14, 20]].map(q => TF(q[0] + 4, q[1] + 78)), { fill: C.white, lw: 2.6 });
  const head = [[-54, -10], [-56, 14], [-52, 34], [-46, 62], [-30, 44], [0, 46], [24, 46], [44, 64], [52, 34], [58, 12], [56, -12], [38, -34], [0, -40], [-36, -34]].map(q => HF(q[0], q[1]));
  ink(ctx, head, { fill: C.white });
  ink(ctx, [HF(-36, 38), HF(-30, 28)], { closed: false, lw: 2.2 }); ink(ctx, [HF(30, 38), HF(26, 28)], { closed: false, lw: 2.2 });
  // brows (worried) — the cat faces a little toward us and right

// ---------------- light ahead: a sparkler star over the water ----------------
const SP = [790, 870];
function sparkler(ctx, tp, t, mirror) {

  ctx.globalAlpha = on * a * .35; ctx.drawImage(GLOW, cx - 170, cy - 170, 340, 340);
  ctx.globalAlpha = on * a; ctx.strokeStyle = mirror ? '#dfe6f6' : '#ffffff'; ctx.lineCap = 'round';

// ---------------- ripples ----------------

function ripples(ctx, t) {
  // the big quiet rings across the field, centred near the cat, very slowly widening
  const cx = 520, cy = 1190, g = t * 3.2;
  for (const [rx, a0, span] of FIELD_ARCS) { const R = rx + g; arc(ctx, cx, cy, R, R * .42, a0, a0 + span, 2.6); }
  for (const [rx, a0, span] of [[430, 3.6, .35], [470, 4.5, .3], [520, 5.4, .28], [400, 4.0, .2], [560, 3.9, .22]]) { const R = rx + g * .7; arc(ctx, 560, 900, R, R * .3, a0, a0 + span, 2.6); }
  // step rings
  for (const [t0, x] of STEPS) { const k = (t - t0) / 1.6; if (k < 0 || k > 1) continue; const wx = CXF + (x - CXF) * FS, a = 1 - k;
    ctx.save(); ctx.globalAlpha = a; const R = 22 + k * 90; arc(ctx, wx, G + 4, R, R * .32, .1, 1.1, 2.4); arc(ctx, wx, G + 4, R, R * .32, 2.2, 3.0, 2.4); arc(ctx, wx, G + 4, R * .6, R * .2, 3.6, 4.6, 2.2); ctx.restore(); }
  // the bundle lands: rings widen slowly, a few drops
  const land = B.drop + .24; if (t >= land) { const p0 = pose(B.drop), x = CXF + (p0.hip[0] - 120 - CXF) * FS, y = G + 4;
    for (let i = 0; i < 4; i++) { const k = (t - land - i * .28) / 2.6; if (k < 0 || k > 1) continue; const R = 90 + eo(k) * 380, a = (1 - k) * (i ? .85 : 1);
      ctx.save(); ctx.globalAlpha = a; arc(ctx, x, y, R, R * .32, -.2 + i, 1.3 + i, 2.8); arc(ctx, x, y, R, R * .32, 2.0 + i, 3.3 + i, 2.8); arc(ctx, x, y, R * .95, R * .3, 4.2 + i, 5.1 + i, 2.4); ctx.restore(); }
    const dk = (t - land) / .45; if (dk < 1) { ctx.save(); ctx.globalAlpha = 1 - dk * dk;
      for (const [vx, vy] of [[-120, -220], [-60, -300], [70, -280], [130, -200], [10, -330]]) { const dx = x + vx * dk * .9, dy = y - 40 + vy * dk + 700 * dk * dk;
        ink(ctx, [[dx, dy - 7], [dx + 4, dy + 1], [dx, dy + 4], [dx - 4, dy + 1]], { fill: C.white, lw: 2 }); } ctx.restore(); } }
}

function draw(ctx, t) {
  const tp = t12(t);
  ctx.drawImage(BG, 0, 0);
  ripples(ctx, t);
  sparkler(ctx, tp, t, true);
  ctx.save(); ctx.translate(CXF, G); ctx.scale(FS, FS); ctx.translate(-CXF, -G); LWK = 1 / FS;
  drawCat(ctx, tp, true);
  drawCat(ctx, tp, false);
  ctx.restore(); LWK = 1;
  sparkler(ctx, tp, t, false);
  Story.captions(ctx, t, S.lines, { font: "'Hi Melody',cursive", weight: 400, size: 80, y: 400, color: C.ink, shadow: 'rgba(0,0,0,0)', shadowBlur: 0 });
  ctx.drawImage(GRAIN, 0, 0);
}

Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 80px 'Hi Melody'"], init, draw });
</script>
