<h1>word-log</h1>
<p class="muted">주일 설교를 짧은 세로 영상(쇼츠·릴스)으로 만드는 개인 작업 도구</p>
<p>word-log는 한 교회의 주일 설교를 30초 안팎의 세로 영상으로 만들고, 운영자 본인의 유튜브 채널에 올리는 데 쓰는 도구입니다.
영상은 코드로 그린 그림과 자막으로 만들며, 공개 서비스가 아니라 운영자 한 사람만 사용합니다.</p>
