<script>window.FILM_SRC = 'ko'; window.FILM_FONTS = { serif: "'Gowun Batang'", sans: "'Noto Sans KR'" };</script>
<script src="lib.js"></script>
<script src="story.js"></script><script src="source.js"></script><script src="script.js"></script><script src="kit-charcoal.js"></script>
<script>
/* 아빠 없다고 해 — house style `charcoal` (styles/charcoal/STYLE.md), daylight version.
   POV: I am the father at the near side of a dining table; the child sits across. The phone buzzes, my hand slides it
   over ("아빠 없다고 해"), the child lies for me. The red (the one colour) is the lie: it smears from my fingers along the
   table. The child is erased and redrawn in the same chair (Kentridge's metamorphosis) — a teenager slides the phone back
   to me, then a father slides it to his own child; the ghosts of earlier drawings stay on the paper. The eraser takes it
   all back to the first morning, and this time my hand picks the phone up myself.
   World units are metres (table top y = .72, I sit at z = 0 looking down +z); C.persp projects them. Pure function of t. */
const C = Charcoal, S = window.SCRIPT, B = S.beat;
const { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;
const W = Pilot.W, H = Pilot.H, SC = H / 1920;
const F = 1150 * SC, CAM = C.persp({ F, cx: W / 2, cy: 680 * SC, eye: 1.15 });
const P = CAM.P, TY = .72;                                 // table top height
const pt = (x, z, y = TY) => P(x, y, z);                   // a point on (or above) the table → frame px
const pxm = z => F / z;                                    // px per metre at depth z
const CAPY = 300 * SC;                                     // captions sit a little higher than the kit default (heads below)
const HITLINE = 4, HITY = 640 * SC;                        // the line after the hit sits lower, over the dark room (the teen's face stays visible above it)
const u = (t, a, b) => clamp((t - a) / (b - a));
let wall, table;

/* ------------------------------------------------------------------ the timeline */
const PH0 = [.10, .64], PH1 = [.0, .87], PH2 = [.12, .73], PH3 = [-.03, .90], PH4 = [.24, .90];
function phoneState(t) {     // where the phone is: on the table (x, z, angle) or held at the child's ear; buzzing amount
  const s = { on: true, x: PH0[0], z: PH0[1], a: .12, ring: 0 };
  if (t < B.back[1] - .4 || t >= B.back[0] + .4) {         // era 0 (and the return to it)
    if (t >= B.back[0]) { s.ring = t < B.answer[0] + .45 ? .85 : 0;
      const k = eio(u(t, B.answer[0] + .4, B.answer[1])); s.lift = k; return s; }
    const k = eio(u(t, B.push1[0], B.push1[1]));
    s.x = lerp(PH0[0], PH1[0], k); s.z = lerp(PH0[1], PH1[1], k); s.a = lerp(.12, -.08, k);
    s.ring = t < B.pick[0] + .5 ? .85 : 0;
    if (t >= B.pick[0]) { const up = eio(u(t, B.pick[0], B.pick[1])) * (1 - eio(u(t, B.down[0], B.down[1])));
      s.held = up; if (t >= B.down[0]) { s.x = lerp(PH1[0], .05, eio(u(t, B.down[0], B.down[1]))); s.z = lerp(PH1[1], .89, eio(u(t, B.down[0], B.down[1]))); } }
    if (t >= B.down[1]) { s.x = .05; s.z = .89; s.a = -.05; }
    if (t >= B.grow1[0]) { s.ring = t >= B.ring1 && t < B.push2[1] ? .9 : 0;
      const k2 = 1 - Math.pow(1 - u(t, B.push2[0] + .35, B.push2[1]), 3); s.x = lerp(.05, PH2[0], k2); s.z = lerp(.89, PH2[1], k2); s.a = lerp(-.05, .25, k2); }
    if (t >= B.grow2[0] + .45) { s.x = PH3[0]; s.z = PH3[1]; s.a = 1.5; s.ring = t < B.push3[1] ? 1 : 0;
      const k3 = eio(u(t, B.push3[0], B.push3[1])); s.x = lerp(PH3[0], PH4[0], k3); s.a = lerp(1.5, 1.7, k3); }
  }
  return s;
}
// age of whoever sits across the table: 0 child · 1 teen · 2 father (his child appears beside him) · back to 0
const ageAt = t => t >= B.back[0] + .4 ? 0 : t < B.grow1[0] ? 0 : t < B.grow1[1] ? eio(u(t, ...B.grow1)) : t < B.grow2[0] ? 1 : t < B.grow2[1] ? 1 + eio(u(t, ...B.grow2)) : 2;
const ERA_LIGHT = t => t >= B.back[0] + .4 ? 0 : lerp(0, 1, ss(B.grow1[0], B.grow1[1], t)) + lerp(0, 1, ss(B.grow2[0], B.grow2[1], t));
function state(t) {
  const s = { t, age: ageAt(t), ph: phoneState(t) };
  s.era = ERA_LIGHT(t);                                         // 0 morning · 1 afternoon · 2 evening (light on the wall)
  const back = 1 - ss(B.back[0], B.back[0] + .5, t);
  s.dim = (.2 * ss(B.grow1[0], B.grow1[1], t) + .22 * ss(B.grow2[0], B.grow2[1], t) + .08 * ss(B.flood[0], B.flood[1], t)) * back;   // each generation darker
  s.hit = (t >= B.hit ? Math.max(.55, 1 - (t - B.hit) * .25) : 0) * (1 - ss(B.grow2[0] - .3, B.grow2[0] + .3, t));   // the room goes dark around my hand
  s.red = 1 - ss(B.back[0], B.back[0] + .45, t);                // the eraser takes the red away at the return
  // camera: close on the child's face (the lie) → mid shot (its red fingers, its smile) → slammed in on my hand at the hit
  const creep = C.push(t, 0, B.grow1[0], .04, k => k) * (t < B.back[0] ? 1 : 0);
  const wf = eio(u(t, ...B.face)) * (1 - eio(u(t, B.down[0] - .1, B.down[1] + .1)));
  const wm = eio(u(t, B.down[0] - .1, B.down[1] + .1)) * (1 - eio(u(t, B.grow1[0] - .2, B.grow1[1])));
  const wn = eo(u(t, B.hit, B.hit + .6)) * (1 - eio(u(t, B.grow2[0] - .3, B.grow2[1])));
  const wl = C.push(t, B.push3[0], 3.5, 1) * back;
  s.zm = 1 + creep + 1.0 * wf + .32 * wm + .18 * wn + .05 * wl;
  const wb = Math.max(0, 1 - wf - wm - wn), sum = wf + wm + wn + wb;
  s.zc = [(540 * wf + 560 * wm + 700 * wn + 540 * wb) * SC / sum, (835 * wf + 990 * wm + 1560 * wn + 880 * wb) * SC / sum];
  [s.ox, s.oy] = C.shake(t, C.kick(t, B.hit, .7, 16) + C.kick(t, B.push3[1], .4, 4)); s.oy -= 105 * SC * wn;   // my hand and phone low, the teen's face (watching me) at the top
  return s;
}

/* ------------------------------------------------------------------ the room (static plates) */
function buildWall() {
  const c = C.sheet(1.3), x = c.getContext('2d'), R = rng(5); let sd = 10;
  const Z = 2.2, wp = (X, Y) => P(X, Y, Z);
  x.fillStyle = `rgba(${C.TONE},.30)`; x.fillRect(0, 0, W, H);                                   // the wall: rubbed mid-grey
  for (let k = 0; k < 70; k++) { const xx = R() * W, y0 = R() * H * .7; C.sweep(x, C.seg([xx, y0], [xx + (R() - .5) * 30, y0 + (200 + R() * 500) * SC], 6), (26 + R() * 40) * SC, .08 + R() * .12, sd++); }
  C.blob(x, W * .9, H * .2, 520 * SC, 700 * SC, .3); C.blob(x, W * .05, H * .05, 400 * SC, 300 * SC, .25);
  // the window (left): lifted out, with a cross of mullions; the sill below it
  const wl = wp(-.95, 1.92), wr = wp(-.22, 1.0);
  const win = [[wl[0], wl[1]], [wr[0], wl[1]], [wr[0], wr[1]], [wl[0], wr[1]]];
  C.lift(x, win, .78);
  for (let k = 0; k < 12; k++) { const yy = lerp(wl[1], wr[1], R()); C.sweep(x, [[wl[0], yy], [wr[0], yy + (R() - .5) * 8]], 14 * SC, .05, sd++, C.stickW); }
  C.blob(x, lerp(wl[0], wr[0], .7), lerp(wl[1], wr[1], .75), 120 * SC, 90 * SC, .16);                // a tree outside, smudged
  C.blob(x, lerp(wl[0], wr[0], .3), lerp(wl[1], wr[1], .85), 150 * SC, 70 * SC, .14);
  const mx = (wl[0] + wr[0]) / 2, my = lerp(wl[1], wr[1], .42);
  for (const ln of [[[mx, wl[1]], [mx, wr[1]]], [[wl[0], my], [wr[0], my]]]) { C.sweep(x, C.seg(ln[0], ln[1], 6), 12 * SC, .55, sd++); C.vine(x, C.seg(ln[0], ln[1], 8), 2.4, .8, sd++); }
  for (let i = 0; i < 4; i++) C.vine(x, C.seg(win[i], win[(i + 1) % 4], 10, 2, R), 3, .9, sd++);
  const s0 = wp(-1.0, .99), s1 = wp(-.17, .95);
  x.fillStyle = `rgba(${C.TONE},.5)`; x.fillRect(s0[0], s0[1] - 4 * SC, s1[0] - s0[0], s1[1] - s0[1] + 14 * SC);
  C.vine(x, [[s0[0], s0[1] - 4 * SC], [s1[0], s0[1] - 4 * SC]], 2.6, .85, sd++); C.vine(x, [[s0[0], s1[1] + 10 * SC], [s1[0], s1[1] + 10 * SC]], 2, .6, sd++);
  // the clock (right): face lifted, rim in vine, twelve ticks (the hands are drawn per frame)
  const ck = CLOCK, rr = ck.r;
  C.poly(x, Array.from({ length: 36 }, (_, i) => [ck.x + Math.cos(i / 36 * 6.283) * rr, ck.y + Math.sin(i / 36 * 6.283) * rr])); C.fillA(x, .85, '255,255,255');
  for (let k = 0; k < 2; k++) C.vine(x, Array.from({ length: 37 }, (_, i) => [ck.x + Math.cos(i / 36 * 6.283) * (rr + k * 5), ck.y + Math.sin(i / 36 * 6.283) * (rr + k * 5)]), 3 - k, .85, sd++);
  for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; C.vine(x, [[ck.x + Math.cos(a) * rr * .8, ck.y + Math.sin(a) * rr * .8], [ck.x + Math.cos(a) * rr * .92, ck.y + Math.sin(a) * rr * .92]], 2.4, .8, sd++, '#000', 0); }
  // the chair back behind whoever sits there (a child is small against it, a grown man fills it)
  const rail = Array.from({ length: 13 }, (_, i) => { const k = i / 12; return P(lerp(-.2, .2, k), .9 + .02 * Math.sin(Math.PI * k), 1.28); });
  const rail2 = rail.map(q => [q[0], q[1] + 26 * SC]);
  C.tone(x, rail.concat(rail2.slice().reverse()), .7); C.sweep(x, rail, 22 * SC, .5, sd++);
  C.vine(x, rail, 2.6, .9, sd++); C.vine(x, rail2, 2.2, .8, sd++); C.vine(x, rail.map(q => [q[0], q[1] + 5 * SC]), 1.4, .3, sd++, '#fff', .2);
  for (const k of [0, 12]) { const top = rail2[k], bot = P(k ? .2 : -.2, .74, 1.28), pw = 13 * SC;
    C.tone(x, [[top[0] - pw, top[1]], [top[0] + pw, top[1]], [bot[0] + pw, bot[1]], [bot[0] - pw, bot[1]]], .7);
    C.vine(x, [[top[0] - pw, top[1]], [bot[0] - pw, bot[1]]], 2.4, .85, sd++); C.vine(x, [[top[0] + pw, top[1]], [bot[0] + pw, bot[1]]], 2.4, .85, sd++); }
  return c;
}
const CLOCK = (() => { const [x, y] = P(.5, 1.36, 2.2); return { x, y, r: .12 * F / 2.2 }; })();
function buildTable() {          // transparent outside the table: drawn over the bodies of whoever sits across
  const c = C.sheet(1.3, null, W, H * 1.35), x = c.getContext('2d'), R = rng(31); let sd = 300;
  const far = 1.0, near = .3, hx = .9;
  const top = [pt(-hx, far), pt(hx, far), pt(hx, near), pt(-hx, near)];
  C.smudgeFill(x, top, .42, sd++, 10);
  for (let k = 0; k < 46; k++) { const xx = lerp(-hx, hx, R()); C.sweep(x, CAM.seg([xx, TY, far], [xx + (R() - .5) * .03, TY, near + .02], 10), (8 + R() * 18) * SC, .1 + R() * .14, sd++); }  // grain toward me
  const e0 = pt(-hx, far), e1 = pt(hx, far);
  C.vine(x, C.seg(e0, e1, 30, 3, R), 3, .9, sd++); C.vine(x, C.seg([e0[0], e0[1] + 6], [e1[0], e1[1] + 6], 30, 3, R), 1.6, .5, sd++, '#fff', .3);   // far edge, lifted lip
  x.fillStyle = `rgba(${C.TONE},.62)`; x.fillRect(0, e0[1] + 8 * SC, W, 16 * SC);   // the edge's thickness (shadowed)
  C.vine(x, C.seg([e0[0], e0[1] + 24 * SC], [e1[0], e1[1] + 24 * SC], 30, 3, R), 2, .7, sd++);
  for (let k = 0; k < 6; k++) C.blob(x, (k % 2 ? W * 1.02 : -W * .02), lerp(H * .62, H * 1.3, k / 5), 280 * SC, 300 * SC, .3); C.blob(x, W / 2, H * 1.15, W * .8, H * .2, .25);   // vignette
  return c;
}

/* ------------------------------------------------------------------ hands (top view, metres; palm down, fingers +z) */
// fingers [x of base, length, width, splay]; the thumb sits on the -x side of a right hand
const FING = [[-.031, .082, .019, -.10], [-.010, .091, .019, -.03], [.011, .086, .018, .04], [.031, .068, .016, .12]];
function handGeo(o) {      // o: {x, z, a (rad, 0 = fingers away from me), s (scale), side (1 right, -1 left), y, curl}
  const s = o.s || 1, sd = o.side || 1, ca = Math.cos(o.a), sa = Math.sin(o.a), y = o.y ?? TY + .012;
  const w = (lx, lz) => { lx *= s * sd; lz *= s; return [o.x + lx * ca + lz * sa, o.z - lx * sa + lz * ca]; };
  const pr = (lx, lz, dy = 0) => { const q = w(lx, lz); return P(q[0], y + dy, q[1]); };
  const palm = [[-.036, 0], [.034, 0], [.043, .06], [.04, .1], [-.042, .1], [-.046, .05]].map(q => pr(q[0], q[1]));
  const fingers = FING.map(([bx, L, fw, sp]) => { const cu = o.curl || 0, L2 = L * (1 - .35 * cu);
    const b = [bx, .095], m = [bx + Math.sin(sp) * L2 * .5, .095 + Math.cos(sp) * L2 * .5], tp = [bx + Math.sin(sp) * L2, .095 + Math.cos(sp) * L2];
    const zb = w(...b)[1]; return { pts: [pr(...b), pr(...m), pr(...tp)], w: fw * s * pxm(zb), tipL: [m, tp].map(q => w(...q)) }; });
  const th = [[-.038, .03], [-.062, .06], [-.072, .088]];
  const thumb = { pts: th.map(q => pr(...q)), w: .022 * s * pxm(w(...th[0])[1]) };
  const wrist = [pr(-.037, -.004), pr(.035, -.004)];
  return { palm, fingers, thumb, wrist, w, pr, s };
}
// a sleeve from the wrist to a far point (off frame, or the shoulder); dark for me, set per person
function drawSleeve(x, wr, end0, end1, a, sd) {
  const q = [wr[0], wr[1], end1, end0];
  C.smudgeFill(x, q, a, sd, 5); C.vine(x, [wr[0], end0], 2.6, .8, sd + 1); C.vine(x, [wr[1], end1], 2.6, .8, sd + 2);
  C.vine(x, C.seg(wr[0], wr[1], 4), 3, .85, sd + 3);   // the cuff
}
const handPath = (l, g) => { C.poly(l, g.palm); l.fill(); l.lineCap = 'round'; l.lineJoin = 'round';
  for (const f of g.fingers.concat([g.thumb])) { l.lineWidth = f.w; l.beginPath(); f.pts.forEach((p, i) => i ? l.lineTo(...p) : l.moveTo(...p)); l.stroke(); } };
// every cast shadow of the frame in ONE soft layer (hands and the phone, offset away from the window)
function shadows(x, hands, phonePts) {
  C.layer(x, l => { l.translate(10 * SC, 14 * SC); l.fillStyle = l.strokeStyle = `rgba(${C.TONE},1)`; for (const g of hands) handPath(l, g);
    if (phonePts) { C.poly(l, phonePts); l.fill(); } l.translate(-10 * SC, -14 * SC); }, { blur: 5, alpha: .35 });
}
function drawHand(x, g, tone, sd) {
  // skin: one opaque rubbed value (B = 255: smooth, no grain), so overlapping finger strokes never darken twice
  const v = Math.round(255 * (1 - tone)); x.fillStyle = x.strokeStyle = `rgb(${v},${v},255)`; handPath(x, g);
  // outlines: each finger's two edges (broken vine), the palm's sides, knuckles
  const edge = (pts, d) => pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], an = Math.atan2(b[1] - a[1], b[0] - a[0]) + Math.PI / 2; return [p[0] + Math.cos(an) * d, p[1] + Math.sin(an) * d]; });
  let k = sd;
  for (const f of g.fingers.concat([g.thumb])) {
    const tipDir = [f.pts[2][0] - f.pts[1][0], f.pts[2][1] - f.pts[1][1]], L = Math.hypot(...tipDir) || 1, tip = [f.pts[2][0] + tipDir[0] / L * f.w * .45, f.pts[2][1] + tipDir[1] / L * f.w * .45];
    const e1 = edge(f.pts, f.w * .48), e2 = edge(f.pts, -f.w * .48);
    C.vine(x, e1.concat([tip]), 2.2, .85, k++, '#000', .04); C.vine(x, e2.concat([tip]), 2.2, .85, k++, '#000', .04);
    C.vine(x, edge(f.pts.slice(0, 2), f.w * .2), 1.4, .25, k++, '#fff', .1);                           // a lifted highlight along it
  }
  C.vine(x, [g.palm[5], g.palm[0]], 2.4, .8, k++); C.vine(x, [g.palm[1], g.palm[2], g.palm[3]], 2.4, .85, k++);
  for (const f of g.fingers) C.vine(x, [[f.pts[0][0] - f.w * .3, f.pts[0][1] + 2], [f.pts[0][0] + f.w * .3, f.pts[0][1] - 1]], 1.6, .5, k++);   // knuckles
  for (const f of g.fingers) { const p = f.pts[1]; C.vine(x, [[p[0] - f.w * .28, p[1]], [p[0] + f.w * .28, p[1]]], 1.2, .4, k++); }        // the middle joint crease
}

/* ------------------------------------------------------------------ the person across the table */
// one parameter set per age; morphing = lerp between neighbours (Kentridge redraws the same figure, it does not cut)
const AGES = [
  { x: 0, hy: 1.00, hr: .088, el: 1.07, sh: .145, shy: .845, body: .2, neck: .028 },     // child
  { x: 0, hy: 1.22, hr: .096, el: 1.2, sh: .205, shy: 1.06, body: .62, neck: .04 },       // teenager (dark hoodie)
  { x: -.17, hy: 1.30, hr: .1, el: 1.24, sh: .235, shy: 1.135, body: .34, neck: .045 },   // grown up: a father now
];
const SEATZ = 1.1;
function ageParams(a) { const i = Math.min(1, Math.floor(a)), k = a - i, A = AGES[i], Bq = AGES[Math.min(2, i + 1)]; const o = {}; for (const key in A) o[key] = lerp(A[key], Bq[key], k); o.age = a; return o; }
function personScr(p) {   // world params → screen numbers
  const s = pxm(SEATZ), c = P(p.x, p.hy, SEATZ);
  return { cx: c[0], hy: c[1], hr: p.hr * s, ry: p.hr * s * p.el, sh: p.sh * s, shy: P(0, p.shy, SEATZ)[1], neck: p.neck * s, body: p.body, s };
}
function drawPerson(x, p, look, sd, opt = {}) {
  const q = personScr(p); q.alpha = opt.alpha ?? 1; const { cx, hy, hr, ry, sh, shy } = q, w = k => Math.max(0, 1 - Math.abs(p.age - k)), R = rng(sd);
  const alpha = opt.alpha ?? 1, ghost = opt.ghost;
  const bot = pt(0, 1.0)[1] + 40 * SC;
  // body: shoulders and chest down behind the table edge
  const nb = shy - hr * .12;   // the neck meets the shoulders; the shoulder line is nearly level
  const body = [[cx - q.neck * 1.5, nb], [cx + q.neck * 1.5, nb], [cx + sh * .78, shy - hr * .04], [cx + sh, shy + hr * .32], [cx + sh * 1.04, bot], [cx - sh * 1.04, bot], [cx - sh, shy + hr * .32], [cx - sh * .78, shy - hr * .04]];
  if (!ghost) { const nk = [[cx - q.neck, hy + ry * .7], [cx + q.neck, hy + ry * .7], [cx + q.neck * 1.1, nb + 4], [cx - q.neck * 1.1, nb + 4]];
    C.lift(x, nk, .9 * alpha); C.tone(x, nk, .14 * alpha); C.vine(x, [nk[0], nk[3]], 2, .7 * alpha, sd + 5); C.vine(x, [nk[1], nk[2]], 2, .7 * alpha, sd + 6); }
  const bodyC = Pilot.catmull ? body : body;
  if (!ghost) {
    C.lift(x, bodyC, .95 * alpha); C.smudgeFill(x, bodyC, p.body * alpha, sd, 6);
    if (w(0) > .05) for (let k = 0; k < 3; k++) { const yy = shy + hr * (.5 + k * .5); C.sweep(x, [[cx - sh * .95, yy], [cx + sh * .95, yy + 4]], 16 * SC, .3 * w(0) * alpha, sd + 10 + k); }   // the child's stripes

  const palm = [[px0 - pw * .1, py0 + phh * .45], [px0 + pw * .95, py0 + phh * .42], [px0 + pw * 1.05, py0 + phh * 1.05], [hand[0] + pw * .3, hand[1] + pw * 1.25], [px0 - pw * .05, py0 + phh * 1.0]];
  C.poly(x, palm); x.fill(); C.vine(x, palm.concat([palm[0]]), 2.2, .8, 263);
  for (let i = 0; i < 4; i++) { const fy = py0 + phh * (.4 + i * .15), fx = px0 + pw * 1.0;
    C.poly(x, Array.from({ length: 12 }, (_, j) => [fx + Math.cos(j / 12 * 6.283) * pw * .2, fy + Math.sin(j / 12 * 6.283) * phh * .075])); x.fill();
    C.vine(x, Array.from({ length: 8 }, (_, j) => { const a = -Math.PI / 2 + j / 7 * Math.PI; return [fx + Math.cos(a) * pw * .2, fy + Math.sin(a) * phh * .075]; }), 1.8, .8, 270 + i); }
  C.vine(x, [[px0 - pw * .02, py0 + phh * .55], [px0 - pw * .12, py0 + phh * .35]], 3.4, .7, 280);   // the thumb along the inner edge
}
function drawPhoneHeld(x, g, ph, t) {   // the phone in my lifting hand (between thumb and fingers)
  const c = g.pr(-.005, .07), w = .075 * pxm(.5) * (1 + ph.lift * .6), h = w * 1.9;
  const r = [[c[0] - w / 2, c[1] - h * .55], [c[0] + w / 2, c[1] - h * .55], [c[0] + w / 2, c[1] + h * .45], [c[0] - w / 2, c[1] + h * .45]];
  C.poly(x, r); C.fillA(x, .92); C.vine(x, r.concat([r[0]]), 2.4, .9, 850);
  drawHand(x, g, .32, 860);
}

let redCv, redCtx;
function occlude(rc, myG, mh, G, phS, ph) {   // the red smear lies ON the table: hands, sleeves and the phone cover it
  const c = C.cam; rc.save(); rc.setTransform(c.zm, 0, 0, c.zm, c.zc[0] * (1 - c.zm) + c.ox, c.zc[1] * (1 - c.zm) + c.oy);
  rc.globalCompositeOperation = 'destination-out'; rc.fillStyle = '#000'; rc.strokeStyle = '#000'; rc.lineCap = 'round'; rc.lineJoin = 'round';
  const hand = g => { C.poly(rc, g.palm); rc.fill(); for (const f of g.fingers.concat([g.thumb])) { rc.lineWidth = f.w * 1.05; rc.beginPath(); f.pts.forEach((p, i) => i ? rc.lineTo(...p) : rc.moveTo(...p)); rc.stroke(); } };
  if (myG) { hand(myG); const se = sleeveEnds(mh); C.poly(rc, [myG.wrist[0], myG.wrist[1], se[1], se[0]]); rc.fill(); }
  for (const k of ['l', 'r', 'k', 'k2']) if (G[k]) hand(G[k]);
  if (phS) { C.poly(rc, phS); rc.fill(); }
  rc.restore();
}
async function init() {
  C.init(); redCv = Pilot.canvas(W, H); redCtx = redCv.getContext('2d');
  wall = buildWall(); table = buildTable(); buildRed(); buildFlood();
}

Pilot.run({ audio: (Pilot.cut ? 'lie-charcoal-' + Pilot.cut + '.m4a' : 'soundtrack.m4a'), W, H, dur: S.DUR, fonts: C.FONTS, init, draw });
