<script>
/* 05 — flat geometric pixel diorama. The whole picture is painted on a 180×320 pixel grid with whole-pixel rects only
   (no anti-aliasing) and blown up 6× nearest-neighbour: rounded capsule trees, stepped pines, vertical trunk bands, and a
   dark blobby frame that the forest is seen through. Characters are hand-placed pixel sprites animated on twos (8 fps);
   ghosts and mist glide in whole-pixel steps. The one warm accent is the campfire: when it catches (3.2) its light is a
   palette swap inside a pixel circle with a dithered rim — the forest near it turns green/lilac, the rest stays blue. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, rng } = Pilot;
const W = 1080, H = 1920, LW = 180, LH = 320, K = 6, TAU = Math.PI * 2;
const FONT = "'Do Hyeon',sans-serif";
const N = { bg: '#29358a', tD: '#232b70', tL: '#2d3d9c', shaft: '#30419e', canA: '#3b3d7c', canAs: '#34366f', canB: '#2c466c', canBs: '#263d5f',
  pine: '#33388a', pineS: '#2b3078', bush: '#2b3f94', bushS: '#25357f', gTop: '#3a4fb0', ground: '#2a3a92', groundD: '#222a6a', stem: '#20234f', mush: '#5a64a8' };
const L = { bg: '#2f3d92', tD: '#2a3479', tL: '#3a4caa', shaft: '#3a4ca8', canA: '#6b5a9c', canAs: '#584a8a', canB: '#4a8c6b', canBs: '#3d7a5e',
  pine: '#5050a8', pineS: '#434394', bush: '#5a9c84', bushS: '#4a8a74', gTop: '#8ac48a', ground: '#73a97b', groundD: '#3a6363', stem: '#4a3434', mush: '#e8d8b8' };
const FRAME = '#24273d', FRAME2 = '#2b2f4a';
const GY = 262;                                   // ground line (feet) in pixels
const FIRE = { x: 124, y: GY };
const X0 = 40, X1 = 86;                           // the traveller walks from X0 to X1 and stops

// ---------------- pixel primitives (whole-pixel rects only) ----------------
const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function pxCircle(c, cx, cy, r, col) { c.fillStyle = col; for (let dy = -r; dy <= r; dy++) { const h = Math.floor(Math.sqrt(r * r - dy * dy) + .5); c.fillRect(cx - h, cy + dy, 2 * h + 1, 1); } }
function pxRR(c, x, y, w, h, r, col) {   // rounded rect, rows of whole pixels
  c.fillStyle = col; for (let j = 0; j < h; j++) { let inset = 0;
    const dy = j < r ? r - j - .5 : j >= h - r ? j - (h - r) + .5 : 0; if (dy > 0) inset = Math.round(r - Math.sqrt(Math.max(0, r * r - dy * dy)));
    c.fillRect(x + inset, y + j, w - 2 * inset, 1); } }
function capsule(c, x, y, w, h, col, sh) {   // a rounded-top tree canopy, with a flat shade column on the left
  pxRR(c, x, y, w, h, Math.floor(w / 2), col);
  if (sh) { c.save(); c.beginPath(); c.rect(x, y, Math.floor(w * .3), h); c.clip(); pxRR(c, x, y, w, h, Math.floor(w / 2), sh); c.restore(); }
}
function pine(c, cx, top, h, w, col, sh) {   // stepped pine: rows widening in 3 tiers
  for (let j = 0; j < h; j++) { const tier = Math.floor(j / (h / 3)), f = (j - tier * h / 3) / (h / 3), hw = Math.round((w / 2) * (.35 + .22 * tier + .4 * f));
    R(c, cx - hw, top + j, 2 * hw + 1, 1, col); if (sh) R(c, cx - hw, top + j, Math.max(1, Math.round(hw * .5)), 1, sh); }
}
function pxLine(c, x0, y0, x1, y1, th, col) {   // thick stepped line
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)); c.fillStyle = col;
  for (let i = 0; i <= n; i++) { const x = Math.round(lerp(x0, x1, i / n)), y = Math.round(lerp(y0, y1, i / n)); c.fillRect(x - (th >> 1), y - (th >> 1), th, th); }
}
// sprites from character grids
function sprite(rows, pal) { const h = rows.length, w = rows[0].length, c = Pilot.canvas(w, h), x = c.getContext('2d');
  rows.forEach((r, j) => { for (let i = 0; i < w; i++) { const k = r[i]; if (k !== '.' && pal[k]) { x.fillStyle = pal[k]; x.fillRect(i, j, 1, 1); } } });
  return c; }

// ---------------- the traveller (a little hooded wanderer) ----------------

  K: '#8a5a3c', k: '#6a4030', R: '#c8a070', P: '#a06c48', W: '#e9e2cf', w: '#bdb6a6', S: '#c8a070', g: '#b8c4f0', e: '#202642' };

const GHOST = [
  ['....gggg....', '..gggggggg..', '.gggggggggg.', '.ggeeggeegg.', '.ggeeggeegg.', 'gggggggggggg', 'gggggggggggg', 'ggggggegggg.', 'gggggggggggg', 'gggggggggggg', 'gg.ggg.ggg.g', 'g...g...g...'],
  ['....gggg....', '..gggggggg..', '.gggggggggg.', '.ggeeggeegg.', '.ggeeggeegg.', 'gggggggggggg', 'gggggggggggg', 'ggggggegggg.', 'gggggggggggg', 'gggggggggggg', 'g.ggg.ggg.gg', '...g...g...g'] ];
const GHOSTB = [0, 1].map(f => [
  '......gggg......', '....gggggggg....', '...gggggggggg...', '..gggggggggggg..', '.gggggggggggggg.', '.gggeeggggeeggg.', '.gggeeggggeeggg.',
  'gggggggggggggggg', 'gggggggeeggggggg', 'gggggggeeggggggg', 'gggggggggggggggg', 'gggggggggggggggg', 'gggggggggggggggg', 'gggggggggggggggg',
  f ? 'g.gggg.gggg.gggg' : 'ggg.gggg.gggg.gg', f ? '...gg...gg...gg.' : '.gg...gg...gg...' ]);
const SPR = {};

// ---------------- the background plates (night palette + fire-lit palette) ----------------
function plate(c, P) {
  R(c, 0, 0, LW, LH, P.bg);
  // vertical trunk bands, with V branches
  const T = [[12, 7, 'tD'], [27, 3, 'tL'], [39, 9, 'tD'], [55, 3, 'tL'], [66, 6, 'tD'], [80, 11, 'shaft'], [99, 5, 'tD'], [112, 8, 'tL'], [129, 4, 'tD'], [142, 9, 'tD'], [160, 5, 'tL']];
  for (const [x, w, k] of T) R(c, x, 0, w, GY, P[k]);
  const BR = [[43, 128, 24, -28, 'tD'], [69, 76, -18, -26, 'tD'], [101, 100, 18, -32, 'tD'], [146, 142, -22, -30, 'tD'], [146, 98, 16, -24, 'tD'], [15, 186, 15, -22, 'tD'], [115, 192, -13, -22, 'tL'], [42, 60, -12, -18, 'tD']];
  for (const [x, y, dx, dy, k] of BR) pxLine(c, x, y, x + dx, y + dy, 3, P[k]);
  // misty light shaft (lighter columns, stepped alpha)
  c.globalAlpha = .35; R(c, 83, 0, 5, 215, '#4a64c4'); c.globalAlpha = .2; R(c, 81, 0, 9, 232, '#4a64c4'); c.globalAlpha = 1;
  // a dark canopy of leaf blobs along the top of the window
  for (const [x, y, r] of [[30, 30, 12], [50, 26, 9], [74, 32, 13], [100, 26, 10], [124, 34, 12], [150, 28, 11], [62, 40, 7], [138, 42, 7], [112, 44, 6]]) pxCircle(c, x, y, r, P.tD);
  for (const [x, y, r] of [[40, 36, 5], [88, 40, 6], [132, 38, 5]]) pxCircle(c, x, y, r, P.canAs);
  // hanging vines
  for (const [x, y0, len] of [[58, 40, 30], [118, 44, 22], [152, 36, 40]]) { R(c, x, y0, 1, len, P.canBs); for (let j = 4; j < len; j += 6) R(c, x - 1 + (j % 12 ? 0 : 2), y0 + j, 2, 2, P.canBs); }
  // mid trees behind the camp
  R(c, 51, 208, 3, GY - 208, P.stem); capsule(c, 42, 180, 20, 44, P.bush, P.bushS);
  R(c, 106, 222, 3, GY - 222, P.stem); capsule(c, 95, 170, 24, 58, P.canA, P.canAs);
  pine(c, 84, 212, 46, 24, P.pine, P.pineS);
  R(c, 154, 230, 3, GY - 230, P.stem); capsule(c, 140, 182, 28, 56, P.canB, P.canBs);
  pxLine(c, 155, 214, 161, 205, 2, P.stem); pxLine(c, 155, 224, 148, 217, 2, P.stem);   // twig branches on the green tree
  capsule(c, 132, 236, 22, 28, P.bush, P.bushS); capsule(c, 14, 238, 30, 28, P.bush, P.bushS); capsule(c, 160, 240, 16, 24, P.canB, P.canBs);
  pine(c, 26, 216, 36, 18, P.pine, P.pineS);
  // mushrooms by the fire
  for (const [x, y] of [[138, GY - 3], [142, GY - 2]]) { R(c, x, y, 1, 3, '#d8ccb4'); R(c, x - 2, y - 1, 5, 1, P.mush); R(c, x - 1, y - 2, 3, 1, P.mush); }
  // ground
  R(c, 0, GY, LW, LH - GY, P.ground); R(c, 0, GY, LW, 1, P.gTop); R(c, 0, GY + 6, LW, LH, P.groundD);
  for (let x = 4; x < LW; x += 9) { const h = (x * 7) % 3 + 1; R(c, x, GY - h, 1, h, P.gTop); }   // grass blades
}
function framePlate() {   // the dark blobby frame the forest is seen through (window cut out)
  const c = Pilot.canvas(LW, LH), x = c.getContext('2d');
  R(x, 0, 0, LW, LH, FRAME);
  x.globalCompositeOperation = 'destination-out';
  pxRR(x, 10, 24, LW - 20, 270, 12, '#000');
  x.globalCompositeOperation = 'source-over';
  const blobs = [[10, 58, 8], [6, 80, 6], [12, 126, 9], [8, 152, 5], [10, 200, 8], [5, 226, 7], [12, 278, 10],
    [170, 50, 7], [175, 92, 10], [168, 134, 6], [174, 178, 9], [170, 224, 6], [172, 276, 10],
    [34, 24, 8], [52, 20, 6], [98, 26, 10], [124, 22, 7], [148, 28, 8]];
  for (const [bx, by, br] of blobs) pxCircle(x, bx, by, br, FRAME);
  pxLine(x, 10, 50, 33, 54, 4, FRAME); pxLine(x, 33, 54, 38, 64, 3, FRAME); pxCircle(x, 39, 66, 3, FRAME);
  pxLine(x, 170, 116, 155, 121, 4, FRAME); pxLine(x, 155, 121, 152, 113, 3, FRAME); pxLine(x, 155, 121, 158, 131, 2, FRAME);
  // an owl in the frame at the right (its eyes blink, drawn live)
  pxRR(x, 158, 150, 14, 16, 5, FRAME); R(x, 159, 148, 2, 3, FRAME); R(x, 169, 148, 2, 3, FRAME);
  R(x, 0, 290, LW, LH - 290, FRAME); R(x, 0, 290, LW, 1, FRAME2);
  return c;
}

// ---------------- motion (stepped: characters on twos = 8 drawings a second) ----------------
const step8 = t => Math.floor(t * 8) / 8;
function walker(t) {
  const q = step8(t), t1 = 1.9, T = B.walk[1], u = clamp(q, 0, T);
  const dd = u <= t1 ? u : t1 + (u - t1) - (u - t1) * (u - t1) / (2 * (T - t1));   // constant pace, then slowing to a stop
  const x = Math.round(lerp(X0, X1, dd / (t1 + (T - t1) / 2)));
  const walking = q < B.walk[1];
  const f = walking ? Math.floor(q * 8 / 2) % 4 : -1;   // walk drawing changes every 2 frames of 8 → 4 fps cycle of 4
  return { x, f, walking, q };
}
function drawTraveller(c, t, lit) {
  const st = walker(t), q = st.q, x = st.x, y = GY;
  const look = q >= B.look + .125, dropped = q >= B.drop, slipping = q >= B.drop - .375 && !dropped;
  const sag = q >= B.stop && q < B.look ? 1 : 0;
  // legs (2 px wide, boots), walk poses on twos
  const legs = st.walking ? [[[-3, 0], [2, 0]], [[-1, -1], [0, 0]], [[2, 0], [-3, 0]], [[0, 0], [-1, -1]]][st.f] : [[-2, 0], [1, 0]];
  const bob = st.walking && (st.f === 1 || st.f === 3) ? -1 : 0;
  for (const [i, [lx, ly]] of legs.entries()) { R(c, x + lx, y - 5 + ly + (i ? 0 : 0), 2, 4, i ? '#2c2c4a' : '#24243e'); R(c, x + lx, y - 1 + ly, 3, 1, i ? '#2c2c4a' : '#24243e'); }
  const by = y - 5 + bob + sag - (dropped && q < B.drop + .25 ? 1 : 0);   // body bottom
  // the load (behind)
  if (!dropped) { const sl = slipping ? Math.floor((q - (B.drop - .375)) * 8) : 0;
    c.drawImage(SPR.load, x - 16 - sl, by - 21 + sl * 3 + (st.walking && st.f % 2 ? 1 : 0)); }
  c.drawImage(dropped ? (lit ? SPR.bodyFreeL : SPR.bodyFree) : (lit ? SPR.bodyLoadL : SPR.bodyLoad), x - 6, by - 13);
  const head = look ? (lit ? SPR.headUpL : SPR.headUp) : (lit ? SPR.headDownL : SPR.headDown);
  c.drawImage(head, x - 5 + (look ? 0 : 1), by - 24 + (look ? -1 : 1) + sag);
  // the load once it's down: lands behind, squashes for one drawing
  if (dropped) { const u = q - B.drop, sq = u < .125 ? 1 : 0;
    if (sq) c.drawImage(SPR.load, 0, 0, 19, 16, x - 27, y - 13, 21, 13); else c.drawImage(SPR.load, x - 26, y - 16);
    if (u < .5) { const k = Math.floor(u * 8); c.fillStyle = lit ? '#a8c8a0' : '#5a6cb8';
      for (const [dx, dy] of [[-9, -2], [-3, -4], [5, -3], [-12, -1], [9, -1]]) c.fillRect(x - 17 + dx * (1 + k * .5), y - 1 + dy - k, 1, 1); } }
}
function drawFire(c, t) {
  const q = Math.floor(t * 12) / 12, on = t >= B.look;
  // logs
  R(c, FIRE.x - 6, GY - 2, 13, 2, '#5a3a2c'); pxLine(c, FIRE.x - 5, GY - 1, FIRE.x + 5, GY - 4, 2, '#6e4834'); pxLine(c, FIRE.x + 5, GY - 1, FIRE.x - 4, GY - 4, 2, '#5a3a2c');
  R(c, FIRE.x - 9, GY - 1, 3, 1, '#4a4a5c'); R(c, FIRE.x + 7, GY - 1, 3, 1, '#4a4a5c');   // stones
  if (!on) { if (Math.floor(t * 4) % 2) R(c, FIRE.x, GY - 4, 1, 1, '#c8502a'); R(c, FIRE.x - 1, GY - 3, 1, 1, '#8a3a2a'); return; }
  const grow = clamp((t - B.look) / .35), hgt = Math.round(lerp(4, 22, eo(grow)) * (grow < 1 ? 1 : 1));
  const r = rng(1 + Math.floor(q * 12) % 6);   // six flame drawings, cycled at 12 fps
  for (let j = 0; j < hgt; j++) { const f = j / hgt, hw = Math.max(0, Math.round(7 * Math.pow(1 - f, .8) * (.75 + .25 * Math.sin(f * 9 + r() * 6)))), sx = Math.round(Math.sin(f * 4 + r() * 3) * 1.4 * f);
    const yy = GY - 3 - j; R(c, FIRE.x - hw + sx, yy, 2 * hw + 1, 1, '#f08424');
    const m = Math.round(hw * .62); if (m > 0) R(c, FIRE.x - m + sx, yy, 2 * m + 1, 1, '#f8b830');
    const k = Math.round(hw * .28); if (k > 0 && f < .6) R(c, FIRE.x - k + sx, yy, 2 * k + 1, 1, '#fff0a0'); }
  // flame tongues breaking off
  if (r() < .7) R(c, FIRE.x + Math.round(r() * 6 - 3), GY - 4 - hgt - 2, 1, 2, '#f08424');
  // embers rising in whole-pixel steps
  for (let i = 0; i < 9; i++) { const er = rng(40 + i), per = .9 + er() * .9, ph = er() * per, age = ((t - B.look - .2 + ph) % per + per) % per;
    if (t - B.look < .2 + (per - ph) * 0 && age > t - B.look) continue;
    const ex = FIRE.x + Math.round((er() - .5) * 10 + Math.sin(age * 5 + i) * 2), ey = GY - 12 - Math.round(age * 70);
    const len = 2 + Math.floor(er() * 3); R(c, ex, ey, 1, len, age / per > .7 ? '#c86020' : '#f0a030'); }
}
// fire-lit area: pixel circle with a dithered rim; returns a mask canvas (opaque = lit)
let MASK;
function litMask(t) {
  const m = MASK.getContext('2d'); m.clearRect(0, 0, LW, LH);
  if (t < B.look) return null;
  const q = Math.floor(t * 8) / 8, grow = eo(clamp((t - B.look) / .5)), fl = [0, 1, 0, -1, 1, 0][Math.floor(q * 8) % 6];
  const r = Math.round(52 * grow) + fl; if (r < 2) return null;
  const cy = FIRE.y - 10;
  pxCircle(m, FIRE.x, cy, r, '#fff');
  // dithered rim: a checker of pixels in the next 8 px
  m.fillStyle = '#fff';
  for (let dy = -r - 8; dy <= r + 8; dy++) for (let dx = -r - 8; dx <= r + 8; dx++) { const d = Math.hypot(dx, dy); if (d <= r || d > r + 8) continue;
    const band = d < r + 4 ? ((dx + dy) & 1) === 0 : ((dx & 1) === 0 && (dy & 1) === 0); if (band) m.fillRect(FIRE.x + dx, cy + dy, 1, 1); }
  return MASK;
}

// ---------------- ghosts, mist, eyes ----------------
function ghosts(c, t) {
  const G = [[28, 96, 0, 1, 1], [122, 76, 1.3, 1, 0], [56, 160, 2.1, -1, 1], [146, 138, .7, -1, 0], [96, 118, 3.3, 1, 1]];
  for (const [gx, gy, ph, dir, big] of G) {
    const x = Math.round(gx + Math.sin(t * .55 + ph) * 6 + dir * t * 1.5), y = Math.round(gy + Math.sin(t * 1.3 + ph * 2) * 4);
    const fr = Math.floor(t * 4 + ph * 3) % 2;
    c.globalAlpha = big ? .30 : .24; c.drawImage((big ? SPR.ghostB : SPR.ghost)[fr], x, y); c.globalAlpha = 1;
  }
}
function mist(c, t) {
  const M = [[16, 88, 36, .22], [100, 100, 46, .18], [50, 134, 28, .2], [116, 168, 38, .16], [8, 206, 52, .14], [70, 60, 30, .14]];
  for (const [mx, my, w, a] of M) { const x = Math.round(((mx + t * 3) % (LW + w)) - w * .3);
    c.globalAlpha = a; pxRR(c, x, my, w, 4, 2, '#5a72c8'); c.globalAlpha = 1; }
}
function spider(c, t) {   // a little spider letting itself down on a thread, stepped
  const y = 58 + Math.round((Math.sin(t * 1.1) * .5 + .5) * 14);
  R(c, 136, 40, 1, y - 40, '#4a5a9c'); R(c, 134, y, 5, 4, '#1d2148'); R(c, 133, y + 1, 7, 1, '#1d2148'); R(c, 133, y + 3, 1, 2, '#1d2148'); R(c, 139, y + 3, 1, 2, '#1d2148');
}
function eyes(c, t) {
  const E = [[14, 274, '#f0c040', 0], [22, 248, '#f0c040', 1.1], [163, 156, '#f0c040', 2.3], [165, 76, '#ffffff', .6]];
  for (const [ex, ey, col, ph] of E) { const blink = ((t + ph) % 2.3) < .125; if (blink) { R(c, ex, ey + 1, 2, 1, col); R(c, ex + 4, ey + 1, 2, 1, col); continue; }
    R(c, ex, ey, 2, 2, col); R(c, ex + 4, ey, 2, 2, col); }
}

// ---------------- frame ----------------
let LO, LX, PN, PL, FR, CAP, CX;
function draw(ctx, t) {
  const c = LX; c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.drawImage(PN, 0, 0);
  const mask = litMask(t), lit = !!mask && Math.hypot(walker(t).x - FIRE.x, 0) < 70;
