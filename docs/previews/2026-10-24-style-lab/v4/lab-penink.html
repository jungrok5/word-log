<script>
/* lab-penink — 18 "Pen & Ink Fairytale": manga pen-and-ink line art (confident black lines, red-brown hatching on skin
   shadows and cheeks) over soft watercolour colour on paper; a warm summer day under a tree, dappled sunlight drifting over
   the face and the white school shirt (the style's signature). A schoolgirl with a black bob carries a heavy wooden cross
   across her shoulders past an old stone wall, one hand steadying the beam; she stops, looks up as a warm sunbeam opens over
   the garden gate ahead, and the cross slips off her shoulders behind the flowers. Everything drawn in code.
   Character on twos (12 fps), camera/light on ones. */
const TAU = Math.PI * 2;
const { clamp, lerp, ss, eo, eio, rng, noise, fbm } = Pilot;
const W = 1080, H = 1920;
const S = window.SCRIPT, B = S.beat;
const INK = '#1d1717', RED = '#c64a3b', SKIN = '#f9d8c3', SKIN2 = '#eeab93', BLUSH = 'rgba(240,120,110,.42)';
const SHIRT = '#fbfaf5', SHIRT2 = '#c6d3ea', SKIRT = '#38456e', SKIRT2 = '#262f52', HAIR = '#26242f', HAIR2 = '#4b5068';
const WOOD = '#b98252', WOOD2 = '#8c5a34', WOOD3 = '#6e4227';

/* ---------------- line toolkit ---------------- */
const spline = (P, step = 2.5, closed = false) => {
  const n = P.length; if (n < 2) return P.map(p => p.slice());
  const get = i => closed ? P[((i % n) + n) % n] : P[clamp(i, 0, n - 1)];
  const out = [], segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), m = Math.max(1, Math.ceil(L / step));
    for (let j = 0; j < m; j++) { const t = j / m, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3))); }
  }
  out.push(closed ? out[0].slice() : P[n - 1].slice()); return out;
};
const normals = pts => pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
const lengths = pts => { const s = [0]; for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return s; };
const ribbon = (pts, wf) => {
  const n = pts.length, N = normals(pts), Sx = lengths(pts), L = Sx[n - 1] || 1, Lf = [], Rt = [], ws = [];
  for (let i = 0; i < n; i++) { const w = Math.max(0, wf(Sx[i] / L, Sx[i], i, L)) / 2; ws.push(w); Lf.push([pts[i][0] + N[i][0] * w, pts[i][1] + N[i][1] * w]); Rt.push([pts[i][0] - N[i][0] * w, pts[i][1] - N[i][1] * w]); }
  const p = new Path2D(); p.moveTo(Lf[0][0], Lf[0][1]); for (let i = 1; i < n; i++) p.lineTo(Lf[i][0], Lf[i][1]);
  const ae = Math.atan2(N[n - 1][1], N[n - 1][0]); if (ws[n - 1] > .4) p.arc(pts[n - 1][0], pts[n - 1][1], ws[n - 1], ae, ae + Math.PI, true); else p.lineTo(Rt[n - 1][0], Rt[n - 1][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(Rt[i][0], Rt[i][1]);
  const a0 = Math.atan2(N[0][1], N[0][0]); if (ws[0] > .4) p.arc(pts[0][0], pts[0][1], ws[0], a0 + Math.PI, a0, true);
  p.closePath(); return p;
};
// a pen line through control points: w = max width; o = { ts, te (taper px), mn, mnE (tip width fraction), col, press, seed }
function pen(g, P, w, o = {}) {
  const pts = o.raw ? P : spline(P, o.step || 2.5); if (pts.length < 2) return;
  const ts = o.ts ?? w * 3, te = o.te ?? w * 3, mn = o.mn ?? .12, mnE = o.mnE ?? mn, press = o.press ?? .22, seed = o.seed ?? 1;
  const wf = (u, s, i, L) => w * Math.min(1, mn + (1 - mn) * ss(0, ts, s)) * Math.min(1, mnE + (1 - mnE) * ss(0, te, L - s)) * (1 + press * (noise(s / 45, seed * 3.1 % 500) - .5) * 2);
  g.fillStyle = o.col || INK; g.fill(ribbon(pts, wf));
}
const shape = (P, step = 3) => { const q = spline(P, step, true), p = new Path2D(); p.moveTo(q[0][0], q[0][1]); for (const v of q) p.lineTo(v[0], v[1]); p.closePath(); return p; };
const polyPath = P => { const p = new Path2D(); p.moveTo(P[0][0], P[0][1]); for (const v of P) p.lineTo(v[0], v[1]); p.closePath(); return p; };
// watercolour fill: flat colour + darker pooled edge inside the shape
function wash(g, p, col, edge, ew = 7) {
  g.fillStyle = col; g.fill(p);
  if (edge) { g.save(); g.clip(p); g.strokeStyle = edge; g.lineWidth = ew; g.stroke(p); g.restore(); }
}
// parallel hatching inside a path: angle a, spacing gap, stroke width w
function hatch(g, p, x0, y0, x1, y1, a, gap, w, col, seed = 1, jit = .3) {
  g.save(); g.clip(p); const r = rng(seed), c = Math.cos(a), s = Math.sin(a), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2;
  for (let d = -R; d <= R; d += gap) { const l0 = -R * (.6 + r() * .4), l1 = R * (.6 + r() * .4), ox = -s * d + (r() - .5) * gap * jit, oy = c * d;
    pen(g, [[cx + ox + c * l0, cy + oy + s * l0], [cx + ox + c * l1, cy + oy + s * l1]], w, { col, raw: false, ts: 6, te: 6, mn: .2, step: 4, seed: seed + d }); }
  g.restore();
}
const rot = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a)];
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const ang = v => Math.atan2(v[1], v[0]);
const dir = a => [Math.cos(a), Math.sin(a)];

/* ---------------- timing ---------------- */
const STEP = .64;                                     // one trudging step
const walkK = t => 1 - ss(2.15, 2.6, t);               // walking amount
// background scroll: constant pace that slows to a stop at 2.6
const SCR = (() => { const n = 300, T = 2.6, tab = [0]; let s = 0; for (let i = 1; i <= n; i++) { const u = i / n; s += 1 - ss(.72, 1, u); tab.push(s); }
  const D = 520; return t => { if (t >= T) return D; const f = clamp(t / T) * n, i = Math.floor(f), k = f - i; return D * lerp(tab[i], tab[Math.min(n, i + 1)], k) / tab[n]; }; })();
const lookK = t => ss(3.15, 3.75, t);
const dropT = 4.4;

/* ---------------- static plates (init) ---------------- */
let lightL, lastQ = null, lastP = null, BG, CAN, HEDGE, PAPER, SPOT, SPOTS, charL, shadeL, hiL, WALLMASK;
const BGW = 1900, HW = 2100, CW = 1900;
const GATE = { x0: 1330, x1: 1590, top: 700, bot: 1460 };   // world x of the garden gate opening (stops at screen ~810–1070)

function leaf(g, x, y, a, len, wid, col, line = 2.2, seed = 1) {
  const c = Math.cos(a), s = Math.sin(a), P = (u, v) => [x + c * u - s * v, y + s * u + c * v];
  const pts = [P(0, 0), P(len * .3, -wid * .5), P(len * .7, -wid * .42), P(len, 0), P(len * .7, wid * .45), P(len * .3, wid * .5)];
  const p = shape(pts, 3); g.fillStyle = col; g.fill(p);
  pen(g, [...spline(pts, 3, true)], line, { raw: true, ts: 4, te: 4, mn: .5, col: INK, seed });
  pen(g, [P(len * .1, 0), P(len * .55, wid * .04), P(len * .85, 0)], line * .55, { col: 'rgba(29,23,23,.6)', ts: 3, te: 6, seed: seed + 3 });
}
function clump(g, cx, cy, R, n, seed, pal, up = 0) {
  const r = rng(seed); const items = [];
  for (let i = 0; i < n; i++) { const a = r() * TAU, d = Math.sqrt(r()) * R; items.push([cx + Math.cos(a) * d, cy + Math.sin(a) * d * .7, a + (r() - .5) * 1.2 + up, d]); }
  items.sort((A, Bq) => Bq[3] - A[3]);
  items.reverse();
  for (const [x, y, a, d] of items) { const k = d / R; leaf(g, x, y, a, 34 + r() * 26, 16 + r() * 9, pal[(k < .45 ? 2 : k < .8 ? 1 : 0) + (r() < .25 ? -1 : 0) < 0 ? 0 : (k < .45 ? 2 : k < .8 ? 1 : 0)], 2, seed + x); }
}

function buildBG() {
  const c = Pilot.canvas(BGW, 1500), g = c.getContext('2d'); g.lineCap = g.lineJoin = 'round'; const r = rng(18);
  // sky: warm cream to soft blue wash
  const sk = g.createLinearGradient(0, 0, 0, 640); sk.addColorStop(0, '#bcd8ea'); sk.addColorStop(.55, '#e6efe9'); sk.addColorStop(1, '#fbf1d8');
  g.fillStyle = sk; g.fillRect(0, 0, BGW, 1500);
  // soft cumulus washes
  for (let i = 0; i < 9; i++) { const x = r() * BGW, y = 120 + r() * 260, rw = 120 + r() * 160; g.fillStyle = 'rgba(255,253,246,.55)';
    for (let k = 0; k < 6; k++) { g.beginPath(); g.ellipse(x + (r() - .5) * rw, y + (r() - .5) * 40, rw * (.35 + r() * .3), rw * (.22 + r() * .15), 0, 0, TAU); g.fill(); } }
  // far trees behind the wall top
  for (let x = -60; x < BGW + 60; x += 70 + r() * 60) { const y = 520 + r() * 30, R = 70 + r() * 50;
    g.fillStyle = r() < .5 ? '#9cc28a' : '#87b27c'; g.beginPath(); for (let k = 0; k < 7; k++) g.ellipse(x + (r() - .5) * R, y - r() * R * .6, R * .55, R * .45, 0, 0, TAU); g.fill(); }
  g.save(); g.globalAlpha = .55; for (let x = 0; x < BGW; x += 22) pen(g, [[x, 470 + r() * 40], [x + 8, 492 + r() * 30]], 1.4, { col: '#3f5a3c', seed: x }); g.restore();
  // wall (stone blocks): y 590 – 1460
  const wallTop = 590, wallBot = 1470;
  const wallP = new Path2D(); wallP.rect(0, wallTop, BGW, wallBot - wallTop);
  g.fillStyle = '#f1dfb8'; g.fill(wallP);
  const tints = ['#f4e4c0', '#efd9ab', '#f7eacd', '#ead19f', '#f2dcb4', '#e7cfa6'];
  let y = wallTop + 44; const rows = [];
  while (y < wallBot) { const h = 66 + r() * 16; rows.push([y, Math.min(wallBot, y + h)]); y += h; }
  for (const [ya, yb] of rows) { let x = -r() * 150;
    while (x < BGW) { const w = 120 + r() * 120, xa = x, xb = x + w;
      g.fillStyle = tints[(r() * tints.length) | 0]; g.fillRect(xa + 3, ya + 3, w - 6, yb - ya - 6);
      // pooled watercolour at one edge
      g.fillStyle = 'rgba(190,150,90,.18)'; g.fillRect(xa + 3, yb - 14, w - 6, 11);
      // sketchy outline: four separate strokes with gaps
      const j = () => (r() - .5) * 3;
      const e = [[[xa + 4, ya + 2 + j()], [xb - 4, ya + 2 + j()]], [[xb - 2 + j(), ya + 4], [xb - 2 + j(), yb - 4]], [[xb - 4, yb - 2 + j()], [xa + 4, yb - 2 + j()]], [[xa + 2 + j(), yb - 4], [xa + 2 + j(), ya + 4]]];
      for (const [p0, p1] of e) { if (r() < .18) continue; const u0 = r() * .15, u1 = 1 - r() * .15;
        pen(g, [[lerp(p0[0], p1[0], u0), lerp(p0[1], p1[1], u0)], [lerp(p0[0], p1[0], (u0 + u1) / 2) + j(), lerp(p0[1], p1[1], (u0 + u1) / 2) + j()], [lerp(p0[0], p1[0], u1), lerp(p0[1], p1[1], u1)]], 1.8 + r() * .8, { col: 'rgba(40,30,25,.85)', ts: 5, te: 8, mn: .3, seed: xa + ya }); }
      // hatching in some lower corners
      if (r() < .35) { g.save(); g.globalAlpha = .55; for (let k = 0; k < 4 + r() * 4; k++) { const hx = xb - 12 - k * 7; pen(g, [[hx, yb - 6], [hx + 10, yb - 22 - r() * 8]], 1.1, { col: INK, ts: 3, te: 3, seed: k + xa }); } g.restore(); }
      if (r() < .3) { g.save(); g.globalAlpha = .5; const px = xa + 20 + r() * (w - 40), py = ya + 15 + r() * (yb - ya - 30); pen(g, [[px, py], [px + 6 + r() * 8, py + 3]], 1, { col: INK, seed: px }); g.restore(); }
      x = xb; }
  }
  // coping on top
  g.fillStyle = '#d9c39a'; g.fillRect(0, wallTop, BGW, 46); g.fillStyle = 'rgba(120,95,70,.25)'; g.fillRect(0, wallTop + 34, BGW, 12);
  pen(g, [[0, wallTop + 1], [BGW, wallTop - 1]], 2.6, { col: INK, ts: 1, te: 1, mn: 1, press: .3 });
  pen(g, [[0, wallTop + 46], [BGW, wallTop + 45]], 2, { col: INK, ts: 1, te: 1, mn: 1, press: .4 });
  for (let x = 40; x < BGW; x += 150 + r() * 60) pen(g, [[x, wallTop + 3], [x + 1, wallTop + 44]], 1.6, { col: INK, seed: x });
  // ivy patches
  for (const [ix, iy, n] of [[90, 1010, 26], [1150, 650, 22], [1720, 700, 26]]) clump(g, ix, iy, 90, n, ix, ['#5d9a5a', '#79b468', '#a7cf86'], 0);
  // gate pillars + opening
  const { x0, x1, top, bot } = GATE, pw = 70;
  for (const px of [x0 - pw, x1]) { g.fillStyle = '#e8d2a6'; g.fillRect(px, top - 160, pw, bot - top + 160);
    g.fillStyle = 'rgba(150,110,70,.22)'; g.fillRect(px + pw - 16, top - 160, 16, bot - top + 160);
    for (let yy = top - 160; yy < bot; yy += 58) pen(g, [[px + 2, yy], [px + pw - 2, yy + 1]], 1.6, { col: 'rgba(40,30,25,.8)', seed: yy + px });
    pen(g, [[px, top - 160], [px, bot]], 2.4, { col: INK, mn: 1, ts: 1, te: 1, press: .3 }); pen(g, [[px + pw, top - 160], [px + pw, bot]], 2.4, { col: INK, mn: 1, press: .3 });
    g.fillStyle = '#cdb489'; g.fillRect(px - 10, top - 190, pw + 20, 32); pen(g, [[px - 10, top - 190], [px + pw + 10, top - 190], [px + pw + 10, top - 158], [px - 10, top - 158]], 2.2, { col: INK, mn: 1, raw: true });
    // a round lamp-less finial
    g.fillStyle = '#d7bf93'; g.beginPath(); g.arc(px + pw / 2, top - 205, 18, 0, TAU); g.fill(); g.strokeStyle = INK; g.lineWidth = 2.2; g.stroke(); }

  const op = new Path2D(); op.moveTo(x0, bot); op.lineTo(x0, top + 70); op.quadraticCurveTo(x0, top - 40, (x0 + x1) / 2, top - 46); op.quadraticCurveTo(x1, top - 40, x1, top + 70); op.lineTo(x1, bot); op.closePath();
  GATE.path = op;
  g.save(); g.clip(op);
  const gg = g.createLinearGradient(0, top - 50, 0, bot); gg.addColorStop(0, '#fffbe9'); gg.addColorStop(.6, '#fff3d0'); gg.addColorStop(1, '#f6e2b0'); g.fillStyle = gg; g.fillRect(x0, top - 60, x1 - x0, bot - top + 60);
  // the sunny garden beyond: pale trees, lawn, a path, flowers — washed out by the sun
  g.fillStyle = '#e4f0bd'; g.fillRect(x0, 1120, x1 - x0, bot - 1120);
  clump(g, x0 + 40, 930, 90, 22, 501, ['#9cc787', '#b7d899', '#d2e7ae'], 0);
  clump(g, x1 - 50, 900, 100, 24, 502, ['#9cc787', '#b7d899', '#d2e7ae'], 0);
  clump(g, (x0 + x1) / 2, 1040, 70, 16, 503, ['#a8cf8c', '#c4e0a2', '#dcecb6'], 0);
  g.fillStyle = '#fff6df'; g.beginPath(); g.moveTo(x0 + 60, bot); g.lineTo(x0 + 115, 1150); g.lineTo(x1 - 105, 1150); g.lineTo(x1 - 20, bot); g.fill();
  pen(g, [[x0 + 115, 1150], [x0 + 60, bot]], 1.4, { col: 'rgba(60,60,40,.6)' }); pen(g, [[x1 - 105, 1150], [x1 - 20, bot]], 1.4, { col: 'rgba(60,60,40,.6)' });
  for (let k = 0; k < 16; k++) { const fx = x0 + 10 + r() * (x1 - x0 - 20), fy = 1140 + r() * 60; if (fx > x0 + 100 && fx < x1 - 90) continue; g.fillStyle = r() < .6 ? '#ef7a6a' : '#fff'; g.beginPath(); g.arc(fx, fy, 4 + r() * 3, 0, TAU); g.fill(); }
  g.fillStyle = 'rgba(255,250,232,.45)'; g.fillRect(x0, top - 60, x1 - x0, bot - top + 60);
  g.restore();
  // the open wooden door, swung inward against the left jamb
  const dp = [[x0, top + 60], [x0 + 46, top + 96], [x0 + 46, bot - 30], [x0, bot]];
  g.fillStyle = '#a7774c'; g.fill(polyPath(dp)); g.fillStyle = 'rgba(90,55,30,.35)'; g.fill(polyPath([[x0, top + 60], [x0 + 14, top + 70], [x0 + 14, bot - 8], [x0, bot]]));
  for (let k = 1; k < 3; k++) pen(g, [[x0 + k * 15, top + 72 + k * 10], [x0 + k * 15, bot - 12 - k * 6]], 1.4, { col: INK, seed: k });
  pen(g, dp.concat([dp[0]]), 2.2, { raw: true, col: INK, mn: 1 });
  // arch outline + voussoirs
  pen(g, [[x0, bot], [x0, top + 70]], 2.6, { col: INK, mn: 1 }); pen(g, [[x1, top + 70], [x1, bot]], 2.6, { col: INK, mn: 1 });
  { const a = spline([[x0, top + 70], [x0 + 18, top - 12], [(x0 + x1) / 2, top - 46], [x1 - 18, top - 12], [x1, top + 70]], 3); pen(g, a, 2.8, { raw: true, col: INK, mn: .6 });
    for (let k = 1; k < 9; k++) { const p = a[Math.round(k / 9 * (a.length - 1))], q = a[Math.round(k / 9 * (a.length - 1)) + 1] || p; const n = [-(q[1] - p[1]), q[0] - p[0]], l = Math.hypot(...n) || 1;
      pen(g, [p, [p[0] - n[0] / l * 34, p[1] - n[1] / l * 34]], 1.6, { col: INK, seed: k }); }
    const a2 = a.map((p, i) => { const q = a[Math.min(a.length - 1, i + 1)], o = a[Math.max(0, i - 1)]; const n = [-(q[1] - o[1]), q[0] - o[0]], l = Math.hypot(...n) || 1; return [p[0] - n[0] / l * 34, p[1] - n[1] / l * 34]; });
    pen(g, a2, 2, { raw: true, col: INK, mn: .5 }); }
  // background flowerbed at the wall foot
  for (let x = -20; x < BGW; x += 26 + r() * 30) { if (x > x0 - 80 && x < x1 + 80) continue; const yy = 1395 + r() * 40;
    leaf(g, x, yy + 20, -1.2 - r() * .7, 40, 16, r() < .5 ? '#6aa45e' : '#86bb6c', 1.6, x);
    if (r() < .6) { const fc = r() < .7 ? '#e0473f' : '#fbf7f0'; for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; g.fillStyle = fc; g.beginPath(); g.ellipse(x + Math.cos(a) * 7, yy + Math.sin(a) * 6, 6, 5, a, 0, TAU); g.fill(); }
      g.strokeStyle = 'rgba(29,23,23,.8)'; g.lineWidth = 1.3; g.beginPath(); g.arc(x, yy, 11, 0, TAU); g.stroke(); g.fillStyle = '#f2c14a'; g.beginPath(); g.arc(x, yy, 3, 0, TAU); g.fill(); } }
  // blue leaf shadows cast on the wall (crisp watercolour shapes), not on the bright opening
  const q = 4, mw = Math.ceil(BGW / q), mh = Math.ceil(1500 / q), m = Pilot.canvas(mw, mh), mg = m.getContext('2d'), d = mg.createImageData(mw, mh);
  for (let yy = 0; yy < mh; yy++) for (let xx = 0; xx < mw; xx++) { const X = xx * q, Y = yy * q;
    const wx = X / 170 + .6 * fbm(X / 300, Y / 300, 2), wy = Y / 150 + .6 * fbm(X / 300 + 9, Y / 300 + 4, 2);
    let v = fbm(wx, wy, 3) + .12 * noise(X / 22, Y / 22) - .03 * (Y > 1100 ? (Y - 1100) / 100 : 0);
    const k = clamp((v - .5) / .035); const i = (yy * mw + xx) * 4; d.data[i] = 96; d.data[i + 1] = 128; d.data[i + 2] = 222; d.data[i + 3] = k * 165; }
  mg.putImageData(d, 0, 0);

  ctx.fillStyle = gg; ctx.fillRect(GATE.x0 - 20, GATE.top - 80, 320, 900); ctx.restore();
  if (warm > 0) { ctx.save(); ctx.globalCompositeOperation = 'screen'; const cx = GATE.x0 - scr + 130;
    const sg = ctx.createRadialGradient(cx, 900, 40, cx, 900, 520); sg.addColorStop(0, `rgba(255,190,90,${.42 * warm * flick})`); sg.addColorStop(1, 'rgba(255,180,90,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 300, W, 1300); ctx.restore(); }
  // near canopy (parallax, gentle sway)
  ctx.save(); ctx.translate(-scr * 1.15 + 4 * Math.sin(t * 1.1), -150 + 3 * Math.sin(t * 1.4)); ctx.drawImage(CAN, 0, 0); ctx.restore();

  // dust + petals where the cross lands
  if (t > 4.84) { const u = t - 4.84, r = rng(4);
    for (let i = 0; i < 14; i++) { const a = -Math.PI / 2 + (r() - .5) * 2.2, v = 160 + r() * 260, x = 160 + (r() - .5) * 260 + Math.cos(a) * v * u, y = 1440 + Math.sin(a) * v * u + 380 * u * u;
      const al = clamp(1 - u / 1.1); if (al <= 0) continue;
      if (i < 8) { ctx.fillStyle = `rgba(250,242,222,${.45 * al})`; ctx.beginPath(); ctx.arc(x, y - 20, 22 + u * 60, 0, TAU); ctx.fill(); }
      else { ctx.save(); ctx.translate(x, y); ctx.rotate(u * 8 + i); ctx.fillStyle = i % 2 ? '#e2463d' : '#fbf6ee'; ctx.globalAlpha = al; ctx.beginPath(); ctx.ellipse(0, 0, 9, 5, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.stroke(); ctx.restore(); } } }
  // character layer
  const g = charL.getContext('2d'), tq = Math.floor(t * 12 + 1e-6);
  if (tq !== lastQ) { g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); lastP = drawChar(g, t); lastQ = tq; }
  const P = lastP;
  // dapple: cool shade with sun spots cut out (world-fixed spots slide over her while she walks; leaves sway)
  const sx = shadeL.getContext('2d'), hx = hiL.getContext('2d');
  sx.setTransform(1, 0, 0, 1, 0, 0); sx.globalCompositeOperation = 'source-over'; sx.clearRect(0, 0, W / 2, H / 2);
  sx.fillStyle = 'rgb(176,190,232)'; sx.fillRect(0, 0, W / 2, H / 2);
  hx.setTransform(1, 0, 0, 1, 0, 0); hx.globalCompositeOperation = 'source-over'; hx.clearRect(0, 0, W / 2, H / 2);
  sx.globalCompositeOperation = 'destination-out';
  for (const s of SPOTS) {
    const x = s.x - scr + 9 * Math.sin(t * s.sp + s.ph) + 4 * Math.sin(t * 2.3 + s.ph * 2), y = s.y + 5 * Math.sin(t * s.sp * .8 + s.ph * 1.7);
    if (x < -80 || x > W + 80) continue;
    const rw = s.r * s.e, rh = s.r, flick = .75 + .25 * Math.sin(t * 3 * s.sp + s.ph);
    sx.globalAlpha = flick; sx.drawImage(SPOT, (x - rw) / 2, (y - rh) / 2, rw, rh);
    hx.globalAlpha = flick * .9; hx.drawImage(SPOT, (x - rw * .8) / 2, (y - rh * .8) / 2, rw * .8, rh * .8);
  }
  sx.globalAlpha = 1; hx.globalAlpha = 1;
  // warm light from the gate on her front (after 3.2)
  if (P.warm > 0) { const wg = hx.createLinearGradient(380, 0, 330, 0); }
  if (warm > 0) { hx.globalCompositeOperation = 'source-over'; const rg = hx.createRadialGradient(325, 400, 6, 325, 400, 95);
    rg.addColorStop(0, `rgba(255,190,110,${.45 * warm})`); rg.addColorStop(1, 'rgba(255,200,120,0)'); hx.fillStyle = rg; hx.fillRect(0, 0, W / 2, H / 2);
    sx.globalCompositeOperation = 'destination-out'; const rs = sx.createRadialGradient(325, 400, 6, 325, 400, 110); rs.addColorStop(0, `rgba(0,0,0,${.6 * warm})`); rs.addColorStop(1, 'rgba(0,0,0,0)'); sx.fillStyle = rs; sx.fillRect(0, 0, W / 2, H / 2); }
  sx.globalCompositeOperation = 'destination-in'; sx.drawImage(charL, 0, 0, W / 2, H / 2);
  hx.globalCompositeOperation = 'destination-in'; hx.drawImage(charL, 0, 0, W / 2, H / 2);
  ctx.drawImage(charL, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(shadeL, 0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .62; ctx.drawImage(hiL, 0, 0, W, H); ctx.restore();

  // foreground flowerbed (parallax)
  ctx.drawImage(HEDGE, -Math.round(scr * 1.3) - 40, 1370 + Math.round(2 * Math.sin(t * 1.2)));
  // drifting leaves
  { const r = rng(9); for (let i = 0; i < 6; i++) { const x0 = r() * 1300, sp = 60 + r() * 50, ph = r() * 10, yy = ((t * sp + ph * 100) % 1700) + 120, xx = x0 - scr * 1.1 + 40 * Math.sin(t * 1.5 + ph) - yy * .25;
      if (xx < -40 || xx > W + 40) continue; ctx.save(); ctx.translate(xx, yy); ctx.rotate(Math.sin(t * 2 + ph) * 1.2); leaf(ctx, 0, 0, 0, 30, 14, '#7fb86a', 1.8, i); ctx.restore(); } }
  // sunbeam from the upper right through the leaves, falling across her face (the accent)
  if (warm > 0) { const lx = lightL.getContext('2d'); lx.setTransform(.5, 0, 0, .5, 0, 0); lx.clearRect(0, 0, W, H); const c0 = ctx; { const ctx = lx;
    const src = [1180, 260];
    for (let i = 0; i < 5; i++) { const a = 2.28 + i * .075 + .01 * Math.sin(t * .9 + i), w = .014 + .009 * (i % 2), L = 1700;
      const al = warm * (.1 + .04 * Math.sin(t * 2.1 + i * 1.7)) * (i === 2 ? 1.5 : 1);
      const gr = ctx.createLinearGradient(src[0], src[1], src[0] + Math.cos(a) * L, src[1] + Math.sin(a) * L); gr.addColorStop(0, `rgba(255,214,140,${al})`); gr.addColorStop(.6, `rgba(255,196,110,${al * .6})`); gr.addColorStop(1, 'rgba(255,190,100,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(src[0], src[1]); ctx.lineTo(src[0] + Math.cos(a - w) * L, src[1] + Math.sin(a - w) * L); ctx.lineTo(src[0] + Math.cos(a + w) * L, src[1] + Math.sin(a + w) * L); ctx.fill(); }
    const hg = ctx.createRadialGradient(1060, 300, 10, 1060, 300, 520); hg.addColorStop(0, `rgba(255,224,160,${.42 * warm})`); hg.addColorStop(1, 'rgba(255,210,140,0)'); ctx.fillStyle = hg; ctx.fillRect(0, 0, W, 1000); }
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.drawImage(lightL, 0, 0, W, H); ctx.restore(); }
  ctx.restore();
  // paper
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(PAPER, 0, 0);
  if (warm > 0) { ctx.globalAlpha = warm; ctx.fillStyle = 'rgb(255,236,206)'; ctx.fillRect(0, 0, W, H); } ctx.restore();
  Story.captions(ctx, t, S.lines, { font: "'Gaegu',cursive", weight: 700, size: 84, y: 410, color: '#2a2220', shadow: 'rgba(255,250,236,.98)', shadowBlur: 16 });
}

Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 84px 'Gaegu'"], init, draw });
</script>
