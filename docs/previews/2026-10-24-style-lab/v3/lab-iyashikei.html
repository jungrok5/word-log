<title>스타일 실험 · 19 이야시케이</title>

<script>
/* 19 — Iyashikei: calm summer slice-of-life anime. Flat cel colour (one shadow tone per part, light from the upper right),
   thin warm-brown line art, big cumulus with blue-grey cel shadows, turquoise sky over a sea, a wooden veranda (engawa)
   with railing and posts framing the shot, a glass wind chime. A school girl walks along the veranda with a heavy wooden
   cross on her far shoulder (both hands on the lower crossbar arm), stops, the sun slides out from behind a cloud (3.2,
   the warm accent) and she looks up; the cross slips off and lands on the boards (4.4); then the breeze: hair, ribbon,
   skirt, the chime. Everything is drawn in code; the girl is layered parts on a small rig (IK arms/legs). */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2, PI = Math.PI;
const FONT = "'Gaegu',sans-serif";
const FLOOR = 1500;
const C = {
  line: '#3d2a24', lineS: '#5a3e33', skinLine: '#7b4536',
  skin: '#fde8db', skinS: '#f2c3b4', blush: 'rgba(240,120,118,.42)',
  hair: '#4d3129', hairS: '#33201c', hairH: '#80594a', hairLine: '#24140f',
  irisT: '#2e140f', irisM: '#7a3424', irisB: '#d98a4a',
  blouse: '#fbfbf7', blouseS: '#c8d2e6', collar: '#2e5f5b', collarS: '#22474a', ribbon: '#e2584b', ribbonS: '#b33c34',
  skirt: '#3b5a58', skirtS: '#2a4342', sock: '#fbfbf9', sockS: '#c9d1e2', shoe: '#6a3d29', shoeS: '#4a2a1c',
  wood: '#b3804f', woodS: '#7c5434', woodL: '#c99a69', woodG: '#93653e', woodLine: '#3e2a1e',
  sky0: '#2f9fcf', sky1: '#56b9d9', sky2: '#9fdbe3',
  cloud: '#fbfcf8', cloudS: '#c6d8e4', cloudS2: '#a9c1d4',
  sea: '#3c9cbe', seaFar: '#79c1d0', hillF: '#a4ccd2', hillN: '#76ab9f', hillNS: '#5e9387',
  bush: '#5aa25a', bushS: '#3d7c49', bushH: '#94c96c',
  rail: '#a97f59', railS: '#7b583c', railT: '#c79d73', post: '#8c6446', postS: '#684a33', postL: '#a77c58',
  floor: '#cfa77d', floorS: '#b48a60', floorL: '#8e6745', eave: '#5b4031', eaveS: '#3f2b20',
  gold: '#ffd27a', warm: '#ffb45e',
};

// ---------------- small drawing helpers ----------------
// path from a list of points: [x,y] = move/line, [cx,cy,x,y] = quad, [c1x,c1y,c2x,c2y,x,y] = cubic
function pth(x, a, close = true) {
  x.beginPath(); x.moveTo(a[0][0], a[0][1]);
  for (let i = 1; i < a.length; i++) { const p = a[i];
    if (p.length === 2) x.lineTo(p[0], p[1]); else if (p.length === 4) x.quadraticCurveTo(p[0], p[1], p[2], p[3]); else x.bezierCurveTo(p[0], p[1], p[2], p[3], p[4], p[5]); }
  if (close) x.closePath();
}
function shape(x, a, fill, line = C.line, lw = 2.6, shade) {
  pth(x, a); if (fill) { x.fillStyle = fill; x.fill(); }
  if (shade) { x.save(); pth(x, a); x.clip(); shade(); x.restore(); }
  if (line) { x.strokeStyle = line; x.lineWidth = lw; x.lineJoin = 'round'; x.lineCap = 'round'; pth(x, a); x.stroke(); }
}
function strokeP(x, a, col, lw) { pth(x, a, false); x.strokeStyle = col; x.lineWidth = lw; x.lineCap = 'round'; x.lineJoin = 'round'; x.stroke(); }
const ell = (x, cx, cy, rx, ry, rot = 0) => { x.beginPath(); x.ellipse(cx, cy, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); };
// a tapered limb segment as a capsule (p1 → p2, widths w1 → w2)
function capsule(x, ax, ay, bx, by, w1, w2) {
  const a = Math.atan2(by - ay, bx - ax);
  x.beginPath(); x.arc(ax, ay, w1 / 2, a + PI / 2, a - PI / 2); x.arc(bx, by, w2 / 2, a - PI / 2, a + PI / 2); x.closePath();
}
// two-bone IK: returns the joint (elbow/knee); sign picks the bend side
function ik(ax, ay, bx, by, l1, l2, sign) {
  let dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
  d = clamp(d, Math.abs(l1 - l2) + .5, l1 + l2 - .5);
  const a = Math.atan2(dy, dx), A = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1)), g = a + sign * A;
  return [ax + Math.cos(g) * l1, ay + Math.sin(g) * l1, ax + Math.cos(a) * d, ay + Math.sin(a) * d];
}
const rot = (px, py, a) => [px * Math.cos(a) - py * Math.sin(a), px * Math.sin(a) + py * Math.cos(a)];

// ---------------- timing ----------------
const STEP = 66, X0 = 372, C0 = .25, CEND = 1.55;
const WALK_END = B.walk[1];
const DTOT = 2 * STEP * (CEND - C0);
function dist(t) {   // trudge, decelerating into the stop
  const T = WALK_END, k = .55, v = DTOT / (T - k / 2);   // constant speed, then a linear slow-down over the last k s
  if (t <= T - k) return v * t;
  const u = Math.min(t, T) - (T - k); return v * (T - k) + v * (u - u * u / (2 * k));
}
const WARM = t => ss(B.look - .35, B.look + .7, t);   // the sun slides out from behind the cloud
const DROP0 = B.drop, LAND = B.drop + .36;

// ---------------- the pose (everything the girl does, as a function of t) ----------------
function pose(t) {
  const d = dist(t), c = C0 + d / (2 * STEP), rx = X0 + d;
  const walking = 1 - ss(WALK_END - .25, WALK_END + .1, t);
  const stepPh = c * 2 * TAU;   // two footfalls per cycle
  const bob = walking * (3 - 5 * Math.cos(stepPh)) * .9 + ss(B.stop, B.stop + .35, t) * (1 - ss(B.look, B.look + .4, t)) * 6
    - ss(LAND, LAND + .6, t) * 4 + Math.sin(t * 2.1) * 1.5 * (1 - walking);
  const relief = ss(LAND - .1, LAND + .7, t);
  const lean = .11 + .025 * Math.sin(stepPh) * walking + .05 * ss(B.stop, B.stop + .35, t) * (1 - ss(B.look, B.look + .45, t))
    - .05 * ss(B.look, B.look + .5, t) - .07 * relief;
  // head: weary droop → lifts to the light
  const pitch = .09 + .04 * ss(B.stop, B.stop + .4, t) - .30 * eio((t - B.look) / .7) + .06 * relief * 0
    + .012 * Math.sin(stepPh + 1) * walking;
  const look = ss(B.look - .05, B.look + .45, t);
  const blink = (() => { for (const b of [1.55, 5.15]) { const u = (t - b) / .16; if (u > 0 && u < 1) return Math.sin(u * PI); } return 0; })();
  const breathe = Math.sin(t * 2.4) * (1 - walking) * 1.2;
  return { t, c, rx, bob, lean, pitch, look, blink, breathe, walking, relief, warm: WARM(t) };
}
function feet(t, P) {   // each foot: planted while in stance, a low shuffling swing otherwise
  const out = [];
  for (const [o, dy] of [[0, 0], [.5, -7]]) {   // near leg, far leg (a little further back in depth)
    const cc = P.c + o, n = Math.floor(cc), p = cc - n;
    const plant = k => X0 + 2 * STEP * (k - o - C0) + .6 * STEP;
    let x, lift = 0, tilt = 0;
    if (p < .6) { x = plant(n); tilt = -ss(.42, .6, p) * .28; }
    else { const u = (p - .6) / .4; x = lerp(plant(n), plant(n + 1), eio(u)); lift = Math.sin(u * PI) * 12; tilt = (1 - u) * -.28 + Math.sin(u * PI) * .05; }
    out.push({ x, y: FLOOR + dy - lift, tilt: P.walking > .5 ? tilt : tilt * P.walking });
  }
  return out;
}

// ---------------- background (prebuilt) ----------------
let BG, CLOUDS = [], RIMS = [], GRAIN, FOLI, VIG, RX, BL;
function cumulus(w, h, seed, puffs) {
  const c = Pilot.canvas(w, h), x = c.getContext('2d'), r = rng(seed);
  const base = h * .86, list = [];
  // a mound of puffs: big ones at the back/top, smaller front ones along the flat base
  for (let i = 0; i < puffs; i++) {
    const u = (i + .5) / puffs, cx = w * (.12 + .76 * u) + (r() - .5) * w * .06;
    const mound = Math.sin(u * PI);
    const rr = h * (.16 + .2 * mound) * (.8 + r() * .4);
    list.push([cx, base - rr * .55 - mound * h * .32 * (.7 + r() * .5), rr, 0]);
  }
  for (let i = 0; i < puffs * .8; i++) {   // top cauliflower
    const u = .2 + .6 * r(), mound = Math.sin(u * PI);
    const rr = h * (.1 + .12 * mound) * (.8 + r() * .4);
    list.push([w * (.1 + .8 * u), base - h * .25 - mound * h * .42 - rr * .2, rr, 1]);
  }
  for (let i = 0; i < puffs * .7; i++) {   // front, low row
    const u = (i + .5) / (puffs * .7), rr = h * (.1 + .07 * r());
    list.push([w * (.1 + .8 * u) + (r() - .5) * 20, base - rr * .6, rr, 2]);
  }
  list.sort((a, b) => (a[3] === 1 ? 0 : a[3] === 0 ? 1 : 2) - (b[3] === 1 ? 0 : b[3] === 0 ? 1 : 2) || a[1] - b[1]);
  for (const [cx, cy, rr] of list) {
    x.fillStyle = C.cloudS; ell(x, cx, cy, rr, rr * .92); x.fill();
    x.save(); ell(x, cx, cy, rr, rr * .92); x.clip();
    x.fillStyle = C.cloud; ell(x, cx + rr * .2, cy - rr * .26, rr * .94, rr * .9); x.fill();
    x.restore();
  }
  // flat underside in the deeper shadow tone
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = C.cloudS2; x.beginPath(); x.moveTo(0, base - h * .03);
  for (let i = 0; i <= 12; i++) x.lineTo(w * i / 12, base - h * .03 - (Math.sin(i * 1.7 + seed) * .5 + .5) * h * .04);
  x.lineTo(w, h); x.lineTo(0, h); x.fill();
  x.fillStyle = C.cloudS; x.beginPath(); x.moveTo(0, base - h * .1);
  for (let i = 0; i <= 12; i++) x.lineTo(w * i / 12, base - h * .1 - (Math.sin(i * 2.3 + seed * 3) * .5 + .5) * h * .05);
  x.lineTo(w, base - h * .03); x.lineTo(0, base - h * .03); x.globalAlpha = .55; x.fill(); x.globalAlpha = 1;
  x.globalCompositeOperation = 'destination-out'; x.fillRect(0, base + 2, w, h);
  return c;
}
function rimOf(cl, sx, sy, cx0, cy0) {   // a gold silver-lining band on the edge that faces the sun
  const c = Pilot.canvas(cl.width, cl.height), x = c.getContext('2d');
  x.drawImage(cl, 0, 0);
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; x.drawImage(cl, Math.cos(a) * 9, Math.sin(a) * 9 + 4); }
  x.globalCompositeOperation = 'source-in'; x.fillStyle = '#ffe2a0'; x.fillRect(0, 0, c.width, c.height);
  return c;
}
const SUN = [716, 600];
const CL = [   // [x, y, w, h, seed, puffs, drift px/s] — towering cumulus rising from the horizon, blue sky above for the words
  [40, 120, 380, 190, 3, 4, 4],
  [560, 500, 600, 560, 11, 7, 3],
  [-140, 640, 640, 420, 7, 6, 5],
  [380, 820, 360, 210, 21, 4, 6],
];
function buildBG() {
  const c = Pilot.canvas(W, H), x = c.getContext('2d');
  // sky (the clouds are drawn live on top, then this lower part is drawn again)
  const g = x.createLinearGradient(0, 0, 0, 1060); g.addColorStop(0, C.sky0); g.addColorStop(.55, C.sky1); g.addColorStop(1, C.sky2);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  BG = { sky: c };
  // ---- the lower plate: horizon, sea, bushes, railing, floor, posts, eave (transparent above the horizon) ----
  const p = Pilot.canvas(W, H), y = p.getContext('2d'), r = rng(5);
  const HZ = 1000;
  // far islands / hills on the horizon
  y.fillStyle = C.hillF; y.beginPath(); y.moveTo(0, HZ);
  for (let i = 0; i <= 40; i++) { const u = i / 40; y.lineTo(u * W, HZ - (Math.max(0, Math.sin(u * 5.5 + .8)) * 38 + Math.max(0, Math.sin(u * 13 + 2)) * 10) * (u < .55 ? 1 : .35)); }
  y.lineTo(W, HZ + 2); y.lineTo(0, HZ + 2); y.fill();
  y.fillStyle = C.hillN; y.beginPath(); y.moveTo(560, HZ + 1); y.bezierCurveTo(640, HZ - 30, 760, HZ - 52, 860, HZ - 40); y.bezierCurveTo(960, HZ - 30, 1040, HZ - 12, 1080, HZ - 8); y.lineTo(1080, HZ + 1); y.fill();
  y.fillStyle = C.hillNS; y.beginPath(); y.moveTo(700, HZ + 1); y.bezierCurveTo(760, HZ - 20, 830, HZ - 30, 880, HZ - 26); y.lineTo(900, HZ + 1); y.fill();
  // sea
  const sg = y.createLinearGradient(0, HZ, 0, 1340); sg.addColorStop(0, C.seaFar); sg.addColorStop(.25, C.sea); sg.addColorStop(1, '#3591b4');
  y.fillStyle = sg; y.fillRect(0, HZ, W, 340);
  y.strokeStyle = 'rgba(220,244,246,.55)'; y.lineWidth = 2;
  for (let i = 0; i < 46; i++) { const yy = HZ + 6 + Math.pow(r(), 1.6) * 230, xx = r() * W, l = 10 + r() * 40 * (yy - HZ) / 200;
    y.beginPath(); y.moveTo(xx, yy); y.lineTo(xx + l, yy); y.stroke(); }
  // bushes / greenery along the railing (behind it)
  const bushes = [[-20, 1180, 260, 170], [180, 1240, 220, 110], [690, 1210, 260, 150], [880, 1150, 260, 220], [380, 1270, 260, 80]];
  for (const [bx, by, bw, bh] of bushes) {
    const rr = rng(bx * 7 + 13);
    const blobs = []; for (let i = 0; i < 9; i++) blobs.push([bx + rr() * bw, by + rr() * bh * .6 + bh * .2, 28 + rr() * bh * .35]);
    y.fillStyle = C.bushS; for (const [ax, ay, ar] of blobs) { ell(y, ax, ay, ar, ar * .85); y.fill(); }
    y.fillStyle = C.bush; for (const [ax, ay, ar] of blobs) { ell(y, ax + ar * .12, ay - ar * .2, ar * .8, ar * .62); y.fill(); }
    for (let i = 0; i < 40; i++) {   // leaf dabs
      const lx = bx + rr() * bw, ly = by + rr() * bh * .8 + 10, a = -PI / 2 + (rr() - .5) * 1.6, s = 7 + rr() * 9;
      y.fillStyle = rr() < .55 ? C.bushH : C.bushS; y.save(); y.translate(lx, ly); y.rotate(a);
      y.beginPath(); y.moveTo(0, 0); y.quadraticCurveTo(s * .55, -s * .5, s * 1.6, 0); y.quadraticCurveTo(s * .55, s * .5, 0, 0); y.fill(); y.restore();
    }
  }
  // railing: top rail, mid rail, sill, balusters
  const railBox = (x0, y0, w0, h0) => {
    y.fillStyle = C.rail; y.fillRect(x0, y0, w0, h0);
    y.fillStyle = C.railT; y.fillRect(x0, y0, w0, Math.min(7, h0 * .3));
    y.fillStyle = C.railS; y.fillRect(x0, y0 + h0 - Math.min(8, h0 * .3), w0, Math.min(8, h0 * .3));
    y.strokeStyle = C.woodLine; y.lineWidth = 2.2; y.strokeRect(x0, y0, w0, h0);
  };
  for (const bx of [150, 420, 690, 960]) {
    y.fillStyle = C.rail; y.fillRect(bx, 1060, 26, 270);
    y.fillStyle = C.railS; y.fillRect(bx + 17, 1060, 9, 270);
    y.strokeStyle = C.woodLine; y.lineWidth = 2.2; y.strokeRect(bx, 1060, 26, 270);
  }
  railBox(-10, 1040, W + 20, 30);
  railBox(-10, 1176, W + 20, 18);
  railBox(-10, 1318, W + 20, 30);
  // grain on rails
  y.strokeStyle = 'rgba(80,52,34,.35)'; y.lineWidth = 1.4;
  for (let i = 0; i < 26; i++) { const xx = r() * W, yy = [1052, 1186, 1332][i % 3] + (r() - .5) * 8; y.beginPath(); y.moveTo(xx, yy); y.lineTo(xx + 30 + r() * 70, yy + (r() - .5) * 2); y.stroke(); }
  // floor: planks running along the veranda, widening toward the camera
  y.fillStyle = C.floor; y.fillRect(0, 1348, W, H - 1348);
  let py = 1348;
  for (let i = 0; py < H; i++) {
    const hgt = 26 * Math.pow(1.32, i);
    y.fillStyle = i % 2 ? '#d3ad84' : C.floor; y.fillRect(0, py, W, hgt);
    y.fillStyle = 'rgba(160,116,78,.35)'; y.fillRect(0, py + hgt - Math.max(3, hgt * .12), W, Math.max(3, hgt * .12));
    y.strokeStyle = C.floorL; y.lineWidth = 2; y.beginPath(); y.moveTo(0, py + hgt); y.lineTo(W, py + hgt); y.stroke();
    // butt joints
    const jr = rng(i * 31 + 2); for (let k = 0; k < 2; k++) { const jx = jr() * W; y.beginPath(); y.moveTo(jx, py); y.lineTo(jx, py + hgt); y.lineWidth = 1.6; y.stroke(); }
    // grain
    y.strokeStyle = 'rgba(140,96,60,.28)'; y.lineWidth = 1.2;
    for (let k = 0; k < 5; k++) { const gx = jr() * W, gy = py + hgt * (.25 + jr() * .5); y.beginPath(); y.moveTo(gx, gy); y.bezierCurveTo(gx + 40, gy - 2, gx + 80, gy + 2, gx + 140 + jr() * 100, gy); y.stroke(); }
    py += hgt;
  }
  // the edge of the veranda (deck front edge with a soft shadow below) — far edge meets the railing sill
  y.fillStyle = 'rgba(90,60,40,.28)'; y.fillRect(0, 1348, W, 10);
  BG.plate = p;
  // posts at both sides and the eave at the top: the nearest layer (drawn over the girl and the cross)
  const fr0 = Pilot.canvas(W, H); { const y = fr0.getContext('2d');
  const post = (x0, w0) => {
    y.fillStyle = C.post; y.fillRect(x0, 0, w0, H);
    y.fillStyle = C.postS; y.fillRect(x0 + w0 * .62, 0, w0 * .38, H);
    y.fillStyle = C.postL; y.fillRect(x0 + w0 * .1, 0, 5, H);
    y.strokeStyle = C.woodLine; y.lineWidth = 3; y.strokeRect(x0, -5, w0, H + 10);
    const pr = rng(x0 + 99); y.strokeStyle = 'rgba(60,40,28,.45)'; y.lineWidth = 1.5;
    for (let k = 0; k < 9; k++) { const gx = x0 + 8 + pr() * (w0 - 16), gy = pr() * H; y.beginPath(); y.moveTo(gx, gy); y.bezierCurveTo(gx + 3, gy + 60, gx - 3, gy + 120, gx + 1, gy + 220); y.stroke(); }
  };
  post(-30, 92); post(1010, 100);
  // eave beam + rafters
  y.fillStyle = C.eave; y.fillRect(0, 0, W, 92);
  y.fillStyle = C.eaveS; y.fillRect(0, 70, W, 22);
  y.strokeStyle = C.woodLine; y.lineWidth = 3; y.beginPath(); y.moveTo(0, 92); y.lineTo(W, 92); y.stroke();
  for (let k = 0; k < 8; k++) { const rx = 40 + k * 145; y.fillStyle = '#4a3326'; y.fillRect(rx, 0, 34, 62); y.strokeRect(rx, -4, 34, 66); }
  } BG.front = fr0;
  BG.HZ = HZ;
  // clouds
  for (const [cx, cy, cw, ch, sd, pf] of CL) { const cl = cumulus(cw, ch, sd, pf); CLOUDS.push(cl); RIMS.push(rimOf(cl, SUN[0], SUN[1], cx + cw / 2, cy + ch / 2)); }
  // foreground out-of-focus foliage (bottom right), like a lens close to a plant
  const f = Pilot.canvas(520, 520), fx = f.getContext('2d'), fr = rng(77);
  fx.filter = 'blur(7px)';
  for (let i = 0; i < 9; i++) {
    const a = -2.4 + i * .28 + (fr() - .5) * .2, len = 220 + fr() * 140;
    fx.save(); fx.translate(470, 520); fx.rotate(a);
    fx.fillStyle = i % 3 ? '#2f6a3b' : '#3f8148';
    fx.beginPath(); fx.moveTo(0, 0); fx.quadraticCurveTo(len * .5, -48, len, -6); fx.quadraticCurveTo(len * .5, 40, 0, 0); fx.fill(); fx.restore();
  }
  FOLI = f;
  // grain + vignette
  GRAIN = Pilot.speckle(360, 640, 26, 4);
  const v = Pilot.canvas(W, H), vx = v.getContext('2d'), vg = vx.createRadialGradient(540, 960, 600, 540, 960, 1300);
  vg.addColorStop(0, 'rgba(30,40,60,0)'); vg.addColorStop(1, 'rgba(30,40,60,.32)'); vx.fillStyle = vg; vx.fillRect(0, 0, W, H);
  VIG = v;
}

// ---------------- the cross ----------------
const BEAM = 58, LFOOT = 1250, LTOP = 236, ARM = 300;
function beam(x, ax, ay, bx, by, endA, endB, light, bw = BEAM) {   // a squared timber from a to b, with a dark side face and end grain
  const a = Math.atan2(by - ay, bx - ax), L = Math.hypot(bx - ax, by - ay), w = bw;
  x.save(); x.translate(ax, ay); x.rotate(a);
  x.fillStyle = C.wood; x.fillRect(0, -w / 2, L, w);
  x.fillStyle = C.woodS; x.fillRect(0, w / 2 - w * .3, L, w * .3);           // side face (away from the light)
  x.fillStyle = C.woodL; x.fillRect(0, -w / 2, L, 5);
  x.save(); x.beginPath(); x.rect(0, -w / 2, L, w); x.clip();
  const gr = rng(Math.round(L * 3 + w));
  x.strokeStyle = C.woodG; x.lineWidth = 1.6;
  for (let i = 0; i < 6; i++) { const gy = -w / 2 + 8 + gr() * (w * .62), gx = gr() * L * .6;

  x.restore();
  x.strokeStyle = C.woodLine; x.lineWidth = 2.6;
  x.strokeRect(0, -w / 2, L, w);
  x.beginPath(); x.moveTo(0, w / 2 - w * .3); x.lineTo(L, w / 2 - w * .3); x.lineWidth = 1.8; x.stroke();

function crossState(t, P) {
  // carried: the crossing rests on the far shoulder; the foot drags on the boards behind (its angle follows the shoulder)
  const sh = toWorld(P, 30, -226);
  const footY = FLOOR - 16;
  const carried = (s) => { const sin = clamp((footY - s[1]) / LFOOT, .2, .95), th = Math.asin(sin); return { cr: s, th }; };
  let st;
  if (t < DROP0) st = carried(sh);
  else {
    const P0 = pose(DROP0), s0 = carried(toWorld(P0, 30, -226));
    const F = [s0.cr[0] - Math.cos(s0.th) * LFOOT, s0.cr[1] + Math.sin(s0.th) * LFOOT];
    const u = clamp((t - DROP0) / (LAND - DROP0));
    // it swings down about its foot (accelerating) until the lower crossbar arm hits the boards, then a small bounce
    const TH1 = Math.atan((ARM + BEAM * .5) / LFOOT);
    let th = lerp(s0.th, TH1, u * u);
    if (t > LAND) th = TH1 + Math.abs(Math.sin((t - LAND) * 14)) * Math.exp(-(t - LAND) * 9) * .03;
    st = { cr: [F[0] + Math.cos(th) * LFOOT, F[1] - Math.sin(th) * LFOOT], th, F };
  }
  const fall = t < DROP0 ? 0 : ss(DROP0 + .06, LAND, t);
  // crossbar: in the cross's plane while carried; it turns into depth as the cross lies down on the boards
  st.bar = [Math.sin(st.th) * ARM, Math.cos(st.th) * ARM];
  st.fall = fall;
  return st;
}
function drawCross(x, st, warm) {
  const [cx, cy] = st.cr, ax = Math.cos(st.th), ay = -Math.sin(st.th);
  beam(x, cx - ax * LFOOT, cy - ay * LFOOT, cx + ax * LTOP, cy + ay * LTOP, 0, 1, warm);
  beam(x, cx - st.bar[0], cy - st.bar[1], cx + st.bar[0], cy + st.bar[1], 1, 1, warm);
}

// ---------------- the girl ----------------
function hipOf(P) { return [P.rx + 4, FLOOR - 440 + P.bob]; }
function toWorld(P, x, y) { const [hx, hy] = hipOf(P), [a, b] = rot(x, y, P.lean); return [hx + a, hy + b]; }

function drawLeg(x, hip, ank, tilt, far) {
  const [kx, ky, ex, ey] = ik(hip[0], hip[1], ank[0], ank[1], 206, 196, -1);

  x.fillStyle = sk; capsule(x, hip[0], hip[1], kx, ky, 46, 36); x.fill(); capsule(x, kx, ky, ex, ey, 36, 24); x.fill();
  // cel shadow on the back of the leg

  const a = Math.atan2(ey - ky, ex - kx); x.translate(kx, ky); x.rotate(a); x.fillStyle = far ? '#e3ab9c' : C.skinS; x.fillRect(-20, 4, 260, 20); x.restore();

  x.restore();
  return [kx, ky];
}

function drawSkirt(x, P, ft, t) {
  const [hx, hy] = hipOf(P);
  const w = P.t, wind = Math.sin(t * 2.3) * .5 + Math.sin(t * 3.7 + 1) * .3 + .4;
  const kneeFwd = (ft[0].x - P.rx) * .22;

  const N = 9;
  for (let i = 0; i <= N; i++) {
    const u = i / N, xx = hx - 78 + u * 168 + (1 - u) * (-10 * wind) + u * kneeFwd * .6;
    const yy = hemY + Math.sin(u * PI) * 6 + (i % 2 ? 7 : 0) - (1 - u) * 8 * wind;
    pts.push([xx, yy]);
  }

  for (let i = 1; i <= N; i++) a.push([pts[i][0], pts[i][1]]);
  a.push([pts[N][0] - 4, pts[N][1] - 60, wr[0] + 10, wr[1] + 50, wr[0], wr[1]]);
  shape(x, a, C.skirt, C.line, 2.6, () => {

  for (let i = 1; i < N; i++) { const top = [lerp(wl[0], wr[0], i / N), lerp(wl[1], wr[1], i / N)];
    x.beginPath(); x.moveTo(lerp(top[0], pts[i][0], .25), lerp(top[1], pts[i][1], .25)); x.lineTo(pts[i][0], pts[i][1] - 2); x.stroke(); }
}

// arms: shoulder → (IK) → the hand at a grip point; sleeve on top
function drawArm(x, sh, hand, far, grip, beamA) {
  const [ex, ey, wx, wy] = ik(sh[0], sh[1], hand[0], hand[1], 124, 112, 1);
  const sk = far ? C.skinS : C.skin;
  x.fillStyle = C.line; capsule(x, sh[0], sh[1], ex, ey, 30 + 5, 24 + 5); x.fill(); capsule(x, ex, ey, wx, wy, 24 + 5, 18 + 5); x.fill();
  x.fillStyle = sk; capsule(x, sh[0], sh[1], ex, ey, 30, 24); x.fill(); capsule(x, ex, ey, wx, wy, 24, 18); x.fill();
  x.save(); capsule(x, ex, ey, wx, wy, 24, 18); x.clip(); const a = Math.atan2(wy - ey, wx - ex); x.translate(ex, ey); x.rotate(a);
  x.fillStyle = far ? '#e3ab9c' : C.skinS; x.fillRect(-20, 3, 200, 14); x.restore();

}
function drawGrip(x, gx, gy, ba, ex, ey, far) {
  // beam space: u along the timber, v across it (s = the side the forearm comes from). Seen from the camera: the back of
  // the hand lies across the face of the timber, knuckles near the far edge, fingers curling round that edge; thumb on the near edge.
  const ca = Math.cos(ba), sa = Math.sin(ba), vx = ex - gx, vy = ey - gy, s = (-sa * vx + ca * vy) > 0 ? 1 : -1;
  const sk = far ? C.skinS : C.skin, sh = far ? '#e3ab9c' : C.skinS, hw = BEAM / 2;
  x.save(); x.translate(gx, gy); x.rotate(ba);
  // curled fingers wrapping the far edge (drawn first: the knuckles overlap them)
  for (let i = 0; i < 4; i++) {
    const u = -15 + i * 10.5, tip = i === 0 || i === 3 ? 4 : 7;
    shape(x, [[u - 5.5, -s * (hw - 12)], [u - 5.5, -s * (hw + tip), u + 5.5, -s * (hw + tip), u + 5.5, -s * (hw - 12)]], sk, C.skinLine, 1.8,
      () => { x.fillStyle = sh; x.fillRect(u - 8, -s * (hw + tip + 4) - 2, 16, 6); });
  }
  // back of the hand: from the wrist (near edge) to the knuckle row (far edge)
  shape(x, [[-13, s * (hw + 14)], [-20, s * 6, -24, -s * (hw - 18), -20, -s * (hw - 8)], [-8, -s * (hw - 2), 8, -s * (hw - 2), 22, -s * (hw - 8)],
    [26, -s * (hw - 18), 20, s * 6, 13, s * (hw + 14)]], sk, C.skinLine, 2.4,
    () => { x.fillStyle = sh; x.fillRect(-40, s * 4 - 30, 14, 60); x.fillRect(-30, s * (hw + 4) - 10, 70, 20); });
  // knuckle creases + tendons
  x.strokeStyle = C.skinLine; x.lineWidth = 1.4;
  for (let i = 0; i < 3; i++) { const u = -10 + i * 10.5; x.beginPath(); x.moveTo(u, -s * (hw - 10)); x.lineTo(u, -s * (hw - 3)); x.stroke(); }

  shape(x, [[12, s * (hw - 2)], [24, s * (hw + 2), 34, s * (hw - 2), 36, s * (hw - 10)], [32, s * (hw - 16), 22, s * (hw - 14), 10, s * (hw - 12)]], sk, C.skinLine, 2);
  x.restore();
}
function drawHand(x, hx, hy, a, grip, far) {

  const bw = i => wind(t, 10 + i) * 2.2;
  const bang = [[-72, -38], [-70, -84, -30, -104, 8, -104], [48, -104, 76, -78, 72, -30],
    [70, -12, 66, 0, 62 + bw(0), 8], [60, -12, 56, -22, 52, -30],
    [50, -12, 44, 0, 38 + bw(1), 12], [36, -10, 33, -22, 30, -34],
    [26, -16, 20, -4, 14 + bw(2), 6], [12, -12, 8, -24, 4, -36],
    [0, -16, -4, -4, -8 + bw(3), 8], [-10, -10, -14, -20, -18, -30],
    [-24, -14, -30, -2, -36 + bw(4), 6], [-38, -8, -42, -16, -46, -24],
    [-52, -8, -56, 4, -60 + bw(5), 16], [-64, -2, -70, -20, -72, -38]];
  shape(x, bang, C.hair, C.hairLine, 2.6, () => {
    x.fillStyle = C.hairS; pth(x, [[-80, -30], [80, -30], [80, 20], [-80, 20]]); x.globalAlpha = .9; x.fill(); x.globalAlpha = 1;
    // glossy highlight dashes along the crown ("angel ring")
    x.fillStyle = C.hairH;
    for (const [hx, hy, hr, ha] of [[-48, -70, 9, -.9], [-30, -82, 7, -.5], [22, -86, 7, .3], [40, -80, 10, .55], [56, -66, 6, .9], [-60, -54, 5, -1.1]]) {
      x.save(); x.translate(hx, hy); x.rotate(ha); ell(x, 0, 0, hr * 1.5, hr * .55); x.fill(); x.restore(); }
  });
  // strand lines inside the bangs
  x.strokeStyle = C.hairLine; x.lineWidth = 1.6;
  for (const [a0, a1, b0, b1] of [[52, -30, 34, -80], [30, -34, 18, -88], [4, -36, 0, -92], [-18, -30, -16, -88], [-46, -24, -38, -82]]) {
    x.beginPath(); x.moveTo(a0, a1); x.quadraticCurveTo((a0 + b0) / 2 + 4, (a1 + b1) / 2, b0, b1); x.stroke(); }
  // near side lock (in front of the ear), swinging back in the breeze
  const wn = wind(t, 1) * 7 * (1 + P.relief * .6);
  shape(x, [[-74, -40], [-82, 10, -76, 70, -64 + wn, 128], [-56 + wn * .6, 96, -52, 50, -46, -16]], C.hair, C.hairLine, 2.6,
    () => { x.fillStyle = C.hairS; pth(x, [[-90, -40], [-70, -40], [-66, 30, -62, 80, -60 + wn, 140], [-90, 140]]); x.fill(); });
  // little ahoge on top
  strokeP(x, [[0, -104], [-6 + wind(t, 7) * 3, -124, 12 + wind(t, 7) * 4, -132]], C.hairLine, 2.4);
  // warm rim light on the face and hair (sun ahead)
  if (P.warm > 0) {
    x.save(); x.globalAlpha = P.warm * .9;
    x.save(); pth(x, face); x.clip(); x.beginPath(); x.rect(40, -10, 60, 110); x.clip(); pth(x, face); x.strokeStyle = '#ffe0b0'; x.lineWidth = 7; x.stroke(); x.restore();
    x.save(); pth(x, bang); x.clip(); x.beginPath(); x.rect(20, -130, 80, 88); x.clip(); pth(x, bang); x.strokeStyle = '#d9925a'; x.lineWidth = 9; x.stroke(); x.restore();
    x.restore();
  }
}
function drawEye(x, cx, cy, w, h, side, lx, ly, blink, lk, warm) {
  const open = 1 - blink, hw = w / 2, hh = h / 2;
  const inner = [cx - side * hw * .96, cy - hh * .12], outer = [cx + side * hw * 1.02, cy - hh * .2 - lk * 2];
  if (open < .25) {   // closed: a soft downward curve with lashes
    strokeP(x, [[inner[0], cy + 4], [cx, cy + 14, outer[0], cy + 2]], C.hairLine, 3.2);
    return;
  }
  const top = cy - hh * (.62 + lk * .08) * open;
  // sclera
  const sc = [[inner[0], inner[1]], [inner[0] + side * w * .12, top - 4, outer[0] - side * w * .3, top - 6, outer[0], outer[1]],
    [outer[0] + side * 2, cy + hh * .5, cx + side * hw * .4, cy + hh * .98 * open, cx, cy + hh * .98 * open], [cx - side * hw * .5, cy + hh * .9 * open, inner[0], cy + hh * .3, inner[0], inner[1]]];
  shape(x, sc, '#ffffff', null);
  x.save(); pth(x, sc); x.clip();
  x.fillStyle = 'rgba(160,170,200,.45)'; x.fillRect(cx - w, top - 4, w * 2, 9);   // lid shadow on the white
  // iris
  const ix = cx + lx + side * 1, iy = cy + 4 + ly, rx = w * .37, ry = hh * .9;
  const g = x.createLinearGradient(0, iy - ry, 0, iy + ry);
  g.addColorStop(0, C.irisT); g.addColorStop(.45, C.irisM); g.addColorStop(1, C.irisB);
  x.fillStyle = g; ell(x, ix, iy, rx, ry); x.fill();
  x.fillStyle = 'rgba(40,14,10,.85)'; ell(x, ix, iy - ry * .05, rx * .5, ry * .52); x.fill();   // pupil
  x.fillStyle = 'rgba(255,190,120,.5)'; ell(x, ix, iy + ry * .62, rx * .62, ry * .26); x.fill(); // lower glow
  x.strokeStyle = 'rgba(30,10,8,.9)'; x.lineWidth = 2; ell(x, ix, iy, rx, ry); x.stroke();
  // highlights: a big one toward the light, a small one opposite; warm catch-light when the sun is out
  x.fillStyle = '#fff'; ell(x, ix + rx * .38, iy - ry * .42, rx * .32, ry * .22, -.3); x.fill();
  ell(x, ix - rx * .42, iy + ry * .38, rx * .14, ry * .1); x.fill();
  if (warm > 0) { x.globalAlpha = warm; x.fillStyle = '#ffe2a8'; ell(x, ix - rx * .1, iy + ry * .5, rx * .28, ry * .1); x.fill(); x.globalAlpha = 1; }
  x.restore();
  // upper lash line: thin at the inner corner, heavy at the outer, with a small flick
  const lash = [[inner[0] - side * 1, inner[1] + 2], [inner[0] + side * w * .1, top - 8, outer[0] - side * w * .3, top - 10, outer[0] + side * 4, outer[1] - 1],
    [outer[0] + side * 8, outer[1] + 5], [outer[0] + side * 2, outer[1] + 5],
    [outer[0] - side * w * .3, top - 1, inner[0] + side * w * .14, top + 1, inner[0], inner[1] + 4]];
  shape(x, lash, C.hairLine, C.hairLine, 1.4);
  // crease + lower lash
  strokeP(x, [[inner[0] + side * w * .3, top - 15], [cx + side * hw * .3, top - 19, outer[0] - side * 4, outer[1] - 12]], 'rgba(90,50,40,.55)', 1.5);
  strokeP(x, [[cx + side * hw * .1, cy + hh * .98 * open], [cx + side * hw * .6, cy + hh * .85 * open, outer[0] - side * 1, cy + hh * .3]], C.skinLine, 1.6);
}

// ---------------- the wind chime ----------------
function drawChime(x, t, ring) {
  const ax = 906, ay = 92, sw = Math.sin(t * 2.0) * .06 + Math.sin(t * 3.3 + 1) * .03 + ring * Math.sin((t - LAND) * 11) * .12;
  x.save(); x.translate(ax, ay); x.rotate(sw);
  strokeP(x, [[0, 0], [0, 150]], C.line, 2);
  // glass bell with painted goldfish
  x.save(); x.translate(0, 150);
  const bell = [[-36, 52], [-38, 10, -24, -6, 0, -6], [24, -6, 38, 10, 36, 52], [20, 56, -20, 56, -36, 52]];
  shape(x, bell, 'rgba(225,245,250,.78)', C.line, 2.4, () => {
    x.fillStyle = 'rgba(255,255,255,.7)'; ell(x, -16, 12, 6, 16, .3); x.fill();
    x.fillStyle = '#ef6a5a'; ell(x, 10, 26, 10, 6, -.3); x.fill(); x.beginPath(); x.moveTo(-2, 30); x.lineTo(-10, 22); x.lineTo(-10, 36); x.fill();
    x.fillStyle = '#5bbf9a'; x.fillRect(-40, 44, 80, 4);
  });
  strokeP(x, [[0, -6], [0, -12]], C.line, 3);
  // clapper + string + paper strip
  const s2 = Math.sin(t * 2.6 + .7) * .14 + ring * Math.sin((t - LAND) * 9) * .25;
  x.translate(0, 40); x.rotate(s2 - sw * .5);
  strokeP(x, [[0, 0], [0, 54]], C.line, 1.6);
  x.fillStyle = '#e9e2d0'; ell(x, 0, 26, 4, 4); x.fill();
  x.translate(0, 54); x.rotate(Math.sin(t * 3.1) * .12);
  shape(x, [[-17, 0], [17, 0], [18 + Math.sin(t * 4) * 2, 104], [-16 + Math.sin(t * 4) * 2, 104]], '#d8c7ef', C.line, 2.2, () => {
    x.fillStyle = '#b6a0e0'; x.fillRect(4, 0, 16, 110);
    x.fillStyle = '#f39aa4'; ell(x, -2, 34, 6, 6); x.fill(); ell(x, 4, 58, 5, 5); x.fill();
    x.strokeStyle = '#7a5aa8'; x.lineWidth = 1.4; x.beginPath(); x.moveTo(-8, 74); x.quadraticCurveTo(0, 82, 8, 74); x.stroke();
  });
  x.restore();
  x.restore();
}

// ---------------- frame ----------------
function draw(ctx, t) {
  const P = pose(t), warm = P.warm;
  const shake = t > LAND && t < LAND + .25 ? Math.sin((t - LAND) * 70) * 3 * (1 - (t - LAND) / .25) : 0;
  ctx.save(); ctx.translate(0, shake);
  // sky
  ctx.drawImage(BG.sky, 0, 0);
  // the sun glow behind the big cloud (the warm accent)
  if (warm > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    const g = ctx.createRadialGradient(SUN[0], SUN[1], 20, SUN[0], SUN[1], 640);
    g.addColorStop(0, `rgba(255,236,190,${.95 * warm})`); g.addColorStop(.3, `rgba(255,200,130,${.45 * warm})`); g.addColorStop(1, 'rgba(255,170,90,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // soft rays
    ctx.globalAlpha = .18 * warm;
    for (let i = 0; i < 7; i++) { const a = -2.6 + i * .5 + Math.sin(t * .4 + i) * .03;
      ctx.save(); ctx.translate(SUN[0], SUN[1]); ctx.rotate(a); ctx.fillStyle = '#fff1c8';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, -40 - i * 5); ctx.lineTo(900, 40 + i * 5); ctx.fill(); ctx.restore(); }
    ctx.restore();
  }
  // the sun disc (behind the clouds) — uncovered as the tower cloud slides right
  { ctx.save(); ctx.globalAlpha = .35 + .65 * warm; ctx.fillStyle = '#fffbea'; ell(ctx, SUN[0], SUN[1], 46, 46); ctx.fill(); ctx.restore(); }
  for (let i = 0; i < CL.length; i++) {
    const [cx, cy, , , , , dr] = CL[i];
    let dx = dr * t;
    if (i === 1) dx = 3 * t + ss(B.look - .6, B.look + 1.0, t) * 70;
    ctx.drawImage(CLOUDS[i], cx + dx, cy);
    if (warm > 0) {   // a gold silver lining near the sun
      const R = 300, rc = RX.getContext('2d');
      rc.globalCompositeOperation = 'source-over'; rc.clearRect(0, 0, 2 * R, 2 * R);
      rc.drawImage(RIMS[i], cx + dx - (SUN[0] - R), cy - (SUN[1] - R));
      rc.globalCompositeOperation = 'destination-in';
      const g = rc.createRadialGradient(R, R, 30, R, R, R); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      rc.fillStyle = g; rc.fillRect(0, 0, 2 * R, 2 * R);
      ctx.globalAlpha = warm; ctx.drawImage(RX, SUN[0] - R, SUN[1] - R); ctx.globalAlpha = 1;
    }
  }
  // horizon strip under the clouds' bottoms, then the plate
  ctx.drawImage(BG.plate, 0, 0);
  // sea glints
  const gr = rng(9);
  ctx.fillStyle = '#eafcff';
  for (let i = 0; i < 26; i++) { const gx = gr() * W, gy = 1006 + gr() * 160, ph = gr() * TAU, sp = 2 + gr() * 3;
    const a = Math.max(0, Math.sin(t * sp + ph)); if (a < .4) continue;
    if (gy > 1036 && gy < 1074) continue;
    ctx.globalAlpha = (a - .4) * (1 + warm) * .9; ctx.fillRect(gx, gy, 6 + gr() * 10, 2); }
  ctx.globalAlpha = 1;
  // warm light patch on the boards
  if (warm > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = warm * .8;
    const lg = ctx.createLinearGradient(1000, 1350, 300, 1920); lg.addColorStop(0, '#ffcf7a'); lg.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = lg; ctx.fillRect(62, 1348, 948, 572); ctx.restore();
  }
  // contact shadow under the girl
  const ft = feet(t, P);
  ctx.fillStyle = 'rgba(110,70,45,.28)'; ell(ctx, P.rx + 10, FLOOR + 6, 120, 16); ctx.fill();
  // ---- the girl and the cross, back to front ----
  const st = crossState(t, P);
  const hip = hipOf(P);
  // cross shadow on the floor once it lands
  if (st.fall > 0) { ctx.fillStyle = `rgba(110,70,45,${.22 * st.fall})`; ell(ctx, st.cr[0] - 300, FLOOR - 10, 760, 14); ctx.fill(); }
  drawCross(ctx, st, warm);
  // far arm: grips the lower crossbar arm close to the shoulder, then lets go
  const shF = toWorld(P, 30, -202), shN = toWorld(P, -40, -200);
  const relN = toWorld(P, -30, 30), relF = toWorld(P, 38, 26);
  const gripPt = (d) => { const L = Math.hypot(st.bar[0], st.bar[1]); return [st.cr[0] + st.bar[0] / L * d, st.cr[1] + st.bar[1] / L * d]; };
  const letGo = eo((t - DROP0 + .02) / .5);
  const gF = gripPt(150), gN = gripPt(202);
  const hF = [lerp(gF[0], relF[0], letGo), lerp(gF[1], relF[1], letGo) + Math.sin(t * 2.4) * 2 * letGo];
  const hN = [lerp(gN[0], relN[0], letGo), lerp(gN[1], relN[1], letGo) + Math.sin(t * 2.4 + .5) * 2 * letGo];
  const grip = letGo < .35 ? 1 : 0;
  // hair back + far arm + legs + skirt + torso
  const nk = toWorld(P, 6, -262), ha = P.lean * .6 + P.pitch;
  ctx.save(); ctx.translate(nk[0], nk[1]); ctx.rotate(ha); ctx.translate(-2, -80); drawHairBack(ctx, P, t); ctx.restore();
  const bA = Math.atan2(st.bar[1], st.bar[0]);
  drawArm(ctx, shF, hF, true, grip, bA);
  const hipN = [hip[0] - 8, hip[1] + 14], hipF = [hip[0] + 16, hip[1] + 8];
  drawLeg(ctx, hipF, [ft[1].x + 10, ft[1].y - 30], ft[1].tilt, true);
  drawLeg(ctx, hipN, [ft[0].x, ft[0].y - 30], ft[0].tilt, false);
  drawSkirt(ctx, P, ft, t);
  drawTorso(ctx, P, t);
  // head
  ctx.save(); ctx.translate(nk[0], nk[1]); ctx.rotate(ha); ctx.translate(-2, -80); drawHead(ctx, P, t); ctx.restore();
  // near arm on top
  drawArm(ctx, shN, hN, false, grip, bA);
  // dust when the cross lands
  if (t > LAND && t < LAND + 1.2) {
    const u = (t - LAND) / 1.2, dr = rng(3);
    const tx = st.cr[0] + st.bar[0];
    for (let i = 0; i < 12; i++) { const sd = dr() - .5, px = tx + sd * 60, vy = 14 + dr() * 40;
      ctx.globalAlpha = (1 - u) * .55; ctx.fillStyle = '#f6ead6'; ell(ctx, px + sd * 160 * eo(u), FLOOR - 14 - vy * eo(u), 7 + 14 * u, 5 + 9 * u); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  ctx.drawImage(BG.front, 0, 0);
  drawChime(ctx, t, t > LAND ? Math.exp(-(t - LAND) * 1.5) : 0);
  ctx.save(); ctx.translate(Math.sin(t * 1.3) * 6, 0); ctx.drawImage(FOLI, W - 470, H - 560, 520, 520); ctx.restore();
  ctx.restore();
  // colour grade: a slightly cooler, flatter light before the sun; warm afterwards
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = .28 * warm; ctx.fillStyle = '#ffb35a'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .12 * (1 - warm); ctx.fillStyle = '#b8c8e0'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .1; ctx.drawImage(GRAIN, 0, 0, W, H);
  ctx.restore();
  { const bx = BL.getContext('2d'); bx.filter = 'blur(6px)'; bx.drawImage(ctx.canvas, 0, 0, 270, 480); bx.filter = 'none';
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .16 + .14 * warm; ctx.drawImage(BL, 0, 0, W, H); ctx.restore(); }
  ctx.drawImage(VIG, 0, 0);
  caption(ctx, t);
}
function caption(ctx, t) {   // soft white anime subtitle: thin dark-teal outline + soft shadow
  const o = { font: FONT, weight: 700, size: 96, y: 380, shadow: 'rgba(0,0,0,0)', shadowBlur: 1 };
  for (let i = 0; i < 12; i++) { const an = i / 12 * TAU; ctx.save(); ctx.translate(Math.cos(an) * 4, Math.sin(an) * 4); Story.captions(ctx, t, S.lines, { ...o, color: '#24485a' }); ctx.restore(); }
  Story.captions(ctx, t, S.lines, { ...o, color: '#fffdf4', shadow: 'rgba(20,50,70,.35)', shadowBlur: 14 });
}
async function init() { buildBG(); RX = Pilot.canvas(600, 600); BL = Pilot.canvas(270, 480); }
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["700 96px 'Gaegu'"], init, draw });
</script>
