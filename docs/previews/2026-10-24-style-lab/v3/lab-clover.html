<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스타일 실험 · 11 클로버 수채</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hi+Melody&display=swap">
</head>
<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* 11 — close-up pastel watercolour + coloured pencil (a clover patch at ground level).
   Every shape is a transparent wash: flat colour with soft blooms, pigment pooled darker at the edges (blurred inner
   stroke), on cold-press paper; then a thin, slightly broken coloured-pencil contour in a darker shade of itself.
   Depth by softness and value: pale blurred clover far, crisp saturated leaves near. Big three-leaf clovers with pale
   chevrons, white clover flower balls, grass blades, a pale gingham picnic cloth.
   "Me" is a round little hamster with a big wicker basket strapped on its back, waddling onto the cloth; at 3.2 a soft
   warm sunbeam opens through the leaves ahead (the accent), the basket slips off onto the cloth (a flower tumbles out).
   Native motion: leaves sway, a ladybug walks along a leaf, light motes drift in the beam. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const C = {
  sky0: '#b9e0dc', sky1: '#e9f3d6', far: '#a3d38c', farL: '#86bd76', mid: '#79c164', midL: '#4f9a4a', near: '#66b558', nearL: '#3f8a40', deep: '#55a64f',
  chev: 'rgba(232,248,210,.55)', blade: '#8cc67a', bladeL: '#5d9a58', stem: '#9ccc86',
  flower: '#fdfdf8', flowerL: '#c6cdb9', flowerC: '#dfe6c8',
  cloth: '#d7e8f0', clothL: '#9fc3d8', clothD: '#b9d5e5',
  ham: '#f3bf8a', hamD: '#e3a46e', hamL: '#b97c4e', belly: '#fffaf1', pink: '#f5b8b0', nose: '#e88f8c',
  wick: '#e2bf86', wickD: '#c79b5f', wickL: '#9a7444', strap: '#a8734d',
  lady: '#e2533f', ladyD: '#3a302c', warm: '#ffd88a', ink: '#5f7f52',
};
const GY = 1500, X0 = 190, FS = 1.7;
const SUN = { x: 780, y: 1430 };   // where the warm beam lands on the cloth (ahead of the hamster)

// ---------------- shape helpers ----------------
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
function smooth(pts, closed = true) {
  const p = new Path2D(), n = pts.length;
  if (closed) { const m0 = mid(pts[n - 1], pts[0]); p.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) { const a = pts[i], m = mid(a, pts[(i + 1) % n]); p.quadraticCurveTo(a[0], a[1], m[0], m[1]); } p.closePath(); }
  else { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n - 1; i++) { const m = mid(pts[i], pts[i + 1]); p.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); } p.lineTo(pts[n - 1][0], pts[n - 1][1]); }
  return p;
}
function rough(pts, amp, seed, step = 10, closed = true) {
  const o = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) { const a = pts[i], b = pts[(i + 1) % n], L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.max(1, Math.round(L / step));
    for (let j = 0; j < k; j++) { const u = j / k, x = a[0] + (b[0] - a[0]) * u, y = a[1] + (b[1] - a[1]) * u;
      o.push([x + (noise(x * .03 + seed, y * .03) - .5) * amp, y + (noise(y * .03 + seed * 1.7, x * .03 + 9) - .5) * amp]); } }
  if (!closed) o.push(pts[n - 1]);
  return o;
}
const ellPts = (cx, cy, rx, ry, n = 22) => { const o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return o; };
const TX = {};
// a watercolour wash: colour + blooms + pigment pooled at the edge (+ optional pencil contour, a little broken)
function wash(ctx, path, col, edge, o = {}) {
  ctx.save(); ctx.fillStyle = col; ctx.fill(path); ctx.clip(path);
  ctx.globalAlpha = o.bloom ?? .5; ctx.drawImage(TX.bloom, o.bx || 0, o.by || 0); ctx.globalAlpha = 1;
  if (edge) { ctx.filter = `blur(${o.eb ?? 4}px)`; ctx.strokeStyle = edge; ctx.globalAlpha = o.pool ?? .4; ctx.lineWidth = o.ew ?? 9; ctx.stroke(path); ctx.filter = 'none'; ctx.globalAlpha = 1; }
  ctx.restore();
  if (o.line) { ctx.save(); ctx.strokeStyle = o.line; ctx.lineWidth = o.lw || 2; ctx.globalAlpha = o.la ?? .75; ctx.lineCap = 'round'; ctx.setLineDash(o.dash || [140, 5, 90, 4, 200, 6]); ctx.lineDashOffset = (o.seed || 0) * 13; ctx.stroke(path); ctx.restore(); }
}
function bloomTexture(w, h, seed) {   // soft light/dark blooms + granulation, transparent
  const c = Pilot.canvas(w, h), x = c.getContext('2d'), d = x.createImageData(w, h), q = d.data, r = rng(seed);
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
    const b = noise(i / 70 + seed, y / 70) * .6 + noise(i / 22, y / 22 + seed) * .4 - .5, g = r(), o = (y * w + i) * 4, v = b * 1.6 + (g - .5) * .35;
    if (v > 0) { q[o] = 255; q[o + 1] = 255; q[o + 2] = 245; q[o + 3] = Math.min(255, v * 150); } else { q[o] = 40; q[o + 1] = 70; q[o + 2] = 40; q[o + 3] = Math.min(255, -v * 110); } }
  x.putImageData(d, 0, 0); return c;
}
function paperTexture(w, h, seed) {   // cold-press watercolour paper
  const c = Pilot.canvas(w, h), x = c.getContext('2d'), d = x.createImageData(w, h), q = d.data, r = rng(seed);
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
    const tooth = noise(i / 3.5, y / 3.5 + seed) * .6 + noise(i / 9, y / 9) * .4, lo = noise(i / 200, y / 200 + seed), o = (y * w + i) * 4, v = 128 + (tooth - .5) * 46 + (lo - .5) * 26 + (r() - .5) * 10;
    q[o] = q[o + 1] = q[o + 2] = v; q[o + 3] = 255; }
  x.putImageData(d, 0, 0); return c;
}

// ---------------- clover pieces ----------------
function leaflet(s) {   // one heart-shaped leaflet pointing up (-y), notch at the outer end
  const p = new Path2D(); p.moveTo(0, 0);
  p.bezierCurveTo(-s * .5, -s * .18, -s * .66, -s * .98, -s * .3, -s * 1.08);
  p.quadraticCurveTo(-s * .07, -s * 1.12, 0, -s * .95);
  p.quadraticCurveTo(s * .07, -s * 1.12, s * .3, -s * 1.08);
  p.bezierCurveTo(s * .66, -s * .98, s * .5, -s * .18, 0, 0); p.closePath(); return p;
}
const LEAFS = ['#6fbd5c', '#5daf52', '#86ca6a', '#4fa24c', '#93d070', '#72b95f'];
function cloverLeaf(ctx, x, y, s, rot, tilt, col, line, seed, o = {}) {   // three leaflets around a centre, foreshortened by tilt
  if (!o.keep) col = Pilot.rgb(Pilot.mix(Pilot.hex(col), Pilot.hex(LEAFS[Math.abs(seed | 0) % LEAFS.length]), .45));
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, tilt);
  const r = rng(seed);
  for (let i = 0; i < 3; i++) { const a = -Math.PI / 2 + (i - 1) * 2.15 + (r() - .5) * .2;
    ctx.save(); ctx.rotate(a + Math.PI / 2); const lp = leaflet(s * (.92 + r() * .16));
    wash(ctx, lp, col, line, { bloom: .4, line: o.noLine ? null : (o.lineCol || '#3f7d40'), la: .85, lw: 2.4 / Math.sqrt(tilt), seed: seed + i, bx: -x, by: -y, ew: s * .12, eb: Math.max(2, s * .05) });
    { const g = ctx.createLinearGradient(0, 0, 0, -s * 1.1); g.addColorStop(0, 'rgba(30,80,40,.32)'); g.addColorStop(.5, 'rgba(30,80,40,.06)'); g.addColorStop(1, 'rgba(240,255,210,.12)');
      ctx.save(); ctx.clip(lp); ctx.fillStyle = g; ctx.fillRect(-s, -s * 1.2, 2 * s, s * 1.3); ctx.restore(); }
    // the pale chevron and a midrib
    ctx.strokeStyle = C.chev; ctx.lineWidth = Math.max(2, s * .045); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(-s * .3, -s * .78); ctx.quadraticCurveTo(-s * .1, -s * .56, 0, -s * .5); ctx.quadraticCurveTo(s * .1, -s * .56, s * .3, -s * .78); ctx.stroke();
    ctx.strokeStyle = 'rgba(60,110,60,.25)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(0, -s * .05); ctx.lineTo(0, -s * .9); ctx.stroke();
    ctx.restore(); }
  ctx.restore();
}
function cloverSprite(s, tilt, col, line, seed, stemH, stemCol) {   // a leaf on its stem, pivot at the stem's foot
  const pad = s * 1.3, c = Pilot.canvas(Math.ceil(pad * 2 + 20), Math.ceil(pad * 2 * tilt + stemH + 40)), x = c.getContext('2d');
  const cx = c.width / 2, cy = pad * tilt + 20;
  x.strokeStyle = stemCol || C.stem; x.lineWidth = Math.max(4, s * .08); x.lineCap = 'round';
  x.beginPath(); x.moveTo(cx, cy); x.quadraticCurveTo(cx + s * .15, cy + stemH * .5, cx, cy + stemH); x.stroke();
  cloverLeaf(x, cx, cy, s, (rng(seed)() - .5) * .5, tilt, col, line, seed);
  c.px = cx; c.py = cy + stemH; return c;
}
function flowerSprite(r, seed, pale = 0) {   // a white clover flower ball: many small reflexed florets
  const c = Pilot.canvas(r * 2.8, r * 2.8), x = c.getContext('2d'), rr = rng(seed), cx = c.width / 2, cy = c.height / 2;
  x.fillStyle = C.flowerC; x.beginPath(); x.ellipse(cx, cy + r * .1, r * .75, r * .7, 0, 0, TAU); x.fill();
  const n = 70; for (let i = 0; i < n; i++) { const a = rr() * TAU, d = Math.sqrt(rr()) * r * .8, px = cx + Math.cos(a) * d, py = cy + Math.sin(a) * d * .9;
    const ang = Math.atan2(py - cy + r * .3, px - cx), L = r * (.38 + rr() * .2);
    x.save(); x.translate(px, py); x.rotate(ang + Math.PI / 2); const p = new Path2D(); p.ellipse(0, L * .45, L * .22, L * .55, 0, 0, TAU);
    x.fillStyle = rr() < .12 ? '#f3efe6' : C.flower; x.fill(p); x.strokeStyle = C.flowerL; x.lineWidth = 1.4; x.globalAlpha = .7; x.stroke(p); x.globalAlpha = 1; x.restore(); }
  x.globalCompositeOperation = 'source-atop'; const g = x.createLinearGradient(0, cy - r, 0, cy + r); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(150,170,130,.28)'); x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  if (pale) { x.fillStyle = `rgba(225,238,230,${pale})`; x.fillRect(0, 0, c.width, c.height); }
  return c;
}
function blade(ctx, x, y, h, bend, w, col, line) {
  const p = new Path2D(); p.moveTo(x - w / 2, y); p.quadraticCurveTo(x - w * .3 + bend * .4, y - h * .6, x + bend, y - h); p.quadraticCurveTo(x + w * .3 + bend * .4, y - h * .6, x + w / 2, y); p.closePath();
  ctx.fillStyle = col; ctx.fill(p); if (line) { ctx.strokeStyle = line; ctx.lineWidth = 1.6; ctx.globalAlpha = .6; ctx.stroke(p); ctx.globalAlpha = 1; }
}

// ---------------- static layers ----------------
function buildBack() {   // sky, far flowers, far clover: soft (blurred) and pale → TX.sky; mid band + cloth → returned
  const c = Pilot.canvas(W, H), r = rng(5); let x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1100); g.addColorStop(0, C.sky0); g.addColorStop(1, C.sky1); x.fillStyle = g; x.fillRect(0, 0, W, H);
  // a few soft lighter blooms in the sky wash (no dark ones: the sky stays clean)
  for (let i = 0; i < 7; i++) { const bx = r() * W, by = r() * 900, br = 160 + r() * 220, bg = x.createRadialGradient(bx, by, 0, bx, by, br); bg.addColorStop(0, 'rgba(250,252,240,.35)'); bg.addColorStop(1, 'rgba(250,252,240,0)'); x.fillStyle = bg; x.fillRect(bx - br, by - br, br * 2, br * 2); }
  const far = Pilot.canvas(W, H), fx = far.getContext('2d');
  for (const [px, py, rr] of [[90, 760, 40], [300, 880, 32], [1000, 800, 38], [700, 920, 28]]) { fx.strokeStyle = '#c3debb'; fx.lineWidth = 6; fx.beginPath(); fx.moveTo(px, py); fx.lineTo(px + 6, 1200); fx.stroke(); fx.drawImage(flowerSprite(rr, px, .3), px - rr * 1.4, py - rr * 1.4); }
  for (let i = 0; i < 9; i++) blade(fx, r() * W, 1150, 200 + r() * 160, (r() - .5) * 120, 24, '#c1dfb1', null);
  for (let i = 0; i < 34; i++) { const px = r() * W, py = 1000 + r() * 150; cloverLeaf(fx, px, py, 46 + r() * 26, (r() - .5) * .8, .5, i % 2 ? C.far : '#a9d09a', C.farL, i, { noLine: true }); }
  x.filter = 'blur(4px)'; x.drawImage(far, 0, 0); x.filter = 'none';
  const hz = x.createLinearGradient(0, 800, 0, 1200); hz.addColorStop(0, 'rgba(233,241,223,.0)'); hz.addColorStop(1, 'rgba(233,241,223,.18)'); x.fillStyle = hz; x.fillRect(0, 800, W, 400);
  // everything nearer goes on its own layer (the tall flowers stand between the two)
  TX.sky = c; const c2 = Pilot.canvas(W, H); x = c2.getContext('2d');
  // ground (its top edge hides under the mid clover band)
  x.fillStyle = '#86bf76'; x.fillRect(0, 1170, W, H - 1170); x.save(); x.beginPath(); x.rect(0, 1170, W, H - 1170); x.clip(); x.globalAlpha = .45; x.drawImage(TX.bloom, 0, 0); x.restore();
  // mid clover band behind the cloth
  for (let i = 0; i < 14; i++) blade(x, r() * W, 1300, 140 + r() * 200, (r() - .5) * 80, 20, C.blade, C.bladeL);
  for (let row = 0; row < 3; row++) for (let i = 0; i < 11; i++) { const px = -60 + i * 112 + r() * 40 + row * 50, py = 1010 + row * 90 + r() * 50; cloverLeaf(x, px, py, 78 + r() * 34 + row * 12, (r() - .5) * .9, .5 + r() * .15, (i + row) % 3 ? C.mid : C.deep, C.midL, 40 + i + row * 20); }
  // the picnic cloth (pale gingham in perspective)
  const q = [[150, 1330], [1000, 1310], [1100, 1660], [20, 1700]];
  const cp = smooth(rough(q, 6, 7, 18));
  wash(x, cp, C.cloth, C.clothL, { bloom: .3, line: C.clothL, lw: 2.2, ew: 10, pool: .35 });
  x.save(); x.clip(cp); x.strokeStyle = 'rgba(140,185,212,.55)'; x.lineWidth = 7;
  for (let i = 0; i <= 14; i++) { const u = i / 14; x.beginPath(); x.moveTo(lerp(q[0][0], q[1][0], u), lerp(q[0][1], q[1][1], u)); x.lineTo(lerp(q[3][0], q[2][0], u), lerp(q[3][1], q[2][1], u)); x.stroke(); }
  for (let j = 0; j <= 9; j++) { const v = Math.pow(j / 9, 1.25); x.lineWidth = 5 + v * 5; x.beginPath(); x.moveTo(lerp(q[0][0], q[3][0], v), lerp(q[0][1], q[3][1], v)); x.lineTo(lerp(q[1][0], q[2][0], v), lerp(q[1][1], q[2][1], v)); x.stroke(); }
  x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 2; for (let j = 0; j < 9; j++) { const v = Math.pow((j + .5) / 9, 1.25); x.beginPath(); x.moveTo(lerp(q[0][0], q[3][0], v), lerp(q[0][1], q[3][1], v) + 4); x.lineTo(lerp(q[1][0], q[2][0], v), lerp(q[1][1], q[2][1], v) + 4); x.stroke(); }
  x.restore();
  // a soft shade along the cloth's far edge (leaves overhang it)
  x.save(); x.clip(cp); const sh = x.createLinearGradient(0, 1300, 0, 1400); sh.addColorStop(0, 'rgba(60,110,90,.25)'); sh.addColorStop(1, 'rgba(60,110,90,0)'); x.fillStyle = sh; x.fillRect(0, 1290, W, 120); x.restore();
  // clover tufts overlapping the cloth's back edge
  for (let i = 0; i < 9; i++) { const px = 120 + i * 110 + r() * 40, py = 1330 + r() * 20; cloverLeaf(x, px, py, 46 + r() * 20, (r() - .5) * .7, .5, C.mid, C.midL, 80 + i); }
  return c2;
}

// ---------------- the hamster ----------------
const V = 84, T1 = 1.9, DEC = .7, STRIDE = 26, CYC = 52;
const walkX = t => { if (t < T1) return V * t; const u = Math.min(t - T1, DEC); return V * T1 + V * u - V * u * u / (2 * DEC); };
const speed = t => t < T1 ? 1 : Math.max(0, 1 - (t - T1) / DEC);
const rot = (p, a, o) => { const c = Math.cos(a), s = Math.sin(a), x = p[0] - o[0], y = p[1] - o[1]; return [o[0] + x * c - y * s, o[1] + x * s + y * c]; };
function footAt(u, s) { if (u < .5) return [s / 2 - s * (u / .5), 0]; const w = (u - .5) / .5, e = w * w * (3 - 2 * w); return [-s / 2 + s * e, -9 * Math.sin(Math.PI * w)]; }
function pose(t) {
  const X = walkX(t), ph = X / CYC, sp = speed(t);
  const sag = ss(2.6, 3.0, t) * (1 - ss(3.3, 3.8, t)), look = eio((t - 3.2) / .6), relief = eo((t - 4.4) / .6);
  const bob = Math.abs(Math.sin(ph * TAU)) * 4 * sp;
  const waddle = Math.sin(ph * TAU) * .06 * sp;
  const lean = .16 + sag * .05 - look * .05 - relief * .12 + waddle;
  const head = -.22 - sag * .1 + look * .5 + relief * .02;
  const breath = 1 + .015 * Math.sin((t - 4.4) * 3) * ss(4.7, 5.2, t);
  return { X, ph, sp, bob, lean, head, look, relief, breath };
}
function basketPos(t, P) {
  const onBack = pp => { const c = rot([-46, -96 - pp.bob], pp.lean, [0, -20]); return { x: c[0], y: c[1], r: pp.lean * .9 - .1, land: 0 }; };
  if (t < 3.95) return onBack(P);
  const a = onBack(pose(3.95));
  if (t < 4.15) { const u = eio((t - 3.95) / .2); return { x: a.x - 8 * u, y: a.y + 14 * u, r: a.r - .14 * u, land: 0 }; }
  const s0 = { x: a.x - 8, y: a.y + 14, r: a.r - .14 }, end = { x: -112, y: -44, r: -.08 };
  if (t < 4.4) { const u = (t - 4.15) / .25; return { x: lerp(s0.x, end.x, u), y: lerp(s0.y, end.y, u * u), r: lerp(s0.r, end.r, u), land: 0 }; }
  const k = t - 4.4; return { x: end.x, y: end.y - Math.abs(Math.sin(k * 18)) * 8 * Math.exp(-k * 9), r: end.r + Math.sin(k * 14) * .05 * Math.exp(-k * 6), land: k };
}
function drawBasket(x, b) {
  x.save(); x.translate(b.x, b.y); x.rotate(b.r);
  // flowers peeking out of the top (one tumbles out on landing — drawn by the scene)
  for (const [fx, fy, s] of [[-22, -50, .9], [10, -56, 1], [34, -46, .8]]) { x.strokeStyle = C.stem; x.lineWidth = 4; x.beginPath(); x.moveTo(fx, fy + 30); x.lineTo(fx, fy); x.stroke(); x.drawImage(TX.flowerS, fx - 22 * s, fy - 22 * s, 44 * s, 44 * s); }
  const body = smooth(rough([[-52, -36], [52, -36], [46, 40], [-46, 40]], 2, 31, 8));
  x.fillStyle = C.wick; x.fill(body);
  x.save(); x.clip(body);
  x.strokeStyle = C.wickD; x.lineWidth = 4;
  for (let yy = -30; yy < 44; yy += 12) { x.beginPath(); for (let xx = -56; xx < 56; xx += 14) { x.moveTo(xx, yy); x.quadraticCurveTo(xx + 7, yy + ((xx / 14 | 0) % 2 ? 5 : -5), xx + 14, yy); } x.stroke(); }
  x.fillStyle = 'rgba(150,100,50,.28)'; x.fillRect(10, -40, 50, 90);
  x.restore();
  x.strokeStyle = C.wickL; x.lineWidth = 2; x.globalAlpha = .8; x.setLineDash([30, 4, 18, 3]); x.stroke(body); x.setLineDash([]); x.globalAlpha = 1;
  x.fillStyle = C.wickD; x.beginPath(); x.ellipse(0, -36, 56, 9, 0, 0, TAU); x.fill(); x.strokeStyle = C.wickL; x.lineWidth = 2; x.stroke();
  x.restore();
}
function drawHamster(x, t) {
  const P = pose(t), cen = [0, -20], R = p => rot(p, P.lean, cen);
  const uA = ((P.ph % 1) + 1) % 1, uB = (uA + .5) % 1;
  const foot = (u, near) => { const f = footAt(u, STRIDE * P.sp); x.fillStyle = near ? C.pink : '#e9a49d'; x.beginPath(); x.ellipse(f[0] + (near ? 14 : -10), f[1] - 5, 12, 7, 0, 0, TAU); x.fill(); };
  foot(uB, false);
  const bp = basketPos(t, P); if (t < 4.15) drawBasket(x, bp);
  x.save(); x.translate(0, -P.bob);
  // round body (watercolour: base, warm back, white belly; pooled edge by a soft gradient), pencil contour
  const body = smooth(rough(ellPts(0, -58, 60, 54 * P.breath, 24).map(R), 1.4, 3, 7));
  x.fillStyle = C.ham; x.fill(body);
  x.save(); x.clip(body);
  const bel = R([22, -34]); x.fillStyle = C.belly; x.beginPath(); x.ellipse(bel[0], bel[1], 40, 32, P.lean - .3, 0, TAU); x.fill();
  const g = x.createRadialGradient(-10, -80, 10, 0, -58, 70); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.75, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(200,120,70,.4)'); x.fillStyle = g; x.fillRect(-80, -130, 160, 140);
  x.globalAlpha = .4; x.drawImage(TX.bloom, -300, -400); x.restore();
  x.strokeStyle = C.hamL; x.lineWidth = 2.2; x.globalAlpha = .8; x.setLineDash([40, 4, 26, 3]); x.stroke(body); x.setLineDash([]); x.globalAlpha = 1;
  // straps
  if (t < 4.15) { const sl = ss(3.9, 4.12, t), a = R([-34 - sl * 10, -104 + sl * 20]), b = R([14, -100 + sl * 14]), c2 = R([36 - sl * 6, -52 + sl * 18]);
    x.strokeStyle = C.strap; x.lineWidth = 8; x.lineCap = 'round'; x.beginPath(); x.moveTo(a[0], a[1]); x.quadraticCurveTo(b[0], b[1], c2[0], c2[1]); x.stroke(); }

    x.strokeStyle = C.hamL; x.lineWidth = 1.8; x.globalAlpha = .7; x.beginPath(); x.ellipse(ex, ey, 13, 12, 0, Math.PI * 1.05, Math.PI * 1.95); x.stroke(); x.globalAlpha = 1; }
  x.fillStyle = C.belly; x.beginPath(); x.ellipse(22, 8, 20, 16, 0, 0, TAU); x.fill();   // white muzzle/cheek
  x.fillStyle = C.nose; x.beginPath(); x.ellipse(38, 2, 5, 4, 0, 0, TAU); x.fill();
  const op = clamp(.2 + P.look * .8);

  if (op > .6) { x.fillStyle = '#fff'; x.beginPath(); x.arc(15.5, -14, 1.5, 0, TAU); x.fill(); }
  else { x.strokeStyle = '#3b2c26'; x.lineWidth = 2; x.beginPath(); x.arc(14, -14, 5, .3, Math.PI - .3); x.stroke(); }
  x.fillStyle = C.pink; x.globalAlpha = .6; x.beginPath(); x.ellipse(4, 6, 9, 6, 0, 0, TAU); x.fill(); x.globalAlpha = 1;
  x.strokeStyle = '#a2786a'; x.lineWidth = 1.4; for (const k of [-1, 0, 1]) { x.beginPath(); x.moveTo(34, 8 + k * 3); x.lineTo(54, 6 + k * 7); x.stroke(); }   // whiskers
  x.restore();
  // tiny front paw on the strap → hanging
  const rel = ss(3.75, 4.1, t), paw = R([lerp(40, 44, rel), lerp(-56, -22, rel)]);
  x.fillStyle = C.pink; x.beginPath(); x.ellipse(paw[0], paw[1], 8, 6.5, 0, 0, TAU); x.fill();
  x.restore();
  foot(uA, true);
  if (t >= 4.15) drawBasket(x, bp);
  return P;
}

// ---------------- frame ----------------
const FX = {}, FB = { w: 1000, h: 640, ox: 560, oy: 560 };
const PLATE = /[?&]plate=1/.test(location.search);
function draw(ctx, t) {
  { const m = location.search.match(/[?&]plate=leaf(\d+)/); if (m) { ctx.clearRect(0, 0, W, H); const l = FX.fore[+m[1]]; ctx.save(); ctx.translate(l.x, l.y); ctx.drawImage(l.c, -l.c.px, -l.c.py); ctx.restore(); return; } }
  if (/[?&]plate=fore/.test(location.search)) { ctx.clearRect(0, 0, W, H); for (const l of FX.fore) { ctx.save(); ctx.translate(l.x, l.y); ctx.drawImage(l.c, -l.c.px, -l.c.py); ctx.restore(); } for (const b of FX.blades) blade(ctx, b.x, b.y, b.h, b.bend, b.w, b.c, C.bladeL); return; }   // mask for the key-art version
  ctx.drawImage(TX.sky, 0, 0);
  if (PLATE) { for (const f of FX.tall) { ctx.save(); ctx.translate(f.x, f.base); ctx.strokeStyle = C.stem; ctx.lineWidth = f.w; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(f.bend, -f.h * .5, 0, -f.h); ctx.stroke(); ctx.drawImage(f.c, -f.c.width / 2, -f.h - f.c.height / 2); ctx.restore(); }
    ctx.drawImage(TX.back, 0, 0); for (const l of FX.fore) { ctx.save(); ctx.translate(l.x, l.y); ctx.drawImage(l.c, -l.c.px, -l.c.py); ctx.restore(); } for (const b of FX.blades) blade(ctx, b.x, b.y, b.h, b.bend, b.w, b.c, C.bladeL); return; }
  const lit = ss(3.2, 3.9, t);
  // back flowers on stems that sway (tall white clover heads)
  for (const f of FX.tall) { const a = Math.sin(t * f.f + f.p) * .025; ctx.save(); ctx.translate(f.x, f.base); ctx.rotate(a);
    ctx.strokeStyle = C.stem; ctx.lineWidth = f.w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(f.bend, -f.h * .5, 0, -f.h); ctx.stroke();
    ctx.strokeStyle = C.bladeL; ctx.lineWidth = 1.4; ctx.globalAlpha = .5; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.drawImage(f.c, -f.c.width / 2, -f.h - f.c.height / 2); ctx.restore(); }
  ctx.drawImage(TX.back, 0, 0);
  // the warm sunbeam (accent): soft rays from the upper right down to the cloth ahead (prebuilt soft sprite)
  if (lit > 0) { ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = lit * (.9 + .1 * Math.sin(t * 1.7)); ctx.drawImage(TX.beam, 0, 0, W, H); ctx.globalAlpha = 1;
    for (const ry of []) { const a = lit * ry.a * 1.8 * (.8 + .2 * Math.sin(t * ry.f + ry.p)); const g = ctx.createLinearGradient(ry.x0, -100, SUN.x + ry.dx, SUN.y);
      g.addColorStop(0, `rgba(255,226,150,${a})`); g.addColorStop(1, 'rgba(255,226,150,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(ry.x0 - ry.w, -100); ctx.lineTo(ry.x0 + ry.w, -100); ctx.lineTo(SUN.x + ry.dx + ry.w * .4, SUN.y); ctx.lineTo(SUN.x + ry.dx - ry.w * .4, SUN.y); ctx.fill(); }
    const sg = ctx.createRadialGradient(SUN.x, SUN.y, 10, SUN.x, SUN.y, 300); sg.addColorStop(0, `rgba(255,230,160,${1 * lit})`); sg.addColorStop(.4, `rgba(255,226,150,${.35 * lit})`); sg.addColorStop(1, 'rgba(255,226,150,0)');
    ctx.fillStyle = sg; ctx.save(); ctx.translate(SUN.x, SUN.y); ctx.scale(1, .45); ctx.translate(-SUN.x, -SUN.y); ctx.fillRect(SUN.x - 300, SUN.y - 300, 600, 600); ctx.restore();
    ctx.restore(); }
  // the hamster
  const fb = FB.x; fb.setTransform(1, 0, 0, 1, 0, 0); fb.clearRect(0, 0, FB.w, FB.h); fb.translate(FB.ox, FB.oy); fb.scale(FS, FS);
  const P = drawHamster(fb, t); const hx = X0 + P.X * FS;
  ctx.save(); ctx.fillStyle = 'rgba(70,110,130,.2)'; ctx.beginPath(); ctx.ellipse(hx - 4, GY + 2, 78, 13, 0, 0, TAU); ctx.fill();
  if (t >= 4.4) { ctx.beginPath(); ctx.ellipse(hx - 112 * FS, GY + 2, 70, 11, 0, 0, TAU); ctx.fill(); } ctx.restore();
  ctx.drawImage(FB.c, hx - FB.ox, GY - FB.oy);
  // a flower tumbles out of the basket when it lands
  if (t > 4.4) { const k = clamp((t - 4.4) / .55), bx = hx - 112 * FS + 40 + k * 70, by = GY - 120 * FS + k * 120 * FS - Math.sin(k * Math.PI) * 60;
    ctx.save(); ctx.translate(bx, by); ctx.rotate(k * 2.6); ctx.strokeStyle = C.stem; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.stroke(); ctx.drawImage(TX.flowerS, -26, -26, 52, 52); ctx.restore(); }
  // light motes drifting in the beam
  if (lit > 0) for (const m of FX.motes) { const u = ((t * m.v + m.p) % 1), px = lerp(m.x0, SUN.x + m.dx, u) + Math.sin(t * 1.3 + m.p * 9) * 10, py = lerp(200, SUN.y - 40, u);
    ctx.fillStyle = `rgba(255,244,205,${lit * m.a * Math.sin(Math.PI * u)})`; ctx.beginPath(); ctx.arc(px, py, m.s, 0, TAU); ctx.fill(); }
  // foreground: big clover leaves, swaying from their stems; grass blades; the ladybug on its leaf
  for (const l of FX.fore) { ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(Math.sin(t * l.f + l.p) * l.amp); ctx.drawImage(l.c, -l.c.px, -l.c.py); ctx.restore(); }
  ctx.save(); for (const b of FX.blades) { const sw = Math.sin(t * b.f + b.p) * b.h * .04; blade(ctx, b.x, b.y, b.h, b.bend + sw, b.w, b.c, C.bladeL); } ctx.restore();
  drawLadybug(ctx, t);
  for (const [vx, vy, vs] of FX.violets) { ctx.save(); ctx.translate(vx, vy); ctx.rotate(Math.sin(t * 1.1 + vx) * .05); ctx.scale(vs, vs);
    for (let i = 0; i < 5; i++) { ctx.save(); ctx.rotate(i / 5 * TAU); const p = new Path2D(); p.ellipse(0, -24, 19, 24, 0, 0, TAU); ctx.fillStyle = '#b4b9ec'; ctx.fill(p); ctx.strokeStyle = '#7f86c9'; ctx.lineWidth = 2; ctx.globalAlpha = .7; ctx.stroke(p); ctx.restore(); }
    ctx.fillStyle = '#fff'; for (let i = 0; i < 5; i++) { ctx.save(); ctx.rotate(i / 5 * TAU); ctx.fillRect(-1.5, -18, 3, 14); ctx.restore(); } ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill(); ctx.restore(); }
  // warm wash over the whole page once the sun is out, then paper
  if (lit > 0) { ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = `rgba(255,214,150,${.28 * lit})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .07; ctx.drawImage(TX.paperM, 0, 0); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = .38; ctx.drawImage(TX.paper, 0, 0); ctx.restore();
  Story.captions(ctx, t, S.lines, { font: "'Hi Melody',sans-serif", weight: 400, size: 78, color: C.ink, y: 410, shadow: 'rgba(250,252,244,.95)', shadowBlur: 18 });
}
function drawLadybug(ctx, t) {
  // walks slowly along the upper edge of the big front-right leaf
  const L = FX.lb, u = .15 + .5 * ((t / 6) % 1) * 0 + t * .045, ang = L.a0 + u * 1.2;
  const x = L.cx + Math.cos(ang) * L.rx, y = L.cy + Math.sin(ang) * L.ry, dir = Math.atan2(Math.cos(ang) * L.ry, -Math.sin(ang) * L.rx);
  ctx.save(); ctx.translate(x, y); ctx.rotate(dir); ctx.scale(1.5, 1.5);
  ctx.strokeStyle = C.ladyD; ctx.lineWidth = 2;
  for (let i = -1; i <= 1; i++) for (const s of [-1, 1]) { const st = Math.sin(t * 14 + i * 2 + (s > 0 ? Math.PI : 0)) * 3; ctx.beginPath(); ctx.moveTo(i * 7, s * 8); ctx.lineTo(i * 7 + st, s * 16); ctx.stroke(); }
  ctx.fillStyle = C.ladyD; ctx.beginPath(); ctx.ellipse(16, 0, 8, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = C.lady; ctx.beginPath(); ctx.ellipse(-2, 0, 18, 15, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#a63a2c'; ctx.lineWidth = 1.6; ctx.stroke(); ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-20, 0); ctx.stroke();
  ctx.fillStyle = '#fff6ec'; for (const [dx, dy] of [[6, -7], [6, 7], [-6, -9], [-6, 9], [-14, -4], [-14, 4]]) { ctx.beginPath(); ctx.arc(dx, dy, 2.6, 0, TAU); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(2, -6, 6, 3, -.3, 0, TAU); ctx.fill();
  ctx.restore();
}
async function init() {
  TX.bloom = bloomTexture(W, H, 3); TX.paper = paperTexture(W, H, 9);
  TX.paperM = Pilot.canvas(W, H); { const x = TX.paperM.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.globalAlpha = .9; x.drawImage(TX.paper, 0, 0); }
  TX.flowerS = flowerSprite(40, 77);
  TX.back = buildBack();
  const r = rng(29);
  FX.tall = [[150, 1150, 480, 84, 8], [420, 1150, 300, 62, 7], [860, 1150, 560, 88, 8], [1010, 1160, 360, 66, 7], [650, 1170, 230, 52, 6]].map(([x, base, h, rr, w], i) => ({ x, base, h, w, c: flowerSprite(rr, i * 5 + 3), f: .6 + r() * .5, p: r() * TAU, bend: (r() - .5) * 40 }));
  FX.fore = [];
  for (const [x, y, s, tilt, col, sh, amp] of [[60, 1940, 170, .78, C.near, 300, .02], [330, 1960, 140, .7, C.deep, 260, .025], [600, 1980, 120, .7, C.near, 230, .03], [930, 1900, 190, .75, C.near, 260, .015],
    [-10, 1660, 140, .62, C.mid, 300, .03], [1060, 1600, 130, .6, C.deep, 320, .03], [-30, 1400, 120, .6, C.deep, 160, .03], [1090, 1330, 115, .58, C.mid, 140, .03], [770, 1820, 90, .6, C.mid, 130, .035], [200, 1760, 95, .65, C.mid, 150, .03]])
    FX.fore.push({ c: cloverSprite(s, tilt, col, C.nearL, Math.round(x + y), sh, C.stem), x, y, f: .7 + r() * .6, p: r() * TAU, amp });

  FX.fore[3].amp = .004;
  FX.lb = { cx: 930, cy: 1900 - 260 - 10, rx: 160, ry: 110, a0: -2.6 };
  FX.violets = [[180, 1820, 1], [330, 1880, .8], [1000, 1840, .9]];
  FX.blades = []; for (let i = 0; i < 10; i++) { const x = r() * W, y = 1760 + r() * 220; FX.blades.push({ x, y, h: 140 + r() * 200, bend: (r() - .5) * 160, w: 16 + r() * 10, c: r() < .5 ? C.blade : '#7cbd6c', f: .8 + r(), p: r() * TAU }); }
  FX.rays = []; for (let i = 0; i < 6; i++) FX.rays.push({ x0: 980 + i * 60, dx: (i - 2.5) * 70, w: 50 + r() * 70, a: .14 + r() * .12, f: .6 + r(), p: r() * TAU });
  FX.motes = []; for (let i = 0; i < 26; i++) FX.motes.push({ x0: 900 + r() * 300, dx: (r() - .5) * 300, v: .05 + r() * .08, p: r(), s: 2 + r() * 3, a: .5 + r() * .5 });
  FB.c = Pilot.canvas(FB.w, FB.h); FB.x = FB.c.getContext('2d');
  { const q = 4, c = Pilot.canvas(W / q, H / q), x = c.getContext('2d'); x.scale(1 / q, 1 / q);
    for (const ry of FX.rays) { const g = x.createLinearGradient(ry.x0, -100, SUN.x + ry.dx, SUN.y); g.addColorStop(0, `rgba(255,226,150,${ry.a * 2.6})`); g.addColorStop(.7, `rgba(255,226,150,${ry.a * 1.6})`); g.addColorStop(1, 'rgba(255,226,150,0)');
      x.fillStyle = g; x.beginPath(); x.moveTo(ry.x0 - ry.w, -100); x.lineTo(ry.x0 + ry.w, -100); x.lineTo(SUN.x + ry.dx + ry.w * .5, SUN.y); x.lineTo(SUN.x + ry.dx - ry.w * .5, SUN.y); x.fill(); }
    const c2 = Pilot.canvas(W / q, H / q), x2 = c2.getContext('2d'); x2.filter = 'blur(6px)'; x2.drawImage(c, 0, 0); TX.beam = c2; }
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 78px 'Hi Melody'"], init, draw });
