<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스타일 실험 · 10 파스텔 색연필 (키 아트)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap">
</head>
<body>
<script src="lib.js"></script><script src="story.js"></script><script src="source.js"></script><script src="script.js"></script>
<script>
/* 10 key-art version. Background: an image-model coloured-pencil repaint of lab-pastelbook's code layout (?plate=1),
   registered back (plate.py); the two high clouds are lifted off it with the code's own cloud masks (?plate=cloud2/3)
   and the sky under them filled, so they can drift. The cottage windows (614,903) and (821,901) and the chimney top
   (663,745) were measured on the painting. Character: one keyed model sheet (two walking drawings with the crate, one
   upright looking-up drawing, the crate alone). Code: a bouncy walk on twos (the two drawings alternate per step with
   a hop), the stop and sag, the look-up as a key swap (upright drawing + crate layer + a code strap), the crate
   slipping off with a squash and pencil dust curls; window light, chimney smoke, a butterfly, paper grain, caption. */
const S = window.SCRIPT, { clamp, lerp, ss, eo, eio, rng, noise } = Pilot;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const X0 = 230, SC = .56;
const pathY = x => 1594 - .19 * (x - 75);        // centre line of the near path segment on the painting
const WINS = [[614, 903, 32, 31], [821, 901, 26, 31]], CHIM = [663, 742];
const D = { walk1: [255, 585], walk2: [254, 581], stand: [164, 536], load: [173, 326] };
const IMG = {};
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => { const c = Pilot.canvas(i.naturalWidth, i.naturalHeight); c.getContext('2d').drawImage(i, 0, 0); ok(c); }; i.onerror = no; i.src = src; });
const t12 = t => Math.floor(t * 12 + 1e-6) / 12;

const V = 58, T1 = 1.9, DEC = .7, STEP = 1 / 3;
const walkX = t => { if (t < T1) return V * t; const u = Math.min(t - T1, DEC); return V * T1 + V * u - V * u * u / (2 * DEC); };
const speed = t => t < T1 ? 1 : Math.max(0, 1 - (t - T1) / DEC);
function pose(t) {
  const sp = speed(t), k = Math.min(t, 2.55) / STEP, step = Math.floor(k), u = k - step;
  return { X: walkX(t), sp, frame: step % 2 ? 'walk2' : 'walk1', hop: -Math.sin(Math.PI * u) * 12 * sp, sq: Math.exp(-u * 8) * sp,
    sag: ss(2.6, 3.0, t) * (1 - ss(3.2, 3.3, t)), up: t >= 3.2, settle: t >= 3.2 ? 1 - Math.exp(-(t - 3.2) * 9) * Math.cos((t - 3.2) * 16) : 0,
    breath: Math.sin((t - 4.4) * 2.8) * ss(4.8, 5.3, t) };
}
function cratePos(t, P) {
  const back = { x: -96, y: -98, r: -.06 };
  if (t < 3.95) return { ...back, y: back.y + (P.up ? (1 - P.settle) * 10 : 0), g: 0 };
  if (t < 4.15) { const u = eio((t - 3.95) / .2); return { x: back.x - 10 * u, y: back.y + 26 * u, r: back.r - .14 * u, g: 0 }; }
  const s0 = { x: back.x - 10, y: back.y + 26, r: back.r - .14 }, end = { x: -190, y: 34, r: 0 };
  if (t < 4.4) { const u = (t - 4.15) / .25; return { x: lerp(s0.x, end.x, u), y: lerp(s0.y, end.y, u * u), r: lerp(s0.r, end.r, u), g: 0 }; }
  const k = t - 4.4; return { ...end, g: 1, sq: 1 - .16 * Math.exp(-k * 10) * Math.cos(k * 28) };
}
function piece(x, name, sx, sy, rot = 0, kx = 1, ky = 1) { const [ax, ay] = D[name]; x.save(); x.translate(sx, sy); x.rotate(rot); x.scale(SC * kx, SC * ky); x.drawImage(IMG[name], -ax, -ay); x.restore(); }
function drawCrate(x, c) { x.save(); x.translate(c.x, c.y); x.rotate(c.r); if (c.g) x.scale(2 - c.sq, c.sq); x.scale(SC, SC); x.drawImage(IMG.load, -D.load[0], -D.load[1]); x.restore(); }
function drawBear(x, t) {
  const P = pose(t);
  if (!P.up) { piece(x, P.frame, 0, P.hop + P.sag * 5, P.sag * .04, 1 + P.sq * .03, 1 - P.sq * .05); return P; }
  const c = cratePos(t, P), ky = (1 + .05 * (1 - P.settle)) * (1 + .012 * P.breath), kx = 1 - .03 * (1 - P.settle);
  const stretch = t > 4.4 ? Math.sin(clamp((t - 4.45) / .55) * Math.PI) * .05 : 0;
  if (t < 4.15) drawCrate(x, c);
  piece(x, 'stand', 0, 0, 0, kx - stretch * .3, ky + stretch);
  if (t < 4.15) { const sl = ss(3.9, 4.12, t); x.save(); x.lineCap = 'round';
    for (const [col, w] of [['#8f6443', 11], ['#a8754f', 7]]) { x.strokeStyle = col; x.lineWidth = w; x.beginPath();
      x.moveTo(c.x + 92 - sl * 10, c.y - 70 + sl * 20); x.quadraticCurveTo(4, -172 * ky + sl * 20, 40 - sl * 12, -96 * ky + sl * 30); x.stroke(); }
    x.restore(); }
  if (t >= 4.15) drawCrate(x, c);
  return P;
}
const FX = {}, FB = { w: 760, h: 520, ox: 440, oy: 470 };
function draw(ctx, t) {
  ctx.drawImage(IMG.base, 0, 0, W, H);
  ctx.drawImage(IMG.cloud2, 54 + t * 4, 147); ctx.drawImage(IMG.cloud3, 732 + t * 3, 85);
  // window light (accent): warm the painted panes, soft glow, picture-book glow ticks
  const lit = ss(3.2, 3.7, t) * (1 + .03 * Math.sin(t * 7));
  if (lit > 0) { ctx.save();
    for (const [x, y, w, h] of WINS) { ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = `rgba(255,190,80,${.85 * lit})`; ctx.fillRect(x - w / 2 + 3, y - h / 2 + 3, w - 6, h - 6);
      ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(255,226,150,${lit})`; ctx.fillRect(x - w / 2 + 3, y - h / 2 + 3, w - 6, h - 6);
      ctx.globalCompositeOperation = 'screen'; const g = ctx.createRadialGradient(x, y, 4, x, y, 120); g.addColorStop(0, `rgba(255,214,120,${.55 * lit})`); g.addColorStop(.4, `rgba(255,200,120,${.16 * lit})`); g.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = g; ctx.fillRect(x - 120, y - 120, 240, 240); }
    ctx.restore();
    if (lit > .5) { ctx.save(); ctx.strokeStyle = `rgba(232,170,80,${(lit - .5) * 1.6})`; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; const tw = t12(t), [x, y] = WINS[1];
      for (let i = 0; i < 5; i++) { const a = -Math.PI * (.12 + i * .19), r0 = 30 + (i % 2) * 6 + Math.sin(tw * 5 + i) * 2; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); ctx.lineTo(x + Math.cos(a) * (r0 + 12), y + Math.sin(a) * (r0 + 12)); ctx.stroke(); }
      ctx.restore(); } }
  for (let i = 0; i < 6; i++) { const age = t - 3.4 - i * .5; if (age < 0) continue; const k = (age % 3) / 3; if (Math.floor(age / 3) > 0 && t > 5.4) continue;
    const px = CHIM[0] + Math.sin(k * 5 + i) * 10 + k * 40, py = CHIM[1] - k * 170, rr = 9 + k * 20, a = Math.sin(Math.PI * Math.min(1, k * 1.3)) * .9;
    ctx.save(); ctx.globalAlpha = a; ctx.drawImage(FX.puff, px - rr, py - rr, rr * 2, rr * 2); ctx.restore(); }
  // the bear (body on twos)
  const tb = t12(t), fb = FB.x; fb.setTransform(1, 0, 0, 1, 0, 0); fb.clearRect(0, 0, FB.w, FB.h); fb.translate(FB.ox, FB.oy);
  const bx = X0 + walkX(tb), gy = pathY(bx);
  const P = drawBear(fb, tb);
  ctx.save(); ctx.fillStyle = 'rgba(150,130,80,.2)'; ctx.beginPath(); ctx.ellipse(bx - 6, gy + 2, 78, 13, -.18, 0, TAU); ctx.fill();
  if (tb >= 4.4) { ctx.beginPath(); ctx.ellipse(bx - 186, gy + 36, 100, 13, -.18, 0, TAU); ctx.fill(); } ctx.restore();
  ctx.drawImage(FB.c, bx - FB.ox, gy - FB.oy);
  if (t >= 4.4 && t < 5.3) { const k = (tb - 4.4) / .9, cx = bx - 190, cy = gy + 30; ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#c9b88a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const s of [-1, 1]) for (let i = 0; i < 3; i++) { const px = cx + s * (100 + k * 60 + i * 16), py = cy - 8 - i * 10 - k * 14; ctx.beginPath(); ctx.arc(px, py, 7 + i * 2, s > 0 ? Math.PI : 0, s > 0 ? Math.PI * 2.4 : Math.PI * 1.4, s < 0); ctx.stroke(); }
    if (k < .4) for (let i = 0; i < 3; i++) { const a = -Math.PI / 2 + (i - 1) * .5; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 120, cy - 200 + Math.sin(a) * 30); ctx.lineTo(cx + Math.cos(a) * 140, cy - 212 + Math.sin(a) * 40); ctx.stroke(); }
    ctx.restore(); }
  if (t > 4.6 && t < 5.6) { const k = tb - 4.6; ctx.save(); ctx.globalAlpha = Math.sin(Math.PI * clamp(k)) * .9; ctx.drawImage(FX.puff, bx + 84 + k * 30, gy - 300 - k * 16, 34 + k * 16, 34 + k * 16); ctx.restore(); }
  drawButterfly(ctx, t);
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = .35; ctx.drawImage(FX.paper, 0, 0); ctx.restore();
  Story.captions(ctx, t, S.lines, { font: "'Gamja Flower',sans-serif", weight: 400, size: 76, color: '#8a6450', y: 400, shadow: 'rgba(255,255,250,.95)', shadowBlur: 16 });
}
function drawButterfly(ctx, t) {
  const x = 300 + Math.sin(t * .7) * 120 + t * 20, y = 1250 + Math.sin(t * 1.3) * 50 - t * 10, flap = Math.abs(Math.sin(t12(t) * 14));
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * .7) * .3); ctx.fillStyle = '#f9dd86'; ctx.strokeStyle = '#c9a060'; ctx.lineWidth = 1.6;
  for (const s of [-1, 1]) { ctx.save(); ctx.scale(s * (.35 + .65 * flap), 1); ctx.beginPath(); ctx.ellipse(9, -6, 9, 8, -.4, 0, TAU); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(7, 7, 6, 5, .4, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore(); }
  ctx.strokeStyle = '#8a6450'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, 9); ctx.stroke(); ctx.restore();
}
async function init() {
  const names = ['base', 'cloud2', 'cloud3', 'walk1', 'walk2', 'stand', 'load'];
  (await Promise.all(names.map(n => loadImg(`art/lab-pastelbook-${n}.webp`)))).forEach((c, i) => IMG[names[i]] = c);
  FB.c = Pilot.canvas(FB.w, FB.h); FB.x = FB.c.getContext('2d');
  // smoke puff: a soft pencil-outlined cloudlet (code-drawn, like the picture's clouds)
  FX.puff = Pilot.canvas(120, 120); { const x = FX.puff.getContext('2d'), p = new Path2D(); for (const [cx, cy, r] of [[60, 66, 30], [40, 72, 22], [80, 72, 22], [60, 46, 22]]) p.arc(cx, cy, r, 0, TAU), p.moveTo(cx + r + 30, cy);
    x.strokeStyle = '#c2b3a6'; x.lineWidth = 5; x.stroke(p); x.fillStyle = '#fbf8f2'; x.fill(p); }
  FX.paper = Pilot.canvas(W, H); { const x = FX.paper.getContext('2d'), d = x.createImageData(W, H), r = rng(7);
    for (let i = 0; i < W * H; i++) { const v = 128 + (r() - .5) * 40; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; } x.putImageData(d, 0, 0); }
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: ["400 76px 'Gamja Flower'"], init, draw });
</script>
<script>window.POSTER_T = 4.2;</script>
    <style>#pv-play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:rgba(0,0,0,.25);
    border:0;color:#fff;font:600 18px/1.4 system-ui,sans-serif;cursor:pointer}#pv-play span{display:flex;flex-direction:column;align-items:center;gap:10px}
    #pv-play b{display:flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.6);
    border:2px solid rgba(255,255,255,.85);font-size:34px;padding-left:6px;box-sizing:border-box}#pv-play[hidden]{display:none}</style>
    <button id="pv-play" type="button" hidden><span><b>▶</b>탭해서 재생 · 소리 켜기</span></button>

    if(!pp||!window.__ready)return setTimeout(w,100);o.hidden=false;o.onclick=function(){o.remove();pp.click();};})();</script>
