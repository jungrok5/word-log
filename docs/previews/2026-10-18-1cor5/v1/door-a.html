<script>
/* 문틈 — version A: Gothic charcoal drawing (after OPUSCAR look no. 13, "Rebecca": vine charcoal, eraser lifts, finger
   smudges, William Kentridge's animated drawings).
   The STYLE lives in kit-charcoal.js (house style `charcoal`, styles/charcoal/): value canvas → paper-tooth pass, the
   stick / vine / smudge / eraser marks, eraser-lifted light, fog bands, the red pastel, the end-card eraser wipe, captions.
   This file is the STORY only — the worked example of the kit:
   - a static hallway plate (built once at 1.36× so the slow push stays crisp) in a pinhole camera measured in metres,
     then per frame: the door leaf (perspective strips), the room light, the eraser-lifted wedge on the floor, the horned
     shadow (smudged, clipped to the light), fingers, fog bands, the foreground arch (parallax: it parts as we push in),
     the flood of darkness, the red doorposts, the warm thread of light, the beat timing (door-common.js).
   Pure function of t; seeded randomness only; heavy textures in init. */
const C = Charcoal;
const { clamp, lerp, ss, eo, eio, win, rng, noise, fbm, canvas } = Pilot;
const { sweep, vine, blob, fillA, arch } = C, polyS = C.poly, seg2 = C.seg;
const W = Pilot.W, H = Pilot.H, B = DOOR.beat, V = Pilot.ori === 'v';
const SC = H / 1920;
const F = 1150 * SC, CX = W / 2, CY = 902 * SC, EYE = 1.55, D = 5.0;   // camera: focal px, centre, eye height, door distance
const ZC = [CX, 1180 * SC];                                               // the push zooms about the middle of the door
const KP = 1.36;                                                          // plate resolution (crisp up to zoom 1.36)
const XL = 0.8, ZL = D + 3.0;                                             // the light in the room behind the door
const cam = C.persp({ F, cx: CX, cy: CY, eye: EYE });
const P = cam.P, segW = cam.seg, polyWorld = cam.poly;                    // world (m) → base screen (zoom 1)
const DOORW = 1.0, DOORH = 2.25;

let plate, fgA, leafTex, RED = [];

/* ------------------------------------------------------------------ the static hallway plate (kit marks, door geometry) */
function buildPlate() {
  const c = C.sheet(KP), x = c.getContext('2d'); let sd = 100;   // white paper, pre-scaled by KP
  const A = 1.15, WT = 3.4, VR = 1.3, ZN = 1.0, R0 = rng(4242);
  // --- vault (everything above the walls), very dark, sweeps following the curve of the bays
  x.fillStyle = 'rgba(0,0,255,.6)'; x.fillRect(-50, -50, W + 100, H + 100);
  const vaultPts = arch(A, WT, VR, 20);
  for (let k = 0; k < 46; k++) {
    const z = lerp(1.6, D, R0()), pts = vaultPts.map(p => P(p[0] * (.98 - R0() * .02), p[1] - R0() * .05, z));
    sweep(x, pts, F * .14 / z, .3 + R0() * .22, sd++);
  }
  // --- floor
  polyWorld(x, [[-A, 0, D], [A, 0, D], [A, 0, ZN], [-A, 0, ZN]]); fillA(x, .2);   // (lighten the vault base first)
  x.save(); polyWorld(x, [[-A, 0, D], [A, 0, D], [A, 0, ZN], [-A, 0, ZN]]); x.clip();
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.fillStyle = 'rgba(0,0,255,.42)'; x.fillRect(0, 0, W, H);
  const fy0 = P(0, 0, D)[1], fg = x.createLinearGradient(0, fy0, 0, H); fg.addColorStop(0, 'rgba(0,0,255,0)'); fg.addColorStop(1, 'rgba(0,0,255,.6)');
  x.fillStyle = fg; x.fillRect(0, fy0, W, H - fy0);
  for (let k = 0; k < 170; k++) {   // sweeps across the floor (horizontal in the floor plane)
    const z = lerp(1.4, D, Math.pow(R0(), .8)), x0 = lerp(-A, A, R0()), len = .3 + R0() * .9;
    sweep(x, segW([x0, 0, z], [x0 + len, 0, z + (R0() - .5) * .15], 6), F * .07 / z, .2 + R0() * .22, sd++);
  }
  for (let k = 0; k < 40; k++) { const xx = lerp(-A, A, R0()); sweep(x, segW([xx, 0, D], [xx, 0, 1.4], 10), F * .05 / 3, .08, sd++); }
  for (const xx of [-.92, -.46, 0, .46, .92]) vine(x, segW([xx, 0, D], [xx, 0, ZN], 40), 2.2, .55, sd++);
  const rows = [4.55, 4.1, 3.62, 3.15, 2.7, 2.27, 1.86, 1.5];
  rows.forEach((z, i) => { const p = segW([-A, 0, z], [A, 0, z], 30); vine(x, p, 2.8 * 3 / z, .6, sd++, '#000', .1);
    vine(x, p.map(q => [q[0], q[1] + 3 * 3 / z]), 1.4 * 3 / z, .16, sd++, '#fff', .3); });
  x.restore();
  // --- back wall (pointed top)
  const bw = [[-A, 0], [A, 0]].concat(arch(A, WT, VR, 20).reverse()).map(p => [p[0], p[1], D]);
  x.save(); polyWorld(x, bw); x.clip(); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.fillStyle = 'rgba(0,0,255,.34)'; x.fillRect(0, 0, W, H);
  for (let y = 0, row = 0; y < WT + 1.3; y += .3, row++) {    // stone courses
    vine(x, segW([-A, y, D], [A, y, D], 16), 1.5, .38, sd++, '#000', .12);
    for (let xx = -A + (row % 2) * .21; xx < A; xx += .42) vine(x, segW([xx, y, D], [xx, y + .3, D], 2), 1.3, .3, sd++, '#000', .2);
    sweep(x, segW([-A, y + .1, D], [A, y + .1, D], 10), F * .17 / D, .26 + R0() * .16, sd++); sweep(x, segW([-A, y + .21, D], [A, y + .2, D], 10), F * .12 / D, .2 + R0() * .14, sd++);
  }
  for (let k = 0; k < 14; k++) blob(x, lerp(P(-A, 0, D)[0], P(A, 0, D)[0], R0()), lerp(P(0, 4, D)[1], P(0, 0, D)[1], R0()), 60 + R0() * 80, 30 + R0() * 50, .12);
  x.restore();
  // --- side walls
  for (const sgn of [-1, 1]) {
    const wall = [[sgn * A, 0, D], [sgn * A, 0, ZN], [sgn * A, WT, ZN], [sgn * A, WT, D]];
    x.save(); polyWorld(x, wall); x.clip(); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.fillStyle = `rgba(0,0,255,${sgn < 0 ? .5 : .34})`; x.fillRect(0, 0, W, H);
    for (let y = 0; y < WT; y += .3) { vine(x, segW([sgn * A, y, D], [sgn * A, y, ZN], 30), 1.6, .32, sd++, '#000', .15);
      sweep(x, segW([sgn * A, y + .15, D], [sgn * A, y + .15, ZN + .6], 12), F * .2 / 3.4, .28 + R0() * .18, sd++); }
    for (const z of [3.85, 2.7]) {   // engaged shafts (the bay divisions)
      const p0 = P(sgn * A, 0, z), p1 = P(sgn * A, WT, z), p2 = P(sgn * A, 0, z + .16), p3 = P(sgn * A, WT, z + .16);
      polyS(x, [p0, p1, p3, p2]); fillA(x, .45);
      vine(x, [p0, p1], 2.2, .9, sd++); vine(x, seg2(p2, p3, 30), 1.8, .45, sd++, '#fff', .2);
    }
    for (let k = 0; k < 10; k++) { const z = lerp(2.2, D, R0()); blob(x, P(sgn * A, 0, z)[0], P(0, lerp(0, 3, R0()), z)[1], 50, 120, .14); }
    x.restore();
    // wall/floor and wall/vault junctions: dark accents
    sweep(x, segW([sgn * A, .02, D], [sgn * A, .02, ZN + .3], 16), 18, .5, sd++);
    sweep(x, segW([sgn * A, WT, D], [sgn * A, WT, ZN + .3], 16), 22, .55, sd++);
    vine(x, segW([sgn * A, 0, D], [sgn * A, WT, D], 12), 2.4, .8, sd++);
  }
  // --- vault ribs (transverse arch at 3.85, diagonal ribs, ridge), lifted on the moonlit side
  const ribs = [];
  ribs.push(arch(A, WT, VR, 20).map(p => P(p[0], p[1], 3.85)));
  ribs.push(arch(A, WT, VR, 20).map(p => P(p[0], p[1], D)));
  const vh = xx => { const pts = arch(A, WT, VR, 60); let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - xx) < Math.abs(best[0] - xx)) best = p; return best[1]; };
  for (const [z1, z2] of [[2.7, 3.85], [3.85, D]]) for (const s of [1, -1]) {
    const pts = []; for (let i = 0; i <= 24; i++) { const k = i / 24, xx = s * (-A + 2 * A * k); pts.push(P(xx, vh(xx), lerp(z1, z2, k))); } ribs.push(pts);
  }
  { const pts = []; for (let i = 0; i <= 20; i++) pts.push(P(0, WT + VR, lerp(1.6, D, i / 20))); ribs.push(pts); }
  for (const r of ribs) { sweep(x, r, 16, .55, sd++); vine(x, r, 2.4, .85, sd++); vine(x, r.map(p => [p[0] + 4, p[1] + 5]), 1.6, .3, sd++, '#fff', .25); }
  // --- moonlit lancet window on the left wall + its patch on the right wall + a faint beam
  const winPts = (xw, zc, hw, sill, spring, apex, n = 12) => {
    const L = []; for (let i = 0; i <= n; i++) { const k = i / n; L.push([xw, lerp(spring, apex, Math.sin(k * Math.PI / 2)), zc - hw + hw * (1 - Math.cos(k * Math.PI / 2))]); }
    const Rr = L.slice(0, -1).reverse().map(p => [xw, p[1], 2 * zc - p[2]]);
    return [[xw, sill, zc + hw], [xw, sill, zc - hw]].concat(L).concat(Rr);
  };
  const wl = winPts(-A, 4.35, .37, 1.45, 2.85, 3.3);
  x.save(); polyWorld(x, wl); x.fillStyle = 'rgba(255,255,255,.82)'; x.fill(); x.clip();
  vine(x, segW([-A, 1.45, 4.35], [-A, 3.3, 4.35], 10), 2.2, .7, sd++);
  for (let y = 1.75; y < 3; y += .35) vine(x, segW([-A, y, 3.95], [-A, y + .25, 4.75], 6), 1.2, .4, sd++);
  for (let y = 1.75; y < 3; y += .35) vine(x, segW([-A, y + .25, 3.95], [-A, y, 4.75], 6), 1.2, .4, sd++);
  x.restore(); vine(x, wl.map(p => P(p[0], p[1], p[2])).concat([P(...wl[0])]), 3, .9, sd++);
  const beam = wl.map(p => [A, p[1] - 1.15, p[2] - .8]);
  x.save(); polyWorld(x, beam); x.fillStyle = 'rgba(255,255,255,.34)'; x.fill(); x.clip();
  vine(x, segW([A, .3, 3.55], [A, 2.15, 3.55], 10), 2, .35, sd++);
  for (let y = .6; y < 1.9; y += .35) vine(x, segW([A, y, 3.15], [A, y + .25, 3.95], 6), 1.2, .22, sd++);
  x.restore();
  { const g = [P(...wl[0]), P(...wl[1]), P(...beam[1]), P(...beam[0])]; polyS(x, [P(...wl[wl.length - 1]), P(...wl[14]), P(...beam[14]), P(...beam[beam.length - 1])]);
    x.save(); x.clip(); for (let k = 0; k < 12; k++) { const a = R0(); sweep(x, seg2(lerp2(g[0], g[1], a), lerp2(g[3], g[2], a), 10), 30, .05, sd++, C.stickW); } x.restore(); }
  // --- the doorway: stone surround (pointed arch over a wooden frame), tympanum, jambs
  const LT = 2.42, FW = .63;
  for (const [aa, rr, al] of [[.98, .95, .35], [.88, .87, .3], [.78, .8, .25]]) {
    const ap = arch(aa, LT, rr, 18).map(p => P(p[0], p[1], D));
    const outline = [P(-aa, 0, D)].concat(ap).concat([P(aa, 0, D)]);
    polyS(x, outline); fillA(x, .18);
    vine(x, outline, 2.4, .85, sd++); vine(x, outline.map(p => [p[0] + 3, p[1] + 3]), 1.6, al, sd++, '#fff', .2);
  }
  { const tp = arch(.78, LT, .8, 18).map(p => P(p[0], p[1], D)); polyS(x, tp); fillA(x, .45);
    for (let k = 0; k < 6; k++) sweep(x, tp.map(p => [p[0], p[1] + 8 + k * 9]), 14, .2, sd++); }
  // wood frame (posts + lintel): mid grey, grain following the timber
  const post = sx => [[sx * .5, 0, D], [sx * FW, 0, D], [sx * FW, DOORH, D], [sx * .5, DOORH, D]];
  const lint = [[-FW - .03, DOORH, D], [FW + .03, DOORH, D], [FW + .03, LT, D], [-FW - .03, LT, D]];
  for (const q of [post(-1), post(1), lint]) {
    polyWorld(x, q); x.fillStyle = '#fff'; x.fill(); polyWorld(x, q); fillA(x, .42);
  }
  for (const sx of [-1, 1]) {
    for (let k = 0; k < 7; k++) { const xx = sx * lerp(.51, .62, k / 6); sweep(x, segW([xx, 0, D], [xx + (R0() - .5) * .01, DOORH, D], 14), 5, .25 + R0() * .2, sd++); }
    vine(x, segW([sx * .5, 0, D], [sx * .5, DOORH, D], 20), 2.6, .95, sd++);
    vine(x, segW([sx * FW, 0, D], [sx * FW, LT, D], 20), 2.2, .8, sd++);
    vine(x, segW([sx * (.5 + .015), .05, D], [sx * (.5 + .015), DOORH - .02, D], 20), 1.4, .3, sd++, '#fff', .25);
  }
  for (let k = 0; k < 6; k++) { const y = lerp(DOORH + .01, LT - .01, k / 5); sweep(x, segW([-FW, y, D], [FW, y, D], 16), 4, .3, sd++); }
  vine(x, segW([-FW - .03, LT, D], [FW + .03, LT, D], 20), 2.4, .9, sd++); vine(x, segW([-FW - .03, DOORH, D], [FW + .03, DOORH, D], 20), 2.4, .9, sd++);
  vine(x, segW([-FW, LT - .012, D], [FW, LT - .012, D], 20), 1.4, .35, sd++, '#fff', .2);
  // threshold stone and the opening (placeholder black; the doorway is drawn per frame)
  polyWorld(x, [[-.5, 0, D], [.5, 0, D], [.5, DOORH, D], [-.5, DOORH, D]]); x.fillStyle = '#000'; x.fill();
  vine(x, segW([-.7, 0, D - .04], [.7, 0, D - .04], 20), 2.4, .7, sd++); vine(x, segW([-.66, .0, D - .1], [.66, 0, D - .1], 20), 1.4, .22, sd++, '#fff', .3);
  // vignette smudges toward the frame edges + a few hatchings in the darkest wall areas
  for (let k = 0; k < 18; k++) { const side = k % 2 ? 1 : -1; blob(x, CX + side * (W * .5 + R0() * 60), lerp(0, H, R0()), 230, 380, .32); }
  blob(x, CX, -40, 700, 380, .5); blob(x, CX, H + 60, 760, 420, .45);
  for (let k = 0; k < 38; k++) { const xx = lerp(10, 220, R0()) * SC, yy = lerp(900, 1500, R0()) * SC; vine(x, [[xx, yy], [xx + 50, yy - 70]], 1.4, .22, sd++); }
  return c;
}
function lerp2(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k)]; }

/* foreground arch (nearest bay), drawn on its own so it can part faster than the plate as we push in */
function buildFG() {
  const c = C.sheet(1.25, null), x = c.getContext('2d'); let sd = 900;   // transparent, pre-scaled by 1.25
  const zf = 2.7, ai = 1.0, ys = 3.3, rise = 1.25, ap = arch(ai, ys, rise, 30), mid = ap.length >> 1;
  for (const sgn of [-1, 1]) {
    const half = sgn < 0 ? ap.slice(0, mid + 1) : ap.slice(mid).reverse();
    const inner = [[sgn * ai, -2], [sgn * ai, 0]].concat(half.map(p => [p[0], p[1]]));
    const scr = inner.map(p => P(p[0], p[1], zf)); scr[0] = [scr[0][0], H + 50];
    const outer = sgn < 0 ? [[CX, -400], [-400, -400], [-400, H + 50]] : [[CX, -400], [W + 400, -400], [W + 400, H + 50]];
    polyS(x, scr.concat(outer)); x.fillStyle = 'rgba(0,0,255,.97)'; x.fill();
    // soffit of the arch + the shaft's moonlit edge (lifted), velvet black otherwise
    const scr2 = inner.map(p => P(p[0] - sgn * .05, p[1] - .05, zf + .22)); scr2[0] = [scr2[0][0], H + 50];
    vine(x, scr.slice(1), 3, .5, sd++, '#fff', .12); vine(x, scr2.slice(1), 1.6, .18, sd++, '#fff', .3);
    for (let k = 0; k < 9; k++) { const o = sgn * (10 + k * 7) * SC; sweep(x, scr.slice(1).map(p => [p[0] - o, p[1]]), 8, .05, sd++, C.stickW); }
    const base = P(sgn * ai, 0, zf); vine(x, [[base[0] - sgn * 40, base[1]], [base[0] + sgn * 18, base[1] - 4]], 2.2, .35, sd++, '#fff');
  }
  return c;
}

/* door leaf texture (our side): planks, grain sweeps, strap hinges, ring pull */
function buildLeaf() {
  const tw = 400, th = 900, c = canvas(tw, th), x = c.getContext('2d'); let sd = 700; const r = rng(55);
  x.fillStyle = '#fff'; x.fillRect(0, 0, tw, th); x.fillStyle = 'rgba(0,0,255,.5)'; x.fillRect(0, 0, tw, th);
  for (let p = 0; p < 5; p++) {
    const x0 = p * 80;
    for (let k = 0; k < 9; k++) { const xx = x0 + 6 + r() * 68, pts = []; for (let y = -10; y <= th + 10; y += 30) pts.push([xx + Math.sin(y * .01 + k) * 3, y]); sweep(x, pts, 8 + r() * 10, .14 + r() * .14, sd++); }
    if (p) { vine(x, seg2([x0, 0], [x0, th], 40), 3, .9, sd++); vine(x, seg2([x0 + 3, 0], [x0 + 3, th], 40), 1.2, .25, sd++, '#fff', .3); }
    blob(x, x0 + 20 + r() * 40, 100 + r() * 700, 9, 16, .5);
  }
  for (const yy of [th - .38 * 400, th - 1.85 * 400]) {   // iron straps
    const pts = [[-4, yy - 13], [300, yy - 11], [330, yy - 24], [352, yy], [330, yy + 24], [300, yy + 11], [-4, yy + 13]];
    polyS(x, pts); x.fillStyle = 'rgba(0,0,0,.93)'; x.fill(); vine(x, pts.concat([pts[0]]), 2, .9, sd++);
    vine(x, seg2([0, yy - 11], [295, yy - 9], 20), 1.4, .45, sd++, '#fff', .25);
    for (let k = 0; k < 5; k++) { const rx = 30 + k * 62; blob(x, rx, yy, 3.5, 3.5, .55, 0, C.smudgeW); }
  }
  const hx = 330, hy = th - 1.02 * 400;                    // ring pull
  blob(x, hx, hy, 18, 18, .9); x.strokeStyle = '#000'; x.lineWidth = 6; x.globalAlpha = .9; x.beginPath(); x.arc(hx, hy + 22, 22, -.3, Math.PI + .3); x.stroke();
  x.strokeStyle = '#fff'; x.lineWidth = 1.6; x.globalAlpha = .4; x.beginPath(); x.arc(hx, hy + 22, 25, .2, 1.4); x.stroke(); x.globalAlpha = 1;
  vine(x, seg2([tw - 3, 0], [tw - 3, th], 40), 2.5, .5, sd++, '#fff', .15);   // the free edge catches the light behind
  return c;
}

/* ------------------------------------------------------------------ timeline */
function creak(x) { if (x <= 0) return 0; return clamp(.32 * eo(clamp(x / .13)) + .68 * eio(clamp((x - .08) / .85))); }
function doorAng(t) {
  const o = B.open;
  if (t >= B.close) { const k = clamp((t - B.close) / 1.2); return 96 * (1 - (k < 1 ? k * k * (1.6 - .6 * k) : 1)); }
  if (t >= B.burst) { const u = t - B.burst; if (u < .22) return lerp(44, 101, eo(u / .22)); return 96 + 5 * Math.exp(-(u - .22) * 6) * Math.cos((u - .22) * 17); }
  let a = 9 * creak(t - o[0]) + 12 * creak(t - o[1]) + 15 * creak(t - o[2]) + 8 * ss(B.claw + .5, B.burst - .15, t);
  const br = breathAmp(t); if (br) a += .45 * br * Math.sin((t - B.breath) * 2 * Math.PI / 1.9);
  return Math.max(0, a);
}
function breathAmp(t) { return t >= B.breath && t < B.burst ? ss(B.breath, B.breath + 2.4, t) : 0; }
function zoomAt(t) { return 1 + C.push(t, 0, 10.6, .08, k => Math.pow(k, 1.2)) + C.push(t, 10.6, 4.8, .13) + C.push(t, B.burst, .45, .035, eo) + .012 * ss(18, B.end, t); }
function shakeAt(t) { const tc = B.close + 1.2; return C.shake(t, C.kick(t, B.burst, .8, 15) + C.kick(t, tc, .35, 5, 1)); }
function state(t) {
  const s = { t, zm: zoomAt(t), ang: doorAng(t) };
  [s.ox, s.oy] = shakeAt(t);
  s.ph = t < B.burst ? 'N' : t < B.black ? 'B' : t < 18 ? 'K' : t < B.end ? 'R' : 'E';
  s.breath = breathAmp(t); s.bph = Math.sin((t - B.breath) * 2 * Math.PI / 1.9);
  if (s.ph === 'N') { s.night = lerp(.7, .4, ss(3.8, 9.8, t)); s.I = 1 - .17 * s.breath * (.5 + .5 * s.bph); }
  else if (s.ph === 'B') { s.night = .24; s.I = 1.2 * (1 - ss(B.burst + .3, B.burst + .6, t)); }
