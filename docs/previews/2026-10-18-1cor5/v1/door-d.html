<!doctype html>
<html lang="ko">

<title>문틈 · D 그림자극</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600&display=swap">

<body>
<script>window.FILM_FONTS = { serif: "'Gowun Batang'", sans: "'Noto Sans KR'" };</script>
<script src="lib.js"></script>
<script src="story.js"></script><script src="door-common.js"></script>
<script src="kit-puppet.js"></script>
<script>
/* 문틈 D — Shadow puppetry (house style `puppet`: kit-puppet.js, styles/puppet/STYLE.md).
   The kit owns the medium (backlit cloth, lamp, hide, carving, rods, rivets, distance blur, stage, post, type);
   this file owns the story:
   - the room is one big dark-dyed hide set piece (wall + floor) with punched patterns; the doorway is cut out of it,
     so the bare cloth there is "the light beyond the door";
   - the door leaf is a separate, hinged, perforated hide puppet on a rod; it swings inward (Puppet.swing);
   - the light wedge on the floor is the floor piece slid away along the light's rays (Puppet.floorLight);
   - the demon is a horned puppet held OFF the cloth, so it only ever reads as a soft shadow that grows bigger and
     softer as it nears the lamp (Puppet.soft, Puppet.castFloor); its hand puppet is pressed ON the cloth (crisp,
     jointed, nails: Puppet.buildHand/drawHand) to hook the door;
   - the blood is red translucent dye brushed onto the lintel and posts — the only saturated colour (Puppet.dyeStroke);
   - the lamp flickers, flares at the slam, gutters to black, relights faint, and comes back warm at the end. */
const { clamp, lerp, ss, eo, eio, noise, rng } = Pilot;
const P = Puppet, { cut, cutLine, ink, dots, coin, scroll, crescents, poly, piece, drawP, rivet, rod } = Puppet;
const W = Pilot.W, H = Pilot.H, WW = 1080, WH = 1920;          // the cloth (world units)
const B = DOOR.beat;
// door geometry (world)
const X0 = 360, X1 = 720, Y0 = 700, Y1 = 1400, DW = X1 - X0, DH = Y1 - Y0;
const VPX = 540, VPY = 860, DEPTH = 1500;                    // eye level / vanishing point, camera distance (px)
const PX = 600, PY = 1130;                                    // floor point under the lamp beyond the door: wedge rays start here
const LAMP = [585, 1010];
const HG = { x0: X0, y0: Y0, w: DW, h: DH, vpx: VPX, vpy: VPY, depth: DEPTH };   // the door leaf's hinge
const leafPt = (u, v, th) => P.hingePt(HG, u, v, th);

let WALL, FRAME, LEAF, CLAW, DEMON, DEMONB, STROKES = [];

// ---------------------------------------------------------------- set pieces & puppets
function buildWall() {
  return piece([0, 0, WW, WH], 1, g => {
    g.fillStyle = '#3e2412'; g.fillRect(0, 0, WW, Y1);
    g.fillStyle = '#35200f'; g.fillRect(0, 1180, WW, Y1 - 1180);              // wainscot, a darker dye
    g.fillStyle = '#301c0d'; g.fillRect(0, Y1, WW, WH - Y1);                  // floor
    // floor planks (ink), converging on the eye point
    g.save(); g.beginPath(); g.rect(0, Y1, WW, WH - Y1); g.clip();
    P.planks(g, { vpx: VPX, vpy: VPY, y0: Y1, k0: -14, k1: 14, col: 'rgba(18,10,5,.55)', w: 2 });
    g.restore();
    // baseboard: a carved meander band
    g.fillStyle = '#2e1a0c'; g.fillRect(0, 1366, WW, 34);
    cutLine(g, 1.6, q => { const y = 1388, s = 7; q.moveTo(0, y); for (let x = 0; x < WW; x += s * 2) { q.lineTo(x, y - s); q.lineTo(x + s * 1.4, y - s); q.lineTo(x + s * 1.4, y - s * .3); q.lineTo(x + s * .7, y - s * .3); q.lineTo(x + s * .7, y); q.lineTo(x + s * 2, y); } });
    // chair rail + a row of punched holes
    ink(g, 3, q => { q.moveTo(0, 1180); q.lineTo(WW, 1180); });
    cutLine(g, 1.6, q => { q.moveTo(0, 1188); q.lineTo(WW, 1188); });
    const rail = []; for (let x = 14; x < WW; x += 26) if (x < 280 || x > 800) rail.push([x, 1202]); dots(g, rail, 2.6);
    // wainscot panels: slit outline, a coin in the middle, crescents
    for (const [a, b] of [[24, 240], [840, 1056]]) {
      cutLine(g, 1.6, q => q.rect(a, 1222, b - a, 128));
      ink(g, 2, q => q.rect(a - 5, 1217, b - a + 10, 138));
      for (let x = a + 30; x < b - 20; x += 36) scroll(g, x, 1286, 11, (x / 36 | 0) % 2 ? 0 : Math.PI, 1, 1.4);
    }
    // two columns of punched dots framing the door, coins at their ends
    for (const x of [252, 828]) { const p = []; for (let y = 690; y < 1170; y += 22) p.push([x, y]); dots(g, p, 2.2); }
    // a faint crack of plaster lines in the upper wall (ink)
    const r = rng(77);
    for (let k = 0; k < 7; k++) { const x = 60 + r() * 960; if (x > 200 && x < 880) continue; const y = 220 + r() * 800; ink(g, 1.4, q => { q.moveTo(x, y); q.lineTo(x + (r() - .5) * 60, y + 40 + r() * 60); q.lineTo(x + (r() - .5) * 90, y + 110 + r() * 60); }, 'rgba(20,10,4,.35)'); }
    ink(g, 3, q => { q.moveTo(0, Y1); q.lineTo(WW, Y1); });
    g.clearRect(X0, Y0, DW, DH);                                                // the doorway: bare cloth
  }, 3, { cutAlpha: .5 });                                                      // thinned (half-lit) cuts on the big set piece
}
function buildFrame() {
  return piece([272, 600, 808, 1406], 1.5, g => {
    const wood = '#2b170a';
    g.fillStyle = wood;
    g.fillRect(300, 690, 60, 712); g.fillRect(720, 690, 60, 712);              // posts
    g.fillRect(292, 1360, 76, 42); g.fillRect(712, 1360, 76, 42);              // plinths
    g.beginPath(); poly(g, [[276, 614], [804, 614], [796, 630], [284, 630]]); g.fill();   // cornice
    g.fillRect(288, 628, 504, 72);                                               // lintel
    // carving: slit borders, beads, scrolls, coins
    for (const x of [300, 720]) {
      cutLine(g, 1.7, q => { q.moveTo(x + 8, 712); q.lineTo(x + 8, 1350); q.moveTo(x + 52, 712); q.lineTo(x + 52, 1350); });
      coin(g, x + 30, 1381, 9);
      const p = []; for (let y = 718; y < 1352; y += 18) p.push([x + 4.5, y]); dots(g, p, 1.6);
    }
    cutLine(g, 1.7, q => { q.moveTo(300, 638); q.lineTo(780, 638); q.moveTo(300, 692); q.lineTo(780, 692); });
    const bd = []; for (let x = 300; x <= 780; x += 16) bd.push([x, 622]); dots(g, bd, 2);
    ink(g, 2.4, q => { q.rect(300, 690, 60, 712); q.rect(720, 690, 60, 712); q.rect(288, 628, 504, 72); poly(q, [[276, 614], [804, 614], [796, 630], [284, 630]]); q.rect(292, 1360, 76, 42); q.rect(712, 1360, 76, 42); });
  }, 5);
}
function buildLeaf() {   // local: x 0 (hinge) → 360 (free edge), y 0 → 700
  return piece([0, 0, DW, DH], 1.5, g => {
    g.fillStyle = '#734420'; g.fillRect(0, 0, DW, DH);
    for (let k = 1; k < 5; k++) ink(g, 2.4, q => { q.moveTo(k * 72, 0); q.lineTo(k * 72, DH); }, '#2a1508');
    // battens + Z brace, darker dye
    g.fillStyle = '#4f2a11';
    g.fillRect(0, 92, DW, 48); g.fillRect(0, 560, DW, 48);
    g.beginPath(); poly(g, [[22, 560], [70, 560], [338, 140], [290, 140]]); g.fill();
    ink(g, 2, q => { q.rect(0, 92, DW, 48); q.rect(0, 560, DW, 48); poly(q, [[22, 560], [70, 560], [338, 140], [290, 140]]); });
    // nail studs with pinholes of light
    for (const yb of [116, 584]) for (let x = 18; x < DW; x += 36) { g.beginPath(); g.arc(x, yb, 6, 0, 7); g.fillStyle = '#22120a'; g.fill(); cut(g, q => q.arc(x, yb, 1.7, 0, 7)); }
    // ring handle + keyhole (a pinpoint of the light beyond)
    g.beginPath(); g.ellipse(318, 372, 13, 22, 0, 0, 7); g.fillStyle = '#1c0f08'; g.fill();
    ink(g, 5, q => q.arc(318, 402, 19, 0, 7), '#1c0f08');
    cut(g, q => { q.arc(318, 446, 5, 0, 7); q.moveTo(315, 448); q.lineTo(321, 448); q.lineTo(323, 462); q.lineTo(313, 462); q.closePath(); }, 'nonzero');
    ink(g, 3.2, q => q.rect(1.5, 1.5, DW - 3, DH - 3));
  }, 8);
}
// the horned figure (local: feet at 0,0, head centre at 0,−545, horn tips ±56,−700)
function demonPath(g, as = 1) {
  for (const s of [-1, 1]) {
    g.moveTo(s * 8, -576); g.bezierCurveTo(s * 40, -584, s * 66, -598, s * 74, -630); g.bezierCurveTo(s * 80, -656, s * 78, -684, s * 70, -712);
    g.bezierCurveTo(s * 64, -688, s * 60, -664, s * 52, -648); g.bezierCurveTo(s * 42, -626, s * 24, -610, s * 2, -600); g.closePath();
    // arm + three long fingers
    const A = (x, y) => [s * (76 + (x - 76) * as), y];
    poly(g, [[76, -486], [104, -470], [132, -340], [124, -214], [98, -214], [104, -340], [80, -430]].map(p => A(...p)));
    poly(g, [[126, -216], [136, -172], [132, -132], [122, -170], [116, -122], [108, -170], [98, -136], [98, -180], [96, -216]].map(p => A(...p)));
  }
  g.moveTo(33, -545); g.ellipse(0, -545, 33, 42, 0, 0, 7);
  poly(g, [[-22, -522], [0, -490], [22, -522]]);
  g.rect(-16, -512, 32, 34);
  poly(g, [[-22, -500], [-72, -490], [-98, -468], [-90, -420], [-70, -360], [-50, -300], [-56, -250], [56, -250], [50, -300], [70, -360], [90, -420], [98, -468], [72, -490], [22, -500]]);
  poly(g, [[-56, -252], [-66, -130], [-56, -6], [-26, 0], [-18, -150], [0, -206], [18, -150], [26, 0], [56, -6], [66, -130], [56, -252]]);
}
function buildDemon() {
  DEMON = P.silhouette([-200, -730, 200, 10], .5, g => { g.beginPath(); demonPath(g); g.fill('nonzero'); });
  const arms = P.silhouette([-200, -730, 200, 10], .5, g => { g.beginPath(); demonPath(g, .45); g.fill('nonzero'); });   // arms tucked: for the floor shadow
  const b = Pilot.canvas(arms.c.width, arms.c.height), bg = b.getContext('2d'); bg.filter = 'blur(2px)'; bg.drawImage(arms.c, 0, 0); DEMONB = b;
}

// ---------------------------------------------------------------- timing
const bump = x => (x > 0 && x < 1 ? Math.sin(Math.PI * x) : 0);
function leafAngle(t) {               // degrees → radians; 0 = shut
  let a = 5;
  a = lerp(a, 16, eo(clamp((t - B.open[0]) / .95)));
  a = lerp(a, 30, eo(clamp((t - B.open[1]) / .95)));
  a = lerp(a, 51, eo(clamp((t - B.open[2]) / .95)));
  if (t < B.burst) a += .5 * (noise(t * 1.7, 2.2) - .5) * ss(4, 5, t);
  if (t >= B.burst) { const k = clamp((t - B.burst) / .2); a = lerp(a, 89, k * k); const b = t - B.burst - .2; if (b > 0) a = 84 + 5 * Math.exp(-b * 7) * Math.cos(b * 30); }
  if (t >= B.close) a = lerp(a, 4.5, eio(clamp((t - B.close) / 1.2)));
  return a * Math.PI / 180;
}
function lampI(t) {
  let I, fl = P.flicker(t);
  if (t < B.burst) {
    I = ss(.1, .9, t) * (1 + .22 * P.flare(t, 1.0, .22)) * (.72 + .1 * ss(4, 5, t) + .08 * ss(6.3, 7.3, t) + .1 * ss(8.6, 9.6, t));   // lamp catches; more light with each opening
    const br = ss(B.breath, B.breath + 1.4, t);                                       // the light dips with the breathing
    I *= 1 - .09 * br * (.5 + .5 * Math.sin((t - B.breath) * 2 * Math.PI / 2.5));
  } else if (t < B.black) {
    I = (1 + .45 * P.flare(t, B.burst + .08, .1)) * P.gutter(t, B.burst + .3, B.black);   // flare, then gutter
  } else if (t < 18.2) I = 0;
  else {
    I = .14 * ss(18.2, 19.4, t) * (1 + .3 * P.flare(t, 19.0, .3))                     // relights faint, catches in steps
      + .14 * ss(20.7, 21.3, t) + .1 * ss(21.5, 22.1, t) + .1 * ss(22.2, 22.8, t) + .56 * ss(23.0, 24.6, t);
    fl = P.flicker(t, { amt: .09 - .05 * ss(23, 25, t), hz: 6, seed: 3.1, buzz: .01, buzzHz: 19 });
  }
  return Math.max(0, I * fl);
}
function camM(t) {
  let m = P.cam();
  m = P.zoom(m, P.pullBack(t, 25.3, .95, .52), 540, 1690);                                 // pull back into the dark room
  m = P.zoom(m, 1 + .06 * P.crash(t, B.burst), 560, 1000);                                 // crash zoom on the slam
  m = P.zoom(m, t < B.black ? 1 + .07 * ss(.3, B.burst, t) : 1 + .03 * ss(18, 25.2, t), 540, 640);   // slow push
  return m;
}
// the horned shadow: where is it, how big, how soft, how dense
function demonState(t) {
  const st = (xf, yf, sc, blur, den) => ({ hx: xf, hy: yf - 545 * sc, sc, blur, den });
  const breathe = 1 + .012 * Math.sin(t * 2 * Math.PI / 2.5);
  if (t < B.breath) return null;
  if (t < B.shadowIn) { const p = .5 + .5 * Math.sin((t - B.breath) * 2 * Math.PI / 2.5); return st(830, 1392, 1.3 * breathe, 34, .34 * ss(B.breath, 9, t) * (.65 + .35 * p)); }
  if (t < 11.7) { const k = eio((t - B.shadowIn) / 1.1); return st(lerp(830, 668, k), 1392, lerp(1.3, .95, k) * breathe, lerp(34, 11, k), lerp(.34, .8, k)); }
  const ap = st(668 - 10 * ss(11.7, B.burst, t), 1392 + 8 * ss(11.7, B.burst, t), (.95 + .17 * ss(11.7, B.burst, t)) * breathe, 11 + 9 * ss(11.7, B.burst, t), .8 + .1 * ss(11.7, B.burst, t));
  if (t < B.burst) return ap;
  const hold = { hx: 548, hy: 975, sc: 2.35 * breathe, blur: 20, den: .92 };
  if (t < 18) { const k = eo(clamp((t - B.burst) / .9)), k2 = ss(16.6, 18, t);
    const bu = { hx: lerp(ap.hx, 560, k), hy: lerp(ap.hy, 990, k), sc: lerp(ap.sc, 3.3, k), blur: lerp(ap.blur, 70, k), den: lerp(ap.den, .97, k) };
    return { hx: lerp(bu.hx, hold.hx, k2), hy: lerp(bu.hy, hold.hy, k2), sc: lerp(bu.sc, hold.sc, k2), blur: lerp(bu.blur, hold.blur, k2), den: lerp(bu.den, hold.den, k2) }; }
  if (t < B.recoil) return hold;
  const f = bump((t - B.recoil) / .3), k = eio(clamp((t - B.recoil - .12) / 1.0));
  if (k >= 1) return null;
  return { hx: lerp(hold.hx + 40 * f, 820, k), hy: lerp(hold.hy - 70 * f, 1020, k), sc: lerp(hold.sc * (1 + .13 * f), 1.3, k), blur: lerp(20, 44, k), den: hold.den * (1 - k) };
}
function clawCurl(t, i) {
  let c = eo(clamp((t - 12.9 - .11 * i) / .55));
  const tap = (t0) => 1 - .55 * bump((t - t0) / .4);
  if (i === 0) c *= tap(14.05) * tap(14.85); if (i === 1) c *= tap(14.45);
  return c;
}

// ---------------------------------------------------------------- drawing
function wedgePoly(th) {
  const A = leafPt(1, 1, th), Bp = [X1, Y1];
  return [A, Bp, ...P.rayPoly([PX, PY], [Bp, A], 2100)];
}
function drawClaw(g, t, th) {          // the hand puppet pressed on the cloth, hooking the door's edge
  if (t < B.claw || t > B.burst + .5) return;
  const E = leafPt(1, (1062 - Y0) / DH, th), arr = eo(clamp((t - B.claw) / .45)), tr = 1 + .8 * ss(13.6, 15.2, t), tw = P.tremor(t, 11, tr);
  const kx = E[0] + 14 + (1 - arr) * 90 + tw.x, ky = E[1] + tw.y, rot = -.04 + tw.r;
  let alpha = 1, blur = (1 - arr) * 9, sc = 1 + (1 - arr) * .3;                               // presses on: soft & big → sharp
  if (t > B.burst + .14) { const k = clamp((t - B.burst - .14) / .3); alpha = 1 - k; blur = 16 * k; sc = 1 + .4 * k; }   // lifts off
  if (alpha <= 0) return;
  g.save(); g.beginPath(); g.rect(X0, Y0, DW, DH); g.clip();
  P.lift(g, kx, ky, blur, alpha, q => {
    q.rotate(rot); q.scale(sc, sc);
    P.drawHand(q, CLAW, { curl: i => clawCurl(t, i), thumb: eo(clamp((t - 13.0) / .5)) });   // the thumb hooks under in the gap
  });
  g.globalAlpha = 1; g.restore();
  const wr = new DOMMatrix().translate(kx, ky).rotate(rot * 180 / Math.PI).scale(sc).transformPoint(new DOMPoint(84, 20));
  rod(g, wr.x, wr.y, wr.x + 300, 2100, alpha);
}

function buildT(t, M) {
  const th = leafAngle(t), D = demonState(t), g = P.beginT(M);
  drawP(g, WALL);
  // ---- the light wedge on the floor (the floor piece slid away along the lamp's rays), the horned shadow cast along it
  const wp = wedgePoly(th);
  P.floorLight(g, wp, { y0: Y1, y1: 1980, planks: { vpx: VPX, vpy: VPY, joints: {} } }, g => {
    if (!D || t >= B.black) return;
    P.castFloor(g, DEMONB, { x: D.hx, px: PX, py: PY, base: Y1, y0: Y1 - 4, len: 390 * (D.sc / .95) + (t > B.burst ? 900 * ss(B.burst, B.burst + .6, t) : 0),
      w: 400 * .66 * D.sc / .95, foot: 730 / 740, den: Math.min(1, D.den * .95), box: [-300, Y1 - 10, 1700, 720], k: .6 });
  });
  // ---- darkness floods the floor toward the camera (and withdraws to the door at the end)
  let fy = 0;
  if (t >= B.burst + .1 && t < B.recoil) fy = lerp(Y1, 2160, eio(clamp((t - B.burst - .1) / .85)));
  else if (t >= B.recoil) fy = lerp(2160, Y1 - 20, eio(clamp((t - B.recoil - .1) / 1.1)));
  if (fy > Y1) {
    g.save(); g.beginPath(); g.rect(-600, Y1 - 3, 2300, 1000); g.clip();
    const fg = g.createLinearGradient(0, fy - 150, 0, fy); fg.addColorStop(0, 'rgba(14,8,4,.96)'); fg.addColorStop(1, 'rgba(14,8,4,0)');
    g.fillStyle = 'rgba(14,8,4,.96)'; g.fillRect(-500, Y1 - 6, 2100, Math.max(0, fy - 150 - Y1 + 6));
    g.fillStyle = fg; g.fillRect(-500, fy - 150, 2100, 150);
    g.restore();
  }
  // ---- the door leaf on its hinge, and its rod
  P.swing(g, LEAF, HG, th);
  const lr = leafPt(.9, .86, th);
  rod(g, lr[0], lr[1], lr[0] + 330, 2100, .9);
  g.save(); g.globalCompositeOperation = 'multiply';
  for (const v of [.16, .84]) { const p = leafPt(0, v, th); rivet(g, p[0] + 6, p[1], 4); }
  g.restore();
  // ---- the demon puppet held off the cloth: a soft shadow (half/quarter-res, blurred)
  if (D && D.den > .003) P.soft(g, M, { blur: D.blur * D.sc / Math.max(.6, D.sc), den: D.den, quarter: D.blur * M.a > 15,
      clip: t < B.burst + .05 ? q => q.rect(X0, Y0 - 2, DW, DH + 2) : null },
    sg => { sg.translate(D.hx, D.hy); sg.scale(D.sc, D.sc); sg.drawImage(DEMON.c, -200, -730 + 545, 400, 740); });
  // ---- the door frame (fixed with pins), the claw, the red
  g.setTransform(M); g.globalCompositeOperation = 'multiply';
  drawP(g, FRAME);
  for (const [x, y] of [[296, 664], [784, 664], [330, 1381], [750, 1381]]) { g.save(); rivet(g, x, y, 3.6); g.restore(); }
  drawClaw(g, t, th);
  // the room is dark until the door lets the light in (a dark gauze over everything but the gap and the wedge)
  const open = clamp((th * 180 / Math.PI - 4) / 47), dim = lerp(lerp(.38, .9, Math.pow(open, .8)), 1, ss(B.burst, B.burst + .15, t));
  P.dimExcept(g, dim, [[leafPt(1, 0, th), [X1, Y0], [X1, Y1], leafPt(1, 1, th)], wp]);
  g.globalCompositeOperation = 'source-over';
  const [b0, b1, b2] = B.blood;
  P.drawStroke(g, STROKES[0], 300, 665, 0, eio(clamp((t - b0) / .6)));
  P.drawStroke(g, STROKES[1], 330, 1350, -Math.PI / 2, eio(clamp((t - b1) / .55)));
  P.drawStroke(g, STROKES[2], 750, 1350, -Math.PI / 2, eio(clamp((t - b2) / .55)));
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over';
}

function draw(ctx, t) {
  const M = camM(t), k = ss(23.2, 25.0, t);
  buildT(t, M);
  P.frame(ctx, t, M, { I: lampI(t), color: P.warm(k), x: LAMP[0], y: LAMP[1] }, { audience: ss(25.2, 26.6, t) });
  P.captions(ctx, t, DOOR.lines);
  P.endCard(ctx, t, DOOR.endCard, B.end);
  P.fade(ctx, t, DOOR.DUR);
}

async function init() {
  P.init({ world: [WW, WH] });
  WALL = buildWall(); FRAME = buildFrame(); LEAF = buildLeaf(); CLAW = P.buildHand(); buildDemon();
  STROKES = [P.dyeStroke(482, 40, 3), P.dyeStroke(640, 42, 7), P.dyeStroke(640, 42, 11)];
}

Pilot.run({ audio: 'soundtrack.m4a', W, H, dur: DOOR.DUR, fonts: P.FONTS, init, draw });
