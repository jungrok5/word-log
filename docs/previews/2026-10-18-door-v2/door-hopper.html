<script>
/* 문틈 2 — "열어 준 건 나였다". House style hopper (styles/hopper/STYLE.md), portrait 1080×1920, all timing from SCRIPT.
   POV: the viewer stands at a door in a dark room, MY right hand (plain dark sleeve) on the lever at frame 0. The door
   swings AWAY from me into a lamp-lit corridor. I push it a little on each beat (the light on my floor widens); long-
   nailed fingers hook the edge from the other side, tug, I flinch and let go; the door is yanked wide open from the other
   side and a horned shadow lies across the threshold toward me. Red strokes on lintel and both posts, the shadow recoils,
   the door swings shut by itself, my hand comes back to rest on the lever: the last frame is frame 0.
   The demon is never drawn: he stands behind the wall to the right of the doorway (out of sight from the camera); only his
   arm in the gap, his fingers on the edge and his lamp-cast shadow are seen.
   World in metres (x right, y up, z away). The camera is the kit's pinhole camera plus a mild downward pitch (a standing
   POV looking at its own hand), fitted so the lintel and my floor both stay in frame. */
const { clamp, lerp, ss, eo, eio, rgb, mix } = Pilot;
const W = Pilot.W, H = Pilot.H, S = window.SCRIPT, B = S.beat, DUR = S.DUR, ACC = S.accent || Hopper.ACCENT;
const D2R = Math.PI / 180, Q = Hopper.Q, NP = Hopper.PAL.night;

// ---------------- the world ----------------
const ZB = 1.3, T = 0.11;                         // room face of the door wall, wall thickness
const X0 = -0.56, X1 = 0.30, DW = X1 - X0, DH = 2.05;   // doorway (hinge on the left)
const CAS = 0.1, CASH = 0.12;                     // casing width / head
const XL = -1.6, XR = 1.7, HC = 2.8, ZN = 0.3;    // my room (side walls and ceiling are out of frame)
const ZH = ZB + 0.035;                            // the leaf's room face when shut (it sits in the frame, swings away)
const ZF = ZB + T + 1.9, HCC = 3.0;               // the hall beyond: far wall, ceiling (above the line of sight)
const LAMP = Hopper.lamp({ x: 1.05, y: 2.85, z: ZB + 1.95 }), LP = LAMP; // the hall lamp, high and off to the right (never seen)
const DL = LP.z - ZB;
const DEMON = [0.62, ZB + 1.0];                   // where the unseen one stands (behind the wall, right of the doorway)

// ---------------- POV camera: the kit camera + pitch ----------------
function povCam(o) {
  const cs = Math.cos(o.pitch * D2R), sn = Math.sin(o.pitch * D2R);
  const cam = { x: o.x, y: o.y, zn: o.zn ?? .12 };
  const dep = (y, z) => -(y - cam.y) * sn + z * cs, upv = (y, z) => (y - cam.y) * cs + z * sn;
  // fit: world point A lands on screen row A[2], B on row B[2]; X lands on column X[3]
  const [A, Bf, X] = [o.fitA, o.fitB, o.fitX], ga = upv(A[0], A[1]) / dep(A[0], A[1]), gb = upv(Bf[0], Bf[1]) / dep(Bf[0], Bf[1]);
  cam.f = (Bf[2] - A[2]) / (ga - gb); cam.py = A[2] + cam.f * ga;
  cam.px = X[3] - cam.f * (X[0] - cam.x) / dep(X[1], X[2]);
  cam.depth = (x, y, z) => dep(y, z);
  cam.P = (x, y, z) => { const d = dep(y, z); return [cam.px + cam.f * (x - cam.x) / d, cam.py - cam.f * upv(y, z) / d]; };
  cam.ppm = z => cam.f / z;
  cam.clip = function (poly) {
    const out = [], ZN = cam.zn;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length], da = dep(a[1], a[2]), db = dep(b[1], b[2]), ina = da >= ZN, inb = db >= ZN;
      if (ina) out.push(a);
      if (ina !== inb) { const k = (ZN - da) / (db - da); out.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]); }
    }
    return out;
  };
  cam.path = function (ctx, poly, fresh = true) {
    const q = cam.clip(poly); if (fresh) ctx.beginPath();
    q.forEach((p, i) => { const s = cam.P(p[0], p[1], p[2]); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); });
    if (q.length) ctx.closePath();
  };
  cam.fill = function (ctx, poly, style) { cam.path(ctx, poly); ctx.fillStyle = style; ctx.fill(); };
  return cam;
}
// eye 1.52 m, 0.16 m right of the doorway's centre line; lintel top → row 185, my floor 0.8 m ahead → bottom row,
// left casing edge → column 92
const cam = povCam({ x: 0.16, y: 1.52, pitch: 10, fitA: [DH + CASH + .03, ZB, 185], fitB: [0, .8, H], fitX: [X0 - CAS - .03, 1.0, ZB, 92] });
const P = cam.P, fill3 = cam.fill, path3 = cam.path, dpt = (p) => cam.depth(...p);
const R = Hopper.room({ xl: XL, xr: XR, h: HC, zn: ZN, zb: ZB }, cam);
const floorPoly = () => [[XL, 0, ZN], [XR, 0, ZN], [XR, 0, ZB], [X1, 0, ZB], [X1, 0, ZB + T], [X0, 0, ZB + T], [X0, 0, ZB], [XL, 0, ZB]];
const outerOpening = [[X0, 0, ZB], [X1, 0, ZB], [X1, DH, ZB], [X0, DH, ZB]];
const innerOpening = [[X0, 0, ZB + T], [X1, 0, ZB + T], [X1, DH, ZB + T], [X0, DH, ZB + T]];
const corrFloor = [[-3, 0, ZB + T], [3, 0, ZB + T], [3, 0, ZF], [-3, 0, ZF]];

// ---------------- the door leaf (swings AWAY, into the corridor) ----------------
// leafPt(th, a, b, y): a = metres from the hinge along the leaf, b = metres out of its room face (toward me)
const leafPt = (th, a, b, y) => { const c = Math.cos(th * D2R), s = Math.sin(th * D2R); return [X0 + a * c + b * s, y, ZH + a * s - b * c]; };
const leafN = th => [Math.sin(th * D2R), 0, -Math.cos(th * D2R)];          // room-face normal
// the part of the doorway (plane z = ZB) the lamp still reaches past the leaf and the right jamb
const X1T = LP.x + (X1 - LP.x) * DL / (DL - T);
const AH = Math.min(DH, LP.y + (DH - LP.y) * DL / (DL - T));
function aperture(th) {
  const e = leafPt(th, DW, 0, 0), xc = LP.x + (e[0] - LP.x) * (LP.z - ZB) / (LP.z - e[2]);
  const x0 = Math.max(xc, X0), x1 = Math.min(X1, X1T);
  return x1 > x0 ? { x0, x1, h: AH } : null;
}

// ---------------- timing (all from SCRIPT.beat) ----------------
const creak = Hopper.creak, breath = t => Hopper.breathe(t, B.breath, 1.2, 2.2);
const TUG = B.claw + .7;                          // the other side tugs while my hand still holds the lever
function press(t) {                               // my hand presses the lever down just before each push
  let p = 0; for (const b of B.push) { const u = t - (b - .38); p += ss(0, .2, u) * (1 - ss(.7, 1.05, u)); } return p;
}
function theta(t) {
  let th = .6;
  th += 8.4 * creak(t - B.push[0]) + 8 * creak(t - B.push[1]) + 8 * creak(t - B.push[2]);    // .6 → 9 → 17 → 25
  th += 3 * eo(clamp((t - TUG) / .14)) - .5 * creak(t - TUG - .14, .5);                       // the tug (felt in my hand)
  th += 4 * eio(clamp((t - (B.letGo + .5)) / 2.0));                                           // creeping open from the other side
  if (t < B.yank) th += .7 * breath(t);
  else {
    const u = t - B.yank;
    if (u < .22) th = lerp(th, 106, (u / .22) * (u / .22));
    else th = 99 + 7 * Math.exp(-(u - .22) * 4.5) * Math.cos((u - .22) * 16);
  }
  if (t >= B.close) {
    const k = eio(clamp((t - B.close) / 1.2)), u = t - (B.close + 1.2);
    th = lerp(99, .6, k) + (u > 0 ? 1.4 * Math.exp(-u * 6) * Math.abs(Math.sin(u * 17)) : 0);
  }
  return th;
}
function lampI(t) {
  let I = 1 - .16 * breath(t) - .07 * ss(B.claw, B.claw + .5, t) * (1 - ss(B.yank - .1, B.yank, t)) * Hopper.flicker(t, 8, 3, .74);
  if (t >= B.yank) {
    const u = t - B.yank;
    I = 1 + 1.25 * Math.exp(-u * 4.5) * ss(0, .05, u);
    I = lerp(I, .62, ss(B.mine - .1, B.mine + .6, t));                                        // the room goes quiet
    const fl = t - B.recoil;
    if (fl > 0) I = .62 + .2 * ss(0, .5, fl) - .3 * Hopper.flicker(t, 13, 6, .66) * (1 - ss(.2, 1.1, fl));
  }
  if (t >= B.close) I = lerp(I, 1, ss(B.close, B.close + 1.2, t));
  return Math.max(0, I);
}
const warmK = t => ss(B.recoil, B.close + 1.0, t);
function ambK(t) {
  let a = .8 - .05 * breath(t);
  a -= .3 * ss(B.yank + .05, B.yank + .8, t);                                                 // the shadow floods
  a += .14 * ss(B.blood[0], B.blood[2] + .6, t) + .16 * ss(B.close, B.close + 1.4, t);
  return Math.min(.8, a);
}
// a slow push in until the door is taken, then back to exactly frame 0 for the loop
const zoomAt = t => 1 + .035 * ss(0, B.yank, t) * (1 - ss(B.close, B.rest + .8, t)) + .012 * Math.exp(-Math.max(0, t - B.yank) * 5) * ss(B.yank, B.yank + .04, t);

// ---------------- the unseen one: horned shadow and the hand at the edge ----------------
const bez = Hopper.bez;
function silhouette(arm, VS) {                     // from 문틈 1 (front view, hunched, horns; one arm reaches out to −u)
  const s = [], sv = v => v < 1 ? v : 1 + (v - 1) * VS, A = (u, v) => [u, sv(v)];
  const go = (p1, p2, p3) => { const p0 = s[s.length - 1]; bez(s, p0, p1, p2, p3); };
  s.push(A(-.12, -.3));
  go(A(-.13, .2), A(-.15, .6), A(-.19, .88));
  const ex = lerp(-.21, -.36, arm), ey = lerp(.7, 1.08, arm), hx = lerp(-.21, -.56, arm), hy = lerp(.45, 1.14, arm);
  go(A(-.2, .95), A(ex + .02, ey - .05), A(ex, ey - .025));
  go(A((ex + hx) / 2, (ey + hy) / 2 - .025), A(hx + .04, hy - .025), A(hx, hy - .015));
  const fx = hx, fy = hy, fl = .3 + .7 * arm;
  s.push(A(fx - .08 * fl, fy - .035)); s.push(A(fx - .005, fy - .004));
  s.push(A(fx - .1 * fl, fy + .012)); s.push(A(fx, fy + .014));
  s.push(A(fx - .08 * fl, fy + .055)); s.push(A(fx + .02, fy + .028));
  go(A((ex + hx) / 2 + .01, (ey + hy) / 2 + .04), A(ex + .02, ey + .04), A(lerp(-.17, -.2, arm), lerp(1.06, 1.08, arm)));
  go(A(-.15, 1.09), A(-.085, 1.08), A(-.05, 1.1));
  go(A(-.06, 1.15), A(-.068, 1.22), A(-.055, 1.28));
  go(A(-.09, 1.31), A(-.15, 1.36), A(-.16, 1.45));
  go(A(-.165, 1.52), A(-.14, 1.59), A(-.11, 1.625));
  go(A(-.125, 1.57), A(-.13, 1.5), A(-.11, 1.44));
  go(A(-.09, 1.39), A(-.05, 1.35), A(-.025, 1.335));
  go(A(-.01, 1.345), A(.01, 1.345), A(.025, 1.335));
  go(A(.05, 1.35), A(.09, 1.39), A(.11, 1.44));
  go(A(.13, 1.5), A(.125, 1.57), A(.11, 1.625));
  go(A(.14, 1.59), A(.165, 1.52), A(.16, 1.45));
  go(A(.15, 1.36), A(.09, 1.31), A(.055, 1.28));
  go(A(.068, 1.22), A(.06, 1.15), A(.05, 1.1));
  go(A(.085, 1.08), A(.15, 1.09), A(.18, 1.03));
  go(A(.21, .86), A(.16, .5), A(.13, .1));
  s.push(A(.12, -.3));
  return s;
}
const SIL = [0, .25, .5, .75, 1].map(a => silhouette(a, .62));
const silAt = arm => SIL[Math.round(clamp(arm) * 4)];
function demon(t) {
  if (t < B.breath || t >= B.close + .3) return null;
  let dx = 0, dz = 0, k = 1, arm;
  if (t < B.yank) {
    const a = eio(clamp((t - B.breath) / 1.3)); dx = lerp(.6, 0, a); dz = lerp(.35, 0, a);
    k = 1 + .015 * Math.sin((t - B.breath) * 2.6);
    arm = eio(clamp((t - B.claw + .3) / .9));
  } else {
    const u = t - B.yank;
    arm = lerp(1, 0, eo(clamp(u / .45)));
    dx = -.22 * eo(clamp((u - .05) / .7)); dz = -.2 * eo(clamp((u - .05) / .7));               // steps up to the doorway
    k = 1 + .1 * eo(clamp((u - .05) / .7)) + .04 * ss(B.mine, B.blood[0], t) + .012 * Math.sin(t * 2.2);
    const fl = t - B.recoil;
    if (fl > 0) {
      k *= 1 - .1 * Math.min(1, fl / .08) * Math.exp(-Math.max(0, fl - .1) * 3);
      dx += .05 * Math.sin(fl * 46) * Math.exp(-fl * 7);
      const w = eio(clamp((fl - .15) / .8)); dx += 1.1 * w; dz += .6 * w; k *= 1 - .25 * w;
    }
  }
  return { dx, dz, k, arm };
}
// the shadow on the floor: the silhouette stands in a vertical plane facing the lamp, projected by the lamp
function demonShadow(fg) {
  const cx = DEMON[0] + fg.dx, cz = DEMON[1] + fg.dz, vx = cx - LP.x, vz = cz - LP.z, n = Math.hypot(vx, vz), ux = vz / n, uz = -vx / n;
  return LAMP.cast(silAt(fg.arm), { x: 0, k: fg.k, clip: [-9, 9, -.01, LP.y - .32], place: (a, b) => [cx + a * ux, b, cz + a * uz] });
}
// his hand at the door's edge (finger paths in leaf-local coordinates, a from the free edge toward the hinge, b out of
// the room face; negative b = behind the door)
const YH = 1.27;
const FING = [{ dy: .088, len: .9, d: 0, sp: .03 }, { dy: .03, len: 1.05, d: .1, sp: .008 }, { dy: -.026, len: .98, d: .18, sp: -.012 }, { dy: -.08, len: .78, d: .3, sp: -.035 }];
const FPATH = [[-.004, -.05], [-.03, -.016], [-.016, .022], [.05, .03], [.13, .024], [.2, .01]];
function fingerPts(th, yh, f, curl) {
  const out = [], sc = 1.25 * f.len;
  for (let i = 0; i < FPATH.length; i++) {
    let [a, b] = FPATH[i];
    if (i >= 3) { a *= sc; b = lerp(.03, b, .4 + .6 * curl); }
    const y = yh + f.dy + (i >= 3 ? (i - 2) * f.sp * .5 : 0) - (i >= 4 ? (i - 3) * .012 * curl : 0);
    out.push(leafPt(th, DW - a, b, y));
  }
  return out;
}
function clawState(t) {
  if (t < B.claw || t >= B.yank + .12) return null;
  let k = t - B.claw; if (t > TUG) k += .3 * eo(clamp((t - TUG) / .15));                   // the grip tightens on the tug
  return { k, off: t > B.yank ? eo((t - B.yank) / .12) : 0 };
}
const curlAt = (hs, f) => eo(clamp((hs.k - f.d) / .75)) * (1 - hs.off);

// ---------------- my hand and sleeve ----------------
const V = { add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }, lerp: (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)] };
let HS = 2.0;                                     // the hand is drawn a little large (it is the subject)
const LEV = { a: DW - .06, y: .98, b: .06, len: .23 };      // lever pivot on the leaf (room face), length
function lever(th, lam) {
  const piv = leafPt(th, LEV.a, LEV.b, LEV.y), end = leafPt(th, LEV.a - LEV.len * Math.cos(lam * D2R), LEV.b, LEV.y - LEV.len * Math.sin(lam * D2R));
  return { piv, end, dir: V.norm(V.sub(end, piv)), rose: leafPt(th, LEV.a, .004, LEV.y) };
}
// release r: 0 = gripping the lever, 1 = pulled back to the rest-away pose. curl: 1 = closed round the lever, 0 = open
function handState(t) {
  let r = 0, curl = 1, jolt = 0;
  if (t >= B.letGo) {
    const u = t - B.letGo;
    r = eo(clamp(u / .3)) + .08 * Math.sin(u * 12) * Math.exp(-u * 5) * ss(0, .1, u);       // flinch, then it drops
    curl = lerp(1, .05, ss(0, .1, u)); curl = lerp(curl, .42, ss(.35, 1.5, u));             // springs open, then goes slack
    if (t >= B.yank) { const v = t - B.yank; jolt = v < .75 ? Math.sin(v / .75 * Math.PI) : 0; curl = lerp(curl, .08, jolt); }   // reaches, too late
    if (t >= B.rest) {
      const v = t - B.rest, k = eio(clamp(v / 1.0));
      r = 1 - k; curl = lerp(lerp(.42, .1, ss(0, .4, v)), 1, ss(.75, 1.05, v));
    }
  }
  return { r: clamp(r, -.1, 1.1), curl, jolt };
}
// an orthonormal hand frame: e1 across the knuckles toward the index finger, e2 wrist → knuckles, e3 out of the back
function frame(e1, fwd) {
  let e3 = V.norm(V.cross(e1, fwd)); if (e3[1] < 0) e3 = V.mul(e3, -1);
  let e2 = V.norm(V.cross(e3, e1)); if (V.dot(e2, fwd) < 0) e2 = V.mul(e2, -1);
  return [V.norm(e1), e2, e3];
}
// let go: the hand drops down and back toward the bottom-right corner, its back to me, fingers loose and apart
const AWAY = { O: [.42, .66, ZB - .44], e2: [-.62, -.55, -.36], e3: [-.21, .8, -.55] };   // fingers droop down-left across the view
function handFrame(t, th) {
  const hs = handState(t), ro = clamp(hs.r - .5 * hs.jolt, -.1, 1.1), k = clamp(ro);
  HS = lerp(2.0, 1.55, k);                              // drawn large on the lever; true-ish size when it falls back toward me
  const lv = lever(th, 22 * press(t)), n = leafN(th), dn = Math.sin(22 * press(t) * D2R);
  // gripping: knuckles along the lever, the hand level and pointing into the door (tipping down with the lever)
  const [g1, g2, g3] = frame(lv.dir, V.norm(V.add(V.mul(n, -1), [0, .1 - .5 * dn, 0])));
  const G = V.add(lv.piv, V.mul(lv.dir, .085));
  const gO = V.add(V.add(G, V.mul(g2, -.088 * HS)), V.mul(g3, .016 * HS));
  // blend the axes (keeping a right hand: e1 = e2 × e3), and the wrist position along a slight arc
  const e2 = V.norm(V.lerp(g2, AWAY.e2, k)); let e3 = V.lerp(g3, AWAY.e3, k);
  e3 = V.norm(V.sub(e3, V.mul(e2, V.dot(e3, e2)))); const e1 = V.norm(V.cross(e2, e3));
  const O = V.add(V.lerp(gO, AWAY.O, ro), [.03 * Math.sin(k * Math.PI), .05 * Math.sin(k * Math.PI), 0]);
  return { O, e1, e2, e3, curl: hs.curl, open: k, lv, grip: 1 - k };
}
const hp = (F, p, q, r) => V.add(F.O, V.add(V.mul(F.e1, p * HS), V.add(V.mul(F.e2, q * HS), V.mul(F.e3, r * HS))));
// a tapered capsule between two 3D points (radii in metres), added to the current path
function capsule(ctx, a, b, ra, rb) {
  const A = P(...a), Bp = P(...b), RA = ra * cam.f / dpt(a), RB = rb * cam.f / dpt(b);
  const dx = Bp[0] - A[0], dy = Bp[1] - A[1], L = Math.hypot(dx, dy) || 1e-3, an = Math.atan2(dy, dx);
  const s = clamp((RA - RB) / L, -.99, .99), ph = Math.acos(s);           // tangent angle for unequal radii
  ctx.moveTo(A[0] + RA * Math.cos(an + ph), A[1] + RA * Math.sin(an + ph));
  ctx.arc(A[0], A[1], RA, an + ph, an - ph + 2 * Math.PI);
  ctx.lineTo(Bp[0] + RB * Math.cos(an - ph), Bp[1] + RB * Math.sin(an - ph));
  ctx.arc(Bp[0], Bp[1], RB, an - ph, an + ph);
  ctx.closePath();
}
function polyPath(ctx, pts) { pts.forEach((q, i) => { const s = P(...q); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }); ctx.closePath(); }
// the hand's shapes, as [path-builder, tone] (tone: 0 shade … 1 lit)
const KN = [[.036, .086], [.012, .092], [-.012, .09], [-.034, .082]];        // knuckles, index → little (p across, q forward)
const FL = [1, 1.08, 1, .82];                                                  // finger lengths
function handShapes(F) {

      const k = Math.min(1, show - i), a = sp[i], b0 = sp[i + 1], z = dpt(q[i]);
      const b = [a[0] + (b0[0] - a[0]) * k, a[1] + (b0[1] - a[1]) * k + (i === segs - 1 ? tap * cam.f / z : 0)];
      const r = lerp(.019, .012, i / segs) * cam.f / z;
      ctx.strokeStyle = '#0b0c0c'; ctx.lineWidth = r * 2; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      if (i > 1 && k === 1) { ctx.beginPath(); ctx.arc(b[0], b[1], r * 1.12, 0, Math.PI * 2); ctx.fillStyle = '#0b0c0c'; ctx.fill(); }
      if (i >= 3) { ctx.strokeStyle = `rgba(120,118,104,${.14 * Math.min(1, I) + .05 * amb})`; ctx.lineWidth = Math.max(1, r * .3);
        ctx.beginPath(); ctx.moveTo(a[0], a[1] + r * .75); ctx.lineTo(b[0], b[1] + r * .75); ctx.stroke(); }
      tip = b; dir = [b0[0] - a[0], b0[1] - a[1]];
    }
    if (tip && c > .8) {
      const nl = (c - .8) / .2, L = Math.hypot(dir[0], dir[1]), ux = dir[0] / L, uy = dir[1] / L, z = dpt(q[q.length - 1]);
      const len = .085 * cam.f / z * nl * f.len, wd = .012 * cam.f / z;
      const tx = tip[0] + ux * len + uy * len * .1, ty = tip[1] + uy * len + len * .22;
      ctx.beginPath(); ctx.moveTo(tip[0] - uy * wd, tip[1] + ux * wd);
      ctx.quadraticCurveTo(tip[0] + ux * len * .6 - uy * wd * .6, tip[1] + uy * len * .6 + ux * wd * .6, tx, ty);
      ctx.quadraticCurveTo(tip[0] + ux * len * .5 + uy * wd * .5, tip[1] + uy * len * .5 - ux * wd * .5, tip[0] + uy * wd, tip[1] - ux * wd);
      ctx.closePath(); const nv = .45 + .4 * Math.min(1, I) + .15 * amb;
      ctx.fillStyle = rgb([118 * nv, 110 * nv, 96 * nv]); ctx.fill();
    }
  }
}

// my sleeve and hand: flat value shapes, lit from the doorway side (left) by the light that comes past the door
const SKIN = [150, 118, 96], SKIN_LIT = [228, 206, 180], SLEEVE = [38, 40, 44], SLEEVE_LIT = [96, 98, 100];
function drawMine(ctx, t, th, amb, I, gapW, wk) {
  const F = handFrame(t, th);
  // how much light reaches my hand: the room's ambient, plus the doorway (thread → wedge → wide open)
  const door = Math.min(1.3, I) * (.18 + .82 * Math.min(1, gapW / .45)) * (t >= B.yank ? 1 : .9);
  const lvl = .32 + .55 * amb + .1 * door, rim = clamp(.25 + .75 * door) * (1 - .5 * ss(B.mine, B.mine + .6, t) * (1 - ss(B.blood[0], B.close, t)));
  const warm = wk;
  const col = (c, k) => rgb(c.map(v => v * k));
  const rimC = (a) => warm > .5 ? `rgba(255,210,150,${a})` : `rgba(226,230,218,${a})`;
  // the arm: wrist → elbow → shoulder (off-screen, bottom right)
  const Wr = hp(F, 0, -.01, .004), cuff = V.add(Wr, V.mul(F.e2, -.026 * HS));
  const Sh = V.add([.46, 1.2, .1], [0, 0, -.06 * (1 - F.grip)]);
  const mid = V.lerp(cuff, Sh, .5), El = V.add(mid, [.09, -.1, 0]);
  const arm = x => { capsule(x, cuff, El, .056, .064); capsule(x, El, Sh, .064, .072); };
  // where the light comes from on screen: the gap at the door's edge (right of my hand), later the open doorway (left)
  const hc = P(...hp(F, 0, .05, 0)), wide = ss(30, 70, th), src = P(...V.lerp([X1 + .02, 1.1, ZB + .05], [-.2, 1.3, ZB + .4], wide));
  let ldx = src[0] - hc[0], ldy = src[1] - hc[1]; const ll = Math.hypot(ldx, ldy) || 1; ldx /= ll; ldy /= ll;
  // sleeve: flat dark shape with a thin lit rim on the side toward the light
  ctx.save();
  ctx.beginPath(); arm(ctx); ctx.fillStyle = rgb(mix(SLEEVE.map(v => v * lvl), SLEEVE_LIT, .55 * rim)); ctx.fill();
  ctx.clip();
  ctx.translate(-ldx * (5 + 6 * rim), -ldy * (5 + 6 * rim));
  ctx.beginPath(); arm(ctx); ctx.fillStyle = col(SLEEVE, lvl); ctx.fill();
  ctx.restore(); ctx.save(); ctx.beginPath(); arm(ctx); ctx.clip();
  // two soft creases at the elbow
  const pc = P(...cuff), pe = P(...El), dx = pe[0] - pc[0], dy = pe[1] - pc[1], L = Math.hypot(dx, dy), nx = dy / L, ny = -dx / L;
  ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineCap = 'round';
  for (const [k, w] of [[.42, 12], [.58, 9]]) { const a = P(...V.lerp(cuff, El, k)), b = P(...V.add(V.lerp(cuff, El, k + .06), [0, -.03, 0]));
    ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0] - nx * 30, a[1] - ny * 30); ctx.quadraticCurveTo(b[0], b[1], a[0] + nx * 40, a[1] + ny * 40); ctx.stroke(); }
  ctx.restore();
  // cuff edge (a slightly lighter knitted band) and the wrist
  ctx.beginPath(); capsule(ctx, cuff, V.add(cuff, V.mul(F.e2, -.022 * HS)), .057, .058); ctx.fillStyle = col([52, 54, 58], lvl); ctx.fill();
  ctx.beginPath(); capsule(ctx, V.add(cuff, V.mul(F.e2, .012)), Wr, .036, .037); ctx.fillStyle = col(SKIN, lvl * lerp(.62, .82, F.open)); ctx.fill();
  // the hand: shade shapes, then the lit side
  const shapes = handShapes(F);
  for (const [build, tone] of shapes) { ctx.beginPath(); build(ctx); ctx.fillStyle = col(SKIN, lvl * (.5 + .22 * tone) * (1 + .3 * F.open)); ctx.fill(); }
  ctx.save(); ctx.beginPath(); for (const [build] of shapes) build(ctx); ctx.clip();
  const hr = .1 * HS * cam.f / dpt(hp(F, 0, .05, 0));
  const gl = ctx.createLinearGradient(hc[0] + ldx * hr, hc[1] + ldy * hr, hc[0] - ldx * hr * .6, hc[1] - ldy * hr * .6);
  const lc = SKIN_LIT.map((v, i) => warm > .5 ? [255, 214, 170][i] * .95 : v);
  gl.addColorStop(0, `rgba(${lc.join(',')},${.8 * rim})`); gl.addColorStop(.45, `rgba(${lc.join(',')},${.22 * rim})`); gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H); ctx.restore();
  // knuckle highlights and nails (tiny, only on the curled fingers' tops)
  for (const [p, q] of KN) { const k = P(...hp(F, p + .003, q - .004, .012)), r = .005 * HS * cam.f / dpt(hp(F, p, q, 0));
    ctx.beginPath(); ctx.ellipse(k[0], k[1], r * 1.4, r, 0, 0, Math.PI * 2); ctx.fillStyle = rimC(.22 * rim * (1 - .8 * F.open)); ctx.fill(); }
}

// ---------------- words ----------------
const MINE = S.lines.find(l => Math.abs(l[0] - B.mine) < .05) || null;
const LINES = S.lines.filter(l => l !== MINE);
// the end card from SCRIPT.endCard; Story.endCard lays the title out for two lines, so a long one-line title is
// broken at the space nearest its middle (Story.card gives it as one line)
const CARD = (() => {
  const c = { ...(S.endCard || {}) }, s = c.title || '';
  if (!s.includes('\n') && s.length > 12) { const m = s.length / 2; let best = -1;
    for (let i = 0; i < s.length; i++) if (s[i] === ' ' && (best < 0 || Math.abs(i - m) < Math.abs(best - m))) best = i;
    if (best > 0) c.title = s.slice(0, best) + '\n' + s.slice(best + 1); }
  return c;
})();

Pilot.run({ audio: (Pilot.cut ? 'door-hopper-' + Pilot.cut + '.m4a' : 'soundtrack.m4a'), W, H, dur: DUR, fonts: Hopper.FONTS,
  init: async () => { Hopper.init(); base = buildBase(); lit = buildLit(false); litW = buildLit(true); corr = buildCorridor(false); corrW = buildCorridor(true);
    bristles = STROKES.map(s => Hopper.brush(s.seed)); },
  draw });
</script>
