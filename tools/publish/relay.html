<!doctype html>
<meta charset="utf-8">
<title>word-log relay</title>
<!-- Opened as a popup (real click on the red "WL RELAY" button) by a page whose CSP blocks fetching 127.0.0.1 (Meta Business
     Suite, Threads). On request from its opener it reads a file from this local server (tools/publish/serve.mjs, same
     origin) and hands the bytes back with postMessage. Answers only the origins below and only this server's own paths. -->
<p id="s">relay ready</p>
<script>
const OK = new Set(['https://business.facebook.com', 'https://www.threads.com', 'https://www.threads.net']);
const PATHS = new Set(['plan.json', 'video.mp4', 'cover.jpg']);
addEventListener('message', async e => {
  if (!OK.has(e.origin) || !e.data || e.data.wl !== 'get') return;
  const s = document.getElementById('s');
  try {
    const path = String(e.data.path).replace(/^\/+/, '');
    if (!PATHS.has(path)) throw new Error('not served: ' + path);
    const r = await fetch('/' + path, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status + ' ' + path + ' ' + (await r.text()).slice(0, 300));
    const buf = await r.arrayBuffer(); s.textContent = 'sent ' + path + ' ' + (buf.byteLength / 1e6).toFixed(1) + ' MB';
    e.source.postMessage({ wl: 'file', id: e.data.id, path, buf, type: r.headers.get('content-type') }, e.origin, [buf]);
  } catch (err) { e.source.postMessage({ wl: 'err', id: e.data.id, msg: String(err) }, e.origin); }
});
if (opener) for (const o of OK) try { opener.postMessage({ wl: 'ready' }, o); } catch {}
</script>
