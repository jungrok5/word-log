name: summarize
on:
  push:
    paths: ["sermons/*/sermon.json", "sermons/*/source.json", "tools/summarize.py", ".github/workflows/summarize.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"   # retry sermons that still have no material.md (a fresh live recording can be refused for a while)
permissions:
  contents: write
concurrency: summarize-${{ github.ref }}
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp and ffmpeg (audio fallback)
        run: |
          pip install -q -U "yt-dlp[default]"
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Check the Gemini key
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: python3 -u tools/summarize.py --check
      - name: Summarise new sermons
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: python3 -u tools/summarize.py
      - name: Commit summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sermons/*/material.md
          git diff --cached --quiet || { git commit -m "Add sermon material (Gemini)"; git push; }
