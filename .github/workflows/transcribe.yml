name: transcribe
on:
  push:
    paths: ["sermons/*/sermon.json", "tools/transcribe.py", ".github/workflows/transcribe.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"   # retry sermons that still have no transcript (a fresh live recording can be refused for a while)
permissions:
  contents: write
concurrency: transcribe-${{ github.ref }}
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp and ffmpeg (audio fallback)
        run: |
          pip install -q -U "yt-dlp[default]"
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Check the Gemini key
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: python3 -u tools/transcribe.py --check
      - name: Transcribe new sermons
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: python3 -u tools/transcribe.py
      - name: Commit transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sermons/*/transcript.md
          git diff --cached --quiet || { git commit -m "Add sermon transcript"; git push; }
