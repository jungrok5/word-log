<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동굴 실루엣 · 템플릿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
</head>
<body>
<script src="lib.js"></script>
<script src="story.js"></script>
<script src="script.js"></script>
<script src="kit-cavesil.js"></script>
<script>
/* A new scene in the cave-silhouette house style (styles/cavesil/STYLE.md). The kit draws the cave, the figure and the
   light; this file draws the story. DEMO STORY (replace with your film's one image): a caped traveller walks along the
   ledge, kneels in a shaft of blue light and plants a seed; waits while the cave breathes; a sprout breaks the ground and
   rises with the one warm light; the traveller stands and looks at it. Beats come from script.js (SCRIPT.beat).
   Keep: init → K.init + K.buildCave once;  draw → camera, backdrop, world plane (ground → your things → ceiling), fore,
   dim, end plate, captions, end card. */
const S = window.SCRIPT, B = S.beat, { clamp, lerp, ss, eo, eio } = Pilot;
const K = Cavesil, C = K.C, { FY } = K.Y;
const SME = 1.04;                         // the traveller's scale (the worked example's "me")
const X0 = -120, V = 160, KX = 456;       // walk in from X0 at V px/s, kneel with the hip at KX
const SX = KX + 172, SY = FY + 2;         // where the seed goes into the ground (in reach of the kneeling near hand)

// ---------------- the traveller ----------------
const xAt = t => X0 + V * Math.min(t, 3.4) + V * .2 * eo((t - 3.4) / .6);          // walk, then ease to a stop at ~4.0
function pose(t) {
  const tp = K.t12(t);                                                                 // poses on twos, like game animation
  const x = xAt(tp), WALK = K.walkFree(x, FY, SME, 1, x / (150 * SME), 150, .1, 24);
  if (t < 4.0) return WALK;
  const STAND = K.stand(KX, FY, SME, 1, .05);
  const DOWN = K.kneel(KX, FY, SME, 1, 1.25);   // bent low over the spot
  K.reach(DOWN, 0, [KX + 112, FY - 4], 'flat');                                        // far hand steadies on the ground
  const UP = K.kneel(KX, FY, SME, 1, .28);          // kneeling upright, waiting
  if (t < 4.6) return K.mix(K.mix(WALK, STAND, eio((tp - 4.0) / .25)), DOWN, eio((tp - 4.15) / .45));
  if (t < 7.6) {                                                                       // reach the seed down, press it in, pat the soil
    const F = { ...DOWN, hands: DOWN.hands.slice(), hand: DOWN.hand.slice() };
    const press = t >= B.plant ? 1 : eio((tp - 4.6) / 1.2), pat = t >= B.plant ? Math.max(0, Math.sin((tp - B.plant) * 9)) * (1 - ss(B.plant + 1, B.plant + 1.5, tp)) : 0;
    K.reach(F, 1, [lerp(KX + 120, SX - 6, press), lerp(FY - 70, SY - 10, press) - 14 * pat], t >= B.plant ? 'flat' : 'open');
    return K.lookAt(F, [SX, SY]);
  }
  const breathe = 2.5 * Math.sin(t * 1.7);
  if (t < B.rise) {
    const F = K.mix(DOWN, UP, eio((tp - 7.6) / .6)); F.hip = [F.hip[0], F.hip[1] + breathe];
    const look = t < B.sprout ? [SX, SY] : sproutTip(t);
    return K.lookAt(F, look, .6);
  }
  const F = K.mix(UP, K.stand(KX, FY, SME, 1, .04), eio((tp - B.rise) / .7));
  return K.lookAt(F, sproutTip(t), .6);
}

// ---------------- the seed and the sprout (the one warm thing) ----------------
const SH = 300;                                                                         // the sprout's full height
const grow = t => ss(B.sprout, B.sprout + 3.6, t);
const sproutTip = t => [SX, SY - SH * eo(grow(t))];
const light = t => .25 * ss(12.2, 13.8, t) * (.75 + .25 * Math.sin(t * 3.1)) * (1 - ss(B.sprout, B.sprout + .3, t)) + ss(B.sprout, B.sprout + 1.2, t);
function seed(ctx, t, F) {
  if (t >= 4.7 && t < B.plant) {                                                       // the seed in the open near hand
    const h = F.hands[1], k = ss(4.7, 5.0, t);
    K.glow(ctx, h[0], h[1] - 6, 46, .5 * k); ctx.fillStyle = C.gold; ctx.globalAlpha = k;
    ctx.beginPath(); ctx.ellipse(h[0] + 2, h[1] - 8, 6, 8, .3, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  }
  if (t >= B.plant) {                                                                   // the little mound of soil
    ctx.fillStyle = '#06111d'; ctx.beginPath(); ctx.ellipse(SX, SY + 2, 30, 10, 0, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = 'rgba(150,205,255,.45)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(SX, SY + 2, 30, 10, 0, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  const L0 = light(t); if (L0 > 0 && t < B.sprout + .2) K.glow(ctx, SX, SY - 4, 60 + 40 * L0, .6 * L0);   // a glow under the soil before it breaks
  K.sprout(ctx, t, SX, SY, grow(t), { h: SH, glow: L0 });
}

// ---------------- camera ----------------
function cam(t) {
  let c = K.cam(xAt(Math.min(t, 4)) + 110, 1040, 1.5);                                // follow the walk in
  c = K.mixCam(c, { x: SX - 70, y: 1060, z: 1.72 }, eio((t - 4.0) / 2.0));            // settle on the spot
  c = K.mixCam(c, { x: SX - 70, y: 1090, z: 1.9 }, ss(8, 13.5, t));                 // the wait: a slow push
  c = K.mixCam(c, { x: SX - 60, y: 1020, z: 1.5 }, eio((t - B.sprout) / 2.4));      // the sprout: open up as it rises
  c = K.mixCam(c, { x: SX - 80, y: 1010, z: 1.38 }, ss(B.rise, B.end, t));           // the traveller stands: settle wide
  return K.shake(c, t, B.sprout);                                                       // the ground breaks: a small kick
}

function draw(ctx, t) {
  const cm = cam(t), lk = 1, Lw = light(t);
  K.warmAt = x => Lw * clamp(1 - Math.abs(x - SX) / 420);                              // the traveller's rim warms near the light
  K.backdrop(ctx, t, cm, lk);
  K.layer(ctx, cm, 1, () => {
    K.ground(ctx, t, cm, lk);
    const F = pose(t); F.col = C.me; F.me = true;
    K.figure(ctx, F, () => seed(ctx, t, F));                                       // seed, mound and sprout under the near arm
    K.dust(ctx, t, B.sprout, SX, SY);                                                   // the ground breaks
    K.ceiling(ctx, t, cm);
  });
  K.fore(ctx, cm);
  K.dim(ctx, lk);
  K.endPlate(ctx, t, B.end);
  K.captions(ctx, t, S.lines, B.end);
  K.endCard(ctx, t, S.endCard, B.end);
}

async function init() {
  K.init();
  K.buildCave({ x0: -1600, x1: 2600,
    shafts: [[SX - 10, 300, 300, 150], [-260, 280, 330, 140], [1500, 320, 340, 160]],   // one shaft falls exactly on the spot
    spikesOK: x => Math.abs(x - SX) > 260 && Math.abs(x - KX) > 200 });                 // keep the spot clear
}
Pilot.run({ W: Pilot.W, H: Pilot.H, dur: S.DUR, fonts: K.FONTS, init, draw });
</script>
</body>
</html>
